<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تقرير البصمة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* ══════════════════════════════════════════════════════════════
       تقرير البصمة — بادئة .rp- معزولة. نفس لوحة المنظومة، بارتقاء
       تقريريّ: هيرو الجوهر، بطاقات مرقّمة بأكسنت، أشرطة طيف لكل قوّة،
       ورادار تجميعي، وطباعة أنيقة.
       ══════════════════════════════════════════════════════════════ */
    :root{
      --rp-bg:#0f172a; --rp-bg2:#1a2332; --rp-blue:#3b82f6; --rp-green:#10b981;
      --rp-gold:#fbbf24; --rp-purple:#a78bfa; --rp-text:#e2e8f0; --rp-muted:#94a3b8;
      --rp-line:#2a3850; --rp-card:#16202e; --rp-serif:'Amiri',serif;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      background:radial-gradient(1200px 620px at 50% -12%, #1a2332 0%, #0f172a 62%);
      color:var(--rp-text); font-family:'Tajawal',sans-serif; min-height:100vh;
      -webkit-font-smoothing:antialiased; line-height:1.9;
    }
    #rapid-report-root{ max-width:760px; margin:0 auto; padding:42px 18px 90px; }

    .rp-shell{ animation:rpFade .5s ease; }
    @keyframes rpFade{ from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }

    .rp-p{ font-size:17px; line-height:2.05; color:#cbd5e1; margin:0 0 14px; }
    .rp-lead{ font-size:18.5px; color:var(--rp-text); }
    .rp-centered{ text-align:center; }
    .rp-muted{ color:var(--rp-muted); }
    .rp-spinner{ width:34px; height:34px; border:3px solid #22304a; border-top-color:var(--rp-blue);
      border-radius:50%; margin:60px auto 18px; animation:rpSpin .9s linear infinite; }
    @keyframes rpSpin{ to{ transform:rotate(360deg); } }
    .rp-loading-text{ color:var(--rp-muted); text-align:center; }

    /* أرض الكرامة */
    .rp-ground{ background:rgba(167,139,250,.06); border:1px solid rgba(167,139,250,.22);
      border-radius:16px; padding:24px 26px; margin-bottom:26px; }
    .rp-ground-title{ color:var(--rp-purple); font-size:15px; letter-spacing:.5px; margin-bottom:12px; font-family:var(--rp-serif); }

    /* الهيرو — الجوهر */
    .rp-hero{ background:linear-gradient(180deg, rgba(22,32,46,.95), rgba(15,23,42,.75));
      border:1px solid var(--rp-line); border-radius:20px; padding:40px 32px 34px;
      box-shadow:0 22px 54px rgba(0,0,0,.38); margin-bottom:26px; text-align:center; position:relative; overflow:hidden; }
    .rp-hero::before{ content:''; position:absolute; inset:0 0 auto 0; height:3px;
      background:linear-gradient(90deg, var(--rp-blue), var(--rp-green), var(--rp-gold)); }
    .rp-hero-tag{ color:var(--rp-gold); font-size:14px; letter-spacing:.6px; font-family:var(--rp-serif); margin-bottom:16px; }
    .rp-essence{ font-family:var(--rp-serif); font-size:38px; font-weight:700; line-height:1.5;
      color:#fff; margin:0 0 8px; }
    .rp-essence-sub{ color:var(--rp-muted); font-size:14.5px; margin-bottom:22px; }
    .rp-chips{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-bottom:26px; }
    .rp-chip{ border-radius:99px; padding:9px 20px; font-size:14.5px; border:1px solid; }
    .rp-chip.longing{ color:var(--rp-green); border-color:rgba(16,185,129,.4); background:rgba(16,185,129,.07); }
    .rp-chip.virtue{ color:var(--rp-gold); border-color:rgba(251,191,36,.4); background:rgba(251,191,36,.07); }
    .rp-chip b{ font-weight:700; }
    .rp-hero .rp-p{ text-align:right; }

    /* بطاقات الأقسام المرقمة */
    .rp-card{ background:linear-gradient(180deg, rgba(22,32,46,.92), rgba(15,23,42,.72));
      border:1px solid var(--rp-line); border-radius:18px; padding:30px 28px;
      box-shadow:0 18px 44px rgba(0,0,0,.32); margin-bottom:26px; position:relative; }
    .rp-step{ position:absolute; top:-14px; inset-inline-start:24px; width:34px; height:34px;
      border-radius:50%; background:#1c2a40; border:1px solid var(--rp-line); color:var(--rp-gold);
      display:flex; align-items:center; justify-content:center; font-weight:700; font-family:var(--rp-serif); }
    .rp-h{ color:var(--rp-gold); font-size:19px; font-weight:700; margin:4px 0 8px; font-family:var(--rp-serif); }
    .rp-kicker{ color:var(--rp-muted); font-size:13.5px; letter-spacing:.4px; margin-bottom:16px; }

    /* المسارات */
    .rp-axes{ display:flex; flex-direction:column; gap:14px; margin-top:6px; }
    .rp-axis-row{ border:1px solid var(--rp-line); border-radius:14px; padding:16px 18px; background:#101a28; }
    .rp-axis-row.primary{ border-color:rgba(16,185,129,.45); background:rgba(16,185,129,.05); }
    .rp-axis-row.repressed{ border-color:rgba(167,139,250,.4); background:rgba(167,139,250,.04); }
    .rp-axis-top{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
    .rp-axis-role{ font-size:13px; color:var(--rp-muted); }
    .rp-axis-row.primary .rp-axis-role{ color:var(--rp-green); }
    .rp-axis-row.repressed .rp-axis-role{ color:var(--rp-purple); }
    .rp-axis-name{ font-size:17.5px; font-weight:700; }
    .rp-axis-bar{ height:8px; background:#22304a; border-radius:99px; overflow:hidden; margin-bottom:8px; }
    .rp-axis-fill{ height:100%; background:linear-gradient(90deg,var(--rp-blue),var(--rp-green)); }
    .rp-axis-note{ color:var(--rp-muted); font-size:14px; line-height:1.9; }
    .rp-whisper{ color:var(--rp-purple); font-size:13.5px; margin-top:10px; }

    /* خريطة القوى */
    .rp-arena{ border:1px solid var(--rp-line); border-radius:16px; padding:20px; background:#0f1a29; margin-bottom:16px; }
    .rp-arena-head{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
    .rp-arena-name{ font-family:var(--rp-serif); font-size:19px; font-weight:700; color:#fff; }
    .rp-arena-sub{ color:var(--rp-muted); font-size:13.5px; }
    .rp-strength{ padding:14px 0 10px; border-top:1px dashed #223049; }
    .rp-strength:first-of-type{ border-top:none; padding-top:2px; }
    .rp-str-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
    .rp-str-name{ font-weight:700; font-size:16.5px; }
    .rp-pos{ border-radius:99px; padding:3px 12px; font-size:12.5px; border:1px solid; white-space:nowrap; }
    .rp-pos.balance{ color:var(--rp-green); border-color:rgba(16,185,129,.45); }
    .rp-pos.excess{ color:var(--rp-gold); border-color:rgba(251,191,36,.45); }
    .rp-pos.deficit{ color:var(--rp-blue); border-color:rgba(59,130,246,.5); }
    .rp-pos.both{ color:var(--rp-gold); border-color:rgba(251,191,36,.45); }
    .rp-pos.nearBalanceLean{ color:var(--rp-purple); border-color:rgba(167,139,250,.5); }

    .rp-bar{ direction:ltr; }
    .rp-track{ position:relative; display:flex; height:11px; border-radius:99px; overflow:hidden; background:#101a28; }
    .rp-zone{ flex:1; }
    .rp-z-def{ background:rgba(59,130,246,.28); } .rp-z-bal{ background:rgba(16,185,129,.28); } .rp-z-exc{ background:rgba(251,191,36,.30); }
    .rp-dot{ position:absolute; top:50%; width:15px; height:15px; border-radius:50%;
      transform:translate(-50%,-50%); box-shadow:0 0 0 3px rgba(15,23,42,.65); }
    .rp-bar-labels{ direction:ltr; display:flex; justify-content:space-between; color:var(--rp-muted); font-size:11.5px; margin-top:6px; }

    /* الرادار */
    .rp-radar-wrap{ max-width:520px; margin:8px auto 4px; }
    .rp-radar-cap{ text-align:center; color:var(--rp-muted); font-size:13px; margin-top:8px; }

    /* هدف التعافي */
    .rp-worst{ border:1px solid rgba(251,191,36,.5); background:rgba(251,191,36,.05); }
    .rp-worst .rp-h{ color:var(--rp-gold); }
    .rp-worst-chip{ display:inline-flex; gap:10px; align-items:center; border:1px solid rgba(251,191,36,.5);
      border-radius:12px; padding:10px 18px; margin-bottom:14px; font-size:16px; }
    .rp-worst-chip b{ font-family:var(--rp-serif); font-size:18px; }

    /* البروتوكول */
    .rp-marker{ display:flex; gap:14px; align-items:flex-start; border:1px solid var(--rp-line);
      border-radius:14px; padding:18px; background:#101a28; margin-bottom:14px; }
    .rp-marker-num{ flex:0 0 34px; height:34px; border-radius:50%; background:#1c2a40; color:var(--rp-gold);
      display:flex; align-items:center; justify-content:center; font-weight:700; font-family:var(--rp-serif); }
    .rp-marker-body{ flex:1; }
    .rp-marker-title{ font-weight:700; margin-bottom:6px; }
    .rp-voice{ font-family:var(--rp-serif); font-size:17.5px; line-height:2.1; color:#d7dcf0;
      background:rgba(167,139,250,.05); border:1px solid rgba(167,139,250,.28); border-radius:12px;
      padding:16px 18px; margin:10px 0; }

    .rp-actions{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin:8px 0 20px; }
    .rp-btn{ border:none; cursor:pointer; font-family:inherit; font-size:16px; font-weight:700;
      padding:13px 30px; border-radius:12px; transition:transform .15s; }
    .rp-btn.primary{ background:var(--rp-blue); color:#fff; box-shadow:0 8px 22px rgba(59,130,246,.30); }
    .rp-btn.primary:hover{ transform:translateY(-2px); }
    .rp-btn.ghost{ background:transparent; color:var(--rp-text); border:1px solid var(--rp-line); }

    @media(max-width:560px){
      .rp-hero{ padding:30px 18px 26px; } .rp-essence{ font-size:29px; }
      .rp-card{ padding:24px 16px; } .rp-arena{ padding:16px 12px; }
    }

    /* طباعة أنيقة */
    @media print{
      body{ background:#fff; color:#111; }
      #rapid-report-root{ padding:0; max-width:100%; }
      .rp-hero,.rp-card,.rp-arena,.rp-ground,.rp-axis-row,.rp-marker{
        background:#fff !important; border-color:#ccc !important; box-shadow:none !important; }
      .rp-p,.rp-axis-note,.rp-arena-sub,.rp-axis-role,.rp-kicker,.rp-loading-text{ color:#333 !important; }
      .rp-essence{ color:#111 !important; } .rp-axis-name,.rp-str-name,.rp-arena-name,.rp-marker-title{ color:#111 !important; }
      .rp-voice{ color:#222 !important; background:#faf7ff !important; }
      .rp-actions{ display:none !important; }
      .rp-hero::before{ display:none; }
    }
  </style>
</head>
<body>

  <div id="rapid-report-root">
    <div class="rp-spinner"></div>
    <div class="rp-loading-text">لحظة — بنجهّز تقريرك...</div>
  </div>

  <!-- ١) Firebase SDK 8.10.1 ثم تهيئة المشروع -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="../js/firebase-config.js"></script>

  <!-- ٢) البيانات والبنية والمخزن (لا محرّك: النتائج محسوبة ومخزّنة) -->
  <script src="rapid-questions.js"></script>
  <script src="rapid-config.js"></script>
  <script src="rapid-store.js"></script>

  <!-- ٣) رادار تجميعي (تحسين تدريجي — غيابه لا يكسر شيئًا) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

  <script>
  (function(){
    'use strict';

    /* ═══════════ محتوى التقرير — طبقة سردية للتسعة ═══════════
       ⚑ للمراجعة: الفقرات السردية أدناه محتوى جديد (فصحى مبسطة، أرض
       الكرامة، اتجاه لا تسمية) — الجوهر والشوق والفضيلة منقولة حرفيًّا
       من جداول نقاط القوة المعتمدة. لا رقم طابع ولا اسم مرآة يمرّ. */
    var CONTENT = {
      type1: {
        essence: 'العبقرية المتألقة', longing: 'الارتقاء المحكم', virtue: 'الإحسان',
        para: 'في داخلك عينٌ تلتقط ما لا يراه غيرها: الفرق بين الحسن والأحسن، وبين ما يصلح وما يستقيم. هذه العين نعمةٌ حين تخدم الإتقان، وحملٌ حين تنقلب رقيبًا لا يرضى. تقريرك هذا مرآةٌ لطاقتك كما تعمل اليوم — أين تصبّ، وأيّ قواك في موضعها، وأيّها مال عن حدّه.'
      },
      type2: {
        essence: 'الحب المنصهر', longing: 'الوصل المُغذّي', virtue: 'الرحمة',
        para: 'قلبك يعرف طريقه إلى احتياجات الناس قبل أن ينطقوا بها، ويجد نفسه في الوصل والعطاء وجودًا لا يجده في غيرهما. هذه الهبة تُحيي مَن حولك حين تتوازن، وتستنزفك حين تنسى صاحبها. تقريرك مرآةٌ لهذا القلب: أين يعطي من فيض، وأين يعطي من جرح.'
      },
      type3: {
        essence: 'الإنسان الحقيقي', longing: 'الرفعة المؤثّرة', virtue: 'الإخلاص',
        para: 'فيك طاقةُ إنجازٍ تعرف كيف تحوّل الهدف إلى واقعٍ يلمع، وحضورٌ يعرف كيف يترك أثرًا. والسؤال الذي يرافق هذه الهبة دائمًا: مَن الذي يُنجز — أنت، أم الصورة؟ تقريرك مرآةٌ لطاقتك بين الأصالة والبريق: أين تعمل قواك من عمقك، وأين انجرفت وراء العرض.'
      },
      type4: {
        essence: 'الهوية الحقيقية', longing: 'التجلّي الأصيل', virtue: 'العِفَّة',
        para: 'في داخلك بوصلةٌ لا تهدأ تبحث عن الصوت الذي هو أنت — لا نسخة من أحد، ولا صدى لأحد. تلتقط من المعاني أعمقها ومن المشاعر أصدقها، وتدفع أحيانًا ثمن هذا العمق وحدةً أو موجًا عاليًا. تقريرك مرآةٌ لهذه البوصلة: أين يخدمك عمقك، وأين ينقلب عليك.'
      },
      type5: {
        essence: 'العقل الفيّاض', longing: 'الكشف الحكيم', virtue: 'الحكمة',
        para: 'عقلك بيتك الأوّل: فيه تفهم العالم قبل أن تدخله، وتبني خرائط تُغنيك حين يضجّ الخارج. هذه العزلة الخصبة نبعُ فهمٍ حين تتوازن، وقلعةٌ تعزلك عن الحياة حين تنغلق. تقريرك مرآةٌ لاقتصادك الداخلي: أين يفيض عقلك على الدنيا، وأين ينسحب منها.'
      },
      type6: {
        essence: 'الإرادة الحقيقية المتجسّدة', longing: 'البصيرة الفاعلة', virtue: 'التوكّل',
        para: 'فيك حارسٌ أمين يرى المخاطر قبل وقوعها، ووفاءٌ يجعل مَن حولك ينامون مطمئنّين لأنك ساهر. هذه اليقظة درعُ الجماعة حين تتوازن، وسجنُ صاحبها حين ينقلب الحذر قلقًا لا ينام. تقريرك مرآةٌ ليقظتك: أين تحرس، وأين صار الحارس محروسًا بخوفه.'
      },
      type7: {
        essence: 'الحرية الداخلية', longing: 'الازدهار المتدفق', virtue: 'الشُّكر',
        para: 'فيك نبعُ حياةٍ يرى في كلّ صباحٍ بابًا وفي كلّ فكرةٍ احتمالًا، وطاقةٌ تعرف كيف تذوق الدنيا وتُذيقها لمن حولك. هذا التدفّق ازدهارٌ حين يتوازن، وهروبٌ أنيقٌ حين ينفلت. تقريرك مرآةٌ لنبعك: أين يسقي حياةً حقيقية، وأين يتبدّد في اللهاث وراء التالي.'
      },
      type8: {
        essence: 'القوة الحقيقية', longing: 'التمكين الحيوي', virtue: 'الشجاعة',
        para: 'فيك قوّةٌ خُلقت لتحمل وتحمي: ظهرٌ يُستنَد إليه، وحضورٌ يملأ المكان، وذراعٌ تنهض للمظلوم قبل أن يطلب. هذه القوّة تمكينٌ للحياة حين تتوازن، ودرعٌ يعزل صاحبه حين يُغلق حتى على أقرب الناس. تقريرك مرآةٌ لقوّتك: أين تحمي، وأين صار الدرع سجنًا.'
      },
      type9: {
        essence: 'السلام الداخلي', longing: 'التناغم المُحيي', virtue: 'الحِلم',
        para: 'فيك سَكينةٌ تُهدّئ الغرف التي تدخلها، وسَعةٌ تجمع المتفرّقين وتجد لكلّ أحدٍ مقعدًا. هذا السلام يُحيي مَن حولك حين يكون يقظًا، ويُخدّر صاحبه حين ينقلب غيابًا مهذّبًا عن مقعده هو. تقريرك مرآةٌ لسلامك: أين يُحيي، وأين يُخدِّر — وأين أنت من الصورة.'
      }
    };

    /* تسميات المسارات للعميل (نفس مفردات مقياس المحاور) */
    var AXIS_LABEL = { tamasuk: 'الحفظ والاستقرار', hayawiyya: 'الحيوية والتجدّد', intima: 'الانتماء والمشاركة' };
    var ROLE = {
      primary:   { label: 'مسارك الرئيسي',  note: 'هنا تصبّ طاقتك أوّلًا — تلقائيًّا وبلا قرار.' },
      secondary: { label: 'مسارك الداعم',   note: 'يعمل في الظلّ ويسند الرئيسي حين يحتاج.' },
      repressed: { label: 'مسارك المدفون',  note: 'الأقلّ تغذيةً اليوم — ومنه غالبًا يأتي الحنين أو النقد الداخلي.' }
    };
    var POS_LABEL = {
      balance: 'اتزان', excess: 'إفراط', deficit: 'تفريط',
      both: 'تذبذب بين الطرفين', nearBalanceLean: 'قريبة من الاتزان بميل'
    };

    function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function arabicNum(n){ var m=['٠','١','٢','٣','٤','٥','٦','٧','٨','٩']; return String(n).replace(/\d/g,function(d){return m[+d];}); }
    function root(){ return document.getElementById('rapid-report-root'); }

    /* شريط طيف قوّة واحدة */
    function strengthBar(s){
      var marker = '';
      if(s.position === 'both'){
        marker = '<span class="rp-dot" style="inset-inline-start:17%; background:#3b82f6"></span>'
               + '<span class="rp-dot" style="inset-inline-start:83%; background:#fbbf24"></span>';
      } else {
        var pct = 50, col = '#10b981';
        if(s.position === 'deficit'){ pct = 17; col = '#3b82f6'; }
        else if(s.position === 'excess'){ pct = 83; col = '#fbbf24'; }
        else if(s.position === 'nearBalanceLean'){ pct = (s.leanDir === 'excess') ? 62 : 38; col = '#a78bfa'; }
        marker = '<span class="rp-dot" style="inset-inline-start:' + pct + '%; background:' + col + '"></span>';
      }
      return '<div class="rp-bar">'
           +   '<div class="rp-track"><span class="rp-zone rp-z-def"></span><span class="rp-zone rp-z-bal"></span><span class="rp-zone rp-z-exc"></span>' + marker + '</div>'
           +   '<div class="rp-bar-labels"><span>تفريط</span><span>اتزان</span><span>إفراط</span></div>'
           + '</div>';
    }

    /* قراءة اتجاهية (اتجاه لا تسمية) لقوة منزلقة */
    function directionalReading(s, names){
      var n = names || {};
      if(s.position === 'excess')  return 'القوّة تعمل فوق حدّها — والاتجاه الذي مالت إليه: ' + esc(n.excessName || 'الإفراط') + '.';
      if(s.position === 'deficit') return 'القوّة خفتت عن حدّها — والاتجاه الذي مالت إليه: ' + esc(n.deficitName || 'التفريط') + '.';
      if(s.position === 'both')    return 'تتأرجح بين ' + esc(n.excessName || 'الإفراط') + ' و' + esc(n.deficitName || 'التفريط') + ' — والتذبذب أشدّ إنهاكًا من الوقوف في طرفٍ واحد.';
      if(s.position === 'nearBalanceLean') return 'قريبةٌ من اتزانها، بميلٍ خفيفٍ نحو ' + (s.leanDir === 'excess' ? esc(n.excessName || 'الإفراط') : esc(n.deficitName || 'التفريط')) + ' — تستحقّ عين المراقبة لا القلق.';
      return 'قائمةٌ في اتزانها — تعمل من موضعها الصحيح.';
    }

    /* فهرس أسماء القوى وانزلاقاتها من البنية (المصدر الموحّد) */
    function strengthNamesIndex(typeNum){
      var map = window.RAPID_CONFIG.getStrengthMap(typeNum);
      var idx = {};
      if(map) map.axes.forEach(function(a){
        a.strengths.forEach(function(s){ idx[s.id] = { name: s.name, excessName: s.excessName, deficitName: s.deficitName, axisKey: a.key, axisName: a.axisName }; });
      });
      return idx;
    }

    /* ═══════════ البناء ═══════════ */
    function render(results){
      var typeKey = results.type;
      var typeNum = results.typeNum;
      var c = CONTENT[typeKey] || {};
      var names = strengthNamesIndex(typeNum);
      var Q = window.RAPID_QUESTIONS;
      var h = '';

      /* أرض الكرامة — الافتتاح */
      h += '<div class="rp-ground rp-shell">'
         +   '<div class="rp-ground-title">قبل أن تقرأ</div>'
         +   '<p class="rp-p">هذا التقرير مرآةٌ لا محكمة. لا سطرَ فيه يقول إنّك ناقص — كلّ سطرٍ يقول أين تقف طاقتك اليوم. والانزلاق الذي ستقرؤه ليس عيبًا فيك، بل قوّةٌ أصيلةٌ مالت عن موضعها تحت حملٍ حملتَه — وما مال يعود.</p>'
         + '</div>';

      /* ١ — الهيرو: الجوهر */
      h += '<div class="rp-hero rp-shell">'
         +   '<div class="rp-hero-tag">بصمتك</div>'
         +   '<h1 class="rp-essence">' + esc(c.essence || '') + '</h1>'
         +   '<div class="rp-essence-sub">الجوهر الذي تتحرّك منه طاقتك</div>'
         +   '<div class="rp-chips">'
         +     '<span class="rp-chip longing">الشوق: <b>' + esc(c.longing || '') + '</b></span>'
         +     '<span class="rp-chip virtue">الفضيلة: <b>' + esc(c.virtue || '') + '</b></span>'
         +   '</div>'
         +   '<p class="rp-p rp-lead">' + esc(c.para || '') + '</p>'
         + '</div>';

      /* ٢ — المسارات الثلاثة */
      var rk = results.axesRanking || {};
      var ranking = rk.ranking || [];
      var maxAction = Math.max.apply(null, ranking.map(function(r){ return r.action || 1; }).concat([1]));
      var roles = [
        { key: rk.primaryAxis,   cls: 'primary',   role: ROLE.primary },
        { key: rk.secondaryAxis, cls: '',          role: ROLE.secondary },
        { key: rk.repressedAxis, cls: 'repressed', role: ROLE.repressed }
      ];
      h += '<div class="rp-card rp-shell"><span class="rp-step">' + arabicNum(1) + '</span>'
         +   '<div class="rp-h">مساراتك الثلاثة</div>'
         +   '<div class="rp-kicker">أين تصبّ طاقتك فعلًا — بترتيب ما تفعله لا ما تتمنّاه</div>'
         +   '<div class="rp-axes">';
      roles.forEach(function(r){
        var row = null;
        ranking.forEach(function(x){ if(x.axisId === r.key) row = x; });
        var pct = row ? Math.round((row.action / maxAction) * 100) : 0;
        h += '<div class="rp-axis-row ' + r.cls + '">'
           +   '<div class="rp-axis-top"><span class="rp-axis-name">' + esc(AXIS_LABEL[r.key] || '') + '</span>'
           +   '<span class="rp-axis-role">' + esc(r.role.label) + '</span></div>'
           +   '<div class="rp-axis-bar"><div class="rp-axis-fill" style="width:' + pct + '%"></div></div>'
           +   '<div class="rp-axis-note">' + esc(r.role.note) + '</div>'
           + '</div>';
      });
      h += '</div>';
      if(rk.repressedConfirmed){
        h += '<div class="rp-whisper">مسارك المدفون مؤكَّدٌ من بابين: قلّة الفعل، وارتفاع الحنين أو النقد الداخلي نحوه — إشارةٌ تستحقّ الإصغاء.</div>';
      }
      h += '</div>';

      /* ٣ — خريطة القوى التسع */
      h += '<div class="rp-card rp-shell"><span class="rp-step">' + arabicNum(2) + '</span>'
         +   '<div class="rp-h">خريطة قواك التسع</div>'
         +   '<div class="rp-kicker">ثلاث ساحات، في كلّ ساحةٍ ثلاث قوى — وموضع كلّ قوّةٍ على طيفها اليوم</div>';

      ['tamasuk','hayawiyya','intima'].forEach(function(ax){
        var t = Q.spectrum[typeKey];
        var axisName = t && t[ax] ? t[ax].axisName : '';
        var list = (results.strengths || []).filter(function(s){ return s.axisKey === ax; });
        if(!list.length) return;
        h += '<div class="rp-arena">'
           +   '<div class="rp-arena-head"><span class="rp-arena-name">' + esc(axisName) + '</span>'
           +   '<span class="rp-arena-sub">في ساحة ' + esc(AXIS_LABEL[ax] || '') + '</span></div>';
        list.forEach(function(s){
          h += '<div class="rp-strength">'
             +   '<div class="rp-str-top"><span class="rp-str-name">' + esc(s.name) + '</span>'
             +   '<span class="rp-pos ' + esc(s.position) + '">' + esc(POS_LABEL[s.position] || s.positionLabel || '') + '</span></div>'
             +   strengthBar(s)
             + '</div>';
        });
        h += '</div>';
      });

      /* الرادار التجميعي (تحسين تدريجي) */
      h += '<div class="rp-radar-wrap"><canvas id="rpRadar" height="420"></canvas></div>'
         + '<div class="rp-radar-cap" id="rpRadarCap" style="display:none">قوّة حضور الاتزان في قواك التسع — كلّما اتّسعت المساحة، اتّسع الاتزان</div>'
         + '</div>';

      /* ٤ — هدف التعافي الأوّل */
      var worst = results.worstStrength;
      if(worst){
        var wNames = names[worst.id] || {};
        var wFull = null;
        (results.strengths || []).forEach(function(s){ if(s.id === worst.id) wFull = s; });
        h += '<div class="rp-card rp-worst rp-shell"><span class="rp-step">' + arabicNum(3) + '</span>'
           +   '<div class="rp-h">هدف تعافيك الأوّل</div>'
           +   '<div class="rp-kicker">أشدّ قوّةٍ نازفةٍ اليوم — منها يبدأ الطريق، لا من تسع جبهات</div>'
           +   '<div class="rp-worst-chip"><b>' + esc(worst.name) + '</b><span class="rp-muted">في ' + esc(wNames.axisName || '') + '</span></div>'
           +   '<p class="rp-p">' + (wFull ? directionalReading(wFull, wNames) : '') + '</p>'
           +   '<p class="rp-p">لا يُطلب منك اليوم إصلاحها — يُطلب منك أن تراها وهي تعمل. الرؤية وحدها تُرخي أوّل عقدة.</p>'
           + '</div>';
      }

      /* ٥ — بروتوكول التحقّق الذاتي */
      var voice = Q.recognitionVoices ? Q.recognitionVoices[typeKey] : null;
      var wFull2 = null;
      if(worst) (results.strengths || []).forEach(function(s){ if(s.id === worst.id) wFull2 = s; });
      h += '<div class="rp-card rp-shell"><span class="rp-step">' + arabicNum(4) + '</span>'
         +   '<div class="rp-h">بروتوكول التحقّق — أسبوعُ رصد</div>'
         +   '<div class="rp-kicker">التقرير يقول، وأيّامك تشهد. راقب ثلاث علاماتٍ لمدّة أسبوع — رصدٌ فقط، بلا أيّ تعديل سلوك</div>'
         +   '<div class="rp-marker"><span class="rp-marker-num">' + arabicNum(1) + '</span><div class="rp-marker-body">'
         +     '<div class="rp-marker-title">أوّل فراغٍ حقيقيّ</div>'
         +     '<p class="rp-p">حين تأتيك أوّل مساحةٍ فارغةٍ بلا التزامات — راقب إلى أين تتحرّك طاقتك تلقائيًّا قبل أيّ قرار. التقرير يتوقّع أن تتحرّك نحو <b>' + esc(AXIS_LABEL[rk.primaryAxis] || '') + '</b>. هل صدق؟</p>'
         +   '</div></div>'
         +   '<div class="rp-marker"><span class="rp-marker-num">' + arabicNum(2) + '</span><div class="rp-marker-body">'
         +     '<div class="rp-marker-title">الانزلاق الأوّل تحت الضغط</div>'
         +     '<p class="rp-p">في أوّل يومٍ ثقيلٍ هذا الأسبوع — راقب أين يذهب أوّل انزلاقٍ لك. '
         +     (worst && wFull2 ? ('التقرير يتوقّع أن يمرّ من باب <b>' + esc(worst.name) + '</b>: ' + directionalReading(wFull2, names[worst.id] || {})) : 'راقبه بلا توقّعٍ مسبق.')
         +     ' هل مرّ من هناك؟</p>'
         +   '</div></div>'
         +   '<div class="rp-marker"><span class="rp-marker-num">' + arabicNum(3) + '</span><div class="rp-marker-body">'
         +     '<div class="rp-marker-title">صوتك في الأسبوع الصعب</div>'
         +     '<p class="rp-p">اقرأ هذا الصوت الداخليّ بهدوء — لإنسانٍ محترمٍ في أسبوعه الأصعب:</p>'
         +     (voice ? '<div class="rp-voice">' + esc(voice) + '</div>' : '')
         +     '<p class="rp-p">في أوّل أسبوعٍ ثقيل: هل يشبه الصوتَ الذي يتكلّم في داخلك؟ لا يُطلب تطابقٌ كامل — يُطلب أن تعرف نبرة بيتك.</p>'
         +   '</div></div>'
         +   '<p class="rp-p rp-muted">إن صدقت العلامات الثلاث فقد صافحتَ بصمتك. وإن خالفتك واحدةٌ فأكثر — فهذه معلومةٌ ثمينة تُحملُ إلى مدرّبك أو إلى المقياس الكامل، لا حكمٌ عليك ولا على التقرير.</p>'
         + '</div>';

      /* أرض الكرامة — الخاتمة */
      h += '<div class="rp-ground rp-shell">'
         +   '<div class="rp-ground-title">بعد أن قرأت</div>'
         +   '<p class="rp-p">ما قرأتَه خريطة، والخريطة ليست الأرض — أنت أوسع من كلّ سطرٍ فيها. خذ منها ما أضاء، ودع ما لم يُشبهك على الرفّ، وعُد إليها بعد أسبوع الرصد بعينٍ أصدق.</p>'
         + '</div>';

      h += '<div class="rp-actions">'
         +   '<button class="rp-btn ghost" id="rpPrint">احفظ نسخةً (طباعة)</button>'
         +   '<button class="rp-btn primary" id="rpDone">تمّ</button>'
         + '</div>';

      root().innerHTML = h;

      var pb = document.getElementById('rpPrint');
      if(pb) pb.addEventListener('click', function(){ try{ window.print(); }catch(e){} });
      var db = document.getElementById('rpDone');
      if(db) db.addEventListener('click', function(){ window.location.href = 'course-view.html'; });

      drawRadar(results);
    }

    /* الرادار: حضور الاتزان في القوى التسع */
    function drawRadar(results){
      try{
        if(typeof Chart === 'undefined') return;
        var el = document.getElementById('rpRadar');
        if(!el) return;
        var labels = (results.strengths || []).map(function(s){ return s.name; });
        var data = (results.strengths || []).map(function(s){ return s.balance; });
        new Chart(el.getContext('2d'), {
          type: 'radar',
          data: { labels: labels, datasets: [{
            label: 'الاتزان',
            data: data,
            backgroundColor: 'rgba(16,185,129,.18)',
            borderColor: 'rgba(16,185,129,.9)',
            pointBackgroundColor: '#10b981',
            borderWidth: 2
          }]},
          options: {
            responsive: true,
            scales: { r: {
              min: 0, max: 7,
              ticks: { display: false },
              grid: { color: 'rgba(42,56,80,.8)' },
              angleLines: { color: 'rgba(42,56,80,.8)' },
              pointLabels: { color: '#cbd5e1', font: { family: 'Tajawal', size: 12 } }
            }},
            plugins: { legend: { display: false } }
          }
        });
        var cap = document.getElementById('rpRadarCap');
        if(cap) cap.style.display = '';
      } catch(e){ /* الرادار تحسين لا شرط */ }
    }

    function emptyState(){
      root().innerHTML =
        '<div class="rp-card rp-shell rp-centered">'
        + '<div class="rp-h">لا بصمة محفوظة بعد</div>'
        + '<p class="rp-p">تقريرك يُبنى من مقياسك — ومقياسك لم يكتمل بعد.</p>'
        + '<div class="rp-actions"><button class="rp-btn primary" id="rpGo">ابدأ المقياس</button></div>'
        + '</div>';
      var b = document.getElementById('rpGo');
      if(b) b.addEventListener('click', function(){ window.location.href = 'course-view.html'; });
    }

    function boot(){
      var STORE = window.RAPID_STORE;
      if(!STORE || !window.RAPID_QUESTIONS || !window.RAPID_CONFIG){
        root().innerHTML = '<div class="rp-loading-text">ملفّات التقرير لم تكتمل — راجع ترتيب التحميل.</div>';
        return;
      }
      var user = STORE.requireAuth({ loginPath: '../login.html' });
      if(!user) return;
      STORE.loadAssessment(user.id).then(function(doc){
        if(doc && doc.results && doc.results.type){ render(doc.results); }
        else { emptyState(); }
      }).catch(emptyState);
    }

    if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
  })();
  </script>
</body>
</html>
