<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تقرير البصمة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* ══════════════════════════════════════════════════════════════
       تقرير البصمة — بادئة .rp- معزولة. نفس لوحة المنظومة، بارتقاء
       تقريريّ: هيرو الجوهر، بطاقات مرقّمة بأكسنت، أشرطة طيف لكل قوّة،
       ورادار تجميعي، وطباعة أنيقة.
       ══════════════════════════════════════════════════════════════ */
    :root{
      --rp-bg:#0f172a; --rp-bg2:#1a2332; --rp-blue:#3b82f6; --rp-green:#10b981;
      --rp-gold:#fbbf24; --rp-purple:#a78bfa; --rp-text:#e2e8f0; --rp-muted:#94a3b8;
      --rp-line:#2a3850; --rp-card:#16202e; --rp-serif:'Amiri',serif;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      background:radial-gradient(1200px 620px at 50% -12%, #1a2332 0%, #0f172a 62%);
      color:var(--rp-text); font-family:'Tajawal',sans-serif; min-height:100vh;
      -webkit-font-smoothing:antialiased; line-height:1.9;
    }
    #rapid-report-root{ max-width:760px; margin:0 auto; padding:42px 18px 90px; }

    .rp-shell{ animation:rpFade .5s ease; }
    @keyframes rpFade{ from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }

    .rp-p{ font-size:17px; line-height:2.05; color:#cbd5e1; margin:0 0 14px; }
    .rp-lead{ font-size:18.5px; color:var(--rp-text); }
    .rp-centered{ text-align:center; }
    .rp-muted{ color:var(--rp-muted); }
    .rp-spinner{ width:34px; height:34px; border:3px solid #22304a; border-top-color:var(--rp-blue);
      border-radius:50%; margin:60px auto 18px; animation:rpSpin .9s linear infinite; }
    @keyframes rpSpin{ to{ transform:rotate(360deg); } }
    .rp-loading-text{ color:var(--rp-muted); text-align:center; }

    /* أرض الكرامة */
    .rp-ground{ background:rgba(167,139,250,.06); border:1px solid rgba(167,139,250,.22);
      border-radius:16px; padding:24px 26px; margin-bottom:26px; }
    .rp-ground-title{ color:var(--rp-purple); font-size:15px; letter-spacing:.5px; margin-bottom:12px; font-family:var(--rp-serif); }

    /* الهيرو — الجوهر */
    .rp-hero{ background:linear-gradient(180deg, rgba(22,32,46,.95), rgba(15,23,42,.75));
      border:1px solid var(--rp-line); border-radius:20px; padding:40px 32px 34px;
      box-shadow:0 22px 54px rgba(0,0,0,.38); margin-bottom:26px; text-align:center; position:relative; overflow:hidden; }
    .rp-hero::before{ content:''; position:absolute; inset:0 0 auto 0; height:3px;
      background:linear-gradient(90deg, var(--rp-blue), var(--rp-green), var(--rp-gold)); }
    .rp-hero-tag{ color:var(--rp-gold); font-size:14px; letter-spacing:.6px; font-family:var(--rp-serif); margin-bottom:16px; }
    .rp-essence{ font-family:var(--rp-serif); font-size:38px; font-weight:700; line-height:1.5;
      color:#fff; margin:0 0 8px; }
    .rp-essence-sub{ color:var(--rp-muted); font-size:14.5px; margin-bottom:22px; }
    .rp-chips{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-bottom:26px; }
    .rp-chip{ border-radius:99px; padding:9px 20px; font-size:14.5px; border:1px solid; }
    .rp-chip.longing{ color:var(--rp-green); border-color:rgba(16,185,129,.4); background:rgba(16,185,129,.07); }
    .rp-chip.virtue{ color:var(--rp-gold); border-color:rgba(251,191,36,.4); background:rgba(251,191,36,.07); }
    .rp-chip b{ font-weight:700; }
    .rp-hero .rp-p{ text-align:right; }

    /* بطاقات الأقسام المرقمة */
    .rp-card{ background:linear-gradient(180deg, rgba(22,32,46,.92), rgba(15,23,42,.72));
      border:1px solid var(--rp-line); border-radius:18px; padding:30px 28px;
      box-shadow:0 18px 44px rgba(0,0,0,.32); margin-bottom:26px; position:relative; }
    .rp-step{ position:absolute; top:-14px; inset-inline-start:24px; width:34px; height:34px;
      border-radius:50%; background:#1c2a40; border:1px solid var(--rp-line); color:var(--rp-gold);
      display:flex; align-items:center; justify-content:center; font-weight:700; font-family:var(--rp-serif); }
    .rp-h{ color:var(--rp-gold); font-size:19px; font-weight:700; margin:4px 0 8px; font-family:var(--rp-serif); }
    .rp-kicker{ color:var(--rp-muted); font-size:13.5px; letter-spacing:.4px; margin-bottom:16px; }

    /* المسارات */
    .rp-axes{ display:flex; flex-direction:column; gap:14px; margin-top:6px; }
    .rp-axis-row{ border:1px solid var(--rp-line); border-radius:14px; padding:16px 18px; background:#101a28; }
    .rp-axis-row.primary{ border-color:rgba(16,185,129,.45); background:rgba(16,185,129,.05); }
    .rp-axis-row.repressed{ border-color:rgba(167,139,250,.4); background:rgba(167,139,250,.04); }
    .rp-axis-top{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
    .rp-axis-role{ font-size:13px; color:var(--rp-muted); }
    .rp-axis-row.primary .rp-axis-role{ color:var(--rp-green); }
    .rp-axis-row.repressed .rp-axis-role{ color:var(--rp-purple); }
    .rp-axis-name{ font-size:17.5px; font-weight:700; }
    .rp-axis-bar{ height:8px; background:#22304a; border-radius:99px; overflow:hidden; margin-bottom:8px; }
    .rp-axis-fill{ height:100%; background:linear-gradient(90deg,var(--rp-blue),var(--rp-green)); }
    .rp-axis-note{ color:var(--rp-muted); font-size:14px; line-height:1.9; }
    .rp-whisper{ color:var(--rp-purple); font-size:13.5px; margin-top:10px; }

    /* خريطة القوى */
    .rp-arena{ border:1px solid var(--rp-line); border-radius:16px; padding:20px; background:#0f1a29; margin-bottom:16px; }
    .rp-arena-head{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
    .rp-arena-name{ font-family:var(--rp-serif); font-size:19px; font-weight:700; color:#fff; }
    .rp-arena-sub{ color:var(--rp-muted); font-size:13.5px; }
    .rp-strength{ padding:14px 0 10px; border-top:1px dashed #223049; }
    .rp-strength:first-of-type{ border-top:none; padding-top:2px; }
    /* الشرح التفصيلي للقوة */
    .rp-str-define{ color:#cbd5e1; font-size:15px; line-height:1.95; margin:10px 0 12px; }
    .rp-str-detail{ margin-top:12px; display:flex; flex-direction:column; gap:10px; }
    .rp-detail-block{ border-inline-start:2px solid var(--rp-line); padding:2px 14px; }
    .rp-detail-block.active{ border-inline-start-color:var(--rp-gold); background:rgba(251,191,36,.04); border-radius:0 10px 10px 0; }
    .rp-detail-label{ font-size:12.5px; font-weight:700; margin-bottom:3px; }
    .rp-detail-label.bal{ color:var(--rp-green); } .rp-detail-label.exc{ color:var(--rp-gold); } .rp-detail-label.def{ color:var(--rp-blue); }
    .rp-detail-text{ color:#b8c4d4; font-size:14px; line-height:1.9; }
    .rp-detail-block.active .rp-detail-text{ color:#dbe3ee; }
    .rp-str-seed{ margin-top:10px; color:var(--rp-purple); font-size:13.5px; line-height:1.9;
      background:rgba(167,139,250,.05); border-radius:10px; padding:10px 14px; }
    .rp-str-seed b{ color:var(--rp-purple); }
    /* تفاصيل المسار */
    .rp-axis-define{ color:#cbd5e1; font-size:14.5px; line-height:1.95; margin:10px 0 0; }
    .rp-axis-role-text{ color:#dbe3ee; font-size:15px; line-height:2; margin:12px 0 0; }
    .rp-fuel{ display:flex; flex-direction:column; gap:8px; margin-top:12px; }
    .rp-fuel-row{ border-inline-start:2px solid; padding:2px 12px; }
    .rp-fuel-row.love{ border-inline-start-color:var(--rp-green); }
    .rp-fuel-row.fear{ border-inline-start-color:var(--rp-gold); }
    .rp-fuel-label{ font-size:12px; font-weight:700; margin-bottom:2px; }
    .rp-fuel-row.love .rp-fuel-label{ color:var(--rp-green); }
    .rp-fuel-row.fear .rp-fuel-label{ color:var(--rp-gold); }
    .rp-fuel-text{ color:#b8c4d4; font-size:13.5px; line-height:1.9; }
    /* قسم التملّك + سؤال التأمّل */
    .rp-card.rp-own{ border-color:rgba(59,130,246,.3); }
    .rp-ask{ color:var(--rp-blue); font-weight:700; }
    /* طبقة الصدق */
    .rp-trust{ display:flex; gap:16px; align-items:flex-start; }
    .rp-trust-icon{ flex:0 0 44px; height:44px; border-radius:12px; display:flex; align-items:center;
      justify-content:center; font-size:22px; }
    .rp-trust.solid .rp-trust-icon{ background:rgba(16,185,129,.12); }
    .rp-trust.check .rp-trust-icon{ background:rgba(251,191,36,.12); }
    .rp-trust-body{ flex:1; }
    .rp-trust-title{ font-weight:700; margin-bottom:5px; }
    .rp-trust.solid .rp-trust-title{ color:var(--rp-green); }
    .rp-trust.check .rp-trust-title{ color:var(--rp-gold); }
    .rp-str-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
    .rp-str-name{ font-weight:700; font-size:16.5px; }
    .rp-pos{ border-radius:99px; padding:3px 12px; font-size:12.5px; border:1px solid; white-space:nowrap; }
    .rp-pos.balance{ color:var(--rp-green); border-color:rgba(16,185,129,.45); }
    .rp-pos.excess{ color:var(--rp-gold); border-color:rgba(251,191,36,.45); }
    .rp-pos.deficit{ color:var(--rp-blue); border-color:rgba(59,130,246,.5); }
    .rp-pos.both{ color:var(--rp-gold); border-color:rgba(251,191,36,.45); }
    .rp-pos.nearBalanceLean{ color:var(--rp-purple); border-color:rgba(167,139,250,.5); }

    .rp-bar{ direction:ltr; }
    .rp-track{ position:relative; display:flex; height:11px; border-radius:99px; overflow:hidden; background:#101a28; }
    .rp-zone{ flex:1; }
    .rp-z-def{ background:rgba(59,130,246,.28); } .rp-z-bal{ background:rgba(16,185,129,.28); } .rp-z-exc{ background:rgba(251,191,36,.30); }
    .rp-dot{ position:absolute; top:50%; width:15px; height:15px; border-radius:50%;
      transform:translate(-50%,-50%); box-shadow:0 0 0 3px rgba(15,23,42,.65); }
    .rp-bar-labels{ direction:ltr; display:flex; justify-content:space-between; color:var(--rp-muted); font-size:11.5px; margin-top:6px; }

    /* الرادار */
    .rp-radar-wrap{ max-width:520px; margin:8px auto 4px; }
    .rp-radar-cap{ text-align:center; color:var(--rp-muted); font-size:13px; margin-top:8px; }

    /* هدف التعافي */
    .rp-worst{ border:1px solid rgba(251,191,36,.5); background:rgba(251,191,36,.05); }
    .rp-worst .rp-h{ color:var(--rp-gold); }
    .rp-worst-chip{ display:inline-flex; gap:10px; align-items:center; border:1px solid rgba(251,191,36,.5);
      border-radius:12px; padding:10px 18px; margin-bottom:14px; font-size:16px; }
    .rp-worst-chip b{ font-family:var(--rp-serif); font-size:18px; }

    /* البروتوكول */
    .rp-marker{ display:flex; gap:14px; align-items:flex-start; border:1px solid var(--rp-line);
      border-radius:14px; padding:18px; background:#101a28; margin-bottom:14px; }
    .rp-marker-num{ flex:0 0 34px; height:34px; border-radius:50%; background:#1c2a40; color:var(--rp-gold);
      display:flex; align-items:center; justify-content:center; font-weight:700; font-family:var(--rp-serif); }
    .rp-marker-body{ flex:1; }
    .rp-marker-title{ font-weight:700; margin-bottom:6px; }
    .rp-voice{ font-family:var(--rp-serif); font-size:17.5px; line-height:2.1; color:#d7dcf0;
      background:rgba(167,139,250,.05); border:1px solid rgba(167,139,250,.28); border-radius:12px;
      padding:16px 18px; margin:10px 0; }

    .rp-actions{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin:8px 0 20px; }
    .rp-btn{ border:none; cursor:pointer; font-family:inherit; font-size:16px; font-weight:700;
      padding:13px 30px; border-radius:12px; transition:transform .15s; }
    .rp-btn.primary{ background:var(--rp-blue); color:#fff; box-shadow:0 8px 22px rgba(59,130,246,.30); }
    .rp-btn.primary:hover{ transform:translateY(-2px); }
    .rp-btn.ghost{ background:transparent; color:var(--rp-text); border:1px solid var(--rp-line); }

    /* زرار تبديل اللغة — ثابت أعلى التقرير */
    .rp-langbar{ display:flex; justify-content:flex-end; margin:0 0 14px; }
    .rp-lang-toggle{ display:inline-flex; align-items:center; gap:8px; cursor:pointer;
      background:rgba(59,130,246,.08); border:1px solid rgba(59,130,246,.35); color:var(--rp-blue);
      font-family:inherit; font-size:14px; font-weight:700; padding:9px 18px; border-radius:99px;
      transition:background .15s, transform .12s; }
    .rp-lang-toggle:hover{ background:rgba(59,130,246,.16); transform:translateY(-1px); }
    .rp-lang-toggle .rp-lang-ic{ font-size:15px; }
    @media print{ .rp-langbar{ display:none !important; } }

    @media(max-width:560px){
      .rp-hero{ padding:30px 18px 26px; } .rp-essence{ font-size:29px; }
      .rp-card{ padding:24px 16px; } .rp-arena{ padding:16px 12px; }
    }

    /* طباعة أنيقة */
    @media print{
      body{ background:#fff; color:#111; }
      #rapid-report-root{ padding:0; max-width:100%; }
      .rp-hero,.rp-card,.rp-arena,.rp-ground,.rp-axis-row,.rp-marker{
        background:#fff !important; border-color:#ccc !important; box-shadow:none !important; }
      .rp-p,.rp-axis-note,.rp-arena-sub,.rp-axis-role,.rp-kicker,.rp-loading-text{ color:#333 !important; }
      .rp-essence{ color:#111 !important; } .rp-axis-name,.rp-str-name,.rp-arena-name,.rp-marker-title{ color:#111 !important; }
      .rp-voice{ color:#222 !important; background:#faf7ff !important; }
      .rp-actions{ display:none !important; }
      .rp-hero::before{ display:none; }
    }
  </style>
</head>
<body>

  <div id="rapid-report-root">
    <div class="rp-spinner"></div>
    <div class="rp-loading-text">لحظة — بنجهّز تقريرك...</div>
  </div>

  <!-- ١) Firebase SDK 8.10.1 ثم تهيئة المشروع -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="../js/firebase-config.js"></script>

  <!-- ٢) البيانات والبنية والمخزن (لا محرّك: النتائج محسوبة ومخزّنة) -->
  <script src="rapid-questions.js"></script>
  <script src="rapid-config.js"></script>
  <script src="rapid-strengths-content.js"></script>
  <script src="rapid-axes-content.js"></script>
  <!-- طبقة اللغة: نصوص ثابتة + سرد الطبائع + توائم العاميّة (تدهورٌ رشيق لو غاب أيّها) -->
  <script src="report-strings.js"></script>
  <script src="report-content-ar.js"></script>
  <script src="report-content-eg.js"></script>
  <script src="rapid-axes-content-eg.js"></script>
  <script src="rapid-strengths-content-eg.js"></script>
  <script src="rapid-store.js"></script>

  <!-- ٣) رادار تجميعي (تحسين تدريجي — غيابه لا يكسر شيئًا) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

  <script>
  (function(){
    'use strict';

    /* ═══════════ طبقة اللغة ═══════════
       النصوص الثابتة من report-strings.js (t)، وسرد الطبائع من ملفَّي
       ar/eg، وتوائم العاميّة للمسارات والقوى. كلّها بتدهورٍ رشيق: لو غاب
       ملفٌّ رجعنا للفصحى تلقائيًّا فلا يتعطّل التقرير.
       AXIS_LABEL ثابتٌ في اللغتين (مصطلحاتٌ معتمدة لا تُترجَم). */
    var S = window.RAPID_STRINGS || null;
    function t(key){ return S ? S.t(key) : ''; }
    function curLang(){ return S ? S.getLang() : 'ar'; }

    /* سرد الطبائع حسب اللغة (مع سقوطٍ للفصحى) */
    function contentSource(){
      var ar = (window.RAPID_REPORT_CONTENT_AR && window.RAPID_REPORT_CONTENT_AR.CONTENT) || {};
      var eg = (window.RAPID_REPORT_CONTENT_EG && window.RAPID_REPORT_CONTENT_EG.CONTENT) || null;
      return (curLang() === 'eg' && eg) ? eg : ar;
    }

    /* مصدر تفاصيل المسارات حسب اللغة (مع سقوطٍ للفصحى لكلّ حقلٍ على حدة) */
    function axisSource(){
      var ar = window.RAPID_AXES_CONTENT || null;
      var eg = window.RAPID_AXES_CONTENT_EG || null;
      return (curLang() === 'eg' && eg) ? { primary: eg, fallback: ar } : { primary: ar, fallback: ar };
    }

    /* مصدر تفاصيل القوى حسب اللغة (سقوطٌ للفصحى إن لم تُترجم القوّة بعد) */
    function strengthSource(){
      var ar = window.RAPID_STRENGTHS_CONTENT || null;
      var eg = window.RAPID_STRENGTHS_CONTENT_EG || null;
      return (curLang() === 'eg' && eg) ? { primary: eg, fallback: ar } : { primary: ar, fallback: ar };
    }

    var AXIS_LABEL = { tamasuk: 'الحفظ والاستقرار', hayawiyya: 'الحيوية والتجدّد', intima: 'الانتماء والمشاركة' };
    /* أدوار المسارات — تُبنى من قاموس النصوص حسب اللغة */
    function roleObj(){
      return {
        primary:   { label: t('roleLabelPrimary'),   note: t('roleNotePrimary') },
        secondary: { label: t('roleLabelSecondary'), note: t('roleNoteSecondary') },
        repressed: { label: t('roleLabelRepressed'), note: t('roleNoteRepressed') }
      };
    }
    /* تسميات موضع القوّة حسب اللغة */
    function posLabel(pos){
      switch(pos){
        case 'balance': return t('posBalance');
        case 'excess': return t('posExcess');
        case 'deficit': return t('posDeficit');
        case 'both': return t('posBoth');
        case 'nearBalanceLean': return t('posNearBalance');
        default: return '';
      }
    }

    function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function arabicNum(n){ var m=['٠','١','٢','٣','٤','٥','٦','٧','٨','٩']; return String(n).replace(/\d/g,function(d){return m[+d];}); }
    function root(){ return document.getElementById('rapid-report-root'); }

    /* شريط طيف قوّة واحدة */
    function strengthBar(s){
      var marker = '';
      if(s.position === 'both'){
        marker = '<span class="rp-dot" style="inset-inline-start:17%; background:#3b82f6"></span>'
               + '<span class="rp-dot" style="inset-inline-start:83%; background:#fbbf24"></span>';
      } else {
        var pct = 50, col = '#10b981';
        if(s.position === 'deficit'){ pct = 17; col = '#3b82f6'; }
        else if(s.position === 'excess'){ pct = 83; col = '#fbbf24'; }
        else if(s.position === 'nearBalanceLean'){ pct = (s.leanDir === 'excess') ? 62 : 38; col = '#a78bfa'; }
        marker = '<span class="rp-dot" style="inset-inline-start:' + pct + '%; background:' + col + '"></span>';
      }
      return '<div class="rp-bar">'
           +   '<div class="rp-track"><span class="rp-zone rp-z-def"></span><span class="rp-zone rp-z-bal"></span><span class="rp-zone rp-z-exc"></span>' + marker + '</div>'
           +   '<div class="rp-bar-labels"><span>' + esc(t('barLabelDeficit')) + '</span><span>' + esc(t('barLabelBalance')) + '</span><span>' + esc(t('barLabelExcess')) + '</span></div>'
           + '</div>';
    }

    /* قراءة اتجاهية (اتجاه لا تسمية) لقوة منزلقة — نصوصها من قاموس اللغة */
    function directionalReading(s, names){
      var n = names || {};
      var exc = esc(n.excessName || t('fallbackExcess'));
      var def = esc(n.deficitName || t('fallbackDeficit'));
      if(s.position === 'excess')  return t('dirExcess') + exc + '.';
      if(s.position === 'deficit') return t('dirDeficit') + def + '.';
      if(s.position === 'both')    return t('dirBothA') + exc + t('dirBothB') + def + t('dirBothC');
      if(s.position === 'nearBalanceLean') return t('dirNearA') + (s.leanDir === 'excess' ? exc : def) + t('dirNearB');
      return t('dirBalanced');
    }

    /* تفاصيل المسار في دوره — من مصدر اللغة، مع سقوطٍ للفصحى لكلّ حقلٍ على حدة. */
    function axisDetail(axisKey, role){
      var src = axisSource();
      var pApi = src.primary, fApi = src.fallback;
      var c = (pApi && pApi.getAxisContent) ? pApi.getAxisContent(axisKey, role) : null;
      var f = (fApi && fApi.getAxisContent) ? fApi.getAxisContent(axisKey, role) : null;
      var pick = function(a){ return (c && c[a]) ? c[a] : (f && f[a]) ? f[a] : null; };
      var define = pick('define'), roleText = pick('roleText'), love = pick('fromLove'), fear = pick('fromFear');
      if(!define && !roleText) return '';
      var fuel = '';
      if(love || fear){
        fuel = '<div class="rp-fuel">'
             + (love ? '<div class="rp-fuel-row love"><div class="rp-fuel-label">' + esc(t('fuelLove')) + '</div><div class="rp-fuel-text">' + esc(love) + '</div></div>' : '')
             + (fear ? '<div class="rp-fuel-row fear"><div class="rp-fuel-label">' + esc(t('fuelFear')) + '</div><div class="rp-fuel-text">' + esc(fear) + '</div></div>' : '')
             + '</div>';
      }
      return (define ? '<div class="rp-axis-define">' + esc(define) + '</div>' : '')
           + (roleText ? '<div class="rp-axis-role-text">' + esc(roleText) + '</div>' : '')
           + fuel;
    }

    /* الشرح التفصيلي لقوّة — من مصدر اللغة، مع سقوطٍ للفصحى إن لم تُترجم القوّة بعد.
       يُبرز الكتلة المطابقة لموضع العميل الحالي (اتزان/إفراط/تفريط). */
    function strengthDetail(s, names){
      var src = strengthSource();
      var pApi = src.primary, fApi = src.fallback;
      var c = (pApi && pApi.getStrengthContent) ? pApi.getStrengthContent(s.id) : null;
      if(!c && fApi && fApi.getStrengthContent) c = fApi.getStrengthContent(s.id); // سقوط للفصحى
      if(!c) return '';   // لا محتوى في اللغتين → يبقى العرض مختصرًا

      var activeExc = (s.position === 'excess') || (s.position === 'both') || (s.position === 'nearBalanceLean' && s.leanDir === 'excess');
      var activeDef = (s.position === 'deficit') || (s.position === 'both') || (s.position === 'nearBalanceLean' && s.leanDir === 'deficit');
      var activeBal = (s.position === 'balance');

      function block(cls, label, name, text, active){
        return '<div class="rp-detail-block' + (active ? ' active' : '') + '">'
             +   '<div class="rp-detail-label ' + cls + '">' + esc(label) + (name ? ' · ' + esc(name) : '') + '</div>'
             +   '<div class="rp-detail-text">' + esc(text) + '</div>'
             + '</div>';
      }

      return '<div class="rp-str-define">' + esc(c.define) + '</div>'
           + '<div class="rp-str-detail">'
           +   block('bal', t('detailBalance'), '', c.balance, activeBal)
           +   block('exc', t('detailExcess'), names.excessName, c.excess, activeExc)
           +   block('def', t('detailDeficit'), names.deficitName, c.deficit, activeDef)
           + '</div>'
           + (c.seed ? '<div class="rp-str-seed"><b>' + esc(t('tryPrefix')) + '</b> ' + esc(c.seed) + '</div>' : '');
    }

    /* فهرس أسماء القوى وانزلاقاتها من البنية (المصدر الموحّد) */
    function strengthNamesIndex(typeNum){
      var map = window.RAPID_CONFIG.getStrengthMap(typeNum);
      var idx = {};
      if(map) map.axes.forEach(function(a){
        a.strengths.forEach(function(s){ idx[s.id] = { name: s.name, excessName: s.excessName, deficitName: s.deficitName, axisKey: a.key, axisName: a.axisName }; });
      });
      return idx;
    }

    /* ═══════════ البناء ═══════════ */
    function render(results, trace){
      trace = trace || {};
      var typeKey = results.type;
      var typeNum = results.typeNum;
      var c = contentSource()[typeKey] || {};
      var ROLE = roleObj();
      var names = strengthNamesIndex(typeNum);
      var Q = window.RAPID_QUESTIONS;
      var h = '';
      var _step = 0;
      function nextStep(){ _step++; return arabicNum(_step); }

      /* زرار تبديل اللغة — أعلى التقرير */
      var toEg = (curLang() === 'ar');
      h += '<div class="rp-langbar">'
         +   '<button class="rp-lang-toggle" id="rpLangToggle">'
         +     '<span class="rp-lang-ic">↔</span>'
         +     '<span>' + esc(toEg ? t('toggleToEg') : t('toggleToAr')) + '</span>'
         +   '</button>'
         + '</div>';

      /* أرض الكرامة — الافتتاح */
      h += '<div class="rp-ground rp-shell">'
         +   '<div class="rp-ground-title">' + esc(t('groundOpenTitle')) + '</div>'
         +   '<p class="rp-p">' + esc(t('groundOpenBody')) + '</p>'
         + '</div>';

      /* ١ — الهيرو: الجوهر */
      h += '<div class="rp-hero rp-shell">'
         +   '<div class="rp-hero-tag">' + esc(t('heroTag')) + '</div>'
         +   '<h1 class="rp-essence">' + esc(c.essence || '') + '</h1>'
         +   '<div class="rp-essence-sub">' + esc(t('heroEssenceSub')) + '</div>'
         +   '<div class="rp-chips">'
         +     '<span class="rp-chip longing">' + esc(t('chipLonging')) + ': <b>' + esc(c.longing || '') + '</b></span>'
         +     '<span class="rp-chip virtue">' + esc(t('chipVirtue')) + ': <b>' + esc(c.virtue || '') + '</b></span>'
         +   '</div>'
         +   '<p class="rp-p rp-lead">' + esc(c.para || '') + '</p>'
         + '</div>';

      /* ١ب — التملّك: دعوةٌ ليرى القارئ طابعه في سيرته قبل التفاصيل
         (مبدأ ٩: لا فعل قبل تملّك · Aware-Explore-Apply) */
      h += '<div class="rp-card rp-own rp-shell">'
         +   '<div class="rp-h">' + esc(t('ownTitle')) + '</div>'
         +   '<div class="rp-kicker">' + esc(t('ownKicker')) + '</div>'
         +   '<p class="rp-p">' + esc(t('ownBody'))
         +     '<span class="rp-ask">' + esc(t('ownAsk')) + '</span>'
         +     esc(t('ownBodyTail')) + '</p>'
         + '</div>';

      /* ٢ — المسارات الثلاثة */
      var rk = results.axesRanking || {};
      var ranking = rk.ranking || [];
      var maxAction = Math.max.apply(null, ranking.map(function(r){ return r.action || 1; }).concat([1]));
      var roles = [
        { key: rk.primaryAxis,   cls: 'primary',   roleKey: 'primary',   role: ROLE.primary },
        { key: rk.secondaryAxis, cls: '',          roleKey: 'secondary', role: ROLE.secondary },
        { key: rk.repressedAxis, cls: 'repressed', roleKey: 'repressed', role: ROLE.repressed }
      ];
      h += '<div class="rp-card rp-shell"><span class="rp-step">' + nextStep() + '</span>'
         +   '<div class="rp-h">' + esc(t('axesTitle')) + '</div>'
         +   '<div class="rp-kicker">' + esc(t('axesKicker')) + '</div>'
         +   '<div class="rp-axes">';
      roles.forEach(function(r){
        var row = null;
        ranking.forEach(function(x){ if(x.axisId === r.key) row = x; });
        var pct = row ? Math.round((row.action / maxAction) * 100) : 0;
        h += '<div class="rp-axis-row ' + r.cls + '">'
           +   '<div class="rp-axis-top"><span class="rp-axis-name">' + esc(AXIS_LABEL[r.key] || '') + '</span>'
           +   '<span class="rp-axis-role">' + esc(r.role.label) + '</span></div>'
           +   '<div class="rp-axis-bar"><div class="rp-axis-fill" style="width:' + pct + '%"></div></div>'
           +   '<div class="rp-axis-note">' + esc(r.role.note) + '</div>'
           +   axisDetail(r.key, r.roleKey)
           + '</div>';
      });
      h += '</div>';
      if(rk.repressedConfirmed){
        h += '<div class="rp-whisper">' + esc(t('repressedConfirmed')) + '</div>';
      }
      h += '</div>';

      /* ٣ — خريطة القوى التسع */
      h += '<div class="rp-card rp-shell"><span class="rp-step">' + nextStep() + '</span>'
         +   '<div class="rp-h">' + esc(t('strengthsTitle')) + '</div>'
         +   '<div class="rp-kicker">' + esc(t('strengthsKicker')) + '</div>'
         +   '<p class="rp-p" style="margin-bottom:18px">' + esc(t('strengthsIntro')) + '<span class="rp-ask">' + esc(t('strengthsAsk')) + '</span></p>';

      ['tamasuk','hayawiyya','intima'].forEach(function(ax){
        var sp = Q.spectrum[typeKey];
        var axisName = sp && sp[ax] ? sp[ax].axisName : '';
        var list = (results.strengths || []).filter(function(s){ return s.axisKey === ax; });
        if(!list.length) return;
        h += '<div class="rp-arena">'
           +   '<div class="rp-arena-head"><span class="rp-arena-name">' + esc(axisName) + '</span>'
           +   '<span class="rp-arena-sub">' + esc(t('arenaSubPrefix')) + ' ' + esc(AXIS_LABEL[ax] || '') + '</span></div>';
        list.forEach(function(s){
          h += '<div class="rp-strength">'
             +   '<div class="rp-str-top"><span class="rp-str-name">' + esc(s.name) + '</span>'
             +   '<span class="rp-pos ' + esc(s.position) + '">' + esc(posLabel(s.position) || s.positionLabel || '') + '</span></div>'
             +   strengthBar(s)
             +   strengthDetail(s, names[s.id] || {})
             + '</div>';
        });
        h += '</div>';
      });

      /* الرادار التجميعي (تحسين تدريجي) */
      h += '<div class="rp-radar-wrap"><canvas id="rpRadar" height="420"></canvas></div>'
         + '<div class="rp-radar-cap" id="rpRadarCap" style="display:none">' + esc(t('radarCap')) + '</div>'
         + '</div>';

      /* ٤ — هدف التعافي الأوّل */
      var worst = results.worstStrength;
      if(worst){
        var wNames = names[worst.id] || {};
        var wFull = null;
        (results.strengths || []).forEach(function(s){ if(s.id === worst.id) wFull = s; });
        /* محتوى القوّة الأشدّ نزيفًا من مصدر اللغة، مع سقوطٍ للفصحى */
        var wSrc = strengthSource();
        var wContent = (wSrc.primary && wSrc.primary.getStrengthContent) ? wSrc.primary.getStrengthContent(worst.id) : null;
        if(!wContent && wSrc.fallback && wSrc.fallback.getStrengthContent) wContent = wSrc.fallback.getStrengthContent(worst.id);
        h += '<div class="rp-card rp-worst rp-shell"><span class="rp-step">' + nextStep() + '</span>'
           +   '<div class="rp-h">' + esc(t('worstTitle')) + '</div>'
           +   '<div class="rp-kicker">' + esc(t('worstKicker')) + '</div>'
           +   '<div class="rp-worst-chip"><b>' + esc(worst.name) + '</b><span class="rp-muted">' + esc(t('worstInPrefix')) + ' ' + esc(wNames.axisName || '') + '</span></div>'
           +   (wContent ? '<p class="rp-p">' + esc(wContent.define) + '</p>' : '')
           +   '<p class="rp-p">' + (wFull ? directionalReading(wFull, wNames) : '') + '</p>'
           +   '<p class="rp-p">' + esc(t('worstBody')) + '</p>'
           +   (wContent ? '<div class="rp-str-seed"><b>' + esc(t('tryPrefix')) + '</b> ' + esc(wContent.seed) + '</div>' : '')
           + '</div>';
      }

      /* ٥ — طبقة الصدق: مقدار الثقة في تماسك النتيجة (درس iEQ9 §المحور السابع)
         للعميل صياغةٌ مطمئنة أو دعوةٌ لطيفة للتحقّق — لا كشفٌ للأرقام. */
      var confVal = results.confidence || 0;
      var flags = ((trace.consistencyFlags || []).length) + (trace.attentionFlagged ? 1 : 0);
      var solid = (flags === 0 && confVal >= 60);
      if(solid){
        h += '<div class="rp-card rp-shell"><span class="rp-step">' + nextStep() + '</span>'
           +   '<div class="rp-trust solid">'
           +     '<div class="rp-trust-icon">✓</div>'
           +     '<div class="rp-trust-body"><div class="rp-trust-title">' + esc(t('trustSolidTitle')) + '</div>'
           +       '<p class="rp-p" style="margin:0">' + esc(t('trustSolidBody')) + '</p>'
           +     '</div>'
           +   '</div>'
           + '</div>';
      } else {
        h += '<div class="rp-card rp-shell"><span class="rp-step">' + nextStep() + '</span>'
           +   '<div class="rp-trust check">'
           +     '<div class="rp-trust-icon">◑</div>'
           +     '<div class="rp-trust-body"><div class="rp-trust-title">' + esc(t('trustCheckTitle')) + '</div>'
           +       '<p class="rp-p" style="margin:0">' + esc(t('trustCheckBody')) + '</p>'
           +     '</div>'
           +   '</div>'
           + '</div>';
      }

      /* ٦ — بروتوكول التحقّق الذاتي */
      var voice = Q.recognitionVoices ? Q.recognitionVoices[typeKey] : null;
      var wFull2 = null;
      if(worst) (results.strengths || []).forEach(function(s){ if(s.id === worst.id) wFull2 = s; });
      h += '<div class="rp-card rp-shell"><span class="rp-step">' + nextStep() + '</span>'
         +   '<div class="rp-h">' + esc(t('protoTitle')) + '</div>'
         +   '<div class="rp-kicker">' + esc(t('protoKicker')) + '</div>'
         +   '<div class="rp-marker"><span class="rp-marker-num">' + arabicNum(1) + '</span><div class="rp-marker-body">'
         +     '<div class="rp-marker-title">' + esc(t('protoM1Title')) + '</div>'
         +     '<p class="rp-p">' + esc(t('protoM1A')) + '<b>' + esc(AXIS_LABEL[rk.primaryAxis] || '') + '</b>' + esc(t('protoM1B')) + '</p>'
         +   '</div></div>'
         +   '<div class="rp-marker"><span class="rp-marker-num">' + arabicNum(2) + '</span><div class="rp-marker-body">'
         +     '<div class="rp-marker-title">' + esc(t('protoM2Title')) + '</div>'
         +     '<p class="rp-p">' + esc(t('protoM2A'))
         +     (worst && wFull2 ? (esc(t('protoM2Predict')) + '<b>' + esc(worst.name) + '</b>: ' + directionalReading(wFull2, names[worst.id] || {})) : esc(t('protoM2NoPredict')))
         +     esc(t('protoM2Tail')) + '</p>'
         +   '</div></div>'
         +   '<div class="rp-marker"><span class="rp-marker-num">' + arabicNum(3) + '</span><div class="rp-marker-body">'
         +     '<div class="rp-marker-title">' + esc(t('protoM3Title')) + '</div>'
         +     '<p class="rp-p">' + esc(t('protoM3A')) + '</p>'
         +     (voice ? '<div class="rp-voice">' + esc(voice) + '</div>' : '')
         +     '<p class="rp-p">' + esc(t('protoM3B')) + '</p>'
         +   '</div></div>'
         +   '<p class="rp-p rp-muted">' + esc(t('protoFooter')) + '</p>'
         + '</div>';

      /* أرض الكرامة — الخاتمة */
      h += '<div class="rp-ground rp-shell">'
         +   '<div class="rp-ground-title">' + esc(t('groundCloseTitle')) + '</div>'
         +   '<p class="rp-p">' + esc(t('groundCloseBody')) + '</p>'
         + '</div>';

      h += '<div class="rp-actions">'
         +   '<button class="rp-btn ghost" id="rpPrint">' + esc(t('btnPrint')) + '</button>'
         +   '<button class="rp-btn primary" id="rpDone">' + esc(t('btnDone')) + '</button>'
         + '</div>';

      root().innerHTML = h;

      var pb = document.getElementById('rpPrint');
      if(pb) pb.addEventListener('click', function(){ try{ window.print(); }catch(e){} });
      var db = document.getElementById('rpDone');
      if(db) db.addEventListener('click', function(){ window.location.href = 'course-view.html'; });

      /* زرار تبديل اللغة: يقلب اللغة، يحفظ الاختيار، ويعيد بناء نفس النتيجة */
      var lt = document.getElementById('rpLangToggle');
      if(lt) lt.addEventListener('click', function(){
        if(!S) return;
        S.setLang(curLang() === 'eg' ? 'ar' : 'eg');
        try{ document.documentElement.scrollTop = 0; document.body.scrollTop = 0; }catch(e){}
        render(results, trace);   // إعادة بناءٍ فوريّة بلا إعادة تحميل
      });

      drawRadar(results);
    }

    /* الرادار: حضور الاتزان في القوى التسع */
    function drawRadar(results){
      try{
        if(typeof Chart === 'undefined') return;
        var el = document.getElementById('rpRadar');
        if(!el) return;
        var labels = (results.strengths || []).map(function(s){ return s.name; });
        var data = (results.strengths || []).map(function(s){ return s.balance; });
        new Chart(el.getContext('2d'), {
          type: 'radar',
          data: { labels: labels, datasets: [{
            label: t('radarLabel'),
            data: data,
            backgroundColor: 'rgba(16,185,129,.18)',
            borderColor: 'rgba(16,185,129,.9)',
            pointBackgroundColor: '#10b981',
            borderWidth: 2
          }]},
          options: {
            responsive: true,
            scales: { r: {
              min: 0, max: 7,
              ticks: { display: false },
              grid: { color: 'rgba(42,56,80,.8)' },
              angleLines: { color: 'rgba(42,56,80,.8)' },
              pointLabels: { color: '#cbd5e1', font: { family: 'Tajawal', size: 12 } }
            }},
            plugins: { legend: { display: false } }
          }
        });
        var cap = document.getElementById('rpRadarCap');
        if(cap) cap.style.display = '';
      } catch(e){ /* الرادار تحسين لا شرط */ }
    }

    function emptyState(){
      root().innerHTML =
        '<div class="rp-card rp-shell rp-centered">'
        + '<div class="rp-h">' + esc(t('emptyTitle')) + '</div>'
        + '<p class="rp-p">' + esc(t('emptyBody')) + '</p>'
        + '<div class="rp-actions"><button class="rp-btn primary" id="rpGo">' + esc(t('btnStart')) + '</button></div>'
        + '</div>';
      var b = document.getElementById('rpGo');
      if(b) b.addEventListener('click', function(){ window.location.href = 'course-view.html'; });
    }

    function boot(){
      var STORE = window.RAPID_STORE;
      if(!STORE || !window.RAPID_QUESTIONS || !window.RAPID_CONFIG){
        root().innerHTML = '<div class="rp-loading-text">ملفّات التقرير لم تكتمل — راجع ترتيب التحميل.</div>';
        return;
      }
      var user = STORE.requireAuth({ loginPath: '../login.html' });
      if(!user) return;
      STORE.loadAssessment(user.id).then(function(doc){
        if(doc && doc.results && doc.results.type){ render(doc.results, doc.trace || {}); }
        else { emptyState(); }
      }).catch(emptyState);
    }

    if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
  })();
  </script>
</body>
</html>
