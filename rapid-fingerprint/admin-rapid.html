<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>لوحة الأدمن — مقياس البصمة السريع</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />

<style>
  /* الهوية الموروثة من لوحة أدمن المرايا حرفيًّا */
  :root {
    --bg-0:#0f172a; --bg-1:#1a2332; --bg-2:#243049; --bg-3:#2d3a52;
    --border:#2d3a52; --border-soft:rgba(148,163,184,.14);
    --text:#e8eef7; --muted:#94a3b8; --dim:#64748b;
    --blue:#3b82f6; --green:#10b981; --gold:#fbbf24; --purple:#a78bfa; --red:#ef4444;
    --blue-b:rgba(59,130,246,.12); --green-b:rgba(16,185,129,.12);
    --gold-b:rgba(251,191,36,.12); --purple-b:rgba(167,139,250,.13); --red-b:rgba(239,68,68,.13);
    --radius:14px; --radius-lg:18px;
    --shadow:0 10px 30px rgba(0,0,0,.35);
    --f:'Tajawal',sans-serif;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body {
    font-family:var(--f); color:var(--text); line-height:1.7; min-height:100vh;
    background:
      radial-gradient(1200px 600px at 88% -12%, rgba(59,130,246,.10), transparent 60%),
      radial-gradient(900px 520px at -8% 112%, rgba(167,139,250,.09), transparent 55%),
      var(--bg-0);
  }
  ::selection { background:rgba(251,191,36,.25); }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background:var(--bg-3); border-radius:8px; }
  ::-webkit-scrollbar-track { background:transparent; }

  #gate { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:var(--bg-0); z-index:50; flex-direction:column; gap:14px; color:var(--muted); }
  .spinner { width:34px; height:34px; border-radius:50%;
    border:3px solid var(--border); border-top-color:var(--blue); animation:spin .9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  #app { display:none; }
  .layout { display:grid; grid-template-columns:330px 1fr; min-height:100vh; }
  @media (max-width:920px){ .layout { grid-template-columns:1fr; } .side { display:none; }
    .side.open { display:flex; position:fixed; inset:0 0 0 auto; width:86%; max-width:350px; z-index:40; } }

  .side { background:linear-gradient(180deg,var(--bg-1),#15202f);
    border-inline-start:1px solid var(--border); display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh; }
  .side-hd { padding:20px 18px 14px; border-bottom:1px solid var(--border); text-align:center; }
  .side-logo { width:52px; height:52px; margin:0 auto 8px; border-radius:14px;
    background:linear-gradient(135deg,var(--blue),var(--green)); display:flex; align-items:center;
    justify-content:center; font-size:24px; font-weight:900; color:#0b1220;
    box-shadow:0 8px 22px rgba(59,130,246,.32); }
  .side-title { font-size:16px; font-weight:800; }
  .side-sub { font-size:11.5px; color:var(--muted); margin-top:2px; }
  .side-search { padding:12px 14px; }
  .side-search input, .side-search select { width:100%; background:var(--bg-0); border:1px solid var(--border);
    border-radius:10px; padding:10px 12px; color:var(--text); font-family:var(--f); font-size:13px; outline:none; }
  .side-search input:focus { border-color:var(--blue); }
  .side-search select { margin-top:8px; }
  .side-list { flex:1; overflow-y:auto; padding:6px 10px; }
  .client { display:flex; align-items:center; gap:11px; padding:10px 11px; border-radius:12px;
    cursor:pointer; margin-bottom:4px; border:1px solid transparent; transition:.14s; width:100%; text-align:start; }
  .client:hover { background:var(--bg-2); }
  .client.active { background:var(--bg-2); border-color:var(--blue); }
  .avatar { width:40px; height:40px; border-radius:11px; flex-shrink:0; display:flex;
    align-items:center; justify-content:center; font-size:16px; font-weight:800; color:#fff; background:var(--bg-3); }
  .client-info { flex:1; min-width:0; }
  .client-name { font-size:13.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .client-meta { font-size:11px; color:var(--muted); margin-top:1px; display:flex; gap:8px; align-items:center; }
  .conf-dot { width:9px; height:9px; border-radius:50%; display:inline-block; }
  .flag-mini { color:var(--red); font-size:11px; }
  .side-foot { padding:11px 14px; border-top:1px solid var(--border); font-size:11.5px;
    color:var(--muted); text-align:center; }

  .main { min-width:0; }
  .topbar { display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:15px 22px;
    border-bottom:1px solid var(--border); background:rgba(26,35,50,.7); backdrop-filter:blur(8px);
    position:sticky; top:0; z-index:20; }
  .topbar h1 { font-size:18px; font-weight:800; margin:0; margin-inline-end:auto; }
  .admin-chip { font-size:12px; color:var(--green); background:var(--green-b);
    border-radius:999px; padding:4px 12px; }
  .tbtn { background:var(--bg-2); border:1px solid var(--border); color:var(--text);
    font-family:var(--f); font-size:13px; font-weight:700; padding:8px 16px; border-radius:10px; cursor:pointer; }
  .tbtn:hover { border-color:var(--blue); }
  .tbtn.gold { color:var(--gold); border-color:rgba(251,191,36,.4); }
  .hamburger { display:none; }
  @media (max-width:920px){ .hamburger { display:inline-flex; } }

  .content { padding:22px; max-width:1080px; }

  /* شريط الإحصاء والمعايرة */
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
  .stat { background:var(--bg-1); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; }
  .stat-k { font-size:11.5px; color:var(--muted); margin-bottom:4px; }
  .stat-v { font-size:20px; font-weight:900; }
  .stat-v small { font-size:12px; color:var(--muted); font-weight:400; }

  .calib { background:var(--bg-1); border:1px solid rgba(251,191,36,.35); border-radius:var(--radius-lg);
    padding:16px 18px; margin-bottom:16px; }
  .calib-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .calib-title { font-weight:800; color:var(--gold); }
  .calib-pct { font-size:22px; font-weight:900; margin-inline-start:auto; }
  .calib-bar { height:8px; background:var(--bg-0); border-radius:99px; overflow:hidden; position:relative; }
  .calib-fill { height:100%; }
  .calib-th { position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--gold); inset-inline-start:90%; }
  .calib-note { font-size:12px; color:var(--muted); margin-top:6px; }

  .dist { display:flex; gap:8px; align-items:flex-end; height:74px; margin:4px 0 2px; }
  .dist-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .dist-bar { width:100%; background:linear-gradient(180deg,var(--blue),var(--green)); border-radius:6px 6px 0 0; min-height:3px; }
  .dist-lab { font-size:11px; color:var(--muted); }

  /* بطاقات التفصيلة */
  .card { background:var(--bg-1); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:20px; margin-bottom:16px; box-shadow:var(--shadow); }
  .card h3 { margin:0 0 14px; font-size:15px; color:var(--gold); display:flex; align-items:center; gap:8px; }
  .empty-note { color:var(--muted); font-size:13.5px; }

  .hero-line { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .hero-type { font-size:22px; font-weight:900; }
  .badge { font-size:12px; padding:3px 12px; border-radius:999px; font-weight:800; border:1px solid; }
  .badge.path-standard { color:var(--green); border-color:rgba(16,185,129,.45); background:var(--green-b); }
  .badge.path-duel, .badge.path-root { color:var(--gold); border-color:rgba(251,191,36,.45); background:var(--gold-b); }
  .badge.path-recognition { color:var(--purple); border-color:rgba(167,139,250,.5); background:var(--purple-b); }
  .badge.flag { color:var(--red); border-color:rgba(239,68,68,.5); background:var(--red-b); }
  .conf-wrap { display:flex; align-items:center; gap:10px; min-width:200px; flex:1; }
  .conf-bar { flex:1; height:9px; background:var(--bg-0); border-radius:99px; overflow:hidden; }
  .conf-fill { height:100%; }
  .kv { display:flex; gap:18px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); margin-top:10px; }
  .kv b { color:var(--text); }

  table.t { width:100%; border-collapse:collapse; font-size:13px; }
  table.t th { text-align:start; color:var(--muted); font-weight:700; padding:6px 8px; border-bottom:1px solid var(--border); font-size:12px; }
  table.t td { padding:7px 8px; border-bottom:1px solid var(--border-soft); }
  table.t tr:last-child td { border-bottom:none; }
  .num { font-variant-numeric:tabular-nums; }
  .hl { background:var(--gold-b); }
  .pos-chip { font-size:11px; padding:2px 9px; border-radius:999px; border:1px solid; white-space:nowrap; }
  .pos-balance { color:var(--green); border-color:rgba(16,185,129,.4); }
  .pos-excess { color:var(--gold); border-color:rgba(251,191,36,.4); }
  .pos-deficit { color:var(--blue); border-color:rgba(59,130,246,.45); }
  .pos-both { color:var(--gold); border-color:rgba(251,191,36,.4); }
  .pos-nearBalanceLean { color:var(--purple); border-color:rgba(167,139,250,.45); }

  .mini-bars { display:flex; flex-direction:column; gap:8px; }
  .mb-row { display:flex; align-items:center; gap:10px; font-size:12.5px; }
  .mb-name { flex:0 0 130px; color:var(--muted); }
  .mb-track { flex:1; height:8px; background:var(--bg-0); border-radius:99px; overflow:hidden; }
  .mb-fill { height:100%; background:linear-gradient(90deg,var(--blue),var(--green)); }
  .mb-val { flex:0 0 34px; text-align:left; color:var(--muted); }

  .steps { display:flex; gap:8px; flex-wrap:wrap; }
  .step-chip { background:var(--bg-2); border:1px solid var(--border); border-radius:10px;
    padding:6px 12px; font-size:12.5px; }
  .step-chip b { color:var(--gold); }

  .calib-row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .calib-row select { background:var(--bg-0); border:1px solid var(--border); border-radius:10px;
    padding:8px 12px; color:var(--text); font-family:var(--f); font-size:13px; }
  .match-yes { color:var(--green); font-weight:800; }
  .match-no { color:var(--red); font-weight:800; }
</style>
</head>
<body>

<div id="gate"><div class="spinner"></div><div>جارٍ التحقّق…</div></div>

<div id="app">
  <div class="layout">
    <main class="main">
      <div class="topbar">
        <button class="tbtn hamburger" id="btnMenu">☰</button>
        <h1>🫆 لوحة البصمة السريعة</h1>
        <span class="admin-chip" id="adminEmail">—</span>
        <button class="tbtn gold" id="btnCSV">تصدير CSV</button>
        <button class="tbtn" id="btnRefresh">تحديث</button>
        <button class="tbtn" id="btnLogout">خروج</button>
      </div>
      <div class="content">
        <div class="stats" id="statsRow"></div>
        <div class="calib" id="calibBox"></div>
        <div class="card"><h3>توزيع الطبائع</h3><div class="dist" id="distRow"></div></div>
        <div id="detail"><div class="card"><div class="empty-note">اختر عميلًا من القائمة لعرض تشريح بصمته الكامل.</div></div></div>
      </div>
    </main>

    <aside class="side" id="side">
      <div class="side-hd">
        <div class="side-logo">🫆</div>
        <div class="side-title">مقياس البصمة السريع</div>
        <div class="side-sub" id="clientCount">—</div>
      </div>
      <div class="side-search">
        <input id="searchInput" placeholder="بحث بالاسم أو البريد…" />
        <select id="filterSel">
          <option value="">كل النتائج</option>
          <option value="flagged">⚠ عليها أعلام صدق</option>
          <option value="lowconf">ثقة منخفضة (&lt; 60)</option>
          <option value="escalated">مرّت بفضّ الاشتباك</option>
          <option value="uncalibrated">بلا معايرة بعد</option>
        </select>
      </div>
      <div class="side-list" id="clientList"></div>
      <div class="side-foot">rapid_fingerprint_results</div>
    </aside>
  </div>
</div>

<!-- Firebase compat 9.22.1 — نفس نمط لوحة أدمن المرايا -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="./rapid-config.js"></script>

<script>
(function () {
  'use strict';

  var ADMIN_EMAIL = 'admin@fouad-academy.com';
  var LOGIN_PATH  = '../admin/login.html';
  var COLLECTION  = 'rapid_fingerprint_results';
  var CALIB_THRESHOLD = 90;   // عتبة إطلاق المعايرة — المنهجية §٨

  var db = null;
  var $ = function (id) { return document.getElementById(id); };
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function anum(n){ var m=['٠','١','٢','٣','٤','٥','٦','٧','٨','٩']; return String(n).replace(/\d/g,function(d){return m[+d];}); }

  /* أسماء الطبائع الكوتشية — موحّدة مع لوحة أدمن المرايا حرفيًّا */
  var TYPE_INFO = {
    '1': { name:'المُحسِّن المُتقِن',  icon:'⚖️' }, '2': { name:'العطوف المُعطي',    icon:'💚' },
    '3': { name:'الناجح المُنجِز',    icon:'🏆' }, '4': { name:'الحالم العميق',      icon:'🎨' },
    '5': { name:'المُفكّر المُتأمّل',  icon:'🧠' }, '6': { name:'الحذِر المُستعِدّ',  icon:'🛡️' },
    '7': { name:'المُتفائل المُتحمّس',icon:'✨' }, '8': { name:'القويّ المؤثّر',     icon:'🔴' },
    '9': { name:'الوسيط الهادئ',      icon:'☮️' }
  };
  function tnum(t){ var s = String(t==null?'':t).replace(/[^0-9]/g,''); return s || null; }
  function tname(t){ var n = tnum(t); return (n && TYPE_INFO[n]) ? TYPE_INFO[n].name : ('طبع ' + (n||'?')); }
  function ticon(t){ var n = tnum(t); return (n && TYPE_INFO[n]) ? TYPE_INFO[n].icon : '•'; }

  var PATH_LABEL = { standard:'قياسي', duel:'حُسم بالمبارزة', root:'حُسم بالجذر', recognition:'حُسم بالتعرّف' };
  var STEP_LABEL = { duels:'المبارزات', roots:'الجذور', recognition:'التعرّف', absolute:'الكسر الحتمي' };
  var POS_LABEL  = { balance:'اتزان', excess:'إفراط', deficit:'تفريط', both:'تذبذب', nearBalanceLean:'قرب اتزان بميل' };
  var SRC_LABEL  = { adjacent:'جوار البوابات', proximity:'قرب الأدلة', fallback:'الأقوى احتياطًا' };
  function famLabel(k){ var C = window.RAPID_CONFIG; return (C && C.families[k]) ? C.families[k].label : k; }
  function behLabel(k){ var C = window.RAPID_CONFIG; return (C && C.behaviors[k]) ? C.behaviors[k].label : k; }
  function axLabel(k){ var C = window.RAPID_CONFIG; return (C && C.axes[k]) ? C.axes[k].label : k; }
  function confColor(v){ return v >= 80 ? 'var(--green)' : v >= 60 ? 'var(--gold)' : 'var(--red)'; }
  function flagsCount(t){ t = t || {}; return ((t.consistencyFlags||[]).length) + (t.attentionFlagged ? 1 : 0); }

  var CLIENTS = [], SELECTED = null, FILTER = '', FILTER_KIND = '';

  /* 🔐 حماية الصفحة — النمط الموروث */
  var problem = null;
  if (typeof firebase === 'undefined') problem = 'حزم Firebase لم تُحمّل.';
  else if (typeof firebase.auth !== 'function') problem = 'حزمة firebase-auth-compat لم تُحمّل.';
  else if (typeof firebase.firestore !== 'function') problem = 'حزمة firebase-firestore-compat لم تُحمّل.';
  else if (!window.auth || !window.db) problem = 'js/firebase-config.js لم يُنفَّذ لآخره.';
  if (problem) {
    console.error('[ADMIN-RAPID]', problem);
    $('gate').innerHTML = '<div style="max-width:500px;text-align:center;color:#fecaca;line-height:1.9;padding:20px"><b style="font-size:16px">تعذّر بدء اللوحة</b><br>' + esc(problem) + '</div>';
    return;
  }
  db = window.db;

  window.auth.onAuthStateChanged(function (user) {
    var email = (user && user.email) ? user.email.toLowerCase() : '';
    if (!user || email !== ADMIN_EMAIL.toLowerCase()) { window.location.href = LOGIN_PATH; return; }
    $('gate').style.display = 'none';
    $('app').style.display = 'block';
    $('adminEmail').textContent = user.email;
    wireEvents();
    loadClients();
  });

  function wireEvents() {
    $('btnRefresh').addEventListener('click', loadClients);
    $('btnLogout').addEventListener('click', function () {
      window.auth.signOut().then(function(){ window.location.href = LOGIN_PATH; });
    });
    $('btnCSV').addEventListener('click', exportCSV);
    $('searchInput').addEventListener('input', function(e){ FILTER = e.target.value || ''; renderList(); });
    $('filterSel').addEventListener('change', function(e){ FILTER_KIND = e.target.value || ''; renderList(); });
    $('clientList').addEventListener('click', function(e){
      var item = e.target.closest('.client');
      if (!item) return;
      selectClient(item.getAttribute('data-id'));
      $('side').classList.remove('open');
    });
    var bm = $('btnMenu');
    if (bm) bm.addEventListener('click', function(){ $('side').classList.toggle('open'); });
  }

  function loadClients() {
    $('clientList').innerHTML = '<div class="empty-note" style="margin:10px">جارٍ التحميل…</div>';
    $('btnRefresh').disabled = true;
    db.collection(COLLECTION).get()
      .then(function (snap) {
        CLIENTS = snap.docs.map(function(d){ return { id: d.id, data: d.data() || {} }; });
        renderList(); renderStats(); renderCalib(); renderDist();
        if (SELECTED) {
          SELECTED = CLIENTS.filter(function(c){ return c.id === SELECTED.id; })[0] || null;
          renderDetail();
        }
      })
      .catch(function (err) {
        console.error('[ADMIN-RAPID] فشل القراءة:', err);
        $('clientList').innerHTML = '<div class="empty-note" style="margin:10px">تعذّر التحميل: ' + esc(err && err.message || err) + '</div>';
      })
      .then(function(){ $('btnRefresh').disabled = false; });
  }

  /* ════════ القائمة الجانبية ════════ */
  function passesKindFilter(c) {
    var r = c.data.results || {}, t = c.data.trace || {}, m = c.data.meta || {};
    if (FILTER_KIND === 'flagged')      return flagsCount(t) > 0;
    if (FILTER_KIND === 'lowconf')      return (r.confidence || 0) < 60;
    if (FILTER_KIND === 'escalated')    return r.resolutionPath && r.resolutionPath !== 'standard';
    if (FILTER_KIND === 'uncalibrated') return !(m.calibration && m.calibration.bigScaleType);
    return true;
  }
  function renderList() {
    var q = FILTER.trim().toLowerCase();
    var items = CLIENTS.filter(function(c){
      if (!passesKindFilter(c)) return false;
      if (!q) return true;
      var m = c.data.meta || {};
      return ((m.name||'').toLowerCase().indexOf(q) !== -1) || ((m.email||'').toLowerCase().indexOf(q) !== -1);
    });
    $('clientCount').textContent = anum(CLIENTS.length) + ' نتيجة';
    if (!CLIENTS.length) { $('clientList').innerHTML = '<div class="empty-note" style="margin:10px">لا نتائج بعد.</div>'; return; }
    if (!items.length)   { $('clientList').innerHTML = '<div class="empty-note" style="margin:10px">لا نتائج مطابقة.</div>'; return; }

    $('clientList').innerHTML = items.map(function(c){
      var m = c.data.meta || {}, r = c.data.results || {}, t = c.data.trace || {};
      var conf = r.confidence || 0;
      var fl = flagsCount(t);
      var calibrated = m.calibration && m.calibration.bigScaleType;
      return '<div class="client' + (SELECTED && SELECTED.id === c.id ? ' active' : '') + '" data-id="' + esc(c.id) + '">'
           +   '<div class="avatar">' + ticon(r.typeNum) + '</div>'
           +   '<div class="client-info">'
           +     '<div class="client-name">' + esc(m.name || 'بلا اسم') + '</div>'
           +     '<div class="client-meta"><span class="conf-dot" style="background:' + confColor(conf) + '"></span>'
           +       '<span>ثقة ' + anum(conf) + '</span>'
           +       (fl ? '<span class="flag-mini">⚠ ' + anum(fl) + '</span>' : '')
           +       (calibrated ? '<span style="color:var(--gold)">◈</span>' : '')
           +     '</div>'
           +   '</div>'
           + '</div>';
    }).join('');
  }

  /* ════════ الإحصاء والمعايرة والتوزيع ════════ */
  function completedOnes(){ return CLIENTS.filter(function(c){ return c.data.results && c.data.results.type; }); }
  function avg(arr){ return arr.length ? Math.round(arr.reduce(function(a,b){return a+b;},0)/arr.length) : 0; }

  function renderStats(){
    var done = completedOnes();
    var confs = done.map(function(c){ return c.data.results.confidence || 0; });
    var durs = done.map(function(c){ return (c.data.trace||{}).durationSec || 0; }).filter(Boolean);
    var items = done.map(function(c){ return (c.data.trace||{}).itemsServed || 0; }).filter(Boolean);
    var flagged = done.filter(function(c){ return flagsCount(c.data.trace) > 0; }).length;
    var esc9 = done.filter(function(c){ return c.data.results.resolutionPath !== 'standard'; }).length;
    $('statsRow').innerHTML =
        stat('النتائج المكتملة', anum(done.length))
      + stat('متوسط الثقة', anum(avg(confs)), '/ ١٠٠')
      + stat('متوسط المدة', anum(Math.round(avg(durs)/60)), 'دقيقة')
      + stat('متوسط البنود', anum(avg(items)), 'شاشة')
      + stat('مرّوا بفضّ الاشتباك', anum(esc9), 'من ' + anum(done.length))
      + stat('أعلام صدق', anum(flagged), flagged ? '⚠' : '');
    function stat(k,v,s){ return '<div class="stat"><div class="stat-k">'+k+'</div><div class="stat-v">'+v+(s?' <small>'+s+'</small>':'')+'</div></div>'; }
  }

  function calibStats(){
    var done = completedOnes();
    var cal = done.filter(function(c){ var m=c.data.meta||{}; return m.calibration && m.calibration.bigScaleType; });
    var match = cal.filter(function(c){ return tnum(c.data.meta.calibration.bigScaleType) === tnum(c.data.results.typeNum); }).length;
    var pct = cal.length ? Math.round((match / cal.length) * 100) : null;
    return { total: done.length, calibrated: cal.length, match: match, pct: pct };
  }
  function renderCalib(){
    var s = calibStats();
    var color = s.pct == null ? 'var(--muted)' : (s.pct >= CALIB_THRESHOLD ? 'var(--green)' : 'var(--red)');
    $('calibBox').innerHTML =
        '<div class="calib-head"><span class="calib-title">◈ معايرة المرحلة الخامسة</span>'
      +   '<span style="font-size:12.5px;color:var(--muted)">معايَر: ' + anum(s.calibrated) + ' · مطابق: ' + anum(s.match) + ' · العتبة: ' + anum(CALIB_THRESHOLD) + '٪</span>'
      +   '<span class="calib-pct" style="color:' + color + '">' + (s.pct == null ? '—' : anum(s.pct) + '٪') + '</span></div>'
      + '<div class="calib-bar"><div class="calib-fill" style="width:' + (s.pct||0) + '%;background:' + color + '"></div><div class="calib-th"></div></div>'
      + '<div class="calib-note">سجّل طابع كلّ عميلٍ من المقياس الكبير داخل تفصيلته — والنسبة تُحسب هنا آليًّا. الإطلاق عند ≥ ' + anum(CALIB_THRESHOLD) + '٪ على عيّنة ' + anum(15) + '–' + anum(20) + '.</div>';
  }

  function renderDist(){
    var done = completedOnes();
    var counts = {};
    for (var n=1;n<=9;n++) counts[String(n)] = 0;
    done.forEach(function(c){ var n = tnum(c.data.results.typeNum); if(n) counts[n]++; });
    var max = Math.max.apply(null, Object.keys(counts).map(function(k){ return counts[k]; }).concat([1]));
    $('distRow').innerHTML = Object.keys(counts).map(function(n){
      var h = Math.round((counts[n]/max)*60) + 3;
      return '<div class="dist-col"><div style="font-size:11px;color:var(--muted)">' + anum(counts[n]) + '</div>'
           + '<div class="dist-bar" style="height:'+h+'px"></div>'
           + '<div class="dist-lab">' + ticon(n) + '</div></div>';
    }).join('');
  }

  /* ════════ التفصيلة — تشريح البصمة ════════ */
  function selectClient(id){
    SELECTED = CLIENTS.filter(function(c){ return c.id === id; })[0] || null;
    renderList(); renderDetail();
  }

  function renderDetail(){
    var el = $('detail');
    if (!SELECTED) { el.innerHTML = '<div class="card"><div class="empty-note">اختر عميلًا من القائمة.</div></div>'; return; }
    var d = SELECTED.data, m = d.meta || {}, r = d.results || {}, t = d.trace || {};
    if (!r.type) { el.innerHTML = '<div class="card"><div class="empty-note">هذه الوثيقة بلا نتيجة مكتملة.</div></div>'; return; }
    var h = '';

    /* بطاقة النتيجة */
    var conf = r.confidence || 0;
    var when = (m.lastUpdated && m.lastUpdated.toDate) ? m.lastUpdated.toDate().toLocaleDateString('ar-EG') : '—';
    h += '<div class="card">'
       +   '<div class="hero-line">'
       +     '<span style="font-size:30px">' + ticon(r.typeNum) + '</span>'
       +     '<span class="hero-type">' + esc(tname(r.typeNum)) + '</span>'
       +     '<span class="badge path-' + esc(r.resolutionPath) + '">' + esc(PATH_LABEL[r.resolutionPath] || r.resolutionPath) + '</span>'
       +     (flagsCount(t) ? '<span class="badge flag">⚠ أعلام صدق: ' + anum(flagsCount(t)) + '</span>' : '')
       +     '<div class="conf-wrap"><span style="font-size:12px;color:var(--muted)">الثقة</span>'
       +       '<div class="conf-bar"><div class="conf-fill" style="width:' + conf + '%;background:' + confColor(conf) + '"></div></div>'
       +       '<b class="num" style="color:' + confColor(conf) + '">' + anum(conf) + '</b></div>'
       +   '</div>'
       +   '<div class="kv">'
       +     '<span>الاسم: <b>' + esc(m.name || '—') + '</b></span>'
       +     '<span>البريد: <b>' + esc(m.email || '—') + '</b></span>'
       +     '<span>التاريخ: <b>' + when + '</b></span>'
       +     '<span>الخلية: <b>' + esc(famLabel(r.family)) + ' × ' + esc(behLabel(r.behavior)) + '</b></span>'
       +     '<span>المدة: <b>' + (t.durationSec ? anum(Math.round(t.durationSec/60)) + ' دقيقة' : '—') + '</b></span>'
       +     '<span>الشاشات: <b>' + (t.itemsServed ? anum(t.itemsServed) : '—') + '</b></span>'
       +   '</div>'
       + '</div>';

    /* المعايرة */
    var cal = m.calibration || {};
    var calSel = ['<option value="">— لم يُسجَّل —</option>'];
    for (var n=1;n<=9;n++) calSel.push('<option value="'+n+'"'+(tnum(cal.bigScaleType)===String(n)?' selected':'')+'>'+ticon(n)+' '+esc(TYPE_INFO[String(n)].name)+'</option>');
    var matchHTML = '';
    if (cal.bigScaleType) {
      var matched = tnum(cal.bigScaleType) === tnum(r.typeNum);
      matchHTML = matched ? '<span class="match-yes">✓ مطابقة</span>' : '<span class="match-no">✗ غير مطابقة</span>';
    }
    h += '<div class="card"><h3>◈ المعايرة — الطابع من المقياس الكبير</h3>'
       +   '<div class="calib-row">'
       +     '<select id="calibSelect">' + calSel.join('') + '</select>'
       +     '<button class="tbtn gold" id="calibSave">حفظ</button>'
       +     '<span id="calibMatch">' + matchHTML + '</span>'
       +     '<span id="calibMsg" style="font-size:12px;color:var(--muted)"></span>'
       +   '</div>'
       + '</div>';

    /* البوابتان */
    h += '<div class="card"><h3>البوابتان</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:18px">'
       +   gateBlock('بوابة العائلة', t.gateA, famLabel)
       +   gateBlock('بوابة السلوك', t.gateB, behLabel)
       + '</div></div>';

    /* المرشح والمنافس والأدلة */
    var ev = t.evidence || {};
    var evRows = Object.keys(ev).sort(function(a,b){ return ev[b]-ev[a]; }).map(function(k){
      var isC = ('type'+k) === t.candidate, isR = ('type'+k) === t.rival;
      return '<tr class="' + (isC||isR ? 'hl' : '') + '"><td>' + ticon(k) + ' ' + esc(tname(k)) + (isC?' <b style="color:var(--green)">← المرشح</b>':'') + (isR?' <b style="color:var(--gold)">← المنافس</b>':'') + '</td><td class="num">' + anum(ev[k]) + '</td></tr>';
    }).join('');
    h += '<div class="card"><h3>المرشح والمنافس</h3>'
       +   '<div class="kv" style="margin:0 0 12px"><span>المنافس اكتُشف بـ: <b>' + esc(SRC_LABEL[t.rivalSource] || t.rivalSource || '—') + '</b></span>'
       +   '<span>صافي التأكيد: <b class="num">' + anum(t.confirmNet != null ? t.confirmNet : '—') + '</b></span></div>'
       +   '<table class="t"><tr><th>الطابع</th><th>مجموع الأدلة</th></tr>' + evRows + '</table>'
       + '</div>';

    /* تصويت التأكيد */
    if (Array.isArray(t.confirmations) && t.confirmations.length) {
      h += '<div class="card"><h3>تصويت التأكيد</h3><table class="t"><tr><th>البند</th><th>جهته</th><th>التقييم</th><th>صوته</th></tr>'
         + t.confirmations.map(function(v){
             var voteTxt = v.vote === 'candidate' ? '<span style="color:var(--green)">للمرشح</span>' : v.vote === 'rival' ? '<span style="color:var(--gold)">للمنافس</span>' : '<span style="color:var(--muted)">امتناع</span>';
             return '<tr><td class="num">' + esc(v.itemId) + '</td><td>' + (v.side==='candidate'?'مودويل المرشح':'مودويل المنافس') + '</td><td class="num">' + anum(v.rating) + '</td><td>' + voteTxt + '</td></tr>';
           }).join('')
         + '</table></div>';
    }

    /* فض الاشتباك */
    if (t.dispute && Array.isArray(t.dispute.steps) && t.dispute.steps.length) {
      h += '<div class="card"><h3>فضّ الاشتباك — زوج ' + esc(t.dispute.pair) + (t.dispute.hasBattery ? ' (بطارية جاهزة)' : ' (تعرّف مركّب)') + '</h3>'
         +   '<div class="steps">'
         +   t.dispute.steps.map(function(s){
               return '<span class="step-chip"><b>' + esc(STEP_LABEL[s.step] || s.step) + '</b> · صافي ' + anum(s.net != null ? (s.net>=0?'+':'')+s.net : '—') + '</span>';
             }).join('')
         +   '</div>'
         + '</div>';
    }

    /* جهاز الصدق */
    var cf = t.consistencyFlags || [];
    h += '<div class="card"><h3>جهاز الصدق</h3>'
       +   '<div class="kv" style="margin:0">'
       +     '<span>أعلام الاتساق: <b style="color:' + (cf.length ? 'var(--red)' : 'var(--green)') + '">' + anum(cf.length) + '</b>'
       +       (cf.length ? ' <span style="color:var(--muted)">(' + cf.map(function(f){ return esc(f.pair); }).join('، ') + ')</span>' : '') + '</span>'
       +     '<span>بند الانتباه: <b style="color:' + (t.attentionFlagged ? 'var(--red)' : 'var(--green)') + '">' + (t.attentionFlagged ? '⚠ مرفوع' : 'سليم') + '</b></span>'
       +   '</div>'
       + '</div>';

    /* المسارات */
    var rk = r.axesRanking || {}, sums = (r.lean || {}).sums || {};
    var maxA = 1; (rk.ranking||[]).forEach(function(x){ if(x.action > maxA) maxA = x.action; });
    h += '<div class="card"><h3>المسارات الثلاثة</h3><div class="mini-bars">'
       + (rk.ranking||[]).map(function(x){
           var role = x.axisId === rk.primaryAxis ? 'رئيسي' : x.axisId === rk.repressedAxis ? 'مدفون' : 'داعم';
           return '<div class="mb-row"><span class="mb-name">' + esc(axLabel(x.axisId)) + ' <span style="color:var(--dim)">(' + role + ')</span></span>'
                + '<div class="mb-track"><div class="mb-fill" style="width:' + Math.round((x.action/maxA)*100) + '%"></div></div>'
                + '<span class="mb-val num">' + anum(x.action) + '</span></div>';
         }).join('')
       + '</div><div class="kv"><span>المدفون مؤكَّد: <b>' + (rk.repressedConfirmed ? 'نعم' : 'لا') + '</b></span>'
       + '<span>ترتيب إجباري: <b>' + ((r.lean||{}).rankApplied ? 'قُدِّم' : 'لم يلزم') + '</b></span>'
       + '<span>إشارة ضعيفة: <b>' + ((r.lean||{}).weakSignal ? 'نعم' : 'لا') + '</b></span></div></div>';

    /* الطيف */
    var worstId = r.worstStrength ? r.worstStrength.id : null;
    h += '<div class="card"><h3>خريطة القوى التسع</h3><table class="t">'
       +   '<tr><th>القوة</th><th>الموقع</th><th>اتزان</th><th>إفراط</th><th>تفريط</th><th>المسافة</th></tr>'
       + (r.strengths||[]).map(function(s){
           return '<tr class="' + (s.id === worstId ? 'hl' : '') + '">'
                + '<td>' + esc(s.name) + (s.id === worstId ? ' <b style="color:var(--gold)">← الأشدّ نزفًا</b>' : '') + '</td>'
                + '<td><span class="pos-chip pos-' + esc(s.position) + '">' + esc(POS_LABEL[s.position] || s.position) + '</span></td>'
                + '<td class="num">' + anum(s.balance) + '</td><td class="num">' + anum(s.excess) + '</td>'
                + '<td class="num">' + anum(s.deficit) + '</td><td class="num">' + anum(s.distance) + '</td></tr>';
         }).join('')
       + '</table></div>';

    el.innerHTML = h;

    /* حفظ المعايرة */
    var cs = $('calibSave');
    if (cs) cs.addEventListener('click', function(){
      var val = $('calibSelect').value || null;
      var payload = { meta: { calibration: val ? { bigScaleType: val, recordedAt: new Date().toISOString() } : firebase.firestore.FieldValue.delete() } };
      cs.disabled = true; $('calibMsg').textContent = 'جارٍ الحفظ…';
      db.collection(COLLECTION).doc(SELECTED.id).set(payload, { merge: true })
        .then(function(){
          $('calibMsg').textContent = 'تمّ ✓';
          if (val) SELECTED.data.meta.calibration = { bigScaleType: val };
          else if (SELECTED.data.meta) delete SELECTED.data.meta.calibration;
          renderCalib(); renderList(); renderDetail();
        })
        .catch(function(err){ $('calibMsg').textContent = 'تعذّر الحفظ: ' + (err && err.message || err); })
        .then(function(){ cs.disabled = false; });
    });
  }

  function gateBlock(title, g, labelFn){
    g = g || {}; var sums = g.sums || {};
    var keys = Object.keys(sums);
    var max = Math.max.apply(null, keys.map(function(k){ return sums[k]; }).concat([1]));
    return '<div><div style="font-size:13px;color:var(--muted);margin-bottom:8px">' + esc(title)
      + ' · هامش <b class="num">' + anum(g.margin != null ? g.margin : '—') + '</b>'
      + (g.close ? ' <span style="color:var(--gold)">(متقاربة)</span>' : '') + '</div>'
      + '<div class="mini-bars">'
      + keys.map(function(k){
          return '<div class="mb-row"><span class="mb-name">' + esc(labelFn(k)) + '</span>'
               + '<div class="mb-track"><div class="mb-fill" style="width:' + Math.round((sums[k]/max)*100) + '%"></div></div>'
               + '<span class="mb-val num">' + anum(sums[k]) + '</span></div>';
        }).join('')
      + '</div></div>';
  }

  /* ════════ تصدير CSV (وقود المعايرة خارج اللوحة) ════════ */
  function exportCSV(){
    var rows = [['userId','name','email','type','confidence','resolutionPath','flags','durationSec','itemsServed','bigScaleType','match']];
    completedOnes().forEach(function(c){
      var m = c.data.meta || {}, r = c.data.results || {}, t = c.data.trace || {};
      var big = (m.calibration && m.calibration.bigScaleType) ? tnum(m.calibration.bigScaleType) : '';
      var match = big ? (big === tnum(r.typeNum) ? '1' : '0') : '';
      rows.push([c.id, m.name || '', m.email || '', r.typeNum || '', r.confidence != null ? r.confidence : '',
                 r.resolutionPath || '', flagsCount(t), t.durationSec || '', t.itemsServed || '', big, match]);
    });
    var csv = '\uFEFF' + rows.map(function(row){
      return row.map(function(v){ v = String(v==null?'':v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }).join(',');
    }).join('\n');
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'rapid-fingerprint-calibration.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }

  /* كشف داخلي للفحص الآلي */
  window.__RAPID_ADMIN_TEST = { loadClients: loadClients, selectClient: selectClient, calibStats: calibStats, exportCSV: exportCSV };
})();
</script>
</body>
</html>
