<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>منظور البصمة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* ══════════════════════════════════════════════════════════════
       كل القواعد ببادئة .rf- لتفادي أيّ تصادم حين تتعايش هذه الصفحة
       مع المقاييس الشقيقة داخل صفحةٍ ضامّة. الهويّة البصريّة نفسها
       (نفس لوحة three-axes/course-view حرفيًّا).
       ══════════════════════════════════════════════════════════════ */
    :root{
      --rf-bg:#0f172a; --rf-bg2:#1a2332; --rf-blue:#3b82f6; --rf-green:#10b981;
      --rf-gold:#fbbf24; --rf-purple:#a78bfa; --rf-text:#e2e8f0; --rf-muted:#94a3b8;
      --rf-line:#2a3850; --rf-card:#16202e; --rf-serif:'Amiri',serif;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      background:radial-gradient(1200px 620px at 50% -12%, #1a2332 0%, #0f172a 62%);
      color:var(--rf-text); font-family:'Tajawal',sans-serif; min-height:100vh;
      -webkit-font-smoothing:antialiased; line-height:1.9;
    }
    #rapid-fp-root{ max-width:680px; margin:0 auto; padding:42px 18px 90px; }

    .rf-card{
      background:linear-gradient(180deg, rgba(22,32,46,.92), rgba(15,23,42,.72));
      border:1px solid var(--rf-line); border-radius:18px; padding:32px 28px;
      box-shadow:0 22px 54px rgba(0,0,0,.38); animation:rfFade .5s ease;
    }
    @keyframes rfFade{ from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }

    .rf-centered{ text-align:center; }
    .rf-tag{ color:var(--rf-gold); font-size:14px; letter-spacing:.5px; margin-bottom:18px; font-family:var(--rf-serif); }
    .rf-core{ font-size:23px; font-weight:700; line-height:1.8; margin-bottom:18px; font-family:var(--rf-serif); }
    .rf-reminder{ color:var(--rf-muted); font-size:15px; margin-bottom:24px; }
    .rf-reveal{ font-size:26px; font-weight:700; color:var(--rf-green); text-align:center;
      font-family:var(--rf-serif); margin:18px 0 22px; }
    .rf-p{ font-size:17px; line-height:2; color:#cbd5e1; margin:0 0 14px; }
    .rf-lead-line{ font-size:18px; color:var(--rf-text); }

    .rf-btn{ border:none; cursor:pointer; font-family:inherit; font-size:16px; font-weight:700;
      padding:13px 30px; border-radius:12px; transition:transform .15s, box-shadow .15s, background .2s; }
    .rf-btn.primary{ background:var(--rf-blue); color:#fff; box-shadow:0 8px 22px rgba(59,130,246,.30); }
    .rf-btn.primary:hover{ transform:translateY(-2px); }
    .rf-btn.primary:disabled{ opacity:.4; cursor:not-allowed; transform:none; box-shadow:none; }
    .rf-btn.ghost{ background:transparent; color:var(--rf-text); border:1px solid var(--rf-line); }
    .rf-btn.ghost:hover{ border-color:var(--rf-blue); }

    .rf-progress-row{ display:flex; align-items:center; gap:14px; margin-bottom:26px; }
    .rf-progress-label{ color:var(--rf-muted); font-size:13px; white-space:nowrap; }
    .rf-progress-bar{ flex:1; height:6px; background:#22304a; border-radius:99px; overflow:hidden; }
    .rf-progress-fill{ height:100%; background:linear-gradient(90deg,var(--rf-blue),var(--rf-green)); transition:width .4s; }

    .rf-intro{ background:rgba(59,130,246,.06); border:1px solid rgba(59,130,246,.22);
      border-radius:14px; padding:18px 20px; margin-bottom:24px;
      color:#cbd5e1; font-size:15.5px; line-height:2; }
    .rf-question{ font-size:21px; font-weight:700; line-height:1.7; margin-bottom:16px; }
    .rf-question-hint{ color:var(--rf-muted); font-size:14.5px; line-height:1.95; margin:-6px 0 20px; }

    /* خيارات ثلاثيّة (البوابتان والمسارات) */
    .rf-options{ display:flex; flex-direction:column; gap:22px; margin-bottom:24px; }
    .rf-option{ background:#101a28; border:1px solid var(--rf-line); border-radius:14px; padding:18px 18px 14px; }
    .rf-option-text{ display:flex; gap:12px; align-items:flex-start; font-size:17px; line-height:1.85; margin-bottom:16px; }
    .rf-option-hint{ color:var(--rf-muted); font-size:14px; line-height:1.9; margin:-8px 0 14px 0; padding-inline-start:44px; }
    .rf-letter{ flex:0 0 32px; height:32px; border-radius:50%; background:#1c2a40; color:var(--rf-gold);
      display:flex; align-items:center; justify-content:center; font-weight:700; }

    /* عبارة مفردة (التأكيد والطيف) */
    .rf-statement-text{ font-size:20px; font-weight:700; line-height:1.8; margin-bottom:14px; }
    .rf-statement-hint{ color:var(--rf-muted); font-size:14.5px; line-height:1.95; margin-bottom:22px; }

    /* ليكرت */
    .rf-scale{ display:flex; gap:10px; justify-content:flex-start; flex-wrap:wrap; }
    .rf-likert{ width:46px; height:46px; border-radius:50%; border:1px solid var(--rf-line);
      background:#101a28; color:var(--rf-text); font-family:inherit; font-size:16px; font-weight:700;
      cursor:pointer; transition:all .15s; }
    .rf-likert:hover{ border-color:var(--rf-green); background:#13202f; transform:translateY(-2px); color:var(--rf-green); }
    .rf-likert.selected{ background:linear-gradient(135deg, var(--rf-blue), var(--rf-green));
      border-color:var(--rf-blue); color:#fff; transform:scale(1.12); }
    .rf-scale-labels{ display:flex; justify-content:space-between; color:var(--rf-muted); font-size:12px; margin-top:8px; }

    /* الاختيار الثنائي: بطاقتا وصف (مبارزات/جذور) */
    .rf-choices{ display:flex; flex-direction:column; gap:18px; margin-bottom:24px; }
    .rf-choice{ background:#101a28; border:1px solid var(--rf-line); border-radius:14px;
      padding:20px 18px; cursor:pointer; transition:border-color .15s, background .15s, transform .15s; }
    .rf-choice:hover{ border-color:var(--rf-blue); transform:translateY(-2px); }
    .rf-choice.selected{ border-color:var(--rf-gold); background:#152238;
      box-shadow:0 0 0 1px var(--rf-gold), 0 10px 26px rgba(251,191,36,.10); }
    .rf-choice-head{ margin-bottom:12px; }
    .rf-choice-text{ font-size:16.5px; line-height:1.95; }
    .rf-choice-hint{ color:var(--rf-muted); font-size:14px; line-height:1.9; margin-top:12px; }

    /* أصوات التعرّف المرآتي — اقتباسٌ بخطّ أميري */
    .rf-choice.rf-voice{ background:rgba(167,139,250,.05); border-color:rgba(167,139,250,.28); }
    .rf-choice.rf-voice.selected{ border-color:var(--rf-gold); background:#1a2238; }
    .rf-voice-text{ font-family:var(--rf-serif); font-size:18px; line-height:2.1; color:#d7dcf0; }

    /* الترتيب الإجباري باللمس */
    .rf-rank-list{ display:flex; flex-direction:column; gap:16px; margin-bottom:14px; }
    .rf-rank-row{ display:flex; gap:14px; align-items:flex-start; background:#101a28;
      border:1px solid var(--rf-line); border-radius:14px; padding:18px; cursor:pointer;
      transition:border-color .15s, background .15s; }
    .rf-rank-row:hover{ border-color:var(--rf-blue); }
    .rf-rank-row.ranked{ border-color:var(--rf-green); background:#12202e; }
    .rf-rank-badge{ flex:0 0 34px; height:34px; border-radius:50%; background:var(--rf-green);
      color:#08131f; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:16px; }
    .rf-rank-badge.rf-rank-empty{ background:transparent; border:1px dashed var(--rf-line); }
    .rf-rank-body{ flex:1; }
    .rf-rank-tools{ margin-bottom:18px; }

    .rf-nav{ display:flex; gap:12px; margin-top:8px; }
    .rf-actions{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:8px; }

    .rf-spinner{ width:34px; height:34px; border:3px solid #22304a; border-top-color:var(--rf-blue);
      border-radius:50%; margin:0 auto 18px; animation:rfSpin .9s linear infinite; }
    @keyframes rfSpin{ to{ transform:rotate(360deg); } }
    .rf-saving{ color:var(--rf-muted); font-size:16px; text-align:center; }

    @media(max-width:520px){
      .rf-card{ padding:22px 16px; }
      .rf-question{ font-size:19px; }
      .rf-likert{ width:42px; height:42px; }
      .rf-voice-text{ font-size:16.5px; }
    }
  </style>
</head>
<body>

  <!-- حاوية المودويل: أيّ صفحة ضامّة تضمّ هذا العنصر حيث تشاء -->
  <div id="rapid-fp-root"></div>

  <!-- ١) Firebase SDK 8.10.1 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <!-- ٢) تهيئة Firebase (نفس قيم المشروع) -->
  <script src="../js/firebase-config.js"></script>

  <!-- ٣) البيانات ثمّ البنية ثمّ المحرّك -->
  <script src="rapid-questions.js"></script>
  <script src="rapid-config.js"></script>
  <script src="rapid-engine.js"></script>

  <!-- ٤) المخزن ثمّ العرض ثمّ التطبيق -->
  <script src="rapid-store.js"></script>
  <script src="rapid-render.js"></script>
  <script src="rapid-app.js"></script>

  <!-- ٥) الإقلاع -->
  <script>
    (function(){
      function run(){
        if(window.RAPID_APP) window.RAPID_APP.init({
          rootId: 'rapid-fp-root',
          loginPath: '../login.html',
          reportPath: 'report.html'
        });
      }
      if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run);
      else run();
    })();
  </script>
</body>
</html>
