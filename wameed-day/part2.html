<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>يوم وميض — الجزء الثاني · الإنذار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;500;600;700&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141310; --ink-2:#1c1a15; --ink-3:#26221b;
    --bone:#ece4d4; --bone-dim:#a89c85; --bone-faint:#6f6555;
    --ember:#e8a24a; --ember-deep:#c7742a; --ember-glow:rgba(232,162,74,.16);
    --calm:#89b3a8; --info:#8aa6c8; --danger:#d8654e;
    --line:rgba(236,228,212,.12); --line-2:rgba(236,228,212,.06);
    --display:'Reem Kufi', system-ui, sans-serif;
    --body:'Tajawal', system-ui, sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    background:
      radial-gradient(120% 90% at 80% -10%, rgba(232,162,74,.08), transparent 55%),
      radial-gradient(90% 80% at 15% 110%, rgba(137,179,168,.05), transparent 50%),
      var(--ink);
    color:var(--bone); font-family:var(--body);
    -webkit-font-smoothing:antialiased; user-select:none;
  }
  #progress{position:fixed;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--ember-deep),var(--ember));
    box-shadow:0 0 14px var(--ember-glow);z-index:60;transition:width .5s cubic-bezier(.2,.7,.2,1);width:0}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:6vh 7vw}
  .slide{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    padding:7vh 8vw;flex-direction:column;text-align:center;opacity:0;transition:opacity .6s ease}
  .slide.on{display:flex;opacity:1}
  .wrap{max-width:1100px;width:100%;display:flex;flex-direction:column;align-items:center;gap:2.4vh}

  .eyebrow{font-weight:700;letter-spacing:.14em;color:var(--ember);font-size:clamp(13px,1.5vw,17px);opacity:.9}
  .eyebrow.calm{color:var(--calm)}.eyebrow.danger{color:var(--danger)}.eyebrow.info{color:var(--info)}
  h1{font-family:var(--display);font-weight:600;line-height:1.28;font-size:clamp(30px,5.4vw,64px);letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:500;line-height:1.35;font-size:clamp(24px,3.6vw,42px)}
  .lead{font-size:clamp(18px,2.3vw,28px);line-height:1.85;color:var(--bone);font-weight:400;max-width:900px}
  .dim{color:var(--bone-dim)}.faint{color:var(--bone-faint)}.glow{color:var(--ember)}.cool{color:var(--calm)}
  .big-line{font-family:var(--display);font-size:clamp(30px,5vw,58px);line-height:1.4;font-weight:600}
  .rule{width:64px;height:2px;background:var(--ember);opacity:.6;border:none;box-shadow:0 0 12px var(--ember-glow)}
  .rule.wide{width:min(520px,70%)}
  .stack{display:flex;flex-direction:column;gap:1.3vh;align-items:center}
  .mark{display:flex;flex-direction:column;align-items:center;gap:1.6vh}
  .mark .ar{font-family:var(--display);font-weight:700;font-size:clamp(40px,7vw,86px);color:var(--bone)}

  /* notification (clickable) */
  .notif{width:100%;max-width:760px;background:linear-gradient(180deg,var(--ink-2),var(--ink));
    border:1px solid var(--line);border-radius:16px;padding:2.4vh 2vw;cursor:pointer;
    display:flex;flex-direction:column;gap:1vh;align-items:flex-start;text-align:right;transition:transform .2s, border-color .2s}
  .notif:hover{transform:translateY(-2px);border-color:var(--ember)}
  .notif .head{display:flex;align-items:center;gap:.8rem;width:100%;justify-content:space-between}
  .notif .app{color:var(--bone-dim);font-size:clamp(13px,1.5vw,17px)}
  .notif .flag{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:clamp(12px,1.4vw,15px)}
  .notif .flag.urgent{color:var(--danger)}
  .notif .flag.personal{color:var(--calm)}
  .notif .dotpulse{width:11px;height:11px;border-radius:50%;background:currentColor;animation:blink 1.1s infinite}
  @keyframes blink{0%,100%{opacity:1;box-shadow:0 0 0 0 currentColor}50%{opacity:.35;box-shadow:0 0 10px 2px currentColor}}
  .notif .from{color:var(--bone);font-weight:700;font-size:clamp(15px,1.9vw,22px)}
  .notif .subj{color:var(--bone-dim);font-size:clamp(13px,1.6vw,18px)}
  .notif .open{align-self:center;margin-top:.6vh;color:var(--ember);font-size:clamp(12px,1.4vw,15px);letter-spacing:.05em}

  /* mail card */
  .mail{width:100%;max-width:900px;text-align:right;background:linear-gradient(180deg,var(--ink-2),var(--ink));
    border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .mail .top{background:var(--ink-3);padding:1.6vh 1.8vw;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:.4vh}
  .mail .badge{align-self:flex-start;font-size:clamp(11px,1.2vw,13px);font-weight:700;letter-spacing:.06em;padding:.3em .9em;border-radius:999px}
  .badge.urgent{background:rgba(216,101,78,.16);color:var(--danger)}
  .badge.personal{background:rgba(137,179,168,.16);color:var(--calm)}
  .badge.founder{background:rgba(232,162,74,.14);color:var(--ember)}
  .mail .from{color:var(--bone-dim);font-size:clamp(12.5px,1.4vw,16px)}
  .mail .from b{color:var(--bone);font-weight:700}
  .mail .subj{color:var(--bone);font-weight:700;font-size:clamp(15px,1.8vw,21px)}
  .mail .body{padding:2.2vh 1.8vw;font-size:clamp(14px,1.65vw,19px);line-height:1.9;color:var(--bone)}
  .mail .sig{margin-top:1.4vh;color:var(--bone-dim);font-size:.92em}

  /* info card (hidden, jump-only) */
  .card{width:100%;max-width:860px;text-align:right;border-radius:16px;overflow:hidden;
    background:linear-gradient(180deg,var(--ink-2),var(--ink));border:1px solid var(--line)}
  .card .ch{padding:1.5vh 1.8vw;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.9rem}
  .card .fam{font-size:clamp(11px,1.3vw,14px);font-weight:800;letter-spacing:.04em;padding:.3em 1em;border-radius:999px}
  .fam.a{background:rgba(138,166,200,.15);color:var(--info)}
  .fam.b{background:rgba(137,179,168,.15);color:var(--calm)}
  .card .ct{color:var(--bone);font-weight:700;font-size:clamp(15px,1.9vw,22px)}
  .card .cb{padding:2vh 1.8vw;font-size:clamp(14px,1.6vw,18.5px);line-height:1.9}
  .card .cb .k{color:var(--ember);font-weight:700}
  .card .src{padding:1.2vh 1.8vw;background:var(--ink-3);border-top:1px solid var(--line);color:var(--bone-faint);font-size:clamp(11.5px,1.3vw,14px)}

  /* consequence card */
  .conseq{width:100%;max-width:880px;text-align:right;border-radius:16px;overflow:hidden;
    background:linear-gradient(180deg,rgba(232,162,74,.06),var(--ink));border:1px solid rgba(232,162,74,.28)}
  .conseq .qh{padding:1.6vh 1.9vw;border-bottom:1px solid var(--line)}
  .conseq .qe{color:var(--ember);font-weight:700;letter-spacing:.06em;font-size:clamp(12px,1.4vw,15px)}
  .conseq .qt{color:var(--bone);font-family:var(--display);font-size:clamp(19px,2.4vw,28px);margin-top:.5vh}
  .conseq .qb{padding:2.2vh 1.9vw;font-size:clamp(14.5px,1.7vw,19px);line-height:2;color:var(--bone)}
  .conseq .qb p{margin-bottom:1.2vh}
  .conseq .foot{padding:1.4vh 1.9vw;background:var(--ink-3);border-top:1px solid var(--line);
    color:var(--ember-deep);font-style:italic;font-size:clamp(13px,1.5vw,17px)}

  /* tasks / round / etc reused */
  .mission{width:100%;max-width:840px;text-align:right;display:flex;flex-direction:column;gap:1.2vh}
  .mission .mi{display:flex;gap:1rem;align-items:baseline;font-size:clamp(15px,1.85vw,21px);line-height:1.5}
  .mission .mi .n{font-family:var(--display);color:var(--ember);min-width:1.3em}
  .mission .mi .lbl{color:var(--bone)}.mission .mi .lbl b{color:var(--ember);font-weight:700}

  .round{width:100%;max-width:820px;text-align:right;display:flex;flex-direction:column;gap:1.4vh}
  .round .r{font-size:clamp(16px,2vw,24px);line-height:1.6}

  /* chest */
  .chest{display:flex;gap:clamp(1.4rem,5vw,4rem);align-items:center;justify-content:center;margin:1vh 0}
  .chest .opt{display:flex;flex-direction:column;align-items:center;gap:1.2vh}
  .chest .dot{width:clamp(46px,7vw,84px);height:clamp(46px,7vw,84px);border-radius:50%;border:2px solid var(--line-2)}
  .chest .d1{border-color:rgba(216,101,78,.5);background:radial-gradient(circle,rgba(216,101,78,.12),transparent)}
  .chest .d2{border-color:rgba(168,156,133,.5)}
  .chest .d3{border-color:rgba(137,179,168,.55);background:radial-gradient(circle,rgba(137,179,168,.12),transparent)}
  .chest .lbl{font-family:var(--display);font-size:clamp(16px,2vw,24px)}
  .chest .l1{color:var(--danger)}.chest .l2{color:var(--bone-dim)}.chest .l3{color:var(--calm)}

  /* unit / tool */
  .unit-tag{font-weight:800;color:var(--ember);letter-spacing:.05em;font-size:clamp(14px,1.6vw,18px)}
  .tools3{display:grid;grid-template-columns:1fr;gap:1.3vh;width:100%;max-width:900px;text-align:right}
  .t3{border:1px solid var(--line);border-radius:14px;padding:1.6vh 1.6vw;display:flex;flex-direction:column;gap:.5vh}
  .t3 .th{font-family:var(--display);font-size:clamp(17px,2vw,23px)}
  .t3.a .th{color:var(--info)}.t3.b .th{color:var(--calm)}.t3.c .th{color:var(--ember)}
  .t3 .tq{color:var(--bone);font-size:clamp(13.5px,1.55vw,17px)}
  .t3 .tf{color:var(--bone-dim);font-size:clamp(12.5px,1.4vw,15px)}
  .tool{width:100%;max-width:820px;border:1px solid var(--line);border-radius:16px;
    background:linear-gradient(180deg,rgba(232,162,74,.05),transparent);padding:3vh 2vw;text-align:right;display:flex;flex-direction:column;gap:1.6vh}
  .tool .thh{font-family:var(--display);color:var(--ember);font-size:clamp(19px,2.3vw,26px)}
  .tool .quote{font-size:clamp(16px,2vw,23px);line-height:1.8;color:var(--bone);padding-right:1.2rem;border-right:3px solid var(--ember)}
  .tool .why{color:var(--bone-dim);font-size:clamp(13.5px,1.55vw,17px);line-height:1.7}
  .fam2{display:grid;grid-template-columns:1fr 1fr;gap:1.2vh 2vw;width:100%;max-width:900px;text-align:right}
  .fam2 .col{display:flex;flex-direction:column;gap:.8vh}
  .fam2 .ch{font-weight:800;font-size:clamp(14px,1.6vw,18px)}
  .fam2 .ch.a{color:var(--info)}.fam2 .ch.b{color:var(--calm)}
  .fam2 .it{color:var(--bone);font-size:clamp(13.5px,1.5vw,17px);line-height:1.5}

  .principles{display:flex;flex-direction:column;gap:2vh;width:100%;max-width:860px;text-align:right}
  .principles .p{display:flex;gap:1.1rem;align-items:flex-start}
  .principles .pn{font-family:var(--display);color:var(--ember);font-size:clamp(22px,2.6vw,32px);min-width:1.3em}
  .principles .pt{font-size:clamp(15px,1.75vw,21px);line-height:1.6}
  .principles .pt b{color:var(--bone);font-weight:700}
  .principles .pt span{color:var(--bone-dim);display:block;margin-top:.3vh;font-size:.92em}

  .timer{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;
    font-size:clamp(64px,13vw,150px);line-height:1;color:var(--bone);cursor:pointer;transition:color .3s,text-shadow .3s;position:relative}
  .timer.run{color:var(--ember);text-shadow:0 0 40px var(--ember-glow)}
  .timer.warn{color:var(--danger);text-shadow:0 0 40px rgba(216,101,78,.3);animation:pulse 1.1s infinite}
  .timer.done{color:var(--danger)}
  .timer-hint{color:var(--bone-faint);font-size:clamp(12px,1.4vw,15px);margin-top:1.4vh}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

  #chrome{position:fixed;inset:auto 0 0 0;display:flex;justify-content:space-between;align-items:center;padding:2.2vh 3vw;pointer-events:none;z-index:50}
  #snum{color:var(--bone-faint);font-size:13px;letter-spacing:.08em;font-variant-numeric:tabular-nums}
  #mark-sm{color:var(--bone-faint);font-family:var(--display);font-size:15px;letter-spacing:.1em}
  #mark-sm b{color:var(--ember);opacity:.75}
  #jump{position:fixed;bottom:2vh;left:50%;transform:translateX(-50%);z-index:70;background:var(--ink-3);border:1px solid var(--ember);color:var(--ember);font-family:var(--display);padding:.5em 1.1em;border-radius:10px;font-size:20px;letter-spacing:.15em;display:none}

  #faci{position:fixed;inset:auto 0 0 0;max-height:82vh;overflow-y:auto;z-index:80;
    background:linear-gradient(180deg,#0d0c0a,#141310);border-top:2px solid var(--ember);
    transform:translateY(101%);transition:transform .45s cubic-bezier(.2,.8,.2,1);padding:3vh 4vw 5vh;box-shadow:0 -30px 60px rgba(0,0,0,.6)}
  #faci.open{transform:translateY(0)}
  #faci .fhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:2vh;padding-bottom:1.5vh;border-bottom:1px solid var(--line)}
  #faci .ftitle{font-family:var(--display);color:var(--ember);font-size:clamp(16px,2vw,22px)}
  #faci .fclose{color:var(--bone-dim);font-size:13px;border:1px solid var(--line);border-radius:8px;padding:.4em .9em;cursor:pointer}
  #faci-body{display:flex;flex-direction:column;gap:1.6vh;text-align:right;line-height:1.75;font-size:clamp(14px,1.55vw,17.5px)}
  .blk{border-right:4px solid;padding:1.2vh 1.3vw;border-radius:0 10px 10px 0;background:rgba(255,255,255,.02)}
  .blk .bt{font-weight:800;font-size:.82em;letter-spacing:.05em;margin-bottom:.5vh;display:block}
  .say{border-color:var(--ember)} .say .bt{color:var(--ember)} .say .q{color:var(--bone);font-weight:500}
  .do{border-color:var(--calm)} .do .bt{color:var(--calm)}
  .warn{border-color:var(--danger)} .warn .bt{color:var(--danger)}
  .watch{border-color:var(--bone-dim)} .watch .bt{color:var(--bone-dim)}
  .blk ul{margin:.4vh 1.2rem 0;padding:0}.blk li{margin:.3vh 0}
  #faci .why-note{color:var(--bone-dim);font-size:.9em}

  #help{position:fixed;top:2vh;left:2vw;z-index:70;color:var(--bone-faint);font-size:12px;background:var(--ink-2);border:1px solid var(--line);border-radius:8px;padding:.5em .8em;line-height:1.7;text-align:right;max-width:240px;opacity:0;transition:opacity .3s;pointer-events:none}
  #help.show{opacity:1}#help b{color:var(--ember)}

  @media (max-width:760px){.fam2,.tools3{grid-template-columns:1fr}.chest{gap:1.2rem}}
  @media (prefers-reduced-motion:reduce){.slide{transition:none}.timer.warn{animation:none}.notif .dotpulse{animation:none}}
</style>
</head>
<body>
  <div id="progress"></div>
  <div id="stage"></div>
  <div id="chrome"><span id="snum"></span><span id="mark-sm"><b>◆</b> وميض</span></div>
  <div id="jump"></div>
  <div id="help">
    <b>الأسهم / مسافة</b> تنقّل<br><b>رقم + Enter</b> قفزة لكارت/شريحة<br><b>Esc</b> رجوع من الكارت<br><b>N</b> شرح الميسّر<br>
    <span style="color:var(--danger)">الكروت (٢١–٣٤ · ٤١–٤٤) بتظهر بالرقم بس</span>
  </div>
  <div id="faci">
    <div class="fhead"><span class="ftitle">🎙️ شرح الميسّر</span><span class="fclose" onclick="toggleFaci()">إغلاق ✕</span></div>
    <div id="faci-body"></div>
  </div>

<script>
const SLIDES=[

/* ===== CHAPTER 2 — visible flow ===== */
{id:25, body:`
  <div class="wrap">
    <div class="notif" onclick="openMail()">
      <div class="head">
        <span class="app">📥 البريد الوارد — وميض للتدريب</span>
        <span class="flag urgent"><span class="dotpulse"></span>عاجل</span>
      </div>
      <span class="from">أ. خالد المهدي — المدير التنفيذي، مجموعة مدارس المستقبل</span>
      <span class="subj">الموضوع: مستقبل التعاقد — للأهمية القصوى</span>
      <span class="open">▸ اضغط على الرسالة لفتحها</span>
    </div>
  </div>`,
 notes:`
  <div class="blk do"><span class="bt">🟢 اعمل</span> يدخلوا من البريك يلاقوا الإشعار بيرمش. استنى الكل يقعد ويهدى. سيبهم يتوتروا — اسكت ١٠ ثواني كاملة.</div>
  <div class="blk say"><span class="bt">🟡 قول</span> <span class="q">«إن شاء الله البريك عجبكم... وإنتو بره... وصل إيميل.»</span></div>
  <div class="blk do"><span class="bt">🟢 اعمل</span> دوس على الإشعار نفسه → هترن رنة وهيفتح الإيميل لوحده. متقولش أي حاجة تانية — خلي الرنة هي الكلام.</div>`},

{id:26, body:`
  <div class="mail">
    <div class="top">
      <span class="badge urgent">عاجل</span>
      <span class="from">من: <b>خالد المهدي</b> — المدير التنفيذي، مجموعة مدارس المستقبل</span>
      <span class="subj">مستقبل التعاقد — للأهمية القصوى</span>
    </div>
    <div class="body">
      تحية طيبة، أكتب لكم بصراحةٍ تليق بشراكة ثلاث سنوات.<br>
      جودة آخر برنامجين انخفضت بشكل ملحوظ. تقييمات مدرّسينا تقول إن مدربيكم مرهقون ويكرّرون أنفسهم، وأولياء الأمور بدأوا يلاحظون.<br>
      ووصلنا عرض رسمي من شركة منافسة بسعر أقل من سعركم بنسبة ٢٥٪، مع منصة إلكترونية حديثة لمتابعة الطلاب.<br>
      نحن نقدّر تاريخنا معكم، ولهذا أمنحكم ١٤ يومًا لتقديم خطة واضحة تعالج ما يحدث. بعدها سيتخذ مجلس إدارتنا قراره بشأن تجديد العقد.
      <div class="sig">خالد المهدي — المدير التنفيذي، مجموعة مدارس المستقبل</div>
    </div>
  </div>`,
 notes:`
  <div class="blk do"><span class="bt">🟢 اعمل</span> اقرا الإيميل كامل، ببطء، بصوت رسمي هادي. إنت مش زعلان ومش بتمثّل غضب — إنت صوت راجل واثق بيدّي مهلة أخيرة، وده أخطر من الزعيق. وقّف ثانية بعد «٢٥٪»، وثانية بعد «١٤ يومًا».</div>
  <div class="blk say"><span class="bt">🟡 بعد ما تخلص — سكوت ٥ ثواني، وبعدين</span> <span class="q">«ده اللي وصل.»</span></div>
  <div class="blk warn"><span class="bt">🔴 خد بالك</span> هيبدأوا يعلقوا فورًا. متردش على ولا تعليق. كمّل على الشريحة الجاية على طول.</div>`},

{id:27, timer:2100, body:`
  <div class="wrap">
    <div class="eyebrow">اجتماع طارئ — مجلس إدارة وميض</div>
    <div class="big-line">الاجتماع بتاعكم.</div>
    <div class="mission">
      <div class="mi"><span class="n">١</span><span class="lbl"><b>الرد</b> · رد رسمي على أ. خالد، هيتبعت باسم وميض</span></div>
      <div class="mi"><span class="n">٢</span><span class="lbl"><b>الخطة</b> · ملامح خطة أولية: هنعالج إيه؟ وإزاي؟</span></div>
      <div class="mi"><span class="n">٣</span><span class="lbl"><b>الاتجاه</b> · قرار واحد واضح: وميض هتتحرك في أنهي اتجاه؟</span></div>
    </div>
    <hr class="rule wide">
    <div id="t27" class="timer">35:00</div>
    <div class="timer-hint">دوسة تشغيل/إيقاف · دوستين تصفير</div>
  </div>`,
 notes:`
  <div class="blk say"><span class="bt">🟡 قول — حرفيًا</span>
  <span class="q">«الاجتماع بتاعكم. قدامكم ٣٥ دقيقة تطلعوا بتلات حاجات: رد رسمي على الراجل ده — هيتبعت باسم وميض. وملامح خطة. وقرار: إحنا ماشيين في أنهي اتجاه. وأنا موجود... لو احتجتوا مني حاجة.»</span></div>
  <div class="blk warn"><span class="bt">🔴 «لو احتجتوا مني حاجة» = مفتاح الكروت</span> بتتقال مرة واحدة بس، بنبرة عابرة كأنها مجاملة. متتكررش ومتتشرحش. اللي يلقطها ويسأل — ده نفسه الرصد.</div>
  <div class="blk do"><span class="bt">🟢 اعمل</span> دوس المؤقت → يبدأ من ٣٥:٠٠. وانسحب لكرسيك الجانبي وافتح الرصد.</div>
  <div class="blk say"><span class="bt">🃏 الكروت — صيغة التسليم الثابتة</span> لما حد يسأل سؤال بيطابق كارت: <span class="q">«سؤال مهم... وعندي إجابته.»</span> ← اكتب رقم الكارت + Enter → اقرا الكارت → Esc ترجع للمؤقت.</div>
  <div class="blk watch"><span class="bt">⚪ خريطة الكروت (فهم 🔵)</span> ٢١ المنافس · ٢٢ التقييمات · ٢٣ الصورة المالية · ٢٤ بنود العقد</div>
  <div class="blk watch"><span class="bt">⚪ خريطة الكروت (مراعاة 🟢)</span> ٣١ رأي المدربين · ٣٢ حالة الفريق · ٣٣ العلاقة بخالد · ٣٤ أثر السعر</div>
  <div class="blk warn"><span class="bt">🔴 قواعد الكروت</span>
   <ul><li>سؤال ملوش كارت → «المعلومة دي مش متاحة دلوقتي.» وخلاص، بلا اعتذار</li>
   <li>محدش طلب ولا كارت → عادي جدًا، ودي نفسها بيانات ذهب</li>
   <li>ممنوع تلمّح إن فيه كروت («فيه كمان حاجات تسألوا عنها» ❌) ولا تعلّق على الكارت بعد قراءته</li></ul></div>
  <div class="blk watch"><span class="bt">⚪ الرصد الأساسي</span>
   <ul><li>مين طلب كارت فهم؟ مين طلب مراعاة؟ (دي الأداة المهيمنة)</li>
   <li>مين مطلبش ولا كارت وقال «يلا نقرر»؟ ← حسم مهيمن</li>
   <li>مين طلب ٤ كروت والساعة بتخلص؟ ← فهم في إفراط</li>
   <li>الدقيقة اللي اتسأل فيها أول سؤال عن معلومة (كل ما قلّت، الفريق أنضج)</li></ul></div>
  <div class="blk say"><span class="bt">🟡 إشارات الوقت</span> فاضل ١٥: «ربع ساعة يا وميض.» · فاضل ٥: «خمس دقايق... ومحتاجين قرار.»</div>`},

/* ---- HIDDEN: FEHM cards (21-24) ---- */
{id:21, hidden:true, label:'كارت فهم', body:`
  <div class="card">
    <div class="ch"><span class="fam a">🔵 فهم</span><span class="ct">ملف المنافس — «لينجو برو»</span></div>
    <div class="cb">
      ◆ شغالة من ٣ سنين — تدريب أونلاين بشكل أساسي، بمنصة إلكترونية جذابة.<br>
      ◆ عرضها لمدارس المستقبل: <span class="k">١,٤٢٥,٠٠٠ ج</span> سنويًا (أقل منكم بـ٢٥٪).<br>
      ◆ متوسط خبرة مدربيها: سنتان — ولم تنفّذ من قبل عقدًا مؤسسيًا بهذا الحجم.<br>
      ◆ نقطة قوتها الحقيقية: <span class="k">تقارير متابعة آلية لأولياء الأمور</span> — خدمة لا تقدمونها حاليًا.
    </div>
    <div class="src">مصدر: متابعة السوق — إدارة التسويق والنمو</div>
  </div>`,
 notes:`<div class="blk watch"><span class="bt">⚪ بيتفتح بأسئلة زي</span> «إحنا عارفين إيه عن المنافس؟» · «مين مقدم العرض؟» · «عرضهم فيه إيه؟» · «هما من إمتى؟»</div>`},

{id:22, hidden:true, label:'كارت فهم', body:`
  <div class="card">
    <div class="ch"><span class="fam a">🔵 فهم</span><span class="ct">حقيقة تقييمات آخر برنامجين</span></div>
    <div class="cb">
      ◆ متوسط التقييم عند المستقبل نزل من <span class="k">٤٫٦</span> إلى <span class="k">٣٫٨</span> من ٥ خلال آخر برنامجين.<br>
      ◆ أكثر ٣ شكاوى تكرارًا: تكرار المحتوى والأنشطة — تأخر التصحيح والتقارير — «المدرب شكله تعبان».<br>
      ◆ ملاحظة داخلية من الجودة: <span class="k">٣ من الـ٤ مدربين</span> اشتغلوا فوق طاقتهم آخر ٤ شهور لتغطية جداول متضاربة.
    </div>
    <div class="src">مصدر: تقارير الجودة الداخلية — إدارة العمليات</div>
  </div>`,
 notes:`<div class="blk watch"><span class="bt">⚪ بيتفتح بأسئلة زي</span> «التقييم نزل قد إيه فعلًا؟» · «الشكاوى بتقول إيه؟» · «الجودة نزلت ولا هو بيبالغ؟»</div>`},

{id:23, hidden:true, label:'كارت فهم', body:`
  <div class="card">
    <div class="ch"><span class="fam a">🔵 فهم</span><span class="ct">الصورة المالية لو اتحركنا في السعر</span></div>
    <div class="cb">
      ◆ تخفيض ٢٥٪ = تنازل عن <span class="k">٤٧٥,٠٠٠ ج</span> — العقد يصبح بالكاد يغطي تكلفته التشغيلية.<br>
      ◆ تخفيض ١٠٪ = الهامش على العقد ينزل من ١٤٪ إلى حوالي <span class="k">٦٪</span>.<br>
      ◆ أي خطة جودة جادة (مواد + دعم للمدربين + نظام تقارير) تكلفتها: <span class="k">١٠٠–١٥٠ ألف</span>.<br>
      ◆ تذكير: السيولة الحالية تكفي ٣ شهور تشغيل فقط.
    </div>
    <div class="src">مصدر: الإدارة المالية</div>
  </div>`,
 notes:`<div class="blk watch"><span class="bt">⚪ بيتفتح بأسئلة زي</span> «لو نزّلنا السعر هنخسر كام؟» · «الخطة هتكلفنا إيه؟» · «معانا سيولة قد إيه؟» · «الهامش هيبقى كام؟»</div>`},

{id:24, hidden:true, label:'كارت فهم', body:`
  <div class="card">
    <div class="ch"><span class="fam a">🔵 فهم</span><span class="ct">العقد: بنوده وتاريخه</span></div>
    <div class="cb">
      ◆ ساري من ٣ سنين، بيتجدد سنويًا بإخطار قبلها بـ٦٠ يوم. ومفيش بند جزائي لو مجددوش.<br>
      ◆ السنة الأولى كان بـ١,٤٠٠,٠٠٠ ج — ووصل النهارده لـ١,٩٠٠,٠٠٠ ج. يعني <span class="k">قبلوا زيادات مرتين</span> قبل كده.<br>
      ◆ المجموعة فيها ٣ مدارس. وميض بتخدم اتنين بس — <span class="k">التالتة مع مورّد آخر</span> من سنتين.
    </div>
    <div class="src">مصدر: الملف القانوني والتعاقدي</div>
  </div>`,
 notes:`<div class="blk warn"><span class="bt">🔴</span> البند التالت (المدرسة التالتة) بيفتح باب <b>نمو</b> مش خسارة بس. راقب: حد هيلاقطه ولا هيعدي؟</div>
  <div class="blk watch"><span class="bt">⚪ بيتفتح بأسئلة زي</span> «العقد بيقول إيه؟» · «فيه بند لو ساب؟» · «من إمتى معانا؟» · «المجموعة فيها كام مدرسة؟»</div>`},

/* ---- HIDDEN: MURAA cards (31-34) ---- */
{id:31, hidden:true, label:'كارت مراعاة', body:`
  <div class="card">
    <div class="ch"><span class="fam b">🟢 مراعاة</span><span class="ct">رأي المدربين الأربعة (جلسة غير رسمية)</span></div>
    <div class="cb">
      ◆ اتنين قالوا بصراحة: «مش قادرين نكمل بنفس الإيقاع — محتاجين ناخد نفسنا».<br>
      ◆ واحد منهم — <span class="k">أ. كريم، أشطرهم</span> — وصلته رسالة من شركة منافسة على لينكدإن... ولسه مردّش عليها.<br>
      ◆ الأربعة متفقون: «المحتوى محتاج تجديد من سنة — والتكرار مش اختيارنا».
    </div>
    <div class="src">مصدر: منسق فريق المدربين — كلام أمانة، بلا أسماء في المحاضر</div>
  </div>`,
 notes:`<div class="blk warn"><span class="bt">🔴 أهم بذرة في اليوم</span> كريم ده هيقدم استقالته في الفصل التالت. اللي طلب الكارت ده هيربط، واللي مطلبوش هتيجيهم الاستقالة صدمة.</div>
  <div class="blk watch"><span class="bt">⚪ بيتفتح بأسئلة زي</span> «حد سأل المدربين نفسهم؟» · «رأي اللي شغال على العقد إيه؟» · «هما تعبانين فعلًا؟»</div>`},

{id:32, hidden:true, label:'كارت مراعاة', body:`
  <div class="card">
    <div class="ch"><span class="fam b">🟢 مراعاة</span><span class="ct">حالة الـ١٢ مدرب — الصورة الكاملة</span></div>
    <div class="cb">
      ◆ ٣ مدربين طلبوا تخفيف جدول خلال آخر ٦ شهور. اتقبل طلب واحد بس.<br>
      ◆ معدل الغياب المفاجئ ارتفع <span class="k">٤٠٪</span> مقارنة بالسنة اللي فاتت.<br>
      ◆ الاتنين اللي استقالوا: السبب المعلن «فرصة أفضل»... وفي مقابلة الخروج الاتنين ذكروا الإيقاع.<br>
      ◆ آخر زيادة مرتبات: من سنة ونص.
    </div>
    <div class="src">مصدر: الموارد البشرية</div>
  </div>`,
 notes:`<div class="blk watch"><span class="bt">⚪ بيتفتح بأسئلة زي</span> «الفريق كله عامل إيه؟» · «فيه حد تاني بيفكر يمشي؟» · «ليه الاتنين اللي فاتوا مشيوا؟»</div>`},

{id:33, hidden:true, label:'كارت مراعاة', body:`
  <div class="card">
    <div class="ch"><span class="fam b">🟢 مراعاة</span><span class="ct">أ. خالد المهدي — الرجل نفسه</span></div>
    <div class="cb">
      ◆ يعرف أ. يوسف عادل شخصيًا من ٦ سنين — من قبل العقد أصلًا.<br>
      ◆ دافع عن وميض مرتين قدام مجلس أمناء المجموعة لما اتقدّمت عروض أرخص.<br>
      ◆ معروف عنه إنه بيقدّر التواصل المباشر ومبيحبش الإيميلات الرسمية الباردة.<br>
      ◆ ملاحظة: <span class="k">من ٤ شهور، مبقاش بيرد بنفس السرعة.</span>
    </div>
    <div class="src">مصدر: إدارة علاقات العملاء</div>
  </div>`,
 notes:`<div class="blk warn"><span class="bt">🔴</span> السطر الأخير مهم — الإنذار مجاش فجأة، كان فيه إشارات من ٤ شهور ومحدش قراها.</div>
  <div class="blk watch"><span class="bt">⚪ بيتفتح بأسئلة زي</span> «علاقتنا بيه إيه؟» · «هو راجل إزاي؟» · «حد يعرفه شخصيًا؟» · «ليه بيعمل كده دلوقتي؟»</div>`},

{id:34, hidden:true, label:'كارت مراعاة', body:`
  <div class="card">
    <div class="ch"><span class="fam b">🟢 مراعاة</span><span class="ct">لو نزّلنا السعر — مين تاني هيسمع؟</span></div>
    <div class="cb">
      ◆ عقد شركة الأدوية (٨٠٠ ألف) بيتجدد بعد ٥ شهور.<br>
      ◆ ٤ من الـ٦ عملاء الصغار طلبوا خصم السنة اللي فاتت — واترفض بحجة «سياسة سعر موحدة».<br>
      ◆ السوق صغير، ومديري التدريب في الشركات دي بيتقابلوا في نفس المؤتمرات.
    </div>
    <div class="src">مصدر: إدارة التسويق والنمو</div>
  </div>`,
 notes:`<div class="blk watch"><span class="bt">⚪ بيتفتح بأسئلة زي</span> «لو نزّلنا لهم، باقي العملاء هيعملوا إيه؟» · «ده هيوصّل رسالة إيه؟» · «فيه عملاء تانيين بيتجددوا قريب؟»</div>`},

/* ---- one-sentence round ---- */
{id:28, body:`
  <div class="wrap">
    <div class="eyebrow">قبل ما تقفلوا...</div>
    <div class="big-line">جولة سريعة</div>
    <div class="lead">كل واحد بالدور — جملة واحدة برأيه.</div>
    <div class="lead dim">من غير نقاش. من غير رد.</div>
  </div>`,
 notes:`
  <div class="blk do"><span class="bt">🟢 امتى؟</span> لما تحس إنهم بيقفلوا على قرار (أو لما المؤقت يخلص) — قبل ما يعلنوه رسميًا.</div>
  <div class="blk say"><span class="bt">🟡 قول</span> <span class="q">«ثانية واحدة قبل ما تقفلوا... جولة سريعة: كل واحد بالدور يقول جملة واحدة برأيه — من غير نقاش ومن غير رد. نبدأ من... [اسم أكتر واحد كان ساكت].»</span></div>
  <div class="blk warn"><span class="bt">🔴 قواعد الجولة (مقدسة)</span>
   <ul><li>ممنوع الرد وممنوع النقاش — أول ما جملة تتناقش، اللي بعدها هيبلع كلامه</li>
   <li>تبدأ من الأهدى مش الأعلى صوت</li>
   <li>لو حد قال جملتين: «جملة واحدة.»</li></ul></div>
  <div class="blk watch"><span class="bt">⚪ ارصد — أغنى دقيقتين</span> جملة الساكت بالنص · مين طابق الأغلبية (مجاراة؟) · مين قال رأي مختلف لأول مرة دلوقتي بس</div>`},

{id:29, body:`
  <div class="wrap">
    <div class="big-line glow">قرار وميض... إيه؟</div>
    <div class="lead">واحد فيكم يعلنه باسم المجلس.</div>
    <div class="lead dim">جملة واحدة واضحة.</div>
  </div>`,
 notes:`
  <div class="blk say"><span class="bt">🟡 قول</span> <span class="q">«تمام. قرار وميض... إيه؟ واحد فيكم يعلنه باسم المجلس. جملة واحدة واضحة.»</span></div>
  <div class="blk watch"><span class="bt">⚪ ارصد</span> مين اتبرع يعلن؟ لوحده ولا الكل بص له؟</div>
  <div class="blk warn"><span class="bt">🧭 جدول التصنيف — عندك ٣ ثواني تصنّف، وبعدين افتح الكارت</span>
   <ul><li>«نحافظ على العقد» · «ننزّل السعر محسوب» · «مينفعش نخسر ٤٠٪» · «نقلل المخاطرة» → <b>الأمان</b> ← <b>41</b></li>
   <li>«نطلب مقابلة» · «نقعد معاه» · «نصلح العلاقة» · «سمعتنا» · «ده راجل بنعرفه» → <b>المكانة</b> ← <b>42</b></li>
   <li>«نرفض التنزيل» · «نراهن على الجودة» · «نجدد» · «وقت نقلة» · «ندخل المدرسة التالتة» → <b>النمو</b> ← <b>43</b></li>
   <li>«مش قادرين نقرر» · «نأجل» · «نعمل الاتنين» · انقسموا → <b>تأجيل</b> ← <b>44</b></li></ul></div>
  <div class="blk warn"><span class="bt">🔴</span> جملة مركّبة → صنّف على الفعل اللي هيحصل الأول. مش متأكد؟ اسأل واحد: «يعني أول حاجة بكرة الصبح تكون إيه؟» — الإجابة بتصنّف نفسها. <br>افتح الكارت بـ (41/42/43/44 + Enter). وبعد ما تقراه: <b>30 + Enter</b> → مؤشر الصدر.</div>`},

/* ---- HIDDEN: consequence cards (41-44) ---- */
{id:41, hidden:true, label:'عواقب', body:`
  <div class="conseq">
    <div class="qh"><div class="qe">عواقب قراركم</div><div class="qt">اتجهتوا للحفاظ على العقد</div></div>
    <div class="qb">
      <p>خالد المهدي ردّ في نفس اليوم: «أقدّر المرونة... ابعتوا العرض المعدّل.»</p>
      <p>الأرقام على مكتب المالية: تخفيض ١٠٪ ينزل بهامش العقد لـ٦٪... ومجاراة المنافس بـ٢٥٪ تخلي العقد بالكاد يغطي نفسه.</p>
      <p>وبعد ٥ أيام — مكالمة من شركة الأدوية: «سمعنا إن فيه أسعار جديدة... إحنا كمان عايزين نراجع عقدنا.»</p>
      <p>وجوه وميض: المدربين سمعوا إن الإدارة «بتتفاصل على السعر»... وسؤال بدأ يتهامس: «هو ده هييجي من مرتباتنا؟»</p>
    </div>
    <div class="foot">الأسبوع عدّى... والضغط بقى جاي من جوه ومن بره.</div>
  </div>`,
 notes:`<div class="blk say"><span class="bt">🟡 جملة التمهيد قبل الفتح</span> <span class="q">«اتخذتوا قراركم... القصة كملت أسبوع لقدّام. وده اللي حصل.»</span> اقرا بصوت راوي، وقفة عند كل فقرة.</div>
  <div class="blk warn"><span class="bt">🔴</span> ولا كلمة تقييم. سألوك «غلطنا؟» → «مفيش صح وغلط... فيه قرار وعواقبه. والقصة لسه.» بعدها: 30 + Enter.</div>`},

{id:42, hidden:true, label:'عواقب', body:`
  <div class="conseq">
    <div class="qh"><div class="qe">عواقب قراركم</div><div class="qt">اتجهتوا لإصلاح العلاقة</div></div>
    <div class="qb">
      <p>خالد المهدي وافق فورًا — أسرع مما توقعتم: «ممتاز. أنا فاضي الأسبوع ده. يوم الخميس... عندكم.»</p>
      <p>كسبتم شيئًا مهمًا: حضور مباشر ولقاء وجهًا لوجه بدل الإيميلات الباردة. والرجل اللي دافع عنكم مرتين قبل كده... لسه بيسمع.</p>
      <p>وخسرتم شيئًا أهم: وقت التجهيز. المقابلة بقت على بُعد أيام، والخطة لسه ملامح.</p>
      <p>وجوه الفريق... سؤال جديد بدأ يلف: «مين اللي هيتكلم؟ وهنقول إيه بالظبط؟»</p>
    </div>
    <div class="foot">الأسبوع عدّى... والخميس بيقرّب.</div>
  </div>`,
 notes:`<div class="blk say"><span class="bt">🟡 جملة التمهيد</span> <span class="q">«اتخذتوا قراركم... القصة كملت أسبوع لقدّام. وده اللي حصل.»</span></div>
  <div class="blk warn"><span class="bt">🔴</span> بلا تقييم. بعد القراءة: 30 + Enter.</div>`},

{id:43, hidden:true, label:'عواقب', body:`
  <div class="conseq">
    <div class="qh"><div class="qe">عواقب قراركم</div><div class="qt">اتجهتوا للرهان والتجديد</div></div>
    <div class="qb">
      <p>خالد المهدي ردّ بجملة واحدة: «موقف يُحترم... ورّوني الخطة خلال أسبوعين — بالتفاصيل والأرقام.»</p>
      <p>خطة الجودة الجادة محتاجة: مواد جديدة، ونظام تقارير، واعتماد ميزانية إضافية تقديرها ١٢٠ ألف ج — من سيولة بالكاد تكفي ٣ شهور.</p>
      <p>والحمل التنفيذي كله هيقع على نفس الأربع مدربين... المرهقين أصلًا.</p>
      <p>وفي نفس الأسبوع: المنافس قدّم عرضًا تجريبيًا مجانيًا لمدرسة واحدة من المجموعة — والتجربة بدأت فعلًا.</p>
    </div>
    <div class="foot">الأسبوع عدّى... والرهان بقى محتاج وقود مش موجود.</div>
  </div>`,
 notes:`<div class="blk say"><span class="bt">🟡 جملة التمهيد</span> <span class="q">«اتخذتوا قراركم... القصة كملت أسبوع لقدّام. وده اللي حصل.»</span></div>
  <div class="blk warn"><span class="bt">🔴</span> بلا تقييم. بعد القراءة: 30 + Enter.</div>`},

{id:44, hidden:true, label:'عواقب', body:`
  <div class="conseq">
    <div class="qh"><div class="qe">عواقب قراركم</div><div class="qt">الأسبوع عدّى... والقرار لسه مفتوح</div></div>
    <div class="qb">
      <p>الرد اللي اتبعت كان مهذبًا وعامًا: «نقدّر ملاحظاتكم ونعمل على خطة شاملة.»</p>
      <p>خالد المهدي مردّش عليه.</p>
      <p>وبعد ٦ أيام، وصل إيميل قصير من مكتبه — موجّه لمجلس أمناء المجموعة ومنسوخ لكم: «لم نتلقَّ حتى الآن خطة محددة من المورّد الحالي. أقترح فتح باب العروض.»</p>
      <p>وجوه وميض: الأربع مدربين سمعوا إن فيه «عروض بتتفتح»... والسؤال بقى: «هو إحنا هنفضل هنا؟»</p>
    </div>
    <div class="foot">الأسبوع عدّى... والباب اللي مقفلتوهوش، فتحه حد تاني.</div>
  </div>`,
 notes:`<div class="blk say"><span class="bt">🟡 جملة التمهيد</span> <span class="q">«اتخذتوا قراركم... القصة كملت أسبوع لقدّام. وده اللي حصل.»</span></div>
  <div class="blk warn"><span class="bt">🔴</span> بلا تقييم. بعد القراءة: 30 + Enter.</div>`},

/* ---- chest indicator 1 ---- */
{id:30, body:`
  <div class="wrap">
    <div class="eyebrow calm">مؤشر الصدر · النقطة الأولى</div>
    <div class="lead">٢٠ ثانية سكوت. ارجع بذاكرتك للحظة اللي قررتوا فيها.<br><span class="dim">مش تفتكر... تحسّ.</span></div>
    <div class="chest">
      <div class="opt"><div class="dot d1"></div><span class="lbl l1">ضيق</span></div>
      <div class="opt"><div class="dot d2"></div><span class="lbl l2">وسط</span></div>
      <div class="opt"><div class="dot d3"></div><span class="lbl l3">منشرح</span></div>
    </div>
    <div class="lead dim">وكلمة واحدة: فين حسّيته؟<br><span class="faint">مش هيتقري · مش هيتقال · ليك إنت بس</span></div>
  </div>`,
 notes:`
  <div class="blk do"><span class="bt">🟢 اعمل</span> غيّر نبرتك بالكامل — من راوي متوتر لصوت هادي بطيء. واقعد.</div>
  <div class="blk say"><span class="bt">🟡 قول — ببطء</span>
  <span class="q">«الحاجة اللي قلنا عليها الصبح — أول مرة فيها. ٢٠ ثانية سكوت. ارجعوا بذاكرتكم للحظة اللي القرار اتقفل فيها بالظبط — مش لحظة إعلانه، اللحظة اللي حسّيتوا فيها إن خلاص، ده اللي هيحصل. ومش عايزكم تفكروا فيها... عايزكم تحسّوها. وحطوا علامة واحدة: صدرك كان ضيق؟ وسط؟ ولا منشرح؟ وكلمة واحدة: فين حسّيته. يالا... عشرين ثانية.»</span></div>
  <div class="blk do"><span class="bt">🟢 اعمل</span> اسكت فعلًا ٢٠ ثانية. عد في دماغك. واكتب إنت كمان — لما يشوفوك بتكتب، الجدية بتتضاعف.</div>
  <div class="blk say"><span class="bt">🟡 بعدها — جملة واحدة</span> <span class="q">«تمام. يبقى عندكم أول نقطة.»</span></div>
  <div class="blk warn"><span class="bt">🔴</span> متسألش حد سجّل إيه، ولا تعلق. «مش عارف أحدد» → «اللي حسيته هو الصح. حط اللي أقرب.» الشرح كله في تفكيك ٤.</div>`},

/* ===== TAFKEEK 2 ===== */
{id:51, body:`
  <div class="wrap">
    <div class="eyebrow calm">تفكيك ٢</div>
    <div class="big-line">نبص من بره على الساعة اللي فاتت</div>
    <hr class="rule"><div class="lead dim">مش هنقيّم. هنفهم.</div>
  </div>`,
 notes:`
  <div class="blk warn"><span class="bt">🔴 الحساسية</span> ده قلب المنهجية، وأخطر تفكيك من ناحية الإحراج: هتكشف إن كان فيه ٨ معلومات وهما طلبوا منها تلاتة. القاعدة: اتكلم عن «الفريق» مش الأفراد · نوّرمِل بقوة وبصدق · الكشف الحقيقي مش العدد، الكشف إن الكروت كانوا عيلتين والفريق سأل من عيلة واحدة.</div>
  <div class="blk say"><span class="bt">🟡 قول</span> <span class="q">«زي ما عملنا الصبح — هنبص من بره على الـ٣٥ دقيقة. ونفس القاعدة: أنا هقرا الوقائع، وإنتو اللي هتشوفوا.»</span></div>`},

{id:52, body:`
  <div class="wrap">
    <div class="big-line">الخط الزمني</div>
    <div class="round" style="max-width:640px">
      <div class="r dim">٠٠:٠٠ — الإيميل اتقرا</div>
      <div class="r dim">٠٠:__ — أول جملة اتقالت</div>
      <div class="r dim">٠٠:__ — أول اقتراح حل</div>
      <div class="r glow">٠٠:__ — أول سؤال عن معلومة</div>
      <div class="r dim">٠٠:__ — أول مرة اتذكر مدرب</div>
      <div class="r dim">٠٠:__ — القرار اتقفل</div>
    </div>
    <div class="lead faint">وقائع. مش أحكام.</div>
  </div>`,
 notes:`
  <div class="blk do"><span class="bt">🟢 اعمل</span> اقعد، واقرا الخط الزمني من موبايلك بصوت محايد بالتوقيتات.</div>
  <div class="blk say"><span class="bt">🟡 الجملة الفاصلة — بعد الخط الزمني</span>
  <span class="q">«وخدوا بالكم: أول اقتراح حل كان الدقيقة [س]، وأول سؤال عن معلومة كان الدقيقة [ص]. مش هقول ده كويس ولا وحش. بس ده الترتيب اللي حصل.»</span>
  <span class="why-note">دي أهم معلومة — بتحدد: الفريق بيقترح قبل ما يعرف، ولا بيعرف قبل ما يقترح؟</span></div>
  <div class="blk warn"><span class="bt">🔴</span> ولا نبرة استنكار. لو قلت «الدقيقة ١٧!» بتعجب — إنت قيّمت.</div>`},

{id:53, body:`
  <div class="wrap">
    <div class="eyebrow">المعلومات اللي كانت متاحة النهارده</div>
    <div class="fam2">
      <div class="col">
        <div class="ch a">🔵 مجموعة أ (معلومات عن الموقف)</div>
        <div class="it">ملف المنافس</div><div class="it">أرقام التقييمات</div>
        <div class="it">الصورة المالية</div><div class="it">بنود العقد</div>
      </div>
      <div class="col">
        <div class="ch b">🟢 مجموعة ب (معلومات عن الناس)</div>
        <div class="it">رأي المدربين الأربعة</div><div class="it">حالة الفريق الداخلية</div>
        <div class="it">العلاقة بخالد المهدي</div><div class="it">أثر السعر على باقي العملاء</div>
      </div>
    </div>
    <div class="big-line glow" style="font-size:clamp(20px,2.6vw,30px)">تمانية. وكلهم كانوا متاحين.<br>بشرط واحد: إن حد يسأل.</div>
  </div>`,
 notes:`
  <div class="blk say"><span class="bt">🟡 قول — بنبرة هادية عادية (مش كشف مسرحي)</span>
  <span class="q">«طول الساعة، كان معايا تمن معلومات، كلها متاحة، بشرط واحد: إن حد يسأل. وأنا قلت جملة عابرة واحدة: "أنا موجود لو احتجتوا مني حاجة." الفريق طلب [عدد].»</span> (اسكت ٣ ثواني)</div>
  <div class="blk say"><span class="bt">🟡 النورملة — إلزامية، متعديهاش</span>
  <span class="q">«متوسط أي فريق بيطلب من اتنين لأربعة. إنتو في المتوسط. ومش لأنكم مش شاطرين — لأن ده اللي بيحصل في كل شركة. الأزمة لما بتنزل، الدماغ بتجري على الحل لأنه بيريّح. والسؤال بيوجع لأنه بيعترف إننا مش عارفين.»</span></div>
  <div class="blk say"><span class="bt">🟡 الكشف الحقيقي — العائلتين</span>
  <span class="q">«بس فيه حاجة أهم من العدد: الكروت كانوا نوعين. مجموعة أ معلومات عن الموقف، ومجموعة ب معلومات عن الناس. والفريق طلب [كذا] من أ... و[كذا] من ب.»</span></div>
  <div class="blk warn"><span class="bt">🔴 الرد حسب اللي حصل</span>
   <ul><li>طلبوا من أ بس → «كل أسئلتكم عن الموقف، ولا سؤال عن الناس. ودي مش غلطة — دي بصمة الفريق، وأثمن من أي قرار.»</li>
   <li>من ب بس → «كل أسئلتكم عن الناس. ده نادر — وله قوة وله تمن.»</li>
   <li>مطلبوش خالص → «القرار اتبنى على الإيميل بس. ٤ سطور من راجل زعلان. وده بيحصل كل يوم.»</li></ul>
   ولا اسم يتقال. لو «إنت ليه مقلتلناش؟» → «لأن ده الواقع. المعلومة الناقصة بتتطلب.»</div>`},

{id:54, body:`
  <div class="wrap">
    <div class="unit-tag">الوحدة الثانية</div>
    <div class="big-line" style="font-size:clamp(26px,3.6vw,42px)">الأدوات الثلاث لصناعة القرار</div>
    <div class="tools3">
      <div class="t3 a"><div class="th">🔵 الفهم</div><div class="tq">«إيه اللي إحنا عارفينه فعلًا؟ وإيه اللي بنخمّنه؟»</div><div class="tf">لو غابت → القرار بيتبني على افتراض مش حقيقة</div></div>
      <div class="t3 b"><div class="th">🟢 المراعاة</div><div class="tq">«القرار ده هيقع إزاي على اللي هينفذوه ويعيشوا نتيجته؟»</div><div class="tf">لو غابت → القرار صح على الورق وبيموت في التنفيذ</div></div>
      <div class="t3 c"><div class="th">🟠 الحسم</div><div class="tq">«نتحرك امتى؟ ومين هيتحرك؟»</div><div class="tf">لو غاب → القرار بيفضل فكرة، ومبيبقاش فعل</div></div>
    </div>
  </div>`,
 notes:`
  <div class="blk do"><span class="bt">🟢 اعمل</span> قوم. الجزء ده تعليم صافي والوقفة بتديه وزن.</div>
  <div class="blk say"><span class="bt">🟡 قول — الجملة اللي بترتاح لها القاعة</span>
  <span class="q">«الفريق اللي قدامي — كل واحد فيكم دخل الساعة بأداة مختلفة. فيه ناس عقلها راح على الأرقام. وناس على الناس. وناس على إحنا هنتحرك امتى. وده مش عيب — ده تنوّع. العيب الوحيد إن محدش سمّاها. فبقيتوا بتتخانقوا وإنتو فاكرين إن الخلاف على القرار. والخلاف كان على الأداة.»</span> (اسكت ٥ ثواني — كل واحد هيفتكر خناقة حقيقية)</div>
  <div class="blk warn"><span class="bt">🔴</span> «طيب أنا نوعي إيه؟» → «مش نوع... أداة. وإنت النهارده مسكت [كذا] أول حاجة.» ولا رقم ولا اسم عائلة.</div>`},

{id:55, body:`
  <div class="wrap">
    <div class="lead" style="font-weight:700">قاعدتين تحت الأداة الأولى</div>
    <div class="tool">
      <div class="thh">١. المعلومة الناقصة بتتطلب — مش بتتخمّن.</div>
      <div class="why">بس الحارس: اسأل بس عن المعلومة اللي لو جت هتغيّر قرارك. أي معلومة تانية رفاهية — أو هروب من القرار لابس بدلة بحث.</div>
      <hr style="border:none;border-top:1px solid var(--line)">
      <div class="thh">٢. كل قرار له تمن.</div>
      <div class="why">لو مش شايف تمن قرارك... يبقى التمن مستخبي. والتمن المستخبي غالبًا بيكون في الناس — مش في الفلوس.</div>
    </div>
  </div>`,
 notes:`
  <div class="blk say"><span class="bt">🟡 قول</span>
  <span class="q">«القاعدة الأولى: المعلومة الناقصة بتتطلب. بس فيه ناس بتستخدم "جمع المعلومات" كمخبأ — لجنة، وتقرير، وتقرير تاني. ده مش حرص، ده هروب لابس بدلة بحث. فالميزان: اسأل بس عن اللي لو جه هيغيّر قرارك.<br>
  والقاعدة التانية: كل قرار له تمن. لو حد قالك "ده كله فوايد ومفيش سلبيات" — يا مش شايف التمن يا مخبيه. والتمن المستخبي غالبًا في الناس مش الفلوس. الفلوس بتبان في الشيت، والناس بتبان بعد ٣ شهور لما واحد يقدم استقالته.»</span></div>`},

{id:56, body:`
  <div class="tool">
    <div class="thh">🛠️ الأداة الثانية: ورقة القرار الثلاثية</div>
    <div class="lead dim" style="font-size:clamp(14px,1.6vw,18px)">قبل أي قرار مهم — تلات أسطر:</div>
    <div class="quote" style="border-color:var(--info)">🔵 عقلي بيقول: ______</div>
    <div class="quote" style="border-color:var(--calm)">🟢 قلبي بيقول: ______</div>
    <div class="quote" style="border-color:var(--ember)">🟠 حدسي بيقول: ______</div>
    <div class="why">اتفقوا؟ → غالبًا قرار سليم، امشي. اختلفوا؟ → متسألش مين فيهم صح. اسأل: <b style="color:var(--bone)">ليه اختلفوا؟</b> موضع الاختلاف هو بالظبط الأداة اللي إنت مش سامعها.</div>
  </div>`,
 notes:`
  <div class="blk say"><span class="bt">🟡 قول</span>
  <span class="q">«الأداة اللي هتاخدوها — وأبسط أداة في المنهجية وأكترهم استخدامًا. ورقة القرار الثلاثية. تلات أسطر: عقلي بيقول إيه (الفهم)، قلبي (المراعاة)، حدسي (الحسم). اتفقوا؟ قرار سليم، امشي. اختلفوا؟ متسألش مين صح — اسأل ليه اختلفوا. موضع الاختلاف بيقولك: دي الأداة اللي إنت مش سامعها. لو عقلك بيقول امشي وقلبك بيقول استنى — فيه حاجة في الناس إنت مش شايفها. وده مش تردد، ده معلومة.»</span></div>`},

{id:57, body:`
  <div class="wrap">
    <div class="lead">اكتبوا على ورقتكم:</div>
    <div class="big-line glow" style="font-size:clamp(20px,2.8vw,32px)">٢. الأداة الثانية: ورقة القرار الثلاثية</div>
    <div class="lead dim">وسؤال — جاوبوه لنفسكم:</div>
    <div class="big-line" style="font-size:clamp(20px,3vw,36px)">من الأدوات التلاتة...<br>أنهي واحدة بتمسكها أول حاجة؟ وأنهي واحدة بتنساها؟</div>
  </div>`,
 notes:`
  <div class="blk say"><span class="bt">🟡 قول</span>
  <span class="q">«اكتبوا الأداة التانية، وتحتها سؤال — من الأدوات التلاتة، أنهي واحدة بتمسكها أول حاجة؟ وأنهي واحدة بتنساها؟ ومتجاوبش اللي "المفروض" — جاوب اللي حصل النهارده فعلًا. خدوا ٣٠ ثانية.»</span> (استنى فعلًا)</div>
  <div class="blk say"><span class="bt">🟡 القفلة</span> <span class="q">«الأداتين دول دلوقتي في إيديكم: خط التضحية وورقة القرار الثلاثية. والفصل الجاي هتيجي فرص تستخدموهم. وأنا مش هفكّركم بيهم.»</span></div>
  <div class="blk watch"><span class="bt">⚪ ارصد بعد التفكيك</span> مين اتغير وشه عند «الخلاف كان على الأداة»؟ · مين قال «أيوه!» عند أداة معينة؟ · مين سأل سؤال (وعي منهجي)؟</div>`},

/* ===== FOUNDER MESSAGE ===== */
{id:58, body:`
  <div class="wrap">
    <div class="notif" onclick="openMail()">
      <div class="head">
        <span class="app">📥 البريد الوارد</span>
        <span class="flag personal"><span class="dotpulse"></span>شخصي</span>
      </div>
      <span class="from">أ. يحيى مراد — المؤسس</span>
      <span class="subj">الموضوع: كلمتين من بعيد</span>
      <span class="open">▸ اضغط على الرسالة لفتحها</span>
    </div>
  </div>`,
 notes:`
  <div class="blk do"><span class="bt">🟢 اعمل</span> غيّر نبرتك بالكامل — من نبرة الشرح لنبرة أهدى وأدفا. واقعد.</div>
  <div class="blk say"><span class="bt">🟡 قول</span> <span class="q">«وقبل ما ننزل ناكل... وصل إيميل تاني. بس المرة دي... مش من العميل.»</span></div>
  <div class="blk do"><span class="bt">🟢</span> دوس على الإشعار → رنّة والرسالة بتفتح.</div>`},

{id:59, body:`
  <div class="mail">
    <div class="top"><span class="badge founder">شخصي</span>
      <span class="from">من: <b>يحيى مراد</b> — المؤسس، وميض للتدريب</span>
      <span class="subj">كلمتين من بعيد</span>
    </div>
    <div class="body">
      يا فريقي،<br>
      وصلني اللي بيحصل وأنا بعيد... وصدقوني، أصعب حاجة على قلبي إني مش وسطكم دلوقتي.<br>
      مش هقولكم تعملوا إيه. إنتو مجلس الإدارة، والقرار قراركم — وأنا واثق فيكم واحد واحد.<br>
      بس هبعتلكم حاجة واحدة معايا من السفر: تلات حاجات اتعلمتهم في الست سنين دول. غلطة ورا غلطة، وعقد ورا عقد.<br>
      يا ريت كان حد قالهالي بدري.
      <div class="sig">يحيى مراد — المؤسس، وميض للتدريب</div>
    </div>
  </div>`,
 notes:`<div class="blk say"><span class="bt">🟡 اقرا بصوت أب مش مدير</span> — بطيء ودافي. وقّف ثانية بعد «وأنا واثق فيكم واحد واحد».</div>`},

/* ================= ENGINE (identical to Part 1) ================= */
const stage=document.getElementById('stage'),prog=document.getElementById('progress'),snum=document.getElementById('snum');
const faciBody=document.getElementById('faci-body'),faci=document.getElementById('faci'),jumpBox=document.getElementById('jump'),help=document.getElementById('help');
const visible=SLIDES.filter(s=>!s.hidden);
let idx=0,returnIdx=0,onHidden=false;
SLIDES.forEach(s=>{const el=document.createElement('section');el.className='slide';el.dataset.id=s.id;el.innerHTML=`<div>${s.body}</div>`;stage.appendChild(el);s.el=el;});
function findById(id){return SLIDES.find(s=>String(s.id)===String(id));}
function toAr(n){return String(n).replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);}
function showSlide(s){
  SLIDES.forEach(x=>x.el.classList.remove('on'));s.el.classList.add('on');
  const vi=visible.indexOf(s);
  if(vi>=0){idx=vi;onHidden=false;}else{onHidden=true;}
  prog.style.width=((idx+1)/visible.length*100)+'%';
  snum.textContent=onHidden?(s.label||('كارت '+s.id)):(toAr(vi+1)+' / '+toAr(visible.length));
  renderNotes(s);stopAllTimers();
}
function goVisible(i){i=Math.max(0,Math.min(visible.length-1,i));idx=i;showSlide(visible[i]);}
function next(){if(onHidden){showSlide(visible[idx]);return;}goVisible(idx+1);}
function prev(){if(onHidden){showSlide(visible[idx]);return;}goVisible(idx-1);}
function jumpTo(id){const s=findById(id);if(!s)return;if(s.hidden){returnIdx=idx;showSlide(s);}else{goVisible(visible.indexOf(s));}}
function escBack(){if(onHidden){showSlide(visible[returnIdx]);}}
window.next=next;
function renderNotes(s){faciBody.innerHTML=s.notes||'<div class="blk watch"><span class="bt">⚪</span> (مفيش ملاحظات)</div>';}
function toggleFaci(){faci.classList.toggle('open');}window.toggleFaci=toggleFaci;

/* mail open (notification click) */
function openMail(){mailChime();next();}window.openMail=openMail;

/* timers */
let timers={};
function stopAllTimers(){for(const k in timers){clearInterval(timers[k].iv);}}
function attachTimer(el,total){
  let remain=total,running=false,iv=null;
  const fmt=x=>{const m=Math.floor(x/60),sec=x%60;return toAr(String(m).padStart(2,'0'))+':'+toAr(String(sec).padStart(2,'0'));};
  function paint(){el.textContent=fmt(remain);el.classList.toggle('warn',running&&remain<=300&&remain>0);el.classList.toggle('run',running&&remain>300);if(remain<=0){el.classList.remove('run','warn');el.classList.add('done');}}
  function tick(){remain--;if(remain<=0){remain=0;paint();clearInterval(iv);running=false;chime();return;}paint();}
  el.onclick=e=>{e.stopPropagation();if(running){clearInterval(iv);running=false;el.classList.remove('run','warn');}else{running=true;iv=setInterval(tick,1000);}paint();};
  el.ondblclick=e=>{e.stopPropagation();clearInterval(iv);running=false;remain=total;el.classList.remove('run','warn','done');paint();};
  paint();timers[el.id]={iv:null,el};
}
function chime(){try{const c=new(window.AudioContext||window.webkitAudioContext)();[0,.18,.36].forEach((t,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=[660,880,990][i];o.type='sine';o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.0001,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.25,c.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t+.5);o.start(c.currentTime+t);o.stop(c.currentTime+t+.5);});}catch(e){}}
function mailChime(){try{const c=new(window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.type='triangle';o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.2,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.4);o.start();o.stop(c.currentTime+.4);}catch(e){}}
[['t27',2100],['t62',3000]].forEach(([id,t])=>{const el=document.getElementById(id);if(el)attachTimer(el,t);});

/* input */
let buf='';
document.addEventListener('keydown',e=>{
  if(/[0-9]/.test(e.key)){buf+=e.key;jumpBox.style.display='block';jumpBox.textContent=toAr(buf);return;}
  if(e.key==='Enter'){if(buf){jumpTo(buf);buf='';jumpBox.style.display='none';}return;}
  if(e.key==='Escape'){buf='';jumpBox.style.display='none';if(faci.classList.contains('open')){toggleFaci();}else{escBack();}return;}
  if(e.key===' '){e.preventDefault();next();return;}
  if(e.key==='ArrowLeft'||e.key==='ArrowDown'){next();return;}
  if(e.key==='ArrowRight'||e.key==='ArrowUp'){prev();return;}
  if(e.key==='n'||e.key==='N'){toggleFaci();return;}
  if(e.key==='h'||e.key==='H'||e.key==='?'){help.classList.toggle('show');return;}
});
let tx=0,ty=0,tt=0;
stage.addEventListener('touchstart',e=>{if(e.touches.length===2){toggleFaci();return;}tx=e.touches[0].clientX;ty=e.touches[0].clientY;tt=Date.now();},{passive:true});
stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty,dt=Date.now()-tt;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)){dx<0?next():prev();return;}if(dt<300&&Math.abs(dx)<20&&Math.abs(dy)<20){const w=window.innerWidth,x=e.changedTouches[0].clientX;if(x<w/3)next();else if(x>2*w/3)prev();}},{passive:true});

showSlide(visible[0]);help.classList.add('show');setTimeout(()=>help.classList.remove('show'),6500);
</script>
</body>
</html>
