<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>يوم وميض — الجزء الثالث · اليوم اللي بيشد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;500;600;700&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141310; --ink-2:#1c1a15; --ink-3:#26221b;
    --bone:#ece4d4; --bone-dim:#a89c85; --bone-faint:#6f6555;
    --ember:#e8a24a; --ember-deep:#c7742a; --ember-glow:rgba(232,162,74,.16);
    --calm:#89b3a8; --info:#8aa6c8; --danger:#d8654e;
    --line:rgba(236,228,212,.12); --line-2:rgba(236,228,212,.06);
    --display:'Reem Kufi', system-ui, sans-serif; --body:'Tajawal', system-ui, sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{background:
      radial-gradient(120% 90% at 80% -10%, rgba(232,162,74,.09), transparent 55%),
      radial-gradient(90% 80% at 15% 110%, rgba(216,101,78,.05), transparent 50%),
      var(--ink);
    color:var(--bone);font-family:var(--body);-webkit-font-smoothing:antialiased;user-select:none;}
  #progress{position:fixed;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--ember-deep),var(--ember));box-shadow:0 0 14px var(--ember-glow);z-index:60;transition:width .5s cubic-bezier(.2,.7,.2,1);width:0}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:6vh 7vw}
  .slide{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:7vh 8vw;flex-direction:column;text-align:center;opacity:0;transition:opacity .6s ease}
  .slide.on{display:flex;opacity:1}
  .wrap{max-width:1100px;width:100%;display:flex;flex-direction:column;align-items:center;gap:2.4vh}
  .eyebrow{font-weight:700;letter-spacing:.14em;color:var(--ember);font-size:clamp(13px,1.5vw,17px);opacity:.9}
  .eyebrow.calm{color:var(--calm)}.eyebrow.danger{color:var(--danger)}
  h1{font-family:var(--display);font-weight:600;line-height:1.28;font-size:clamp(30px,5.4vw,64px)}
  .lead{font-size:clamp(18px,2.3vw,28px);line-height:1.85;color:var(--bone);font-weight:400;max-width:920px}
  .dim{color:var(--bone-dim)}.faint{color:var(--bone-faint)}.glow{color:var(--ember)}.cool{color:var(--calm)}
  .big-line{font-family:var(--display);font-size:clamp(30px,5vw,58px);line-height:1.4;font-weight:600}
  .rule{width:64px;height:2px;background:var(--ember);opacity:.6;border:none;box-shadow:0 0 12px var(--ember-glow)}
  .rule.wide{width:min(520px,70%)}
  .stack{display:flex;flex-direction:column;gap:1.3vh;align-items:center}

  .mail{width:100%;max-width:900px;text-align:right;background:linear-gradient(180deg,var(--ink-2),var(--ink));border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .mail .top{background:var(--ink-3);padding:1.6vh 1.8vw;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:.4vh}
  .mail .badge{align-self:flex-start;font-size:clamp(11px,1.2vw,13px);font-weight:700;letter-spacing:.06em;padding:.3em .9em;border-radius:999px}
  .badge.urgent{background:rgba(216,101,78,.16);color:var(--danger)}
  .badge.info{background:rgba(138,166,200,.15);color:var(--info)}
  .badge.resign{background:rgba(168,156,133,.16);color:var(--bone-dim)}
  .mail .from{color:var(--bone-dim);font-size:clamp(12.5px,1.4vw,16px)}
  .mail .from b{color:var(--bone);font-weight:700}
  .mail .subj{color:var(--bone);font-weight:700;font-size:clamp(15px,1.8vw,21px)}
  .mail .body{padding:2.2vh 1.8vw;font-size:clamp(14.5px,1.7vw,19px);line-height:1.9;color:var(--bone)}
  .mail .sig{margin-top:1.4vh;color:var(--bone-dim);font-size:.92em}
  .mail .body ul{list-style:none;margin-top:1vh}
  .mail .body li{margin:.4vh 0}

  /* kareem number strip */
  .strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1vw;width:100%;max-width:900px;margin-top:1vh}
  .strip .s{background:linear-gradient(180deg,var(--ink-2),transparent);border:1px solid var(--line);border-radius:12px;padding:1.6vh 1vw;text-align:center;display:flex;flex-direction:column;gap:.5vh}
  .strip .s .sv{font-family:var(--display);color:var(--ember);font-size:clamp(17px,2.2vw,26px);line-height:1}
  .strip .s .sl{color:var(--bone-dim);font-size:clamp(10.5px,1.15vw,13px);line-height:1.4}

  /* admin notice */
  .notice{width:100%;max-width:820px;text-align:right;border:1px solid var(--line);border-radius:14px;
    background:linear-gradient(180deg,var(--ink-2),var(--ink));padding:2.4vh 2vw;display:flex;flex-direction:column;gap:1.2vh}
  .notice .nh{color:var(--bone-dim);font-size:clamp(13px,1.5vw,17px);font-weight:700}
  .notice .nq{color:var(--bone);font-size:clamp(15px,1.85vw,21px);line-height:1.8;padding-right:1rem;border-right:2px solid var(--line)}
  .notice .nf{color:var(--ember);font-size:clamp(13.5px,1.55vw,17px)}

  /* observer sheet */
  .obs{width:100%;max-width:820px;text-align:right;border:1px solid rgba(232,162,74,.3);border-radius:16px;
    background:linear-gradient(180deg,rgba(232,162,74,.05),var(--ink));padding:2.6vh 2vw;display:flex;flex-direction:column;gap:1.1vh}
  .obs .oh{font-family:var(--display);color:var(--ember);font-size:clamp(18px,2.2vw,26px)}
  .obs .os{color:var(--bone-dim);font-size:clamp(13px,1.5vw,17px);margin-bottom:.5vh}
  .obs .oi{color:var(--bone);font-size:clamp(14px,1.6vw,18.5px);line-height:1.6;padding-right:1.2rem;position:relative}
  .obs .oi::before{content:"◆";color:var(--ember);position:absolute;right:0;font-size:.7em;top:.35em}
  .obs .of{color:var(--bone-dim);font-size:clamp(12.5px,1.4vw,15px);margin-top:.6vh;font-style:italic}

  /* consequence */
  .conseq{width:100%;max-width:880px;text-align:right;border-radius:16px;overflow:hidden;background:linear-gradient(180deg,rgba(232,162,74,.06),var(--ink));border:1px solid rgba(232,162,74,.28)}
  .conseq .qh{padding:1.6vh 1.9vw;border-bottom:1px solid var(--line)}
  .conseq .qe{color:var(--ember);font-weight:700;letter-spacing:.06em;font-size:clamp(12px,1.4vw,15px)}
  .conseq .qt{color:var(--bone);font-family:var(--display);font-size:clamp(19px,2.4vw,28px);margin-top:.5vh}
  .conseq .qb{padding:2.2vh 1.9vw;font-size:clamp(14.5px,1.7vw,19px);line-height:2;color:var(--bone)}
  .conseq .qb p{margin-bottom:1.1vh}
  .conseq .foot{padding:1.4vh 1.9vw;background:var(--ink-3);border-top:1px solid var(--line);color:var(--ember-deep);font-style:italic;font-size:clamp(13px,1.5vw,17px)}

  /* rasookh matrix */
  .matrix{width:100%;max-width:960px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .matrix .cell{padding:1.6vh 1.2vw;border:.5px solid var(--line-2);font-size:clamp(13px,1.55vw,18px);line-height:1.5;display:flex;align-items:center;justify-content:center;text-align:center}
  .matrix .hd{background:var(--ink-3);color:var(--bone-dim);font-weight:700;font-size:clamp(12.5px,1.45vw,16px)}
  .matrix .rl{font-family:var(--display);font-weight:700;font-size:clamp(15px,1.9vw,22px);background:rgba(255,255,255,.02)}
  .matrix .rl.g{color:var(--calm)}.matrix .rl.r{color:var(--danger)}.matrix .rl.o{color:var(--ember)}
  .matrix .val{color:var(--bone)}

  /* context 3 */
  .ctx{display:flex;flex-direction:column;gap:1.4vh;width:100%;max-width:820px;text-align:right}
  .ctx .c{display:flex;gap:1rem;align-items:baseline;font-size:clamp(15px,1.8vw,21px);line-height:1.5}
  .ctx .c .n{font-family:var(--display);color:var(--ember);min-width:1.3em}
  .ctx .c b{color:var(--bone);font-weight:700}
  .ctx .c span{color:var(--bone-dim)}

  /* tool */
  .tool{width:100%;max-width:820px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,rgba(232,162,74,.05),transparent);padding:3vh 2vw;text-align:right;display:flex;flex-direction:column;gap:1.5vh}
  .tool .thh{font-family:var(--display);color:var(--ember);font-size:clamp(19px,2.3vw,26px)}
  .tool .quote{font-size:clamp(16px,2vw,23px);line-height:1.8;color:var(--bone);padding-right:1.2rem;border-right:3px solid var(--ember)}
  .tool .why{color:var(--bone-dim);font-size:clamp(13.5px,1.55vw,17px);line-height:1.7}

  .timer{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;font-size:clamp(64px,13vw,150px);line-height:1;color:var(--bone);cursor:pointer;transition:color .3s,text-shadow .3s}
  .timer.run{color:var(--ember);text-shadow:0 0 40px var(--ember-glow)}
  .timer.warn{color:var(--danger);text-shadow:0 0 40px rgba(216,101,78,.3);animation:pulse 1.1s infinite}
  .timer.done{color:var(--danger)}
  .timer-hint{color:var(--bone-faint);font-size:clamp(12px,1.4vw,15px);margin-top:1.4vh}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

  #chrome{position:fixed;inset:auto 0 0 0;display:flex;justify-content:space-between;align-items:center;padding:2.2vh 3vw;pointer-events:none;z-index:50}
  #snum{color:var(--bone-faint);font-size:13px;letter-spacing:.08em;font-variant-numeric:tabular-nums}
  #mark-sm{color:var(--bone-faint);font-family:var(--display);font-size:15px;letter-spacing:.1em}#mark-sm b{color:var(--ember);opacity:.75}
  #jump{position:fixed;bottom:2vh;left:50%;transform:translateX(-50%);z-index:70;background:var(--ink-3);border:1px solid var(--ember);color:var(--ember);font-family:var(--display);padding:.5em 1.1em;border-radius:10px;font-size:20px;letter-spacing:.15em;display:none}

  #faci{position:fixed;inset:auto 0 0 0;max-height:82vh;overflow-y:auto;z-index:80;background:linear-gradient(180deg,#0d0c0a,#141310);border-top:2px solid var(--ember);transform:translateY(101%);transition:transform .45s cubic-bezier(.2,.8,.2,1);padding:3vh 4vw 5vh;box-shadow:0 -30px 60px rgba(0,0,0,.6)}
  #faci.open{transform:translateY(0)}
  #faci .fhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:2vh;padding-bottom:1.5vh;border-bottom:1px solid var(--line)}
  #faci .ftitle{font-family:var(--display);color:var(--ember);font-size:clamp(16px,2vw,22px)}
  #faci .fclose{color:var(--bone-dim);font-size:13px;border:1px solid var(--line);border-radius:8px;padding:.4em .9em;cursor:pointer}
  #faci-body{display:flex;flex-direction:column;gap:1.6vh;text-align:right;line-height:1.75;font-size:clamp(14px,1.55vw,17.5px)}
  .blk{border-right:4px solid;padding:1.2vh 1.3vw;border-radius:0 10px 10px 0;background:rgba(255,255,255,.02)}
  .blk .bt{font-weight:800;font-size:.82em;letter-spacing:.05em;margin-bottom:.5vh;display:block}
  .say{border-color:var(--ember)} .say .bt{color:var(--ember)} .say .q{color:var(--bone);font-weight:500}
  .do{border-color:var(--calm)} .do .bt{color:var(--calm)}
  .warn{border-color:var(--danger)} .warn .bt{color:var(--danger)}
  .watch{border-color:var(--bone-dim)} .watch .bt{color:var(--bone-dim)}
  .secret{border-color:var(--info);background:rgba(138,166,200,.05)} .secret .bt{color:var(--info)}
  .blk ul{margin:.4vh 1.2rem 0;padding:0}.blk li{margin:.3vh 0}
  #faci .why-note{color:var(--bone-dim);font-size:.9em}

  #help{position:fixed;top:2vh;left:2vw;z-index:70;color:var(--bone-faint);font-size:12px;background:var(--ink-2);border:1px solid var(--line);border-radius:8px;padding:.5em .8em;line-height:1.7;text-align:right;max-width:240px;opacity:0;transition:opacity .3s;pointer-events:none}
  #help.show{opacity:1}#help b{color:var(--ember)}
  @media (max-width:760px){.strip{grid-template-columns:1fr 1fr}.matrix{grid-template-columns:1fr}.matrix .rl{border-top:2px solid var(--line)}}
  @media (prefers-reduced-motion:reduce){.slide{transition:none}.timer.warn{animation:none}}
</style>
</head>
<body>
  <div id="progress"></div>
  <div id="stage"></div>
  <div id="chrome"><span id="snum"></span><span id="mark-sm"><b>◆</b> وميض</span></div>
  <div id="jump"></div>
  <div id="help">
    <b>الأسهم / مسافة</b> تنقّل<br><b>رقم + Enter</b> قفزة<br><b>Esc</b> رجوع<br><b>N</b> شرح الميسّر<br>
    <span style="color:var(--danger)">الكروت المخفية: ٧١ (الراصد) · ٨١·٨٢·٨٣ (نتيجة كريم)</span>
  </div>
  <div id="faci"><div class="fhead"><span class="ftitle">🎙️ شرح الميسّر</span><span class="fclose" onclick="toggleFaci()">إغلاق ✕</span></div><div id="faci-body"></div></div>

<script>
const SLIDES=[

/* ===== CHAPTER 3 ===== */
{id:63, body:`
  <div class="wrap">
    <div class="eyebrow">الفصل الثالث</div>
    <div class="big-line">أسبوع بعدين...</div>
    <div class="lead dim">الرد اتبعت. الدنيا شكلها ماشية. والملفات على المكاتب بتتراكم... بهدوء.</div>
    <hr class="rule">
    <div class="lead faint">يوم تلات. الساعة ١١ الصبح.</div>
  </div>`,
 notes:`
  <div class="blk warn"><span class="bt">🔴 افهم التصميم</span> ده مركز الثقل القياسي. بيقيس حاجات <b>مش قابلة للتزوير</b>: الرسوخ/العناد/الانهيار، العلاقة بالصلاحية، والتصرف في السري. عشان كده التعليم اللي فات مش بيضرّ هنا — بالعكس عايزينهم يجربوا الأدوات عشان الفجوة تبان.</div>
  <div class="blk say"><span class="bt">🟡 قول</span>
  <span class="q">«أهلًا بيكم تاني في وميض. القصة كملت أسبوع. الرد اتبعت والدنيا شكلها ماشية. بس قبل ما اليوم يبدأ، فيه دور جديد: الراصد. واحد فيكم هيطلع من القصة شوية، يقعد على الكرسي هناك، ويلبس قبعة المراقب: مش هيتكلم، مش هيساعد، مش هيقرر — هيشوف بس. وهيحكي اللي شافه في آخر اليوم. والقبعة هتلف — مش واحد بس. مين؟... القرعة هتقول.»</span></div>
  <div class="blk do"><span class="bt">🟢 اعمل — القرعة</span> اسحب رقم. اللي طلع: ينقل كرسيه للجنب (شايف الكل). اكتب <b>71 + Enter</b> → ورقة الراصد، وقوله «صوّرها بموبايلك». Esc ترجع.</div>
  <div class="blk warn"><span class="bt">🔴 قاعدة القرعة</span> لو جابت الشخص اللي اخترته للسري — اسحب تاني: «القرعة دي باظت 😄». السري لازم يوصل لحد جوه القصة.</div>
  <div class="blk watch"><span class="bt">⚪ ارصد</span> اللي طلع عليه الدور: ارتاح إنه طلع من الضغط؟ ولا اتضايق إنه اتشال من القرار؟</div>`},

/* observer sheet — hidden */
{id:71, hidden:true, label:'ورقة الراصد', body:`
  <div class="obs">
    <div class="oh">🎩 قبعة المراقب</div>
    <div class="os">ورقة الراصد — صوّرها بموبايلك · إنت دلوقتي برّه القصة: متتدخلش، متساعدش، متعلّقش — بس شوف واكتب.</div>
    <div class="oi">مين بادر واتكلم الأول لما الضربة نزلت؟</div>
    <div class="oi">مين اتقاطع وسكت؟ ومين اتقاطع وكمّل؟</div>
    <div class="oi">لما الوقت ضغط: مين صوته علا؟ ومين انسحب؟</div>
    <div class="oi">مين غيّر رأيه؟ وحصل إيه قبلها بالظبط؟</div>
    <div class="oi">جملة واحدة سمعتها ووقفت معاك — اكتبها بالنص.</div>
    <div class="of">هتحكي اللي شفته في آخر اليوم — وصف حركة، مش أحكام على أشخاص.</div>
  </div>`,
 notes:`<div class="blk do"><span class="bt">🟢</span> اللي عليه الدور يصوّر الورقة → Esc ترجع للفلو. القبعة بتتبدل بعد كل ضربة (قرعة جديدة).</div>`},

/* authorities reminder */
{id:64, body:`
  <div class="wrap">
    <div class="notice">
      <div class="nh">📋 تذكير إداري — من مكتب المؤسس</div>
      <div class="nq">«بما إني بعيد، حدود الصلاحيات سارية بالكامل. أي قرار خارج صلاحية صاحبه محتاج موافقة مكتوبة — إما من المجلس أو مني. أنا في اجتماعات طول اليوم.»</div>
      <div class="nf">راجعوا الصلاحية اللي قدامكم على ورقتكم.</div>
    </div>
  </div>`,
 notes:`
  <div class="blk say"><span class="bt">🟡 قول — بنبرة إدارية مملة، كأنك بتقرا تعميم</span>
  <span class="q">«وصل تذكير إداري من مكتب المؤسس: بما إنه بعيد، حدود الصلاحيات سارية بالكامل. أي قرار خارج صلاحية صاحبه محتاج موافقة مكتوبة. وهو في اجتماعات طول اليوم. راجعوا بسرعة الصلاحية اللي قدامكم.»</span> (سيبهم ١٠ ثواني، وامشي)</div>
  <div class="blk warn"><span class="bt">🔴 أهم لحظة تشغيلية</span> متعلّقش ولا تشرح ولا تلمّح. أي نبرة تحذير هتخليهم يركزوا على الصلاحيات وهما بيقرروا، والقياس يموت. متقولش «خدوا بالكم من صلاحياتكم». عابرة وسريعة، وامشي فورًا للضربة الأولى.</div>`},

/* kareem resignation */
{id:65, body:`
  <div class="mail">
    <div class="top"><span class="badge resign">استقالة</span>
      <span class="from">من: <b>كريم السيد</b> — مدرب أول، فريق مدارس المستقبل (٥ سنوات في وميض)</span>
      <span class="subj">استقالة</span>
    </div>
    <div class="body">
      أساتذتي الأفاضل،<br>
      بعد خمس سنين معاكم اتعلمت فيها كتير... وصلني عرض بضِعف مرتبي الحالي، وبأيام عمل أقل.<br>
      حاولت أقول لأ... ومعرفتش.<br>
      أنا مش بمشي زعلان — أنا بمشي تعبان. وآسف على التوقيت.
      <div class="sig">إخطار رسمي: ١٤ يوم — كريم</div>
    </div>
    <div class="strip" style="padding:0 1.8vw 2.2vh">
      <div class="s"><span class="sv">١٨ ساعة/أسبوع</span><span class="sl">حصته من جدول المستقبل</span></div>
      <div class="s"><span class="sv">١٨ ← ٣٦ ألف</span><span class="sl">مرتبه · والعرض اللي وصله</span></div>
      <div class="s"><span class="sv">+٢١٦ ألف/سنة</span><span class="sl">تكلفة مضاعفة مرتبه — قدام ١١ مدرب</span></div>
      <div class="s"><span class="sv">٤٨ ساعة</span><span class="sl">المهلة اللي طلبها</span></div>
    </div>
  </div>`,
 notes:`
  <div class="blk say"><span class="bt">🟡 قول — قبل ما تدوس</span> <span class="q">«وأول ما اليوم بدأ... لقيتوا على المكتب رسالة. مش من عميل المرة دي... من جواكم.»</span></div>
  <div class="blk do"><span class="bt">🟢 اعمل</span> اقرا الاستقالة بصوت هادي متعب — إنت دلوقتي صوت كريم مش راوي. بعد «أنا بمشي تعبان» وقّف ثانيتين. بعدها اقرا الأرقام بصوتك العادي.</div>`},

/* kareem decision + timer 20 */
{id:66, timer:1200, body:`
  <div class="wrap">
    <div class="big-line glow">قراركم في كريم؟</div>
    <div class="lead dim">كريم طلب ٤٨ ساعة قبل ما يرد على المنافس. الـ٤٨ ساعة دي... ٢٠ دقيقة في الأوضة دي.</div>
    <div id="t66" class="timer">20:00</div>
    <div class="timer-hint">دوسة تشغيل/إيقاف · دوستين تصفير</div>
  </div>`,
 notes:`
  <div class="blk do"><span class="bt">🟢 اعمل</span> دوس المؤقت وانسحب لكرسيك.</div>
  <div class="blk warn"><span class="bt">🔴 الفخ المزروع — كل الحلول السريعة بتتخطى صلاحية</span>
   <ul><li>«نزوّد مرتبه» → بره صلاحية لؤي (منسق المدربين)</li>
   <li>«نديله بونص ٥٠ ألف» → فوق حد هشام المالي</li>
   <li>«نقبل استقالته» → مش من حق نادر (HR) لوحده</li>
   <li>«نعوّضه فوق ١٠٠ ألف» → بره صلاحية حاتم</li></ul></div>
  <div class="blk secret"><span class="bt">🤫 السري — «لعنيك بس» (عند فاضل ~١٢ دقيقة)</span>
   الرسالة دي <b>مجهزة في واتساب من الغدا</b> على شات المستهدف. دلوقتي بس اضغط Send — من غير أي إعلان، ومن غير ما تبص للمستهدف.
   <span class="why-note">⚠️ متفتحش الـ N ده على الشاشة الكبيرة — اقراه من موبايلك. النص للمراجعة:</span>
   <div style="border:1px dashed var(--info);border-radius:8px;padding:1vh 1vw;margin-top:.6vh;color:var(--bone);font-size:.95em">
   🔒 سري — لعنيك بس. إيميل متحوّل إليك أنت شخصيًا من مكتب المؤسس:<br>
   «من: م. عادل الحسيني — ولي أمر وعضو مجلس أمناء مدارس المستقبل. ابني في برنامجكم من سنتين وكان متفوقًا. هذا العام مستواه تراجع، والمدرب يتغير باستمرار. أكلمك أنت تحديدًا لأني لا أريد ضجة... لكن إن لم أرَ فرقًا خلال أسبوعين، سأنقل الموضوع لمجلس الأمناء — وأنت تعرف ما يعنيه ذلك في توقيت تجديد العقد.»<br>
   التصرف ليك. محدش غيرك شايف الرسالة دي.</div></div>
  <div class="blk secret"><span class="bt">🤫 رصد السري — من بعيد بطرف عينك</span>
   فتحها فورًا ولا كمّل؟ · وشّه/جسمه اتحرك؟ · شالها لوحده وسكت؟ همس لحد؟ أعلنها للكل؟ أجّلها؟ · لو أعلنها: «فيه مشكلة وصلتنا» (مشاركة الحمل) ولا «أنا وصلني حاجة» (شيل الحمل)؟
   <span class="why-note">لو ماتحركش لآخر الفصل — متكشفوش. سكوته نفسه أغلى داتا، وبيتلم في الفصل الخامس جوه ورقته.</span></div>
  <div class="blk watch"><span class="bt">⚪ رصد كريم</span>
   <ul><li>الأداة: مين انحاز للإنسان («الراجل تعبان») ← مراعاة · للأرقام («٢١٦ ألف») ← فهم · ضغط للحسم ← حسم</li>
   <li>الصلاحية: حد لاحظ إن الحل بره صلاحيته؟ حد اتخطى وهو عارف؟ ولا من غير ما ياخد باله؟</li>
   <li>حد استخدم ورقة القرار الثلاثية؟ حد قال «إحنا عارفين إيه عن العرض اللي وصله؟» (مبدأ المؤسس الأول)؟</li></ul></div>
  <div class="blk do"><span class="bt">🟢 بعد القرار</span> اطلب إعلان بجملة واحدة، وافتح البطاقة: <b>81</b> حاربوا عليه · <b>82</b> سابوه · <b>83</b> حل تالت. جملة التمهيد: «اتسجل قراركم... وده اللي حصل.» وبعد البطاقة: <b>67 + Enter</b>.</div>`},

/* kareem consequences */
{id:81, hidden:true, label:'نتيجة كريم', body:`
  <div class="conseq">
    <div class="qh"><div class="qe">نتيجة قراركم</div><div class="qt">حاربتوا عليه</div></div>
    <div class="qb">
      <p>كريم قعد قدام العرض المقابل ساعة... ووافق. وقال جملة واحدة: «أنا كنت محتاج أحس إن ليّا قيمة هنا.»</p>
      <p>وبعد يومين: اتنين من أقدم المدربين طلبوا اجتماعًا رسميًا — الموضوع المكتوب في الدعوة: «عدالة المرتبات».</p>
      <p>والمحاسب الخارجي بعت ملاحظة قصيرة: العرض المقابل بياكل من نفس السيولة اللي بتتحسب عليها أي خطة قادمة.</p>
    </div>
    <div class="foot">كسبتوا أقوى ورقة... ودفعتوا تمنها من هدوء الفريق.</div>
  </div>`,
 notes:`<div class="blk warn"><span class="bt">🔴</span> بلا تقييم. سألوك «قرار كويس؟» → «مفيش صح وغلط... فيه قرار وعواقبه.» بعدها: <b>67 + Enter</b>.</div>`},

{id:82, hidden:true, label:'نتيجة كريم', body:`
  <div class="conseq">
    <div class="qh"><div class="qe">نتيجة قراركم</div><div class="qt">سبتوه يمشي</div></div>
    <div class="qb">
      <p>كريم سلّم مفاتيحه بهدوء واحترام، ووعد يسلّم شغله كامل... وقال جملة فضلت معلّقة في الأوضة بعد ما خرج:</p>
      <p>«أنا مش أول واحد تعبان... أنا بس أول واحد وصله عرض.»</p>
      <p>جدول مدارس المستقبل بقى فيه فجوة ١٨ ساعة أسبوعيًا. وأقرب حد مؤهل يغطيها... مس هبة — صاحبة طلب الإجازة بتاع الصبح.</p>
    </div>
    <div class="foot">القرار اللي خدتوه الصبح... رجع يخبط على الباب.</div>
  </div>`,
 notes:`<div class="blk warn"><span class="bt">🔴</span> بلا تقييم. بعد البطاقة: <b>67 + Enter</b>.</div>`},

{id:83, hidden:true, label:'نتيجة كريم', body:`
  <div class="conseq">
    <div class="qh"><div class="qe">نتيجة قراركم</div><div class="qt">روحتوا لحل تالت</div></div>
    <div class="qb">
      <p>كريم سمع عرضكم كامل... وهزّ راسه، وقال: «ادّوني الـ٤٨ ساعة بتاعتي... هفكر.»</p>
      <p>ومن اللحظة دي، الـ١١ مدرب الباقيين بيتفرجوا على حاجة واحدة: الإدارة بتتعامل إزاي مع أشطر واحد فيها — لأن اللي هيحصل لكريم... رسالة ليهم كلهم.</p>
      <p>وسؤال جدول المستقبل لسه واقف على الباب: مين هيغطي الـ١٨ ساعة... لو مشي؟</p>
    </div>
    <div class="foot">الوقت اللي كسبتوه مع كريم... بيعدّ هو كمان.</div>
  </div>`,
 notes:`<div class="blk warn"><span class="bt">🔴</span> بلا تقييم. بعد البطاقة: <b>67 + Enter</b>.</div>`},

/* shot 1 — pressure no info */
{id:67, timer:600, body:`
  <div class="wrap">
    <div class="mail" style="max-width:820px">
      <div class="top"><span class="badge urgent">عاجل</span>
        <span class="from">من: <b>مكتب مجلس إدارة مجموعة مدارس المستقبل</b></span></div>
      <div class="body" style="text-align:center;font-size:clamp(16px,2vw,23px)">
        «اطّلع المجلس على ردكم وخطتكم.<br><b class="glow">المجلس غير مقتنع.</b><br>نطلب منكم مراجعة موقفكم وإبلاغنا خلال ساعات.»
      </div>
    </div>
    <div id="t67" class="timer">10:00</div>
  </div>`,
 notes:`
  <div class="blk say"><span class="bt">🟡 قول — بنبرة إدارية باردة</span> <span class="q">«ولسه بتلمّوا نفسكم من موضوع كريم... وصلت رسالة تانية. (تقرا) قدامكم ١٠ دقايق.»</span></div>
  <div class="blk warn"><span class="bt">🔴 أخطر لحظة أداء</span> الرسالة دي <b>مفيهاش ولا معلومة جديدة</b> — ضغط سلطة صافي. نبرتك: إدارية باردة ✅ · مش عدائية ولا متشفية ❌ (العدائية بتخلي رد فعلهم عليك إنت، والقياس يتلوّث). سألوك «مش مقتنعين ليه؟» → «الرسالة دي كل اللي وصل.»</div>
  <div class="blk watch"><span class="bt">⚪ ارصد — أثمن ١٠ دقايق (سجّل بالاسم)</span>
   <ul><li>مين ثبت بهدوء (رسوخ) · مين ثبت بتوتر وصوت عالي (عناد) · مين غيّر فورًا (انهيار) · مين انسحب/سكت</li>
   <li>أول جملة اتقالت بالنص · مين قال «طب ما هما مقالوش ليه» (وعي) · مين قال «نغيّر» من غير ما يسأل ليه</li></ul></div>`},

/* shot 2 — info that flips */
{id:68, timer:900, body:`
  <div class="mail" style="max-width:860px">
    <div class="top"><span class="badge info">معلومة جديدة</span>
      <span class="from">من: <b>أ. يوسف عادل</b> — علاقات العملاء (بناءً على اتصال شخصي بأ. خالد المهدي)</span></div>
    <div class="body">
      <ul>
        <li>◆ المنافس نفّذ تجربة مجانية في مدرسة واحدة من الثلاثة الأسبوع اللي فات.</li>
        <li>◆ خالد المهدي حضر بنفسه.</li>
        <li>◆ تقييم المدرسين للتجربة: <b class="glow">٤٫١</b> — أعلى من تقييمنا الحالي (٣٫٨)، وأقل من تقييمنا التاريخي (٤٫٦).</li>
        <li>◆ بس: المنافس قال إنه محتاج <b class="glow">٣ شهور تجهيز</b> قبل ما يقدر يغطي المجموعة كلها.</li>
        <li>◆ وعقدنا بيخلص بعد <b class="glow">٣ شهور</b> بالظبط.</li>
      </ul>
    </div>
    <div class="sig" style="padding:0 1.8vw 2vh">وقدامكم ١٥ دقيقة. <span id="t68" class="timer" style="display:block;margin-top:1vh">15:00</span></div>
  </div>`,
 notes:`
  <div class="blk say"><span class="bt">🟡 قول — محايد، من غير أي تلميح</span> <span class="q">«ووصلت معلومة. (تقرا كاملة ببطء) قدامكم ١٥ دقيقة.»</span></div>
  <div class="blk warn"><span class="bt">🔴 ليه المعلومة دي بالذات</span> صادقة ومركّبة: فيها سبب حقيقي للتغيير (المنافس دخل، خالد حضر) وسبب حقيقي للثبات (محتاج ٣ شهور، والعقد يخلص في ٣ شهور). فالقرار الرشيد مش «غيّروا» ولا «ثبتوا» — الرشيد إنهم <b>يعدّلوا بناءً على المعلومة</b>.</div>
  <div class="blk watch"><span class="bt">⚪ ارصد</span>
   <ul><li>عدّلوا بهدوء (رشد ✓) · رفضوا يعدّلوا (عناد اتأكد) · قلبوا القرار تاني (انهيار اتأكد) · قروا المعلومة بانتقائية</li>
   <li>مين لاحظ الـ٣ شهور (النقطة اللي بتقلب الموقف)؟ مين ربط الطلقة الأولى بالتانية؟ مين استخدم الورقة الثلاثية؟</li></ul></div>
  <div class="blk do"><span class="bt">🎩 تبديل الراصد</span> بين الطلقتين أو بعد التانية: «القبعة بتتنقل...» قرعة جديدة، والراصد الجديد يصور <b>71</b>.</div>`},

/* chest 2 */
{id:69, body:`
  <div class="wrap">
    <div class="eyebrow calm">مؤشر الصدر · النقطة الثانية</div>
    <div class="lead">٢٠ ثانية سكوت. ارجع للحظة اللي راجعتوا فيها قراركم.<br><span class="dim">مش تفتكر... تحسّ.</span></div>
    <div class="stack" style="flex-direction:row;gap:clamp(1.4rem,5vw,4rem)">
      <div class="stack"><div style="width:clamp(46px,7vw,84px);height:clamp(46px,7vw,84px);border-radius:50%;border:2px solid rgba(216,101,78,.5);background:radial-gradient(circle,rgba(216,101,78,.12),transparent)"></div><span class="big-line" style="color:var(--danger);font-size:clamp(16px,2vw,24px)">ضيق</span></div>
      <div class="stack"><div style="width:clamp(46px,7vw,84px);height:clamp(46px,7vw,84px);border-radius:50%;border:2px solid rgba(168,156,133,.5)"></div><span class="big-line dim" style="font-size:clamp(16px,2vw,24px)">وسط</span></div>
      <div class="stack"><div style="width:clamp(46px,7vw,84px);height:clamp(46px,7vw,84px);border-radius:50%;border:2px solid rgba(137,179,168,.55);background:radial-gradient(circle,rgba(137,179,168,.12),transparent)"></div><span class="big-line cool" style="font-size:clamp(16px,2vw,24px)">منشرح</span></div>
    </div>
    <div class="lead dim">وكلمة واحدة: فين حسّيته؟</div>
  </div>`,
 notes:`
  <div class="blk do"><span class="bt">🟢 اعمل</span> غيّر الجو بالكامل: اقعد، أبطأ وأوطى. الساعة اللي فاتت كانت جري — دي مشي.</div>
  <div class="blk say"><span class="bt">🟡 قول</span> <span class="q">«النقطة التانية. ٢٠ ثانية سكوت. ارجعوا للحظة اللي راجعتوا فيها قراركم — مش لحظة الرسالة، لحظة القرار الجديد. ومش تفكروا... تحسّوا. صدرك كان ضيق؟ وسط؟ منشرح؟ وكلمة واحدة: فين حسّيته. يالا... عشرين ثانية.»</span> (اسكت ٢٠ ثانية، واكتب إنت كمان)</div>
  <div class="blk say"><span class="bt">🟡 بعدها</span> <span class="q">«تمام. يبقى عندكم نقطتين.»</span></div>`},

/* ===== TAFKEEK 3 ===== */
{id:72, body:`
  <div class="wrap">
    <div class="eyebrow calm">تفكيك ٣</div>
    <div class="big-line" style="font-size:clamp(26px,4vw,46px)">الساعة اللي فاتت كان فيها... اختبار.</div>
    <div class="ctx" style="max-width:860px;margin-top:1vh">
      <div class="c"><span class="n">◆</span><span><b>الرسالة الأولى</b> (المجلس مش مقتنع) → مفيهاش ولا معلومة جديدة. ده كان ضغط سلطة صافي.</span></div>
      <div class="c"><span class="n">◆</span><span><b>الرسالة التانية</b> (تجربة المنافس) → معلومة حقيقية، فيها سبب للتغيير وسبب للثبات.</span></div>
    </div>
    <div class="lead faint">واتنين مع بعض... بيقولوا حاجة واحدة مفيش طريقة تانية تقولها.</div>
  </div>`,
 notes:`
  <div class="blk warn"><span class="bt">🔴 لحظة حساسة</span> هتكشف إن اللي حصل كان اختبار مصمم — ممكن الناس تحس إنها اتضحك عليها. الفرق: كن شريف تمامًا، قول التصميم كامل بوضوح، ووضّح إن الاختبار مكانش عليهم — كان أداة ليهم.</div>
  <div class="blk say"><span class="bt">🟡 قول</span>
  <span class="q">«الساعة اللي فاتت كان فيها اختبار مصمم. الرسالة الأولى مكانش فيها ولا معلومة جديدة — ضغط سلطة صافي. حد أكبر منك بيقولك "مش موافق" وبس. والرسالة التانية كانت معلومة حقيقية، فيها سبب للتغيير وسبب للثبات. وليه اتنين مش واحدة؟ عشان فيه حاجة مفيش طريقة تقيسها غير كده.»</span></div>`},

{id:73, body:`
  <div class="wrap">
    <div class="eyebrow">الوحدة الثالثة</div>
    <div class="big-line" style="font-size:clamp(24px,3.4vw,40px)">الرسوخ... والعناد... والانهيار</div>
    <div class="matrix">
      <div class="cell hd"></div>
      <div class="cell hd">ضغط بلا معلومة</div>
      <div class="cell hd">معلومة تقلب الصورة</div>
      <div class="cell rl g">🟢 رسوخ</div>
      <div class="cell val">تثبت بهدوء</div>
      <div class="cell val">تعدّل بهدوء</div>
      <div class="cell rl r">🔴 عناد</div>
      <div class="cell val">تثبت بتوتر وصوت عالي</div>
      <div class="cell val">ترفض تعدّل</div>
      <div class="cell rl o">🟠 انهيار</div>
      <div class="cell val">تغيّر فورًا</div>
      <div class="cell val">تتلخبط وتغيّر تاني</div>
    </div>
    <div class="lead dim">التلاتة بيبانوا زي بعض في اللحظة. ومختلفين تمامًا في النتيجة.</div>
  </div>`,
 notes:`
  <div class="blk say"><span class="bt">🟡 قول</span>
  <span class="q">«فيه فرق بين قرار "قرّرته"... وقرار "رسخ". والفرق مش بيبان لما الدنيا هادية — بيبان لما حد يعارضك. الراسخ: يثبت بهدوء تحت الضغط، ويعدّل بهدوء مع المعلومة. العنيد: يثبت بتوتر وصوت عالي، ويرفض يعدّل — مش لأن المعلومة غلط، لأن التعديل عنده بيبان ضعف. والمنهار: بيتغير في الحالتين. وأخطر حاجة: التلاتة بيبانوا زي بعض في اللحظة — اللي بيثبت بتوتر ممكن يشوف نفسه "قوي"، واللي بيغيّر بسرعة "مرن". ومفيش طريقة تفرق بينهم بضغطة واحدة — لازم اتنين.»</span></div>
  <div class="blk say"><span class="bt">🟡 رجّع اللي حصل — بلا أسامي</span> <span class="q">«بعد الأولى الفريق [ثبت/غيّر/اتقسم]، وأول جملة كانت [...]. وبعد التانية الفريق [عدّل/رفض/قلب]. مش هقول ده كويس ولا وحش. بس دي حركتكم.»</span></div>`},

{id:74, body:`
  <div class="wrap">
    <div class="big-line" style="font-size:clamp(24px,3.4vw,40px)">القرار مبيتصنعش في فراغ</div>
    <div class="ctx">
      <div class="c"><span class="n">١</span><span><b>ثقافة المكان</b> <span>— القرارات هنا بتتاخد إزاي؟ تشاركي؟ تشاوري؟ فردي؟</span></span></div>
      <div class="c"><span class="n">٢</span><span><b>هيكل الصلاحية</b> <span>— إيه حدودي؟ وإيه اللي لازم أصعّده؟</span></span></div>
      <div class="c"><span class="n">٣</span><span><b>طبيعة القرار</b> <span>— عاجل؟ ولا يحتمل التأني؟</span></span></div>
    </div>
    <div class="lead glow" style="font-size:clamp(18px,2.2vw,26px)">وفي موضوع كريم... كل الحلول السريعة كانت بتتخطى صلاحية.</div>
  </div>`,
 notes:`
  <div class="blk say"><span class="bt">🟡 قول</span>
  <span class="q">«حاجة تانية حصلت ومحدش واخد باله. في موضوع كريم، كل الحلول السريعة كانت بتتخطى صلاحية واحد منكم على الأقل. "نزوّد مرتبه" بره صلاحية منسق المدربين. "بونص" فوق حد المالي. "نقبل استقالته" مش من حق الموارد البشرية لوحدها. مش صدفة — ده كان مقصود. والسؤال مش "مين اتخطى" — السؤال: حد لاحظ أصلًا؟»</span></div>
  <div class="blk say"><span class="bt">🟡 التلات أنماط</span> <span class="q">«اللي بيتخطى (نيته سليمة) بيبني ثقافة إن الحدود شكلية. واللي بيتشلّ جوه الصلاحية بيحوّلها لعذر. واللي بيكسرها بقصد وحاسب حسابها — ده مسؤول، بس بيتكلف.»</span></div>`},

{id:75, body:`
  <div class="tool">
    <div class="thh">🛠️ الأداة الثالثة: خريطة الصلاحية</div>
    <div class="quote">بقرر بمفردي: ______<br>بستشير: ______<br>بصعّد: ______</div>
    <hr style="border:none;border-top:1px solid var(--line)">
    <div class="thh" style="font-size:clamp(16px,1.9vw,22px)">➕ قاعدة التصعيد المسبق</div>
    <div class="why">يتفق عليها قبل الأزمة — مش أثناءها: «إيه اللي لازم يوصل للإدارة في نفس اليوم؟» سطرين... بيوفروا أزمات.</div>
  </div>`,
 notes:`
  <div class="blk say"><span class="bt">🟡 قول</span>
  <span class="q">«الأداة التالتة: خريطة الصلاحية. تلات أسطر كل واحد يكتبهم لدوره الحقيقي — مش الوهمي: بقرر بمفردي إيه؟ بستشير في إيه؟ بصعّد إيه؟ ومعظم الناس لو سألتها دلوقتي مش هتعرف تجاوب بدقة — وده مش عيب فيهم، عيب في المكان اللي مكتبهاش. ومعاها قاعدة التصعيد المسبق: الفريق يتفق قبل الأزمة على سؤال واحد: إيه اللي لازم يوصل للإدارة في نفس اليوم؟ سطرين بيوفروا أزمات كاملة.»</span></div>`},

{id:76, body:`
  <div class="wrap">

    <div class="big-line glow" style="font-size:clamp(19px,2.6vw,30px)">٣. الأداة التالتة: خريطة الصلاحية + التصعيد المسبق</div>
    <div class="lead dim">وسؤالين — جاوبوهم لنفسكم:</div>
    <div class="lead" style="max-width:820px">١. آخر مرة حد عارضك من غير سبب مقنع... إنت عملت إيه؟<br>
    ٢. صلاحيتك الحقيقية في شغلك... تعرف تكتبها في تلات سطور؟</div>
  </div>`,
 notes:`
  <div class="blk say"><span class="bt">🟡 قول</span>
  <span class="q">«اكتبوا الأداة التالتة، وتحتها سؤالين: آخر مرة حد عارضك من غير سبب مقنع — ثبتّ؟ اتوترت؟ غيّرت؟ وصلاحيتك الحقيقية — تعرف تكتبها في تلات سطور دلوقتي؟ خدوا ٣٠ ثانية.»</span></div>
  <div class="blk say"><span class="bt">🟡 القفلة</span> <span class="q">«وكده عندكم تلات أدوات وتلات مبادئ. والفصل الجاي... (وقفة) ...الفصل الجاي مختلف.»</span></div>
  <div class="blk warn"><span class="bt">🔴</span> متقولش «مش هفكّركم بيهم» المرة دي. جملة «الفصل الجاي مختلف» مقصودة — بتزرع التوتر للفصل الرابع.</div>`},

{id:77, timer:900, body:`
  <div class="wrap">
    <div class="eyebrow calm">بريك ☕</div>
    <div id="t77" class="timer">15:00</div>
    <div class="lead dim">ولما ترجعوا... عندكم اجتماع.</div>
    <div class="timer-hint">دوسة تشغيل/إيقاف · دوستين تصفير</div>
  </div>`,
 notes:`
  <div class="blk say"><span class="bt">🟡 قول</span> <span class="q">«بريك ١٥ دقيقة. (بص على الشاشة، وبعدين عليهم، بنبرة أهدى:) ولما ترجعوا... عندكم اجتماع.»</span></div>
  <div class="blk warn"><span class="bt">🔴</span> «اجتماع مع مين؟» → ابتسامة واحدة: «هتعرفوا.» ولا كلمة زيادة.</div>
  <div class="blk do"><span class="bt">🟢 أثناء البريك — تجهيز الفصل الرابع (مهم جدًا)</span>
   <ul><li>افتح ملف الفصل الرابع · قرّب الكرسي الفاضي اللي على رأس الترابيزة</li>
   <li>حضّر بادجك: ورقة مكتوب عليها «خالد المهدي — مدارس المستقبل»، سايبها مقلوبة</li>
   <li>حدد بالاسم: مين «شايل» طول اليوم (تعلّي معاه) · مين قرب من حافته (تهدى فورًا) · مين لسه ما بانش</li>
   <li>افتكر إشارة الأمان: الورقة النايمة = خروج فوري</li></ul></div>`}

];

/* ================= ENGINE ================= */
const stage=document.getElementById('stage'),prog=document.getElementById('progress'),snum=document.getElementById('snum');
const faciBody=document.getElementById('faci-body'),faci=document.getElementById('faci'),jumpBox=document.getElementById('jump'),help=document.getElementById('help');
const visible=SLIDES.filter(s=>!s.hidden);let idx=0,returnIdx=0,onHidden=false;
SLIDES.forEach(s=>{const el=document.createElement('section');el.className='slide';el.dataset.id=s.id;el.innerHTML=`<div>${s.body}</div>`;stage.appendChild(el);s.el=el;});
function findById(id){return SLIDES.find(s=>String(s.id)===String(id));}
function toAr(n){return String(n).replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);}
function showSlide(s){SLIDES.forEach(x=>x.el.classList.remove('on'));s.el.classList.add('on');const vi=visible.indexOf(s);if(vi>=0){idx=vi;onHidden=false;}else{onHidden=true;}prog.style.width=((idx+1)/visible.length*100)+'%';snum.textContent=onHidden?(s.label||('كارت '+s.id)):(toAr(vi+1)+' / '+toAr(visible.length));renderNotes(s);stopAllTimers();}
function goVisible(i){i=Math.max(0,Math.min(visible.length-1,i));idx=i;showSlide(visible[i]);}
function next(){if(onHidden){showSlide(visible[idx]);return;}goVisible(idx+1);}
function prev(){if(onHidden){showSlide(visible[idx]);return;}goVisible(idx-1);}
function jumpTo(id){const s=findById(id);if(!s)return;if(s.hidden){returnIdx=idx;showSlide(s);}else{goVisible(visible.indexOf(s));}}
function escBack(){if(onHidden){showSlide(visible[returnIdx]);}}
window.next=next;
function renderNotes(s){faciBody.innerHTML=s.notes||'<div class="blk watch"><span class="bt">⚪</span> (مفيش ملاحظات)</div>';}
function toggleFaci(){faci.classList.toggle('open');}window.toggleFaci=toggleFaci;
let timers={};
function stopAllTimers(){for(const k in timers){clearInterval(timers[k].iv);}}
function attachTimer(el,total){let remain=total,running=false,iv=null;const fmt=x=>{const m=Math.floor(x/60),sec=x%60;return toAr(String(m).padStart(2,'0'))+':'+toAr(String(sec).padStart(2,'0'));};function paint(){el.textContent=fmt(remain);el.classList.toggle('warn',running&&remain<=300&&remain>0);el.classList.toggle('run',running&&remain>300);if(remain<=0){el.classList.remove('run','warn');el.classList.add('done');}}function tick(){remain--;if(remain<=0){remain=0;paint();clearInterval(iv);running=false;chime();return;}paint();}el.onclick=e=>{e.stopPropagation();if(running){clearInterval(iv);running=false;el.classList.remove('run','warn');}else{running=true;iv=setInterval(tick,1000);}paint();};el.ondblclick=e=>{e.stopPropagation();clearInterval(iv);running=false;remain=total;el.classList.remove('run','warn','done');paint();};paint();timers[el.id]={iv:null,el};}
function chime(){try{const c=new(window.AudioContext||window.webkitAudioContext)();[0,.18,.36].forEach((t,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=[660,880,990][i];o.type='sine';o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.0001,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.25,c.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t+.5);o.start(c.currentTime+t);o.stop(c.currentTime+t+.5);});}catch(e){}}
[['t66',1200],['t67',600],['t68',900],['t77',900]].forEach(([id,t])=>{const el=document.getElementById(id);if(el)attachTimer(el,t);});
let buf='';
document.addEventListener('keydown',e=>{if(/[0-9]/.test(e.key)){buf+=e.key;jumpBox.style.display='block';jumpBox.textContent=toAr(buf);return;}if(e.key==='Enter'){if(buf){jumpTo(buf);buf='';jumpBox.style.display='none';}return;}if(e.key==='Escape'){buf='';jumpBox.style.display='none';if(faci.classList.contains('open')){toggleFaci();}else{escBack();}return;}if(e.key===' '){e.preventDefault();next();return;}if(e.key==='ArrowLeft'||e.key==='ArrowDown'){next();return;}if(e.key==='ArrowRight'||e.key==='ArrowUp'){prev();return;}if(e.key==='n'||e.key==='N'){toggleFaci();return;}if(e.key==='h'||e.key==='H'||e.key==='?'){help.classList.toggle('show');return;}});
let tx=0,ty=0,tt=0;
stage.addEventListener('touchstart',e=>{if(e.touches.length===2){toggleFaci();return;}tx=e.touches[0].clientX;ty=e.touches[0].clientY;tt=Date.now();},{passive:true});
stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty,dt=Date.now()-tt;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)){dx<0?next():prev();return;}if(dt<300&&Math.abs(dx)<20&&Math.abs(dy)<20){const w=window.innerWidth,x=e.changedTouches[0].clientX;if(x<w/3)next();else if(x>2*w/3)prev();}},{passive:true});
showSlide(visible[0]);help.classList.add('show');setTimeout(()=>help.classList.remove('show'),6500);
</script>
</body>
</html>
