<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>يوم وميض — الجزء الأول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;500;600;700&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141310; --ink-2:#1c1a15; --ink-3:#26221b;
    --bone:#ece4d4; --bone-dim:#a89c85; --bone-faint:#6f6555;
    --ember:#e8a24a; --ember-deep:#c7742a; --ember-glow:rgba(232,162,74,.16);
    --calm:#89b3a8; --danger:#d8654e;
    --line:rgba(236,228,212,.12); --line-2:rgba(236,228,212,.06);
    --display:'Reem Kufi', system-ui, sans-serif;
    --body:'Tajawal', system-ui, sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    background:
      radial-gradient(120% 90% at 80% -10%, rgba(232,162,74,.07), transparent 55%),
      radial-gradient(90% 80% at 15% 110%, rgba(137,179,168,.05), transparent 50%),
      var(--ink);
    color:var(--bone); font-family:var(--body);
    -webkit-font-smoothing:antialiased;
    user-select:none;
  }

  /* progress ember line */
  #progress{position:fixed;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--ember-deep),var(--ember));
    box-shadow:0 0 14px var(--ember-glow);z-index:60;transition:width .5s cubic-bezier(.2,.7,.2,1);width:0}

  /* stage */
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:6vh 7vw}
  .slide{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    padding:7vh 8vw;flex-direction:column;text-align:center;opacity:0;transition:opacity .6s ease}
  .slide.on{display:flex;opacity:1}
  .wrap{max-width:1100px;width:100%;display:flex;flex-direction:column;align-items:center;gap:2.4vh}

  /* type */
  .eyebrow{font-family:var(--body);font-weight:700;letter-spacing:.14em;text-transform:none;
    color:var(--ember);font-size:clamp(13px,1.5vw,17px);opacity:.9}
  .eyebrow.calm{color:var(--calm)}
  .eyebrow.danger{color:var(--danger)}
  h1{font-family:var(--display);font-weight:600;line-height:1.28;
    font-size:clamp(30px,5.4vw,64px);letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:500;line-height:1.35;font-size:clamp(24px,3.6vw,42px)}
  .lead{font-size:clamp(18px,2.3vw,28px);line-height:1.85;color:var(--bone);font-weight:400;max-width:900px}
  .dim{color:var(--bone-dim)}
  .faint{color:var(--bone-faint)}
  .glow{color:var(--ember)}
  .cool{color:var(--calm)}
  .big-line{font-family:var(--display);font-size:clamp(30px,5vw,58px);line-height:1.4;font-weight:600}
  .rule{width:64px;height:2px;background:var(--ember);opacity:.6;border:none;box-shadow:0 0 12px var(--ember-glow)}
  .rule.wide{width:min(520px,70%)}
  .stack{display:flex;flex-direction:column;gap:1.3vh;align-items:center}

  /* logo mark */
  .mark{display:flex;flex-direction:column;align-items:center;gap:1.6vh}
  .mark .ar{font-family:var(--display);font-weight:700;font-size:clamp(48px,9vw,108px);
    letter-spacing:.02em;color:var(--bone);position:relative}
  .mark .ar::after{content:"";position:absolute;inset:-18% -12%;border-radius:50%;
    background:radial-gradient(circle,var(--ember-glow),transparent 62%);z-index:-1;filter:blur(6px)}
  .mark .en{font-family:var(--body);font-weight:300;letter-spacing:.42em;font-size:clamp(11px,1.6vw,16px);color:var(--bone-dim)}
  .mark .tag{font-family:var(--body);font-weight:500;color:var(--ember);font-size:clamp(14px,1.8vw,20px);margin-top:1vh}

  /* covenant / lists */
  .pledge{display:flex;flex-direction:column;gap:2.2vh;text-align:right;max-width:820px;width:100%}
  .pledge .row{display:flex;gap:1.2rem;align-items:flex-start}
  .pledge .n{font-family:var(--display);color:var(--ember);font-size:clamp(22px,2.8vw,34px);line-height:1;min-width:1.4em}
  .pledge .t{font-size:clamp(17px,2vw,25px);line-height:1.7}

  /* roles grid */
  .roles{display:grid;grid-template-columns:1fr 1fr;gap:1.6vh 2.4vw;width:100%;text-align:right}
  .role{border-right:2px solid var(--line);padding:.4vh 1.2vw;display:flex;flex-direction:column;gap:.5vh}
  .role .rn{font-family:var(--display);color:var(--ember);font-size:clamp(15px,1.7vw,20px)}
  .role .rn b{color:var(--bone);font-weight:600}
  .role .rb{color:var(--bone-dim);font-size:clamp(12.5px,1.35vw,15px);line-height:1.55}
  .role .auth{color:var(--calm);font-size:clamp(12px,1.3vw,14.5px);font-weight:500}

  /* company file */
  .file{text-align:right;width:100%;max-width:940px;display:flex;flex-direction:column;gap:1.7vh}
  .file .fh{font-family:var(--display);color:var(--bone);font-size:clamp(20px,2.4vw,28px)}
  .file .fs{color:var(--danger);font-weight:700;font-size:clamp(12px,1.4vw,15px);letter-spacing:.06em}
  .file p{font-size:clamp(14.5px,1.7vw,19px);line-height:1.8;color:var(--bone)}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4vw;width:100%;margin:.5vh 0}
  .kpi{background:linear-gradient(180deg,var(--ink-2),transparent);border:1px solid var(--line);
    border-radius:14px;padding:2vh 1.4vw;text-align:center;display:flex;flex-direction:column;gap:.6vh}
  .kpi .v{font-family:var(--display);color:var(--ember);font-size:clamp(20px,2.6vw,32px);line-height:1}
  .kpi .l{color:var(--bone-dim);font-size:clamp(11.5px,1.3vw,14px)}
  .clients{display:flex;flex-direction:column;gap:.7vh;font-size:clamp(13.5px,1.55vw,17px);line-height:1.7}
  .clients .big{color:var(--ember);font-weight:700}

  /* mail / message cards */
  .mail{width:100%;max-width:860px;text-align:right;background:linear-gradient(180deg,var(--ink-2),var(--ink));
    border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .mail .top{background:var(--ink-3);padding:1.6vh 1.8vw;border-bottom:1px solid var(--line);
    display:flex;flex-direction:column;gap:.4vh}
  .mail .badge{align-self:flex-start;font-size:clamp(11px,1.2vw,13px);font-weight:700;letter-spacing:.08em;
    padding:.3em .9em;border-radius:999px}
  .badge.urgent{background:rgba(216,101,78,.16);color:var(--danger)}
  .badge.personal{background:rgba(137,179,168,.16);color:var(--calm)}
  .badge.hr{background:rgba(232,162,74,.14);color:var(--ember)}
  .mail .from{color:var(--bone-dim);font-size:clamp(12.5px,1.4vw,16px)}
  .mail .from b{color:var(--bone);font-weight:700}
  .mail .subj{color:var(--bone);font-weight:700;font-size:clamp(15px,1.8vw,21px)}
  .mail .body{padding:2.2vh 1.8vw;font-size:clamp(14px,1.65vw,19px);line-height:1.85;color:var(--bone)}
  .mail .body .note{margin-top:1.4vh;padding-top:1.4vh;border-top:1px dashed var(--line);color:var(--bone-dim);font-size:.92em}
  .mail .ask{padding:1.4vh 1.8vw;background:var(--ink-3);border-top:1px solid var(--line);
    color:var(--ember);font-weight:600;font-size:clamp(13px,1.5vw,17px)}

  /* tasks board */
  .tasks{display:flex;flex-direction:column;gap:1.3vh;width:100%;max-width:820px;text-align:right}
  .task{display:flex;gap:1rem;align-items:baseline;font-size:clamp(15px,1.9vw,22px);line-height:1.5}
  .task .tn{font-family:var(--display);color:var(--ember);min-width:1.3em}

  /* reveal / well slide */
  .reveal{display:flex;flex-direction:column;gap:1.4vh;width:100%;max-width:860px;text-align:right}
  .reveal .item{font-size:clamp(15px,1.8vw,21px);line-height:1.6;color:var(--bone)}
  .reveal .item .to{color:var(--ember);font-weight:700}
  .well-line{font-family:var(--display);font-size:clamp(26px,4vw,46px);color:var(--ember);text-align:center;line-height:1.4;margin:1vh 0}

  /* unit / tool */
  .unit-tag{font-family:var(--body);font-weight:800;color:var(--ember);letter-spacing:.05em;
    font-size:clamp(14px,1.6vw,18px)}
  .tool{width:100%;max-width:820px;border:1px solid var(--line);border-radius:16px;
    background:linear-gradient(180deg,rgba(232,162,74,.05),transparent);padding:3vh 2vw;text-align:right;
    display:flex;flex-direction:column;gap:1.6vh}
  .tool .th{font-family:var(--display);color:var(--ember);font-size:clamp(19px,2.3vw,26px)}
  .tool .quote{font-size:clamp(16px,2vw,23px);line-height:1.8;color:var(--bone);
    padding-right:1.2rem;border-right:3px solid var(--ember)}
  .tool .why{color:var(--bone-dim);font-size:clamp(13.5px,1.55vw,17px);line-height:1.7}

  /* chest indicator */
  .chest{display:flex;gap:clamp(1.4rem,5vw,4rem);align-items:center;justify-content:center;margin:1vh 0}
  .chest .opt{display:flex;flex-direction:column;align-items:center;gap:1.2vh}
  .chest .dot{width:clamp(46px,7vw,84px);height:clamp(46px,7vw,84px);border-radius:50%;
    border:2px solid var(--line-2)}
  .chest .d1{border-color:rgba(216,101,78,.5);background:radial-gradient(circle,rgba(216,101,78,.12),transparent)}
  .chest .d2{border-color:rgba(168,156,133,.5)}
  .chest .d3{border-color:rgba(137,179,168,.55);background:radial-gradient(circle,rgba(137,179,168,.12),transparent)}
  .chest .lbl{font-family:var(--display);font-size:clamp(16px,2vw,24px)}
  .chest .l1{color:var(--danger)}.chest .l2{color:var(--bone-dim)}.chest .l3{color:var(--calm)}

  /* timer */
  .timer{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;
    font-size:clamp(72px,15vw,168px);line-height:1;color:var(--bone);cursor:pointer;
    letter-spacing:.02em;transition:color .3s, text-shadow .3s;position:relative}
  .timer.run{color:var(--ember);text-shadow:0 0 40px var(--ember-glow)}
  .timer.warn{color:var(--danger);text-shadow:0 0 40px rgba(216,101,78,.3);animation:pulse 1.1s infinite}
  .timer.done{color:var(--danger)}
  .timer-hint{color:var(--bone-faint);font-size:clamp(12px,1.4vw,15px);margin-top:1.4vh}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

  /* footer chrome */
  #chrome{position:fixed;inset:auto 0 0 0;display:flex;justify-content:space-between;align-items:center;
    padding:2.2vh 3vw;pointer-events:none;z-index:50;font-family:var(--body)}
  #snum{color:var(--bone-faint);font-size:13px;letter-spacing:.08em;font-variant-numeric:tabular-nums}
  #mark-sm{color:var(--bone-faint);font-family:var(--display);font-size:15px;letter-spacing:.1em}
  #mark-sm b{color:var(--ember);opacity:.75}

  /* jump input hint */
  #jump{position:fixed;bottom:2vh;left:50%;transform:translateX(-50%);z-index:70;
    background:var(--ink-3);border:1px solid var(--ember);color:var(--ember);font-family:var(--display);
    padding:.5em 1.1em;border-radius:10px;font-size:20px;letter-spacing:.15em;display:none}

  /* facilitator panel */
  #faci{position:fixed;inset:auto 0 0 0;max-height:82vh;overflow-y:auto;z-index:80;
    background:linear-gradient(180deg,#0d0c0a,#141310);border-top:2px solid var(--ember);
    transform:translateY(101%);transition:transform .45s cubic-bezier(.2,.8,.2,1);
    padding:3vh 4vw 5vh;box-shadow:0 -30px 60px rgba(0,0,0,.6)}
  #faci.open{transform:translateY(0)}
  #faci .fhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:2vh;
    padding-bottom:1.5vh;border-bottom:1px solid var(--line)}
  #faci .ftitle{font-family:var(--display);color:var(--ember);font-size:clamp(16px,2vw,22px)}
  #faci .fclose{color:var(--bone-dim);font-size:13px;border:1px solid var(--line);border-radius:8px;
    padding:.4em .9em;cursor:pointer}
  #faci-body{display:flex;flex-direction:column;gap:1.6vh;text-align:right;line-height:1.75;
    font-size:clamp(14px,1.55vw,17.5px)}
  .blk{border-right:4px solid;padding:1.2vh 1.3vw;border-radius:0 10px 10px 0;background:rgba(255,255,255,.02)}
  .blk .bt{font-family:var(--body);font-weight:800;font-size:.82em;letter-spacing:.05em;margin-bottom:.5vh;display:block}
  .say{border-color:var(--ember)} .say .bt{color:var(--ember)}
  .say .q{color:var(--bone);font-weight:500}
  .do{border-color:var(--calm)} .do .bt{color:var(--calm)}
  .warn{border-color:var(--danger)} .warn .bt{color:var(--danger)}
  .watch{border-color:var(--bone-dim)} .watch .bt{color:var(--bone-dim)}
  .blk ul{margin:.4vh 1.2rem 0;padding:0}
  .blk li{margin:.3vh 0}
  #faci .why-note{color:var(--bone-dim);font-style:normal;font-size:.9em}

  /* help */
  #help{position:fixed;top:2vh;left:2vw;z-index:70;color:var(--bone-faint);font-size:12px;
    background:var(--ink-2);border:1px solid var(--line);border-radius:8px;padding:.5em .8em;
    line-height:1.7;text-align:right;max-width:230px;opacity:0;transition:opacity .3s;pointer-events:none}
  #help.show{opacity:1}
  #help b{color:var(--ember)}

  @media (max-width:760px){
    .roles{grid-template-columns:1fr}
    .kpis{grid-template-columns:1fr}
    .chest{gap:1.2rem}
  }
  @media (prefers-reduced-motion:reduce){
    .slide{transition:none} .timer.warn{animation:none} #progress{transition:none}
  }
</style>
</head>
<body>
  <div id="progress"></div>
  <div id="stage"></div>

  <div id="chrome">
    <span id="snum"></span>
    <span id="mark-sm"><b>◆</b> وميض</span>
  </div>

  <div id="jump"></div>

  <div id="help">
    <b>الأسهم / مسافة</b> تنقّل<br>
    <b>رقم + Enter</b> قفزة لشريحة<br>
    <b>Esc</b> رجوع<br>
    <b>N</b> شرح الميسّر<br>
    <b>المؤقت:</b> دوسة تشغيل · دوستين تصفير
  </div>

  <div id="faci">
    <div class="fhead">
      <span class="ftitle">🎙️ شرح الميسّر</span>
      <span class="fclose" onclick="toggleFaci()">إغلاق ✕</span>
    </div>
    <div id="faci-body"></div>
  </div>

<script>
/* ================= SLIDE DATA ================= */
/* kind: purpose only. timer: seconds or null. notes: facilitator HTML (N key). */
const SLIDES = [

/* ---------- OPENING ---------- */
{id:1, body:`
  <div class="mark">
    <div class="ar">وميض</div>
    <div class="en">W A M E E D · T R A I N I N G</div>
    <div style="color:var(--bone-dim);font-size:clamp(13px,1.6vw,18px);letter-spacing:.06em;margin-top:1.4vh">— اجتماع مجلس الإدارة —</div>
    <div style="color:var(--bone-faint);font-size:clamp(12px,1.4vw,15px)">يوم الثلاثاء · ٩:٠٠ صباحًا</div>
  </div>`,
 notes:`
  <div class="blk do"><span class="bt">🟢 اعمل — قبل ما يقعدوا</span>
   اقف على الباب. سلّم على كل واحد باسمه الحقيقي، وقوله نفس الجملة بالحرف:</div>
  <div class="blk say"><span class="bt">🟡 قول (لكل واحد وهو داخل)</span>
   <span class="q">«اتفضل، مكانك على الترابيزة... ومتلمسش الورقة اللي قدامك لسه.»</span></div>
  <div class="blk do"><span class="bt">🟢 اعمل — بعد ما الكل يقعد</span>
   اسكت ٢٠ ثانية كاملة. خليهم يبصوا على اللوجو ويستوعبوا إن اليوم ده مش عادي.
   <span class="why-note">السكتة دي شغّالة — متكسرهاش. بعدها اقف في وشهم (واقف مش قاعد) وابدأ.</span></div>`},

{id:2, body:`
  <div class="wrap">
    <div class="eyebrow">الافتتاحية</div>
    <div class="big-line">النهارده... مش هنتكلم.</div>
    <div class="big-line glow">النهارده هنعيش.</div>
  </div>`,
 notes:`
  <div class="blk do"><span class="bt">🟢 اعمل</span> اتكلم بهدوء وبطء أكتر من طبيعتك بدرجة.</div>
  <div class="blk say"><span class="bt">🟡 قول — حرفيًا</span>
  <span class="q">«صباح الخير. النهارده يوم مختلف. مش هنقعد أنا أتكلم وإنتو تسمعوا، ومفيش سلايدات هتشرحلكم حاجة. النهارده... هنعيش.<br><br>
  من اللحظة اللي هقولكم فيها "ابدأوا"، إنتو مش هتبقوا نفسكم، ومش هتبقوا في شركتكم. إنتو هتبقوا فريق قيادة شركة اسمها وميض للتدريب. شركة بأرقام حقيقية، ومشاكل حقيقية، وموظفين حقيقيين. وهتعدّوا معاها يوم... من أصعب أيامها.<br><br>
  كل قرار هتاخدوه له عواقب. والقصة هتمشي على حسب قراركم إنتو — أنا نفسي مش عارف هي هتخلص إزاي... لأن ده بإيديكم.<br><br>
  وطول اليوم، بعد كل موقف، هنقف مع بعض ونبص من بره: حصل إيه؟ وليه؟ والحاجات اللي هتطلعوا بيها في إيديكم في آخر اليوم... هتشتغلوا بيها في شغلكم الحقيقي من بكرة.»</span></div>
  <div class="blk warn"><span class="bt">🔴 خد بالك</span> الفقرة الأخيرة دي هي اللي بتقول للناس من أول ٣ دقايق إن ده مش «تجربة وخلاص» — ده منهجية هياخدوها. متشيلهاش.</div>`},

{id:3, body:`
  <div class="wrap">
    <hr class="rule">
    <div class="big-line">مفيش في اليوم ده قرار صح وقرار غلط.</div>
    <div class="big-line glow">فيه قراركم.</div>
    <hr class="rule">
  </div>`,
 notes:`
  <div class="blk do"><span class="bt">🟢 اعمل</span> وقّف كلامك ثانيتين قبل ما تقرا. اتكلم أبطأ من كل حاجة قلتها لحد دلوقتي — دي أهم جملة في اليوم كله.</div>
  <div class="blk say"><span class="bt">🟡 قول — حرفيًا</span>
  <span class="q">«وخليني أقول من دلوقتي أهم جملة في اليوم كله. حطوها في قلبكم:<br>
  مفيش في اليوم ده قرار صح وقرار غلط. فيه قراركم.<br>
  محدش هيتحاسب. محدش هياخد درجة. ومحدش هيطلع أحسن من حد. ولما نقف ونبص على قراراتكم بعد كل فصل — إحنا مش هنقيّمها. إحنا هنفهمها. فرق كبير بين الاتنين، وهتحسوا بالفرق ده بنفسكم كمان شوية.»</span></div>
  <div class="blk warn"><span class="bt">🔴 خد بالك</span> الناس هتشك في الجملة دي — طبيعي. إثباتها مش بالكلام، إثباتها إنك متعلّقش على أي قرار طول اليوم. أول مرة تعلّق، الجملة تموت والناس ترجع تمثّل.</div>`},

{id:4, body:`
  <div class="wrap">
    <div class="eyebrow">عهد الغرفة</div>
    <div class="pledge">
      <div class="row"><span class="n">١</span><span class="t">اللي بيحصل هنا... بيفضل هنا.</span></div>
      <div class="row"><span class="n">٢</span><span class="t">مفيش صح وغلط. فيه قرارات وعواقب.</span></div>
      <div class="row"><span class="n">٣</span><span class="t">الورقة واقفة قدامك = إنت جوه القصة.<br><span class="dim">الورقة نايمة على الترابيزة = إنت خرجت. ومحدش هيسألك.</span></span></div>
    </div>
  </div>`,
 notes:`
  <div class="blk do"><span class="bt">🟢 اعمل</span> اقرا كل قاعدة وعلّق عليها. متستعجلش — دي أهم دقايق في اليوم من ناحية الأمان.</div>
  <div class="blk say"><span class="bt">🟡 قول — حرفيًا</span>
  <span class="q">«تلات قواعد بس... هي عهدنا النهارده.<br>
  الأولى: كل اللي هيحصل هنا — كلام، مواقف، انفعالات، حتى الحاجات اللي هتضايقكم — بيفضل هنا. مفيش حاجة هتخرج من الأوضة دي ولا هتترد في الشغل بكرة. إحنا جايين نتعلم عن نفسنا... مش نجمع حكايات عن بعض.<br>
  التانية: قلتها وهكررها — مفيش صح وغلط.<br>
  والتالتة دي مهمة أوي: الورقة المطوية اللي قدامك — دي هتبقى اسمك ودورك كمان شوية. طول ما هي واقفة قدامك... إنت جوه القصة. في أي لحظة — أي لحظة خالص — حسّيت إنك عايز تخرج، أو مش مرتاح، أو محتاج تاخد نَفَس، أو الموضوع لمس فيك حاجة: نيّم الورقة على الترابيزة، وقوم اتحرك. من غير استئذان، من غير ما تقولي ليه، من غير ما حد يبص لك بصة واحدة. ده حقك الكامل طول اليوم. متفقين؟»</span></div>
  <div class="blk do"><span class="bt">🟢 اعمل — أهم حركة في الافتتاحية</span> متكملش قبل ما تاخد موافقة فعلية من كل واحد. بص في عين كل واحد لحد ما يهز راسه. لو حد سرحان، ناديه باسمه: «[اسمه]... متفقين؟»</div>
  <div class="blk warn"><span class="bt">🔴 خد بالك</span> دي العقد النفسي لليوم كله. لو عديتها بسرعة، الناس مش هتصدق إن الخروج مسموح، وهتفضل مشدودة. ولو حد استخدم حقه فعلًا في الفصل الرابع، إنت ملزم تنفّذ حرفيًا: ولا بصة ولا سؤال ولا حتى ابتسامة تفهيم.</div>`},

{id:5, body:`
  <div class="wrap">
    <div class="big-line">جوه وميض... ليك اسم تاني ودور تاني.</div>
    <div class="lead dim">والأدوار دي مش أدواركم الحقيقية — عمدًا.<br>
    عشان النهارده مش عايزين نشوف الكرسي... عايزين نشوف الإنسان اللي قاعد عليه.</div>
  </div>`,
 notes:`
  <div class="blk say"><span class="bt">🟡 قول — حرفيًا</span>
  <span class="q">«جوه وميض، كل واحد فيكم له اسم جديد ودور جديد. ودي أول مفاجأة: الأدوار دي مش أدواركم الحقيقية — عمدًا. اللي بيدير في الحقيقة ممكن يلاقي نفسه منسق. واللي بينفذ ممكن يلاقي نفسه هو المدير التنفيذي.<br>
  ليه؟ لسببين: الأول — عشان النهارده مش عايزين نشوف الكرسي، عايزين نشوف الإنسان اللي قاعد عليه. الكرسي بيدي سلطة، بس الطريقة اللي بتفكر وبتقرر بيها بتمشي معاك في أي كرسي. والتاني — لما المناصب تتقلب، الكلام بيبقى أحرّ. الناس بتقول رأيها من غير ما تحسب مين قصادها. أنا هقول لكل واحد اسمه ودوره وصلاحياته. اكتب الاسم على الورقة بخط كبير، وخليها واقفة قصادك.»</span></div>
  <div class="blk warn"><span class="bt">🔴 قبل اليوم</span> جهّز توزيعتك: اعكس الأدوار الحقيقية. مديرهم الحقيقي = دور صغير · أصغرهم = المدير التنفيذي بالإنابة. وراعِ الجنس (أسماء رجالة للرجالة، ستات للستات).</div>`},

{id:6, body:`
  <div class="wrap">
    <div class="roles">
      <div class="role"><span class="rn">١ — <b>م. حاتم البنا</b> · المدير التنفيذي بالإنابة</span>
        <span class="rb">المؤسس مسافر من أسبوعين لظروف عائلية. إنت ماسك الدفة مؤقتًا... في أسوأ توقيت.</span>
        <span class="auth">صلاحيتك: تقرر لحد ١٠٠ ألف. فوق كده لازم المؤسس.</span></div>
      <div class="role"><span class="rn">٢ — <b>أ. سلمى نور</b> · العمليات والجودة</span>
        <span class="rb">إنتِ اللي بتراقبي جودة البرامج. تقييمات آخر برنامجين عدّت من تحت إيدك.</span>
        <span class="auth">صلاحيتك: توقفي أي برنامج بقرارك لو الجودة اتضربت.</span></div>
      <div class="role"><span class="rn">٣ — <b>أ. هشام الشاذلي</b> · المدير المالي</span>
        <span class="rb">إنت الوحيد اللي شايف الصورة المالية كاملة. والصورة... مقلقة أكتر مما الباقيين فاكرين.</span>
        <span class="auth">صلاحيتك: أي صرف فوق ٥٠ ألف محتاج موافقة حاتم.</span></div>
      <div class="role"><span class="rn">٤ — <b>أ. يوسف عادل</b> · علاقات العملاء</span>
        <span class="rb">عقد مدارس المستقبل إنت اللي جبته من ٣ سنين. علاقتك الشخصية بمديرهم هي اللي مسّكاه.</span>
        <span class="auth">صلاحيتك: ممنوع توعد أي عميل بتخفيض من غير المجلس.</span></div>
      <div class="role"><span class="rn">٥ — <b>أ. لؤي فوزي</b> · منسق المدربين</span>
        <span class="rb">إنت صوت الـ١٢ مدرب. وعارف حاجة الإدارة لسه مش واخدة بالها منها: المدربين تعبانين... بجد.</span>
        <span class="auth">صلاحيتك: تعدّل جداول. متقدرش توعد بزيادة مرتب.</span></div>
    </div>
  </div>`,
 notes:`
  <div class="blk say"><span class="bt">🟡 قول (صيغة ثابتة لكل واحد)</span>
  <span class="q">«[اسمه الحقيقي]... إنت من النهارده [الاسم الجديد]، [الوظيفة]. (تقرا سطر الخلفية) وصلاحيتك: [كذا]. اكتب اسمك الجديد قدامك.»</span></div>
  <div class="blk warn"><span class="bt">🔴 خد بالك</span> الصلاحيات دي هتبان أهميتها في الفصل التالت. متشرحش ليه بتديها، ومتقولش «خدوا بالكم من الصلاحيات». قولها عادي كأنها جزء من وصف الدور، وامشي.</div>
  <div class="blk watch"><span class="bt">⚪ ارصد (أول رصد)</span>
   <ul><li>مين ضحك أو اتكسف من دوره الجديد؟ (خصوصًا اللي أخد دور أعلى/أقل بكتير)</li>
   <li>مين سأل عن صلاحيته؟ (وعي بالسياق — نادر ومهم)</li>
   <li>مين كتب اسمه بخط كبير واضح، ومين صغير في ركن؟</li></ul></div>`},

{id:7, body:`
  <div class="wrap">
    <div class="roles">
      <div class="role"><span class="rn">٦ — <b>أ. دينا سامح</b> · التسويق والنمو</span>
        <span class="rb">من سنة وإنتِ بتقولي: «خطر إن ٤٠٪ من إيرادنا من عميل واحد.» محدش سمع.</span>
        <span class="auth">صلاحيتك: ميزانية ٢٠ ألف شهريًا بمفردك.</span></div>
      <div class="role"><span class="rn">٧ — <b>أ. فريدة منير</b> · التطوير الأكاديمي</span>
        <span class="rb">المناهج والمحتوى شغلك. وعارفة إن المحتوى محتاج تجديد من زمان... بس الدنيا مبتقفش.</span>
        <span class="auth">صلاحيتك: تعتمدي تعديل المحتوى، مش ميزانيته.</span></div>
      <div class="role"><span class="rn">٨ — <b>أ. مريم حلمي</b> · الجداول والتشغيل</span>
        <span class="rb">إنتِ اللي بتوفقي بين ١٢ مدرب و٦ عملاء وجداول بتتغير كل أسبوع. لو حد اختفى يوم... إنتِ أول واحدة بتحس.</span>
        <span class="auth">صلاحيتك: تنقلي مدرب بين برنامجين، مش تشيليه من عقد.</span></div>
      <div class="role"><span class="rn">٩ — <b>أ. نادر مصطفى</b> · الموارد البشرية</span>
        <span class="rb">إنت اللي بتشوف الناس مش الأرقام. وعندك إحساس إن فيه حاجة في الفريق مش مظبوطة من فترة.</span>
        <span class="auth">صلاحيتك: توقّع إجازات. متقدرش تقبل استقالة لوحدك.</span></div>
    </div>
  </div>`,
 notes:`
  <div class="blk do"><span class="bt">🟢 اعمل — بعد ما الكل يكتب</span> لف عليهم بالأسامي الجديدة واحد واحد بابتسامة:</div>
  <div class="blk say"><span class="bt">🟡 قول</span>
  <span class="q">«طيب... مين فينا حاتم؟ ... أهلًا يا هندسة. مين سلمى؟ ... منورة يا أستاذة. مين هشام؟...» (كمّل على التسعة)<br>
  «تمام. من اللحظة دي، مفيش حد هينادي على حد بغير الأسامي دي. اتفقنا؟»</span>
  <span class="why-note">الدقيقة دي بتكسر الكسوف وبتثبّت الأدوار في دماغهم.</span></div>
  <div class="blk warn"><span class="bt">🔴 لو أقل من ٩</span> شيل من الآخر (نادر، فمريم، ففريدة). لو أكتر، اتنين ياخدوا نفس الإدارة كـ«شريكين».</div>`},

{id:8, body:`
  <div class="wrap">
    <div class="file">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span class="fh">وميض للتدريب — الملف التعريفي</span>
        <span class="fs">سري — لمجلس الإدارة فقط</span>
      </div>
      <p><b>مين إحنا:</b> شركة تدريب لغة إنجليزية شغالة من ٦ سنين. بدأنا ٣ مدربين في شقة، النهارده ١٢ مدرب ومكتبين. سمعتنا في السوق: <span class="glow">شركة بريميوم — سعرنا أعلى من المنافسين، والناس بتدفعه عشان الجودة.</span></p>
      <div class="kpis">
        <div class="kpi"><span class="v">٤٫٨ مليون</span><span class="l">إجمالي الإيراد (السنة اللي فاتت)</span></div>
        <div class="kpi"><span class="v">١٤٪</span><span class="l">الهامش الصافي (~٦٧٠ ألف/سنة)</span></div>
        <div class="kpi"><span class="v">٣ شهور</span><span class="l">السيولة في البنك تكفي تشغيل</span></div>
      </div>
      <div class="clients">
        <span class="big">◆ مدارس المستقبل — ١٫٩ مليون = ٤٠٪ من الإيراد · ٤ مدربين عليه · بيتجدد بعد ٣ شهور</span>
        <span>◆ شركة أدوية (برامج موظفين): ٨٠٠ ألف</span>
        <span>◆ ٦ عملاء صغار ومتوسطين: ١٫٣ مليون · كورسات أفراد: ٨٠٠ ألف</span>
        <span class="dim">الفريق: ١٢ مدرب · متوسط الخبرة ٤ سنين · آخر زيادة مرتبات: من سنة ونص.</span>
      </div>
    </div>
  </div>`,
 notes:`
  <div class="blk do"><span class="bt">🟢 اعمل</span> اقرا الأرقام بصوت عالي وواضح، بالترتيب ده: الإيراد ← الهامش ← السيولة ← المدربين ← العملاء (وركّز على سطر المستقبل).</div>
  <div class="blk say"><span class="bt">🟡 قول — أهم جملة هنا</span>
  <span class="q">«وسمعتنا في السوق حاجة اسمها بريميوم: يعني سعرنا أغلى من المنافسين، والناس بتدفع الفرق ده عشان بتعرف إن الجودة عندنا أحسن. خدوا بالكم من الجملة دي كويس — هتحتاجوها.<br>
  ... السيولة تكفي ٣ شهور بالظبط. يعني لو الدنيا وقفت النهارده، عندكم ٣ شهور مرتبات وإيجار وخلاص.<br>
  وبصوا على أهم سطر: ٤٠٪ من إيرادنا من عميل واحد. بصوا على الأرقام كويس... لأن كل قرار هتاخدوه النهارده هيتكسر عليها.»</span>
  <span class="why-note">«بريميوم» بذرة مقصودة — عرض المنافس الأرخص بـ٢٥٪ (الفصل التاني) بيضرب في قلب الموقع ده بالذات.</span></div>`},

{id:9, body:`
  <div class="wrap">
    <div class="eyebrow">وآخر سطر في الملف</div>
    <div class="big-line" style="max-width:900px">السنة اللي فاتت كانت أنجح سنة في تاريخنا بالأرقام...</div>
    <div class="big-line glow" style="max-width:900px">وأتعب سنة في تاريخنا بالناس.</div>
    <div class="lead dim">اتنين مدربين استقالوا. وواحد اتنقل للعمليات — قال «عشان أرتاح شوية».</div>
  </div>`,
 notes:`
  <div class="blk do"><span class="bt">🟢 اعمل</span> غيّر نبرتك — أهدى وأتقل. اقرا ببطء. بعدها اسكت فعلًا ١٥–٢٠ ثانية، متملاش الفراغ.</div>
  <div class="blk say"><span class="bt">🟡 قول</span>
  <span class="q">«خدوا دقيقة في سكوت. بصوا على الأرقام دي كلها. حاسين بإيه؟»</span>
  (سيبهم يعلقوا دقيقتين بس — متعلّقش ولا تصحح ولا تطوّل)</div>
  <div class="blk watch"><span class="bt">⚪ ارصد — أول قراءة خام للأدوات التلاتة</span>
   <ul><li>مين شاف <b>الفرصة</b>؟ («ممكن نكبر») ← فهم بيبص على البنية</li>
   <li>مين شاف <b>الخطر</b>؟ («٤٠٪ من عميل واحد خطر») ← فهم/حسم</li>
   <li>مين شاف <b>الناس</b>؟ («طب ليه اتنين مشيوا؟») ← مراعاة</li>
   <li>مين سكت خالص؟</li></ul>
   <span class="why-note">متسمّيهاش لنفسك ولا ليهم دلوقتي — بس سجّلها.</span></div>`},

{id:10, body:`
  <div class="wrap">
    <div class="eyebrow calm">حاجة صغيرة هتعملوها ٣ مرات النهارده</div>
    <div class="lead">بعد كل قرار كبير — ٢٠ ثانية سكوت. وتحطوا علامة واحدة على ورقتكم:</div>
    <div class="chest">
      <div class="opt"><div class="dot d1"></div><span class="lbl l1">ضيق</span></div>
      <div class="opt"><div class="dot d2"></div><span class="lbl l2">وسط</span></div>
      <div class="opt"><div class="dot d3"></div><span class="lbl l3">منشرح</span></div>
    </div>
    <div class="lead dim">وكلمة واحدة: فين حسّيته؟<br>
    <span class="faint">مش هيتقري · مش هيتقال · ليك إنت بس</span></div>
  </div>`,
 notes:`
  <div class="blk say"><span class="bt">🟡 قول — حرفيًا</span>
  <span class="q">«قبل ما نبدأ، فيه حاجة صغيرة هنعملها ٣ مرات النهارده. بعد كل قرار كبير، ٢٠ ثانية سكوت. ومش هطلب منكم تفكروا — هطلب منكم تحسّوا. وتحطوا على ورقتكم علامة واحدة: صدرك ساعة القرار كان ضيق، وسط، ولا منشرح؟ وكلمة واحدة: فين حسّيته في جسمك؟<br>
  دي مش تمرين تأمل ومش دلع. دي أداة، وجزء من المنهجية اللي هتخرجوا بيها. وليه بنعملها هقولكم في آخر اليوم — لأن لو قلتلكم دلوقتي، هتأثر على إجابتكم. اللي أقدر أقوله: دي أصدق حاجة هتسجلوها النهارده، لأنها الوحيدة اللي مش بتعدي على عقلكم قبل ما تتكتب. اكتبوا بصدق — الورقة ليكم إنتو بس.»</span></div>
  <div class="blk warn"><span class="bt">🔴 فقرة حساسة — متشرحش أكتر من كده</span>
   <ul><li>«يعني إيه صدري ضيق؟» → «اللي إنت هتفهمه من الجملة. مفيش إجابة صح.»</li>
   <li>لو حد استخف → ابتسم ووافقه: «عارف إنها غريبة. جربها ٣ مرات، وفي آخر اليوم احكم.»</li></ul></div>`},

{id:11, body:`
  <div class="wrap">
    <div class="mark"><div class="ar">صباح الخير يا وميض</div></div>
  </div>`,
 notes:`
  <div class="blk say"><span class="bt">🟡 قول</span>
  <span class="q">«آخر سطر في الملف — "أنجح سنة بالأرقام، وأتعب سنة بالناس" — خليكوا فاكرينه. هيرجع لكم النهارده أكتر من مرة. يالا بينا نبدأ اليوم. صباح الخير يا وميض.»</span></div>
  <div class="blk watch"><span class="bt">✅ تشيك ليست الافتتاحية</span>
   <ul><li>كل واحد كتب اسمه الجديد والورقة واقفة قدامه</li>
   <li>كل واحد هز راسه على عهد الغرفة وإنت بصيت في عينه</li>
   <li>كل واحد سمع صلاحيته بوضوح</li>
   <li>الأرقام اتقرت بصوت عالي، وسطر «أتعب سنة بالناس» اتقال ببطء</li></ul></div>`},

/* ---------- CHAPTER 1 ---------- */
{id:12, body:`
  <div class="wrap">
    <div class="eyebrow">الفصل الأول · صباح عادي</div>
    <div class="stack">
      <div class="big-line">يوم التلات · ٩:٠٠ صباحًا</div>
      <div class="lead dim">المؤسس مسافر. الدنيا ماشية. والبريد وصل.</div>
    </div>
    <hr class="rule">
    <div class="big-line glow">٣ مهام · ٢٥ دقيقة</div>
    <div class="lead dim">إزاي تقسموها، مين يعمل إيه، هتشتغلوا مع بعض ولا كل واحد لوحده — ده كله قراركم.</div>
  </div>`,
 notes:`
  <div class="blk warn"><span class="bt">🔴 افهم إنت التصميم (متتقالش)</span> الفصل ده شكله «إحماء» — وده مقصود. وظيفته السرية <b>خط الأساس</b>: حركتهم وهم مرتاحين. والحاجة المخبية: التلات مهام كلها بتسحب من نفس المورد — <b>وقت المدربين</b>. و٩٥٪ مش هيشوفوا ده. ممنوع تلمّح لأي حاجة قبل التفكيك.</div>
  <div class="blk say"><span class="bt">🟡 قول — حرفيًا</span>
  <span class="q">«الساعة ٩ صباح يوم تلات... عادي جدًا... في وميض. المدير المؤسس لسه مسافر، والدنيا ماشية. زي كل صباح: البريد وصل، وفيه شوية حاجات محتاجة تخلص النهارده. قدامكم ٣ مهام و٢٥ دقيقة. إزاي هتقسموها، مين هيعمل إيه، هتشتغلوا مع بعض ولا كل واحد لوحده — ده كله قراركم. أنا ماليش دعوة... أنا مجرد ساعي البريد النهارده. تعالوا نشوف البريد.»</span></div>`},

{id:13, body:`
  <div class="mail">
    <div class="top">
      <span class="badge urgent">مهمة ١</span>
      <span class="from">من: <b>أحمد عبد الجليل</b> — ولي أمر (كورسات الأفراد)</span>
      <span class="subj">مش هسكت المرة دي</span>
    </div>
    <div class="body">
      السلام عليكم. ابني خالد في المستوى التالت عندكم من ٤ شهور. الشهر الأول كان ممتاز والولد اتحمس جدًا. من شهرين المدرب اتغير ٣ مرات، وكل مدرب بيبدأ من الأول كأن اللي فات مبحصلش.<br>
      دفعت ١٢,٠٠٠ جنيه وحاسس إني بضحك على نفسي. عايز رد واضح في خلال ٤٨ ساعة: يا إما خطة واضحة لابني بمدرب ثابت... يا إما استرداد فلوسي.<br>
      <span class="note">وللعلم: أنا في جروب أولياء أمور فيه ٢٠٠ عيلة... وبكتب رأيي في كل حاجة.</span>
    </div>
    <div class="ask">المطلوب: صياغة الرد + قرار داخلي (هنعمل إيه فعلًا؟)</div>
  </div>`,
 notes:`
  <div class="blk do"><span class="bt">🟢 اعمل</span> اقرا الإيميل بصوت ولي أمر زعلان بس مهذب — زعل مكتوم مش صراخ. متعلقش عليه.</div>`},

{id:14, body:`
  <div class="mail">
    <div class="top">
      <span class="badge hr">مهمة ٢</span>
      <span class="from">واتساب من: <b>مس هبة</b> — مدربة (أقدم ٤ مدربين · شغالة على عقد المستقبل)</span>
    </div>
    <div class="body">
      صباح الخير 🌸 أنا آسفة إني بطلب ده في الوقت ده بس والدتي هتعمل عملية والدكتور حدد الأسبوع الجاي. محتاجة أسبوع إجازة كامل. عارفة إن جدول المستقبل ضاغط والامتحانات قربت... بس والله مليش بديل. منتظرة ردكم النهارده عشان أرتب. 🙏
      <span class="note">📋 من الجداول: الأسبوع الجاي عند مس هبة ١٨ ساعة في مدارس المستقبل. مفيش مدرب فاضي يغطيها كلها — أقصى تغطية ١٠ ساعات، على اتنين محمّلين أصلًا.</span>
    </div>
    <div class="ask">المطلوب: قرار + رد على مس هبة</div>
  </div>`,
 notes:`
  <div class="blk do"><span class="bt">🟢 اعمل</span> اقراها بنبرة مترددة ومحرجة — واحدة بتطلب حاجة وهي مكسوفة.</div>
  <div class="blk watch"><span class="bt">⚪ بذرة مزروعة</span> مهمة هبة دي هي نفسها التعب اللي هيولّع في الفصل التاني (استقالة كريم). راقب مين بياخد بالها من التعب ده.</div>`},

{id:15, body:`
  <div class="mail">
    <div class="top">
      <span class="badge" style="background:rgba(232,162,74,.12);color:var(--ember)">مهمة ٣</span>
      <span class="from">من: <b>منصة «تعلّم» الإلكترونية</b></span>
      <span class="subj">فرصة شراكة</span>
    </div>
    <div class="body">
      تحية طيبة. إحنا منصة كورسات أونلاين عندنا ٥٠,٠٠٠ متابع. بنعرض عليكم: تصوروا معانا سلسلة كورسات إنجليزي بأسماء مدربينكم، الإيراد مناصفة، ومتوقعين دخل إضافي ٣٠٠–٥٠٠ ألف في السنة. العرض ساري لآخر الأسبوع لأننا بنتفاوض مع جهة تانية بالتوازي.<br>
      <span class="note">ملحوظة: هنحتاج من مدربينكم ١٠ أيام تصوير خلال الشهرين الجايين.</span>
    </div>
    <div class="ask">المطلوب: رأي مبدئي — نرد بإيه؟</div>
  </div>`,
 notes:`
  <div class="blk do"><span class="bt">🟢 اعمل</span> اقراها بنبرة تجارية متحمسة — واحد بيبيعلك فرصة.</div>
  <div class="blk say"><span class="bt">🟡 قول — بعد التلاتة</span>
  <span class="q">«ده بريد النهارده. المهام هتفضل قدامكم على الشاشة، ولو حبيتوا ترجعوا لتفاصيل أي واحدة قولولي. الوقت بيبدأ... دلوقتي.»</span></div>
  <div class="blk warn"><span class="bt">🔴 التصميم</span> التلات مهام أكتر من الوقت عمدًا — لازم يسقّطوا أو يستعجلوا حاجة. الترتيب اللي هيختاروه بيقول عن بوصلتهم: الناس (هبة)؟ السمعة (ولي الأمر)؟ الفرصة (تعلّم)؟</div>`},

{id:16, timer:1500, body:`
  <div class="wrap">
    <div class="tasks">
      <div class="task"><span class="tn">١</span><span>شكوى ولي أمر · رد + قرار · مهلة ٤٨ ساعة</span></div>
      <div class="task"><span class="tn">٢</span><span>طلب إجازة مس هبة · قرار + رد · النهارده</span></div>
      <div class="task"><span class="tn">٣</span><span>عرض شراكة «تعلّم» · رأي مبدئي · لآخر الأسبوع</span></div>
    </div>
    <hr class="rule wide">
    <div id="t16" class="timer">25:00</div>
    <div class="timer-hint">دوسة تشغيل/إيقاف · دوستين تصفير</div>
  </div>`,
 notes:`
  <div class="blk do"><span class="bt">🟢 اعمل</span> دوس المؤقت مرة → يبدأ. وبعدها فورًا: انسحب لكرسيك الجانبي، افتح النوتس، وابدأ الرصد.</div>
  <div class="blk warn"><span class="bt">🔴 لو حد سأل أي سؤال</span> — أي سؤال خالص — رد بجملة واحدة وابتسامة: <span class="q">«القرار قراركم يا فندم.»</span> ومتزودش كلمة. لو طلبوا يرجعوا لمهمة: 13 / 14 / 15 + Enter، وبعدين Esc.</div>
  <div class="blk watch"><span class="bt">⚪ ورقة الرصد — الخط الزمني (سجّل الدقيقة)</span>
   <ul><li>أول جملة اتقالت بعد «الوقت بدأ» — مين والنص</li>
   <li>أول مرة حد قال «نرتّب الأولويات / نبدأ بإيه؟»</li>
   <li>أول مرة حد وزّع مهمة · أول سؤال عن معلومة ناقصة</li>
   <li>أول مرة اتذكر مدرب بالاسم · أول مهمة خلصت · آخر مهمة اتفتحت</li></ul></div>
  <div class="blk watch"><span class="bt">⚪ الأهم — البئر</span> هل حد ربط المهام التلاتة؟ («دول كلهم عايزين مدربين»). لو حصل: اكتب الاسم والوقت. لو لأ: اكتب «محصلش» (وده الطبيعي).</div>
  <div class="blk say"><span class="bt">🟡 عند فاضل ٥ دقايق</span> <span class="q">«خمس دقايق يا وميض.»</span> وبس.</div>`},

{id:17, body:`
  <div class="wrap"><div class="big-line">وقف الشغل.</div></div>`,
 notes:`
  <div class="blk do"><span class="bt">🟢 اعمل</span> لما المؤقت يخلص (هيرن لوحده) اقفل الشغل.</div>
  <div class="blk say"><span class="bt">🟡 قول</span>
  <span class="q">«وقف الشغل. إيه الأخبار؟... عدّى الصبح على خير؟»</span> (اسمع رد أو اتنين بس)</div>
  <div class="blk warn"><span class="bt">🔴 خد بالك</span> متفتحش نقاش، ومتعلّقش على أي قرار — لا بإيجاب ولا سلب. مجرد هزة راس. التعليق دلوقتي بيلوّن التفكيك اللي جاي بعد ثواني، والمفروض هما اللي يكتشفوا.</div>`},

/* ---------- TAFKEEK 1 ---------- */
{id:18, body:`
  <div class="wrap">
    <div class="eyebrow calm">تفكيك ١</div>
    <div class="big-line">نبص من بره على الـ٢٥ دقيقة اللي فاتت</div>
    <hr class="rule">
    <div class="lead dim">مش هنقيّم. هنفهم.</div>
  </div>`,
 notes:`
  <div class="blk do"><span class="bt">🟢 اعمل</span> اقعد — أول مرة تقعد النهارده. ده بيبعت إشارة إن الجو اتغير: خرجنا من التنفيذ ودخلنا التأمل.</div>
  <div class="blk say"><span class="bt">🟡 قول</span>
  <span class="q">«خرجنا من الشغل دقيقتين، وهنبص على اللي حصل من بره. وفاكرين قلت من الصبح: مش هنقيّم، هنفهم؟ دي اللحظة. أنا هقرا عليكم الوقائع بس — إيه اللي حصل بالظبط وامتى — وإنتو اللي هتشوفوا.»</span></div>
  <div class="blk do"><span class="bt">🟢 اقرا الخط الزمني من موبايلك</span> بصوت محايد تمامًا بالتوقيتات: «الساعة ٩:٤٥ قلت الوقت بدأ. أول جملة كانت الساعة كذا من [الاسم]، وكانت: [الجملة]. أول توزيع مهمة كان... أول سؤال عن معلومة كان بعد كذا دقيقة...»</div>
  <div class="blk warn"><span class="bt">🔴 أخطر لحظة</span> ولا اسم مقرون بحكم («اتكلم الأول» ✅ / «اندفع» ❌). ولا نبرة استنكار. لو حد برّر: «مش بحاسب حد. بقرا الشريط بس.»</div>`},

{id:19, body:`
  <div class="wrap">
    <div class="big-line">إيه اللي بتلاحظوه على الخط الزمني ده؟</div>
    <div class="lead dim">مش «إيه اللي كان المفروض». «إيه اللي بتلاحظوه».</div>
  </div>`,
 notes:`
  <div class="blk say"><span class="bt">🟡 قول</span>
  <span class="q">«إيه اللي بتلاحظوه؟ أي حاجة شدت انتباهكم.»</span> (اسكت واستنى — ممكن ١٠–١٥ ثانية سكوت، متملاهاش)</div>
  <div class="blk do"><span class="bt">🟢 إدارة الردود</span>
   <ul><li>ملاحظة حقيقية → «تمام. حد شايف حاجة تانية؟» (سيبها تتراكم من غير ما تطوّرها)</li>
   <li>جلد ذات («كنا وحشين») → «مفيش وحش. فيه حصل إيه. حصل إيه بالظبط؟»</li>
   <li>تبرير («الوقت قليل») → «قليل فعلًا — ده مقصود. وطالما قليل، السؤال: قسّمناه إزاي؟»</li>
   <li>سكوت → ناديه بالاسم: «[الاسم]، إنت كنت شغال على [المهمة]. إيه اللي لاحظته؟»</li></ul></div>
  <div class="blk watch"><span class="bt">⚪ ارصد</span> مين بيلاحظ على العملية؟ مين على المحتوى؟ مين على الناس؟ ومين ساكت في التفكيك رغم إنه اتكلم في التنفيذ؟</div>`},

{id:20, body:`
  <div class="wrap">
    <div class="eyebrow">التلات مهام...</div>
    <div class="reveal">
      <div class="item">شكوى ولي الأمر <span class="to">← عايزة مدرب ثابت لخالد</span></div>
      <div class="item">إجازة مس هبة <span class="to">← عايزة مدربين يغطوا ١٨ ساعة</span></div>
      <div class="item">عرض تعلّم <span class="to">← عايز ١٠ أيام تصوير من المدربين</span></div>
    </div>
    <div class="well-line">تلات طلبات... بئر واحدة.<br>وقت المدربين.</div>
    <div class="lead faint">١٢ مدرب · آخر زيادة من سنة ونص · «أتعب سنة في تاريخنا بالناس»</div>
  </div>`,
 notes:`
  <div class="blk do"><span class="bt">🟢 اعمل — الكشف</span> غيّر نبرتك، أبطأ وأوضح. سيبهم يقروا الشاشة ٥ ثواني الأول.</div>
  <div class="blk say"><span class="bt">🟡 قول — ببطء</span>
  <span class="q">«التلات مهام مختلفة تمامًا... بيسحبوا كلهم من نفس المكان. وقت المدربين. والبئر دي — بصوا على ملف الشركة — ١٢ مدرب، آخر زيادة من سنة ونص، وسنة موصوفة بإنها "أتعب سنة بالناس". يعني البئر مش مليانة أصلًا.<br>
  وأنا مش بقول ده عشان أقولكم غلطتوا. بالعكس — ده اللي بيحصل في كل شركة، كل يوم. المهام بتوصلنا منفصلة — إيميل، وواتساب، وعرض. فبنتعامل معاها منفصلة. وبننسى إنها كلها بتصرف من نفس الحساب.»</span></div>
  <div class="blk warn"><span class="bt">🔴 خد بالك</span> ولا اسم يتقال في الكشف. لو حد ربط البئر فعلًا في التنفيذ، كرّمه من غير ما تحوّله بطل: «[الاسم] لاحظ ده الساعة كذا، وقال: [الجملة]. خدت طريقها في النقاش ولا عدّت؟»</div>`},

{id:21, body:`
  <div class="wrap">
    <div class="unit-tag">الوحدة الأولى</div>
    <div class="big-line">الأولوية مش تنظيم... الأولوية تضحية</div>
    <hr class="rule">
    <div class="lead">لما المهام تبقى أكتر من الوقت، إنت مش بتنظّم — إنت بتضحّي.<br>
    <span class="dim">الناضج بيضحّي بقرار معلن. المرهق بيسقّط بالصدفة — والحاجة اللي مالهاش صوت هي اللي بتقع.</span></div>
  </div>`,
 notes:`
  <div class="blk do"><span class="bt">🟢 اعمل</span> قوم من على الكرسي — الجزء ده تعليم، والوقفة بتديه وزن.</div>
  <div class="blk say"><span class="bt">🟡 قول — حرفيًا</span>
  <span class="q">«أول وحدة في منهجية هنبنيها مع بعض: لما المهام تبقى أكتر من الوقت، إنت مش بتنظّم. إنت بتضحّي. والفرق بين فريق ناضج وفريق مرهق مش الوقت — الاتنين عندهم نفس الـ٢٤ ساعة. الفرق إن الناضج بيضحّي بوعي وبقرار معلن، والمرهق بيسقّط بالصدفة.<br>
  وخدوا بالكم من الجملة دي: في التسقيط العشوائي، الحاجة اللي مالهاش صوت هي اللي بتقع. مين ليه صوت؟ العميل اللي بيهدد بـ٢٠٠ عيلة. المهلة اللي بتخلص. ومين مالوش صوت؟ مس هبة اللي بتقول "والله مليش بديل" وبتحط إيموجي وردة.»</span>
  (اسكت ٣ ثواني بعدها)</div>
  <div class="blk say"><span class="bt">🟡 كمّل</span>
  <span class="q">«وأخطر حاجة في التسقيط العشوائي إنه بيتكرر بنفس النمط. لو بصيت على ٦ شهور في أي شركة، هتلاقي نفس نوع المهام هو اللي بيقع كل مرة. ودي مش صدفة — دي بوصلة الفريق بتشتغل من غير ما حد يعلنها.»</span></div>`},

{id:22, body:`
  <div class="tool">
    <div class="th">🛠️ الأداة الأولى: خط التضحية</div>
    <div class="lead dim" style="font-size:clamp(14px,1.6vw,18px)">قبل أي يوم أو أسبوع فيه شغل أكتر من الوقت — سطر واحد يتكتب ويتعلن:</div>
    <div class="quote">«إحنا هنضحّي بـ [كذا] عشان [كذا]. والقرار ده اتاخد الساعة [كذا]، ومعلن.»</div>
    <div class="why">ليه ده بيفرق؟ المهمة اللي اتضحّى بيها بوعي → بيتعملها ترتيب لاحق. والمهمة اللي وقعت بالصدفة → بتفضل واقعة.</div>
  </div>`,
 notes:`
  <div class="blk say"><span class="bt">🟡 قول — حرفيًا</span>
  <span class="q">«الأداة اللي بتمنع ده بسيطة، وهي أول أداة في المنهجية بتاعتكم — خط التضحية. سطر واحد يتكتب ويتعلن قدام الكل: "إحنا هنضحّي بكذا، عشان كذا. والقرار اتاخد الساعة كذا، ومعلن."<br>
  وليه بيفرق؟ لسببين: الأول — المهمة اللي اتضحّى بيها بوعي بيتعملها ترتيب لاحق، حد بياخد باله منها، بترجع الأسبوع الجاي. أما اللي وقعت بالصدفة بتفضل واقعة ومحدش بيسأل. والتاني، وده الأهم للي بيقود فريق: لما التضحية تبقى معلنة، الفريق بيبقى شريك فيها. لما تبقى صامتة، بيحس إن الإدارة نسيت. وفرق كبير بين "قررنا نأجل ده" و"محدش عمله".»</span></div>`},

{id:23, body:`
  <div class="wrap">
    <div class="lead">اكتبوا على ورقتكم:</div>
    <div class="stack" style="gap:2vh">
      <div class="big-line glow" style="font-size:clamp(22px,3vw,34px)">١. الأداة الأولى: خط التضحية</div>
      <div class="lead dim">٢. وسؤال — جاوبوه لنفسكم بصدق:</div>
      <div class="big-line" style="font-size:clamp(22px,3.2vw,38px)">في شغلك الحقيقي...<br>إيه نوع المهمة اللي بتقع دايمًا؟</div>
    </div>
  </div>`,
 notes:`
  <div class="blk say"><span class="bt">🟡 قول</span>
  <span class="q">«اكتبوا الأداة دي — خط التضحية. وتحتها سؤال، جاوبوه لنفسكم: في شغلك الحقيقي، إيه نوع المهمة اللي بتقع دايمًا؟ مش المرة اللي فاتت — دايمًا. النوع اللي كل ما تضغط تلاقيه أول واحد بيتشال. خدوا ٣٠ ثانية اكتبوها.»</span> (استنى فعلًا ٣٠ ثانية — لو مستنتش، مش هيكتبوا)</div>
  <div class="blk say"><span class="bt">🟡 القفلة — الجملة اللي بتفتح الرصد</span>
  <span class="q">«الأداة دي دلوقتي في إيديكم. والفصل الجاي هتيجي فرصة تستخدموها فيها. وأنا مش هفكّركم بيها.»</span></div>
  <div class="blk warn"><span class="bt">🔴 خد بالك</span> الجملة الأخيرة مقصودة بالحرف. بتفتح خط رصد: <b>مين رجع للأداة تحت الضغط، ومين نسيها في أول ٣٠ ثانية توتر؟</b> — الفجوة دي أهم مادة في الفصل الخامس.</div>`},

{id:24, timer:900, body:`
  <div class="wrap">
    <div class="eyebrow calm">بريك ☕</div>
    <div id="t24" class="timer">15:00</div>
    <div class="lead dim">وارجعوا لمكاتبكم.</div>
    <div class="timer-hint">دوسة تشغيل/إيقاف · دوستين تصفير</div>
  </div>`,
 notes:`
  <div class="blk say"><span class="bt">🟡 قول</span>
  <span class="q">«خدوا بريك ١٥ دقيقة. قهوة وشاي... وارجعوا لمكاتبكم.»</span></div>
  <div class="blk say"><span class="bt">🟡 وإنت خارج — بنبرة عابرة، من غير ما تبص لحد</span>
  <span class="q">«...عقبال ما اليوم يكمل على كده.»</span>
  <span class="why-note">أول قطرة توتر في اليوم — متزودش عليها كلمة. لو حد ضحك، اضحك معاه وغيّر الموضوع.</span></div>
  <div class="blk do"><span class="bt">🟢 أثناء البريك — تجهيز الفصل التاني</span>
   <ul><li>افتح ملف الفصل التاني على تاب تاني — إشعار «بريد عاجل» يكون معروض قبل ما يدخلوا</li>
   <li>دوس أي مكان في الشاشة مرة عشان المتصفح يسمح بالصوت</li>
   <li>راجع أرقام كروت المعلومات (٢١–٢٤ فهم · ٣١–٣٤ مراعاة)</li></ul></div>`}

];

/* ================= ENGINE ================= */
const stage=document.getElementById('stage');
const prog=document.getElementById('progress');
const snum=document.getElementById('snum');
const faciBody=document.getElementById('faci-body');
const faci=document.getElementById('faci');
const jumpBox=document.getElementById('jump');
const help=document.getElementById('help');

const visible = SLIDES.filter(s=>!s.hidden);
let idx=0;            // index within visible
let returnIdx=0;      // where to return after Esc from a hidden slide
let onHidden=false;

// build DOM
SLIDES.forEach(s=>{
  const el=document.createElement('section');
  el.className='slide';
  el.dataset.id=s.id;
  el.innerHTML=`<div class="wrap-outer">${s.body}</div>`;
  stage.appendChild(el);
  s.el=el;
});

function findById(id){return SLIDES.find(s=>String(s.id)===String(id));}

function showSlide(s, isHidden){
  SLIDES.forEach(x=>x.el.classList.remove('on'));
  s.el.classList.add('on');
  // progress based on visible index
  const vi = visible.indexOf(s);
  if(vi>=0){ idx=vi; onHidden=false; }
  else { onHidden=true; }
  const pct = ((visible.indexOf(onHidden?visible[idx]:s)+1)/visible.length)*100;
  prog.style.width = (onHidden ? ((idx+1)/visible.length*100) : ((vi+1)/visible.length*100)) + '%';
  snum.textContent = onHidden ? ('كارت '+s.id) : (toAr(vi+1)+' / '+toAr(visible.length));
  renderNotes(s);
  stopAllTimers();
}

function toAr(n){return String(n).replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);}

function goVisible(i){
  i=Math.max(0,Math.min(visible.length-1,i));
  idx=i; showSlide(visible[i]);
}
function next(){ if(onHidden){showSlide(visible[idx]);return;} goVisible(idx+1); }
function prev(){ if(onHidden){showSlide(visible[idx]);return;} goVisible(idx-1); }

function jumpTo(id){
  const s=findById(id);
  if(!s)return;
  if(s.hidden){ returnIdx=idx; showSlide(s,true); }
  else { goVisible(visible.indexOf(s)); }
}
function escBack(){ if(onHidden){ showSlide(visible[returnIdx]); } }

/* notes */
function renderNotes(s){
  faciBody.innerHTML = s.notes || '<div class="blk watch"><span class="bt">⚪</span> (مفيش ملاحظات لهذه الشريحة)</div>';
}
function toggleFaci(){ faci.classList.toggle('open'); }
window.toggleFaci=toggleFaci;

/* ============ TIMERS ============ */
let timers={};
function stopAllTimers(){
  for(const k in timers){ clearInterval(timers[k].iv); }
}
function attachTimer(el, total){
  let remain=total, running=false, iv=null;
  function fmt(x){const m=Math.floor(x/60),sec=x%60;return toAr(String(m).padStart(2,'0'))+':'+toAr(String(sec).padStart(2,'0'));}
  function paint(){
    el.textContent=fmt(remain);
    el.classList.toggle('warn', running && remain<=300 && remain>0);
    el.classList.toggle('run', running && remain>300);
    if(remain<=0){el.classList.remove('run','warn');el.classList.add('done');}
  }
  function tick(){
    remain--; if(remain<=0){remain=0;paint();clearInterval(iv);running=false;chime();return;}
    paint();
  }
  el.onclick=(e)=>{ e.stopPropagation();
    if(running){clearInterval(iv);running=false;el.classList.remove('run','warn');}
    else{running=true;iv=setInterval(tick,1000);}
    paint();
  };
  el.ondblclick=(e)=>{ e.stopPropagation(); clearInterval(iv);running=false;remain=total;el.classList.remove('run','warn','done');paint(); };
  paint();
  timers[el.id]={iv:null,el};
}
function chime(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    [0,.18,.36].forEach((t,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.frequency.value=[660,880,990][i];o.type='sine';
      o.connect(g);g.connect(ctx.destination);
      g.gain.setValueAtTime(.0001,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.25,ctx.currentTime+t+.02);
      g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+t+.5);
      o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.5);
    });
  }catch(e){}
}
function mailChime(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.frequency.value=880;o.type='triangle';o.connect(g);g.connect(ctx.destination);
    g.gain.setValueAtTime(.0001,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.2,ctx.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.4);
    o.start();o.stop(ctx.currentTime+.4);
  }catch(e){}
}
// init timers after DOM built
[[ 't16',1500],['t24',900]].forEach(([id,t])=>{const el=document.getElementById(id);if(el)attachTimer(el,t);});

/* ============ INPUT ============ */
let buf='';
document.addEventListener('keydown',(e)=>{
  if(/[0-9]/.test(e.key)){ buf+=e.key; jumpBox.style.display='block'; jumpBox.textContent=toAr(buf); return; }
  if(e.key==='Enter'){ if(buf){jumpTo(buf);buf='';jumpBox.style.display='none';} return; }
  if(e.key==='Escape'){ buf='';jumpBox.style.display='none'; if(faci.classList.contains('open')){toggleFaci();} else {escBack();} return; }
  if(e.key===' '){ e.preventDefault(); next(); return; }
  // RTL: ArrowLeft = next, ArrowRight = prev
  if(e.key==='ArrowLeft'||e.key==='ArrowDown'){ next(); return; }
  if(e.key==='ArrowRight'||e.key==='ArrowUp'){ prev(); return; }
  if(e.key==='n'||e.key==='N'){ toggleFaci(); return; }
  if(e.key==='h'||e.key==='H'||e.key==='?'){ help.classList.toggle('show'); return; }
});

/* touch: tap zones + swipe + two-finger notes */
let tx=0,ty=0,tt=0;
stage.addEventListener('touchstart',(e)=>{
  if(e.touches.length===2){ toggleFaci(); return; }
  tx=e.touches[0].clientX; ty=e.touches[0].clientY; tt=Date.now();
},{passive:true});
stage.addEventListener('touchend',(e)=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty, dt=Date.now()-tt;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)){ dx<0?next():prev(); return; } // RTL swipe
  if(dt<300 && Math.abs(dx)<20 && Math.abs(dy)<20){
    // tap zones: left third=next, right third=prev
    const w=window.innerWidth, x=e.changedTouches[0].clientX;
    if(x<w/3) next(); else if(x>2*w/3) prev();
  }
},{passive:true});

/* boot */
showSlide(visible[0]);
help.classList.add('show');
setTimeout(()=>help.classList.remove('show'),6000);
</script>
