<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>يوم وميض — الجزء الخامس · قلب المرآة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;500;600;700&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141310; --ink-2:#1c1a15; --ink-3:#26221b;
    --bone:#ece4d4; --bone-dim:#a89c85; --bone-faint:#6f6555;
    --ember:#e8a24a; --ember-deep:#c7742a; --ember-glow:rgba(232,162,74,.16);
    --calm:#89b3a8; --info:#8aa6c8; --danger:#d8654e;
    --line:rgba(236,228,212,.12); --line-2:rgba(236,228,212,.06);
    --display:'Reem Kufi', system-ui, sans-serif; --body:'Tajawal', system-ui, sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{background:
      radial-gradient(130% 100% at 50% -20%, rgba(137,179,168,.07), transparent 55%),
      radial-gradient(100% 80% at 50% 120%, rgba(232,162,74,.06), transparent 55%),
      var(--ink);
    color:var(--bone);font-family:var(--body);-webkit-font-smoothing:antialiased;user-select:none;}
  #progress{position:fixed;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--ember-deep),var(--ember));box-shadow:0 0 14px var(--ember-glow);z-index:60;transition:width .5s cubic-bezier(.2,.7,.2,1);width:0}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:6vh 7vw}
  .slide{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:7vh 8vw;flex-direction:column;text-align:center;opacity:0;transition:opacity .7s ease}
  .slide.on{display:flex;opacity:1}
  .wrap{max-width:1120px;width:100%;display:flex;flex-direction:column;align-items:center;gap:2.3vh}
  .eyebrow{font-weight:700;letter-spacing:.14em;color:var(--ember);font-size:clamp(13px,1.5vw,17px);opacity:.9}
  .eyebrow.calm{color:var(--calm)}.eyebrow.danger{color:var(--danger)}.eyebrow.info{color:var(--info)}
  h1{font-family:var(--display);font-weight:600;line-height:1.28;font-size:clamp(30px,5.4vw,64px)}
  h2{font-family:var(--display);font-weight:500;line-height:1.35;font-size:clamp(23px,3.4vw,40px)}
  .lead{font-size:clamp(18px,2.3vw,28px);line-height:1.85;color:var(--bone);font-weight:400;max-width:920px}
  .dim{color:var(--bone-dim)}.faint{color:var(--bone-faint)}.glow{color:var(--ember)}.cool{color:var(--calm)}.blue{color:var(--info)}
  .big-line{font-family:var(--display);font-size:clamp(28px,4.8vw,56px);line-height:1.4;font-weight:600}
  .rule{width:64px;height:2px;background:var(--ember);opacity:.6;border:none;box-shadow:0 0 12px var(--ember-glow)}
  .rule.wide{width:min(520px,70%)}
  .rule.calm{background:var(--calm);box-shadow:0 0 12px rgba(137,179,168,.25)}
  .stack{display:flex;flex-direction:column;gap:1.3vh;align-items:center}

  /* mirror mark (reveal open) */
  .mirror{font-size:clamp(54px,9vw,110px);opacity:.4;line-height:1;filter:drop-shadow(0 0 30px var(--ember-glow))}

  /* key: 3 tools coding */
  .key3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1.2vw;width:100%;max-width:1000px;text-align:right}
  .kcol{border:1px solid var(--line);border-radius:14px;padding:1.8vh 1.2vw;display:flex;flex-direction:column;gap:.8vh}
  .kcol .kt{font-family:var(--display);font-size:clamp(17px,2vw,24px)}
  .kcol .kq{color:var(--bone);font-size:clamp(13px,1.5vw,17px);line-height:1.5}
  .kcol .ks{color:var(--bone-dim);font-size:clamp(12px,1.35vw,15px);line-height:1.55;border-top:1px solid var(--line-2);padding-top:.7vh;margin-top:.3vh}
  .kcol.fh{border-color:rgba(138,166,200,.4)} .kcol.fh .kt{color:var(--info)}
  .kcol.mr{border-color:rgba(137,179,168,.42)} .kcol.mr .kt{color:var(--calm)}
  .kcol.hs{border-color:rgba(232,162,74,.42)} .kcol.hs .kt{color:var(--ember)}

  /* spectrum table */
  .spec{width:100%;max-width:1000px;border-collapse:collapse;text-align:right;font-size:clamp(13px,1.55vw,18px)}
  .spec th,.spec td{border:1px solid var(--line);padding:1.2vh 1vw;vertical-align:top;line-height:1.5}
  .spec th{font-family:var(--display);font-weight:600;font-size:clamp(14px,1.7vw,20px)}
  .spec .over{color:var(--danger)}.spec .bal{color:var(--calm)}.spec .under{color:var(--bone-dim)}
  .spec td.row-h{color:var(--bone);font-weight:600;font-family:var(--display)}
  .spec-note{font-family:var(--display);color:var(--ember);font-size:clamp(18px,2.4vw,30px);margin-top:1vh}

  /* build map — numbered questions */
  .mapq{display:flex;flex-direction:column;gap:1.15vh;width:100%;max-width:920px;text-align:right}
  .mapq .q{display:flex;gap:1rem;align-items:baseline;font-size:clamp(14px,1.7vw,20px);line-height:1.55}
  .mapq .q .n{font-family:var(--display);color:var(--ember);min-width:1.5em;font-size:clamp(17px,2vw,26px)}
  .mapq .q b{color:var(--bone);font-weight:700}
  .mapq .q .sub{color:var(--bone-dim)}

  /* mirror-round formula */
  .formula{width:100%;max-width:900px;border:1px solid rgba(137,179,168,.35);border-radius:16px;background:linear-gradient(180deg,rgba(137,179,168,.06),transparent);padding:2.6vh 2vw;text-align:right;display:flex;flex-direction:column;gap:1.4vh}
  .formula .fq{font-size:clamp(17px,2.2vw,26px);line-height:1.7;color:var(--bone)}
  .formula .fq b{color:var(--calm);font-weight:700}
  .yn{display:flex;flex-direction:column;gap:.8vh;width:100%;max-width:900px;text-align:right}
  .yn .ok{color:var(--calm);font-size:clamp(13.5px,1.6vw,18px);line-height:1.5;padding-right:1.4rem;position:relative}
  .yn .ok::before{content:"✓";position:absolute;right:0;color:var(--calm)}
  .yn .no{color:var(--danger);font-size:clamp(13.5px,1.6vw,18px);line-height:1.5;padding-right:1.4rem;position:relative}
  .yn .no::before{content:"✕";position:absolute;right:0;color:var(--danger)}

  /* pull directions (attraction) */
  .pull{width:100%;max-width:1040px;border-collapse:collapse;text-align:right;font-size:clamp(12.5px,1.45vw,17px)}
  .pull th,.pull td{border:1px solid var(--line);padding:1.1vh .9vw;vertical-align:top;line-height:1.5}
  .pull th{font-family:var(--display);font-weight:600;color:var(--bone)}
  .pull .dir{font-family:var(--display);font-size:clamp(15px,1.8vw,21px);white-space:nowrap}
  .pull .safe{color:var(--info)}.pull .grow{color:var(--ember)}.pull .rank{color:var(--calm)}
  .pull .voice{color:var(--bone);font-style:italic}
  .pull .power{color:var(--bone-dim)}
  .pull .trap{color:var(--danger)}

  /* 27→3 funnel */
  .funnel{display:flex;flex-direction:column;gap:1.6vh;width:100%;max-width:860px}
  .fstep{display:flex;align-items:center;gap:1.4rem;justify-content:space-between;border:1px solid var(--line);border-radius:14px;padding:1.7vh 1.6vw;text-align:right}
  .fstep .fl{display:flex;flex-direction:column;gap:.4vh}
  .fstep .ft{font-family:var(--display);color:var(--bone);font-size:clamp(16px,2vw,23px)}
  .fstep .fd{color:var(--bone-dim);font-size:clamp(12.5px,1.4vw,16px)}
  .fstep .fn{font-family:var(--display);color:var(--ember);font-size:clamp(22px,3.2vw,40px);white-space:nowrap;font-variant-numeric:tabular-nums}

  /* protocol full */
  .proto{display:flex;flex-direction:column;gap:1.15vh;width:100%;max-width:940px;text-align:right}
  .proto .p{display:flex;gap:1.1rem;align-items:flex-start}
  .proto .pn{font-family:var(--display);color:var(--ember);font-size:clamp(18px,2.2vw,28px);min-width:1.4em}
  .proto .pt{font-size:clamp(14px,1.6vw,19px);line-height:1.5}
  .proto .pt b{color:var(--bone);font-weight:700}
  .proto .pt span{color:var(--bone-dim);display:block;margin-top:.15vh;font-size:.9em}

  /* tool box */
  .tool{width:100%;max-width:840px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,rgba(232,162,74,.05),transparent);padding:2.8vh 2vw;text-align:right;display:flex;flex-direction:column;gap:1.3vh}
  .tool .thh{font-family:var(--display);color:var(--ember);font-size:clamp(18px,2.2vw,26px)}
  .tool .quote{font-size:clamp(16px,2vw,23px);line-height:1.8;color:var(--bone);padding-right:1.2rem;border-right:3px solid var(--ember)}
  .tool .why{color:var(--bone-dim);font-size:clamp(13px,1.5vw,17px);line-height:1.7}
  .tool .why b{color:var(--ember)}

  /* attraction inner voice cards */
  .voices{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1.2vw;width:100%;max-width:1000px;text-align:right}
  .vc{border:1px solid var(--line);border-radius:14px;padding:1.7vh 1.2vw;display:flex;flex-direction:column;gap:.7vh}
  .vc .vh{font-family:var(--display);font-size:clamp(16px,1.9vw,23px)}
  .vc .vv{color:var(--bone);font-style:italic;font-size:clamp(13.5px,1.5vw,17px)}
  .vc.safe{border-color:rgba(138,166,200,.4)} .vc.safe .vh{color:var(--info)}
  .vc.grow{border-color:rgba(232,162,74,.42)} .vc.grow .vh{color:var(--ember)}
  .vc.rank{border-color:rgba(137,179,168,.42)} .vc.rank .vh{color:var(--calm)}

  /* plan 30 */
  .plan{width:100%;max-width:840px;text-align:right;display:flex;flex-direction:column;gap:1.5vh}
  .plan .no-line{color:var(--danger);font-size:clamp(15px,1.9vw,23px);font-family:var(--display)}
  .plan .yes-line{color:var(--calm);font-size:clamp(16px,2vw,25px);font-family:var(--display)}
  .plan .fields{display:flex;flex-direction:column;gap:1vh;border-top:1px solid var(--line);padding-top:1.5vh}
  .plan .fld{font-size:clamp(14px,1.65vw,19px);color:var(--bone);line-height:1.5}
  .plan .fld .u{color:var(--bone-faint)}

  /* safety close */
  .safety{display:flex;flex-direction:column;gap:1.8vh;align-items:center;max-width:900px}
  .safety .l1{font-family:var(--display);font-size:clamp(24px,3.6vw,44px);line-height:1.4}
  .safety .l2{color:var(--bone-dim);font-size:clamp(16px,2vw,24px);line-height:1.7}
  .signoff{font-family:var(--display);color:var(--ember-deep);font-size:clamp(16px,2vw,24px);letter-spacing:.06em;margin-top:1vh}

  .timer{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;font-size:clamp(60px,12vw,140px);line-height:1;color:var(--bone);cursor:pointer;transition:color .3s,text-shadow .3s}
  .timer.run{color:var(--ember);text-shadow:0 0 40px var(--ember-glow)}
  .timer.warn{color:var(--danger);text-shadow:0 0 40px rgba(216,101,78,.3);animation:pulse 1.1s infinite}
  .timer.done{color:var(--danger)}
  .timer-hint{color:var(--bone-faint);font-size:clamp(12px,1.4vw,15px);margin-top:1.2vh}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

  #chrome{position:fixed;inset:auto 0 0 0;display:flex;justify-content:space-between;align-items:center;padding:2.2vh 3vw;pointer-events:none;z-index:50}
  #snum{color:var(--bone-faint);font-size:13px;letter-spacing:.08em;font-variant-numeric:tabular-nums}
  #mark-sm{color:var(--bone-faint);font-family:var(--display);font-size:15px;letter-spacing:.1em}#mark-sm b{color:var(--ember);opacity:.75}
  #jump{position:fixed;bottom:2vh;left:50%;transform:translateX(-50%);z-index:70;background:var(--ink-3);border:1px solid var(--ember);color:var(--ember);font-family:var(--display);padding:.5em 1.1em;border-radius:10px;font-size:20px;letter-spacing:.15em;display:none}

  #faci{position:fixed;inset:auto 0 0 0;max-height:84vh;overflow-y:auto;z-index:80;background:linear-gradient(180deg,#0d0c0a,#141310);border-top:2px solid var(--ember);transform:translateY(101%);transition:transform .45s cubic-bezier(.2,.8,.2,1);padding:3vh 4vw 5vh;box-shadow:0 -30px 60px rgba(0,0,0,.6)}
  #faci.open{transform:translateY(0)}
  #faci .fhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:2vh;padding-bottom:1.5vh;border-bottom:1px solid var(--line)}
  #faci .ftitle{font-family:var(--display);color:var(--ember);font-size:clamp(16px,2vw,22px)}
  #faci .fclose{color:var(--bone-dim);font-size:13px;border:1px solid var(--line);border-radius:8px;padding:.4em .9em;cursor:pointer}
  #faci-body{display:flex;flex-direction:column;gap:1.6vh;text-align:right;line-height:1.75;font-size:clamp(14px,1.55vw,17.5px)}
  .blk{border-right:4px solid;padding:1.2vh 1.3vw;border-radius:0 10px 10px 0;background:rgba(255,255,255,.02)}
  .blk .bt{font-weight:800;font-size:.82em;letter-spacing:.05em;margin-bottom:.5vh;display:block}
  .say{border-color:var(--ember)} .say .bt{color:var(--ember)} .say .q{color:var(--bone);font-weight:500}
  .do{border-color:var(--calm)} .do .bt{color:var(--calm)}
  .warn{border-color:var(--danger)} .warn .bt{color:var(--danger)}
  .watch{border-color:var(--bone-dim)} .watch .bt{color:var(--bone-dim)}
  .safe{border-color:var(--calm);background:rgba(137,179,168,.06)} .safe .bt{color:var(--calm)}
  .blk ul{margin:.4vh 1.2rem 0;padding:0}.blk li{margin:.35vh 0}
  .blk table{width:100%;border-collapse:collapse;margin-top:.5vh;font-size:.95em}
  .blk td{border:1px solid var(--line);padding:.5vh .6vw;vertical-align:top}
  .blk td:first-child{color:var(--bone-dim);width:42%}
  .blk td:last-child{color:var(--bone)}
  #faci .why-note{color:var(--bone-dim);font-size:.9em}

  #help{position:fixed;top:2vh;left:2vw;z-index:70;color:var(--bone-faint);font-size:12px;background:var(--ink-2);border:1px solid var(--line);border-radius:8px;padding:.5em .8em;line-height:1.7;text-align:right;max-width:250px;opacity:0;transition:opacity .3s;pointer-events:none}
  #help.show{opacity:1}#help b{color:var(--ember)}
  @media (max-width:820px){.key3,.voices{grid-template-columns:1fr}.spec,.pull{font-size:12px}}
  @media (prefers-reduced-motion:reduce){.slide{transition:none}.timer.warn{animation:none}}
</style>
</head>
<body>
  <div id="progress"></div>
  <div id="stage"></div>
  <div id="chrome"><span id="snum"></span><span id="mark-sm"><b>◆</b> وميض</span></div>
  <div id="jump"></div>
  <div id="help"><b>الأسهم / مسافة</b> تنقّل<br><b>رقم + Enter</b> قفزة<br><b>Esc</b> رجوع<br><b>N</b> شرح الميسّر<br><span style="color:var(--calm)">الفصل الأخير — الترتيب مقدس: الخريطة قبل المقياس</span></div>
  <div id="faci"><div class="fhead"><span class="ftitle">🎙️ شرح الميسّر</span><span class="fclose" onclick="toggleFaci()">إغلاق ✕</span></div><div id="faci-body"></div></div>

<script>
const SLIDES=[

/* ============================================================
   CHAPTER 5 — قلب المرآة   ٤:٠٥ — ٥:٥٠
   ============================================================ */

/* ---------- 1) الكشف ---------- */
{id:97, body:`
  <div class="wrap">
    <div class="eyebrow calm">الفصل الخامس — قلب المرآة</div>
    <div class="mirror">🪞</div>
    <div class="big-line">اليوم ده كله... ماكانش عن وميض.</div>
    <div class="lead dim">وميض مش موجودة.<br>اللي كان موجود طول اليوم... هو إنتو.</div>
    <hr class="rule">
    <div class="lead glow">وكل قرار من الصبح... كان بيرسم خط في صورة.</div>
  </div>`,
 notes:`
  <div class="blk warn"><span class="bt">🔑 القاعدة الحاكمة للفصل كله</span> إنت مش بتقولهم نتيجتهم. هما اللي بيحسبوها بنفسهم. ده اللي بيخلي الكشف تتويج لمعرفة عاشوها، مش حكم بيتحط عليهم. ولو عكست ده، اليوم كله بيتحول لجلسة تشخيص والناس بتخرج بوصمة بدل بصيرة.</div>
  <div class="blk warn"><span class="bt">🔴 الترتيب مقدس</span> الكشف ← مفتاح الأدوات ← بناء الخريطة (هم) ← جولة المرايا ← حكي الراصدين ← المحور ← فتح المقياس ← البروتوكول ← خطة ٣٠ يوم ← الأمان. لو عكست بناء الخريطة وفتح المقياس، الخريطة هتتلوّن بالمقياس والفجوة تضيع.</div>
  <div class="blk do"><span class="bt">🟢 اعمل</span> لما يقعدوا — اسكت ثانيتين قبل ما تتكلم. النبرة هادية وعميقة، مش دراماتيكية زيادة. دي لحظة تسليم.</div>
  <div class="blk say"><span class="bt">🟡 قول — ببطء</span>
  <span class="q">«طول اليوم... إحنا كنا في وميض. بس أنا محتاج أقولكم حاجة دلوقتي: اليوم ده كله ماكانش عن وميض. وميض مش موجودة — مفيش شركة اسمها كده، ومفيش خالد المهدي، ومفيش كريم ولا هبة. اللي كان موجود طول اليوم... هو إنتو. كل قرار خدتوه، وكل سؤال سألتوه، وكل لحظة سكتّوا فيها أو اتكلمتوا... كانت بترسم خط في صورة. تعالوا... نبص على الصورة.»</span></div>
  <div class="blk watch"><span class="bt">⚪ ارصد</span> لحظة الكشف: مين ارتاح؟ مين اتوتر؟ مين ضحك (تفريغ)؟ ردة الفعل دي نفسها معلومة.</div>`},

/* ---------- 2) مفتاح الأدوات ---------- */
{id:98, body:`
  <div class="wrap">
    <div class="eyebrow">المفتاح</div>
    <h2>الأدوات التلاتة كانت بتتقاس في كل فصل</h2>
    <div class="lead dim" style="font-size:clamp(15px,1.8vw,21px)">مش كلام نظري اتقال الضهر — دي كانت بتترصد النهارده، من غير ما تعرفوا.</div>
    <div class="key3">
      <div class="kcol fh"><div class="kt">🔵 الفهم</div><div class="kq">بتسأل عن معلومة قبل ما تقترح</div><div class="ks">«إحنا عارفين إيه؟» — كروت المجموعة أ</div></div>
      <div class="kcol mr"><div class="kt">🟢 المراعاة</div><div class="kq">أول سؤالك عن الناس</div><div class="ks">«ده هيقع إزاي عليهم؟» — كروت المجموعة ب</div></div>
      <div class="kcol hs"><div class="kt">🟠 الحسم</div><div class="kq">بتضغط للحركة</div><div class="ks">«يلا نقرر» — مطلبتش كارت وقلت نتحرك</div></div>
    </div>
  </div>`,
 notes:`
  <div class="blk say"><span class="bt">🟡 قول</span>
  <span class="q">«فاكرين الأدوات التلاتة اللي أخدناها الضهر؟ الفهم، والمراعاة، والحسم؟ دي مكانتش كلام نظري — دي كانت بتتقاس في كل فصل النهارده، من غير ما تعرفوا. الفهم بان في: مين سأل عن معلومة قبل ما يقترح حل، ومين طلب كروت المجموعة أ. والمراعاة بانت في: مين أول سؤاله كان عن الناس مش الأرقام، ومين طلب كروت المجموعة ب. والحسم بان في: مين ضغط للحركة، ومين مطلبش ولا كارت وقال نتحرك. وأنا مش هقولكم أنهي واحدة إنتو — إنتو اللي هتشوفوها بأنفسكم، من ورقكم، ومن بعض، ومن الراصدين.»</span></div>
  <div class="blk do"><span class="bt">🟢 اعمل</span> دوس → الشريحة الجاية (الطيف). ودي أهم جملة في الفصل.</div>`},

/* ---------- 3) الطيف ---------- */
{id:99, body:`
  <div class="wrap">
    <div class="eyebrow">وكل أداة... ليها طيف</div>
    <table class="spec">
      <tr><th></th><th class="over">🔴 إفراط</th><th class="bal">🟢 اتزان</th><th class="under">⚪ تفريط</th></tr>
      <tr><td class="row-h">القاعدة</td><td class="over">الأداة شغالة حتى وقت ما محتاجهاش</td><td class="bal">الأداة بقدر الموقف</td><td class="under">الأداة مطفية</td></tr>
      <tr><td class="row-h">الفهم</td><td class="over">تحلل والوقت بيجري</td><td class="bal">تسأل اللي هيغيّر قرارك</td><td class="under">تقرر من غير ما تعرف</td></tr>
      <tr><td class="row-h">المراعاة</td><td class="over">تراعي لحد ما تذوب</td><td class="bal">تراعي وتحسم</td><td class="under">تقرر من غير ما تشوف الناس</td></tr>
      <tr><td class="row-h">الحسم</td><td class="over">تحسم قبل ما تفهم</td><td class="bal">تحسم في وقته</td><td class="under">متحسمش خالص</td></tr>
    </table>
    <div class="spec-note">مفيش أداة أحسن من أداة. الفرق في الجرعة والتوقيت.</div>
  </div>`,
 notes:`
  <div class="blk say"><span class="bt">🟡 قول — ووقّف قبلها ثانيتين</span>
  <span class="q">«وأهم جملة في الفصل ده: مفيش أداة أحسن من أداة. اللي بيحلل مش أشطر من اللي بيراعي، واللي بيراعي مش أحكم من اللي بيحسم. التلاتة لازمين — والفرق في الجرعة والتوقيت. وكل أداة ليها طيف: ممكن تشتغل زايدة عن الموقف، أو بقدره، أو تكون مطفية خالص. اللي بيحلل لما يزيد بيتشلّ، واللي بيراعي لما يزيد بيدوب، واللي بيحسم لما يزيد بيقرر قبل ما يفهم. وإحنا مش بنقيس مين أحسن — بنشوف إنت بتمسك أنهي أداة أول حاجة، وفين على الطيف.»</span></div>
  <div class="blk warn"><span class="bt">🔴 «طيب أنا نوعي إيه؟»</span> «مش نوع... أداة. وإنت النهارده مسكت [كذا] أول حاجة — وهنشوفها بعينينا في المواقف كمان شوية.» ولا رقم، ولا تصنيف، ولا اسم عائلة.</div>`},

/* ---------- 4) بناء الخريطة ---------- */
{id:100, body:`
  <div class="wrap">
    <div class="eyebrow">دلوقتي... إنتو اللي هتبنوا الصورة</div>
    <div class="lead dim" style="font-size:clamp(14px,1.7vw,20px)">افتحوا ورقكم من اليوم كله، وامشوا مع السبع خانات:</div>
    <div class="mapq">
      <div class="q"><span class="n">١</span><span><b>أنهي أداة مسكتها أول حاجة في الفصل الأول؟</b> <span class="sub">(الصباح الهادي)</span></span></div>
      <div class="q"><span class="n">٢</span><span><b>أنهي أداة مسكتها لما الضغط اشتد؟</b> <span class="sub">(الاجتماع الصعب) — اتغيرت؟</span></span></div>
      <div class="q"><span class="n">٣</span><span><b>أنهي أداة بتنساها غالبًا؟</b></span></div>
      <div class="q"><span class="n">٤</span><span><b>الرسوخ:</b> <span class="sub">رسالة بلا معلومة → ثبتّ بهدوء؟ بتوتر؟ غيّرت؟ · ومعلومة → عدّلت؟ رفضت؟ اتلخبطت؟</span></span></div>
      <div class="q"><span class="n">٥</span><span><b>الصلاحية:</b> <span class="sub">احترمتها؟ تخطيتها؟ ولا اتشليت جواها؟</span></span></div>
      <div class="q"><span class="n">٦</span><span><b>منحنى صدرك:</b> <span class="sub">التلات نقط — رسمها إزاي؟ فين ضاق؟</span></span></div>
      <div class="q"><span class="n">٧</span><span><b>الفجوة:</b> <span class="sub">أخدت ٤ أدوات و٣ مبادئ — استخدمت منهم كام تحت الضغط؟</span></span></div>
    </div>
  </div>`,
 notes:`
  <div class="blk warn"><span class="bt">🔑 دي أهم فقرة في الفصل — والناس هي اللي شغالة فيها مش إنت</span> سيبهم يكتبوا في صمت ١٥ دقيقة. لف بهدوء بينهم، وساعد اللي متلخبط بسؤال — مش بإجابة.</div>
  <div class="blk say"><span class="bt">🟡 قول</span>
  <span class="q">«دلوقتي إنتو اللي هتبنوا الصورة، مش أنا. افتحوا ورقكم من أول الصبح، وامشوا مع السبع خانات دول واحدة واحدة. وخدوا وقتكم — دي صورتكم إنتو، محدش تاني. ومفيش إجابة صح، فيه إجابة صادقة وإجابة متجمّلة. والمتجمّلة مش هتفيدكم في حاجة.»</span></div>
  <div class="blk do"><span class="bt">🟢 ساعد بسؤال مش بإجابة</span>
   <table>
   <tr><td>«مش عارف أنا أنهي أداة»</td><td>«فاكر لما الإنذار وصل؟ أول حاجة عملتها إيه — سألت؟ اقترحت؟ بصيت على الناس؟»</td></tr>
   <tr><td>«كنت بعمل الاتنين»</td><td>«تمام — بس أنهي واحدة جت الأول؟»</td></tr>
   <tr><td>«الخانة الرابعة مش فاكرها»</td><td>«اللحظة اللي وصلت فيها رسالة المجلس. أول جملة قلتها إيه؟»</td></tr>
   <tr><td>«أنا حاسس إني وحش»</td><td>«مفيش وحش. فيه أداة قوية وأداة نايمة. وده اللي بنشوفه.»</td></tr>
   </table></div>
  <div class="blk warn"><span class="bt">🔴 خد بالك</span> ولا تدي حد إجابته — حتى لو إنت عارف. الخريطة اللي بيبنيها بإيده بتفضل معاه سنين. اللي بتقولهاله بتنسى بكرة.</div>`},

/* ---------- 5) جولة المرايا ---------- */
{id:101, body:`
  <div class="wrap">
    <div class="eyebrow calm">جولة المرايا</div>
    <div class="lead dim" style="font-size:clamp(15px,1.8vw,21px)">إنت بعيون اللي عاشوا اليوم معاك</div>
    <div class="formula">
      <div class="fq faint" style="font-size:clamp(13px,1.5vw,17px)">الصيغة الوحيدة المسموحة:</div>
      <div class="fq">«أنا شفتك النهارده لما <b>[موقف محدد]</b>...<br>اتحركت بـ<b>[وصف حركة]</b>.»</div>
    </div>
    <div class="yn">
      <div class="ok">«شفتك لما الإنذار وصل — مسكت الورقة وقعدت تقرا في هدوء قبل ما تتكلم»</div>
      <div class="no">«إنت دايمًا بتتسرع» &nbsp; · &nbsp; «كان المفروض تعمل كذا» &nbsp; · &nbsp; «إنت شخص هادي»</div>
    </div>
    <div class="lead cool" style="font-size:clamp(14px,1.7vw,20px)">موقف + وصف حركة. مفيش نصيحة، مفيش حكم، مفيش صفة.</div>
  </div>`,
 notes:`
  <div class="blk warn"><span class="bt">🔑 دي قلب اليوم — متقصّرش فيها الوقت (٢٥ دقيقة)</span></div>
  <div class="blk say"><span class="bt">🟡 قول</span>
  <span class="q">«كل واحد بنى خريطته لنفسه. دلوقتي هنضيف مصدر أصدق: إنت بعيون اللي عاشوا اليوم معاك. هنلف على الدايرة، وكل واحد ياخد دوره إن الباقيين يقولوله جملة — بصيغة واحدة بس: "أنا شفتك النهارده لما [موقف محدد]... اتحركت بـ[وصف حركة]." والصيغة دي مقصودة: موقف محدد ووصف حركة. مفيش نصيحة ومفيش حكم ومفيش صفة. ليه؟ لأن الحكم بيخلي اللي قاعد يدافع عن نفسه. والوصف بيخليه يشوف نفسه.»</span></div>
  <div class="blk do"><span class="bt">🟢 إدارة الجولة بالترتيب</span>
   <ul><li>ابدأ بواحد متماسك (بيدي القدوة للصيغة)</li>
   <li>الباقيين يدّوله جملة واحدة ورا التانية</li>
   <li>هو يسمع ويكتب بس — ما يردّش وما يدافعش. لو حاول: «دلوقتي بتستقبل بس. الرد مش مطلوب.»</li>
   <li>لف على الكل — كل واحد يتشاف. قصّر لو الوقت ضغط (٣-٤ جمل مش ٨)</li></ul></div>
  <div class="blk warn"><span class="bt">🔴 حماية اللحظة — ٤ مواقف</span>
   <table>
   <tr><td>كسر الصيغة (نصيحة/حكم)</td><td>قاطعه فورًا بلطف: «بصيغة المرآة — شفته بيعمل إيه، في أنهي موقف؟»</td></tr>
   <tr><td>مش لاقي جملة لزميله</td><td>ساعد من رصدك: «أنا شفته لما العميل سأل، اتحرك بإنه [كذا]»</td></tr>
   <tr><td>الجمل كلها لواحد بشكل سلبي</td><td>وازن فورًا بجملة من زاوية تانية. الجولة مرايا مش محاكمة</td></tr>
   <tr><td>اللي كان مختفي طول اليوم</td><td>دي لحظته. غالبًا «شفتك ساكت، بتاخد كل حاجة جواك». أدّيها وقتها ومتستعجلهاش</td></tr>
   </table></div>
  <div class="blk say"><span class="bt">🟡 إغلاق الجولة</span> <span class="q">«كمّلوا خريطتكم بالجُمل اللي سمعتوها. وخدوا بالكم: الجملة اللي اتقالت أكتر من مرة عليك... دي مش صدفة.»</span></div>`},

/* ---------- 6) حكي الراصدين ---------- */
{id:'101b', body:`
  <div class="wrap">
    <div class="eyebrow">حكي الراصدين</div>
    <div class="lead">كل واحد منكم قعد فترة بره القصة وشاف الفريق من مسافة.<br>دلوقتي وقتهم.</div>
    <hr class="rule">
    <div class="lead cool" style="font-size:clamp(15px,1.8vw,22px)">وصف حركة — مش أحكام على أشخاص.<br>واللي هيتقال هيتسمع بس.</div>
  </div>`,
 notes:`
  <div class="blk say"><span class="bt">🟡 قول</span>
  <span class="q">«وفاضل مصدر واحد: الراصدين. كل واحد منكم قعد فترة بره القصة وشاف الفريق من مسافة. دلوقتي وقتهم. [اسم الراصد الأول]... إيه اللي شفته؟»</span></div>
  <div class="blk warn"><span class="bt">🔴 اقرا القاعدتين قبل أول راصد</span>
  <span class="q">«قاعدتين قبل ما نبدأ: الأولى — وصف حركة مش أحكام. "الفريق اتكلم كله في نفس الوقت أول دقيقتين" صح، "الفريق كان فوضوي" غلط. والتانية — مفيش رد. اللي هيتقال هيتسمع بس.»</span></div>
  <div class="blk do"><span class="bt">🟢 أثناء الحكي</span> متعلقش ولا تضيف ولا تصحح المحتوى. بس اتدخل فورًا لو حد اتكلم بحكم: «وصف حركة — حصل إيه بالظبط؟»</div>
  <div class="blk say"><span class="bt">🟡 بعد آخر راصد</span> <span class="q">«شكرًا. وضيفوا اللي سمعتوه لخرايطكم.»</span></div>`},

/* ---------- 7) الوحدة الخامسة: الجذب ---------- */
{id:102, body:`
  <div class="wrap">
    <div class="eyebrow">الوحدة الخامسة</div>
    <div class="big-line glow">الجذب</div>
    <div class="lead dim">لحد دلوقتي اتكلمنا عن إزاي بتصنع قرارك.</div>
    <hr class="rule">
    <div class="lead">دي عن حاجة تانية:<br><span class="glow">إيه اللي بيشدّ قرارك... قبل ما تفكر أصلًا.</span></div>
  </div>`,
 notes:`
  <div class="blk do"><span class="bt">🟢 اعمل</span> قوم. دي آخر وحدة تعليمية في اليوم، وأعمقهم، وأصعب واحدة يشوفها الواحد في نفسه.</div>
  <div class="blk say"><span class="bt">🟡 قول</span>
  <span class="q">«آخر وحدة في منهجيتكم، وأعمق واحدة. لحد دلوقتي اتكلمنا عن إزاي بتصنع قرارك — بأنهي أداة. الوحدة دي عن حاجة تانية خالص: إيه اللي بيشدّ قرارك قبل ما تفكر أصلًا. في اللحظة اللي بتسمع فيها الخيارات — قبل أي تحليل — بيكون فيه ميل حصل جواك ناحية واحد منهم. وبعدين عقلك بييجي يبني تبرير للميل ده. فإنت بتفتكر إنك قررت بعقلك... وإنت في الحقيقة قررت بميلك، وعقلك زيّنه.»</span></div>
  <div class="blk do"><span class="bt">🟢 اعمل</span> دوس → شريحة الجدول (الاتجاهات التلاتة).</div>`},

/* ---------- 7b) تلات اتجاهات جذب ---------- */
{id:'102b', body:`
  <div class="wrap">
    <div class="eyebrow">تلات اتجاهات جذب</div>
    <table class="pull">
      <tr><th></th><th>بيشدّك ناحية</th><th>صوته الداخلي</th><th>قوته</th><th>فخّه</th></tr>
      <tr><td class="dir safe">🛡️ الأمان</td><td>البديل الأقل مخاطرة</td><td class="voice">«طب لو خسرنا؟»</td><td class="power">حساب مخاطر ممتاز</td><td class="trap">بيشلّ عند أول شبح خطر · ويختار الأمان الوهمي على الصواب</td></tr>
      <tr><td class="dir grow">🚀 النمو</td><td>البديل الأكثر حياة</td><td class="voice">«ده هيفتح إيه؟»</td><td class="power">شجاعة تختار المعنى</td><td class="trap">يرفض القرار الهادي الصائب لأنه «ممل» · ويخلط الجرأة بالتهور</td></tr>
      <tr><td class="dir rank">👥 المكانة</td><td>البديل الأكثر قبولًا</td><td class="voice">«هيقولوا علينا إيه؟»</td><td class="power">قراءة ممتازة للأثر</td><td class="trap">يخون قناعته عشان يحفظ صورته</td></tr>
    </table>
    <div class="spec-note danger" style="color:var(--danger)">وأخطر حاجة فيهم: مش بيبانوا كجوع... بيبانوا كصواب.</div>
  </div>`,
 notes:`
  <div class="blk say"><span class="bt">🟡 قول</span>
  <span class="q">«فيه تلات اتجاهات جذب، وكل واحد فينا واحد منهم أقوى. (اقرا الصفوف التلاتة) وأخطر حاجة فيهم إنهم مش بيبانوا كجوع — بيبانوا كصواب. صاحب الأمان بيقول "أنا واقعي"، وصاحب النمو بيقول "أنا شجاع"، وصاحب المكانة بيقول "أنا مراعي". وكلهم صادقين في وصف نفسهم... وغافلين إن ميلهم هو اللي اختار، مش صوابهم.»</span></div>
  <div class="blk say"><span class="bt">🟡 اربط بقراراتهم</span>
  <span class="q">«وإحنا النهارده أخدنا خمس قرارات — التلات مهام، والإنذار، وكريم، والمراجعة، والأسامي. وقرار واحد مبيقولش اتجاهك. خمسة ورا بعض في يوم واحد... دول اللي بيقولوا. وقرار وميض في الإنذار كان: [الاتجاه اللي صنّفته].»</span></div>`},

/* ---------- 8) السؤال الحارس ---------- */
{id:103, body:`
  <div class="wrap">
    <div class="eyebrow">🛠️ الأداة الخامسة</div>
    <div class="big-line" style="font-size:clamp(24px,3.2vw,40px)">السؤال الحارس</div>
    <div class="tool">
      <div class="quote">«لو الخيار ده مكانش بيطمّني<br>(أو بيحمّسني، أو بيحفظ مكاني)...<br>كنت لسه هشوفه صح؟»</div>
      <div class="why">لو اختيارك اهتزّ عند السؤال ده... <b>الجذب خطف قرارك. رجّعه لأدواتك.</b></div>
    </div>
  </div>`,
 notes:`
  <div class="blk say"><span class="bt">🟡 قول</span>
  <span class="q">«الأداة الخامسة — وهي آخر أداة، وأقواهم: السؤال الحارس. قبل أي قرار كبير، اسأل نفسك سؤال واحد: "لو الخيار ده مكانش بيطمّني — أو بيحمّسني، أو بيحفظ مكاني — كنت لسه هشوفه صح؟" ولو اختيارك اهتزّ عند السؤال ده... يبقى الجذب خطف قرارك. رجّعه لأدواتك.»</span></div>
  <div class="blk say"><span class="bt">🟡 اعمل</span> <span class="q">«ضيفوا خانة تامنة على خريطتكم: الاتجاه اللي شدّ قراراتك النهارده أكتر — إيه؟»</span></div>`},

/* ---------- 9) من ٢٧ لـ٣ ---------- */
/* النسخة المستقلة (default). النسخة الموصولة على 104b */
{id:104, body:`
  <div class="wrap">
    <div class="eyebrow calm">إنت خرجت النهارده بحاجتين</div>
    <div class="funnel">
      <div class="fstep"><div class="fl"><div class="ft">🔹 الإحداثية الأولى: الأداة</div><div class="fd">اللي بتمسك بيها القرار أول حاجة — الفهم؟ المراعاة؟ الحسم؟</div></div></div>
      <div class="fstep"><div class="fl"><div class="ft">🔹 الإحداثية التانية: الجذب</div><div class="fd">اللي بيشدّ قرارك قبل ما تفكر — الأمان؟ النمو؟ المكانة؟</div></div></div>
    </div>
    <hr class="rule calm">
    <div class="big-line cool" style="font-size:clamp(22px,3vw,38px)">والاتنين مع بعض... دي بصمتك في القرار.</div>
    <div class="lead dim" style="font-size:clamp(14px,1.7vw,20px)">مش صفة. مش نوع. طريقة.</div>
  </div>`,
 notes:`
  <div class="blk warn"><span class="bt">🔑 اختار النسخة قبل اليوم بيوم</span> الشريحة دي هي <b>النسخة المستقلة</b> (أي شركة، مفيش رحلة). لو الفريق داخل رحلة تطوير، استخدم النسخة الموصولة: <b>104b + Enter</b> (فيها لغة «من ٢٧ لـ٣»). الغلطة القاتلة: تقول «٢٧» لناس عمرها ما سمعت عنها — بتبقى بتلمّح لبضاعة بتتباع.</div>
  <div class="blk do"><span class="bt">🟢 اعمل</span> قوم. النبرة أهدى وأوضح — لحظة تسليم مش تعليم.</div>
  <div class="blk say"><span class="bt">🟡 قول — النسخة المستقلة</span>
  <span class="q">«تعالوا نجمع اللي حصل النهارده في حاجتين. إنت خرجت بـإحداثيّتين عن نفسك — مش صفات، إحداثيّات. الأولى: الأداة اللي بتمسك بيها القرار أول حاجة — وشفتها في خمس مواقف مختلفة، مش في استبيان. والتانية: الاتجاه اللي بيشدّك قبل ما تفكر. والاتنين مع بعض دي بصمتك في القرار. وخدوا بالكم: دي مش صفة فيك ومش نوع بقيته — دي طريقة، وبالتالي قابلة للتعديل. الأدوات اللي أخدتوها كلها شغالة على النقطة دي بالظبط.»</span></div>
  <div class="blk warn"><span class="bt">🔴 قواعد اللحظة</span> متقولش لحد رقمه ولا اسمه ولا تصنيفه — ولا واحد. «طب إنت شايفني إيه؟» → «اللي أنا شايفه مش مهم. المهم اللي إنت كتبته بإيدك — لأنه اللي هيفضل معاك.»</div>`},

{id:'104b', hidden:true, label:'من ٢٧ لـ٣ (الموصولة)', body:`
  <div class="wrap">
    <div class="eyebrow calm">من ٢٧... لـ٣</div>
    <div class="funnel">
      <div class="fstep"><div class="fl"><div class="ft">الإحداثية الأولى: الأداة</div><div class="fd">الفهم / المراعاة / الحسم</div></div><div class="fn">٢٧ ← ٩</div></div>
      <div class="fstep"><div class="fl"><div class="ft">الإحداثية التانية: الجذب</div><div class="fd">الأمان / النمو / المكانة</div></div><div class="fn">٩ ← ٣</div></div>
    </div>
    <hr class="rule calm">
    <div class="big-line cool" style="font-size:clamp(22px,3vw,38px)">الدايرة ضاقت النهارده<br>أكتر من أي محطة فاتت.</div>
  </div>`,
 notes:`
  <div class="blk warn"><span class="bt">🔑 النسخة الموصولة — لفريق داخل رحلة تطوير بس</span> استخدمها بدل 104 لو الجمهور عارف إن في آخر الرحلة بصمة من ٢٧. لو مش عارف — ارجع 104.</div>
  <div class="blk say"><span class="bt">🟡 قول</span>
  <span class="q">«وهنا الحاجة اللي اليوم كله كان ماشي عليها. إنتو عارفين إن في آخر الرحلة، بصمتك بتتقال لك من ٢٧. اليوم ده مش هيقولك بصمتك — أنا مش هقول لحد "إنت رقم كذا". بس اليوم ده عمل حاجة تانية: إنت رسمت إحداثيّتين. الأداة اللي مسكت بيها القرار — ودي لوحدها بتنزّل الـ٢٧ لتسعة. والاتجاه اللي جذبك — ودي بتنزّل التسعة لتلاتة. يعني إنت خارج وقدامك ٣ احتمالات من ٢٧. والرحلة هي اللي هتقفل الباب على واحد. بس اللي حصل النهارده إن الدايرة ضاقت... أكتر من أي محطة فاتت.»</span></div>
  <div class="blk warn"><span class="bt">🔴</span> متوعدش بحاجة اليوم مش بيقدمها. متقولش لحد رقمه.</div>`},

/* ---------- 10) فتح المقياس المختوم ---------- */
{id:105, body:`
  <div class="wrap">
    <div class="eyebrow info">📮 فتح المقياس المختوم</div>
    <h2>حاجتين مستقلتين... عن نفس الشخص</h2>
    <div class="key3" style="grid-template-columns:1fr 1fr;max-width:820px">
      <div class="kcol fh"><div class="kt">المقياس</div><div class="kq">تقرير ذاتي — الصورة اللي شايف بيها نفسه</div><div class="ks">قبل اليوم بأيام</div></div>
      <div class="kcol hs"><div class="kt">اليوم</div><div class="kq">ملاحظة سلوكية — حركته الفعلية تحت الضغط</div><div class="ks">النهارده</div></div>
    </div>
    <hr class="rule">
    <div class="lead glow" style="font-size:clamp(16px,2vw,24px)">افتحوهم... وحطوهم جنب بعض.</div>
  </div>`,
 notes:`
  <div class="blk warn"><span class="bt">🔑 لو مفيش مقياس اتعمل قبل اليوم — اتخطى للبروتوكول (105 لا، جمب لـ106)</span></div>
  <div class="blk warn"><span class="bt">🔴 الترتيب مقدس</span> الخريطة اتبنت الأول (خلصت من ٤٥ دقيقة). المقياس بيتفتح دلوقتي. لو عكست، الخريطة كانت هتتلوّن بالمقياس والفجوة تضيع.</div>
  <div class="blk do"><span class="bt">🟢 اعمل</span> وزّع النتايج مقفولة — كل واحد ياخد بتاعه، ومحدش يفتح لحد ما تقول.</div>
  <div class="blk say"><span class="bt">🟡 قول</span>
  <span class="q">«فاكرين الاستبيان اللي عملتوه قبل النهارده بأيام؟ أهو وقته. وقبل ما تفتحوا، افهموا إحنا بنعمل إيه: إنتو معاكم حاجتين مستقلتين تمامًا عن نفس الشخص. الورقة اللي في إيدكم — دي اللي قلتوه عن نفسكم، جاوبتوها وإنتو هاديين من غير ضغط. والخريطة اللي بنيتوها بإيديكم — دي اللي عملتوه فعلًا، تحت ضغط، في ٨ ساعات، قدام ناس. افتحوهم... وحطوهم جنب بعض.»</span></div>
  <div class="blk do"><span class="bt">🟢 اعمل</span> سيبهم ٢-٣ دقايق في صمت. متتكلمش. سيب الوشوش تتغير.</div>
  <div class="blk say"><span class="bt">🟡 وبعدين — الجزء اللي بيدي اللحظة معناها</span>
  <span class="q">«وهيحصل واحد من تلاتة، والتلاتة كويسين. يمكن يبقوا متطابقين — يبقى إنت بتعرف نفسك كويس، ودي مش شائعة. ويمكن يبقوا قريبين مش مطابقين — يبقى فيه حتة منك بتظهر بس لما الدنيا تشتد، وده طبيعي. ويمكن يبقوا مختلفين. ولو مختلفين — متقولش "يبقى فيه واحد فيهم غلط". الاتنين صح. المقياس بيقول: إنت شايف نفسك كده. واليوم بيقول: إنت اتحركت كده. والمسافة بين الاتنين... دي أثمن معلومة خرجت النهارده كله.»</span></div>
  <div class="blk say"><span class="bt">🟡 كمّل — بعد سكوت ٥ ثواني</span>
  <span class="q">«وليه أثمن معلومة؟ عشان إحنا بنقرر بالحركة، مش بالصورة اللي عن نفسنا. والشخص اللي شايف نفسه "بيسمع الناس" وحركته بتقول إنه بيحسم لوحده — مش بيكدب، هو فعلًا بيقصد يسمع. بس المسافة دي هي اللي بتفسر ليه فيه حاجات في شغله بتتكرر وهو مش فاهم ليه.»</span></div>
  <div class="blk say"><span class="bt">🟡 اعمل</span> <span class="q">«ضيفوا آخر خانة على خريطتكم: الفجوة — إيه اللي قلته عن نفسي، وإيه اللي عملته؟ وفين المسافة؟»</span></div>
  <div class="blk warn"><span class="bt">🔴 اختلاف حاد</span> «ده مش أنا خالص» → «ودي معلومة كمان. مش لازم توافق على واحد فيهم دلوقتي. حطهم في جيبك، وبعد أسبوعين بص عليهم تاني — الصورة هتبقى أوضح لأنك هتكون شفت نفسك في مواقف حقيقية بينهم.» متجادلش ومتحاولش تقنعه.</div>`},

/* ---------- 11) البروتوكول الكامل ---------- */
{id:106, body:`
  <div class="wrap">
    <div class="eyebrow">منهجية القرار — الصورة الكاملة</div>
    <div class="proto">
      <div class="p"><span class="pn">١</span><span class="pt"><b>افحص جذبك</b><span>«لو الخيار ده مكانش بيطمّني/بيحمّسني/بيحفظ مكاني — كنت هشوفه صح؟»</span></span></div>
      <div class="p"><span class="pn">٢</span><span class="pt"><b>افهم</b><span>«إيه اللي عارفينه فعلًا؟ وإيه اللي بنخمّنه؟» — واسأل بس عن اللي هيغيّر قرارك</span></span></div>
      <div class="p"><span class="pn">٣</span><span class="pt"><b>راعِ</b><span>«هيقع إزاي على اللي هينفذوه ويعيشوا نتيجته؟»</span></span></div>
      <div class="p"><span class="pn">٤</span><span class="pt"><b>احسم</b><span>«نتحرك امتى؟ ومين هيتحرك؟»</span></span></div>
      <div class="p"><span class="pn">٥</span><span class="pt"><b>افحص صدرك</b><span>ضاق؟ ضاق ليه؟ متعديش عليها.</span></span></div>
      <div class="p"><span class="pn">٦</span><span class="pt"><b>راعِ السياق</b><span>«ده في صلاحيتي؟ عاجل ولا يحتمل؟ مين لازم أشركه؟»</span></span></div>
      <div class="p"><span class="pn">٧</span><span class="pt"><b>نفّذ وراقب</b><span>اكتب سطر القرار: قرّرنا إيه · ليه · مين هيتحرك · امتى — وابقَ مستعد تعدّل عند المعلومة الجديدة من غير ما ينهار يقينك</span></span></div>
    </div>
  </div>`,
 notes:`
  <div class="blk say"><span class="bt">🟡 قول</span>
  <span class="q">«وكده كل حاجة أخدتوها النهارده بتتجمع في صفحة واحدة. (اقرا السبع خطوات واحدة واحدة بهدوء) وخدوا بالكم من حاجتين في الترتيب: الأولى — الجذب في الأول مش في الآخر، لأنه بيشتغل قبل كل حاجة. لو فحصته بعد ما تحلل، هتكون بتفحص التبرير مش الميل. والتانية — الصدر بعد الحسم مش قبله، لأنه مش أداة قرار، ده أداة مراجعة: بيقولك القرار مستقر جواك ولا فيه حاجة لسه معلّقة.»</span></div>
  <div class="blk say"><span class="bt">🟡 سطر القرار</span>
  <span class="q">«وسطر القرار في الخطوة السابعة أرخص حاجة في الدنيا وأكترهم توفير: قرّرنا إيه، وليه، ومين هيتحرك، وامتى. وسطر "ليه" ده بالذات الكل بيستخسره وهو أغلى حتة — لأن بعد ٦ شهور الظروف بتتغير، وساعتها هو الوحيد اللي هيقولكم: السبب اللي خدنا عشانه القرار ده لسه موجود ولا خلص؟ والقرار من غير سببه بيتحول لعادة — محدش فاكر جت منين، ومحدش جريء يلغيها.»</span></div>`},

/* ---------- 12) خطة ٣٠ يوم ---------- */
{id:107, body:`
  <div class="wrap">
    <div class="eyebrow">خطة الـ٣٠ يوم</div>
    <div class="plan">
      <div class="no-line">❌ متطبّقش الخمسة. دي وصفة فشل مضمونة.</div>
      <div class="yes-line">✅ اختار أداة واحدة — اللي وجعتك النهارده.</div>
      <div class="fields">
        <div class="fld">١. الأداة: <span class="u">______</span></div>
        <div class="fld">٢. أول موقف هستخدمها فيه: <span class="u">______</span></div>
        <div class="fld">٣. إمتى بالظبط: <span class="u">______</span></div>
        <div class="fld">٤. الحاجة الوحيدة اللي ممكن تمنعني: <span class="u">______</span></div>
      </div>
    </div>
  </div>`,
 notes:`
  <div class="blk say"><span class="bt">🟡 قول</span>
  <span class="q">«وآخر حاجة عملية. متطبّقوش الخمس أدوات من بكرة — دي وصفة فشل مضمونة، هتنسوهم كلهم في أسبوع. اختاروا أداة واحدة بس. واللي هتختاروها مش الأحلى... اللي وجعتكم النهارده، اللي وإنتو بتسمعوها افتكرتوا موقف معين. واكتبوا تحتها أربع حاجات: الأداة إيه، أول موقف هستخدمها فيه، إمتى بالظبط، والحاجة الوحيدة اللي ممكن تمنعني. والحاجة الرابعة دي اللي بتفرق — لأن كل واحد فينا عارف الحاجة اللي هتوقفه ومش بيسمّيها. خدوا ٣ دقايق.»</span></div>
  <div class="blk do"><span class="bt">🟢 اعمل</span> سيبهم ٣ دقايق يكتبوا فعلًا.</div>`},

/* ---------- 13) دايرة الامتنان ---------- */
{id:108, body:`
  <div class="wrap">
    <div class="eyebrow calm">دايرة الختام</div>
    <div class="lead dim" style="font-size:clamp(15px,1.8vw,21px)">كل واحد يمسك الأداة اللي غلبت عليه النهارده... ويقول جملة واحدة:</div>
    <div class="formula" style="border-color:rgba(137,179,168,.35);text-align:center;align-items:center">
      <div class="fq cool" style="font-size:clamp(19px,2.6vw,30px)">«الطريقة دي خدمتني —<br>وأنا النهارده بشوفها.»</div>
    </div>
    <div class="lead dim" style="font-size:clamp(14px,1.6vw,19px)">اللي بنحاربه بيتمسك. واللي بنشكره بيلين... ويسمح إننا نطوّره.</div>
  </div>`,
 notes:`
  <div class="blk do"><span class="bt">🟢 اعمل</span> اقعد. والنبرة أهدى حاجة في اليوم كله.</div>
  <div class="blk say"><span class="bt">🟡 قول</span>
  <span class="q">«آخر حاجة، وأهمها. الدايرة دي مش بتقفل على "شفت غلطاتي" — بتقفل على حاجة تانية خالص. كل واحد يمسك الأداة اللي غلبت عليه النهارده — اللي اكتشف إنه بيمسكها أول حاجة — ويقول جملة واحدة: "الطريقة دي خدمتني... وأنا النهارده بشوفها." وليه امتنان قبل أي تعديل؟ عشان الأداة دي — سواء التحليل أو قراءة الناس أو الحسم السريع — دي اللي وصّلتك للمكان اللي إنت فيه، ودي مش صدفة، دي اتبنت فيك بمجهود وسنين. واللي بنحاربه فينا بيتمسك أكتر. واللي بنشكره بيلين... ويسمح إننا نطوّره.»</span></div>
  <div class="blk do"><span class="bt">🟢 اعمل</span> لف على الكل، كل واحد جملته. استقبل كل جملة بهزة راس من غير تعليق وانتقل.</div>
  <div class="blk warn"><span class="bt">🔴</span> «بس هي مش دايمًا كويسة» → «صح. وعشان كده بنشوفها. الشوف ده هو أول خطوة.»</div>`},

/* ---------- 14) جملة الأمان الأخيرة ---------- */
{id:109, body:`
  <div class="wrap">
    <div class="safety">
      <div class="l1">اللي شفتوه النهارده...<br>عيّنة من حركتكم. <span class="dim">مش حكم عليكم.</span></div>
      <hr class="rule calm">
      <div class="l2">يوم واحد بيرسم خط.<br>والأيام هي اللي بترسم الصورة.</div>
      <div class="signoff">— ده كان يوم وميض —</div>
    </div>
  </div>`,
 notes:`
  <div class="blk warn"><span class="bt">🔴 ممنوع تتخطى مهما كان الوقت</span> قوم. اتكلم ببطء شديد.</div>
  <div class="blk say"><span class="bt">🟡 قول — ببطء</span>
  <span class="q">«وقبل ما نفترق... جملة واحدة حطوها في قلبكم: اللي شفتوه النهارده عيّنة من حركتكم، مش حكم عليكم. يوم واحد بيرسم خط. والأيام كلها هي اللي بترسم الصورة. ومحدش فيكم يمشي النهارده شايل صفة على ضهره — مفيش حد هنا "المتسرع"، ومفيش حد "اللي بيتشلّ"، ومفيش حد "اللي بيسكت". فيه ناس شافت طريقتها بتشتغل — بعينها، في يوم واحد، وبأمان. وده مش سهل، ومش شائع. اللي في إيديكم دلوقتي: خمس أدوات، وخريطة عن نفسك مكتوبة بإيدك، وخطة لأول ٣٠ يوم. والأدوات دي مش بتاعة وميض — وميض مش موجودة أصلًا. دي بقت بتاعتكم. خدوها لشغلكم الحقيقي، ولاجتماعاتكم الحقيقية، ولقراراتكم اللي هتاخدوها بكرة الصبح. شكرًا لصدقكم النهارده. ده كان يوم وميض.»</span></div>
  <div class="blk safe"><span class="bt">🟩 وقبل ما يقوموا — جملة إلزامية</span>
  <span class="q">«وآخر حاجة: لو حد حابب يقعد معايا شوية بعد ما نخلص — أنا موجود.»</span>
  <span class="why-note">بنبرة عادية عشان اللي محتاجها ياخدها من غير ما يحس إنه مكشوف.</span></div>
  <div class="blk warn"><span class="bt">🔴 إنت شخصيًا</span> تابع بعينك أي حد قرب من حافته في الفصل الرابع. لو مشي بسرعة من غير كلام — ابعتله رسالة الليلة.</div>`},

/* ---------- 15) إغلاق الميسّر (شاشة ليك إنت) ---------- */
{id:110, body:`
  <div class="wrap">
    <div class="eyebrow danger">📦 إغلاق الميسّر — بعد ما يمشوا</div>
    <div class="lead dim" style="font-size:clamp(15px,1.8vw,21px)">٢٠ دقيقة شغل، متأجلهاش لبكرة — الذاكرة بتضيع بسرعة رهيبة.</div>
    <div class="mapq" style="max-width:860px">
      <div class="q"><span class="n">١</span><span><b>فرّغ رصدك لكل مشارك</b> <span class="sub">— أداة مهيمنة/مهملة · موقع الطيف · الاتجاه · الرسوخ · الصلاحية · منحنى الصدر · التحول تحت الضغط · ملاحظة عناية</span></span></div>
      <div class="q"><span class="n">٢</span><span><b>اجمع صور الخرايط</b> <span class="sub">— تدخل ملف كل واحد كـ«شاهد عيان»</span></span></div>
      <div class="q"><span class="n">٣</span><span><b>لأي حد لمس حافته</b> <span class="sub">— ملاحظة عناية (مش تقييم) + إزاي تتابع وامتى</span></span></div>
      <div class="q"><span class="n">٤</span><span><b>جهّز تقرير القيادة</b> <span class="sub">— أنماط جماعية بس. ولا اسم واحد فيه.</span></span></div>
    </div>
    <div class="lead cool" style="font-size:clamp(14px,1.7vw,20px);border-top:1px solid var(--line);padding-top:1.5vh">القاعدة المقدسة: الكشف الفردي ملك صاحبه. النمط الجماعي بس هو اللي بيروح للإدارة.</div>
  </div>`,
 notes:`
  <div class="blk warn"><span class="bt">🔑 الشريحة دي ليك إنت — متعرضهاش على الفريق</span> افتح N واقرا، أو سيبها لنفسك بعد ما يمشوا.</div>
  <div class="blk watch"><span class="bt">⚪ فرّغ لكل مشارك</span>
   <table>

/* ================= ENGINE ================= */
const stage=document.getElementById('stage'),prog=document.getElementById('progress'),snum=document.getElementById('snum');
const faciBody=document.getElementById('faci-body'),faci=document.getElementById('faci'),jumpBox=document.getElementById('jump'),help=document.getElementById('help');
const visible=SLIDES.filter(s=>!s.hidden);let idx=0,returnIdx=0,onHidden=false;
SLIDES.forEach(s=>{const el=document.createElement('section');el.className='slide';el.dataset.id=s.id;el.innerHTML=`<div>${s.body}</div>`;stage.appendChild(el);s.el=el;});
function findById(id){return SLIDES.find(s=>String(s.id)===String(id));}
function toAr(n){return String(n).replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);}
function showSlide(s){SLIDES.forEach(x=>x.el.classList.remove('on'));s.el.classList.add('on');const vi=visible.indexOf(s);if(vi>=0){idx=vi;onHidden=false;}else{onHidden=true;}prog.style.width=((idx+1)/visible.length*100)+'%';snum.textContent=onHidden?(s.label||('كارت '+s.id)):(toAr(vi+1)+' / '+toAr(visible.length));renderNotes(s);stopAllTimers();}
function goVisible(i){i=Math.max(0,Math.min(visible.length-1,i));idx=i;showSlide(visible[i]);}
function next(){if(onHidden){showSlide(visible[idx]);return;}goVisible(idx+1);}
function prev(){if(onHidden){showSlide(visible[idx]);return;}goVisible(idx-1);}
function jumpTo(id){const s=findById(id);if(!s)return;if(s.hidden){returnIdx=idx;showSlide(s);}else{goVisible(visible.indexOf(s));}}
function escBack(){if(onHidden){showSlide(visible[returnIdx]);}}
window.next=next;
function renderNotes(s){faciBody.innerHTML=s.notes||'<div class="blk watch"><span class="bt">⚪</span> (مفيش ملاحظات)</div>';}
function toggleFaci(){faci.classList.toggle('open');}window.toggleFaci=toggleFaci;
let timers={};
function stopAllTimers(){for(const k in timers){clearInterval(timers[k].iv);}}
function attachTimer(el,total){let remain=total,running=false,iv=null;const fmt=x=>{const m=Math.floor(x/60),sec=x%60;return toAr(String(m).padStart(2,'0'))+':'+toAr(String(sec).padStart(2,'0'));};function paint(){el.textContent=fmt(remain);el.classList.toggle('warn',running&&remain<=300&&remain>0);el.classList.toggle('run',running&&remain>300);if(remain<=0){el.classList.remove('run','warn');el.classList.add('done');}}function tick(){remain--;if(remain<=0){remain=0;paint();clearInterval(iv);running=false;chime();return;}paint();}el.onclick=e=>{e.stopPropagation();if(running){clearInterval(iv);running=false;el.classList.remove('run','warn');}else{running=true;iv=setInterval(tick,1000);}paint();};el.ondblclick=e=>{e.stopPropagation();clearInterval(iv);running=false;remain=total;el.classList.remove('run','warn','done');paint();};paint();timers[el.id]={iv:null,el};}
function chime(){try{const c=new(window.AudioContext||window.webkitAudioContext)();[0,.18,.36].forEach((t,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=[660,880,990][i];o.type='sine';o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.0001,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.25,c.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t+.5);o.start(c.currentTime+t);o.stop(c.currentTime+t+.5);});}catch(e){}}
/* لا يوجد مؤقت في الفصل الخامس — كله تسليم وتأمل */
let buf='';
document.addEventListener('keydown',e=>{if(/[0-9]/.test(e.key)){buf+=e.key;jumpBox.style.display='block';jumpBox.textContent=toAr(buf);return;}if(e.key==='Enter'){if(buf){jumpTo(buf);buf='';jumpBox.style.display='none';}return;}if(e.key==='Escape'){buf='';jumpBox.style.display='none';if(faci.classList.contains('open')){toggleFaci();}else{escBack();}return;}if(e.key===' '){e.preventDefault();next();return;}if(e.key==='ArrowLeft'||e.key==='ArrowDown'){next();return;}if(e.key==='ArrowRight'||e.key==='ArrowUp'){prev();return;}if(e.key==='n'||e.key==='N'){toggleFaci();return;}if(e.key==='h'||e.key==='H'||e.key==='?'){help.classList.toggle('show');return;}});
let tx=0,ty=0,tt=0;
stage.addEventListener('touchstart',e=>{if(e.touches.length===2){toggleFaci();return;}tx=e.touches[0].clientX;ty=e.touches[0].clientY;tt=Date.now();},{passive:true});
stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty,dt=Date.now()-tt;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)){dx<0?next():prev();return;}if(dt<300&&Math.abs(dx)<20&&Math.abs(dy)<20){const w=window.innerWidth,x=e.changedTouches[0].clientX;if(x<w/3)next();else if(x>2*w/3)prev();}},{passive:true});
showSlide(visible[0]);help.classList.add('show');setTimeout(()=>help.classList.remove('show'),6500);
</script>
