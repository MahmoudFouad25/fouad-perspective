<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ورشة القرار — ساعتان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15130E;
  --ink2:#1E1A14;
  --ink3:#2A251C;
  --bone:#EDE6D8;
  --bone-dim:#A79E8C;
  --bone-faint:#6B6355;
  --gold:#C9A227;
  --fahm:#7FA8C4;
  --ria:#93B08A;
  --hasm:#D2874E;
  --paper:#F5F1E6;
  --rail:74px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:var(--ink);
  color:var(--bone);
  font-family:'Tajawal',system-ui,sans-serif;
  font-size:16px;
  line-height:1.6;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 90% 70% at 70% 0%, rgba(201,162,39,.07), transparent 60%);
}

/* ---------- الريل ---------- */
#rail{
  position:fixed;top:0;right:0;bottom:0;width:var(--rail);z-index:40;
  border-left:1px solid rgba(237,230,216,.08);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:22px 0;background:linear-gradient(to left, rgba(0,0,0,.25), transparent);
}
#railSec{
  writing-mode:vertical-rl;text-orientation:mixed;
  font-size:13px;letter-spacing:.14em;color:var(--bone-dim);font-weight:500;
  white-space:nowrap;max-height:52vh;overflow:hidden;
}
#railNum{font-family:'Amiri',serif;font-size:26px;color:var(--gold);line-height:1}
#railTop{display:flex;flex-direction:column;align-items:center;gap:10px}
#railClock{font-size:12px;color:var(--bone-faint);letter-spacing:.05em}
#railBar{width:2px;flex:1;margin:16px 0;background:rgba(237,230,216,.1);position:relative;border-radius:2px}
#railFill{position:absolute;top:0;left:0;right:0;background:var(--gold);border-radius:2px;transition:height .35s cubic-bezier(.4,0,.2,1)}

/* ---------- الشريحة ---------- */
#stage{position:absolute;inset:0;padding-left:0;padding-right:var(--rail);z-index:1}
.slide{
  position:absolute;inset:0;display:none;
  padding:6vh 7vw 8vh calc(7vw);
  flex-direction:column;justify-content:center;
  overflow-y:auto;
}
.slide.on{display:flex;animation:rise .5s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.slide.center{align-items:center;text-align:center}

.eyebrow{
  font-size:clamp(11px,1.35vh,15px);letter-spacing:.22em;color:var(--gold);
  font-weight:700;margin-bottom:2.6vh;text-transform:uppercase;
}
h1{font-family:'Amiri',serif;font-weight:700;font-size:clamp(30px,7.2vh,74px);line-height:1.25;letter-spacing:-.01em}
h2{font-family:'Amiri',serif;font-weight:700;font-size:clamp(25px,5.4vh,54px);line-height:1.32;margin-bottom:2.4vh}
h3{font-size:clamp(19px,3.2vh,32px);font-weight:700;line-height:1.4;margin-bottom:1.6vh}
p{font-size:clamp(16px,2.5vh,26px);line-height:1.62;color:#DCD4C4;max-width:34ch}
.slide.center p{max-width:38ch;margin-inline:auto}
.lead{font-size:clamp(18px,3vh,32px);color:var(--bone)}
.dim{color:var(--bone-dim)}
.gold{color:var(--gold)}
b,strong{font-weight:800;color:#FFF8E9}
.rule{height:1px;background:linear-gradient(to left,rgba(237,230,216,.28),transparent);margin:3.2vh 0;max-width:520px}
.slide.center .rule{margin-inline:auto;background:linear-gradient(to left,transparent,rgba(237,230,216,.28),transparent)}
.big{font-family:'Amiri',serif;font-size:clamp(26px,6vh,62px);line-height:1.3;font-weight:700}
.sub{font-size:clamp(14px,2vh,21px);color:var(--bone-dim);margin-top:2.2vh}
.stack>*+*{margin-top:2.2vh}

/* ---------- بطاقة أداة ---------- */
.tool{border-right:3px solid var(--c);padding:0 2.4vh 0 0;max-width:60ch}
.tool .tag{display:inline-block;font-size:clamp(12px,1.6vh,16px);letter-spacing:.16em;color:var(--c);font-weight:700;margin-bottom:1.2vh}
.tool h2{color:#FFF8E9;margin-bottom:2vh}
.qline{font-family:'Amiri',serif;font-size:clamp(19px,3.6vh,38px);color:var(--c);line-height:1.45;margin-bottom:2.4vh}
.tool .miss{font-size:clamp(15px,2.2vh,23px);color:var(--bone-dim);border-top:1px dashed rgba(237,230,216,.16);padding-top:1.8vh}
.tool .miss b{color:#FFF8E9}

/* ---------- جدول ---------- */
table{border-collapse:collapse;width:100%;max-width:1050px;margin-top:1.4vh;font-size:clamp(13px,2vh,21px)}
th,td{padding:1.5vh 1.6vh;text-align:right;border-bottom:1px solid rgba(237,230,216,.1);vertical-align:top}
th{font-size:clamp(11px,1.5vh,15px);letter-spacing:.1em;color:var(--bone-dim);font-weight:700;border-bottom-color:rgba(237,230,216,.22)}
td:first-child{font-weight:700;color:#FFF8E9;white-space:nowrap}
tr:last-child td{border-bottom:none}
.t-over{color:#E07B5A}.t-bal{color:var(--ria)}.t-under{color:var(--bone-faint)}

/* ---------- شبكة القواعد ---------- */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:2.6vh;margin-top:1.6vh;max-width:1080px}
.card{background:rgba(237,230,216,.035);border:1px solid rgba(237,230,216,.09);border-radius:3px;padding:2.6vh 2.2vh;border-top:2px solid var(--c,var(--gold))}
.card .n{font-family:'Amiri',serif;font-size:clamp(20px,3.4vh,32px);color:var(--c,var(--gold));line-height:1;margin-bottom:1.2vh}
.card h4{font-size:clamp(15px,2.3vh,23px);font-weight:800;color:#FFF8E9;margin-bottom:1vh;line-height:1.4}
.card p{font-size:clamp(13px,1.85vh,18px);color:var(--bone-dim);max-width:none}

/* ---------- قائمة مرقّمة ---------- */
.steps{max-width:820px;margin-top:1.2vh}
.step{display:flex;gap:1.8vh;padding:1.5vh 0;border-bottom:1px solid rgba(237,230,216,.08);align-items:baseline}
.step:last-child{border-bottom:none}
.step .k{font-family:'Amiri',serif;color:var(--gold);font-size:clamp(17px,2.8vh,28px);min-width:1.6em;line-height:1.3}
.step .v{font-size:clamp(14px,2.1vh,21px);line-height:1.55}
.step .v b{display:block;color:#FFF8E9;font-size:clamp(15px,2.4vh,24px);margin-bottom:.35vh}
.step .v span{color:var(--bone-dim)}

/* ---------- صندوق الأداة ---------- */
.toolbox{border:1px solid var(--gold);border-radius:4px;padding:3vh 3vh;max-width:800px;background:rgba(201,162,39,.05);position:relative}
.toolbox::before{content:'أداة';position:absolute;top:-11px;right:24px;background:var(--ink);padding:0 10px;font-size:12px;letter-spacing:.18em;color:var(--gold);font-weight:700}
.toolbox h3{color:var(--gold)}
.fill{font-family:'Amiri',serif;font-size:clamp(17px,3vh,30px);line-height:2;color:#FFF8E9}
.fill i{font-style:normal;color:var(--bone-faint);letter-spacing:.1em}

/* ---------- لحظة كتابة ---------- */
.write{border:1px dashed rgba(201,162,39,.5);border-radius:4px;padding:3vh;max-width:760px;background:rgba(201,162,39,.035)}
.write .lab{font-size:12px;letter-spacing:.2em;color:var(--gold);font-weight:700;margin-bottom:1.6vh}

/* ---------- المؤقت ---------- */
.timer{
  font-family:'Amiri',serif;font-size:clamp(40px,11vh,120px);color:var(--gold);
  letter-spacing:.02em;cursor:pointer;user-select:none;line-height:1;margin-top:3vh;
  transition:color .3s;display:inline-block;font-variant-numeric:tabular-nums;
}
.timer:hover{color:#F0CE58}
.timer.run{color:var(--ria)}
.timer.warn{color:#E07B5A;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}
.timer-hint{font-size:12px;color:var(--bone-faint);letter-spacing:.1em;margin-top:1vh}

/* ---------- شاشة سودا ---------- */
.slide.black{background:#000}
.slide.black .whisper{color:#241F18;font-size:14px;letter-spacing:.3em}

/* ---------- ملاحظات الميسّر ---------- */
#notes{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:var(--paper);color:#221E17;
  max-height:52vh;overflow-y:auto;
  transform:translateY(101%);transition:transform .32s cubic-bezier(.4,0,.2,1);
  box-shadow:0 -14px 50px rgba(0,0,0,.6);
  border-top:4px solid var(--gold);
  padding:22px 30px 30px;
}
#notes.open{transform:none}
#notes .nhead{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  border-bottom:1px solid rgba(34,30,23,.16);padding-bottom:10px;margin-bottom:16px;
}
#notes .nhead strong{font-size:15px;letter-spacing:.06em}
#notes .nhead em{font-style:normal;font-size:12px;color:#7A7263;letter-spacing:.08em}
#notes h5{font-size:14px;letter-spacing:.12em;color:#8A7A3E;margin:18px 0 8px;font-weight:800}
.say,.do,.warn,.obs,.scr{
  padding:12px 14px 12px 14px;border-radius:3px;margin-bottom:9px;
  font-size:16.5px;line-height:1.75;border-right:3px solid;
}
.say{background:#FBF3D8;border-color:#D8A93A}
.do{background:#E7F0E4;border-color:#6E9B62}
.warn{background:#FBE3DB;border-color:#C4593A}
.obs{background:#EAE7E0;border-color:#8B8375}
.say::before{content:'قول';display:block;font-size:11px;font-weight:800;letter-spacing:.16em;color:#96751B;margin-bottom:4px}
.do::before{content:'اعمل';display:block;font-size:11px;font-weight:800;letter-spacing:.16em;color:#4C7241;margin-bottom:4px}
.warn::before{content:'خد بالك';display:block;font-size:11px;font-weight:800;letter-spacing:.16em;color:#A03E22;margin-bottom:4px}
.obs::before{content:'ارصد';display:block;font-size:11px;font-weight:800;letter-spacing:.16em;color:#6A6255;margin-bottom:4px}
#notes b{color:#000;font-weight:800}
#notes .pause{color:#96751B;font-weight:800}
#notes ul{margin:6px 22px 0 0}
#notes li{margin-bottom:5px;font-size:16px}
#notes table{max-width:100%;font-size:14.5px;margin-top:6px}
#notes th,#notes td{border-bottom:1px solid rgba(34,30,23,.14);padding:7px 10px;color:#221E17}
#notes th{color:#7A7263;font-size:12px}
#notes td:first-child{color:#000}

/* ---------- نظرة عامة ---------- */
#over{
  position:fixed;inset:0;z-index:70;background:rgba(12,10,7,.97);
  overflow-y:auto;padding:34px 30px;display:none;
}
#over.on{display:block}
#over h6{font-size:12px;letter-spacing:.2em;color:var(--gold);margin:20px 0 12px;font-weight:800}
#over .og{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:11px}
#over .oc{
  background:rgba(237,230,216,.05);border:1px solid rgba(237,230,216,.1);border-radius:3px;
  padding:12px 13px;cursor:pointer;transition:.16s;min-height:76px;
}
#over .oc:hover,#over .oc:focus-visible{background:rgba(201,162,39,.14);border-color:var(--gold);outline:none}
#over .oc .on{font-family:'Amiri',serif;color:var(--gold);font-size:15px}
#over .oc .ot{font-size:13.5px;color:#DCD4C4;margin-top:5px;line-height:1.45}

/* ---------- شريط المفاتيح ---------- */
#keys{
  position:fixed;bottom:14px;right:calc(var(--rail) + 18px);z-index:35;
  font-size:11.5px;color:var(--bone-faint);letter-spacing:.05em;
  display:flex;gap:14px;opacity:.55;transition:opacity .2s
}
#keys:hover{opacity:1}
#keys kbd{background:rgba(237,230,216,.1);border-radius:3px;padding:1px 6px;font-family:inherit;color:var(--bone-dim)}
#jump{
  position:fixed;bottom:14px;left:22px;z-index:35;font-family:'Amiri',serif;
  font-size:26px;color:var(--gold);letter-spacing:.1em;display:none
}

@media (max-width:820px){
  :root{--rail:48px}
  .slide{padding:8vh 6vw 12vh}
  .grid3{grid-template-columns:1fr;gap:1.6vh}
  table{font-size:13px}
  th,td{padding:1vh .7vh}
  #keys{display:none}
  #notes{max-height:70vh;padding:18px 18px 26px}
  .card{padding:1.8vh 1.6vh}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="stage"></div>

<div id="rail">
  <div id="railTop">
    <div id="railNum">١</div>
    <div id="railClock">٠:٠٠</div>
  </div>
  <div id="railBar"><div id="railFill"></div></div>
  <div id="railSec">الافتتاح</div>
</div>

<div id="notes"></div>
<div id="over"></div>

<div id="keys">
  <span><kbd>N</kbd> السكريبت</span>
  <span><kbd>O</kbd> الفهرس</span>
  <span><kbd>F</kbd> ملء الشاشة</span>
  <span><kbd>رقم + ↵</kbd> قفز</span>
</div>
<div id="jump"></div>

<script>
/* ═══════════════════════════════════════════════
   محتوى الورشة — عدّل هنا وبس
   s = القسم · t = الوقت · h = الشريحة · n = سكريبتك
   ═══════════════════════════════════════════════ */
const D=[

/* ───────── ٠ · الافتتاح ───────── */
{s:'الافتتاح',t:'٠:٠٠',h:`
<div class="center-wrap">
<div class="eyebrow">ورشة</div>
<h1>ساعتين... عن حاجة واحدة</h1>
<div class="rule"></div>
<p class="lead">إزاي بيتاخد القرار.<br><span class="dim">جواك... وعلى ترابيزتكم.</span></p>
</div>`,cls:'center',n:`
<div class="do">استنى الكل يقعد. اسكت ٥ ثواني. وبعدين <b>اقف</b> — مش قاعد.</div>
<div class="say">«صباح الخير.<br><br>
الساعتين اللي جايين مش هيبقوا كلام تحفيزي عن اتخاذ القرار. مفيش "كن حاسمًا" ومفيش "ثق في نفسك".<br><br>
الساعتين دول عن <b>ماكينة</b> — الماكينة اللي بتشتغل جواك كل مرة بتقرر، وإنت مش شايفها.<br><br>
وهنفكّكها قطعة قطعة. وكل قطعة ليها اسم، وليها سؤال، وليها فخ.<br><br>
وفي الآخر هيبقى في إيديكم <b>خمس أدوات</b> بأسماء، <b>وبروتوكول من سبع خطوات</b>، <b>وبند واحد على الحيطة دي</b> إنتو اللي هتكتبوه.<br><br>
حاجات بتتنفذ من بكرة الصبح — مش حاجات بتتصفق لها وتتنسي.»</div>`},

{s:'الافتتاح',t:'٠:٠٣',h:`
<h1>مفيش هنا قرار صح<br>وقرار غلط.</h1>
<div class="rule"></div>
<p class="lead">فيه <b>قراركم</b>... وعواقبه.</p>`,cls:'center',n:`
<div class="do">اتكلم <b>أبطأ من طبيعتك بدرجة</b>.</div>
<div class="say">«وأهم جملة قبل ما نبدأ:<br><br>
<b>مفيش هنا صح وغلط.</b><br><br>
كل اللي هنتكلم عنه النهارده — الأدوات، والاتجاهات، والأنماط — مفيش فيهم واحد أحسن من التاني. اللي بيحلل مش أشطر من اللي بيراعي، واللي بيراعي مش أحكم من اللي بيحسم.<br><br>
فلو في أي لحظة حسّيت إني بوصف حاجة إنت بتعملها، <b>متسمعهاش كنقد</b>. اسمعها كوصف.<br><br>
إحنا مش بنقيّم. بنفهم.»</div>
<h5>ولحظة اللوح — من غير شريحة</h5>
<div class="do">اتحرك خطوتين ناحية اللوح، حط إيدك عليه بخفة، وارجع مكانك.</div>
<div class="say">«وحاجة أخيرة:<br><br>اللوح ده... فاضي دلوقتي.<br><br><b>ومش هيفضل فاضي.</b>»</div>
<div class="warn">امشي فورًا. <b>ولا تفسير ولا ابتسامة معنى.</b><br>ولو حد سأل «هو ده إيه؟» — الرد الوحيد مهما اتكرر السؤال: <b>«هييجي وقته.»</b></div>
<div class="obs">مين سأل عن اللوح؟</div>`},

/* ───────── ١ · الأدوات الثلاث ───────── */
{s:'الأدوات الثلاث',t:'٠:٠٧',h:`
<div class="eyebrow">الوحدة الأولى</div>
<h1>أي قرار محترم<br>بيتبني بتلات أدوات</h1>
<div class="rule"></div>
<p class="lead">ومعظم الناس بتستخدم <b>واحدة</b>...<br>وبتفتكر إنها كفاية.</p>`,cls:'center',n:`
<div class="do"><b>قوم.</b></div>
<div class="say">«نبدأ من الحتة اللي كل حاجة بعدها بتتعلق فيها.<br><br>
أي قرار محترم — أي قرار — بيتبني بتلات أدوات مختلفة. مش تلات خطوات، <b>تلات أدوات</b>. زي ما الميكانيكي عنده مفتاح وشاكوش ومفك.<br><br>
والمشكلة مش إن الناس معندهاش التلاتة. <b>كلنا عندنا التلاتة.</b><br><br>
المشكلة إن كل واحد فينا بيثق في واحدة منهم، وبيمد إيده عليها أول حاجة، وبينسى التانيتين. ولما التانيتين ينسوا، القرار بيطلع أعرج — وإحنا مش شايفين ليه.<br><br>
تعالوا نشوفهم.»</div>`},

{s:'الأدوات الثلاث',t:'٠:١٠',h:`
<div class="tool" style="--c:var(--fahm)">
<div class="tag">الأداة الأولى</div>
<h2>الفهم</h2>
<div class="qline">«إيه اللي إحنا عارفينه فعلًا؟<br>وإيه اللي بنخمّنه؟»</div>
<p>تجمع المعطى · تفصل <b>الحقيقة</b> عن <b>الانطباع</b> · تحدد على أي أساس هنختار</p>
<div class="miss">لو غابت → القرار بيتبني على <b>افتراض</b> مش حقيقة.<br>وبيبان مظبوط... لحد ما الحقيقة تظهر.</div>
</div>`,n:`
<div class="say">«الأداة الأولى: <b>الفهم</b>.<br><br>
سؤالها الوحيد: <b>إيه اللي إحنا عارفينه فعلًا؟ وإيه اللي بنخمّنه؟</b><br><br>
ودي أداة بتشتغل على حاجة الناس بتخلط فيها طول الوقت: الفرق بين <b>المعلومة</b> و<b>الانطباع</b>.<br><br>
"العميل زعلان" — دي معلومة ولا انطباع؟<br>
"الفريق مرهق" — معلومة ولا انطباع؟<br>
"المنافس أرخص مننا" — أرخص <b>بكام</b>؟<br><br>
إحنا بنمشي في شغلنا ونحنا حاسّين إننا عارفين. وأول ما حد يسأل "عارفين منين؟" بنكتشف إن نص اللي احنا فاكرينه معلومة... ده انطباع اتكرر لحد ما بقى حقيقة.<br><br>
<b>ولما الأداة دي تغيب، القرار بيتبني على افتراض.</b> وأخطر حاجة في الافتراض إنه شكله زي الحقيقة بالظبط — لحد ما تصطدم.»</div>`},

{s:'الأدوات الثلاث',t:'٠:١٤',h:`
<div class="tool" style="--c:var(--ria)">
<div class="tag">الأداة التانية</div>
<h2>المراعاة</h2>
<div class="qline">«القرار ده هيقع إزاي<br>على اللي هينفذوه ويعيشوا نتيجته؟»</div>
<p>تقيس الأثر البشري · تشوف <b>مين هيدفع التمن</b> · تعرف إيه اللي يخلي الناس تقبله</p>
<div class="miss">لو غابت → القرار بيبقى <b>صح على الورق</b>... وبيموت في التنفيذ.</div>
</div>`,n:`
<div class="warn">أول حاجة أوضحها: <b>دي مش لطف ومش مجاملة</b>. لو الناس فهمتها كده، الوحدة كلها ضاعت.</div>
<div class="say">«الأداة التانية: <b>المراعاة</b>.<br><br>
وأول حاجة أوضحها: دي <b>مش</b> لطف، ومش مجاملة، ومش "خلينا نراعي مشاعر بعض".<br><br>
دي أداة تشغيلية بحتة، وسؤالها: <b>القرار ده هيقع إزاي على الناس اللي هينفذوه؟</b><br><br>
لأن فيه حقيقة بسيطة الناس بتنساها: <b>القرار مبيتنفذش بنفسه.</b> فيه بني آدمين هينفذوه. ولو هما مش شايفين نفسهم فيه، أو حاسين إنه اتاخد من فوقهم، أو مش فاهمين ليه — القرار مش هيتنفذ. هيتنفذ <b>بالشكل</b>.<br><br>
وإنت بعد شهرين هتقعد تقول: "أنا مش فاهم، القرار كان مظبوط... ليه مشتغلش؟"<br><br>
اشتغل. بس اللي كانوا هينفذوه مكانوش معاك.<br><br>
<b>الفهم بيخليك تختار الصح. والمراعاة بتخلي الصح يحصل.</b>»</div>`},

{s:'الأدوات الثلاث',t:'٠:١٨',h:`
<div class="tool" style="--c:var(--hasm)">
<div class="tag">الأداة التالتة</div>
<h2>الحسم</h2>
<div class="qline">«نتحرك امتى؟<br>ومين هيتحرك؟»</div>
<p>يقفل الباب · يحوّل الكلام لفعل · يحدد التوقيت</p>
<div class="miss">لو غاب → القرار بيفضل <b>فكرة حلوة اتقالت في اجتماع</b>... ومبيبقاش فعل أبدًا.</div>
</div>`,n:`
<div class="say">«والأداة التالتة: <b>الحسم</b>.<br><br>
وسؤالها أبسط سؤال وأصعب سؤال: <b>نتحرك امتى؟ ومين هيتحرك؟</b><br><br>
وأنا هقولكم حاجة: كام اجتماع حضرتوه، وخرجتوا منه كلكم مبسوطين، وحاسين إنكم اتفقتوا... وبعد أسبوعين مفيش حاجة اتعملت؟<br><br>
ومحدش كان مقصّر، ومحدش كان معترض. بس <b>مفيش حد كان مسمّى</b>.<br><br>
الحسم مش شجاعة. الحسم إن الجملة تتحول من "إحنا لازم نعمل كذا" لـ "<b>فلان</b> هيعمل كذا <b>يوم الاتنين</b>".<br><br>
والجملة الأولى دي أمنية. والتانية بس هي القرار.»</div>`},

{s:'الأدوات الثلاث',t:'٠:٢١',h:`
<div class="eyebrow">وهنا الحتة اللي بترتاح لها القاعة</div>
<h1 style="max-width:20ch">وإنتو فاكرين إن الخلاف على القرار...</h1>
<div class="rule"></div>
<div class="big gold">والخلاف كان على <b style="color:var(--gold)">الأداة</b>.</div>`,cls:'center',n:`
<div class="do">اسكت ثانيتين قبلها. واتكلم وإنت بتبص عليهم واحد واحد.</div>
<div class="say">«ودلوقتي هقولكم حاجة هتفرق معاكم في <b>كل اجتماع</b> هتحضروه بعد النهارده.<br><br>
إنتو قاعدين هنا [العدد] واحد. وكل واحد فيكم بيدخل أي اجتماع <b>بأداة مختلفة</b>.<br><br>
فيه ناس عقلها بيروح على الأرقام. وناس عقلها بيروح على الناس. وناس عقلها بيروح على "طب إحنا هنتحرك امتى".<br><br>
<b>وده مش عيب. ده تنوّع — ودي نعمة في أي فريق.</b><br><br>
العيب الوحيد إن <b>محدش بيسمّيها</b>.<br><br>
<span class="pause">(وقفة)</span><br><br>
فبتقعدوا تتخانقوا... وإنتو فاكرين إن الخلاف على القرار.<br><br>
<b>والخلاف كان على الأداة.</b>»</div>
<div class="do"><b>اسكت ٥ ثواني.</b> هتلاقي وشوش بتتغير — كل واحد بيفتكر خناقة حقيقية عاشها.</div>
<h5>وبعدين — الترجمة العملية</h5>
<div class="say">«يعني إيه ده عمليًا؟<br><br>
لما واحد يقولك "استنى، إحنا عارفين إيه بالظبط؟" — ده <b>مش</b> بيعطّل. ده بيمد إيده على أداة إنت مش ماسكها.<br><br>
ولما واحد يقولك "طب الناس هتاخدها إزاي؟" — ده <b>مش</b> بيدلّع الموظفين. ده شايف حتة إنت مش شايفها.<br><br>
ولما واحد يقولك "يلا بقى نقرر" — ده <b>مش</b> متسرع بالضرورة. ده حاسس بحاجة إنت مش حاسسها.<br><br>
<b>الفريق الناضج مش اللي كل الناس فيه بتفكر زي بعض. الفريق الناضج اللي عارف إن التلات أصوات دول لازمين، وبيسمّيهم بأسمائهم بدل ما يتخانق عليهم.</b>»</div>`},

{s:'الأدوات الثلاث',t:'٠:٢٥',h:`
<div class="write">
<div class="lab">اكتب لنفسك — من غير كلام</div>
<h3>افتكر آخر قرار مهم اشتركت فيه في شغلك</h3>
<div class="steps">
<div class="step"><div class="k">١</div><div class="v">أول سؤال جه في دماغك كان إيه؟</div></div>
<div class="step"><div class="k">٢</div><div class="v">ده كان تحت أنهي أداة؟ <span style="color:var(--fahm)">فهم</span> · <span style="color:var(--ria)">مراعاة</span> · <span style="color:var(--hasm)">حسم</span></div></div>
<div class="step"><div class="k">٣</div><div class="v">وأنهي أداة <b>مجتش في دماغك خالص</b>؟</div></div>
</div>
</div>
<div class="timer" data-t="90">١:٣٠</div>
<div class="timer-hint">دوسة = تشغيل/إيقاف · دوستين = تصفير</div>`,n:`
<div class="say">«دقيقة ونص، كل واحد لنفسه، من غير كلام.<br><br>
افتكروا آخر قرار مهم اشتركتوا فيه. مش النهارده — أي قرار قريب.<br><br>
وأول حاجة جت في دماغك ساعتها كانت إيه؟ وتحت أنهي أداة؟<br><br>
والأهم: <b>أنهي أداة مجتش في دماغك خالص؟</b><br><br>
ومتحاولش تجاوب اللي "المفروض". <b>جاوب اللي حصل.</b>»</div>
<div class="warn">استنى ٩٠ ثانية <b>فعلية</b>. و<b>متسألش حد جاوب إيه</b> — الورقة ليه هو.</div>`},

{s:'الأدوات الثلاث',t:'٠:٢٧',h:`
<div class="eyebrow">وكل أداة... ليها طيف</div>
<table>
<tr><th></th><th class="t-over">إفراط</th><th class="t-bal">اتزان</th><th class="t-under">تفريط</th></tr>
<tr><td style="color:var(--fahm)">الفهم</td><td class="t-over">تحلل والوقت بيجري</td><td class="t-bal">تسأل اللي هيغيّر قرارك</td><td class="t-under">تقرر من غير ما تعرف</td></tr>
<tr><td style="color:var(--ria)">المراعاة</td><td class="t-over">تراعي لحد ما تدوب</td><td class="t-bal">تراعي <b>و</b>تحسم</td><td class="t-under">تقرر من غير ما تشوف الناس</td></tr>
<tr><td style="color:var(--hasm)">الحسم</td><td class="t-over">تحسم قبل ما تفهم</td><td class="t-bal">تحسم في وقته</td><td class="t-under">متحسمش خالص</td></tr>
</table>
<div class="rule"></div>
<p class="lead"><b>مفيش أداة أحسن من أداة.</b><br><span class="dim">الفرق في الجرعة والتوقيت.</span></p>`,n:`
<div class="say">«وحاجة تانية مهمة جدًا: <b>كل أداة من التلاتة ليها طيف</b>.<br><br>
يعني الأداة ممكن تشتغل <b>زيادة عن الموقف</b>، أو <b>بقدر الموقف</b>، أو تكون <b>مطفية خالص</b>.<br><br>
والأداة اللي بتزيد عن حدها بتضر بنفس قوة الأداة اللي بتغيب:<br><br>
<b>الفهم لما يزيد</b> بيتحول لشلل. لجنة دراسة، وتقرير، وتقرير تاني — والقرار ما اتخدش. وده مش حرص، ده <b>هروب من القرار لابس بدلة بحث</b>.<br><br>
<b>والمراعاة لما تزيد</b> بتتحول لذوبان. تقعد تسأل الناس لحد ما تفقد صوتك إنت، وتلاقي نفسك بتقرر باللي هيرضي أكتر واحد صوته عالي — مش باللي صح.<br><br>
<b>والحسم لما يزيد</b> بيتحول لتسرّع. بتقفل الباب قبل ما تعرف إنت بتقفله على إيه، وبعدين بتدافع عن القرار مش لأنه صح — لأن التراجع بقى محرج.<br><br>
<span class="pause">(وقفة)</span><br><br>
فإحنا مش بنقول لحد "استخدم أداة تانية". بنقول: <b>إنت بتمسك أنهي أداة أول حاجة... وإنت واقف فين على طيفها؟</b>»</div>
<div class="warn">لو حد سأل <b>«طيب أنا نوعي إيه؟»</b> — الرد بالحرف:<br>«مش <b>نوع</b>... <b>أداة</b>. النوع حاجة ثابتة فيك، والأداة حاجة إنت ماسكها — وينفع تسيبها وتمد إيدك على غيرها. وده الفرق كله.»<br><br><b>ولا رقم، ولا تصنيف، ولا اسم عائلة.</b></div>`},

/* ───────── ٢ · قاعدتين + الورقة ───────── */
{s:'المعلومة والتمن',t:'٠:٣٢',h:`
<div class="eyebrow">القاعدة الأولى — تحت أداة الفهم</div>
<h2>المعلومة الناقصة <span class="gold">بتتطلب</span>...<br>مش بتتخمّن.</h2>
<div class="rule"></div>
<h3 style="color:var(--gold)">بس الحارس:</h3>
<p class="lead">اسأل بس عن المعلومة اللي <b>لو جت بالعكس... هتغيّر قرارك</b>.</p>
<p class="sub">أي معلومة تانية = رفاهية. أو <b>هروب من القرار لابس بدلة بحث</b>.</p>`,n:`
<div class="say">«تحت أداة الفهم، قاعدتين. الأولى:<br><br>
<b>المعلومة الناقصة بتتطلب — مش بتتخمّن.</b><br><br>
وده يبان بديهي، بس اللي بيحصل في الواقع عكسه تمامًا. أول ما أزمة تنزل، الدماغ بتجري على <b>الحل</b> فورًا. ليه؟<br><br>
لأن الحل بيريّح. بيدينا إحساس إننا ماسكين الموقف.<br><br>
أما السؤال... <b>السؤال بيوجع</b>. لأنه بيعترف إننا مش عارفين. وقدام الناس، الاعتراف ده صعب.<br><br>
فبنقعد نتناقش ونتخانق على حلول... مبنية على معلومات محدش اتأكد منها.<br><br>
<span class="pause">(وقفة)</span><br><br>
<b>بس</b> — وده مهم جدًا — فيه وش تاني للعملة.<br><br>
فيه ناس بتستخدم "جمع المعلومات" كمخبأ. كل ما تقرب من قرار موجع، تكتشف إن فيه معلومة ناقصة. وتاني. وتالت.<br><br>
فإيه الميزان؟ <b>سؤال واحد: المعلومة دي — لو جت بالعكس — هتغيّر قراري؟</b><br><br>
لو آه: اسأل، ومتحسمش قبلها.<br>
لو لأ: يبقى دي رفاهية. <b>وبتاخد وقت وبتأجل قرار.</b>»</div>`},

{s:'المعلومة والتمن',t:'٠:٣٦',h:`
<div class="eyebrow">القاعدة التانية</div>
<h2>كل قرار له تمن.</h2>
<p class="lead">لو مش شايف تمن قرارك... <b>يبقى التمن مستخبي</b>.</p>
<div class="rule"></div>
<h3 style="color:var(--hasm)">والتمن المستخبي غالبًا بيكون في الناس — مش في الفلوس.</h3>
<p class="sub">الفلوس بتبان في الشيت. والناس بتبان بعد ٣ شهور... لما واحد يقدم استقالته وإنت مش فاهم ليه.</p>`,n:`
<div class="say">«والقاعدة التانية: <b>كل قرار له تمن</b>.<br><br>
ولو حد جالك بقرار وقالك "ده كله فوايد ومفيش أي سلبيات" — يبقى واحد من اتنين: يا هو <b>مش شايف</b> التمن، يا هو <b>شايفه ومخبيه</b> عنك.<br><br>
وأنا مش بقول ده تشاؤم. بقوله عشان حاجة عملية:<br><br>
<b>التمن اللي إنت شايفه قبل القرار، بتقدر تجهّز له. والتمن اللي بيفاجئك بعد القرار، بتدفعه مرتين — مرة لأنه حصل، ومرة لأنك مكنتش مستعد.</b><br><br>
وخدوا بالكم من أخطر حتة:<br><br>
<b>التمن المستخبي غالبًا بيكون في الناس، مش في الفلوس.</b><br><br>
ليه؟ لأن الفلوس بتبان في الشيت في نفس الشهر. أما الناس... الناس بتبان بعد تلات شهور — لما واحد شاطر يقدم استقالته، وإنت قاعد تقول "هو ده حصل إزاي؟ إحنا مش عاملين حاجة".<br><br>
عاملين. <b>من تلات شهور.</b> بس التمن اتدفع بالتقسيط.»</div>`},

{s:'المعلومة والتمن',t:'٠:٤٠',h:`
<div class="toolbox">
<h3>الأداة ٢ · ورقة القرار الثلاثية</h3>
<p class="dim" style="font-size:clamp(13px,1.9vh,18px);margin-bottom:2.4vh">قبل أي قرار مهم — تلات أسطر</p>
<div class="fill">
<span style="color:var(--fahm)">عقلي بيقول:</span> <i>___________</i><br>
<span style="color:var(--ria)">قلبي بيقول:</span> <i>___________</i><br>
<span style="color:var(--hasm)">حدسي بيقول:</span> <i>___________</i>
</div>
</div>
<div class="rule"></div>
<p class="lead"><b>اتفقوا؟</b> <span class="dim">← غالبًا قرار سليم. امشي.</span><br>
<b>اختلفوا؟</b> <span class="dim">← متسألش مين فيهم صح. اسأل: <b>ليه اختلفوا؟</b></span></p>
<p class="sub">موضع الاختلاف هو بالظبط <b>الأداة اللي إنت مش سامعها</b>.</p>`,n:`
<div class="say">«والأداة التانية في منهجيتكم — وهي أبسط أداة هنقولها النهارده وأكترهم استخدامًا:<br><br>
<b>ورقة القرار الثلاثية.</b><br><br>
قبل أي قرار مهم، تلات أسطر على ورقة. حرفيًا ورقة، وحرفيًا تلات أسطر:<br><br>
<b>عقلي بيقول إيه؟</b> — ده الفهم. الأرقام والوقائع.<br>
<b>قلبي بيقول إيه؟</b> — دي المراعاة. الناس والأثر.<br>
<b>حدسي بيقول إيه؟</b> — ده الحسم. الإحساس العميق باللي لازم يحصل.<br><br>
لو التلاتة اتفقوا؟ <b>امشي وإنت مرتاح.</b><br><br>
ولو اختلفوا؟ <b>وهنا الحتة المهمة</b> — متسألش "مين فيهم صح". اسأل: <b>ليه اختلفوا؟</b><br><br>
لأن موضع الاختلاف بيقولك حاجة واحدة: <b>دي الأداة اللي إنت مش سامعها.</b><br><br>
يعني لو عقلك بيقول امشي وقلبك بيقول استنى — <b>مش معناه إنك متردد.</b> معناه إن فيه حاجة في الناس إنت شايفها من طرف عينك ومش مسمّيها. والورقة دي بتخليك تسمّيها.»</div>
<h5>الجملة اللي تقفل بيها</h5>
<div class="say">«والورقة دي <b>مش لكل قرار</b>. لو عملتها في كل حاجة هتبقى عبء وهتسيبها.<br><br>
اعملها في القرار اللي لو غلط... <b>مش هتقدر ترجع فيه بسهولة</b>. ودول في السنة كام؟ عشرة؟ خمستاشر؟ يبقى دي <b>عشر ورقات في السنة</b>.»</div>`},

/* ───────── ٣ · الجذب ───────── */
{s:'الجذب',t:'٠:٤٤',h:`
<div class="eyebrow">الوحدة الثالثة</div>
<h1>لحد دلوقتي اتكلمنا عن<br><span class="dim">إزاي بتصنع قرارك.</span></h1>
<div class="rule"></div>
<p class="lead">ودي عن حاجة تانية:<br><b>إيه اللي بيشدّ قرارك... قبل ما تفكر أصلًا.</b></p>`,cls:'center',n:`
<div class="do"><b>قوم.</b></div>
<div class="say">«لحد دلوقتي إحنا اتكلمنا عن <b>إزاي بتصنع قرارك</b> — بأنهي أداة.<br><br>
الحتة الجاية عن حاجة تانية خالص. وهي أعمق حاجة هنقولها النهارده، وأصعب حاجة تشوفها في نفسك.<br><br>
في اللحظة اللي بتسمع فيها الخيارات — <b>قبل</b> أي تحليل، وقبل أي كلام — بيكون فيه <b>ميل</b> حصل جواك ناحية واحد منهم.<br><br>
مش قرار. <b>ميل.</b> حاجة جواك اتحركت.<br><br>
وبعدين عقلك بييجي، ويبني <b>تبرير</b> للميل ده. تبرير محترم ومنطقي ومقنع.<br><br>
فإنت بتفتكر إنك قررت بعقلك... <b>وإنت في الحقيقة قررت بميلك، وعقلك زيّنه.</b>»</div>
<div class="do">اسكت ثانيتين.</div>`},

{s:'الجذب',t:'٠:٤٧',h:`
<div class="eyebrow">تلات اتجاهات جذب</div>
<table>
<tr><th></th><th>بيشدّك ناحية</th><th>صوته الداخلي</th><th>قوته</th><th>فخّه</th></tr>
<tr><td style="color:#8FB3D9">الأمان</td><td>البديل الأقل مخاطرة</td><td class="dim">«طب لو خسرنا؟»</td><td>حساب مخاطر ممتاز</td><td class="t-over">بيشلّ عند أول شبح خطر · وبيختار <b>الأمان الوهمي</b> على الصواب</td></tr>
<tr><td style="color:var(--ria)">النمو</td><td>البديل الأكثر حياة</td><td class="dim">«ده هيفتح إيه؟»</td><td>شجاعة بتختار المعنى</td><td class="t-over">بيرفض القرار الهادي الصائب لأنه «ممل» · وبيخلط الجرأة بالتهور</td></tr>
<tr><td style="color:var(--hasm)">المكانة</td><td>البديل الأكثر قبولًا</td><td class="dim">«هيقولوا علينا إيه؟»</td><td>قراءة ممتازة للأثر</td><td class="t-over"><b>بيخون قناعته</b> عشان يحفظ صورته</td></tr>
</table>`,n:`
<div class="warn"><b>قاعدة نبرة:</b> اتكلم عن التلاتة بنفس الدفا. أي نبرة بتحبّذ واحد فيهم، والناس اللي على الاتجاهين التانيين هتقفل معاك فورًا.</div>
<div class="say">«وفيه تلات اتجاهات جذب. وكل واحد فينا <b>واحد منهم أقوى</b> — مش وحده الموجود، بس هو الغالب.<br><br>
<b>الأول: الأمان.</b> بيشدّك ناحية البديل الأقل مخاطرة. وصوته الداخلي بيقول: "طب لو خسرنا؟"<br>
وقوته إنه بيحسب المخاطر أحسن من أي حد. وفخّه إنه بيشلّ عند أول شبح خطر — <b>وبيختار الأمان الوهمي على الصواب الحقيقي</b>.<br><br>
<b>والتاني: النمو.</b> بيشدّك ناحية البديل الأكثر حياة وتجدد. وصوته بيقول: "ده هيفتح إيه؟"<br>
وقوته إنه بيختار المعنى على الرتابة. وفخّه إنه <b>بيرفض القرار الهادي الصائب لأنه ممل</b> — ويخلط بين الجرأة والتهور.<br><br>
<b>والتالت: المكانة.</b> بيشدّك ناحية البديل الأكثر قبولًا. وصوته بيقول: "هيقولوا علينا إيه؟"<br>
وقوته إنه بيقرا الأثر الاجتماعي قراءة ممتازة. وفخّه إنه <b>بيخون قناعته عشان يحفظ صورته</b>.»</div>`},

{s:'الجذب',t:'٠:٥٠',h:`
<h1>مش بيبانوا كجوع...<br><span class="gold">بيبانوا كصواب.</span></h1>
<div class="rule"></div>
<p class="lead">صاحب الأمان بيقول: <b>«أنا واقعي.»</b><br>
صاحب النمو بيقول: <b>«أنا شجاع.»</b><br>
صاحب المكانة بيقول: <b>«أنا مراعي.»</b></p>
<p class="sub">وكلهم <b>صادقين</b>. وغافلين إن <b>ميلهم</b> هو اللي اختار... مش صوابهم.</p>`,cls:'center',n:`
<div class="say">«وأخطر حاجة في التلاتة دول:<br><br>
<b>إنهم مش بيبانوا كجوع. بيبانوا كصواب.</b><br><br>
صاحب الأمان مبيقولش "أنا خايف". بيقول <b>"أنا واقعي"</b>.<br>
وصاحب النمو مبيقولش "أنا زهقان". بيقول <b>"أنا شجاع"</b>.<br>
وصاحب المكانة مبيقولش "أنا خايف على صورتي". بيقول <b>"أنا مراعي"</b>.<br><br>
<b>وكلهم صادقين.</b> مفيش حد فيهم بيكدب على نفسه بوعي.<br><br>
بس التلاتة غافلين عن حاجة واحدة: <b>إن ميلهم هو اللي اختار... وعقلهم بس كتب التقرير.</b>»</div>`},

{s:'الجذب',t:'٠:٥٢',h:`
<div class="write">
<div class="lab">اكتب لنفسك</div>
<h3>افتكر ٣ قرارات خدتهم السنة اللي فاتت</h3>
<p>شغل أو شخصي — المهم يكون ليهم وزن.<br>وشوف: <b>فيه اتجاه بيتكرر؟</b></p>
</div>
<div class="rule"></div>
<p class="lead"><b>قرار واحد مبيقولش اتجاهك.</b><br><span class="dim">تلاتة ورا بعض... دول اللي بيقولوا.</span></p>
<div class="timer" data-t="90">١:٣٠</div>`,n:`
<div class="say">«دقيقة ونص لنفسكم.<br><br>
افتكروا تلات قرارات خدتوهم السنة اللي فاتت — مش صغيرين، قرارات ليها وزن. شغل أو حياة، مش فارقة.<br><br>
وبصوا: <b>فيه اتجاه بيتكرر؟</b><br><br>
وخدوا بالكم من حاجة: <b>قرار واحد مبيقولش اتجاهك.</b> أي حد ممكن يختار الآمن مرة، أو يغامر مرة.<br><br>
<b>تلاتة ورا بعض — دول اللي بيقولوا.</b>»</div>`},

{s:'الجذب',t:'٠:٥٤',h:`
<div class="toolbox">
<h3>الأداة ٣ · السؤال الحارس</h3>
<div class="fill" style="font-size:clamp(19px,3.4vh,34px);line-height:1.6">
«لو الخيار ده مكانش بيطمّني<br>
<span class="dim" style="font-size:.8em">(أو بيحمّسني، أو بيحفظ مكاني)</span>...<br>
<b style="color:var(--gold)">كنت لسه هشوفه صح؟</b>»
</div>
</div>
<div class="rule"></div>
<p class="lead">لو اختيارك <b>اهتزّ</b> عند السؤال ده...<br><span class="dim">الجذب خطف قرارك. رجّعه لأدواتك.</span></p>`,n:`
<div class="say">«والأداة التالتة — وهي أقواهم، وأسرعهم، ومحتاجة عشر ثواني:<br><br>
<b>السؤال الحارس.</b><br><br>
قبل أي قرار كبير، اسأل نفسك:<br><br>
<b>"لو الخيار ده مكانش بيطمّني — أو بيحمّسني، أو بيحفظ مكاني — كنت لسه هشوفه صح؟"</b><br><br>
ولاحظوا إن السؤال ده <b>مش بيقولك تعمل إيه</b>. هو بس بيفصل حاجتين عن بعض: <b>الصواب</b> و<b>الراحة</b>.<br><br>
ولو اختيارك اهتزّ عند السؤال — يبقى الجذب خطف قرارك، <b>ولازم ترجّعه لأدواتك التلاتة</b>.<br><br>
ولو مااهتزش؟ يبقى إنت <b>مرتاح وصح</b> في نفس الوقت. وده بيحصل كتير، والحمد لله.»</div>`},

/* ───────── استراحة ───────── */
{s:'استراحة',t:'٠:٥٦',h:`
<h1 class="dim">استراحة</h1>
<div class="timer" data-t="300">٥:٠٠</div>
<p class="sub">ونرجع لأصعب حتة في اليوم.</p>`,cls:'center',n:`
<div class="say">«خمس دقايق. ونرجع لأصعب حتة في اليوم.»</div>
<div class="do">شغّل المؤقت وسيبه معروض على الشاشة.</div>`},

/* ───────── ٤ · الرسوخ والصلاحية ───────── */
{s:'الرسوخ والصلاحية',t:'١:٠١',h:`
<div class="eyebrow">الوحدة الرابعة</div>
<h1>فيه فرق بين قرار «قرّرته»...<br>وقرار <span class="gold">«رسخ»</span>.</h1>
<div class="rule"></div>
<p class="lead">والفرق <b>مبيبانش لما الدنيا هادية</b>.<br><span class="dim">بيبان بس... لما حد يعارضك.</span></p>`,cls:'center',n:`
<div class="say">«فيه حاجة الناس بتخلط فيها طول الوقت، وبتسمّي العناد ثبات وبتسمّي المرونة ضعف.<br><br>
فيه فرق بين قرار <b>قرّرته</b>... وقرار <b>رسخ</b>.<br><br>
والفرق ده مبيبانش لما الدنيا هادية. بيبان بس لما حد يعارضك.<br><br>
وعشان تعرف الفرق، <b>محتاج ضغطتين مختلفتين</b> — مش واحدة.»</div>`},

{s:'الرسوخ والصلاحية',t:'١:٠٣',h:`
<table>
<tr><th></th><th>ضغط <b>بلا معلومة</b><br><span class="dim" style="font-weight:400">«أنا مش مقتنع» وبس</span></th><th>معلومة <b>تقلب الصورة</b><br><span class="dim" style="font-weight:400">حاجة حقيقية جديدة</span></th></tr>
<tr><td style="color:var(--ria)">رسوخ</td><td>تثبت <b>بهدوء</b></td><td>تعدّل <b>بهدوء</b></td></tr>
<tr><td style="color:#E07B5A">عناد</td><td>تثبت <b>بتوتر وصوت عالي</b></td><td><b>ترفض</b> تعدّل</td></tr>
<tr><td style="color:var(--bone-faint)">انهيار</td><td><b>تغيّر فورًا</b></td><td>تتلخبط وتغيّر تاني</td></tr>
</table>
<div class="rule"></div>
<p class="lead"><b>التلاتة بيبانوا زي بعض في اللحظة.</b><br><span class="dim">ومختلفين تمامًا في النتيجة.</span></p>`,n:`
<div class="say">«بصوا على الجدول.<br><br>
<b>الضغطة الأولى: حد أكبر منك بيقولك "أنا مش مقتنع".</b> وبس. مفيش سبب، ومفيش أرقام، ومفيش حجة. <b>ضغط سلطة صافي.</b><br><br>
<b>والضغطة التانية: معلومة حقيقية جديدة</b> بتقلب الصورة فعلًا.<br><br>
<b>الراسخ:</b> في الأولى بيثبت — <b>وبهدوء</b>. وفي التانية بيعدّل — <b>وبهدوء برضه</b>.<br><br>
<b>والعنيد:</b> بيثبت في الحالتين. بس خدوا بالكم — لما يثبت في الأولى، بيثبت <b>بتوتر وصوت عالي ودفاع</b>، مش بهدوء. ولما تيجي المعلومة، <b>بيرفض يعدّل</b> — مش لأن المعلومة غلط، لأن التعديل عنده بيبان ضعف.<br><br>
<b>والمنهار:</b> بيتغير في الحالتين. أول ما حد يعارضه من غير حجة بيغيّر. وأول ما تيجي معلومة بيتلخبط ويغيّر تاني.<br><br>
<span class="pause">(وقفة)</span><br><br>
<b>وهنا الحتة الخطيرة:</b> التلاتة دول <b>بيبانوا زي بعض في اللحظة نفسها</b>.<br><br>
اللي بيثبت بتوتر بيشوف نفسه "قوي". واللي بيغيّر بسرعة بيشوف نفسه "مرن".<br><br>
<b>ومفيش طريقة تفرّق بينهم بضغطة واحدة. لازم اتنين.</b>»</div>
<h5>والجملة اللي تقفل بيها</h5>
<div class="say">«وعلامة الرسوخ الحقيقية جملة واحدة:<br><br>
<b>إنك تقف خلف قرارك بسكينة مش بتوتر، وتعيد النظر عند المعلومة الجديدة من غير ما ينهار يقينك.</b><br><br>
السكينة دي هي الفرق. مش الثبات نفسه — <b>السكينة أثناء الثبات</b>.»</div>`},

{s:'الرسوخ والصلاحية',t:'١:٠٧',h:`
<div class="write">
<div class="lab">اكتب لنفسك — سطر واحد</div>
<h2 style="margin:0">آخر مرة حد عارضك من غير سبب مقنع...<br>إنت عملت إيه؟</h2>
</div>
<div class="timer" data-t="60">١:٠٠</div>`,n:`
<div class="say">«دقيقة. سطر واحد لنفسك:<br><br>
<b>آخر مرة حد عارضك من غير سبب مقنع — إنت عملت إيه؟</b><br><br>
ثبتّ بهدوء؟ اتوترت وعلّيت صوتك؟ ولا غيّرت؟<br><br>
وجاوب بصدق. الورقة ليك.»</div>`},

{s:'الرسوخ والصلاحية',t:'١:٠٨',h:`
<div class="eyebrow">وحتة تالتة الناس بتنساها</div>
<h2>القرار مبيتصنعش في فراغ</h2>
<div class="grid3">
<div class="card" style="--c:var(--fahm)"><div class="n">١</div><h4>ثقافة المكان</h4><p>القرارات هنا بتتاخد إزاي؟ تشاركي؟ تشاوري؟ فردي؟</p></div>
<div class="card" style="--c:var(--ria)"><div class="n">٢</div><h4>هيكل الصلاحية</h4><p>إيه حدودي؟ وإيه اللي لازم أصعّده؟</p></div>
<div class="card" style="--c:var(--hasm)"><div class="n">٣</div><h4>طبيعة القرار</h4><p>عاجل؟ ولا يحتمل التأني؟</p></div>
</div>
<p class="sub">قرارات كتير كانت <b>صح في ذاتها</b>... وفشلت لأن صاحبها متجاهلش السياق.</p>`,n:`
<div class="say">«وفاضل حتة تالتة في المعادلة، والناس بتنساها تمامًا:<br><br>
<b>القرار مبيتصنعش في فراغ.</b><br><br>
إنت ممكن تختار الصح بأدواتك التلاتة، وتفحص جذبك، ويطلع القرار سليم مية في المية... <b>ويفشل</b>. ليه؟ لتلات أسباب:<br><br>
<b>الثقافة:</b> القرارات في المكان ده بتتاخد إزاي؟ فيه أماكن القرار الفردي فيها طبيعي، وأماكن نفس القرار الفردي بيتقري كتجاوز.<br><br>
<b>الصلاحية:</b> إيه حدودي؟ وإيه اللي لازم يوصل لفوق؟<br><br>
<b>وطبيعة القرار نفسه:</b> عاجل ولا يحتمل؟ لأن فيه قرار ممتاز بييجي متأخر فيبقى ولا حاجة، وفيه قرار مستعجل بيوفّر ساعة ويكلّف شهر.»</div>`},

{s:'الرسوخ والصلاحية',t:'١:١٠',h:`
<div class="eyebrow">وفي الصلاحية تحديدًا — تلات أنماط</div>
<div class="steps">
<div class="step"><div class="k">١</div><div class="v"><b>اللي بيتخطى</b> — «لازم يتعمل ومحدش هيزعل»<br><span>نيته سليمة... وبيبني ثقافة إن <b>الحدود شكلية</b></span></div></div>
<div class="step"><div class="k">٢</div><div class="v"><b>اللي بيتشلّ جواها</b> — «ده مش شغلي»<br><span>بيحوّل الحدود لـ<b>عذر</b>... والشغل بيقف</span></div></div>
<div class="step"><div class="k">٣</div><div class="v"><b>اللي بيكسرها بقصد وهو عارف العواقب</b><br><span>ده <b>مسؤول</b>... بس بيتكلّف</span></div></div>
</div>`,n:`
<div class="say">«وفي الصلاحية بالذات، فيه تلات أنماط — والتلاتة ليهم تمن:<br><br>
<b>اللي بيتخطى.</b> وبيقول لنفسه "لازم يتعمل ومحدش هيزعل". ونيته سليمة تمامًا. بس بيبني ثقافة إن <b>الحدود شكلية</b> — وبعد سنة محدش هيعرف مين بيقرر إيه.<br><br>
<b>واللي بيتشلّ جوّه صلاحيته.</b> وبيقول "ده مش شغلي". وده بيحوّل الحدود من إطار لـ<b>عذر</b> — والشغل بيقف على الحدود.<br><br>
<b>واللي بيكسرها بقصد وهو عارف العواقب وحاسب حسابها.</b> ده <b>مسؤول</b>. بس بيتكلّف، وعارف إنه هيتكلّف.<br><br>
والفرق بين التالت والأول مش في الفعل — الفعل واحد. <b>الفرق في إنه عارف إنه بيتخطى.</b>»</div>`},

{s:'الرسوخ والصلاحية',t:'١:١١',h:`
<div class="toolbox">
<h3>الأداة ٤ · خريطة الصلاحية</h3>
<p class="dim" style="font-size:clamp(13px,1.9vh,18px);margin-bottom:2.2vh">تلات أسطر — لدورك الحقيقي</p>
<div class="fill">
بقرر بمفردي: <i>__________</i><br>
بستشير: <i>__________</i><br>
بصعّد: <i>__________</i>
</div>
</div>
<div class="rule"></div>
<h3 class="gold">➕ وقاعدة التصعيد المسبق</h3>
<p class="lead">تتفق عليها <b>قبل</b> الأزمة — مش أثناءها:<br>«إيه اللي لازم يوصل للإدارة في <b>نفس اليوم</b>؟»</p>
<p class="sub">سطرين... بيوفروا أزمات.</p>`,n:`
<div class="say">«والأداة الرابعة: <b>خريطة الصلاحية</b>. تلات أسطر بس.<br><br>
واعملوها دلوقتي في دماغكم: <b>إنت تعرف تكتب تلات السطور دول عن دورك في شغلك؟ بدقة؟</b><br><br>
ومعظم الناس لو سألتها السؤال ده مش هتعرف تجاوب. <b>وده مش عيب فيها — ده عيب في المكان اللي مكتبهاش.</b><br><br>
ومعاها قاعدة تانية، وهي أرخص حاجة في الورشة كلها وأعلاها عائد:<br><br>
<b>التصعيد المسبق.</b> الفريق بيتفق <b>قبل</b> الأزمة — مش أثناءها — على سؤال واحد: "إيه اللي لازم يوصل للإدارة في <b>نفس اليوم</b>؟"<br><br>
سطرين. <b>بيوفروا أزمات كاملة.</b><br><br>
لأن أغلب الكوارث الإدارية مش سببها إن حد أخطأ. سببها إن <b>المعلومة وصلت متأخرة</b>، وكل واحد كان فاكر إن ده مش دوره.»</div>`},

/* ───────── ٥ · القرار الموجع ───────── */
{s:'القرار الموجع',t:'١:١٣',h:`
<div class="eyebrow">الوحدة الخامسة</div>
<h2>فيه نوع من القرارات<br>أدوات التحليل بتفشل قدامه تمامًا</h2>
<div class="steps" style="max-width:640px">
<div class="step"><div class="k">◆</div><div class="v">بيكلّف <b>إنسان</b> — مش رقم</div></div>
<div class="step"><div class="k">◆</div><div class="v"><b>مفيش معيار موضوعي</b> بيحسمه</div></div>
<div class="step"><div class="k">◆</div><div class="v">بيتاخد <b>قدام الناس</b></div></div>
<div class="step"><div class="k">◆</div><div class="v"><b>بيقفل باب</b> — أي اختيار بيلغي التاني</div></div>
</div>
<div class="rule"></div>
<p class="lead"><b>أي اختيار فيه... هيوجع حد.</b><br><span class="dim">مفيش نسخة مريحة منه.</span></p>`,n:`
<div class="say">«فيه نوع من القرارات، <b>كل أدواتنا بتفشل قدامه</b>.<br><br>
ومش لأنه صعب حسابيًا. <b>لأنه مالوش حل بيرضي كل الأطراف أصلًا.</b><br><br>
وليه أربع صفات:<br><br>
<b>بيكلّف إنسان</b> — مش رقم في شيت. إنسان له وش وتاريخ وعيلة.<br>
<b>مفيش معيار موضوعي بيحسمه</b> — ولو كان فيه، مكانش هيبقى قرار، كان هيبقى <b>حسبة</b>.<br>
<b>بيتاخد قدام الناس</b> — يعني مفيش مكان تختبي فيه.<br>
<b>وبيقفل باب</b> — أي اختيار بيلغي التاني.<br><br>
وأي اختيار فيه هيوجع حد. <b>مفيش نسخة مريحة منه.</b><br><br>
وأنا متأكد إن كل واحد قاعد هنا افتكر موقف دلوقتي.»</div>`},

{s:'القرار الموجع',t:'١:١٦',h:`
<div class="eyebrow">تلات طرق شائعة... وتلاتتهم بيضروا</div>
<div class="grid3">
<div class="card" style="--c:#E07B5A"><div class="n">١</div><h4>التأجيل</h4><p>«نشوف الأسبوع الجاي»<br><br>والتأجيل هنا <b>مش حياد</b>. ده قرار... بس متخفّي. <b>وبيدفع تمنه اللي مستني.</b></p></div>
<div class="card" style="--c:#E07B5A"><div class="n">٢</div><h4>التفويض</h4><p>«خلي فلان يتصرف»<br><br>بترمي وجع القرار على <b>حد أصغر منك</b>... ومعاه صلاحية أقل.</p></div>
<div class="card" style="--c:#E07B5A"><div class="n">٣</div><h4>الحسم السريع</h4><p>عشان تخرج من الألم<br><br>فالقرار بيطلع <b>من الانزعاج</b>... مش من الميزان.</p></div>
</div>`,n:`
<div class="say">«ومعظم القيادات بتتعلّم تدير الأرقام، وتدير المشاريع، وتدير الوقت. <b>ومحدش بيعلّمها تدير النوع ده.</b><br><br>
فبتتعامل معاه بواحدة من تلات طرق. <b>والتلاتة بتضر.</b><br><br>
<b>الأولى: التأجيل.</b> "نشوف الأسبوع الجاي"، "خلينا نجمع معلومات أكتر".<br>
وخدوا بالكم: <b>التأجيل في النوع ده مش حياد.</b> ده قرار — بس متخفّي. لأن الوقت بيمشي، والموقف بيتحرك من غيرك، <b>والناس اللي مستنية بتدفع التمن وهي معلّقة</b>.<br><br>
<b>والتانية: التفويض.</b> "خلي فلان يتصرف". وده أحيانًا شرعي — بس في القرار الموجع تحديدًا، غالبًا بترمي وجع القرار على حد أصغر منك ومعاه صلاحية أقل. <b>وهو مش هيقدر يحمّل زيّك.</b><br><br>
<b>والتالتة: الحسم السريع</b> — عشان تخرج من الألم. تقول القرار في تلات ثواني وتقفل الموضوع.<br>
والحسم في وقته حاجة كويسة... بس ساعتها <b>القرار بيطلع من الانزعاج، مش من الميزان</b>. وإنت بتحس بالفرق بعدها بيومين.»</div>`},

{s:'القرار الموجع',t:'١:١٩',h:`
<div class="eyebrow">القاعدة</div>
<h1>النزاهة مش في اللي هتختاره.<br><span class="gold">النزاهة إنك تعلن المعيار قبل ما تختار.</span></h1>
<div class="rule"></div>
<p class="lead">المعيار اللي بيتقال <b>بعد</b> الاختيار ← بيبقى <b>تبرير</b> <span class="dim">(حتى لو صادق ١٠٠٪)</span><br>
المعيار اللي بيتقال <b>قبله</b> ← بيبقى <b>عدل</b> <span class="dim">(حتى لو النتيجة موجعة)</span></p>`,cls:'center',n:`
<div class="do"><b>قوم.</b> واتكلم ببطء.</div>
<div class="say">«وهنا القاعدة، وهي أهم جملة في الوحدة دي:<br><br>
<b>في القرار اللي بيوجع، النزاهة مش في اللي هتختاره. النزاهة إنك تعلن المعيار قبل ما تختار.</b><br><br>
وليه ده بيفرق؟<br><br>
<b>المعيار اللي بيتقال بعد الاختيار بيبقى تبرير</b> — حتى لو كان صادق مية في المية. الناس بتسمعه وبتقول "أهو لقى حجة".<br><br>
<b>والمعيار اللي بيتقال قبله بيبقى عدل</b> — حتى لو النتيجة موجعة. لأن الشخص اللي هيتضرر بيقدر يقول: "أنا مش موافق... بس أنا <b>فاهم على أي أساس</b>."<br><br>
والفرق بين الاتنين هو الفرق بين <b>قرار الفريق بيقبله</b>، و<b>قرار الفريق بيفضل يتهامس عنه شهور</b>.»</div>`},

{s:'القرار الموجع',t:'١:٢١',h:`
<div class="toolbox">
<h3>الأداة ٥ · بروتوكول القرار الموجع</h3>
<div class="steps">
<div class="step"><div class="k">١</div><div class="v"><b>اعلن المعيار قبل الأسماء</b><span>«هنختار على أساس إيه؟» — ويتكتب.</span></div></div>
<div class="step"><div class="k">٢</div><div class="v"><b>اسأل: التمن ده هيدفعه مين؟ وهل هو عارف؟</b></div></div>
<div class="step"><div class="k">٣</div><div class="v"><b>افصل القرار عن التنفيذ</b><span>القرار ممكن يبقى صح <b>والطريقة قاسية</b>. وأغلب الجرح بييجي من التاني.</span></div></div>
<div class="step"><div class="k">٤</div><div class="v"><b>سمّي اللي فقدته</b><span>الفريق اللي بيسمّي خسارته <b>بيعديها</b>. واللي بيتجاهلها... بتفضل تشتغل تحت الأرض شهور.</span></div></div>
</div>
</div>`,n:`
<div class="say">«والأداة الخامسة والأخيرة: <b>بروتوكول القرار الموجع</b>. أربع خطوات:<br><br>
<b>واحد: اعلن المعيار قبل الأسماء.</b> ويتكتب، مش يتقال شفهي وينسي.<br><br>
<b>اتنين: اسأل — التمن ده هيدفعه مين؟ وهل هو عارف؟</b> فيه فرق كبير بين إن الشخص المتأثر يتفاجئ، وبين إنه كان عارف إن الموضوع بيتناقش.<br><br>
<b>تلاتة — ودي أهم واحدة عمليًا: افصل القرار عن التنفيذ.</b><br>
القرار ممكن يكون صح تمامًا... <b>والطريقة اللي اتقال بيها تجرح</b>. ودول شغلين مختلفين خالص. <b>وأغلب الجرح في الشركات بييجي من التاني مش الأول.</b><br>
واللي بتقوله للشخص... أهم من القرار نفسه.<br><br>
<b>وأربعة: سمّي اللي فقدته.</b><br>
القرار الموجع بيخلّف <b>خسارة حقيقية</b> — راجل شاطر مشي، أو ثقة اتهزت، أو علاقة اتغيرت.<br>
والفريق اللي بيسمّي خسارته بصوت عالي <b>بيعديها</b>. واللي بيتجاهلها ويقول "عادي، الشغل ماشي"... <b>الخسارة بتفضل شغالة تحت الأرض شهور</b>.»</div>`},

{s:'القرار الموجع',t:'١:٢٣',h:`
<div class="eyebrow">وحاجة أخيرة</div>
<h1>قبل ما عقلك يوصل لنتيجة...<br><span class="gold">جسمك بيكون عرف.</span></h1>
<div class="rule"></div>
<p class="lead">الضيق ساعة القرار <b>مش ضعف ومش تردد</b>.<br>
ده إشارة إن فيه حاجة جواك مش موافقة:<br>
<span class="dim">قيمة اتخرقت · ولا خوف بيسوقك من غير ما تسمّيه · ولا معلومة إنت شايفها ومش عايز تشوفها</span></p>
<p class="sub"><b>القاعدة:</b> لو قدرت — متحسمش على ضيق. ولو اضطريت — <b>اكتب سبب الضيق جنب القرار</b>.</p>`,cls:'center',n:`
<div class="do"><b>اقعد.</b> وغيّر النبرة لأهدى. <b>وبلا أي حماس زايد</b> — النبرة العملية بتديها مصداقية أضعاف المتحمسة.</div>
<div class="warn"><b>ولا لغة روحانية.</b> ولا كلمة عن الفطرة ولا القلب. ومتقولش «الأداة دي هتغير حياتك».</div>
<div class="say">«وفاضل حاجة واحدة.<br><br>
<b>قبل ما عقلك يوصل لنتيجة... جسمك بيكون عرف.</b><br><br>
ودي مش حاجة روحانية. دي حاجة كلنا عشناها: إنت بتوقّع على حاجة <b>وإيدك مترددة</b>. أو بتقول "تمام" وإنت حاسس بتقل في صدرك. أو بتخرج من اجتماع <b>مرتاح</b> من غير ما تعرف ليه.<br><br>
<b>والضيق ساعة القرار مش ضعف ومش تردد.</b><br><br>
ده إشارة إن فيه حاجة جواك مش موافقة على اللي إيدك بتكتبه. ممكن تكون <b>قيمة اتخرقت</b>. وممكن يكون <b>خوف بيسوقك وإنت مش مسمّيه</b>. وممكن تكون <b>معلومة إنت شايفها ومش عايز تشوفها</b>.<br><br>
وخدوا بالكم من حاجتين:<br><br>
<b>الأولى: دي مش أداة تشخيص.</b> الضيق مش بيقولك إن قرارك غلط. <b>أحيانًا القرار الصح موجع فعلًا.</b><br><br>
<b>والتانية: معناها مش "متقررش وإنت ضايق". معناها: متعديش عليها.</b> اسأل: <b>ضاق ليه؟</b><br><br>
والقاعدة العملية: لو قدرت، متحسمش على ضيق. ولو اضطريت — <b>اكتب سبب الضيق جنب القرار</b>. هتحتاجه، لأنه بعد شهر هيبقى أهم سطر عندك.»</div>
<div class="warn">لو حد قال «أنا مبحسش بحاجة» — <b>متجادلش</b>:<br>«وده وارد جدًا، وناس كتير كده. الإحساس ده <b>بيتربّى</b>، ومش بيبان من أول مرة. جربها في القرار الجاي بس.»</div>`},

/* ───────── ٦ · القرار الجماعي ───────── */
{s:'القرار الجماعي',t:'١:٢٥',h:`
<div class="eyebrow">الوحدة السادسة</div>
<h1>لحد دلوقتي كل اللي قلناه<br>عن <span class="dim">إنت</span>.</h1>
<div class="rule"></div>
<p class="lead">فاضل حتة واحدة: <b>إنتو</b>. الترابيزة.<br><span class="dim">وهقولكم تلات قواعد بس — بيحلّوا ٩٠٪ من الخراب اللي بيحصل في الاجتماعات.</span></p>`,cls:'center',n:`
<div class="say">«لحد دلوقتي كل اللي قلناه عن <b>إنت</b>. عن الماكينة اللي جواك.<br><br>
فاضل حتة واحدة: <b>إنتو</b>. الترابيزة.<br><br>
لأن أغلب قراراتكم مبتتاخدش لوحدكم — بتتاخد في أوضة فيها ناس. <b>والأوضة ليها قواعدها.</b><br><br>
وهقولكم تلاتة بس. تلاتة بيحلّوا تسعين في المية من الخراب اللي بيحصل في الاجتماعات.»</div>`},

{s:'القرار الجماعي',t:'١:٢٦',h:`
<div class="eyebrow">القاعدة الأولى</div>
<h2>اتفقوا على <span class="gold">الطريقة</span>...<br>قبل ما تختلفوا على <span class="dim">الموضوع</span></h2>
<p class="lead">إحنا مش بنتخانق على القرار قد ما بنتخانق على <b>مين له حق يحسم</b>.</p>
<div class="rule"></div>
<p>إجماع؟ تصويت؟ صوت واحد بيحسم <b>بعد ما يسمع</b>؟</p>
<p class="sub">الفريق اللي مش متفق على طريقة القرار... <b>بياخد قراره بالصوت العالي.</b></p>`,n:`
<div class="say">«<b>القاعدة الأولى: اتفقوا على الطريقة قبل ما تختلفوا على الموضوع.</b><br><br>
لأن إحنا مش بنتخانق على القرار قد ما بنتخانق على حاجة تانية خالص: <b>مين له حق يحسم</b>.<br><br>
جرّبوا في اجتماعكم الجاي: قبل ما تدخلوا في الموضوع، سؤال واحد — "إحنا هنقرر ده إزاي؟ إجماع؟ تصويت؟ ولا حد واحد هيحسم بعد ما يسمع الكل؟"<br><br>
<b>عشر ثواني.</b><br><br>
والفريق اللي مش متفق على طريقة القرار، بياخد قراره <b>بالصوت العالي</b> — وبعدين يقعد يتساءل ليه الناس مش متحمسة للتنفيذ.»</div>`},

{s:'القرار الجماعي',t:'١:٢٨',h:`
<div class="eyebrow">القاعدة التانية</div>
<h1>الساكت مش فاضي.</h1>
<p class="lead">الساكت غالبًا <b>شايل ملاحظة</b>... والجو مش مطمّنه يطلّعها.</p>
<div class="rule"></div>
<p class="lead gold">والرأي اللي متقالش... بيتدفع تمنه بعدين.</p>
<p class="sub"><b>الأداة:</b> قبل ما تقفلوا أي قرار كبير — <b>جولة واحدة</b>: كل واحد <b>جملة</b>، من غير رد ومن غير نقاش.<br>أرخص تأمين في الدنيا.</p>`,cls:'center',n:`
<div class="say">«<b>القاعدة التانية: الساكت مش فاضي.</b><br><br>
إحنا بنفترض إن اللي ساكت في الاجتماع يا موافق يا مش مهتم. <b>والاتنين غالبًا غلط.</b><br><br>
الساكت في الأغلب <b>شايل ملاحظة</b>... والجو مش مطمّنه يطلّعها. يا خايف من رد الفعل، يا حاسس إن القرار خلاص واصل ومفيش فايدة.<br><br>
<b>والرأي اللي متقالش بيتدفع تمنه بعدين.</b> وبيتدفع أغلى، لأنه بيظهر بعد ما القرار اتنفذ.<br><br>
والأداة بسيطة جدًا: <b>قبل ما تقفلوا أي قرار كبير — جولة واحدة</b>. كل واحد جملة واحدة. <b>من غير رد ومن غير نقاش ومن غير "بس خليني أوضح"</b>.<br><br>
لأن أول ما جملة تتناقش، اللي بعدها هيبلع كلامه.<br><br>
دقيقتين... <b>وأرخص تأمين في الدنيا</b>.»</div>`},

{s:'القرار الجماعي',t:'١:٣٠',h:`
<div class="eyebrow">القاعدة التالتة</div>
<h1>القرار اللي متكتبش<br>مش بس بيتنسي... <span class="gold">بيتلوي.</span></h1>
<div class="rule"></div>
<p class="lead">كل واحد بيعجنه على مزاجه <b>من غير ما يقصد</b>.<br><span class="dim">ومحدش فيهم كداب.</span></p>`,cls:'center',n:`
<div class="say">«<b>والقاعدة التالتة: القرار اللي متكتبش مش بس بيتنسي... بيتلوي.</b><br><br>
يعني مش بس بينسى. <b>بيتغيّر شكله</b> — كل واحد بيعجنه على مزاجه من غير ما يقصد، وبيمشي فاكر إن ده اللي اتفقنا عليه.<br><br>
<b>ومحدش فيهم كداب.</b><br><br>
<span class="pause">(وقفة)</span><br><br>
وأنا مش هشرحلكم القاعدة دي. <b>هوريهالكم دلوقتي.</b>»</div>`},

{s:'القرار الجماعي',t:'١:٣١',h:`
<div class="write">
<div class="lab">⚡ حاجة صغيرة — ٤٥ ثانية</div>
<h3>افتكروا آخر قرار مهم اتاخد في اجتماع ليكم إنتو</h3>
<p class="dim">اجتماع حقيقي، قريب، وكلكم كنتوا فيه.</p>
<div class="rule" style="margin:2.2vh 0"></div>
<h2 style="margin:0">واكتبوا في سطر واحد:<br><span class="gold">القرار كان إيه بالظبط؟</span></h2>
<p class="sub">من غير ما تكلموا بعض. ومن غير ما تفتحوا موبايلاتكم.</p>
</div>
<div class="timer" data-t="45">٠:٤٥</div>`,n:`
<div class="warn"><b>دي أقوى ٨ دقايق في الورشة.</b> والخطر الوحيد إنها تتحول لفضيحة. الفرق: <b>نبرتك، وسرعة انتقالك للمبدأ</b>. اكشف، سمّي، وامشي.</div>
<div class="say">«حاجة صغيرة. أربعين ثانية.<br><br>
افتكروا <b>آخر قرار مهم</b> اتاخد في اجتماع ليكم إنتو. اجتماع حقيقي، من فترة قريبة، وكلكم كنتوا فيه.<br><br>
وكل واحد يكتب في <b>سطر واحد</b>: القرار كان إيه بالظبط.<br><br>
<b>من غير ما تكلموا بعض. ومن غير ما تفتحوا موبايلاتكم.</b>»</div>
<div class="warn">لو حد سأل «ليه؟» — بابتسامة: <b>«هتعرف بعد أربعين ثانية.»</b></div>
<div class="do">شغّل المؤقت. اسكت. <b>وابص في الأرض أو على الشاشة — مش عليهم.</b></div>`},

{s:'القرار الجماعي',t:'١:٣٢',cls:'center black',h:`
<div class="whisper">القراءة بالدور</div>`,n:`
<div class="do">الشاشة سودا عمدًا — عشان عينهم تبقى على بعض مش على الشاشة.</div>
<div class="say">«تمام. دلوقتي كل واحد بالدور... <b>يقرا اللي كتبه بالحرف</b>.<br><br>
زي ما هو. من غير ما يضيف، ومن غير ما يشرح، ومن غير "يعني قصدي".<br><br>
نبدأ من هنا وندور.»</div>
<h5>وإنت بتسمع</h5>
<table>
<tr><th>اعمل</th><th>متعملش</th></tr>
<tr><td>اكتب كل سطر عندك بالنص</td><td>ولا تعليق ولا كلمة</td></tr>
<tr><td><b>وشك محايد تمامًا</b></td><td><b>ولا ابتسامة معنى</b></td></tr>
<tr><td>«شكرًا» أو هزة راس بين واحد والتاني</td><td>متبصش لواحد بمعنى</td></tr>
<tr><td>لو قال «أنا كتبت زي فلان» ← «اقراها برضه»</td><td>متسمحش بتعليق بين السطور</td></tr>
</table>
<div class="warn"><b>الابتسامة دي هي الخطر الحقيقي.</b> إنت هتحس إن اللحظة "بتشتغل" وطبيعي إن وشك يتغير. <b>جمّده.</b> أول ابتسامة معنى منك، الناس هتحس إنها اتنصب لها فخ وهتدافع بدل ما تشوف.</div>
<div class="do">لما آخر واحد يخلص — <b>اسكت ٣ ثواني</b> قبل الشريحة اللي بعدها.</div>`},

{s:'القرار الجماعي',t:'١:٣٥',h:`
<h1>قرار واحد.<br>وكلنا كنا متأكدين إننا متفقين.</h1>
<div class="rule"></div>
<div class="big gold">و... كام نسخة؟</div>
<p class="sub" style="font-size:clamp(17px,2.6vh,28px)"><b>ومحدش فينا كداب.</b></p>`,cls:'center',n:`
<div class="say">«طيب.<br><br>
إحنا [العدد]. قاعدين على نفس الترابيزة. وكلنا حضرنا نفس الاجتماع. وكلنا كنا متأكدين إننا متفقين.<br><br>
<b>ودلوقتي سمعنا [العدد] نسخ مختلفة.</b><br><br>
<span class="pause">(وقفة ثانيتين)</span><br><br>
<b>ومحدش فينا كداب. ومحدش فينا مش مركز. ومحدش فينا نسي.</b><br><br>
ده اللي بيحصل... <b>لأن القرار ماتكتبش.</b>»</div>
<div class="do"><b>اسكت ٣ ثواني.</b> دي أقوى سكتة في الورشة. وبنبرة هادية — <b>مش نبرة انتصار</b>.</div>
<h5>إدارة اللحظة</h5>
<table>
<tr><th>لو</th><th>ترد</th></tr>
<tr><td><b>ضحكوا</b> (الأشهر)</td><td>اضحك معاهم. وبعدين: «طبيعي جدًا. وبيحصل في كل شركة في الدنيا.»</td></tr>
<tr><td><b>حد اتضايق</b></td><td>«مفيش حد غلط. <b>لو حد كتب سطر ساعتها، الجُمل كانت هتبقى واحدة.</b>»</td></tr>
</table>
<h5>لو قال «ده اختلاف صياغة بس» — أهم اعتراض</h5>
<div class="say">«ممكن جدًا. طيب تعالوا نجرّب:<br><br>
واحد كتب [أ]، وواحد كتب [ب].<br><br>
<b>بكرة الصبح، اللي هينفّذ [أ] هيعمل إيه أول حاجة؟ واللي هينفّذ [ب] هيعمل إيه؟</b>»</div>
<div class="do">سيبهم يجاوبوا. في ٩ من ١٠ حالات هيطلع فعلين مختلفين. وبعدها:</div>
<div class="say">«أهو. <b>الصياغة مبتفرقش على الورق... بتفرق بكرة الصبح.</b>»</div>
<h5>⚡ ولو كلهم كتبوا نفس الحاجة (نادر — وده مكسب أكبر)</h5>
<div class="say">«طيب. حصلت حاجة نادرة — إنتو كتبتوا نفس الحاجة تقريبًا.<br><br>
<b>والسؤال المهم: ليه؟</b><br><br>
فيه حاجة حصلت في الاجتماع ده خلّت القرار يوصل واضح للكل. <b>حد فاكر إيه هي؟</b><br><br>
<span class="pause">(غالبًا: اتقال بصوت عالي / حد لخّصه / كانت فيه جملة فيها فعل محدد)</span><br><br>
تمام. <b>يبقى الحاجة اللي حصلت عندكم بالصدفة... دي اللي هنخليها تحصل كل مرة بقرار.</b>»</div>`},

{s:'القرار الجماعي',t:'١:٣٦',h:`
<div class="eyebrow">الحل — سطر واحد قبل ما حد يقوم</div>
<h1 class="gold">قرّرنا إيه · ليه · مين هيتحرك · امتى</h1>
<div class="rule"></div>
<p class="lead">وسطر <b>«ليه»</b> ده بالذات — الكل بيستخسره... <b>وهو أغلى حتة</b>.</p>
<p class="sub">لأن بعد ٦ شهور الظروف بتتغير، وساعتها هو الوحيد اللي هيقولك: السبب اللي خدنا عشانه القرار ده... <b>لسه موجود ولا خلص؟</b><br><br>
<b>والقرار من غير سببه بيتحول لعادة</b> — محدش فاكر جت منين، ومحدش جريء يلغيها.</p>`,cls:'center',n:`
<div class="say">«والحل مش محضر اجتماع خمس صفحات — ده محدش هيقراه.<br><br>
<b>سطر واحد، قبل ما حد يقوم من على الترابيزة.</b> فيه أربع حاجات:<br><br>
<b>قرّرنا إيه · ليه · مين هيتحرك · امتى.</b><br><br>
وسطر <b>"ليه"</b> ده بالذات، الكل بيستخسره. <b>وهو أغلى حتة في السطر كله.</b><br><br>
ليه؟ لأن بعد ستة شهور الظروف بتتغير. وساعتها ده الوحيد اللي هيقولكم: <b>السبب اللي خدنا عشانه القرار ده — لسه موجود، ولا خلص؟</b><br><br>
<b>والقرار من غير سببه بيتحول مع الوقت لعادة.</b> محدش فاكر جت منين، ومحدش جريء يلغيها. وبعد سنتين تلاقوا الشركة كلها ماشية بقواعد <b>محدش فاكر ليه اتعملت</b>.»</div>`},

/* ───────── ٧ · البروتوكول ───────── */
{s:'البروتوكول',t:'١:٣٧',h:`
<div class="eyebrow">منهجية القرار — الصورة الكاملة</div>
<div class="steps" style="max-width:900px">
<div class="step"><div class="k">١</div><div class="v"><b>افحص جذبك</b><span>«لو الخيار ده مكانش بيطمّني / بيحمّسني / بيحفظ مكاني — كنت هشوفه صح؟»</span></div></div>
<div class="step"><div class="k">٢</div><div class="v"><b>افهم</b><span>«إيه اللي عارفينه فعلًا؟ وإيه اللي بنخمّنه؟» — واسأل بس عن اللي هيغيّر قرارك</span></div></div>
<div class="step"><div class="k">٣</div><div class="v"><b>راعِ</b><span>«هيقع إزاي على اللي هينفذوه ويعيشوا نتيجته؟»</span></div></div>
<div class="step"><div class="k">٤</div><div class="v"><b>احسم</b><span>«نتحرك امتى؟ ومين هيتحرك؟»</span></div></div>
<div class="step"><div class="k">٥</div><div class="v"><b>افحص صدرك</b><span>ضاق؟ <b>ضاق ليه؟</b> متعديش عليها.</span></div></div>
<div class="step"><div class="k">٦</div><div class="v"><b>راعِ السياق</b><span>«ده في صلاحيتي؟ عاجل ولا يحتمل؟ مين لازم أشركه؟»</span></div></div>
<div class="step"><div class="k">٧</div><div class="v"><b>نفّذ وراقب</b><span>اكتب سطر القرار — وابقَ مستعد <b>تعدّل عند المعلومة الجديدة، من غير ما ينهار يقينك</b></span></div></div>
</div>`,n:`
<div class="do"><b>قوم.</b> واقرا السبع خطوات واحدة واحدة بهدوء.</div>
<div class="say">«وكل حاجة قلناها النهارده بتتجمع في <b>صفحة واحدة</b>.<br><br>
<span class="pause">(اقرا السبع خطوات)</span><br><br>
وخدوا بالكم من حاجتين في <b>الترتيب</b>، لأن الترتيب ده مش عشوائي:<br><br>
<b>الحاجة الأولى: الجذب في الأول — مش في الآخر.</b><br>
ليه؟ <b>لأنه بيشتغل قبل كل حاجة.</b> لو فحصته بعد ما تحلل، هتكون بتفحص <b>التبرير</b>... مش الميل. والميل خلاص اختار من زمان.<br><br>
<b>والحاجة التانية: الصدر بعد الحسم — مش قبله.</b><br>
لأنه <b>مش أداة قرار، ده أداة مراجعة</b>. هو بيقولك: القرار اللي وصلت له ده <b>مستقر جواك</b>... ولا فيه حاجة لسه معلّقة؟»</div>
<h5>والقفلة</h5>
<div class="say">«وأنا مش بقولكم امشوا على السبع خطوات في كل قرار — <b>ده مستحيل، وهتسيبوه بعد أسبوع</b>.<br><br>
امشوا عليهم في <b>القرار اللي لو غلط مش هتقدروا ترجعوا فيه</b>.<br><br>
<b>والباقي؟</b> كل ما تكرروها، هتلاقوها بتتحول لعادة. زي السواقة بالظبط — في الأول بتفكر في كل حركة، وبعدين إيدك بتتحرك لوحدها.»</div>`},

/* ───────── ٨ · اللوح ───────── */
{s:'اللوح',t:'١:٤٥',h:`
<h1>كل اللي فات كان عن <span class="dim">إنت</span>.</h1>
<div class="rule"></div>
<p class="lead">وفاضل حاجة واحدة... <b>عن إنتو</b>.</p>`,cls:'center',n:`
<div class="do"><b>اتحرك جنب اللوح.</b></div>
<div class="say">«كل اللي اتكلمنا فيه لحد دلوقتي عن <b>إنت</b> — أدواتك، وجذبك، ورسوخك.<br><br>
وفاضل حاجة واحدة عن <b>إنتو</b>. عن الترابيزة.<br><br>
وهي حاجة عملية جدًا، وهي اللي هتخلي الساعتين دول يعيشوا بعد ما نمشي.<br><br>
إحنا مش هنطلع من هنا بقايمة أمنيات. هنطلع بـ<b>بند واحد</b>. مكتوب على الحيطة دي، بخط إيديكم، وليه صاحب.»</div>`},

{s:'اللوح',t:'١:٤٧',h:`
<div class="eyebrow">البند لازم يعدّي من تلات فلاتر</div>
<div class="steps" style="max-width:700px">
<div class="step"><div class="k">١</div><div class="v"><b>فيه فعل؟</b><span>مين هيعمل إيه، وامتى؟</span></div></div>
<div class="step"><div class="k">٢</div><div class="v"><b>ينفع نعمله بكرة؟</b><span>من غير ما نغيّر الشركة كلها</span></div></div>
<div class="step"><div class="k">٣</div><div class="v"><b>لو اتكسر... هنعرف؟</b></div></div>
</div>
<div class="rule"></div>
<p class="lead"><span style="color:#E07B5A">«لازم نتواصل أكتر»</span> ← <b>أمنية</b><br>
<span style="color:var(--ria)">«أي مهمة هنأجلها بتتقال بصوت عالي وبتتكتب»</span> ← <b>بند</b></p>
<div class="timer" data-t="60">١:٠٠</div>`,n:`
<div class="say">«من كل اللي قلناه النهارده — <b>إيه البند اللي لو كان موجود على ترابيزتكم من ٦ شهور... كان وفّر عليكم أكتر حاجة؟</b><br><br>
وخدوا بالكم من كلمة <b>بند</b>. مش نصيحة، ومش أمنية.<br><br>
<b>حاجة نقدر نعملها الاتنين الجاي الساعة عشرة، ونعرف إحنا عملناها ولا لأ.</b><br><br>
دقيقة، كل واحد يكتب جملة واحدة لنفسه. <b>من غير كلام.</b>»</div>
<div class="warn"><b>ليه الكتابة قبل الكلام؟</b> لأنك لو سبتهم يتكلموا على طول، <b>أعلى صوت هو اللي هيحدد البند</b>، واللي عنده رأي مختلف هيبلعه بعد أول اقتراح.</div>
<div class="do"><b>الجولة (دقيقتين):</b> بالدور، كل واحد جملته، من غير رد. وابدأ من <b>أهدى واحد في الأوضة</b>.</div>
<div class="warn"><b>ولا تعليق على أي جملة.</b> لا «حلوة دي» ولا استحسان. أول ما تعمل كده، الباقيين هيبطلوا يقولوا اللي عندهم ويبدأوا يقولوا <b>اللي إنت هتستحسنه</b>.</div>
<h5>🛠️ جدول الشحذ — الذخيرة في جيبك</h5>
<table>
<tr><th>هيقولوا</th><th>ترد بـ</th><th>البند المشحوذ</th></tr>
<tr><td>«نرتّب أولوياتنا»</td><td>«مين بيرتّب، وامتى، وإزاي نعرف؟»</td><td>«قبل ما اليوم يبدأ، حد بيقول بصوت عالي: النهارده الأهم هو كذا»</td></tr>
<tr><td>«نتواصل أكتر»</td><td>«دي أمنية. نتكلم <b>امتى</b> وعن <b>إيه</b>؟»</td><td>«قبل ما نتفرق على المهام، دقيقتين: كل واحد يقول شايل إيه»</td></tr>
<tr><td>«نسأل قبل ما نقرر»</td><td>«نسأل <b>مين</b>، وامتى، وعن إيه؟»</td><td>«أول ٥ دقايق في أي أزمة: <b>أسئلة بس</b>. ممنوع أي حل»</td></tr>
<tr><td>«نكتب القرار»</td><td>«مين بيكتبه، وامتى، وفين؟»</td><td>«قبل ما حد يقوم: واحد بيكتب سطر القرار <b>ويقراه بصوت عالي</b>»</td></tr>
<tr><td>«نسمع الساكت»</td><td>«إزاي بالظبط؟»</td><td>«قبل أي قرار كبير: جولة — كل واحد <b>جملة</b>، من غير رد»</td></tr>
<tr><td>«نبقى منظمين أكتر»</td><td>«دي حاسة مش بند. <b>حصل إيه</b> وعايزينه ما يحصلش؟»</td><td>(رجّعه للواقعة)</td></tr>
</table>
<h5>أربع قواعد شحذ</h5>
<ul>
<li><b>متكتبش بندهم بكلامك.</b> كلمتهم بتفضل معاهم، وكلمتك بتتنسي</li>
<li><b>الشحذ بسؤال مش باقتراح.</b> «مين هيعمله؟» ✅ · «طب نخليها كذا؟» ❌</li>
<li>لو اتنين اقترحوا حاجتين: <b>متختارش إنت.</b> «التنتين حلوين — أنهي واحدة أقرب للي بيحصل عندكم فعلًا؟»</li>
<li><b>بند واحد بس.</b> لو طلعوا اتنين: «امسكوا التاني للأسبوع الجاي»</li>
</ul>`},

{s:'اللوح',t:'١:٥٠',h:`
<div class="eyebrow">وكل بند... معاه حاجتين</div>
<div class="grid3" style="grid-template-columns:1fr 1fr;max-width:900px">
<div class="card" style="--c:var(--fahm)"><div class="n">🔍</div><h4>العلامة</h4><p>إزاي هنعرف إن البند ده <b>اتكسر</b>؟</p></div>
<div class="card" style="--c:var(--hasm)"><div class="n">⚠️</div><h4>الفخ</h4><p>البند ده <b>هيضرّنا امتى</b>؟</p></div>
</div>
<div class="rule"></div>
<p class="lead">البند اللي <b>مالوش علامة</b> ← بيتنسي<br>
البند اللي <b>مالوش فخ</b> ← بيتطبّق بعمى</p>`,n:`
<div class="say">«البند اتكتب. بس هو <b>لسه ناقص حاجتين</b> — ومن غيرهم مش هيعيش أسبوع.<br><br>
<b>الأولى: العلامة.</b> إزاي هنعرف إن البند ده اتكسر؟<br>
لأن البند اللي مالوش علامة <b>بيتنسي بهدوء</b> — بيفضل معلّق والدنيا ماشية ومحدش واخد باله.<br><br>
<b>والتانية — ودي اللي محدش بيعملها: الفخ.</b><br>
<b>البند ده هيضرّنا امتى؟</b><br><br>
وأنا مش بهزر. <b>أي قاعدة كويسة، لو اتطبّقت بعمى، بتعمل ضرر بنفس قوة الضرر اللي اتعملت عشانه.</b><br><br>
مثال: "اسأل قبل ما تقرر" قاعدة ممتازة. وفي الإفراط بتتحول لإيه؟ <b>لجنة دراسة وتقرير وتقرير تاني، والقرار ما اتخدش.</b><br><br>
فالبند بتاعنا ده... <b>هيضرّنا امتى؟</b>»</div>
<div class="warn"><b>ليه ده أهم من البند نفسه؟</b> لأنه <b>بيمنع البند يتحول لسلاح</b>. أول ما حد يستخدم بند لإسكات زميله («إحنا اتفقنا على كذا!») — <b>الفخ المكتوب جنبه هو الرد الجاهز</b>. من غيره، الميثاق بيتحول لعصاية.</div>
<h5>🖊️ السك — بالترتيب ده بالظبط</h5>
<div class="do">
١. اسكت ثانيتين<br>
٢. اتحرك ناحية اللوح، <b>شيل الماركر</b> من على الترابيزة، وارجع خطوة لورا<br>
٣. قول: «البند ده... <b>مش هيتقال ويعدي</b>. ده أول سطر على اللوح.»<br>
٤. <b>مدّ الماركر لواحد منهم</b> — يفضّل صاحب الجملة الأصلية<br>
٥. قول: «<b>البند فوق، وتحته العلامة، وتحتها الفخ.</b>»<br>
٦. <b>ارجع مكانك وهو بيكتب.</b> ولا تقف جنبه، ولا تصحح إملاء<br>
٧. لما يخلص — <b>٣ ثواني سكوت</b> والكل بيبص على اللوح
</div>
<div class="warn"><b>إنت عمرك ما تكتب على اللوح. ولا حرف.</b></div>`},

{s:'اللوح',t:'١:٥٣',h:`
<div class="eyebrow">وآخر حاجة</div>
<h2>البند ده... له حارس</h2>
<p class="lead">واحد منكم. <b>لمدة شهر.</b></p>
<div class="grid3" style="grid-template-columns:1fr 1fr;max-width:900px">
<div class="card" style="--c:var(--gold)"><div class="n">🔔</div><h4>حقه</h4><p>يقول في أي اجتماع، <b>لأي حد</b>: «البند ده بيتكسر دلوقتي.»<br>من غير إذن، ومن غير شرح.</p></div>
<div class="card" style="--c:var(--gold)"><div class="n">📋</div><h4>واجبه</h4><p>بعد ١٤ يوم — <b>جملة واحدة</b>:<br>اشتغل؟ اتكسر؟ اتنسي؟</p></div>
</div>
<p class="sub"><b>وخلاص. الحارس جرس... مش بوليس.</b></p>`,n:`
<div class="say">«وآخر حاجة، وهي اللي بتخلي البند ده يعيش:<br><br>
<b>البند ده هياخد حارس.</b> واحد منكم، لمدة شهر.<br><br>
والحارس <b>مش مسؤول عن التنفيذ</b>، ومش هيحاسب حد، ومش هيبعت تذكيرات كل يوم.<br><br>
<b>له حاجة واحدة، وعليه حاجة واحدة.</b><br><br>
<b>اللي له:</b> الحق إنه يقول في أي اجتماع، لأي حد — "البند ده بيتكسر دلوقتي." <b>من غير ما ياخد إذن، ومن غير ما يبرر.</b><br><br>
<b>واللي عليه:</b> بعد أسبوعين، جملة واحدة: اشتغل؟ اتكسر؟ ولا اتنسي؟<br><br>
<b>وخلاص. مفيش تالت.</b>»</div>
<div class="do">اسكت ثانيتين. وبعدين — <b>ببطء، وإنت بتبص على الكل</b>:</div>
<div class="say">«وفيه حاجة لازم تتقال دلوقتي، <b>قدام الكل، وبصوت عالي</b>:<br><br>
<b>الحارس بينبّه لأي حد. حتى لو أعلى منه.</b><br><br>
<span class="pause">(وقفة)</span><br><br>
لأن لو الحارس هيسكت عشان اللي بيكسر البند أكبر منه...<br><br>
<b>يبقى إحنا كتبنا البند ده عشان نعلقه على الحيطة ونتصور جنبه.</b><br><br>
<span class="pause">(وقفة)</span><br><br>
متفقين على دي؟»</div>
<div class="warn"><b>استنى موافقة فعلية.</b> ولو المدير الحقيقي موجود — <b>بص عليه في عينه بالذات وانتظر موافقته</b>. الموافقة دي هي اللي بتخلق الغطاء؛ من غيرها البند هيشتغل على الصغير بس.</div>
<div class="do">«طيب. <b>مين هياخده؟</b>» — بالتطوّع. واكتب اسمه جنب البند على اللوح. <b>وخلّي الكل يصوّر اللوح دلوقتي.</b></div>`},

/* ───────── ٩ · الختام ───────── */
{s:'الختام',t:'١:٥٥',h:`
<div class="write">
<div class="lab">خطة الـ١٤ يوم</div>
<h3 style="color:#E07B5A">❌ متطبّقش الخمسة. دي وصفة فشل مضمونة.</h3>
<h3 style="color:var(--ria)">✅ أداة واحدة. اللي <b>وجعتك</b> النهارده.</h3>
<div class="rule" style="margin:2.4vh 0"></div>
<div class="steps">
<div class="step"><div class="k">١</div><div class="v">الأداة: <i class="dim">__________</i></div></div>
<div class="step"><div class="k">٢</div><div class="v">أول موقف هستخدمها فيه: <i class="dim">__________</i></div></div>
<div class="step"><div class="k">٣</div><div class="v">إمتى بالظبط: <i class="dim">__________</i></div></div>
<div class="step"><div class="k">٤</div><div class="v"><b>الحاجة الوحيدة اللي ممكن تمنعني:</b> <i class="dim">__________</i></div></div>
</div>
</div>
<div class="timer" data-t="180">٣:٠٠</div>`,n:`
<div class="say">«آخر حاجة عملية.<br><br>
<b>متطبّقوش الخمس أدوات من بكرة.</b> دي وصفة فشل مضمونة — هتنسوهم كلهم في أسبوع.<br><br>
<b>اختاروا أداة واحدة بس.</b><br><br>
واللي هتختاروها <b>مش الأحلى</b>... <b>اللي وجعتكم</b>. اللي وإنتو بتسمعوها افتكرتوا موقف معين، وحسّيتوا بحاجة في صدركم.<br><br>
واكتبوا تحتها أربع حاجات — والرابعة دي هي اللي بتفرق:<br><br>
<b>الحاجة الوحيدة اللي ممكن تمنعني.</b><br><br>
لأن كل واحد فينا <b>عارف الحاجة اللي هتوقفه</b>... ومش بيسمّيها.<br><br>
تلات دقايق.»</div>
<div class="do">استنى ٣ دقايق <b>فعلية</b>.</div>`},

{s:'الختام',t:'١:٥٨',h:`
<div class="grid3" style="grid-template-columns:1fr 1fr;max-width:920px;margin-bottom:3vh">
<div class="card" style="--c:var(--fahm)"><h4>حاجة عنك إنت</h4><p>٥ أدوات · بروتوكول من ٧ خطوات · صفحة كتبتها لنفسك<br><br><b>خاصة. ملكك. ومحدش هيشوفها.</b></p></div>
<div class="card" style="--c:var(--gold)"><h4>وحاجة عن ترابيزتكم</h4><p>بند على الحيطة · وله حارس<br><br><b>معلنة. ومشتركة. وهتفضل موجودة.</b></p></div>
</div>
<div class="rule"></div>
<h1>يوم واحد بيرسم خط.<br><span class="gold">والأيام هي اللي بترسم الصورة.</span></h1>`,cls:'center',n:`
<div class="do"><b>قوم. واتكلم ببطء شديد.</b></div>
<div class="say">«اللي في إيديكم دلوقتي <b>حاجتين مختلفتين</b>:<br><br>
<b>حاجة عنك إنت</b> — خمس أدوات، وبروتوكول من سبع خطوات، وصفحة إنت كتبتها لنفسك عن نفسك. <b>ودي خاصة، ملكك، ومحدش هيشوفها.</b><br><br>
<b>وحاجة عن ترابيزتكم</b> — بند على الحيطة، إنتو كتبتوه، وله حارس. <b>ودي معلنة ومشتركة، وهتفضل موجودة.</b><br><br>
<span class="pause">(وقفة)</span><br><br>
وآخر حاجة، وعايزكم تسمعوها كويس:<br><br>
<b>كل اللي اتقال النهارده... مش حكم على حد.</b><br><br>
ومحدش يمشي شايل صفة على ضهره. مفيش حد هنا "المتسرع"، ومفيش حد "اللي بيتشلّ"، ومفيش حد "اللي بيسكت".<br><br>
فيه ناس <b>شافت الماكينة اللي شغالة جواها</b>... وده مش سهل، وده مش شائع.<br><br>
<span class="pause">(وقفة)</span><br><br>
وأنا مش عايز منكم تطبقوا كل حاجة. <b>عايز حاجة واحدة</b> — اللي وجعتكم — جربوها أسبوعين.<br><br>
<b>وبعدين تعالوا قولولي حصل إيه.</b><br><br>
شكرًا لصدقكم النهارده.»</div>`}

];

/* ═══════════════════════════════════════════════
   المحرّك
   ═══════════════════════════════════════════════ */
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const stage=document.getElementById('stage');
const notes=document.getElementById('notes');
const over=document.getElementById('over');
let i=0, buf='';

D.forEach((d,k)=>{
  const s=document.createElement('section');
  s.className='slide '+(d.cls||'');
  s.dataset.k=k;
  s.innerHTML=d.h;
  stage.appendChild(s);
});
const slides=[...document.querySelectorAll('.slide')];

function paint(){
  slides.forEach((s,k)=>s.classList.toggle('on',k===i));
  const d=D[i];
  document.getElementById('railNum').textContent=AR(i+1);
  document.getElementById('railSec').textContent=d.s;
  document.getElementById('railClock').textContent=d.t;
  document.getElementById('railFill').style.height=((i+1)/D.length*100)+'%';
  notes.innerHTML=`<div class="nhead"><strong>${d.s} · شريحة ${AR(i+1)}</strong><em>${d.t} — اضغط N للإخفاء</em></div>`+(d.n||'<p>—</p>');
  notes.scrollTop=0;
  document.title=`${AR(i+1)} · ${d.s} — ورشة القرار`;
}
function go(n){i=Math.max(0,Math.min(D.length-1,n));paint();}

/* ---------- المؤقتات ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('.timer'); if(!t)return;
  if(t._tap){clearTimeout(t._tap);t._tap=null;reset(t);return;}
  t._tap=setTimeout(()=>{t._tap=null;toggle(t)},230);
});
function fmt(s){const m=Math.floor(s/60),x=s%60;return AR(m)+':'+AR(String(x).padStart(2,'0'));}
function reset(t){clearInterval(t._iv);t._iv=null;t._left=+t.dataset.t;t.textContent=fmt(t._left);t.className='timer';}
function toggle(t){
  if(t._iv){clearInterval(t._iv);t._iv=null;t.classList.remove('run');return;}
  if(t._left==null)t._left=+t.dataset.t;
  t.classList.add('run');
  t._iv=setInterval(()=>{
    t._left--;t.textContent=fmt(Math.max(0,t._left));
    if(t._left<=+t.dataset.t*0.2)t.classList.add('warn');
    if(t._left<=0){clearInterval(t._iv);t._iv=null;t.classList.remove('run')}
  },1000);
}

/* ---------- الفهرس ---------- */
function buildOver(){
  let h='',last='';
  D.forEach((d,k)=>{
    if(d.s!==last){h+=(last?'</div>':'')+`<h6>${d.s}</h6><div class="og">`;last=d.s;}
    const txt=(d.h.replace(/<[^>]+>/g,' ').trim().split(/\s+/).slice(0,7).join(' '))||'—';
    h+=`<div class="oc" tabindex="0" data-k="${k}"><div class="on">${AR(k+1)} · ${d.t}</div><div class="ot">${txt}</div></div>`;
  });
  over.innerHTML=h+'</div>';
  over.querySelectorAll('.oc').forEach(c=>{
    const jump=()=>{go(+c.dataset.k);over.classList.remove('on')};
    c.onclick=jump;
    c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();jump()}};
  });
}
buildOver();

/* ---------- المفاتيح ---------- */
const jbox=document.getElementById('jump');
addEventListener('keydown',e=>{
  const k=e.key;
  if(k>='0'&&k<='9'){buf+=k;jbox.textContent=AR(buf);jbox.style.display='block';return;}
  if(k==='Enter'&&buf){go(parseInt(buf)-1);buf='';jbox.style.display='none';return;}
  if(k==='Escape'){buf='';jbox.style.display='none';over.classList.remove('on');notes.classList.remove('open');return;}
  if(k==='ArrowLeft'||k===' '||k==='PageDown'){e.preventDefault();go(i+1)}
  if(k==='ArrowRight'||k==='PageUp'){e.preventDefault();go(i-1)}
  if(k==='Home')go(0); if(k==='End')go(D.length-1);
  if(k==='n'||k==='N'||k==='ن'){notes.classList.toggle('open')}
  if(k==='o'||k==='O'||k==='خ'){over.classList.toggle('on')}
  if(k==='f'||k==='F'||k==='ب'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
});

/* ---------- اللمس ---------- */
let x0=null,y0=null,tcount=0;
addEventListener('touchstart',e=>{
  if(e.touches.length===2){tcount=2;return}
  x0=e.touches[0].clientX;y0=e.touches[0].clientY;tcount=1;
},{passive:true});
addEventListener('touchend',e=>{
  if(tcount===2){notes.classList.toggle('open');tcount=0;return}
  if(x0===null)return;
  const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
  if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)){dx>0?go(i-1):go(i+1)}
  else if(Math.abs(dx)<12&&Math.abs(dy)<12&&!e.target.closest('.timer,#notes,#over')){go(i+1)}
  x0=null;
},{passive:true});

paint();
</script>
</body>
</html>
