<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>يوم وميض — الجزء الرابع · الاجتماع الصعب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;500;600;700&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141310; --ink-2:#1c1a15; --ink-3:#26221b;
    --bone:#ece4d4; --bone-dim:#a89c85; --bone-faint:#6f6555;
    --ember:#e8a24a; --ember-deep:#c7742a; --ember-glow:rgba(232,162,74,.16);
    --calm:#89b3a8; --info:#8aa6c8; --danger:#d8654e;
    --line:rgba(236,228,212,.12); --line-2:rgba(236,228,212,.06);
    --display:'Reem Kufi', system-ui, sans-serif; --body:'Tajawal', system-ui, sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{background:
      radial-gradient(130% 100% at 50% -20%, rgba(216,101,78,.09), transparent 55%),
      radial-gradient(100% 80% at 50% 120%, rgba(232,162,74,.05), transparent 55%),
      var(--ink);
    color:var(--bone);font-family:var(--body);-webkit-font-smoothing:antialiased;user-select:none;}
  #progress{position:fixed;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--ember-deep),var(--ember));box-shadow:0 0 14px var(--ember-glow);z-index:60;transition:width .5s cubic-bezier(.2,.7,.2,1);width:0}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:6vh 7vw}
  .slide{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:7vh 8vw;flex-direction:column;text-align:center;opacity:0;transition:opacity .7s ease}
  .slide.on{display:flex;opacity:1}
  .wrap{max-width:1100px;width:100%;display:flex;flex-direction:column;align-items:center;gap:2.4vh}
  .eyebrow{font-weight:700;letter-spacing:.14em;color:var(--ember);font-size:clamp(13px,1.5vw,17px);opacity:.9}
  .eyebrow.calm{color:var(--calm)}.eyebrow.danger{color:var(--danger)}
  h1{font-family:var(--display);font-weight:600;line-height:1.28;font-size:clamp(30px,5.4vw,64px)}
  .lead{font-size:clamp(18px,2.3vw,28px);line-height:1.85;color:var(--bone);font-weight:400;max-width:920px}
  .dim{color:var(--bone-dim)}.faint{color:var(--bone-faint)}.glow{color:var(--ember)}.cool{color:var(--calm)}
  .big-line{font-family:var(--display);font-size:clamp(30px,5vw,58px);line-height:1.4;font-weight:600}
  .rule{width:64px;height:2px;background:var(--ember);opacity:.6;border:none;box-shadow:0 0 12px var(--ember-glow)}
  .rule.wide{width:min(520px,70%)}
  .stack{display:flex;flex-direction:column;gap:1.3vh;align-items:center}

  /* empty chair atmospheric */
  .chair{font-size:clamp(60px,10vw,120px);opacity:.35;line-height:1;filter:drop-shadow(0 0 30px var(--ember-glow))}

  /* client opening */
  .client-tag{font-family:var(--display);color:var(--danger);letter-spacing:.05em;font-size:clamp(15px,1.8vw,22px)}
  .demand{font-family:var(--display);font-size:clamp(28px,4.6vw,56px);line-height:1.45;font-weight:600}
  .demand .k{color:var(--danger)}

  /* questions (phase 2) */
  .qlist{display:flex;flex-direction:column;gap:1.8vh;width:100%;max-width:820px;text-align:right}
  .qlist .q{display:flex;gap:1rem;align-items:baseline;font-size:clamp(16px,2vw,24px);line-height:1.5}
  .qlist .q .n{font-family:var(--display);color:var(--danger);min-width:1.3em}
  .qlist .q b{color:var(--ember);font-weight:700}
  .demandline{color:var(--bone-dim);font-style:italic;font-size:clamp(15px,1.8vw,21px);margin-top:1vh}

  /* ending consequence */
  .end{width:100%;max-width:900px;text-align:right;border-radius:16px;overflow:hidden;border:1px solid rgba(232,162,74,.28);background:linear-gradient(180deg,rgba(232,162,74,.06),var(--ink))}
  .end .eh{padding:1.6vh 1.9vw;border-bottom:1px solid var(--line)}
  .end .ee{color:var(--ember);font-weight:700;letter-spacing:.06em;font-size:clamp(12px,1.4vw,15px)}
  .end .et{color:var(--bone);font-family:var(--display);font-size:clamp(19px,2.4vw,28px);margin-top:.5vh}
  .end .eb{padding:2.2vh 1.9vw;font-size:clamp(14.5px,1.7vw,19px);line-height:1.95;color:var(--bone)}
  .end .eb p{margin-bottom:1.1vh}
  .end .eq{color:var(--bone);padding-right:1rem;border-right:2px solid var(--danger);margin:1.2vh 0}
  .end .foot{padding:1.4vh 1.9vw;background:var(--ink-3);border-top:1px solid var(--line);color:var(--ember-deep);font-style:italic;font-size:clamp(13px,1.5vw,17px)}

  /* chest */
  .chest{display:flex;gap:clamp(1.4rem,5vw,4rem);align-items:center;justify-content:center;margin:1vh 0}
  .chest .opt{display:flex;flex-direction:column;align-items:center;gap:1.2vh}
  .chest .dot{width:clamp(46px,7vw,84px);height:clamp(46px,7vw,84px);border-radius:50%;border:2px solid var(--line-2)}
  .chest .d1{border-color:rgba(216,101,78,.5);background:radial-gradient(circle,rgba(216,101,78,.12),transparent)}
  .chest .d2{border-color:rgba(168,156,133,.5)}
  .chest .d3{border-color:rgba(137,179,168,.55);background:radial-gradient(circle,rgba(137,179,168,.12),transparent)}
  .chest .lbl{font-family:var(--display);font-size:clamp(16px,2vw,24px)}
  .chest .l1{color:var(--danger)}.chest .l2{color:var(--bone-dim)}.chest .l3{color:var(--calm)}

  /* badges ritual */
  .pledge{display:flex;flex-direction:column;gap:2vh;text-align:right;max-width:820px;width:100%}
  .pledge .row{display:flex;gap:1.2rem;align-items:flex-start}
  .pledge .n{font-family:var(--display);color:var(--ember);font-size:clamp(20px,2.6vw,32px);line-height:1;min-width:1.4em}
  .pledge .t{font-size:clamp(16px,1.9vw,23px);line-height:1.6}

  /* tafkeek: ways */
  .ways{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1.2vw;width:100%;max-width:960px;text-align:right}
  .way{border:1px solid var(--line);border-radius:14px;padding:1.6vh 1.2vw;display:flex;flex-direction:column;gap:.6vh}
  .way .wt{font-family:var(--display);color:var(--danger);font-size:clamp(15px,1.8vw,21px)}
  .way .wd{color:var(--bone-dim);font-size:clamp(12.5px,1.4vw,16px);line-height:1.6}
  .traits{display:flex;flex-direction:column;gap:.7vh;width:100%;max-width:820px;text-align:right}
  .traits .tr{color:var(--bone);font-size:clamp(14px,1.6vw,19px);line-height:1.5;padding-right:1.2rem;position:relative}
  .traits .tr::before{content:"◆";color:var(--danger);position:absolute;right:0;font-size:.7em;top:.35em}

  /* protocol */
  .proto{display:flex;flex-direction:column;gap:1.4vh;width:100%;max-width:860px;text-align:right}
  .proto .p{display:flex;gap:1.1rem;align-items:flex-start}
  .proto .pn{font-family:var(--display);color:var(--ember);font-size:clamp(20px,2.4vw,30px);min-width:1.4em}
  .proto .pt{font-size:clamp(15px,1.75vw,21px);line-height:1.55}
  .proto .pt b{color:var(--bone);font-weight:700}
  .proto .pt span{color:var(--bone-dim);display:block;margin-top:.2vh;font-size:.9em}

  .tool{width:100%;max-width:820px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,rgba(232,162,74,.05),transparent);padding:3vh 2vw;text-align:right;display:flex;flex-direction:column;gap:1.4vh}
  .tool .thh{font-family:var(--display);color:var(--ember);font-size:clamp(19px,2.3vw,26px)}
  .tool .quote{font-size:clamp(16px,2vw,23px);line-height:1.8;color:var(--bone);padding-right:1.2rem;border-right:3px solid var(--ember)}
  .tool .why{color:var(--bone-dim);font-size:clamp(13.5px,1.55vw,17px);line-height:1.7}
  .body-note{width:100%;max-width:860px;text-align:right;display:flex;flex-direction:column;gap:1vh}
  .body-note .bn{color:var(--bone);font-size:clamp(14.5px,1.65vw,19px);line-height:1.7}
  .body-note .bn b{color:var(--ember)}

  .timer{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;font-size:clamp(64px,13vw,150px);line-height:1;color:var(--bone);cursor:pointer;transition:color .3s,text-shadow .3s}
  .timer.run{color:var(--ember);text-shadow:0 0 40px var(--ember-glow)}
  .timer.warn{color:var(--danger);text-shadow:0 0 40px rgba(216,101,78,.3);animation:pulse 1.1s infinite}
  .timer.done{color:var(--danger)}
  .timer-hint{color:var(--bone-faint);font-size:clamp(12px,1.4vw,15px);margin-top:1.4vh}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

  #chrome{position:fixed;inset:auto 0 0 0;display:flex;justify-content:space-between;align-items:center;padding:2.2vh 3vw;pointer-events:none;z-index:50}
  #snum{color:var(--bone-faint);font-size:13px;letter-spacing:.08em;font-variant-numeric:tabular-nums}
  #mark-sm{color:var(--bone-faint);font-family:var(--display);font-size:15px;letter-spacing:.1em}#mark-sm b{color:var(--ember);opacity:.75}
  #jump{position:fixed;bottom:2vh;left:50%;transform:translateX(-50%);z-index:70;background:var(--ink-3);border:1px solid var(--ember);color:var(--ember);font-family:var(--display);padding:.5em 1.1em;border-radius:10px;font-size:20px;letter-spacing:.15em;display:none}

  #faci{position:fixed;inset:auto 0 0 0;max-height:84vh;overflow-y:auto;z-index:80;background:linear-gradient(180deg,#0d0c0a,#141310);border-top:2px solid var(--ember);transform:translateY(101%);transition:transform .45s cubic-bezier(.2,.8,.2,1);padding:3vh 4vw 5vh;box-shadow:0 -30px 60px rgba(0,0,0,.6)}
  #faci.open{transform:translateY(0)}
  #faci .fhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:2vh;padding-bottom:1.5vh;border-bottom:1px solid var(--line)}
  #faci .ftitle{font-family:var(--display);color:var(--ember);font-size:clamp(16px,2vw,22px)}
  #faci .fclose{color:var(--bone-dim);font-size:13px;border:1px solid var(--line);border-radius:8px;padding:.4em .9em;cursor:pointer}
  #faci-body{display:flex;flex-direction:column;gap:1.6vh;text-align:right;line-height:1.75;font-size:clamp(14px,1.55vw,17.5px)}
  .blk{border-right:4px solid;padding:1.2vh 1.3vw;border-radius:0 10px 10px 0;background:rgba(255,255,255,.02)}
  .blk .bt{font-weight:800;font-size:.82em;letter-spacing:.05em;margin-bottom:.5vh;display:block}
  .say{border-color:var(--ember)} .say .bt{color:var(--ember)} .say .q{color:var(--bone);font-weight:500}
  .do{border-color:var(--calm)} .do .bt{color:var(--calm)}
  .warn{border-color:var(--danger)} .warn .bt{color:var(--danger)}
  .watch{border-color:var(--bone-dim)} .watch .bt{color:var(--bone-dim)}
  .safe{border-color:var(--calm);background:rgba(137,179,168,.06)} .safe .bt{color:var(--calm)}
  .blk ul{margin:.4vh 1.2rem 0;padding:0}.blk li{margin:.35vh 0}
  .blk table{width:100%;border-collapse:collapse;margin-top:.5vh;font-size:.95em}
  .blk td{border:1px solid var(--line);padding:.5vh .6vw;vertical-align:top}
  .blk td:first-child{color:var(--bone-dim);width:44%}
  .blk td:last-child{color:var(--bone)}
  #faci .why-note{color:var(--bone-dim);font-size:.9em}

  #help{position:fixed;top:2vh;left:2vw;z-index:70;color:var(--bone-faint);font-size:12px;background:var(--ink-2);border:1px solid var(--line);border-radius:8px;padding:.5em .8em;line-height:1.7;text-align:right;max-width:240px;opacity:0;transition:opacity .3s;pointer-events:none}
  #help.show{opacity:1}#help b{color:var(--ember)}
  @media (max-width:760px){.ways{grid-template-columns:1fr}}
  @media (prefers-reduced-motion:reduce){.slide{transition:none}.timer.warn{animation:none}}
</style>
</head>
<body>
  <div id="progress"></div>
  <div id="stage"></div>
  <div id="chrome"><span id="snum"></span><span id="mark-sm"><b>◆</b> وميض</span></div>
  <div id="jump"></div>
  <div id="help"><b>الأسهم / مسافة</b> تنقّل<br><b>رقم + Enter</b> قفزة<br><b>Esc</b> رجوع<br><b>N</b> شرح الميسّر<br><span style="color:var(--danger)">النهايتين مخفيتين: ٨٦ التماسك · ٨٧ التشتت</span></div>
  <div id="faci"><div class="fhead"><span class="ftitle">🎙️ شرح الميسّر</span><span class="fclose" onclick="toggleFaci()">إغلاق ✕</span></div><div id="faci-body"></div></div>

<script>
const SLIDES=[

/* ===== CHAPTER 4 ===== */
{id:78, body:`
  <div class="wrap">
    <div class="eyebrow danger">الفصل الرابع</div>
    <div class="chair">🪑</div>
    <div class="big-line">الكرسي اللي كان فاضي...</div>
    <div class="lead dim">من الصبح، كان فيه كرسي واحد فاضي على رأس الترابيزة.<br>محدش سأل عنه. محدش قعد عليه.</div>
    <hr class="rule">
    <div class="big-line glow">دلوقتي... له صاحب.</div>
  </div>`,
 notes:`
  <div class="blk warn"><span class="bt">🔴 افهم التصميم</span> الفصل ده بيقيس اللحظة اللي بتفشل فيها أداتك المهيمنة، وبيبان اللي تحتها. القرار المشحون: بيكلّف إنسان بالاسم · مش قابل للحل بالتحليل · قدام الناس · بيقفل باب. أي اختيار هيوجع حد.</div>
  <div class="blk safe"><span class="bt">🟩 ليه ده آمن</span> الناس بتقرر في شخصيات وهمية (كريم، هبة). المسافة دي هي كل الأمان. الوجع حقيقي، بس محدش هيتقيّم قدام مديره الحقيقي.</div>
  <div class="blk safe"><span class="bt">🟩 إعادة عقد الأمان — لا تتخطاها أبدًا. قول بصوتك إنت (مش في الدور):</span>
  <span class="q">«المشهد الجاي أقوى مشهد في اليوم. وقبل ما نبدأه، هفكّركم بتلات حاجات: الأولى — ده مشهد مش حقيقة، أي حدة موجّهة لوميض مش ليكم. والتانية — إحنا هنقرر في ناس مش موجودين، ولا واحد هيتقيّم النهارده ولا حد هيتكلم عن حد. والتالتة — إشارة الأمان شغالة أكتر من أي وقت: أي لحظة عايز تطلع، نيّم ورقتك واخرج، من غير سؤال ولا بصة. مستعدين؟... خدوا نَفَس.»</span></div>
  <div class="blk warn"><span class="bt">🔴 خط أحمر مطلق</span> لو أي واحد وجّه كلمة تقييمية لواحد تاني: توقّف فورًا وارجّع للقصة: «إحنا بنقرر في مدربين وميض. الناس على الترابيزة دي مالهاش دعوة.»</div>`},

{id:79, body:`
  <div class="wrap">
    <div class="client-tag">أ. خالد المهدي — مدارس المستقبل</div>
    <div class="demand">أنا مش هكمّل بالفريق ده.<br>عايز تشكيلة جديدة على عقدي السنة الجاية.</div>
    <hr class="rule">
    <div class="demand"><span class="k">وعايز أسامي.</span><br>دلوقتي. قدامي.</div>
  </div>`,
 notes:`
  <div class="blk do"><span class="bt">🎭 طقس الدخول — في صمت تام، بالترتيب</span>
   <ul><li>اسكت. بلاش أي جملة انتقالية</li>
   <li>امشي ببطء ناحية الكرسي الفاضي، وقف وراه ثانيتين</li>
   <li>اقلب البادج بتاعك: «خالد المهدي — مدارس المستقبل»، حطه قدامك، اقعد</li>
   <li>بص عليهم ٥ ثواني — بصة العميل. من اللحظة دي إنت مش إنت</li></ul></div>
  <div class="blk say"><span class="bt">🟡 جملة الربط أولًا — حسب قرار الفصل التاني</span>
   <table>
   <tr><td>أمان (تفاوض/سعر)</td><td>«وصلني عرضكم المعدّل... قريته كويس.»</td></tr>
   <tr><td>مكانة (مقابلة/علاقة)</td><td>«إنتو اللي طلبتوا نقعد. أهو قعدنا.»</td></tr>
   <tr><td>نمو (جودة/تجديد)</td><td>«رفضتوا تنزّلوا السعر. موقف يُحترم... وأنا جاي أشوفه.»</td></tr>
   <tr><td>تأجيل</td><td>«مردتوش عليّ رد واضح... فجيت بنفسي.»</td></tr>
   </table></div>
  <div class="blk say"><span class="bt">🟡 الافتتاح — بصوت بطيء واطي واثق</span>
  <span class="q">«أنا مش هكمّل بالفريق ده. عايز تشكيلة جديدة على عقدي السنة الجاية. وعايز أسامي. دلوقتي. قدامي.»</span></div>
  <div class="blk warn"><span class="bt">🔴 قاعدة النبرة — أهم حاجة في الفصل</span> العميل الأخطر مش اللي بيزعق. الصوت الواطي البطيء بيولّد ضغط أضعاف الصوت العالي — لأنهم متعرفوش يقروا نواياك. مش صراخ ولا عصبية ولا سخرية.</div>`},

{id:80, body:`
  <div class="wrap"><div class="big-line faint">... وسكوت ...</div></div>`,
 notes:`
  <div class="blk warn"><span class="bt">🔴 متملاش الفراغ</span> الفراغ هو اللي بيطلّع الأدوات. سيبه يمتد لحد ما حد يكسره — حتى لو ١٥ ثانية. لو مليته إنت، خسرت أهم بيانات في المشهد.</div>
  <div class="blk watch"><span class="bt">⚪ أول ٣٠ ثانية = ذهب</span> مين كسر السكوت الأول؟ الدقيقة كام؟ وبإيه — سؤال؟ اعتراض؟ اعتذار؟ تلطيف؟ اسم؟</div>
  <div class="blk warn"><span class="bt">🎚️ سلّم الضغط — مش بتضغط بالتساوي</span>
   <ul><li>🟢 ١ هادي: تكرار الطلب أهدى · صمت مقصود · بصة مباشرة — ابدأ من هنا مع الكل</li>
   <li>🟡 ٢ مركّز: تسمّي حد بالاسم الوهمي وتضغط برفق — مع المتماسك بس</li>
   <li>🔴 ٣ أقوى: «الكلام ده مش رد. أنا عايز أسامي.» — نادر جدًا (مرة/مرتين)، ثواني، مع مجموعة متماسكة</li>
   <li>بعد كل مستوى ٣ — ارجع لـ١ فورًا</li></ul></div>
  <div class="blk safe"><span class="bt">🟩 إشارات الهبوط الفوري — أول ما تشوف واحدة: انزل مستوى وروح لحد تاني</span>
   صوت بيرتجف · عين بتلمع/بتدمع · احمرار أو شحوب مفاجئ · سكوت مطبق بعد كلام + بصة لتحت · إيد بترتجف · نَفَس بيتقطع · «أنا مش قادر»/«بجد؟» مكسورة · <b>ضحكة متوترة في غير محلها</b> (إشارة قوية والناس بتفوّتها).
   <span class="why-note">ساعتها: خفّف نبرتك، وجّه لحد مستحمل، وامنح اللي وصل لحافته لحظة يلتقط نفسه من غير ما تسلّط عليه ضوء. لو نيّم ورقته — سيبه يخرج، ولا بصة.</span></div>
  <div class="blk warn"><span class="bt">🔴 القاعدة فوق كله</span> الهدف إن الأداة تفشل وتبان — مش إن حد ينكسر. لو الحرارة في الأوضة كلها عالية زيادة: اكسر الدور ثانية بابتسامة إنسانية («خدوا نَفَس معايا») وارجع. إنت صمام الأمان.</div>
  <div class="blk say"><span class="bt">🎭 ردودك على كل نمط</span>
   <table>
   <tr><td>يشيل المسؤولية لوحده</td><td>«إنت لوحدك؟... وباقي اللي معاك مالهمش دعوة؟»</td></tr>
   <tr><td>يبرر بالظروف</td><td>«كل ده صح. بس أنا مسألتش عن الظروف... طلبت أسامي.»</td></tr>
   <tr><td>يرمي على قسم/شخص</td><td>«القسم اللي بتتكلم عنه... مش قاعد معاك على نفس الترابيزة؟»</td></tr>
   <tr><td>يلطّف ويسترضي</td><td>«أنا كمان بقدّرك. وعشان كده جاي أقولك الحقيقة مش أطبطب. الأسامي.»</td></tr>
   <tr><td>يشتري وقت</td><td>«أنا اديتكم أسبوعين. خدتوا منهم كام يوم؟»</td></tr>
   <tr><td>يتجمّد/يسكت</td><td>بصة هادية ثانيتين... وبعدين سيبه ووجّه لحد تاني. الجمود نفسه بيان</td></tr>
   <tr><td>ينسحب لجوه وهو قاعد</td><td>ماتضغطش خالص. سجّله بس</td></tr>
   <tr><td>يسأل سؤال ذكي</td><td>«سؤال كويس. عشان آخر برنامجين كانوا مكرَّرين، والمدرسين بيقولوا المدرب تعبان. عايز حد جديد يشوف بعين تانية.» (كافئ السؤال)</td></tr>
   </table></div>
  <div class="blk warn"><span class="bt">🎣 الطُعم المزروع — لو السكوت طال (مرة واحدة، للكل، بلا اسم)</span>
  <span class="q">«وحاجة كمان... واحد من مجلس أمنائنا بعت رسالة شخصية لحد عندكم من أسبوع. ولحد النهارده محدش رد عليه. أنا مش هقول مين... بس أنا عارف.»</span>
  <span class="why-note">ولا اسم، ولا بصة ناحية الشخص، ولا إشارة بإيدك. «مين؟» → «ده مش موضوعنا دلوقتي.» ⚠️ لو المستهدف أعلن الرسالة في الفصل التالت — متقولهاش، بدلها: «وأنا شايف إن فيه ولي أمر اتكلم معاكم — وده اللي بيقلقني.»</span></div>`},

{id:85, timer:900, body:`
  <div class="wrap">
    <div class="client-tag">أ. خالد المهدي — على الطاولة</div>
    <div class="lead">عايز ٤ أسامي. اللي هيشتغلوا على عقدي السنة الجاية.</div>
    <div class="lead glow">وشرط واحد: واحد منهم على الأقل لازم يكون جديد — مش من اللي شغالين دلوقتي.</div>
    <div class="demandline">«مش عايز كلام حلو. عايز حاجة أقدر أوديها لمجلس إدارتي.»</div>
    <div id="t85" class="timer">15:00</div>
  </div>`,
 notes:`
  <div class="blk do"><span class="bt">🟢 امتى؟</span> بعد ~١٢ دقيقة من المواجهة، أو لما الشحنة توصل لأقصاها وتلف في نفسها. اقعد لورا شوية (حركة تقول: خرجنا من العتاب). ده بينقل الضغط من عاطفي لعقلي — وبيدي الناس فرصة تلمّ نفسها (ميزة أمان).</div>
  <div class="blk say"><span class="bt">🟡 قول — أهدى وأعمل</span>
  <span class="q">«طيب. خلاص. أنا مش جاي أعاتب، جاي آخد حاجة. عايز أربع أسامي — اللي هيشتغلوا على عقدي السنة الجاية. وشرط واحد: واحد منهم على الأقل لازم يكون جديد، مش من اللي شغالين دلوقتي. مش عايز كلام حلو ولا وعود. عايز حاجة أقدر أوديها لمجلس إدارتي. قدامكم ربع ساعة.»</span></div>
  <div class="blk do"><span class="bt">🟢 اعمل</span> دوس المؤقت واقعد في مكانك — متنسحبش. حضورك الصامت جزء من الضغط. أي سؤال: «أنا مستني الأسامي.»</div>
  <div class="blk warn"><span class="bt">🔴 ليه «واحد جديد»؟</span> يعني واحد من الحاليين لازم يخرج — بيجبرهم يسمّوا إنسان بيخسر شغله. مفيش حل مريح.</div>
  <div class="blk say"><span class="bt">🧵 خيط كريم — عند السؤال التالت، حسب قرار الفصل التالت</span>
   <table>
   <tr><td>٥١ حاربوا عليه</td><td>«سمعت إن أ. كريم كان هيمشي وقعدتوه. حلو... هو مقتنع ولا متمسّك بالفلوس؟»</td></tr>
   <tr><td>٥٢ سابوه</td><td>«وصلني إن أ. كريم مشي. ده كان أحسن واحد عندكم. مين بديله؟»</td></tr>
   <tr><td>٥٣ حل تالت</td><td>«أ. كريم لسه بيفكر، صح؟ يعني إنتو نفسكم مش عارفين مين هيشتغل معايا.»</td></tr>
   </table></div>
  <div class="blk watch"><span class="bt">⚪ أغنى رصد في اليوم</span>
   <ul><li>حد اقترح <b>معيار</b> قبل الأسامي؟ («على أي أساس هنختار؟») ← أنضج حركة، سجّل الاسم والدقيقة</li>
   <li>الأدوات وهي بتفشل: بيدوّر على معيار مش موجود (الفهم يفشل) · ساكت/«أي حد كويس» (المراعاة تفشل) · قال ٤ أسامي في دقيقتين وبرّر (الحسم يتسرّع)</li>
   <li>مين نطق أول اسم للخروج؟ إزاي قاله؟ الفريق رد إزاي؟</li>
   <li>حد افتكر مس هبة؟ حد قال «المشكلة مش في المدربين، في الحمل»؟ حد قال «هنقوله إزاي؟» (وعي بالتنفيذ)؟ حد سأل «هو ده من حقنا؟»</li></ul></div>
  <div class="blk do"><span class="bt">🟢 النهاية — بحكمك</span> افتح <b>86</b> (التماسك: مسكوا الموضوع سوا، طاقة «إحنا») أو <b>87</b> (التشتت: كل واحد لوحده، طاقة «أنا/هو»). اقرا وإنت لسه في الدور. بعدها: <b>88 + Enter</b>.</div>`},

/* endings — hidden */
{id:86, hidden:true, label:'نهاية الاجتماع', body:`
  <div class="end">
    <div class="eh"><div class="ee">نهاية الاجتماع</div><div class="et">لما الفريق وقف مع بعض</div></div>
    <div class="eb">
      <p>خالد المهدي سمع الأسامي... وسكت شوية. وبعدين قال:</p>
      <div class="eq">«أنا مش شايف قدامي ناس بتدافع عن نفسها. شايف فريق مسك قرار صعب سوا — وعارف إنه بيوجع.»</div>
      <p>وقف، شدّ إيدكم واحد واحد، وقال قبل ما يمشي:</p>
      <div class="eq">«ابعتولي الأسامي مكتوبة. وأنا هوصّلها لمجلسي. بس اسمعوا نصيحة: الشخص اللي هيخرج من العقد ده... اللي هتقولوله بيها أهم من القرار نفسه.»</div>
    </div>
    <div class="foot">مخرجش مقتنع بالعقد... خرج مقتنع بالناس. والباقي تفاصيل.</div>
  </div>`,
 notes:`<div class="blk warn"><span class="bt">🔴</span> اقرا وإنت في الدور. محدش «كسب». وممنوع تلمّح إن فيه نهاية تانية — لا دلوقتي ولا بعد اليوم. بعدها: <b>88 + Enter</b>.</div>`},

{id:87, hidden:true, label:'نهاية الاجتماع', body:`
  <div class="end">
    <div class="eh"><div class="ee">نهاية الاجتماع</div><div class="et">لما كل واحد وقف لوحده</div></div>
    <div class="eb">
      <p>خالد المهدي سمع... واحد بيشيل لوحده، وواحد بيبرر، وواحد ساكت خالص. هزّ راسه ببطء، وقال:</p>
      <div class="eq">«أنا طلبت أربع أسامي... وأخدت أربع مواقف مختلفة.»</div>
      <p>جمع أوراقه، ووقف، وقال قبل ما يمشي:</p>
      <div class="eq">«أنا مش بقرر النهارده. هرجع لمجلسي وأقوله اللي شفته. بس النهارده وضّح لي حاجة كنت محتاج أشوفها.»</div>
    </div>
    <div class="foot">القرار اتأجل... بس الرسالة وصلت.</div>
  </div>`,
 notes:`<div class="blk warn"><span class="bt">🔴</span> «القرار اتأجل» مش «العقد راح» — عشان محدش يمشي شايل إنه هو اللي ضيّع الشركة. بعدها: <b>88 + Enter</b>.</div>`},

/* chest 3 */
{id:88, body:`
  <div class="wrap">
    <div class="eyebrow calm">مؤشر الصدر · النقطة الثالثة والأخيرة</div>
    <div class="lead">٢٠ ثانية سكوت. ارجع للحظة اللي الأسامي اتقالت فيها.<br><span class="dim">مش تفتكر... تحسّ.</span></div>
    <div class="chest">
      <div class="opt"><div class="dot d1"></div><span class="lbl l1">ضيق</span></div>
      <div class="opt"><div class="dot d2"></div><span class="lbl l2">وسط</span></div>
      <div class="opt"><div class="dot d3"></div><span class="lbl l3">منشرح</span></div>
    </div>
    <div class="lead dim">وكلمة واحدة: فين حسّيته؟</div>
  </div>`,
 notes:`
  <div class="blk say"><span class="bt">🟡 قول — بصوتك إنت، واطي وهادي</span>
  <span class="q">«النقطة التالتة والأخيرة. ٢٠ ثانية. ارجعوا للحظة اللي الأسامي اتقالت فيها. مش تفكروا... تحسّوا. صدرك كان ضيق؟ وسط؟ منشرح؟ وكلمة واحدة: فين حسّيته.»</span> (اسكت ٢٠ ثانية، واكتب إنت كمان)</div>
  <div class="blk warn"><span class="bt">🔴</span> ولا سؤال ولا تعليق ولا شرح. لو حد اتأثر — مساحة وسكوت واحترام، من غير ما تكبّر الموقف.</div>`},

/* badges ritual + repair */
{id:89, body:`
  <div class="wrap">
    <div class="eyebrow">خرجنا من وميض</div>
    <div class="big-line">نيّموا الورق... في نص الترابيزة.</div>
    <hr class="rule">
    <div class="lead dim">خلاص. وميض مش موجودة. محدش هنا مدير ولا منسق ولا مالي.<br>فيه بس... إنتو.</div>
  </div>`,
 notes:`
  <div class="blk do"><span class="bt">🟢 اعمل</span> قوم بصوتك إنت — رجعت الميسّر. استنى الكل ينيّم ورقته فعلًا (الحركة الجسدية مهمة، متكملش قبل ما آخر ورقة تنام).</div>
  <div class="blk say"><span class="bt">🟡 قول</span> <span class="q">«خلاص. طلعنا من وميض. كل واحد يمسك ورقته وينيّمها في نص الترابيزة. محدش هنا دلوقتي مدير ولا منسق. مفيش خالد المهدي، ومفيش وميض، ومفيش كريم ولا هبة. فيه بس... إنتو. ناس عدّت مع بعض يوم صعب.»</span></div>
  <div class="blk safe"><span class="bt">🟩 جملة الترميم — إلزامية، متتشالش أبدًا</span>
  <span class="q">«وحاجة أخيرة قبل ما نكمّل، وعايزكم تسمعوها كويس: السؤال اللي اتقال دلوقتي — "مين يمشي" — ده كان بتاع خالد المهدي. مش بتاعي، ولا بتاعكم. ومحدش هنا كان مسؤول عن حاجة. اللي حصل النهارده حصل لوميض... مش ليكم.»</span>
  <span class="why-note">من غيرها فيه احتمال حقيقي إن حد يمشي شايل الجملة في ضهره أسبوع.</span></div>
  <div class="blk do"><span class="bt">🟢</span> خد نَفَس عميق مشترك أو ٥ ثواني صمت. الأوضة محتاجة تهبط قبل الدايرة.</div>`},

{id:90, body:`
  <div class="wrap">
    <div class="eyebrow calm">دايرة — شهادة بلا تحليل</div>
    <div class="big-line" style="font-size:clamp(26px,4vw,46px)">لما قال «عايز أسامي»...<br>جواك حصل إيه؟</div>
    <div class="lead faint">مش هنحلل · مش هنصنّف · مش هنقيّم<br>اللي عايز يشارك يشارك. واللي عايز يسكت... سكوته مسموع.</div>
  </div>`,
 notes:`
  <div class="blk do"><span class="bt">🟢 اعمل</span> اقعد، واتكلم بأهدى صوت في اليوم كله.</div>
  <div class="blk say"><span class="bt">🟡 قول</span> <span class="q">«سؤال واحد. واللي عايز يجاوب يجاوب، واللي عايز يسكت سكوته مسموع ومحترم. لما قال "عايز أسامي"... جواك حصل إيه؟ مش هنحلل ومش هنصنّف. بس شهادة. اللي حسّه.»</span></div>
  <div class="blk warn"><span class="bt">🔴 إدارة الدايرة</span>
   <ul><li>حد شارك → «شكرًا» هادية وبس، متعلّقش ولا تصحح، وانتقل</li>
   <li>حد بدأ يحلل → «دلوقتي بنشهد بس... التحليل ليه وقته»</li>
   <li>حد اتأثر → مساحة وسكوت واحترام، من غير ما تجري عليه</li>
   <li>الأغلب سكتوا → «السكوت رد. شكرًا ليكم» ومتجبرش حد</li></ul></div>
  <div class="blk say"><span class="bt">🟡 إغلاق الفصل</span> <span class="q">«شكرًا لصدقكم. خدوا خمس دقايق تشربوا حاجة... وبعدها بنبص على الصورة اللي رسمناها طول اليوم كله.»</span></div>
  <div class="blk watch"><span class="bt">⚪ حصاد الرصد — فرّغه في البريك</span> مين كسر السكوت الأول؟ مين اقترح معيار؟ مين نطق أول اسم للخروج؟ مين اتغيرت حركته تحت الضغط عن الفصول اللي فاتت؟ مين وسّع الدايرة (إحنا) ومين ضيّقها (أنا/هو)؟ مين قرب من حافته؟ المستهدف بالسري بان هنا؟</div>`},

/* ===== TAFKEEK 4 ===== */
{id:91, body:`
  <div class="wrap">
    <div class="eyebrow calm">تفكيك ٤</div>
    <div class="big-line">اللي حصل من شوية...</div>
    <div class="lead dim">مكانش عن مهارة. وماكانش اختبار إنكم تنجحوا فيه.</div>
    <hr class="rule">
    <div class="lead">كان عن نوع من القرارات معظمنا اتعلّم يديرها... من غير ما حد يعلّمه.</div>
  </div>`,
 notes:`
  <div class="blk warn"><span class="bt">🔴 الحساسية</span> الناس خارجة من انكشاف عاطفي حقيقي. أول دقيقتين ترميم مش تعليم. لو دخلت بنبرة «نستفيد من الموقف» — بتحسّ عليهم إنك بتستغل وجعهم.</div>
  <div class="blk say"><span class="bt">🟡 قول — بصوت هادي جدًا</span>
  <span class="q">«قبل أي حاجة — شكرًا. اللي حصل مكانش سهل، وإنتو دخلتوه بصدق. وعايز أقول حاجة قبل ما نكمّل: اللي حصل ماكانش اختبار إنكم تنجحوا فيه، ومكانش عن مهارة إنتو ناقصينها. كان عن نوع معيّن من القرارات... معظمنا بيقابله في شغله، ومحدش علّمه إزاي يديره. وده اللي هنعمله دلوقتي.»</span></div>
  <div class="blk warn"><span class="bt">🔴</span> متسألش «حاسين بإيه؟» تاني — اتعمل في الدايرة. لو كررته بتفتح الجرح بلا داعي.</div>`},

{id:92, body:`
  <div class="wrap">
    <div class="eyebrow danger">القرار اللي مبيتحلّش بالتحليل</div>
    <div class="traits">
      <div class="tr">بيكلّف إنسان — مش رقم</div>
      <div class="tr">مفيش معيار موضوعي بيحسمه</div>
      <div class="tr">بيتاخد قدام الناس</div>
      <div class="tr">بيقفل باب — أي اختيار بيلغي التاني</div>
    </div>
    <div class="lead glow" style="font-size:clamp(16px,2vw,24px)">أي اختيار فيه... هيوجع حد. مفيش نسخة مريحة منه.</div>
    <hr class="rule">
    <div class="lead dim" style="font-size:clamp(14px,1.6vw,18px)">تلات طرق شائعة... وتلاتتهم بيضروا</div>
    <div class="ways">
      <div class="way"><div class="wt">١. التأجيل</div><div class="wd">«نشوف الأسبوع الجاي». التأجيل هنا مش حياد — ده قرار متخفّي، وبيدفع تمنه اللي مستني.</div></div>
      <div class="way"><div class="wt">٢. التفويض</div><div class="wd">«خلي فلان يتصرف». بترمي وجع القرار على حد أصغر منك — ومعاه صلاحية أقل.</div></div>
      <div class="way"><div class="wt">٣. الحسم السريع</div><div class="wd">عشان تخرج من الألم بسرعة. فالقرار بيطلع من الانزعاج... مش من الميزان.</div></div>
    </div>
  </div>`,
 notes:`
  <div class="blk do"><span class="bt">🟢 اعمل</span> سيبهم يقروا الصفات ٥ ثواني.</div>
  <div class="blk say"><span class="bt">🟡 قول</span>
  <span class="q">«فيه نوع من القرارات أدوات التحليل بتفشل قدامه — مش لأنه صعب حسابيًا، لأنه مالوش حل بيرضي كل الأطراف أصلًا. بيكلّف إنسان، ومفيش معيار موضوعي بيحسمه، وبيتاخد قدام الناس، وبيقفل باب. وأي اختيار هيوجع حد. ومعظم القيادات بتتعلّم تدير الأرقام، ومحدش بيعلّمها تدير القرارات دي — فبتتعامل معاها بواحدة من تلاتة، والتلاتة بتضر: التأجيل (قرار متخفّي)، التفويض (بترمي الوجع على أصغر منك)، والحسم السريع (بيطلع من الانزعاج مش الميزان).»</span></div>
  <div class="blk say"><span class="bt">🟡 اربط — بلا أسامي</span> <span class="q">«واللي حصل: الفريق [أجّل شوية/اتفق بسرعة/لف حوالين المعيار]... وده طبيعي جدًا.»</span> (جملة واحدة، الناس لسه طرية)</div>`},

{id:93, body:`
  <div class="wrap">
    <div class="eyebrow">القاعدة</div>
    <div class="big-line" style="font-size:clamp(24px,3.6vw,44px)">في القرار اللي بيوجع...<br>النزاهة مش في اللي هتختاره.<br><span class="glow">النزاهة إنك تعلن المعيار قبل ما تختار.</span></div>
    <hr class="rule">
    <div class="lead dim" style="font-size:clamp(14px,1.7vw,19px)">المعيار بعد الاختيار → تبرير (حتى لو صادق ١٠٠٪)<br>المعيار قبله → عدل (حتى لو النتيجة موجعة)</div>
  </div>`,
 notes:`
  <div class="blk say"><span class="bt">🟡 قول — ببطء</span>
  <span class="q">«في القرار اللي بيوجع، النزاهة مش في اللي هتختاره... النزاهة إنك تعلن المعيار قبل ما تختار. المعيار اللي بيتقال بعد الاختيار بيبقى تبرير — حتى لو صادق مية في المية، الناس بتقول "أهو لقى حجة". والمعيار اللي بيتقال قبله بيبقى عدل — حتى لو موجع، الشخص المتضرر بيقدر يقول "أنا مش موافق، بس فاهم على أي أساس". والفرق ده هو الفرق بين قرار الفريق بيقبله وقرار بيفضل يتهامس عنه شهور.»</span></div>
  <div class="blk say"><span class="bt">🟡 اربط بالمشهد</span>
   <ul><li>لو حد سأل «على أي أساس؟» → «[الاسم] سألها الدقيقة كذا. وكانت أنضج حركة في المشهد.» (دي المرة الوحيدة تسمّي فيها اسم بالإيجاب)</li>
   <li>لو محدش → «ومحدش سألها. وده مش عيب — ده اللي بيحصل في ٩ من ١٠ اجتماعات.»</li></ul></div>`},

{id:94, body:`
  <div class="wrap">
    <div class="eyebrow">🛠️ الأداة الرابعة</div>
    <div class="big-line" style="font-size:clamp(22px,3vw,36px)">بروتوكول القرار الموجع</div>
    <div class="proto">
      <div class="p"><span class="pn">١</span><span class="pt"><b>اعلن المعيار قبل الأسماء</b><span>«هنختار على أساس إيه؟» — ويتكتب.</span></span></div>
      <div class="p"><span class="pn">٢</span><span class="pt"><b>اسأل: التمن ده هيدفعه مين؟ وهل هو عارف؟</b></span></div>
      <div class="p"><span class="pn">٣</span><span class="pt"><b>افصل القرار عن التنفيذ</b><span>القرار ممكن يبقى صح والطريقة قاسية. وأغلب الجرح بييجي من التاني.</span></span></div>
      <div class="p"><span class="pn">٤</span><span class="pt"><b>سمّي اللي فقدته</b><span>الفريق اللي بيسمّي خسارته بيعديها. واللي بيتجاهلها... بتفضل تشتغل تحت الأرض شهور.</span></span></div>
    </div>
  </div>`,
 notes:`
  <div class="blk say"><span class="bt">🟡 قول</span>
  <span class="q">«أربع خطوات: واحد، اعلن المعيار قبل الأسماء — ويتكتب مش شفهي. اتنين، اسأل التمن هيدفعه مين وهل هو عارف — فرق كبير بين اللي فوجئ بالقرار واللي كان يعرف إنه بيتناقش. تلاتة، وأهمها عمليًا: افصل القرار عن التنفيذ. القرار ممكن يكون صح تمامًا والطريقة تجرح — وأغلب الجرح في الشركات من التاني. شفتوا جملة خالد "اللي هتقولوله بيها أهم من القرار نفسه"؟ دي دي. وأربعة: سمّي اللي فقدته — راجل شاطر مشي، ثقة اتهزت. الفريق اللي بيسمّي خسارته بيعديها، واللي بيقول "عادي الشغل ماشي" الخسارة بتفضل شغالة تحت الأرض شهور.»</span></div>`},

{id:95, body:`
  <div class="wrap">
    <div class="eyebrow calm">الحاجة اللي عملتوها ٣ مرات النهارده</div>
    <div class="big-line" style="font-size:clamp(22px,3vw,38px)">قبل ما عقلك يوصل لنتيجة... جسمك بيكون عرف.</div>
    <div class="body-note">
      <div class="bn">الضيق ساعة القرار مش ضعف ومش تردد. ده إشارة إن فيه حاجة جواك مش موافقة على اللي إيدك بتكتبه:</div>
      <div class="bn">◆ قيمة اتخرقت &nbsp;·&nbsp; ◆ ولا خوف بيسوقك من غير ما تسمّيه &nbsp;·&nbsp; ◆ ولا معلومة إنت شايفها ومش مسمّيها</div>
    </div>
    <hr class="rule">
    <div class="lead glow" style="font-size:clamp(15px,1.9vw,22px)">لو قدرت — متحسمش على ضيق. ولو اضطريت — اكتب سبب الضيق جنب القرار.</div>
  </div>`,
 notes:`
  <div class="blk warn"><span class="bt">🔴 فقرة حساسة — النبرة بتصنع المصداقية</span> بلا حماس، بلا لغة روحانية (ولا كلمة عن «الفطرة» أو «القلب يعرف»)، بلا وعود («هتغير حياتك»). مثال واقعي واحد كفاية.</div>
  <div class="blk say"><span class="bt">🟡 قول — بهدوء</span>
  <span class="q">«الحاجة اللي عملتوها ٣ مرات: قبل ما عقلك يوصل لنتيجة، جسمك بيكون عرف. ودي مش روحانية — كلنا عشناها: بتوقّع وإيدك مترددة، أو بتقول "تمام" وحاسس بتقل في صدرك. الضيق ساعة القرار مش ضعف — ده إشارة إن فيه حاجة جواك مش موافقة. ممكن قيمة اتخرقت، وممكن خوف بيسوقك، وممكن معلومة إنت شايفها ومش عايز تشوفها.<br>
  وخدوا بالكم من حاجتين: دي مش أداة تشخيص — الضيق مش بيقول إن قرارك غلط، أحيانًا القرار الصح موجع (واللي حصل من شوية مثال). ومعناها مش "متقررش وإنت ضايق" — معناها متعديش عليها. اسأل: ضاق ليه؟ والقاعدة: لو قدرت متحسمش على ضيق، ولو اضطريت اكتب سبب الضيق جنب القرار — بعد شهر هيبقى أهم سطر عندك.»</span></div>
  <div class="blk warn"><span class="bt">🔴 «أنا مبحسش بحاجة»</span> «وارد جدًا وناس كتير كده. الإحساس ده بيتربّى ومش بيبان من أول مرة. النقط التلاتة اللي عندك كفاية دلوقتي.» متجادلش.</div>`},

{id:96, body:`
  <div class="wrap">
    <div class="lead">اكتبوا على ورقتكم:</div>
    <div class="big-line glow" style="font-size:clamp(19px,2.6vw,30px)">٤. الأداة الرابعة: بروتوكول القرار الموجع</div>
    <div class="lead dim">وسؤال:</div>
    <div class="lead" style="max-width:840px">فيه قرار موجع إنت مأجّله دلوقتي في شغلك؟<br>
    إنت مأجّله ليه بالظبط — عشان ناقصك معلومة... ولا عشان مش عايز توجع حد؟</div>
  </div>`,
 notes:`
  <div class="blk say"><span class="bt">🟡 قول</span>
  <span class="q">«اكتبوا الأداة الرابعة، وتحتها سؤال: فيه قرار موجع إنت مأجّله في شغلك؟ ولو فيه، مأجّله ليه — عشان ناقصك معلومة فعلًا، ولا عشان مش عايز توجع حد؟ والفرق بين الاتنين هو الفرق بين تأنّي وهروب. خدوا ٤٠ ثانية.»</span></div>
  <div class="blk say"><span class="bt">🟡 القفلة</span> <span class="q">«كده عندكم أربع أدوات، وتلات مبادئ، وتلات نقط على ورقتكم. وفاضل حاجة واحدة: إن إحنا نبص على الصورة اللي رسمناها من الصبح.»</span></div>`}

];

/* ================= ENGINE ================= */
const stage=document.getElementById('stage'),prog=document.getElementById('progress'),snum=document.getElementById('snum');
const faciBody=document.getElementById('faci-body'),faci=document.getElementById('faci'),jumpBox=document.getElementById('jump'),help=document.getElementById('help');
const visible=SLIDES.filter(s=>!s.hidden);let idx=0,returnIdx=0,onHidden=false;
SLIDES.forEach(s=>{const el=document.createElement('section');el.className='slide';el.dataset.id=s.id;el.innerHTML=`<div>${s.body}</div>`;stage.appendChild(el);s.el=el;});
function findById(id){return SLIDES.find(s=>String(s.id)===String(id));}
function toAr(n){return String(n).replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);}
function showSlide(s){SLIDES.forEach(x=>x.el.classList.remove('on'));s.el.classList.add('on');const vi=visible.indexOf(s);if(vi>=0){idx=vi;onHidden=false;}else{onHidden=true;}prog.style.width=((idx+1)/visible.length*100)+'%';snum.textContent=onHidden?(s.label||('كارت '+s.id)):(toAr(vi+1)+' / '+toAr(visible.length));renderNotes(s);stopAllTimers();}
function goVisible(i){i=Math.max(0,Math.min(visible.length-1,i));idx=i;showSlide(visible[i]);}
function next(){if(onHidden){showSlide(visible[idx]);return;}goVisible(idx+1);}
function prev(){if(onHidden){showSlide(visible[idx]);return;}goVisible(idx-1);}
function jumpTo(id){const s=findById(id);if(!s)return;if(s.hidden){returnIdx=idx;showSlide(s);}else{goVisible(visible.indexOf(s));}}
function escBack(){if(onHidden){showSlide(visible[returnIdx]);}}
window.next=next;
function renderNotes(s){faciBody.innerHTML=s.notes||'<div class="blk watch"><span class="bt">⚪</span> (مفيش ملاحظات)</div>';}
function toggleFaci(){faci.classList.toggle('open');}window.toggleFaci=toggleFaci;
let timers={};
function stopAllTimers(){for(const k in timers){clearInterval(timers[k].iv);}}
function attachTimer(el,total){let remain=total,running=false,iv=null;const fmt=x=>{const m=Math.floor(x/60),sec=x%60;return toAr(String(m).padStart(2,'0'))+':'+toAr(String(sec).padStart(2,'0'));};function paint(){el.textContent=fmt(remain);el.classList.toggle('warn',running&&remain<=300&&remain>0);el.classList.toggle('run',running&&remain>300);if(remain<=0){el.classList.remove('run','warn');el.classList.add('done');}}function tick(){remain--;if(remain<=0){remain=0;paint();clearInterval(iv);running=false;chime();return;}paint();}el.onclick=e=>{e.stopPropagation();if(running){clearInterval(iv);running=false;el.classList.remove('run','warn');}else{running=true;iv=setInterval(tick,1000);}paint();};el.ondblclick=e=>{e.stopPropagation();clearInterval(iv);running=false;remain=total;el.classList.remove('run','warn','done');paint();};paint();timers[el.id]={iv:null,el};}
function chime(){try{const c=new(window.AudioContext||window.webkitAudioContext)();[0,.18,.36].forEach((t,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=[660,880,990][i];o.type='sine';o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.0001,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.25,c.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t+.5);o.start(c.currentTime+t);o.stop(c.currentTime+t+.5);});}catch(e){}}
[['t85',900]].forEach(([id,t])=>{const el=document.getElementById(id);if(el)attachTimer(el,t);});
let buf='';
document.addEventListener('keydown',e=>{if(/[0-9]/.test(e.key)){buf+=e.key;jumpBox.style.display='block';jumpBox.textContent=toAr(buf);return;}if(e.key==='Enter'){if(buf){jumpTo(buf);buf='';jumpBox.style.display='none';}return;}if(e.key==='Escape'){buf='';jumpBox.style.display='none';if(faci.classList.contains('open')){toggleFaci();}else{escBack();}return;}if(e.key===' '){e.preventDefault();next();return;}if(e.key==='ArrowLeft'||e.key==='ArrowDown'){next();return;}if(e.key==='ArrowRight'||e.key==='ArrowUp'){prev();return;}if(e.key==='n'||e.key==='N'){toggleFaci();return;}if(e.key==='h'||e.key==='H'||e.key==='?'){help.classList.toggle('show');return;}});
let tx=0,ty=0,tt=0;
stage.addEventListener('touchstart',e=>{if(e.touches.length===2){toggleFaci();return;}tx=e.touches[0].clientX;ty=e.touches[0].clientY;tt=Date.now();},{passive:true});
stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty,dt=Date.now()-tt;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)){dx<0?next():prev();return;}if(dt<300&&Math.abs(dx)<20&&Math.abs(dy)<20){const w=window.innerWidth,x=e.changedTouches[0].clientX;if(x<w/3)next();else if(x>2*w/3)prev();}},{passive:true});
showSlide(visible[0]);help.classList.add('show');setTimeout(()=>help.classList.remove('show'),6500);
</script>
</body>
</html>
