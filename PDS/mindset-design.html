<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>هندسة العقلية — منظور الفؤاد</title>

<!-- خطوط Google -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

<style>
  /* ========== متغيّرات الهوية البصرية ========== */
  :root{
    --navy:        #1a2e4a;
    --navy-deep:   #142338;
    --gold:        #d4af37;
    --sky:         #4a90e2;
    --alert:       #e76f51;
    --cream:       #f8f5f0;
    --muted:       #b8b8b8;

    --font-ui:     "IBM Plex Sans Arabic", system-ui, sans-serif;
    --font-quote:  "Amiri", serif;

    --rail-width:  88px;
    --content-max: 720px;

    --ease:        cubic-bezier(.4,.0,.2,1);
  }

  /* ========== Reset مختصر ========== */
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family: var(--font-ui);
    font-weight: 400;
    color: var(--cream);
    background: var(--navy);
    background-image:
      radial-gradient(1200px 600px at 85% -10%, rgba(212,175,55,.05), transparent 60%),
      radial-gradient(900px 500px at 10% 110%, rgba(74,144,226,.05), transparent 60%);
    background-attachment: fixed;
    min-height: 100vh;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  button{ font: inherit; color: inherit; }
  a{ color: inherit; }

  /* ========== الهيدر الثابت ========== */
  .site-header{
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(20,35,56,.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(212,175,55,.12);
  }
  .site-header__inner{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 14px 28px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .brand{
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .brand__name{
    font-family: var(--font-quote);
    font-weight: 700;
    font-size: 20px;
    letter-spacing: .2px;
    color: var(--cream);
  }
  .brand__dot{
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 12px rgba(212,175,55,.6);
    display: inline-block;
  }
  .brand__tag{
    color: var(--muted);
    font-size: 12px;
    font-weight: 300;
    letter-spacing: .5px;
  }
  .participant{
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 400;
  }
  .participant__label{ opacity: .7; }
  .participant__name{ color: var(--cream); font-weight: 500; }

  /* ========== شريط التقدم الرأسي ========== */
  .rail{
    position: fixed;
    top: 50%;
    right: 24px;                    /* في RTL: rail على اليمين */
    transform: translateY(-50%);
    width: var(--rail-width);
    z-index: 30;
    user-select: none;
  }
  .rail__list{
    list-style: none;
    margin: 0; padding: 0;
    display: flex;
    flex-direction: column;
    gap: 22px;
    position: relative;
  }
  /* الخط الواصل بين النقاط */
  .rail__list::before{
    content: "";
    position: absolute;
    right: 11px;                    /* محاذاة لمنتصف النقطة (نقطة 22px → 11px) */
    top: 12px;
    bottom: 12px;
    width: 1px;
    background: rgba(184,184,184,.18);
  }
  .rail__list::after{
    /* الجزء المكتمل من الخط */
    content: "";
    position: absolute;
    right: 11px;
    top: 12px;
    width: 1px;
    height: var(--rail-progress, 0%);
    background: linear-gradient(to bottom, var(--gold), rgba(212,175,55,.5));
    transition: height .4s var(--ease);
  }
  .rail__item{
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: default;
  }
  .rail__dot{
    width: 22px; height: 22px; border-radius: 50%;
    border: 1.5px solid var(--muted);
    background: transparent;
    flex-shrink: 0;
    transition: all .3s var(--ease);
    position: relative;
    z-index: 2;
  }
  .rail__label{
    font-size: 11px;
    color: var(--muted);
    font-weight: 400;
    white-space: nowrap;
    opacity: 0;
    transform: translateX(6px);
    transition: opacity .25s var(--ease), transform .25s var(--ease);
    pointer-events: none;
  }
  .rail__item:hover .rail__label,
  .rail__item.is-current .rail__label{
    opacity: 1;
    transform: translateX(0);
  }
  /* الحالات */
  .rail__item.is-done .rail__dot{
    background: var(--gold);
    border-color: var(--gold);
    box-shadow: 0 0 0 2px rgba(212,175,55,.12);
  }
  .rail__item.is-current .rail__dot{
    background: var(--gold);
    border-color: var(--gold);
    box-shadow: 0 0 0 6px rgba(212,175,55,.18);
    animation: pulse 2.2s ease-in-out infinite;
  }
  .rail__item.is-current .rail__label{
    color: var(--gold);
    font-weight: 500;
  }
  @keyframes pulse{
    0%, 100% { box-shadow: 0 0 0 0 rgba(212,175,55,.45), 0 0 0 6px rgba(212,175,55,.18); }
    50%      { box-shadow: 0 0 0 10px rgba(212,175,55,0),  0 0 0 6px rgba(212,175,55,.18); }
  }

  /* ========== المحتوى الرئيسي ========== */
  main{
    max-width: var(--content-max);
    margin: 0 auto;
    padding: 56px 28px 120px;
  }

  /* ========== مكوّن المحطة ========== */
  .station{
    display: none;
    opacity: 0;
    transition: opacity .25s var(--ease);
  }
  .station.is-active{
    display: block;
  }
  .station.is-visible{
    opacity: 1;
  }

  .station-header{
    margin-bottom: 32px;
  }
  .station-header__index{
    font-size: 12px;
    font-weight: 500;
    color: var(--gold);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .station-header__index::after{
    content: "";
    height: 1px;
    width: 32px;
    background: linear-gradient(to left, transparent, rgba(212,175,55,.5));
    display: inline-block;
  }
  .station-header__title{
    font-family: var(--font-ui);
    font-weight: 700;
    font-size: clamp(28px, 4vw, 40px);
    color: var(--cream);
    margin: 0 0 12px;
    line-height: 1.3;
    letter-spacing: -.2px;
  }
  .station-header__meta{
    display: flex;
    align-items: center;
    gap: 14px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 300;
  }
  .station-header__meta .dot{
    width: 4px; height: 4px; border-radius: 50%;
    background: var(--muted); opacity: .5;
  }

  /* مكان الفيديو (placeholder) */
  .station-video{
    margin: 28px 0;
    aspect-ratio: 16 / 9;
    border-radius: 8px;
    background:
      linear-gradient(135deg, rgba(212,175,55,.04), transparent 60%),
      var(--navy-deep);
    border: 1px solid rgba(212,175,55,.35);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    color: var(--muted);
    font-size: 14px;
    font-weight: 400;
    position: relative;
    overflow: hidden;
  }
  .station-video::before{
    content: "";
    position: absolute; inset: 0;
    background-image:
      repeating-linear-gradient(45deg, transparent 0 14px, rgba(212,175,55,.025) 14px 15px);
    pointer-events: none;
  }
  .station-video__icon{
    width: 56px; height: 56px;
    border-radius: 50%;
    border: 1px solid rgba(212,175,55,.4);
    display: grid; place-items: center;
    color: var(--gold);
  }
  .station-video__icon svg{ width: 20px; height: 20px; }
  .station-video__label{ position: relative; }

  /* مناطق التفاعل والصدى */
  .station-interaction{ margin: 24px 0; }
  .station-interaction:empty{ display: none; }

  .station-echo{
    margin: 24px 0;
    padding: 20px 22px;
    border-right: 2px solid var(--gold);
    background: rgba(212,175,55,.04);
    border-radius: 0 6px 6px 0;
    font-family: var(--font-quote);
    color: var(--cream);
    display: none;
  }
  .station-echo.is-shown{ display: block; }

  /* الجملة الافتراضية للـ placeholder */
  .station-body__placeholder{
    color: var(--muted);
    font-size: 15px;
    margin: 20px 0 0;
    padding: 18px 22px;
    border: 1px dashed rgba(184,184,184,.2);
    border-radius: 6px;
    background: rgba(255,255,255,.01);
  }

  /* ========== التنقل ========== */
  .station-nav{
    margin-top: 56px;
    display: flex;
    justify-content: flex-start;
    align-items: center;
    gap: 16px;
  }
  .btn-next{
    appearance: none;
    background: var(--navy);
    color: var(--cream);
    border: 1px solid var(--sky);
    padding: 14px 28px;
    border-radius: 4px;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: .2px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    transition: all .25s var(--ease);
    min-height: 48px;
  }
  .btn-next:hover{
    border-color: var(--gold);
    color: var(--gold);
    box-shadow:
      0 0 0 1px rgba(212,175,55,.25),
      0 0 24px rgba(212,175,55,.15);
    transform: translateY(-1px);
  }
  .btn-next:active{ transform: translateY(0); }
  .btn-next:disabled{
    opacity: .35;
    cursor: not-allowed;
    transform: none;
  }
  .btn-next:disabled:hover{
    border-color: var(--sky);
    color: var(--cream);
    box-shadow: none;
  }
  .btn-next__arrow{
    /* السهم في RTL يشير لليسار للتقدّم للأمام */
    transition: transform .25s var(--ease);
  }
  .btn-next:hover .btn-next__arrow{ transform: translateX(-4px); }

  .completion-note{
    color: var(--muted);
    font-size: 13px;
    font-family: var(--font-quote);
  }

  /* ========== Responsive ========== */
  @media (max-width: 900px){
    .rail{ right: 12px; }
  }

  @media (max-width: 768px){
    /* شريط أفقي تحت الهيدر */
    .rail{
      position: sticky;
      top: 56px;
      right: auto;
      left: auto;
      transform: none;
      width: 100%;
      background: rgba(20,35,56,.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(212,175,55,.1);
      padding: 14px 20px;
      z-index: 40;
    }
    .rail__list{
      flex-direction: row;
      justify-content: space-between;
      gap: 0;
      align-items: center;
    }
    .rail__list::before{
      right: 12px; left: 12px;
      top: 50%; bottom: auto;
      width: auto; height: 1px;
      transform: translateY(-50%);
    }
    .rail__list::after{
      right: 12px; left: auto;
      top: 50%; transform: translateY(-50%);
      width: var(--rail-progress, 0%);
      height: 1px;
      background: linear-gradient(to left, var(--gold), rgba(212,175,55,.5));
      transition: width .4s var(--ease);
    }
    .rail__item{ flex-direction: column; gap: 0; }
    .rail__dot{ width: 16px; height: 16px; }
    .rail__label{ display: none; }
    .rail__item.is-current .rail__label{ display: none; }

    .site-header__inner{ padding: 12px 18px; }
    .brand__name{ font-size: 17px; }
    .brand__tag{ display: none; }

    main{ padding: 32px 20px 80px; }

    .station-header__title{ font-size: 26px; }
    .station-header__meta{ font-size: 12px; }
    .station-body__placeholder{ font-size: 14px; }

    .btn-next{
      width: 100%;
      justify-content: center;
      padding: 16px 24px;
      font-size: 16px;
      min-height: 52px;
    }
    .station-nav{ flex-direction: column-reverse; align-items: stretch; gap: 12px; }
    .completion-note{ text-align: center; }
  }

  /* ========== لتقليل الحركة عند الطلب ========== */
  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>
<body data-screen-label="هندسة العقلية — الأساس">

<!-- ========== الهيدر ========== -->
<header class="site-header">
  <div class="site-header__inner">
    <div class="brand">
      <span class="brand__dot" aria-hidden="true"></span>
      <span class="brand__name">منظور الفؤاد</span>
      <span class="brand__tag">· هندسة العقلية</span>
    </div>
    <div class="participant">
      <span class="participant__label">المشارك:</span>
      <span class="participant__name" id="participantName">—</span>
    </div>
  </div>
</header>

<!-- ========== شريط التقدم ========== -->
<nav class="rail" aria-label="تقدّم الرحلة">
  <ol class="rail__list" id="rail"></ol>
</nav>

<!-- ========== المحتوى ========== -->
<main id="stationContainer" aria-live="polite"></main>


<script>
/* ============================================================
   CONTENT — كل النصوص المستقبلية للمحطات هتتحط هنا
   حاليًا: عناوين ومدد المحطات السبع فقط
   ============================================================ */
const CONTENT = {
  stations: [
    { id: 1, title: "البداية والتعريف", duration: "٨ دقائق" },
    { id: 2, title: "إرهاق أم احتراق؟", duration: "١٠ دقائق" },
    { id: 3, title: "اللي بييجي الأول", duration: "١٥ دقيقة" },
    { id: 4, title: "محورك الرئيسي", duration: "١٢ دقيقة" },
    { id: 5, title: "بابك ونكهتك", duration: "٢٠ دقيقة" },
    { id: 6, title: "الطبقة الأعمق", duration: "١٢ دقيقة" },
    { id: 7, title: "ميثاقك", duration: "١٠ دقائق" }
  ],
  ui: {
    videoPlaceholder: "مشغّل الفيديو",
    bodyPlaceholder: "محتوى المحطة هييجي قريب.",
    next: "المحطة التالية",
    finish: "إنهاء الرحلة",
    finishedNote: "اكتملت الرحلة — في انتظار محتوى المحطات.",
    stepOf: (a, b) => `المحطة ${a} من ${b}`
  }
};

/* ============================================================
   journeyState — الحالة العامة للرحلة
   ============================================================ */
const journeyState = {
  user: {
    name: "", email: "", job: "", ageRange: "", whatsapp: "",
    consentWhatsapp: false, consentFollowup: false
  },
  currentStation: 1,
  completedStations: [],
  choices: {
    station2_level: null,
    station3_firstThought: null,
    station4_axisMain: null, station4_axisSub: null,
    station5_door: null, station5_flavor: null,
    station6_signs: [],
    station7_covenant: { line1: "", line2: "", line3: "" }
  },
  fingerprint: {
    axis: null, door: null, flavor: null, name: null, burnoutType: null
  }
};

/* ============================================================
   تحويل الأرقام للعربية الهندية
   ============================================================ */
const AR_DIGITS = ["٠","١","٢","٣","٤","٥","٦","٧","٨","٩"];
const toArabicDigits = (n) => String(n).replace(/\d/g, d => AR_DIGITS[+d]);

/* ============================================================
   بناء شريط التقدم (مرة واحدة)
   ============================================================ */
function buildRail(){
  const rail = document.getElementById("rail");
  rail.innerHTML = CONTENT.stations.map(s => `
    <li class="rail__item" data-station="${s.id}" role="button" tabindex="0"
        aria-label="المحطة ${toArabicDigits(s.id)}: ${s.title}">
      <span class="rail__dot" aria-hidden="true"></span>
      <span class="rail__label">${s.title}</span>
    </li>
  `).join("");

  // التنقل بالضغط على نقاط مكتملة أو الحالية
  rail.querySelectorAll(".rail__item").forEach(el => {
    const goId = +el.dataset.station;
    const handler = () => {
      const isReachable =
        journeyState.completedStations.includes(goId) ||
        goId === journeyState.currentStation ||
        goId === Math.max(...journeyState.completedStations, 0) + 1;
      if (isReachable) goToStation(goId);
    };
    el.addEventListener("click", handler);
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); handler(); }
    });
  });
}

/* ============================================================
   بناء DOM المحطات (مرة واحدة، placeholders)
   ============================================================ */
function buildStations(){
  const wrap = document.getElementById("stationContainer");
  const total = CONTENT.stations.length;

  wrap.innerHTML = CONTENT.stations.map((s, i) => {
    const isLast = i === total - 1;
    const btnLabel = isLast ? CONTENT.ui.finish : CONTENT.ui.next;
    return `
      <section class="station" data-station="${s.id}" data-screen-label="${toArabicDigits(s.id)} ${s.title}" aria-hidden="true">
        <header class="station-header">
          <div class="station-header__index">
            <span>المحطة ${toArabicDigits(s.id)} / ${toArabicDigits(total)}</span>
          </div>
          <h1 class="station-header__title">${s.title}</h1>
          <div class="station-header__meta">
            <span>${s.duration}</span>
            <span class="dot" aria-hidden="true"></span>
            <span>تجربة شخصية</span>
          </div>
        </header>

        <!-- مكان الفيديو (placeholder) -->
        <div class="station-video" aria-label="${CONTENT.ui.videoPlaceholder}">
          <div class="station-video__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="6 4 20 12 6 20 6 4"></polygon>
            </svg>
          </div>
          <div class="station-video__label">${CONTENT.ui.videoPlaceholder}</div>
        </div>

        <!-- منطقة التفاعل (فاضية دلوقتي) -->
        <div class="station-interaction" data-role="interaction"></div>

        <!-- منطقة الصدى (مخفية دلوقتي) -->
        <div class="station-echo" data-role="echo" aria-hidden="true"></div>

        <!-- نص الـ placeholder المؤقت -->
        <p class="station-body__placeholder">${CONTENT.ui.bodyPlaceholder}</p>

        <!-- التنقل -->
        <div class="station-nav">
          <button type="button" class="btn-next" data-action="next" ${isLast ? "data-finish='1'" : ""}>
            <span>${btnLabel}</span>
            <span class="btn-next__arrow" aria-hidden="true">←</span>
          </button>
          <span class="completion-note" data-role="completion-note" hidden></span>
        </div>
      </section>
    `;
  }).join("");

  // ربط أزرار التالي
  wrap.querySelectorAll(".btn-next").forEach(btn => {
    btn.addEventListener("click", () => {
      const stationEl = btn.closest(".station");
      const id = +stationEl.dataset.station;
      completeStation(id);

      if (btn.dataset.finish === "1") {
        // اكتملت الرحلة — حاليًا: عرض رسالة فقط
        const note = stationEl.querySelector("[data-role='completion-note']");
        note.textContent = CONTENT.ui.finishedNote;
        note.hidden = false;
        btn.disabled = true;
        updateProgress();
        return;
      }
      goToStation(id + 1);
    });
  });
}

/* ============================================================
   render — عرض المحطة الحالية (fade ناعم)
   ============================================================ */
function render(){
  const all = document.querySelectorAll(".station");
  all.forEach(el => {
    const isActive = +el.dataset.station === journeyState.currentStation;
    if (isActive){
      el.classList.add("is-active");
      el.setAttribute("aria-hidden", "false");
      // fade in
      requestAnimationFrame(() => {
        requestAnimationFrame(() => el.classList.add("is-visible"));
      });
    } else {
      el.classList.remove("is-active", "is-visible");
      el.setAttribute("aria-hidden", "true");
    }
  });
  updateProgress();
}

/* ============================================================
   goToStation — انتقال + scroll + تحديث الشريط
   ============================================================ */
function goToStation(n){
  if (n < 1 || n > CONTENT.stations.length) return;
  if (n === journeyState.currentStation) return;

  const current = document.querySelector(`.station[data-station="${journeyState.currentStation}"]`);
  if (current) current.classList.remove("is-visible");

  // ننتظر فترة fade-out قصيرة قبل التبديل
  setTimeout(() => {
    journeyState.currentStation = n;
    render();
    // scroll لأعلى بسلاسة
    window.scrollTo({ top: 0, behavior: "smooth" });
  }, 220);
}

/* ============================================================
   completeStation — إضافة محطة للمكتملة
   ============================================================ */
function completeStation(n){
  if (!journeyState.completedStations.includes(n)){
    journeyState.completedStations.push(n);
  }
  updateProgress();
}

/* ============================================================
   updateProgress — تحديث نقاط الشريط
   ============================================================ */
function updateProgress(){
  const items = document.querySelectorAll(".rail__item");
  const total = CONTENT.stations.length;
  let lastDoneIdx = -1;

  items.forEach((el, idx) => {
    const id = +el.dataset.station;
    el.classList.remove("is-done", "is-current");
    if (journeyState.completedStations.includes(id)){
      el.classList.add("is-done");
      lastDoneIdx = Math.max(lastDoneIdx, idx);
    }
    if (id === journeyState.currentStation){
      el.classList.add("is-current");
    }
  });

  // طول الخط المكتمل: من أول نقطة إلى المحطة الحالية
  const currentIdx = CONTENT.stations.findIndex(s => s.id === journeyState.currentStation);
  const reached = Math.max(lastDoneIdx, currentIdx);
  // نسبة بين النقاط (total-1 فواصل)
  const ratio = total > 1 ? Math.max(0, reached) / (total - 1) : 0;
  document.querySelector(".rail__list").style.setProperty("--rail-progress", `${ratio * 100}%`);
}

/* ============================================================
   تحديث اسم المشارك (لو اتعبّى لاحقًا)
   ============================================================ */
function refreshParticipant(){
  const el = document.getElementById("participantName");
  el.textContent = journeyState.user.name?.trim() || "—";
}

/* ============================================================
   init
   ============================================================ */
function init(){
  buildRail();
  buildStations();
  refreshParticipant();
  render();
}

document.addEventListener("DOMContentLoaded", init);
</script>
