<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تمرين مخصص</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-firestore-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Tajawal', 'Cairo', sans-serif;
            background: linear-gradient(135deg, #1a202c, #2d3748);
            color: white;
            min-height: 100vh;
            padding: 2rem;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        .exercise-header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem;
            background: rgba(59, 130, 246, 0.1);
            border-radius: 16px;
            border: 2px solid rgba(59, 130, 246, 0.3);
        }
        
        .question {
            background: rgba(255, 255, 255, 0.05);
            padding: 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
        }
        
        textarea, input {
            width: 100%;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            font-family: inherit;
        }
        
        .submit-btn {
            background: linear-gradient(135deg, #3b82f6, #10b981);
            color: white;
            border: none;
            padding: 1.25rem 3rem;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 2rem;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(59, 130, 246, 0.6);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="exercise-header">
            <h1>✨ تمرين مخصص</h1>
            <p>صمم تمرينك بالضبط زي ما تحب!</p>
        </div>
        
        <!-- هنا حط التمرين بتاعك براحتك تماماً -->
        <div class="question">
            <h3>السؤال الأول</h3>
            <textarea id="answer1" rows="5" placeholder="اكتب إجابتك..."></textarea>
        </div>
        
        <div class="question">
            <h3>السؤال الثاني</h3>
            <input type="text" id="answer2" placeholder="إجابتك...">
        </div>
        
        <button class="submit-btn" onclick="submitExercise()">
            ✅ إكمال التمرين
        </button>
    </div>
    
    <script>
        // استخراج المعلومات من الـ URL
        const urlParams = new URLSearchParams(window.location.search);
        const exerciseId = urlParams.get('exerciseId');
        const userId = urlParams.get('userId');
        const courseId = urlParams.get('courseId');
        
        // دالة إرسال التمرين
        function submitExercise() {
            // جمع الإجابات
            const answers = {
                answer1: document.getElementById('answer1').value,
                answer2: document.getElementById('answer2').value
            };
            
            // إرسال رسالة للصفحة الأم
            window.parent.postMessage({
                type: 'exercise-completed',
                data: {
                    exerciseId: exerciseId,
                    userId: userId,
                    answers: answers,
                    customData: {
                        completedAt: new Date().toISOString()
                    }
                }
            }, '*');
            
            // رسالة نجاح
            alert('✅ تم إكمال التمرين بنجاح!');
        }
    </script>
</body>
</html>
