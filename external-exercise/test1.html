<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تمرين مخصص</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-firestore-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Tajawal', 'Cairo', sans-serif;
            background: linear-gradient(135deg, #1a202c, #2d3748);
            color: white;
            min-height: 100vh;
            padding: 2rem;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        .exercise-header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem;
            background: rgba(59, 130, 246, 0.1);
            border-radius: 16px;
            border: 2px solid rgba(59, 130, 246, 0.3);
        }
        
        .question {
            background: rgba(255, 255, 255, 0.05);
            padding: 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
        }
        
        textarea, input {
            width: 100%;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            font-family: inherit;
        }
        
        .submit-btn {
            background: linear-gradient(135deg, #3b82f6, #10b981);
            color: white;
            border: none;
            padding: 1.25rem 3rem;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 2rem;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(59, 130, 246, 0.6);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="exercise-header">
            <h1>✨ تمرين مخصص</h1>
            <p>صمم تمرينك بالضبط زي ما تحب!</p>
        </div>
        
        <!-- هنا حط التمرين بتاعك براحتك تماماً -->
        <div class="question">
            <h3>السؤال الأول</h3>
            <textarea id="answer1" rows="5" placeholder="اكتب إجابتك..."></textarea>
        </div>
        
        <div class="question">
            <h3>السؤال الثاني</h3>
            <input type="text" id="answer2" placeholder="إجابتك...">
        </div>
        
        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
    <button class="submit-btn" onclick="submitExercise()" style="flex: 1;">
        ✅ إكمال التمرين
    </button>
    <button onclick="saveDraft()" style="
        flex: 0.5;
        background: linear-gradient(135deg, #f59e0b, #d97706);
        color: white;
        border: none;
        padding: 1.25rem 2rem;
        border-radius: 12px;
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
    ">
        💾 حفظ مسودة
    </button>
</div>
    </div>
    
    <script>
        // استخراج المعلومات من الـ URL
        const urlParams = new URLSearchParams(window.location.search);
        const exerciseId = urlParams.get('exerciseId');
        const userId = urlParams.get('userId');
        const courseId = urlParams.get('courseId');

        
        // ========================================
// 🛡️ متغير منع التكرار
// ========================================
let isSubmitting = false;
let exerciseCompleted = false;

// ========================================
// 📤 دالة إرسال التمرين (محسّنة)
// ========================================
function submitExercise() {
    // 🛡️ منع التنفيذ المتكرر
    if (isSubmitting) {
        console.log('⚠️ التمرين قيد الإرسال');
        return;
    }
    
    if (exerciseCompleted) {
        console.log('⚠️ التمرين مكتمل بالفعل');
        alert('✅ لقد أكملت هذا التمرين مسبقاً!');
        return;
    }
    
    isSubmitting = true;
    
    // جمع الإجابات
    const answers = {
        answer1: document.getElementById('answer1').value.trim(),
        answer2: document.getElementById('answer2').value.trim()
    };
    
    // التحقق من الإجابات
    if (!answers.answer1 && !answers.answer2) {
        alert('⚠️ من فضلك أجب على سؤال واحد على الأقل');
        isSubmitting = false;
        return;
    }
    
    console.log('📤 إرسال البيانات...');
    
    // إرسال رسالة للصفحة الأم
    window.parent.postMessage({
        type: 'exercise-completed',
        data: {
            exerciseId: exerciseId,
            userId: userId,
            courseId: courseId,
            answers: answers,
            completedAt: new Date().toISOString()
        }
    }, '*');
    
    // رسالة نجاح
    alert('✅ تم إرسال إجاباتك بنجاح!');
    
    // تحديث الحالة
    exerciseCompleted = true;
    
    // تعطيل الزرار
    const btn = document.querySelector('.submit-btn');
    if (btn) {
        btn.disabled = true;
        btn.style.opacity = '0.6';
        btn.style.cursor = 'not-allowed';
        btn.style.background = '#6b7280';
        btn.innerHTML = '✅ تم الإكمال';
    }
    
    isSubmitting = false;
}

        // ========================================
// 💾 دالة حفظ المسودة
// ========================================
function saveDraft() {
    if (isSubmitting) {
        console.log('⚠️ عملية جارية');
        return;
    }
    
    // جمع الإجابات
    const answers = {
        answer1: document.getElementById('answer1').value.trim(),
        answer2: document.getElementById('answer2').value.trim()
    };
    
    // التحقق من وجود إجابات
    if (!answers.answer1 && !answers.answer2) {
        alert('⚠️ لا توجد إجابات للحفظ');
        return;
    }
    
    console.log('💾 حفظ مسودة...');
    
    // إرسال رسالة للصفحة الأم
    window.parent.postMessage({
        type: 'exercise-draft-save',
        data: {
            exerciseId: exerciseId,
            userId: userId,
            courseId: courseId,
            answers: answers,
            savedAt: new Date().toISOString()
        }
    }, '*');
    
    alert('💾 تم حفظ المسودة!');
}

        // ========================================
// 📥 استقبال البيانات من صفحة العميل
// ========================================
window.addEventListener('message', function(event) {
    // التحقق من نوع الرسالة
    if (event.data.type === 'load-saved-data') {
        console.log('📥 استلام بيانات محفوظة:', event.data);
        
        const savedData = event.data.data;
        
        if (savedData && savedData.answers) {
            // تحميل الإجابات
            if (savedData.answers.answer1) {
                document.getElementById('answer1').value = savedData.answers.answer1;
            }
            if (savedData.answers.answer2) {
                document.getElementById('answer2').value = savedData.answers.answer2;
            }
            
            // تحديث الحالة
            if (savedData.completed) {
                exerciseCompleted = true;
                
                // تعطيل الزرار
                const btn = document.querySelector('.submit-btn');
                if (btn) {
                    btn.disabled = true;
                    btn.style.opacity = '0.6';
                    btn.style.cursor = 'not-allowed';
                    btn.style.background = '#6b7280';
                    btn.innerHTML = '✅ تم الإكمال';
                }
                
                // عرض رسالة
                const header = document.querySelector('.exercise-header');
                if (header) {
                    const badge = document.createElement('div');
                    badge.style.cssText = `
                        background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(5, 150, 105, 0.1));
                        padding: 1rem;
                        border-radius: 12px;
                        border: 2px solid rgba(16, 185, 129, 0.4);
                        margin-top: 1rem;
                        text-align: center;
                        color: #10b981;
                        font-weight: 600;
                    `;
                    badge.innerHTML = '✅ تم إكمال هذا التمرين مسبقاً';
                    header.appendChild(badge);
                }
            } else if (savedData.draft) {
                // عرض رسالة مسودة
                const header = document.querySelector('.exercise-header');
                if (header) {
                    const badge = document.createElement('div');
                    badge.style.cssText = `
                        background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(217, 119, 6, 0.1));
                        padding: 1rem;
                        border-radius: 12px;
                        border: 2px solid rgba(245, 158, 11, 0.4);
                        margin-top: 1rem;
                        text-align: center;
                        color: #f59e0b;
                        font-weight: 600;
                    `;
                    badge.innerHTML = '📝 تم تحميل مسودتك المحفوظة';
                    header.appendChild(badge);
                }
            }
            
            console.log('✅ تم تحميل البيانات المحفوظة');
        }
    }
});

// ========================================
// 🚀 طلب البيانات المحفوظة عند التحميل
// ========================================
window.addEventListener('load', function() {
    console.log('🎬 الصفحة جاهزة');
    
    // طلب البيانات من صفحة العميل
    setTimeout(() => {
        console.log('📤 طلب البيانات المحفوظة...');
        window.parent.postMessage({
            type: 'request-saved-data',
            data: {
                exerciseId: exerciseId,
                userId: userId,
                courseId: courseId
            }
        }, '*');
    }, 500);
});

        // ========================================
// 📡 نظام استقبال رسائل التمارين الخارجية
// ========================================
window.addEventListener('message', async function(event) {
    console.log('📨 رسالة واردة:', event.data);
    
    try {
        const messageType = event.data.type;
        const messageData = event.data.data;
        
        // ========================================
        // ✅ استقبال إكمال التمرين
        // ========================================
        if (messageType === 'exercise-completed') {
            console.log('✅ استلام إكمال التمرين:', messageData);
            
            const { exerciseId, userId, courseId, answers, completedAt } = messageData;
            
            if (!exerciseId || !userId || !courseId) {
                console.error('❌ بيانات ناقصة');
                return;
            }
            
            // جلب بيانات التمرين من المكتبة
            const exerciseDoc = await db.collection('courseContentLibrary')
                .doc(exerciseId)
                .get();
            
            if (!exerciseDoc.exists) {
                console.error('❌ التمرين غير موجود في المكتبة');
                return;
            }
            
            const exerciseData = exerciseDoc.data();
            const pillars = exerciseData.externalExercise?.pillars || {};
            const totalPoints = exerciseData.externalExercise?.totalPoints || 0;
            
            console.log('📦 بيانات التمرين:', exerciseData);
            console.log('🏛️ النقاط:', pillars);
            
            // حفظ في Firebase
            await db.collection('users')
                .doc(userId)
                .collection('awakening_progress')
                .doc(courseId)
                .set({
                    [`exercises.${exerciseId}`]: {
                        completed: true,
                        completedAt: firebase.firestore.FieldValue.serverTimestamp(),
                        answers: answers,
                        pointsEarned: pillars
                    }
                }, { merge: true });
            
            console.log('✅ تم حفظ الإجابات في Firebase');
            
            // إضافة النقاط للأركان
            for (const [pillarKey, points] of Object.entries(pillars)) {
                if (points > 0) {
                    await addPointsToPillar(pillarKey, points, {
                        type: 'external-exercise',
                        exerciseId: exerciseId,
                        exerciseName: exerciseData.name
                    });
                    console.log(`✅ ${pillarKey}: +${points} نقطة`);
                }
            }
            
            // تحديث الواجهة
            if (typeof renderPointsDashboard === 'function') {
                await renderPointsDashboard();
            }
            if (typeof refreshUserPoints === 'function') {
                await refreshUserPoints();
            }
            if (typeof displayUserProgress === 'function') {
                await displayUserProgress();
            }
            if (typeof displayModulesAndLessons === 'function') {
                displayModulesAndLessons();
            }
            
            // إضافة للدروس المكتملة
            if (typeof allLessons !== 'undefined' && typeof userProgress !== 'undefined') {
                const exerciseLesson = allLessons.find(l => l.libraryContentId === exerciseId);
                if (exerciseLesson) {
                    const lessonIndex = exerciseLesson.globalIndex;
                    
                    if (!userProgress.completedLessons) {
                        userProgress.completedLessons = [];
                    }
                    
                    if (!userProgress.completedLessons.includes(lessonIndex)) {
                        userProgress.completedLessons.push(lessonIndex);
                        
                        await db.collection('users')
                            .doc(userId)
                            .update({
                                [`progress.${courseId}.completedLessons`]: userProgress.completedLessons
                            });
                        
                        console.log(`✅ تم إضافة للدروس المكتملة: ${lessonIndex}`);
                    }
                }
            }
            
            // عرض رسالة نجاح
            if (typeof showNotification === 'function') {
                showNotification(`🎉 رائع! حصلت على ${totalPoints} نقطة!`, 'success');
            } else {
                alert(`🎉 رائع! حصلت على ${totalPoints} نقطة!`);
            }
        }
        
        // ========================================
        // 💾 استقبال حفظ المسودة
        // ========================================
        else if (messageType === 'exercise-draft-save') {
            console.log('💾 استلام حفظ مسودة:', messageData);
            
            const { exerciseId, userId, courseId, answers, savedAt } = messageData;
            
            if (!exerciseId || !userId || !courseId) {
                console.error('❌ بيانات ناقصة');
                return;
            }
            
            // حفظ كمسودة
            await db.collection('users')
                .doc(userId)
                .collection('awakening_progress')
                .doc(courseId)
                .set({
                    [`exercises.${exerciseId}`]: {
                        completed: false,
                        draft: true,
                        lastSaved: firebase.firestore.FieldValue.serverTimestamp(),
                        answers: answers
                    }
                }, { merge: true });
            
            console.log('✅ تم حفظ المسودة في Firebase');
            
            // عرض رسالة
            if (typeof showNotification === 'function') {
                showNotification('💾 تم حفظ المسودة!', 'success');
            }
        }
        
        // ========================================
        // 📥 طلب البيانات المحفوظة
        // ========================================
        else if (messageType === 'request-saved-data') {
            console.log('📥 طلب البيانات المحفوظة:', messageData);
            
            const { exerciseId, userId, courseId } = messageData;
            
            if (!exerciseId || !userId || !courseId) {
                console.error('❌ بيانات ناقصة');
                return;
            }
            
            // جلب البيانات من Firebase
            const progressDoc = await db.collection('users')
                .doc(userId)
                .collection('awakening_progress')
                .doc(courseId)
                .get();
            
            if (progressDoc.exists) {
                const data = progressDoc.data();
                const exerciseKey = `exercises.${exerciseId}`;
                const exerciseData = data[exerciseKey];
                
                if (exerciseData) {
                    console.log('✅ وجدت بيانات محفوظة:', exerciseData);
                    
                    // إرسال البيانات للتمرين
                    const iframe = document.querySelector('iframe');
                    if (iframe && iframe.contentWindow) {
                        iframe.contentWindow.postMessage({
                            type: 'load-saved-data',
                            data: exerciseData
                        }, '*');
                        
                        console.log('📤 تم إرسال البيانات للتمرين');
                    }
                } else {
                    console.log('📝 لا توجد بيانات محفوظة');
                }
            } else {
                console.log('📝 لا توجد بيانات تقدم');
            }
        }
        
    } catch (error) {
        console.error('❌ خطأ في معالجة الرسالة:', error);
    }
});

console.log('✅ نظام استقبال التمارين الخارجية جاهز');

        
    </script>
</body>
</html>
