<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تمرين مخصص</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-firestore-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Tajawal', 'Cairo', sans-serif;
            background: linear-gradient(135deg, #1a202c, #2d3748);
            color: white;
            min-height: 100vh;
            padding: 2rem;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        .exercise-header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem;
            background: rgba(59, 130, 246, 0.1);
            border-radius: 16px;
            border: 2px solid rgba(59, 130, 246, 0.3);
        }
        
        .question {
            background: rgba(255, 255, 255, 0.05);
            padding: 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
        }
        
        textarea, input {
            width: 100%;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            font-family: inherit;
        }
        
        .submit-btn {
            background: linear-gradient(135deg, #3b82f6, #10b981);
            color: white;
            border: none;
            padding: 1.25rem 3rem;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 2rem;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(59, 130, 246, 0.6);
        }
        /* ملخص النقاط */
.points-summary {
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(16, 185, 129, 0.1));
    padding: 2rem;
    border-radius: 16px;
    border: 2px solid rgba(59, 130, 246, 0.4);
    margin-top: 2rem;
    display: none;
}

.points-summary.show {
    display: block;
    animation: slideIn 0.5s ease-out;
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateY(-20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.points-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 1rem;
    margin-top: 1rem;
}

.point-card {
    background: rgba(0, 0, 0, 0.3);
    padding: 1.5rem;
    border-radius: 12px;
    text-align: center;
    transition: transform 0.3s;
}

.point-card:hover {
    transform: translateY(-5px);
}
    </style>
</head>
<body>
    <div class="container">
        <div class="exercise-header">
            <h1>✨ تمرين مخصص</h1>
            <p>صمم تمرينك بالضبط زي ما تحب!</p>
        </div>
        
        <!-- هنا حط التمرين بتاعك براحتك تماماً -->
        <div class="question">
            <h3>السؤال الأول</h3>
            <textarea id="answer1" rows="5" placeholder="اكتب إجابتك..."></textarea>
        </div>
        
        <div class="question">
            <h3>السؤال الثاني</h3>
            <input type="text" id="answer2" placeholder="إجابتك...">
        </div>
        
        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
    <button class="submit-btn" onclick="submitExercise()" style="flex: 1;">
        ✅ إكمال التمرين
    </button>
    <button onclick="saveDraft()" style="
        flex: 0.5;
        background: linear-gradient(135deg, #f59e0b, #d97706);
        color: white;
        border: none;
        padding: 1.25rem 2rem;
        border-radius: 12px;
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
    ">
        💾 حفظ مسودة
    </button>
</div>
        <!-- ملخص النقاط -->
<div id="pointsSummary" class="points-summary">
    <h3 style="text-align: center; color: #60a5fa; margin-bottom: 1.5rem;">
        🎉 النقاط المكتسبة
    </h3>
    <div id="pointsGrid" class="points-grid"></div>
</div>
    </div>
    
    <script>
        // استخراج المعلومات من الـ URL
        const urlParams = new URLSearchParams(window.location.search);
        const exerciseId = urlParams.get('exerciseId');
        const userId = urlParams.get('userId');
        const courseId = urlParams.get('courseId');

        
        // ========================================
// 🛡️ متغير منع التكرار
// ========================================
let isSubmitting = false;
let exerciseCompleted = false;

// ========================================
// 📤 دالة إرسال التمرين (محسّنة)
// ========================================
function submitExercise() {
    // 🛡️ منع التنفيذ المتكرر
    if (isSubmitting) {
        console.log('⚠️ التمرين قيد الإرسال');
        return;
    }
    
    if (exerciseCompleted) {
        console.log('⚠️ التمرين مكتمل بالفعل');
        alert('✅ لقد أكملت هذا التمرين مسبقاً!');
        return;
    }
    
    isSubmitting = true;
    
    // جمع الإجابات
    const answers = {
        answer1: document.getElementById('answer1').value.trim(),
        answer2: document.getElementById('answer2').value.trim()
    };
    
    // التحقق من الإجابات
    if (!answers.answer1 && !answers.answer2) {
        alert('⚠️ من فضلك أجب على سؤال واحد على الأقل');
        isSubmitting = false;
        return;
    }
    
    console.log('📤 إرسال البيانات...');
    
    // إرسال رسالة للصفحة الأم
    window.parent.postMessage({
        type: 'exercise-completed',
        data: {
            exerciseId: exerciseId,
            userId: userId,
            courseId: courseId,
            answers: answers,
            completedAt: new Date().toISOString()
        }
    }, '*');
    
    // رسالة نجاح
    // عرض رسالة مؤقتة
const tempMsg = document.createElement('div');
tempMsg.style.cssText = `
    position: fixed;
    top: 20px;
    right: 20px;
    background: linear-gradient(135deg, #10b981, #059669);
    color: white;
    padding: 1rem 2rem;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
    z-index: 10000;
    animation: slideIn 0.3s ease-out;
`;
tempMsg.innerHTML = '✅ تم إرسال إجاباتك بنجاح!';
document.body.appendChild(tempMsg);

setTimeout(() => tempMsg.remove(), 3000);
    
    // تحديث الحالة
    exerciseCompleted = true;
    
    // تعطيل الزرار
    const btn = document.querySelector('.submit-btn');
    if (btn) {
        btn.disabled = true;
        btn.style.opacity = '0.6';
        btn.style.cursor = 'not-allowed';
        btn.style.background = '#6b7280';
        btn.innerHTML = '✅ تم الإكمال';
    }
    
    isSubmitting = false;
}

        // ========================================
// 💾 دالة حفظ المسودة
// ========================================
function saveDraft() {
    if (isSubmitting) {
        console.log('⚠️ عملية جارية');
        return;
    }
    
    // جمع الإجابات
    const answers = {
        answer1: document.getElementById('answer1').value.trim(),
        answer2: document.getElementById('answer2').value.trim()
    };
    
    // التحقق من وجود إجابات
    if (!answers.answer1 && !answers.answer2) {
        alert('⚠️ لا توجد إجابات للحفظ');
        return;
    }
    
    console.log('💾 حفظ مسودة...');
    
    // إرسال رسالة للصفحة الأم
    window.parent.postMessage({
        type: 'exercise-draft-save',
        data: {
            exerciseId: exerciseId,
            userId: userId,
            courseId: courseId,
            answers: answers,
            savedAt: new Date().toISOString()
        }
    }, '*');
    
    alert('💾 تم حفظ المسودة!');
}

        // ========================================
// ✏️ دالة تعديل الإجابات (بعد الإكمال)
// ========================================
function editAnswers() {
    if (isSubmitting) {
        console.log('⚠️ عملية جارية');
        return;
    }
    
    isSubmitting = true;
    
    // جمع الإجابات
    const answers = {
        answer1: document.getElementById('answer1').value.trim(),
        answer2: document.getElementById('answer2').value.trim()
    };
    
    // التحقق من الإجابات
    if (!answers.answer1 && !answers.answer2) {
        alert('⚠️ من فضلك أجب على سؤال واحد على الأقل');
        isSubmitting = false;
        return;
    }
    
    console.log('🔄 تحديث الإجابات...');
    
    // إرسال رسالة للصفحة الأم
    window.parent.postMessage({
        type: 'exercise-update',
        data: {
            exerciseId: exerciseId,
            userId: userId,
            courseId: courseId,
            answers: answers,
            updatedAt: new Date().toISOString()
        }
    }, '*');
    
    alert('✅ تم تحديث إجاباتك بنجاح!');
    
    // تعطيل مؤقت
    const btn = document.querySelector('.submit-btn');
    if (btn) {
        btn.disabled = true;
        btn.innerHTML = '⏳ جاري الحفظ...';
        
        setTimeout(() => {
            btn.disabled = false;
            btn.innerHTML = '✏️ تعديل الإجابات';
            isSubmitting = false;
        }, 2000);
    }
}

        // ========================================
// 📥 استقبال البيانات من صفحة العميل
// ========================================
window.addEventListener('message', function(event) {
    // التحقق من نوع الرسالة
    if (event.data.type === 'load-saved-data') {
        console.log('📥 استلام بيانات محفوظة:', event.data);
        
        const savedData = event.data.data;
        
        if (savedData && savedData.answers) {
            // تحميل الإجابات
            if (savedData.answers.answer1) {
                document.getElementById('answer1').value = savedData.answers.answer1;
            }
            if (savedData.answers.answer2) {
                document.getElementById('answer2').value = savedData.answers.answer2;
            }
            
            // تحديث الحالة
            if (savedData.completed) {
                exerciseCompleted = true;
                
                // تحويل الزرار لزر تعديل
const btn = document.querySelector('.submit-btn');
if (btn) {
    btn.disabled = false;
    btn.style.opacity = '1';
    btn.style.cursor = 'pointer';
    btn.style.background = 'linear-gradient(135deg, #f59e0b, #d97706)';
    btn.innerHTML = '✏️ تعديل الإجابات';
    btn.onclick = editAnswers;
}

                // إخفاء زر المسودة
const draftBtn = document.querySelector('button[onclick="saveDraft()"]');
if (draftBtn) {
    draftBtn.style.display = 'none';
    console.log('🚫 تم إخفاء زر المسودة');
}

// توسيع زر التعديل ليملأ المساحة
if (btn) {
    const parentDiv = btn.parentElement;
    if (parentDiv) {
        parentDiv.style.gap = '0';
        btn.style.flex = '1';
        btn.style.width = '100%';
    }
}
                
                // عرض رسالة
                const header = document.querySelector('.exercise-header');
                if (header) {
                    const badge = document.createElement('div');
                    badge.style.cssText = `
                        background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(5, 150, 105, 0.1));
                        padding: 1rem;
                        border-radius: 12px;
                        border: 2px solid rgba(16, 185, 129, 0.4);
                        margin-top: 1rem;
                        text-align: center;
                        color: #10b981;
                        font-weight: 600;
                    `;
                    badge.innerHTML = '✅ تم إكمال هذا التمرين مسبقاً';
                    header.appendChild(badge);
                }

                } else {
    // التمرين غير مكتمل - إظهار زر المسودة
    const draftBtn = document.querySelector('button[onclick="saveDraft()"]');
    if (draftBtn) {
        draftBtn.style.display = 'block';
    }
            } else if (savedData.draft) {
                // عرض رسالة مسودة
                const header = document.querySelector('.exercise-header');
                if (header) {
                    const badge = document.createElement('div');
                    badge.style.cssText = `
                        background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(217, 119, 6, 0.1));
                        padding: 1rem;
                        border-radius: 12px;
                        border: 2px solid rgba(245, 158, 11, 0.4);
                        margin-top: 1rem;
                        text-align: center;
                        color: #f59e0b;
                        font-weight: 600;
                    `;
                    badge.innerHTML = '📝 تم تحميل مسودتك المحفوظة';
                    header.appendChild(badge);
                }
            }
            
            console.log('✅ تم تحميل البيانات المحفوظة');
        }
    }
    // استقبال ملخص النقاط
else if (event.data.type === 'show-points-summary') {
    console.log('📊 عرض ملخص النقاط:', event.data.data);
    
    const pillars = event.data.data.pillars;
    const pointsGrid = document.getElementById('pointsGrid');
    
    if (pointsGrid && pillars) {
        const pillarNames = {
            courage: { name: 'الجرأة', icon: '🔥', color: '#ef4444' },
            mirror: { name: 'المرآة', icon: '🪞', color: '#8b5cf6' },
            action: { name: 'الخطوة', icon: '👣', color: '#10b981' },
            witness: { name: 'الشهود', icon: '👁️', color: '#fbbf24' }
        };
        
        let html = '';
        for (const [key, points] of Object.entries(pillars)) {
            if (points > 0 && pillarNames[key]) {
                const pillar = pillarNames[key];
                html += `
                    <div class="point-card" style="border: 2px solid ${pillar.color}40;">
                        <div style="font-size: 2.5rem;">${pillar.icon}</div>
                        <div style="color: ${pillar.color}; font-weight: 600; margin: 0.5rem 0;">
                            ${pillar.name}
                        </div>
                        <div style="color: white; font-size: 2rem; font-weight: 700;">
                            +${points}
                        </div>
                    </div>
                `;
            }
        }
        
        pointsGrid.innerHTML = html;
        document.getElementById('pointsSummary').classList.add('show');
        
        // Scroll إلى الملخص
        setTimeout(() => {
            document.getElementById('pointsSummary').scrollIntoView({ 
                behavior: 'smooth', 
                block: 'center' 
            });
        }, 100);
    }
}
});

// ========================================
// 🚀 طلب البيانات المحفوظة عند التحميل
// ========================================
window.addEventListener('load', function() {
    console.log('🎬 الصفحة جاهزة');
    
    // طلب البيانات من صفحة العميل
    setTimeout(() => {
        console.log('📤 طلب البيانات المحفوظة...');
        window.parent.postMessage({
            type: 'request-saved-data',
            data: {
                exerciseId: exerciseId,
                userId: userId,
                courseId: courseId
            }
        }, '*');
    }, 500);
});

       

        
    </script>
</body>
</html>
