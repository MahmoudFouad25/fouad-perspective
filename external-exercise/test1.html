<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تمرين مخصص</title>
    
    <!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Tajawal', 'Cairo', sans-serif;
            background: linear-gradient(135deg, #1a202c, #2d3748);
            color: white;
            min-height: 100vh;
            padding: 2rem;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        .exercise-header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem;
            background: rgba(59, 130, 246, 0.1);
            border-radius: 16px;
            border: 2px solid rgba(59, 130, 246, 0.3);
        }
        
        .question {
            background: rgba(255, 255, 255, 0.05);
            padding: 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
        }
        
        textarea, input {
            width: 100%;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            font-family: inherit;
        }
        
        .submit-btn {
            background: linear-gradient(135deg, #3b82f6, #10b981);
            color: white;
            border: none;
            padding: 1.25rem 3rem;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 2rem;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(59, 130, 246, 0.6);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="exercise-header">
            <h1>✨ تمرين مخصص</h1>
            <p>صمم تمرينك بالضبط زي ما تحب!</p>
        </div>
        
        <!-- هنا حط التمرين بتاعك براحتك تماماً -->
        <div class="question">
            <h3>السؤال الأول</h3>
            <textarea id="answer1" rows="5" placeholder="اكتب إجابتك..."></textarea>
        </div>
        
        <div class="question">
            <h3>السؤال الثاني</h3>
            <input type="text" id="answer2" placeholder="إجابتك...">
        </div>
        
        <button class="submit-btn" onclick="submitExercise()">
            ✅ إكمال التمرين
        </button>
    </div>
    
    <script>
        // ========================================
// 🔥 إعداد Firebase
// ========================================
const firebaseConfig = {
    apiKey: "AIzaSyD_vKtYDjyiXdY3brkUuz1Pc2F5K1KY4bg",
    authDomain: "awakingopp.firebaseapp.com",
    projectId: "awakingopp",
    storageBucket: "awakingopp.firebasestorage.app",
    messagingSenderId: "884050120823",
    appId: "1:884050120823:web:eba2cfea832fc3dda1d72b",
    measurementId: "G-YG75QF02SG"
};

// تهيئة Firebase
if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}

const db = firebase.firestore();
const auth = firebase.auth();

console.log('✅ Firebase initialized');
        
        // ========================================
// 📦 استخراج المعلومات من الـ URL
// ========================================
const urlParams = new URLSearchParams(window.location.search);
const exerciseId = urlParams.get('exerciseId');
const userId = urlParams.get('userId');
const courseId = urlParams.get('courseId');

console.log('📋 معلومات التمرين:');
console.log('🎯 Exercise ID:', exerciseId);
console.log('👤 User ID:', userId);
console.log('📚 Course ID:', courseId);

// التحقق من وجود البيانات
if (!exerciseId || !userId || !courseId) {
    console.error('❌ بيانات ناقصة في الرابط');
    alert('⚠️ خطأ: بيانات التمرين غير مكتملة في الرابط');
}

        // ========================================
// 🔍 فحص حالة إكمال التمرين من Firebase
// ========================================
async function checkExerciseStatus() {
    try {
        console.log('🔍 جاري فحص حالة التمرين...');
        
        if (!userId || !courseId || !exerciseId) {
            console.log('⚠️ لا يمكن الفحص - بيانات ناقصة');
            return { completed: false, draft: false, answers: {} };
        }

        const progressDoc = await db.collection('users')
            .doc(userId)
            .collection('awakening_progress')
            .doc(courseId)
            .get();

        if (!progressDoc.exists) {
            console.log('📝 لا توجد بيانات سابقة');
            return { completed: false, draft: false, answers: {} };
        }

        const data = progressDoc.data();
        const exerciseKey = `exercises.${exerciseId}`;
        const exerciseData = data[exerciseKey];

        if (!exerciseData) {
            console.log('📝 التمرين لم يتم حله من قبل');
            return { completed: false, draft: false, answers: {} };
        }

        const isCompleted = exerciseData.completed === true;
        const isDraft = exerciseData.draft === true && !isCompleted;
        const savedAnswers = exerciseData.answers || {};

        console.log('📊 حالة التمرين:', {
            completed: isCompleted,
            draft: isDraft,
            answersCount: Object.keys(savedAnswers).length
        });

        return {
            completed: isCompleted,
            draft: isDraft,
            answers: savedAnswers
        };

    } catch (error) {
        console.error('❌ خطأ في فحص الحالة:', error);
        return { completed: false, draft: false, answers: {} };
    }
}

        // ========================================
// 🛡️ متغير منع التنفيذ المتكرر
// ========================================
let isSubmitting = false;

        // ========================================
// 🎨 تحميل البيانات المحفوظة عند فتح الصفحة
// ========================================
async function loadSavedData() {
    try {
        console.log('🔄 جاري تحميل البيانات المحفوظة...');
        
        const status = await checkExerciseStatus();
        
        // تحديث واجهة الحالة
        const header = document.querySelector('.exercise-header');
        if (!header) return;
        
        if (status.completed) {
            // عرض شارة الإكمال
            const badge = document.createElement('div');
            badge.style.cssText = `
                background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(5, 150, 105, 0.1));
                padding: 1rem 1.5rem;
                border-radius: 12px;
                border: 2px solid rgba(16, 185, 129, 0.4);
                margin-top: 1rem;
                text-align: center;
            `;
            badge.innerHTML = `
                <i class="fas fa-check-circle" style="color: #10b981; font-size: 1.2rem;"></i>
                <span style="color: #10b981; font-weight: 600; margin-right: 0.5rem;">
                    ✅ تم إكمال هذا التمرين مسبقاً
                </span>
            `;
            header.appendChild(badge);
            
            console.log('✅ تم إكمال التمرين من قبل');
            
        } else if (status.draft) {
            // عرض شارة المسودة
            const badge = document.createElement('div');
            badge.style.cssText = `
                background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(217, 119, 6, 0.1));
                padding: 1rem 1.5rem;
                border-radius: 12px;
                border: 2px solid rgba(245, 158, 11, 0.4);
                margin-top: 1rem;
                text-align: center;
            `;
            badge.innerHTML = `
                <i class="fas fa-clock" style="color: #f59e0b; font-size: 1.2rem;"></i>
                <span style="color: #f59e0b; font-weight: 600; margin-right: 0.5rem;">
                    📝 لديك مسودة محفوظة - تم تحميل إجاباتك
                </span>
            `;
            header.appendChild(badge);
            
            console.log('📝 يوجد مسودة محفوظة');
        }
        
        // تحميل الإجابات المحفوظة
        if (status.answers && Object.keys(status.answers).length > 0) {
            console.log('📥 تحميل الإجابات:', status.answers);
            
            // تحميل answer1
            if (status.answers.answer1) {
                const answer1 = document.getElementById('answer1');
                if (answer1) {
                    answer1.value = status.answers.answer1;
                    console.log('✅ تم تحميل answer1');
                }
            }
            
            // تحميل answer2
            if (status.answers.answer2) {
                const answer2 = document.getElementById('answer2');
                if (answer2) {
                    answer2.value = status.answers.answer2;
                    console.log('✅ تم تحميل answer2');
                }
            }
        }
        
        // تعديل الزرار بناءً على الحالة
        updateSubmitButton(status.completed);
        
    } catch (error) {
        console.error('❌ خطأ في تحميل البيانات:', error);
    }
}

// ========================================
// 🔄 تعديل شكل زرار الإكمال
// ========================================
function updateSubmitButton(isCompleted) {
    const submitBtn = document.querySelector('.submit-btn');
    if (!submitBtn) return;
    
    if (isCompleted) {
        submitBtn.style.background = 'linear-gradient(135deg, #f59e0b, #d97706)';
        submitBtn.innerHTML = '✏️ تعديل الإجابات';
        submitBtn.onclick = updateExercise;
    } else {
        submitBtn.innerHTML = '✅ إكمال التمرين';
        submitBtn.onclick = submitExercise;
    }
}
        // دالة إرسال التمرين
        function submitExercise() {
            // جمع الإجابات
            const answers = {
                answer1: document.getElementById('answer1').value,
                answer2: document.getElementById('answer2').value
            };
            
            // إرسال رسالة للصفحة الأم
            window.parent.postMessage({
                type: 'exercise-completed',
                data: {
                    exerciseId: exerciseId,
                    userId: userId,
                    answers: answers,
                    customData: {
                        completedAt: new Date().toISOString()
                    }
                }
            }, '*');
            
            // رسالة نجاح
            alert('✅ تم إكمال التمرين بنجاح!');
        }

        // ========================================
// 🚀 تشغيل عند تحميل الصفحة
// ========================================
window.addEventListener('DOMContentLoaded', () => {
    console.log('🎬 الصفحة جاهزة - بدء التحميل...');
    
    // انتظار تهيئة Firebase ثم تحميل البيانات
    setTimeout(() => {
        loadSavedData();
    }, 1000);
});
    </script>
</body>
</html>
