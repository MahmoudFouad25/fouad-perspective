<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة الملخص - منظور الفؤاد</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            min-height: 100vh;
            padding: 2rem;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .loading {
            text-align: center;
            padding: 4rem 2rem;
            font-size: 1.5rem;
            color: #60a5fa;
        }
        
        .error {
            background: rgba(239, 68, 68, 0.2);
            border: 2px solid #ef4444;
            padding: 2rem;
            border-radius: 16px;
            text-align: center;
        }
        
        .summary-container {
            background: rgba(0, 0, 0, 0.3);
            padding: 3rem;
            border-radius: 20px;
            border: 2px solid rgba(96, 165, 250, 0.3);
        }
        
        h1 {
            color: #60a5fa;
            font-size: 2.5rem;
            margin-bottom: 2rem;
            text-align: center;
        }
        
        .tri-type {
            background: linear-gradient(135deg, rgba(96, 165, 250, 0.2), rgba(59, 130, 246, 0.1));
            padding: 2rem;
            border-radius: 16px;
            margin-bottom: 2rem;
            border: 2px solid rgba(96, 165, 250, 0.4);
        }
        
        .tri-type h2 {
            color: #93c5fd;
            margin-bottom: 1rem;
        }
        
        .type-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 1.5rem;
            border-radius: 12px;
            margin: 1rem 0;
            border-right: 4px solid;
        }
        
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }
        
        .module-result {
            background: rgba(255, 255, 255, 0.05);
            padding: 2rem;
            border-radius: 16px;
            border: 2px solid rgba(96, 165, 250, 0.2);
        }
        
        .module-result h3 {
            color: #60a5fa;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loadingMessage" class="loading">
            ⏳ جاري تحميل نتائجك...
        </div>
        
        <div id="errorMessage" class="error" style="display: none;">
            ❌ حدث خطأ في تحميل البيانات
        </div>
        
        <div id="summaryContent" style="display: none;">
            <!-- سيتم ملء المحتوى هنا -->
        </div>
    </div>
    
    <script>
        // Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyASEcSKf92Y47KOT02hhhr6tSKGL5yNHb0",
            authDomain: "fouad-perspective.firebaseapp.com",
            projectId: "fouad-perspective",
            storageBucket: "fouad-perspective.firebasestorage.app",
            messagingSenderId: "278550104805",
            appId: "1:278550104805:web:0db6f2b42e9a8ee5d40cda",
            measurementId: "G-G67TT80RDM"
        };
        
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        // استخراج البيانات من URL
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');
        const courseId = urlParams.get('courseId');
        
        console.log('📊 User ID:', userId);
        console.log('📚 Course ID:', courseId);
        
        // IDs المحطات الثلاثة
        const moduleIds = {
            module1: 'vJOTuqHemAOVytfSZ3A0',
            module2: 'of0saBAUgUDnZGZyDR83',
            module3: 'x2Zd9X1fZVKupfXlxWXq'
        };
        
        // دالة حساب النتائج من الإجابات
        function calculateResultsFromAnswers(answers) {
            let scores = {
                type1: 0, type2: 0, type3: 0,
                type4: 0, type5: 0, type6: 0,
                type7: 0, type8: 0, type9: 0
            };
            
            // المحطة 1: دافع الهمة والعزيمة
            for (let q = 1; q <= 8; q++) {
                scores.type1 += answers.module1[q].a;
                scores.type8 += answers.module1[q].b;
                scores.type9 += answers.module1[q].c;
            }
            
            // المحطة 2: دافع الأنس والقرب
            for (let q = 1; q <= 8; q++) {
                scores.type2 += answers.module2[q].a;
                scores.type3 += answers.module2[q].b;
                scores.type4 += answers.module2[q].c;
            }
            
            // المحطة 3: دافع اليقين والبيان
            for (let q = 1; q <= 8; q++) {
                scores.type5 += answers.module3[q].a;
                scores.type6 += answers.module3[q].b;
                scores.type7 += answers.module3[q].c;
            }
            
            // حساب النسب المئوية
            const maxScore = 56;
            const percentages = {};
            for (const [type, score] of Object.entries(scores)) {
                percentages[type] = Math.round((score / maxScore) * 100);
            }
            
            return { scores, percentages };
        }
        
        // دالة تحديد الـ tri-type
        function calculateTriType(percentages) {
            // ترتيب الطبائع حسب النسبة
            const sorted = Object.entries(percentages)
                .sort((a, b) => b[1] - a[1]);
            
            // أعلى 3 طبائع
            return sorted.slice(0, 3).map(([type, pct]) => ({
                type: type,
                percentage: pct
            }));
        }
        
        // تحميل البيانات
        async function loadSummaryData() {
            try {
                console.log('🔍 جلب البيانات من Firebase...');
                
                const docRef = db.collection('users')
                    .doc(userId)
                    .collection('awakening_progress')
                    .doc(courseId);
                
                const doc = await docRef.get();
                
                if (!doc.exists) {
                    throw new Error('لا توجد بيانات محفوظة');
                }
                
                const data = doc.data();
                console.log('✅ البيانات:', data);
                
                // جلب الإجابات للمحطات الثلاثة
                const answers = {
                    module1: data[`exercises.${moduleIds.module1}`]?.answers,
                    module2: data[`exercises.${moduleIds.module2}`]?.answers,
                    module3: data[`exercises.${moduleIds.module3}`]?.answers
                };
                
                console.log('📝 الإجابات:', answers);
                
                // التحقق من اكتمال المحطات الثلاثة
                if (!answers.module1 || !answers.module2 || !answers.module3) {
                    throw new Error('لم تكمل المحطات الثلاثة بعد');
                }
                
                // حساب النتائج
                const results = calculateResultsFromAnswers(answers);
                console.log('📊 النتائج:', results);
                
                // حساب الـ tri-type
                const triType = calculateTriType(results.percentages);
                console.log('🎯 Tri-Type:', triType);
                
                // عرض النتائج
                displayResults(results, triType);
                
            } catch (error) {
                console.error('❌ خطأ:', error);
                document.getElementById('loadingMessage').style.display = 'none';
                document.getElementById('errorMessage').style.display = 'block';
                document.getElementById('errorMessage').textContent = `❌ ${error.message}`;
            }
        }
        
        // عرض النتائج
        function displayResults(results, triType) {
            const typeNames = {
                type1: '🎯 المُحسِّن المُتقِن',
                type2: '💝 العطوف المُعطي',
                type3: '🏆 الناجح المُنجِز',
                type4: '🎭 الحالم العميق',
                type5: '🔍 المُفكّر المُتأمل',
                type6: '⚠️ الحذر المُستعد',
                type7: '🎈 المُتفائل المُتحمس',
                type8: '💪 القوي المؤثر',
                type9: '🕊️ الوسيط الهادئ'
            };
            
            const html = `
                <div class="summary-container">
                    <h1>🎉 نتائج تقييمك الشامل</h1>
                    
                    <div class="tri-type">
                        <h2>✨ طبعك الثلاثي (Tri-Type):</h2>
                        ${triType.map((t, i) => `
                            <div class="type-card" style="border-right-color: ${i === 0 ? '#60a5fa' : i === 1 ? '#93c5fd' : '#bfdbfe'}">
                                <h3>${i + 1}. ${typeNames[t.type]}</h3>
                                <p style="color: rgba(255,255,255,0.8); font-size: 1.2rem;">${t.percentage}%</p>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="results-grid">
                        ${Object.entries(results.percentages).sort((a, b) => b[1] - a[1]).map(([type, pct]) => `
                            <div class="module-result">
                                <h3>${typeNames[type]}</h3>
                                <p style="font-size: 2rem; color: #60a5fa;">${pct}%</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            
            document.getElementById('loadingMessage').style.display = 'none';
            document.getElementById('summaryContent').style.display = 'block';
            document.getElementById('summaryContent').innerHTML = html;
        }
        
        // تحميل البيانات عند فتح الصفحة
        loadSummaryData();
    </script>
</body>
</html>
