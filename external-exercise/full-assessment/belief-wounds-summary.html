<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملخص الجروح الثلاثة</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            min-height: 100vh;
            padding: 2rem 1rem;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(239, 68, 68, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(59, 130, 246, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        
        /* Header */
        .header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 3rem 2rem;
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(168, 85, 247, 0.15));
            border-radius: 24px;
            border: 3px solid rgba(239, 68, 68, 0.4);
            box-shadow: 0 10px 40px rgba(239, 68, 68, 0.3);
        }
        
        .header h1 {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ef4444, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }
        
        .header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1rem;
            line-height: 1.6;
        }
        
        /* Loading */
        .loading {
            text-align: center;
            padding: 4rem 2rem;
        }
        
        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #ef4444;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Section */
        .section {
            background: rgba(30, 41, 59, 0.5);
            border-radius: 20px;
            padding: 2.5rem;
            margin-bottom: 3rem;
            border: 2px solid rgba(239, 68, 68, 0.2);
        }
        
        .section h2 {
            font-size: 1.8rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            color: #fca5a5;
        }
        
        /* Wound Cards - Primary Wounds */
        .wounds-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }
        
        .wound-card {
            background: rgba(30, 41, 59, 0.7);
            padding: 2rem;
            border-radius: 16px;
            border: 2px solid rgba(239, 68, 68, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .wound-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #ef4444, #a855f7);
        }
        
        .wound-card:hover {
            transform: translateY(-5px);
            border-color: rgba(239, 68, 68, 0.6);
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.4);
        }
        
        .wound-module {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 0.5rem;
        }
        
        .wound-number {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ef4444, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        
        .wound-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 1rem;
            line-height: 1.4;
        }
        
        .wound-score {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ef4444;
            margin-bottom: 0.3rem;
        }
        
        .wound-raw {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
        }
        
        /* Ranking */
        .rank-item {
            background: rgba(30, 41, 59, 0.7);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            border-right: 4px solid rgba(239, 68, 68, 0.5);
            display: flex;
            align-items: center;
            gap: 1.5rem;
            transition: all 0.3s ease;
        }
        
        .rank-item:hover {
            background: rgba(30, 41, 59, 0.9);
            transform: translateX(-5px);
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.3);
        }
        
        .rank-item.rank-1 { border-right-color: #fbbf24; box-shadow: 0 0 20px rgba(251, 191, 36, 0.3); }
        .rank-item.rank-2 { border-right-color: #94a3b8; }
        .rank-item.rank-3 { border-right-color: #cd7f32; }
        
        .rank-number {
            font-size: 1.8rem;
            font-weight: 900;
            min-width: 50px;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .rank-item.rank-1 .rank-number { color: #fbbf24; }
        .rank-item.rank-2 .rank-number { color: #94a3b8; }
        .rank-item.rank-3 .rank-number { color: #cd7f32; }
        
        .rank-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        
        .rank-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        
        .type-badge-rank {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.3), rgba(168, 85, 247, 0.3));
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-weight: 700;
            font-size: 1.1rem;
            border: 2px solid rgba(239, 68, 68, 0.4);
        }
        
        .rank-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            flex: 1;
        }
        
        .module-mini {
            padding: 0.3rem 0.8rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
        }
        
        .rank-bar-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            height: 30px;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }
        
        .rank-bar {
            height: 100%;
            background: linear-gradient(90deg, #ef4444, #a855f7);
            border-radius: 15px;
            transition: width 0.8s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 1rem;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
        }
        
        .rank-score {
            color: white;
            font-weight: 700;
            font-size: 0.95rem;
        }
        
        /* Advice */
        .advice-box {
            background: rgba(239, 68, 68, 0.1);
            padding: 2rem;
            border-radius: 16px;
            border-right: 4px solid #ef4444;
            margin-bottom: 2rem;
            line-height: 1.8;
        }
        
        .advice-box h3 {
            color: #fca5a5;
            font-size: 1.3rem;
            margin-bottom: 1rem;
        }
        
        .advice-box p {
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 1rem;
        }
        
        .advice-box ul {
            padding-right: 2rem;
        }
        
        .advice-box li {
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 0.8rem;
        }
        
        /* Special Advice */
        .special-advice {
            background: rgba(168, 85, 247, 0.1);
            padding: 2.5rem;
            border-radius: 16px;
            border: 2px solid rgba(168, 85, 247, 0.4);
            margin-top: 2rem;
        }
        
        .special-advice h3 {
            color: #c084fc;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .special-advice h4 {
            color: #e9d5ff;
            font-size: 1.2rem;
            margin: 1.5rem 0 1rem;
        }
        
        .special-advice p {
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.8;
            margin-bottom: 1rem;
        }
        
        .special-advice ul {
            padding-right: 2rem;
        }
        
        .special-advice li {
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 0.8rem;
            line-height: 1.6;
        }
        
        /* Next Button */
        .next-button {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border: none;
            padding: 1.2rem 3rem;
            border-radius: 16px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4);
            font-family: 'Tajawal', sans-serif;
            display: block;
            margin: 3rem auto 0;
        }
        
        .next-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(239, 68, 68, 0.6);
        }
        
        /* Info Note */
        .info-note {
            background: rgba(251, 191, 36, 0.1);
            padding: 1.5rem;
            border-radius: 12px;
            border-right: 3px solid #fbbf24;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-top: 1.5rem;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }
            
            .header h1 {
                font-size: 1.8rem;
            }
            
            .wounds-grid {
                grid-template-columns: 1fr;
            }
            
            .rank-item {
                flex-direction: column;
                text-align: center;
            }
            
            .rank-info {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>💔 ملخص الجروح الثلاثة</h1>
            <p>الجروح العميقة - من فين جاء الألم؟ وإزاي بتحمي نفسك منه؟</p>
        </div>
        
        <!-- Loading -->
        <div class="loading" id="loadingSection">
            <div class="loading-spinner"></div>
            <p>جاري تحميل نتائجك...</p>
        </div>
        
        <!-- Main Content -->
        <div id="mainContent" style="display: none;">
            <!-- Primary Wounds Section -->
            <div class="section" id="primaryWoundsSection">
                <h2>🎯 جروحك الثلاثة الرئيسية</h2>
                <p style="color: rgba(255, 255, 255, 0.8); margin-bottom: 2rem; line-height: 1.8;">
                    أقوى جرح من كل محطة - الجروح الثلاثة الأكثر تأثيراً في حياتك
                </p>
                <div id="primaryWoundsContent"></div>
            </div>
            
            <!-- Strongest Wound Section -->
            <div class="section" id="strongestWoundSection">
                <h2>⭐ جرحك الأقوى</h2>
                <div id="strongestWoundContent"></div>
            </div>
            
            <!-- Ranking Section -->
            <div class="section" id="rankingSection">
                <h2>📊 ترتيب الجروح التسعة الكامل</h2>
                <p style="color: rgba(255, 255, 255, 0.8); margin-bottom: 2rem; line-height: 1.8;">
                    ترتيب جميع الجروح التسعة حسب قوة كل جرح عندك
                </p>
                <div id="rankingContent"></div>
            </div>
            
            <!-- Personal Advice -->
            <div class="section" id="adviceSection">
                <h2>💡 نصائح شخصية لك</h2>
                <div id="adviceContent"></div>
            </div>
            
            <!-- Special Advice for High Scorers -->
            <div id="specialAdviceSection"></div>
            
            <!-- Next Button -->
            <button class="next-button" onclick="goToNextComponent()">
                ➡️ انتقل للمكون التالي
            </button>
        </div>
    </div>
    
    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDkpewiOKLW_9Se5BhULlNFOPorezSM9Fo",
            authDomain: "fouad-perspective.firebaseapp.com",
            projectId: "fouad-perspective",
            storageBucket: "fouad-perspective.firebasestorage.app",
            messagingSenderId: "858286757338",
            appId: "1:858286757338:web:772beb67805706fdeeda9d",
            measurementId: "G-3RTSD9MSMB"
        };
        
        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');
        const courseId = urlParams.get('courseId');
        
        // Module IDs
        const moduleIds = {
            module19: 'XT5AH4rRUtg4k2Jw0dNR',  // الجرح الأول - الاحتياج والعلاقات
            module20: '8Db4d3vjC46YDYp5K2b4',  // الجرح الثاني - الاتصال والهوية
            module21: 'LMrMgwrmu7Ujf2Wl2USG'   // الجرح الثالث - الإحباط والإرادة
        };
        
        // Wound information
        const woundInfo = {
            // Module 19 - الاحتياج والعلاقات
            '2': { name: 'العطاء بدل الطلب', icon: '💚', module: 'المحطة 19', moduleName: 'الاحتياج والعلاقات' },
            '5': { name: 'الانسحاب بدل الاتصال', icon: '🔵', module: 'المحطة 19', moduleName: 'الاحتياج والعلاقات' },
            '8': { name: 'القوة بدل الضعف', icon: '🔴', module: 'المحطة 19', moduleName: 'الاحتياج والعلاقات' },
            // Module 20 - الاتصال والهوية
            '3': { name: 'الصورة بدل الذات', icon: '🏆', module: 'المحطة 20', moduleName: 'الاتصال والهوية' },
            '6': { name: 'الانتماء بدل الثقة', icon: '🛡️', module: 'المحطة 20', moduleName: 'الاتصال والهوية' },
            '9': { name: 'الاختفاء بدل الظهور', icon: '☮️', module: 'المحطة 20', moduleName: 'الاتصال والهوية' },
            // Module 21 - الإحباط والإرادة
            '1': { name: 'التصحيح بدل القبول', icon: '⚖️', module: 'المحطة 21', moduleName: 'الإحباط والإرادة' },
            '4': { name: 'البحث بدل القبول', icon: '🌊', module: 'المحطة 21', moduleName: 'الإحباط والإرادة' },
            '7': { name: 'الهروب بدل المواجهة', icon: '✨', module: 'المحطة 21', moduleName: 'الإحباط والإرادة' }
        };
        
        // Main function
        async function loadAndDisplayResults() {
            try {
                if (!userId || !courseId) {
                    throw new Error('معلومات المستخدم غير موجودة');
                }
                
                console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
                console.log('🔍 جلب بيانات محطات الجروح');
                console.log('👤 User:', userId);
                console.log('📚 Course:', courseId);
                console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
                
                // Fetch data from all three modules
                let [module19Data, module20Data, module21Data] = await Promise.all([
                    getModuleData(moduleIds.module19),
                    getModuleData(moduleIds.module20),
                    getModuleData(moduleIds.module21)
                ]);
                
                // Check if any module is missing
                const missingModules = [];
                if (!module19Data) missingModules.push('المحطة 19 (الاحتياج والعلاقات)');
                if (!module20Data) missingModules.push('المحطة 20 (الاتصال والهوية)');
                if (!module21Data) missingModules.push('المحطة 21 (الإحباط والإرادة)');
                
                if (missingModules.length > 0) {
                    throw new Error(`لم تكمل المحطات التالية بعد: ${missingModules.join('، ')}. يجب إكمال جميع المحطات لعرض النتائج.`);
                }
                
                console.log('✅ تم جلب جميع البيانات بنجاح');
                
                // Calculate results
                const results = calculateResults(module19Data, module20Data, module21Data);
                console.log('✅ تم حساب النتائج:', results);
                console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
                
                // Display results
                displayPrimaryWounds(results.primaryWounds);
                displayStrongestWound(results.strongestWound);
                displayRanking(results.allWounds);
                displayAdvice(results.primaryWounds);
                displaySpecialAdvice(results.allWounds);
                
                // Hide loading, show content
                document.getElementById('loadingSection').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                
            } catch (error) {
                console.error('❌ Error:', error);
                document.getElementById('loadingSection').innerHTML = `
                    <p style="color: #ef4444; font-size: 1.2rem;">⚠️ حدث خطأ في تحميل النتائج</p>
                    <p style="color: rgba(255, 255, 255, 0.7); margin-top: 1rem;">${error.message}</p>
                `;
            }
        }
        
        // Get module data
        async function getModuleData(exerciseId) {
            console.log(`🔍 محاولة جلب بيانات: ${exerciseId}`);
            
            const docRef = db.collection('users')
                .doc(userId)
                .collection('awakening_progress')
                .doc(courseId);
            
            const doc = await docRef.get();
            
            if (!doc.exists) {
                console.log(`   ❌ المستند غير موجود`);
                return null;
            }
            
            const data = doc.data();
            const exerciseData = data[`exercises.${exerciseId}`];
            
            if (!exerciseData || !exerciseData.answers) {
                console.log(`   ❌ البيانات غير مكتملة`);
                return null;
            }
            
            console.log(`   ✅ تم جلب الإجابات`);
            
            const answers = exerciseData.answers;
            let scores = { a: 0, b: 0, c: 0 };
            let questionCount = 0;
            
            for (let i = 1; i <= 20; i++) {
                if (answers[i]) {
                    questionCount++;
                    scores.a += answers[i].a || 0;
                    scores.b += answers[i].b || 0;
                    scores.c += answers[i].c || 0;
                }
            }
            
            const maxScore = questionCount * 7;
            const percentages = {
                a: Math.round((scores.a / maxScore) * 100),
                b: Math.round((scores.b / maxScore) * 100),
                c: Math.round((scores.c / maxScore) * 100)
            };
            
            console.log(`   📊 Scores:`, scores);
            console.log(`   📊 Percentages:`, percentages);
            
            return { scores, percentages, maxScore };
        }
        
        // Calculate results
        function calculateResults(module19, module20, module21) {
            const maxScore = 56; // 8 questions × 7 points
            
            const allWounds = [
                // Module 19
                { type: '2', score: module19.scores.a, percentage: module19.percentages.a, maxScore },
                { type: '5', score: module19.scores.b, percentage: module19.percentages.b, maxScore },
                { type: '8', score: module19.scores.c, percentage: module19.percentages.c, maxScore },
                // Module 20
                { type: '3', score: module20.scores.a, percentage: module20.percentages.a, maxScore },
                { type: '6', score: module20.scores.b, percentage: module20.percentages.b, maxScore },
                { type: '9', score: module20.scores.c, percentage: module20.percentages.c, maxScore },
                // Module 21
                { type: '1', score: module21.scores.a, percentage: module21.percentages.a, maxScore },
                { type: '4', score: module21.scores.b, percentage: module21.percentages.b, maxScore },
                { type: '7', score: module21.scores.c, percentage: module21.percentages.c, maxScore }
            ];
            
            // Sort by percentage
            allWounds.sort((a, b) => b.percentage - a.percentage);
            
            // Get primary wounds (top from each module)
            const module19Wounds = allWounds.filter(w => ['2', '5', '8'].includes(w.type));
            const module20Wounds = allWounds.filter(w => ['3', '6', '9'].includes(w.type));
            const module21Wounds = allWounds.filter(w => ['1', '4', '7'].includes(w.type));
            
            const primaryWounds = [
                module19Wounds[0],
                module20Wounds[0],
                module21Wounds[0]
            ].sort((a, b) => b.percentage - a.percentage);
            
            const strongestWound = allWounds[0];
            
            return {
                allWounds,
                primaryWounds,
                strongestWound
            };
        }
        
        // Display primary wounds
        function displayPrimaryWounds(primaryWounds) {
            const html = `
                <div class="wounds-grid">
                    ${primaryWounds.map(wound => {
                        const info = woundInfo[wound.type];
                        return `
                            <div class="wound-card">
                                <div class="wound-module">${info.module}: ${info.moduleName}</div>
                                <div class="wound-number">${info.icon} ${wound.type}</div>
                                <div class="wound-name">${info.name}</div>
                                <div class="wound-score">${wound.percentage}%</div>
                                <div class="wound-raw">${wound.score}/${wound.maxScore}</div>
                            </div>
                        `;
