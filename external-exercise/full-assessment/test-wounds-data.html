<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فحص بيانات الجروح</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            color: white;
            padding: 2rem;
            line-height: 1.8;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(30, 41, 59, 0.8);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        
        h1 {
            color: #3b82f6;
            margin-bottom: 2rem;
            text-align: center;
            font-size: 2rem;
        }
        
        .input-section {
            background: rgba(59, 130, 246, 0.1);
            padding: 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            border: 2px solid rgba(59, 130, 246, 0.3);
        }
        
        .input-group {
            margin-bottom: 1.5rem;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #10b981;
            font-weight: 700;
        }
        
        .input-group input {
            width: 100%;
            padding: 0.8rem;
            border-radius: 8px;
            border: 2px solid rgba(59, 130, 246, 0.3);
            background: rgba(15, 23, 42, 0.8);
            color: white;
            font-family: 'Tajawal', sans-serif;
            font-size: 1rem;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        
        .btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
        }
        
        .module-section {
            background: rgba(59, 130, 246, 0.1);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            border-right: 4px solid #3b82f6;
        }
        
        .module-section h2 {
            color: #10b981;
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }
        
        .module-section h3 {
            color: #fbbf24;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
        }
        
        pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 0.9rem;
        }
        
        .loading {
            text-align: center;
            padding: 3rem;
            font-size: 1.2rem;
            display: none;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            padding: 1rem;
            border-radius: 8px;
            border-right: 4px solid #ef4444;
        }
        
        .success {
            color: #10b981;
            font-weight: 700;
        }
        
        .info {
            background: rgba(251, 191, 36, 0.1);
            padding: 1rem;
            border-radius: 8px;
            border-right: 3px solid #fbbf24;
            margin-bottom: 1.5rem;
            color: rgba(255, 255, 255, 0.9);
        }
        
        ul {
            padding-right: 2rem;
        }
        
        li {
            margin-bottom: 0.5rem;
        }
        
        #results {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 فحص بيانات الجروح الثلاثة</h1>
        
        <div class="input-section" id="inputSection">
            <div class="info">
                💡 <strong>ملحوظة:</strong> لو مش عارف الـ userId، اتركه فاضي وهيجيب كل المستخدمين اللي حلوا المحطات.
            </div>
            
            <div class="input-group">
                <label>👤 User ID (اختياري):</label>
                <input type="text" id="userIdInput" placeholder="اترك فاضي لعرض جميع المستخدمين">
            </div>
            
            <div class="input-group">
                <label>📚 Course ID:</label>
                <input type="text" id="courseIdInput" value="adam-journey">
            </div>
            
            <button class="btn" onclick="fetchData()">🔍 جلب البيانات</button>
        </div>
        
        <div class="loading" id="loading">
            <div class="loading-spinner"></div>
            <p>جاري جلب البيانات من Firebase...</p>
        </div>
        
        <div id="results"></div>
    </div>
    
    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDkpewiOKLW_9Se5BhULlNFOPorezSM9Fo",
            authDomain: "fouad-perspective.firebaseapp.com",
            projectId: "fouad-perspective",
            storageBucket: "fouad-perspective.firebasestorage.app",
            messagingSenderId: "858286757338",
            appId: "1:858286757338:web:772beb67805706fdeeda9d",
            measurementId: "G-3RTSD9MSMB"
        };
        
        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        
        // Module IDs للجروح
        const moduleIds = {
            module19: 'XT5AH4rRUtg4k2Jw0dNR',  // الجرح الأول - الاحتياج والعلاقات
            module20: '8Db4d3vjC46YDYp5K2b4',  // الجرح الثاني - الاتصال والهوية
            module21: 'LMrMgwrmu7Ujf2Wl2USG'   // الجرح الثالث - الإحباط والإرادة
        };
        
        async function fetchData() {
            const userId = document.getElementById('userIdInput').value.trim();
            const courseId = document.getElementById('courseIdInput').value.trim();
            
            const resultsDiv = document.getElementById('results');
            const loadingDiv = document.getElementById('loading');
            const inputSection = document.getElementById('inputSection');
            
            if (!courseId) {
                alert('يرجى إدخال Course ID');
                return;
            }
            
            try {
                inputSection.style.display = 'none';
                loadingDiv.style.display = 'block';
                resultsDiv.innerHTML = '';
                resultsDiv.style.display = 'none';
                
                console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
                console.log('🔍 جلب بيانات الجروح الثلاثة');
                console.log('👤 User:', userId || 'جميع المستخدمين');
                console.log('📚 Course:', courseId);
                console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
                
                let html = '';
                
                if (userId) {
                    // جلب بيانات مستخدم محدد
                    html = await fetchUserData(userId, courseId);
                } else {
                    // جلب بيانات جميع المستخدمين
                    html = await fetchAllUsersData(courseId);
                }
                
                loadingDiv.style.display = 'none';
                resultsDiv.style.display = 'block';
                resultsDiv.innerHTML = html;
                inputSection.style.display = 'block';
                
            } catch (error) {
                console.error('❌ خطأ:', error);
                loadingDiv.style.display = 'none';
                resultsDiv.style.display = 'block';
                resultsDiv.innerHTML = `<div class="error">❌ ${error.message}</div>`;
                inputSection.style.display = 'block';
            }
        }
        
        async function fetchUserData(userId, courseId) {
            const docRef = db.collection('users')
                .doc(userId)
                .collection('awakening_progress')
                .doc(courseId);
            
            const doc = await docRef.get();
            
            if (!doc.exists) {
                throw new Error('المستند غير موجود في Firebase');
            }
            
            const data = doc.data();
            return generateResultsHTML(data, userId);
        }
        
        async function fetchAllUsersData(courseId) {
            const usersSnapshot = await db.collection('users').get();
            
            let html = '<h2 style="color: #fbbf24; margin-bottom: 2rem;">📊 جميع المستخدمين:</h2>';
            let foundUsers = 0;
            
            for (const userDoc of usersSnapshot.docs) {
                const userId = userDoc.id;
                const progressRef = db.collection('users')
                    .doc(userId)
                    .collection('awakening_progress')
                    .doc(courseId);
                
                const progressDoc = await progressRef.get();
                
                if (progressDoc.exists) {
                    const data = progressDoc.data();
                    
                    // تحقق من وجود بيانات في أي من المحطات الثلاثة
                    const hasModule19 = data[`exercises.${moduleIds.module19}`]?.answers;
                    const hasModule20 = data[`exercises.${moduleIds.module20}`]?.answers;
                    const hasModule21 = data[`exercises.${moduleIds.module21}`]?.answers;
                    
                    if (hasModule19 || hasModule20 || hasModule21) {
                        foundUsers++;
                        html += `<div style="background: rgba(168, 85, 247, 0.1); padding: 1rem; border-radius: 8px; margin-bottom: 1rem;">`;
                        html += `<h3 style="color: #c084fc;">👤 User ID: ${userId}</h3>`;
                        html += `</div>`;
                        html += generateResultsHTML(data, userId);
                        html += '<hr style="border-color: rgba(59, 130, 246, 0.3); margin: 2rem 0;">';
                    }
                }
            }
            
            if (foundUsers === 0) {
                return '<div class="error">❌ لم يتم العثور على أي مستخدمين حلوا المحطات</div>';
            }
            
            return html;
        }
        
        function generateResultsHTML(data, userId) {
            let html = '';
            
            // فحص كل محطة
            for (const [key, moduleId] of Object.entries(moduleIds)) {
                const moduleName = key === 'module19' ? 'المحطة 19: الجرح الأول - الاحتياج والعلاقات' :
                                 key === 'module20' ? 'المحطة 20: الجرح الثاني - الاتصال والهوية' :
                                 'المحطة 21: الجرح الثالث - الإحباط والإرادة';
                
                const exerciseData = data[`exercises.${moduleId}`];
                
                html += `<div class="module-section">`;
                html += `<h2>📝 ${moduleName}</h2>`;
                html += `<p><strong>🆔 Module ID:</strong> ${moduleId}</p>`;
                
                if (!exerciseData) {
                    html += `<p class="error">❌ لا توجد بيانات - المحطة غير محلولة</p>`;
                } else if (!exerciseData.answers) {
                    html += `<p class="error">❌ لا توجد إجابات محفوظة</p>`;
                } else {
                    html += `<p class="success">✅ تم العثور على البيانات</p>`;
                    
                    // حساب النتائج
                    const answers = exerciseData.answers;
                    let typeA = 0, typeB = 0, typeC = 0;
                    let questionCount = 0;
                    
                    for (let i = 1; i <= 20; i++) {
                        if (answers[i]) {
                            questionCount++;
                            typeA += answers[i].a || 0;
                            typeB += answers[i].b || 0;
                            typeC += answers[i].c || 0;
                        }
                    }
                    
                    const maxScore = questionCount * 7;
                    
                    html += `<h3>📊 النتائج:</h3>`;
                    html += `<p><strong>عدد الأسئلة:</strong> ${questionCount}</p>`;
                    html += `<ul>`;
                    html += `<li><strong>النوع A:</strong> ${typeA}/${maxScore} = <strong>${Math.round((typeA/maxScore)*100)}%</strong></li>`;
                    html += `<li><strong>النوع B:</strong> ${typeB}/${maxScore} = <strong>${Math.round((typeB/maxScore)*100)}%</strong></li>`;
                    html += `<li><strong>النوع C:</strong> ${typeC}/${maxScore} = <strong>${Math.round((typeC/maxScore)*100)}%</strong></li>`;
                    html += `</ul>`;
                    
                    html += `<h3>🔍 مثال على إجابة (السؤال 1):</h3>`;
                    html += `<pre>${JSON.stringify(answers['1'], null, 2)}</pre>`;
                    
                    console.log(`\n📝 ${moduleName} (User: ${userId})`);
                    console.log(`   عدد الأسئلة: ${questionCount}`);
                    console.log(`   النوع A: ${typeA}/${maxScore} = ${Math.round((typeA/maxScore)*100)}%`);
                    console.log(`   النوع B: ${typeB}/${maxScore} = ${Math.round((typeB/maxScore)*100)}%`);
                    console.log(`   النوع C: ${typeC}/${maxScore} = ${Math.round((typeC/maxScore)*100)}%`);
                }
                
                html += `</div>`;
            }
            
            return html;
        }
    </script>
</body>
</html>
