<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فحص بيانات الجروح</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Tajawal', sans-serif;
            background: #0f172a;
            color: white;
            padding: 2rem;
            line-height: 1.8;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(30, 41, 59, 0.8);
            padding: 2rem;
            border-radius: 16px;
        }
        
        h1 {
            color: #3b82f6;
            margin-bottom: 2rem;
            text-align: center;
        }
        
        .module-section {
            background: rgba(59, 130, 246, 0.1);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            border-right: 4px solid #3b82f6;
        }
        
        .module-section h2 {
            color: #10b981;
            margin-bottom: 1rem;
        }
        
        pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .loading {
            text-align: center;
            padding: 3rem;
            font-size: 1.2rem;
        }
        
        .error {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            padding: 1rem;
            border-radius: 8px;
            border-right: 4px solid #ef4444;
        }
        
        .success {
            color: #10b981;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 فحص بيانات الجروح الثلاثة</h1>
        
        <div class="loading" id="loading">
            جاري جلب البيانات من Firebase...
        </div>
        
        <div id="results" style="display: none;"></div>
    </div>
    
    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDkpewiOKLW_9Se5BhULlNFOPorezSM9Fo",
            authDomain: "fouad-perspective.firebaseapp.com",
            projectId: "fouad-perspective",
            storageBucket: "fouad-perspective.firebasestorage.app",
            messagingSenderId: "858286757338",
            appId: "1:858286757338:web:772beb67805706fdeeda9d",
            measurementId: "G-3RTSD9MSMB"
        };
        
        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');
        const courseId = urlParams.get('courseId');
        
        // Module IDs للجروح
        const moduleIds = {
            module19: 'XT5AH4rRUtg4k2Jw0dNR',  // الجرح الأول - الاحتياج والعلاقات
            module20: '8Db4d3vjC46YDYp5K2b4',  // الجرح الثاني - الاتصال والهوية
            module21: 'LMrMgwrmu7Ujf2Wl2USG'   // الجرح الثالث - الإحباط والإرادة
        };
        
        async function fetchAndDisplayData() {
            const resultsDiv = document.getElementById('results');
            const loadingDiv = document.getElementById('loading');
            
            try {
                if (!userId || !courseId) {
                    throw new Error('يرجى إضافة userId و courseId في URL');
                }
                
                console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
                console.log('🔍 جلب بيانات الجروح الثلاثة');
                console.log('👤 User:', userId);
                console.log('📚 Course:', courseId);
                console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
                
                const docRef = db.collection('users')
                    .doc(userId)
                    .collection('awakening_progress')
                    .doc(courseId);
                
                const doc = await docRef.get();
                
                if (!doc.exists) {
                    throw new Error('المستند غير موجود في Firebase');
                }
                
                const data = doc.data();
                let html = '';
                
                // فحص كل محطة
                for (const [key, moduleId] of Object.entries(moduleIds)) {
                    const moduleName = key === 'module19' ? 'المحطة 19: الجرح الأول - الاحتياج والعلاقات' :
                                     key === 'module20' ? 'المحطة 20: الجرح الثاني - الاتصال والهوية' :
                                     'المحطة 21: الجرح الثالث - الإحباط والإرادة';
                    
                    const exerciseData = data[`exercises.${moduleId}`];
                    
                    html += `<div class="module-section">`;
                    html += `<h2>📝 ${moduleName}</h2>`;
                    html += `<p><strong>🆔 Module ID:</strong> ${moduleId}</p>`;
                    
                    if (!exerciseData) {
                        html += `<p class="error">❌ لا توجد بيانات - المحطة غير محلولة</p>`;
                    } else if (!exerciseData.answers) {
                        html += `<p class="error">❌ لا توجد إجابات محفوظة</p>`;
                        html += `<pre>${JSON.stringify(exerciseData, null, 2)}</pre>`;
                    } else {
                        html += `<p class="success">✅ تم العثور على البيانات</p>`;
                        
                        // حساب النتائج
                        const answers = exerciseData.answers;
                        let typeA = 0, typeB = 0, typeC = 0;
                        let questionCount = 0;
                        
                        for (let i = 1; i <= 20; i++) { // نفحص لحد 20 سؤال
                            if (answers[i]) {
                                questionCount++;
                                typeA += answers[i].a || 0;
                                typeB += answers[i].b || 0;
                                typeC += answers[i].c || 0;
                            }
                        }
                        
                        const maxScore = questionCount * 7;
                        
                        html += `<p><strong>📊 عدد الأسئلة:</strong> ${questionCount}</p>`;
                        html += `<p><strong>📊 النتائج:</strong></p>`;
                        html += `<ul>`;
                        html += `<li>النوع A: ${typeA}/${maxScore} = ${Math.round((typeA/maxScore)*100)}%</li>`;
                        html += `<li>النوع B: ${typeB}/${maxScore} = ${Math.round((typeB/maxScore)*100)}%</li>`;
                        html += `<li>النوع C: ${typeC}/${maxScore} = ${Math.round((typeC/maxScore)*100)}%</li>`;
                        html += `</ul>`;
                        
                        html += `<p><strong>🔍 مثال على سؤال (السؤال 1):</strong></p>`;
                        html += `<pre>${JSON.stringify(answers['1'], null, 2)}</pre>`;
                        
                        console.log(`\n📝 ${moduleName}`);
                        console.log(`   عدد الأسئلة: ${questionCount}`);
                        console.log(`   النوع A: ${typeA}/${maxScore} = ${Math.round((typeA/maxScore)*100)}%`);
                        console.log(`   النوع B: ${typeB}/${maxScore} = ${Math.round((typeB/maxScore)*100)}%`);
                        console.log(`   النوع C: ${typeC}/${maxScore} = ${Math.round((typeC/maxScore)*100)}%`);
                    }
                    
                    html += `</div>`;
                }
                
                console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
                
                loadingDiv.style.display = 'none';
                resultsDiv.style.display = 'block';
                resultsDiv.innerHTML = html;
                
            } catch (error) {
                console.error('❌ خطأ:', error);
                loadingDiv.style.display = 'none';
                resultsDiv.style.display = 'block';
                resultsDiv.innerHTML = `<div class="error">❌ ${error.message}</div>`;
            }
        }
        
        // Run on load
        window.addEventListener('load', fetchAndDisplayData);
    </script>
</body>
</html>
