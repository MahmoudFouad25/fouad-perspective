// دالة تحليل نقاط المستخدم
// دالة تحليل نقاط المستخدم - وفقاً للنظام الفعلي
function analyzeUserPoints(user) {
    const journeyPoints = user.journeyPoints || {};
    const walletPoints = user.walletPoints || {};
    
    // تحليل مفصل لنقاط المحتوى من السجل
    const contentPointsDetails = {
        achievement: 0,      // نقاط إنجاز الدروس
        bonus: 0,           // مكافأة الفهم
        participation: 0,    // مشاركة التعلم
        speed: 0,           // سرعة الإتقان
        doubleForFirst: 0   // مضاعفة الأوائل
    };
    
    // النقاط الإضافية
    const additionalPoints = {
        liveAttendance: 0,         // الحضور والتواجد الحي
        badges: 0,                 // نقاط الشارات
        communityEngagement: 0,     // التفاعل المجتمعي
        continuityTransformation: 0 // الاستمرارية والتحول
    };
    
    // تحليل السجل التفصيلي
    if (journeyPoints.history) {
        journeyPoints.history.forEach(entry => {
            // نقاط الدروس المفصلة
            if (entry.type === 'journey' && entry.details) {
                contentPointsDetails.achievement += entry.details.achievement || 0;
                contentPointsDetails.bonus += entry.details.bonus || 0;
                contentPointsDetails.participation += entry.details.participation || 0;
                contentPointsDetails.speed += entry.details.speed || 0;
                if (entry.details.doubleForFirst) {
                    // حساب المضاعفة
                    const basePoints = (entry.details.achievement || 0) + 
                                     (entry.details.bonus || 0) + 
                                     (entry.details.participation || 0) + 
                                     (entry.details.speed || 0);
                    contentPointsDetails.doubleForFirst += basePoints;
                }
            }
            // نقاط الحضور المباشر
            else if (entry.type === 'live_attendance' || entry.type === 'attendance') {
                additionalPoints.liveAttendance += entry.amount || 0;
            }
            // نقاط الشارات
            else if (entry.type === 'badge_reward') {
                additionalPoints.badges += entry.amount || 0;
            }
        });
    }
    
    // حساب مجموع نقاط المحتوى
    const totalContentPoints = contentPointsDetails.achievement + 
                              contentPointsDetails.bonus + 
                              contentPointsDetails.participation + 
                              contentPointsDetails.speed + 
                              contentPointsDetails.doubleForFirst;
    
    // حساب مجموع النقاط الإضافية
    const totalAdditionalPoints = additionalPoints.liveAttendance + 
                                 additionalPoints.badges + 
                                 additionalPoints.communityEngagement + 
                                 additionalPoints.continuityTransformation;
    
    return {
        journey: {
            balance: journeyPoints.balance || 0,
            lifetime: journeyPoints.lifetime || 0,
            history: journeyPoints.history || []
        },
        wallet: {
            balance: walletPoints.balance || 0,
            lifetime: walletPoints.lifetime || 0,
            history: walletPoints.history || []
        },
        contentPoints: contentPointsDetails,
        additionalPoints: additionalPoints,
        totalContent: totalContentPoints,
        totalAdditional: totalAdditionalPoints,
        total: journeyPoints.balance || 0 // النقاط الفعلية
    };
}

// دالة تحليل شارات المستخدم
function analyzeUserBadges(user) {
    const userBadges = user.badges || [];
    
    const badgeAnalysis = {
        total: userBadges.length,
        byType: {},
        byCourse: {},
        timeline: [],
        recent: []
    };
    
    // تصنيف الشارات
    userBadges.forEach(badge => {
        // حسب النوع
        const type = badge.type || 'other';
        if (!badgeAnalysis.byType[type]) {
            badgeAnalysis.byType[type] = [];
        }
        badgeAnalysis.byType[type].push(badge);
        
        // حسب الدورة
        if (badge.courseId) {
            if (!badgeAnalysis.byCourse[badge.courseId]) {
                badgeAnalysis.byCourse[badge.courseId] = [];
            }
            badgeAnalysis.byCourse[badge.courseId].push(badge);
        }
        
        // الجدول الزمني
        if (badge.awardedDate) {
            badgeAnalysis.timeline.push({
                date: badge.awardedDate,
                badge: badge
            });
        }
    });
    
    // ترتيب الجدول الزمني
    badgeAnalysis.timeline.sort((a, b) => new Date(b.date) - new Date(a.date));
    
    // آخر 5 شارات
    badgeAnalysis.recent = badgeAnalysis.timeline.slice(0, 5).map(item => item.badge);
    
    return badgeAnalysis;
}

// دالة تحليل دروس المستخدم
function analyzeUserLessons(user) {
    const lessonsAnalysis = {
        total: 0,
        byCourse: {},
        byModule: {},
        timeline: [],
        speed: {
            fast: 0,
            normal: 0,
            slow: 0
        }
    };
    
    // تحليل من سجل الإكمال
    allData.completionHistory.forEach(record => {
        if (record.userId === user.id) {
            lessonsAnalysis.total++;
            
            // حسب الدورة
            if (record.courseId) {
                if (!lessonsAnalysis.byCourse[record.courseId]) {
                    lessonsAnalysis.byCourse[record.courseId] = {
                        courseName: record.courseName,
                        lessons: [],
                        totalPoints: 0
                    };
                }
                lessonsAnalysis.byCourse[record.courseId].lessons.push(record);
                lessonsAnalysis.byCourse[record.courseId].totalPoints += record.pointsEarned || 0;
            }
            
            // حسب الوحدة
            const moduleKey = `${record.courseId}_${record.moduleIndex}`;
            if (!lessonsAnalysis.byModule[moduleKey]) {
                lessonsAnalysis.byModule[moduleKey] = {
                    moduleName: record.moduleName,
                    lessons: []
                };
            }
            lessonsAnalysis.byModule[moduleKey].lessons.push(record);
            
            // الجدول الزمني
            lessonsAnalysis.timeline.push({
                date: record.completedAt,
                lesson: record
            });
        }
    });
    
    // ترتيب الجدول الزمني
    lessonsAnalysis.timeline.sort((a, b) => new Date(b.date) - new Date(a.date));
    
    return lessonsAnalysis;
}

// دالة تحليل الحضور
function analyzeUserAttendance(user) {
    const attendance = user.attendance || {};
    const attendanceAnalysis = {
        total: 0,
        byCourse: {},
        sessions: []
    };
    
    Object.keys(attendance).forEach(courseId => {
        const courseAttendance = attendance[courseId];
        attendanceAnalysis.byCourse[courseId] = {
            sessions: [],
            totalPoints: 0
        };
        
        Object.keys(courseAttendance).forEach(sessionId => {
            const session = courseAttendance[sessionId];
            attendanceAnalysis.total++;
            attendanceAnalysis.byCourse[courseId].sessions.push(session);
            attendanceAnalysis.byCourse[courseId].totalPoints += session.pointsEarned || 0;
            
            attendanceAnalysis.sessions.push({
                ...session,
                courseId: courseId
            });
        });
    });
    
    return attendanceAnalysis;
}

// دالة حساب الإحصائيات العامة
function calculateUserStats(user) {
    const progress = user.progress || {};
    const stats = {
        averageProgress: 0,
        coursesCount: 0,
        completionRate: 0,
        lastActivity: null,
        activityStreak: 0
    };
    
    // حساب متوسط التقدم
    const progressValues = Object.values(progress).map(p => p.percentage || 0);
    if (progressValues.length > 0) {
        stats.averageProgress = Math.round(
            progressValues.reduce((sum, val) => sum + val, 0) / progressValues.length
        );
        stats.coursesCount = progressValues.length;
    }
    
    // آخر نشاط
    Object.values(progress).forEach(courseProgress => {
        if (courseProgress.lastActivity) {
            const activityDate = courseProgress.lastActivity.seconds ? 
                new Date(courseProgress.lastActivity.seconds * 1000) : 
                new Date(courseProgress.lastActivity);
            
            if (!stats.lastActivity || activityDate > stats.lastActivity) {
                stats.lastActivity = activityDate;
            }
        }
    });
    
    return stats;
}

    const dateMap = new Map();
    allData.daily.forEach(activity => {
        const date = new Date(activity.date);
        const dateKey = date.toISOString().split('T')[0];
        
        if (!dateMap.has(dateKey)) {
            dateMap.set(dateKey, {
                lessons: 0,
                points: 0,
                students: new Set(),
                badges: 0
            });
        }
        
        const dayData = dateMap.get(dateKey);
        dayData.lessons += activity.lessonsCompleted?.length || 0;
        dayData.points += activity.totalPointsToday || 0;
        dayData.students.add(activity.userId);
        dayData.badges += activity.badgesEarnedToday?.length || 0;
    });
    
    return dateMap;
}

// دالة تحليل أداء الطلاب
// دالة تحليل أداء الطلاب - محدثة
function analyzeStudentPerformance() {
    const analysis = {
        topPerformers: [],
        strugglingStudents: [],
        averageProgress: 0,
        medianPoints: 0
    };
    
    // جمع بيانات كل طالب من المصدر الصحيح
    const studentsData = new Map();
    
    // استخدام بيانات المستخدمين المباشرة
    allData.users.forEach(user => {
        const journeyPoints = user.journeyPoints?.balance || 0;
        const lessonsCompleted = 0;
        let badgesCount = (user.badges || []).length;
        
        // حساب الدروس المكتملة من progress
        let totalLessonsCompleted = 0;
        if (user.progress) {
            Object.values(user.progress).forEach(courseProgress => {
                totalLessonsCompleted += (courseProgress.completedLessons || []).length;
            });
        }
        
        studentsData.set(user.id, {
            id: user.id,
            name: user.name,
            lessonsCompleted: totalLessonsCompleted,
            totalPoints: journeyPoints, // استخدام نقاط الرحلة فقط
            badges: badgesCount,
            lastActivity: null
        });
    });
    
    // تحديث من سجل الإكمال
    allData.completionHistory.forEach(record => {
        if (studentsData.has(record.userId)) {
            const student = studentsData.get(record.userId);
            // لا نضيف النقاط مرة أخرى، فقط نحدث آخر نشاط
            if (record.completedAt) {
                const activityDate = new Date(record.completedAt);
                if (!student.lastActivity || activityDate > student.lastActivity) {
                    student.lastActivity = activityDate;
                }
            }
        }
    });
    
    // تحليل الأداء
    const studentsArray = Array.from(studentsData.values());
    
    // الطلاب المتفوقون
    analysis.topPerformers = studentsArray
        .sort((a, b) => b.totalPoints - a.totalPoints)
        .slice(0, 5);
    
    // حساب المتوسط
    const avgPoints = studentsArray.length > 0 ? 
        studentsArray.reduce((sum, s) => sum + s.totalPoints, 0) / studentsArray.length : 0;
    analysis.averageProgress = Math.round(avgPoints);
    
    // الطلاب الذين يحتاجون دعم
    analysis.strugglingStudents = studentsArray
        .filter(s => s.totalPoints < avgPoints * 0.3)
        .sort((a, b) => a.totalPoints - b.totalPoints);
    
    // حساب الوسيط
    const sortedByPoints = [...studentsArray].sort((a, b) => a.totalPoints - b.totalPoints);
    analysis.medianPoints = sortedByPoints[Math.floor(sortedByPoints.length / 2)]?.totalPoints || 0;
    
    return analysis;
}

// دالة تحليل محتوى الدورات
function analyzeCourseContent() {
    const analysis = {
        mostCompletedLessons: [],
        leastCompletedLessons: [],
        averageCompletionTime: 0,
        difficultLessons: []
    };
    
    // ترتيب الدروس حسب عدد الإكمالات
    const sortedLessons = [...allData.lessons].sort((a, b) => 
        (b.totalCompletions || 0) - (a.totalCompletions || 0)
    );
    
    analysis.mostCompletedLessons = sortedLessons.slice(0, 5);
    analysis.leastCompletedLessons = sortedLessons.filter(l => l.totalCompletions > 0).slice(-5).reverse();
    
    // الدروس الصعبة (التي لم يكملها أحد أو عدد قليل جداً)
    analysis.difficultLessons = sortedLessons.filter(l => 
        (l.totalCompletions || 0) < 2
    );
    
    return analysis;
}

        document.querySelector(`.tab-btn[data-tab="${tab}"]`)?.classList.add('active');

    const content = document.getElementById('tabContent');

        // دالة حساب مستوى الطالب
function calculateStudentLevel(userDetail) {
    const points = userDetail.points.total;
    const lessons = userDetail.lessons.total;
    const badges = userDetail.badges.total;
    const avgProgress = userDetail.stats.averageProgress;
    
    // حساب النقاط الإجمالية للتقييم
    const score = (points / 100) + (lessons * 10) + (badges * 20) + avgProgress;
    
    if (score >= 200) return 'متميز';
    if (score >= 100) return 'نشط';
    if (score >= 50) return 'متوسط';
    return 'يحتاج دعم';
}

// دالة توليد تبويب الجدول الزمني
function generateTimelineTab(userDetail) {
    let events = [];
    
    // جمع جميع الأحداث
    userDetail.lessons.timeline.forEach(item => {
        events.push({
            date: item.date,
            type: 'lesson',
            icon: '📚',
            color: '#3b82f6',
            title: 'أكمل درس',
            details: item.lesson.lessonTitle,
            points: item.lesson.pointsEarned
        });
    });
    
    userDetail.badges.timeline.forEach(item => {
        events.push({
            date: item.date,
            type: 'badge',
            icon: '🏅',
            color: '#fbbf24',
            title: 'حصل على شارة',
            details: item.badge.name,
            points: 0
        });
    });
    
    // ترتيب الأحداث
    events.sort((a, b) => new Date(b.date) - new Date(a.date));
    
    return `
        <div class="timeline-container">
            <h3 style="color: var(--primary-blue); margin-bottom: 20px;">
                <i class="fas fa-history"></i> السجل الزمني الكامل
            </h3>
            ${events.slice(0, 20).map(event => `
                <div class="timeline-item">
                    <div style="display: flex; justify-content: space-between; align-items: start;">
                        <div style="flex: 1;">
                            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 5px;">
                                <span style="font-size: 1.5rem;">${event.icon}</span>
                                <span style="color: ${event.color}; font-weight: bold;">${event.title}</span>
                            </div>
                            <div style="color: rgba(255,255,255,0.8);">${event.details}</div>
                            ${event.points > 0 ? `
                                <div style="margin-top: 5px;">
                                    <span style="
                                        background: rgba(34, 197, 94, 0.2);
                                        color: #22c55e;
                                        padding: 2px 10px;
                                        border-radius: 10px;
                                        font-size: 0.85rem;
                                    ">+${event.points} نقطة</span>
                                </div>
                            ` : ''}
                        </div>
                        <div style="color: rgba(255,255,255,0.5); font-size: 0.85rem;">
                            ${new Date(event.date).toLocaleDateString('ar-SA')}
                            <br>
                            ${new Date(event.date).toLocaleTimeString('ar-SA')}
                        </div>
                    </div>
                </div>
            `).join('')}
        </div>
    `;
}

// دالة التبديل بين تبويبات التفاصيل
function showDetailTab(tab, button) {
    // تحديث الأزرار
    document.querySelectorAll('#studentDetailsModal .tab-btn').forEach(btn => {
        btn.classList.remove('active');
    });
    button.classList.add('active');
    
    // الحصول على بيانات الطالب
    const userId = document.querySelector('#studentDetailsModal').getAttribute('data-user-id');
    const userDetail = allData.detailedProgress[userId];
    
    const content = document.getElementById('detailTabContent');
    
    switch(tab) {
        case 'timeline':
            content.innerHTML = generateTimelineTab(userDetail);
            break;
        case 'courses':
            content.innerHTML = generateCoursesTab(userDetail);
            break;
        case 'badges':
            content.innerHTML = generateBadgesTab(userDetail);
            break;
        case 'points':
            content.innerHTML = generatePointsTab(userDetail);
            break;
    }
}

// عرض النشاط اليومي
function displayDailyTab() {
    const content = document.getElementById('tabContent');
    
    // ترتيب حسب التاريخ
    const sortedDaily = allData.daily.sort((a, b) => {
        const dateA = new Date(a.date);
        const dateB = new Date(b.date);
        return dateB - dateA;
    });
    
    // تجميع حسب التاريخ
    const dailyMap = new Map();
    sortedDaily.forEach(activity => {
        if (!dailyMap.has(activity.date)) {
            dailyMap.set(activity.date, {
                lessons: 0,
                points: 0,
                badges: 0,
                students: new Set()
            });
        }
        const dayData = dailyMap.get(activity.date);
        dayData.lessons += activity.lessonsCompleted?.length || 0;
        dayData.points += activity.totalPointsToday || 0;
        dayData.badges += activity.badgesEarnedToday?.length || 0;
        dayData.students.add(activity.userId);
    });
    
    content.innerHTML = `
        <h3 style="margin-bottom: 20px;">
            <i class="fas fa-calendar-day"></i> النشاط اليومي
        </h3>
        <div style="margin-bottom: 30px;">
            <canvas id="dailyChart" style="max-height: 300px;"></canvas>
        </div>
        <table class="data-table">
            <thead>
                <tr>
                    <th>التاريخ</th>
                    <th>الطلاب النشطون</th>
                    <th>الدروس المكتملة</th>
                    <th>النقاط المكتسبة</th>
                    <th>الشارات الممنوحة</th>
                </tr>
            </thead>
            <tbody>
                ${Array.from(dailyMap.entries()).map(([date, data]) => `
                    <tr>
                        <td style="font-weight: bold;">
                            ${new Date(date).toLocaleDateString('ar-SA')}
                        </td>
                        <td style="text-align: center;">
                            <span style="
                                background: var(--primary-blue);
                                padding: 5px 12px;
                                border-radius: 15px;
                            ">${data.students.size}</span>
                        </td>
                        <td style="text-align: center;">
                            ${data.lessons}
                        </td>
                        <td style="text-align: center;">
                            <span style="
                                background: var(--success-green);
                                padding: 5px 12px;
                                border-radius: 15px;
                            ">${data.points}</span>
                        </td>
                        <td style="text-align: center;">
                            ${data.badges > 0 ? `
                                <span style="
                                    background: var(--gold-primary);

                `).join('')}
            </tbody>
        </table>
    `;
    
    // رسم الرسم البياني
    setTimeout(() => drawDailyChart(dailyMap), 100);
}

// رسم الرسم البياني للنشاط اليومي
function drawDailyChart(dailyMap) {
    const ctx = document.getElementById('dailyChart');
    if (!ctx) return;
    
    const labels = Array.from(dailyMap.keys()).slice(0, 7).reverse();
    const data = labels.map(date => dailyMap.get(date)?.lessons || 0);
    
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels.map(date => new Date(date).toLocaleDateString('ar-SA')),
            datasets: [{
                label: 'الدروس المكتملة',
                data: data,
                borderColor: 'rgb(59, 130, 246)',
                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                tension: 0.3,
                fill: true
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    display: false
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    grid: {
                        color: 'rgba(255, 255, 255, 0.1)'
                    },
                    ticks: {
                        color: 'rgba(255, 255, 255, 0.7)'
                    }
                },
                x: {
                    grid: {
                        color: 'rgba(255, 255, 255, 0.1)'
                    },
                    ticks: {
                        color: 'rgba(255, 255, 255, 0.7)'
                    }
                }
            }
        }
    });
}
