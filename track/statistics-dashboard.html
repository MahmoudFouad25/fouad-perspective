function calculateCompletionRates() {
    const rates = {
        daily: [],
        weekly: [],
        monthly: []
    };
    
    // تجميع البيانات حسب التاريخ
    const dateMap = new Map();
    allData.daily.forEach(activity => {
        const date = new Date(activity.date);
        const dateKey = date.toISOString().split('T')[0];
        
        if (!dateMap.has(dateKey)) {
            dateMap.set(dateKey, {
                lessons: 0,
                points: 0,
                students: new Set(),
                badges: 0
            });
        }
        
        const dayData = dateMap.get(dateKey);
        dayData.lessons += activity.lessonsCompleted?.length || 0;
        dayData.points += activity.totalPointsToday || 0;
        dayData.students.add(activity.userId);
        dayData.badges += activity.badgesEarnedToday?.length || 0;
    });
    
    return dateMap;
}

// دالة تحليل أداء الطلاب
function analyzeStudentPerformance() {
    const analysis = {
        topPerformers: [],
        strugglingStudents: [],
        averageProgress: 0,
        medianPoints: 0
    };
    
    // جمع بيانات كل طالب
    const studentsData = new Map();
    
    allData.lessons.forEach(lesson => {
        if (lesson.completedBy) {
            lesson.completedBy.forEach(student => {
                if (!studentsData.has(student.userId)) {
                    studentsData.set(student.userId, {
                        id: student.userId,
                        name: student.userName,
                        lessonsCompleted: 0,
                        totalPoints: 0,
                        lastActivity: null,
                        completionSpeed: [],
                        badges: 0
                    });
                }
                
                const studentInfo = studentsData.get(student.userId);
                studentInfo.lessonsCompleted++;
                studentInfo.totalPoints += student.points || 0;
                
                if (student.date) {
                    const activityDate = new Date(student.date);
                    if (!studentInfo.lastActivity || activityDate > studentInfo.lastActivity) {
                        studentInfo.lastActivity = activityDate;
                    }
                }
            });
        }
    });
    
    // حساب الشارات لكل طالب
    allData.badgeHistory.forEach(badge => {
        if (studentsData.has(badge.userId)) {
            studentsData.get(badge.userId).badges++;
        }
    });
    
    // تحليل الأداء
    const studentsArray = Array.from(studentsData.values());
    
    // الطلاب المتفوقون (أعلى 5)
    analysis.topPerformers = studentsArray
        .sort((a, b) => b.totalPoints - a.totalPoints)
        .slice(0, 5);
    
    // الطلاب الذين يحتاجون دعم (أقل من 30% من المتوسط)
    const avgPoints = studentsArray.reduce((sum, s) => sum + s.totalPoints, 0) / studentsArray.length;
    analysis.averageProgress = avgPoints;
    
    analysis.strugglingStudents = studentsArray
        .filter(s => s.totalPoints < avgPoints * 0.3)
        .sort((a, b) => a.totalPoints - b.totalPoints);
    
    // حساب الوسيط
    const sortedByPoints = studentsArray.sort((a, b) => a.totalPoints - b.totalPoints);
    analysis.medianPoints = sortedByPoints[Math.floor(sortedByPoints.length / 2)]?.totalPoints || 0;
    
    return analysis;
}

// دالة تحليل محتوى الدورات
function analyzeCourseContent() {
    const analysis = {
        mostCompletedLessons: [],
        leastCompletedLessons: [],
        averageCompletionTime: 0,
        difficultLessons: []
    };
    
    // ترتيب الدروس حسب عدد الإكمالات
    const sortedLessons = [...allData.lessons].sort((a, b) => 
        (b.totalCompletions || 0) - (a.totalCompletions || 0)
    );
    
    analysis.mostCompletedLessons = sortedLessons.slice(0, 5);
    analysis.leastCompletedLessons = sortedLessons.filter(l => l.totalCompletions > 0).slice(-5).reverse();
    
    // الدروس الصعبة (التي لم يكملها أحد أو عدد قليل جداً)
    analysis.difficultLessons = sortedLessons.filter(l => 
        (l.totalCompletions || 0) < 2
    );
    
    return analysis;
}

      // تبديل التبويبات
function switchTab(tab, buttonElement) {
    // تحديث أزرار التبويبات
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
    });
    
    // إذا كان هناك زر محدد، استخدمه
    if (buttonElement) {
        buttonElement.classList.add('active');
    } else {
        // وإلا ابحث عن الزر المناسب
        document.querySelector(`.tab-btn[data-tab="${tab}"]`)?.classList.add('active');
    }
    
    const content = document.getElementById('tabContent');
    
    switch(tab) {
        case 'lessons':
            displayLessonsTab();
            break;
        case 'badges':
            displayBadgesTab();
            break;
        case 'students':
            displayStudentsTab();
            break;
        case 'courses':
            displayCoursesTab();
            break;
        case 'daily':
            displayDailyTab();
            break;
        case 'realtime':
            displayRealtimeTab();
            break;
        case 'analytics':
            displayAnalyticsTab();
            break;
    }
}

function displayStudentsTab() {
    const content = document.getElementById('tabContent');
    
    // جمع بيانات الطلاب من كل المصادر
    const studentsMap = new Map();
    
    // من الدروس
    allData.lessons.forEach(lesson => {
        if (lesson.completedBy) {
            lesson.completedBy.forEach(student => {
                if (!studentsMap.has(student.userId)) {
                    studentsMap.set(student.userId, {
                        id: student.userId,
                        name: student.userName,
                        lessonsCount: 0,
                        badgesCount: 0,
                        totalPoints: 0,
                        lastActivity: null
                    });
                }
                const studentData = studentsMap.get(student.userId);
                studentData.lessonsCount++;
                studentData.totalPoints += student.points || 0;
                if (student.date) {
                    const date = new Date(student.date);
                    if (!studentData.lastActivity || date > studentData.lastActivity) {
                        studentData.lastActivity = date;
                    }
                }
            });
        }
    });
    
    // من الشارات
    allData.badgeHistory.forEach(badge => {
        if (studentsMap.has(badge.userId)) {
            studentsMap.get(badge.userId).badgesCount++;
        }
    });
    
    const studentsArray = Array.from(studentsMap.values()).sort((a, b) => 
        b.totalPoints - a.totalPoints
    );
    
    content.innerHTML = `
        <h3 style="margin-bottom: 20px;">
            <i class="fas fa-users"></i> إحصائيات الطلاب
        </h3>
        <div style="
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.1), rgba(16, 185, 129, 0.05));
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid var(--success-green);

                </tr>
            </thead>
            <tbody>
                ${studentsArray.map((student, index) => `
                    <tr>
                        <td style="text-align: center;">
                            ${index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : index + 1}
                        </td>
                        <td style="font-weight: bold;">
                            ${student.name}
                        </td>
                        <td style="text-align: center;">
                            <span style="
                                background: var(--primary-blue);
                                padding: 5px 12px;
                                border-radius: 15px;

                        </td>
                        <td style="text-align: center;">

// عرض النشاط اليومي
function displayDailyTab() {
    const content = document.getElementById('tabContent');
    
    // ترتيب حسب التاريخ
    const sortedDaily = allData.daily.sort((a, b) => {
        const dateA = new Date(a.date);
        const dateB = new Date(b.date);
        return dateB - dateA;
    });
    
    // تجميع حسب التاريخ
    const dailyMap = new Map();
    sortedDaily.forEach(activity => {
        if (!dailyMap.has(activity.date)) {
            dailyMap.set(activity.date, {
                lessons: 0,
                points: 0,
                badges: 0,
                students: new Set()
            });
        }
        const dayData = dailyMap.get(activity.date);
        dayData.lessons += activity.lessonsCompleted?.length || 0;
        dayData.points += activity.totalPointsToday || 0;
        dayData.badges += activity.badgesEarnedToday?.length || 0;
        dayData.students.add(activity.userId);
    });
    
    content.innerHTML = `
        <h3 style="margin-bottom: 20px;">
            <i class="fas fa-calendar-day"></i> النشاط اليومي
        </h3>
        <div style="margin-bottom: 30px;">
            <canvas id="dailyChart" style="max-height: 300px;"></canvas>
        </div>
        <table class="data-table">
            <thead>
                <tr>
                    <th>التاريخ</th>
                    <th>الطلاب النشطون</th>
                    <th>الدروس المكتملة</th>
                    <th>النقاط المكتسبة</th>
                    <th>الشارات الممنوحة</th>
                </tr>
            </thead>
            <tbody>
                ${Array.from(dailyMap.entries()).map(([date, data]) => `
                    <tr>
                        <td style="font-weight: bold;">
                            ${new Date(date).toLocaleDateString('ar-SA')}
                        </td>
                        <td style="text-align: center;">

                        <td style="text-align: center;">

                        <td style="text-align: center;">

                                padding: 5px 12px;
                                border-radius: 15px;
                            ">${data.points}</span>
                        </td>
                        <td style="text-align: center;">
                            ${data.badges > 0 ? `

    setTimeout(() => drawDailyChart(dailyMap), 100);

// رسم الرسم البياني للنشاط اليومي
function drawDailyChart(dailyMap) {
    const ctx = document.getElementById('dailyChart');
    if (!ctx) return;
    
    const labels = Array.from(dailyMap.keys()).slice(0, 7).reverse();
    const data = labels.map(date => dailyMap.get(date)?.lessons || 0);
    
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels.map(date => new Date(date).toLocaleDateString('ar-SA')),
            datasets: [{
                label: 'الدروس المكتملة',
                data: data,
                borderColor: 'rgb(59, 130, 246)',
                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                tension: 0.3,
                fill: true
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    display: false
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    grid: {
                        color: 'rgba(255, 255, 255, 0.1)'
                    },
                    ticks: {
                        color: 'rgba(255, 255, 255, 0.7)'
                    }
                },
                x: {
                    grid: {
                        color: 'rgba(255, 255, 255, 0.1)'
                    },
                    ticks: {
                        color: 'rgba(255, 255, 255, 0.7)'
                    }
                }
            }
        }
    });
}

// عرض قائمة الطلاب للدرس
function showStudentsList(lessonId) {
    const lesson = allData.lessons.find(l => l.id === lessonId);
    if (!lesson || !lesson.completedBy) return;
    
    alert('قائمة الطلاب:\n\n' + 
        lesson.completedBy.map(s => s.userName).join('\n'));
}

// عرض سجل الشارة
function showBadgeHistory(badgeId) {
    const history = allData.badgeHistory.filter(h => h.badgeId === badgeId);
    const badge = allData.badges.find(b => b.id === badgeId);
    
    if (history.length === 0) {
        alert('لا يوجد سجل لهذه الشارة');
        return;
    }
    
    alert(`سجل شارة "${badge?.name}":\n\n` + 
        history.map(h => `${h.userName} - ${new Date(h.awardedAt).toLocaleDateString('ar-SA')}`).join('\n'));
}
