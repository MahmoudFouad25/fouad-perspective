        // معالجة البيانات التفصيلية - مع جلب من Firebase
async function processDetailedData() {
    console.log('📊 معالجة البيانات التفصيلية...');
    
    // بناء ملف شامل لكل طالب
    for (const user of allData.users) {
        // جلب ملخص التقدم من Firebase
        const progressSummary = await loadCourseProgressSummary(
            user.id, 
            'malaz-alhayara-course'
        );
        
        // إذا كان هناك ملخص جاهز، استخدمه
        let pointsData;
        if (progressSummary) {
            pointsData = {
                journey: {
                    balance: user.journeyPoints?.balance || 0,
                    lifetime: user.journeyPoints?.lifetime || 0,
                    history: user.journeyPoints?.history || []
                },
                wallet: {
                    balance: user.walletPoints?.balance || 0,
                    lifetime: user.walletPoints?.lifetime || 0,
                    history: user.walletPoints?.history || []
                },
                contentPoints: progressSummary.contentPoints || {},
                additionalPoints: progressSummary.additionalPoints || {},
                totalContent: progressSummary.contentPoints?.total || 0,
                totalAdditional: progressSummary.additionalPoints?.total || 0,
                total: user.journeyPoints?.balance || 0
            };
        } else {
            // استخدام الطريقة القديمة كـ fallback
            pointsData = analyzeUserPoints(user);
        }
        
        allData.detailedProgress[user.id] = {
            // المعلومات الأساسية
            id: user.id,
            name: user.name,
            email: user.email,
            phone: user.phone,
            
            // تحليل النقاط (من Firebase مباشرة)
            points: pointsData,
            
            // تحليل الشارات
            badges: analyzeUserBadges(user),
            
            // تحليل الدروس
            lessons: analyzeUserLessons(user),
            
            // تحليل الحضور
            attendance: analyzeUserAttendance(user),
            
            // الإحصائيات العامة
            stats: calculateUserStats(user)
        };
    }
    
    console.log('✅ اكتملت معالجة البيانات التفصيلية');
}

        // ====================================
// جلب ملخص التقدم الجاهز من Firebase
// ====================================
async function loadCourseProgressSummary(userId, courseId) {
    try {
        const doc = await db.collection('users')
            .doc(userId)
            .collection('courseProgress')
            .doc(courseId)
            .get();
        
        if (!doc.exists) {
            console.log(`⚠️ لا يوجد ملخص تقدم للمستخدم ${userId} في الدورة ${courseId}`);
            return null;
        }
        
        const data = doc.data();
        console.log(`✅ تم جلب ملخص تقدم المستخدم ${userId}:`, data);
        return data;
        
    } catch (error) {
        console.error('❌ خطأ في جلب ملخص التقدم:', error);
        return null;
    }
}
// دالة تحليل نقاط المستخدم
// دالة تحليل نقاط المستخدم - وفقاً للنظام الفعلي المحدث
// تحليل نقاط المستخدم - قراءة مباشرة من Firebase
function analyzeUserPoints(user) {
    const journeyPoints = user.journeyPoints || {};
    const walletPoints = user.walletPoints || {};
    
    // البيانات الافتراضية إذا لم يتم جلب الملخص بعد
    const defaultData = {
        contentPoints: {
            achievement: 0,
            bonus: 0,
            participation: 0,
            speed: 0,
            multiplier: 0
        },
        additionalPoints: {
            liveAttendance: 0,
            badges: 0,
            pillarPoints: {
                courage: 0,
                mirror: 0,
                action: 0,
                witness: 0,
                total: 0
            }
        },
        totalContent: 0,
        totalAdditional: 0
    };
    
    return {
        journey: {
            balance: journeyPoints.balance || 0,
            lifetime: journeyPoints.lifetime || 0,
            history: journeyPoints.history || []
        },
        wallet: {
            balance: walletPoints.balance || 0,
            lifetime: walletPoints.lifetime || 0,
            history: walletPoints.history || []
        },
        contentPoints: defaultData.contentPoints,
        additionalPoints: defaultData.additionalPoints,
        totalContent: defaultData.totalContent,
        totalAdditional: defaultData.totalAdditional,
        total: journeyPoints.balance || 0,
        _needsUpdate: true // علامة لتحديث البيانات لاحقاً
    };
}

// دالة تحليل شارات المستخدم
function analyzeUserBadges(user) {
    const userBadges = user.badges || [];
    
    const badgeAnalysis = {
        total: userBadges.length,
        byType: {},
        byCourse: {},
        timeline: [],
        recent: []
    };
    
    // تصنيف الشارات
    userBadges.forEach(badge => {
        // حسب النوع
        const type = badge.type || 'other';
        if (!badgeAnalysis.byType[type]) {
            badgeAnalysis.byType[type] = [];
        }
        badgeAnalysis.byType[type].push(badge);
        
        // حسب الدورة
        if (badge.courseId) {
            if (!badgeAnalysis.byCourse[badge.courseId]) {
                badgeAnalysis.byCourse[badge.courseId] = [];
            }
            badgeAnalysis.byCourse[badge.courseId].push(badge);
        }
        
        // الجدول الزمني
        if (badge.awardedDate) {
            badgeAnalysis.timeline.push({
                date: badge.awardedDate,
                badge: badge
            });
        }
    });
    
    // ترتيب الجدول الزمني
    badgeAnalysis.timeline.sort((a, b) => new Date(b.date) - new Date(a.date));
    
    // آخر 5 شارات
    badgeAnalysis.recent = badgeAnalysis.timeline.slice(0, 5).map(item => item.badge);
    
    return badgeAnalysis;
}

// دالة تحليل دروس المستخدم
function analyzeUserLessons(user) {
    const lessonsAnalysis = {
        total: 0,
        byCourse: {},
        byModule: {},
        timeline: [],
        speed: {
            fast: 0,
            normal: 0,
            slow: 0
        }
    };
    
    // تحليل من سجل الإكمال
    allData.completionHistory.forEach(record => {
        if (record.userId === user.id) {
            lessonsAnalysis.total++;
            
            // حسب الدورة
            if (record.courseId) {
                if (!lessonsAnalysis.byCourse[record.courseId]) {
                    lessonsAnalysis.byCourse[record.courseId] = {
                        courseName: record.courseName,
                        lessons: [],
                        totalPoints: 0
                    };
                }
                lessonsAnalysis.byCourse[record.courseId].lessons.push(record);
                lessonsAnalysis.byCourse[record.courseId].totalPoints += record.pointsEarned || 0;
            }
            
            // حسب الوحدة
            const moduleKey = `${record.courseId}_${record.moduleIndex}`;
            if (!lessonsAnalysis.byModule[moduleKey]) {
                lessonsAnalysis.byModule[moduleKey] = {
                    moduleName: record.moduleName,
                    lessons: []
                };
            }
            lessonsAnalysis.byModule[moduleKey].lessons.push(record);
            
            // الجدول الزمني
            lessonsAnalysis.timeline.push({
                date: record.completedAt,
                lesson: record
            });
        }
    });
    
    // ترتيب الجدول الزمني
    lessonsAnalysis.timeline.sort((a, b) => new Date(b.date) - new Date(a.date));
    
    return lessonsAnalysis;
}

// دالة تحليل الحضور
function analyzeUserAttendance(user) {
    const attendance = user.attendance || {};
    const attendanceAnalysis = {
        total: 0,
        byCourse: {},
        sessions: []
    };
    
    Object.keys(attendance).forEach(courseId => {
        const courseAttendance = attendance[courseId];
        attendanceAnalysis.byCourse[courseId] = {
            sessions: [],
            totalPoints: 0
        };
        
        Object.keys(courseAttendance).forEach(sessionId => {
            const session = courseAttendance[sessionId];
            attendanceAnalysis.total++;
            attendanceAnalysis.byCourse[courseId].sessions.push(session);
            attendanceAnalysis.byCourse[courseId].totalPoints += session.pointsEarned || 0;
            
            attendanceAnalysis.sessions.push({
                ...session,
                courseId: courseId
            });
        });
    });
    
    return attendanceAnalysis;
}

// دالة حساب الإحصائيات العامة
function calculateUserStats(user) {
    const progress = user.progress || {};
    const stats = {
        averageProgress: 0,
        coursesCount: 0,
        completionRate: 0,
        lastActivity: null,
        activityStreak: 0
    };
    
    // حساب متوسط التقدم
    const progressValues = Object.values(progress).map(p => p.percentage || 0);
    if (progressValues.length > 0) {
        stats.averageProgress = Math.round(
            progressValues.reduce((sum, val) => sum + val, 0) / progressValues.length
        );
        stats.coursesCount = progressValues.length;
    }
    
    // آخر نشاط
    Object.values(progress).forEach(courseProgress => {
        if (courseProgress.lastActivity) {
            const activityDate = courseProgress.lastActivity.seconds ? 
                new Date(courseProgress.lastActivity.seconds * 1000) : 
                new Date(courseProgress.lastActivity);
            
            if (!stats.lastActivity || activityDate > stats.lastActivity) {
                stats.lastActivity = activityDate;
            }
        }
    });
    
    return stats;
}

        

       // دالة حساب معدلات الإنجاز
function calculateCompletionRates() {
    const rates = {
        daily: [],
        weekly: [],
        monthly: []
    };
    
    // تجميع البيانات حسب التاريخ
    const dateMap = new Map();
    allData.daily.forEach(activity => {
        // حماية من التواريخ الفاسدة
        if (!activity.date) {
            console.warn('⚠️ نشاط بدون تاريخ:', activity);
            return; // تخطي هذا السجل
        }
        
        const date = new Date(activity.date);
        
        // التحقق من صحة التاريخ
        if (isNaN(date.getTime())) {
            console.warn('⚠️ تاريخ غير صالح:', activity.date, activity);
            return; // تخطي هذا السجل
        }
        
        const dateKey = date.toISOString().split('T')[0];
        
        if (!dateMap.has(dateKey)) {
            dateMap.set(dateKey, {
                lessons: 0,
                points: 0,
                students: new Set(),
                badges: 0
            });
        }
        
        const dayData = dateMap.get(dateKey);
        dayData.lessons += activity.lessonsCompleted?.length || 0;
        dayData.points += activity.totalPointsToday || 0;
        dayData.students.add(activity.userId);
        dayData.badges += activity.badgesEarnedToday?.length || 0;
    });
    
    return dateMap;
}

// دالة تحليل أداء الطلاب
// دالة تحليل أداء الطلاب - محدثة
function analyzeStudentPerformance() {
    const analysis = {
        topPerformers: [],
        strugglingStudents: [],
        averageProgress: 0,
        medianPoints: 0
    };
    
    // جمع بيانات كل طالب من المصدر الصحيح
    const studentsData = new Map();
    
    // استخدام بيانات المستخدمين المباشرة
    allData.users.forEach(user => {
        const journeyPoints = user.journeyPoints?.balance || 0;
        const lessonsCompleted = 0;
        let badgesCount = (user.badges || []).length;
        
        // حساب الدروس المكتملة من progress
        let totalLessonsCompleted = 0;
        if (user.progress) {
            Object.values(user.progress).forEach(courseProgress => {
                totalLessonsCompleted += (courseProgress.completedLessons || []).length;
            });
        }
        
        studentsData.set(user.id, {
            id: user.id,
            name: user.name,
            lessonsCompleted: totalLessonsCompleted,
            totalPoints: journeyPoints, // استخدام نقاط الرحلة فقط
            badges: badgesCount,
            lastActivity: null
        });
    });
    
    // تحديث من سجل الإكمال
    allData.completionHistory.forEach(record => {
        if (studentsData.has(record.userId)) {
            const student = studentsData.get(record.userId);
            // لا نضيف النقاط مرة أخرى، فقط نحدث آخر نشاط
            if (record.completedAt) {
                const activityDate = new Date(record.completedAt);
                if (!student.lastActivity || activityDate > student.lastActivity) {
                    student.lastActivity = activityDate;
                }
            }
        }
    });
    
    // تحليل الأداء
    const studentsArray = Array.from(studentsData.values());
    
    // الطلاب المتفوقون
    analysis.topPerformers = studentsArray
        .sort((a, b) => b.totalPoints - a.totalPoints)
        .slice(0, 5);
    
    // حساب المتوسط
    const avgPoints = studentsArray.length > 0 ? 
        studentsArray.reduce((sum, s) => sum + s.totalPoints, 0) / studentsArray.length : 0;
    analysis.averageProgress = Math.round(avgPoints);
    
    // الطلاب الذين يحتاجون دعم
    analysis.strugglingStudents = studentsArray
        .filter(s => s.totalPoints < avgPoints * 0.3)
        .sort((a, b) => a.totalPoints - b.totalPoints);
    
    // حساب الوسيط
    const sortedByPoints = [...studentsArray].sort((a, b) => a.totalPoints - b.totalPoints);
    analysis.medianPoints = sortedByPoints[Math.floor(sortedByPoints.length / 2)]?.totalPoints || 0;
    
    return analysis;
}

// دالة تحليل محتوى الدورات
function analyzeCourseContent() {
    const analysis = {
        mostCompletedLessons: [],
        leastCompletedLessons: [],
        averageCompletionTime: 0,
        difficultLessons: []
    };
    
    // ترتيب الدروس حسب عدد الإكمالات
    const sortedLessons = [...allData.lessons].sort((a, b) => 
        (b.totalCompletions || 0) - (a.totalCompletions || 0)
    );
    
    analysis.mostCompletedLessons = sortedLessons.slice(0, 5);
    analysis.leastCompletedLessons = sortedLessons.filter(l => l.totalCompletions > 0).slice(-5).reverse();
    
    // الدروس الصعبة (التي لم يكملها أحد أو عدد قليل جداً)
    analysis.difficultLessons = sortedLessons.filter(l => 
        (l.totalCompletions || 0) < 2
    );
    
    return analysis;
}

function switchTab(tab, buttonElement) {
    // تحديث أزرار التبويبات

        btn.classList.remove('active');
    });
    
    // إذا كان هناك زر محدد، استخدمه
    if (buttonElement) {
        buttonElement.classList.add('active');

        // وإلا ابحث عن الزر المناسب
        document.querySelector(`.tab-btn[data-tab="${tab}"]`)?.classList.add('active');

    const content = document.getElementById('tabContent');
    
    switch(tab) {
        case 'lessons':

    }
}

        // عرض تبويب الشارات

async function displayBadgesTab() {
    const content = document.getElementById('tabContent');
    
    // تجميع بيانات الشارات بشكل شامل
    const badgesData = [];
    
    // استخدام for...of بدلاً من forEach للسماح بـ await
    for (const badge of allData.badges) {
        const awardHistory = allData.badgeHistory.filter(h => h.badgeId === badge.id);
        
        // جلب اسم المحتوى المرتبط
        let linkedContentName = '';
        if (badge.type === 'content' && badge.conditions) {
            const linkType = badge.conditions.linkType;
            
            if (linkType === 'any_lesson') {
                linkedContentName = 'عام - أي درس';
            } else if (linkType === 'specific_lesson' && badge.conditions.specificContentId) {
                try {
                    const contentDoc = await db.collection('courseContentLibrary').doc(badge.conditions.specificContentId).get();
                    if (contentDoc.exists) {
                        const contentData = contentDoc.data();
                        const typeIcons = {'video': '🎥', 'pdf': '📄', 'audio': '🎧', 'text': '📝', 'quiz': '❓'};
                        const icon = typeIcons[contentData.type] || '📄';
                        linkedContentName = `${icon} درس: ${contentData.name}`;
                    } else {
                        linkedContentName = '⚠️ الدرس غير موجود';
                    }
                } catch (error) {
                    linkedContentName = '❌ خطأ في التحميل';
                }
            } else if (linkType === 'any_module') {
                linkedContentName = 'عام - أي وحدة';
            } else if (linkType === 'specific_module' && badge.conditions.specificModuleId) {
                try {
                    const moduleDoc = await db.collection('contentModules').doc(badge.conditions.specificModuleId).get();
                    if (moduleDoc.exists) {
                        linkedContentName = `📦 وحدة: ${moduleDoc.data().name}`;
                    } else {
                        linkedContentName = '⚠️ الوحدة غير موجودة';
                    }
                } catch (error) {
                    linkedContentName = '❌ خطأ';
                }
            } else if (linkType === 'any_template') {
                linkedContentName = 'عام - أي قالب';
            } else if (linkType === 'specific_template' && badge.conditions.specificTemplateId) {
                try {
                    const templateDoc = await db.collection('courseTemplates').doc(badge.conditions.specificTemplateId).get();
                    if (templateDoc.exists) {
                        linkedContentName = `🎓 قالب: ${templateDoc.data().name}`;
                    } else {
                        linkedContentName = '⚠️ القالب غير موجود';
                    }
                } catch (error) {
                    linkedContentName = '❌ خطأ';
                }
            }
        } else if (badge.type === 'points' && badge.conditions?.requiredPoints) {
            linkedContentName = `⭐ ${badge.conditions.requiredPoints} نقطة`;
        } else if (badge.type === 'milestone') {
            linkedContentName = '🎯 إنجاز عام';
        } else if (badge.type === 'live_attendance' || badge.type === 'attendance') {
            linkedContentName = '🔴 حضور مباشر';

            linkedContentName = 'شارة عامة';
        }
        
        badgesData.push({
            id: badge.id,
            name: badge.name,
            icon: badge.icon,
            type: badge.type || 'other',
            conditions: badge.conditions,
            description: badge.description || '',
            linkedContentName: linkedContentName,
            totalAwarded: awardHistory.length,
            awardedTo: awardHistory.map(h => ({
                userId: h.userId,

            lastAwarded: awardHistory.length > 0 ? 
                new Date(Math.max(...awardHistory.map(h => new Date(h.awardedAt)))) : null

    badgesData.sort((a, b) => b.totalAwarded - a.totalAwarded);
    
    const byType = {};

        if (!byType[badge.type]) byType[badge.type] = [];

(async function() {
    let contentHTML = '';
    
    if (badge.type === 'content' && badge.conditions) {
        const linkType = badge.conditions.linkType;
        
        if (linkType === 'any_lesson') {
            contentHTML = '<span style="color: #60a5fa;">🎯 عام - أي درس</span>';
        } else if (linkType === 'specific_lesson' && badge.conditions.specificContentId) {
            try {
                const contentDoc = await db.collection('courseContentLibrary').doc(badge.conditions.specificContentId).get();
                if (contentDoc.exists) {
                    const contentData = contentDoc.data();
                    const typeIcons = {'video': '🎥', 'pdf': '📄', 'audio': '🎧', 'text': '📝', 'quiz': '❓'};
                    const icon = typeIcons[contentData.type] || '📄';
                    contentHTML = `<span style="color: #34d399;">${icon} درس: ${contentData.name}</span>`;
                } else {
                    contentHTML = '<span style="color: #fbbf24;">⚠️ الدرس غير موجود</span>';
                }
            } catch (error) {
                contentHTML = '<span style="color: #ef4444;">❌ خطأ في التحميل</span>';
            }
        } else if (linkType === 'any_module') {
            contentHTML = '<span style="color: #60a5fa;">📦 عام - أي وحدة</span>';
        } else if (linkType === 'specific_module' && badge.conditions.specificModuleId) {
            try {
                const moduleDoc = await db.collection('contentModules').doc(badge.conditions.specificModuleId).get();
                if (moduleDoc.exists) {
                    contentHTML = `<span style="color: #a78bfa;">📦 وحدة: ${moduleDoc.data().name}</span>`;
                } else {
                    contentHTML = '<span style="color: #fbbf24;">⚠️ الوحدة غير موجودة</span>';
                }
            } catch (error) {
                contentHTML = '<span style="color: #ef4444;">❌ خطأ في التحميل</span>';
            }
        } else if (linkType === 'any_template') {
            contentHTML = '<span style="color: #60a5fa;">🎓 عام - أي قالب</span>';
        } else if (linkType === 'specific_template' && badge.conditions.specificTemplateId) {
            try {
                const templateDoc = await db.collection('courseTemplates').doc(badge.conditions.specificTemplateId).get();
                if (templateDoc.exists) {
                    contentHTML = `<span style="color: #fb923c;">🎓 قالب: ${templateDoc.data().name}</span>`;
                } else {
                    contentHTML = '<span style="color: #fbbf24;">⚠️ القالب غير موجود</span>';
                }
            } catch (error) {
                contentHTML = '<span style="color: #ef4444;">❌ خطأ في التحميل</span>';
            }
        }
    } else if (badge.type === 'points') {
        contentHTML = '<span style="color: #fbbf24;">⭐ نقاط - عام</span>';
    } else if (badge.type === 'milestone') {
        contentHTML = '<span style="color: #3b82f6;">🎯 إنجاز - عام</span>';
    } else {
        contentHTML = '<span style="color: rgba(255,255,255,0.5);">شارة عامة</span>';
    }
    
    const element = document.getElementById(`linkedContent_${badge.id}`);
    if (element) {
        element.innerHTML = contentHTML;
    }
})();

        // دالة حساب مستوى الطالب
function calculateStudentLevel(userDetail) {
    const points = userDetail.points.total;
    const lessons = userDetail.lessons.total;
    const badges = userDetail.badges.total;
    const avgProgress = userDetail.stats.averageProgress;
    
    // حساب النقاط الإجمالية للتقييم
    const score = (points / 100) + (lessons * 10) + (badges * 20) + avgProgress;
    
    if (score >= 200) return 'متميز';
    if (score >= 100) return 'نشط';
    if (score >= 50) return 'متوسط';
    return 'يحتاج دعم';
}

// تحديث دالة showDetailTab
// دالة التبديل بين التبويبات - نسخة محدثة وكاملة
function showDetailTab(tab, button) {
    // تحديث الأزرار
    document.querySelectorAll('#studentDetailsModal .tab-btn').forEach(btn => {
        btn.classList.remove('active');
    });
    button.classList.add('active');
    
    const userId = document.getElementById('studentDetailsModal').getAttribute('data-user-id');
    const user = allData.users.find(u => u.id === userId);
    const userDetail = allData.detailedProgress[userId];
    
    const content = document.getElementById('detailTabContent');
    
    switch(tab) {
        case 'overview':
            content.innerHTML = generateOverviewTab(user, userDetail);
            break;
        case 'points':
            content.innerHTML = generatePointsTab(userDetail);
            break;
        case 'lessons':
            content.innerHTML = generateLessonsHistoryTab(userDetail);
            break;
        case 'badges':
            content.innerHTML = generateBadgesTab(userDetail);
            break;
        case 'timeline':
            content.innerHTML = generateTimelineTab(userDetail);
            break;
    }
}

// دالة توليد تبويب الجدول الزمني
function generateTimelineTab(userDetail) {
    let events = [];
    
    // جمع جميع الأحداث
    userDetail.lessons.timeline.forEach(item => {
        events.push({
            date: item.date,
            type: 'lesson',
            icon: '📚',
            color: '#3b82f6',
            title: 'أكمل درس',
            details: item.lesson.lessonTitle,
            points: item.lesson.pointsEarned
        });
    });
    
    userDetail.badges.timeline.forEach(item => {
        events.push({
            date: item.date,
            type: 'badge',
            icon: '🏅',
            color: '#fbbf24',
            title: 'حصل على شارة',
            details: item.badge.name,
            points: 0
        });
    });
    
    // ترتيب الأحداث
    events.sort((a, b) => new Date(b.date) - new Date(a.date));
    
    return `
        <div class="timeline-container">
            <h3 style="color: var(--primary-blue); margin-bottom: 20px;">
                <i class="fas fa-history"></i> السجل الزمني الكامل
            </h3>
            ${events.slice(0, 20).map(event => `
                <div class="timeline-item">
                    <div style="display: flex; justify-content: space-between; align-items: start;">
                        <div style="flex: 1;">
                            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 5px;">
                                <span style="font-size: 1.5rem;">${event.icon}</span>
                                <span style="color: ${event.color}; font-weight: bold;">${event.title}</span>
                            </div>
                            <div style="color: rgba(255,255,255,0.8);">${event.details}</div>
                            ${event.points > 0 ? `
                                <div style="margin-top: 5px;">
                                    <span style="
                                        background: rgba(34, 197, 94, 0.2);
                                        color: #22c55e;
                                        padding: 2px 10px;
                                        border-radius: 10px;
                                        font-size: 0.85rem;
                                    ">+${event.points} نقطة</span>
                                </div>
                            ` : ''}

        // تحليل النشاط اليومي
function analyzeDailyActivity() {
    const dailyMap = new Map();
    
    // تجميع البيانات حسب التاريخ
    allData.daily.forEach(activity => {
        const date = activity.date;
        
        if (!dailyMap.has(date)) {
            dailyMap.set(date, {
                date: date,
                lessons: 0,
                points: 0,
                badges: 0,
                students: new Set()
            });
        }
        
        const dayData = dailyMap.get(date);
        dayData.lessons += activity.lessonsCompleted?.length || 0;
        dayData.points += activity.totalPointsToday || 0;
        dayData.badges += activity.badgesEarnedToday?.length || 0;
        dayData.students.add(activity.userId);
    });
    
    // تحويل إلى مصفوفة وحساب المتوسطات
    const dailyRecords = Array.from(dailyMap.values()).map(day => ({
        ...day,
        students: day.students.size
    })).sort((a, b) => new Date(b.date) - new Date(a.date));
    
    const totalDays = dailyRecords.length;
    
    return {
        dailyRecords: dailyRecords,
        totalActiveDays: totalDays,
        avgDailyLessons: totalDays > 0 ? Math.round(dailyRecords.reduce((sum, d) => sum + d.lessons, 0) / totalDays) : 0,
        avgDailyStudents: totalDays > 0 ? Math.round(dailyRecords.reduce((sum, d) => sum + d.students, 0) / totalDays) : 0,
        avgDailyPoints: totalDays > 0 ? Math.round(dailyRecords.reduce((sum, d) => sum + d.points, 0) / totalDays) : 0
    };
}

// تحليل الاتجاهات الأسبوعية
function analyzeWeeklyTrends() {
    const dailyAnalysis = analyzeDailyActivity();
    return dailyAnalysis.dailyRecords.slice(0, 30).reverse();
}

// أكثر الأيام نشاطاً
function getTopActiveDays() {
    const dailyAnalysis = analyzeDailyActivity();
    return dailyAnalysis.dailyRecords
        .sort((a, b) => (b.lessons + b.points/10) - (a.lessons + a.points/10))
        .slice(0, 10);
}

        alert('لا توجد بيانات لهذا اليوم');
        return;
    }
    
    const studentsSet = new Set();
    let totalLessons = 0;
    let totalPoints = 0;
    let totalBadges = 0;
    
    dayActivities.forEach(activity => {
        studentsSet.add(activity.userId);
        totalLessons += activity.lessonsCompleted?.length || 0;
        totalPoints += activity.totalPointsToday || 0;
        totalBadges += activity.badgesEarnedToday?.length || 0;
    });
    
    alert(`تفاصيل يوم ${new Date(date).toLocaleDateString('ar-SA')}:\n\n` +
          `الطلاب النشطون: ${studentsSet.size}\n` +
          `الدروس المكتملة: ${totalLessons}\n` +
          `النقاط المكتسبة: ${totalPoints}\n` +
          `الشارات الممنوحة: ${totalBadges}`);
}

// دالة حساب الوقت المنقضي
function getTimeAgo(date) {
    const seconds = Math.floor((new Date() - date) / 1000);
    
    if (seconds < 60) return 'منذ لحظات';
    if (seconds < 3600) return `منذ ${Math.floor(seconds / 60)} دقيقة`;
    if (seconds < 86400) return `منذ ${Math.floor(seconds / 3600)} ساعة`;
    if (seconds < 604800) return `منذ ${Math.floor(seconds / 86400)} يوم`;
    return date.toLocaleDateString('ar-SA');
}

// دالة تحليل المشاركة
function analyzeEngagement() {
    const totalStudents = allData.users.length;
    const activeStudents = allData.users.filter(user => {
        const userDetail = allData.detailedProgress[user.id];
        return userDetail && userDetail.lessons.total > 0;
    }).length;
    
    return {
        totalStudents: totalStudents,
        activeStudents: activeStudents,
        engagementRate: totalStudents > 0 ? Math.round((activeStudents / totalStudents) * 100) : 0
    };
}

// دالة تحليل الاتجاهات
function analyzeTrends() {
    const weeklyData = [];
    const now = new Date();
    
    for (let i = 3; i >= 0; i--) {
        const weekStart = new Date(now);
        weekStart.setDate(now.getDate() - (i * 7));
        const weekEnd = new Date(weekStart);
        weekEnd.setDate(weekStart.getDate() + 7);
        
        const weekActivities = allData.completionHistory.filter(record => {
            const date = new Date(record.completedAt);
            return date >= weekStart && date < weekEnd;
        });
        
        weeklyData.push({
            week: i,
            activities: weekActivities.length
        });
    }
    
    const currentWeek = weeklyData[3]?.activities || 0;
    const previousWeek = weeklyData[2]?.activities || 1;
    const growthRate = Math.round(((currentWeek - previousWeek) / previousWeek) * 100);
    
    return {
        weeklyData: weeklyData,
        growthRate: growthRate,
        trend: growthRate > 5 ? 'up' : growthRate < -5 ? 'down' : 'stable'
    };
}

        // دالة للحصول على أفضل طلاب دورة معينة
function getTopStudentsForCourse(courseId) {
    const courseStudents = [];
    
    allData.users.forEach(user => {
        const userDetail = allData.detailedProgress[user.id];
        if (!userDetail) return;
        
        const courseLessons = userDetail.lessons.byCourse[courseId];
        if (courseLessons && courseLessons.lessons.length > 0) {
            courseStudents.push({
                name: user.name,
                points: courseLessons.totalPoints,
                lessons: courseLessons.lessons.length
            });
        }
    });
    
    return courseStudents
        .sort((a, b) => b.points - a.points)
        .slice(0, 5);
}

        // فلترة الدروس
function filterLessons() {
    const searchTerm = document.getElementById('lessonSearchInput').value.toLowerCase();
    const courseFilter = document.getElementById('lessonCourseFilter').value;
    const sortFilter = document.getElementById('lessonSortFilter').value;
    
    const rows = document.querySelectorAll('.lesson-row');
    let visibleRows = Array.from(rows);
    
    // تطبيق الفلاتر
    visibleRows = visibleRows.filter(row => {
        const lessonName = row.getAttribute('data-lesson-name');
        const courseName = row.getAttribute('data-course-name');
        
        const matchesSearch = lessonName.includes(searchTerm);
        const matchesCourse = courseFilter === 'all' || courseName === courseFilter;
        
        return matchesSearch && matchesCourse;
    });
    
    // إخفاء الصفوف غير المطابقة
    rows.forEach(row => row.style.display = 'none');
    
    // ترتيب وعرض الصفوف المطابقة
    if (sortFilter === 'students') {
        visibleRows.sort((a, b) => 
            parseInt(b.getAttribute('data-students')) - parseInt(a.getAttribute('data-students'))
        );
    } else if (sortFilter === 'recent') {
        visibleRows.sort((a, b) => 
            parseInt(b.getAttribute('data-date')) - parseInt(a.getAttribute('data-date'))
        );
    } else if (sortFilter === 'points') {
        visibleRows.sort((a, b) => 
            parseInt(b.getAttribute('data-points')) - parseInt(a.getAttribute('data-points'))
        );
    } else if (sortFilter === 'name') {
        visibleRows.sort((a, b) => 
            a.getAttribute('data-lesson-name').localeCompare(b.getAttribute('data-lesson-name'), 'ar')
        );
    }
    
    visibleRows.forEach((row, index) => {
        row.style.display = '';
        row.querySelector('td:first-child').textContent = index + 1;
    });
}

// إعادة تعيين الفلاتر
function resetLessonFilters() {
    document.getElementById('lessonSearchInput').value = '';
    document.getElementById('lessonCourseFilter').value = 'all';
    document.getElementById('lessonSortFilter').value = 'students';
    filterLessons();
}

function exportLessonsData() {
    if (!window.lessonsDetailedData) {

    const data = window.lessonsDetailedData.map((lesson, index) => ({

    }));

}

// تحويل لـ CSV
function convertToCSV(data) {
    if (!data || data.length === 0) return '';
    
    const headers = Object.keys(data[0]);
    const csvRows = [];
    
    csvRows.push(headers.join(','));
    
    data.forEach(row => {
        const values = headers.map(header => {
            const value = row[header];
            return `"${value}"`;
        });
        csvRows.push(values.join(','));
    });
    
    return csvRows.join('\n');
}

// تحميل CSV
function downloadCSV(csv, filename) {
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    link.click();
}

// فلترة الشارات
function filterBadges() {
    const searchTerm = document.getElementById('badgeSearchInput').value.toLowerCase();
    const typeFilter = document.getElementById('badgeTypeFilter').value;
    const sortFilter = document.getElementById('badgeSortFilter').value;
    
    // الحصول على جميع بطاقات الشارات
    const badgeCards = document.querySelectorAll('.badge-card');
    const sections = document.querySelectorAll('.badge-type-section');
    
    let visibleBadges = [];
    
    // فلترة حسب البحث والنوع
    badgeCards.forEach(card => {
        const badgeName = card.getAttribute('data-badge-name');
        const parentSection = card.closest('.badge-type-section');
        const sectionType = parentSection ? parentSection.getAttribute('data-type') : '';
        
        const matchesSearch = badgeName.includes(searchTerm);
        const matchesType = typeFilter === 'all' || sectionType === typeFilter;
        
        if (matchesSearch && matchesType) {
            card.style.display = '';
            visibleBadges.push({
                element: card,
                name: badgeName,
                awarded: parseInt(card.getAttribute('data-awarded')),
                date: parseInt(card.getAttribute('data-last-awarded'))
            });
        } else {
            card.style.display = 'none';
        }
    });
    
    // ترتيب الشارات المرئية
    if (sortFilter === 'awarded') {
        visibleBadges.sort((a, b) => b.awarded - a.awarded);
    } else if (sortFilter === 'recent') {
        visibleBadges.sort((a, b) => b.date - a.date);
    } else if (sortFilter === 'name') {
        visibleBadges.sort((a, b) => a.name.localeCompare(b.name, 'ar'));
    }
    
    // إعادة ترتيب العناصر في DOM
    visibleBadges.forEach(badge => {
        const parent = badge.element.parentNode;
        parent.appendChild(badge.element);
    });
    
    // إخفاء الأقسام الفارغة
    sections.forEach(section => {
        const visibleCards = section.querySelectorAll('.badge-card[style=""]');
        if (visibleCards.length === 0) {
            section.style.display = 'none';
        } else {
            section.style.display = '';
        }
    });
}

// إعادة تعيين فلاتر الشارات
function resetBadgeFilters() {
    document.getElementById('badgeSearchInput').value = '';
    document.getElementById('badgeTypeFilter').value = 'all';
    document.getElementById('badgeSortFilter').value = 'awarded';
    
    // إعادة عرض جميع العناصر
    document.querySelectorAll('.badge-card').forEach(card => {
        card.style.display = '';
    });
    document.querySelectorAll('.badge-type-section').forEach(section => {
        section.style.display = '';
    });
}

function exportBadgesData() {
    if (!window.badgesDetailedData) {
        alert('لا توجد بيانات للتصدير');
        return;
    }
    
    const data = [];

        const badgeRow = {

            'اسم الشارة': badge.name,
            'الرمز': badge.icon,

        };
        
        data.push(badgeRow);
        
        // إضافة صف لكل طالب حصل على الشارة

    });
    
    const csv = convertToCSV(data);
    downloadCSV(csv, 'badges-statistics.csv');
    
    alert('✅ تم تصدير بيانات الشارات بنجاح!');
