.testimonials-section {
    padding: 80px 0;
    background: linear-gradient(135deg, var(--bg-darker) 0%, var(--bg-dark) 100%);
    position: relative;

}

    position: absolute;

    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--primary-gold), transparent);
    animation: shimmerLine 3s infinite;
}

@keyframes shimmerLine {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
}

.testimonials-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
    gap: 30px;
    margin-top: 50px;
}

.testimonial-card {
    background: linear-gradient(135deg, 
        rgba(30,41,59,0.8) 0%, 
        rgba(30,41,59,0.6) 100%);

    border-radius: 20px;
    padding: 30px;
    position: relative;
    transition: all 0.4s ease;
    animation: fadeInUp 0.8s ease backwards;
    backdrop-filter: blur(10px);
}

.testimonial-card:hover {

    border-color: var(--primary-gold);
    box-shadow: 0 20px 40px rgba(251,191,36,0.2);
}

.testimonial-card.highlighted {

.testimonial-text {

    font-style: italic;
}

.testimonial-text.collapsed {
    max-height: 100px;
    overflow: hidden;
    position: relative;
}

.testimonial-text.collapsed::after {

    bottom: 0;
    left: 0;
    right: 0;

.author-info {

}

.author-name {
    font-size: 1.1rem;

.author-job {

.author-course {

/* Skeleton Loading */
.testimonial-skeleton {

    animation: skeleton 1.5s infinite;

/* Responsive */

        // تصفية الرسائل غير المهمة

   // نظام الشهادات المتكامل مع Firebase
const TestimonialsManager = {
    allTestimonials: [],
    container: null,
    maxCards: 6,
    currentDisplayIndex: 0,
    rotationTimer: null,
    isLoading: false,
    
    init() {
        if (this.isLoading) return;
        this.isLoading = true;
        
        this.container = document.getElementById('testimonialsContainer');
        if (!this.container) {
            console.log('لا يوجد حاوية للشهادات');
            this.isLoading = false;
            return;
        }
        
        // التحقق من وجود Firebase
        if (typeof db !== 'undefined') {
            this.loadFromFirebase();
        } else {
            console.log('انتظار Firebase...');
            setTimeout(() => {
                this.isLoading = false;
                this.init();
            }, 1000);
        }
    },
    
    async loadFromFirebase() {
        try {
            // جلب كل الدورات من Firebase
            const snapshot = await db.collection('courses').get();
            
            if (!snapshot.empty) {
                const allCourses = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data) {
                        allCourses.push({
                            id: doc.id,
                            ...data
                        });
                    }
                });
                
                this.processTestimonials(allCourses);
            } else {
                this.showDefaultTestimonials();
            }
        } catch (error) {
            console.error('خطأ Firebase:', error);
            this.showDefaultTestimonials();
        }
        
        this.isLoading = false;
    },
    
    processTestimonials(courses) {
        this.allTestimonials = [];
        
        courses.forEach(course => {
            // التحقق من وجود testimonials
            if (!course || !course.testimonials) return;
            
            let testimonialsList = [];
            
            // التعامل مع البنية المختلفة للبيانات
            if (course.testimonials.testimonials && Array.isArray(course.testimonials.testimonials)) {
                testimonialsList = course.testimonials.testimonials;
            } else if (Array.isArray(course.testimonials)) {
                testimonialsList = course.testimonials;
            } else if (typeof course.testimonials === 'object') {
                // إذا كان object، حاول استخراج القيم
                Object.values(course.testimonials).forEach(item => {
                    if (Array.isArray(item)) {
                        testimonialsList = testimonialsList.concat(item);
                    }
                });
            }
            
            // معالجة كل شهادة
            testimonialsList.forEach(testimonial => {
                if (this.isValidTestimonial(testimonial)) {
                    this.addTestimonial(testimonial, course);
                }
            });
        });
        
        // ترتيب الشهادات: المميزة أولاً
        this.allTestimonials.sort((a, b) => {
            if (a.highlight && !b.highlight) return -1;
            if (!a.highlight && b.highlight) return 1;
            return 0;
        });
        
        // عرض الشهادات أو الافتراضية
        if (this.allTestimonials.length > 0) {
            this.shuffleArray();
            this.displayTestimonials();
            
            // بدء التدوير إذا كان هناك أكثر من 6 شهادات
            if (this.allTestimonials.length > this.maxCards) {
                this.startAutoRotation();
            }
        } else {
            this.showDefaultTestimonials();
        }
    },
    
    isValidTestimonial(testimonial) {
        if (!testimonial || !testimonial.text) return false;
        
        // التحقق من أن الشهادة موثقة
        const isVerified = testimonial.verified === true || 
                          testimonial.verified === 'true' || 
                          testimonial.verified === 1 ||
                          testimonial.verified === '1';
        
        return isVerified;
    },
    
    addTestimonial(testimonial, course) {
        // معالجة الاسم والوظيفة
        let name = testimonial.name || 'متدرب';
        let job = '';
        
        if (name.includes('$$')) {
            const parts = name.split('$$');
            name = parts[0].trim();
            job = parts[1] ? parts[1].trim() : '';
        }
        
        // الحصول على الأيقونة
        const icon = this.getSmartIcon(
            testimonial.gender || '',
            testimonial.age || '',
            name
        );
        
        // إضافة الشهادة للقائمة
        this.allTestimonials.push({
            name: name,
            text: testimonial.text,
            rating: parseInt(testimonial.rating) || 5,
            course: testimonial.course || course.title || 'دورة تحويلية',
            date: testimonial.date || '',
            job: job || testimonial.job || '',
            highlight: testimonial.highlight === true || testimonial.highlight === 'true',
            verified: true,
            icon: icon
        });
    },
    
    getSmartIcon(gender, age, name) {
        const iconSets = {
            male: {
                young: ['👦', '👨‍🎓', '👨'],
                adult: ['👨', '👨‍💼', '🧔'],
                middle: ['👨‍💼', '👨', '🧔'],
                mature: ['👴', '👨‍🦳', '👨']
            },
            female: {
                young: ['👧', '👩‍🎓', '👩'],
                adult: ['👩', '👩‍💼', '👩‍🏫'],
                middle: ['👩‍💼', '👩', '👩‍🏫'],
                mature: ['👵', '👩‍🦳', '👩']
            }
        };
        
        // إذا لم تكن البيانات متاحة، استخدم أيقونات افتراضية
        if (!gender || !age || !iconSets[gender] || !iconSets[gender][age]) {
            const defaultIcons = ['👨', '👩', '👨‍💼', '👩‍💼', '👨‍🎓', '👩‍🎓'];
            return defaultIcons[name.length % defaultIcons.length];
        }
        
        const appropriateIcons = iconSets[gender][age];
        return appropriateIcons[name.length % appropriateIcons.length];
    },
    
    shuffleArray() {
        // خلط الشهادات عشوائياً (ماعدا المميزة في البداية)
        const highlighted = this.allTestimonials.filter(t => t.highlight);
        const normal = this.allTestimonials.filter(t => !t.highlight);
        
        // خلط العادية فقط
        for (let i = normal.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [normal[i], normal[j]] = [normal[j], normal[i]];
        }
        
        this.allTestimonials = [...highlighted, ...normal];
    },
    
    displayTestimonials() {
        if (!this.container) return;
        
        // مسح المحتوى السابق
        this.container.innerHTML = '';
        
        // عرض أول 6 شهادات
        const toDisplay = this.allTestimonials.slice(0, this.maxCards);
        
        toDisplay.forEach((testimonial, index) => {
            this.createTestimonialCard(testimonial, index);
        });
        
        this.currentDisplayIndex = this.maxCards;
    },
    
    createTestimonialCard(testimonial, index) {
        const card = document.createElement('div');
        card.className = 'testimonial-card';
        if (testimonial.highlight) {
            card.className += ' highlighted';
        }
        
        // بناء النجوم
        let starsHTML = '';
        for (let i = 1; i <= 5; i++) {
            if (i <= testimonial.rating) {
                starsHTML += '<i class="fas fa-star"></i>';
            } else {
                starsHTML += '<i class="far fa-star" style="opacity: 0.3;"></i>';
            }
        }
        
        // التحقق من طول النص
        const isLongText = testimonial.text.length > 150;
        const textClass = isLongText ? 'collapsed' : '';
        
        // بناء HTML للبطاقة
        card.innerHTML = `
            ${testimonial.highlight ? '<span class="highlight-badge">⭐ مميز</span>' : ''}
            <div class="testimonial-header">
                <div class="stars">${starsHTML}</div>
                <span class="verified-badge">✓ موثق</span>
            </div>
            <p class="testimonial-text ${textClass}">"${testimonial.text}"</p>
            ${isLongText ? '<button class="read-more-btn" onclick="TestimonialsManager.toggleText(this)">اقرأ المزيد</button>' : ''}
            <div class="testimonial-author">
                <div class="author-avatar">${testimonial.icon}</div>
                <div class="author-info">
                    <h5 class="author-name">${testimonial.name}</h5>
                    ${testimonial.job ? `<small class="author-job">${testimonial.job}</small>` : ''}
                    <small class="author-course">📚 ${testimonial.course}</small>
                    ${testimonial.date ? `<small class="author-date">📅 ${testimonial.date}</small>` : ''}
                </div>
            </div>
        `;
        
        // إضافة تأخير للأنيميشن
        card.style.animationDelay = `${index * 0.1}s`;
        
        this.container.appendChild(card);
    },
    
    toggleText(button) {
        const textElement = button.previousElementSibling;
        
        if (textElement.classList.contains('collapsed')) {
            textElement.classList.remove('collapsed');
            button.textContent = 'اقرأ أقل';
        } else {
            textElement.classList.add('collapsed');
            button.textContent = 'اقرأ المزيد';
        }
    },
    
    startAutoRotation() {
        // التدوير كل 8 ثواني
        this.rotationTimer = setInterval(() => {
            this.rotateTestimonials();
        }, 8000);
    },
    
    rotateTestimonials() {
        if (!this.container) return;
        
        // الحصول على البطاقات الحالية
        const cards = this.container.querySelectorAll('.testimonial-card');
        if (cards.length === 0) return;
        
        // اختيار بطاقة عشوائية للاستبدال
        const randomIndex = Math.floor(Math.random() * cards.length);
        const cardToReplace = cards[randomIndex];
        
        // إعادة تعيين الفهرس إذا وصل للنهاية
        if (this.currentDisplayIndex >= this.allTestimonials.length) {
            this.currentDisplayIndex = 0;
            this.shuffleArray();
        }
        
        // الحصول على الشهادة التالية
        const nextTestimonial = this.allTestimonials[this.currentDisplayIndex];
        this.currentDisplayIndex++;
        
        // تأثير الإخفاء
        cardToReplace.style.opacity = '0';
        cardToReplace.style.transform = 'scale(0.9)';
        
        // استبدال البطاقة بعد الإخفاء
        setTimeout(() => {
            this.createTestimonialCard(nextTestimonial, randomIndex);
            const newCard = this.container.lastChild;
            this.container.replaceChild(newCard, cardToReplace);
        }, 500);
    },
    
    showDefaultTestimonials() {
        // شهادات افتراضية
        this.allTestimonials = [
            {
                name: 'أحمد محمد',
                job: 'مهندس برمجيات',
                text: 'رحلة تحويلية حقيقية! تعلمت كيف أعيش بلا أقنعة وأكتشف ذاتي الحقيقية. المحتوى عميق والمدرب متمكن.',
                rating: 5,
                course: 'رحلة سابقة',
                date: 'يناير 2024',
                highlight: true,
                verified: true,
                icon: '👨‍💻'
            },
            {
                name: 'سارة أحمد',
                job: 'معلمة',
                text: 'أفضل استثمار في حياتي. الدورة غيرت نظرتي للحياة تماماً وساعدتني في فهم نفسي بشكل أعمق.',
                rating: 5,
                course: 'رحلة سابقة',
                date: 'ديسمبر 2023',
                verified: true,
                icon: '👩‍🏫'
            },
            {
                name: 'محمد علي',
                job: 'طبيب',
                text: 'محتوى استثنائي ومؤثر. تعلمت أدوات عملية للتعامل مع التحديات اليومية.',
                rating: 5,
                course: 'رحلة سابقة',
                date: 'نوفمبر 2023',
                verified: true,
                icon: '👨‍⚕️'
            }
        ];
        
        this.displayTestimonials();
    },
    
    destroy() {
        if (this.rotationTimer) {
            clearInterval(this.rotationTimer);
            this.rotationTimer = null;
        }
    }
};

async function loadCourseData() {
    const urlParams = new URLSearchParams(window.location.search);
    const courseId = urlParams.get('course');
    
    if (!courseId) {
        console.log('معرف الدورة مفقود - استخدام البيانات الافتراضية');
        showFallbackContent();
        return;
    }
    
    try {
        // انتظار Firebase
        if (typeof db === 'undefined') {
            console.log('انتظار تحميل Firebase...');
            setTimeout(() => loadCourseData(), 500);
            return;
        }
        
        console.log('جاري جلب بيانات الدورة:', courseId);
        const courseRef = db.collection('courses').doc(courseId);
        const doc = await courseRef.get();
        
        if (!doc.exists) {
            console.log('الدورة غير موجودة - استخدام البيانات الافتراضية');
            showFallbackContent();
            return;
        }
        
        const courseData = doc.data();
        console.log('البيانات المستلمة:', courseData);
        
        // تصحيح الأسعار إذا كانت خاطئة
        if (courseData.price < 100) {

// دالة تحديث الصفحة بالبيانات
function updatePageWithData(courseData) {
    // تأكد من وجود البيانات
    if (!courseData) {
        console.error('لا توجد بيانات للتحديث');
        return;
    }
    // ========== معالجة أنواع الرحلات المتاحة ==========
    if (courseData.tripTypes) {
        console.log('أنواع الرحلات المحملة:', courseData.tripTypes);
        
        // إخفاء/إظهار أنواع الرحلات حسب الإعدادات
        const journeyOptions = document.querySelectorAll('.journey-option');
        
        journeyOptions.forEach(option => {
            const journeyType = option.dataset.journey;
            
            if (journeyType === 'individual') {
                // رحلة فردية
                if (!courseData.tripTypes.individual?.enabled) {
                    option.style.display = 'none';
                    console.log('تم إخفاء: رحلة فردية');
                }
            } else if (journeyType === 'group') {
                // رحلة جماعية  
                if (!courseData.tripTypes.group?.enabled) {
                    option.style.display = 'none';
                    console.log('تم إخفاء: رحلة جماعية');
                }
            } else if (journeyType === 'gift') {
                // إهداء رحلة
                if (!courseData.tripTypes.gift?.enabled) {
                    option.style.display = 'none';
                    console.log('تم إخفاء: إهداء رحلة');
                }
            }
        });
        
        // اختيار أول نوع متاح تلقائياً
        const visibleOptions = document.querySelectorAll('.journey-option:not([style*="display: none"])');
        if (visibleOptions.length > 0) {
            // إذا لم يكن هناك خيار محدد، اختر الأول
            const hasActive = document.querySelector('.journey-option.active');
            if (!hasActive) {
                visibleOptions[0].click();
                console.log('تم اختيار أول خيار متاح:', visibleOptions[0].dataset.journey);
            }
        }
        
        // إخفاء القسم بالكامل إذا كان خيار واحد فقط
        if (visibleOptions.length === 1) {
            const journeyContainer = document.querySelector('.journey-options');
            if (journeyContainer) {
                journeyContainer.style.display = 'none';
                console.log('تم إخفاء قسم اختيار نوع الرحلة - خيار واحد فقط متاح');
            }
        }
    } else {
        console.log('لا توجد إعدادات أنواع الرحلات - عرض الكل افتراضياً');
    }
    console.log('تحديث الصفحة بالبيانات:', courseData);
    
    // تحديث العنوان بأمان
    const titleElement = document.querySelector('.hero-title');
    if (titleElement && courseData.title) {
        titleElement.textContent = courseData.title;
    }
    
    // تحديد السيناريو
    const scenario = detectActiveScenario(courseData);
    console.log('السيناريو النشط:', scenario);
    
    // تحديث العروض النشطة بأمان
    if (typeof updateActiveOffers === 'function') {
        updateActiveOffers(courseData, scenario);
    }
    
    // تحديث الحاسبة بأمان
    if (typeof smartCalculator !== 'undefined' && smartCalculator.updateFromFirebase) {
        smartCalculator.updateFromFirebase();
    }
    
    // تحديث الجدول بأمان
    if (typeof buildDynamicPricingTable === 'function') {
        buildDynamicPricingTable(courseData, scenario);
    }
}
