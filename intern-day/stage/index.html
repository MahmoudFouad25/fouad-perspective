<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شاشة العرض · إنت بتردّ على إيه؟</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/day.css?v=3">
<style>
  html,body{overflow:hidden;cursor:none}
  /* على شاشة صغيرة (معاينة من موبايلك إنت) الشرايح بتبقى أطول من الشاشة —
     نسمح بالتمرير ونشيل إخفاء المؤشر. البروجيكتور مش هيحسّ بده. */
  @media (max-width:820px){
    html,body{overflow:auto;cursor:auto}
    .stage{position:relative;min-height:100vh;align-items:flex-start}
    .sg{padding:8vh 6vw 12vh}
    .fs{display:none}
  }
</style>
</head>
<body>

<div class="stage" id="stage"><div class="grain"></div><div class="sg" id="sg"></div></div>
<div class="eyebrow" id="eyebrow"></div>
<div class="rail" id="rail"></div>
<button class="fs" id="fs">ملء الشاشة</button>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../assets/day-config.js?v=3"></script>
<script src="../assets/day-content.js?v=3"></script>
<script src="../assets/day-core.js?v=3"></script>
<script src="../assets/day-render.js?v=3"></script>
<script>
(function () {
  "use strict";

  var SID     = Day.qs("s", DAY_SETTINGS.sessionId);
  var stage   = document.getElementById("stage");
  var sg      = document.getElementById("sg");
  var eyebrow = document.getElementById("eyebrow");
  var rail    = document.getElementById("rail");
  var lastKey = "";

  document.getElementById("fs").onclick = function () {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  };

  /* السكّة السفلية — عشر خانات، واحدة لكل حركة */
  (function () {
    var h = "";
    for (var i = 0; i < DAY_MOVEMENTS.length; i++) h += "<i></i>";
    rail.innerHTML = h;
  })();

  /* ═══════════ الاشتراك ═══════════ */

  Day.signInSilently().then(function () {
    Day.watchSession(SID, draw, function (e) {
      console.warn("[stage] watch:", e && e.code);
      Day.reconnect();
    });
  }).catch(function (e) {
    /* بدل الشاشة السودا الصامتة: السبب مكتوب، عشان اللي واقف جنب
       البروجيكتور يعرف يتصرّف في ثانية بدل ما يفضل يبصّ. */
    sg.className = "sg";
    sg.innerHTML = '<div class="in"><div class="hold"><div class="h">' +
      DayRender.esc(Day.errText(e)) + '</div><div class="s">' +
      DayRender.esc((e && e.code) || "") + '</div></div></div>';
    setTimeout(function () { location.reload(); }, 15000);
  });

  /* الشاشة الكبيرة بتفضل مفتوحة ساعات — لو الجهاز نام أو الشبكة رجعت،
     القناة بتتفتح تاني من day-core. وده بيرغم إعادة رسم بعد الرجوع. */
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") lastKey = "";
  });

  function draw(s) {
    if (!s) return DayRender.blank(sg);

    var st  = dayState(s.state);
    var sgd = dayStageOf(st, s.sub || 0);
    var pl  = s.stagePayload || {};

    /* قبل ضغطة «اعرض» — بنعرض شاشة الانتظار المصمّمة، مش سواد ميّت */
    if (st.reveal && !s.revealed) sgd = st.hold || { k: "hold", ic: "⋯", h: "" };

    var key = s.state + "|" + (s.sub || 0) + "|" + (s.revealed ? 1 : 0) + "|" + (s.payloadSeq || 0);
    if (key === lastKey) return;
    lastKey = key;

    DayRender.render({
      state: st, slide: sgd, payload: pl,
      stage: stage, holder: sg, eyebrow: eyebrow, rail: rail,
      expected: DAY_SETTINGS.expectedCount
    });
  }

})();
</script>
</body>
</html>
