<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>معاينة الشرايح · إنت بتردّ على إيه؟</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/day.css">
<style>
  .pv-bar{position:sticky;top:0;z-index:40;background:rgba(6,6,10,.92);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding:14px 18px;display:flex;gap:10px;flex-wrap:wrap;
    align-items:center;justify-content:center}
  .pv-bar b{color:var(--accent);font-size:.92rem;letter-spacing:.08em}
  .pv-bar select,.pv-bar button{background:rgba(255,255,255,.06);color:var(--ink);
    border:1px solid var(--line);border-radius:11px;padding:9px 13px;font-size:.9rem;cursor:pointer}
  .pv-count{color:var(--ink-3);font-size:.86rem}
</style>
</head>
<body class="preview">

<div class="pv-bar">
  <b>معاينة الشرايح</b>
  <select id="filter"></select>
  <button id="print">اطبع</button>
  <span class="pv-count" id="count"></span>
</div>

<div class="pv-wrap" id="wrap"></div>

<script src="../assets/day-content.js"></script>
<script src="../assets/day-render.js"></script>
<script>
(function () {
  "use strict";
  /* ملاحظة: الصفحة دي مش بتتّصل بفايربيز خالص.
     المكوّنات الحيّة بتتعرض ببيانات وهمية عشان تشوف شكلها بس. */

  var FAKE = {
    count: 29,
    card: { said:"قلت له إني خلّصت الجزء بتاعي وإني مستنّي ردّه عشان أكمّل.",
            replied:"«تمام يا فندم» — وبعدين أسبوع من غير أي ردّ." },
    cloud: ["مساعدة","تعبان","بيشتكي","عايز حد يقدّره","عايز يخلص","عايز حد يشيل معاه",
            "بيقول إنه شاطر","زهقان","محتاج راحة","عايز يتسمع","بيتباهى","مضغوط","تقدير"],
    bigN: 27, bigOf: 34,
    tables: [
      {door:"A", gift:"بنشوف الغلط قبل ما يكبر", cost:"بنتأخّر عشان نتأكّد", missed:"إن حد كان عايز يتكلّم بس"},
      {door:"B", gift:"بنبدأ وبنحرّك الشغل", cost:"بنشيل فوق طاقتنا", missed:"إن اللي قدّامنا كان عايز يقفل"},
      {door:"C", gift:"بنقرا الجوّ ومبنكبّرش المشاكل", cost:"رأينا بيفضل جوّانا", missed:"إن حد كان مستنّي منّنا موقف"}
    ],
    wall: [
      {name:"", lines:DAY_MODELS[0]},
      {name:"من الدفعة", lines:DAY_MODELS[2]}
    ]
  };

  var wrap = document.getElementById("wrap");
  var filter = document.getElementById("filter");

  var opts = '<option value="">كل الحركات</option>';
  DAY_MOVEMENTS.forEach(function (m, i) {
    opts += '<option value="' + (i + 1) + '">' + (i + 1) + " · " + m + "</option>";
  });
  filter.innerHTML = opts;
  filter.onchange = paint;
  document.getElementById("print").onclick = function () { window.print(); };

  paint();

  function paint() {
    var only = filter.value ? parseInt(filter.value, 10) : 0;
    var html = "", n = 0;

    DAY_STATES.forEach(function (st) {
      var mv = dayMovementNo(st);
      if (only && mv !== only) return;
      var arr = st.slides || [st.stage];
      if (st.hold) arr = [st.hold].concat(arr);

      arr.forEach(function (sl, i) {
        n++;
        html += '<div class="pv-h"><b>' + st.id + "</b><span>" + st.name + "</span>" +
                "<span>· شريحة " + DayRender.ar(i + 1) + " من " + DayRender.ar(arr.length) + "</span>" +
                '<span style="margin-inline-start:auto;opacity:.6">' + sl.k + "</span></div>" +
                '<div class="stage" data-i="' + n + '"><div class="grain"></div>' +
                '<div class="sg"></div><div class="eyebrow"></div><div class="rail"></div></div>';
      });
    });

    wrap.innerHTML = html;
    document.getElementById("count").textContent = DayRender.ar(n) + " شريحة";

    /* الرسم بعد ما العناصر تدخل الصفحة */
    var boxes = wrap.querySelectorAll(".stage"), k = 0;
    DAY_STATES.forEach(function (st) {
      var mv = dayMovementNo(st);
      if (only && mv !== only) return;
      var arr = st.slides || [st.stage];
      if (st.hold) arr = [st.hold].concat(arr);
      arr.forEach(function (sl) {
        var box = boxes[k++]; if (!box) return;
        var rail = box.querySelector(".rail");
        rail.innerHTML = DAY_MOVEMENTS.map(function () { return "<i></i>"; }).join("");
        /* كل شريحة ليها جوّها الخاص — فبنحطّ المتغيّرات على الصندوق نفسه */
        var saved = document.documentElement.getAttribute("style");
        DayRender.render({
          state: st, slide: sl, payload: FAKE,
          stage: box, holder: box.querySelector(".sg"),
          eyebrow: box.querySelector(".eyebrow"), rail: rail, expected: 36
        });
        var s = document.documentElement.style;
        box.style.setProperty("--h1", s.getPropertyValue("--h1"));
        box.style.setProperty("--h2", s.getPropertyValue("--h2"));
        box.style.setProperty("--glow", s.getPropertyValue("--glow"));
        box.style.setProperty("--accent", s.getPropertyValue("--accent"));
        if (saved === null) document.documentElement.removeAttribute("style");
      });
    });
  }
})();
</script>
</body>
</html>
