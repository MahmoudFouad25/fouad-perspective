<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة التحكّم · إنت بتردّ على إيه؟</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14131a; --bg2:#1b1922; --panel:#221f2b; --line:#332e40;
  --ink:#f5f2ec; --ink2:#a49cb0; --ink3:#6f6880;
  --gold:#e8b93f; --gold-d:#3a2f12;
  --blue:#63b3e0; --blue-d:#122c3a;
  --green:#7fc98a; --green-d:#14301a;
  --red:#ef7a5f; --red-d:#3a1a12;
  --violet:#b294e8; --violet-d:#251a3a;
  --f:"IBM Plex Sans Arabic","Noto Sans Arabic",-apple-system,"Segoe UI",Tahoma,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);overflow:hidden}
button,input,select{font-family:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ══ الدخول ══ */
.login{max-width:360px;margin:16vh auto;padding:26px;background:var(--panel);
  border:1px solid var(--line);border-radius:18px;text-align:center}
.login h2{margin:0 0 4px;font-size:1.2rem}
.login p{margin:0 0 18px;color:var(--ink2);font-size:.9rem}
.login input{width:100%;margin-bottom:10px;background:#151320;color:var(--ink);
  border:1px solid var(--line);border-radius:11px;padding:13px;font-size:1rem}
.err{color:var(--red);font-size:.9rem;min-height:1.3em;margin-top:8px}

/* ══ الهيكل ══ */
.app{display:none;height:100%;flex-direction:column}
.app.on{display:flex}

.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;
  background:linear-gradient(180deg,#221f2b,#1a1822);border-bottom:1px solid var(--line);flex:0 0 auto}
.id{font-size:1.35rem;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.id em{font-style:normal;color:var(--gold);font-size:.85em;margin-left:6px}
.mvt{color:var(--ink2);font-size:.85rem;border-right:1px solid var(--line);padding-right:10px;white-space:nowrap}
.sp{flex:1}
.chip{font-size:.82rem;padding:5px 11px;border-radius:999px;border:1px solid var(--line);
  color:var(--ink2);white-space:nowrap;background:#191722}
.chip.ok{color:var(--green);border-color:#2c4a32}
.chip.warn{color:var(--red);border-color:#4a2820}
.tbtn{background:#2a2636;border:1px solid var(--line);color:var(--ink2);border-radius:9px;
  padding:7px 12px;font-size:.85rem;cursor:pointer}
.tbtn:hover{color:var(--ink);border-color:var(--ink3)}

/* شريط الحركات */
.track{display:flex;gap:3px;padding:0 16px 9px;background:#1a1822;flex:0 0 auto}
.track i{flex:1;height:4px;border-radius:9px;background:#2c2838;display:block}
.track i.done{background:#4b4262}
.track i.now{background:var(--gold)}

/* ══ الجسم ══ */
.body{flex:1;display:grid;grid-template-columns:1fr 370px;gap:0;min-height:0}
@media (max-width:1080px){.body{grid-template-columns:1fr}.side{display:none}}

/* التلقين */
.tele{overflow-y:auto;padding:26px 34px 190px;scroll-behavior:smooth}
.blk{position:relative;padding:9px 20px 9px 8px;margin:2px 0;border-radius:12px;cursor:pointer;
  border-right:4px solid transparent;transition:background .12s}
.blk:hover{background:#1b1924}
.blk.cur{background:#241f33;border-right-color:var(--gold)}

.b-say{font-size:1.68rem;line-height:1.75;font-weight:400}
.b-k{font-size:1.78rem;line-height:1.7;font-weight:600;color:var(--gold);
  background:linear-gradient(90deg,rgba(232,185,63,.10),transparent);border-radius:12px}
.b-k::before{content:"⚑ يتقال بالحرف";display:block;font-size:.68rem;font-weight:500;
  color:#a98a2f;letter-spacing:.04em;margin-bottom:5px}
.b-h{font-size:.86rem;font-weight:600;color:var(--ink3);letter-spacing:.06em;
  margin:22px 0 4px;border-top:1px solid var(--line);padding-top:14px}
.b-n,.b-mv,.b-c,.b-scr,.b-mob,.b-ans{font-size:1.02rem;line-height:1.65;padding-right:12px;
  border-right-width:3px;border-right-style:solid}
.b-n{color:var(--ink2);border-right-color:#4a4458;font-style:italic}
.b-mv{color:var(--green);border-right-color:#3a6b42;background:rgba(127,201,138,.05)}
.b-c{color:var(--blue);border-right-color:#2f6a8a;background:rgba(99,179,224,.06)}
.b-scr{color:var(--violet);border-right-color:#5a4483;background:rgba(178,148,232,.06)}
.b-mob{color:var(--violet);border-right-color:#5a4483;background:rgba(178,148,232,.06)}
.b-ans{color:var(--red);border-right-color:#7a3a2a;background:rgba(239,122,95,.05)}
.tag{display:inline-block;font-size:.66rem;font-weight:600;letter-spacing:.05em;
  padding:2px 8px;border-radius:6px;margin-left:8px;vertical-align:middle;opacity:.9}
.b-n  .tag{background:#3a3448;color:#b6adc6}
.b-mv .tag{background:var(--green-d);color:var(--green)}
.b-c  .tag{background:var(--blue-d);color:var(--blue)}
.b-scr .tag,.b-mob .tag{background:var(--violet-d);color:var(--violet)}
.b-ans .tag{background:var(--red-d);color:var(--red)}

/* الصمت */
.b-b{display:flex;align-items:center;gap:12px;padding:12px 8px}
.b-b .lab{font-size:1rem;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.b-b .rail{flex:1;height:9px;border-radius:9px;background:#2a2636;overflow:hidden;max-width:520px}
.b-b .rail u{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#f0d37a);
  text-decoration:none}
.b-b.s3   .lab{color:#8f8aa0} .b-b.s10 .lab{color:var(--gold)} .b-b.s20 .lab{color:var(--red)}
.b-b .num{font-variant-numeric:tabular-nums;color:var(--ink3);font-size:.9rem;min-width:3ch}
.b-b.run .num{color:var(--gold)}

/* ══ الجانب ══ */
.side{background:var(--bg2);border-right:1px solid var(--line);overflow-y:auto;padding:16px 16px 190px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:12px}
.card h3{margin:0 0 9px;font-size:.78rem;font-weight:600;color:var(--ink3);letter-spacing:.07em}
.next{font-size:.95rem;color:var(--ink2);line-height:1.5}
.next b{color:var(--ink);font-weight:600}

.act{display:block;width:100%;text-align:right;background:#2a2636;border:1px solid var(--line);
  color:var(--ink);border-radius:12px;padding:11px 13px;margin-bottom:8px;cursor:pointer;font-size:.98rem}
.act small{display:block;color:var(--ink2);font-size:.79rem;margin-top:3px;line-height:1.45;font-weight:400}
.act:hover{border-color:var(--ink3)}
.act.hot{background:linear-gradient(180deg,#f0c451,#d8a52c);color:#241c05;border-color:#f0c451;font-weight:700}
.act.hot small{color:#4a3a08}
.act.danger{border-color:#5a2c22;color:var(--red)}
.act[disabled]{opacity:.35;cursor:default}
.act.done{border-color:#2c4a32;color:var(--green)}

.meter{height:9px;background:#2a2636;border-radius:9px;overflow:hidden;margin:8px 0 6px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#a8dbaf)}
.mini{font-size:.86rem;color:var(--ink2)}

.intern{border:1px dashed #6b4a2c;background:rgba(232,185,63,.05);border-radius:12px;
  padding:11px 13px;color:var(--gold);font-size:.92rem;line-height:1.6}
.intern b{display:block;font-size:.7rem;color:#a98a2f;letter-spacing:.06em;margin-bottom:5px}

.row{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid #2a2636;font-size:.92rem}
.row:first-of-type{border-top:0}
.row .g{flex:1;line-height:1.4}
.row .g em{font-style:normal;display:block;color:var(--ink3);font-size:.79rem;margin-top:2px}
.sm{background:#2a2636;border:1px solid var(--line);color:var(--ink2);border-radius:8px;
  padding:5px 9px;font-size:.79rem;cursor:pointer;white-space:nowrap}
.sm:hover{color:var(--ink)}
.sm.g{color:var(--green);border-color:#2c4a32}
.sm.r{color:var(--red);border-color:#5a2c22}
.sm[disabled]{opacity:.3;cursor:default}
.pill{font-size:.72rem;padding:2px 7px;border-radius:6px;background:#2a2636;color:var(--ink3)}
.pill.red{background:var(--red-d);color:var(--red)}
.pill.green{background:var(--green-d);color:var(--green)}
.list{max-height:270px;overflow-y:auto}

/* ══ الشريط السفلي ══ */
.foot{position:fixed;inset:auto 0 0 0;display:flex;align-items:center;gap:12px;
  padding:14px 20px;background:linear-gradient(0deg,#14131a 62%,rgba(20,19,26,0));z-index:5}
.nav{background:#2a2636;border:1px solid var(--line);color:var(--ink);border-radius:14px;
  padding:14px 20px;font-size:1.02rem;cursor:pointer}
.nav:hover{border-color:var(--ink3)}
.nav.main{background:linear-gradient(180deg,#f0c451,#d8a52c);color:#241c05;border-color:#f0c451;
  font-weight:700;padding:16px 40px;font-size:1.18rem;box-shadow:0 6px 26px rgba(232,185,63,.22)}
.dots{display:flex;gap:5px;margin-right:6px}
.dots b{width:9px;height:9px;border-radius:50%;background:#3a3448;display:block}
.dots b.on{background:var(--gold)}
.slab{flex:1;min-width:0;font-size:12.5px;color:#9a92ad;letter-spacing:.2px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 10px;
      border-right:1px solid #2e2839;margin-right:10px}
.slab b{color:var(--gold);font-weight:700}
.slab.wait{color:#e0a63c}
.jump{background:#2a2636;border:1px solid var(--line);color:var(--ink2);border-radius:12px;
  padding:12px;font-size:.92rem;max-width:210px}

/* ══ الطبقات ══ */
.veil{position:fixed;inset:0;background:rgba(10,9,14,.82);z-index:20;display:none;
  align-items:flex-start;justify-content:center;padding:5vh 4vw;overflow-y:auto}
.veil.on{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px;
  padding:22px;max-width:820px;width:100%}
.sheet h2{margin:0 0 14px;font-size:1.1rem}
.sheet h4{margin:18px 0 8px;font-size:.78rem;color:var(--gold);letter-spacing:.06em}
.qa{border-right:3px solid var(--line);padding:2px 12px;margin-bottom:12px}
.qa b{display:block;font-size:1rem;margin-bottom:4px}
.qa p{margin:0;color:var(--ink2);font-size:.95rem;line-height:1.65}
.close{position:sticky;top:0;float:left;background:#2a2636;border:1px solid var(--line);
  color:var(--ink);border-radius:9px;padding:7px 13px;cursor:pointer}
</style>
</head>
<body>

<div id="login"></div>
<div class="app" id="app">
  <div class="bar">
    <div class="id" id="sid">—</div>
    <div class="mvt" id="mvt"></div>
    <div class="sp"></div>
    <span class="chip" id="cOn">—</span>
    <span class="chip" id="cCards">—</span>
    <span class="chip" id="cClock">٠:٠٠</span>
    <button class="tbtn" id="bReplies">الردود الجاهزة</button>
    <button class="tbtn" id="bHelp">إيه ده؟</button>
    <button class="tbtn" id="bTools">أدوات</button>
    <button class="tbtn" id="bOut">خروج</button>
  </div>
  <div class="track" id="track"></div>
  <div class="body">
    <div class="tele" id="tele"></div>
    <div class="side" id="side"></div>
  </div>
  <div class="foot">
    <button class="nav main" id="bNext">التالي ◀</button>
    <button class="nav" id="bPrev">▶ السابق</button>
    <div class="dots" id="dots"></div>
    <div class="slab" id="slab"></div>
    <div class="sp"></div>
    <select class="jump" id="jump"></select>
  </div>
</div>

<div class="veil" id="veil"><div class="sheet" id="sheet"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../assets/day-config.js?v=3"></script>
<script src="../assets/day-content.js?v=3"></script>
<script src="../assets/day-script.js?v=3"></script>
<script src="../assets/day-core.js?v=3"></script>
<script>
(function () {
  "use strict";

  var SID = Day.qs("s", DAY_SETTINGS.sessionId);
  var INC = firebase.firestore.FieldValue.increment;
  var DEL = firebase.firestore.FieldValue.delete;

  var sess = null, people = [], cards = [], booted = false;
  var cursor = 0, beatTimer = null, lastPayload = "", startedAt = Date.now();
  var $ = function (id) { return document.getElementById(id); };

  /* ═════════ الدخول ═════════ */

  Day.auth.onAuthStateChanged(function (u) {
    if (!u) return login("");
    if (u.isAnonymous) { Day.auth.signOut(); return login(""); }
    if (!Day.isAdminUser(u)) return login("الإيميل ده مش في قايمة الأدمن.");
    boot();
  });

  function login(err) {
    if (booted) return;
    $("login").innerHTML =
      '<div class="login"><h2>لوحة التحكّم</h2><p>إنت بتردّ على إيه؟ · جلسة ' + Day.esc(SID) + "</p>" +
      '<input id="em" type="email" placeholder="الإيميل" autocomplete="username">' +
      '<input id="pw" type="password" placeholder="كلمة السر" autocomplete="current-password">' +
      '<button class="nav main" id="in" style="width:100%;padding:13px">ادخل</button>' +
      '<p class="err" id="er">' + Day.esc(err) + "</p></div>";
    var go = function () {
      $("er").textContent = "";
      Day.auth.signInWithEmailAndPassword($("em").value.trim(), $("pw").value)
        .catch(function (x) { $("er").textContent = "مش راضي يدخل. راجع الإيميل وكلمة السر."; console.warn(x); });
    };
    $("in").onclick = go;
    $("pw").addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
  }

  /* ═════════ التشغيل ═════════ */

  function boot() {
    if (booted) return;
    booted = true;
    $("login").innerHTML = "";
    $("app").classList.add("on");
    wire();

    Day.sRef(SID).get().then(function (d) {
      if (!d.exists) return Day.sRef(SID).set({
        title: "إنت بتردّ على إيه؟", state: "S00", stateSeq: 1, sub: 0, revealed: false,
        isOpen: true, stagePayload: {}, payloadSeq: 1, lockedAt: null,
        startedAt: Day.TS(), updatedAt: Day.TS()
      });
    }).catch(function (e) { console.warn(e); });

    Day.watchSession(SID, function (s) {
      var moved = !sess || !s || s.state !== sess.state || (s.sub || 0) !== (sess.sub || 0);
      sess = s;
      if (moved) { cursor = 0; stopBeat(); }
      paint(moved); sync();
    });
    Day.pCol(SID).onSnapshot(function (q) {
      people = q.docs.map(function (d) { var x = d.data() || {}; x.slug = d.id; return x; });
      paint(false); sync();
    }, function (e) { console.warn("people:", e.message); });
    Day.cardsCol(SID).onSnapshot(function (q) {
      cards = q.docs.map(function (d) { var x = d.data() || {}; x.id = d.id; return x; });
      paint(false);
    }, function (e) { console.warn("cards:", e.message); });

    document.addEventListener("keydown", key);
    setInterval(clock, 1000);
  }

  function key(e) {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName || "")) return;
    if ($("veil").classList.contains("on")) { if (e.key === "Escape") shut(); return; }
    if (e.key === "ArrowLeft")  { e.preventDefault(); next(); }
    if (e.key === "ArrowRight") { e.preventDefault(); prev(); }
    if (e.key === "ArrowDown")  { e.preventDefault(); move(1); }
    if (e.key === "ArrowUp")    { e.preventDefault(); move(-1); }
    if (e.key === " ")          { e.preventDefault(); startBeat(); }
  }

  /* ═════════ أدوات ═════════ */

  function idx()  { return sess ? (DAY_INDEX[sess.state] || 0) : 0; }
  function cur()  { return DAY_STATES[idx()]; }
  function sub()  { return (sess && sess.sub) || 0; }
  function blocks(){ return DAY_SCRIPT[cur().id] || []; }
  function find(s){ for (var i=0;i<people.length;i++) if (people[i].slug===s) return people[i]; return null; }
  function nameOf(s){ var p=find(s); return p?p.name:s; }
  function doorOf(p){ return Day.derive(p.answers||{}).door; }
  function active(p){
    if (!p.lastSeenAt || !p.lastSeenAt.toDate) return true;
    return (Date.now()-p.lastSeenAt.toDate().getTime()) < DAY_SETTINGS.offlineGraceMin*60000;
  }
  function dist(){ var d={A:0,B:0,C:0,"?":0}; people.forEach(function(p){ d[doorOf(p)||"?"]++; }); return d; }
  function answered(id){ return people.filter(function(p){ return p.answers && p.answers[id]!==undefined; }).length; }

  function write(o){ o.updatedAt = Day.TS(); return Day.sRef(SID).set(o,{merge:true}).catch(function(e){console.warn(e);}); }

  function next(){
    if (!sess) return;
    var st = cur();
    if (st.slides && sub() < st.slides.length-1) return write({sub:sub()+1, stateSeq:INC(1)});
    goTo(Math.min(idx()+1, DAY_STATES.length-1));
  }
  function prev(){
    if (!sess) return;
    if (sub() > 0) return write({sub:sub()-1, stateSeq:INC(1)});
    var i = Math.max(idx()-1,0), st = DAY_STATES[i];
    goTo(i, st.slides ? st.slides.length-1 : 0);
  }
  function goTo(i,s){ write({state:DAY_STATES[i].id, sub:s||0, revealed:false, stateSeq:INC(1)}); }
  function reveal(){ write({revealed:true, stateSeq:INC(1)}); }

  /* ═════════ الاستهداف وحمولة العرض ═════════ */

  var syncing = false;
  function sync(){
    if (!sess || syncing) return;
    syncing = true;
    try { targets(); payload(); } catch(e){ console.warn(e); }
    syncing = false;
  }
  function targets(){
    var st = cur();
    people.forEach(function(p){
      var want = !!st.target && (st.target==="speakers" ? !!p.speaker : doorOf(p)===st.target);
      if (want && p.activeAsk !== st.id) Day.pRef(SID,p.slug).update({activeAsk:st.id}).catch(function(){});
      else if (!want && p.activeAsk === st.id) Day.pRef(SID,p.slug).update({activeAsk:DEL()}).catch(function(){});
    });
  }
  function payload(){
    var sg = dayStageOf(cur(), sub());
    if (!sg) return;
    var pl = null;
    if (sg.k === "counter") pl = {count: people.length};
    else if (sg.k === "cloud") {
      var w = []; people.forEach(function(p){ var v=p.answers&&p.answers.S09; if(v) w.push(String(v)); });
      pl = {cloud:w};
    }
    else if (sg.k === "big")
      pl = {bigN: people.filter(function(p){return p.answers&&p.answers.S56==="y";}).length, bigOf: people.length};
    else if (sg.k === "tables") {
      var t=[]; people.forEach(function(p){
        var a=p.answers&&p.answers.S58;
        if (p.speaker&&a) t.push({door:p.speaker,gift:a.gift||"",cost:a.cost||"",missed:a.missed||""});
      });
      t.sort(function(a,b){return a.door<b.door?-1:1;}); pl={tables:t};
    }
    else if (sg.k === "wall") {
      var wall=[]; people.forEach(function(p){
        var pub=(p.answers&&p.answers.S66)||(p.manual&&p.manual.publish), m=p.manual||{};
        if(!m.line1||!pub||pub==="no") return;
        wall.push({name: pub==="named"?p.name:"", lines:[m.line1,m.line2,m.line3,m.line4,m.line5]});
      });
      pl = {wall: Day.shuffle(wall)};
    }
    else if (sg.k === "card") return;
    else pl = {};
    var s = JSON.stringify(pl);
    if (s === lastPayload) return;
    if (JSON.stringify(sess.stagePayload||{}) === s) { lastPayload = s; return; }
    lastPayload = s;
    write({stagePayload:pl, payloadSeq:INC(1)});
  }

  /* ═════════ الرسم — التلقين ═════════ */

  var TAG = {n:"ملاحظة ليك · متتقالش", mv:"حركة", c:"أمر تشغيل", scr:"على شاشة العرض",
             mob:"على موبايل المشارك", ans:"ردّ جاهز"};

  function paint(moved){
    if (!booted || !sess) return;
    var st = cur(), nx = DAY_STATES[Math.min(idx()+1, DAY_STATES.length-1)];

    $("sid").innerHTML = Day.esc(st.name) + '<em>' + st.id + "</em>";
    $("mvt").textContent = st.mv;

    var on = people.filter(active).length;
    var c1 = $("cOn");
    c1.textContent = "متصل " + Day.toAr(on) + "/" + Day.toAr(people.length);
    c1.className = "chip " + (people.length && on === people.length ? "ok" : (on < people.length - 3 ? "warn" : ""));
    $("cCards").textContent = "بطاقات " + Day.toAr(cards.length);

    /* شريط الحركات */
    var tr = "";
    for (var i=0;i<DAY_STATES.length;i++)
      tr += '<i class="' + (i<idx()?"done":(i===idx()?"now":"")) + '"></i>';
    $("track").innerHTML = tr;

    /* الشرايح */
    var n = daySlideCount(st), d = "";
    if (n>1) for (var j=0;j<n;j++) d += '<b class="'+(j<=sub()?"on":"")+'"></b>';
    $("dots").innerHTML = d;

    /* عنوان الشريحة اللي على الشاشة الكبيرة دلوقتي */
    var slabEl = $("slab");
    if (slabEl) {
      var waiting = !!(st.reveal && !sess.revealed);
      var shown = waiting && st.hold ? st.hold : dayStageOf(st, sub());
      slabEl.className = "slab" + (waiting ? " wait" : "");
      slabEl.innerHTML = "<b>على الشاشة:</b> " +
        String(daySlideLabel(shown))
          .replace(/&/g,"&amp;").replace(/</g,"&lt;") +
        (n > 1 ? "  ·  " + Day.toAr(sub()+1) + "/" + Day.toAr(n) : "");
    }

    if (moved) teleprompt();
    sidebar(nx);
  }

  function teleprompt(){
    var bs = blocks(), h = "";
    if (!bs.length) h = '<div class="blk b-n">مفيش سكربت مكتوب للحالة دي.</div>';
    bs.forEach(function(b,i){
      var t=b[0], x=b[1], cl="blk "+(i===cursor?"cur ":"");
      if (t==="b"){
        var lab = x>=20?"صمت طويل جداً":(x>=10?"صمت طويل":"صمت قصير");
        h += '<div class="'+cl+'b-b s'+(x>=20?20:(x>=10?10:3))+'" data-i="'+i+'" data-s="'+x+'">'+
             '<span class="lab">'+lab+'</span><span class="rail"><u></u></span>'+
             '<span class="num">'+Day.toAr(x)+"</span></div>";
      } else if (t==="h"){
        h += '<div class="'+cl+'b-h" data-i="'+i+'">'+Day.esc(x)+"</div>";
      } else if (t==="say"||t==="k"){
        h += '<div class="'+cl+'b-'+t+'" data-i="'+i+'">'+Day.esc(x)+"</div>";
      } else {
        h += '<div class="'+cl+'b-'+t+'" data-i="'+i+'"><span class="tag">'+TAG[t]+"</span> "+Day.esc(x)+"</div>";
      }
    });
    var el = $("tele"); el.innerHTML = h; el.scrollTop = 0;
    [].forEach.call(el.querySelectorAll(".blk"), function(b){
      b.onclick = function(){ cursor = +b.getAttribute("data-i"); focus(); };
    });
  }

  function move(d){
    var bs = blocks(); if (!bs.length) return;
    cursor = Math.max(0, Math.min(cursor+d, bs.length-1));
    focus();
  }
  function focus(){
    stopBeat();
    var el = $("tele");
    [].forEach.call(el.querySelectorAll(".blk"), function(b){
      b.classList.toggle("cur", +b.getAttribute("data-i") === cursor);
    });
    var c = el.querySelector(".blk.cur");
    if (c) { c.scrollIntoView({block:"center", behavior:"smooth"}); if (c.classList.contains("b-b")) startBeat(); }
  }
  function stopBeat(){
    if (beatTimer) { clearInterval(beatTimer); beatTimer = null; }
    var r = $("tele").querySelector(".b-b.run");
    if (r) { r.classList.remove("run"); r.querySelector("u").style.width = "0"; }
  }
  function startBeat(){
    var c = $("tele").querySelector(".blk.cur.b-b"); if (!c) return;
    stopBeat();
    var total = +c.getAttribute("data-s"), left = total, u = c.querySelector("u"), num = c.querySelector(".num");
    c.classList.add("run");
    var tick = function(){
      left--; u.style.width = ((total-left)/total*100) + "%";
      num.textContent = Day.toAr(Math.max(left,0));
      if (left<=0){ clearInterval(beatTimer); beatTimer=null; num.textContent="✓"; }
    };
    u.style.width="0"; num.textContent = Day.toAr(total);
    beatTimer = setInterval(tick, 1000);
  }

  function pair(round, n){
    var live = people.filter(active);
    if (live.length < n) return alert("مفيش عدد كفاية.");
    var ppl = live.map(function(p){ return {slug:p.slug, door:doorOf(p)}; });
    var exclude = (round==="lab2") ? ((sess&&sess.pairKeys)||[]) : [];
    var groups = Day.makeGroups(ppl, exclude, n);
    var batch = Day.db.batch(), keys = [], corners = ["أ","ب","ج"];
    groups.forEach(function(g,gi){
      for (var i=0;i<g.length;i++) for (var j=i+1;j<g.length;j++) keys.push([g[i],g[j]].sort().join("|"));
      g.forEach(function(slug){
        var others = g.filter(function(x){return x!==slug;}), val;
        if (round==="exchange") val = others.map(function(x){ return {name:nameOf(x)}; });
        else val = {name: others.map(nameOf).join(" + "), corner: corners[gi%3]};
        var u = {}; u["pairing."+round] = val;
        batch.update(Day.pRef(SID,slug), u);
      });
    });
    batch.commit().then(function(){
      if (round==="lab1") write({pairKeys:keys});
      alert("اتكوّنت " + Day.toAr(groups.length) + " مجموعة، ووصلت لموبايلاتهم.");
    }).catch(function(e){ console.warn(e); alert("مش راضي يتكوّن."); });
  }

  function speakers(){
    var batch = Day.db.batch(), chosen = {};
    ["A","B","C"].forEach(function(d){
      var pool = people.filter(function(p){ return active(p) && doorOf(p)===d; });
      if (pool.length) chosen[d] = pool[Math.floor(Math.random()*pool.length)].slug;
    });
    people.forEach(function(p){
      var is=null; for (var d in chosen) if (chosen[d]===p.slug) is=d;
      if (is && p.speaker!==is) batch.update(Day.pRef(SID,p.slug), {speaker:is});
      else if (!is && p.speaker) batch.update(Day.pRef(SID,p.slug), {speaker:DEL()});
    });
    batch.commit().then(function(){
      alert("المتحدّثون: " + Object.keys(chosen).map(function(d){
        return DAY_CORNERS[d]+" — "+nameOf(chosen[d]); }).join(" · "));
    }).catch(function(e){ console.warn(e); });
  }

  function proxy(){
    var st = cur();
    if (!st.live) return;
    var names = people.map(function(p,i){ return (i+1)+") "+p.name; }).join("\n");
    var n = prompt("اختار رقم المشارك:\n"+names); if (!n) return;
    var p = people[parseInt(n,10)-1]; if (!p) return;
    var val = null;
    if (st.live.k==="choice"){
      var o = prompt(st.live.prompt+"\n"+st.live.options.map(function(t,i){return (i+1)+") "+t;}).join("\n"));
      if (!o) return; val = st.live.values[parseInt(o,10)-1];
    } else if (st.live.k==="corner"){
      var c = prompt("الركن (أ/ب/ج):"); var r = prompt("القراءة (1/2/3):");
      if (!c||!r) return;
      val = {corner:{"أ":"A","ب":"B","ج":"C"}[c.trim()]||c.trim().toUpperCase(), reading:r.trim()};
    } else val = prompt(st.live.prompt||"الإجابة:");
    if (val===null||val===undefined||val==="") return;
    var u={}; u["answers."+st.id]=val;
    Day.pRef(SID,p.slug).update(u).catch(function(e){console.warn(e);});
  }

  function demoFill(){
    if (!confirm("تولّد ٣٦ اسم وهمي؟ (للبروفة بس)")) return;
    var N = ["أحمد","محمود","سارة","مريم","يوسف","نور","كريم","هبة","عمر","دينا","طارق","ريم",
             "حسن","إسراء","زياد","منى","خالد","سلمى","أمير","ندى","باسم","شيماء","وليد","آية",
             "سيف","رنا","فادي","جنى","تامر","هدى","رامي","لينا","مصطفى","ملك","إياد","فرح"];
    var batch = Day.db.batch();
    N.forEach(function(nm,i){
      var slug="demo-"+(i+1), corner=["A","B","C"][i%3], a={};
      a.S09=["يخلّص","يرتاح","حد يشوفه","تقدير","مساعدة"][i%5];
      a.S25={corner:corner,reading:String((i%3)+1)};
      a.S26={corner:corner,reading:String((i%3)+1)};
      a.S27={corner:["A","B","C"][(i+1)%3],reading:String(((i+1)%3)+1)};
      a.S28=corner; a.S56=(i%5===0)?"n":"y"; a.S66=(i%4===0)?"named":"anon";
      batch.set(Day.pRef(SID,slug),{
        slug:slug,name:nm,demo:true,uid:Day.auth.currentUser.uid,
        joinedAt:Day.TS(),lastSeenAt:Day.TS(),answers:a,
        manual:{line1:"أنا بتحرّك من باب "+DAY_CORNERS[corner],line2:"وأنا بسمع المواقف على إنها ...",
                line3:"عشان تشتغل معايا صحّ ...",line4:"لما تشوفني ...",line5:"الشهر ده ..."}
      },{merge:true});
    });
    batch.commit().then(shut).catch(function(e){console.warn(e);});
  }
  function demoClear(){
    if (!confirm("تمسح كل بيانات البروفة؟")) return;
    var batch = Day.db.batch(), n=0;
    people.forEach(function(p){ if(p.demo){ batch.delete(Day.pRef(SID,p.slug)); n++; } });
    if (!n) return alert("مفيش بيانات بروفة.");
    batch.commit().then(shut).catch(function(e){console.warn(e);});
  }
  function printCards(){
    var w = window.open("","_blank");
    var h = '<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><title>بطاقات دليل التشغيل</title>'+
      "<style>body{font-family:system-ui,sans-serif;padding:10mm}"+
      ".c{border:1px solid #999;border-radius:8px;padding:10mm;margin-bottom:8mm;page-break-inside:avoid}"+
      ".c h4{margin:0 0 6mm;font-size:12pt}.c p{margin:0 0 3mm;font-size:11pt;line-height:1.6}</style><body>";
    people.forEach(function(p){
      var m=p.manual||{}; if(!m.line1) return;
      h += '<div class="c"><h4>'+Day.esc(p.name)+"</h4>"+
        [1,2,3,4,5].map(function(i){ return m["line"+i]?"<p>"+Day.esc(m["line"+i])+"</p>":""; }).join("")+"</div>";
    });
    w.document.write(h+"</body></html>"); w.document.close(); w.print();
  }
  function report(){
    var d = dist();
    var t = ["تقرير تجميعي — إنت بتردّ على إيه؟",
      "الجلسة: "+SID+" · "+new Date().toLocaleDateString("ar-EG"),"",
      "الحضور: "+people.length,
      "بطاقات العتبة: "+cards.length,"",
      "التوزيع (بلا أسماء): أ "+d.A+" · ب "+d.B+" · ج "+d.C+" · بلا تحديد "+d["?"],
      "حسّوا إنهم اتسمعوا: "+people.filter(function(p){return p.answers&&p.answers.S56==="y";}).length+
        " · نصّ نصّ: "+people.filter(function(p){return p.answers&&p.answers.S56==="m";}).length,
      "كتبوا دليل التشغيل: "+people.filter(function(p){return p.manual&&p.manual.line1;}).length,
      "ردّوا على ورقة الخروج: "+people.filter(function(p){return p.answers&&p.answers.S73;}).length,"",
      "⚑ مفيش أي اسم ولا أي إجابة فردية في التقرير ده — بالتصميم."].join("\n");
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([t],{type:"text/plain;charset=utf-8"}));
    a.download = "report-"+SID+".txt"; a.click();
  }

  /* ═════════ الربط ═════════ */

  function wire(){
    $("bNext").onclick = next;
    $("bPrev").onclick = prev;
    $("bOut").onclick  = function(){ Day.auth.signOut(); location.reload(); };
    $("bReplies").onclick = replies;
    $("bHelp").onclick = help;
    $("bTools").onclick = tools;
    $("veil").onclick = function(e){ if (e.target === $("veil")) shut(); };
    var j = $("jump");
    j.innerHTML = '<option value="">⤴ قفز لحالة…</option>' + DAY_STATES.map(function(s){
      return '<option value="'+s.id+'">'+s.id+" · "+Day.esc(s.name)+"</option>"; }).join("");
    j.onchange = function(){ if (j.value){ goTo(DAY_INDEX[j.value]); j.value=""; } };
  }

})();
</script>
