<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - منظور الفؤاد</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Noto Kufi Arabic', 'Tajawal', sans-serif;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    position: relative;
}

/* حاوية البوابة الرئيسية */
.portal-container {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* الخلفية المتحركة - السماء الليلية */
.animated-background {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(
        180deg,
        #0a0e27 0%,
        #1a1f3a 30%,
        #2d3561 70%,
        #3a4374 100%
    );
    z-index: 1;
}

/* حاوية النجوم */
.stars-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

/* النجمة الأساسية */
.star {
    position: absolute;
    background: #f8fafc;
    border-radius: 50%;
    animation: twinkle 3s ease-in-out infinite;
}

@keyframes twinkle {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
}

/* الطبقة الرئيسية */
.main-layer {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
}

/* دائرة التنفس */
.breathing-circle {
    width: 120px;
    height: 120px;
    border: 2px solid rgba(148, 163, 184, 0.3);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    box-shadow: 
        0 0 30px rgba(59, 130, 246, 0.15),
        inset 0 0 20px rgba(255, 255, 255, 0.05);
    animation: breathe 4s ease-in-out infinite;
    margin-bottom: 40px;
}

@keyframes breathe {
    0% { 
        transform: scale(1);
        opacity: 0.3;
    }
    50% { 
        transform: scale(1.2);
        opacity: 0.6;
    }
    100% { 
        transform: scale(1);
        opacity: 0.3;
    }
}

.breathing-text {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.5);
    font-weight: 300;
    position: absolute;
}

/* النص الترحيبي */
.welcome-text {
    font-size: 32px;
    font-weight: 300;
    color: #f8fafc;
    text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
    letter-spacing: 3px;
    margin-bottom: 50px;
    opacity: 0;
}

.welcome-text.show {
    animation: fadeInText 0.5s ease-out forwards;
}

@keyframes fadeInText {
    to {
        opacity: 1;
    }
}

/* منطقة تسجيل الدخول */
.login-area {
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 40px;
    width: 100%;
    max-width: 400px;
    box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.3),
        inset 0 0 30px rgba(255, 255, 255, 0.02);
    opacity: 0;
    transform: translateY(20px);
}

.login-area.show {
    animation: slideUp 0.8s ease-out forwards;
    animation-delay: 1s;
}

@keyframes slideUp {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* مجموعة الإدخال */
.input-group {
    position: relative;
    margin-bottom: 25px;
}

/* أيقونة الحقل */
.input-icon {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    width: 20px;
    height: 20px;
    opacity: 0.5;
    transition: all 0.3s;
}

.input-icon svg {
    width: 100%;
    height: 100%;
    fill: rgba(255, 255, 255, 0.6);
}

/* حقل الإدخال الروحاني */
.soul-input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    color: white;
    font-size: 16px;
    padding: 12px 40px 12px 12px;
    transition: all 0.3s;
    font-family: inherit;
    outline: none;
}

.soul-input::placeholder {
    color: rgba(255, 255, 255, 0.3);
    font-weight: 300;
}

.soul-input:focus {
    border-bottom-color: rgba(59, 130, 246, 0.6);
}

/* التوهج عند التركيز */
.input-group.focused .input-glow {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.6), transparent);
    animation: glowMove 2s linear infinite;
}

@keyframes glowMove {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
}

/* نقاط كلمة المرور كنجوم */
.soul-input[type="password"] {
    letter-spacing: 5px;
}

/* زر الدخول */
.enter-button {
    margin-top: 30px;
    width: 100%;
    padding: 15px;
    background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.1),
        rgba(255, 255, 255, 0.05)
    );
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 50px;
    color: white;
    font-size: 18px;
    font-weight: 400;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.5s;
    font-family: inherit;
}

/* التوهج المستمر للزر */
.button-glow {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200%;
    height: 200%;
    background: radial-gradient(
        circle,
        rgba(255, 255, 255, 0.1) 0%,
        transparent 70%
    );
    animation: pulse 2s infinite;
    pointer-events: none;
}

@keyframes pulse {
    0%, 100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
    50% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}

.enter-button:hover {
    background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.2),
        rgba(255, 255, 255, 0.1)
    );
    transform: translateY(-2px);
    box-shadow: 
        0 10px 30px rgba(59, 130, 246, 0.2),
        0 5px 15px rgba(0, 0, 0, 0.3);
}

/* أيقونة القلب النابض */
@keyframes heartBeat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.1); }
    50% { transform: scale(1); }
    75% { transform: scale(1.1); }
}

.pulsing-heart {
    animation: heartBeat 2s ease-in-out infinite;
}

/* رسائل الخطأ الروحانية */
.error-message {
    color: rgba(255, 150, 150, 0.9);
    font-size: 14px;
    margin-top: 10px;
    text-align: center;
    opacity: 0;
    transition: opacity 0.3s;
}

.error-message.show {
    opacity: 1;
}

/* خيارات إضافية */
.additional-options {
    margin-top: 30px;
    text-align: center;
}

.forgot-link, .new-soul {
    color: rgba(255, 255, 255, 0.5);
    text-decoration: none;
    font-size: 14px;
    transition: all 0.3s;
    display: inline-block;
    margin: 0 10px;
}

.forgot-link:hover, .new-soul:hover {
    color: rgba(255, 255, 255, 0.8);
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
}

/* تأثير النجوم المتساقطة عند التركيز */
.falling-stars {
    position: absolute;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: hidden;
}

.mini-star {
    position: absolute;
    width: 4px;
    height: 4px;
    background: white;
    border-radius: 50%;
    opacity: 0;
    animation: fallingStar 1s ease-out forwards;
}

@keyframes fallingStar {
    0% {
        transform: translateY(-20px);
        opacity: 0;
    }
    50% {
        opacity: 1;
    }
    100% {
        transform: translateY(20px);
        opacity: 0;
    }
}

/* موجة الطاقة عند الضغط على الزر */
.ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.5);
    transform: scale(0);
    animation: rippleEffect 0.6s ease-out;
    pointer-events: none;
}

@keyframes rippleEffect {
    to {
        transform: scale(4);
        opacity: 0;
    }
}

/* تأثير الدخول النهائي */
.portal-transition {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.8), transparent);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 9999;
}

.portal-transition.active {
    animation: portalExpand 1.5s ease-out forwards;
}

@keyframes portalExpand {
    to {
        width: 300vw;
        height: 300vw;
        opacity: 0;
    }
}

/* تحسين الحركة للنجوم في الخلفية */
.star.moving {
    animation: starDrift 20s linear infinite;
}

@keyframes starDrift {
    from {
        transform: translateX(0);
    }
    to {
        transform: translateX(50px);
    }
}

/* تأثير التنفس للصفحة كاملة */
.portal-container.breathing {
    animation: pageBreath 6s ease-in-out infinite;
}

@keyframes pageBreath {
    0%, 100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.02);
    }
}

/* رسالة التحميل الروحانية */
.loading-text {
    display: inline-block;
    animation: loadingPulse 1s ease-in-out infinite;
}

@keyframes loadingPulse {
    0%, 100% {
        opacity: 0.5;
    }
    50% {
        opacity: 1;
    }
}

/* رسائل النجاح */
.success-message {
    color: rgba(150, 255, 150, 0.9);
    font-size: 14px;
    margin-top: 10px;
    text-align: center;
    opacity: 0;
    transition: opacity 0.3s;
}

.success-message.show {
    opacity: 1;
}

/* تحسين الأمان - إخفاء كلمة المرور */
.soul-input[type="password"]::-ms-reveal,
.soul-input[type="password"]::-webkit-textfield-decoration-container {
    display: none;
}
</style>
    
</head>

    <div class="portal-container">
    <!-- الخلفية المتحركة -->
    <div class="animated-background">
        <div class="stars-container" id="starsContainer">

        <!-- منطقة تسجيل الدخول -->
       <div class="login-area" id="loginArea">
    <form id="loginForm" onsubmit="handleLogin(event)">

</div>

    <script>
// متغيرات الصوت
let audioContext;
let isAudioEnabled = false;

// إنشاء النجوم المحسّنة
function createStars() {
    const container = document.getElementById('starsContainer');
    const starCount = 150;
    
    for (let i = 0; i < starCount; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        
        // حجم عشوائي
        const size = Math.random() * 3 + 1;
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        
        // موقع عشوائي
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        
        // تأخير عشوائي للومضة
        star.style.animationDelay = Math.random() * 3 + 's';
        star.style.animationDuration = (Math.random() * 3 + 3) + 's';
        
        // شفافية متفاوتة
        star.style.opacity = Math.random() * 0.7 + 0.3;
        
        // بعض النجوم تتحرك أفقياً
        if (Math.random() > 0.7) {
            star.classList.add('moving');
            star.style.animationDelay = Math.random() * 20 + 's';
        }
        
        container.appendChild(star);
    }
}

// النص الترحيبي يظهر حرف حرف
function showWelcomeText() {
    const text = "أهلاً بروحك الباحثة";
    const element = document.getElementById('welcomeText');
    let index = 0;
    
    setTimeout(() => {
        const interval = setInterval(() => {
            if (index < text.length) {
                element.textContent += text[index];
                element.classList.add('show');
                index++;
                playKeySound(); // صوت الكتابة
            } else {
                clearInterval(interval);
                // إظهار منطقة الدخول
                document.getElementById('loginArea').classList.add('show');
            }
        }, 100);
    }, 2000);
}

// تهيئة الصوت
function initAudio() {
    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        isAudioEnabled = true;
    }
}

// صوت همسة خفيفة
function playKeySound() {
    if (!isAudioEnabled) return;
    
    const oscillator = audioContext.createOscillator();
    const gainNode = audioContext.createGain();
    
    oscillator.connect(gainNode);
    gainNode.connect(audioContext.destination);
    
    oscillator.frequency.value = 800 + Math.random() * 400;
    oscillator.type = 'sine';
    
    gainNode.gain.setValueAtTime(0.02, audioContext.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.1);
    
    oscillator.start(audioContext.currentTime);
    oscillator.stop(audioContext.currentTime + 0.1);
}

// صوت الرياح الخفيفة
function playWindSound() {
    if (!isAudioEnabled) return;
    
    const oscillator = audioContext.createOscillator();
    const gainNode = audioContext.createGain();
    const filter = audioContext.createBiquadFilter();
    
    oscillator.connect(filter);
    filter.connect(gainNode);
    gainNode.connect(audioContext.destination);
    
    oscillator.type = 'sawtooth';
    oscillator.frequency.value = 100 + Math.random() * 50;
    
    filter.type = 'lowpass';
    filter.frequency.value = 400;
    
    gainNode.gain.setValueAtTime(0.01, audioContext.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.5);
    
    oscillator.start(audioContext.currentTime);
    oscillator.stop(audioContext.currentTime + 0.5);
}

// التعامل مع التركيز على الحقول
function handleFocus(groupId) {
    document.getElementById(groupId).classList.add('focused');
    createFallingStars(groupId);
    playWindSound();
}

function handleBlur(groupId) {
    document.getElementById(groupId).classList.remove('focused');
}

// إنشاء نجوم متساقطة حول الحقل
function createFallingStars(groupId) {
    const group = document.getElementById(groupId);
    const container = document.createElement('div');
    container.className = 'falling-stars';
    
    for (let i = 0; i < 5; i++) {
        setTimeout(() => {
            const star = document.createElement('div');
            star.className = 'mini-star';
            star.style.left = Math.random() * 100 + '%';
            container.appendChild(star);
            
            setTimeout(() => star.remove(), 1000);
        }, i * 100);
    }
    
    group.appendChild(container);
    setTimeout(() => container.remove(), 2000);
}

// معالج تسجيل الدخول
// معالج تسجيل الدخول الحقيقي مع Firebase
async function handleLogin(event) {
    if (!checkLoginAttempts()) {
    button.innerHTML = originalText;
    button.disabled = false;
    return;
}

    event.preventDefault();
    
    const button = event.target.querySelector('.enter-button');
    const originalText = button.innerHTML;

            }
        }
        
        // محاولة تسجيل الدخول
        let authSuccess = false;
        
        try {
            // محاولة عبر Firebase Auth
            await auth.signInWithEmailAndPassword(email, password);
            authSuccess = true;
            
        } catch (authError) {
            // التحقق من كلمة المرور المحفوظة
            if (userData.auth && userData.auth.tempPassword) {

                if (password === savedPassword) {
                    authSuccess = true;
                    // محاولة إنشاء/تحديث حساب Auth
                    try {
                        await auth.createUserWithEmailAndPassword(email, password);
                    } catch (e) {
                        // لا بأس إذا كان الحساب موجود
                    }
                }
            }
            
            if (!authSuccess) {
                throw new Error('الطريق مغلق... تأكد من مفتاحك');
            }
        }
        
        if (authSuccess) {
            // تحديث آخر دخول
            await db.collection('users').doc(userId).update({
                'auth.lastLogin': firebase.firestore.FieldValue.serverTimestamp(),
                'auth.loginCount': firebase.firestore.FieldValue.increment(1)
            });
            
           // حفظ البيانات للتوافق مع الصفحات القديمة
localStorage.setItem('userId', userId);
localStorage.setItem('userEmail', email);
localStorage.setItem('userName', userData.personalInfo?.name || userData.name || 'روح باحثة');

// حفظ معلومات إضافية إذا كانت موجودة
if (userData.accountStatus) {
    localStorage.setItem('userLevel', userData.accountStatus.level || 'STANDARD');
    localStorage.setItem('userStatus', userData.accountStatus.status || 'active');
}

// للأمان أيضاً في sessionStorage
sessionStorage.setItem('uid', userId);
sessionStorage.setItem('uname', userData.personalInfo?.name || 'روح باحثة');
            
            // التحقق من نوع المستخدم
            const isAdmin = email === 'admin@fouad-academy.com' || 
                           userData.auth?.role === 'admin';
            
            // تأثير الانتقال
            startPortalTransition();
            
            setTimeout(() => {
                if (isAdmin) {
                    window.location.href = './admin/dashboard.html';
                } else {
                    window.location.href = './dashboard.html';
                }
            }, 1500);
        }
        
    } catch (error) {
        console.error('خطأ في الدخول:', error);
        showError(error.message || 'حدث خطأ في فتح البوابة');
        button.innerHTML = originalText;
        button.disabled = false;
    }
}

// تأثير الموجة عند الضغط
function createRipple(button) {
    const ripple = document.createElement('div');
    ripple.className = 'ripple';
    
    const rect = button.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = '50%';
    ripple.style.top = '50%';
    
    button.appendChild(ripple);
    
    setTimeout(() => ripple.remove(), 600);
}

// تأثير الانتقال للصفحة التالية
function startPortalTransition() {
    const portal = document.getElementById('portalTransition');
    portal.classList.add('active');
    
    // صوت النجاح
    if (isAudioEnabled) {
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        
        oscillator.frequency.setValueAtTime(523.25, audioContext.currentTime); // C5
        oscillator.frequency.exponentialRampToValueAtTime(1046.50, audioContext.currentTime + 0.5); // C6
        
        gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 1);
        
        oscillator.start(audioContext.currentTime);
        oscillator.stop(audioContext.currentTime + 1);
    }
    
    setTimeout(() => {
        // هنا يمكن إضافة كود الانتقال الفعلي
        console.log('الانتقال للصفحة التالية...');
    }, 1500);
}

// نسيت طريقك
// استعادة كلمة المرور
async function forgotPath(event) {
    event.preventDefault();
    
    const email = document.getElementById('email').value.trim();
    
    if (!email) {
        showError('اكتب بريدك أولاً ليصلك دليل الطريق');
        document.getElementById('email').focus();
        return;
    }
    
    try {
        // التحقق من وجود المستخدم
        const usersQuery = await db.collection('users')
            .where('personalInfo.email', '==', email)
            .limit(1)
            .get();
        
        if (usersQuery.empty) {
            showError('لم نجد روحك في سجلاتنا');
            return;
        }
        
        // إرسال رابط الاستعادة
        await auth.sendPasswordResetEmail(email);
        
        showSuccess('تم إرسال دليل الطريق إلى بريدك');
        
    } catch (error) {
        console.error('خطأ في الاستعادة:', error);
        showError('تعذر إرسال دليل الطريق... حاول لاحقاً');
    }
}

// إظهار رسالة نجاح
function showSuccess(message) {
    // إنشاء عنصر إذا لم يكن موجود
    let successEl = document.getElementById('successMessage');
    if (!successEl) {
        successEl = document.createElement('div');
        successEl.id = 'successMessage';
        successEl.className = 'success-message';
        document.getElementById('errorMessage').parentNode.insertBefore(
            successEl, 
            document.getElementById('errorMessage')
        );
    }
    
    successEl.textContent = message;
    successEl.classList.add('show');
    
    setTimeout(() => {
        successEl.classList.remove('show');
    }, 5000);
}

// صوت النجاح
function playSuccessSound() {
    if (!isAudioEnabled) return;
    
    const oscillator = audioContext.createOscillator();
    const gainNode = audioContext.createGain();
    
    oscillator.connect(gainNode);
    gainNode.connect(audioContext.destination);
    
    // نغمة صاعدة مريحة
    oscillator.frequency.setValueAtTime(440, audioContext.currentTime); // A4
    oscillator.frequency.exponentialRampToValueAtTime(880, audioContext.currentTime + 0.2); // A5
    
    gainNode.gain.setValueAtTime(0.05, audioContext.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.5);
    
    oscillator.start(audioContext.currentTime);
    oscillator.stop(audioContext.currentTime + 0.5);
}

// صوت الخطأ
function playErrorSound() {
    if (!isAudioEnabled) return;
    
    const oscillator = audioContext.createOscillator();
    const gainNode = audioContext.createGain();
    
    oscillator.connect(gainNode);
    gainNode.connect(audioContext.destination);
    
    // نغمة هابطة
    oscillator.frequency.setValueAtTime(440, audioContext.currentTime);
    oscillator.frequency.exponentialRampToValueAtTime(220, audioContext.currentTime + 0.2);
    
    gainNode.gain.setValueAtTime(0.03, audioContext.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.3);
    
    oscillator.start(audioContext.currentTime);
    oscillator.stop(audioContext.currentTime + 0.3);
}

// تحديث showError و showSuccess لتشغيل الأصوات
const originalShowError = showError;
showError = function(message) {
    originalShowError(message);
    playErrorSound();
};

const originalShowSuccess = showSuccess;
showSuccess = function(message) {
    originalShowSuccess(message);
    playSuccessSound();
};
        
// حماية من محاولات الاختراق
let loginAttempts = 0;
const maxAttempts = 5;

// تحديث handleLogin بإضافة حماية من المحاولات المتكررة
function checkLoginAttempts() {
    loginAttempts++;
    if (loginAttempts >= maxAttempts) {
        const button = document.querySelector('.enter-button');
        button.disabled = true;
        showError('تم إغلاق البوابة مؤقتاً... انتظر قليلاً');
        
        setTimeout(() => {
            loginAttempts = 0;
            button.disabled = false;
            showSuccess('البوابة مفتوحة مجدداً');
        }, 30000); // 30 ثانية
        
        return false;
    }
    return true;
}
