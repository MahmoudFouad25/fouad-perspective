<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تسجيل الدخول - منظور الفؤاد</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
<style>
/* إعدادات الجذر - هوية منظور الفؤاد */
:root {
    /* خلفيات */
    --bg-primary: #1a2332;
    --bg-secondary: #0f172a;
    --bg-card: #1e293b;
    
    /* ألوان تفاعلية */
    --color-blue: #3b82f6;
    --color-green: #10b981;
    --color-orange: #f59e0b;
    --color-red: #ef4444;
    --color-gold: #fbbf24;
    
    /* نصوص */
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    
    /* حدود */
    --border: #334155;
    
    /* تأثيرات */
    --glow-blue: 0 0 20px rgba(59, 130, 246, 0.3);
    --glow-green: 0 0 20px rgba(16, 185, 129, 0.3);
    --glow-gold: 0 0 20px rgba(251, 191, 36, 0.3);
    
    /* انتقالات */
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

    /* إصلاح مشاكل الموبايل */
html {
    overflow-x: hidden;
    width: 100%;
}

body {
    font-family: 'Noto Kufi Arabic', 'Tajawal', sans-serif;
    width: 100%;
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
    position: relative;
    margin: 0;
    padding: 0;
}

.portal-container {
    width: 100%;
    min-height: 100vh;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}
    

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Noto Kufi Arabic', 'Tajawal', sans-serif;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    position: relative;
}

/* حاوية البوابة الرئيسية */
.portal-container {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* الخلفية المتحركة - سماء ليلية محسنة */
.animated-background {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(
        180deg,
        var(--bg-secondary) 0%,
        var(--bg-primary) 30%,
        #1e293b 70%,
        var(--bg-card) 100%
    );
    z-index: 1;
}

/* حاوية النجوم */
.stars-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

/* النجمة الأساسية */
.star {
    position: absolute;
    background: var(--text-primary);
    border-radius: 50%;
    animation: twinkle 3s ease-in-out infinite;
    box-shadow: 0 0 2px rgba(248, 250, 252, 0.5);
}

@keyframes twinkle {
    0%, 100% { 
        opacity: 0.3;
        transform: scale(1);
    }
    50% { 
        opacity: 1;
        transform: scale(1.2);
    }
}

/* الطبقة الرئيسية */
.main-layer {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
}

/* دائرة التنفس */
.breathing-circle {
    width: 120px;
    height: 120px;
    border: 2px solid rgba(59, 130, 246, 0.2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: radial-gradient(circle, rgba(59, 130, 246, 0.05), transparent);
    box-shadow: 
        0 0 30px rgba(59, 130, 246, 0.1),
        inset 0 0 20px rgba(59, 130, 246, 0.05);
    animation: breathe 4s ease-in-out infinite;
    margin-bottom: 40px;
}

@keyframes breathe {
    0% { 
        transform: scale(1);
        opacity: 0.3;
        box-shadow: 
            0 0 30px rgba(59, 130, 246, 0.1),
            inset 0 0 20px rgba(59, 130, 246, 0.05);
    }
    50% { 
        transform: scale(1.15);
        opacity: 0.6;
        box-shadow: 
            0 0 50px rgba(59, 130, 246, 0.2),
            inset 0 0 30px rgba(59, 130, 246, 0.1);
    }
    100% { 
        transform: scale(1);
        opacity: 0.3;
        box-shadow: 
            0 0 30px rgba(59, 130, 246, 0.1),
            inset 0 0 20px rgba(59, 130, 246, 0.05);
    }
}

.breathing-text {
    font-size: 16px;
    color: #f8fafc;
    font-weight: 500;
    position: absolute;
    animation: textPulse 4s ease-in-out infinite;
    text-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
}

@keyframes textPulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 0.9; }
}

/* النص الترحيبي */
.welcome-text {
    font-size: 32px;
    font-weight: 300;
    color: var(--text-primary);
    text-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
    letter-spacing: 3px;
    margin-bottom: 50px;
    opacity: 0;
    text-align: center;
}

.welcome-text.show {
    animation: fadeInText 0.5s ease-out forwards;
}

@keyframes fadeInText {
    to {
        opacity: 1;
    }
}

/* منطقة تسجيل الدخول */
.login-area {
    background: rgba(30, 41, 59, 0.3);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px;
    width: 100%;
    max-width: 400px;
    box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.3),
        inset 0 0 30px rgba(59, 130, 246, 0.02);
    opacity: 0;
    transform: translateY(20px);
}

.login-area.show {
    animation: slideUp 0.8s ease-out forwards;
    animation-delay: 1s;
}

@keyframes slideUp {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* مجموعة الإدخال */
.input-group {
    position: relative;
    margin-bottom: 25px;
}

/* أيقونة الحقل */
.input-icon {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    width: 20px;
    height: 20px;
    opacity: 0.5;
    transition: var(--transition);
}

.input-icon svg {
    width: 100%;
    height: 100%;
    fill: var(--color-blue);
}

.input-group.focused .input-icon {
    opacity: 0.8;
    transform: translateY(-50%) scale(1.1);
}

/* حقل الإدخال الروحاني */
.soul-input {
    width: 100%;
    background: rgba(15, 23, 42, 0.5);
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--text-primary);
    font-size: 16px;
    padding: 12px 40px 12px 12px;
    transition: var(--transition);
    font-family: inherit;
    outline: none;
    border-radius: 8px 8px 0 0;
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
    /* تحسينات للصق */
    -webkit-user-select: text !important;
    -moz-user-select: text !important;
    -ms-user-select: text !important;
    user-select: text !important;
}
    .soul-input:-webkit-autofill,
.soul-input:-webkit-autofill:hover,
.soul-input:-webkit-autofill:focus {
    -webkit-text-fill-color: #f8fafc;
    -webkit-box-shadow: 0 0 0px 1000px rgba(15, 23, 42, 0.7) inset;
    transition: background-color 5000s ease-in-out 0s;
    border-bottom: 1px solid #3b82f6;
}


.soul-input::placeholder {
    color: var(--text-muted);
    font-weight: 300;
}

.soul-input:focus {
    border-bottom-color: var(--color-blue);
    background: rgba(15, 23, 42, 0.7);
    box-shadow: 0 2px 10px rgba(59, 130, 246, 0.2);
}

/* التوهج عند التركيز */
.input-group.focused .input-glow {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--color-blue), transparent);
    animation: glowMove 2s linear infinite;
}

@keyframes glowMove {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
}

/* نقاط كلمة المرور كنجوم */
.soul-input[type="password"] {
    letter-spacing: 5px;
    font-family: 'Arial', sans-serif;
}

/* زر الدخول */
.enter-button {
    margin-top: 30px;
    width: 100%;
    padding: 15px;
    background: linear-gradient(
        135deg,
        rgba(59, 130, 246, 0.1),
        rgba(59, 130, 246, 0.05)
    );
    border: 1px solid rgba(59, 130, 246, 0.3);
    border-radius: 50px;
    color: var(--text-primary);
    font-size: 18px;
    font-weight: 400;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: var(--transition);
    font-family: inherit;
}

/* التوهج المستمر للزر */
.button-glow {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200%;
    height: 200%;
    background: radial-gradient(
        circle,
        rgba(59, 130, 246, 0.1) 0%,
        transparent 70%
    );
    animation: pulse 2s infinite;
    pointer-events: none;
}

@keyframes pulse {
    0%, 100% { 
        transform: translate(-50%, -50%) scale(0.8); 
        opacity: 0; 
    }
    50% { 
        transform: translate(-50%, -50%) scale(1); 
        opacity: 1; 
    }
}

.enter-button:hover {
    background: linear-gradient(
        135deg,
        rgba(59, 130, 246, 0.2),
        rgba(59, 130, 246, 0.1)
    );
    transform: translateY(-2px);
    box-shadow: var(--glow-blue);
    border-color: var(--color-blue);
}

.enter-button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

/* أيقونة القلب النابض */
@keyframes heartBeat {
    0%, 100% { 
        transform: scale(1);
        fill: var(--color-red);
    }
    25% { 
        transform: scale(1.1);
        fill: #ff6b6b;
    }
    50% { 
        transform: scale(1);
        fill: var(--color-red);
    }
    75% { 
        transform: scale(1.1);
        fill: #ff6b6b;
    }
}

.pulsing-heart {
    animation: heartBeat 2s ease-in-out infinite;
}

.pulsing-heart svg {
    fill: var(--color-red) !important;
}

/* رسائل الخطأ الروحانية */
.error-message {
    color: rgba(239, 68, 68, 0.9);
    font-size: 14px;
    margin-top: 10px;
    text-align: center;
    opacity: 0;
    transition: opacity 0.3s;
    background: rgba(239, 68, 68, 0.1);
    padding: 8px;
    border-radius: 8px;
    border: 1px solid rgba(239, 68, 68, 0.2);
}

.error-message.show {
    opacity: 1;
}

/* خيارات إضافية */
.additional-options {
    margin-top: 30px;
    text-align: center;
}

.forgot-link, .new-soul {
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 14px;
    transition: var(--transition);
    display: inline-block;
    margin: 0 10px;
}

.forgot-link:hover, .new-soul:hover {
    color: var(--color-blue);
    text-shadow: var(--glow-blue);
}

/* تأثير النجوم المتساقطة عند التركيز */
.falling-stars {
    position: absolute;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: hidden;
}

.mini-star {
    position: absolute;
    width: 4px;
    height: 4px;
    background: var(--color-gold);
    border-radius: 50%;
    opacity: 0;
    animation: fallingStar 1s ease-out forwards;
    box-shadow: 0 0 6px var(--color-gold);
}

@keyframes fallingStar {
    0% {
        transform: translateY(-20px);
        opacity: 0;
    }
    50% {
        opacity: 1;
    }
    100% {
        transform: translateY(20px);
        opacity: 0;
    }
}

/* موجة الطاقة عند الضغط على الزر */
.ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(59, 130, 246, 0.5);
    transform: scale(0);
    animation: rippleEffect 0.6s ease-out;
    pointer-events: none;
}

@keyframes rippleEffect {
    to {
        transform: scale(4);
        opacity: 0;
    }
}

/* تأثير الدخول النهائي */
.portal-transition {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    background: radial-gradient(circle, var(--color-blue), transparent);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 9999;
}

.portal-transition.active {
    animation: portalExpand 1.5s ease-out forwards;
}

@keyframes portalExpand {
    to {
        width: 300vw;
        height: 300vw;
        opacity: 0;
    }
}

/* تحسين الحركة للنجوم في الخلفية */
.star.moving {
    animation: starDrift 20s linear infinite;
}

@keyframes starDrift {
    from {
        transform: translateX(0);
    }
    to {
        transform: translateX(50px);
    }
}

/* تأثير التنفس للصفحة كاملة */
.portal-container.breathing {
    animation: pageBreath 6s ease-in-out infinite;
}

@keyframes pageBreath {
    0%, 100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.02);
    }
}

/* رسالة التحميل الروحانية */
.loading-text {
    display: inline-block;
    animation: loadingPulse 1s ease-in-out infinite;
    color: var(--color-blue);
}

@keyframes loadingPulse {
    0%, 100% {
        opacity: 0.5;
    }
    50% {
        opacity: 1;
    }
}

/* رسائل النجاح */
.success-message {
    color: var(--color-green);
    font-size: 14px;
    margin-top: 10px;
    text-align: center;
    opacity: 0;
    transition: opacity 0.3s;
    background: rgba(16, 185, 129, 0.1);
    padding: 8px;
    border-radius: 8px;
    border: 1px solid rgba(16, 185, 129, 0.2);
}

.success-message.show {
    opacity: 1;
}

/* تحسين الأمان - إخفاء كلمة المرور */
.soul-input[type="password"]::-ms-reveal,
.soul-input[type="password"]::-webkit-textfield-decoration-container {
    display: none;
}

/* التصميم المتجاوب للموبايل */
/* التصميم المتجاوب المحسن للموبايل */
@media (max-width: 768px) {
    body {
        overflow-y: auto;
    }
    
    /* تحسينات حقول الإدخال للموبايل */
    .soul-input {
        font-size: 16px !important; /* منع التكبير في iOS */
        padding: 14px 40px 14px 14px;
        -webkit-user-select: text !important;
        -moz-user-select: text !important;
        user-select: text !important;
        /* تحسينات إضافية للموبايل */
        touch-action: manipulation;
        -webkit-touch-callout: default !important;
    }
    
    /* تأكد من إمكانية التفاعل مع الحقول */
    .input-group {
        position: relative;
        margin-bottom: 25px;
        touch-action: manipulation;
        -webkit-touch-callout: default !important;
    }
    
    .main-layer {
        padding: 1rem;
        min-height: 100vh;
        justify-content: flex-start;
        padding-top: 10vh;
    }
    
.breathing-circle {
    width: 120px;
    height: 120px;
    border: 3px solid rgba(59, 130, 246, 0.4);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: radial-gradient(
        circle at center,
        rgba(59, 130, 246, 0.1) 0%,
        rgba(59, 130, 246, 0.05) 40%,
        transparent 70%
    );
    box-shadow: 
        0 0 40px rgba(59, 130, 246, 0.3),
        inset 0 0 25px rgba(59, 130, 246, 0.1),
        0 0 80px rgba(59, 130, 246, 0.1);
    animation: breathe 4s ease-in-out infinite;
    margin-bottom: 40px;
}
    
    .breathing-text {
        font-size: 14px;
    }
    
    .welcome-text {
        font-size: 24px;
        letter-spacing: 2px;
        margin-bottom: 30px;
    }
    
    .login-area {
        padding: 30px 20px;
        width: calc(100% - 2rem);
        max-width: 350px;
    }
    
    .soul-input {
        font-size: 16px; /* مهم لمنع التكبير في iOS */
        padding: 12px 35px 12px 12px;
    }
    
    .enter-button {
        padding: 14px;
        font-size: 16px;
    }
    
    .additional-options {
        margin-top: 20px;
    }
    
    .forgot-link, .new-soul {
        display: block;
        margin: 10px 0;
        font-size: 14px;
    }
}

@media (max-width: 480px) {
    .main-layer {
        padding-top: 5vh;
    }
    
    .welcome-text {
        font-size: 20px;
    }
    
 
/* إصلاح لشاشات iPhone */
@supports (-webkit-touch-callout: none) {
    .portal-container {
        min-height: -webkit-fill-available;
    }
}
/* تأثيرات إضافية للتحسين */
.soul-input:not(:placeholder-shown) {
    color: var(--text-primary);
    text-shadow: 0 0 5px rgba(59, 130, 246, 0.3);
}

/* حركة خفيفة للأيقونات */
.input-icon {
    animation: iconFloat 3s ease-in-out infinite;
}

@keyframes iconFloat {
    0%, 100% {
        transform: translateY(-50%);
    }
    50% {
        transform: translateY(-50%) translateY(-2px);
    }
}

/* تأثير الوهج للنصوص عند الكتابة */
.soul-input:focus + .input-icon svg {
    filter: drop-shadow(0 0 5px var(--color-blue));
}

    /* منع الوميض الأبيض */
* {
    -webkit-tap-highlight-color: transparent;
}

body, div, span, p, h1, h2, h3, h4, h5, h6 {
    -webkit-touch-callout: none;
}

input, textarea {
    -webkit-touch-callout: default !important;
    -webkit-user-select: text !important;
    user-select: text !important;
}

/* السماح بتحديد النص في حقول الإدخال */
input, textarea {
    -webkit-user-select: text !important;
    -moz-user-select: text !important;
    -ms-user-select: text !important;
    user-select: text !important;

}

    .soul-input:focus {
    -webkit-user-select: text !important;
    user-select: text !important;
    pointer-events: auto !important;
}

/* إصلاح الحواف البيضاء */
.animated-background {
    margin: 0;
    padding: 0;
    left: 0;
    right: 0;
}

    <style>
.paste-btn {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(59, 130, 246, 0.2);
    border: 1px solid rgba(59, 130, 246, 0.4);
    border-radius: 8px;
    width: 45px;
    height: 35px;
    font-size: 18px;
    cursor: pointer;
    transition: all 0.3s;
    z-index: 10;
}

.paste-btn:hover {
    background: rgba(59, 130, 246, 0.4);
    transform: translateY(-50%) scale(1.1);
}

.paste-btn:active {
    transform: translateY(-50%) scale(0.95);
}
</style>
    
</head>

    <div class="animated-background">
        <div class="stars-container" id="starsContainer">
            <!-- النجوم ستضاف بالجافاسكريبت -->
        </div>
    </div>
    
    <!-- الطبقة الرئيسية -->
    <div class="main-layer">
        <!-- دائرة التنفس -->
        <div class="breathing-circle">
            <span class="breathing-text">تنفس بعمق</span>
        </div>
        
        <!-- النص الترحيبي -->
        <div class="welcome-text" id="welcomeText">
            <!-- سيظهر حرف حرف -->
        </div>
        
        <!-- منطقة تسجيل الدخول -->
       <div class="login-area" id="loginArea">
    <form id="loginForm" onsubmit="handleLogin(event)">
        <!-- حقل البريد الإلكتروني -->
<div class="input-group" id="emailGroup">
    <div class="input-icon">
        <svg viewBox="0 0 24 24" style="fill: #3b82f6;">

        </svg>
    </div>
    <input

        id="email"
        class="soul-input"

        onblur="handleBlur('emailGroup')"
    />
    <button type="button" class="paste-btn" onclick="pasteToEmail()" title="لصق">
        📋
    </button>
    <div class="input-glow"></div>
</div>
        
        <!-- حقل كلمة المرور -->
<div class="input-group" id="passwordGroup">

// تهيئة الصوت
function initAudio() {
    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        isAudioEnabled = true;
    }
}

// صوت همسة خفيفة
// صوت همسة خفيفة محسن
function playKeySound() {
    if (!isAudioEnabled) return;
    
    const oscillator = audioContext.createOscillator();
    const gainNode = audioContext.createGain();
    const filter = audioContext.createBiquadFilter();
    
    oscillator.connect(filter);
    filter.connect(gainNode);
    gainNode.connect(audioContext.destination);
    
    // نغمة كريستالية
    oscillator.frequency.value = 800 + Math.random() * 400;
    oscillator.type = 'sine';
    
    filter.type = 'bandpass';
    filter.frequency.value = 1000;
    filter.Q.value = 10;
    
    gainNode.gain.setValueAtTime(0.01, audioContext.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.15);
    
    oscillator.start(audioContext.currentTime);
    oscillator.stop(audioContext.currentTime + 0.15);
}

// صوت الرياح الروحانية
function playWindSound() {
    if (!isAudioEnabled) return;
    
    const oscillator = audioContext.createOscillator();
    const gainNode = audioContext.createGain();
    const filter = audioContext.createBiquadFilter();
    
    // إنشاء ضوضاء بيضاء للرياح
    const bufferSize = audioContext.sampleRate * 0.5;
    const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
    const output = buffer.getChannelData(0);
    
    for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
    }
    
    const whiteNoise = audioContext.createBufferSource();
    whiteNoise.buffer = buffer;
    
    whiteNoise.connect(filter);
    filter.connect(gainNode);
    gainNode.connect(audioContext.destination);
    
    filter.type = 'lowpass';
    filter.frequency.value = 400;
    
    gainNode.gain.setValueAtTime(0.02, audioContext.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.8);
    
    whiteNoise.start(audioContext.currentTime);
    whiteNoise.stop(audioContext.currentTime + 0.8);
}

// صوت النجاح المحسن
function playSuccessSound() {
    if (!isAudioEnabled) return;
    
    // نغمة صاعدة مزدوجة
    for (let i = 0; i < 2; i++) {
        setTimeout(() => {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.setValueAtTime(523.25, audioContext.currentTime); // C5
            oscillator.frequency.exponentialRampToValueAtTime(659.25, audioContext.currentTime + 0.2); // E5
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.03, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.4);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.4);
        }, i * 150);
    }
}

// صوت الخطأ المحسن
function playErrorSound() {
    if (!isAudioEnabled) return;
    
    const oscillator = audioContext.createOscillator();
    const gainNode = audioContext.createGain();
    
    oscillator.connect(gainNode);
    gainNode.connect(audioContext.destination);
    
    // نغمة هابطة مع تردد منخفض
    oscillator.frequency.setValueAtTime(440, audioContext.currentTime);
    oscillator.frequency.exponentialRampToValueAtTime(200, audioContext.currentTime + 0.3);
    oscillator.type = 'sawtooth';
    
    gainNode.gain.setValueAtTime(0.02, audioContext.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.3);
    
    oscillator.start(audioContext.currentTime);
    oscillator.stop(audioContext.currentTime + 0.3);
}

async function handleLogin(event) {
    if (!checkLoginAttempts()) {
    button.innerHTML = originalText;

    return;
}

    event.preventDefault();
    
    const button = event.target.querySelector('.enter-button');

    // تأثير التحميل

    button.disabled = true;
    
    try {
        // البحث عن المستخدم في قاعدة البيانات
        const usersQuery = await db.collection('users')
            .where('personalInfo.email', '==', email)
            .limit(1)
            .get();
        
        if (usersQuery.empty) {
            throw new Error('لم نتعرف على روحك... تأكد من هويتك');
        }
        
        const userDoc = usersQuery.docs[0];
        const userData = userDoc.data();
        const userId = userDoc.id;
        
        // التحقق من حالة الحساب
        if (userData.accountStatus) {
            if (userData.accountStatus.status === 'inactive' || 
                userData.accountStatus.suspended === true) {
                throw new Error('روحك محجوبة عن الدخول... تواصل مع الحكماء');
            }
        }
        
        // محاولة تسجيل الدخول
        let authSuccess = false;
        
        try {
            // محاولة عبر Firebase Auth
            await auth.signInWithEmailAndPassword(email, password);
            authSuccess = true;
            
        } catch (authError) {
            // التحقق من كلمة المرور المحفوظة
            if (userData.auth && userData.auth.tempPassword) {
                const savedPassword = atob(userData.auth.tempPassword);
                if (password === savedPassword) {
                    authSuccess = true;
                    // محاولة إنشاء/تحديث حساب Auth
                    try {
                        await auth.createUserWithEmailAndPassword(email, password);
                    } catch (e) {
                        // لا بأس إذا كان الحساب موجود
                    }
                }
            }
            
            if (!authSuccess) {
                throw new Error('الطريق مغلق... تأكد من مفتاحك');
            }
        }
        
        if (authSuccess) {
            // تحديث آخر دخول
            await db.collection('users').doc(userId).update({
                'auth.lastLogin': firebase.firestore.FieldValue.serverTimestamp(),
                'auth.loginCount': firebase.firestore.FieldValue.increment(1)
            });
            
           // حفظ البيانات للتوافق مع الصفحات القديمة
localStorage.setItem('userId', userId);
localStorage.setItem('userEmail', email);
localStorage.setItem('userName', userData.personalInfo?.name || userData.name || 'روح باحثة');

// حفظ معلومات إضافية إذا كانت موجودة
if (userData.accountStatus) {
    localStorage.setItem('userLevel', userData.accountStatus.level || 'STANDARD');
    localStorage.setItem('userStatus', userData.accountStatus.status || 'active');
}

// للأمان أيضاً في sessionStorage
sessionStorage.setItem('uid', userId);
sessionStorage.setItem('uname', userData.personalInfo?.name || 'روح باحثة');
            
            // التحقق من نوع المستخدم
            const isAdmin = email === 'admin@fouad-academy.com' || 
                           userData.auth?.role === 'admin';
            
            // تأثير الانتقال

                    window.location.href = './admin/dashboard.html';
                } else {
                    window.location.href = './my-courses.html';
                }
            }, 1500);
        }
        
    } catch (error) {
        console.error('خطأ في الدخول:', error);
        showError(error.message || 'حدث خطأ في فتح البوابة');
        button.innerHTML = originalText;
        button.disabled = false;
    }

// تأثير الموجة عند الضغط
// تأثير الموجة المحسن عند الضغط
function createRipple(button, event) {
    const ripple = document.createElement('div');
    ripple.className = 'ripple';
    
    const rect = button.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    
    ripple.style.width = ripple.style.height = size + 'px';
    
    if (event) {
        ripple.style.left = (event.clientX - rect.left - size / 2) + 'px';
        ripple.style.top = (event.clientY - rect.top - size / 2) + 'px';
    } else {
        ripple.style.left = '50%';
        ripple.style.top = '50%';
        ripple.style.transform = 'translate(-50%, -50%)';
    }
    
    button.appendChild(ripple);
    
    // إضافة نجوم صغيرة حول الموجة
    for (let i = 0; i < 5; i++) {
        const star = document.createElement('div');
        star.className = 'ripple-star';
        star.style.position = 'absolute';
        star.style.width = '4px';
        star.style.height = '4px';
        star.style.background = '#fbbf24';
        star.style.borderRadius = '50%';
        star.style.left = (50 + (Math.random() - 0.5) * 100) + '%';
        star.style.top = (50 + (Math.random() - 0.5) * 100) + '%';
        star.style.animation = 'starBurst 0.8s ease-out forwards';
        button.appendChild(star);
        
        setTimeout(() => star.remove(), 800);
    }
    
    setTimeout(() => ripple.remove(), 600);
}

async function forgotPath(event) {
    event.preventDefault();
    
    const email = document.getElementById('email').value.trim();
    
    if (!email) {
        showError('اكتب بريدك أولاً ليصلك دليل الطريق');
        document.getElementById('email').focus();
        return;
    }
    
    try {
        // التحقق من وجود المستخدم
        const usersQuery = await db.collection('users')
            .where('personalInfo.email', '==', email)
            .limit(1)
            .get();
        
        if (usersQuery.empty) {
            showError('لم نجد روحك في سجلاتنا');
            return;
        }
        
        // إرسال رابط الاستعادة
        await auth.sendPasswordResetEmail(email);
        
        showSuccess('تم إرسال دليل الطريق إلى بريدك');
        
    } catch (error) {
        console.error('خطأ في الاستعادة:', error);
        showError('تعذر إرسال دليل الطريق... حاول لاحقاً');
    }
}

    originalShowSuccess(message);
    playSuccessSound();
};

        // دوال اللصق للأزرار
async function pasteToEmail() {
    try {
        const text = await navigator.clipboard.readText();
        document.getElementById('email').value = text;
        document.getElementById('email').focus();
        showSuccess('تم اللصق بنجاح ✓');
    } catch (err) {
        // طريقة بديلة
        document.getElementById('email').focus();
        document.execCommand('paste');
    }
}

async function pasteToPassword() {

        const text = await navigator.clipboard.readText();

}
        
// حماية من محاولات الاختراق
let loginAttempts = 0;
const maxAttempts = 5;

// تحديث handleLogin بإضافة حماية من المحاولات المتكررة
function checkLoginAttempts() {
    loginAttempts++;
    if (loginAttempts >= maxAttempts) {
        const button = document.querySelector('.enter-button');
        button.disabled = true;
        showError('تم إغلاق البوابة مؤقتاً... انتظر قليلاً');
        
        setTimeout(() => {
            loginAttempts = 0;
            button.disabled = false;
            showSuccess('البوابة مفتوحة مجدداً');
        }, 30000); // 30 ثانية
        
        return false;
    }
    return true;
}

// حماية من فحص الكود
(function() {

    
   document.addEventListener('keydown', function(e) {
    // السماح بكل عمليات النسخ واللصق والقص
    if ((e.ctrlKey || e.metaKey) && 
        (e.key === 'v' || e.key === 'V' || 
         e.key === 'c' || e.key === 'C' || 
         e.key === 'x' || e.key === 'X' ||
         e.key === 'a' || e.key === 'A')) {
        return true;
    }
    
    // منع F12 فقط
    if (e.key === 'F12') {
        e.preventDefault();
        return false;
    }
});
})();

input.addEventListener('touchstart', function(e) {
    // السماح باللمس الطبيعي
    e.stopPropagation();
}, {passive: true});
        
        input.addEventListener('copy', function(e) {
            // السماح بالنسخ الافتراضي
            e.stopPropagation();
        });
        
        input.addEventListener('cut', function(e) {
            // السماح بالقص الافتراضي
            e.stopPropagation();
        });
        
        // تأكد من أن الحقل قابل للتحديد
        input.style.webkitUserSelect = 'text';
        input.style.mozUserSelect = 'text';
        input.style.msUserSelect = 'text';
        input.style.userSelect = 'text';
        
        let lastLength = 0;
        
        input.addEventListener('input', function(e) {
            // تفعيل الصوت عند أول كتابة
            if (!isAudioEnabled) {
                initAudio();
            }
            
            // صوت فقط عند إضافة حرف جديد
            if (e.target.value.length > lastLength) {
                if (isAudioEnabled) {
                    playKeySound();
                }
                
                // تأثير بصري للحرف الجديد
                e.target.style.textShadow = '0 0 8px rgba(59, 130, 246, 0.5)';
                setTimeout(() => {
                    e.target.style.textShadow = '0 0 5px rgba(59, 130, 246, 0.3)';
                }, 100);
            }
            
            lastLength = e.target.value.length;
        });
        
        // إعادة تعيين عند فقدان التركيز
        input.addEventListener('blur', function() {
            lastLength = 0;
        });
    });
});
