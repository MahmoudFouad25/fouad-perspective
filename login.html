<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - منظور الفؤاد</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
  <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Noto Kufi Arabic', 'Tajawal', sans-serif;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    position: relative;
}

/* حاوية البوابة الرئيسية */
.portal-container {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* الخلفية المتحركة - السماء الليلية */
.animated-background {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(
        180deg,
        #0a0e27 0%,
        #1a1f3a 30%,
        #2d3561 70%,
        #3a4374 100%
    );
    z-index: 1;
}

/* حاوية النجوم */
.stars-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

/* النجمة الأساسية */
.star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle 3s ease-in-out infinite;
}

@keyframes twinkle {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
}

/* الطبقة الرئيسية */
.main-layer {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
}

/* دائرة التنفس */
.breathing-circle {
    width: 120px;
    height: 120px;
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    box-shadow: 
        0 0 30px rgba(255, 255, 255, 0.1),
        inset 0 0 20px rgba(255, 255, 255, 0.05);
    animation: breathe 4s ease-in-out infinite;
    margin-bottom: 40px;
}

@keyframes breathe {
    0% { 
        transform: scale(1);
        opacity: 0.3;
    }
    50% { 
        transform: scale(1.2);
        opacity: 0.6;
    }
    100% { 
        transform: scale(1);
        opacity: 0.3;
    }
}

.breathing-text {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.5);
    font-weight: 300;
    position: absolute;
}

/* النص الترحيبي */
.welcome-text {
    font-size: 32px;
    font-weight: 300;
    color: #ffffff;
    text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
    letter-spacing: 3px;
    margin-bottom: 50px;
    opacity: 0;
}

.welcome-text.show {
    animation: fadeInText 0.5s ease-out forwards;
}

@keyframes fadeInText {
    to {
        opacity: 1;
    }
}

/* منطقة تسجيل الدخول */
.login-area {
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 40px;
    width: 100%;
    max-width: 400px;
    box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.3),
        inset 0 0 30px rgba(255, 255, 255, 0.02);
    opacity: 0;
    transform: translateY(20px);
}

.login-area.show {
    animation: slideUp 0.8s ease-out forwards;
    animation-delay: 1s;
}

@keyframes slideUp {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>
<body>
   <div class="portal-container">
    <!-- الخلفية المتحركة -->
    <div class="animated-background">
        <div class="stars-container" id="starsContainer">
            <!-- النجوم ستضاف بالجافاسكريبت -->
        </div>
    </div>
    
    <!-- الطبقة الرئيسية -->
    <div class="main-layer">
        <!-- دائرة التنفس -->
        <div class="breathing-circle">
            <span class="breathing-text">تنفس بعمق</span>
        </div>
        
        <!-- النص الترحيبي -->
        <div class="welcome-text" id="welcomeText">
            <!-- سيظهر حرف حرف -->
        </div>
        
        <!-- منطقة تسجيل الدخول -->
        <div class="login-area" id="loginArea">
            <p style="color: white; text-align: center;">منطقة تسجيل الدخول - قيد التطوير</p>
        </div>
    </div>
</div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
       // إنشاء النجوم
function createStars() {
    const container = document.getElementById('starsContainer');
    const starCount = 150;
    
    for (let i = 0; i < starCount; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        
        // حجم عشوائي
        const size = Math.random() * 3 + 1;
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        
        // موقع عشوائي
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        
        // تأخير عشوائي للومضة
        star.style.animationDelay = Math.random() * 3 + 's';
        star.style.animationDuration = (Math.random() * 3 + 3) + 's';
        
        // شفافية متفاوتة
        star.style.opacity = Math.random() * 0.7 + 0.3;
        
        container.appendChild(star);
    }
}

// النص الترحيبي يظهر حرف حرف
function showWelcomeText() {
    const text = "أهلاً بروحك الباحثة";
    const element = document.getElementById('welcomeText');
    let index = 0;
    
    setTimeout(() => {
        const interval = setInterval(() => {
            if (index < text.length) {
                element.textContent += text[index];
                element.classList.add('show');
                index++;
            } else {
                clearInterval(interval);
                // إظهار منطقة الدخول
                document.getElementById('loginArea').classList.add('show');
            }
        }, 100);
    }, 2000);
}

// تشغيل عند تحميل الصفحة
window.addEventListener('load', () => {
    createStars();
    showWelcomeText();
});

    </script>
</body>
</html>
