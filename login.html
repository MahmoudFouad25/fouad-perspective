<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - منظور الفؤاد</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
  <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Noto Kufi Arabic', 'Tajawal', sans-serif;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    position: relative;
}

/* حاوية البوابة الرئيسية */
.portal-container {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* الخلفية المتحركة - السماء الليلية */
.animated-background {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(
        180deg,
        #0a0e27 0%,
        #1a1f3a 30%,
        #2d3561 70%,
        #3a4374 100%
    );
    z-index: 1;
}

/* حاوية النجوم */
.stars-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

/* النجمة الأساسية */
.star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle 3s ease-in-out infinite;
}

@keyframes twinkle {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
}

/* الطبقة الرئيسية */
.main-layer {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
}

/* دائرة التنفس */
.breathing-circle {
    width: 120px;
    height: 120px;
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    box-shadow: 
        0 0 30px rgba(255, 255, 255, 0.1),
        inset 0 0 20px rgba(255, 255, 255, 0.05);
    animation: breathe 4s ease-in-out infinite;
    margin-bottom: 40px;
}

@keyframes breathe {
    0% { 
        transform: scale(1);
        opacity: 0.3;
    }
    50% { 
        transform: scale(1.2);
        opacity: 0.6;
    }
    100% { 
        transform: scale(1);
        opacity: 0.3;
    }
}

.breathing-text {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.5);
    font-weight: 300;
    position: absolute;
}

/* النص الترحيبي */
.welcome-text {
    font-size: 32px;
    font-weight: 300;
    color: #ffffff;
    text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
    letter-spacing: 3px;
    margin-bottom: 50px;
    opacity: 0;
}

.welcome-text.show {
    animation: fadeInText 0.5s ease-out forwards;
}

@keyframes fadeInText {
    to {
        opacity: 1;
    }
}

/* منطقة تسجيل الدخول */
.login-area {
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 40px;
    width: 100%;
    max-width: 400px;
    box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.3),
        inset 0 0 30px rgba(255, 255, 255, 0.02);
    opacity: 0;
    transform: translateY(20px);
}

.login-area.show {
    animation: slideUp 0.8s ease-out forwards;
    animation-delay: 1s;
}

@keyframes slideUp {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
      /* مجموعة الإدخال */
.input-group {
    position: relative;
    margin-bottom: 25px;
}

/* أيقونة الحقل */
.input-icon {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    width: 20px;
    height: 20px;
    opacity: 0.5;
    transition: all 0.3s;
}

.input-icon svg {
    width: 100%;
    height: 100%;
    fill: rgba(255, 255, 255, 0.6);
}

/* حقل الإدخال الروحاني */
.soul-input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    color: white;
    font-size: 16px;
    padding: 12px 40px 12px 12px;
    transition: all 0.3s;
    font-family: inherit;
    outline: none;
}

.soul-input::placeholder {
    color: rgba(255, 255, 255, 0.3);
    font-weight: 300;
}

.soul-input:focus {
    border-bottom-color: rgba(255, 255, 255, 0.6);
}

/* التوهج عند التركيز */
.input-group.focused .input-glow {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
    animation: glowMove 2s linear infinite;
}

@keyframes glowMove {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
}

/* نقاط كلمة المرور كنجوم */
.soul-input[type="password"] {
    letter-spacing: 5px;
}

/* زر الدخول */
.enter-button {
    margin-top: 30px;
    width: 100%;
    padding: 15px;
    background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.1),
        rgba(255, 255, 255, 0.05)
    );
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 50px;
    color: white;
    font-size: 18px;
    font-weight: 400;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.5s;
    font-family: inherit;
}

/* التوهج المستمر للزر */
.button-glow {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200%;
    height: 200%;
    background: radial-gradient(
        circle,
        rgba(255, 255, 255, 0.1) 0%,
        transparent 70%
    );
    animation: pulse 2s infinite;
    pointer-events: none;
}

@keyframes pulse {
    0%, 100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
    50% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}

.enter-button:hover {
    background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.2),
        rgba(255, 255, 255, 0.1)
    );
    transform: translateY(-2px);
    box-shadow: 
        0 10px 30px rgba(255, 255, 255, 0.2),
        0 5px 15px rgba(0, 0, 0, 0.3);
}

/* أيقونة القلب النابض */
@keyframes heartBeat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.1); }
    50% { transform: scale(1); }
    75% { transform: scale(1.1); }
}

.pulsing-heart {
    animation: heartBeat 2s ease-in-out infinite;
}

/* رسائل الخطأ الروحانية */
.error-message {
    color: rgba(255, 150, 150, 0.9);
    font-size: 14px;
    margin-top: 10px;
    text-align: center;
    opacity: 0;
    transition: opacity 0.3s;
}

.error-message.show {
    opacity: 1;
}

/* خيارات إضافية */
.additional-options {
    margin-top: 30px;
    text-align: center;
}

.forgot-link, .new-soul {
    color: rgba(255, 255, 255, 0.5);
    text-decoration: none;
    font-size: 14px;
    transition: all 0.3s;
    display: inline-block;
    margin: 0 10px;
}

.forgot-link:hover, .new-soul:hover {
    color: rgba(255, 255, 255, 0.8);
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
}

      /* تأثير النجوم المتساقطة عند التركيز */
.falling-stars {
    position: absolute;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: hidden;
}

.mini-star {
    position: absolute;
    width: 4px;
    height: 4px;
    background: white;
    border-radius: 50%;
    opacity: 0;
    animation: fallingStar 1s ease-out forwards;
}

@keyframes fallingStar {
    0% {
        transform: translateY(-20px);
        opacity: 0;
    }
    50% {
        opacity: 1;
    }
    100% {
        transform: translateY(20px);
        opacity: 0;
    }
}

/* موجة الطاقة عند الضغط على الزر */
.ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.5);
    transform: scale(0);
    animation: rippleEffect 0.6s ease-out;
    pointer-events: none;
}

@keyframes rippleEffect {
    to {
        transform: scale(4);
        opacity: 0;
    }
}

/* تأثير الدخول النهائي */
.portal-transition {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.8), transparent);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 9999;
}

.portal-transition.active {
    animation: portalExpand 1.5s ease-out forwards;
}

@keyframes portalExpand {
    to {
        width: 300vw;
        height: 300vw;
        opacity: 0;
    }
}

/* تحسين الحركة للنجوم في الخلفية */
.star.moving {
    animation: starDrift 20s linear infinite;
}

@keyframes starDrift {
    from {
        transform: translateX(0);
    }
    to {
        transform: translateX(50px);
    }
}

/* تأثير التنفس للصفحة كاملة */
.portal-container.breathing {
    animation: pageBreath 6s ease-in-out infinite;
}

@keyframes pageBreath {
    0%, 100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.02);
    }
}

/* رسالة التحميل الروحانية */
.loading-text {
    display: inline-block;
    animation: loadingPulse 1s ease-in-out infinite;
}

@keyframes loadingPulse {
    0%, 100% {
        opacity: 0.5;
    }
    50% {
        opacity: 1;
    }
}

      /* تخصيص SweetAlert2 للتصميم الروحاني */
.swal2-popup {
    background: rgba(26, 31, 58, 0.95) !important;
    backdrop-filter: blur(20px) !important;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
    border-radius: 20px !important;
    color: white !important;
}

.swal2-title {
    color: rgba(255, 255, 255, 0.9) !important;
    font-weight: 300 !important;
}

.swal2-content {
    color: rgba(255, 255, 255, 0.7) !important;
}

.swal2-confirm {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.1)) !important;
    border: 1px solid rgba(255, 255, 255, 0.3) !important;
    border-radius: 50px !important;
    padding: 12px 30px !important;
    font-weight: 400 !important;
    transition: all 0.3s !important;
}

.swal2-confirm:hover {
    transform: translateY(-2px) !important;
    box-shadow: 0 10px 30px rgba(255, 255, 255, 0.2) !important;
}

/* مؤشر جهاز نشط */
.active-device-indicator {
    position: fixed;
    bottom: 20px;
    left: 20px;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 20px;
    padding: 10px 20px;
    color: rgba(255, 255, 255, 0.7);
    font-size: 12px;
    display: none;
    align-items: center;
    gap: 10px;
    z-index: 100;
}

.active-device-indicator.show {
    display: flex;
}

.device-dot {
    width: 8px;
    height: 8px;
    background: #4ade80;
    border-radius: 50%;
    animation: devicePulse 2s infinite;
}

@keyframes devicePulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.2); }
}
</style>
</head>
<body>
   <div class="portal-container">
    <!-- الخلفية المتحركة -->
    <div class="animated-background">
        <div class="stars-container" id="starsContainer">
            <!-- النجوم ستضاف بالجافاسكريبت -->
        </div>
    </div>
    
    <!-- الطبقة الرئيسية -->
    <div class="main-layer">
        <!-- دائرة التنفس -->
        <div class="breathing-circle">
            <span class="breathing-text">تنفس بعمق</span>
        </div>
        
        <!-- النص الترحيبي -->
        <div class="welcome-text" id="welcomeText">
            <!-- سيظهر حرف حرف -->
        </div>
        
        <!-- منطقة تسجيل الدخول -->
       <div class="login-area" id="loginArea">
    <form id="loginForm" onsubmit="handleLogin(event)">
        <!-- حقل البريد الإلكتروني -->
        <div class="input-group" id="emailGroup">
            <div class="input-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
                </svg>
            </div>
            <input 
                type="email" 
                id="email"
                class="soul-input"
                placeholder="بريدك الإلكتروني"
                required
                onfocus="handleFocus('emailGroup')"
                onblur="handleBlur('emailGroup')"
            />
            <div class="input-glow"></div>
        </div>
        
        <!-- حقل كلمة المرور -->
        <div class="input-group" id="passwordGroup">
            <div class="input-icon pulsing-heart">
                <svg viewBox="0 0 24 24">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
            </div>
            <input 
                type="password"
                id="password" 
                class="soul-input"
                placeholder="كلمة السر"
                required
                onfocus="handleFocus('passwordGroup')"

            />

        </div>
        
        <!-- رسالة الخطأ -->

        <!-- زر الدخول -->

        </button>
    </form>
    
    <!-- خيارات إضافية -->
    <div class="additional-options">
        <a href="#" class="forgot-link" onclick="forgotPath(event)">نسيت طريقك؟</a>
        <a href="#" class="new-soul" onclick="newSoul(event)">روح جديدة؟ ابدأ رحلتك</a>
    </div>
</div>
    </div>
</div>

        <!-- مؤشر الجهاز النشط -->
<div class="active-device-indicator" id="deviceIndicator">
    <div class="device-dot"></div>
    <span>جهاز محمي</span>
</div>

  <!-- Firebase Scripts -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="./js/firebase-config.js"></script>
    <script src="./js/security.js"></script>
    
<div class="portal-transition" id="portalTransition"></div>
    <script>
// ============ متغيرات عامة ============
let audioContext;
let isAudioEnabled = false;
let loginAttempts = 0;
const MAX_LOGIN_ATTEMPTS = 5;

// ============ وظائف الحماية والأمان ============
function generateDeviceId() {
    const nav = window.navigator;
    const screen = window.screen;
    let deviceId = localStorage.getItem('deviceId');
    
    if (!deviceId) {
        const fingerprint = [
            nav.userAgent,
            nav.language,
            screen.height,
            screen.width,
            screen.pixelDepth,
            new Date().getTimezoneOffset(),
            nav.hardwareConcurrency,
            nav.platform
        ].join('|');
        
        let hash = 0;
        for (let i = 0; i < fingerprint.length; i++) {
            const char = fingerprint.charCodeAt(i);
            hash = ((hash << 5) - hash) + char;
            hash = hash & hash;
        }
        
        deviceId = 'device_' + Math.abs(hash).toString(36) + '_' + Date.now().toString(36);
        localStorage.setItem('deviceId', deviceId);
    }
    
    return deviceId;
}

async function checkActiveSession(userId) {
    try {
        const deviceId = generateDeviceId();
        const userDoc = await db.collection('users').doc(userId).get();
        
        if (userDoc.exists) {
            const userData = userDoc.data();
            const activeDevice = userData.activeDevice;
            const lastActivity = userData.lastActivity;
            
            if (activeDevice && activeDevice !== deviceId) {
                if (lastActivity) {
                    const lastActivityTime = lastActivity.toDate();
                    const now = new Date();
                    const diffMinutes = (now - lastActivityTime) / (1000 * 60);
                    
                    if (diffMinutes < 5) {
                        return {
                            allowed: false,
                            reason: 'active_device',
                            deviceInfo: userData.deviceInfo || {}
                        };
                    }
                }
            }
            
            await db.collection('users').doc(userId).update({
                activeDevice: deviceId,
                lastActivity: firebase.firestore.FieldValue.serverTimestamp(),
                deviceInfo: {
                    userAgent: navigator.userAgent,
                    platform: navigator.platform,
                    language: navigator.language,
                    screenResolution: `${screen.width}x${screen.height}`,
                    timestamp: new Date().toISOString()
                }
            });
            
            startActivityMonitoring(userId, deviceId);
            
            return { allowed: true };
        }
        
        return { allowed: false, reason: 'user_not_found' };
        
    } catch (error) {
        console.error('خطأ في التحقق من الجلسة:', error);
        return { allowed: false, reason: 'error' };
    }
}

function startActivityMonitoring(userId, deviceId) {
    const activityInterval = setInterval(async () => {
        try {
            const userDoc = await db.collection('users').doc(userId).get();
            if (userDoc.exists) {
                const userData = userDoc.data();
                
                if (userData.forceLogout === true) {
                    clearInterval(activityInterval);
                    localStorage.clear();
                    
                    await Swal.fire({
                        icon: 'warning',
                        title: 'تم تسجيل الدخول من جهاز آخر',
                        text: 'سيتم تسجيل خروجك الآن لأن حسابك نشط على جهاز آخر.',
                        confirmButtonText: 'حسناً',
                        allowOutsideClick: false,
                        allowEscapeKey: false
                    });
                    
                    auth.signOut();
                    window.location.replace('./login.html');
                    return;
                }
                
                if (userData.activeDevice === deviceId) {
                    await db.collection('users').doc(userId).update({
                        lastActivity: firebase.firestore.FieldValue.serverTimestamp()
                    });
                } else {
                    clearInterval(activityInterval);
                    handleForcedLogout();
                }
            }
        } catch (error) {
            console.error('خطأ في تحديث النشاط:', error);
        }
    }, 30000);
    
    window.activityMonitor = activityInterval;
    
    window.addEventListener('beforeunload', () => {
        clearInterval(activityInterval);
    });
}

function handleForcedLogout() {
    Swal.fire({
        icon: 'warning',
        title: 'جلسة أخرى نشطة',
        text: 'تم تسجيل الدخول من جهاز آخر. سيتم تسجيل خروجك الآن.',
        confirmButtonText: 'حسناً',
        allowOutsideClick: false,
        allowEscapeKey: false
    }).then(() => {
        auth.signOut();
        window.location.reload();
    });
}

// ============ وظائف التصميم والحركة ============
function createStars() {
    const container = document.getElementById('starsContainer');
    const starCount = 150;
    
    for (let i = 0; i < starCount; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        
        const size = Math.random() * 3 + 1;
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDelay = Math.random() * 3 + 's';
        star.style.animationDuration = (Math.random() * 3 + 3) + 's';
        star.style.opacity = Math.random() * 0.7 + 0.3;
        
        if (Math.random() > 0.7) {
            star.classList.add('moving');
            star.style.animationDelay = Math.random() * 20 + 's';
        }
        
        container.appendChild(star);
    }
}

function showWelcomeText() {
    const text = "أهلاً بروحك الباحثة";
    const element = document.getElementById('welcomeText');
    let index = 0;
    
    setTimeout(() => {
        const interval = setInterval(() => {
            if (index < text.length) {
                element.textContent += text[index];
                element.classList.add('show');
                index++;
                playKeySound();
            } else {
                clearInterval(interval);
                document.getElementById('loginArea').classList.add('show');
            }
        }, 100);
    }, 2000);
}

// ============ وظائف الصوت ============
function initAudio() {
    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        isAudioEnabled = true;
    }
}

function playKeySound() {
    if (!isAudioEnabled) return;
    
    const oscillator = audioContext.createOscillator();
    const gainNode = audioContext.createGain();
    
    oscillator.connect(gainNode);
    gainNode.connect(audioContext.destination);
    oscillator.frequency.value = 800 + Math.random() * 400;
    oscillator.type = 'sine';
    gainNode.gain.setValueAtTime(0.02, audioContext.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.1);
    oscillator.start(audioContext.currentTime);
    oscillator.stop(audioContext.currentTime + 0.1);
}

function playWindSound() {
    if (!isAudioEnabled) return;
    
    const oscillator = audioContext.createOscillator();
    const gainNode = audioContext.createGain();
    const filter = audioContext.createBiquadFilter();
    
    oscillator.connect(filter);
    filter.connect(gainNode);
    gainNode.connect(audioContext.destination);
    oscillator.type = 'sawtooth';
    oscillator.frequency.value = 100 + Math.random() * 50;
    filter.type = 'lowpass';
    filter.frequency.value = 400;
    gainNode.gain.setValueAtTime(0.01, audioContext.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.5);
    oscillator.start(audioContext.currentTime);
    oscillator.stop(audioContext.currentTime + 0.5);
}

function handleFocus(groupId) {

function createFallingStars(groupId) {
    const group = document.getElementById(groupId);
    const container = document.createElement('div');
    container.className = 'falling-stars';
    
    for (let i = 0; i < 5; i++) {
        setTimeout(() => {
            const star = document.createElement('div');
            star.className = 'mini-star';
            star.style.left = Math.random() * 100 + '%';
            container.appendChild(star);
            setTimeout(() => star.remove(), 1000);
        }, i * 100);
    }
    
    group.appendChild(container);
    setTimeout(() => container.remove(), 2000);
}

function createRipple(button) {
    const ripple = document.createElement('div');
    ripple.className = 'ripple';
    const rect = button.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = '50%';
    ripple.style.top = '50%';
    button.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
}

// استبدل دالة handleLogin بالكامل بهذه النسخة المصححة
async function handleLogin(event) {
    event.preventDefault();
    
    if (loginAttempts >= MAX_LOGIN_ATTEMPTS) {
        showError('تم تجاوز عدد المحاولات المسموح. حاول لاحقاً.');
        return;
    }
    
    const button = event.target.querySelector('.enter-button');
    const originalText = button.innerHTML;
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    
    // التحقق من الحقول
    if (!email || !password) {
        showError('يرجى إدخال الإيميل وكلمة المرور');
        return;
    }
    
    createRipple(button);
    button.innerHTML = '<span class="loading-text">جاري فتح البوابة...</span>';
    button.disabled = true;
    
    try {
        console.log('🔍 البحث عن المستخدم بالبريد:', email);
        
        // البحث في Firestore أولاً
        const usersQuery = await db.collection('users')
            .where('personalInfo.email', '==', email)
            .limit(1)
            .get();
        
        let userDoc = null;
        let firestoreUserId = null;
        
        if (usersQuery.empty) {
            // جرب البحث بحقل email مباشرة (للمستخدمين القدامى)
            const oldUsersQuery = await db.collection('users')
                .where('email', '==', email)
                .limit(1)
                .get();
                
            if (oldUsersQuery.empty) {
                throw new Error('لم نتعرف على روحك... تأكد من هويتك');
            }
            
            userDoc = oldUsersQuery.docs[0];
        } else {
            userDoc = usersQuery.docs[0];
        }
        
        const userData = userDoc.data();
        firestoreUserId = userDoc.id;
        
        console.log('✅ تم العثور على المستخدم:', firestoreUserId);
        
        // التحقق من حالة الحساب
        if (userData.accountStatus?.suspended === true) {
            throw new Error(`حسابك معلق: ${userData.accountStatus.suspendReason || 'تواصل مع الإدارة'}`);
        }
        
        // محاولة تسجيل الدخول
        let authSuccess = false;
        
        try {
            await auth.signInWithEmailAndPassword(email, password);
            authSuccess = true;
            console.log('✅ تسجيل دخول ناجح عبر Firebase Auth');
        } catch (authError) {
            console.log('⚠️ فشل Auth، جاري التحقق من كلمة المرور المحفوظة...');
            
            // التحقق من كلمة المرور المحفوظة
            if (userData.auth?.tempPassword) {
                try {
                    const savedPassword = atob(userData.auth.tempPassword);
                    if (password === savedPassword) {
                        authSuccess = true;
                        console.log('✅ كلمة المرور المحفوظة صحيحة');
                        
                        // محاولة إنشاء حساب في Firebase Auth
                        try {
                            await auth.createUserWithEmailAndPassword(email, password);
                        } catch (e) {
                            if (e.code !== 'auth/email-already-in-use') {
                                console.log('تحذير:', e.message);
                            }
                        }
                    }
                } catch (decodeError) {
                    console.error('خطأ في فك تشفير كلمة المرور:', decodeError);
                }
            }
            
            if (!authSuccess) {
                throw new Error('الطريق مغلق... تأكد من مفتاحك');
            }
        }
        
        if (authSuccess) {
            // التحقق من الجلسة النشطة
            const sessionCheck = await checkActiveSession(firestoreUserId);
            
            if (!sessionCheck.allowed) {
                if (sessionCheck.reason === 'active_device') {
                    const result = await Swal.fire({
                        icon: 'warning',
                        title: 'جهاز آخر نشط',
                        html: `
                            <div style="text-align: right;">
                                <p>يوجد جهاز آخر مسجل دخول بحسابك</p>
                                <p style="margin-top: 20px; color: #fbbf24;">
                                    <strong>هل تريد تسجيل الخروج من الجهاز الآخر والمتابعة؟</strong>
                                </p>
                            </div>
                        `,
                        showCancelButton: true,
                        confirmButtonText: 'نعم، سجل الخروج من الجهاز الآخر',
                        cancelButtonText: 'إلغاء'
                    });
                    
                    if (!result.isConfirmed) {
                        button.innerHTML = originalText;
                        button.disabled = false;
                        return;
                    }
                    
                    // إجبار تسجيل الخروج من الجهاز الآخر
                    await db.collection('users').doc(firestoreUserId).update({
                        forceLogout: true,
                        forceLogoutTime: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    // انتظار ثانية واحدة
                    await new Promise(resolve => setTimeout(resolve, 1000));
                }
            }
            
            const deviceId = generateDeviceId();
            
            // تحديث معلومات الدخول
            await db.collection('users').doc(firestoreUserId).update({
                'auth.lastLogin': firebase.firestore.FieldValue.serverTimestamp(),
                'auth.loginCount': firebase.firestore.FieldValue.increment(1),
                activeDevice: deviceId,
                lastActivity: firebase.firestore.FieldValue.serverTimestamp(),
                forceLogout: false,
                deviceInfo: {
                    userAgent: navigator.userAgent.substring(0, 200),
                    platform: navigator.platform,
                    language: navigator.language,
                    screenResolution: `${screen.width}x${screen.height}`,
                    timestamp: new Date().toISOString()
                }
            });
            
            // حفظ البيانات في localStorage
            localStorage.setItem('userId', firestoreUserId);
            localStorage.setItem('userEmail', email);
            localStorage.setItem('userName', userData.personalInfo?.name || userData.name || 'مستخدم');
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('deviceId', deviceId);
            
            console.log('💾 تم حفظ معرف Firestore:', firestoreUserId);
            
            // عرض مؤشر الجهاز النشط
            document.getElementById('deviceIndicator').classList.add('show');
            
            // بدء مراقبة النشاط
            startActivityMonitoring(firestoreUserId, deviceId);
            
            // بدء انتقال البوابة
            startPortalTransition();
            
            // التوجيه بعد التأثير
            setTimeout(() => {
                const isAdmin = email === 'admin@fouad-academy.com' || 
                               userData.auth?.role === 'admin' ||
                               userData.role === 'admin';
                
                if (isAdmin) {
                    window.location.replace('./admin/dashboard.html');
                } else {
                    window.location.replace('./dashboard.html');
                }
            }, 1500);
        }
        
    } catch (error) {
        console.error('❌ خطأ في تسجيل الدخول:', error);
        loginAttempts++;
        button.innerHTML = originalText;
        button.disabled = false;
        showError(error.message || 'حدث خطأ في الدخول');
    }
}
