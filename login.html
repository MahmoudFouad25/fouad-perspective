<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - منظور الفؤاد</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
  <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Noto Kufi Arabic', 'Tajawal', sans-serif;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    position: relative;
}

/* حاوية البوابة الرئيسية */
.portal-container {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* الخلفية المتحركة - السماء الليلية */
.animated-background {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(
        180deg,
        #0a0e27 0%,
        #1a1f3a 30%,
        #2d3561 70%,
        #3a4374 100%
    );
    z-index: 1;
}

/* حاوية النجوم */
.stars-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

/* النجمة الأساسية */
.star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle 3s ease-in-out infinite;
}

@keyframes twinkle {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
}

/* الطبقة الرئيسية */
.main-layer {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
}

/* دائرة التنفس */
.breathing-circle {
    width: 120px;
    height: 120px;
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    box-shadow: 
        0 0 30px rgba(255, 255, 255, 0.1),
        inset 0 0 20px rgba(255, 255, 255, 0.05);
    animation: breathe 4s ease-in-out infinite;
    margin-bottom: 40px;
}

@keyframes breathe {
    0% { 
        transform: scale(1);
        opacity: 0.3;
    }
    50% { 
        transform: scale(1.2);
        opacity: 0.6;
    }
    100% { 
        transform: scale(1);
        opacity: 0.3;
    }
}

.breathing-text {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.5);
    font-weight: 300;
    position: absolute;
}

/* النص الترحيبي */
.welcome-text {
    font-size: 32px;
    font-weight: 300;
    color: #ffffff;
    text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
    letter-spacing: 3px;
    margin-bottom: 50px;
    opacity: 0;
}

.welcome-text.show {
    animation: fadeInText 0.5s ease-out forwards;
}

@keyframes fadeInText {
    to {
        opacity: 1;
    }
}

/* منطقة تسجيل الدخول */
.login-area {
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 40px;
    width: 100%;
    max-width: 400px;
    box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.3),
        inset 0 0 30px rgba(255, 255, 255, 0.02);
    opacity: 0;
    transform: translateY(20px);
}

.login-area.show {
    animation: slideUp 0.8s ease-out forwards;
    animation-delay: 1s;
}

@keyframes slideUp {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
      /* مجموعة الإدخال */
.input-group {
    position: relative;
    margin-bottom: 25px;
}

/* أيقونة الحقل */
.input-icon {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    width: 20px;
    height: 20px;
    opacity: 0.5;
    transition: all 0.3s;
}

.input-icon svg {
    width: 100%;
    height: 100%;
    fill: rgba(255, 255, 255, 0.6);
}

/* حقل الإدخال الروحاني */
.soul-input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    color: white;
    font-size: 16px;
    padding: 12px 40px 12px 12px;
    transition: all 0.3s;
    font-family: inherit;
    outline: none;
}

.soul-input::placeholder {
    color: rgba(255, 255, 255, 0.3);
    font-weight: 300;
}

.soul-input:focus {
    border-bottom-color: rgba(255, 255, 255, 0.6);
}

/* التوهج عند التركيز */
.input-group.focused .input-glow {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
    animation: glowMove 2s linear infinite;
}

@keyframes glowMove {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
}

/* نقاط كلمة المرور كنجوم */
.soul-input[type="password"] {
    letter-spacing: 5px;
}

/* زر الدخول */
.enter-button {
    margin-top: 30px;
    width: 100%;
    padding: 15px;
    background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.1),
        rgba(255, 255, 255, 0.05)
    );
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 50px;
    color: white;
    font-size: 18px;
    font-weight: 400;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.5s;
    font-family: inherit;
}

/* التوهج المستمر للزر */
.button-glow {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200%;
    height: 200%;
    background: radial-gradient(
        circle,
        rgba(255, 255, 255, 0.1) 0%,
        transparent 70%
    );
    animation: pulse 2s infinite;
    pointer-events: none;
}

@keyframes pulse {
    0%, 100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
    50% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}

.enter-button:hover {
    background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.2),
        rgba(255, 255, 255, 0.1)
    );
    transform: translateY(-2px);
    box-shadow: 
        0 10px 30px rgba(255, 255, 255, 0.2),
        0 5px 15px rgba(0, 0, 0, 0.3);
}

/* أيقونة القلب النابض */
@keyframes heartBeat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.1); }
    50% { transform: scale(1); }
    75% { transform: scale(1.1); }
}

.pulsing-heart {
    animation: heartBeat 2s ease-in-out infinite;
}

/* رسائل الخطأ الروحانية */
.error-message {
    color: rgba(255, 150, 150, 0.9);
    font-size: 14px;
    margin-top: 10px;
    text-align: center;
    opacity: 0;
    transition: opacity 0.3s;
}

.error-message.show {
    opacity: 1;
}

/* خيارات إضافية */
.additional-options {
    margin-top: 30px;
    text-align: center;
}

.forgot-link, .new-soul {
    color: rgba(255, 255, 255, 0.5);
    text-decoration: none;
    font-size: 14px;
    transition: all 0.3s;
    display: inline-block;
    margin: 0 10px;
}

.forgot-link:hover, .new-soul:hover {
    color: rgba(255, 255, 255, 0.8);
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
}
</style>
</head>
<body>
   <div class="portal-container">
    <!-- الخلفية المتحركة -->
    <div class="animated-background">
        <div class="stars-container" id="starsContainer">
            <!-- النجوم ستضاف بالجافاسكريبت -->
        </div>
    </div>
    
    <!-- الطبقة الرئيسية -->
    <div class="main-layer">
        <!-- دائرة التنفس -->
        <div class="breathing-circle">
            <span class="breathing-text">تنفس بعمق</span>
        </div>
        
        <!-- النص الترحيبي -->
        <div class="welcome-text" id="welcomeText">
            <!-- سيظهر حرف حرف -->
        </div>
        
        <!-- منطقة تسجيل الدخول -->
       <div class="login-area" id="loginArea">
    <form id="loginForm" onsubmit="handleLogin(event)">
        <!-- حقل البريد الإلكتروني -->
        <div class="input-group" id="emailGroup">
            <div class="input-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
                </svg>
            </div>
            <input 
                type="email" 
                id="email"
                class="soul-input"
                placeholder="بريدك الإلكتروني"
                required
                onfocus="handleFocus('emailGroup')"
                onblur="handleBlur('emailGroup')"
            />
            <div class="input-glow"></div>
        </div>
        
        <!-- حقل كلمة المرور -->
        <div class="input-group" id="passwordGroup">
            <div class="input-icon pulsing-heart">
                <svg viewBox="0 0 24 24">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
            </div>
            <input 
                type="password"
                id="password" 
                class="soul-input"
                placeholder="كلمة السر"
                required
                onfocus="handleFocus('passwordGroup')"
                onblur="handleBlur('passwordGroup')"
            />
            <div class="input-glow"></div>
        </div>
        
        <!-- رسالة الخطأ -->
        <div class="error-message" id="errorMessage"></div>
        
        <!-- زر الدخول -->
        <button type="submit" class="enter-button">
            <span class="button-text">ادخل لرحلتك</span>
            <div class="button-glow"></div>
        </button>
    </form>
    
    <!-- خيارات إضافية -->
    <div class="additional-options">
        <a href="#" class="forgot-link" onclick="forgotPath(event)">نسيت طريقك؟</a>
        <a href="#" class="new-soul" onclick="newSoul(event)">روح جديدة؟ ابدأ رحلتك</a>
    </div>
</div>
    </div>
</div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
       // إنشاء النجوم
function createStars() {
    const container = document.getElementById('starsContainer');
    const starCount = 150;
    
    for (let i = 0; i < starCount; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        
        // حجم عشوائي
        const size = Math.random() * 3 + 1;
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        
        // موقع عشوائي
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        
        // تأخير عشوائي للومضة
        star.style.animationDelay = Math.random() * 3 + 's';
        star.style.animationDuration = (Math.random() * 3 + 3) + 's';
        
        // شفافية متفاوتة
        star.style.opacity = Math.random() * 0.7 + 0.3;
        
        container.appendChild(star);
    }
}

// النص الترحيبي يظهر حرف حرف
function showWelcomeText() {
    const text = "أهلاً بروحك الباحثة";
    const element = document.getElementById('welcomeText');
    let index = 0;
    
    setTimeout(() => {
        const interval = setInterval(() => {
            if (index < text.length) {
                element.textContent += text[index];
                element.classList.add('show');
                index++;
            } else {
                clearInterval(interval);
                // إظهار منطقة الدخول
                document.getElementById('loginArea').classList.add('show');
            }
        }, 100);
    }, 2000);
}

// تشغيل عند تحميل الصفحة
window.addEventListener('load', () => {
    createStars();
    showWelcomeText();
});

        // التعامل مع التركيز على الحقول
function handleFocus(groupId) {
    document.getElementById(groupId).classList.add('focused');
}

function handleBlur(groupId) {
    document.getElementById(groupId).classList.remove('focused');
}

// معالج تسجيل الدخول المؤقت
function handleLogin(event) {
    event.preventDefault();
    
    const button = event.target.querySelector('.enter-button');
    const originalText = button.innerHTML;
    
    // تأثير التحميل
    button.innerHTML = '<span style="color: white;">جاري الدخول...</span>';
    button.disabled = true;
    
    // محاكاة تسجيل الدخول
    setTimeout(() => {
        // يمكنك وضع كود Firebase هنا لاحقاً
        showError('الطريق مغلق... تأكد من مفتاحك');
        button.innerHTML = originalText;
        button.disabled = false;
    }, 2000);
}

// إظهار رسالة خطأ روحانية
function showError(message) {
    const errorEl = document.getElementById('errorMessage');
    errorEl.textContent = message;
    errorEl.classList.add('show');
    
    setTimeout(() => {
        errorEl.classList.remove('show');
    }, 5000);
}

// نسيت طريقك
function forgotPath(event) {
    event.preventDefault();
    showError('سيصلك دليل الطريق قريباً...');
}

// روح جديدة
function newSoul(event) {
    event.preventDefault();
    showError('رحلة جديدة تبدأ قريباً...');
}

// تأثير الكتابة - نجوم صغيرة عند الكتابة
document.addEventListener('DOMContentLoaded', function() {
    const inputs = document.querySelectorAll('.soul-input');
    
    inputs.forEach(input => {
        input.addEventListener('input', function(e) {
            if (e.target.value.length > 0) {
                e.target.style.textShadow = '0 0 5px rgba(255, 255, 255, 0.3)';
            } else {
                e.target.style.textShadow = 'none';
            }
        });
    });
});
        
    </script>
</body>
</html>
