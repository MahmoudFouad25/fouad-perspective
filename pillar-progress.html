        // Firebase Configuration
const firebaseConfig = {

        // Tab Switching
        function switchTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Remove active from all buttons
            document.querySelectorAll('.tab-button').forEach(btn => {

            });

            // Show selected tab

            };
            
            document.getElementById(tabs[tabName]).classList.add('active');
            event.target.classList.add('active');
        }

        // Initialize on page load
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                // Get courseId from URL or localStorage
                const urlParams = new URLSearchParams(window.location.search);

        // ==================== DATABASE STRUCTURE ====================
/*
users/{userId}/pillarProgress/{courseId}/
  ├── courage/
  │   ├── totalPoints: 0
  │   ├── entries: []
  │   ├── lastEntry: null
  │   
  ├── mirror/
  │   ├── totalPoints: 0
  │   ├── entries: []
  │   ├── lastEntry: null
  │   
  ├── action/
  │   ├── totalPoints: 0
  │   ├── currentStreak: 0
  │   ├── longestStreak: 0
  │   ├── lastActionDate: null
  │   ├── entries: []
  │   
  └── witness/
      ├── totalPoints: 0
      ├── entries: []
      ├── weeklyReports: []
      ├── commitments: []
*/

// ==================== PILLAR PROGRESS FUNCTIONS ====================

async function getPillarProgress(pillarType) {
    try {
        const docRef = db.collection('users')
            .doc(currentUser.uid)
            .collection('pillarProgress')
            .doc(currentCourseId);
        
        const doc = await docRef.get();
        
        if (doc.exists) {
            const data = doc.data();
            return data[pillarType] || createEmptyPillar(pillarType);
        } else {
            return createEmptyPillar(pillarType);
        }
    } catch (error) {
        console.error('خطأ في جلب تقدم الركيزة:', error);
        return createEmptyPillar(pillarType);
    }
}

function createEmptyPillar(pillarType) {
    const base = {
        totalPoints: 0,
        entries: [],
        lastEntry: null
    };
    
    if (pillarType === 'action') {
        base.currentStreak = 0;
        base.longestStreak = 0;
        base.lastActionDate = null;
    } else if (pillarType === 'witness') {
        base.weeklyReports = [];
        base.commitments = [];
    }
    
    return base;
}

async function savePillarEntry(pillarType, entryData) {
    try {
        const docRef = db.collection('users')
            .doc(currentUser.uid)
            .collection('pillarProgress')
            .doc(currentCourseId);
        
        const entry = {
            date: firebase.firestore.FieldValue.serverTimestamp(),
            timestamp: new Date().toISOString(),
            ...entryData
        };
        
        // جلب البيانات الحالية
        const currentData = await getPillarProgress(pillarType);
        
        // إضافة النقاط
        const newTotalPoints = currentData.totalPoints + entryData.points;
        
        // إضافة الإدخال للقائمة
        const updatedEntries = [entry, ...currentData.entries];
        
        // بناء الكائن المُحدّث
        const updateData = {
            [`${pillarType}.totalPoints`]: newTotalPoints,
            [`${pillarType}.entries`]: updatedEntries,
            [`${pillarType}.lastEntry`]: entry
        };
        
        // حساب Streak للخطوة
        if (pillarType === 'action') {
            const streakData = calculateStreak(currentData, entry);
            updateData[`${pillarType}.currentStreak`] = streakData.currentStreak;
            updateData[`${pillarType}.longestStreak`] = streakData.longestStreak;
            updateData[`${pillarType}.lastActionDate`] = entry.timestamp;
        }
        
        // الحفظ في Firebase
        await docRef.set(updateData, { merge: true });
        
        // تحديث نقاط الرحلة الإجمالية
        await updateJourneyPoints(entryData.points, pillarType, entry);
        
        return { success: true, newTotal: newTotalPoints };
    } catch (error) {
        console.error('خطأ في حفظ الإدخال:', error);
        return { success: false, error: error.message };
    }
}

function calculateStreak(currentData, newEntry) {
    const today = new Date(newEntry.timestamp);
    today.setHours(0, 0, 0, 0);
    
    let currentStreak = 1;
    let longestStreak = currentData.longestStreak || 1;
    
    if (currentData.lastActionDate) {
        const lastDate = new Date(currentData.lastActionDate);
        lastDate.setHours(0, 0, 0, 0);
        
        const diffDays = Math.floor((today - lastDate) / (1000 * 60 * 60 * 24));
        
        if (diffDays === 0) {
            // نفس اليوم - نحافظ على السلسلة الحالية
            currentStreak = currentData.currentStreak || 1;
        } else if (diffDays === 1) {
            // اليوم التالي مباشرة - نزيد السلسلة
            currentStreak = (currentData.currentStreak || 0) + 1;
        } else {
            // انقطعت السلسلة - نبدأ من جديد
            currentStreak = 1;
        }
    }
    
    if (currentStreak > longestStreak) {
        longestStreak = currentStreak;
    }
    
    return { currentStreak, longestStreak };
}

async function updateJourneyPoints(points, pillarType, entryDetails) {
    try {
        const userRef = db.collection('users').doc(currentUser.uid);
        
        // جلب النقاط الحالية
        const userDoc = await userRef.get();
        const userData = userDoc.data();
        
        const currentJourneyPoints = userData.journeyPoints?.total || 0;
        const newJourneyPoints = currentJourneyPoints + points;
        
        // تحديث النقاط
        await userRef.update({
            'journeyPoints.total': newJourneyPoints,
            'journeyPoints.lastUpdated': firebase.firestore.FieldValue.serverTimestamp()
        });
        
        // إضافة سجل في التاريخ
        await userRef.collection('journeyPoints').doc('history').set({
            entries: firebase.firestore.FieldValue.arrayUnion({
                date: firebase.firestore.FieldValue.serverTimestamp(),
                amount: points,
                type: `pillar_${pillarType}`,
                courseId: currentCourseId,
                details: entryDetails
            })
        }, { merge: true });
        
    } catch (error) {
        console.error('خطأ في تحديث نقاط الرحلة:', error);
    }
}

}

function renderEntries(entries) {
    if (!entries || entries.length === 0) {
        return `
            <div class="empty-state">
                <i class="fas fa-inbox"></i>
                <p>لم تسجل أي إنجاز بعد</p>
                <p style="font-size: 0.9rem; margin-top: 10px;">ابدأ رحلتك الآن!</p>
            </div>
        `;
    }
    
    return entries.slice(0, 5).map(entry => {
        const date = entry.timestamp ? new Date(entry.timestamp).toLocaleDateString('ar-EG') : 'تاريخ غير محدد';
        return `
            <div class="entry-item">
                <div class="entry-date">${date} - ${entry.points} نقطة</div>
                <div class="entry-note">${entry.note || entry.type || 'إنجاز'}</div>
            </div>
        `;
    }).join('');
}
        
    </script>
