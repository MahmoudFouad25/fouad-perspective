<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ركائز العبور - ملاذ الحيارى</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-blue: #3b82f6;
            --gold-primary: #fbbf24;
            --bg-dark: #0a0e27;
            --bg-card: #1e1b4b;
            --text-light: #e0e7ff;
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1e1b4b 100%);
            color: var(--text-light);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        .page-header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(251, 191, 36, 0.1));
            border-radius: 20px;
            border: 2px solid rgba(251, 191, 36, 0.3);
        }

        .page-header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #3b82f6, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .page-header p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.1rem;
        }

        /* Tabs */
        .tabs-container {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            overflow-x: auto;
            padding: 10px;
            background: rgba(30, 27, 75, 0.5);
            border-radius: 15px;
        }

        .tab-button {
            padding: 15px 25px;
            border: none;
            background: rgba(59, 130, 246, 0.1);
            color: var(--text-light);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
            white-space: nowrap;
            border: 2px solid transparent;
        }

        .tab-button:hover {
            background: rgba(59, 130, 246, 0.2);
            transform: translateY(-2px);
        }

        .tab-button.active {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            border-color: var(--gold-primary);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
        }

        /* Tab Content */
        .tab-content {
            display: none;
            animation: fadeIn 0.3s;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Cards */
        .pillar-card {
            background: linear-gradient(135deg, rgba(30, 27, 75, 0.8), rgba(49, 46, 129, 0.6));
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            border: 2px solid rgba(99, 102, 241, 0.3);
        }

        .pillar-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .pillar-icon {
            font-size: 3rem;
        }

        .pillar-info h2 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .pillar-info p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.95rem;
        }

        /* Progress Section */
        .progress-section {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .progress-bar-container {
            background: rgba(255, 255, 255, 0.1);
            height: 25px;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #fbbf24, #f59e0b);
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            color: white;
            font-weight: bold;
            font-size: 0.85rem;
        }

        /* Action Button */
        .action-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px auto;
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.5);
        }

        /* Entries List */
        .entries-list {
            margin-top: 20px;
        }

        .entry-item {
            background: rgba(59, 130, 246, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            border-left: 4px solid var(--gold-primary);
        }

        .entry-date {
            color: var(--gold-primary);
            font-size: 0.85rem;
            margin-bottom: 5px;
        }

        .entry-note {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.95rem;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            padding: 30px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            border: 2px solid var(--primary-blue);
        }

        .modal-header {
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.9);
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(99, 102, 241, 0.3);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-size: 1rem;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: rgba(59, 130, 246, 0.1);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .radio-option:hover {
            background: rgba(59, 130, 246, 0.2);
        }

        .radio-option input[type="radio"] {
            width: auto;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }

        .btn-secondary {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 2px solid #ef4444;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        /* Streak Display */
        .streak-display {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.2), rgba(245, 158, 11, 0.1));
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin: 20px 0;
            border: 2px solid var(--gold-primary);
        }

        .streak-number {
            font-size: 3rem;
            font-weight: bold;
            color: var(--gold-primary);
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
        }

        .streak-label {
            color: rgba(255, 255, 255, 0.7);
            margin-top: 10px;
        }

        .streak-rewards {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(251, 191, 36, 0.3);
        }

        .reward-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            color: rgba(255, 255, 255, 0.8);
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 40px;
            color: rgba(255, 255, 255, 0.6);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px;
            color: rgba(255, 255, 255, 0.6);
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .page-header h1 {
                font-size: 1.8rem;
            }

            .tabs-container {
                flex-wrap: nowrap;
                overflow-x: auto;
            }

            .modal-content {
                width: 95%;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="page-header">
            <h1>🌟 ركائز العبور</h1>
            <p>وثّق رحلتك بصدق - النقاط هدية لك من الله</p>
        </div>

        <!-- Tabs -->
        <div class="tabs-container">
            <button class="tab-button active" onclick="switchTab('courage')">
                🔥 مفتاح الجرأة
            </button>
            <button class="tab-button" onclick="switchTab('mirror')">
                🪞 مفتاح المرآة
            </button>
            <button class="tab-button" onclick="switchTab('action')">
                🚶 مفتاح الخطوة
            </button>
            <button class="tab-button" onclick="switchTab('witness')">
                👥 مفتاح الشهود
            </button>
        </div>

        <!-- Tab Contents (سنملأها في الخطوات القادمة) -->
        <div id="courageTab" class="tab-content active">
            <div class="loading">جاري التحميل...</div>
        </div>

        <div id="mirrorTab" class="tab-content">
            <div class="loading">جاري التحميل...</div>
        </div>

        <div id="actionTab" class="tab-content">
            <div class="loading">جاري التحميل...</div>
        </div>

        <div id="witnessTab" class="tab-content">
            <div class="loading">جاري التحميل...</div>
        </div>
    </div>

    <!-- Modals (سنضيفها في الخطوات القادمة) -->

    <script>
        // Firebase Configuration (ضع هنا إعدادات Firebase الخاصة بك)
        const firebaseConfig = {
            // سنملأها في الخطوة القادمة
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();

        // Global Variables
        let currentUser = null;
        let currentCourseId = null;

        // Tab Switching
        function switchTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Remove active from all buttons
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });

            // Show selected tab
            const tabs = {
                'courage': 'courageTab',
                'mirror': 'mirrorTab',
                'action': 'actionTab',
                'witness': 'witnessTab'
            };
            
            document.getElementById(tabs[tabName]).classList.add('active');
            event.target.classList.add('active');
        }

        // Initialize on page load
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                // Get courseId from URL or localStorage
                const urlParams = new URLSearchParams(window.location.search);
                currentCourseId = urlParams.get('courseId') || localStorage.getItem('currentCourseId');
                
                if (currentCourseId) {
                    initializePage();
                }
            } else {
                window.location.href = 'login.html';
            }
        });

        function initializePage() {
            console.log('جاري تهيئة الصفحة...');
            // سنملأ هذه الدالة في الخطوات القادمة
        }
    </script>
</body>
</html>
