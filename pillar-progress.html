<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ركائز العبور - ملاذ الحيارى</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-blue: #3b82f6;
            --gold-primary: #fbbf24;
            --bg-dark: #0a0e27;
            --bg-card: #1e1b4b;
            --text-light: #e0e7ff;
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1e1b4b 100%);
            color: var(--text-light);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        .page-header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(251, 191, 36, 0.1));
            border-radius: 20px;
            border: 2px solid rgba(251, 191, 36, 0.3);
        }

        .page-header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #3b82f6, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .page-header p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.1rem;
        }

        /* Tabs */
        .tabs-container {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            overflow-x: auto;
            padding: 10px;
            background: rgba(30, 27, 75, 0.5);
            border-radius: 15px;
        }

        .tab-button {
            padding: 15px 25px;
            border: none;
            background: rgba(59, 130, 246, 0.1);
            color: var(--text-light);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
            white-space: nowrap;
            border: 2px solid transparent;
        }

        .tab-button:hover {
            background: rgba(59, 130, 246, 0.2);
            transform: translateY(-2px);
        }

        .tab-button.active {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            border-color: var(--gold-primary);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
        }

        /* Tab Content */
        .tab-content {
            display: none;
            animation: fadeIn 0.3s;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Cards */
        .pillar-card {
            background: linear-gradient(135deg, rgba(30, 27, 75, 0.8), rgba(49, 46, 129, 0.6));
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            border: 2px solid rgba(99, 102, 241, 0.3);
        }

        .pillar-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .pillar-icon {
            font-size: 3rem;
        }

        .pillar-info h2 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .pillar-info p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.95rem;
        }

        /* Progress Section */
        .progress-section {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .progress-bar-container {
            background: rgba(255, 255, 255, 0.1);
            height: 25px;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #fbbf24, #f59e0b);
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            color: white;
            font-weight: bold;
            font-size: 0.85rem;
        }

        /* Action Button */
        .action-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px auto;
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.5);
        }

        /* Entries List */
        .entries-list {
            margin-top: 20px;
        }

        .entry-item {
            background: rgba(59, 130, 246, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            border-left: 4px solid var(--gold-primary);
        }

        .entry-date {
            color: var(--gold-primary);
            font-size: 0.85rem;
            margin-bottom: 5px;
        }

        .entry-note {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.95rem;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            padding: 30px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            border: 2px solid var(--primary-blue);
        }

        .modal-header {
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.9);
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(99, 102, 241, 0.3);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-size: 1rem;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: rgba(59, 130, 246, 0.1);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .radio-option:hover {
            background: rgba(59, 130, 246, 0.2);
        }

        .radio-option input[type="radio"] {
            width: auto;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }

        .btn-secondary {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 2px solid #ef4444;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        /* Streak Display */
        .streak-display {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.2), rgba(245, 158, 11, 0.1));
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin: 20px 0;
            border: 2px solid var(--gold-primary);
        }

        .streak-number {
            font-size: 3rem;
            font-weight: bold;
            color: var(--gold-primary);
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
        }

        .streak-label {
            color: rgba(255, 255, 255, 0.7);
            margin-top: 10px;
        }

        .streak-rewards {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(251, 191, 36, 0.3);
        }

        .reward-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            color: rgba(255, 255, 255, 0.8);
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 40px;
            color: rgba(255, 255, 255, 0.6);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px;
            color: rgba(255, 255, 255, 0.6);
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .page-header h1 {
                font-size: 1.8rem;
            }

            .tabs-container {
                flex-wrap: nowrap;
                overflow-x: auto;
            }

            .modal-content {
                width: 95%;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="page-header">
            <h1>🌟 ركائز العبور</h1>
            <p>وثّق رحلتك بصدق - النقاط هدية لك من الله</p>
        </div>

        <!-- Tabs -->
        <div class="tabs-container">
            <button class="tab-button active" onclick="switchTab('courage')">
                🔥 مفتاح الجرأة
            </button>
            <button class="tab-button" onclick="switchTab('mirror')">
                🪞 مفتاح المرآة
            </button>
            <button class="tab-button" onclick="switchTab('action')">
                🚶 مفتاح الخطوة
            </button>
            <button class="tab-button" onclick="switchTab('witness')">
                👥 مفتاح الشهود
            </button>
        </div>

        <!-- Tab Contents (سنملأها في الخطوات القادمة) -->
        <div id="courageTab" class="tab-content active">
            <div class="loading">جاري التحميل...</div>
        </div>

        <div id="mirrorTab" class="tab-content">
            <div class="loading">جاري التحميل...</div>
        </div>

        <div id="actionTab" class="tab-content">
            <div class="loading">جاري التحميل...</div>
        </div>

        <div id="witnessTab" class="tab-content">
            <div class="loading">جاري التحميل...</div>
        </div>
    </div>

    <!-- Modal: مفتاح الجرأة -->
<div id="courageModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            🔥 سجّل لحظة جرأة
        </div>
        
        <form id="courageForm" onsubmit="submitCourage(event)">
            <div class="form-group">
                <label>📅 التاريخ</label>
                <input type="date" id="courageDate" required>
            </div>
            
            <div class="form-group">
                <label>⭐ نوع الجرأة</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="courageType" value="voice_participation" data-points="25" required>
                        <span>شاركت صوتياً في جلسة (25 نقطة)</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="courageType" value="new_exercise" data-points="25">
                        <span>جربت تمرين جديد (25 نقطة)</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="courageType" value="personal_reveal" data-points="25">
                        <span>كشفت عن شيء شخصي (25 نقطة)</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="courageType" value="comfort_zone" data-points="25">
                        <span>خرجت من منطقة راحتي (25 نقطة)</span>
                    </label>
                </div>
            </div>
            
            <div class="form-group">
                <label>🎯 ماذا فعلت؟ (اختياري)</label>
                <textarea id="courageNote" placeholder="اكتب بإيجاز..." maxlength="200"></textarea>
                <small style="color: rgba(255, 255, 255, 0.5);">حتى 200 حرف</small>
            </div>
            
            <div class="modal-buttons">
                <button type="button" class="btn btn-secondary" onclick="closeModal('courageModal')">
                    إلغاء
                </button>
                <button type="submit" class="btn btn-primary">
                    سجّل الآن
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Modal: مفتاح المرآة -->
<div id="mirrorModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            🪞 سجّل استقبال فيدباك
        </div>
        
        <form id="mirrorForm" onsubmit="submitMirror(event)">
            <div class="form-group">
                <label>📅 التاريخ</label>
                <input type="date" id="mirrorDate" required>
            </div>
            
            <div class="form-group">
                <label>💬 من أين؟</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="mirrorSource" value="course_peer" required>
                        <span>من زميل في الدورة</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="mirrorSource" value="outside_person">
                        <span>من شخص خارج الدورة</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="mirrorSource" value="coach">
                        <span>من المدرب</span>
                    </label>
                </div>
            </div>
            
            <div class="form-group">
                <label>🎯 ماذا تعلمت؟ (اختياري)</label>
                <textarea id="mirrorLearning" placeholder="اكتب بإيجاز..." maxlength="300"></textarea>
            </div>
            
            <div class="form-group">
                <label>✅ هل طبقت شيء بناءً عليه؟</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="mirrorApplied" value="yes" data-points="30" required>
                        <span>نعم (30 نقطة)</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="mirrorApplied" value="thinking" data-points="20">
                        <span>لا زلت أفكر (20 نقطة)</span>
                    </label>
                </div>
            </div>
            
            <div class="modal-buttons">
                <button type="button" class="btn btn-secondary" onclick="closeModal('mirrorModal')">
                    إلغاء
                </button>
                <button type="submit" class="btn btn-primary">
                    سجّل الآن
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Modal: مفتاح الخطوة -->
<div id="actionModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            🚶 طبّقت اليوم
        </div>
        
        <form id="actionForm" onsubmit="submitAction(event)">
            <div class="form-group">
                <label>📅 التاريخ</label>
                <input type="date" id="actionDate" required>
            </div>
            
            <div class="form-group">
                <label>🎯 ماذا طبقت؟</label>
                <textarea id="actionWhat" placeholder="مثال: تمرين التنفس، واجهت موقف صعب بوعي..." required maxlength="200"></textarea>
            </div>
            
            <div class="form-group">
                <label>💡 كيف كان؟</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="actionDifficulty" value="easy" required>
                        <span>سهل 😊</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="actionDifficulty" value="challenge">
                        <span>تحدي 💪</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="actionDifficulty" value="hard">
                        <span>صعب جداً 🔥</span>
                    </label>
                </div>
            </div>
            
            <div class="modal-buttons">
                <button type="button" class="btn btn-secondary" onclick="closeModal('actionModal')">
                    إلغاء
                </button>
                <button type="submit" class="btn btn-primary">
                    سجّل - 15 نقطة
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Modal: مفتاح الشهود -->
<div id="witnessModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            👥 سجّل تقرير محاسبة
        </div>
        
        <form id="witnessForm" onsubmit="submitWitness(event)">
            <div class="form-group">
                <label>📊 نوع التقرير</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="witnessType" value="commitment" data-points="30" required>
                        <span>تعهد جديد (30 نقطة)</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="witnessType" value="weekly_report" data-points="35">
                        <span>تقرير أسبوعي (35 نقطة)</span>
                    </label>
                </div>
            </div>
            
            <div id="commitmentSection" style="display: none;">
                <div class="form-group">
                    <label>🎯 تعهدي للأسبوع القادم</label>
                    <textarea id="witnessCommitment" placeholder="كن محدداً وواقعياً..." maxlength="500"></textarea>
                </div>
                
                <div class="form-group">
                    <label>✅ هل تريد نشره في المنتدى؟</label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="witnessPublic" value="yes">
                            <span>نعم (علني)</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="witnessPublic" value="no" checked>
                            <span>لا (خاص - بينك وبين الله)</span>
                        </label>
                    </div>
                </div>
            </div>
            
            <div id="reportSection" style="display: none;">
                <div class="form-group">
                    <label>✅ هل التزمت بتعهدك؟</label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="witnessCommitted" value="fully">
                            <span>نعم تماماً</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="witnessCommitted" value="partially">
                            <span>جزئياً</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="witnessCommitted" value="no">
                            <span>لم ألتزم</span>
                        </label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>💡 ماذا تعلمت؟</label>
                    <textarea id="witnessLearned" placeholder="كن صادقاً مع نفسك..." maxlength="300"></textarea>
                </div>
                
                <div class="form-group">
                    <label>🎯 ماذا ستحسّن الأسبوع القادم؟</label>
                    <textarea id="witnessImprove" placeholder="خطوة واحدة واضحة..." maxlength="200"></textarea>
                </div>
            </div>
            
            <div class="modal-buttons">
                <button type="button" class="btn btn-secondary" onclick="closeModal('witnessModal')">
                    إلغاء
                </button>
                <button type="submit" class="btn btn-primary">
                    سجّل الآن
                </button>
            </div>
        </form>
    </div>
</div>

    <script>
        // Firebase Configuration (ضع هنا إعدادات Firebase الخاصة بك)
        // Firebase Configuration
const firebaseConfig = {
    apiKey: "AIzaSyDj0bV5gsyRbqpxzW0Zd9wjYmq53-Xdj3w",
    authDomain: "fouad-perspective.firebaseapp.com",
    projectId: "fouad-perspective",
    storageBucket: "fouad-perspective.firebasestorage.app",
    messagingSenderId: "1068763865336",
    appId: "1:1068763865336:web:b791abcd22d536aedd5b0d",
    measurementId: "G-RY1FYVB3Q9"
};

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();

        // Global Variables
        let currentUser = null;
        let currentCourseId = null;

        // Tab Switching
        function switchTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Remove active from all buttons
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });

            // Show selected tab
            const tabs = {
                'courage': 'courageTab',
                'mirror': 'mirrorTab',
                'action': 'actionTab',
                'witness': 'witnessTab'
            };
            
            document.getElementById(tabs[tabName]).classList.add('active');
            event.target.classList.add('active');
        }

        // Initialize on page load
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                // Get courseId from URL or localStorage
                const urlParams = new URLSearchParams(window.location.search);
                currentCourseId = urlParams.get('courseId') || localStorage.getItem('currentCourseId');
                
                if (currentCourseId) {
                    initializePage();
                }
            } else {
                window.location.href = 'login.html';
            }
        });

        // ==================== DATABASE STRUCTURE ====================
/*
users/{userId}/pillarProgress/{courseId}/
  ├── courage/
  │   ├── totalPoints: 0
  │   ├── entries: []
  │   ├── lastEntry: null
  │   
  ├── mirror/
  │   ├── totalPoints: 0
  │   ├── entries: []
  │   ├── lastEntry: null
  │   
  ├── action/
  │   ├── totalPoints: 0
  │   ├── currentStreak: 0
  │   ├── longestStreak: 0
  │   ├── lastActionDate: null
  │   ├── entries: []
  │   
  └── witness/
      ├── totalPoints: 0
      ├── entries: []
      ├── weeklyReports: []
      ├── commitments: []
*/

// ==================== PILLAR PROGRESS FUNCTIONS ====================

async function getPillarProgress(pillarType) {
    try {
        const docRef = db.collection('users')
            .doc(currentUser.uid)
            .collection('pillarProgress')
            .doc(currentCourseId);
        
        const doc = await docRef.get();
        
        if (doc.exists) {
            const data = doc.data();
            return data[pillarType] || createEmptyPillar(pillarType);
        } else {
            return createEmptyPillar(pillarType);
        }
    } catch (error) {
        console.error('خطأ في جلب تقدم الركيزة:', error);
        return createEmptyPillar(pillarType);
    }
}

function createEmptyPillar(pillarType) {
    const base = {
        totalPoints: 0,
        entries: [],
        lastEntry: null
    };
    
    if (pillarType === 'action') {
        base.currentStreak = 0;
        base.longestStreak = 0;
        base.lastActionDate = null;
    } else if (pillarType === 'witness') {
        base.weeklyReports = [];
        base.commitments = [];
    }
    
    return base;
}

async function savePillarEntry(pillarType, entryData) {
    try {
        const docRef = db.collection('users')
            .doc(currentUser.uid)
            .collection('pillarProgress')
            .doc(currentCourseId);
        
        const entry = {
            date: firebase.firestore.FieldValue.serverTimestamp(),
            timestamp: new Date().toISOString(),
            ...entryData
        };
        
        // جلب البيانات الحالية
        const currentData = await getPillarProgress(pillarType);
        
        // إضافة النقاط
        const newTotalPoints = currentData.totalPoints + entryData.points;
        
        // إضافة الإدخال للقائمة
        const updatedEntries = [entry, ...currentData.entries];
        
        // بناء الكائن المُحدّث
        const updateData = {
            [`${pillarType}.totalPoints`]: newTotalPoints,
            [`${pillarType}.entries`]: updatedEntries,
            [`${pillarType}.lastEntry`]: entry
        };
        
        // حساب Streak للخطوة
        if (pillarType === 'action') {
            const streakData = calculateStreak(currentData, entry);
            updateData[`${pillarType}.currentStreak`] = streakData.currentStreak;
            updateData[`${pillarType}.longestStreak`] = streakData.longestStreak;
            updateData[`${pillarType}.lastActionDate`] = entry.timestamp;
        }
        
        // الحفظ في Firebase
        await docRef.set(updateData, { merge: true });
        
        // تحديث نقاط الرحلة الإجمالية
        await updateJourneyPoints(entryData.points, pillarType, entry);
        
        return { success: true, newTotal: newTotalPoints };
    } catch (error) {
        console.error('خطأ في حفظ الإدخال:', error);
        return { success: false, error: error.message };
    }
}

function calculateStreak(currentData, newEntry) {
    const today = new Date(newEntry.timestamp);
    today.setHours(0, 0, 0, 0);
    
    let currentStreak = 1;
    let longestStreak = currentData.longestStreak || 1;
    
    if (currentData.lastActionDate) {
        const lastDate = new Date(currentData.lastActionDate);
        lastDate.setHours(0, 0, 0, 0);
        
        const diffDays = Math.floor((today - lastDate) / (1000 * 60 * 60 * 24));
        
        if (diffDays === 0) {
            // نفس اليوم - نحافظ على السلسلة الحالية
            currentStreak = currentData.currentStreak || 1;
        } else if (diffDays === 1) {
            // اليوم التالي مباشرة - نزيد السلسلة
            currentStreak = (currentData.currentStreak || 0) + 1;
        } else {
            // انقطعت السلسلة - نبدأ من جديد
            currentStreak = 1;
        }
    }
    
    if (currentStreak > longestStreak) {
        longestStreak = currentStreak;
    }
    
    return { currentStreak, longestStreak };
}

async function updateJourneyPoints(points, pillarType, entryDetails) {
    try {
        const userRef = db.collection('users').doc(currentUser.uid);
        
        // جلب النقاط الحالية
        const userDoc = await userRef.get();
        const userData = userDoc.data();
        
        const currentJourneyPoints = userData.journeyPoints?.total || 0;
        const newJourneyPoints = currentJourneyPoints + points;
        
        // تحديث النقاط
        await userRef.update({
            'journeyPoints.total': newJourneyPoints,
            'journeyPoints.lastUpdated': firebase.firestore.FieldValue.serverTimestamp()
        });
        
        // إضافة سجل في التاريخ
        await userRef.collection('journeyPoints').doc('history').set({
            entries: firebase.firestore.FieldValue.arrayUnion({
                date: firebase.firestore.FieldValue.serverTimestamp(),
                amount: points,
                type: `pillar_${pillarType}`,
                courseId: currentCourseId,
                details: entryDetails
            })
        }, { merge: true });
        
    } catch (error) {
        console.error('خطأ في تحديث نقاط الرحلة:', error);
    }
}

function renderEntries(entries) {

        return `
            <div class="empty-state">
                <i class="fas fa-inbox"></i>
                <p>لم تسجل أي إنجاز بعد</p>
                <p style="font-size: 0.9rem; margin-top: 10px;">ابدأ رحلتك الآن!</p>
            </div>
        `;
    }
    
    return entries.slice(0, 5).map(entry => {
        const date = entry.timestamp ? new Date(entry.timestamp).toLocaleDateString('ar-EG') : 'تاريخ غير محدد';
        return `
            <div class="entry-item">
                <div class="entry-date">${date} - ${entry.points} نقطة</div>
                <div class="entry-note">${entry.note || entry.type || 'إنجاز'}</div>
            </div>
        `;
    }).join('');
}

// ==================== NOTIFICATION SYSTEM ====================

function showNotification(message, type = 'success') {
    const notification = document.createElement('div');
    notification.style.cssText = `
        position: fixed;
        top: 20px;
        right: 20px;
        background: ${type === 'success' ? 'linear-gradient(135deg, #10b981, #059669)' : 'linear-gradient(135deg, #ef4444, #dc2626)'};
        color: white;
        padding: 15px 25px;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        z-index: 10000;
        animation: slideIn 0.3s ease;
    `;
    notification.textContent = message;
    
    document.body.appendChild(notification);
    
    setTimeout(() => {
        notification.style.animation = 'slideOut 0.3s ease';
        setTimeout(() => notification.remove(), 300);
    }, 3000);
}
