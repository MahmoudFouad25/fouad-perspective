<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase User Structure Analyzer</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px solid #667eea;
        }

        .header h1 {
            color: #667eea;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .header p {
            color: #666;
            font-size: 1.1rem;
        }

        .input-section {
            background: #f8f9ff;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            border: 2px solid #e1e8ff;
        }

        .input-group {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .input-group input {
            flex: 1;
            min-width: 300px;
            padding: 12px 18px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 12px 30px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            min-width: 120px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2rem;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            margin-top: 30px;
        }

        .section {
            background: white;
            margin-bottom: 25px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #e1e8ff;
        }

        .section-header {
            background: linear-gradient(90deg, #667eea, #764ba2);
            color: white;
            padding: 15px 20px;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-header:hover {
            background: linear-gradient(90deg, #5a6fd8, #6a42a0);
        }

        .section-content {
            padding: 20px;
            max-height: 500px;
            overflow-y: auto;
        }

        .field-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            margin: 5px 0;
            background: #f8f9ff;
            border-radius: 6px;
            border-left: 4px solid #667eea;
        }

        .field-name {
            font-weight: 600;
            color: #333;
            font-family: 'Courier New', monospace;
        }

        .field-type {
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .field-type.string { background: #28a745; }
        .field-type.number { background: #ffc107; color: #333; }
        .field-type.boolean { background: #17a2b8; }
        .field-type.array { background: #fd7e14; }
        .field-type.object { background: #6f42c1; }
        .field-type.timestamp { background: #e83e8c; }
        .field-type.null { background: #6c757d; }

        .nested-structure {
            margin-left: 20px;
            border-left: 2px solid #e1e8ff;
            padding-left: 15px;
            margin-top: 10px;
        }

        .collection-badge {
            background: #dc3545;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            margin-left: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #e1e8ff;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #dc3545;
            margin: 20px 0;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #28a745;
            margin: 20px 0;
        }

        .raw-data {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
            direction: ltr;
        }

        .toggle-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 1.2rem;
            transition: transform 0.3s ease;
        }

        .collapsed .toggle-btn {
            transform: rotate(-90deg);
        }

        .collapsed .section-content {
            display: none;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            .input-group {
                flex-direction: column;
            }
            
            .input-group input {
                min-width: 100%;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Firebase User Structure Analyzer</h1>
            <p>تحليل شامل لهيكل بيانات المستخدم في Firestore</p>
        </div>

        <div class="input-section">
            <div class="input-group">
                <input type="text" id="userIdInput" placeholder="أدخل User ID للتحليل..." />
                <button class="btn" id="analyzeBtn" onclick="analyzeUser()">
                    تحليل المستخدم
                </button>
            </div>
        </div>

        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            جاري التحليل والبحث في قاعدة البيانات...
        </div>

        <div id="results" class="results" style="display: none;">
            <div class="stats-grid" id="statsGrid"></div>
            
            <div class="section">
                <div class="section-header" onclick="toggleSection(this)">
                    📊 معلومات أساسية عن المستخدم
                    <button class="toggle-btn">▼</button>
                </div>
                <div class="section-content" id="basicInfo"></div>
            </div>

            <div class="section">
                <div class="section-header" onclick="toggleSection(this)">
                    🏗️ هيكل الحقول الرئيسية
                    <button class="toggle-btn">▼</button>
                </div>
                <div class="section-content" id="fieldsStructure"></div>
            </div>

            <div class="section">
                <div class="section-header" onclick="toggleSection(this)">
                    📁 المجموعات الفرعية (Sub-collections)
                    <button class="toggle-btn">▼</button>
                </div>
                <div class="section-content" id="subCollections"></div>
            </div>

            <div class="section">
                <div class="section-header" onclick="toggleSection(this)">
                    🗂️ البيانات الخام (Raw Data)
                    <button class="toggle-btn">▼</button>
                </div>
                <div class="section-content" id="rawData"></div>
            </div>
        </div>

        <div id="error" class="error" style="display: none;"></div>
    </div>

    <script>
        // Initialize Firebase with your config
        const firebaseConfig = {
            apiKey: "AIzaSyDj0bV5gsyRbqpxzW0Zd9wjYmq53-Xdj3w",
            authDomain: "fouad-perspective.firebaseapp.com",
            projectId: "fouad-perspective",
            storageBucket: "fouad-perspective.firebasestorage.app",
            messagingSenderId: "1068763865336",
            appId: "1:1068763865336:web:b791abcd22d536aedd5b0d",
            measurementId: "G-RY1FYVB3Q9"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentAnalysis = null;

        function getDataType(value) {
            if (value === null || value === undefined) return 'null';
            if (value instanceof firebase.firestore.Timestamp) return 'timestamp';
            if (Array.isArray(value)) return 'array';
            if (typeof value === 'object') return 'object';
            return typeof value;
        }

        function analyzeFieldStructure(data, prefix = '') {
            const fields = [];
            
            for (const [key, value] of Object.entries(data)) {
                const fieldName = prefix ? `${prefix}.${key}` : key;
                const fieldType = getDataType(value);
                
                fields.push({
                    name: fieldName,
                    type: fieldType,
                    value: value,
                    isNested: prefix.length > 0
                });

                // If it's an object (but not timestamp or array), analyze nested fields
                if (fieldType === 'object' && !(value instanceof firebase.firestore.Timestamp)) {
                    const nestedFields = analyzeFieldStructure(value, fieldName);
                    fields.push(...nestedFields);
                }
                
                // If it's an array with objects, analyze the first object structure
                if (fieldType === 'array' && value.length > 0 && typeof value[0] === 'object') {
                    const nestedFields = analyzeFieldStructure(value[0], `${fieldName}[0]`);
                    fields.push(...nestedFields);
                }
            }
            
            return fields;
        }

        async function getSubCollections(userId) {
            try {
                // Common sub-collection names to check
                const commonSubCollections = [
                    'financial', 'transactions', 'courses', 'progress', 
                    'certificates', 'activities', 'notifications', 
                    'settings', 'bookmarks', 'favorites', 'sessions',
                    'payments', 'enrollments', 'assignments', 'submissions'
                ];
                
                const subCollections = [];
                
                for (const collectionName of commonSubCollections) {
                    try {
                        const snapshot = await db.collection('badges')
                            .doc(userId)
                            .collection(collectionName)
                            .limit(1)
                            .get();
                        
                        if (!snapshot.empty) {
                            const docCount = await db.collection('badges')
                                .doc(userId)
                                .collection(collectionName)
                                .get();
                            
                            const sampleDoc = snapshot.docs[0];
                            const sampleData = sampleDoc.data();
                            const fields = analyzeFieldStructure(sampleData);
                            
                            subCollections.push({
                                name: collectionName,
                                documentCount: docCount.size,
                                sampleDocId: sampleDoc.id,
                                fields: fields,
                                sampleData: sampleData
                            });
                        }
                    } catch (error) {
                        console.log(`Sub-collection ${collectionName} not accessible or doesn't exist`);
                    }
                }
                
                return subCollections;
            } catch (error) {
                console.error('Error getting sub-collections:', error);
                return [];
            }
        }

        async function analyzeUser() {
            const userId = document.getElementById('userIdInput').value.trim();
            const loadingEl = document.getElementById('loading');
            const resultsEl = document.getElementById('results');
            const errorEl = document.getElementById('error');
            const analyzeBtn = document.getElementById('analyzeBtn');

            if (!userId) {
                showError('يرجى إدخال User ID');
                return;
            }

            // Reset UI
            loadingEl.style.display = 'block';
            resultsEl.style.display = 'none';
            errorEl.style.display = 'none';
            analyzeBtn.disabled = true;

            try {
                // Get user document
                const userDoc = await db.collection('badges').doc(userId).get();
                
                if (!userDoc.exists) {
                    throw new Error('المستخدم غير موجود');
                }

                const userData = userDoc.data();
                const fields = analyzeFieldStructure(userData);
                const subCollections = await getSubCollections(userId);

                currentAnalysis = {
                    userId: userId,
                    userData: userData,
                    fields: fields,
                    subCollections: subCollections
                };

                displayResults(currentAnalysis);
                
            } catch (error) {
                console.error('Error analyzing user:', error);
                showError('خطأ في تحليل المستخدم: ' + error.message);
            } finally {
                loadingEl.style.display = 'none';
                analyzeBtn.disabled = false;
            }
        }

        function displayResults(analysis) {
            const resultsEl = document.getElementById('results');
            
            // Display stats
            displayStats(analysis);
            
            // Display basic info
            displayBasicInfo(analysis);
            
            // Display fields structure
            displayFieldsStructure(analysis);
            
            // Display sub-collections
            displaySubCollections(analysis);
            
            // Display raw data
            displayRawData(analysis);
            
            resultsEl.style.display = 'block';
        }

        function displayStats(analysis) {
            const statsGrid = document.getElementById('statsGrid');
            const totalFields = analysis.fields.length;
            const rootFields = analysis.fields.filter(f => !f.isNested).length;
            const nestedFields = analysis.fields.filter(f => f.isNested).length;
            const subCollectionsCount = analysis.subCollections.length;
            
            // Count data types
            const typeCount = {};
            analysis.fields.forEach(field => {
                typeCount[field.type] = (typeCount[field.type] || 0) + 1;
            });

            statsGrid.innerHTML = `
                <div class="stat-card">
                    <div class="stat-number">${totalFields}</div>
                    <div class="stat-label">إجمالي الحقول</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${rootFields}</div>
                    <div class="stat-label">حقول رئيسية</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${nestedFields}</div>
                    <div class="stat-label">حقول متداخلة</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${subCollectionsCount}</div>
                    <div class="stat-label">مجموعات فرعية</div>
                </div>
            `;
        }

        function displayBasicInfo(analysis) {
            const basicInfo = document.getElementById('basicInfo');
            const userData = analysis.userData;
            
            let html = `
                <div class="field-item">
                    <span class="field-name">User ID</span>
                    <span class="field-type string">${analysis.userId}</span>
                </div>
            `;
            
            // Show key user info fields if they exist
            const keyFields = ['name', 'email', 'phone', 'createdAt', 'updatedAt', 'status', 'role'];
            keyFields.forEach(key => {
                if (userData[key] !== undefined) {
                    let displayValue = userData[key];
                    if (userData[key] instanceof firebase.firestore.Timestamp) {
                        displayValue = userData[key].toDate().toLocaleString('ar-EG');
                    }
                    
                    html += `
                        <div class="field-item">
                            <span class="field-name">${key}</span>
                            <span class="field-type ${getDataType(userData[key])}">${displayValue}</span>
                        </div>
                    `;
                }
            });
            
            basicInfo.innerHTML = html;
        }

        function displayFieldsStructure(analysis) {
            const fieldsStructure = document.getElementById('fieldsStructure');
            let html = '';
            
            // Group fields by nesting level
            const rootFields = analysis.fields.filter(f => !f.isNested);
            const nestedFields = analysis.fields.filter(f => f.isNested);
            
            // Display root fields
            html += '<h4 style="color: #667eea; margin-bottom: 15px;">الحقول الرئيسية:</h4>';
            rootFields.forEach(field => {
                html += `
                    <div class="field-item">
                        <span class="field-name">${field.name}</span>
                        <span class="field-type ${field.type}">${field.type.toUpperCase()}</span>
                    </div>
                `;
            });
            
            // Display nested fields
            if (nestedFields.length > 0) {
                html += '<h4 style="color: #667eea; margin: 25px 0 15px;">الحقول المتداخلة:</h4>';
                nestedFields.forEach(field => {
                    const nestingLevel = field.name.split('.').length - 1;
                    const marginLeft = nestingLevel * 20;
                    
                    html += `
                        <div class="field-item" style="margin-left: ${marginLeft}px;">
                            <span class="field-name">${field.name}</span>
                            <span class="field-type ${field.type}">${field.type.toUpperCase()}</span>
                        </div>
                    `;
                });
            }
            
            fieldsStructure.innerHTML = html;
        }

        function displaySubCollections(analysis) {
            const subCollections = document.getElementById('subCollections');
            
            if (analysis.subCollections.length === 0) {
                subCollections.innerHTML = '<p style="color: #666; text-align: center; padding: 20px;">لا توجد مجموعات فرعية</p>';
                return;
            }
            
            let html = '';
            analysis.subCollections.forEach(collection => {
                html += `
                    <div style="margin-bottom: 30px; padding: 20px; background: #f8f9ff; border-radius: 8px;">
                        <h4 style="color: #667eea; margin-bottom: 15px;">
                            📁 ${collection.name}
                            <span class="collection-badge">${collection.documentCount} مستند</span>
                        </h4>
                        
                        <div style="margin-bottom: 15px;">
                            <strong>نموذج مستند:</strong> ${collection.sampleDocId}
                        </div>
                        
                        <div class="nested-structure">
                            ${collection.fields.map(field => `
                                <div class="field-item" style="margin: 5px 0;">
                                    <span class="field-name">${field.name}</span>
                                    <span class="field-type ${field.type}">${field.type.toUpperCase()}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });
            
            subCollections.innerHTML = html;
        }

        function displayRawData(analysis) {
            const rawData = document.getElementById('rawData');
            
            const fullData = {
                userId: analysis.userId,
                userData: analysis.userData,
                subCollections: analysis.subCollections.map(sc => ({
                    name: sc.name,
                    documentCount: sc.documentCount,
                    sampleData: sc.sampleData
                }))
            };
            
            rawData.innerHTML = `<div class="raw-data">${JSON.stringify(fullData, null, 2)}</div>`;
        }

        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.innerHTML = message;
            errorEl.style.display = 'block';
        }

        function toggleSection(header) {
            const section = header.parentElement;
            section.classList.toggle('collapsed');
        }

        // Allow Enter key to trigger analysis
        document.getElementById('userIdInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                analyzeUser();
            }
        });

        // Auto-focus on input
        window.addEventListener('load', function() {
            document.getElementById('userIdInput').focus();
        });

        console.log('🚀 Firebase User Analyzer Ready!');
        console.log('✅ Connected to:', firebaseConfig.projectId);
    </script>
</body>
</html>
