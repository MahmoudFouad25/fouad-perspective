    <script>
        let currentChatId = null;
        let chatsData = {};
        let messagesListener = null;
        
        // تحميل قائمة المحادثات
       // استبدل دالة loadChats بالكامل بهذا الكود الصحيح:

async function loadChats() {
    try {
        const snapshot = await db.collection('telegramChats')
            .orderBy('lastActivity', 'desc')
            .limit(50)
            .get();
        
        const chatsList = document.getElementById('chatsList');
        chatsList.innerHTML = '';
        
        let totalChats = 0;
        let activeToday = 0;
        const today = new Date().setHours(0, 0, 0, 0);
        
        snapshot.forEach(doc => {
            const data = doc.data();
            const chatId = doc.id;
            chatsData[chatId] = data;
            
            totalChats++;
            
            // حساب النشط اليوم
            if (data.lastActivity && data.lastActivity.toDate() > today) {
                activeToday++;
            }
            
            // إنشاء عنصر المحادثة
            const chatItem = document.createElement('div');
            chatItem.className = 'chat-item';
            chatItem.onclick = () => loadChat(chatId);
            
            const name = data.userInfo?.firstName || 'مستخدم';
            const initial = name.charAt(0).toUpperCase();
            const lastMessage = data.lastMessage || 'لا توجد رسائل';
            const time = data.lastActivity ? formatTime(data.lastActivity.toDate()) : '';
            
            chatItem.innerHTML = `
                <div class="avatar">${initial}</div>
                <div class="info">
                    <div class="name">${name}</div>
                    <div class="last-message">${lastMessage}</div>
                </div>
                <div>
                    <div class="time">${time}</div>
                </div>
            `;
            
            chatsList.appendChild(chatItem);
        });
        
        // تحديث الإحصائيات
        document.getElementById('totalChats').textContent = totalChats;
        document.getElementById('activeToday').textContent = activeToday;
        
        // حساب الحجوزات
        await updateBookingStats();
        
    } catch (error) {
        console.error('خطأ في تحميل المحادثات:', error);
        document.getElementById('chatsList').innerHTML = '<div class="empty-state">خطأ في التحميل</div>';
    }
}

// استبدل دالة loadChat بالكامل بهذا الكود:
async function loadChat(chatId) {
    currentChatId = chatId;
    
    // تحديث العرض
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('chatContent').style.display = 'flex';
    document.getElementById('chatContent').style.flexDirection = 'column';
    
    // تحديث النشط
    document.querySelectorAll('.chat-item').forEach(item => {
        item.classList.remove('active');
    });
    event.currentTarget.classList.add('active');
    
    // عرض معلومات المحادثة
    const chatData = chatsData[chatId];
    document.getElementById('chatName').textContent = chatData.userInfo?.firstName || 'مستخدم';
    document.getElementById('chatInfo').textContent = `Chat ID: ${chatId}`;
    
    // تفعيل إمكانية الرد
    document.getElementById('messageInput').disabled = false;
    document.querySelector('.input-area button').disabled = false;
    
    // إلغاء المستمع السابق
    if (messagesListener) {
        messagesListener();
    }
    
    // الاستماع للرسائل
    const messagesContainer = document.getElementById('messagesContainer');
    messagesContainer.innerHTML = '<div class="loading">جاري تحميل المحادثة...</div>';
    
    messagesListener = db.collection('telegramChats')
        .doc(chatId)
        .collection('messages')
        .orderBy('timestamp', 'asc')
        .onSnapshot(snapshot => {
            messagesContainer.innerHTML = '';
            
            snapshot.forEach(doc => {
                const msg = doc.data();
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${msg.type}`;
                
                let messageContent = msg.message;
                
                // معالجة الصور المرفقة
                if (msg.hasAttachment && msg.attachmentType === 'photo') {
                    if (msg.photoUrl) {
                        // عرض الصورة إذا كان لدينا رابط
                        messageContent = `
                            <div style="margin-bottom: 10px;">
                                <img src="${msg.photoUrl}" style="max-width: 300px; border-radius: 10px; cursor: pointer;" 
                                     onclick="window.open('${msg.photoUrl}', '_blank')" 
                                     alt="صورة مرفقة">
                            </div>
                            ${msg.caption ? `<div style="margin-top: 10px;">${msg.caption}</div>` : ''}
                            <div style="background: #FEF3C7; color: #92400E; padding: 8px 12px; border-radius: 8px; margin-top: 8px; font-size: 13px;">
                                <i class="fas fa-image"></i> إيصال دفع - اضغط للتكبير
                            </div>
                        `;
                    } else {
                        // عرض رسالة أن هناك صورة بدون رابط
                        messageContent += `<div class="attachment">
                            <i class="fas fa-image"></i> صورة مرفقة (غير متاحة للعرض المباشر)
                            <br><small>File ID: ${msg.fileId}</small>
                        </div>`;
                    }
                } else if (msg.hasAttachment && msg.attachmentType === 'document') {
                    messageContent += `<div class="attachment">
                        <i class="fas fa-file"></i> ${msg.fileName || 'مستند مرفق'}
                        ${msg.fileSize ? `<br><small>الحجم: ${(msg.fileSize/1024).toFixed(2)} KB</small>` : ''}
                    </div>`;
                } else if (msg.isCallback) {
                    // عرض خاص للأزرار المضغوطة
                    messageContent = `<div style="background: #E0F2FE; padding: 8px; border-radius: 8px; font-size: 13px;">
                        <i class="fas fa-mouse-pointer"></i> ضغط على زر: ${msg.callbackData}
                    </div>`;
                } else if (msg.type === 'admin') {
                    // تمييز رسائل الأدمن
                    messageContent = `<div style="background: #F0FDF4; padding: 5px 8px; border-radius: 5px; margin-bottom: 5px; font-size: 11px; color: #065F46;">
                        <i class="fas fa-user-shield"></i> رسالة من الأدمن
                    </div>${messageContent}`;
                }
                
                messageDiv.innerHTML = `
                    <div class="bubble">
                        ${messageContent}
                        <div class="time">${msg.timestamp ? formatTime(msg.timestamp.toDate()) : ''}</div>
                    </div>
                `;
                
                messagesContainer.appendChild(messageDiv);
            });
            
            // التمرير للأسفل
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        });
}

// إضافة دالة إرسال رسالة من الأدمن
async function sendAdminMessage() {
    const messageInput = document.getElementById('messageInput');
    const message = messageInput.value.trim();
    
    if (!message || !currentChatId) {
        console.log('❌ لا يوجد رسالة أو محادثة محددة');
        return;
    }
    
    console.log('📤 إرسال رسالة للمحادثة:', currentChatId);
    console.log('📝 الرسالة:', message);
    
    try {
        // حفظ الرسالة في Firebase أولاً
        await db.collection('telegramChats')
            .doc(currentChatId)
            .collection('messages')
            .add({
                chatId: currentChatId,
                type: 'bot',
                message: `📢 *رسالة من الإدارة:*\n\n${message}`,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                sentBy: 'admin_panel',
                adminName: 'مدير النظام'
            });
        
        console.log('✅ تم حفظ الرسالة في Firebase');
        
        // إرسال الرسالة عبر API البوت
        const response = await fetch('http://localhost:3000/send-message-to-chat', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                chatId: currentChatId,
                message: `📢 *رسالة من الإدارة:*\n\n${message}`
            })
        });
        
        const result = await response.json();
        
        if (response.ok && result.success) {
            // مسح حقل الإدخال
            messageInput.value = '';
            console.log('✅ تم إرسال الرسالة عبر التليجرام');
            
            // عرض رسالة نجاح صغيرة
            const inputArea = document.querySelector('.input-area');
            const successMsg = document.createElement('div');
            successMsg.style.cssText = 'position: absolute; top: -30px; left: 50%; transform: translateX(-50%); background: #22C55E; color: white; padding: 5px 10px; border-radius: 5px; font-size: 12px;';
            successMsg.textContent = 'تم الإرسال ✓';
            inputArea.style.position = 'relative';
            inputArea.appendChild(successMsg);
            
            setTimeout(() => successMsg.remove(), 2000);
        } else {
            console.error('❌ فشل إرسال الرسالة:', result.error);
            alert('خطأ في إرسال الرسالة: ' + (result.error || 'غير معروف'));
        }
        
    } catch (error) {
        console.error('❌ خطأ في الاتصال:', error);
        
        // محاولة الإرسال عبر Firebase فقط
        try {
            await db.collection('telegramChats')
                .doc(currentChatId)
                .collection('messages')
                .add({
                    chatId: currentChatId,
                    type: 'bot',
                    message: `📢 *رسالة من الإدارة (offline):*\n\n${message}`,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    sentBy: 'admin_panel',
                    offlineMessage: true
                });
            
            messageInput.value = '';
            alert('تم حفظ الرسالة (البوت غير متصل حالياً)');
        } catch (fbError) {
            console.error('❌ فشل حتى الحفظ في Firebase:', fbError);
            alert('خطأ كامل في إرسال الرسالة');
        }
    }
}
// السماح بالإرسال بضغط Enter
document.addEventListener('DOMContentLoaded', function() {
    const messageInput = document.getElementById('messageInput');
    if (messageInput) {
        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendAdminMessage();
            }
        });
    }
});

                                        <div style="background: #10B981; color: white; padding: 8px 12px; border-radius: 8px; margin-top: 8px; font-size: 13px;">
                                            <i class="fas fa-check-circle"></i> إيصال محفوظ بشكل دائم في Firebase Storage
                                            <br><small>اضغط على الصورة للتكبير</small>
                                        </div>
                                    `;
                                } else {
                                    messageContent += `<div class="attachment">
                                        <i class="fas fa-image"></i> صورة مرفقة (غير متاحة)
                                    </div>`;
                                }
                            } else if (attachmentType === 'document') {
                                // عرض المستندات
                                const fileName = msg.fileName || 'مستند';
                                const fileSize = msg.fileSize ? `(${(msg.fileSize/1024).toFixed(2)} KB)` : '';
                                
                                let icon = '📎';
                                let bgColor = '#3B82F6';
                                
                                if (msg.mimeType) {
                                    if (msg.mimeType.includes('pdf')) {
                                        icon = '📄';
                                        bgColor = '#DC2626';
                                    } else if (msg.mimeType.includes('word')) {
                                        icon = '📝';
                                        bgColor = '#2563EB';
                                    } else if (msg.mimeType.includes('excel')) {
                                        icon = '📊';
                                        bgColor = '#059669';
                                    }
                                }
                                
                                if (permanentUrl) {
                                    messageContent += `
                                        <div style="background: linear-gradient(135deg, ${bgColor}, ${bgColor}dd); 
                                                    padding: 15px; border-radius: 10px; margin: 10px 0;">
                                            <div style="color: white; font-weight: bold; margin-bottom: 10px;">
                                                ${icon} ${fileName} ${fileSize}
                                            </div>
                                            <a href="${permanentUrl}" target="_blank" 
                                               style="display: inline-block; background: white; color: ${bgColor}; 
                                                      padding: 8px 16px; border-radius: 5px; text-decoration: none; 
                                                      font-weight: bold; margin-top: 5px;">
                                                <i class="fas fa-download"></i> تحميل الملف
                                            </a>
                                        </div>
                                        <div style="background: #F0FDF4; color: #065F46; padding: 8px; border-radius: 5px; font-size: 12px;">
                                            <i class="fas fa-cloud-upload-alt"></i> محفوظ في Firebase Storage
                                        </div>
                                    `;
                                } else {
                                    messageContent += `<div class="attachment">
                                        <i class="fas fa-file"></i> ${fileName} (غير متاح للتحميل)
                                    </div>`;
                                }
                            } else if (attachmentType === 'video') {
                                // عرض الفيديو
                                if (permanentUrl) {
                                    messageContent += `
                                        <div style="background: #7C3AED; padding: 15px; border-radius: 10px; margin: 10px 0;">
                                            <div style="color: white;">
                                                🎥 فيديو ${msg.duration ? `(${msg.duration} ثانية)` : ''}
                                            </div>
                                            <video controls style="max-width: 300px; border-radius: 8px; margin-top: 10px;">
                                                <source src="${permanentUrl}" type="video/mp4">
                                                المتصفح لا يدعم تشغيل الفيديو
                                            </video>
                                        </div>
                                    `;
                                } else {
                                    messageContent += `<div class="attachment">
                                        <i class="fas fa-video"></i> فيديو مرفق (غير متاح)
                                    </div>`;
                                }
                            } else if (attachmentType === 'audio') {
                                // عرض الصوت
                                if (permanentUrl) {
                                    messageContent += `
                                        <div style="background: #F59E0B; padding: 15px; border-radius: 10px; margin: 10px 0;">
                                            <div style="color: white;">
                                                🎵 رسالة صوتية ${msg.duration ? `(${msg.duration} ثانية)` : ''}
                                            </div>
                                            <audio controls style="width: 100%; margin-top: 10px;">
                                                <source src="${permanentUrl}" type="audio/ogg">
                                                المتصفح لا يدعم تشغيل الصوت
                                            </audio>
                                        </div>
                                    `;
                                } else {
                                    messageContent += `<div class="attachment">
                                        <i class="fas fa-microphone"></i> رسالة صوتية (غير متاحة)
                                    </div>`;
                                }
                            } else {
                                // أنواع أخرى من المرفقات
                                messageContent += `<div class="attachment">
                                    <i class="fas fa-paperclip"></i> ${attachmentType || 'ملف مرفق'}
                                </div>`;
                            }
                            
                            // إضافة معلومات إضافية
                            if (msg.fileSize) {
                                messageContent += `
                                    <div style="font-size: 11px; color: #6B7280; margin-top: 5px;">
                                        الحجم: ${(msg.fileSize / 1024).toFixed(2)} KB
                                    </div>
                                `;
                            }
                        }
                        
                        messageDiv.innerHTML = `
                            <div class="bubble">
                                ${messageContent}
                                <div class="time">${msg.timestamp ? formatTime(msg.timestamp.toDate()) : ''}</div>
                            </div>
                        `;
                        
                        messagesContainer.appendChild(messageDiv);
                    });
                    
                    // التمرير للأسفل
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                });
        }
        
        // تحديث إحصائيات الحجوزات
        async function updateBookingStats() {
            try {
                const pendingSnapshot = await db.collection('tempBookings')
                    .where('status', '==', 'pending')
                    .get();
                
                const confirmedSnapshot = await db.collection('tempBookings')
                    .where('status', '==', 'confirmed')
                    .get();
                
                document.getElementById('pendingBookings').textContent = pendingSnapshot.size;
                document.getElementById('confirmedBookings').textContent = confirmedSnapshot.size;
                
            } catch (error) {
                console.error('خطأ في تحديث الإحصائيات:', error);
            }
        }
        
        // تنسيق الوقت
        function formatTime(date) {
            const now = new Date();
            const diff = now - date;
            
            if (diff < 60000) return 'الآن';
            if (diff < 3600000) return `منذ ${Math.floor(diff/60000)} د`;
            if (diff < 86400000) return `منذ ${Math.floor(diff/3600000)} س`;
            
            return date.toLocaleDateString('ar-EG', { 
                month: 'short', 
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }
        
        // تحديث المحادثة
        function refreshChat() {
            if (currentChatId) {
                loadChat(currentChatId);
            }
        }
        
        // البحث
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const search = e.target.value.toLowerCase();
            document.querySelectorAll('.chat-item').forEach(item => {
                const text = item.textContent.toLowerCase();
                item.style.display = text.includes(search) ? 'flex' : 'none';
            });
        });
        
        // تحميل البيانات عند فتح الصفحة
        window.onload = () => {
            loadChats();
            // تحديث كل 30 ثانية
            setInterval(loadChats, 30000);
        };
    </script>
</body>
