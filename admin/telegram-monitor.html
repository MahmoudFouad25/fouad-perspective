<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متابعة محادثات التليجرام - أكاديمية فؤاد</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .header h1 {
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-card .number {
            font-size: 2em;
            font-weight: bold;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
            height: 70vh;
        }
        
        .chats-list {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .chats-header {
            background: linear-gradient(135deg, #0EA5E9, #0369A1);
            color: white;
            padding: 15px;
            font-weight: bold;
        }
        
        .search-box {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .search-box input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .chats-container {
            height: calc(100% - 110px);
            overflow-y: auto;
        }
        
        .chat-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chat-item .real-name-badge {
    display: inline-block;
    background: linear-gradient(135deg, #10B981, #059669);
    color: white;
    padding: 2px 6px;
    border-radius: 8px;
    font-size: 9px;
    margin-right: 5px;
}

.chat-item .telegram-name {
    font-size: 11px;
    color: #9CA3AF;
    display: flex;
    align-items: center;
    gap: 3px;
    margin-top: 2px;
}

.chat-item .course-name {
    font-size: 11px;
    color: #059669;
    display: flex;
    align-items: center;
    gap: 3px;
    margin-top: 2px;
}
        
        .chat-item:hover {
            background: #f5f5f5;
        }
        
        .chat-item.active {
            background: #E0F2FE;
            border-right: 3px solid #0EA5E9;
        }
        
        .chat-item .avatar {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            flex-shrink: 0;
        }
        
        .chat-item .info {
            flex: 1;
            min-width: 0;
        }
        
        .chat-item .name {
            font-weight: bold;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .chat-item .last-message {
            color: #666;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .chat-item .time {
            color: #999;
            font-size: 11px;
        }
        
        .chat-item .badge {
            background: #22C55E;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
        }
        
        .chat-window {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }
        
        .chat-header {
            background: linear-gradient(135deg, #0EA5E9, #0369A1);
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }
        
        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        
        .message.user {
            flex-direction: row-reverse;
        }
        
        .message .bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .message.bot .bubble {
            background: white;
            color: #333;
            border-bottom-left-radius: 5px;
        }
        
        .message.user .bubble {
            background: linear-gradient(135deg, #0EA5E9, #0369A1);
            color: white;
            border-bottom-right-radius: 5px;
        }
        
        .message .time {
            font-size: 11px;
            color: #999;
            margin-top: 5px;
        }
        
        .message.user .time {
            text-align: left;
        }
        
        .message .attachment {
            background: #FEF3C7;
            color: #92400E;
            padding: 8px 12px;
            border-radius: 8px;
            margin-top: 8px;
            font-size: 13px;
        }
        
        .input-area {
            padding: 15px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }
        
        .input-area input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
        }
        
        .input-area button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #0EA5E9, #0369A1);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .empty-state {
            text-align: center;
            padding: 50px;
            color: #999;
        }
        
        .empty-state i {
            font-size: 4em;
            color: #ddd;
            margin-bottom: 20px;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #0EA5E9;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        /* أنماط خاصة بالمنح */
        .grant-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: bold;
            margin-top: 4px;
            text-align: center;
            min-width: 80px;
        }

        .grant-pending {
            background: linear-gradient(135deg, #F59E0B, #DC2626);
            color: white;
            animation: pulse-grant 2s ease-in-out infinite;
        }

        .grant-negotiation {
            background: linear-gradient(135deg, #8B5CF6, #6366F1);
            color: white;
            animation: pulse-grant 2s ease-in-out infinite;
        }

        .grant-approved {
            background: linear-gradient(135deg, #10B981, #059669);
            color: white;
        }

        .grant-rejected {
            background: linear-gradient(135deg, #6B7280, #374151);
            color: white;
        }

        @keyframes pulse-grant {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
        }

        .grant-type-icon {
            display: inline-block;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            text-align: center;
            line-height: 20px;
            font-size: 12px;
            margin-left: 5px;
            font-weight: bold;
        }

        .grant-full { background: #FFD700; color: #000; }
        .grant-partial { background: #C0C0C0; color: #000; }
        .grant-installment { background: #CD7F32; color: #FFF; }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse-sync {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.syncing #syncIcon {
    animation: pulse-sync 1s linear infinite;
}

.stat-card {
    transition: all 0.3s ease;
}

        @keyframes glow-red {
            from { 
                box-shadow: 0 0 5px rgba(239, 68, 68, 0.4);
            }
            to { 
                box-shadow: 0 0 20px rgba(239, 68, 68, 0.8), 0 0 30px rgba(239, 68, 68, 0.5);
            }
        }

        .chat-item.urgent-help:hover {
            transform: translateX(-3px);
            transition: transform 0.2s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>
                <i class="fab fa-telegram"></i>
                متابعة محادثات التليجرام
            </h1>
            <div class="stats" id="stats">
                <div class="stat-card">
                    <div class="number" id="totalChats">0</div>
                    <div>إجمالي المحادثات</div>
                </div>
                <div class="stat-card" style="background: linear-gradient(135deg, #3B82F6, #2563EB); cursor: pointer; position: relative; overflow: hidden;" 
     onclick="syncAllNames()" 
     onmouseenter="this.style.transform='scale(1.05)'" 
     onmouseleave="this.style.transform='scale(1)'">
    <div class="number">
        <i class="fas fa-sync" id="syncIcon"></i>
    </div>
    <div>مزامنة الأسماء</div>
    <div style="position: absolute; top: 5px; right: 5px; background: rgba(255,255,255,0.3); padding: 2px 6px; border-radius: 10px; font-size: 10px;">
        Ctrl+Shift+S
    </div>
</div>
                
                <div class="stat-card">
                    <div class="number" id="activeToday">0</div>
                    <div>نشط اليوم</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="pendingBookings">0</div>
                    <div>طلبات مساعدة</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="confirmedBookings">0</div>
                    <div>حجوزات مؤكدة</div>
                </div>
            </div>
        </div>
        
        <!-- Main Content -->
        <div class="main-content">
            <!-- قائمة المحادثات -->
            <div class="chats-list">
                <div class="chats-header">
                    <i class="fas fa-comments"></i> المحادثات
                </div>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="بحث بالاسم أو الرقم...">
                </div>
                <div class="chats-container" id="chatsList">
                    <div class="loading">
                        <div class="spinner"></div>
                        جاري التحميل...
                    </div>
                </div>
            </div>
            
            <!-- نافذة المحادثة -->
            <div class="chat-window">
                <div id="emptyState" class="empty-state">
                    <i class="fas fa-comments"></i>
                    <h3>اختر محادثة للعرض</h3>
                    <p>اضغط على أي محادثة من القائمة لعرض التفاصيل</p>
                </div>
                
                <div id="chatContent" style="display: none; height: 100%;">
                    <div class="chat-header">
                        <div>
                            <div id="chatName" style="font-weight: bold;"></div>
                            <div id="chatInfo" style="font-size: 12px; opacity: 0.9;"></div>
                        </div>
                        <div>
                            <button onclick="refreshChat()" style="background: rgba(255,255,255,0.2); border: none; color: white; padding: 5px 10px; border-radius: 5px; cursor: pointer;">
                                <i class="fas fa-sync"></i> تحديث
                            </button>
                        </div>
                    </div>
                    <div class="messages-container" id="messagesContainer">
                        <!-- الرسائل ستظهر هنا -->
                    </div>
                    <div class="input-area">
                        <input type="file" id="fileInput" style="display: none;" accept="image/*,audio/*,.pdf,.doc,.docx">
                        <button onclick="document.getElementById('fileInput').click()" style="background: #6366F1; margin-left: 5px; padding: 10px;">
                            <i class="fas fa-paperclip"></i>
                        </button>
                        <input type="text" id="messageInput" placeholder="اكتب رسالة للعميل...">
                        <button onclick="sendAdminMessage()">
                            <i class="fas fa-paper-plane"></i> إرسال
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDj0bV5gsyRbqpxzW0Zd9wjYmq53-Xdj3w",
            authDomain: "fouad-perspective.firebaseapp.com",
            projectId: "fouad-perspective",
            storageBucket: "fouad-perspective.firebasestorage.app",
            messagingSenderId: "1068763865336",
            appId: "1:1068763865336:web:b791abcd22d536aedd5b0d",
            measurementId: "G-RY1FYVB3Q9"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentChatId = null;
        let chatsData = {};
        let messagesListener = null;

        // خريطة لحفظ أسماء العملاء الحقيقية من الحجوزات
let realNamesMap = new Map();

// دالة جلب الأسماء الحقيقية من الحجوزات
async function fetchRealNames() {
    try {
        console.log('🔄 جلب الأسماء الحقيقية من الحجوزات...');
        
        const bookingsSnapshot = await db.collection('tempBookings').get();
        
        bookingsSnapshot.forEach(doc => {
            const booking = doc.data();
            
            let realName = '';
            let courseName = '';
            let telegramChatId = '';
            let bookingType = '';
            
            // التعامل مع البيانات المتداخلة
            if (booking.userData) {
                realName = booking.userData.customer?.name || '';
                courseName = booking.userData.courseName || '';
                telegramChatId = String(booking.userData.telegramChatId || '');
                bookingType = booking.userData.bookingType || 'individual';
            } else {
                realName = booking.customer?.name || booking.applicantName || '';
                courseName = booking.courseName || '';
                telegramChatId = String(booking.telegramChatId || '');
                bookingType = booking.bookingType || 'individual';
            }
            
            if (telegramChatId && realName) {
                realNamesMap.set(telegramChatId, {
                    realName: realName,
                    courseName: courseName,
                    bookingType: bookingType,
                    bookingId: doc.id
                });
                console.log(`✅ ربط Chat ${telegramChatId} بـ: ${realName}`);
            }
        });
        
        console.log(`✅ تم جلب ${realNamesMap.size} اسم حقيقي`);
        
    } catch (error) {
        console.error('❌ خطأ في جلب الأسماء:', error);
    }
}
        
        // تحميل قائمة المحادثات
        async function loadChats() {
            try {
                console.log('🔄 جاري تحميل المحادثات...');
                
                const snapshot = await db.collection('telegramChats')
                    .orderBy('lastActivity', 'desc')
                    .limit(100)
                    .get();
                
                const chatsList = document.getElementById('chatsList');
                chatsList.innerHTML = '';
                
                let totalChats = 0;
                let activeToday = 0;
                let helpRequests = 0;
                const today = new Date().setHours(0, 0, 0, 0);
                
                const registeredStudentsMap = new Map();
                
                try {
                    const studentsSnapshot = await db.collection('individualStudents')
                        .where('telegramChatId', '!=', null)
                        .get();
                    
                    studentsSnapshot.forEach(doc => {
                        const student = doc.data();
                        if (student.telegramChatId) {
                            registeredStudentsMap.set(student.telegramChatId.toString(), {
                                id: doc.id,
                                ...student
                            });
                        }
                    });
                    
                    console.log(`📋 تم جلب ${registeredStudentsMap.size} طالب مسجل`);
                } catch (error) {
                    console.error('خطأ في جلب الطلاب المسجلين:', error);
                }
                
                console.log(`📊 عدد المحادثات: ${snapshot.size}`);

                // جلب بيانات الحجوزات المؤقتة للتحقق من المنح
                const bookingsSnapshot = await db.collection('tempBookings')
                    .where('telegramChatId', '!=', null)
                    .get();
                
                const bookingsMap = new Map();
                bookingsSnapshot.forEach(doc => {
                    const booking = doc.data();
                    if (booking.telegramChatId) {
                        bookingsMap.set(booking.telegramChatId.toString(), {
                            id: doc.id,
                            ...booking
                        });
                    }
                });
                
                snapshot.forEach(doc => {
    const data = doc.data();
    const chatId = doc.id;
    
    // تعريف المتغيرات في البداية
    const bookingInfo = realNamesMap.get(chatId);
    
    // التحقق من البيانات من tempBookings
    const bookingData = bookingsMap.get(chatId);
    if (bookingData) {
        // دمج بيانات الحجز مع بيانات المحادثة
        Object.assign(data, bookingData);
    }
    
    const studentData = registeredStudentsMap.get(chatId);
    const isRegisteredStudent = !!studentData;
    
    const combinedData = {
        ...data,
        isRegisteredStudent,
        ...(studentData && {
            studentId: studentData.id,
            studentName: studentData.customer?.name || studentData.userEmail,
            studentEmail: studentData.userEmail || studentData.customer?.email,
            courseName: studentData.courseName,
            accountCreated: studentData.accountCreated || false,
            paymentConfirmed: studentData.paymentConfirmed || false,
            needsHelp: studentData.needsHelp || false
        })
    };
    
    chatsData[chatId] = combinedData;
    totalChats++;
    
    if (combinedData.hasHelpRequest === true || combinedData.needsHelp === true) {
        helpRequests++;
    }
    
    if (data.lastActivity && data.lastActivity.toDate() > today) {
        activeToday++;
    }
    
    const chatItem = document.createElement('div');
    chatItem.className = 'chat-item';
    chatItem.onclick = () => loadChat(chatId);
    
    // تعريف المتغيرات
    let displayName = '';
    let userType = '';
    let statusBadge = '';
    let avatarColor = '';
    let grantBadgeHTML = '';
    let grantTypeIcon = '';
    
    // معالجة طلبات المنح
    if (combinedData.bookingType === 'grant_request') {
        const grantStatus = combinedData.grantStatus || 'pending';
        const grantType = combinedData.grantDetails?.supportType || '';
        
        // تحديد أيقونة نوع المنحة
        if (grantType === 'full') {
            grantTypeIcon = '<span class="grant-type-icon grant-full" title="منحة كاملة">★</span>';
        } else if (grantType === 'partial') {
            grantTypeIcon = '<span class="grant-type-icon grant-partial" title="منحة جزئية">◆</span>';
        } else if (grantType === 'installment') {
            grantTypeIcon = '<span class="grant-type-icon grant-installment" title="تقسيط ميسر">◈</span>';
        }
        
        // تحديد حالة المنحة وشارتها
        if (grantStatus === 'pending') {
            grantBadgeHTML = `<div class="grant-badge grant-pending">🎯 منحة - قيد المراجعة${grantTypeIcon}</div>`;
            avatarColor = '#F59E0B';
        } else if (grantStatus === 'negotiation' || combinedData.negotiationStatus === 'pending_response') {
            grantBadgeHTML = `<div class="grant-badge grant-negotiation">💬 منحة - تفاوض${grantTypeIcon}</div>`;
            avatarColor = '#8B5CF6';
        } else if (grantStatus === 'approved') {
            const convertedText = combinedData.convertedToIndividual ? ' (تحولت)' : '';
            grantBadgeHTML = `<div class="grant-badge grant-approved">✅ منحة معتمدة${convertedText}${grantTypeIcon}</div>`;
            avatarColor = '#10B981';
        } else if (grantStatus === 'rejected') {
            grantBadgeHTML = `<div class="grant-badge grant-rejected">❌ منحة مرفوضة${grantTypeIcon}</div>`;
            avatarColor = '#6B7280';
        } else if (grantStatus === 'needs_info') {
            grantBadgeHTML = `<div class="grant-badge grant-negotiation">🔍 منحة - طلب معلومات${grantTypeIcon}</div>`;
            avatarColor = '#6366F1';
        }
    }

    if (isRegisteredStudent) {
        displayName = combinedData.studentName || 'طالب مسجل';
        userType = `طالب: ${combinedData.courseName || 'غير محدد'}`;
        
        if (!grantBadgeHTML) { // إذا لم يكن منحة
            if (combinedData.hasHelpRequest || combinedData.needsHelp) {
                let helpTypeDisplay = '';
                let helpColor = '#EF4444';
                
                if (combinedData.helpCategory === 'مشكلة تسجيل دخول' || combinedData.helpCategory === 'مساعدة دخول (صاحب حساب)') {
                    helpTypeDisplay = '🔑 دخول';
                    helpColor = '#DC2626';
                } else if (combinedData.helpCategory === 'استفسار حجز' || combinedData.helpCategory === 'مساعدة حجز (قبل الدفع)') {
                    helpTypeDisplay = '📋 حجز';
                    helpColor = '#EA580C';
                } else if (combinedData.helpCategory === 'مشكلة دفع' || combinedData.helpCategory === 'مساعدة دفع (بعد اختيار الطريقة)') {
                    helpTypeDisplay = '💳 دفع';
                    helpColor = '#F59E0B';
                } else if (combinedData.helpCategory === 'استفسار عام') {
                    helpTypeDisplay = '💬 استفسار';
                    helpColor = '#6366F1';
                } else {
                    helpTypeDisplay = '❓ عام';
                    helpColor = '#EF4444';
                }
                
                statusBadge = `<div style="background: ${helpColor}; color: white; padding: 2px 6px; border-radius: 12px; font-size: 10px; font-weight: bold; margin-top: 3px;">🆘 ${helpTypeDisplay}</div>`;
                avatarColor = helpColor;

    document.querySelectorAll('.chat-item').forEach(item => {
        item.classList.remove('active');
    });

        event.currentTarget.classList.add('active');
    }
    
    const chatData = chatsData[chatId];

            grantStatusColor = '#F59E0B';

            grantStatusText = '💬 في التفاوض';
            grantStatusColor = '#8B5CF6';

            grantStatusText = '✅ معتمدة';
            grantStatusColor = '#10B981';

            grantStatusText = '❌ مرفوضة';

            grantStatusColor = '#6366F1';

        if (grantStatus === 'approved' && chatData.convertedToIndividual) {

                const messageDiv = document.createElement('div');

                            <div style="font-weight: bold; color: #374151; margin-bottom: 8px;">

                            </div>

                                     onclick="window.open('${msg.permanentUrl}', '_blank')"

                                    <source src="${msg.permanentUrl}" type="video/mp4">

                                    <source src="${msg.permanentUrl}" type="audio/ogg">

                            ` : `
                                <a href="${msg.permanentUrl}" target="_blank" 
                                   style="display: inline-block; background: #4F46E5; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; margin: 10px 0;">
                                    <i class="fas fa-download"></i> فتح الملف
                                </a>
                            `}
                            
                            ${msg.caption ? `<div style="margin-top: 8px; color: #4B5563;">${msg.caption}</div>` : ''}
                            
                            ${msg.isHelpModeFile ? 
                                '<div style="background: #FEF2F2; color: #991B1B; padding: 6px 10px; border-radius: 6px; margin-top: 8px; font-size: 12px;"><i class="fas fa-info-circle"></i> مرفق أثناء طلب المساعدة</div>' : 
                                '<div style="background: #D1FAE5; color: #065F46; padding: 6px 10px; border-radius: 6px; margin-top: 8px; font-size: 12px;"><i class="fas fa-check-circle"></i> تم الحفظ</div>'
                            }
                        </div>
                    `;
                } else if (msg.message) {
                    messageContent = msg.message;
                }
                
                if (msg.isAlert && msg.alertType === 'help_request') {
                    let alertColor = '#EF4444';
                    let alertIcon = '❓';
                    
                    if (msg.helpCategory === 'مشكلة تسجيل دخول') {
                        alertColor = '#DC2626';
                        alertIcon = '🔑';
                    } else if (msg.helpCategory === 'استفسار حجز') {
                        alertColor = '#EA580C';
                        alertIcon = '📋';
                    }
                    
                    messageDiv.className += ' alert-message';
                    messageDiv.style.cssText = `background: #FEF2F2; border: 2px solid ${alertColor}; border-radius: 10px; margin: 10px 0;`;
                    messageContent = `${alertIcon} ${messageContent}`;
                }
                
                messageDiv.innerHTML = `
                    <div class="bubble">
                        ${messageContent}
                        <div class="time">${msg.timestamp ? formatTime(msg.timestamp.toDate()) : ''}</div>
                    </div>
                `;
                
                messagesContainer.appendChild(messageDiv);
            });
            
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        });
}

      // دالة محسنة لحل طلب المساعدة
async function resolveHelpRequest(chatId) {
    try {
        const chatData = chatsData[chatId];
        const studentName = chatData?.studentName || chatData?.userInfo?.firstName || 'المستخدم';
        
        const { value: responseOption } = await Swal.fire({
            title: 'تأكيد حل المشكلة',
            text: `هل تم حل مشكلة ${studentName} فعلاً؟`,
            icon: 'question',
            input: 'select',
            inputLabel: 'اختر نوع الرد للعميل:',
            inputOptions: {
                'default_success': '✅ رد تلقائي: تم حل المشكلة بنجاح',
                'default_login': '🔑 رد تلقائي: تم إرسال بيانات الدخول',
                'default_account': '🎓 رد تلقائي: تم إنشاء الحساب',
                'default_course': '📚 رد تلقائي: تم تخصيص الدورة',
                'default_payment': '💳 رد تلقائي: تم حل مشكلة الدفع (مع زر الاستكمال)',
                'custom': '✏️ كتابة رسالة مخصصة'
            },
            inputValue: 'default_success',
            showCancelButton: true,
            confirmButtonText: 'إرسال وإنهاء',
            cancelButtonText: 'إلغاء',
            confirmButtonColor: '#22C55E',
            inputValidator: (value) => {
                if (!value) {
                    return 'يجب اختيار نوع الرد';
                }
            }
        });
        
        if (!responseOption) return;
        
        let messageToSend = '';
        
        if (responseOption === 'custom') {
            const { value: customMessage } = await Swal.fire({
                title: 'اكتب الرسالة المخصصة',
                input: 'textarea',
                inputLabel: `رسالة لـ ${studentName}:`,
                inputPlaceholder: 'اكتب رسالتك هنا...',
                showCancelButton: true,
                confirmButtonText: 'إرسال',
                cancelButtonText: 'رجوع',
                inputValidator: (value) => {
                    if (!value || value.trim().length < 5) {
                        return 'الرسالة قصيرة جداً';
                    }
                }
            });
            
            if (!customMessage) return;
            messageToSend = customMessage.trim();
        } else {
            const predefinedMessages = {
                'default_success': '✅ تم حل مشكلتك بنجاح!\n\nشكراً لصبرك، ونتمنى لك تجربة ممتازة.',
                'default_login': '🔑 تم إرسال بيانات الدخول الخاصة بك.\n\nيمكنك الآن الدخول للمنصة والبدء في رحلتك التعليمية.',
                'default_account': '🎓 تم إنشاء حسابك بنجاح وإرسال البيانات.\n\nمرحباً بك في منظور الفؤاد!',
                'default_course': '📚 تم تخصيص الدورة لحسابك بنجاح.\n\nيمكنك الآن الوصول لجميع محتويات الدورة.',
                'default_payment': '💳 تم حل مشكلة الدفع!\n\nيمكنك الآن استكمال عملية الدفع.\n\nاضغط الزر أدناه لاستكمال إجراءات الحجز.'
            };
            messageToSend = predefinedMessages[responseOption];
        }

        // 🔧 تحديث tempBookings إذا كان هناك bookingId
        if (chatData?.bookingId) {
            console.log(`🔄 تحديث الحجز: ${chatData.bookingId}`);
            try {
                await db.collection('tempBookings').doc(chatData.bookingId).update({
                    'automationWorkflow.helpModeActivated': false,
                    'automationWorkflow.currentState': 'awaiting_receipt',
                    'automationWorkflow.helpResolvedAt': new Date(),
                    'automationWorkflow.helpResolvedBy': 'admin',
                    'automationWorkflow.adminResponse': messageToSend
                });
                console.log('✅ تم تحديث حالة الحجز بنجاح');
            } catch (bookingError) {
                console.error('❌ خطأ في تحديث الحجز:', bookingError);
                // نكمل باقي العملية حتى لو فشل تحديث الحجز
            }
        }
        
        // 🔧 تحديث telegramChats
        console.log(`🔄 تحديث المحادثة: ${chatId}`);
        await db.collection('telegramChats').doc(chatId).update({
            hasHelpRequest: false,
            helpResolvedAt: new Date(),
            helpResolvedBy: 'admin',
            adminResponse: messageToSend,
            lastActivity: new Date() // إضافة آخر نشاط
        });
        console.log('✅ تم تحديث حالة المحادثة');
        
        // 🔧 تحديث individualStudents إن وُجد
        if (chatData?.isRegisteredStudent) {
            console.log('🔄 البحث عن الطالب المسجل...');
            try {
                const studentSnapshot = await db.collection('individualStudents')
                    .where('telegramChatId', '==', chatId)
                    .limit(1)
                    .get();
                
                if (!studentSnapshot.empty) {
                    await studentSnapshot.docs[0].ref.update({
                        needsHelp: false,
                        helpResolvedAt: new Date().toISOString(),
                        'automationWorkflow.helpModeActivated': false,
                        'automationWorkflow.currentState': 'resolved',
                        'automationWorkflow.helpResolvedBy': 'admin'
                    });
                    console.log('✅ تم تحديث بيانات الطالب');
                } else {
                    console.log('⚠️ لم يتم العثور على الطالب المسجل');
                }
            } catch (studentError) {
                console.error('❌ خطأ في تحديث بيانات الطالب:', studentError);
            }
        }

        // 🔧 إرسال الرسالة للتليجرام (مُصحح)
        console.log('📤 إرسال الرسالة للعميل...');
        const messageSent = await sendTelegramMessage(chatId, messageToSend);
        
        if (!messageSent) {
            // إظهار تحذير للأدمن أن الرسالة لم تُرسل
            await Swal.fire({
                icon: 'warning',
                title: 'تحذير',
                text: 'تم حفظ حل المشكلة لكن الرسالة لم تُرسل للعميل',
                footer: 'تأكد من إرسال الرد يدوياً',
                confirmButtonColor: '#F59E0B'
            });
        }

        // 🔧 إضافة زر الدفع للحالات المناسبة
        if ((chatData?.helpCategory === 'استفسار حجز' || chatData?.helpCategory === 'مشكلة دفع') && 
            responseOption === 'default_payment') {
            setTimeout(async () => {
                try {
                    await sendPaymentButton(chatId, chatData.bookingId);
                    console.log('✅ تم إرسال زر الدفع');
                } catch (error) {
                    console.error('❌ خطأ في إرسال زر الدفع:', error);
                }
            }, 1000);
        }
        
        // 🔄 تحديث واجهة المدير
        await loadChats();
        await loadChat(chatId);
        
        // ✅ رسالة نجاح
        Swal.fire({
            icon: 'success',
            title: 'تم الحل بنجاح',
            text: messageSent ? 
                'تم إرسال الرد وإغلاق طلب المساعدة' : 
                'تم حل المشكلة (الرسالة لم تُرسل)',
            timer: 2000,
            showConfirmButton: false
        });
        
    } catch (error) {
        console.error('❌ خطأ في حل المشكلة:', error);
        Swal.fire({
            icon: 'error',
            title: 'خطأ',
            text: `حدث خطأ أثناء حل المشكلة: ${error.message}`
        });
    }
}

// 🔧 دالة محسنة للتواصل مع البوت
async function sendTelegramMessage(chatId, message) {
    try {
        console.log(`📤 إرسال رسالة للشات: ${chatId}`);
        
        const response = await fetch('https://us-central1-fouad-perspective.cloudfunctions.net/telegramBot/send-message-to-chat', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            body: JSON.stringify({
                chatId: String(chatId), // تأكد من أنه string
                message: message // ✅ مُصحح: كان messageToSend
            })
        });
        
        if (!response.ok) {
            const errorText = await response.text();
            console.error('❌ خطأ في الإرسال:', {
                status: response.status,
                statusText: response.statusText,
                error: errorText
            });
            return false;
        }
        
        const responseData = await response.json();
        console.log('✅ تم إرسال الرسالة بنجاح:', responseData);
        return true;
        
    } catch (error) {
        console.error('❌ فشل الاتصال بالبوت:', error);
        
        // إظهار رسالة خطأ للمستخدم
        Swal.fire({
            icon: 'warning',
            title: 'تنبيه',
            text: 'لا يمكن الاتصال بخدمة التليجرام حالياً',
            footer: 'يمكنك المتابعة يدوياً',
            confirmButtonColor: '#F59E0B'
        });
        
        return false;
    }
}

}

// 🔧 دالة مساعدة للحصول على معلومات الشات
async function getChatInfo(chatId) {
    try {
        const chatDoc = await db.collection('telegramChats').doc(chatId).get();
        if (chatDoc.exists) {
            return chatDoc.data();
        }
        return null;
    } catch (error) {
        console.error('❌ خطأ في جلب معلومات الشات:', error);
        return null;
    }
}
        let isSending = false;

        async function sendAdminMessage() {
            if (isSending) {
                console.log('⏳ انتظر، جاري الإرسال...');
                return;
            }
            
            const messageInput = document.getElementById('messageInput');
            const message = messageInput.value.trim();
            
            if (!message || !currentChatId) {
                console.log('❌ لا يوجد رسالة أو محادثة محددة');
                return;
            }
            
            isSending = true;
            
            console.log('📤 إرسال رسالة للمحادثة:', currentChatId);
            console.log('📝 الرسالة:', message);
            
            try {
                const response = await fetch('https://us-central1-fouad-perspective.cloudfunctions.net/telegramBot/send-message-to-chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        chatId: currentChatId,
                        message: `📢 *رسالة من الإدارة:*\n\n${message}`
                    })
                });
                
                const result = await response.json();
                
                if (response.ok && result.success) {
                    messageInput.value = '';
                    console.log('✅ تم إرسال الرسالة عبر التليجرام');
                    
                    const inputArea = document.querySelector('.input-area');
                    const successMsg = document.createElement('div');
                    successMsg.style.cssText = 'position: absolute; top: -30px; left: 50%; transform: translateX(-50%); background: #22C55E; color: white; padding: 5px 10px; border-radius: 5px; font-size: 12px;';
                    successMsg.textContent = 'تم الإرسال ✔';
                    inputArea.style.position = 'relative';
                    inputArea.appendChild(successMsg);
                    
                    setTimeout(() => successMsg.remove(), 2000);
                } else {
                    console.error('❌ فشل إرسال الرسالة:', result.error);
                    alert('خطأ في إرسال الرسالة: ' + (result.error || 'غير معروف'));
                }
                
            } catch (error) {
                console.error('❌ خطأ في الاتصال:', error);
                alert('خطأ في الاتصال مع البوت');
            } finally {
                setTimeout(() => {
                    isSending = false;
                }, 1000);
            }
        }

        async function checkBotStatus() {
            try {
                const response = await fetch('https://us-central1-fouad-perspective.cloudfunctions.net/telegramBot/bot-status');
                if (response.ok) {
                    console.log('✅ البوت متصل');
                    return true;
                }
            } catch (error) {
                console.log('⚠️ البوت غير متصل');
            }
            return false;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const botOnline = await checkBotStatus();
            
            const messageInput = document.getElementById('messageInput');
            const sendButton = document.querySelector('.input-area button');
            
            if (!botOnline) {
                if (messageInput) {
                    messageInput.placeholder = 'البوت غير متصل - الرسائل ستُحفظ فقط...';
                }
                if (sendButton) {
                    sendButton.style.background = 'linear-gradient(135deg, #FFA500, #FF6347)';
                }
            }
            
            if (messageInput) {
                messageInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        sendAdminMessage();
                    }
                });
            }
        });

        async function updateBookingStats() {
            try {
                const pendingSnapshot = await db.collection('tempBookings')
                    .where('status', '==', 'pending')
                    .get();
                
                const confirmedSnapshot = await db.collection('tempBookings')
                    .where('status', '==', 'confirmed')
                    .get();
                
                document.getElementById('pendingBookings').textContent = pendingSnapshot.size;
                document.getElementById('confirmedBookings').textContent = confirmedSnapshot.size;
                
            } catch (error) {
                console.error('خطأ في تحديث الإحصائيات:', error);
            }
        }

        function formatTime(date) {
            const now = new Date();
            const diff = now - date;
            
            if (diff < 60000) return 'الآن';
            if (diff < 3600000) return `منذ ${Math.floor(diff/60000)} د`;
            if (diff < 86400000) return `منذ ${Math.floor(diff/3600000)} س`;
            
            return date.toLocaleDateString('ar-EG', { 
                month: 'short', 
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // دالة مزامنة شاملة للأسماء
async function syncAllNames() {
    try {
        Swal.fire({
            title: 'جاري المزامنة',
            text: 'يتم تحديث جميع الأسماء...',
            icon: 'info',
            allowOutsideClick: false,
            showConfirmButton: false,
            willOpen: () => {
                Swal.showLoading();
            }
        });
        
        // إعادة جلب الأسماء
        await fetchRealNames();
        
        // تحديث المحادثات في Firebase
        let updateCount = 0;
        for (const [chatId, info] of realNamesMap.entries()) {
            try {
                await db.collection('telegramChats').doc(chatId).update({
                    'customer.name': info.realName,
                    'courseName': info.courseName,
                    'hasBooking': true,
                    'bookingId': info.bookingId
                });
                updateCount++;
            } catch (error) {
                console.error(`خطأ في تحديث ${chatId}:`, error);
            }
        }
        
        // إعادة تحميل المحادثات
        await loadChats();
        
        Swal.fire({
            icon: 'success',
            title: 'تمت المزامنة',
            text: `تم تحديث ${updateCount} محادثة بنجاح`,
            timer: 2000,
            showConfirmButton: false
        });
        
    } catch (error) {
        console.error('خطأ في المزامنة:', error);
        Swal.fire('خطأ', 'فشلت عملية المزامنة', 'error');
    }
}

// اختصار لوحة المفاتيح للمزامنة السريعة (Ctrl+Shift+S)
document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.shiftKey && e.key === 'S') {
        e.preventDefault();
        syncAllNames();
    }
});
