<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متابعة محادثات التليجرام - أكاديمية فؤاد</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .header h1 {
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-card .number {
            font-size: 2em;
            font-weight: bold;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
            height: 70vh;
        }
        
        .chats-list {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .chats-header {
            background: linear-gradient(135deg, #0EA5E9, #0369A1);
            color: white;
            padding: 15px;
            font-weight: bold;
        }
        
        .search-box {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .search-box input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .chats-container {
            height: calc(100% - 110px);
            overflow-y: auto;
        }
        
        .chat-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .chat-item:hover {
            background: #f5f5f5;
        }
        
        .chat-item.active {
            background: #E0F2FE;
            border-right: 3px solid #0EA5E9;
        }
        
        .chat-item .avatar {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            flex-shrink: 0;
        }
        
        .chat-item .info {
            flex: 1;
            min-width: 0;
        }
        
        .chat-item .name {
            font-weight: bold;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .chat-item .last-message {
            color: #666;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .chat-item .time {
            color: #999;
            font-size: 11px;
        }
        
        .chat-item .badge {
            background: #22C55E;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
        }
        
        .chat-window {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }
        
        .chat-header {
            background: linear-gradient(135deg, #0EA5E9, #0369A1);
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }
        
        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        
        .message.user {
            flex-direction: row-reverse;
        }
        
        .message .bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .message.bot .bubble {
            background: white;
            color: #333;
            border-bottom-left-radius: 5px;
        }
        
        .message.user .bubble {
            background: linear-gradient(135deg, #0EA5E9, #0369A1);
            color: white;
            border-bottom-right-radius: 5px;
        }
        
        .message .time {
            font-size: 11px;
            color: #999;
            margin-top: 5px;
        }
        
        .message.user .time {
            text-align: left;
        }
        
        .message .attachment {
            background: #FEF3C7;
            color: #92400E;
            padding: 8px 12px;
            border-radius: 8px;
            margin-top: 8px;
            font-size: 13px;
        }
        
        .input-area {
            padding: 15px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }
        
        .input-area input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
        }
        
        .input-area button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #0EA5E9, #0369A1);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .empty-state {
            text-align: center;
            padding: 50px;
            color: #999;
        }
        
        .empty-state i {
            font-size: 4em;
            color: #ddd;
            margin-bottom: 20px;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #0EA5E9;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>
                <i class="fab fa-telegram"></i>
                متابعة محادثات التليجرام
            </h1>
            <div class="stats" id="stats">
                <div class="stat-card">
                    <div class="number" id="totalChats">0</div>
                    <div>إجمالي المحادثات</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="activeToday">0</div>
                    <div>نشط اليوم</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="pendingBookings">0</div>
                    <div>حجوزات معلقة</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="confirmedBookings">0</div>
                    <div>حجوزات مؤكدة</div>
                </div>
            </div>
        </div>
        
        <!-- Main Content -->
        <div class="main-content">
            <!-- قائمة المحادثات -->
            <div class="chats-list">
                <div class="chats-header">
                    <i class="fas fa-comments"></i> المحادثات
                </div>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="بحث بالاسم أو الرقم...">
                </div>
                <div class="chats-container" id="chatsList">
                    <div class="loading">
                        <div class="spinner"></div>
                        جاري التحميل...
                    </div>
                </div>
            </div>
            
            <!-- نافذة المحادثة -->
            <div class="chat-window">
                <div id="emptyState" class="empty-state">
                    <i class="fas fa-comments"></i>
                    <h3>اختر محادثة للعرض</h3>
                    <p>اضغط على أي محادثة من القائمة لعرض التفاصيل</p>
                </div>
                
                <div id="chatContent" style="display: none; height: 100%;">
                    <div class="chat-header">
                        <div>
                            <div id="chatName" style="font-weight: bold;"></div>
                            <div id="chatInfo" style="font-size: 12px; opacity: 0.9;"></div>
                        </div>
                        <div>
                            <button onclick="refreshChat()" style="background: rgba(255,255,255,0.2); border: none; color: white; padding: 5px 10px; border-radius: 5px; cursor: pointer;">
                                <i class="fas fa-sync"></i> تحديث
                            </button>
                        </div>
                    </div>
                    <div class="messages-container" id="messagesContainer">
                        <!-- الرسائل ستظهر هنا -->
                    </div>
                    <div class="input-area">
                        <input type="text" id="messageInput" placeholder="اكتب رسالة للعميل..." disabled>
                        <button onclick="sendAdminMessage()" disabled>
                            <i class="fas fa-paper-plane"></i> إرسال
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Firebase Config -->
    <script src="js/firebase-config.js"></script>
    
    <script>
        let currentChatId = null;
        let chatsData = {};
        let messagesListener = null;
        
        // تحميل قائمة المحادثات
        async function loadChats() {
            try {
                const snapshot = await db.collection('telegramChats')
                    .orderBy('lastActivity', 'desc')
                    .limit(50)
                    .get();
                
                const chatsList = document.getElementById('chatsList');
                chatsList.innerHTML = '';
                
                let totalChats = 0;
                let activeToday = 0;
                const today = new Date().setHours(0, 0, 0, 0);
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const chatId = doc.id;
                    chatsData[chatId] = data;
                    
                    totalChats++;
                    
                    // حساب النشط اليوم
                    if (data.lastActivity && data.lastActivity.toDate() > today) {
                        activeToday++;
                    }
                    
                    // إنشاء عنصر المحادثة
                    const chatItem = document.createElement('div');
                    chatItem.className = 'chat-item';
                    chatItem.onclick = () => loadChat(chatId);
                    
                    const name = data.userInfo?.firstName || 'مستخدم';
                    const initial = name.charAt(0).toUpperCase();
                    const lastMessage = data.lastMessage || 'لا توجد رسائل';
                    const time = data.lastActivity ? formatTime(data.lastActivity.toDate()) : '';
                    
                    chatItem.innerHTML = `
                        <div class="avatar">${initial}</div>
                        <div class="info">
                            <div class="name">${name}</div>
                            <div class="last-message">${lastMessage}</div>
                        </div>
                        <div>
                            <div class="time">${time}</div>
                        </div>
                    `;
                    
                    chatsList.appendChild(chatItem);
                });
                
                // تحديث الإحصائيات
                document.getElementById('totalChats').textContent = totalChats;
                document.getElementById('activeToday').textContent = activeToday;
                
                // حساب الحجوزات
                await updateBookingStats();
                
            } catch (error) {
                console.error('خطأ في تحميل المحادثات:', error);
                document.getElementById('chatsList').innerHTML = '<div class="empty-state">خطأ في التحميل</div>';
            }
        }
        
        // تحميل محادثة معينة
        async function loadChat(chatId) {
            currentChatId = chatId;
            
            // تحديث العرض
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('chatContent').style.display = 'flex';
            document.getElementById('chatContent').style.flexDirection = 'column';
            
            // تحديث النشط
            document.querySelectorAll('.chat-item').forEach(item => {
                item.classList.remove('active');
            });
            event.currentTarget.classList.add('active');
            
            // عرض معلومات المحادثة
            const chatData = chatsData[chatId];
            document.getElementById('chatName').textContent = chatData.userInfo?.firstName || 'مستخدم';
            document.getElementById('chatInfo').textContent = `Chat ID: ${chatId}`;
            
            // إلغاء المستمع السابق
            if (messagesListener) {
                messagesListener();
            }
            
            // الاستماع للرسائل
            const messagesContainer = document.getElementById('messagesContainer');
            messagesContainer.innerHTML = '<div class="loading">جاري تحميل المحادثة...</div>';
            
            messagesListener = db.collection('telegramChats')
                .doc(chatId)
                .collection('messages')
                .orderBy('timestamp', 'asc')
                .onSnapshot(snapshot => {
                    messagesContainer.innerHTML = '';
                    
                    snapshot.forEach(doc => {
                        const msg = doc.data();
                        const messageDiv = document.createElement('div');
                        messageDiv.className = `message ${msg.type}`;
                        
                        let messageContent = msg.message;
                        
                        // معالجة المرفقات
                        if (msg.hasAttachment) {
                            messageContent += `<div class="attachment">
                                <i class="fas fa-paperclip"></i> ${msg.attachmentType === 'photo' ? 'صورة مرفقة' : 'ملف مرفق'}
                            </div>`;
                        }
                        
                        messageDiv.innerHTML = `
                            <div class="bubble">
                                ${messageContent}
                                <div class="time">${msg.timestamp ? formatTime(msg.timestamp.toDate()) : ''}</div>
                            </div>
                        `;
                        
                        messagesContainer.appendChild(messageDiv);
                    });
                    
                    // التمرير للأسفل
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                });
        }
        
        // تحديث إحصائيات الحجوزات
        async function updateBookingStats() {
            try {
                const pendingSnapshot = await db.collection('tempBookings')
                    .where('status', '==', 'pending')
                    .get();
                
                const confirmedSnapshot = await db.collection('tempBookings')
                    .where('status', '==', 'confirmed')
                    .get();
                
                document.getElementById('pendingBookings').textContent = pendingSnapshot.size;
                document.getElementById('confirmedBookings').textContent = confirmedSnapshot.size;
                
            } catch (error) {
                console.error('خطأ في تحديث الإحصائيات:', error);
            }
        }
        
        // تنسيق الوقت
        function formatTime(date) {
            const now = new Date();
            const diff = now - date;
            
            if (diff < 60000) return 'الآن';
            if (diff < 3600000) return `منذ ${Math.floor(diff/60000)} د`;
            if (diff < 86400000) return `منذ ${Math.floor(diff/3600000)} س`;
            
            return date.toLocaleDateString('ar-EG', { 
                month: 'short', 
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }
        
        // تحديث المحادثة
        function refreshChat() {
            if (currentChatId) {
                loadChat(currentChatId);
            }
        }
        
        // البحث
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const search = e.target.value.toLowerCase();
            document.querySelectorAll('.chat-item').forEach(item => {
                const text = item.textContent.toLowerCase();
                item.style.display = text.includes(search) ? 'flex' : 'none';
            });
        });
        
        // تحميل البيانات عند فتح الصفحة
        window.onload = () => {
            loadChats();
            // تحديث كل 30 ثانية
            setInterval(loadChats, 30000);
        };
    </script>
</body>
</html>
