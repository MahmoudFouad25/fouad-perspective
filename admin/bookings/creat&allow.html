<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تجهيز الطلاب — منظور الفؤاد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/fouad-ui.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="../../js/fouad-ui.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="../../js/admin-guard.js"></script>
<script src="../../js/bot-client.js"></script>
<script src="../../js/password-safe.js"></script>
<script src="../../js/booking-money.js"></script>
<script src="../../js/student-setup.js"></script>
<style>
/* ============ تجهيز الطلاب ============
   صفحة شغل: طابور واحد واضح، وكل حجز بيتفتح في لوح جانبي بخطواته التلاتة (الحساب ← الكورس ← الترحيب).
   الهوية من css/fouad-ui.css. */
html{direction:rtl}
body.fu{margin:0;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:26px 20px 96px}
.muted{color:var(--fu-muted)}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.ltr{direction:ltr;unicode-bidi:isolate}

.b{display:inline-flex;align-items:center;gap:7px;font:600 13.5px/1 var(--fu-font);padding:9px 14px;border-radius:9px;border:1px solid var(--fu-line-2);background:var(--fu-surface);color:var(--fu-ink);cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .12s,border-color .12s}
.b:hover{background:var(--fu-sunken)}
.b i{font-size:12.5px;opacity:.85}
.b.p{background:var(--fu-primary);border-color:var(--fu-primary);color:var(--fu-on)}
.b.p:hover{background:var(--fu-primary-2)}
.b.q{border-color:transparent;background:transparent;color:var(--fu-ink-2)}
.b.q:hover{background:var(--fu-sunken);color:var(--fu-ink)}
.b.sm{padding:7px 11px;font-size:12.5px}
.b[disabled]{opacity:.55;cursor:not-allowed}
.b .c{background:rgba(255,255,255,.22);border-radius:99px;padding:3px 8px;font-size:12px}
.b:not(.p) .c{background:var(--fu-sunken)}

/* ---------- رأس الصفحة ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
.ph h1{margin:0;font-size:27px;font-weight:700;letter-spacing:-.015em}
.ph p{margin:4px 0 0;color:var(--fu-muted);font-size:14.5px}
.pact{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- العدادات (هي نفسها الفلتر) ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:22px;background:var(--fu-surface);border:1px solid var(--fu-line);border-radius:16px;overflow:hidden}
.st{all:unset;box-sizing:border-box;cursor:pointer;padding:15px 20px 14px;border-inline-start:1px solid var(--fu-line);position:relative;transition:background .12s}
.st:first-child{border-inline-start:0}
.st:hover{background:var(--fu-paper)}
.st b{display:block;font-size:26px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.st span{display:block;font-size:13.5px;font-weight:600;margin-top:2px}
.st small{display:block;font-size:12px;color:var(--fu-muted);margin-top:1px}
.st[aria-pressed="true"]{background:var(--fu-paper)}
.st[aria-pressed="true"]::after{content:'';position:absolute;inset-inline:16px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--fu-primary)}
.st.k-wait b{color:var(--fu-accent)}
.st.k-info b{color:var(--fu-info)}
.st.zero b{color:var(--fu-muted);font-size:15px;font-weight:600;line-height:31px}
.st:focus-visible{outline:2px solid var(--fu-primary);outline-offset:-2px}

/* ---------- التبويبات والبحث ---------- */
.bar{display:flex;align-items:center;gap:12px;margin:22px 0 14px;border-bottom:1px solid var(--fu-line);position:sticky;top:var(--fu-nav-h,56px);background:var(--fu-paper);z-index:20}
.tabs{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:13px 14px 12px;font:600 14.5px var(--fu-font);color:var(--fu-muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tabs button:hover{color:var(--fu-ink)}
.tabs button[aria-selected="true"]{color:var(--fu-ink);border-bottom-color:var(--fu-primary)}
.tabs .c{font-size:12px;color:var(--fu-muted);font-weight:500}
.find{position:relative;flex:none;width:260px}
.find input{width:100%;box-sizing:border-box;padding:8px 34px 8px 12px;border:1px solid var(--fu-line-2);border-radius:9px;background:var(--fu-surface);color:var(--fu-ink);font:14px var(--fu-font)}
.find i{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--fu-muted);font-size:12.5px}

/* ---------- القائمة ---------- */
.list{background:var(--fu-surface);border:1px solid var(--fu-line);border-radius:16px;overflow:hidden}
.lh{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.3fr) 150px 110px 168px;gap:14px;padding:10px 20px;font-size:12px;font-weight:600;color:var(--fu-muted);background:var(--fu-paper);border-bottom:1px solid var(--fu-line)}
.r{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.3fr) 150px 110px 168px;gap:14px;align-items:center;padding:12px 20px;border-top:1px solid var(--fu-line);cursor:pointer;position:relative;transition:background .1s}
.lh+.r,.r:first-child{border-top:0}
.r:hover{background:var(--fu-paper)}
.r.on{background:var(--fu-primary-soft)}
.r::before{content:'';position:absolute;inset-inline-start:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:transparent}
.r.k-review::before{background:var(--fu-accent)}
.r.k-new::before{background:var(--fu-info)}
.r.k-nocourse::before{background:var(--fu-accent)}
.who{display:flex;gap:11px;align-items:center;min-width:0}
.av{width:34px;height:34px;border-radius:10px;background:var(--fu-sunken);color:var(--fu-ink-2);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.who b,.crs b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small,.crs small,.mny small{display:block;font-size:12.5px;color:var(--fu-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crs,.mny{min-width:0}
.mny b{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.age{font-size:12.5px;color:var(--fu-muted)}
.act{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.empty{padding:46px 20px;text-align:center;color:var(--fu-muted)}
.empty i{font-size:26px;color:var(--fu-primary);display:block;margin-bottom:10px}
.empty b{display:block;color:var(--fu-ink);font-size:16px;margin-bottom:4px}
.more{display:flex;justify-content:center;padding:14px;border-top:1px solid var(--fu-line)}
.sk{height:13px;border-radius:6px;background:linear-gradient(90deg,var(--fu-sunken),var(--fu-paper),var(--fu-sunken));background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.note{padding:14px 16px;border-radius:12px;background:var(--fu-sunken);color:var(--fu-ink-2);font-size:14px}
.note.bad{background:var(--fu-danger-soft);color:var(--fu-danger)}

/* حسب الكورس */
.grp{border-top:1px solid var(--fu-line)}
.grp:first-child{border-top:0}
.gh{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:14px;padding:14px 20px;cursor:pointer}
.gh:hover{background:var(--fu-paper)}
.gh b{font-size:15px;font-weight:600;flex:1;min-width:0}
.gh .n{font-size:13px;color:var(--fu-muted);font-variant-numeric:tabular-nums}
.gh .w{font-size:12.5px;color:var(--fu-accent);font-weight:600}
.gh i{color:var(--fu-muted);font-size:12px;transition:transform .15s}
.grp.open .gh i{transform:rotate(-90deg)}
.gb{background:var(--fu-paper);border-top:1px solid var(--fu-line)}
.gb .r{grid-template-columns:minmax(0,1.5fr) 150px 140px 120px;background:transparent}
.gb .r:hover{background:var(--fu-sunken)}

/* ---------- اللوح الجانبي ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,24,21,.28);z-index:950;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(520px,100vw);background:var(--fu-surface);border-inline-start:1px solid var(--fu-line);z-index:960;display:flex;flex-direction:column;transform:translateX(-102%);transition:transform .2s ease;box-shadow:0 0 40px rgba(31,42,36,.12)}
.dr.on{transform:none}
.dh{padding:20px 22px 16px;border-bottom:1px solid var(--fu-line);display:flex;gap:14px;align-items:flex-start}
.dh .av{width:46px;height:46px;border-radius:14px;font-size:19px;background:var(--fu-primary-soft);color:var(--fu-primary)}
.dh .t{flex:1;min-width:0}
.dh h2{margin:0;font-size:19px;font-weight:700;line-height:1.3}
.dh .sub{font-size:13px;color:var(--fu-muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:2px 12px}
.dh .x{border:0;background:none;font-size:22px;line-height:1;color:var(--fu-muted);cursor:pointer;padding:4px 6px;border-radius:8px}
.dh .x:hover{background:var(--fu-sunken);color:var(--fu-ink)}
.db{flex:1;overflow-y:auto;padding:18px 22px 24px}
.df{padding:14px 22px;border-top:1px solid var(--fu-line);display:flex;gap:8px;align-items:center;background:var(--fu-surface)}
.df .sp{flex:1}
.df .msg{font-size:13px;color:var(--fu-danger);flex:1}

.bk{border:1px solid var(--fu-line);border-radius:14px;overflow:hidden}
.bk .top{padding:12px 16px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.bk .top b{font-size:15px;font-weight:600}
.bk .top small{font-size:12.5px;color:var(--fu-muted)}
.bk .mods{padding:0 16px 10px;font-size:13px;color:var(--fu-ink-2)}
.figs{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--fu-line);background:var(--fu-paper)}
.figs div{padding:10px 16px;border-inline-start:1px solid var(--fu-line)}
.figs div:first-child{border-inline-start:0}
.figs span{display:block;font-size:12px;color:var(--fu-muted)}
.figs b{display:block;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.figs .ok b{color:var(--fu-primary)}
.figs .wait b{color:var(--fu-accent)}

.steps{list-style:none;margin:20px 0 0;padding:0;position:relative}
.steps>li{position:relative;padding:0 0 22px;padding-inline-start:44px}
.steps>li:last-child{padding-bottom:0}
.steps>li::before{content:'';position:absolute;inset-inline-start:15px;top:32px;bottom:2px;width:2px;background:var(--fu-line)}
.steps>li:last-child::before{display:none}
.mk{position:absolute;inset-inline-start:0;top:0;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13.5px;background:var(--fu-sunken);color:var(--fu-ink-2);border:2px solid var(--fu-surface);box-shadow:0 0 0 1px var(--fu-line)}
li.done .mk{background:var(--fu-primary);color:var(--fu-on);box-shadow:none}
li.need .mk{background:var(--fu-accent);color:var(--fu-on);box-shadow:none}
li.run .mk{background:var(--fu-info-soft);color:var(--fu-info)}
li.bad .mk{background:var(--fu-danger);color:var(--fu-on);box-shadow:none}
.steps h3{margin:4px 0 4px;font-size:15px;font-weight:700;display:flex;gap:8px;align-items:center}
.steps p{margin:0;font-size:14px;color:var(--fu-ink-2);line-height:1.6}
.steps p small{display:block;color:var(--fu-muted);font-size:12.5px}
.cmp{width:100%;border-collapse:collapse;margin-top:10px;font-size:13.5px;table-layout:fixed}
.cmp th{font-size:12px;color:var(--fu-muted);font-weight:600;text-align:start;padding:6px 8px;border-bottom:1px solid var(--fu-line)}
.cmp td{padding:7px 8px;border-bottom:1px solid var(--fu-line);vertical-align:top;overflow-wrap:anywhere}
.cmp td:first-child{color:var(--fu-muted);width:68px}
.cmp tr.same td:not(:first-child){color:var(--fu-primary);font-weight:600}
.choice{display:grid;gap:8px;margin-top:12px}
.choice label{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border:1px solid var(--fu-line-2);border-radius:11px;cursor:pointer;font-size:14px}
.choice label:hover{background:var(--fu-paper)}
.choice input{margin-top:4px;accent-color:var(--fu-primary)}
.choice label:has(input:checked){border-color:var(--fu-primary);background:var(--fu-primary-soft)}
.choice small{display:block;color:var(--fu-muted);font-size:12.5px}
.tick{display:flex;gap:9px;align-items:center;margin-top:8px;font-size:14px;cursor:pointer}
.tick input{width:17px;height:17px;accent-color:var(--fu-primary)}
details.pv{margin-top:8px}
details.pv summary{cursor:pointer;font-size:13px;color:var(--fu-primary);font-weight:600}
details.pv pre{white-space:pre-wrap;font:13px/1.7 var(--fu-font);background:var(--fu-paper);border:1px solid var(--fu-line);border-radius:10px;padding:10px 12px;margin:8px 0 0}
.done-box{margin-top:18px;padding:14px 16px;border-radius:12px;background:var(--fu-primary-soft);color:var(--fu-ink);font-size:14px}
.done-box b{display:block;font-size:15px;margin-bottom:2px}
.done-box .a{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.warnline{margin-top:8px;font-size:13px;color:var(--fu-accent)}

/* الأدوات */
.tools{display:grid;gap:8px}
body.fu .tools button,body.fu .tools a{all:unset;box-sizing:border-box;display:block;cursor:pointer;border:1px solid var(--fu-line-2);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.6;color:var(--fu-ink)}
.tools button:hover,.tools a:hover{background:var(--fu-paper);border-color:var(--fu-primary)}
.tools b{display:flex;gap:8px;align-items:center;font-weight:600}
.tools b i{color:var(--fu-primary);font-size:13px;width:16px}
.tools small{display:block;color:var(--fu-muted);font-size:12.5px;padding-inline-start:24px}
.tools button:focus-visible,.tools a:focus-visible{outline:2px solid var(--fu-primary);outline-offset:2px}
/* نافذة الجماعي */
.blist{max-height:46vh;overflow-y:auto;border:1px solid var(--fu-line);border-radius:12px;margin-top:10px}
.bi{display:flex;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--fu-line);font-size:13.5px}
.bi:first-child{border-top:0}
.bi b{font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bi small{color:var(--fu-muted);font-size:12px}
.bi .s{flex:none;font-size:12.5px;font-weight:600}
.bi .s.ok{color:var(--fu-primary)} .bi .s.wait{color:var(--fu-accent)} .bi .s.bad{color:var(--fu-danger)} .bi .s.run{color:var(--fu-info)}
.prog{height:6px;border-radius:6px;background:var(--fu-sunken);overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--fu-primary);width:0;transition:width .25s}

@media (max-width:900px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .st:nth-child(3){border-inline-start:0}
  .st:nth-child(n+3){border-top:1px solid var(--fu-line)}
  .lh{display:none}
  .r{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"who act" "crs crs" "mny age";row-gap:6px}
  .r .who{grid-area:who}.r .crs{grid-area:crs;padding-inline-start:45px}.r .mny{grid-area:mny;padding-inline-start:45px}.r .age{grid-area:age;text-align:end}.r .act{grid-area:act}
  .gb .r{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"who act" "crs age"}
  .bar{flex-wrap:wrap;gap:0}
  .find{order:2;flex:1 1 100%;width:auto;margin:8px 0 10px}
}
@media (max-width:560px){
  .steps>li{padding-inline-start:40px}
  .db{padding:16px 16px 22px}
  .dh,.df{padding-inline:16px}
  .cmp{font-size:12.5px}
  .wrap{padding:18px 14px 80px}
  .ph h1{font-size:23px}
  .pact{width:100%}
  .pact .b.p{flex:1;justify-content:center}
}
</style>
</head>
<body class="fu" data-fu-nav="bookings" data-fu-dark="on">
<main class="wrap">
  <header class="ph">
    <div>
      <h1>تجهيز الطلاب</h1>
      <p>كل حجز اتدفع بيتعمله حساب، ويتخصصله الكورس، وتوصله رسالة الترحيب. هنا بتخلّصهم.</p>
    </div>
    <div class="pact">
      <button type="button" class="b p" id="bulkBtn" disabled><i class="fas fa-bolt"></i> جهّز الواضحين <span class="c num" id="bulkN">٠</span></button>
      <button type="button" class="b" id="manualBtn"><i class="fas fa-plus"></i> حجز يدوي</button>
      <button type="button" class="b q" id="toolsBtn"><i class="fas fa-toolbox"></i> أدوات</button>
    </div>
  </header>

  <section class="stats" aria-label="حالة الطابور">
    <button type="button" class="st k-info" data-f="new" aria-pressed="false"><b class="num" data-n="new">–</b><span>جديد</span><small>محتاج حساب وكورس</small></button>
    <button type="button" class="st k-wait" data-f="review" aria-pressed="false"><b class="num" data-n="review">–</b><span>مستني قرارك</span><small>فيه حساب شبهه</small></button>
    <button type="button" class="st k-wait" data-f="nocourse" aria-pressed="false"><b class="num" data-n="nocourse">–</b><span>حساب من غير كورس</span><small>الحساب موجود، الكورس لأ</small></button>
    <button type="button" class="st" data-f="nowelcome" aria-pressed="false"><b class="num" data-n="nowelcome">–</b><span>ما اتبعتلوش ترحيب</span><small>آخر أسبوعين</small></button>
  </section>

  <div class="bar">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-t="queue" aria-selected="true">الطابور <span class="c num" data-c="queue"></span></button>
      <button type="button" role="tab" data-t="done" aria-selected="false">اتجهّزوا <span class="c num" data-c="done"></span></button>
      <button type="button" role="tab" data-t="course" aria-selected="false">حسب الكورس</button>
    </div>
    <label class="find"><i class="fas fa-search"></i><input id="q" type="search" placeholder="دوّر بالاسم أو الرقم أو الكورس…" autocomplete="off" aria-label="دوّر"></label>
  </div>

  <section id="view" aria-live="polite">
  </section>
</main>

<div class="scrim" id="scrim"></div>
<aside class="dr" id="dr" role="dialog" aria-modal="true" aria-labelledby="drName" hidden>
  <div class="dh">
    <div class="av" id="drAv">؟</div>
    <div class="t"><h2 id="drName">…</h2><div class="sub" id="drSub"></div></div>
    <button type="button" class="x" id="drX" aria-label="اقفل">×</button>
  </div>
  <div class="db" id="drBody"></div>
  <div class="df" id="drFoot"></div>
</aside>

<script>
(function () {
  'use strict';
  var S = window.StudentSetup;
  var CLIENT = '../client.html?id=';
  var $ = function (id) { return document.getElementById(id); };
  var E = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var AR = '٠١٢٣٤٥٦٧٨٩';
  function arN(n) { return String(n).replace(/\d/g, function (d) { return AR[d]; }); }
  function egp(n) { return (Number(n) || 0).toLocaleString('ar-EG') + ' ج.م'; }
  function initial(name) { var t = String(name || '').trim(); return t ? t[0] : '؟'; }
  function ago(iso) {
    var t = Date.parse(iso || ''); if (isNaN(t)) return '';
    var m = Math.max(0, Math.round((Date.now() - t) / 60000));
    if (m < 2) return 'دلوقتي';
    if (m < 60) return 'من ' + arN(m) + ' دقيقة';
    var h = Math.round(m / 60); if (h < 24) return h === 1 ? 'من ساعة' : h === 2 ? 'من ساعتين' : 'من ' + arN(h) + ' ساعات';

  // ---------- البيانات ----------
  function wanted(d) { return d && d.customer && d.customer.name && d.customer.name !== 'غير محدد'; }

  // ---------- العرض ----------
  function render() {

  // ---------- اللوح الجانبي ----------

        ' <a class="b sm q" style="margin-top:8px" href="' + CLIENT + encodeURIComponent(cd.userId) + '" target="_blank" rel="noopener"><i class="fas fa-up-right-from-square"></i> افتح الحساب الموجود</a>';
    } else if (p.kind === 'assign') {

  function bulk() {
    var list = rows().filter(function (r) { return r.st === 'new' || r.st === 'nocourse'; });

    var res = { ok: 0, review: 0, bad: 0, nowel: 0 };
    FU.ask({
      title: 'جهّز الواضحين', sub: arN(list.length) + ' حجز', ok: 'ابدأ', wide: true,
      body: '<div class="fu-sum">اللي مالوش حساب هيتعمله حساب، واللي ليه حساب بنفس الإيميل هيتربط بيه، وبعدين الكورس يتخصص. ' +
        '<b>اللي ليه حساب بنفس التليفون بس هيستنى قرارك</b> ومش هيتعمله حاجة.</div>' +
        (tg ? '<label class="fu-check" style="margin-top:12px"><input type="checkbox" name="wel" checked> ابعت رسالة الترحيب على التليجرام (' + arN(tg) + ' منهم عندهم تليجرام)</label>' : '') +
        '<div class="prog" hidden><i></i></div><div class="blist">' + list.map(item).join('') + '</div>',
      run: function (f, d) {
        var wel = f.elements.wel ? f.elements.wel.checked : false, bar = d.querySelector('.prog'), i = 0;
        bar.hidden = false; ui.busy = true;
        d.querySelectorAll('.fu-ask__f [value=cancel],.fu-ask__x').forEach(function (b) { b.disabled = true; });
        function mark(id, cls, text) { var el = d.querySelector('[data-b="' + CSS.escape(id) + '"] .s'); if (el) { el.className = 's ' + cls; el.textContent = text; el.closest('.bi').scrollIntoView({ block: 'nearest' }); } }
        function next() {
          if (i >= list.length) return Promise.resolve();
          var r = list[i++];
          mark(r.id, 'run', 'بنجهّز…');
          return S.plan(r.id).then(function (p) {
            if (p.kind === 'ask') return S.markReview(p).then(function () { res.review++; mark(r.id, 'wait', 'مستني قرارك'); });
            if (p.kind === 'done') { res.ok++; mark(r.id, 'ok', 'متجهّز قبل كده'); return; }
            return S.run(p, { welcome: wel }).then(function (x) {
              res.ok++;
              var w = x.welcome;

              else mark(r.id, 'ok', x.isNew ? 'حساب جديد ✓' : 'اتربط ✓');
            });
          }).catch(function (e) { res.bad++; mark(r.id, 'bad', e.message.slice(0, 60)); console.error(r.id, e); })
            .then(function () { bar.firstChild.style.width = Math.round(i / list.length * 100) + '%'; return next(); });
        }
        return next().then(function () {
          ui.busy = false;
          d.querySelectorAll('.fu-ask__f [value=cancel],.fu-ask__x').forEach(function (b) { b.disabled = false; });
          d.querySelector('.fu-ask__f [value=ok]').hidden = true;

          var id = ids[i++], el = d.querySelector('[data-u="' + CSS.escape(id) + '"] .s');
          if (el) { el.className = 's run'; el.textContent = 'بنبعت…'; }
          return S.loginLink(id, true).then(function () { res.ok++; if (el) { el.className = 's ok'; el.textContent = 'اتبعت ✓'; } },
            function (e) { res.bad++; if (el) { el.className = 's bad'; el.textContent = e.message; } })
            .then(function () { bar.firstChild.style.width = Math.round(i / ids.length * 100) + '%'; return new Promise(function (ok) { setTimeout(ok, 350); }); }).then(next);
        }
        return next().then(function () {
          d.querySelectorAll('.fu-ask__f [value=cancel],.fu-ask__x').forEach(function (b) { b.disabled = false; });
          d.querySelector('[value=ok]').hidden = true; d.querySelector('.fu-ask__f [value=cancel]').textContent = 'تمام';
          var m = d.querySelector('.fu-ask__m'); m.style.color = 'var(--fu-ink)';
          m.textContent = arN(res.ok) + ' اتبعتلهم' + (res.bad ? ' · ' + arN(res.bad) + ' ما وصلهمش' : '');
          return false;
        });
      }
    });
  }

  function fixOld() {
    FU.confirm('مراجعة الاشتراكات القديمة؟', 'هقرا كل الحسابات مرة واحدة وأصلّح أي اشتراك رقم الكورس فيه قديم (course-…) أو فاضي، بالبحث باسم الكورس. مش هيتمسح حاجة.', { ok: 'ابدأ' }).then(function (go) {
      if (!go) return;
      FU.toast('بنراجع…', { type: 'wait' });
      var fdb = firebase.firestore(), fixed = 0, missing = 0, touched = 0;
      return fdb.collection('users').get().then(function (snap) {
        var jobs = [];
        snap.forEach(function (doc) {
          var u = doc.data() || {}, ens = u.enrollments || [];
          if (!ens.some(function (e) { return e && e.title && (!e.courseId || String(e.courseId).indexOf('course-') === 0); })) return;
          jobs.push(Promise.all(ens.map(function (e) {
            if (!(e && e.title && (!e.courseId || String(e.courseId).indexOf('course-') === 0))) return Promise.resolve(e);
            return S.getCourseByName(e.title).then(function (c) { if (c) { fixed++; return Object.assign({}, e, { courseId: c.id }); } missing++; return e; });
          })).then(function (next) {
            if (JSON.stringify(next) === JSON.stringify(ens)) return;
            touched++;
            return fdb.collection('users').doc(doc.id).update({ enrollments: next, 'timestamps.updatedAt': new Date().toISOString() });
          }));
        });
        return Promise.all(jobs);
      }).then(function () {
        FU.ask({ title: 'خلصت المراجعة', ok: false, body: '<div class="fu-figs"><div class="ok"><span>اتصلّح</span><b>' + arN(fixed) + ' اشتراك</b></div><div><span>في</span><b>' + arN(touched) + ' حساب</b></div><div class="' + (missing ? 'bad' : '') + '"><span>مش لاقي كورسه</span><b>' + arN(missing) + '</b></div></div>' + (missing ? '<p class="muted" style="margin-top:10px">اللي مش لاقي كورسه اسمه مش موجود في الكورسات — ظبّطه من ملف العميل.</p>' : '') });
      });
    }).catch(function (e) { FU.toast('ما كملتش: ' + e.message, { type: 'bad' }); });
  }

  // ---------- الأحداث ----------
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (t.closest('[data-stop]')) return;
    var go = t.closest('[data-go]'); if (go) { openDrawer(go.getAttribute('data-go')); return; }
    var row = t.closest('#view .r[data-id]'); if (row) { openDrawer(row.getAttribute('data-id')); return; }
    var st = t.closest('.st[data-f]'); if (st) { var f = st.getAttribute('data-f'); ui.tab = 'queue'; ui.filter = ui.filter === f ? null : f; render(); return; }
    var tab = t.closest('.tabs [data-t]'); if (tab) { ui.tab = tab.getAttribute('data-t'); if (ui.tab !== 'queue') ui.filter = null; ui.donePage = 1; render(); return; }
    if (t.closest('[data-more]')) { ui.donePage++; render(); return; }
    if (t.closest('[data-clear]')) { ui.filter = null; render(); return; }
    var g = t.closest('[data-g]'); if (g) { var k = g.getAttribute('data-g'); ui.openGroups[k] = !ui.openGroups[k]; render(); return; }
    if (t.closest('#dr')) {
      if (t.closest('[data-run]')) runOpen();
      else if (t.closest('[data-close]')) closeDrawer();
      else if (t.closest('[data-welcome]')) sendWelcomeOpen();
      else if (t.closest('[data-skip]')) { S.skipWelcome(ui.plan.bookingId).then(function () { FU.toast('تمام، مش هيظهر تاني في الطابور'); closeDrawer(); }, function (er) { showErr(er); }); }
      else if (t.closest('[data-wa]')) waOpen();
      else if (t.closest('[data-next]')) { var n = nextInQueue(); if (n) openDrawer(n); }
      else if (t.closest('[data-link]')) {
        var uid = (ui.result && ui.result.userId) || ui.plan.userId;
        setBusy(true, 'بنبعت…');
        S.loginLink(uid, true).then(function () { setBusy(false); FU.toast('اتبعتله رابط دخول جديد'); }, function (er) { setBusy(false); showErr(er); });
      }
    }
  });
  document.addEventListener('change', function (e) {
    if (e.target.name === 'dec' && e.target.closest('#dr')) {
      ui.decision = e.target.value;
      drawFoot();
      var pre = document.querySelector('#drBody details.pv pre');
      if (pre && ui.plan) { var p = ui.plan, c = p.student.customer || {}; pre.textContent = S.welcomeText({ student: p.student, isNew: ui.decision === 'create', email: c.email || 'user…@fouad.academy', password: '••••••••', modules: p.modules }, '', p.courses && p.courses[0] && p.courses[0].data && p.courses[0].data.whatsappGroupLink).replace(/\\([_*`\[])/g, '$1').replace(/[*`]/g, ''); }
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && ui.open && !FU.isOpen()) { e.preventDefault(); closeDrawer(); }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('#view .r[data-id]')) { e.preventDefault(); openDrawer(e.target.getAttribute('data-id')); }
  });
  $('drX').onclick = closeDrawer;
  $('scrim').onclick = closeDrawer;
  $('bulkBtn').onclick = bulk;
  $('manualBtn').onclick = manual;
  $('toolsBtn').onclick = tools;
  var qT = null;
  $('q').addEventListener('input', function (e) { clearTimeout(qT); qT = setTimeout(function () { ui.q = e.target.value.trim(); ui.donePage = 1; render(); }, 150); });

  // ---------- البداية ----------
  function boot() {
    $('view').innerHTML = '<div class="list">' + [1, 2, 3, 4].map(function () { return '<div class="r" style="cursor:default"><div class="who"><span class="av"></span><div style="flex:1"><div class="sk" style="width:70%"></div></div></div><div class="sk"></div><div class="sk" style="width:60%"></div><div class="sk" style="width:50%"></div><div></div></div>'; }).join('') + '</div>';
    startLive();
    var qs = new URLSearchParams(location.search), id = qs.get('id');
    if (id) openDrawer(id);
  }
  AdminGuard.ready().then(boot).catch(function (e) { $('view').innerHTML = '<div class="note bad">' + E(e && e.message || 'مقدرتش أبدأ') + '</div>'; });
})();
</script>
</body>
