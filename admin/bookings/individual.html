// ==================== 🏗️ البنية الجديدة للمستخدم ====================
const UserStructure = {
    // دالة إنشاء مستخدم جديد بالبنية الصحيحة
    createNewUser: function(studentData) {
        const now = new Date().toISOString();
        const customer = studentData.customer || {};
        
        return {
            // المعرف الأساسي
            id: this.generateUniqueSlug(customer.name),
            
            // البيانات الشخصية
            personalInfo: {
                name: customer.name || '',
                title: customer.title || '',
                email: customer.email || '',
                whatsapp: customer.whatsapp || '',
                phone: customer.phone || customer.whatsapp || '',
                age: customer.age || null,
                gender: customer.gender || '',
                country: customer.country || '',
                city: customer.city || '',
                job: customer.job || '',
                source: customer.source || ''
            },
            
            // بيانات الوصول
            auth: {
                tempPassword: btoa(this.generateStrongPassword()),
                lastLogin: null,
                loginCount: 0,
                createdAt: now,
                createdBy: 'admin',
                createdFrom: 'individual-students'
            },
            
            // حالة الحساب
            accountStatus: {
                status: 'active',
                level: this.calculateUserLevel(studentData),
                verified: false,
                suspended: false
            },
            
            // الدورات - مصفوفة فارغة تنتظر التخصيص
            enrollments: [],
            
            // المالية - إجماليات فقط
            financial: {
                totalPaid: 0,
                totalDue: 0,
                totalSavings: 0,
                wallet: { balance: 0, transactions: [] },
                paymentHistory: []
            },
            
            // السجلات
            bookingHistory: [],
            referralProgram: null,
            loyaltyPoints: { balance: 0, tier: 'BRONZE', history: [] },
            
            // البيانات الفنية
            metadata: {
                originalStudentDocId: studentData.id,
                dataCompleteness: studentData.dataCompleteness || {}
            },
            
            timestamps: {
                createdAt: now,
                updatedAt: now
            }
        };
    },
    
    // دالة توليد معرف فريد
    generateUniqueSlug: function(name) {
        const timestamp = Date.now().toString().slice(-6);
        const clean = (name || 'user')
            .toLowerCase()
            .trim()
            .replace(/[\u0600-\u06FF]/g, '')
            .replace(/[^\w\s-]/g, '')
            .replace(/[\s_-]+/g, '-')
            .slice(0, 20);
        return `${clean}-${timestamp}`;
    },
    
    // دالة توليد كلمة مرور قوية
    generateStrongPassword: function() {
        const sets = {
            upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
            lower: 'abcdefghijklmnopqrstuvwxyz',
            numbers: '0123456789',
            special: '!@#$%^&*'
        };
        
        let password = '';
        password += sets.upper[Math.floor(Math.random() * 26)];
        password += sets.lower[Math.floor(Math.random() * 26)];
        password += sets.numbers[Math.floor(Math.random() * 10)];
        password += sets.special[Math.floor(Math.random() * 8)];
        
        const all = Object.values(sets).join('');
        for(let i = 4; i < 12; i++) {
            password += all[Math.floor(Math.random() * all.length)];
        }
        
        return password.split('').sort(() => Math.random() - 0.5).join('');
    },
    
    // دالة تحديد مستوى المستخدم
    calculateUserLevel: function(studentData) {
        const savings = studentData.totalSavings || 0;
        const completeness = studentData.dataCompleteness?.percentage || 0;
        
        if (savings > 5000) return 'PLATINUM';
        if (savings > 3000) return 'GOLD';
        if (savings > 1000) return 'SILVER';
        if (completeness > 80) return 'PREMIUM';
        return 'STANDARD';
    }
};

const EnrollmentManager = {
    // إنشاء تخصيص دورة جديد
    createEnrollment: function(studentData, courseSettings) {
        const now = new Date().toISOString();
        const pricing = studentData.pricing || {};
        
        return {
            id: `enrollment-${Date.now()}`,
            courseId: studentData.courseId || `course-${Date.now()}`,
            title: studentData.courseName || 'دورة غير محددة',
            type: 'individual',
            
            // التواريخ
            startDate: courseSettings.startDate,
            endDate: courseSettings.endDate,
            enrolledAt: now,
            
            // البيانات المالية للدورة
            pricing: {
                originalPrice: pricing.basePriceNumber || 0,
                finalPrice: pricing.finalPriceNumber || 0,
                discounts: studentData.discounts || [],
                savings: studentData.totalSavings || 0,
                activeOffer: studentData.activeOffer || null,
                coupon: studentData.coupon || null
            },
            
            // حالة الدفع للدورة
            payment: {
                method: studentData.paymentMethod || null,
                totalAmount: pricing.finalPriceNumber || 0,
                paidAmount: this.calculatePaidAmount(studentData),
                remainingAmount: this.calculateRemainingAmount(studentData),
                status: this.determinePaymentStatus(studentData),
                installments: this.createInstallmentSchedule(studentData)
            },
            
            // معلومات إضافية
            originalBookingId: studentData.originalBookingId || studentData.id,
            notes: courseSettings.notes || '',
            status: 'active'
        };
    },
    
    // حساب المدفوع
    calculatePaidAmount: function(studentData) {
        if (studentData.paymentInfo?.isInstallment) {
            return studentData.paymentInfo.paidAmount || 0;
        }
        if (studentData.paymentConfirmed || studentData.paymentInfo?.fullyPaid) {
            return studentData.pricing?.finalPriceNumber || 0;
        }
        return 0;
    },
    
    // حساب المتبقي
    calculateRemainingAmount: function(studentData) {
        const total = studentData.pricing?.finalPriceNumber || 0;
        const paid = this.calculatePaidAmount(studentData);
        return Math.max(0, total - paid);
    },
    
    // تحديد حالة الدفع
    determinePaymentStatus: function(studentData) {
        if (studentData.paymentConfirmed || studentData.paymentInfo?.fullyPaid) {
            return 'paid';
        }
        if (studentData.paymentInfo?.paidAmount > 0) {
            return 'partial';
        }
        return 'pending';
    },
    
    // إنشاء جدول الأقساط
    createInstallmentSchedule: function(studentData) {
        if (!studentData.paymentInfo?.isInstallment) return null;
        
        return {
            totalInstallments: studentData.paymentInfo.totalInstallments || 0,
            paidInstallments: studentData.paymentInfo.paidInstallments || 0,
            schedule: studentData.paymentInfo.installmentSchedule || [],
            nextDueDate: studentData.paymentInfo.nextDueDate || null
        };
    }
};

        function checkForNewTransfer() {
    const urlParams = new URLSearchParams(window.location.search);
    const action = urlParams.get('action');
    const bookingId = urlParams.get('id');
    
    if (action === 'new' && bookingId) {
        showNewStudentAlert();
        // تمييز الطالب الجديد
        setTimeout(() => {
            const card = document.querySelector(`[data-booking-id="${bookingId}"]`);
            if (card) {
                card.classList.add('new');
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }, 1000);
    }
}

async function checkIfUserExists(email, whatsapp) {
    try {
        if (!email && !whatsapp) return null;
        
        // البحث بالإيميل في المكان الجديد
        if (email) {
            const emailQuery = await db.collection('users')
                .where('personalInfo.email', '==', email)
                .limit(1)
                .get();
            
            if (!emailQuery.empty) {
                const userData = emailQuery.docs[0].data();
                return {
                    exists: true,
                    userId: emailQuery.docs[0].id,
                    userData: userData
                };
            }
        }
        
        // البحث برقم الواتساب في المكان الجديد
        if (whatsapp) {
            const phoneQuery = await db.collection('users')
                .where('personalInfo.whatsapp', '==', whatsapp)
                .limit(1)
                .get();
            
            if (!phoneQuery.empty) {
                const userData = phoneQuery.docs[0].data();
                return {
                    exists: true,
                    userId: phoneQuery.docs[0].id,
                    userData: userData
                };
            }
            
            // البحث في حقل phone
            const phoneQuery2 = await db.collection('users')
                .where('personalInfo.phone', '==', whatsapp)
                .limit(1)
                .get();
            
            if (!phoneQuery2.empty) {
                const userData = phoneQuery2.docs[0].data();
                return {
                    exists: true,
                    userId: phoneQuery2.docs[0].id,
                    userData: userData
                };
            }
        }
        
        return { exists: false };
        
    } catch (error) {
        console.error('خطأ في التحقق من المستخدم:', error);
        return { exists: false };
    }
}

        // دالة حساب وعرض إحصائيات الخصومات
function calculateAndShowDiscountStats() {
    let stats = {
        totalSavings: 0,
        totalBasePrice: 0,
        totalFinalPrice: 0,
        discountsByType: {
            time: { count: 0, total: 0 },
            group: { count: 0, total: 0 },
            cash: { count: 0, total: 0 },
            coupon: { count: 0, total: 0 }
        },
        activeOffers: {},
        couponsUsed: {},
        paymentMethods: {},
        averageSavings: 0
    };
    
    allStudents.forEach(student => {
        // حساب الأسعار
        if (student.pricing) {
            stats.totalBasePrice += student.pricing.basePriceNumber || 0;
            stats.totalFinalPrice += student.pricing.finalPriceNumber || 0;
        }
        
        // حساب التوفير
        if (student.totalSavings) {
            stats.totalSavings += student.totalSavings;
        }
        
        // تحليل الخصومات
        if (student.discounts && Array.isArray(student.discounts)) {
            student.discounts.forEach(discount => {
                if (discount.type && stats.discountsByType[discount.type]) {
                    stats.discountsByType[discount.type].count++;
                    stats.discountsByType[discount.type].total += discount.amount || 0;
                }
            });
        }
        
        // العروض النشطة
        if (student.activeOffer && student.activeOffer.name) {
            stats.activeOffers[student.activeOffer.name] = (stats.activeOffers[student.activeOffer.name] || 0) + 1;
        }
        
        // الكوبونات المستخدمة
        if (student.coupon && student.coupon.code) {
            stats.couponsUsed[student.coupon.code] = (stats.couponsUsed[student.coupon.code] || 0) + 1;
        }
        
        // طرق الدفع
        if (student.customer && student.customer.paymentMethods) {
            student.customer.paymentMethods.forEach(method => {
                stats.paymentMethods[method] = (stats.paymentMethods[method] || 0) + 1;
            });
        }
    });
    
    // حساب متوسط التوفير
    if (allStudents.length > 0) {
        stats.averageSavings = Math.round(stats.totalSavings / allStudents.length);
    }
    
    console.log('📊 إحصائيات الخصومات والتوفير:');
    console.log('💰 إجمالي التوفير:', stats.totalSavings.toLocaleString('ar-EG') + ' ج.م');
    console.log('📈 متوسط التوفير لكل طالب:', stats.averageSavings.toLocaleString('ar-EG') + ' ج.م');
    console.log('🎯 تفصيل الخصومات:', stats.discountsByType);
    console.log('🎁 العروض النشطة:', stats.activeOffers);
    console.log('🎫 الكوبونات المستخدمة:', stats.couponsUsed);
    console.log('💳 طرق الدفع المفضلة:', stats.paymentMethods);
    
    return stats;
}

        // تحديث الإحصائيات المطورة
function updateStatistics() {
    if (allStudents.length === 0) {
        document.getElementById('total-students').textContent = '0';
        document.getElementById('active-students').textContent = '0';
        document.getElementById('pending-students').textContent = '0';
        document.getElementById('courses-assigned').textContent = '0';
        document.getElementById('completion-rate').textContent = '0%';
        return;
    }
    
    const stats = {
        total: allStudents.length,
        active: 0,
        pending: 0,
        coursesAssigned: 0,
        completionRate: 0,
        totalSavings: 0,
        withDiscounts: 0,
        vipStudents: 0
    };
    
    allStudents.forEach(student => {
        // حالة الحساب
        if (student.accountStatus === 'active' || student.accountCreated === true) {
            stats.active++;
        } else if (!student.accountCreated || student.accountStatus === 'pending') {
            stats.pending++;
        }
        
        // الدورات المخصصة
        if (student.courseAssigned || student.assignedCourseId) {
            stats.coursesAssigned++;
        }
        
        // حساب التوفير
        if (student.totalSavings > 0) {
            stats.totalSavings += student.totalSavings;
            stats.withDiscounts++;
        }
        
        // حساب طلاب VIP
        if (student.totalSavings > 1000 || (student.dataCompleteness?.percentage || 0) > 80) {
            stats.vipStudents++;
        }
    });
    
    // حساب معدل الإنجاز
    if (stats.total > 0) {
        const totalProgress = allStudents.reduce((sum, s) => {
            const progress = s.progress?.totalProgress || 0;
            return sum + progress;
        }, 0);
        stats.completionRate = Math.round(totalProgress / stats.total);
    }
    
    // تحديث العرض
    document.getElementById('total-students').textContent = stats.total;
    document.getElementById('active-students').textContent = stats.active;
    document.getElementById('pending-students').textContent = stats.pending;
    document.getElementById('courses-assigned').textContent = stats.coursesAssigned;
    document.getElementById('completion-rate').textContent = stats.completionRate + '%';
    
    // تحديث badges التبويبات
    document.getElementById('tab-all').textContent = stats.total;
    document.getElementById('tab-new').textContent = allStudents.filter(s => isNewStudent(s)).length;
    document.getElementById('tab-pending').textContent = stats.pending;
    document.getElementById('tab-active').textContent = stats.active;
    document.getElementById('tab-inactive').textContent = allStudents.filter(s => s.accountStatus === 'inactive').length;
    
    // عرض إحصائيات إضافية في الـ Console
    console.log('📊 إحصائيات إضافية:');
    console.log(`💰 إجمالي التوفير: ${stats.totalSavings.toLocaleString('ar-EG')} ج.م`);
    console.log(`🎯 طلاب حصلوا على خصومات: ${stats.withDiscounts} من ${stats.total}`);
    console.log(`⭐ طلاب VIP: ${stats.vipStudents}`);
    console.log(`📈 نسبة التحويل: ${Math.round((stats.active / stats.total) * 100)}%`);
}
        
        // التحقق من طالب جديد (خلال آخر 24 ساعة)
        function isNewStudent(student) {
    if (!student.transferredAt) return false;
    const transferDate = new Date(student.transferredAt);
    const now = new Date();
    const hoursDiff = (now - transferDate) / (1000 * 60 * 60);
    return hoursDiff <= 24;
}

        function filterByTab(tab) {
    currentFilter = tab;
    
    // تحديث التبويب النشط
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    if (event && event.target) {
        event.target.classList.add('active');
    }
    
    // تطبيق الفلتر
    switch(tab) {
        case 'new':
            filteredStudents = allStudents.filter(s => isNewStudent(s));
            break;
        case 'pending':
            filteredStudents = allStudents.filter(s => !s.accountCreated || s.accountStatus === 'pending');
            break;
        case 'active':
            filteredStudents = allStudents.filter(s => s.accountStatus === 'active');
            break;
        case 'inactive':
            filteredStudents = allStudents.filter(s => s.accountStatus === 'inactive');
            break;
        default:
            filteredStudents = [...allStudents];
    }
    
    displayStudents();
}
        
        // تطبيق الفلاتر
        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const course = document.getElementById('filterCourse').value;
            const level = document.getElementById('filterLevel').value;
            const date = document.getElementById('filterDate').value;
            
            filteredStudents = allStudents.filter(student => {
                // فلتر البحث
                if (search && !searchInStudent(student, search)) return false;
                
                // فلتر الدورة
                if (course && student.courseName !== course) return false;
                
                // فلتر المستوى
                if (level && student.experience !== level) return false;
                
                // فلتر التاريخ
                if (date) {
                    const studentDate = new Date(student.transferredAt).toDateString();
                    const filterDate = new Date(date).toDateString();
                    if (studentDate !== filterDate) return false;
                }
                
                return true;
            });
            
            displayStudents();
        }
        
        // البحث في بيانات الطالب
        function searchInStudent(student, search) {
            const searchFields = [
                student.customer?.name,
                student.customer?.whatsapp,
                student.customer?.email,
                student.id,
                student.courseName
            ];
            
            return searchFields.some(field => 
                field && field.toString().toLowerCase().includes(search)
            );
        }

async function loadAvailableCourses() {
    try {
        const coursesSnapshot = await db.collection('courses').get();
        availableCourses = [];
        
        coursesSnapshot.forEach(doc => {
            const data = doc.data();
            availableCourses.push({
                id: doc.id,
                type: 'course',
                title: data.title || 'دورة غير محددة',
                price: parseFloat(data.price) || 0,
                instructor: data.instructor || '',
                description: data.description || '',
                thumbnail: data.thumbnail || '',
                category: data.category || '',
                level: data.level || 'beginner',
                duration: data.duration || '',
                studentsCount: data.studentsCount || 0
            });
        });
        
        const pathsSnapshot = await db.collection('paths').get();
        availablePaths = [];
        
        pathsSnapshot.forEach(doc => {
            const data = doc.data();
            availablePaths.push({
                id: doc.id,
                type: 'path',
                title: data.title || 'مسار غير محدد',
                price: parseFloat(data.price) || 0,
                instructor: data.instructor || '',
                description: data.description || '',
                thumbnail: data.thumbnail || '',
                coursesCount: data.coursesCount || 0,

                                    style="position: absolute; left: 5px; top: 50%; transform: translateY(-50%);

            preConfirm: () => {
                const slug = document.getElementById('userSlug').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const sendCredentials = document.getElementById('sendCredentials').checked;
                
                if (!slug || !email || !password) {
                    Swal.showValidationMessage('يرجى إكمال جميع البيانات');
                    return false;
                }
                
                if (!/^[a-z0-9-]+$/.test(slug)) {
                    Swal.showValidationMessage('المعرف يجب أن يحتوي على أحرف صغيرة وأرقام وشرطات فقط');

            const message = `
🎉 *مرحباً ${student.customer.name}*

تم إنشاء حسابك بنجاح! 

📧 *البريد:* ${formData.email}
🔑 *كلمة المرور:* ${formData.password}
🆔 *المعرف:* ${formData.slug}

🔗 *رابط الدخول:*
https://fouad-perspective.web.app/login

مع تحيات فريق منظور الفؤاد 💜
            `.trim();
            
            const whatsappUrl = `https://wa.me/${student.customer.whatsapp.replace(/[^0-9]/g, '')}?text=${encodeURIComponent(message)}`;
            setTimeout(() => window.open(whatsappUrl, '_blank'), 1500);
        }
        
        // رسالة النجاح
        await Swal.fire({
            icon: 'success',
            title: '✅ تم إنشاء الحساب بنجاح!',
            html: `
                <div style="text-align: right; background: linear-gradient(135deg, #F0FDF4, #DCFCE7); 
                            padding: 20px; border-radius: 15px;">
                    <h3 style="color: #166534; margin-bottom: 15px;">بيانات الحساب:</h3>
                    <div style="background: white; padding: 15px; border-radius: 10px;">
                        <p><strong>🆔 المعرف:</strong> ${formData.slug}</p>
                        <p><strong>📧 البريد:</strong> ${formData.email}</p>
                        <p><strong>🔑 كلمة المرور:</strong> <span style="font-family: monospace; background: #F3F4F6; padding: 5px; border-radius: 5px;">${formData.password}</span></p>
                    </div>

        if (!student.userId) {
            const result = await Swal.fire({
                icon: 'warning',

                text: 'يجب إنشاء حساب للطالب أولاً قبل تخصيص الدورة',

                confirmButtonText: 'إنشاء حساب الآن',
                cancelButtonText: 'إلغاء',

                await createAccount(studentId);

                                               border-radius: 10px;">

                                    <option value="6" selected>6 أشهر</option>
                                    <option value="12">سنة كاملة</option>
                                    <option value="unlimited">غير محدود</option>
                                </select>

                            <!-- ملاحظات -->

                                <label style="display: block; margin-bottom: 8px; color: #374151; font-weight: bold;">

                                </label>
                                <textarea id="notes" class="swal2-textarea"

                const startDate = document.getElementById('startDate').value;
                const accessPeriod = document.getElementById('accessPeriod').value;
                const notes = document.getElementById('notes').value;
                
                if (!startDate) {
                    Swal.showValidationMessage('يجب تحديد تاريخ البداية');
                    return false;
                }
                
                let endDate;
                if (accessPeriod === 'unlimited') {
                    endDate = new Date('2099-12-31').toISOString().split('T')[0];
                } else {
                    const start = new Date(startDate);
                    start.setMonth(start.getMonth() + parseInt(accessPeriod));
                    endDate = start.toISOString().split('T')[0];
                }
                
                return { startDate, endDate, notes };

            willOpen: () => { Swal.showLoading(); }
        });
        
        // إنشاء enrollment جديد
        const newEnrollment = EnrollmentManager.createEnrollment(student, formData);
        
        // تحديث الإجماليات المالية
        const paidAmount = EnrollmentManager.calculatePaidAmount(student);
        const remainingAmount = EnrollmentManager.calculateRemainingAmount(student);
        
        // إضافة أو تحديث enrollment
        let enrollments = [...existingEnrollments];
        const existingIndex = enrollments.findIndex(e => e.title === student.courseName);
        
        if (existingIndex !== -1) {
            enrollments[existingIndex] = { ...enrollments[existingIndex], ...newEnrollment, renewedAt: new Date().toISOString() };
        } else {
            enrollments.push(newEnrollment);
        }
        
        // تحديث المستخدم في Firebase
        await db.collection('users').doc(student.userId).update({
            enrollments: enrollments,
            'financial.totalPaid': userData.financial.totalPaid + paidAmount,
            'financial.totalDue': userData.financial.totalDue + remainingAmount,
            'financial.totalSavings': userData.financial.totalSavings + (student.totalSavings || 0),
            'timestamps.updatedAt': new Date().toISOString()
        });
        
        // تحديث individualStudents
        await db.collection('individualStudents').doc(studentId).update({
            courseAssigned: true,
            courseAssignedAt: new Date().toISOString(),
            'progress.courseAssignment': 100,
            'progress.totalProgress': 75
        });
        
        // رسالة النجاح
        await Swal.fire({
            icon: 'success',
            title: '✅ تم تخصيص الدورة بنجاح!',
            html: `
                <div style="text-align: right;">
                    <p><strong>الطالب:</strong> ${student.customer?.name}</p>
                    <p><strong>الدورة:</strong> ${student.courseName}</p>
                    <p><strong>الفترة:</strong> من ${new Date(formData.startDate).toLocaleDateString('ar-EG')} 
                       إلى ${new Date(formData.endDate).toLocaleDateString('ar-EG')}</p>
                </div>
            `,
            confirmButtonColor: '#10B981'
        });
        
        // تحديث العرض
        loadStudents();
        
    } catch (error) {
        console.error('خطأ في تخصيص الدورة:', error);
        Swal.fire({
            icon: 'error',
            title: 'خطأ!',
            text: error.message || 'حدث خطأ في تخصيص الدورة',
            confirmButtonColor: '#EF4444'
        });
    }
}
