<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ملف العميل — منظور الفؤاد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/fouad-ui.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="../js/fouad-ui.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="../js/admin-guard.js"></script>
<script src="../js/bot-client.js"></script>
<script src="../js/password-safe.js"></script>
<script src="../js/booking-money.js"></script>
<script src="../js/enrollment-access.js"></script>
<style>
/* ============ ملف العميل ============
   نفس هوية «المحراب الهادي» (css/fouad-ui.css). الصفحة دي ليها حاجة واحدة مميزة: رأس العميل،
   والباقي هادي ومنظم. مفيش كروت متكررة: كل قسم سطح واحد، والفواصل جواه خطوط رفيعة. */
html{direction:rtl}
body.fu{margin:0;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 96px}
.muted{color:var(--fu-muted)}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.ltr{direction:ltr;unicode-bidi:isolate}

/* أزرار */
.b{display:inline-flex;align-items:center;gap:7px;font:600 13.5px/1 var(--fu-font);padding:9px 14px;border-radius:9px;border:1px solid var(--fu-line-2);background:var(--fu-surface);color:var(--fu-ink);cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .12s,border-color .12s}
.b:hover{background:var(--fu-sunken)}
.b i{font-size:12.5px;opacity:.85}
.b.p{background:var(--fu-primary);border-color:var(--fu-primary);color:var(--fu-on)}
.b.p:hover{background:var(--fu-primary-2)}
.b.q{border-color:transparent;background:transparent;color:var(--fu-ink-2)}
.b.q:hover{background:var(--fu-sunken);color:var(--fu-ink)}
.b.d{color:var(--fu-danger)}
.b.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.b[disabled]{opacity:.5;cursor:not-allowed}
.ib{width:34px;height:34px;border-radius:9px;border:1px solid var(--fu-line);background:var(--fu-surface);color:var(--fu-ink-2);display:inline-grid;place-items:center;cursor:pointer;flex:none;text-decoration:none}
.ib:hover{background:var(--fu-sunken);color:var(--fu-ink)}
.lnk{border:0;background:none;padding:0;color:var(--fu-primary);font:600 13px var(--fu-font);cursor:pointer;text-decoration:none}
.lnk:hover{text-decoration:underline}
/* الروابط اللي شكلها زرار أو سطر: لونها لونها، مش لون الرابط العام بتاع اللوحة */
body.fu a.b{color:var(--fu-ink)} body.fu a.b.p{color:var(--fu-on)} body.fu a.hit{color:var(--fu-ink)} body.fu .hcon a{color:inherit} body.fu .dock a{color:var(--fu-ink-2)}

/* ============ البحث ============ */
.find{max-width:620px;margin:56px auto 0}
.find h1{font-size:28px;line-height:1.3;margin:0 0 6px;letter-spacing:-.01em}
.find>p{margin:0 0 22px;color:var(--fu-ink-2);font-size:15px}
.fbox{display:flex;align-items:center;gap:10px;background:var(--fu-surface);border:1px solid var(--fu-line-2);border-radius:14px;padding:6px 6px 6px 8px;box-shadow:var(--fu-shadow)}
.fbox:focus-within{border-color:var(--fu-primary)}
.fbox i{color:var(--fu-muted);padding-inline-start:10px}
.fbox input{flex:1;min-width:0;border:0;background:none;padding:10px 4px;font:500 16px var(--fu-font);color:var(--fu-ink)}
.fbox input:focus{outline:none}
.fres{margin-top:22px}
.fres h2{font-size:13px;font-weight:600;color:var(--fu-muted);margin:22px 0 8px}
.fres .list{background:var(--fu-surface);border:1px solid var(--fu-line);border-radius:14px;overflow:hidden}
.hit{display:flex;align-items:center;gap:12px;padding:12px 16px;color:var(--fu-ink);text-decoration:none;border-top:1px solid var(--fu-line)}
.hit:first-child{border-top:0}
.hit:hover{background:var(--fu-sunken)}
.hit b{display:block;font-size:15px;font-weight:600}
.hit small{display:block;color:var(--fu-muted);font-size:12.5px;margin-top:1px}
.hit .go{margin-inline-start:auto;color:var(--fu-muted);font-size:12px}
.note{padding:14px 16px;border-radius:12px;background:var(--fu-sunken);color:var(--fu-ink-2);font-size:14px}
.note.bad{background:var(--fu-danger-soft);color:var(--fu-danger)}
.av{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:16px;flex:none;background:var(--fu-primary-soft);color:var(--fu-primary)}

/* ============ رأس العميل ============ */
.head{position:relative;background:var(--fu-surface);border:1px solid var(--fu-line);border-radius:18px;box-shadow:var(--fu-shadow);overflow:hidden}
.head::before{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:5px;background:var(--fu-primary)}
.head.is-off::before{background:var(--fu-line-2)}
.head.is-test::before{background:repeating-linear-gradient(180deg,var(--fu-accent) 0 10px,transparent 10px 18px)}
.htop{display:flex;gap:18px;align-items:flex-start;padding:22px 26px 18px}
.hav{width:64px;height:64px;border-radius:18px;background:var(--fu-primary-soft);color:var(--fu-primary);display:grid;place-items:center;font-size:27px;font-weight:700;flex:none}
.head.is-off .hav{background:var(--fu-sunken);color:var(--fu-muted)}
.hid{flex:1;min-width:0}
.hname{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hname h1{margin:0;font-size:28px;line-height:1.25;font-weight:700;letter-spacing:-.015em}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.hcon{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:8px;font-size:14px;color:var(--fu-ink-2)}
.hcon a,.hcon button{color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:0;font:inherit;cursor:pointer}
.hcon a:hover,.hcon button:hover{color:var(--fu-primary)}
.hcon i{color:var(--fu-muted);font-size:12.5px}
.hact{display:flex;gap:6px;flex:none;align-items:center}
.ledger{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--fu-line);background:var(--fu-paper)}
.lg{padding:14px 26px 15px;border-inline-start:1px solid var(--fu-line);min-width:0}
.lg:first-child{border-inline-start:0}
.lg span{display:block;font-size:12.5px;color:var(--fu-muted);margin-bottom:3px}
.lg b{display:block;font-size:21px;font-weight:700;line-height:1.3;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg b small{font-size:13px;font-weight:500;color:var(--fu-muted)}
.lg.bad b{color:var(--fu-danger)}
.lg.ok b{color:var(--fu-primary)}
.lg.dim b{color:var(--fu-muted);font-weight:600}

/* ============ محتاج انتباهك ============ */
.att{margin-top:16px;background:var(--fu-surface);border:1px solid var(--fu-line);border-radius:16px;overflow:hidden}
.att>h2{margin:0;padding:13px 20px;font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--fu-line)}
.att>h2 .c{background:var(--fu-accent);color:var(--fu-on);border-radius:99px;font-size:11.5px;line-height:19px;padding:0 7px}
.ar{display:flex;align-items:center;gap:14px;padding:12px 20px 12px 16px;border-top:1px solid var(--fu-line);position:relative}
.ar:first-of-type{border-top:0}
.ar::before{content:'';position:absolute;inset-inline-start:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--fu-line-2)}
.ar.k-bad::before{background:var(--fu-danger)}
.ar.k-wait::before{background:var(--fu-accent)}
.ar.k-info::before{background:var(--fu-info)}
.ar .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;font-size:13px;background:var(--fu-sunken);color:var(--fu-ink-2)}
.ar.k-bad .ic{background:var(--fu-danger-soft);color:var(--fu-danger)}
.ar.k-wait .ic{background:var(--fu-accent-soft);color:var(--fu-accent)}
.ar.k-info .ic{background:var(--fu-info-soft);color:var(--fu-info)}
.ar .t{flex:1;min-width:0;font-size:14px;line-height:1.55}
.ar .t b{font-weight:600}
.ar .t small{display:block;color:var(--fu-muted);font-size:12.5px}
.ar .a{display:flex;gap:6px;flex:none}

/* ============ التبويبات ============ */
.tabs{display:flex;gap:4px;margin:22px 0 18px;border-bottom:1px solid var(--fu-line);overflow-x:auto;scrollbar-width:none;position:sticky;top:var(--fu-nav-h,56px);background:var(--fu-paper);z-index:20}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:13px 14px 12px;font:600 14.5px var(--fu-font);color:var(--fu-muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tabs button:hover{color:var(--fu-ink)}
.tabs button[aria-selected="true"]{color:var(--fu-ink);border-bottom-color:var(--fu-primary)}
.tabs .c{font-size:12px;color:var(--fu-muted);font-weight:500}
.pane{display:none}
.pane.on{display:block}

/* ============ الأسطح ============ */
.cols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
.sf{background:var(--fu-surface);border:1px solid var(--fu-line);border-radius:16px}
.sf+.sf{margin-top:18px}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 20px 0}
.sh h2{margin:0;font-size:15.5px;font-weight:700}
.sh .x{display:flex;gap:6px;align-items:center}
.sb{padding:12px 20px 18px}
.side{background:var(--fu-sunken);border:0}
.side .row{border-color:var(--fu-line-2)}
.side .b:not(.p){background:var(--fu-surface)}

/* صفوف البيانات */
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--fu-line);min-height:24px}
.row:first-child{border-top:0}
.row .k{width:118px;flex:none;color:var(--fu-muted);font-size:13.5px}
.row .v{flex:1;min-width:0;font-size:14.5px;font-weight:500;word-break:break-word}
.row .v.none{color:var(--fu-muted);font-weight:400}
.row .e{flex:none;opacity:.0;transition:opacity .12s}
.row:hover .e,.row:focus-within .e,.row .e:focus-visible{opacity:1}
.row.ed .v{display:flex;gap:6px;flex-wrap:wrap}
.row.ed input,.row.ed select{flex:1;min-width:160px;border:1px solid var(--fu-primary);border-radius:8px;padding:8px 10px;font:500 14.5px var(--fu-font);background:var(--fu-surface);color:var(--fu-ink)}
.row.ed input:focus,.row.ed select:focus{outline:2px solid var(--fu-primary-soft)}
.row .hint{flex-basis:100%;font-size:12.5px;color:var(--fu-accent)}
@media (hover:none){.row .e{opacity:1}}

/* المحادثة */
.chat{display:grid;gap:8px}
.msg{max-width:84%;padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.6;background:var(--fu-sunken);white-space:pre-line;word-break:break-word}
.msg.me{justify-self:end;background:var(--fu-primary-soft)}
.msg.bot{justify-self:end;background:var(--fu-paper);border:1px dashed var(--fu-line-2)}
.msg small{display:block;color:var(--fu-muted);font-size:11.5px;margin-top:2px}

/* الخزنة */
.vault{border-top:1px solid var(--fu-line-2);margin-top:4px;padding-top:14px}
.vault .lab{font-size:13px;color:var(--fu-muted);margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.reveal{display:flex;align-items:center;gap:12px;background:var(--fu-surface);border:1px solid var(--fu-primary);border-radius:12px;padding:12px 14px}
.reveal .pw{flex:1;min-width:0;font-size:22px;font-weight:700;letter-spacing:.04em;direction:ltr;text-align:left;font-variant-numeric:tabular-nums;word-break:break-all}
.ring{width:34px;height:34px;flex:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3.5}
.ring .bg{stroke:var(--fu-line)}
.ring .fg{stroke:var(--fu-primary);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.racts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.more{margin-top:14px;border-top:1px solid var(--fu-line-2);padding-top:10px;display:grid;gap:2px}
.more .b{justify-content:flex-start;width:100%;background:none!important;border-color:transparent}
.more .b:hover{background:var(--fu-surface)!important}

/* الملاحظات */
.notes{display:grid;gap:8px}
.nt{background:var(--fu-surface);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.6;white-space:pre-line;border:1px solid var(--fu-line)}
.nt.pin{border-color:var(--fu-accent);background:var(--fu-accent-soft)}
.nt.done{opacity:.6}
.nt .m{display:flex;gap:10px;align-items:center;margin-top:6px;font-size:12px;color:var(--fu-muted)}
.nt .m .lnk{font-size:12px;color:var(--fu-ink-2)}
.nadd{display:grid;gap:8px;margin-top:10px}
.nadd textarea{width:100%;box-sizing:border-box;min-height:64px;border:1px solid var(--fu-line-2);border-radius:10px;padding:9px 11px;font:500 14px/1.6 var(--fu-font);background:var(--fu-surface);color:var(--fu-ink);resize:vertical}
.nadd textarea:focus{outline:none;border-color:var(--fu-primary)}
.nadd .r{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--fu-ink-2)}

/* ============ الكورسات ============ */
.crs{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;padding:16px 20px;border-top:1px solid var(--fu-line);align-items:start}
.crs:first-child{border-top:0}
.crs .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--fu-primary-soft);color:var(--fu-primary)}
.crs.off .ic{background:var(--fu-sunken);color:var(--fu-muted)}
.crs.pz .ic{background:var(--fu-info-soft);color:var(--fu-info)}
.crs h3{margin:0;font-size:16px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crs .d{font-size:13px;color:var(--fu-ink-2);margin-top:4px}
.crs .d span+span::before{content:'،';margin-inline-end:5px}
.crs .pg{display:flex;align-items:center;gap:10px;margin-top:9px;font-size:12.5px;color:var(--fu-muted)}
.bar{flex:1;max-width:260px;height:6px;border-radius:99px;background:var(--fu-sunken);overflow:hidden}
.bar i{display:block;height:100%;background:var(--fu-primary);border-radius:99px}
.crs .a{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sub{margin:-6px 20px 0 78px;padding:0 0 12px;font-size:13px;color:var(--fu-muted)}
.sub b{color:var(--fu-ink-2);font-weight:600}

/* ============ الفلوس ============ */
.mny{padding:18px 20px;border-top:1px solid var(--fu-line)}
.mny:first-child{border-top:0}
.mny .t{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.mny h3{margin:0;font-size:16px;font-weight:700}
.mny .w{font-size:12.5px;color:var(--fu-muted);margin-top:2px}
.fig{margin-top:12px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.fig b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.fig span{color:var(--fu-muted);font-size:13.5px}
.meter{height:8px;border-radius:99px;background:var(--fu-sunken);overflow:hidden;margin:9px 0 12px;max-width:520px}
.meter i{display:block;height:100%;background:var(--fu-primary);border-radius:99px}
.sched{width:100%;border-collapse:collapse;font-size:13.5px}
.sched th{text-align:right;color:var(--fu-muted);font-weight:500;font-size:12.5px;padding:7px 8px;border-bottom:1px solid var(--fu-line)}
.sched td{padding:9px 8px;border-bottom:1px solid var(--fu-line)}
.sched tr:last-child td{border-bottom:0}
.sched td:first-child,.sched th:first-child{padding-inline-start:0}
.inl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;padding:10px 12px;border-radius:10px;font-size:13.5px;background:var(--fu-accent-soft);color:var(--fu-accent)}
.inl.info{background:var(--fu-info-soft);color:var(--fu-info)}
.inl span{flex:1}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-bottom:1px solid var(--fu-line)}
.totals div{padding:14px 20px;border-inline-start:1px solid var(--fu-line)}
.totals div:first-child{border-inline-start:0}
.totals span{display:block;font-size:12.5px;color:var(--fu-muted)}
.totals b{font-size:19px;font-variant-numeric:tabular-nums}

/* ============ التقدم ============ */
.stepper{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:6px 0 4px}
.stepper i{height:8px;border-radius:99px;background:var(--fu-sunken)}
.stepper i.on{background:var(--fu-primary)}
.side .stepper i:not(.on){background:var(--fu-line-2)}
.stg{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stg b{font-size:19px}
.pts{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--fu-line);margin:0 -20px}
.pts>div{padding:14px 20px;border-inline-start:1px solid var(--fu-line)}
.pts>div:first-child{border-inline-start:0}
.pts span{display:block;font-size:12.5px;color:var(--fu-muted)}
.pts b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.pts .acts{margin-top:8px}
.hist{border-top:1px solid var(--fu-line);margin:0 -20px;padding:4px 20px 0}
.hr{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--fu-line);font-size:13.5px}
.hr:first-child{border-top:0}
.hr .amt{width:62px;flex:none;font-weight:700;font-variant-numeric:tabular-nums;text-align:left;direction:ltr}
.hr .amt.p{color:var(--fu-primary)} .hr .amt.n{color:var(--fu-danger)}
.hr .x{flex:1;min-width:0}
.hr .x small{display:block;color:var(--fu-muted);font-size:12px}
.bdgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bdg{border:1px solid var(--fu-line);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;position:relative}
.bdg .e{font-size:24px;line-height:1}
.bdg b{display:block;font-size:13.5px;line-height:1.35}
.bdg small{display:block;font-size:11.5px;color:var(--fu-muted)}
.bdg .rm{position:absolute;top:6px;inset-inline-end:6px;opacity:0}
.bdg:hover .rm,.bdg .rm:focus-visible{opacity:1}
.lrn{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:14px 0;border-top:1px solid var(--fu-line);align-items:center}
.lrn:first-child{border-top:0}
.lrn h3{margin:0;font-size:15px}
.lrn .d{font-size:12.5px;color:var(--fu-muted)}

/* ============ السجل ============ */
.flt{display:flex;gap:6px;flex-wrap:wrap;padding:14px 20px 0}
.flt button{border:1px solid var(--fu-line);background:var(--fu-surface);border-radius:99px;padding:5px 12px;font:500 13px var(--fu-font);cursor:pointer;color:var(--fu-ink-2)}
.flt button[aria-pressed="true"]{background:var(--fu-ink);color:var(--fu-paper);border-color:var(--fu-ink)}
.tl{padding:6px 20px 18px}
.tlm{font-size:12.5px;color:var(--fu-muted);font-weight:600;margin:18px 0 4px}
.ev{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;padding:8px 0}
.ev .dot{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:12px;background:var(--fu-sunken);color:var(--fu-ink-2)}
.ev.k-pay .dot{background:var(--fu-primary-soft);color:var(--fu-primary)}
.ev.k-course .dot{background:var(--fu-info-soft);color:var(--fu-info)}
.ev.k-pts .dot{background:var(--fu-accent-soft);color:var(--fu-accent)}
.ev.k-badge .dot{background:var(--fu-violet-soft);color:var(--fu-violet)}

    <form class="fbox" id="findForm" autocomplete="off" role="search">

  <div class="dh"><div style="flex:1"><h2 id="dlgT"></h2><p id="dlgS"></p></div><button class="ib" value="cancel" type="submit" aria-label="اقفل" formnovalidate><i class="fas fa-xmark"></i></button></div>

</form></dialog>

<!-- لوحة الحجز: نفس درج صفحة الحجوزات -->

  <div class="bkh"><b id="bkTitle">الحجز</b><a class="ib" id="bkOut" target="_blank" rel="noopener" title="افتحها في صفحة الحجوزات"><i class="fas fa-up-right-from-square"></i></a><button class="ib" id="bkClose" type="button" title="اقفل"><i class="fas fa-xmark"></i></button></div>
  <iframe id="bkFrame" title="تفاصيل الحجز"></iframe>
</div>
<script>
/* ==================== ملف العميل ====================
   القراية: وإنت بتفتح الملف بيتقري ملف العميل (ومتابَع لو اتغيّر) + حجوزاته وإيصالاته + آخر ٣ رسايل + ملاحظاتك
   + احتمال التكرار. كل تبويب تاني بيتقري لما تفتحه بس، وأي قايمة طويلة بتظهر على دفعات.
   الكتابة: مفيش ولا كتابة وإنت بتفتح الملف. كل تعديل = التعديل نفسه + سطر في client_log/{id}. */
(function () {
  'use strict';
  var BOT = 'https://us-central1-fouad-perspective.cloudfunctions.net/telegramBot';
  var DAY = 86400000;
  var $ = function (id) { return document.getElementById(id); };
  var E = function (v) { return String(v == null ? '' : v).replace(/[&<>"'`]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '`': '&#96;' }[c]; }); };
  var fmt = function (n) { return Math.round(Number(n) || 0).toLocaleString('ar-EG'); };
  var egp = function (n) { return fmt(n) + ' ج.م'; };
  var db, FV, ADMIN = 'admin';
  function ms(v) {
    if (!v) return 0;
    if (typeof v === 'number') return v;
    if (typeof v.toDate === 'function') return v.toDate().getTime();
    if (typeof v === 'object' && typeof v.seconds === 'number') return v.seconds * 1000;
    var t = Date.parse(v); return isNaN(t) ? 0 : t;
  }
  function day(v) { var t = ms(v); return t ? new Date(t).toLocaleDateString('ar-EG', { timeZone: 'Africa/Cairo', day: 'numeric', month: 'long', year: 'numeric' }) : '—'; }
  function dayShort(v) { var t = ms(v); return t ? new Date(t).toLocaleDateString('ar-EG', { timeZone: 'Africa/Cairo', day: 'numeric', month: 'short' }) : '—'; }
  function clock(v) { var t = ms(v); return t ? new Date(t).toLocaleTimeString('ar-EG', { timeZone: 'Africa/Cairo', hour: 'numeric', minute: '2-digit' }) : ''; }
  function rel(v) {
    var t = ms(v); if (!t) return '';
    var m = Math.round((Date.now() - t) / 60000);
    if (m < 1) return 'دلوقتي'; if (m < 60) return 'من ' + fmt(m) + ' دقيقة';
    var h = Math.round(m / 60); if (h < 24) return 'من ' + fmt(h) + ' ساعة';
    var d = Math.round(h / 24); if (d === 1) return 'امبارح'; if (d < 31) return 'من ' + fmt(d) + ' يوم';
    return day(t);
  }
  function waNum(p) { var d = String(p || '').replace(/\D/g, ''); if (d.indexOf('00') === 0) d = d.slice(2); if (d.length === 11 && d[0] === '0') d = '2' + d; return d; }
  function phoneVariants(p) {
    var d = String(p || '').replace(/\D/g, ''); if (d.length < 7) return [];
    var l10 = d.slice(-10);
    return [String(p).trim(), d, '0' + l10, '20' + l10, '+20' + l10].filter(function (x, i, a) { return x && a.indexOf(x) === i; }).slice(0, 10);
  }
  function iso() { return new Date().toISOString(); }
  function copy(text, label) {
    try { navigator.clipboard.writeText(text).then(function () { FU.toast(label || 'اتنسخ'); }, function () { FU.toast('مقدرتش أنسخ. انسخه بإيدك', { type: 'bad' }); }); }
    catch (e) { FU.toast('مقدرتش أنسخ. انسخه بإيدك', { type: 'bad' }); }
  }
  function api(path, body) {
    return botFetch(BOT + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { j.status = r.status; return j; }); },
            function () { return { ok: false, error: 'network' }; });
  }
  var ERR = {
    network: 'مفيش اتصال بالسيرفر. اتأكد من النت وجرّب تاني.', server: 'السيرفر ما قدرش يكمّل العملية. جرّب تاني بعد دقيقة.',
    'not-found': 'العميل ده مش موجود.', 'no-telegram': 'العميل ده مالوش محادثة تليجرام متربطة بحجوزاته.',
    blocked: 'العميل قافل البوت، فالرسالة ما وصلتش. ابعتها واتساب.', 'send-failed': 'الرسالة ما اتبعتتش على التليجرام.',
    'no-auth': 'العميل ده مالوش حساب دخول لسه.', 'bad-email': 'الإيميل مكتوب غلط.', 'email-used-auth': 'الإيميل ده عليه حساب دخول تاني.',
    'weak-pin': 'الرقم السري لازم يكون من ٦ لـ ١٢ رقم.', 'vault-broken': 'النسخة المحفوظة بايظة. حط باسورد جديد.',
    'already-merged': 'الحساب ده اتدمج قبل كده.'
  };
  function errText(j) {
    if (!j) return ERR.server;
    if (j.status === 401 || j.status === 403 && !j.error) return 'السيرفر رفض. ادخل بحساب الأدمن تاني.';
    if (j.status === 404 && !j.error) return 'السيرفر لسه ما اتحدّثش بالخاصية دي.';
    return ERR[j.error] || ERR.server;
  }

  /* ==================== الحالة ==================== */
  var S = {
    id: null, u: null, unsub: null, first: true,
    bk: [], loose: [], rc: [], bkReady: false,
    chatId: null, chat: null, msgs: null,
    notes: null, log: null, info: null, dups: [],
    coupons: null, courseDocs: {}, lessonsHist: null,
    tab: 'overview', logF: 'all', logN: 40, histN: 12, pass: null
  };
  var TABS = ['overview', 'courses', 'money', 'progress', 'log'];
  (function () { var t = new URLSearchParams(location.search).get('tab'); if (TABS.indexOf(t) > -1) S.tab = t; })();
  function U() { return S.u || {}; }
  function P() { return U().personalInfo || {}; }
  function ens() { return Array.isArray(U().enrollments) ? U().enrollments : []; }
  function est(e) { try { return EnrollmentAccess.status(e); } catch (x) { return { state: 'unlimited', open: true }; } }
  function cname(e) { return (e && (e.title || e.courseName)) || 'كورس'; }
  function status() { return (U().accountStatus || {}).status || ''; }
  function isTest() { return !!(U().metadata || {}).isTest; }

  /* ==================== التحميل ==================== */
  function boot(ctx) {
    db = ctx.db; FV = firebase.firestore.FieldValue; ADMIN = (ctx.user && ctx.user.email) || 'admin';
    var qs = new URLSearchParams(location.search);
    var id = qs.get('id');
    if (id) openClient(id); else showFind(qs.get('q'));
  }

  function openClient(id) {
    S.id = id;
    if (S.unsub) S.unsub();
    S.unsub = db.collection('users').doc(id).onSnapshot(function (snap) {
      if (!snap.exists) { if (S.first) { showFind(null, id); } else FU.toast('الملف ده اتمسح أو اتنقل', { type: 'bad' }); return; }
      var prev = S.u;
      S.u = snap.data() || {};
      if (S.first) {
        S.first = false;
        $('boot').hidden = true; $('find').hidden = true; $('file').hidden = false; $('dock').hidden = false;
        remember();
        loadRelated();
      } else if (prev && JSON.stringify(prev.enrollments || []) !== JSON.stringify(S.u.enrollments || [])) {
        loadBookings();          // اتضاف أو اتغيّر كورس: الحجوزات المتربطة ممكن تكون اتغيّرت
      }
      render();
    }, function (e) {
      console.error(e);
      $('boot').innerHTML = '<div class="note bad">مقدرتش أفتح الملف: ' + E(e.code === 'permission-denied' ? 'القواعد رفضت. ادخل بحساب الأدمن.' : e.message) + '</div>';
    });
  }
  function remember() {
    try {
      var rec = JSON.parse(localStorage.getItem('fu_recent_clients') || '[]').filter(function (x) { return x.id !== S.id; });
      rec.unshift({ id: S.id, name: P().name || '', t: Date.now() });
      localStorage.setItem('fu_recent_clients', JSON.stringify(rec.slice(0, 8)));
    } catch (e) {}
  }

  function loadRelated() {
    loadBookings();
    loadNotes();
    loadDups();
    loadInfo();
  }

  // الحجوزات: المتربطة بالحساب (userId أو رقم الحجز في الكورس) + اللي بنفس الرقم ومش متربطة
  async function loadBookings() {
    var id = S.id, found = new Map(), loose = new Map();
    function put(map, col, d) { if (!map.has(d.id)) map.set(d.id, Object.assign({ id: d.id, _col: col }, d.data())); }
    try {
      var qs = [
        db.collection('tempBookings').where('userId', '==', id).get().then(function (s) { s.forEach(function (d) { put(found, 'tempBookings', d); }); }),
        db.collection('individualStudents').where('userId', '==', id).get().then(function (s) { s.forEach(function (d) { put(found, 'individualStudents', d); }); })
      ];
      var v = phoneVariants(P().whatsapp);
      if (v.length) qs.push(db.collection('tempBookings').where('customer.whatsapp', 'in', v).limit(15).get().then(function (s) { s.forEach(function (d) { put(loose, 'tempBookings', d); }); }));
      await Promise.all(qs.map(function (p) { return p.catch(function (e) { console.warn('حجوزات', e && e.message); }); }));
      var missing = [];
      ens().forEach(function (e) { if (e.bookingId && !e.includedInPackage && !found.has(e.bookingId) && missing.indexOf(e.bookingId) < 0) missing.push(e.bookingId); });
      await Promise.all(missing.map(async function (bid) {
        try {
          var d = await db.collection('tempBookings').doc(bid).get(); var col = 'tempBookings';
          if (!d.exists) { d = await db.collection('individualStudents').doc(bid).get(); col = 'individualStudents'; }
          if (d.exists) put(found, col, d); else found.set(bid, { id: bid, missing: true });
        } catch (e) {}
      }));
      // نفس الحجز ممكن يبقى في المجموعتين (حجز مؤقت اتحوّل لطالب): بنعرض واحد بس، والمتحوّل له الأولوية
      var arr = Array.from(found.values()).filter(function (b) { return !(b._col === 'tempBookings' && b.transferredTo && found.has(b.transferredTo)); });
      S.bk = arr.sort(function (a, b) { return ms(b.createdAt || b.timestamp) - ms(a.createdAt || a.timestamp); });
      S.loose = Array.from(loose.values()).filter(function (b) { return !found.has(b.id) && !b.userId && b.status !== 'cancelled' && !b.archivedAsTest && !(b.transferredTo && found.has(b.transferredTo)); });
      S.bkReady = true;
      pickChat();
      await loadReceipts();
    } catch (e) { console.error('الحجوزات', e); S.bkReady = true; }
    render();
  }
  async function loadReceipts() {
    var ids = S.bk.filter(function (b) { return !b.missing; }).map(function (b) { return b.id; });
    var out = [];
    for (var i = 0; i < ids.length; i += 10) {
      try {
        var s = await db.collection('receipts').where('bookingId', 'in', ids.slice(i, i + 10)).get();
        s.forEach(function (d) { var r = d.data(); if (r.status === 'pending') out.push(Object.assign({ id: d.id }, r)); });
      } catch (e) { console.warn('الإيصالات', e && e.message); }
    }
    S.rc = out;
  }

  });
  document.addEventListener('submit', function (e) {
    if (e.target.id === 'noteForm') {
      e.preventDefault();
      var txt = $('noteT').value.trim(); if (!txt) return;
      var btn = e.target.querySelector('button'); btn.disabled = true;
      addNote(txt.slice(0, 2000), $('noteP').checked).catch(function (er) { FU.toast('ما اتحفظتش: ' + er.message, { type: 'bad' }); btn.disabled = false; });
    } else if (e.target.id === 'findForm') { e.preventDefault(); find($('findQ').value); }
  });
  $('bkClose').onclick = closeBk; $('bkVeil').onclick = closeBk;
  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin || !e.data || e.data.fu !== 'booking-changed') return;
    loadBookings();
  });

  AdminGuard.ready().then(boot).catch(function (e) { $('boot').innerHTML = '<div class="note bad">' + E(e && e.message || 'مقدرتش أبدأ') + '</div>'; });

  // للاختبارات الآلية بس
  window.__client = { S: S, render: render, setTab: setTab };
})();
</script>
</body>
</html>
