async function showInstallmentSchedule(bookingId){
  const b=findBooking(x=>x.id===bookingId);
  if(!b?.paymentDetails?.installmentSchedule){ Swal.fire('خطأ!','لا توجد بيانات أقساط','error'); return; }
  const s=b.paymentDetails.installmentSchedule; const now=new Date();
  let html='<div style="text-align:right"><div style="background:var(--fu-info-soft);padding:14px;border-radius:10px;margin-bottom:16px"><h3>'+esc(b.customer?.name||'')+'</h3><p>📚 '+esc(b.courseName||'')+' | 💰 '+(b.paymentDetails.totalAmount||0).toLocaleString('ar-EG')+' ج.م</p></div><div style="overflow-x:auto"><table class="installment-table"><thead><tr><th>القسط</th><th>المبلغ</th><th>التاريخ</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>';
  s.forEach((inst,i)=>{
    const due=new Date(inst.dueDate); const days=Math.floor((now-due)/86400000);
    const sc=inst.status==='paid'?'ist-paid':days>0?'ist-overdue':days>-7?'ist-due':'ist-upcoming';
    const st=inst.status==='paid'?'✅ مدفوع':days>0?'🔴 متأخر '+days+' يوم':days>-7?'⏰ قادم':'📅 مستقبلي';
    html+='<tr><td style="font-weight:800">'+(i===0?'أولى':inst.installmentNumber)+'</td><td style="font-weight:800;color:#DC2626">'+inst.amount.toLocaleString('ar-EG')+' ج.م</td><td>'+due.toLocaleDateString('ar-EG',{day:'numeric',month:'long',year:'numeric'})+'</td><td><span class="ist-badge '+sc+'">'+st+'</span></td><td>'+(inst.status!=='paid'?'<button onclick="markInstallmentAsPaid(\''+bookingId+'\','+i+')" style="padding:6px 12px;background:#3B82F6;color:#fff;border:none;border-radius:6px;cursor:pointer">تسجيل</button>':'✓')+'</td></tr>';
  });
  html+='</tbody><tfoot><tr style="background:var(--fu-sunken);font-weight:800"><td colspan="5" style="padding:14px"><div style="display:flex;justify-content:space-around;flex-wrap:wrap;gap:10px"><div>الإجمالي: <span style="color:#3B82F6">'+(b.paymentDetails.totalAmount||0).toLocaleString('ar-EG')+'</span></div><div>المدفوع: <span style="color:#10B981">'+(b.paymentDetails.paidAmount||0).toLocaleString('ar-EG')+'</span></div><div>المتبقي: <span style="color:#DC2626">'+(b.paymentDetails.remainingAmount||0).toLocaleString('ar-EG')+'</span></div></div></td></tr></tfoot></table></div></div>';
  Swal.fire({title:'📋 جدول الأقساط الكامل',html,width:'95%',showCloseButton:true,showConfirmButton:false});
}

/* === تسجيل دفع قسط مع التوزيع التلقائي للمبلغ الزائد === */
async function markInstallmentAsPaid(bookingId,idx){
  // نبحث في tempBookings ثم individualStudents (للحجوزات المحوّلة)
  let collection='tempBookings';
  let doc=await dbGet('tempBookings',bookingId);
  if(!doc.exists && !DEMO_MODE){ doc=await db.collection('individualStudents').doc(bookingId).get(); collection='individualStudents'; }
  if(!doc.exists){ Swal.fire('خطأ!','لم يتم العثور على الحجز','error'); return; }
  const b={id:doc.id,...doc.data()};

  if(!b.paymentDetails.remainingAmount||isNaN(b.paymentDetails.remainingAmount)||b.paymentDetails.remainingAmount<0)
    b.paymentDetails.remainingAmount=(b.paymentDetails.totalAmount||0)-(b.paymentDetails.paidAmount||0);

  const inst=b.paymentDetails.installmentSchedule[idx];
  const remainingTotal=b.paymentDetails.remainingAmount||0;

  const r=await Swal.fire({
    title:'✅ تسجيل '+BookingMoney.instName(inst.installmentNumber!=null?inst.installmentNumber:idx),
    html:'<div style="text-align:right">'
      +'<div style="background:var(--fu-info-soft);padding:14px;border-radius:10px;margin-bottom:16px;border:2px solid #3B82F6"><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><span style="color:var(--fu-muted)">العميل:</span><br><strong>'+esc(b.customer?.name||'')+'</strong></div><div><span style="color:var(--fu-muted)">رقم القسط:</span><br><strong style="color:#3B82F6">'+(inst.installmentNumber+1)+' من '+b.paymentDetails.totalInstallments+'</strong></div><div><span style="color:var(--fu-muted)">قيمة القسط:</span><br><strong style="color:#DC2626">'+inst.amount.toLocaleString('ar-EG')+' ج.م</strong></div><div><span style="color:var(--fu-muted)">المتبقي الكلي:</span><br><strong style="color:#F59E0B">'+remainingTotal.toLocaleString('ar-EG')+' ج.م</strong></div></div></div>'
      +(inst.receiptReceived&&inst.receiptImageUrl?'<div style="background:var(--fu-primary-soft);padding:12px;border-radius:10px;margin-bottom:14px;border:2px solid #10B981"><p style="color:var(--fu-primary);font-weight:700;margin-bottom:8px"><i class="fas fa-check-circle"></i> الإيصال المرفق:</p><img src="'+inst.receiptImageUrl+'" style="max-width:100%;max-height:250px;border-radius:8px;cursor:pointer" onclick="window.open(\''+inst.receiptImageUrl+'\',\'_blank\')"></div>':'')
      +'<div style="background:var(--fu-surface);padding:14px;border-radius:10px;margin-bottom:14px;border:3px solid #8B5CF6"><label style="font-weight:800;display:block;margin-bottom:8px">💰 المبلغ المدفوع فعلياً: *</label><input type="number" id="actualPaidAmount" class="swal2-input" value="'+(inst.amount-BookingMoney.paidOn(inst))+'" data-inst="'+(inst.amount-BookingMoney.paidOn(inst))+'" data-rem="'+remainingTotal+'" style="width:90%;font-size:1.3rem;text-align:center;font-weight:800;color:#7C3AED;border:3px solid #8B5CF6" oninput="calcDistribution(\''+bookingId+'\','+idx+')"><div style="display:flex;gap:8px;margin-top:10px"><button type="button" onclick="document.getElementById(\'actualPaidAmount\').value='+inst.amount+';calcDistribution(\''+bookingId+'\','+idx+')" style="flex:1;padding:8px;background:#E0E7FF;border:2px solid #6366F1;border-radius:6px;cursor:pointer;font-weight:700;color:#4338CA">القسط فقط ('+inst.amount.toLocaleString('ar-EG')+')</button><button type="button" onclick="document.getElementById(\'actualPaidAmount\').value='+remainingTotal+';calcDistribution(\''+bookingId+'\','+idx+')" style="flex:1;padding:8px;background:var(--fu-accent-soft);border:2px solid #F59E0B;border-radius:6px;cursor:pointer;font-weight:700;color:#D97706">الباقي كله ('+remainingTotal.toLocaleString('ar-EG')+')</button></div></div>'
      +'<div id="distMsg" style="display:none;margin-bottom:14px"></div>'
      +'<div id="distPreview" style="display:none;background:var(--fu-primary-soft);padding:16px;border-radius:10px;margin-bottom:14px;border:3px solid #10B981"><h4 style="color:var(--fu-primary);margin:0 0 12px"><i class="fas fa-calculator"></i> 📊 التوزيع التلقائي للمبلغ الزائد</h4><div id="distDetails"></div></div>'
      +'<label style="font-weight:700;display:block;margin-bottom:6px">💳 طريقة الدفع: *</label><select id="instMethod" class="swal2-input" style="width:90%"><option value="">اختر</option><option value="vodafone">فودافون كاش</option><option value="instapay">انستاباي</option><option value="bank">تحويل بنكي</option><option value="card">بطاقة بنكية</option><option value="cash">كاش</option><option value="western_union">ويسترن يونيون</option><option value="other">أخرى</option></select>'
      +'<label style="font-weight:700;display:block;margin:12px 0 6px">📝 رقم المرجع: (اختياري)</label><input id="instRef" class="swal2-input" style="width:90%;direction:ltr">'
      +'<label style="font-weight:700;display:block;margin:12px 0 6px">📅 تاريخ الدفع:</label><input type="date" id="instDate" class="swal2-input" value="'+BookingMoney.cairoDateString(new Date())+'" style="width:90%">'
      +'</div>',
    width:'700px',showCancelButton:true,confirmButtonText:'✅ تأكيد الدفع',cancelButtonText:'إلغاء',confirmButtonColor:'#10B981',
    didOpen:()=>{ window.__instCtx={bookingId,idx,collection}; calcDistribution(bookingId,idx); },
    preConfirm:()=>{
      const m=document.getElementById('instMethod').value;
      const amt=parseFloat(document.getElementById('actualPaidAmount').value);
      if(!m){Swal.showValidationMessage('⚠️ اختر طريقة الدفع');return false;}
      if(!amt||amt<=0){Swal.showValidationMessage('⚠️ أدخل المبلغ المدفوع');return false;}
      if(amt>remainingTotal+0.5){Swal.showValidationMessage('⚠️ المبلغ أكبر من الباقي على الكورس كله ('+remainingTotal.toLocaleString('ar-EG')+' ج.م). لو العميل دفع زيادة، سجّل الباقي بس واكتب الزيادة في ملاحظة.');return false;}
      return {method:m,reference:document.getElementById('instRef').value||'لا يوجد',date:document.getElementById('instDate').value,actualAmount:amt};
    }
  });
  if(!r.isConfirmed) return;
  try{
    Swal.fire({title:'جاري تسجيل الدفع...',allowOutsideClick:false,didOpen:()=>Swal.showLoading()});
    const actual=r.value.actualAmount;
    const installmentAmount=inst.amount;
    // التاريخ ضهر اليوم بتوقيت القاهرة (كان بيتقري بتوقيت جرينتش فيطلع اليوم اللي قبله)
    const paidDate=new Date(r.value.date+'T12:00:00+03:00').toISOString();
    // القسط الجزئي بيتجمع: لو اتدفع على كذا مرة، بيتقفل لما المجموع يوصل لقيمته
    const before=BookingMoney.paidOn(inst);
    const cum=before+actual;
    inst.paidSoFar=Math.min(cum,installmentAmount);
    inst.status=cum>=installmentAmount?'paid':'partial';
    inst.paidAt=paidDate; inst.paymentMethod=r.value.method; inst.reference=r.value.reference; inst.paidBy='admin'; inst.actualPaidAmount=(inst.actualPaidAmount||0)+actual;
    inst.payments=(inst.payments||[]).concat([{amount:actual,date:paidDate,method:r.value.method,reference:r.value.reference}]);
    if(inst.receiptReceived){ inst.receiptProcessed=true; inst.receiptProcessedAt=new Date().toISOString(); }

    let extra=Math.max(0,cum-installmentAmount), paidCount=inst.status==='paid'?1:0;
    const distributionLog=[{installmentNumber:inst.installmentNumber+1,amount:Math.min(actual,installmentAmount-before),status:inst.status,isOriginal:true,newAmount:Math.max(0,installmentAmount-inst.paidSoFar)}];
    const covered=[{idx:idx,amount:Math.min(actual,installmentAmount-before),status:inst.status}];
    if(extra>0){
      // الزيادة بتروح للأقساط اللي بعده بالترتيب، من غير ما نغيّر قيمة أي قسط
      for(let i=idx+1;i<b.paymentDetails.installmentSchedule.length && extra>0;i++){
        const next=b.paymentDetails.installmentSchedule[i];
        if(next.status==='paid') continue;
        const need=Math.max(0,next.amount-BookingMoney.paidOn(next));
        const put=Math.min(need,extra);
        if(put<=0) continue;
        next.paidSoFar=BookingMoney.paidOn(next)+put;
        next.payments=(next.payments||[]).concat([{amount:put,date:paidDate,method:r.value.method+' (من دفعة سابقة)',reference:r.value.reference,linkedToInstallment:idx}]);
        if(next.paidSoFar>=next.amount){ next.status='paid'; next.paidAt=paidDate; next.paymentMethod=r.value.method+' (من دفعة سابقة)'; next.reference=r.value.reference; next.paidBy='admin'; next.paidFromExtra=true; next.linkedToInstallment=idx; paidCount++; }
        else next.status='partial';
        distributionLog.push({installmentNumber:next.installmentNumber+1,amount:put,status:next.status,fromExtra:true,newAmount:Math.max(0,next.amount-next.paidSoFar)});
        covered.push({idx:i,amount:put,status:next.status});
        extra-=put;
      }
    }
    const pd=b.paymentDetails;
    pd.paidInstallments=(pd.paidInstallments||0)+paidCount;
    pd.paidAmount=(isNaN(pd.paidAmount)?0:(pd.paidAmount||0))+actual;
    pd.remainingAmount=Math.max(0,(pd.totalAmount||0)-pd.paidAmount);
    if(pd.remainingAmount<=0){ pd.fullyPaid=true; pd.fullyPaidAt=new Date().toISOString(); }
    pd.paymentHistory=pd.paymentHistory||[];
    pd.paymentHistory.push({timestamp:new Date().toISOString(),actualAmount:actual,installmentAmount,extraAmount:actual-installmentAmount,distribution:distributionLog,method:r.value.method,reference:r.value.reference,by:'admin'});

    await dbUpdate(collection,bookingId,{paymentDetails:cleanDataForFirebase(pd)});

    /* رسالة تأكيد واحدة من البوت (بنفس أسماء الأقساط اللي الطالب شافها)، وبتقفل الإيصال وطلب التأجيل بتوع القسط ده */
    window.__lastNotify=null;
    if(!DEMO_MODE){
      try{
        const nr=await botFetch(TELEGRAM_BASE+'/installments/paid-notify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bookingId,idx,amount:actual,covered,receiptId:window.__rcReceiptId||null})});
        window.__lastNotify=await nr.json().catch(()=>({ok:false}));
        if(!nr.ok) window.__lastNotify.ok=false;
      }catch(e){ window.__lastNotify={ok:false,error:'network'}; }
    }
    window.__rcReceiptId=null;
    /* لو البوت ما ردش: الرسالة القديمة احتياطي، علشان الطالب ما يفضلش مستني */
    if(b.telegramChatId && !DEMO_MODE && !(window.__lastNotify&&window.__lastNotify.ok)){
      const name=(b.customer?.name||'').split(' ')[0]||'عميلنا العزيز';
      let msg;
      if(pd.fullyPaid){
        msg='🎊🎉 مبروك '+name+'! 🎉🎊\n\nتم إكمال دفع كامل مبلغ الدورة! ✅\n━━━━━━━━━━━━━━━━━━\n💰 المبلغ المدفوع: '+actual.toLocaleString('ar-EG')+' ج.م\n📅 التاريخ: '+new Date(r.value.date).toLocaleDateString('ar-EG')+'\n✅ إجمالي المبلغ: '+pd.totalAmount.toLocaleString('ar-EG')+' ج.م\n✅ المتبقي: 0 ج.م\n\n🎊 *تم سداد كامل المبلغ!*\n━━━━━━━━━━━━━━━━━━\nشكراً لالتزامك والدفع في الوقت المحدد! 💚\nمنظور الفؤاد';
      } else {
        msg=(distributionLog.length>1?'🎊':'🎉')+' شكراً لك '+name+'!\n\nتم استلام وتأكيد دفعتك بنجاح ✅\n━━━━━━━━━━━━━━━━━━\n💰 المبلغ المدفوع: *'+actual.toLocaleString('ar-EG')+' ج.م*\n📅 التاريخ: '+new Date(r.value.date).toLocaleDateString('ar-EG')+'\n💳 الطريقة: '+getPaymentMethodText(r.value.method)+'\n\n';
        if(distributionLog.length>1){ msg+='✨ *تم توزيع المبلغ تلقائياً:*\n'; distributionLog.forEach(l=>{ if(l.status==='paid') msg+='• القسط '+l.installmentNumber+': '+l.amount.toLocaleString('ar-EG')+' ج.م ✅\n'; else if(l.status==='partial') msg+='• القسط '+l.installmentNumber+': '+l.amount.toLocaleString('ar-EG')+' ج.م (متبقي '+l.newAmount.toLocaleString('ar-EG')+' ج.م)\n'; }); msg+='\n'; }
        msg+='📊 الأقساط: '+pd.paidInstallments+' من '+pd.totalInstallments+' مدفوع\n⏳ المتبقي: '+pd.remainingAmount.toLocaleString('ar-EG')+' ج.م\n';
        const next=b.paymentDetails.installmentSchedule.find(i=>i.status==='pending');
        if(next) msg+='📅 القسط القادم: '+next.amount.toLocaleString('ar-EG')+' ج.م في '+new Date(next.dueDate).toLocaleDateString('ar-EG')+'\n';
        msg+='━━━━━━━━━━━━━━━━━━\nشكراً لالتزامك 💚 منظور الفؤاد';
      }
      await sendTelegramMessage(b.telegramChatId,msg);
    }
    let succ='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center;margin-bottom:12px"><div style="padding:11px;background:var(--fu-info-soft);border-radius:8px"><div style="font-size:.82rem;color:var(--fu-muted)">المدفوع</div><div style="font-size:1.2rem;font-weight:800;color:#3B82F6">'+actual.toLocaleString('ar-EG')+'</div></div><div style="padding:11px;background:var(--fu-primary-soft);border-radius:8px"><div style="font-size:.82rem;color:var(--fu-muted)">الأقساط</div><div style="font-size:1.2rem;font-weight:800;color:#10B981">'+pd.paidInstallments+'/'+pd.totalInstallments+'</div></div><div style="padding:11px;background:var(--fu-accent-soft);border-radius:8px"><div style="font-size:.82rem;color:var(--fu-muted)">المتبقي</div><div style="font-size:1.2rem;font-weight:800;color:#DC2626">'+pd.remainingAmount.toLocaleString('ar-EG')+'</div></div></div>';
    {const ln=window.__lastNotify; const t=!b.telegramChatId?'الطالب مش متوصل بالتليجرام، بلّغه بالطريقة اللي تناسبك.':!ln?'':ln.ok&&ln.sent?'اتبعت التأكيد للطالب على التليجرام.':ln.error==='blocked'?'الطالب قافل البوت، فالتأكيد ما وصلوش. كلّمه واتساب.':ln.ok?'':'البوت ما ردش، فاتبعتت الرسالة القديمة بدالها.'; if(t) succ+='<div style="padding:10px;border-radius:8px;margin-bottom:10px;background:var(--fu-sunken,#f3f1ea);font-size:.92rem">'+t+'</div>';}
    if(paidCount>1) succ+='<div style="padding:10px;background:var(--fu-surface);border-radius:8px;border:1px solid #E5E7EB"><strong>📊 تم توزيع المبلغ على '+paidCount+' أقساط تلقائياً</strong></div>';
    Swal.fire({icon:'success',title:pd.fullyPaid?'🎊 تم إكمال الدفع!':'✅ تم تسجيل الدفع!',html:succ,confirmButtonColor:'#10B981'});
    reload();
  }catch(e){ console.error(e); Swal.fire('خطأ!','حدث خطأ: '+e.message,'error'); }

/* معاينة التوزيع داخل نافذة تسجيل القسط */
function calcDistribution(bookingId,idx){
  const input=document.getElementById('actualPaidAmount'); if(!input) return;
  const actual=parseFloat(input.value)||0;
  const installmentAmount=parseFloat(input.getAttribute('data-inst'))||0;
  const remainingTotal=parseFloat(input.getAttribute('data-rem'))||0;
  const msg=document.getElementById('distMsg'); const prev=document.getElementById('distPreview'); const det=document.getElementById('distDetails');
  msg.style.display='none'; prev.style.display='none';
  if(actual<=0){ msg.style.display='block'; msg.style.cssText='display:block;background:var(--fu-danger-soft);border:2px solid #DC2626;border-radius:10px;padding:14px;color:var(--fu-danger);font-weight:700'; msg.innerHTML='<i class="fas fa-exclamation-triangle"></i> يجب إدخال مبلغ أكبر من صفر'; input.style.borderColor='#DC2626'; return; }
  if(actual>installmentAmount){
    const b=findBooking(x=>x.id===bookingId)||(window.__instCtx?null:null);
    const booking=findBooking(x=>x.id===bookingId);
    const sched=booking?.paymentDetails?.installmentSchedule||[];
    let extra=actual-installmentAmount, items=[], count=1;
    for(let i=idx+1;i<sched.length;i++){
      const next=sched[i]; if(next.status==='paid'||extra<=0) continue;
      const need=Math.max(0,next.amount-BookingMoney.paidOn(next)); if(need<=0) continue;
      if(extra>=need){ items.push({n:next.installmentNumber+1,paid:need,full:true}); extra-=need; count++; }
      else { items.push({n:next.installmentNumber+1,paid:extra,orig:need,newAmt:need-extra,full:false}); extra=0; break; }
    }
    prev.style.display='block'; input.style.borderColor='#10B981'; input.style.background='#F0FDF4';
    let html='<div style="background:var(--fu-surface);padding:12px;border-radius:8px;margin-bottom:10px"><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center"><div style="padding:8px;background:var(--fu-info-soft);border-radius:6px"><div style="font-size:.8rem;color:var(--fu-muted)">المبلغ المدفوع</div><div style="font-size:1.3rem;font-weight:800;color:#3B82F6">'+actual.toLocaleString('ar-EG')+'</div></div><div style="padding:8px;background:var(--fu-accent-soft);border-radius:6px"><div style="font-size:.8rem;color:var(--fu-muted)">المبلغ الزائد</div><div style="font-size:1.3rem;font-weight:800;color:#F59E0B">'+(actual-installmentAmount).toLocaleString('ar-EG')+'</div></div></div></div>';
    if(items.length){ html+='<div style="background:var(--fu-surface);padding:12px;border-radius:8px"><h5 style="color:var(--fu-primary);margin-bottom:8px">📋 توزيع المبلغ على الأقساط:</h5>'; items.forEach(it=>{ html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:9px;margin-bottom:6px;border-radius:8px;background:'+(it.full?'#D1FAE5':'#FEF3C7')+';border-right:4px solid '+(it.full?'#10B981':'#F59E0B')+'"><div><strong>'+(it.full?'✅':'⚡')+' القسط '+it.n+'</strong>'+(!it.full?'<div style="font-size:.8rem;color:var(--fu-muted)">سيتبقى: '+it.newAmt.toLocaleString('ar-EG')+' ج.م</div>':'')+'</div><strong style="color:'+(it.full?'#059669':'#D97706')+'">'+it.paid.toLocaleString('ar-EG')+' ج.م</strong></div>'; }); html+='</div>'; }
    det.innerHTML=html;
  } else if(actual===installmentAmount){ msg.style.display='block'; msg.style.cssText='display:block;background:var(--fu-primary-soft);border:2px solid #10B981;border-radius:10px;padding:14px;color:var(--fu-primary);font-weight:700'; msg.innerHTML='<i class="fas fa-check-circle"></i> ✅ المبلغ مطابق للقسط المستحق'; input.style.borderColor='#10B981'; input.style.background='#F0FDF4'; }
  else { msg.style.display='block'; msg.style.cssText='display:block;background:var(--fu-accent-soft);border:2px solid #F59E0B;border-radius:10px;padding:14px;color:var(--fu-accent)'; msg.innerHTML='<strong><i class="fas fa-info-circle"></i> ⚠️ المبلغ أقل من القسط — سيُسجّل دفع جزئي</strong><div style="margin-top:6px">الفرق: '+(installmentAmount-actual).toLocaleString('ar-EG')+' ج.م</div>'; input.style.borderColor='#F59E0B'; input.style.background='#FFFBEB'; }
}

/* ============================================================
   مدير الأقساط الشهرية (فلاتر + تذكير فردي + تذكير جماعي + إعدادات)
============================================================ */
function calcInstallmentsStats(bookings){
  // نفس حساب js/booking-money.js: الأيام بتوقيت القاهرة، والمبلغ الباقي من القسط الجزئي بس
  const now=new Date(); const ym=BookingMoney.cairoDateString(now).slice(0,7);
  const minDays=parseInt(localStorage.getItem('installmentReminderMinDays')||'7');
  let s={total:0,totalAmount:0,paid:0,paidAmount:0,dueThisMonth:0,dueThisMonthAmount:0,overdue:0,overdueAmount:0,readyForReminder:0,recentlyReminded:0,receiptsReceived:0,monthlyIncome:0,dueIn3Days:0,dueIn7Days:0};
  bookings.forEach(b=>{ BookingMoney.summarize(b,now).rows.forEach(r=>{
    const inst=r.raw;
    s.total++; s.totalAmount+=r.amount;
    if(r.state==='paid'){ s.paid++; s.paidAmount+=r.amount; if(inst.paidAt && BookingMoney.cairoDateString(new Date(inst.paidAt)).slice(0,7)===ym) s.monthlyIncome+=r.amount; return; }
    if(r.dueDate && BookingMoney.cairoDateString(new Date(r.dueDate)).slice(0,7)===ym){ s.dueThisMonth++; s.dueThisMonthAmount+=r.left; }
    if(r.state==='overdue'){ s.overdue++; s.overdueAmount+=r.left; }
    if(r.daysUntil!==null && r.daysUntil<=3) s.dueIn3Days++;
    if(r.daysUntil!==null && r.daysUntil<=7) s.dueIn7Days++;
    const last=inst.reminders?.[inst.reminders.length-1];
    if(!last) s.readyForReminder++;
    else { const ds=BookingMoney.cairoDayDiff(new Date(last.sentAt),now); if(ds>=minDays||r.daysLate>7) s.readyForReminder++; else s.recentlyReminded++; }
    if(inst.receiptReceived) s.receiptsReceived++;
  }); });
  return s;
}

function buildInstList(bookings){
  let html=''; const now=new Date();
  const minDays=parseInt(localStorage.getItem('installmentReminderMinDays')||'7');
  bookings.forEach(b=>{(b.paymentDetails?.installmentSchedule||[]).forEach((inst,idx)=>{
    const due=new Date(inst.dueDate); const d=BookingMoney.cairoDayDiff(due,now); const left=inst.amount-BookingMoney.paidOn(inst);
    let cls='',icon='',txt='',overdue=false,canRemind=false,disable=false;
    if(inst.status==='paid'){ cls='ist-paid'; icon='✅'; txt='مدفوع '+new Date(inst.paidAt).toLocaleDateString('ar-EG'); disable=true; }
    else {
      if(d>0){ cls='ist-overdue'; icon='🔴'; txt='متأخر '+d+' يوم'; overdue=true; }
      else if(d>-7){ cls='ist-due'; icon='⏰'; txt='مستحق '+due.toLocaleDateString('ar-EG'); }
      else { cls='ist-upcoming'; icon='📅'; txt='قادم '+due.toLocaleDateString('ar-EG'); }
      const last=inst.reminders?.[inst.reminders.length-1];
      if(!last) canRemind=true;
      else { const ds=Math.floor((now-new Date(last.sentAt))/86400000); canRemind=ds>=minDays||d>7; if(!canRemind) disable=true; }
    }
    html+='<div class="im-row" data-bid="'+b.id+'" data-idx="'+idx+'" data-status="'+inst.status+'" data-overdue="'+overdue+'" data-receipt="'+(inst.receiptReceived||false)+'" data-due="'+inst.dueDate+'" data-canremind="'+canRemind+'" style="border-right:5px solid '+(inst.status==='paid'?'#10B981':d>0?'#DC2626':'#3B82F6')+'">'
      +'<div style="display:flex;justify-content:space-between;align-items:start;gap:12px">'
      +'<input type="checkbox" class="inst-check" data-bid="'+b.id+'" data-idx="'+idx+'" onchange="updateSelCount()" '+(disable?'disabled':'')+' style="width:20px;height:20px;cursor:pointer;margin-top:4px">'
      +'<div style="flex:1"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><strong style="font-size:1.05rem">'+icon+' '+esc(b.customer?.name||'---')+'</strong><span style="font-size:1.2rem;font-weight:800;color:#DC2626">'+(inst.status==='paid'?inst.amount:left).toLocaleString('ar-EG')+' ج.م'+(inst.status==='partial'?' <small style="color:var(--fu-accent);font-weight:600">(باقي من '+inst.amount.toLocaleString('ar-EG')+')</small>':'')+'</span></div>'
      +'<div style="color:var(--fu-muted);font-size:.88rem;margin-top:5px">'+esc(b.courseName||'---')+' | القسط '+(inst.installmentNumber+1)+'/'+b.paymentDetails.totalInstallments+' | <span class="ist-badge '+cls+'">'+txt+'</span></div>'
      +(inst.status!=='paid'?'<div style="display:flex;gap:14px;margin-top:8px;font-size:.85rem">'+(inst.reminders?.length?'<span style="color:'+(canRemind?'#10B981':'#F59E0B')+'">💬 آخر تذكير: '+new Date(inst.reminders[inst.reminders.length-1].sentAt).toLocaleDateString('ar-EG')+(!canRemind&&!overdue?' (يمكن التذكير بعد '+minDays+' أيام)':'')+'</span>':'<span style="color:#10B981">✅ لم يُرسل تذكير — جاهز</span>')+(inst.receiptReceived?'<span style="color:#8B5CF6">📸 إيصال مستلم</span>':'')+'</div>':'')
      +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">'
      +(inst.status!=='paid'?
          ((canRemind||overdue)?'<button onclick="sendInstallmentReminder(\''+b.id+'\','+idx+')" style="padding:8px 14px;background:var(--fu-primary);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:700"><i class="fas fa-paper-plane"></i> تذكير</button>':'<button disabled style="padding:8px 14px;background:var(--fu-sunken);color:#9CA3AF;border:none;border-radius:8px"><i class="fas fa-pause"></i> تم التذكير حديثاً</button>')
          +(inst.receiptReceived?'<button onclick="viewInstallmentReceipt(\''+b.id+'\','+idx+')" style="padding:8px 14px;background:var(--fu-violet);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:700"><i class="fas fa-eye"></i> عرض الإيصال</button>':'')
          +'<button onclick="markInstallmentAsPaid(\''+b.id+'\','+idx+')" style="padding:8px 14px;background:var(--fu-info);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:700"><i class="fas fa-check"></i> تسجيل دفع</button>'
        :'<span style="color:#10B981;font-weight:700"><i class="fas fa-check-circle"></i> تم الدفع'+(inst.paymentMethod?' | '+getPaymentMethodText(inst.paymentMethod):'')+'</span>')
      +'</div></div></div></div>';
  });});
  return html||'<p style="text-align:center;color:var(--fu-muted);padding:40px">🎉 لا توجد أقساط</p>';
}

function updateReminderMinDays(){ const v=document.getElementById('reminderMinDays').value; localStorage.setItem('installmentReminderMinDays',v); showInstallmentsManager(); Swal.fire({toast:true,position:'top-end',icon:'success',title:'تم تحديث الحد الأدنى: '+v+(v==1?' يوم':' أيام'),showConfirmButton:false,timer:2000}); }

function filterInst(type){
  document.querySelectorAll('.im-filter').forEach(b=>{b.classList.toggle('active',b.getAttribute('data-f')===type);});
  document.querySelectorAll('.inst-check:checked').forEach(c=>c.checked=false); updateSelCount();
  const now=new Date(); let visible=0;
  document.querySelectorAll('.im-row').forEach(row=>{
    const status=row.getAttribute('data-status'); const overdue=row.getAttribute('data-overdue')==='true'; const receipt=row.getAttribute('data-receipt')==='true';
    const dueStr=row.getAttribute('data-due'); let d=999; if(dueStr) d=Math.floor((new Date(dueStr)-now)/86400000);
    let show=false;
    switch(type){
      case 'all': show=status!=='paid'; break;
      case 'overdue': show=overdue&&status!=='paid'; break;
      case 'dueIn3Days': show=d>=0&&d<=3&&status!=='paid'; break;
      case 'dueIn7Days': show=d>=0&&d<=7&&status!=='paid'; break;
      case 'receipts': show=receipt&&status!=='paid'; break;
      case 'paid': show=status==='paid'; break;
    }
    row.style.display=show?'block':'none'; if(show) visible++;
  });
  const container=document.getElementById('instList');
  const old=container.querySelector('.no-res'); if(old) old.remove();
  if(visible===0){ const m=document.createElement('div'); m.className='no-res'; m.style.cssText='text-align:center;padding:40px;color:var(--fu-muted);background:var(--fu-sunken);border-radius:10px'; m.innerHTML='<i class="fas fa-inbox" style="font-size:3rem;color:#D1D5DB;margin-bottom:12px"></i><p>لا توجد أقساط في هذا الفلتر</p>'; container.appendChild(m); }
}

function selectAllReadyForReminder(){
  let n=0;
  document.querySelectorAll('.im-row').forEach(row=>{
    if(row.style.display==='none') return;
    if(row.getAttribute('data-canremind')==='true'){ const cb=row.querySelector('.inst-check'); if(cb&&!cb.disabled){ cb.checked=true; n++; } }
  });
  updateSelCount();
  const m=document.createElement('div'); m.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);background:'+(n>0?'#10B981':'#F59E0B')+';color:#fff;padding:14px 28px;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:99999;font-weight:700';
  m.textContent=n>0?'✅ تم تحديد '+n+' عميل':'⚠️ لا يوجد عملاء جاهزين في هذا الفلتر';
  document.body.appendChild(m); setTimeout(()=>m.remove(),2200);
}
function updateSelCount(){
  const n=document.querySelectorAll('.inst-check:checked').length;
  const c=document.getElementById('selCount'); const btn=document.getElementById('bulkBtn');
  if(c) c.textContent=n;
  if(btn){ btn.disabled=n===0; btn.style.opacity=n>0?'1':'.5'; btn.style.cursor=n>0?'pointer':'not-allowed'; }
}

async function sendInstallmentReminder(bookingId,idx){
  const b=findBooking(x=>x.id===bookingId); if(!b) return;
  const inst=b.paymentDetails.installmentSchedule[idx];
  const name=(b.customer?.name||'').split(' ')[0]||'عميلنا العزيز';
  const due=new Date(inst.dueDate);
  const message='⏰ تذكير بموعد القسط الشهري\n\nمرحباً '+name+' 👋\nهذا تذكير لطيف بأن القسط القادم:\n━━━━━━━━━━━━━━━━━━\n📚 الدورة: *'+(b.courseName||'الدورة')+'*\n💰 المبلغ المطلوب: *'+inst.amount.toLocaleString('ar-EG')+' ج.م*\n📅 تاريخ الاستحقاق: '+due.toLocaleDateString('ar-EG')+'\n\n📊 حالة الأقساط:\n✅ مدفوع: '+(b.paymentDetails.paidInstallments||0)+' من '+((b.paymentDetails.totalInstallments||1)-1)+' أقساط\n⏳ المتبقي: '+(b.paymentDetails.remainingAmount||0).toLocaleString('ar-EG')+' ج.م\n━━━━━━━━━━━━━━━━━━\n💳 بعد الدفع يرجى إرسال صورة الإيصال 📸\nشكراً لثقتك في منظور الفؤاد 💚';
  if(!b.telegramChatId){ if(b.customer?.whatsapp) openWhatsAppUnified(b.customer.whatsapp,message); return; }
  const ok=await sendTelegramMessage(b.telegramChatId,message);
  if(ok){
    inst.reminders=inst.reminders||[]; inst.reminders.push({sentAt:new Date().toISOString(),sentBy:'admin',type:'single'});
    await dbUpdate('tempBookings',bookingId,{'paymentDetails.installmentSchedule':b.paymentDetails.installmentSchedule});
    Swal.fire({toast:true,position:'top-end',icon:'success',title:'تم إرسال التذكير',showConfirmButton:false,timer:2500});
    if(document.querySelector('.im-filter')) setTimeout(showInstallmentsManager,800);
  } else Swal.fire('خطأ!','فشل إرسال التذكير','error');
}

async function sendBulkReminders(){
  const checked=document.querySelectorAll('.inst-check:checked');
  if(!checked.length){ Swal.fire('تنبيه','لم يتم تحديد أي عميل','warning'); return; }
  const items=[]; let total=0;
  checked.forEach(cb=>{ const b=findBooking(x=>x.id===cb.getAttribute('data-bid')); if(b){ const inst=b.paymentDetails.installmentSchedule[parseInt(cb.getAttribute('data-idx'))]; items.push({b,inst,idx:parseInt(cb.getAttribute('data-idx'))}); total+=inst.amount; } });
  const r=await Swal.fire({title:'💬 تأكيد إرسال التذكيرات',html:'<div style="text-align:right"><p>سيتم إرسال تذكير لـ <strong>'+items.length+'</strong> عميل</p><div style="max-height:250px;overflow-y:auto;margin:12px 0">'+items.map((it,i)=>'<div style="background:var(--fu-primary-soft);padding:9px;border-radius:8px;margin-bottom:6px;border-right:3px solid #10B981"><strong>'+(i+1)+'. '+esc(it.b.customer?.name||'')+'</strong> — '+it.inst.amount.toLocaleString('ar-EG')+' ج.م</div>').join('')+'</div><div style="background:var(--fu-info-soft);padding:12px;border-radius:8px"><strong>📊 الإجمالي: '+total.toLocaleString('ar-EG')+' ج.م</strong></div></div>',showCancelButton:true,confirmButtonText:'إرسال',cancelButtonText:'إلغاء',confirmButtonColor:'#10B981',width:'600px'});
  if(!r.isConfirmed) return;
  Swal.fire({title:'جاري الإرسال...',html:'<div class="loading-spinner" style="margin:20px auto"></div><p><strong><span id="prog">0</span> من '+items.length+'</strong></p>',allowOutsideClick:false,showConfirmButton:false});
  let ok=0,fail=0;
  for(let i=0;i<items.length;i++){
    document.getElementById('prog').textContent=i+1;
    const it=items[i]; const name=(it.b.customer?.name||'').split(' ')[0]||'عميلنا العزيز'; const due=new Date(it.inst.dueDate);
    const msg='⏰ تذكير بموعد القسط الشهري\n\nمرحباً '+name+' 👋\n📚 الدورة: *'+(it.b.courseName||'الدورة')+'*\n💰 المبلغ: *'+it.inst.amount.toLocaleString('ar-EG')+' ج.م*\n📅 الاستحقاق: '+due.toLocaleDateString('ar-EG')+'\n⏳ المتبقي: '+(it.b.paymentDetails.remainingAmount||0).toLocaleString('ar-EG')+' ج.م\n━━━━━━━━━━━━━━━━━━\nبعد الدفع أرسل صورة الإيصال 📸\nشكراً 💚 منظور الفؤاد';
    let sent=false;
    if(it.b.telegramChatId) sent=await sendTelegramMessage(it.b.telegramChatId,msg);
    if(sent){ it.inst.reminders=it.inst.reminders||[]; it.inst.reminders.push({sentAt:new Date().toISOString(),sentBy:'admin',type:'bulk'}); await dbUpdate('tempBookings',it.b.id,{'paymentDetails.installmentSchedule':it.b.paymentDetails.installmentSchedule}); ok++; }
    else fail++;
    await new Promise(res=>setTimeout(res,DEMO_MODE?80:500));
  }
  Swal.fire({icon:ok>0?'success':'error',title:'اكتمل الإرسال',html:'<div style="text-align:right"><p><strong>✅ نجح:</strong> '+ok+' تذكير</p>'+(fail>0?'<p><strong>❌ فشل:</strong> '+fail+'</p>':'')+'</div>',confirmButtonColor:'#10B981'});
  setTimeout(showInstallmentsManager,1200);
}

async function rejectReceipt(bookingId,idx){

   محرر خطة الدفع
============================================================ */
function analyzeCurrentPlan(b){
  const r={type:'unknown',displayName:'غير محدد',installmentMonths:0,currentPrice:0,basePrice:0};
  r.basePrice=b.pricing?.basePriceNumber||extractNumberFromArabicText(b.pricing?.basePrice)||7500;
  r.currentPrice=b.pricing?.finalPriceNumber||extractNumberFromArabicText(b.pricing?.finalPrice)||0;
  if(b.payment){
    if(b.payment.code==='cash'||b.payment.method==='دفعة واحدة'||(!b.payment.installmentDetails&&!b.payment.installmentHTML&&!b.payment.code?.startsWith('installment'))){
      r.type='cash'; r.displayName='دفعة واحدة';
    } else if(b.payment.installmentDetails||b.payment.installmentHTML||b.payment.code?.startsWith('installment')||b.payment.code?.startsWith('plan_')){
      r.type='installment';
      const t=b.payment.installmentDetails||b.payment.installmentHTML||b.payment.method||'';
      const m=t.match(/(\d+)\s*(شهر|شهور|أقساط|قسط)/); if(m) r.installmentMonths=parseInt(m[1]);
      r.displayName=r.installmentMonths?r.installmentMonths+' شهور':'أقساط';
    }
  } else if(b.paymentDetails?.type==='installment'){ r.type='installment'; r.installmentMonths=b.paymentDetails.totalInstallments||0; r.displayName=r.installmentMonths+' شهور'; }
  else { r.type='cash'; r.displayName='دفعة واحدة'; }
  return r;
}
function extractStoredDiscounts(b){
  const d={timeDiscount:0,timePercentage:0,couponDiscount:0,couponPercentage:0,couponCode:'',cashDiscountPercentage:15};
  const bp=b.pricing?.basePriceNumber||extractNumberFromArabicText(b.pricing?.basePrice)||7500;
  (b.discounts||[]).forEach(disc=>{
    const amt=disc.amount||extractNumberFromArabicText(disc.value)||0;
    if(disc.type==='time'){ d.timeDiscount=amt; if(bp>0) d.timePercentage=Math.round(amt/bp*100); }
    else if(disc.type==='cash'){ d.cashDiscountAmount=amt; }
    else if(disc.type==='coupon'){ d.couponDiscount=amt; const m=disc.label?.match(/\(([^)]+)\)/); if(m) d.couponCode=m[1]; }
  });
  return d;
}
function calcPlanPrice(basePrice,planType,months,disc){
  let price=basePrice; const applied=[];
  if(disc.timeDiscount>0){ price-=disc.timeDiscount; applied.push({type:'time',amount:disc.timeDiscount,label:'خصم العرض الزمني'}); }
  if(planType==='cash'){ const c=smartRound(price*(disc.cashDiscountPercentage||15)/100); price-=c; applied.push({type:'cash',amount:c,label:'خصم الدفع النقدي ('+(disc.cashDiscountPercentage||15)+'%)'}); }
  if(disc.couponDiscount>0){ price-=disc.couponDiscount; applied.push({type:'coupon',amount:disc.couponDiscount,label:disc.couponCode?'كود الخصم ('+disc.couponCode+')':'كود الخصم'}); }
  price=smartRound(price);
  let inst=null;
  if(planType==='installment'&&months>0){ const monthly=smartRound(price/months); inst={total:monthly*months,monthlyAmount:monthly,months,description:months+' أقساط × '+monthly.toLocaleString('ar-EG')+' ج.م شهرياً'}; }
  return {finalPrice:price,appliedDiscounts:applied,installmentDetails:inst,totalSavings:basePrice-price};
}

function makePlanCard(planId,calc,cur,planName){
  const div=document.createElement('div'); div.className='plan-option';
  let isCurrent=false;
  if(planId==='cash'&&cur.type==='cash') isCurrent=true;
  else if(planId.startsWith('plan_')){ const m=parseInt(planId.replace('plan_','')); if(cur.type==='installment'&&cur.installmentMonths===m) isCurrent=true; }
  if(isCurrent) div.classList.add('current');
  const diff=calc.finalPrice-cur.currentPrice;
  let html='<div style="padding:4px">'+(isCurrent?'<div class="savings-badge">حالياً</div>':'')+'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h4 style="margin:0">'+(planId==='cash'?'💵':'📅')+' '+planName+'</h4><div style="text-align:center"><div style="font-size:1.8rem;font-weight:800;color:'+(planId==='cash'?'#059669':'#3B82F6')+'">'+calc.finalPrice.toLocaleString('ar-EG')+'</div><div style="font-size:.85rem;color:var(--fu-muted)">جنيه مصري</div></div></div>';
  if(calc.appliedDiscounts.length){ html+='<div style="margin:10px 0;padding:10px;background:var(--fu-sunken);border-radius:8px">'; calc.appliedDiscounts.forEach(d=>{const col=d.type==='time'?'#F59E0B':d.type==='cash'?'#10B981':d.type==='coupon'?'#3B82F6':'#6B7280';html+='<div style="color:'+col+';font-size:.9rem;margin:4px 0">✓ '+d.label+': -'+d.amount.toLocaleString('ar-EG')+' ج.م</div>';}); html+='</div>'; }
  if(calc.installmentDetails) html+='<div style="background:var(--fu-surface);padding:12px;border-radius:8px;border-right:4px solid #3B82F6"><strong><i class="fas fa-list"></i> تفاصيل الأقساط:</strong><div style="color:var(--fu-ink-2);margin-top:4px">'+calc.installmentDetails.description+'</div></div>';
  if(!isCurrent&&diff!==0) html+='<div style="margin-top:12px;padding:10px;border-radius:8px;text-align:center;background:'+(diff<0?'#DCFCE7':'#FEE2E2')+'">'+(diff<0?'<span style="color:var(--fu-primary);font-weight:800">🎉 وفر '+Math.abs(diff).toLocaleString('ar-EG')+' ج.م</span>':'<span style="color:var(--fu-danger)">⚠️ أغلى بـ '+diff.toLocaleString('ar-EG')+' ج.م</span>')+'</div>';
  html+='</div>'; div.innerHTML=html;
  if(!isCurrent){ div.style.cursor='pointer'; div.onclick=function(){ selectPlanCard(planId,calc,this); }; }
  return div;
}
function selectPlanCard(planId,calc,el){
  document.querySelectorAll('.plan-option').forEach(p=>{ if(!p.classList.contains('current')) p.classList.remove('selected'); });
  el.classList.add('selected');
  selectedNewPlan={id:planId,type:planId==='cash'?'cash':'installment',calculation:calc};
  const btn=document.getElementById('confirmPlanChange'); btn.style.display='inline-flex'; btn.onclick=confirmPlanChange;
}
function closePaymentEditor(){ document.getElementById('paymentEditorModal').style.display='none'; currentEditingBooking=null; selectedNewPlan=null; document.getElementById('confirmPlanChange').style.display='none'; }
async function confirmPlanChange(){
  if(!selectedNewPlan||!currentEditingBooking){ Swal.fire('خطأ!','لم يتم اختيار خطة','error'); return; }
  const cur=analyzeCurrentPlan(currentEditingBooking);
  document.getElementById('paymentEditorModal').style.display='none';
  const r=await Swal.fire({title:'تأكيد تغيير خطة الدفع',html:'<div style="text-align:right"><div style="background:var(--fu-accent-soft);padding:14px;border-radius:10px;margin-bottom:12px"><strong>الخطة الحالية:</strong> '+cur.displayName+'<br><strong>السعر الحالي:</strong> '+cur.currentPrice.toLocaleString('ar-EG')+' ج.م</div><div style="background:var(--fu-info-soft);padding:14px;border-radius:10px"><strong>الخطة الجديدة:</strong> '+(selectedNewPlan.id==='cash'?'دفعة واحدة':selectedNewPlan.id.replace('plan_','')+' شهور')+'<br><strong>السعر الجديد:</strong> '+selectedNewPlan.calculation.finalPrice.toLocaleString('ar-EG')+' ج.م</div>'+(selectedNewPlan.calculation.installmentDetails?'<div style="background:var(--fu-sunken);padding:10px;border-radius:8px;margin-top:10px">'+selectedNewPlan.calculation.installmentDetails.description+'</div>':'')+'</div>',icon:'question',showCancelButton:true,confirmButtonText:'نعم، تأكيد',cancelButtonText:'إلغاء',confirmButtonColor:'#10B981'});
  if(!r.isConfirmed){ document.getElementById('paymentEditorModal').style.display='flex'; return; }
  try{
    const np=selectedNewPlan;
    const upd={lastUpdated:new Date().toISOString(),planChangedAt:new Date().toISOString(),planChangedBy:'admin','pricing.finalPrice':np.calculation.finalPrice.toLocaleString('ar-EG')+' ج.م','pricing.finalPriceNumber':np.calculation.finalPrice,totalSavings:np.calculation.totalSavings,totalSavingsText:np.calculation.totalSavings.toLocaleString('ar-EG')+' ج.م'};
    upd.discounts=np.calculation.appliedDiscounts.map(d=>({type:d.type,label:d.label,value:'-'+d.amount.toLocaleString('ar-EG')+' ج.م',amount:d.amount}));
    if(np.type==='cash'){
      upd.payment={code:'cash',method:'دفعة واحدة',installmentDetails:null,installmentHTML:null};
      upd.paymentDetails={type:'cash',totalAmount:np.calculation.finalPrice,paidAmount:0,remainingAmount:np.calculation.finalPrice,fullyPaid:false};
    } else {
      const det=np.calculation.installmentDetails; const months=det.months;
      upd.payment={code:np.id,method:months+' شهور',installmentDetails:det.description,installmentHTML:det.description};
      const schedule=[]; const today=new Date();
      for(let i=0;i<months;i++){ const due=new Date(today); if(i>0) due.setMonth(due.getMonth()+i); schedule.push({installmentNumber:i,amount:det.monthlyAmount,dueDate:due.toISOString(),status:'pending'}); }
      upd.paymentDetails={type:'installment',totalAmount:det.total,monthlyAmount:det.monthlyAmount,totalInstallments:months,paidInstallments:0,paidAmount:0,remainingAmount:det.total,fullyPaid:false,installmentSchedule:schedule};
    }
    await dbUpdate('tempBookings',currentEditingBooking.id,cleanDataForFirebase(upd));
    closePaymentEditor();
    Swal.fire({icon:'success',title:'تم تغيير الخطة',timer:1500,showConfirmButton:false}); reload();
  }catch(e){ console.error(e); Swal.fire('خطأ!','فشل تحديث خطة الدفع','error'); }
}

<script>
/* =====================================================================
   الواجهة الجديدة. كل الأفعال (تأكيد، دفع، تحويل، منح، أقساط، رسايل البوت)
   هي نفس دوال book-bot-online اللي فوق من غير تغيير. هنا بنغيّر العرض بس.
   ===================================================================== */
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var K={view:'list',queue:null,tab:'active',type:'all',q:'',open:null,dtab:'overview',chats:{},menuFor:null};
if(DEMO_MODE)window.__bk={get K(){return K},openD:function(a,b){openD(a,b)}};
try{var sv=JSON.parse(localStorage.getItem('fu-bookings-ui')||'{}');if(sv.view)K.view=sv.view;}catch(e){}
var DAY=864e5;
var fmt=function(n){return Math.round(+n||0).toLocaleString('ar-EG')};

/* ---------- قراية البيانات ---------- */
function T(b){return b.bookingType||b.type||'unknown'}
function isGrant(b){return T(b)==='grant_request'}
function cust(b){return b.customer||(b.grantRequest&&b.grantRequest.applicant)||b.applicant||{}}
function nm(b){return cust(b).name||'من غير اسم'}
function ph(b){return cust(b).whatsapp||''}
function made(b){var t=new Date(b.timestamp||b.bookingDate||b.createdAt||0).getTime();return isNaN(t)?0:t}
function sm(b){try{return BookingMoney.summarize(b)}catch(e){return {total:0,paid:0,remaining:0,rows:[],overdue:[],next:null}}}
function price(b){return BookingMoney.num(b.pricing&&(b.pricing.finalPriceNumber!=null?b.pricing.finalPriceNumber:b.pricing.finalPrice))}
function receipt(b){return !!(b.automationWorkflow&&b.automationWorkflow.receiptReceived)}
/* إيصالات الأقساط اللي البوت سجّلها (receipts) ولسه مستنية قرارك */
function rcs(b){return ((K.receipts&&K.receipts[b.id])||[]).filter(function(r){return r.kind!=='postpone'})}
function pps(b){return ((K.receipts&&K.receipts[b.id])||[]).filter(function(r){return r.kind==='postpone'})}
var RC_SRC={button:'الطالب داس «ابعت إيصال القسط»',auto:'البوت ربطه بالقسط المفتوح الوحيد',choice:'الطالب اختار الكورس بنفسه',unknown:'البوت ما عرفش هو لأنهي قسط',help:'وصل وهو في محادثة مساعدة، ممكن يكون مش إيصال',text:'الطالب كتب بيانات التحويل بدل الصورة'};
function rcInstLabel(b,idx){var r=sm(b).rows.find(function(x){return x.idx===idx});return r?r.label:'قسط'}
function grantOk(b){return b.grantStatus==='approved'}
function sel(b){return b.customerSelectedOffer&&(b.negotiationOffers||[])[b.customerSelectedOfferIndex||0]}
function late(b){if(b.status==='cancelled')return null;var s=sm(b);return s.overdue&&s.overdue.length?s.overdue[0]:null}
function planText(b){
  if(isGrant(b)&&!grantOk(b)){var sd=(b.grantDetails||{}).supportDetails||{};return sd.type==='full'?'طالب منحة كاملة':sd.type==='partial'?'طالب منحة '+fmt(sd.percentage)+'٪':sd.type==='installment'?'طالب تقسيط '+fmt(sd.months)+' شهور':'طلب منحة'}
  var pd=b.paymentDetails||{};
  if(pd.type==='installment')return 'تقسيط على '+fmt(pd.totalInstallments||(pd.installmentSchedule||[]).length)+' دفعات';
  if(b.payment&&b.payment.method)return b.payment.method;
  return 'دفعة واحدة';
}
function rel(t){if(!t)return '—';var d=Date.now()-t,m=Math.round(d/6e4),h=Math.round(d/36e5),dd=Math.round(d/DAY);if(m<60)return 'من '+fmt(Math.max(m,1))+' دقيقة';if(h<24)return 'من '+fmt(h)+' ساعة';if(dd===1)return 'امبارح';if(dd<45)return 'من '+fmt(dd)+' يوم';return new Date(t).toLocaleDateString('ar-EG',{day:'numeric',month:'short',year:'numeric'})}
function dT(t){if(!t)return '—';var d=new Date(t);return isNaN(d)?'—':d.toLocaleDateString('ar-EG',{day:'numeric',month:'long'})}
function ini(n){var p=String(n).trim().split(/\s+/).filter(function(w){return w!=='الله'&&w!=='عبد'&&w});if(!p.length)return '؟';return p[0][0]+(p.length>1?p[p.length-1][0]:'')}

/* المرحلة والحالة والخطوة الجاية */
function stage(b){
  if(b.status==='cancelled')return 'cancelled';
  if(b.status==='transferred'||b.status==='completed')return 'student';
  if(b.status==='paid')return 'paid';
  if(b.status==='confirmed'||(isGrant(b)&&(b.negotiationOffers||[]).length))return 'waiting';
  return 'new';
}
function badge(b){
  var lt=late(b);
  if(stage(b)==='student'&&rcs(b).length)return ['b-info','إيصال قسط وصل'];
  if(stage(b)==='student'&&pps(b).length)return ['b-wait','طلب تأجيل'];
  if(stage(b)==='student')return lt?['b-bad','قسط متأخر']:['','اتحوّل لطالب'];
  if(b.status==='cancelled')return ['','ملغي'];
  if(rcs(b).length)return ['b-info','إيصال قسط وصل'];
  if(pps(b).length)return ['b-wait','طلب تأجيل'];
  if(b.status==='paid')return ['b-ok','اتدفع'];
  if(receipt(b))return ['b-info','الإيصال وصل'];
  if(isGrant(b)){
    if(grantOk(b))return ['b-grant','منحة اتوافق عليها'];
    if(b.grantStatus==='rejected')return ['','منحة مرفوضة'];
    if(b.customerProposal)return ['b-grant','اقترح عرض'];
    if(sel(b))return ['b-grant','اختار عرض'];
    if(b.customerInfoReply)return ['b-grant','رد بالمعلومات'];
    if((b.negotiationOffers||[]).length)return ['b-grant','مستني رده'];
    return ['b-grant','طلب منحة'];
  }
  if(b.status==='confirmed')return lt?['b-bad','قسط متأخر']:['b-wait','مستني الدفع'];
  return ['b-wait','جديد'];
}
/* أفعال الحجز: الأساسي أول واحد. كل fn بتنادي دالة من الكود القديم */
function acts(b){
  var id=b.id,t=T(b),A=[],lt=late(b),tg=!!b.telegramChatId,why='';
  var add=function(k,label,fn,opt){A.push({k:k,t:label,fn:fn,d:opt==='d',ghost:opt==='ghost'})};
  var rq=rcs(b);
  if(rq.length&&b.status!=='cancelled'){add('reviewrcpt','راجع إيصال القسط',function(){openD(id,'money')});why='الطالب بعت إيصال '+rcInstLabel(b,rq[0].idx)+' على التليجرام. قارنه بالمبلغ وسجّله.'}
  else if(pps(b).length&&b.status!=='cancelled'){add('reviewpp','راجع طلب التأجيل',function(){openD(id,'money')});var p0=pps(b)[0];why='الطالب طالب يأجّل '+rcInstLabel(b,p0.idx)+' لحد '+dT(p0.requestedDue)+'.'}
  else if(b.status==='cancelled'){why='الحجز ملغي'+(b.cancellationReason?': '+b.cancellationReason:'.')}
  else if(stage(b)==='student'){
    if(lt){add('remind','ذكّره بالقسط',function(){sendInstallmentReminder(id,lt.idx)});add('payinst','سجّل دفعة',function(){markInstallmentAsPaid(id,lt.idx)});why='قسط '+fmt(lt.left)+' ج.م متأخر '+fmt(lt.daysLate)+' يوم.'}
    else{add('open','افتح صفحة الطالب',function(){openTransferred(id)},'ghost');why='اتحوّل لطالب. الحساب والكورس من صفحة الحجوزات الفردية.'}
  }
  else if(b.status==='paid'){add('transfer','حوّله لطالب',function(){transferToSpecialized(id,t)});why='الدفع اتسجل. فاضل تحوّله وتعمله الحساب.'}
  else if(isGrant(b)){
    var offers=b.negotiationOffers||[];
    if(grantOk(b)){var full=b.isFullGrant||price(b)===0;add('grantpay',full?'فعّل المنحة الكاملة':'أكّد دفع المنحة',function(){markAsPaidWithGrantAutomation(id)});why='المنحة اتوافق عليها. فاضل تأكيد الدفع والأتمتة.'}
    else if(sel(b)||b.customerProposal){add('approve','وافق على المنحة',function(){sendGrantApproval(id)});if(b.customerProposal)add('proposal','شوف اقتراحه',function(){viewCustomerProposal(id)});add('offer','عرض جديد',function(){openGrantNegotiation(id)});add('reject','ارفض',function(){sendGrantRejection(id)},'d');why=b.customerProposal?'العميل بعت اقتراح بخطة تانية.':'العميل اختار العرض رقم '+fmt((b.customerSelectedOfferIndex||0)+1)+'.'}
    else if(offers.length){add('nudge','ذكّره بالعروض',function(){sendReminderToCustomer(id)});add('offer','عرض جديد',function(){openGrantNegotiation(id)});add('approve','وافق مباشرة',function(){sendGrantApproval(id)});add('reject','ارفض',function(){sendGrantRejection(id)},'d');why='اتبعتله '+fmt(offers.length)+' عرض ومستني رده.'}
    else{add('offer','ابعت عرض',function(){openGrantNegotiation(id)});add('approve','وافق على طلبه',function(){sendGrantApproval(id)});add('info','اطلب معلومات',function(){requestMoreGrantInfo(id)});add('reject','ارفض',function(){sendGrantRejection(id)},'d');why='طلب منحة جديد مستني قرارك.'}
  }
  else if(b.status==='confirmed'){
    if(receipt(b)){add('pay','أكّد الدفع',function(){markAsPaidWithAutomation(id)});add('rejectpay','ارفض الإيصال',function(){rejectPayment(id)},'d');why='العميل بعت الإيصال. قارنه بالمبلغ في تبويب التليجرام قبل ما تأكّد.'}
    else if(tg&&!b.receiptRequested){add('askreceipt','اطلب الإيصال',function(){requestReceipt(id)});add('pay','سجّل الدفع',function(){markAsPaidWithAutomation(id)});add('remindpay','ذكّره',function(){sendReminder(id)});why='الحجز اتأكد ولسه مفيش إيصال.'}
    else{add('pay','سجّل الدفع',function(){markAsPaidWithAutomation(id)});add('remindpay','ذكّره بالدفع',function(){sendReminder(id)});if(tg)add('askreceipt','اطلب الإيصال تاني',function(){requestReceipt(id)});why=b.receiptRequested?'الإيصال اتطلب '+rel(new Date(b.receiptRequestedAt).getTime())+' ولسه موصلش.':'العميل مش متصل بالتليجرام. لو دفع سجّل الدفع.'}
  }
  else{add('confirm','أكّد الحجز',function(){confirmBooking(id)});add('cancel','الغِ الحجز',function(){cancelBooking(id)},'d');why='حجز جديد. تأكيده بيبعت للعميل تفاصيل الدفع.'}
  return {list:A,why:why};
}
function primary(b){var a=acts(b).list[0];return a||null}
function needsMe(b){var p=primary(b);return !!(p&&!p.ghost)}

var QUEUES=[
  {id:'new',l:'حجوزات جديدة',s:'مستنية تأكيد أو قرار منحة',c:'var(--accent)',f:function(b){var p=primary(b);return !!p&&['confirm','offer','approve'].indexOf(p.k)>-1}},
  {id:'receipt',l:'إيصالات وطلبات',s:'إيصال دفعة أولى أو قسط، أو طلب تأجيل، مستني قرارك',c:'var(--info)',f:function(b){return (b.status==='confirmed'&&receipt(b))||rcs(b).length>0||pps(b).length>0}},
  {id:'convert',l:'اتدفع ومستني تحويل',s:'حوّله لطالب واعمله الحساب',c:'var(--primary)',f:function(b){var p=primary(b);return !!p&&(p.k==='transfer'||p.k==='grantpay')}},
  {id:'late',l:'أقساط متأخرة',s:'عدّى ميعادها ومتسجلتش',c:'var(--danger)',f:function(b){return !!late(b)}}
];
var TABS=[{id:'active',l:'الشغالة'},{id:'mine',l:'محتاجة إيدي'},{id:'students',l:'اتحوّلوا لطلاب'},{id:'all',l:'الكل'}];

function base(){
  return allBookings.filter(function(b){
    var t=T(b);if(t!=='individual'&&t!=='grant_request')return false;
    if(K.type!=='all'&&t!==K.type)return false;
    if(K.q){var c=cust(b),hay=(b.id+' '+(c.name||'')+' '+(c.whatsapp||'')+' '+(c.email||'')+' '+(b.courseName||'')).toLowerCase();if(hay.indexOf(K.q)<0)return false}
    return true;
  });
}
function inTab(b,tab){
  if(tab==='active')return ['pending','pending_review','confirmed','paid'].indexOf(b.status)>-1||!!late(b);
  if(tab==='mine')return needsMe(b);
  if(tab==='students')return stage(b)==='student';
  return true;
}
function visible(){
  var r=base();
  if(K.queue){var Q=QUEUES.find(function(q){return q.id===K.queue});r=r.filter(Q.f)}
  else r=r.filter(function(b){return inTab(b,K.tab)});
  return r.sort(function(a,b){return (needsMe(b)-needsMe(a))||(made(b)-made(a))});
}

/* ---------- العرض ---------- */
function moneyCell(b){
  var s=sm(b),lt=late(b);
  if(isGrant(b)&&!grantOk(b)){var o=sel(b),pr=price(b);return '<b class="num">'+(o?(o.amount===0?'منحة كاملة':fmt(o.amount)+' ج.م'):(pr?fmt(pr)+' ج.م':'—'))+'</b><span>'+esc(planText(b))+'</span>'}
  var total=s.total||price(b);
  if(isGrant(b)&&total===0)return '<b>مجانًا</b><span>منحة كاملة</span>';
  var line=lt?'<span class="late">متأخر '+fmt(lt.left)+' ج.م</span>':(s.rows.length&&s.paid>0&&s.next?'<span>دفع '+fmt(s.paid)+' · الجاي '+dT(s.next.dueDate)+'</span>':'<span>'+esc(planText(b))+'</span>');
  return '<b class="num">'+fmt(total)+' ج.م</b>'+line;
}
function rowHtml(b){
  var bd=badge(b),p=primary(b),g=isGrant(b);
  return '<div class="krow'+(needsMe(b)?' attn':'')+'" tabindex="0" data-open="'+esc(b.id)+'" aria-selected="'+(K.open===b.id)+'">'
   +'<div class="who"><span class="av'+(g?' grant':'')+'">'+esc(ini(nm(b)))+'</span><div style="min-width:0"><b>'+esc(nm(b))+(g?'<span class="ktag">منحة</span>':'')+'</b><span class="ph num">'+esc(ph(b))+'</span></div></div>'
   +'<div class="course"><b>'+esc(b.courseName||'من غير كورس')+'</b><span>'+(b.telegramChatId?'متصل بالتليجرام':'مش متصل بالتليجرام')+'</span></div>'
   +'<div class="money">'+moneyCell(b)+'</div>'
   +'<div class="st"><span class="kbadge '+bd[0]+'">'+bd[1]+'</span></div>'
   +'<div class="when">'+rel(made(b))+'</div>'
   +'<div class="next">'+(p?'<button type="button" class="kbtn'+(p.ghost?' ghost':' p')+'" data-act="0" data-id="'+esc(b.id)+'">'+esc(p.t)+'</button>':'')+'</div></div>';
}
function renderQueues(){
  var r=base();
  $('queues').innerHTML=QUEUES.map(function(q){var n=r.filter(q.f).length;
    return '<button type="button" class="q'+(n?'':' zero')+'" style="--qc:'+q.c+'" data-q="'+q.id+'" aria-pressed="'+(K.queue===q.id)+'"><span class="l">'+q.l+'</span><span class="s">'+q.s+'</span><span class="n num">'+fmt(n)+'</span></button>'}).join('');
}
function renderTabs(){
  var r=base();
  $('tabs').innerHTML=TABS.map(function(t){return '<button type="button" data-tab="'+t.id+'" aria-pressed="'+(!K.queue&&K.tab===t.id)+'">'+t.l+' <span class="c num">'+fmt(r.filter(function(b){return inTab(b,t.id)}).length)+'</span></button>'}).join('')
   +(K.queue?'<button type="button" data-clearq="1" aria-pressed="true">'+QUEUES.find(function(q){return q.id===K.queue}).l+' ✕</button>':'');
}
function renderList(){

}
function renderBoard(){
  var cols=[['new','جديد'],['waiting','مستني الدفع'],['paid','اتدفع'],['student','اتحوّل لطالب']];
  var r=K.queue?visible():base().filter(function(b){return b.status!=='cancelled'});
  $('boardView').innerHTML=cols.map(function(c){
    var items=r.filter(function(b){return stage(b)===c[0]}).sort(function(a,b){return (needsMe(b)-needsMe(a))||(made(b)-made(a))});

var fullLoad=async function(){
  touched.clear();
  if(!allBookings.length)$('bookingsContainer').innerHTML='<div class="kempty"><div class="spin"></div>بنحمّل الحجوزات…</div>';
  try{
    if(DEMO_MODE){allBookings=getDemoBookings()}
    else{
      var q=showingArchive?db.collection('tempBookings').orderBy('timestamp','desc'):db.collection('tempBookings').where('status','in',['pending','pending_review','confirmed','paid']).orderBy('timestamp','desc');
      var res=await Promise.all([q.get(),showingArchive?null:loadInstallmentBookings().catch(function(e){console.warn('أقساط',e);return []})]);
      var list=[],seen={};res[0].forEach(function(d){seen[d.id]=1;list.push(Object.assign({id:d.id},d.data()))});
      (res[1]||[]).forEach(function(b){if(!seen[b.id]&&b.status==='transferred'){seen[b.id]=1;list.push(b)}});
      allBookings=list;
      K.receipts={};K.unknownReceipts=0;
      try{
        var rs=await db.collection('receipts').where('status','==','pending').get(),miss=[];
        rs.forEach(function(d){var r=Object.assign({id:d.id},d.data());if(!r.bookingId){if(r.kind!=='postpone')K.unknownReceipts++;return}(K.receipts[r.bookingId]=K.receipts[r.bookingId]||[]).push(r);if(!seen[r.bookingId]&&miss.indexOf(r.bookingId)<0)miss.push(r.bookingId)});
        var got=await Promise.all(miss.map(function(id){return db.collection('tempBookings').doc(id).get()}));
        got.forEach(function(d){if(d.exists){seen[d.id]=1;allBookings.push(Object.assign({id:d.id},d.data()))}});
      }catch(e){console.warn('الإيصالات',e)}
      /* رابط ?open لحجز برا القائمة (اتحوّل وخلص، أو اتلغى): نجيبه هو بالذات */
      var want=new URLSearchParams(location.search).get('open');
      if(want&&!seen[want]){try{
        var w1=await db.collection('tempBookings').doc(want).get();
        if(!w1.exists)w1=await db.collection('individualStudents').doc(want).get();
        if(w1.exists){seen[want]=1;allBookings.push(Object.assign({id:w1.id},w1.data()))}
      }catch(e){console.warn('الحجز المطلوب',e)}}
    }
    if(K.open&&!bk(K.open))closeD();
    K.chats={};render();
    var qs=new URLSearchParams(location.search),oid=qs.get('open');if(oid&&!K.opened&&bk(oid)){K.opened=1;openD(oid,qs.get('tab')||'overview')}
    $('lastUpdate').textContent=new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
    K.loaded=true;K.fullAt=Date.now();
  }catch(e){console.error('خطأ في تحميل الحجوزات:',e);showError('مقدرتش أحمّل الحجوزات. اتأكد من النت ومن دخول الأدمن.')}
};

var touched=new Set();
(function(){try{var P=firebase.firestore.DocumentReference.prototype;['update','set','delete'].forEach(function(m){var o=P[m];P[m]=function(){try{var c=this.parent&&this.parent.id;if(c==='tempBookings'||c==='individualStudents')touched.add(this.id)}catch(e){}return o.apply(this,arguments)}})}catch(e){}})();
function addReceipt(r){if(!r.bookingId){if(r.kind!=='postpone')K.unknownReceipts++;return}(K.receipts[r.bookingId]=K.receipts[r.bookingId]||[]).push(r)}
function keepInList(b){return ['pending','pending_review','confirmed','paid'].indexOf(b.status)>-1||(b.status==='transferred'&&(b.paymentDetails||{}).type==='installment')||b.id===K.open}
async function getBookingDoc(id){var d=await db.collection('tempBookings').doc(id).get();if(!d.exists)d=await db.collection('individualStudents').doc(id).get();return d}
var partialLoad=async function(){
  var ids=Array.from(touched);touched.clear();
  try{
    var docs=await Promise.all(ids.map(function(id){return getBookingDoc(id).then(function(d){return {id:id,d:d}})}));
    docs.forEach(function(x){
      var i=allBookings.findIndex(function(b){return b.id===x.id});
      if(!x.d.exists){if(i>-1)allBookings.splice(i,1);return}
      var b=Object.assign({id:x.id},x.d.data());
      if(i>-1){if(keepInList(b))allBookings[i]=b;else allBookings.splice(i,1)}else if(keepInList(b))allBookings.unshift(b);
      if(K.chats)delete K.chats[x.id];
    });
    K.receipts={};K.unknownReceipts=0;
    var rs=await db.collection('receipts').where('status','==','pending').get();
    rs.forEach(function(d){addReceipt(Object.assign({id:d.id},d.data()))});
    render();
    $('lastUpdate').textContent=new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
  }catch(e){console.warn('تحديث جزئي',e);return fullLoad()}
};
var embedLoad=async function(){

window.loadBookings=async function(opts){
  opts=opts||{};
  if(!DEMO_MODE&&document.body.classList.contains('embed'))return embedLoad();
  /* لو آخر تحميل كامل عدّى عليه أكتر من ١٠ دقايق، بنعمل كامل علشان اللي حصل برا الصفحة (حجز جديد، إيصال من البوت) يبان */

function errText(e){return {blocked:'الطالب قافل البوت، فالرسالة ما وصلتوش. كلّمه واتساب.','no-telegram':'الطالب مش متوصل بالتليجرام.','not-open':'القسط ده اتدفع خلاص.',decided:'الطلب ده اتقرر قبل كده.'}[e]||('حصلت مشكلة ('+e+')')}

async function ppAction(kind,rid){

      var q2=await Swal.fire({title:'ترفض طلب التأجيل؟',input:'text',inputLabel:'السبب، وهيتبعت للطالب كده',inputValue:'مش هنقدر نأجل القسط ده المرة دي',showCancelButton:true,confirmButtonText:'ارفض وابعت',cancelButtonText:'رجوع'});

async function rcAction(kind,rid){
  var x=rcFind(rid),b=x.b,r=x.r;if(!b||!r)return;
  try{
    if(kind==='approve'){
      var before=JSON.stringify(((b.paymentDetails||{}).installmentSchedule||[])[r.idx]||{});
      window.__rcReceiptId=rid;
      await markInstallmentAsPaid(b.id,r.idx);
      window.__rcReceiptId=null;
      var d=await db.collection('tempBookings').doc(b.id).get();if(!d.exists)d=await db.collection('individualStudents').doc(b.id).get();var after=JSON.stringify(((d.data()||{}).paymentDetails||{}).installmentSchedule?d.data().paymentDetails.installmentSchedule[r.idx]:{});
      if(after===before){FU.toast('القسط ما اتسجلش، فالإيصال لسه مستني',{type:'wait'});return}
      var ln=window.__lastNotify||{};
      if(ln.ok&&ln.sent)FU.toast('اتسجل القسط واتبعت التأكيد للطالب');
      else if(ln.ok)FU.toast('اتسجل القسط. '+errText(ln.error),{type:'wait'});
      else {await rcDecide(rid,'dismissed').catch(function(){});FU.toast('اتسجل القسط، والتأكيد اتبعت بالرسالة القديمة',{type:'wait'})}
    }else if(kind==='confirm'){
      var cj=await rcDecide(rid,'approved');FU.toast(cj.sent?'اتبعت التأكيد للطالب':errText(cj.error),{type:cj.sent?'ok':'wait'});
    }else if(kind==='reject'){
      var q=await Swal.fire({title:'ترفض الإيصال ده؟',input:'text',inputLabel:'السبب، وهيتبعت للطالب كده',inputValue:'الإيصال مش واضح، والمبلغ مش باين فيه',showCancelButton:true,confirmButtonText:'ارفض وابعت',cancelButtonText:'رجوع'});
      if(!q.isConfirmed)return;await rcDecide(rid,'rejected',q.value);FU.toast('اترفض الإيصال واتبعت السبب للطالب');
    }else if(kind==='dismiss'){
      var c=await Swal.fire({title:'ده مش إيصال؟',text:'هيتشال من الطابور، ومش هيتبعت حاجة للطالب.',showCancelButton:true,confirmButtonText:'شيله',cancelButtonText:'رجوع'});
      if(!c.isConfirmed)return;await rcDecide(rid,'dismissed');FU.toast('اتشال من الطابور');
    }else if(kind==='assign'){
      var opts={};sm(b).rows.forEach(function(row){if(row.state!=='paid')opts[row.idx]=row.label+' · '+fmt(row.left)+' ج.م · '+dT(row.dueDate)});
      if(!Object.keys(opts).length){FU.toast('مفيش أقساط مفتوحة في الحجز ده',{type:'wait'});return}
      var a=await Swal.fire({title:'الإيصال ده لأنهي قسط؟',input:'select',inputOptions:opts,inputValue:r.idx!=null?String(r.idx):Object.keys(opts)[0],showCancelButton:true,confirmButtonText:'تمام',cancelButtonText:'رجوع'});
      if(!a.isConfirmed)return;var i=+a.value,row=sm(b).rows.find(function(z){return z.idx===i});
      await db.collection('receipts').doc(rid).update({bookingId:b.id,idx:i,installmentNumber:row.number,amountExpected:row.left,dueDate:row.dueDate,assignedBy:'admin'});
      FU.toast('اتحدد القسط');
    }
    await loadBookings({afterAction:true});
  }catch(e){console.error('إيصال',e);FU.toast('حصلت مشكلة: '+e.message,{type:'bad'})}

<script>
/* وضع التضمين: افتح الحجز المطلوب على طول، وبلّغ المكتب بعد أي تغيير */
(function(){
  if(!document.body.classList.contains('embed'))return;
  window.closeD=function(){};
  var orig=window.loadBookings;
  window.loadBookings=async function(){
    var r=await orig.apply(this,arguments);
    var w=document.getElementById('embedWait');
    var found=document.getElementById('drawer').classList.contains('on');
    document.body.classList.toggle('embed-missing',!found);
    if(w){if(found)w.remove();else w.textContent='الحجز ده مش موجود، أو اتمسح.';}
    try{parent.postMessage({fu:'booking-changed',id:new URLSearchParams(location.search).get('open')},location.origin)}catch(e){}
    return r;
  };
})();
</script>
</body>
</html>
