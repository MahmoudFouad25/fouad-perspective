<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>الحجوزات — منظور الفؤاد</title>
<link rel="stylesheet" href="../css/fouad-ui.css">
<script src="../js/fouad-ui.js" defer></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="../js/admin-guard.js"></script>
<script src="../js/bot-client.js"></script>
<script src="../js/booking-money.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
/* صفحة الحجوزات الجديدة: طوابير «محتاج إيدك» ← قايمة أو لوحة مراحل ← لوحة جانبية للعميل.
   الألوان من css/fouad-ui.css. الأفعال كلها من نفس كود book-bot-online (مكتوب تحت زي ما هو). */
:root{
  --ink:var(--fu-ink); --ink-2:var(--fu-ink-2); --muted:var(--fu-muted);
  --paper:var(--fu-paper); --surface:var(--fu-surface); --sunken:var(--fu-sunken); --hover:#F1EEE6;
  --line:var(--fu-line); --line-2:var(--fu-line-2);
  --primary:var(--fu-primary); --primary-2:var(--fu-primary-2); --primary-soft:var(--fu-primary-soft);
  --accent:var(--fu-accent); --accent-soft:var(--fu-accent-soft);
  --danger:var(--fu-danger); --danger-soft:var(--fu-danger-soft);
  --info:var(--fu-info); --info-soft:var(--fu-info-soft);
  --violet:var(--fu-violet); --violet-soft:var(--fu-violet-soft);
  --on:var(--fu-on); --scrim:rgba(20,24,21,.38);
  --shadow:var(--fu-shadow); --shadow-lg:0 12px 40px rgba(31,42,36,.18);
  --r:12px; --r-sm:8px;
  /* أسماء الكود القديم (نوافذ الأقساط وتعديل الخطة) */
  --success:var(--fu-primary); --success-d:var(--fu-primary-2); --warning:var(--fu-accent); --danger-d:var(--fu-danger);
  --purple:var(--fu-violet); --grant:var(--fu-violet); --teal:var(--fu-info); --dark:var(--fu-ink); --light:var(--fu-sunken); --border:var(--fu-line);
  --primary-d:var(--fu-primary-2); --radius:12px; --shadow-sm:var(--fu-shadow); --shadow-md:0 6px 18px rgba(31,42,36,.08);
}
*{box-sizing:border-box}
body{margin:0;font-size:14.5px}
button{cursor:pointer;font:inherit;color:inherit}
input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1360px;margin:0 auto;padding-inline:16px}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:22px 14px}
.head h1{margin:0;font-size:24px;font-weight:700}
.head p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.demo-pill{display:none;margin-inline-start:8px;vertical-align:middle;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:2px 10px;border-radius:99px}
body.demo .demo-pill{display:inline-block}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{position:relative}
.search input{width:300px;max-width:100%;padding:9px 36px 9px 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface)}
.search svg{position:absolute;right:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none}
.seg{display:inline-flex;background:var(--sunken);border-radius:var(--r-sm);padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:6px;font-weight:500;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg svg,.ib svg{width:15px;height:15px}
.ib{width:36px;height:36px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);display:inline-grid;place-items:center;flex:none;position:relative}
.ib:hover{background:var(--sunken)}
.menu{position:absolute;top:calc(100% + 6px);left:0;min-width:210px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg);padding:6px;z-index:45;display:grid}
.menu button{border:0;background:transparent;text-align:right;padding:9px 12px;border-radius:6px;color:var(--ink);font-size:14px;display:flex;gap:10px;align-items:center}
.menu button:hover{background:var(--sunken)}
.menu button i{width:16px;color:var(--muted);text-align:center}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.menu .dz{color:var(--danger)} .menu .dz i{color:var(--danger)}

.qlabel{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 8px}
.queues{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.q{text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;box-shadow:var(--shadow)}
.q:hover{border-color:var(--line-2)}
.q[aria-pressed="true"]{border-color:var(--qc);box-shadow:0 0 0 1px var(--qc)}
.q .l{font-weight:600;font-size:14px;grid-column:1}
.q .s{color:var(--muted);font-size:12.5px;grid-column:1}
.q .n{font-size:26px;font-weight:700;line-height:1.1;color:var(--qc);grid-row:1/span 2;grid-column:2}
.q.zero .n{color:var(--muted)}

.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:7px 12px;border-radius:var(--r-sm);color:var(--ink-2);font-weight:500;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tabs button:hover{background:var(--sunken)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:600}
.tabs .c{font-size:12px;opacity:.75}
.chipf{display:flex;gap:6px}
.chipf button{border:1px solid var(--line-2);background:var(--surface);padding:5px 12px;border-radius:99px;font-size:13px;color:var(--ink-2)}
.chipf button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600}
.archive-note{margin-top:10px;background:var(--accent-soft);color:var(--accent);border-radius:var(--r-sm);padding:8px 12px;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.archive-note button{border:0;background:none;color:inherit;font-weight:600;text-decoration:underline}

.lhead,.krow{display:grid;grid-template-columns:minmax(200px,1.4fr) minmax(150px,1.1fr) 150px 132px 96px 200px;gap:14px;align-items:center;padding:10px 12px}
.lhead{font-size:12px;font-weight:600;color:var(--muted);padding-block:8px}
.krow{border-radius:var(--r-sm);cursor:pointer;border:1px solid transparent;position:relative}
.krow:hover{background:var(--hover)}
.krow[aria-selected="true"]{background:var(--surface);border-color:var(--line-2);box-shadow:var(--shadow)}
.krow.attn::before{content:"";position:absolute;right:-1px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--accent)}
.krow + .krow{margin-top:2px}
.who{display:flex;gap:10px;align-items:center;min-width:0}
.av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;font-size:13px;background:var(--sunken);color:var(--ink-2)}
.av.grant{background:var(--violet-soft);color:var(--violet)}
.who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .ph{display:block;color:var(--muted);font-size:12.5px;direction:ltr;text-align:right}
.course{min-width:0}
.course b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.course span,.money span{display:block;color:var(--muted);font-size:12.5px}
.money b{font-weight:600}
.money .late{color:var(--danger);font-weight:600}
.when{color:var(--muted);font-size:12.5px}
.next{display:flex;justify-content:flex-end}
.kempty{padding:48px 16px;text-align:center;color:var(--muted)}
.kempty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.kempty .spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--primary);border-radius:50%;margin:0 auto 12px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.kbadge{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-weight:600;font-size:12.5px;white-space:nowrap;background:var(--sunken);color:var(--ink-2)}
.kbadge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-wait{background:var(--accent-soft);color:var(--accent)} .b-info{background:var(--info-soft);color:var(--info)}
.b-ok{background:var(--primary-soft);color:var(--primary)} .b-bad{background:var(--danger-soft);color:var(--danger)}
.b-grant{background:var(--violet-soft);color:var(--violet)}
.ktag{display:inline-block;font-size:11.5px;font-weight:600;padding:0 7px;border-radius:5px;background:var(--violet-soft);color:var(--violet);margin-inline-start:6px;vertical-align:1px}

.kbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:13.5px;padding:7px 12px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);white-space:nowrap;text-decoration:none}
.kbtn:hover{background:var(--sunken)}
.kbtn.p{background:var(--primary);border-color:var(--primary);color:var(--on)}
.kbtn.p:hover{background:var(--primary-2)}
.kbtn.d{color:var(--danger)}
.kbtn.lg{padding:10px 16px;font-size:14.5px}
.kbtn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.kbtn.ghost:hover{background:var(--sunken)}
.kbtn svg{width:15px;height:15px}

.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:12px;margin-top:14px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--sunken);border-radius:var(--r);padding:10px;min-height:240px}
.col h3{margin:2px 4px 10px;font-size:13.5px;font-weight:600;display:flex;justify-content:space-between;color:var(--ink-2)}
.col h3 span{color:var(--muted);font-weight:500}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:8px;cursor:pointer}
.kcard:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.kcard.attn{border-right:3px solid var(--accent)}
.kcard[aria-selected="true"]{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.kcard b{font-weight:600;display:block}
.kcard .c1{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kcard .c2{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:12.5px}
.col .more{font-size:12.5px;color:var(--muted);text-align:center;padding:4px}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:940;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(540px,100vw);background:var(--paper);z-index:950;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;transform:translateX(-102%);transition:transform .22s ease}
.drawer.on{transform:none}
.dh{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 18px 0}
.dtop{display:flex;align-items:center;gap:10px}
.dtop .av{width:42px;height:42px;font-size:15px}
.dtop h2{margin:0;font-size:18px;font-weight:700;line-height:1.3}
.dtop .sub{color:var(--muted);font-size:12.5px}
.dtop .sp{flex:1;min-width:0}
.dnav{display:flex;gap:4px}
.dtabs{display:flex;gap:2px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.dtabs button{border:0;background:transparent;padding:9px 12px;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.dtabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--primary)}
.dtabs .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-inline-start:4px;vertical-align:2px}
.db{flex:1;overflow-y:auto;padding:16px 18px;display:grid;gap:14px;align-content:start}
.df{background:var(--surface);border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.df .why{flex-basis:100%;font-size:12.5px;color:var(--muted)}
.df .grow{flex:1}
.ksec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.ksec h4{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--muted)}
.ksec p{margin:0}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.copy{border:0;background:transparent;color:var(--primary);font-weight:600;font-size:12.5px;padding:0 6px}
.bigmoney{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline}
.bigmoney .m{font-size:26px;font-weight:700}
.bigmoney .of{color:var(--muted)}
.meter{height:8px;border-radius:99px;background:var(--sunken);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:var(--primary);border-radius:99px}
.inst{width:100%;border-collapse:collapse;font-size:13.5px}
.inst td,.inst th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right}
.inst th{color:var(--muted);font-weight:600;font-size:12px}
.inst tr:last-child td{border-bottom:0}
.inst .kbtn{padding:4px 10px;font-size:12.5px}
.kalert{border-radius:var(--r-sm);padding:10px 12px;font-size:13.5px;display:flex;gap:8px;align-items:flex-start}
.kalert.wait{background:var(--accent-soft);color:var(--accent)}
.kalert.info{background:var(--info-soft);color:var(--info)}
.kalert svg{width:17px;height:17px;flex:none;margin-top:2px}
.quote{border-right:3px solid var(--violet);padding:4px 12px;color:var(--ink-2);font-size:14px;margin:0;white-space:pre-line}
.quote + h5{margin-top:12px}
.ksec h5{margin:0 0 6px;font-size:13.5px}
.offers{display:grid;gap:6px}
.offer{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;font-size:13.5px}
.offer.sel{border-color:var(--violet);background:var(--violet-soft)}
.list-dot{margin:0;padding-inline-start:18px}
.note{border-right:3px solid var(--line-2);padding:4px 10px;margin-bottom:8px;font-size:14px}
.note.imp{border-right-color:var(--danger)}
.note small{display:block;color:var(--muted);font-size:12px}

.chat{display:grid;gap:8px}
.kmsg{max-width:84%;padding:8px 12px;border-radius:12px;font-size:14px;line-height:1.55;white-space:pre-line;overflow-wrap:anywhere}
.kmsg small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px;white-space:normal}
.kmsg.them{background:var(--surface);border:1px solid var(--line);justify-self:start;border-bottom-right-radius:4px}
.kmsg.me{background:var(--primary-soft);justify-self:end;border-bottom-left-radius:4px}
.kmsg.sys{justify-self:center;background:transparent;color:var(--muted);font-size:12.5px;padding:2px}
.kmsg img{display:block;max-width:220px;max-height:260px;border-radius:8px;margin-bottom:4px;cursor:zoom-in}
.reply{display:flex;gap:8px;margin-top:4px}
.reply textarea{flex:1;resize:vertical;min-height:42px;height:42px;padding:9px 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:3px 10px;font-size:12.5px;color:var(--ink-2)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:14px 1fr auto;gap:10px;padding-bottom:14px;position:relative;font-size:13.5px}
.tl li::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--line-2);margin-top:6px}
.tl li.k::before{background:var(--primary)}
.tl li:not(:last-child)::after{content:"";position:absolute;right:4px;top:18px;bottom:0;width:1px;background:var(--line)}
.tl time{color:var(--muted);font-size:12px;white-space:nowrap}

.hint{color:var(--muted);font-size:12.5px;text-align:center;padding:18px 0 28px}
.hint kbd{border:1px solid var(--line-2);border-radius:5px;padding:0 5px;font-family:inherit;font-size:11.5px}
.lightbox{position:fixed;inset:0;z-index:960;background:rgba(0,0,0,.8);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}

/* كارت إيصال القسط */
.rc{border-color:var(--info);box-shadow:0 0 0 1px var(--info)}
.rcb{display:flex;gap:12px;align-items:flex-start;font-size:14px}
.rcpics{display:flex;gap:6px;flex-wrap:wrap;flex:none;max-width:240px}
.rc.pp{border-color:var(--accent,#B45309);box-shadow:0 0 0 1px var(--accent,#B45309)}
.rcb img{width:110px;max-height:150px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;flex:none}
.rcs{color:var(--muted);font-size:12.5px;margin-top:4px}
.rcw{color:var(--danger);font-size:12.5px;margin-top:4px;font-weight:600}
.rca{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
/* SweetAlert بنفس الهوية */
body .swal2-popup{font-family:var(--fu-font);border-radius:16px;color:var(--ink)}
body .swal2-title{font-size:19px;font-weight:700;color:var(--ink)}
body .swal2-html-container{font-size:14.5px}
body .swal2-styled.swal2-confirm{background:var(--primary)!important;border-radius:8px!important;font-weight:600}
body .swal2-styled.swal2-cancel,body .swal2-styled.swal2-deny{border-radius:8px!important;font-weight:600;background:var(--sunken)!important;color:var(--ink)!important}
body .swal2-styled:focus{box-shadow:0 0 0 3px var(--primary-soft)!important}

@media (max-width:1100px){
  .lhead,.krow{grid-template-columns:minmax(180px,1.4fr) minmax(130px,1fr) 140px 120px 180px}
  .lhead .h-when,.krow .when{display:none}
}
@media (max-width:820px){
  .queues{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lhead{display:none}
  .krow{grid-template-columns:1fr auto;gap:6px 10px;padding:12px;background:var(--surface);border-color:var(--line);margin-top:8px}
  .krow + .krow{margin-top:8px}
  .krow .st{grid-column:2;grid-row:1;justify-self:end}
  .krow .course,.krow .money,.krow .next{grid-column:1/-1;padding-inline-start:44px}
  .krow .next{justify-content:flex-start}
  .search{flex:1 1 100%;min-width:0}
  .search input{width:100%}
  .tools{width:100%}
  .hint{display:none}
}
/* وضع التضمين: لوحة الحجز لوحدها جوه مكتب المتابعة */
body.embed main.wrap,body.embed .scrim,body.embed #dClose,body.embed #dPrev,body.embed #dNext,body.embed .fu-nav{display:none!important}
body.embed .drawer{transform:none;width:100%;box-shadow:none;transition:none}
body.embed-missing .drawer{display:none!important}
body.embed .embed-wait{display:flex;align-items:center;justify-content:center;height:100vh;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){.drawer,.scrim{transition:none}}
</style>
<style>
/* من الصفحة القديمة: نوافذ الأقساط وتعديل خطة الدفع (اللي بتفتح فوق الصفحة) */
.btn{padding:9px 14px;border:none;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;font-family:inherit;color:#fff}
.btn-grey{background:var(--fu-muted)}
.btn-inst{padding:9px 14px;border:none;border-radius:8px;cursor:pointer;font-weight:600;font-family:inherit;display:inline-flex;align-items:center;gap:7px;color:#fff}
.swal2-container{z-index:40000!important}

<script>
/* ============================================================
   إعدادات Firebase + الوضع التجريبي
============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyDj0bV5gsyRbqpxzW0Zd9wjYmq53-Xdj3w",
  authDomain: "fouad-perspective.firebaseapp.com",
  projectId: "fouad-perspective",
  storageBucket: "fouad-perspective.firebasestorage.app",
  messagingSenderId: "1068763865336",
  appId: "1:1068763865336:web:b791abcd22d536aedd5b0d",
  measurementId: "G-RY1FYVB3Q9"
};
const DEMO_MODE = new URLSearchParams(location.search).get('demo') === '1';
const TELEGRAM_BASE = 'https://us-central1-fouad-perspective.cloudfunctions.net/telegramBot';

let db = null;
if (!DEMO_MODE) {
  try { firebase.initializeApp(firebaseConfig); db = firebase.firestore(); }
  catch(e){ console.error('Firebase init error', e); }
} else { document.body.classList.add('demo'); }

/* الحالة العامة */
let allBookings = [];
let filteredBookings = [];
let showingArchive = false;
let currentOpenDetails = null;
let currentEditingBooking = null;
let selectedNewPlan = null;
let activeQuickFilter = 'active';

/* ============================================================
   تحميل الحجوزات (موفّر للقراءات):
   - الافتراضي: النشط فقط    - الأرشيف: عند الطلب فقط
============================================================ */
async function loadBookings() {
  const container = document.getElementById('bookingsContainer');
  container.innerHTML = '<div class="loading"><div class="loading-spinner"></div><p>جاري تحميل الحجوزات...</p></div>';
  try {
    if (DEMO_MODE) {
      allBookings = getDemoBookings();
    } else {
      let snapshot;
      if (showingArchive) {
        snapshot = await db.collection('tempBookings').orderBy('timestamp','desc').get();
      } else {
        snapshot = await db.collection('tempBookings')
          .where('status','in',['pending','pending_review','confirmed','paid'])
          .orderBy('timestamp','desc').get();
      }
      allBookings = [];
      snapshot.forEach(doc => allBookings.push({ id: doc.id, ...doc.data() }));
    }
    updateStats();
    updateQuickFilters();
    applyFilters();
    document.getElementById('lastUpdate').textContent =
      new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}) + (DEMO_MODE ? ' (تجريبي)' : '');
  } catch (error) {
    console.error('خطأ في تحميل الحجوزات:', error);
    showError('حدث خطأ في تحميل البيانات. تأكد من الاتصال والصلاحيات.');
  }
}

async function toggleArchive() {
  showingArchive = !showingArchive;
  const banner = document.getElementById('archiveBanner');
  const btn = document.getElementById('archiveBtn');
  if (showingArchive){ banner.classList.add('show'); btn.style.background='var(--warning)'; btn.innerHTML='<i class="fas fa-times"></i> إغلاق الأرشيف'; }
  else { banner.classList.remove('show'); btn.style.background='#6B7280'; btn.innerHTML='<i class="fas fa-archive"></i> الأرشيف'; }
  await loadBookings();
}

/* ============================================================
   الإحصائيات والفلاتر السريعة (محلية بدون قراءات)
============================================================ */
function updateStats() {
  document.getElementById('totalBookings').textContent = allBookings.length;
  document.getElementById('pendingBookings').textContent =
    allBookings.filter(b => ['pending','pending_review','confirmed'].includes(b.status)).length;
  const today = new Date().toDateString();
  document.getElementById('todayBookings').textContent =
    allBookings.filter(b => new Date(b.timestamp || b.bookingDate).toDateString() === today).length;
  let revenue = 0;
  allBookings.forEach(b => {
    if (b.status === 'paid' || b.status === 'transferred')
      revenue += b.paymentDetails?.paidAmount || b.pricing?.finalPriceNumber || extractNumberFromArabicText(b.pricing?.finalPrice) || 0;
  });
  document.getElementById('totalRevenue').textContent = revenue > 0 ? revenue.toLocaleString('ar-EG') + ' ج.م' : '0';
}

function updateQuickFilters() {
  const c = {
    active: allBookings.filter(b=>['pending','pending_review','confirmed','paid'].includes(b.status)).length,
    pending: allBookings.filter(b=>['pending','pending_review'].includes(b.status)).length,
    confirmed: allBookings.filter(b=>b.status==='confirmed').length,
    paid: allBookings.filter(b=>b.status==='paid').length,
    grants: allBookings.filter(b=>(b.bookingType||b.type)==='grant_request' && !['transferred','cancelled'].includes(b.status)).length,
    installments: allBookings.filter(b=>b.paymentDetails?.type==='installment' && b.status!=='cancelled').length,
  };
  const filters = [
    {id:'active',label:'النشطة',icon:'fa-bolt',count:c.active},
    {id:'pending',label:'بانتظار',icon:'fa-clock',count:c.pending},
    {id:'confirmed',label:'مؤكد',icon:'fa-check',count:c.confirmed},
    {id:'paid',label:'مدفوع',icon:'fa-money-bill',count:c.paid},
    {id:'grants',label:'المنح',icon:'fa-hand-holding-heart',count:c.grants},
    {id:'installments',label:'أقساط',icon:'fa-calendar-check',count:c.installments},
  ];
  if (showingArchive) {
    filters.push({id:'transferred',label:'محوّل',icon:'fa-exchange-alt',count:allBookings.filter(b=>b.status==='transferred').length});
    filters.push({id:'cancelled',label:'ملغي',icon:'fa-ban',count:allBookings.filter(b=>b.status==='cancelled').length});
  }
  document.getElementById('quickFilters').innerHTML = filters.map(f =>
    `<button class="qf-btn ${activeQuickFilter===f.id?'active':''}" onclick="setQuickFilter('${f.id}')"><i class="fas ${f.icon}"></i> ${f.label} <span class="count">${f.count}</span></button>`).join('');
}
function setQuickFilter(id){ activeQuickFilter=id; document.getElementById('filterType').value=''; document.getElementById('filterStatus').value=''; updateQuickFilters(); applyFilters(); }

function applyFilters() {
  const typeFilter = document.getElementById('filterType').value;
  const statusFilter = document.getElementById('filterStatus').value;
  const searchTerm = document.getElementById('searchBox').value.toLowerCase().trim();
  filteredBookings = allBookings.filter(b => {
    const type = b.bookingType || b.type;
    if (!['individual','grant_request'].includes(type)) return false;
    if (typeFilter && type !== typeFilter) return false;
    if (statusFilter && b.status !== statusFilter) return false;
    if (!typeFilter && !statusFilter) {
      switch (activeQuickFilter) {
        case 'active': if(!['pending','pending_review','confirmed','paid'].includes(b.status)) return false; break;
        case 'pending': if(!['pending','pending_review'].includes(b.status)) return false; break;
        case 'confirmed': if(b.status!=='confirmed') return false; break;
        case 'paid': if(b.status!=='paid') return false; break;
        case 'grants': if(type!=='grant_request' || ['transferred','cancelled'].includes(b.status)) return false; break;
        case 'installments': if(b.paymentDetails?.type!=='installment' || b.status==='cancelled') return false; break;
        case 'transferred': if(b.status!=='transferred') return false; break;
        case 'cancelled': if(b.status!=='cancelled') return false; break;
      }
    }
    if (searchTerm) {
      const hay = (b.id+' '+(b.customer?.name||'')+' '+(b.customer?.whatsapp||'')+' '+(b.courseName||'')+' '+(b.grantRequest?.applicant?.name||'')).toLowerCase();
      if (!hay.includes(searchTerm)) return false;
    }
    return true;
  });
  displayBookings();
}
function displayBookings() {
  const container = document.getElementById('bookingsContainer');
  if (filteredBookings.length === 0) {
    container.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i><h3>لا توجد حجوزات</h3><p>لم يتم العثور على حجوزات تطابق معايير البحث</p></div>`;
    return;
  }
  container.innerHTML = filteredBookings.map(createBookingCard).join('');
}

/* ============================================================
   مساعدات عامة
============================================================ */
function getStatusText(s){return {pending:'قيد الانتظار',pending_review:'قيد المراجعة',confirmed:'مؤكد',paid:'مدفوع',transferred:'تم التحويل ✓',cancelled:'ملغي',completed:'مكتمل'}[s]||s;}
function getTypeText(t){return t==='individual'?'حجز فردي':t==='grant_request'?'طلب منحة':'غير محدد';}
function getPaymentMethodText(m){return {vodafone:'فودافون كاش',instapay:'انستاباي',bank:'تحويل بنكي',card:'بطاقة بنكية',cash:'كاش',western_union:'ويسترن يونيون',other:'أخرى'}[m]||m;}
function getEmploymentText(s){return {student:'طالب',employed:'موظف',freelance:'عمل حر',unemployed:'بدون عمل',retired:'متقاعد',other:'أخرى'}[s]||s||'غير محدد';}

function extractNumberFromArabicText(text){ return BookingMoney.num(text); }
function _oldExtractNumberFromArabicText(text){
  if(!text) return 0;
  const ar=['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
  let r=text.toString();
  ar.forEach((a,i)=>{r=r.replace(new RegExp(a,'g'),i);});
  return parseInt(r.replace(/[^\d]/g,''))||0;
}
function formatPhoneForWhatsApp(p){
  if(!p) return null;
  let n=p.replace(/[^0-9]/g,'');
  if(n.length<7||n.length>15) return null;
  if(n.startsWith('01')&&n.length===11) return '20'+n.substring(1);
  if(n.startsWith('1')&&n.length===10) return '20'+n;
  if(n.startsWith('05')&&n.length===10) return '966'+n.substring(1);
  if(n.startsWith('5')&&n.length===9) return '966'+n;
  if(n.startsWith('07')&&n.length===10) return '962'+n.substring(1);
  return n;
}
function openWhatsAppUnified(phone,msg=''){
  const f=formatPhoneForWhatsApp(phone);
  if(!f){Swal.fire('تنبيه','رقم الهاتف غير صحيح','warning');return;}
  window.open(`https://wa.me/${f}?text=${encodeURIComponent(msg)}`,'_blank');
}

function checkPaymentStatus(b){ return {isPaid:b.status==='paid'||b.status==='transferred',isConfirmed:b.paymentConfirmed===true,method:b.paymentMethod||'غير محدد',reference:b.paymentReference||'لا يوجد'}; }
function smartRound(n){const r=Math.round(n);if(r%10===0||r%5===0)return r;return Math.ceil(n/5)*5;}
function cleanDataForFirebase(o){
  if(Array.isArray(o)) return o.map(cleanDataForFirebase);
  if(o!==null&&typeof o==='object'){const c={};for(const k in o){if(o.hasOwnProperty(k)&&o[k]!==undefined)c[k]=cleanDataForFirebase(o[k]);}return c;}
  return o;
}
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/`/g,'&#96;');}
// رقم تليفون جوه onclick: أرقام و+ بس
function escPhone(s){return String(s==null?'':s).replace(/[^0-9+]/g,'');}
  function getChoiceLabel(b){

function createBookingCard(booking){
  const type = booking.bookingType || booking.type || 'unknown';
  const status = String(booking.status || 'pending').replace(/[^a-z_]/g, '') || 'pending';
  const date = new Date(booking.timestamp || booking.bookingDate);
  const isGrant = type === 'grant_request';

  let name='غير محدد', phone='', icon='fa-user', color='#3B82F6';
  if (type==='individual' && booking.customer){ name=booking.customer.name||'غير محدد'; phone=booking.customer.whatsapp||''; }
  else if (isGrant){ name=booking.customer?.name||booking.grantRequest?.applicant?.name||'غير محدد'; phone=booking.customer?.whatsapp||booking.grantRequest?.applicant?.whatsapp||''; icon='fa-hand-holding-heart'; color='#9333EA'; }

  const needsAction = ['pending','pending_review'].includes(status)
    || (isGrant && booking.grantStatus!=='approved' && (booking.customerSelectedOffer||booking.customerProposal||booking.customerInfoReply))
    || (status==='confirmed' && booking.automationWorkflow?.receiptReceived);

  return `
  <div class="booking-card ${isGrant?'grant-card':''} ${needsAction?'needs-action':''}" id="booking-${booking.id}" data-status="${status}">
    <span class="status-badge status-${status}">${getStatusText(status)}</span>
    <button class="btn-delete" onclick="deleteBooking('${booking.id}')" title="حذف نهائي"><i class="fas fa-trash"></i></button>
    ${buildIndicators(booking, isGrant)}
    <div class="card-main" style="border-right-color:${color}">
      <div style="text-align:center">
        <div class="card-icon" style="background:${color}1a"><i class="fas ${icon}" style="color:${color}"></i></div>
        <div class="card-type-label" style="color:${color}">${getTypeText(type)}</div>
      </div>
      <div>
        <div class="card-meta">
          <span>#${booking.id ? booking.id.slice(-8).toUpperCase() : '---'}</span><span>|</span>
          <span>${date.toLocaleDateString('ar-EG')} - ${date.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}</span>
          ${isGrant ? buildGrantSupportChip(booking) : ''}
        </div>
        <div class="card-info">
          <div><i class="fas fa-user" style="color:var(--muted)"></i> <strong>${esc(name)}</strong></div>
          ${phone?`<div><i class="fas fa-phone" style="color:var(--muted)"></i> <span style="direction:ltr">${esc(phone)}</span></div>`:''}
          <div><i class="fas fa-book" style="color:var(--muted)"></i> <strong style="color:var(--fu-ink-2)">${esc(booking.courseName||'غير محدد')}</strong>${getChoiceLabel(booking)?`<span class="chip" style="background:var(--fu-violet-soft);color:#6D28D9;margin-right:6px"><i class="fas fa-box-open"></i> ${esc(getChoiceLabel(booking))}</span>`:''}</div>
          <div><i class="fas fa-tag" style="color:var(--muted)"></i> <strong style="color:var(--fu-ink);font-size:1.05rem;font-variant-numeric:tabular-nums">${esc(booking.pricing?.finalPrice||'0')}</strong></div>
        </div>
      </div>
      <div class="card-quick-btns">
        ${phone?`<button class="btn btn-sm" style="background:#25D366" onclick="openWhatsAppUnified('${escPhone(phone)}')" title="واتساب"><i class="fab fa-whatsapp"></i></button>`:''}
        <button class="btn btn-sm" style="background:var(--teal)" onclick="toggleDetails('${booking.id}')" title="التفاصيل الكاملة"><i class="fas fa-eye"></i></button>
      </div>
    </div>
    ${buildInstallmentsPreview(booking)}
    ${buildActionButtons(booking, type, status)}
  </div>`;
}

function buildGrantSupportChip(b){
  const sd=b.grantDetails?.supportDetails||{};
  let t='تقسيط ميسر',c='#3B82F6';
  if(sd.type==='full'){t='منحة كاملة 100%';c='#DC2626';}
  else if(sd.type==='partial'){t='جزئية '+(sd.percentage||0)+'%';c='#F59E0B';}
  return `<span class="chip" style="background:${c}1a;color:${c}"><i class="fas fa-hand-holding-heart"></i> ${t}</span>`;
}

function buildIndicators(b, isGrant){
  let h='<div class="indicators">'; let any=false;
  const add=(bg,ic,tx)=>{any=true;h+=`<span class="indicator" style="background:${bg}"><i class="fas ${ic}"></i> ${tx}</span>`;};
  if(b.telegramConnected) add('var(--fu-info)','fa-telegram','متصل بتليجرام');
  if(b.automationWorkflow?.receiptReceived) add('var(--fu-primary)','fa-receipt','إيصال مستلم');
  if(isGrant){
    if(b.customerInfoReply) add('var(--fu-accent)','fa-reply','رد على المعلومات');
    if(b.customerSelectedOffer) add('var(--fu-violet)','fa-check-circle','اختار العرض '+((b.customerSelectedOfferIndex||0)+1));
    if(b.customerProposal) add('var(--fu-violet)','fa-handshake','طلب عرض مخصص');
    if(b.negotiationStatus==='pending_response'&&!b.customerSelectedOffer&&!b.customerProposal) add('#6B7280','fa-clock','بانتظار رد العميل');
  }
  h+='</div>'; return any?h:'';
}

function buildInstallmentsPreview(b){
  if(b.paymentDetails?.type!=='installment') return '';
  const sch=b.paymentDetails.installmentSchedule||[];
  const paid=sch.filter(i=>i.status==='paid').length;
  const total=Math.max(0,sch.length-1);
  const next=sch.find(i=>i.status==='pending'&&i.installmentNumber>0);
  let nextHtml;
  if(next){
    const due=new Date(next.dueDate);
    const d=Math.floor((due-new Date())/86400000);
    const lbl=d<0?'⚠️ متأخر '+Math.abs(d)+' يوم':d===0?'⏰ اليوم':d<=7?'⏰ بعد '+d+' أيام':due.toLocaleDateString('ar-EG',{day:'numeric',month:'short'});
    nextHtml=`<div class="installment-stat" style="background:${d<0?'#FEF3C7':'#F0FDF4'}"><div class="installment-stat-value" style="color:${d<0?'#D97706':'#10B981'}">${next.amount.toLocaleString('ar-EG')} ج.م</div><div class="installment-stat-label">القسط القادم<br><small>${lbl}</small></div></div>`;
  } else {
    nextHtml=`<div class="installment-stat" style="background:var(--fu-primary-soft)"><div class="installment-stat-value" style="color:var(--fu-primary)"><i class="fas fa-check-circle"></i></div><div class="installment-stat-label" style="color:var(--fu-primary)">مكتمل الدفع</div></div>`;
  }
  return `<div class="installments-section">
    <div class="inst-head"><h4><i class="fas fa-calendar-check"></i> نظام الأقساط الشهرية</h4></div>
    <div class="installments-summary">
      <div class="installment-stat"><div class="installment-stat-value">${paid}/${total}</div><div class="installment-stat-label">الأقساط المدفوعة</div></div>
      <div class="installment-stat"><div class="installment-stat-value" style="color:var(--danger-d)">${(b.paymentDetails.remainingAmount||0).toLocaleString('ar-EG')} ج.م</div><div class="installment-stat-label">المتبقي</div></div>
      ${nextHtml}
    </div>
    <div class="installments-actions">
      <button class="btn-inst" style="background:var(--fu-info)" onclick="showInstallmentSchedule('${b.id}')"><i class="fas fa-table"></i> جدول الأقساط الكامل</button>
      ${next?`<button class="btn-inst pulse" style="background:var(--fu-accent)" onclick="markInstallmentAsPaid('${b.id}',${sch.indexOf(next)})"><i class="fas fa-check-double"></i> تسجيل دفع القسط</button>
      ${(b.telegramChatId||b.customer?.whatsapp)?`<button class="btn-inst" style="background:var(--fu-primary)" onclick="sendInstallmentReminder('${b.id}',${sch.indexOf(next)})"><i class="fas fa-paper-plane"></i> تذكير</button>`:''}`:''}
      <button class="btn-inst" style="background:var(--fu-violet)" onclick="showInstallmentsManager()"><i class="fas fa-calendar-alt"></i> إدارة كل الأقساط</button>
    </div>
  </div>`;
}

/* === أزرار الإجراءات الذكية === */
function buildActionButtons(booking, type, status){
  let b=''; const id=booking.id;

  if (type==='grant_request' && booking.grantStatus!=='approved'){
    const hasOffers=booking.negotiationOffers?.length>0;
    const hasResponse=booking.customerSelectedOffer||booking.customerProposal;
    b+='<div style="display:flex;flex-wrap:wrap;gap:10px;width:100%">';
    if(!hasOffers){
      b+=`<button class="btn" style="background:var(--fu-violet)" onclick="openGrantNegotiation('${id}')"><i class="fas fa-handshake"></i> بدء التفاوض</button>`;
      b+=`<button class="btn pulse" style="background:var(--fu-primary)" onclick="sendGrantApproval('${id}')"><i class="fas fa-check-double"></i> الموافقة النهائية</button>`;
    } else if(hasResponse){
      b+=`<button class="btn pulse" style="background:var(--fu-primary);font-size:1.05rem" onclick="sendGrantApproval('${id}')"><i class="fas fa-check-double"></i> الموافقة النهائية</button>`;
      if(booking.customerProposal) b+=`<button class="btn" style="background:var(--fu-accent)" onclick="viewCustomerProposal('${id}')"><i class="fas fa-eye"></i> عرض اقتراح العميل</button>`;
    } else {
      b+=`<button class="btn btn-grey" onclick="sendReminderToCustomer('${id}')"><i class="fas fa-bell"></i> تذكير العميل</button>`;
      b+=`<button class="btn" style="background:var(--fu-violet)" onclick="openGrantNegotiation('${id}')"><i class="fas fa-handshake"></i> عرض جديد</button>`;
    }
    b+=`<button class="btn" style="background:var(--fu-accent)" onclick="requestMoreGrantInfo('${id}')"><i class="fas fa-info-circle"></i> طلب معلومات</button>`;
    b+=`<button class="btn" style="background:var(--fu-danger)" onclick="sendGrantRejection('${id}')"><i class="fas fa-times"></i> رفض المنحة</button>`;
    b+='</div>';
    const flags=[];
    if(booking.customerInfoReply) flags.push('<span style="color:#F59E0B;font-weight:700"><i class="fas fa-check"></i> رد على المعلومات</span>');
    if(booking.customerSelectedOffer) flags.push('<span style="color:#8B5CF6;font-weight:700"><i class="fas fa-check"></i> اختار العرض '+((booking.customerSelectedOfferIndex||0)+1)+'</span>');
    if(booking.customerProposal) flags.push('<span style="color:#EC4899;font-weight:700"><i class="fas fa-check"></i> طلب عرض مخصص</span>');
    if(hasOffers && !hasResponse) flags.push('<span style="color:var(--fu-muted)"><i class="fas fa-clock"></i> بانتظار رد العميل</span>');
    if(flags.length) b+=`<div style="width:100%;margin-top:6px;padding:10px;background:var(--fu-violet-soft);border-radius:8px;display:flex;gap:18px;flex-wrap:wrap">${flags.join('')}</div>`;
  }
  else if (type==='grant_request' && booking.grantStatus==='approved'){
    const full=booking.isFullGrant||booking.pricing?.finalPriceNumber===0;
    b+=`<button class="btn pulse" style="background:var(--fu-primary);font-size:1.05rem" onclick="markAsPaidWithGrantAutomation('${id}')"><i class="fas fa-${full?'gift':'heart'}"></i> ${full?'تأكيد المنحة الكاملة':'تأكيد دفع المنحة'} + أتمتة</button>`;
    b+=`<span class="action-hint"><i class="fas fa-check-circle" style="color:var(--success)"></i> منحة معتمدة</span>`;
  }
  else {
    if(status==='pending'||status==='pending_review'){
      b+=`<button class="btn" style="background:var(--fu-info)" onclick="confirmBooking('${id}')"><i class="fas fa-check"></i> تأكيد الحجز</button>`;
      b+=`<button class="btn" style="background:var(--fu-accent)" onclick="cancelBooking('${id}')"><i class="fas fa-ban"></i> إلغاء</button>`;
    } else if(status==='confirmed'){
      if(booking.telegramConnected && booking.automationWorkflow?.receiptReceived){
        b+=`<button class="btn pulse" style="background:var(--fu-primary);font-size:1.05rem" onclick="markAsPaidWithAutomation('${id}')"><i class="fas fa-robot"></i> تأكيد الدفع + أتمتة كاملة</button>`;
        b+=`<button class="btn" style="background:var(--danger)" onclick="rejectPayment('${id}')"><i class="fas fa-times"></i> رفض الإيصال</button>`;
      } else if(booking.telegramConnected){
        b+=`<button class="btn pulse" style="background:var(--fu-primary);font-size:1.05rem" onclick="markAsPaidWithAutomation('${id}')"><i class="fas fa-robot"></i> تأكيد الدفع + أتمتة كاملة</button>`;
        b+=`<button class="btn" style="background:#F59E0B" onclick="requestReceipt('${id}')"><i class="fas fa-camera"></i> طلب إيصال</button>`;
        b+=`<button class="btn btn-grey" onclick="sendReminder('${id}')"><i class="fas fa-bell"></i> تذكير</button>`;
      } else {
        b+=`<button class="btn pulse" style="background:var(--fu-primary);font-size:1.05rem" onclick="markAsPaidWithAutomation('${id}')"><i class="fas fa-robot"></i> تأكيد الدفع + أتمتة كاملة</button>`;
        b+=`<button class="btn btn-grey" onclick="sendReminder('${id}')"><i class="fas fa-bell"></i> تذكير بالدفع</button>`;
      }
    } else if(status==='paid'){
      b+=`<button class="btn pulse" style="background:#3B82F6;font-size:1.05rem" onclick="transferToSpecialized('${id}','${type}')"><i class="fas fa-user-graduate"></i> تحويل للحسابات الفردية</button>`;
    } else if(status==='transferred'){
      b+=`<span style="color:var(--success);font-weight:800"><i class="fas fa-check-circle"></i> تم التحويل بنجاح</span>`;
      b+=`<button class="btn" style="background:var(--fu-primary)" onclick="openTransferred('${id}')"><i class="fas fa-external-link-alt"></i> فتح الصفحة المخصصة</button>`;
    } else if(status==='cancelled'){
      b+=`<span style="color:var(--muted)"><i class="fas fa-ban"></i> تم إلغاء هذا الحجز</span>`;
    }
  }
  if(status==='paid'||status==='confirmed'){
    b+=`<button class="btn" style="background:var(--fu-violet)" onclick="openPaymentPlanEditor('${id}')" title="تعديل خطة الدفع"><i class="fas fa-edit"></i> تعديل خطة الدفع</button>`;
  }
  return `<div class="card-actions">${b}</div>`;
}

/* ============================================================
   نافذة التفاصيل العائمة
============================================================ */
function toggleDetails(id){
  const win=document.getElementById('floatingDetails');
  const overlay=document.getElementById('floatingOverlay');
  const body=document.getElementById('floatingBody');
  const booking=allBookings.find(b=>b.id===id);
  if(!booking) return;
  if(win.style.display==='flex' && currentOpenDetails===id){ closeFloatingDetails(); return; }
  const type=booking.bookingType||booking.type;
  document.getElementById('floatingTitle').textContent =
    (type==='grant_request'?'تفاصيل طلب المنحة — ':'تفاصيل الحجز الفردي — ')+(booking.customer?.name||'');
  body.innerHTML=getFullDetailsContent(booking);
  body.scrollTop=0; overlay.style.display='block'; win.style.display='flex'; currentOpenDetails=id;
}
function closeFloatingDetails(){
  document.getElementById('floatingDetails').style.display='none';
  document.getElementById('floatingOverlay').style.display='none';
  currentOpenDetails=null;
}
function getFullDetailsContent(b){
  const t=b.bookingType||b.type;
  if(t==='individual') return createIndividualContent(b);
  if(t==='grant_request') return createGrantContent(b);
  return '<p style="text-align:center;color:var(--muted)">نوع غير مدعوم</p>';
}

/* ---- تفاصيل الحجز الفردي (غنية) ---- */
function createIndividualContent(booking){
  const c=booking.customer||{};
  const pricing=booking.pricing||{};
  const discounts=booking.discounts||[];
  const fields=[c.name,c.whatsapp,c.email,c.job,c.expectations,c.experience,c.applicationPlan,c.title,c.age,c.country,c.city,c.source];
  const completed=fields.filter(f=>f&&f.toString().trim()!=='').length;
  let level='جديد',lc='#3B82F6',li='fa-user',lbg='#DBEAFE';

  if(booking.totalSavings>0) h+=`<div style="background:var(--fu-danger-soft);padding:18px;border-radius:13px;text-align:center;margin-top:14px;border:2px solid #EF4444"><div style="color:var(--fu-danger)"><i class="fas fa-piggy-bank"></i> إجمالي التوفير</div><div style="font-size:2.2rem;font-weight:900;color:var(--danger-d)">${esc(booking.totalSavingsText||booking.totalSavings+' ج.م')}</div></div>`;

  h+=`<div class="dsec" style="border-color:#10B981"><div class="dsec-head" style="background:var(--fu-primary)"><span><i class="fas fa-user-check"></i> المعلومات الشخصية</span>${(c.name&&c.whatsapp)?'<span class="tag" style="color:#10B981"><i class="fas fa-check-circle"></i> مؤكد</span>':'<span class="tag" style="background:var(--fu-danger-soft);color:#DC2626"><i class="fas fa-exclamation-circle"></i> غير مكتمل</span>'}</div><div class="dsec-body"><div class="info-grid">`;
  const cards=[
    {v:c.name,l:'الاسم الكامل',i:'fa-signature',col:'#10B981',extra:c.title?`<span style="background:var(--fu-info-soft);color:var(--fu-info);padding:2px 10px;border-radius:12px;font-size:.8rem">${esc(c.title)}</span>`:''},
    {v:c.whatsapp,l:'واتساب',i:'fa-whatsapp',fab:true,col:'#25D366',dir:'ltr'},
    {v:c.email,l:'البريد الإلكتروني',i:'fa-envelope',col:'#3B82F6'},

    {v:c.source,l:'كيف عرف عنا',i:'fa-share-alt',col:'#06B6D4'},
  ];
  cards.forEach(cd=>{ if(cd.v) h+=`<div class="info-card" style="border-right-color:${cd.col}"><i class="${cd.fab?'fab':'fas'} ${cd.i}" style="color:${cd.col}"></i><div><div class="lbl">${cd.l}</div><div class="val" ${cd.dir?'style="direction:ltr"':''}>${esc(cd.v)} ${cd.extra||''}</div></div></div>`; });

  h+=`</div></div>`;

  if(c.expectations||c.experience||c.applicationPlan||c.notes){
    h+=`<div class="dsec" style="border-color:#F59E0B"><div class="dsec-head" style="background:var(--fu-accent)"><span><i class="fas fa-rocket"></i> الرؤية والطموحات</span></div><div class="dsec-body">`;

    if(c.expectations) h+=`<div class="story-card"><strong><i class="fas fa-star" style="color:#F59E0B"></i> التوقعات من الدورة</strong>${esc(c.expectations)}</div>`;
    if(c.applicationPlan) h+=`<div class="story-card" style="border-right-color:#10B981"><strong><i class="fas fa-tasks" style="color:#10B981"></i> خطة التطبيق العملي</strong>${esc(c.applicationPlan)}</div>`;
    if(c.notes) h+=`<div class="story-card" style="border-right-color:#EF4444;background:#FEF2F2"><strong><i class="fas fa-sticky-note" style="color:#EF4444"></i> ملاحظات خاصة</strong>${esc(c.notes)}</div>`;
    h+=`</div></div>`;
  }

  const ps=checkPaymentStatus(booking);
  h+=`<div class="dsec" style="border-color:#3B82F6"><div class="dsec-head" style="background:var(--fu-info)"><span><i class="fas fa-wallet"></i> معلومات الدفع</span>${booking.paymentConfirmed?'<span class="tag" style="color:#10B981"><i class="fas fa-check-circle"></i> دفع مؤكد</span>':(booking.status==='paid'?'<span class="tag" style="background:var(--fu-accent-soft);color:var(--fu-accent)"><i class="fas fa-clock"></i> بانتظار التأكيد</span>':'')}</div><div class="dsec-body"><div class="info-grid">
    <div class="info-card" style="border-right-color:${ps.isConfirmed?'#10B981':'#F59E0B'}"><i class="fas fa-circle-check" style="color:${ps.isConfirmed?'#10B981':'#F59E0B'}"></i><div><div class="lbl">حالة الدفع</div><div class="val">${ps.isConfirmed?'مؤكد ✓':'غير مؤكد'}</div></div></div>

function buildDetailInstallmentTable(booking){
  const pd=booking.paymentDetails;
  let h=`<div class="dsec" style="border-color:#F59E0B"><div class="dsec-head" style="background:var(--fu-accent)"><span><i class="fas fa-calendar-alt"></i> جدول الأقساط</span><span class="tag" style="color:#D97706">${pd.paidInstallments||0} من ${pd.totalInstallments||0}</span></div><div class="dsec-body">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px">
      <div class="price-box" style="border-color:#10B981"><div class="pb-l">المدفوع</div><div class="pb-v" style="color:#10B981;font-size:1.4rem">${(pd.paidAmount||0).toLocaleString('ar-EG')} ج.م</div></div>
      <div class="price-box" style="border-color:#F59E0B"><div class="pb-l">المتبقي</div><div class="pb-v" style="color:#F59E0B;font-size:1.4rem">${(pd.remainingAmount||0).toLocaleString('ar-EG')} ج.م</div></div>
      <div class="price-box" style="border-color:#3B82F6"><div class="pb-l">الإجمالي</div><div class="pb-v" style="color:#3B82F6;font-size:1.4rem">${(pd.totalAmount||0).toLocaleString('ar-EG')} ج.م</div></div>
    </div><div style="display:grid;gap:10px">`;
  (pd.installmentSchedule||[]).forEach((inst,i)=>{
    h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:13px;background:${inst.status==='paid'?'#DCFCE7':'#F9FAFB'};border-radius:10px;border-right:4px solid ${inst.status==='paid'?'#10B981':'#E5E7EB'}"><div style="display:flex;align-items:center;gap:12px"><i class="${inst.status==='paid'?'fas fa-check-circle':'far fa-circle'}" style="color:${inst.status==='paid'?'#10B981':'#9CA3AF'};font-size:1.2rem"></i><div><div style="font-weight:800">${i===0?'الدفعة الأولى':'القسط '+inst.installmentNumber}</div><div style="color:var(--muted);font-size:.85rem">${new Date(inst.dueDate).toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'})}</div></div></div><div style="text-align:left"><div style="font-weight:800;color:${inst.status==='paid'?'#10B981':'var(--dark)'}">${inst.amount.toLocaleString('ar-EG')} ج.م</div><div style="font-size:.82rem;color:${inst.status==='paid'?'#10B981':'#F59E0B'}">${inst.status==='paid'?'✓ مدفوع':'• بانتظار الدفع'}</div></div></div>`;
  });
  h+=`</div></div></div>`;
  return h;
}

function buildAdminNotes(booking){
  const notes=booking.adminNotes||[];
  if(!notes.length) return '';
  let h=`<div class="dsec" style="border-color:#6B7280"><div class="dsec-head" style="background:var(--fu-muted)"><span><i class="fas fa-note-sticky"></i> ملاحظات الإدارة (${notes.length})</span></div><div class="dsec-body">`;
  notes.slice().reverse().forEach(n=>{h+=`<div class="story-card" style="border-right-color:${n.isImportant?'#EF4444':'#6B7280'}">${n.isImportant?'<span style="color:#DC2626;font-weight:800">⚠️ مهمة — </span>':''}${esc(n.text)}<div style="color:var(--muted);font-size:.78rem;margin-top:8px">${new Date(n.timestamp).toLocaleString('ar-EG')} — ${esc(n.by||'admin')}</div></div>`;});
  h+=`</div></div>`;
  return h;
}

function createGrantContent(booking){
  const c=booking.customer||booking.grantRequest?.applicant||{};

      ${c.whatsapp?`<span style="color:#059669"><i class="fab fa-whatsapp"></i> ${esc(c.whatsapp)}</span>`:''}
      ${c.email?`<span style="color:#3B82F6"><i class="fas fa-envelope"></i> ${esc(c.email)}</span>`:''}

    <div class="price-box" style="background:var(--fu-primary-soft);border-color:#10B981"><div class="pb-l" style="color:var(--fu-primary)">المطلوب من العميل</div><div class="pb-v" style="color:#10B981;font-size:1.5rem">${(req||0).toLocaleString('ar-EG')} ج.م</div></div>

  if(booking.payment?.installmentDetails) h+=`<div style="margin-top:12px;background:var(--fu-surface);padding:14px;border-radius:12px;border-right:4px solid #3B82F6"><strong><i class="fas fa-calendar-alt" style="color:#3B82F6"></i> خطة السداد المعتمدة:</strong> ${esc(booking.payment.installmentDetails)}</div>`;

  h+=`</div></div></div>`;

  if(gd.reason||gd.challenges||gd.communityContribution){
    h+=`<div class="dsec" style="border-color:#9333EA"><div class="dsec-head" style="background:var(--fu-violet)"><span><i class="fas fa-book-open"></i> القصة والدافع</span></div><div class="dsec-body">`;
    if(gd.reason) h+=`<div class="story-card" style="border-right-color:#9333EA"><strong><i class="fas fa-question-circle" style="color:#9333EA"></i> لماذا يطلب المنحة</strong>${esc(gd.reason)}</div>`;
    if(gd.challenges) h+=`<div class="story-card" style="border-right-color:#DC2626"><strong><i class="fas fa-mountain" style="color:#DC2626"></i> التحديات</strong>${esc(gd.challenges)}</div>`;
    if(gd.communityContribution) h+=`<div class="story-card" style="border-right-color:#10B981"><strong><i class="fas fa-hands-helping" style="color:#10B981"></i> المساهمة المجتمعية</strong>${esc(gd.communityContribution)}</div>`;
    h+=`</div></div>`;
  }

  h+=`<div class="dsec" style="border-color:#9333EA"><div class="dsec-head" style="background:var(--fu-violet)"><span><i class="fas fa-chart-line"></i> الوضع المالي</span></div><div class="dsec-body"><div class="info-grid">
    <div class="info-card" style="border-right-color:#8B5CF6"><i class="fas fa-briefcase" style="color:#8B5CF6"></i><div><div class="lbl">الوضع الوظيفي</div><div class="val">${getEmploymentText(financial.employmentStatus)}</div></div></div>
    <div class="info-card" style="border-right-color:#10B981"><i class="fas fa-money-bill-wave" style="color:#10B981"></i><div><div class="lbl">دخل ثابت</div><div class="val">${financial.hasIncome==='yes'?'نعم':financial.hasIncome==='no'?'لا':financial.hasIncome==='irregular'?'غير منتظم':'غير محدد'}</div></div></div>
    ${financial.monthlyIncome?`<div class="info-card" style="border-right-color:#3B82F6"><i class="fas fa-wallet" style="color:#3B82F6"></i><div><div class="lbl">الدخل الشهري</div><div class="val">${esc(financial.monthlyIncome)}</div></div></div>`:''}
    ${financial.dependents?`<div class="info-card" style="border-right-color:#EC4899"><i class="fas fa-users" style="color:#EC4899"></i><div><div class="lbl">عدد المعالين</div><div class="val">${esc(financial.dependents)}</div></div></div>`:''}
  </div></div></div>`;

  h+=buildNegotiationHistory(booking);

  if(gd.commitments&&typeof gd.commitments==='object'){
    h+=`<div class="dsec" style="border-color:#10B981"><div class="dsec-head" style="background:var(--fu-primary)"><span><i class="fas fa-clipboard-check"></i> الالتزامات والتعهدات</span></div><div class="dsec-body">`;
    Object.entries(gd.commitments).forEach(([k,v])=>{h+=`<div class="commit-item ${v?'commit-ok':'commit-no'}"><i class="fas ${v?'fa-check-circle':'fa-times-circle'}" style="color:${v?'#10B981':'#EF4444'}"></i> ${esc(commitmentLabel(k))}</div>`;});
    h+=`</div></div>`;
  }

  h+=`<div class="quick-actions-bar">`;
  if(c.whatsapp) h+=`<button class="qa-btn" style="background:#1FA855" onclick="openWhatsAppUnified('${escPhone(c.whatsapp)}')"><i class="fab fa-whatsapp"></i> واتساب</button>`;
  if(grantStatus!=='approved'){
    h+=`<button class="qa-btn" style="background:var(--fu-violet)" onclick="openGrantNegotiation('${booking.id}')"><i class="fas fa-handshake"></i> عرض / تفاوض</button>`;
    h+=`<button class="qa-btn" style="background:var(--fu-primary)" onclick="sendGrantApproval('${booking.id}')"><i class="fas fa-check-double"></i> الموافقة النهائية</button>`;
    h+=`<button class="qa-btn" style="background:var(--fu-accent)" onclick="requestMoreGrantInfo('${booking.id}')"><i class="fas fa-info-circle"></i> طلب معلومات</button>`;
    h+=`<button class="qa-btn" style="background:var(--fu-danger)" onclick="sendGrantRejection('${booking.id}')"><i class="fas fa-times"></i> رفض</button>`;
  } else {
    const full=booking.isFullGrant||booking.pricing?.finalPriceNumber===0;
    h+=`<button class="qa-btn" style="background:var(--fu-primary)" onclick="markAsPaidWithGrantAutomation('${booking.id}')"><i class="fas fa-${full?'gift':'heart'}"></i> ${full?'تأكيد المنحة الكاملة':'تأكيد دفع المنحة'} + أتمتة</button>`;
  }
  h+=`<button class="qa-btn" style="background:var(--fu-muted)" onclick="addNote('${booking.id}')"><i class="fas fa-sticky-note"></i> ملاحظة</button>`;
  h+=`</div>`;
  h+=buildAdminNotes(booking);
  return h;
}

function buildNegotiationHistory(booking){
  const offers=booking.negotiationOffers||[];
  if(!offers.length && !booking.customerProposal && !booking.customerInfoReply) return '';
  let h=`<div class="dsec" style="border-color:#8B5CF6"><div class="dsec-head" style="background:var(--fu-violet)"><span><i class="fas fa-handshake"></i> سجل التفاوض وردود العميل</span></div><div class="dsec-body">`;
  if(offers.length){
    h+=`<div style="margin-bottom:14px"><strong style="color:#7C3AED">العروض المرسلة (${offers.length}):</strong></div>`;
    offers.forEach((o,i)=>{
      const selected=booking.customerSelectedOffer && booking.customerSelectedOfferIndex===i;
      h+=`<div class="offer-row" ${selected?'style="border-color:#10B981;background:var(--fu-primary-soft)"':''}><div><strong>عرض ${i+1}</strong> — ${o.amount===0?'<span style="color:#DC2626;font-weight:800">منحة كاملة</span>':o.amount.toLocaleString('ar-EG')+' ج.م'} ${o.months>0?'<span style="color:var(--muted)">على '+o.months+' أقساط</span>':'<span style="color:var(--muted)">دفعة واحدة</span>'}</div>${selected?'<span style="color:#10B981;font-weight:800"><i class="fas fa-check-circle"></i> اختاره العميل</span>':''}</div>`;
    });
  }
  if(booking.customerProposal) h+=`<div class="story-card" style="border-right-color:#EC4899;background:#FDF2F8;margin-top:12px"><strong><i class="fas fa-comment-dots" style="color:#EC4899"></i> اقتراح العميل</strong>${esc(booking.customerProposal)}${booking.customerProposalDate?`<div style="color:var(--muted);font-size:.78rem;margin-top:6px">${new Date(booking.customerProposalDate).toLocaleString('ar-EG')}</div>`:''}</div>`;
  if(booking.customerInfoReply) h+=`<div class="story-card" style="border-right-color:#F59E0B;background:var(--fu-accent-soft);margin-top:12px"><strong><i class="fas fa-reply" style="color:#F59E0B"></i> رد العميل على طلب المعلومات</strong>${esc(booking.customerInfoReply)}</div>`;
  h+=`</div></div>`;
  return h;
}

/* ============================================================
   تأكيد الدفع الكامل / الدفعة الأولى (مع التوزيع الذكي)
============================================================ */
async function markAsPaid(bookingId){
  const doc=await dbGet('tempBookings',bookingId);
  if(!doc.exists){ Swal.fire('خطأ!','لم يتم العثور على الحجز','error'); return false; }
  const booking={id:doc.id,...doc.data()};
  const isInstallment = booking.payment?.code==='installment' || booking.payment?.code?.startsWith('installment_')
    || booking.payment?.method?.includes('قسط') || booking.payment?.installmentDetails
    || booking.paymentDetails?.type==='installment';
  const installmentInfo = booking.payment?.installmentDetails || booking.payment?.installmentHTML || 'غير محدد';
  const totalAmount = booking.pricing?.finalPriceNumber || extractNumberFromArabicText(booking.pricing?.finalPrice) || 0;

  const result=await Swal.fire({
    title:isInstallment?'📋 تسجيل الدفعة الأولى':'✅ تأكيد الدفع الكامل',
    html:'<div style="text-align:right">'
      +'<div style="background:var(--fu-info-soft);padding:14px;border-radius:10px;margin-bottom:18px"><h4 style="color:var(--fu-info)"><i class="fas fa-book"></i> '+esc(booking.courseName||'الدورة')+'</h4><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px"><div><span style="color:var(--fu-muted)">السعر الكلي:</span> <strong style="font-size:1.1rem">'+(totalAmount>0?totalAmount.toLocaleString('ar-EG')+' ج.م':booking.pricing?.finalPrice||'0 ج.م')+'</strong></div><div><span style="color:var(--fu-muted)">نوع الدفع:</span> <strong style="color:'+(isInstallment?'#F59E0B':'#10B981')+'">'+(isInstallment?'أقساط':'دفعة واحدة')+'</strong></div></div></div>'
      +(isInstallment?'<div style="background:var(--fu-accent-soft);padding:14px;border-radius:10px;margin-bottom:16px;border-right:3px solid #F59E0B"><div style="color:var(--fu-accent);font-weight:700;margin-bottom:8px"><i class="fas fa-info-circle"></i> خطة الأقساط المختارة من العميل:</div><div style="background:var(--fu-surface);padding:10px;border-radius:8px;color:#78350F">'+esc(installmentInfo)+'</div></div>'
        +'<label style="font-weight:700;display:block;margin-bottom:6px">مبلغ الدفعة الأولى: *</label><input type="number" id="firstPaymentAmount" class="swal2-input" placeholder="السعر الكلي: '+totalAmount.toLocaleString('ar-EG')+' ج.م" style="width:90%">'
        +'<label style="font-weight:700;display:block;margin:12px 0 6px">عدد الأقساط المتبقية (1-18): *</label><input type="number" id="remainingInstallments" class="swal2-input" min="1" max="18" value="3" style="width:90%" oninput="if(this.value>18)this.value=18;if(this.value<1)this.value=1;calcInstPreview('+totalAmount+')">'
        +'<div id="instPreview" style="display:none;background:var(--fu-surface);padding:14px;border-radius:8px;margin-top:12px"><h5 style="color:var(--fu-accent);margin-bottom:8px"><i class="fas fa-list"></i> جدول الأقساط:</h5><div id="instDetails"></div></div>':'')
      +'<label style="font-weight:700;display:block;margin:14px 0 6px">طريقة الدفع: *</label><select id="paymentMethodUsed" class="swal2-input" style="width:90%"><option value="">اختر طريقة الدفع</option><option value="vodafone">فودافون كاش</option><option value="instapay">انستاباي</option><option value="bank">تحويل بنكي</option><option value="card">بطاقة بنكية</option><option value="cash">كاش (نقدي)</option><option value="western_union">ويسترن يونيون</option><option value="other">أخرى</option></select>'
      +'<label style="font-weight:700;display:block;margin:12px 0 6px">رقم المرجع/العملية: (اختياري)</label><input id="paymentReference" class="swal2-input" placeholder="مثال: TRX123456789" style="width:90%;direction:ltr">'
      +'</div>',
    showCancelButton:true,confirmButtonText:isInstallment?'📋 تسجيل الدفعة الأولى':'✅ تأكيد الدفع الكامل',cancelButtonText:'إلغاء',confirmButtonColor:'#10B981',width:'700px',
    didOpen:()=>{ if(isInstallment){ const m=(installmentInfo.match(/(\d+)/)); if(m){const v=parseInt(m[1]); if(v>=1&&v<=18) document.getElementById('remainingInstallments').value=v;} } },
    preConfirm:()=>{
      const method=document.getElementById('paymentMethodUsed').value;
      if(!method){Swal.showValidationMessage('⚠️ اختر طريقة الدفع');return false;}
      const reference=document.getElementById('paymentReference').value||'لا يوجد';
      if(isInstallment){
        const fp=parseFloat(document.getElementById('firstPaymentAmount').value);
        const ni=parseInt(document.getElementById('remainingInstallments').value);
        if(!fp||fp<=0){Swal.showValidationMessage('⚠️ أدخل مبلغ الدفعة الأولى');return false;}
        if(fp>totalAmount){Swal.showValidationMessage('⚠️ الدفعة الأولى أكبر من السعر الكلي');return false;}
        if(!ni||ni<1||ni>18){Swal.showValidationMessage('⚠️ عدد الأقساط بين 1 و 18');return false;}
        return {method,reference,firstPayment:fp,numInstallments:ni,isInstallment:true};
      }
      return {method,reference,isInstallment:false};
    }
  });
  if(!result.isConfirmed) return false;
  try{
    let upd={status:'paid',paidAt:new Date().toISOString(),paymentMethod:result.value.method,paymentReference:result.value.reference,paymentConfirmed:true,paymentConfirmedAt:new Date().toISOString(),paymentConfirmedBy:'admin'};
    if(result.value.isInstallment){
      const fp=result.value.firstPayment, ni=result.value.numInstallments;
      const remaining=Math.max(0,totalAmount-fp);
      // جدول بالجنيه الصحيح، والكسر على آخر قسط، وتواريخ القاهرة (من js/booking-money.js)
      const schedule=BookingMoney.buildSchedule(totalAmount,fp,ni,{method:result.value.method,reference:result.value.reference});
      upd.paymentDetails={type:'installment',totalAmount,paidAmount:fp,remainingAmount:remaining,installmentSchedule:schedule,totalInstallments:ni+1,paidInstallments:1,nextDueDate:schedule[1]?.dueDate||null,fullyPaid:false};
    } else {
      upd.paymentDetails={type:'full',totalAmount,paidAmount:totalAmount,remainingAmount:0,fullyPaid:true,paidAt:new Date().toISOString()};
    }
    await dbUpdate('tempBookings',bookingId,cleanDataForFirebase(upd));
    return true;
  }catch(e){ console.error(e); Swal.fire('خطأ!','حدث خطأ في تسجيل الدفع','error'); return false; }
}

  const booking=allBookings.find(b=>b.id===bookingId); if(!booking) return;
  const saved=booking.negotiationOffers||[];
  if(saved.length===0){
    const sd=booking.grantDetails?.supportDetails||{};
    const bp=booking.coursePrice||booking.pricing?.basePriceNumber||7500;
    const sp=booking.salePrice||booking.pricing?.priceAfterTimedOffers||bp;
    const r=await Swal.fire({title:'🎯 كيف تريد المتابعة؟',html:'<div style="text-align:right"><div style="margin-bottom:18px"><h4>طلب العميل الأصلي:</h4>'+getCustomerRequestDisplay(sd.type,sd,bp,sp)+'</div><label style="display:block;background:var(--fu-primary-soft);padding:14px;border-radius:10px;border:2px solid #10B981;cursor:pointer;margin-bottom:10px"><input type="radio" name="action" value="approve" checked> <strong style="color:var(--fu-primary)">موافقة فورية</strong> — على طلب العميل مباشرة</label><label style="display:block;background:var(--fu-info-soft);padding:14px;border-radius:10px;border:2px solid #3B82F6;cursor:pointer"><input type="radio" name="action" value="negotiate"> <strong style="color:var(--fu-info)">إنشاء عروض بديلة</strong> — للتفاوض أولاً</label></div>',showCancelButton:true,confirmButtonText:'متابعة',cancelButtonText:'إلغاء',confirmButtonColor:'#10B981',width:'650px',preConfirm:()=>document.querySelector('input[name="action"]:checked')?.value});
    if(!r.isConfirmed) return;
    if(r.value==='negotiate'){ openGrantNegotiation(bookingId); return; }
    await executeGrantApproval(bookingId,createDirectOfferFromRequest(sd.type,sd,bp,sp),true);
    return;
  }
  let html='<div style="text-align:right"><h4>اختر العرض النهائي:</h4>';
  saved.forEach((o,i)=>{html+='<label style="display:block;background:var(--fu-sunken);padding:12px;border-radius:8px;border:2px solid #E5E7EB;margin:6px 0;cursor:pointer"><input type="radio" name="sel" value="'+i+'" '+(i===0?'checked':'')+'> <strong>عرض '+(i+1)+':</strong> '+(o.amount===0?'<span style="color:#10B981">منحة كاملة</span>':o.amount.toLocaleString('ar-EG')+' ج.م')+(o.months>0?' - '+o.months+' أقساط':' - دفعة واحدة')+'</label>';});
  html+='<label style="display:block;background:var(--fu-info-soft);padding:12px;border-radius:8px;border:2px dashed #3B82F6;margin:6px 0;cursor:pointer"><input type="radio" name="sel" value="new"> <strong style="color:var(--fu-info)">إنشاء عرض جديد</strong></label></div>';
  const {value:sel}=await Swal.fire({title:'✅ الموافقة النهائية',html,showCancelButton:true,confirmButtonText:'تأكيد الموافقة',cancelButtonText:'إلغاء',confirmButtonColor:'#10B981',width:'600px',preConfirm:()=>document.querySelector('input[name="sel"]:checked')?.value});
  if(sel===undefined||sel===null) return;
  if(sel==='new'){ openGrantNegotiation(bookingId); return; }

function createDirectOfferFromRequest(type,sd,bp,sp){
  if(type==='full') return {type:'full',amount:0,months:0,timestamp:new Date().toISOString()};
  if(type==='partial'){ const amt=sd.affordableAmount||0; const m=sd.installmentRequested?(sd.installmentMonths||0):0; return {type:'amount',amount:amt,months:m,timestamp:new Date().toISOString()}; }
  if(type==='installment'){ return {type:'amount',amount:sp,months:sd.months||6,timestamp:new Date().toISOString()}; }
  return {type:'amount',amount:sp||bp,months:0,timestamp:new Date().toISOString()};
}
function getCustomerRequestDisplay(type,sd,bp,sp){

/* === الدالة المُصلَّحة: تبني payment + paymentDetails بنوع التقسيط الصحيح
       + تزامن grantDetails.supportDetails مع العرض المعتمد
       (البوت يقرأ منها عدد الأقساط والقسط الشهري عند بناء رسالة الموافقة النهائية) === */
async function executeGrantApproval(bookingId,offer,isDirect){
  try{
    const booking=allBookings.find(b=>b.id===bookingId);
    const bp=booking.pricing?.basePriceNumber||booking.coursePrice||7500;
    const finalAmount=offer.amount;
    const isFullGrant=offer.type==='full'||finalAmount===0;
    const upd={
      status:'confirmed',grantStatus:'approved',approvedAt:new Date().toISOString(),approvedOffer:offer,grantApprovalLocked:true,
      'pricing.finalPrice':finalAmount.toLocaleString('ar-EG')+' ج.م','pricing.finalPriceNumber':finalAmount,
      totalSavings:bp-finalAmount,totalSavingsText:(bp-finalAmount).toLocaleString('ar-EG')+' ج.م',
      isFullGrant,requiresPayment:!isFullGrant
    };
    /* حفظ الطلب الأصلي مرة واحدة فقط (قبل ما نكتب فوقه) — للسجل والمراجعة */
    const oldSD=booking.grantDetails?.supportDetails||{};
    if(!booking.grantDetails?.originalRequest && Object.keys(oldSD).length){
      upd['grantDetails.originalRequest']={...oldSD,savedAt:new Date().toISOString()};
    }
    if(offer.months>0){
      const monthly=Math.ceil(finalAmount/offer.months);
      upd.payment={code:'installment_'+offer.months,method:offer.months+' أقساط',type:'installment',installmentDetails:offer.months+' أقساط × '+monthly.toLocaleString('ar-EG')+' ج.م',installmentHTML:offer.months+' أقساط × '+monthly.toLocaleString('ar-EG')+' ج.م'};
      upd.paymentDetails={type:'installment',totalAmount:finalAmount,monthlyAmount:monthly,totalInstallments:offer.months,remainingAmount:finalAmount,paidAmount:0,fullyPaid:false};
      upd['grantDetails.supportType']='installment';
      /* 🔧 الإصلاح الجوهري: تحديث supportDetails بأرقام العرض المعتمد بدل أرقام الطلب القديم */
      upd['grantDetails.supportDetails.type']='installment';
      upd['grantDetails.supportDetails.months']=offer.months;
      upd['grantDetails.supportDetails.monthlyAmount']=monthly;
      upd['grantDetails.supportDetails.affordableAmount']=finalAmount;
      upd['grantDetails.supportDetails.installmentRequested']=true;
      upd['grantDetails.supportDetails.installmentMonths']=offer.months;
    } else {
      upd.payment={code:isFullGrant?'full_grant':'cash',method:isFullGrant?'منحة كاملة':'دفعة واحدة',type:'cash'};
      upd.paymentDetails={type:'cash',totalAmount:finalAmount,remainingAmount:finalAmount,paidAmount:0,fullyPaid:isFullGrant};
      upd['grantDetails.supportType']=isFullGrant?'full':'partial';
      /* 🔧 نفس المزامنة لحالة الدفعة الواحدة / المنحة الكاملة */
      upd['grantDetails.supportDetails.type']=isFullGrant?'full':'partial';
      upd['grantDetails.supportDetails.months']=0;
      upd['grantDetails.supportDetails.monthlyAmount']=null;
      upd['grantDetails.supportDetails.affordableAmount']=finalAmount;
      upd['grantDetails.supportDetails.installmentRequested']=false;
      upd['grantDetails.supportDetails.installmentMonths']=null;
      upd['grantDetails.supportDetails.percentage']=isFullGrant?100:Math.max(0,Math.round(100-(finalAmount/bp*100)));
    }
    if(isDirect){ upd.negotiationOffers=[offer]; upd.customerSelectedOffer=true; upd.customerSelectedOfferIndex=0; upd.directApproval=true; }
    await dbUpdate('tempBookings',bookingId,cleanDataForFirebase(upd));
    if(booking.telegramChatId) await tgPost('/approve-grant-final',{bookingId,selectedOffer:offer});
    Swal.fire({icon:'success',title:'تمت الموافقة على المنحة!',html:'<p>'+(isFullGrant?'منحة كاملة 100%':'المطلوب: '+finalAmount.toLocaleString('ar-EG')+' ج.م'+(offer.months>0?' على '+offer.months+' أقساط':' دفعة واحدة'))+'</p><p style="color:var(--fu-muted);font-size:.9rem;margin-top:8px">'+(isDirect?'تم الموافقة المباشرة':'تم إرسال الموافقة النهائية للعميل')+'</p>',confirmButtonColor:'#10B981'});
    reload();
  }catch(e){ console.error(e); Swal.fire('خطأ!','فشلت الموافقة، حاول مرة أخرى','error'); }
}

      if(!r.isConfirmed) return;
      await dbUpdate('tempBookings',bookingId,{status:'paid',paidAt:new Date().toISOString(),paymentMethod:'منحة كاملة 100%',paymentReference:'FULL_GRANT',paymentConfirmed:true,paymentConfirmedAt:new Date().toISOString(),paymentConfirmedBy:'admin',paymentDetails:{type:'full_grant',totalAmount:0,paidAmount:0,remainingAmount:0,fullyPaid:true,grantType:'full'}});
      const re=await dbGet('tempBookings',bookingId);

        setTimeout(()=>autoTransferToSpecialized(bookingId),DEMO_MODE?300:2000);
      }
    }
  }catch(e){ console.error(e); Swal.fire('خطأ!','حدث خطأ في العملية','error'); }
}

async function checkExistingUser(booking){
  if(DEMO_MODE) return {exists:false,userId:null};
  try{
    const email=booking.customer?.email, wa=booking.customer?.whatsapp;
    if(email){const q=await db.collection('users').where('personalInfo.email','==',email).limit(1).get();if(!q.empty)return{exists:true,userId:q.docs[0].id};}
    if(wa){const q=await db.collection('users').where('personalInfo.whatsapp','==',wa).limit(1).get();if(!q.empty)return{exists:true,userId:q.docs[0].id};}
    return {exists:false,userId:null};
  }catch(e){console.error('خطأ البحث:',e);return {exists:false,userId:null};}
}
