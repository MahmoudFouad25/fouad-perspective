<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>الحجوزات — منظور الفؤاد</title>
<link rel="stylesheet" href="../css/fouad-ui.css">
<script src="../js/fouad-ui.js" defer></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="../js/admin-guard.js"></script>
<script src="../js/bot-client.js"></script>
<script src="../js/booking-money.js"></script>
<style>
/* صفحة الحجوزات الجديدة: طوابير «محتاج إيدك» ← قايمة أو لوحة مراحل ← لوحة جانبية للعميل.
   الألوان من css/fouad-ui.css. الأفعال كلها من نفس كود book-bot-online (مكتوب تحت زي ما هو). */
:root{
  --ink:var(--fu-ink); --ink-2:var(--fu-ink-2); --muted:var(--fu-muted);
  --paper:var(--fu-paper); --surface:var(--fu-surface); --sunken:var(--fu-sunken); --hover:#F1EEE6;
  --line:var(--fu-line); --line-2:var(--fu-line-2);
  --primary:var(--fu-primary); --primary-2:var(--fu-primary-2); --primary-soft:var(--fu-primary-soft);
  --accent:var(--fu-accent); --accent-soft:var(--fu-accent-soft);
  --danger:var(--fu-danger); --danger-soft:var(--fu-danger-soft);
  --info:var(--fu-info); --info-soft:var(--fu-info-soft);
  --violet:var(--fu-violet); --violet-soft:var(--fu-violet-soft);
  --on:var(--fu-on); --scrim:rgba(20,24,21,.38);
  --shadow:var(--fu-shadow); --shadow-lg:0 12px 40px rgba(31,42,36,.18);
  --r:12px; --r-sm:8px;
  /* أسماء الكود القديم (نوافذ الأقساط وتعديل الخطة) */
  --success:var(--fu-primary); --success-d:var(--fu-primary-2); --warning:var(--fu-accent); --danger-d:var(--fu-danger);
  --purple:var(--fu-violet); --grant:var(--fu-violet); --teal:var(--fu-info); --dark:var(--fu-ink); --light:var(--fu-sunken); --border:var(--fu-line);
  --primary-d:var(--fu-primary-2); --radius:12px; --shadow-sm:var(--fu-shadow); --shadow-md:0 6px 18px rgba(31,42,36,.08);
}
*{box-sizing:border-box}
body{margin:0;font-size:14.5px}
button{cursor:pointer;font:inherit;color:inherit}
input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1360px;margin:0 auto;padding-inline:16px}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:22px 14px}
.head h1{margin:0;font-size:24px;font-weight:700}
.head p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.demo-pill{display:none;margin-inline-start:8px;vertical-align:middle;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:2px 10px;border-radius:99px}
body.demo .demo-pill{display:inline-block}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{position:relative}
.search input{width:300px;max-width:100%;padding:9px 36px 9px 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface)}
.search svg{position:absolute;right:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none}
.seg{display:inline-flex;background:var(--sunken);border-radius:var(--r-sm);padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:6px;font-weight:500;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg svg,.ib svg{width:15px;height:15px}
.ib{width:36px;height:36px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);display:inline-grid;place-items:center;flex:none;position:relative}
.ib:hover{background:var(--sunken)}
.menu{position:absolute;top:calc(100% + 6px);left:0;min-width:210px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg);padding:6px;z-index:45;display:grid}
.menu button{border:0;background:transparent;text-align:right;padding:9px 12px;border-radius:6px;color:var(--ink);font-size:14px;display:flex;gap:10px;align-items:center}
.menu button:hover{background:var(--sunken)}
.menu button i{width:16px;color:var(--muted);text-align:center}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.menu .dz{color:var(--danger)} .menu .dz i{color:var(--danger)}

.qlabel{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 8px}
.queues{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.q{text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;box-shadow:var(--shadow)}
.q:hover{border-color:var(--line-2)}
.q[aria-pressed="true"]{border-color:var(--qc);box-shadow:0 0 0 1px var(--qc)}
.q .l{font-weight:600;font-size:14px;grid-column:1}
.q .s{color:var(--muted);font-size:12.5px;grid-column:1}
.q .n{font-size:26px;font-weight:700;line-height:1.1;color:var(--qc);grid-row:1/span 2;grid-column:2}
.q.zero .n{color:var(--muted)}

.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:7px 12px;border-radius:var(--r-sm);color:var(--ink-2);font-weight:500;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tabs button:hover{background:var(--sunken)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:600}
.tabs .c{font-size:12px;opacity:.75}
.chipf{display:flex;gap:6px}
.chipf button{border:1px solid var(--line-2);background:var(--surface);padding:5px 12px;border-radius:99px;font-size:13px;color:var(--ink-2)}
.chipf button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600}
.archive-note{margin-top:10px;background:var(--accent-soft);color:var(--accent);border-radius:var(--r-sm);padding:8px 12px;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.archive-note button{border:0;background:none;color:inherit;font-weight:600;text-decoration:underline}

.lhead,.krow{display:grid;grid-template-columns:minmax(200px,1.4fr) minmax(150px,1.1fr) 150px 132px 96px 200px;gap:14px;align-items:center;padding:10px 12px}
.lhead{font-size:12px;font-weight:600;color:var(--muted);padding-block:8px}
.krow{border-radius:var(--r-sm);cursor:pointer;border:1px solid transparent;position:relative}
.krow:hover{background:var(--hover)}
.krow[aria-selected="true"]{background:var(--surface);border-color:var(--line-2);box-shadow:var(--shadow)}
.krow.attn::before{content:"";position:absolute;right:-1px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--accent)}
.krow + .krow{margin-top:2px}
.who{display:flex;gap:10px;align-items:center;min-width:0}
.av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;font-size:13px;background:var(--sunken);color:var(--ink-2)}
.av.grant{background:var(--violet-soft);color:var(--violet)}
.who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .ph{display:block;color:var(--muted);font-size:12.5px;direction:ltr;text-align:right}
.course{min-width:0}
.course b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.course span,.money span{display:block;color:var(--muted);font-size:12.5px}
.money b{font-weight:600}
.money .late{color:var(--danger);font-weight:600}
.when{color:var(--muted);font-size:12.5px}
.next{display:flex;justify-content:flex-end}
.kempty{padding:48px 16px;text-align:center;color:var(--muted)}
.kempty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.kempty .spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--primary);border-radius:50%;margin:0 auto 12px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.kbadge{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-weight:600;font-size:12.5px;white-space:nowrap;background:var(--sunken);color:var(--ink-2)}
.kbadge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-wait{background:var(--accent-soft);color:var(--accent)} .b-info{background:var(--info-soft);color:var(--info)}
.b-ok{background:var(--primary-soft);color:var(--primary)} .b-bad{background:var(--danger-soft);color:var(--danger)}
.b-grant{background:var(--violet-soft);color:var(--violet)}
.ktag{display:inline-block;font-size:11.5px;font-weight:600;padding:0 7px;border-radius:5px;background:var(--violet-soft);color:var(--violet);margin-inline-start:6px;vertical-align:1px}

.kbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:13.5px;padding:7px 12px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);white-space:nowrap;text-decoration:none}
.kbtn:hover{background:var(--sunken)}
.kbtn.p{background:var(--primary);border-color:var(--primary);color:var(--on)}
.kbtn.p:hover{background:var(--primary-2)}
.kbtn.d{color:var(--danger)}
.kbtn.lg{padding:10px 16px;font-size:14.5px}
.kbtn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.kbtn.ghost:hover{background:var(--sunken)}
.kbtn svg{width:15px;height:15px}

.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:12px;margin-top:14px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--sunken);border-radius:var(--r);padding:10px;min-height:240px}
.col h3{margin:2px 4px 10px;font-size:13.5px;font-weight:600;display:flex;justify-content:space-between;color:var(--ink-2)}
.col h3 span{color:var(--muted);font-weight:500}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:8px;cursor:pointer}
.kcard:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.kcard.attn{border-right:3px solid var(--accent)}
.kcard[aria-selected="true"]{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.kcard b{font-weight:600;display:block}
.kcard .c1{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kcard .c2{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:12.5px}
.col .more{font-size:12.5px;color:var(--muted);text-align:center;padding:4px}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:940;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(540px,100vw);background:var(--paper);z-index:950;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;transform:translateX(-102%);transition:transform .22s ease}
.drawer.on{transform:none}
.dh{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 18px 0}
.dtop{display:flex;align-items:center;gap:10px}
.dtop .av{width:42px;height:42px;font-size:15px}
.dtop h2{margin:0;font-size:18px;font-weight:700;line-height:1.3}
.dtop .sub{color:var(--muted);font-size:12.5px}
.dtop .sp{flex:1;min-width:0}
.dnav{display:flex;gap:4px}
.dtabs{display:flex;gap:2px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.dtabs button{border:0;background:transparent;padding:9px 12px;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.dtabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--primary)}
.dtabs .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-inline-start:4px;vertical-align:2px}
.db{flex:1;overflow-y:auto;padding:16px 18px;display:grid;gap:14px;align-content:start}
.df{background:var(--surface);border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.df .why{flex-basis:100%;font-size:12.5px;color:var(--muted)}
.df .grow{flex:1}
.ksec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.ksec h4{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--muted)}
.ksec p{margin:0}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.copy{border:0;background:transparent;color:var(--primary);font-weight:600;font-size:12.5px;padding:0 6px}
.bigmoney{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline}
.bigmoney .m{font-size:26px;font-weight:700}
.bigmoney .of{color:var(--muted)}
.meter{height:8px;border-radius:99px;background:var(--sunken);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:var(--primary);border-radius:99px}
.inst{width:100%;border-collapse:collapse;font-size:13.5px}
.inst td,.inst th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right}
.inst th{color:var(--muted);font-weight:600;font-size:12px}
.inst tr:last-child td{border-bottom:0}
.inst .kbtn{padding:4px 10px;font-size:12.5px}
.kalert{border-radius:var(--r-sm);padding:10px 12px;font-size:13.5px;display:flex;gap:8px;align-items:flex-start}
.kalert.wait{background:var(--accent-soft);color:var(--accent)}
.kalert.info{background:var(--info-soft);color:var(--info)}
.kalert svg{width:17px;height:17px;flex:none;margin-top:2px}
.quote{border-right:3px solid var(--violet);padding:4px 12px;color:var(--ink-2);font-size:14px;margin:0;white-space:pre-line}
.quote + h5{margin-top:12px}
.ksec h5{margin:0 0 6px;font-size:13.5px}
.offers{display:grid;gap:6px}
.offer{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;font-size:13.5px}
.offer.sel{border-color:var(--violet);background:var(--violet-soft)}
.list-dot{margin:0;padding-inline-start:18px}
.note{border-right:3px solid var(--line-2);padding:4px 10px;margin-bottom:8px;font-size:14px}
.note.imp{border-right-color:var(--danger)}
.note small{display:block;color:var(--muted);font-size:12px}

.chat{display:grid;gap:8px}
.kmsg{max-width:84%;padding:8px 12px;border-radius:12px;font-size:14px;line-height:1.55;white-space:pre-line;overflow-wrap:anywhere}
.kmsg small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px;white-space:normal}
.kmsg.them{background:var(--surface);border:1px solid var(--line);justify-self:start;border-bottom-right-radius:4px}
.kmsg.me{background:var(--primary-soft);justify-self:end;border-bottom-left-radius:4px}
.kmsg.sys{justify-self:center;background:transparent;color:var(--muted);font-size:12.5px;padding:2px}
.kmsg img{display:block;max-width:220px;max-height:260px;border-radius:8px;margin-bottom:4px;cursor:zoom-in}
.reply{display:flex;gap:8px;margin-top:4px}
.reply textarea{flex:1;resize:vertical;min-height:42px;height:42px;padding:9px 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:3px 10px;font-size:12.5px;color:var(--ink-2)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:14px 1fr auto;gap:10px;padding-bottom:14px;position:relative;font-size:13.5px}
.tl li::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--line-2);margin-top:6px}
.tl li.k::before{background:var(--primary)}
.tl li:not(:last-child)::after{content:"";position:absolute;right:4px;top:18px;bottom:0;width:1px;background:var(--line)}
.tl time{color:var(--muted);font-size:12px;white-space:nowrap}

.hint{color:var(--muted);font-size:12.5px;text-align:center;padding:18px 0 28px}
.hint kbd{border:1px solid var(--line-2);border-radius:5px;padding:0 5px;font-family:inherit;font-size:11.5px}
.lightbox{position:fixed;inset:0;z-index:960;background:rgba(0,0,0,.8);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}

/* كارت إيصال القسط */
.rc{border-color:var(--info);box-shadow:0 0 0 1px var(--info)}
.rcb{display:flex;gap:12px;align-items:flex-start;font-size:14px}
.rcpics{display:flex;gap:6px;flex-wrap:wrap;flex:none;max-width:240px}
.rc.pp{border-color:var(--accent,#B45309);box-shadow:0 0 0 1px var(--accent,#B45309)}
.rcb img{width:110px;max-height:150px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;flex:none}
.rcs{color:var(--muted);font-size:12.5px;margin-top:4px}
.rcw{color:var(--danger);font-size:12.5px;margin-top:4px;font-weight:600}
.rca{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
/* SweetAlert بنفس الهوية */

@media (max-width:1100px){
  .lhead,.krow{grid-template-columns:minmax(180px,1.4fr) minmax(130px,1fr) 140px 120px 180px}
  .lhead .h-when,.krow .when{display:none}
}
@media (max-width:820px){
  .queues{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lhead{display:none}
  .krow{grid-template-columns:1fr auto;gap:6px 10px;padding:12px;background:var(--surface);border-color:var(--line);margin-top:8px}
  .krow + .krow{margin-top:8px}
  .krow .st{grid-column:2;grid-row:1;justify-self:end}
  .krow .course,.krow .money,.krow .next{grid-column:1/-1;padding-inline-start:44px}
  .krow .next{justify-content:flex-start}
  .search{flex:1 1 100%;min-width:0}
  .search input{width:100%}
  .tools{width:100%}
  .hint{display:none}
}
/* وضع التضمين: لوحة الحجز لوحدها جوه مكتب المتابعة */
body.embed main.wrap,body.embed .scrim,body.embed #dClose,body.embed #dPrev,body.embed #dNext,body.embed .fu-nav{display:none!important}
body.embed .drawer{transform:none;width:100%;box-shadow:none;transition:none}
body.embed-missing .drawer{display:none!important}
body.embed .embed-wait{display:flex;align-items:center;justify-content:center;height:100vh;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){.drawer,.scrim{transition:none}}
</style>
</head>
<body class="fu" data-fu-nav="bookings">
<script>/* ?embed=1: الصفحة بتتفتح جوه مكتب المتابعة كلوحة حجز بس */
if(new URLSearchParams(location.search).has('embed')){document.body.classList.add('embed');document.body.removeAttribute('data-fu-nav');document.write('<div class="embed-wait" id="embedWait">بيحمّل الحجز…</div>')}</script>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>

const DEMO_MODE = new URLSearchParams(location.search).get('demo') === '1';

let db = null;
if (!DEMO_MODE) {
  try { firebase.initializeApp(firebaseConfig); db = firebase.firestore(); }

} else { document.body.classList.add('demo'); }

/* الحالة العامة */
let allBookings = [];
let filteredBookings = [];
let showingArchive = false;
let currentOpenDetails = null;
let currentEditingBooking = null;
let selectedNewPlan = null;
let activeQuickFilter = 'active';

/* ============================================================
   تحميل الحجوزات (موفّر للقراءات):
   - الافتراضي: النشط فقط    - الأرشيف: عند الطلب فقط

async function loadBookings() {
  const container = document.getElementById('bookingsContainer');
  container.innerHTML = '<div class="loading"><div class="loading-spinner"></div><p>جاري تحميل الحجوزات...</p></div>';
  try {
    if (DEMO_MODE) {
      allBookings = getDemoBookings();
    } else {
      let snapshot;
      if (showingArchive) {
        snapshot = await db.collection('tempBookings').orderBy('timestamp','desc').get();
      } else {
        snapshot = await db.collection('tempBookings')
          .where('status','in',['pending','pending_review','confirmed','paid'])
          .orderBy('timestamp','desc').get();
      }
      allBookings = [];
      snapshot.forEach(doc => allBookings.push({ id: doc.id, ...doc.data() }));
    }
    updateStats();
    updateQuickFilters();
    applyFilters();
    document.getElementById('lastUpdate').textContent =
      new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}) + (DEMO_MODE ? ' (تجريبي)' : '');
  } catch (error) {
    console.error('خطأ في تحميل الحجوزات:', error);
    showError('حدث خطأ في تحميل البيانات. تأكد من الاتصال والصلاحيات.');
  }
}

async function toggleArchive() {
  showingArchive = !showingArchive;
  const banner = document.getElementById('archiveBanner');
  const btn = document.getElementById('archiveBtn');
  if (showingArchive){ banner.classList.add('show'); btn.style.background='var(--warning)'; btn.innerHTML='<i class="fas fa-times"></i> إغلاق الأرشيف'; }
  else { banner.classList.remove('show'); btn.style.background='#6B7280'; btn.innerHTML='<i class="fas fa-archive"></i> الأرشيف'; }
  await loadBookings();
}

/* ============================================================
   الإحصائيات والفلاتر السريعة (محلية بدون قراءات)
============================================================ */
function updateStats() {
  document.getElementById('totalBookings').textContent = allBookings.length;
  document.getElementById('pendingBookings').textContent =
    allBookings.filter(b => ['pending','pending_review','confirmed'].includes(b.status)).length;
  const today = new Date().toDateString();
  document.getElementById('todayBookings').textContent =
    allBookings.filter(b => new Date(b.timestamp || b.bookingDate).toDateString() === today).length;
  let revenue = 0;
  allBookings.forEach(b => {
    if (b.status === 'paid' || b.status === 'transferred')
      revenue += b.paymentDetails?.paidAmount || b.pricing?.finalPriceNumber || extractNumberFromArabicText(b.pricing?.finalPrice) || 0;
  });
  document.getElementById('totalRevenue').textContent = revenue > 0 ? revenue.toLocaleString('ar-EG') + ' ج.م' : '0';
}

function updateQuickFilters() {
  const c = {
    active: allBookings.filter(b=>['pending','pending_review','confirmed','paid'].includes(b.status)).length,
    pending: allBookings.filter(b=>['pending','pending_review'].includes(b.status)).length,
    confirmed: allBookings.filter(b=>b.status==='confirmed').length,
    paid: allBookings.filter(b=>b.status==='paid').length,
    grants: allBookings.filter(b=>(b.bookingType||b.type)==='grant_request' && !['transferred','cancelled'].includes(b.status)).length,
    installments: allBookings.filter(b=>b.paymentDetails?.type==='installment' && b.status!=='cancelled').length,
  };
  const filters = [
    {id:'active',label:'النشطة',icon:'fa-bolt',count:c.active},
    {id:'pending',label:'بانتظار',icon:'fa-clock',count:c.pending},
    {id:'confirmed',label:'مؤكد',icon:'fa-check',count:c.confirmed},
    {id:'paid',label:'مدفوع',icon:'fa-money-bill',count:c.paid},
    {id:'grants',label:'المنح',icon:'fa-hand-holding-heart',count:c.grants},
    {id:'installments',label:'أقساط',icon:'fa-calendar-check',count:c.installments},
  ];
  if (showingArchive) {
    filters.push({id:'transferred',label:'محوّل',icon:'fa-exchange-alt',count:allBookings.filter(b=>b.status==='transferred').length});
    filters.push({id:'cancelled',label:'ملغي',icon:'fa-ban',count:allBookings.filter(b=>b.status==='cancelled').length});
  }
  document.getElementById('quickFilters').innerHTML = filters.map(f =>
    `<button class="qf-btn ${activeQuickFilter===f.id?'active':''}" onclick="setQuickFilter('${f.id}')"><i class="fas ${f.icon}"></i> ${f.label} <span class="count">${f.count}</span></button>`).join('');
}
function setQuickFilter(id){ activeQuickFilter=id; document.getElementById('filterType').value=''; document.getElementById('filterStatus').value=''; updateQuickFilters(); applyFilters(); }

function applyFilters() {
  const typeFilter = document.getElementById('filterType').value;
  const statusFilter = document.getElementById('filterStatus').value;
  const searchTerm = document.getElementById('searchBox').value.toLowerCase().trim();
  filteredBookings = allBookings.filter(b => {
    const type = b.bookingType || b.type;
    if (!['individual','grant_request'].includes(type)) return false;
    if (typeFilter && type !== typeFilter) return false;
    if (statusFilter && b.status !== statusFilter) return false;
    if (!typeFilter && !statusFilter) {
      switch (activeQuickFilter) {
        case 'active': if(!['pending','pending_review','confirmed','paid'].includes(b.status)) return false; break;
        case 'pending': if(!['pending','pending_review'].includes(b.status)) return false; break;
        case 'confirmed': if(b.status!=='confirmed') return false; break;
        case 'paid': if(b.status!=='paid') return false; break;
        case 'grants': if(type!=='grant_request' || ['transferred','cancelled'].includes(b.status)) return false; break;
        case 'installments': if(b.paymentDetails?.type!=='installment' || b.status==='cancelled') return false; break;
        case 'transferred': if(b.status!=='transferred') return false; break;
        case 'cancelled': if(b.status!=='cancelled') return false; break;
      }
    }
    if (searchTerm) {
      const hay = (b.id+' '+(b.customer?.name||'')+' '+(b.customer?.whatsapp||'')+' '+(b.courseName||'')+' '+(b.grantRequest?.applicant?.name||'')).toLowerCase();
      if (!hay.includes(searchTerm)) return false;
    }
    return true;
  });
  displayBookings();
}
function displayBookings(){}   // القايمة الجديدة بترسم نفسها (window.displayBookings تحت)

/* ============================================================
   مساعدات عامة
============================================================ */
function getStatusText(s){return {pending:'قيد الانتظار',pending_review:'قيد المراجعة',confirmed:'مؤكد',paid:'مدفوع',transferred:'تم التحويل ✓',cancelled:'ملغي',completed:'مكتمل'}[s]||s;}
function getTypeText(t){return t==='individual'?'حجز فردي':t==='grant_request'?'طلب منحة':'غير محدد';}
function getPaymentMethodText(m){return {vodafone:'فودافون كاش',instapay:'انستاباي',bank:'تحويل بنكي',card:'بطاقة بنكية',cash:'كاش',western_union:'ويسترن يونيون',other:'أخرى'}[m]||m;}
function getEmploymentText(s){return {student:'طالب',employed:'موظف',freelance:'عمل حر',unemployed:'بدون عمل',retired:'متقاعد',other:'أخرى'}[s]||s||'غير محدد';}
function commitmentLabel(k){return {fullAttendance:'التعهد بالحضور الكامل',activeParticipation:'المشاركة الفعالة',truthfulInfo:'صحة المعلومات المقدمة',volunteerWork:'التطوع بمساعدة الآخرين',attendance:'الالتزام بالحضور',homework:'تسليم الواجبات',interaction:'التفاعل في الدورة',payment:'الالتزام بالدفع',rules:'الالتزام بالقواعد'}[k]||k;}

function extractNumberFromArabicText(text){ return BookingMoney.num(text); }
function _oldExtractNumberFromArabicText(text){
  if(!text) return 0;
  const ar=['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
  let r=text.toString();
  ar.forEach((a,i)=>{r=r.replace(new RegExp(a,'g'),i);});
  return parseInt(r.replace(/[^\d]/g,''))||0;
}
function formatPhoneForWhatsApp(p){
  if(!p) return null;
  let n=p.replace(/[^0-9]/g,'');
  if(n.length<7||n.length>15) return null;
  if(n.startsWith('01')&&n.length===11) return '20'+n.substring(1);
  if(n.startsWith('1')&&n.length===10) return '20'+n;
  if(n.startsWith('05')&&n.length===10) return '966'+n.substring(1);
  if(n.startsWith('5')&&n.length===9) return '966'+n;
  if(n.startsWith('07')&&n.length===10) return '962'+n.substring(1);
  return n;
}
function openWhatsAppUnified(phone,msg=''){
  const f=formatPhoneForWhatsApp(phone);
  if(!f){FU.toast('رقم الواتساب مكتوب غلط',{type:'wait'});return;}
  window.open(`https://wa.me/${f}?text=${encodeURIComponent(msg)}`,'_blank');
}
function getPaymentMethods(b){ return b.customer?.paymentMethods || b.paymentMethods || []; }
function checkPaymentStatus(b){ return {isPaid:b.status==='paid'||b.status==='transferred',isConfirmed:b.paymentConfirmed===true,method:b.paymentMethod||'غير محدد',reference:b.paymentReference||'لا يوجد'}; }
function smartRound(n){const r=Math.round(n);if(r%10===0||r%5===0)return r;return Math.ceil(n/5)*5;}
function cleanDataForFirebase(o){
  if(Array.isArray(o)) return o.map(cleanDataForFirebase);
  if(o!==null&&typeof o==='object'){const c={};for(const k in o){if(o.hasOwnProperty(k)&&o[k]!==undefined)c[k]=cleanDataForFirebase(o[k]);}return c;}
  return o;
}
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/`/g,'&#96;');}
// رقم تليفون جوه onclick: أرقام و+ بس
function escPhone(s){return String(s==null?'':s).replace(/[^0-9+]/g,'');}
  function getChoiceLabel(b){
  const pk = b.package;
  if (pk && pk.name) return pk.name;                 // وصف جاهز: "الباقة الكاملة · اكتشاف + احتضان"
  const m = Array.isArray(b.courseModules) ? b.courseModules.filter(Boolean) : [];
  if (m.length > 1) return 'باقة كاملة (' + m.length + ' مودويل)';
  if (m.length === 1) return m[0];
  return null;
}

/* أدوات قاعدة بيانات موحّدة (تعمل في الوضعين) */
async function dbUpdate(collection, id, data){
  if(DEMO_MODE){ const b=allBookings.find(x=>x.id===id); if(b){ Object.keys(data).forEach(k=>{ if(k.includes('.')){const parts=k.split('.');let o=b;for(let i=0;i<parts.length-1;i++){o[parts[i]]=o[parts[i]]||{};o=o[parts[i]];}o[parts[parts.length-1]]=data[k];} else b[k]=data[k]; }); } return true; }
  return db.collection(collection).doc(id).update(data);
}
async function dbGet(collection, id){
  if(DEMO_MODE){const b=allBookings.find(x=>x.id===id);return {exists:!!b,id,data:()=>JSON.parse(JSON.stringify(b))};}
  return db.collection(collection).doc(id).get();
}
async function dbDelete(collection,id){
  if(DEMO_MODE){ const i=allBookings.findIndex(x=>x.id===id); if(i>-1) allBookings.splice(i,1); return true; }
  return db.collection(collection).doc(id).delete();
}
async function dbSet(collection,id,data){
  if(DEMO_MODE){ console.log('[DEMO] set',collection,id);return true; }
  return db.collection(collection).doc(id).set(data);
}
function refreshAfter(){ applyFilters(); }
async function reload(){ if(DEMO_MODE){ refreshAfter(); } else { await loadBookings({afterAction:true}); } }

/* بطاقات القايمة القديمة ونافذة التفاصيل العائمة اتشالوا: القايمة والدرج الجداد في آخر الصفحة.

async function confirmBooking(id){
  if(!(await FU.confirm('تأكّد الحجز ده؟','الحجز هيبقى «اتأكد»، وبعدها تقدر تسجّل الدفع.',{ok:'أكّد الحجز'})))return;
  try{await dbUpdate('tempBookings',id,{status:'confirmed',confirmedAt:new Date().toISOString(),confirmedBy:'admin'});FU.toast('الحجز اتأكد');afterChange(id);}
  catch(e){FU.toast('ما اتأكدش: '+e.message,{type:'bad'});}
}
async function cancelBooking(id){
  const b=bookingOf(id);
  const r=await FU.ask({title:'إلغاء الحجز',sub:nameOf(b)+' · '+(b&&b.courseName||''),ok:'الغِ الحجز',danger:true,
    body:'<p>الحجز هيفضل موجود في «الملغية»، ومش هيتبعت حاجة للعميل.</p><label class="fu-f"><span>السبب</span><textarea name="r" required placeholder="مثلًا: العميل اعتذر"></textarea></label>',
    run:async f=>{const v=FU.val(f,'r');if(!v)FU.fail('اكتب السبب علشان يبان في السجل.');await dbUpdate('tempBookings',id,{status:'cancelled',cancelledAt:new Date().toISOString(),cancellationReason:v,cancelledBy:'admin'});}});
  if(r){FU.toast('الحجز اتلغى');afterChange(id);}
}
async function deleteBooking(id){
  const b=bookingOf(id);
  const r=await FU.ask({title:'تمسح الحجز ده نهائي؟',sub:nameOf(b)+' · '+(b&&b.courseName||''),ok:'امسحه نهائي',danger:true,
    body:'<div class="fu-sum bad">كل بيانات الحجز هتتمسح ومش هترجع. لو عايزه يختفي من الشغل بس، <b>الغيه</b> بدل ما تمسحه.</div><label class="fu-f"><span>اكتب «امسح» علشان تأكد</span><input name="c" autocomplete="off"></label>',
    run:async f=>{if(FU.val(f,'c')!=='امسح')FU.fail('اكتب «امسح» بالظبط.');await dbDelete('tempBookings',id);}});
  if(r){FU.toast('الحجز اتمسح');if(currentOpenDetails===id)closeFloatingDetails();afterChange(id);}
}
async function sendReminder(id){
  const b=bookingOf(id);
  if(!b||!b.customer||!b.customer.whatsapp){FU.toast('مفيش رقم واتساب في الحجز ده',{type:'wait'});return;}
  openWhatsAppUnified(b.customer.whatsapp,'أهلاً '+firstName(b)+'\nبنفكّرك بدفع '+(b.courseName||'الكورس')+' علشان نأكد حجزك.\nالمبلغ: '+(b.pricing&&b.pricing.finalPrice||'')+'\nرقم الحجز: '+String(b.id).slice(-8).toUpperCase());
  try{await dbUpdate('tempBookings',id,{lastReminder:new Date().toISOString(),reminderCount:(b.reminderCount||0)+1});}catch(e){}
}
function sendWhatsApp(id){
  const b=bookingOf(id);if(!b)return;
  const type=b.bookingType||b.type;
  let phone=b.customer&&b.customer.whatsapp;
  if(type==='grant_request'){const ap=(b.grantRequest&&b.grantRequest.applicant)||b.applicant;phone=phone||(ap&&ap.whatsapp);}
  if(!phone){FU.toast('مفيش رقم واتساب في الحجز ده',{type:'wait'});return;}
  const methods=getPaymentMethods(b);
  openWhatsAppUnified(phone,'أهلاً '+firstName(b)+'\nشكرًا على حجزك في '+(b.courseName||'الكورس')+'.\nرقم الحجز: '+String(b.id).slice(-8).toUpperCase()+'\nالسعر: '+(b.pricing&&b.pricing.finalPrice||'')+(methods.length?'\nطرق الدفع:\n'+methods.map(m=>'• '+getPaymentMethodText(m)).join('\n'):''));
}
async function rejectPayment(id){
  const b=bookingOf(id);
  const r=await FU.ask({title:'رفض الإيصال',sub:nameOf(b),ok:'ارفض وابعت',danger:true,
    body:'<label class="fu-f"><span>السبب، وهيتبعت للعميل كده</span><textarea name="r" required>الإيصال مش واضح، والمبلغ أو رقم العملية مش باينين.</textarea></label>',
    run:async f=>{const v=FU.val(f,'r');if(!v)FU.fail('اكتب السبب.');
      await dbUpdate('tempBookings',id,{paymentRejected:true,rejectionReason:v,rejectedAt:new Date().toISOString(),status:'confirmed'});
      if(b&&b.telegramChatId)await sendTelegramMessage(b.telegramChatId,'الإيصال ما اتقبلش.\nالسبب: '+v+'\n\nابعت صورة إيصال واضحة فيها المبلغ ورقم العملية.');}});
  if(r){FU.toast(b&&b.telegramChatId?'اترفض الإيصال واتبعت السبب للعميل':'اترفض الإيصال');afterChange(id);}
}
async function requestReceipt(id){
  const b=bookingOf(id);if(!b)return;
  if(!b.telegramChatId){FU.toast('الحجز ده مش متوصل بالتليجرام',{type:'wait'});return;}
  if(!(await FU.confirm('تطلب صورة الإيصال؟','هيتبعت للعميل على التليجرام يبعت صورة إيصال الدفع.',{ok:'ابعت الطلب'})))return;
  const ok=await sendTelegramMessage(b.telegramChatId,'أهلاً '+(firstName(b)||'')+'\nعلشان نأكد دفعتك، ابعت صورة واضحة لإيصال الدفع هنا، يكون فيها المبلغ والتاريخ ورقم العملية.');
  if(ok){await dbUpdate('tempBookings',id,{receiptRequested:true,receiptRequestedAt:new Date().toISOString()});FU.toast('اتبعت طلب الإيصال');afterChange(id);}
  else FU.toast('الطلب ما اتبعتش. جرّب واتساب',{type:'bad'});
}
async function sendReminderToCustomer(id){
  const b=bookingOf(id);if(!b)return;
  const text='أهلاً '+(firstName(b)||'')+'\nفيه عروض المنحة مستنية ردك. اختار العرض اللي يناسبك وابعتلنا رقمه.';
  if(!b.telegramChatId){if(b.customer&&b.customer.whatsapp)openWhatsAppUnified(b.customer.whatsapp,text);else FU.toast('مفيش تليجرام ولا واتساب في الحجز ده',{type:'wait'});return;}

/* ---------- تسجيل الدفع الكامل أو الدفعة الأولى ---------- */
function schedPreview(total,fp,ni){
  if(!(fp>0&&ni>0&&total>0&&fp<=total))return '';
  const sch=BookingMoney.buildSchedule(total,fp,ni);
  return '<table class="fu-tbl"><thead><tr><th>الدفعة</th><th>الميعاد</th><th>المبلغ</th></tr></thead><tbody>'+sch.map((it,i)=>'<tr><td>'+BookingMoney.instName(i)+'</td><td>'+(i===0?'النهارده':BookingMoney.formatDate(it.dueDate))+'</td><td class="num">'+egp(it.amount)+'</td></tr>').join('')+'</tbody></table>';
}
async function markAsPaid(bookingId){
  const doc=await dbGet('tempBookings',bookingId);
  if(!doc.exists){FU.toast('الحجز ده مش موجود',{type:'bad'});return false;}
  const booking={id:doc.id,...doc.data()};
  const p=booking.payment||{};
  const isInstallment=p.code==='installment'||(p.code&&p.code.startsWith('installment_'))||(p.method&&p.method.includes('قسط'))||!!p.installmentDetails||(booking.paymentDetails&&booking.paymentDetails.type==='installment');
  const plan=p.installmentDetails||p.installmentHTML||'';
  const total=(booking.pricing&&booking.pricing.finalPriceNumber)||extractNumberFromArabicText(booking.pricing&&booking.pricing.finalPrice)||0;
  let guess=3;{const m=String(plan).match(/(\d+)/);if(m){const v=parseInt(m[1]);if(v>=1&&v<=18)guess=v;}}
  const r=await FU.ask({
    title:isInstallment?'تسجيل الدفعة الأولى':'تسجيل الدفع الكامل',sub:nameOf(booking)+' · '+(booking.courseName||''),ok:isInstallment?'سجّل الدفعة الأولى':'سجّل الدفع',wide:isInstallment,
    body:'<div class="fu-figs"><div><span>سعر الكورس</span><b>'+(total?egp(total):esc(booking.pricing&&booking.pricing.finalPrice||'—'))+'</b></div><div><span>طريقة الدفع</span><b>'+(isInstallment?'أقساط':'دفعة واحدة')+'</b></div>'+(plan?'<div><span>الخطة اللي اختارها</span><b style="font-size:14px;white-space:normal">'+esc(plan)+'</b></div>':'')+'</div>'+
      (isInstallment?'<div class="fu-2"><label class="fu-f"><span>الدفعة الأولى</span><input type="number" name="fp" min="1" inputmode="numeric" required placeholder="بالجنيه"></label><label class="fu-f"><span>عدد الأقساط الباقية</span><input type="number" name="ni" min="1" max="18" inputmode="numeric" value="'+guess+'" required></label></div><div id="mpPrev" style="margin-top:12px"></div>':'')+
      methodSelect('m')+'<label class="fu-f"><span>رقم العملية <small style="display:inline;color:var(--fu-muted);font-weight:400">(اختياري)</small></span><input name="ref" dir="ltr" placeholder="TRX123456789"></label>',
    mount:(d,f)=>{if(!isInstallment)return;const u=()=>{const fp=parseFloat(FU.val(f,'fp'))||0,ni=parseInt(FU.val(f,'ni'))||0;d.querySelector('#mpPrev').innerHTML=fp>total&&total?'<div class="fu-sum bad">الدفعة الأولى أكبر من سعر الكورس.</div>':schedPreview(total,fp,Math.min(18,ni));};f.oninput=u;u();},
    run:async f=>{
      const method=FU.val(f,'m');if(!method)FU.fail('اختار طريقة الدفع.');
      const ref=FU.val(f,'ref')||'لا يوجد',now=new Date().toISOString();
      const upd={status:'paid',paidAt:now,paymentMethod:method,paymentReference:ref,paymentConfirmed:true,paymentConfirmedAt:now,paymentConfirmedBy:'admin'};
      if(isInstallment){
        const fp=parseFloat(FU.val(f,'fp')),ni=parseInt(FU.val(f,'ni'));
        if(!(fp>0))FU.fail('اكتب مبلغ الدفعة الأولى.');if(total&&fp>total)FU.fail('الدفعة الأولى أكبر من سعر الكورس.');if(!(ni>=1&&ni<=18))FU.fail('عدد الأقساط من ١ لـ ١٨.');
        const schedule=BookingMoney.buildSchedule(total,fp,ni,{method,reference:ref});
        upd.paymentDetails={type:'installment',totalAmount:total,paidAmount:fp,remainingAmount:Math.max(0,total-fp),installmentSchedule:schedule,totalInstallments:ni+1,paidInstallments:1,nextDueDate:schedule[1]?schedule[1].dueDate:null,fullyPaid:false};
      }else upd.paymentDetails={type:'full',totalAmount:total,paidAmount:total,remainingAmount:0,fullyPaid:true,paidAt:now};
      await dbUpdate('tempBookings',bookingId,cleanDataForFirebase(upd));
    }});
  return !!r;
}
async function markAsPaidWithAutomation(bookingId){
  try{
    const doc=await dbGet('tempBookings',bookingId);
    if(!doc.exists){FU.toast('الحجز ده مش موجود',{type:'bad'});return;}
    let booking={id:doc.id,...doc.data()};
    if(booking.status!=='paid'){
      if(!(await markAsPaid(bookingId)))return;
      const re=await dbGet('tempBookings',bookingId);booking={id:re.id,...re.data()};
    }
    await sendTelegramPaymentConfirmation(booking);
    FU.toast('الدفع اتسجل. بنحوّله لطالب…',{type:'wait'});
    setTimeout(()=>autoTransferToSpecialized(bookingId),DEMO_MODE?300:1500);
  }catch(e){console.error(e);FU.toast('حصلت مشكلة: '+e.message,{type:'bad'});}
}

/* ---------- عروض المنحة ---------- */
function offerLine(o){return (o.amount===0?'منحة كاملة':egp(o.amount))+(o.months>0?' على '+arN(o.months)+' شهور ('+egp(Math.ceil(o.amount/o.months))+' في الشهر)':' دفعة واحدة');}
async function openGrantNegotiation(bookingId){
  const booking=bookingOf(bookingId);if(!booking)return;
  const basePrice=(booking.pricing&&booking.pricing.basePriceNumber)||booking.coursePrice||7500;
  const saved=booking.negotiationOffers||[];
  const rowHtml=i=>'<div class="ofr" data-o="'+i+'" style="border:1px solid var(--fu-line);border-radius:12px;padding:12px 14px;margin-top:10px">'+
    '<div style="display:flex;align-items:center;justify-content:space-between"><b>عرض '+arN(i)+'</b><button type="button" class="fu-btn fu-btn--sm fu-btn--ghost" data-rm>شيله</button></div>'+
    '<div class="fu-2"><label class="fu-f"><span>النوع</span><select data-k="type"><option value="amount">مبلغ محدد</option><option value="percentage">نسبة خصم</option><option value="full">منحة كاملة</option></select></label>'+
    '<label class="fu-f" data-amt><span>المبلغ</span><input type="number" data-k="amt" min="0" inputmode="numeric" placeholder="بالجنيه"></label></div>'+
    '<label class="fu-f"><span>الدفع</span><select data-k="pay"><option value="0">دفعة واحدة</option>'+[2,3,4,5,6,9,12].map(m=>'<option value="'+m+'">'+arN(m)+' شهور</option>').join('')+'</select></label><small class="muted" data-prev style="display:block;margin-top:6px;color:var(--fu-muted)"></small></div>';
  function read(div){const type=div.querySelector('[data-k=type]').value,amt=parseFloat(div.querySelector('[data-k=amt]').value)||0,months=parseInt(div.querySelector('[data-k=pay]').value)||0;
    const amount=type==='full'?0:type==='percentage'?Math.round(basePrice*(1-Math.min(100,amt)/100)):amt;return {type,amount,percentage:type==='percentage'?amt:null,months,ok:type==='full'||amt>0};}
  const data=await FU.ask({title:'عروض المنحة',sub:nameOf(booking)+' · سعر الكورس '+egp(basePrice),ok:'ابعت العروض',wide:true,
    body:(saved.length?'<div class="fu-sum"><b>اتبعت قبل كده:</b><br>'+saved.map((o,i)=>'عرض '+arN(i+1)+': '+offerLine(o)).join('<br>')+'</div>':'')+
      '<div id="ofrs"></div><button type="button" class="fu-btn fu-btn--sm" id="ofrAdd" style="margin-top:10px">ضيف عرض</button>'+
      '<label class="fu-f"><span>رسالة للعميل <small style="display:inline;color:var(--fu-muted);font-weight:400">(اختياري)</small></span><textarea name="msg" placeholder="مثلًا: دي أحسن عروض نقدر نقدمها المرة دي"></textarea></label>',
    mount:(d,f)=>{let n=0;const box=d.querySelector('#ofrs');
      const upd=div=>{const o=read(div),t=div.querySelector('[data-k=type]').value;div.querySelector('[data-amt]').hidden=t==='full';div.querySelector('[data-amt] span').textContent=t==='percentage'?'نسبة الخصم ٪':'المبلغ';div.querySelector('[data-prev]').textContent=o.ok?'العميل هيدفع '+offerLine(o):'';};
      const add=()=>{if(box.children.length>=5){FU.toast('أقصى حاجة ٥ عروض',{type:'wait'});return;}n++;box.insertAdjacentHTML('beforeend',rowHtml(n));upd(box.lastElementChild);};
      d.querySelector('#ofrAdd').onclick=add;
      box.onclick=e=>{const rm=e.target.closest('[data-rm]');if(rm)rm.closest('.ofr').remove();};
      f.oninput=f.onchange=e=>{const div=e.target.closest&&e.target.closest('.ofr');if(div)upd(div);};
      add();},
    run:async f=>{const offers=[];document.querySelectorAll('.fu-ask .ofr').forEach(div=>{const o=read(div);if(o.ok)offers.push({type:o.type,amount:o.amount,percentage:o.percentage,months:o.months,timestamp:new Date().toISOString()});});
      if(!offers.length)FU.fail('اكتب عرض واحد على الأقل.');return {offers,message:FU.val(f,'msg')};}});
  if(data)await saveNegotiationOffers(bookingId,data);
}
async function saveNegotiationOffers(bookingId,data){
  try{
    const booking=bookingOf(bookingId),customer=booking.customer||{};
    let message='أهلاً '+(firstName(booking)||'')+'\nبخصوص طلب المنحة في '+(booking.courseName||'الكورس')+'، دي العروض المتاحة:\n\n';
    data.offers.forEach((o,i)=>{message+='عرض '+(i+1)+': '+offerLine(o)+'\n';});
    if(data.message)message+='\n'+data.message+'\n';
    message+='\nابعتلنا رقم العرض اللي يناسبك.';
    await dbUpdate('tempBookings',bookingId,{negotiationOffers:[...(booking.negotiationOffers||[]),...data.offers],lastNegotiationMessage:message,lastNegotiationDate:new Date().toISOString(),hasNegotiations:true,negotiationStatus:'pending_response'});
    if(booking.telegramChatId)await tgPost('/send-grant-offers',{bookingId,offers:data.offers,message:data.message});
    else if(customer.whatsapp)openWhatsAppUnified(customer.whatsapp,message);
    FU.toast('العروض اتبعتت');afterChange(bookingId);
  }catch(e){console.error(e);FU.toast('العروض ما اتحفظتش: '+e.message,{type:'bad'});}
}
function getCustomerRequestDisplay(type,sd,bp,sp){
  if(type==='full')return '<b>منحة كاملة</b><small>سعر الكورس '+egp(bp)+(sp<bp?'، وبعد العرض '+egp(sp):'')+'. المطلوب من العميل: صفر.</small>';
  if(type==='partial')return '<b>منحة جزئية: يدفع '+egp(sd.affordableAmount||0)+'</b><small>سعر الكورس '+egp(bp)+'. '+(sd.installmentRequested?'على '+arN(sd.installmentMonths||0)+' أقساط':'دفعة واحدة')+'.</small>';
  const months=sd.months||6;return '<b>تقسيط: '+arN(months)+' أقساط × '+egp(Math.ceil(sp/months))+'</b><small>السعر '+egp(sp)+'.</small>';
}
async function sendGrantApproval(bookingId){
  const booking=bookingOf(bookingId);if(!booking)return;
  const saved=booking.negotiationOffers||[];
  if(!saved.length){
    const sd=(booking.grantDetails&&booking.grantDetails.supportDetails)||{};
    const bp=booking.coursePrice||(booking.pricing&&booking.pricing.basePriceNumber)||7500;
    const sp=booking.salePrice||(booking.pricing&&booking.pricing.priceAfterTimedOffers)||bp;
    const v=await FU.ask({title:'الموافقة على المنحة',sub:nameOf(booking),ok:'كمّل',
      body:'<p>العميل طالب:</p><div class="fu-sum" style="margin:0 0 12px">'+getCustomerRequestDisplay(sd.type,sd,bp,sp).replace('<small>','<br><small>')+'</div>'+
        '<div class="fu-pick"><label><input type="radio" name="a" value="approve" checked><span><b>وافق على طلبه زي ما هو</b><small>الموافقة بتتبعت له على طول.</small></span></label><label><input type="radio" name="a" value="negotiate"><span><b>اعمل عروض بديلة الأول</b><small>تبعتله كذا عرض يختار منهم.</small></span></label></div>',
      run:f=>FU.val(f,'a')});
    if(!v)return;
    if(v==='negotiate'){openGrantNegotiation(bookingId);return;}
    await executeGrantApproval(bookingId,createDirectOfferFromRequest(sd.type,sd,bp,sp),true);return;
  }
  const chosen=booking.customerSelectedOffer?(booking.customerSelectedOfferIndex||0):0;
  const sel=await FU.ask({title:'الموافقة النهائية',sub:nameOf(booking)+' · اختار العرض',ok:'وافق',
    body:'<div class="fu-pick">'+saved.map((o,i)=>'<label><input type="radio" name="s" value="'+i+'"'+(i===chosen?' checked':'')+'><span><b>عرض '+arN(i+1)+(booking.customerSelectedOffer&&i===chosen?' · العميل اختاره':'')+'</b><small>'+offerLine(o)+'</small></span></label>').join('')+'<label><input type="radio" name="s" value="new"><span><b>اعمل عرض جديد</b></span></label></div>',
    run:f=>FU.val(f,'s')||FU.fail('اختار عرض.')});
  if(!sel)return;
  if(sel==='new'){openGrantNegotiation(bookingId);return;}
  await executeGrantApproval(bookingId,saved[parseInt(sel)],false);
}
async function sendGrantRejection(bookingId){
  const b=bookingOf(bookingId);if(!b)return;
  const r=await FU.ask({title:'رفض طلب المنحة',sub:nameOf(b),ok:'ارفض الطلب',danger:true,
    body:'<label class="fu-f"><span>السبب، وهيتبعت للعميل</span><textarea name="r" required></textarea></label>',

/* ---------- تسجيل قسط (والزيادة بتتوزع على اللي بعده) ---------- */
function distText(sched,idx,actual){
  const inst=sched[idx],need=Math.max(0,inst.amount-BookingMoney.paidOn(inst));
  if(!(actual>0))return '';
  if(actual<need)return '<div class="fu-sum wait">ده أقل من القسط بـ <b>'+egp(need-actual)+'</b>، فهيتسجل دفع جزئي، والباقي يفضل على نفس القسط.</div>';
  if(actual===need)return '<div class="fu-sum ok">المبلغ قد القسط بالظبط.</div>';
  let extra=actual-need;const items=[];
  for(let i=idx+1;i<sched.length&&extra>0;i++){const n=sched[i];if(n.status==='paid')continue;const nd=Math.max(0,n.amount-BookingMoney.paidOn(n));if(nd<=0)continue;const put=Math.min(nd,extra);items.push('<div><span class="k">'+BookingMoney.instName(n.installmentNumber!=null?n.installmentNumber:i)+(put<nd?'<small>هيفضل عليه '+egp(nd-put)+'</small>':'<small>هيتقفل</small>')+'</span><span class="v">'+egp(put)+'</span></div>');extra-=put;}
  return '<div class="fu-sum ok">الزيادة <b>'+egp(actual-need)+'</b> هتروح للأقساط اللي بعده:</div><div class="fu-rows" style="margin-top:6px">'+items.join('')+'</div>';
}
async function markInstallmentAsPaid(bookingId,idx){
  let collection='tempBookings';
  let doc=await dbGet('tempBookings',bookingId);
  if(!doc.exists&&!DEMO_MODE){doc=await db.collection('individualStudents').doc(bookingId).get();collection='individualStudents';}
  if(!doc.exists){FU.toast('الحجز ده مش موجود',{type:'bad'});return;}
  const b={id:doc.id,...doc.data()},pd0=b.paymentDetails||{};
  if(!pd0.remainingAmount||isNaN(pd0.remainingAmount)||pd0.remainingAmount<0)pd0.remainingAmount=(pd0.totalAmount||0)-(pd0.paidAmount||0);
  const sched=pd0.installmentSchedule||[],inst=sched[idx];
  if(!inst){FU.toast('القسط ده مش موجود في الجدول',{type:'bad'});return;}
  const remainingTotal=pd0.remainingAmount||0,need=Math.max(0,inst.amount-BookingMoney.paidOn(inst));
  const label=BookingMoney.instName(inst.installmentNumber!=null?inst.installmentNumber:idx);
  const r=await FU.ask({title:'تسجيل '+label,sub:nameOf(b)+' · '+(b.courseName||''),ok:'سجّل الدفع',wide:true,
    body:'<div class="fu-figs"><div><span>القسط</span><b>'+egp(inst.amount)+'</b></div>'+(need!==inst.amount?'<div class="wait"><span>باقي منه</span><b>'+egp(need)+'</b></div>':'')+'<div><span>الباقي على الكورس كله</span><b>'+egp(remainingTotal)+'</b></div><div><span>الميعاد</span><b style="font-size:15px">'+esc(BookingMoney.formatDate(inst.dueDate))+'</b></div></div>'+
      (inst.receiptReceived&&inst.receiptImageUrl?'<img class="fu-img" src="'+esc(inst.receiptImageUrl)+'" alt="الإيصال" data-zoom="'+esc(inst.receiptImageUrl)+'">':'')+
      '<label class="fu-f fu-f--big"><span>دفع كام فعلًا</span><input type="number" name="amt" min="1" inputmode="numeric" value="'+need+'" required></label>'+
      '<div class="fu-chips" style="margin-top:8px"><button type="button" data-fill="'+need+'">القسط بس ('+arN(need)+')</button>'+(remainingTotal>need?'<button type="button" data-fill="'+remainingTotal+'">الباقي كله ('+arN(remainingTotal)+')</button>':'')+'</div>'+
      '<div id="dist"></div><div class="fu-2">'+methodSelect('m',inst.paymentMethod)+'<label class="fu-f"><span>يوم الدفع</span><input type="date" name="date" value="'+BookingMoney.cairoDateString(new Date())+'"></label></div>'+
      '<label class="fu-f"><span>رقم العملية <small style="display:inline;color:var(--fu-muted);font-weight:400">(اختياري)</small></span><input name="ref" dir="ltr"></label>',
    mount:(d,f)=>{const u=()=>{d.querySelector('#dist').innerHTML=distText(sched,idx,parseFloat(FU.val(f,'amt'))||0);};f.oninput=u;
      d.querySelectorAll('[data-fill]').forEach(x=>x.onclick=()=>{f.elements.amt.value=x.dataset.fill;u();});
      const img=d.querySelector('[data-zoom]');if(img)img.onclick=()=>window.open(img.dataset.zoom,'_blank','noopener');u();},
    run:f=>{const m=FU.val(f,'m'),amt=parseFloat(FU.val(f,'amt'));
      if(!(amt>0))FU.fail('اكتب المبلغ اللي اتدفع.');
      if(amt>remainingTotal+0.5)FU.fail('المبلغ أكبر من الباقي على الكورس كله ('+egp(remainingTotal)+'). سجّل الباقي بس، واكتب الزيادة في ملاحظة.');
      if(!m)FU.fail('اختار طريقة الدفع.');
      return {method:m,reference:FU.val(f,'ref')||'لا يوجد',date:FU.val(f,'date')||BookingMoney.cairoDateString(new Date()),actualAmount:amt};}});
  if(!r)return;
  try{
    FU.toast('بنسجّل الدفعة…',{type:'wait'});
    const actual=r.actualAmount,installmentAmount=inst.amount;
    const paidDate=new Date(r.date+'T12:00:00+03:00').toISOString();   // ضهر اليوم بتوقيت القاهرة
    const before=BookingMoney.paidOn(inst),cum=before+actual;
    inst.paidSoFar=Math.min(cum,installmentAmount);
    inst.status=cum>=installmentAmount?'paid':'partial';
    inst.paidAt=paidDate;inst.paymentMethod=r.method;inst.reference=r.reference;inst.paidBy='admin';inst.actualPaidAmount=(inst.actualPaidAmount||0)+actual;
    inst.payments=(inst.payments||[]).concat([{amount:actual,date:paidDate,method:r.method,reference:r.reference}]);
    if(inst.receiptReceived){inst.receiptProcessed=true;inst.receiptProcessedAt=new Date().toISOString();}
    let extra=Math.max(0,cum-installmentAmount),paidCount=inst.status==='paid'?1:0;
    const distributionLog=[{installmentNumber:inst.installmentNumber+1,amount:Math.min(actual,installmentAmount-before),status:inst.status,isOriginal:true,newAmount:Math.max(0,installmentAmount-inst.paidSoFar)}];
    const covered=[{idx:idx,amount:Math.min(actual,installmentAmount-before),status:inst.status}];
    for(let i=idx+1;i<sched.length&&extra>0;i++){
      const next=sched[i];if(next.status==='paid')continue;
      const put=Math.min(Math.max(0,next.amount-BookingMoney.paidOn(next)),extra);if(put<=0)continue;
      next.paidSoFar=BookingMoney.paidOn(next)+put;
      next.payments=(next.payments||[]).concat([{amount:put,date:paidDate,method:r.method+' (من دفعة سابقة)',reference:r.reference,linkedToInstallment:idx}]);
      if(next.paidSoFar>=next.amount){next.status='paid';next.paidAt=paidDate;next.paymentMethod=r.method+' (من دفعة سابقة)';next.reference=r.reference;next.paidBy='admin';next.paidFromExtra=true;next.linkedToInstallment=idx;paidCount++;}
      else next.status='partial';
      distributionLog.push({installmentNumber:next.installmentNumber+1,amount:put,status:next.status,fromExtra:true,newAmount:Math.max(0,next.amount-next.paidSoFar)});
      covered.push({idx:i,amount:put,status:next.status});extra-=put;
    }
    const pd=pd0;
    pd.paidInstallments=(pd.paidInstallments||0)+paidCount;
    pd.paidAmount=(isNaN(pd.paidAmount)?0:(pd.paidAmount||0))+actual;
    pd.remainingAmount=Math.max(0,(pd.totalAmount||0)-pd.paidAmount);
    if(pd.remainingAmount<=0){pd.fullyPaid=true;pd.fullyPaidAt=new Date().toISOString();}
    pd.paymentHistory=(pd.paymentHistory||[]).concat([{timestamp:new Date().toISOString(),actualAmount:actual,installmentAmount,extraAmount:actual-installmentAmount,distribution:distributionLog,method:r.method,reference:r.reference,by:'admin'}]);
    await dbUpdate(collection,bookingId,{paymentDetails:cleanDataForFirebase(pd)});
    /* رسالة تأكيد واحدة من البوت، وبتقفل الإيصال وطلب التأجيل بتوع القسط ده */
    window.__lastNotify=null;
    if(!DEMO_MODE){
      try{const nr=await botFetch(TELEGRAM_BASE+'/installments/paid-notify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bookingId,idx,amount:actual,covered,receiptId:window.__rcReceiptId||null})});
        window.__lastNotify=await nr.json().catch(()=>({ok:false}));if(!nr.ok)window.__lastNotify.ok=false;}
      catch(e){window.__lastNotify={ok:false,error:'network'};}
    }
    window.__rcReceiptId=null;
    /* لو البوت ما ردش: رسالة احتياطي علشان الطالب ما يفضلش مستني */
    if(b.telegramChatId&&!DEMO_MODE&&!(window.__lastNotify&&window.__lastNotify.ok)){
      const nx=sched.find(i=>i.status!=='paid');
      await sendTelegramMessage(b.telegramChatId,'أهلاً '+(firstName(b)||'')+'\nوصلتنا دفعتك واتسجلت: '+egp(actual)+'.\n'+(pd.fullyPaid?'كده الكورس اتدفع كامل. شكرًا على التزامك.':'الباقي على الكورس: '+egp(pd.remainingAmount)+(nx?'\nالقسط الجاي: '+egp(nx.amount-BookingMoney.paidOn(nx))+' يوم '+BookingMoney.formatDate(nx.dueDate):'')));
    }
    const ln=window.__lastNotify;
    const tg=!b.telegramChatId?'الطالب مش على التليجرام، بلّغه بنفسك.':!ln?'':ln.ok&&ln.sent?'والتأكيد اتبعت له.':ln.error==='blocked'?'بس الطالب قافل البوت، كلّمه واتساب.':ln.ok?'':'والتأكيد اتبعت بالرسالة الاحتياطي.';
    FU.toast((pd.fullyPaid?'الكورس اتدفع كامل. ':'اتسجل '+egp(actual)+(paidCount>1?' على '+arN(paidCount)+' أقساط':'')+'. ')+tg,{type:ln&&ln.error==='blocked'?'wait':'ok',ms:6000});
    afterChange(bookingId);
  }catch(e){console.error(e);FU.toast('الدفعة ما اتسجلتش: '+e.message,{type:'bad'});}
}

function lastReminderMs(b,idx){
  let t=0;const rem=b.installmentReminders||{};
  Object.keys(rem).forEach(k=>{if(k.indexOf(idx+'_')===0){const v=rem[k];const ms=v&&v.toDate?v.toDate().getTime():Date.parse(v)||0;if(ms>t)t=ms;}});
  const old=(((b.paymentDetails||{}).installmentSchedule||[])[idx]||{}).reminders||[];
  old.forEach(r=>{const ms=Date.parse(r.sentAt)||0;if(ms>t)t=ms;});
  return t;
}
function instRows(list){
  const out=[];
  list.forEach(b=>{BookingMoney.summarize(b).rows.forEach(r=>out.push({b,r,last:lastReminderMs(b,r.idx)}));});
  return out.sort((x,y)=>(x.r.state==='paid')-(y.r.state==='paid')||Date.parse(x.r.dueDate)-Date.parse(y.r.dueDate));
}

async function sendBulkReminders(items){
  items=items||[];
  if(!items.length){FU.toast('ما اخترتش حد',{type:'wait'});return;}
  if(!(await FU.confirm('تبعت '+arN(items.length)+' تذكير؟','كل طالب هيوصله تذكير بالقسط على التليجرام، وفيه زرار يبعت بيه الإيصال.',{ok:'ابعت'})))return;
  let ok=0,fail=0,blocked=0;
  for(let i=0;i<items.length;i++){
    try{const res=await botFetch(TELEGRAM_BASE+'/installments/remind',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bookingId:items[i].id,idx:items[i].idx})});
      const j=await res.json().catch(()=>({}));if(res.ok&&j.ok)ok++;else if(j.error==='blocked')blocked++;else fail++;}
    catch(e){fail++;}
    await new Promise(r=>setTimeout(r,DEMO_MODE?50:400));
  }
  FU.toast('اتبعت '+arN(ok)+' تذكير'+(blocked?'، و'+arN(blocked)+' قافلين البوت':'')+(fail?'، و'+arN(fail)+' ما اتبعتوش':''),{type:fail||blocked?'wait':'ok',ms:6000});
  reload();
}

function createDirectOfferFromRequest(type,sd,bp,sp){
  if(type==='full') return {type:'full',amount:0,months:0,timestamp:new Date().toISOString()};
  if(type==='partial'){ const amt=sd.affordableAmount||0; const m=sd.installmentRequested?(sd.installmentMonths||0):0; return {type:'amount',amount:amt,months:m,timestamp:new Date().toISOString()}; }
  if(type==='installment'){ return {type:'amount',amount:sp,months:sd.months||6,timestamp:new Date().toISOString()}; }

}

async function executeGrantApproval(bookingId,offer,isDirect){
  try{
    const booking=allBookings.find(b=>b.id===bookingId);
    const bp=booking.pricing?.basePriceNumber||booking.coursePrice||7500;
    const finalAmount=offer.amount;
    const isFullGrant=offer.type==='full'||finalAmount===0;
    const upd={
      status:'confirmed',grantStatus:'approved',approvedAt:new Date().toISOString(),approvedOffer:offer,grantApprovalLocked:true,
      'pricing.finalPrice':finalAmount.toLocaleString('ar-EG')+' ج.م','pricing.finalPriceNumber':finalAmount,
      totalSavings:bp-finalAmount,totalSavingsText:(bp-finalAmount).toLocaleString('ar-EG')+' ج.م',
      isFullGrant,requiresPayment:!isFullGrant
    };
    /* حفظ الطلب الأصلي مرة واحدة فقط (قبل ما نكتب فوقه) — للسجل والمراجعة */
    const oldSD=booking.grantDetails?.supportDetails||{};
    if(!booking.grantDetails?.originalRequest && Object.keys(oldSD).length){
      upd['grantDetails.originalRequest']={...oldSD,savedAt:new Date().toISOString()};
    }
    if(offer.months>0){
      const monthly=Math.ceil(finalAmount/offer.months);
      upd.payment={code:'installment_'+offer.months,method:offer.months+' أقساط',type:'installment',installmentDetails:offer.months+' أقساط × '+monthly.toLocaleString('ar-EG')+' ج.م',installmentHTML:offer.months+' أقساط × '+monthly.toLocaleString('ar-EG')+' ج.م'};
      upd.paymentDetails={type:'installment',totalAmount:finalAmount,monthlyAmount:monthly,totalInstallments:offer.months,remainingAmount:finalAmount,paidAmount:0,fullyPaid:false};
      upd['grantDetails.supportType']='installment';
      /* 🔧 الإصلاح الجوهري: تحديث supportDetails بأرقام العرض المعتمد بدل أرقام الطلب القديم */
      upd['grantDetails.supportDetails.type']='installment';
      upd['grantDetails.supportDetails.months']=offer.months;
      upd['grantDetails.supportDetails.monthlyAmount']=monthly;
      upd['grantDetails.supportDetails.affordableAmount']=finalAmount;
      upd['grantDetails.supportDetails.installmentRequested']=true;
      upd['grantDetails.supportDetails.installmentMonths']=offer.months;
    } else {
      upd.payment={code:isFullGrant?'full_grant':'cash',method:isFullGrant?'منحة كاملة':'دفعة واحدة',type:'cash'};
      upd.paymentDetails={type:'cash',totalAmount:finalAmount,remainingAmount:finalAmount,paidAmount:0,fullyPaid:isFullGrant};
      upd['grantDetails.supportType']=isFullGrant?'full':'partial';
      /* 🔧 نفس المزامنة لحالة الدفعة الواحدة / المنحة الكاملة */
      upd['grantDetails.supportDetails.type']=isFullGrant?'full':'partial';
      upd['grantDetails.supportDetails.months']=0;
      upd['grantDetails.supportDetails.monthlyAmount']=null;
      upd['grantDetails.supportDetails.affordableAmount']=finalAmount;
      upd['grantDetails.supportDetails.installmentRequested']=false;
      upd['grantDetails.supportDetails.installmentMonths']=null;
      upd['grantDetails.supportDetails.percentage']=isFullGrant?100:Math.max(0,Math.round(100-(finalAmount/bp*100)));
    }
    if(isDirect){ upd.negotiationOffers=[offer]; upd.customerSelectedOffer=true; upd.customerSelectedOfferIndex=0; upd.directApproval=true; }
    await dbUpdate('tempBookings',bookingId,cleanDataForFirebase(upd));
    if(booking.telegramChatId) await tgPost('/approve-grant-final',{bookingId,selectedOffer:offer});
    FU.toast('اتوافق على المنحة: '+(isFullGrant?'منحة كاملة':offerLine(offer))+(booking.telegramChatId?'، والموافقة اتبعتت للعميل':''));
    afterChange(bookingId);
  }catch(e){ console.error(e); FU.toast('الموافقة ما اتسجلتش: '+e.message,{type:'bad'}); }
}

async function sendTelegramPaymentConfirmation(booking){
  if(!(booking.telegramChatId && booking.telegramConnected)) return;
  const name=booking.customer?.name?.split(' ')[0]||'عميلنا العزيز';
  const course=booking.courseName||'الدورة';
  const pd=booking.paymentDetails||{};
  const isInst=pd.type==='installment';
  let msg;

async function checkExistingUser(booking){
  if(DEMO_MODE) return {exists:false,userId:null};
  try{
    const email=booking.customer?.email, wa=booking.customer?.whatsapp;
    if(email){const q=await db.collection('users').where('personalInfo.email','==',email).limit(1).get();if(!q.empty)return{exists:true,userId:q.docs[0].id};}
    if(wa){const q=await db.collection('users').where('personalInfo.whatsapp','==',wa).limit(1).get();if(!q.empty)return{exists:true,userId:q.docs[0].id};}

function analyzeCurrentPlan(b){
  const r={type:'unknown',displayName:'غير محدد',installmentMonths:0,currentPrice:0,basePrice:0};
  r.basePrice=b.pricing?.basePriceNumber||extractNumberFromArabicText(b.pricing?.basePrice)||7500;
  r.currentPrice=b.pricing?.finalPriceNumber||extractNumberFromArabicText(b.pricing?.finalPrice)||0;
  if(b.payment){
    if(b.payment.code==='cash'||b.payment.method==='دفعة واحدة'||(!b.payment.installmentDetails&&!b.payment.installmentHTML&&!b.payment.code?.startsWith('installment'))){
      r.type='cash'; r.displayName='دفعة واحدة';
    } else if(b.payment.installmentDetails||b.payment.installmentHTML||b.payment.code?.startsWith('installment')||b.payment.code?.startsWith('plan_')){
      r.type='installment';
      const t=b.payment.installmentDetails||b.payment.installmentHTML||b.payment.method||'';
      const m=t.match(/(\d+)\s*(شهر|شهور|أقساط|قسط)/); if(m) r.installmentMonths=parseInt(m[1]);
      r.displayName=r.installmentMonths?r.installmentMonths+' شهور':'أقساط';
    }
  } else if(b.paymentDetails?.type==='installment'){ r.type='installment'; r.installmentMonths=b.paymentDetails.totalInstallments||0; r.displayName=r.installmentMonths+' شهور'; }
  else { r.type='cash'; r.displayName='دفعة واحدة'; }
  return r;
}

function extractStoredDiscounts(b){
  const d={timeDiscount:0,timePercentage:0,couponDiscount:0,couponPercentage:0,couponCode:'',cashDiscountPercentage:15};
  const bp=b.pricing?.basePriceNumber||extractNumberFromArabicText(b.pricing?.basePrice)||7500;
  (b.discounts||[]).forEach(disc=>{
    const amt=disc.amount||extractNumberFromArabicText(disc.value)||0;
    if(disc.type==='time'){ d.timeDiscount=amt; if(bp>0) d.timePercentage=Math.round(amt/bp*100); }
    else if(disc.type==='cash'){ d.cashDiscountAmount=amt; }
    else if(disc.type==='coupon'){ d.couponDiscount=amt; const m=disc.label?.match(/\(([^)]+)\)/); if(m) d.couponCode=m[1]; }
  });
  return d;
}

function calcPlanPrice(basePrice,planType,months,disc){
  let price=basePrice; const applied=[];
  if(disc.timeDiscount>0){ price-=disc.timeDiscount; applied.push({type:'time',amount:disc.timeDiscount,label:'خصم العرض الزمني'}); }
  if(planType==='cash'){ const c=smartRound(price*(disc.cashDiscountPercentage||15)/100); price-=c; applied.push({type:'cash',amount:c,label:'خصم الدفع مرة واحدة '+(disc.cashDiscountPercentage||15).toLocaleString('ar-EG')+'٪'}); }
  if(disc.couponDiscount>0){ price-=disc.couponDiscount; applied.push({type:'coupon',amount:disc.couponDiscount,label:disc.couponCode?'كود الخصم ('+disc.couponCode+')':'كود الخصم'}); }
  price=smartRound(price);
  let inst=null;
  if(planType==='installment'&&months>0){ const monthly=smartRound(price/months); inst={total:monthly*months,monthlyAmount:monthly,months,description:months.toLocaleString('ar-EG')+' أقساط، كل قسط '+monthly.toLocaleString('ar-EG')+' ج.م'}; }
  return {finalPrice:price,appliedDiscounts:applied,installmentDetails:inst,totalSavings:basePrice-price};
}
