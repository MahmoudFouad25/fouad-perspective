<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتب الفرص — منظور الفؤاد</title>

<!-- Firebase (نفس إصدار المنصة) -->
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- الخطوط -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Amiri:wght@700&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════
   نظام التصميم — مكتب الفرص (نفس هوية مكتب المتابعة)
   ═══════════════════════════════════════════════ */
:root{
  --ink:#20241F;
  --ink-2:#2B302A;
  --ink-line:#3A403A;
  --paper:#FAF9F5;
  --panel:#FFFFFF;
  --emerald:#0B7A56;
  --emerald-deep:#075E42;
  --emerald-tint:#E9F4EF;
  --amber:#B45309;
  --amber-tint:#FBF1E3;
  --crimson:#B3261E;
  --crimson-tint:#FBEBEA;
  --violet:#6D4FA1;
  --violet-tint:#F0EBF8;
  --line:#E8E6DF;
  --mut:#71766F;
  --txt:#23271F;
  --radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{
  font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;
  background:var(--paper);color:var(--txt);
  font-size:14px;line-height:1.7;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#CFCDC5;border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--emerald);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ── شاشة الدخول ── */
#authSplash{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:var(--ink)}
.auth-card{width:min(380px,92vw);background:var(--panel);border-radius:16px;padding:34px 30px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.auth-brand{font-family:'Amiri',serif;font-size:30px;color:var(--emerald-deep);text-align:center;line-height:1.4}
.auth-sub{text-align:center;color:var(--mut);font-size:13px;margin:2px 0 24px}
.auth-field{margin-bottom:14px}
.auth-field label{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin-bottom:5px}
.auth-field input{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);transition:border-color .15s}
.auth-field input:focus{border-color:var(--emerald);outline:none}
#authBtn{width:100%;padding:12px;background:var(--emerald);color:#fff;font-weight:700;font-size:15px;border-radius:10px;margin-top:6px;transition:background .15s}
#authBtn:hover{background:var(--emerald-deep)}
#authBtn:disabled{opacity:.6;cursor:wait}
#authError{display:none;background:var(--crimson-tint);color:var(--crimson);border-radius:8px;padding:9px 12px;font-size:13px;margin-top:12px}
.auth-wait{color:#fff;text-align:center;font-size:15px}

/* ── الرأس ── */
#appShell{display:none}
#appShell.on{display:block}
.top{
  background:var(--ink);color:#E9EBE6;padding:18px 22px;
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
}
.top-brand{font-family:'Amiri',serif;font-size:24px;color:#F3F5EF;line-height:1.3}
.top-brand small{display:block;font-family:'IBM Plex Sans Arabic';font-size:11.5px;color:#9AA096;font-weight:500}
.top-stats{display:flex;gap:10px;margin-inline-start:auto;flex-wrap:wrap}
.tstat{background:var(--ink-2);border:1px solid var(--ink-line);border-radius:10px;padding:8px 16px;text-align:center;min-width:92px}
.tstat b{display:block;font-size:20px;color:#fff}
.tstat span{font-size:11px;color:#9AA096}
.tstat.hot b{color:#F6C25B}
.tstat.alum b{color:#7FD6B5}
.top-actions{display:flex;gap:8px}
.top-btn{background:var(--ink-2);border:1px solid var(--ink-line);color:#C9CDC4;border-radius:9px;padding:8px 13px;font-size:12.5px;font-weight:600;transition:.15s}
.top-btn:hover{color:#fff;border-color:#5a615a}

/* ── التبويبات ── */
.tabs{display:flex;gap:6px;padding:14px 22px 0;background:var(--paper);border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{
  padding:11px 20px;border-radius:11px 11px 0 0;font-weight:700;font-size:13.5px;color:var(--mut);
  border:1px solid transparent;border-bottom:none;display:flex;align-items:center;gap:8px;transition:.15s;
}
.tab .cnt{background:var(--line);color:var(--mut);border-radius:20px;padding:1px 9px;font-size:12px;font-weight:700}
.tab.active{background:var(--panel);color:var(--emerald-deep);border-color:var(--line)}
.tab.active .cnt{background:var(--emerald-tint);color:var(--emerald-deep)}
.tab:hover:not(.active){color:var(--txt)}

/* ── شريط الأدوات ── */
.toolbar{display:flex;gap:12px;align-items:center;padding:16px 22px;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:220px;max-width:380px}
.search-wrap input{width:100%;padding:10px 36px 10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel)}
.search-wrap input:focus{border-color:var(--emerald);outline:none}
.search-wrap i{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:12px}
.toolbar .hint{color:var(--mut);font-size:12.5px}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut);cursor:pointer;user-select:none}
.chk input{accent-color:var(--emerald)}

/* ── البطاقات ── */
#list{padding:0 22px 60px;display:grid;gap:12px;max-width:1080px}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start;
  transition:box-shadow .15s;
}
.card:hover{box-shadow:0 6px 24px rgba(32,36,31,.07)}
.card.test-marked{opacity:.55;background:#F5F4EF}
.c-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.c-name{font-weight:700;font-size:15.5px;color:var(--ink)}
.badge{border-radius:20px;padding:2px 11px;font-size:11.5px;font-weight:700}
.badge.course{background:var(--emerald-tint);color:var(--emerald-deep)}
.badge.grant{background:var(--violet-tint);color:var(--violet)}
.badge.age-warn{background:var(--amber-tint);color:var(--amber)}
.badge.age-crit{background:var(--crimson-tint);color:var(--crimson)}
.badge.age-ok{background:#EEF6F1;color:#3C7A5F}
.badge.multi{background:#FDF3D9;color:#8A6410}
.badge.test{background:#EFEDE6;color:#8B8778}
.c-meta{display:flex;gap:16px;flex-wrap:wrap;color:var(--mut);font-size:12.5px;margin-bottom:4px}
.c-meta i{margin-left:4px;font-size:11px}
.c-history{font-size:12.5px;color:var(--txt);background:var(--paper);border:1px dashed var(--line);border-radius:9px;padding:7px 12px;margin-top:6px;line-height:1.9}
.c-history b{color:var(--emerald-deep)}
.c-actions{display:flex;flex-direction:column;gap:7px;min-width:168px}
.act{
  display:flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 12px;border-radius:9px;font-size:12.5px;font-weight:700;transition:.15s;border:1.5px solid transparent;
}
.act.primary{background:var(--emerald);color:#fff}
.act.primary:hover{background:var(--emerald-deep)}
.act.wa{background:#fff;border-color:#BFE3CE;color:#1E7D4F}
.act.wa:hover{background:#F0FAF4}
.act.ghost{background:#fff;border-color:var(--line);color:var(--mut)}
.act.ghost:hover{color:var(--txt);border-color:#CFCDC5}
.act.mini{padding:6px 10px;font-size:11.5px;font-weight:600}
.act:disabled{opacity:.5;cursor:not-allowed}
.mini-row{display:flex;gap:6px}
.mini-row .act{flex:1}
.contact-note{font-size:11px;color:var(--mut);text-align:center;margin-top:2px}
.contact-note.done{color:var(--emerald-deep);font-weight:600}

.empty{
  text-align:center;padding:70px 20px;color:var(--mut);
}
.empty i{font-size:44px;color:#D8D6CD;margin-bottom:14px;display:block}
.empty h3{color:var(--txt);font-size:17px;margin-bottom:6px}
#loading{text-align:center;padding:80px 20px;color:var(--mut)}
#loading i{font-size:34px;color:var(--emerald);margin-bottom:14px;display:block}

/* ── نافذة الرسالة ── */
#modalOverlay{position:fixed;inset:0;background:rgba(17,20,16,.55);z-index:150;display:none;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(2px)}
#modalOverlay.on{display:flex}
.modal{width:min(560px,100%);background:var(--panel);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden;max-height:92vh;display:flex;flex-direction:column}
.m-head{padding:18px 22px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.m-head h3{font-size:16px;color:var(--ink)}
.m-head .sub{font-size:12px;color:var(--mut);margin-top:2px}
.m-close{color:var(--mut);font-size:18px;padding:4px 8px;border-radius:8px}
.m-close:hover{background:var(--paper);color:var(--txt)}
.m-body{padding:18px 22px;overflow-y:auto}
.m-body label{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin-bottom:6px}
.m-body textarea{
  width:100%;min-height:190px;padding:13px 15px;border:1.5px solid var(--line);border-radius:11px;
  background:var(--paper);resize:vertical;line-height:1.85;font-size:13.5px;
}
.m-body textarea:focus{border-color:var(--emerald);outline:none}
.tpl-row{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
.tpl-btn{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:5px 13px;font-size:12px;font-weight:600;color:var(--mut);transition:.15s}
.tpl-btn:hover,.tpl-btn.on{background:var(--emerald-tint);border-color:var(--emerald);color:var(--emerald-deep)}
.m-foot{padding:14px 22px 18px;border-top:1px solid var(--line);display:flex;gap:10px}
.m-foot .act{flex:1;padding:12px}

/* ── التوست ── */
#toast{
  position:fixed;bottom:24px;right:50%;transform:translateX(50%);z-index:300;
  background:var(--ink);color:#fff;border-radius:11px;padding:12px 22px;font-size:13.5px;font-weight:600;
  box-shadow:0 12px 34px rgba(0,0,0,.3);display:none;
}
#toast.on{display:block;animation:tin .2s ease}
#toast.bad{background:var(--crimson)}
#toast.warn{background:var(--amber)}
@keyframes tin{from{opacity:0;transform:translateX(50%) translateY(8px)}to{opacity:1;transform:translateX(50%) translateY(0)}}

/* ── موبايل ── */
@media (max-width:680px){
  .card{grid-template-columns:1fr}
  .c-actions{flex-direction:row;flex-wrap:wrap;min-width:0}
  .c-actions .act{flex:1;min-width:130px}
  .mini-row{flex:1 1 100%}
  .top{padding:14px 16px}
  .top-stats{margin-inline-start:0;width:100%}
  .tstat{flex:1}
  #list,.toolbar,.tabs{padding-left:14px;padding-right:14px}
}
</style>
</head>
<body>

<!-- ═══ شاشة الدخول ═══ -->
<div id="authSplash">
  <div id="authWait" class="auth-wait" style="display:none">
    <div class="spin"><i class="fas fa-circle-notch fa-spin fa-2x"></i></div>
    <div>جاري التحقق…</div>
  </div>
  <div id="authCard" class="auth-card">
    <div class="auth-brand">مكتب الفرص</div>
    <div class="auth-sub">منظور الفؤاد — للمشرف فقط</div>
    <div class="auth-field">
      <label>البريد الإلكتروني</label>
      <input type="email" id="authEmail" autocomplete="username" dir="ltr">
    </div>
    <div class="auth-field">
      <label>كلمة المرور</label>
      <input type="password" id="authPass" autocomplete="current-password" dir="ltr">
    </div>
    <button id="authBtn">دخول</button>
    <div id="authError"></div>
  </div>
</div>

<!-- ═══ التطبيق ═══ -->
<div id="appShell">

  <div class="top">
    <div class="top-brand">مكتب الفرص<small>متابعة المعلّق · رعاية الخريجين · إعادة التنشيط</small></div>
    <div class="top-stats">
      <div class="tstat hot"><b id="stHot">—</b><span>سخن الآن</span></div>
      <div class="tstat alum"><b id="stAlum">—</b><span>خريجون للرجوع</span></div>
      <div class="tstat"><b id="stRev">—</b><span>إعادة تنشيط</span></div>
    </div>
    <div class="top-actions">
      <button class="top-btn" onclick="reloadAll()"><i class="fas fa-rotate"></i> تحديث</button>
      <button class="top-btn" onclick="doLogout()"><i class="fas fa-arrow-right-from-bracket"></i> خروج</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="hot" onclick="setTab('hot')">
      <i class="fas fa-fire"></i> سخن دلوقتي <span class="cnt" id="cntHot">0</span>
    </button>
    <button class="tab" data-tab="alumni" onclick="setTab('alumni')">
      <i class="fas fa-graduation-cap"></i> خريجون للرجوع <span class="cnt" id="cntAlum">0</span>
    </button>
    <button class="tab" data-tab="revive" onclick="setTab('revive')">
      <i class="fas fa-seedling"></i> إعادة تنشيط <span class="cnt" id="cntRev">0</span>
    </button>
  </div>

  <div class="toolbar">
    <div class="search-wrap">
      <input type="text" id="searchBox" placeholder="بحث بالاسم أو الرقم أو الدورة…" oninput="render()">
      <i class="fas fa-magnifying-glass"></i>
    </div>
    <label class="chk"><input type="checkbox" id="showTest" onchange="render()"> إظهار الموسومين كتجربة</label>
    <span class="hint" id="tabHint"></span>
  </div>

  <div id="loading"><i class="fas fa-circle-notch fa-spin"></i>جاري تحميل البيانات…</div>
  <div id="list" style="display:none"></div>

</div>

<!-- ═══ نافذة الرسالة ═══ -->
<div id="modalOverlay">
  <div class="modal">
    <div class="m-head">
      <div>
        <h3 id="mTitle">إرسال رسالة</h3>
        <div class="sub" id="mSub"></div>
      </div>
      <button class="m-close" onclick="closeModal()"><i class="fas fa-xmark"></i></button>
    </div>
    <div class="m-body">
      <div class="tpl-row" id="tplRow"></div>
      <label>نص الرسالة — راجعه وعدّله قبل الإرسال</label>
      <textarea id="mText"></textarea>
    </div>
    <div class="m-foot">
      <button class="act primary" id="mSend" onclick="confirmSend()"><i class="fab fa-telegram"></i> إرسال عبر البوت</button>
      <button class="act ghost" onclick="closeModal()">إلغاء</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ═══════════════════════════════════════════════
   الإعدادات
   ═══════════════════════════════════════════════ */
const firebaseConfig = {
  apiKey: "AIzaSyDj0bV5gsyRbqpxzW0Zd9wjYmq53-Xdj3w",
  authDomain: "fouad-perspective.firebaseapp.com",
  projectId: "fouad-perspective",
  storageBucket: "fouad-perspective.firebasestorage.app",
  messagingSenderId: "1068763865336",
  appId: "1:1068763865336:web:b791abcd22d536aedd5b0d"
};
const ADMIN_EMAIL = 'admin@fouad-academy.com';
const BOT_BASE = 'https://us-central1-fouad-perspective.cloudfunctions.net/telegramBot';
const FLAGS_COLLECTION = 'oppDeskFlags';   /* كولكشن جانبي — لا يلمس بيانات الحجوزات */

/* عتبات القوائم (بالأيام) */
const HOT_MAX_AGE   = 30;   /* حجز معلّق أحدث من كده = سخن */
const ALUMNI_SILENCE = 60;  /* خريج ساكت من كده = مرشح للرجوع */
const SNOOZE_DAYS   = 3;    /* مدة التأجيل الافتراضية */

let db=null, auth=null, FV=null;

/* ═══════════════════════════════════════════════
   توحيد أسماء الدورات (علاج الازدواج في الداتا)
   ═══════════════════════════════════════════════ */
function normCourse(name){
  if(!name) return 'غير محدد';
  let n = String(name).trim().replace(/\s+/g,' ');
  n = n.replace(/التحوّل/g,'التحول');
  if(n.indexOf('المحراب') === 0) n = 'المحراب';
  if(n.indexOf('الحضن الدافئ') !== -1) n = 'الحضن الدافئ';
  return n;
}

/* ═══════════════════════════════════════════════
   حالة التطبيق
   ═══════════════════════════════════════════════ */
let bookings = [];      /* tempBookings */
let students = [];      /* individualStudents */
let chatsMap = new Map();/* chatId -> {lastActivity, displayName} */
let flags = new Map();  /* flagKey -> {isTest, snoozeUntil, lastContactedAt, contactCount} */
let queues = {hot:[], alumni:[], revive:[]};
let currentTab = 'hot';
let modalItem = null;   /* العنصر المفتوح في نافذة الرسالة */

/* ═══ أدوات مساعدة ═══ */
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toD(v){ if(!v) return null; if(v.toDate) return v.toDate(); const d=new Date(v); return isNaN(d)?null:d; }
function daysAgo(d){ return d ? Math.floor((Date.now()-d.getTime())/86400000) : null; }
function fmtDate(d){ return d ? d.toLocaleDateString('ar-EG',{day:'numeric',month:'short',year:'numeric'}) : '—'; }
function firstName(n){ return (n||'').trim().split(/\s+/)[0] || ''; }
function toast(msg, kind){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='on'+(kind?' '+kind:'');
  clearTimeout(t._h); t._h=setTimeout(()=>t.className='',3200);
}
function waLink(phone){
  if(!phone) return null;
  let p=String(phone).replace(/\D/g,'');
  if(!p) return null;
  if(p.indexOf('0')===0) p='2'+p;
  else if(p.indexOf('2')!==0 && p.length===10) p='20'+p;
  return 'https://wa.me/'+p;
}
function custName(b){ return b.customer?.name || b.grantRequest?.applicant?.name || b.name || 'بدون اسم'; }
function custPhone(b){ return b.customer?.whatsapp || b.customer?.phone || b.grantRequest?.applicant?.whatsapp || b.whatsapp || b.phone || null; }

/* مفتاح الوسوم: المحادثة لو موجودة، وإلا مستند الحجز/الطالب */
function flagKey(item){ return item.chatId ? 'c_'+item.chatId : 'd_'+item.docId; }
function getFlag(item){ return flags.get(flagKey(item)) || {}; }
function isSnoozed(item){
  const f=getFlag(item); const s=toD(f.snoozeUntil);
  return s && s.getTime() > Date.now();
}

/* ═══════════════════════════════════════════════
   تحميل البيانات
   ═══════════════════════════════════════════════ */
async function loadAll(){
  const [tb, st, tg, fl] = await Promise.all([
    db.collection('tempBookings').get(),
    db.collection('individualStudents').get(),
    db.collection('telegramChats').get(),
    db.collection(FLAGS_COLLECTION).get().catch(()=>({docs:[]}))
  ]);
  bookings = tb.docs.map(d=>({docId:d.id, ...d.data()}));
  students = st.docs.map(d=>({docId:d.id, ...d.data()}));
  chatsMap.clear();
  tg.docs.forEach(d=>{
    const x=d.data();
    chatsMap.set(String(d.id), {lastActivity: toD(x.lastActivity), displayName: x.displayName || x.firstName || null});
  });
  flags.clear();
  fl.docs.forEach(d=>flags.set(d.id, d.data()));
  buildQueues();
}

/* ═══════════════════════════════════════════════
   بناء القوائم الثلاث
   ═══════════════════════════════════════════════ */
function buildQueues(){
  queues = {hot:[], alumni:[], revive:[]};

  /* — القائمتان 1 و 3: من الحجوزات المعلّقة — */
  const OPEN = ['pending','pending_review','confirmed','active'];
  bookings.forEach(b=>{
    if(!OPEN.includes(b.status)) return;
    if(b.paymentConfirmed === true) return;
    const when = toD(b.timestamp || b.bookingDate);
    const age = daysAgo(when);
    const item = {
      kind: 'booking',
      docId: b.docId,
      chatId: b.telegramChatId ? String(b.telegramChatId) : null,
      name: custName(b),
      phone: custPhone(b),
      course: normCourse(b.courseName),
      isGrant: (b.bookingType||b.type) === 'grant_request',
      price: b.pricing?.finalPrice || null,
      when, age,
      status: b.status
    };
    if(age !== null && age <= HOT_MAX_AGE) queues.hot.push(item);
    else queues.revive.push(item);
  });
  queues.hot.sort((a,b)=>(a.age??999)-(b.age??999));                 /* الأحدث أولاً */
  queues.revive.sort((a,b)=>(a.age??999)-(b.age??999));              /* الأقل قِدماً أولاً */

  /* — القائمة 2: الخريجون — تجميع بالشخص الفريد — */
  const persons = new Map(); /* key -> {records:[]} */
  students.forEach(s=>{
    const key = s.telegramChatId ? 'c_'+s.telegramChatId : (s.userId ? 'u_'+s.userId : 'd_'+s.docId);
    if(!persons.has(key)) persons.set(key, []);
    persons.get(key).push(s);
  });

  /* شخص عنده حجز مفتوح دلوقتي؟ يبقى في قائمة السخن، مش هنا */
  const openChatIds = new Set(
    queues.hot.concat(queues.revive).filter(x=>x.chatId).map(x=>x.chatId)
  );

  persons.forEach((recs, key)=>{
    const grads = recs.filter(r=>r.courseAssigned === true);
    if(!grads.length) return;
    const chatId = recs.find(r=>r.telegramChatId)?.telegramChatId;
    const cid = chatId ? String(chatId) : null;
    if(cid && openChatIds.has(cid)) return; /* عنده رحلة مفتوحة — متغطّى في قائمة تانية */

    /* آخر نشاط: من المحادثة أو من أحدث مستند */
    const recDates = recs.map(r=>toD(r.courseAssignedAt || r.transferredAt || r.timestamp || r.bookingDate)).filter(Boolean);
    const latestRec = recDates.length ? new Date(Math.max(...recDates.map(d=>d.getTime()))) : null;
    const chatAct = cid ? (chatsMap.get(cid)?.lastActivity || null) : null;
    const lastSeen = [latestRec, chatAct].filter(Boolean).sort((a,b)=>b-a)[0] || null;
    const silence = daysAgo(lastSeen);
    if(silence === null || silence < ALUMNI_SILENCE) return;

    /* تاريخ الدورات (موحّد الأسماء، بدون تكرار) */
    const courseSet = [];
    grads.forEach(r=>{
      const c = normCourse(r.courseName || r.assignedCourseName || r.assignedCourseId);
      if(!courseSet.includes(c)) courseSet.push(c);
    });

    const sample = grads[grads.length-1];
    queues.alumni.push({
      kind: 'alumni',
      docId: sample.docId,
      chatId: cid,
      name: custName(sample) !== 'بدون اسم' ? custName(sample) : (cid && chatsMap.get(cid)?.displayName) || custName(sample),
      phone: custPhone(sample),
      courses: courseSet,
      coursesCount: grads.length,
      lastCourse: courseSet[courseSet.length-1],
      lastSeen, silence
    });
  });
  /* الأثمن أولاً: الأكثر دورات، وبعده الأطول صمتاً */
  queues.alumni.sort((a,b)=> (b.coursesCount-a.coursesCount) || (b.silence-a.silence));

  updateCounters();
}

function visibleQueue(name){
  const showTest = document.getElementById('showTest').checked;
  return queues[name].filter(it=>{
    const f = getFlag(it);
    if(f.isTest && !showTest) return false;
    if(isSnoozed(it)) return false;
    return true;
  });
}
function updateCounters(){
  document.getElementById('cntHot').textContent  = visibleQueue('hot').length;
  document.getElementById('cntAlum').textContent = visibleQueue('alumni').length;
  document.getElementById('cntRev').textContent  = visibleQueue('revive').length;
  document.getElementById('stHot').textContent   = visibleQueue('hot').length;
  document.getElementById('stAlum').textContent  = visibleQueue('alumni').length;
  document.getElementById('stRev').textContent   = visibleQueue('revive').length;
}

/* ═══════════════════════════════════════════════
   قوالب الرسائل — فصحى مبسطة، دافئة، بلا ضغط
   {الاسم} = الاسم الأول · {الدورة} = اسم الدورة
   ═══════════════════════════════════════════════ */
const TEMPLATES = {
  hot: [
    {t:'تذكير لطيف', m:'أهلاً {الاسم} 🌿\n\nلاحظنا أن حجزك في «{الدورة}» ما زال في انتظار إتمام الخطوة الأخيرة.\n\nلو واجهتك أي صعوبة في الدفع أو عندك سؤال قبل ما تكمل — احنا هنا، اكتب لنا وهنساعدك فوراً.\n\nمقعدك محفوظ، وقلوبنا معك 🤍'},
    {t:'عرض مساعدة', m:'أهلاً {الاسم} 🌿\n\nحابين نطمئن عليك بخصوص حجزك في «{الدورة}».\n\nلو المبلغ حالياً يمثل تحدياً، عندنا نظام تقسيط مرن — وممكن نتكلم في التفاصيل براحة تامة.\n\nالمهم عندنا إن الرحلة توصلك، مش أي حاجة تانية.'},
    {t:'طمأنة منحة', m:'أهلاً {الاسم} 🤲\n\nطلب الدعم الخاص بك لدورة «{الدورة}» عندنا ومهتمين به.\n\nلو عندك أي استفسار أو معلومة إضافية تحب توضحها، اكتب لنا هنا في أي وقت.\n\nنسأل الله أن ييسر لك الخير حيث كان.'}
  ],
  alumni: [
    {t:'سؤال حال', m:'أهلاً {الاسم} 🌿\n\nافتقدناك! مرّت فترة من رحلتك معنا في «{الدورة}»، وحابين نطمئن عليك.\n\nكيف حالك اليوم؟ وهل ما زلت تلمس أثر ما عشناه معاً في يومك؟\n\nاكتب لنا كلمة — يسعدنا نسمع منك 🤍'},
    {t:'أثر وتطبيق', m:'أهلاً {الاسم} 🌿\n\nبعد رحلتك في «{الدورة}»، سؤال من القلب:\n\nإيه أكتر حاجة لسه معاك منها لحد النهارده؟ وإيه اللي كان نفسك نقف معاك فيه أكتر؟\n\nإجابتك تهمنا فعلاً — بنبني بيها اللي جاي.'},
    {t:'باب مفتوح', m:'أهلاً {الاسم} 🌿\n\nيا مرحباً بك دائماً. رحلتك في «{الدورة}» كانت محطة، والطريق يكمل.\n\nلو حاسس إنك محتاج محطة جديدة — سواء تعميق لما بدأته أو اتجاه مختلف — كلمنا، وهنساعدك تختار الأنسب لك أنت تحديداً.\n\nالباب مفتوح دائماً 🤍'}
  ],
  revive: [
    {t:'باب مفتوح', m:'أهلاً {الاسم} 🌿\n\nمرّت فترة من تواصلك معنا بخصوص «{الدورة}»، وحبينا نطمئن عليك.\n\nلو الظروف وقتها ما ساعدتش — ده طبيعي تماماً، ومقعدك عندنا محفوظ متى ما كنت مستعداً.\n\nولو تحب تعرف الجديد عندنا، اكتب لنا كلمة.'},
    {t:'منحة قديمة', m:'أهلاً {الاسم} 🤲\n\nنتذكرك بخير. كان عندك طلب دعم لدورة «{الدورة}» ووقف الموضوع وقتها.\n\nلو ما زال الاهتمام موجوداً، يسعدنا نفتح الموضوع من جديد ونشوف المتاح حالياً.\n\nاكتب لنا وهنرد عليك بإذن الله.'}
  ]
};
function fillTemplate(tpl, item){
  return tpl
    .replace(/{الاسم}/g, firstName(item.name) || 'صديقنا')
    .replace(/{الدورة}/g, item.course || item.lastCourse || 'رحلتك معنا');
}

/* ═══════════════════════════════════════════════
   العرض
   ═══════════════════════════════════════════════ */
function setTab(t){
  currentTab = t;
  document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('active', el.dataset.tab===t));
  const hints = {
    hot: 'حجوزات معلّقة أحدث من '+HOT_MAX_AGE+' يوم — الأولوية القصوى',
    alumni: 'خريجون صامتون منذ '+ALUMNI_SILENCE+'+ يوم — الأكثر دورات أولاً',
    revive: 'حجوزات معلّقة أقدم من '+HOT_MAX_AGE+' يوم — بلا استعجال'
  };
  document.getElementById('tabHint').textContent = hints[t] || '';
  render();
}

function ageBadge(days, warnAt, critAt){
  if(days===null) return '';
  let cls='age-ok';
  if(days>=critAt) cls='age-crit'; else if(days>=warnAt) cls='age-warn';
  const txt = days===0 ? 'اليوم' : days===1 ? 'أمس' : 'منذ '+days+' يوم';
  return '<span class="badge '+cls+'"><i class="far fa-clock"></i> '+txt+'</span>';
}

function cardHTML(it){
  const f = getFlag(it);
  const key = flagKey(it);
  const wa = waLink(it.phone);
  const contacted = f.lastContactedAt ? toD(f.lastContactedAt) : null;

  let badges = '';
  if(it.kind==='booking'){
    badges += '<span class="badge course">'+esc(it.course)+'</span>';
    if(it.isGrant) badges += '<span class="badge grant"><i class="fas fa-hand-holding-heart"></i> منحة</span>';
    badges += ageBadge(it.age, 5, 14);
  } else {
    badges += '<span class="badge course">'+esc(it.lastCourse)+'</span>';
    if(it.coursesCount>1) badges += '<span class="badge multi"><i class="fas fa-layer-group"></i> '+it.coursesCount+' دورات</span>';
    badges += ageBadge(it.silence, 90, 180);
  }
  if(f.isTest) badges += '<span class="badge test"><i class="fas fa-flask"></i> تجربة</span>';

  let meta = '';
  if(it.kind==='booking'){
    meta += '<span><i class="far fa-calendar"></i>'+fmtDate(it.when)+'</span>';
    if(it.price) meta += '<span><i class="fas fa-tag"></i>'+esc(it.price)+'</span>';
    meta += '<span><i class="fas fa-signal"></i>'+esc(it.status)+'</span>';
  } else {
    meta += '<span><i class="far fa-eye"></i>آخر ظهور: '+fmtDate(it.lastSeen)+'</span>';
  }
  if(it.phone) meta += '<span dir="ltr"><i class="fab fa-whatsapp"></i>'+esc(it.phone)+'</span>';

  let history = '';
  if(it.kind==='alumni' && it.courses.length){
    history = '<div class="c-history"><b>رحلاته:</b> '+it.courses.map(esc).join(' ← ')+'</div>';
  }

  const canBot = !!it.chatId;
  const monitorLink = it.chatId
    ? '<a class="act ghost mini" href="telegram-monitor.html" target="_blank" rel="noopener" title="فتح مكتب المتابعة"><i class="fas fa-comments"></i> المحادثة</a>'
    : '';

  return `
  <div class="card ${f.isTest?'test-marked':''}" id="card-${esc(key)}">
    <div>
      <div class="c-head">
        <span class="c-name">${esc(it.name)}</span>
        ${badges}
      </div>
      <div class="c-meta">${meta}</div>
      ${history}
    </div>
    <div class="c-actions">
      <button class="act primary" ${canBot?'':'disabled title="لا يوجد chatId — استخدم واتساب"'}
        onclick='openModal(${JSON.stringify(key)})'>
        <i class="fab fa-telegram"></i> رسالة عبر البوت
      </button>
      ${wa ? `<a class="act wa" href="${wa}" target="_blank" rel="noopener" onclick='logContact(${JSON.stringify(key)},"whatsapp")'><i class="fab fa-whatsapp"></i> واتساب</a>` : ''}
      <div class="mini-row">
        <button class="act ghost mini" onclick='snoozeItem(${JSON.stringify(key)})' title="إخفاء ${SNOOZE_DAYS} أيام"><i class="far fa-clock"></i> تأجيل</button>
        <button class="act ghost mini" onclick='toggleTest(${JSON.stringify(key)})'><i class="fas fa-flask"></i> ${f.isTest?'إلغاء التجربة':'تجربة'}</button>
      </div>
      ${monitorLink}
      <div class="contact-note ${contacted?'done':''}">
        ${contacted ? '<i class="fas fa-check"></i> آخر تواصل: '+fmtDate(contacted) : 'لم يُتواصل معه من هنا بعد'}
      </div>
    </div>
  </div>`;
}

/* فهرس سريع: key -> item (حسب التبويب الحالي) */
let keyIndex = new Map();

function render(){
  const q = (document.getElementById('searchBox').value||'').trim().toLowerCase();
  let items = visibleQueue(currentTab);
  /* لو "إظهار التجارب" مفعّل، رجّع الموسومين للظهور */
  if(document.getElementById('showTest').checked){
    items = queues[currentTab].filter(it=>!isSnoozed(it));
  }
  if(q){
    items = items.filter(it=>{
      const hay = (it.name+' '+(it.phone||'')+' '+(it.course||'')+' '+((it.courses||[]).join(' '))).toLowerCase();
      return hay.indexOf(q) !== -1;
    });
  }
  keyIndex.clear();
  items.forEach(it=>keyIndex.set(flagKey(it), it));

  const list = document.getElementById('list');
  if(!items.length){
    const msgs = {
      hot: ['fa-mug-hot','لا يوجد سخن الآن','كل الحجوزات الحديثة إما مدفوعة أو متابَعة. ممتاز 🌿'],
      alumni: ['fa-heart','لا يوجد خريجون مستحقون حالياً','كل خريجيك إما نشطون أو تم التواصل معهم مؤخراً.'],
      revive: ['fa-seedling','قائمة إعادة التنشيط فارغة','لا توجد حجوزات قديمة معلّقة تحتاج لمسة.']
    };
    const m = msgs[currentTab];
    list.innerHTML = '<div class="empty"><i class="fas '+m[0]+'"></i><h3>'+m[1]+'</h3><div>'+m[2]+'</div></div>';
  } else {
    list.innerHTML = items.map(cardHTML).join('');
  }
  updateCounters();
}

/* ═══════════════════════════════════════════════
   الوسوم: تجربة / تأجيل / سجل التواصل
   ═══════════════════════════════════════════════ */
async function saveFlag(key, data){
  const merged = Object.assign({}, flags.get(key)||{}, data);
  flags.set(key, merged);
  try{
    await db.collection(FLAGS_COLLECTION).doc(key).set(data, {merge:true});
  }catch(e){ console.error(e); toast('تعذّر حفظ الوسم','bad'); }
}
async function toggleTest(key){
  const cur = flags.get(key)||{};
  await saveFlag(key, {isTest: !cur.isTest, updatedAt: new Date().toISOString()});
  toast(cur.isTest ? 'أُلغي وسم التجربة' : 'وُسم كحساب تجربة — لن يظهر في القوائم');
  render();
}
async function snoozeItem(key){
  const until = new Date(Date.now() + SNOOZE_DAYS*86400000);
  await saveFlag(key, {snoozeUntil: until.toISOString()});
  toast('تم التأجيل حتى '+fmtDate(until));
  render();
}
async function logContact(key, channel){
  await saveFlag(key, {
    lastContactedAt: new Date().toISOString(),
    lastChannel: channel,
    contactCount: ((flags.get(key)||{}).contactCount||0)+1
  });
  render();
}

/* ═══════════════════════════════════════════════
   نافذة الرسالة والإرسال عبر البوت
   ═══════════════════════════════════════════════ */
function openModal(key){
  const it = keyIndex.get(key);
  if(!it || !it.chatId) return;
  modalItem = it;
  document.getElementById('mTitle').textContent = 'رسالة إلى '+it.name;
  document.getElementById('mSub').textContent =
    it.kind==='alumni' ? ('خريج · آخر ظهور '+fmtDate(it.lastSeen)) : (esc(it.course)+' · '+(it.isGrant?'منحة':'حجز فردي'));

  /* اختيار مجموعة القوالب المناسبة */
  let tpls = TEMPLATES[currentTab] || TEMPLATES.hot;
  if(currentTab==='hot' && it.isGrant) tpls = [TEMPLATES.hot[2], TEMPLATES.hot[0]];
  if(currentTab==='revive' && it.isGrant) tpls = [TEMPLATES.revive[1], TEMPLATES.revive[0]];

  const row = document.getElementById('tplRow');
  row.innerHTML = tpls.map((t,i)=>'<button class="tpl-btn'+(i===0?' on':'')+'" data-i="'+i+'">'+esc(t.t)+'</button>').join('');
  row.querySelectorAll('.tpl-btn').forEach(btn=>{
    btn.onclick = ()=>{
      row.querySelectorAll('.tpl-btn').forEach(b=>b.classList.remove('on'));
      btn.classList.add('on');
      document.getElementById('mText').value = fillTemplate(tpls[+btn.dataset.i].m, modalItem);
    };
  });
  document.getElementById('mText').value = fillTemplate(tpls[0].m, it);
  document.getElementById('modalOverlay').classList.add('on');
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('on');
  modalItem = null;
}
async function confirmSend(){
  if(!modalItem) return;
  const text = document.getElementById('mText').value.trim();
  if(!text){ toast('اكتب نص الرسالة أولاً','warn'); return; }
  const btn = document.getElementById('mSend');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> جاري الإرسال…';
  const ok = await sendToBot(modalItem.chatId, text);
  btn.disabled = false; btn.innerHTML = '<i class="fab fa-telegram"></i> إرسال عبر البوت';
  if(ok){
    await logContact(flagKey(modalItem), 'telegram');
    toast('أُرسلت الرسالة ✓');
    closeModal();
  } else {
    toast('فشل الإرسال — جرّب مرة أخرى أو استخدم واتساب','bad');
  }
}
/* نفس نقطة البوت ونفس صيغة مكتب المتابعة — البوت يحفظ الرسالة في المحادثة */
async function sendToBot(chatId, message){
  try{
    const res = await fetch(BOT_BASE + '/send-message-to-chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ chatId: String(chatId), message: '📢 *رسالة من الفؤاد:*\n\n'+message })
    });
    if(!res.ok) return false;
    const data = await res.json().catch(()=>({success:true}));
    return data.success !== false;
  }catch(e){ return false; }
}

/* ═══════════════════════════════════════════════
   التشغيل والمصادقة
   ═══════════════════════════════════════════════ */
async function reloadAll(){
  document.getElementById('list').style.display='none';
  document.getElementById('loading').style.display='block';
  try{
    await loadAll();
    document.getElementById('loading').style.display='none';
    document.getElementById('list').style.display='grid';
    render();
    toast('تم التحديث');
  }catch(e){
    console.error(e);
    document.getElementById('loading').innerHTML = '<i class="fas fa-triangle-exclamation" style="color:var(--crimson)"></i>تعذّر تحميل البيانات — أعد المحاولة';
  }
}
function doLogout(){ auth.signOut().then(()=>location.reload()); }

document.addEventListener('DOMContentLoaded', ()=>{
  if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.firestore();
  FV = firebase.firestore.FieldValue;

  const splash=document.getElementById('authSplash');
  const card=document.getElementById('authCard');
  const wait=document.getElementById('authWait');
  card.style.display='none'; wait.style.display='block';

  auth.onAuthStateChanged(async user=>{
    if(user && user.email === ADMIN_EMAIL){
      splash.style.display='none';
      document.getElementById('appShell').classList.add('on');
      setTab('hot');
      await reloadAll();
    } else {
      wait.style.display='none'; card.style.display='block';
    }
  });

  document.getElementById('authBtn').onclick = async ()=>{
    const email=document.getElementById('authEmail').value.trim();
    const pass=document.getElementById('authPass').value;
    const err=document.getElementById('authError');
    const btn=document.getElementById('authBtn');
    err.style.display='none'; btn.disabled=true;
    try{ await auth.signInWithEmailAndPassword(email, pass); }
    catch(e){ err.textContent='بيانات الدخول غير صحيحة'; err.style.display='block'; }
    btn.disabled=false;
  };
  document.getElementById('authPass').addEventListener('keypress', e=>{
    if(e.key==='Enter') document.getElementById('authBtn').click();
  });
  document.getElementById('modalOverlay').addEventListener('click', e=>{
    if(e.target.id==='modalOverlay') closeModal();
  });
});
</script>
