<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملاذ الحيارى - إعلان العودة</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary-blue: #3b82f6;
            --primary-blue-dark: #2563eb;
            --success-green: #10b981;
            --golden: #fbbf24;
            --golden-dark: #f59e0b;
            --primary-bg: #1a2332;
            --secondary-bg: #0f172a;
            --card-bg: #1e293b;
            --text-secondary: #94a3b8;
            --glow-blue: 0 0 30px rgba(59, 130, 246, 0.4);
            --glow-green: 0 0 30px rgba(16, 185, 129, 0.4);
            --glow-gold: 0 0 30px rgba(251, 191, 36, 0.5);
        }
        
        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--secondary-bg);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        
        /* Cosmic Background */
        .cosmic-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background:
                radial-gradient(ellipse at top right, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
                radial-gradient(ellipse at bottom left, rgba(16, 185, 129, 0.12) 0%, transparent 40%),
                radial-gradient(ellipse at center, rgba(251, 191, 36, 0.08) 0%, transparent 60%);
            animation: cosmic-float 20s ease-in-out infinite;
        }
        
        @keyframes cosmic-float {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(2deg); }
        }
        
        /* Main Container */
        .announcement-container {
            width: 1080px;
            height: 1080px;
            background: linear-gradient(135deg, var(--primary-bg) 0%, var(--secondary-bg) 100%);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        
        /* Glowing Border */
        .announcement-container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(135deg, var(--primary-blue), var(--success-green), var(--golden));
            border-radius: 20px;
            opacity: 0.5;
            z-index: -1;
            animation: border-glow 3s linear infinite;
        }
        
        @keyframes border-glow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
        }
        
        /* Pattern Overlay */
        .pattern-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.05;
            background-image: 
                repeating-linear-gradient(45deg, transparent, transparent 35px, rgba(255,255,255,.05) 35px, rgba(255,255,255,.05) 70px),
                repeating-linear-gradient(-45deg, transparent, transparent 35px, rgba(255,255,255,.05) 35px, rgba(255,255,255,.05) 70px);
        }
        
        /* Content */
        .content {
            position: relative;
            padding: 80px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 2;
        }
        
        /* Header Section */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--golden), var(--golden-dark));
            color: var(--secondary-bg);
            padding: 8px 24px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 30px;
            box-shadow: var(--glow-gold);
            animation: pulse-gold 2s ease-in-out infinite;
        }
        
        @keyframes pulse-gold {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .main-title {
            font-family: 'Amiri', serif;
            font-size: 120px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-blue) 0%, var(--success-green) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(59, 130, 246, 0.3);
            margin-bottom: 20px;
            line-height: 1.2;
        }
        
        .subtitle {
            font-size: 36px;
            color: var(--text-secondary);
            font-weight: 300;
            letter-spacing: 3px;
        }
        
        /* Center Section */
        .center-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .announcement-box {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8) 0%, rgba(30, 41, 59, 0.4) 100%);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 20px;
            padding: 60px;
            max-width: 800px;
            position: relative;
            backdrop-filter: blur(10px);
        }
        
        .announcement-box::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, transparent 70%);
            animation: pulse-expand 3s ease-in-out infinite;
        }
        
        @keyframes pulse-expand {
            0%, 100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        
        .announcement-text {
            position: relative;
            z-index: 1;
        }
        
        .announcement-text h2 {
            font-size: 48px;
            color: var(--golden);
            margin-bottom: 30px;
            text-align: center;
            font-weight: 700;
            text-shadow: var(--glow-gold);
        }
        
        .feature-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 40px;
        }
        
        .feature {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .feature-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary-blue), var(--success-green));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: var(--glow-blue);
        }
        
        .feature-icon::before {
            content: '✦';
            font-size: 24px;
            color: white;
        }
        
        .feature-text {
            font-size: 22px;
            color: #e2e8f0;
            line-height: 1.4;
        }
        
        /* Date Section */
        .date-section {
            margin-top: 60px;
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(16, 185, 129, 0.1) 100%);
            border-radius: 15px;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }
        
        .date-label {
            font-size: 24px;
            color: var(--text-secondary);
            margin-bottom: 15px;
        }
        
        .date {
            font-size: 56px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--golden), var(--golden-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* Footer */
        .footer {
            text-align: center;
            padding-top: 40px;
            border-top: 1px solid rgba(148, 163, 184, 0.1);
        }
        
        .footer-text {
            font-size: 22px;
            color: var(--text-secondary);
            margin-bottom: 15px;
        }
        
        .coach-name {
            font-size: 28px;
            color: var(--primary-blue);
            font-weight: 700;
        }
        
        /* Floating Elements */
        .floating-element {
            position: absolute;
            opacity: 0.1;
            animation: float 10s ease-in-out infinite;
        }
        
        .floating-element:nth-child(1) {
            top: 10%;
            left: 10%;
            width: 80px;
            height: 80px;
            background: var(--primary-blue);
            border-radius: 50%;
            animation-delay: 0s;
        }
        
        .floating-element:nth-child(2) {
            top: 70%;
            right: 10%;
            width: 60px;
            height: 60px;
            background: var(--success-green);
            border-radius: 50%;
            animation-delay: 3s;
        }
        
        .floating-element:nth-child(3) {
            bottom: 20%;
            left: 15%;
            width: 40px;
            height: 40px;
            background: var(--golden);
            border-radius: 50%;
            animation-delay: 6s;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }
        
        /* Responsive adjustments for screenshot */
        @media screen and (max-width: 1100px) {
            .announcement-container {
                transform: scale(0.9);
            }
        }
    </style>
</head>
<body>
    <div class="cosmic-bg"></div>
    
    <div class="announcement-container">
        <div class="pattern-overlay"></div>
        <div class="floating-element"></div>
        <div class="floating-element"></div>
        <div class="floating-element"></div>
        
        <div class="content">
            <div class="header">
                <div class="badge">أبشروا سنعود مع</div>
                <h1 class="main-title">ملاذ الحيارى</h1>
                <p class="subtitle">خريطة البحث عن المأوى للقلوب التائهة</p>
            </div>
            
            <div class="center-content">
                <div class="announcement-box">
                    <div class="announcement-text">
                        <h2>نظام فريد لأول مرة</h2>
                        
                        <div class="feature-grid">
                            <div class="feature">
                                <div class="feature-icon"></div>
                                <div class="feature-text">الأحد: مجاني للجميع</div>
                            </div>
                            <div class="feature">
                                <div class="feature-icon"></div>
                                <div class="feature-text">الأربعاء: تطبيق عملي</div>
                            </div>
                            <div class="feature">
                                <div class="feature-icon"></div>
                                <div class="feature-text">نظام نقاط متكامل للمشتركين</div>
                            </div>
                            <div class="feature">
                                <div class="feature-icon"></div>
                                <div class="feature-text">شارات إنجاز مرئية للمشتركين</div>
                            </div>
                        </div>
                        
                        <div class="date-section">
                            <div class="date-label">البداية الحقيقية</div>
                            <div class="date">الأحد ٥ أكتوبر</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="footer">
                <p class="footer-text">رحلة تحول حقيقية من</p>
                <p class="coach-name">الكوتش محمود فؤاد - منظور الفؤاد</p>
            </div>
        </div>
    </div>
</body>
</html>
