<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة بيانات العميل - منظور الفؤاد</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>

    <style>
        /* ==================== متغيرات الألوان ==================== */
        :root {
            --primary-bg: #1a2332;
            --secondary-bg: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --primary-blue: #3b82f6;
            --primary-green: #10b981;
            --accent-orange: #f59e0b;
            --danger-red: #ef4444;
            --gold-accent: #fbbf24;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --glow-blue: 0 0 20px rgba(59, 130, 246, 0.3);
            --glow-green: 0 0 20px rgba(16, 185, 129, 0.3);
            --glow-gold: 0 0 20px rgba(251, 191, 36, 0.3);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --border-radius: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, var(--primary-bg) 0%, var(--secondary-bg) 100%);
            min-height: 100vh;
            color: var(--text-primary);
            direction: rtl;
        }

        /* شاشة التحميل */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }

        .loading-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--primary-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        /* الهيدر */
        .main-header {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .back-button {
            background: var(--secondary-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            transition: var(--transition);
        }

        .back-button:hover {
            background: var(--primary-blue);
            color: var(--text-primary);
            box-shadow: var(--glow-blue);
            transform: translateY(-2px);
        }

        .page-title {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .title-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-green));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }

        /* معلومات المستخدم في الهيدر */
        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-badge {
            background: linear-gradient(135deg, var(--card-bg), var(--secondary-bg));
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-name {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 16px;
        }

        .user-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: var(--primary-green);
        }

        .user-status i {
            font-size: 8px;
        }

        /* المحتوى الرئيسي */
        .main-content {
            padding: 40px 30px;
            min-height: calc(100vh - 200px);
        }

        .content-container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .content-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--primary-blue), var(--primary-green), var(--gold-accent));
        }

        /* التبويبات */
        .tabs-navigation {
            display: flex;
            background: var(--secondary-bg);
            border-bottom: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        .tab-button {
            flex: 1;
            background: none;
            border: none;
            padding: 20px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .tab-button.active {
            color: var(--text-primary);
            background: var(--card-bg);
        }

        .tab-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: var(--transition);
        }

        .tab-button.active .tab-icon {
            color: var(--primary-blue);
            transform: scale(1.1);
        }

        /* محتوى التبويبات */
        .tabs-content {
            padding: 40px;
            min-height: 400px;
        }

        .tab-panel {
            display: none;
            animation: fadeInUp 0.5s ease;
        }

        .tab-panel.active {
            display: block;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* بطاقات المعلومات */
        .info-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            padding: 25px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .info-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-blue), var(--primary-green));
        }

        .info-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .info-card-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-card-icon {
            width: 35px;
            height: 35px;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-green));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .info-item {
            background: var(--secondary-bg);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .info-label {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .info-value {
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 600;
        }

        /* أزرار الإجراءات */
        .quick-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .quick-action-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
        }

        .btn-create-account {
            background: linear-gradient(135deg, var(--primary-green), #059669);
            color: white;
        }

        .btn-create-account:hover {
            transform: translateY(-2px);
            box-shadow: var(--glow-green);
        }

        /* Footer */
        .main-footer {
            text-align: center;
            padding: 30px;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* حالة الخطأ */
        .error-state {
            text-align: center;
            padding: 60px 20px;
        }

        .error-icon {
            font-size: 60px;
            color: var(--danger-red);
            margin-bottom: 20px;
        }

        .error-title {
            font-size: 24px;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        .error-message {
            color: var(--text-secondary);
            margin-bottom: 30px;
        }

        .error-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
    </style>
</head>

<body>
    <!-- شاشة التحميل -->
    <div id="loadingScreen" class="loading-overlay active">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <div class="loading-text">جاري التحميل...</div>
        </div>
    </div>

    <!-- الهيدر الرئيسي -->
    <header class="main-header">
        <div class="header-container">
            <div class="header-right">
                <button class="back-button" onclick="goBack()">
                    <i class="fas fa-arrow-right"></i>
                    <span>رجوع للحجوزات</span>
                </button>
                <h1 class="page-title">
                    <div class="title-icon">
                        <i class="fas fa-user-cog"></i>
                    </div>
                    <span id="pageTitle">إدارة بيانات العميل</span>
                </h1>
            </div>
            
            <div class="header-left" id="quickUserInfo" style="display: none;">
                <div class="user-badge">
                    <span class="user-name" id="headerUserName">--</span>
                    <span class="user-status" id="headerUserStatus">
                        <i class="fas fa-circle"></i> نشط
                    </span>
                </div>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="main-content">
        <div class="content-container">
            <div class="tabs-navigation">
                <button class="tab-button active" data-tab="basic" onclick="switchTab('basic')">
                    <div class="tab-icon">
                        <i class="fas fa-user"></i>
                    </div>
                    <span>البيانات الأساسية</span>
                </button>
                <button class="tab-button" data-tab="account" onclick="switchTab('account')">
                    <div class="tab-icon">
                        <i class="fas fa-key"></i>
                    </div>
                    <span>إنشاء الحساب</span>
                </button>
                <button class="tab-button" data-tab="courses" onclick="switchTab('courses')">
                    <div class="tab-icon">
                        <i class="fas fa-graduation-cap"></i>
                    </div>
                    <span>الدورات</span>
                </button>
                <button class="tab-button" data-tab="points" onclick="switchTab('points')">
                    <div class="tab-icon">
                        <i class="fas fa-star"></i>
                    </div>
                    <span>النقاط</span>
                </button>
                <button class="tab-button" data-tab="financial" onclick="switchTab('financial')">
                    <div class="tab-icon">
                        <i class="fas fa-wallet"></i>
                    </div>
                    <span>المالية</span>
                </button>
            </div>

            <div class="tabs-content">
                <div class="tab-panel active" id="basicTab">
                    <!-- محتوى البيانات الأساسية -->
                </div>
                <div class="tab-panel" id="accountTab">
                    <!-- محتوى إنشاء الحساب -->
                </div>
                <div class="tab-panel" id="coursesTab">
                    <!-- محتوى الدورات -->
                </div>
                <div class="tab-panel" id="pointsTab">
                    <!-- محتوى النقاط -->
                </div>
                <div class="tab-panel" id="financialTab">
                    <!-- محتوى المالية -->
                </div>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <p>© 2024 منظور الفؤاد - رحلة نحو الارتواء الحقيقي</p>
    </footer>

    <script>
        // ==================== إعدادات Firebase ====================
        const firebaseConfig = {
            apiKey: "AIzaSyDj0bV5gsyRbqpxzW0Zd9wjYmq53-Xdj3w",
            authDomain: "fouad-perspective.firebaseapp.com",
            projectId: "fouad-perspective",
            storageBucket: "fouad-perspective.firebasestorage.app",
            messagingSenderId: "1068763865336",
            appId: "1:1068763865336:web:b791abcd22d536aedd5b0d",
            measurementId: "G-RY1FYVB3Q9"
        };

        // تهيئة Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();

        // ==================== متغيرات عامة ====================
        let currentTab = 'basic';
        let currentStudentId = null;
        let currentStudentData = null;

        // ==================== تهيئة الصفحة ====================
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('🔄 بدء تحميل الصفحة...');
            
            // استخراج معرف الطالب من URL
            const urlParams = new URLSearchParams(window.location.search);
            currentStudentId = urlParams.get('studentId');
            
            console.log('📋 معرف الطالب:', currentStudentId);
            
            if (!currentStudentId) {
                showError('لم يتم تحديد العميل', 'يرجى العودة لصفحة الحجوزات واختيار عميل');
                return;
            }
            
            // تحميل بيانات الطالب
            await loadStudentData();
        });

        // ==================== تحميل بيانات الطالب ====================
       async function loadStudentData() {
    try {
        showLoading();
        
        console.log('🔍 البحث عن:', currentStudentId);
        
        // البحث أولاً في individualStudents
        let studentDoc = await db.collection('individualStudents').doc(currentStudentId).get();
        
        if (!studentDoc.exists) {
            console.log('⚠️ ليس في individualStudents، البحث في users...');
            
            // البحث في users بواسطة userId
            const userSearch = await db.collection('individualStudents')
                .where('userId', '==', currentStudentId)
                .limit(1)
                .get();
            
            if (!userSearch.empty) {
                studentDoc = userSearch.docs[0];
                currentStudentId = studentDoc.id; // تحديث المعرف للمعرف الصحيح
                console.log('✅ تم العثور عليه بمعرف المستخدم');
            } else {
                throw new Error('لم يتم العثور على البيانات');
            }
        }
        
        currentStudentData = {
            id: studentDoc.id,
            ...studentDoc.data()
        };
        
        console.log('✅ البيانات:', currentStudentData);
        
        // تحديث allStudents
        allStudents = [currentStudentData];
        
        updateHeaderInfo();
        loadTabContent(currentTab);
        
    } catch (error) {
        console.error('❌ خطأ:', error);
        
        // عرض قائمة الطلاب المتاحين
        const snapshot = await db.collection('individualStudents').limit(5).get();
        let links = '';
        
        snapshot.forEach(doc => {
            const data = doc.data();
            if (data.customer?.name) {
                const url = `${window.location.pathname}?studentId=${doc.id}`;
                links += `<div style="margin: 10px 0;">
                    <a href="${url}" style="color: #3b82f6; text-decoration: none;">
                        ${data.customer.name} - ${doc.id}
                    </a>
                </div>`;
            }
        });
        
        Swal.fire({
            icon: 'info',
            title: 'اختر طالب',
            html: `<div style="text-align: right; direction: rtl;">
                <p>المعرف المطلوب غير موجود</p>
                <hr style="margin: 20px 0;">
                <strong>طلاب متاحين:</strong>
                ${links}
            </div>`,
            confirmButtonText: 'حسناً'
        });
    } finally {
        hideLoading();
    }
}
        // دالة لعرض الروابط الصالحة
async function showAvailableLinks() {
    const snapshot = await db.collection('individualStudents').limit(10).get();
    
    console.log('📋 روابط صالحة للصفحة:');
    console.log('========================');
    
    snapshot.forEach(doc => {
        const data = doc.data();
        if (data.customer?.name) {
            const url = `${window.location.origin}${window.location.pathname}?studentId=${doc.id}`;
            console.log(`${data.customer.name}:`);
            console.log(url);
            console.log('---');
        }
    });
}

window.showAvailableLinks = showAvailableLinks;

        // ==================== عرض رسالة الخطأ ====================
        function showError(title, message) {
            hideLoading();
            
            const content = document.querySelector('.tabs-content');
            content.innerHTML = `
                <div class="error-state">
                    <div class="error-icon">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>
                    <h2 class="error-title">${title}</h2>
                    <p class="error-message">${message}</p>
                    <div class="error-actions">
                        <button class="quick-action-btn btn-create-account" onclick="location.reload()">
                            <i class="fas fa-redo"></i>
                            إعادة المحاولة
                        </button>
                        <button class="quick-action-btn" style="background: #6b7280; color: white;" onclick="goBack()">
                            <i class="fas fa-arrow-right"></i>
                            العودة للحجوزات
                        </button>
                    </div>
                </div>
            `;
            
            // إخفاء التبويبات
            document.querySelector('.tabs-navigation').style.display = 'none';
        }

        // ==================== تحديث معلومات الهيدر ====================
        function updateHeaderInfo() {
            if (!currentStudentData) return;
            
            const quickInfo = document.getElementById('quickUserInfo');
            const userName = document.getElementById('headerUserName');
            const userStatus = document.getElementById('headerUserStatus');
            
            quickInfo.style.display = 'flex';
            userName.textContent = currentStudentData.customer?.name || 'غير محدد';
            
            if (currentStudentData.accountCreated) {
                userStatus.innerHTML = '<i class="fas fa-circle"></i> حساب نشط';
                userStatus.style.color = '#10b981';
            } else {
                userStatus.innerHTML = '<i class="fas fa-circle"></i> بدون حساب';
                userStatus.style.color = '#f59e0b';
            }
        }

        // ==================== التبديل بين التبويبات ====================
        function switchTab(tabName) {
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelectorAll('.tab-panel').forEach(panel => {
                panel.classList.remove('active');
            });
            
            document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
            document.getElementById(tabName + 'Tab').classList.add('active');
            
            currentTab = tabName;
            loadTabContent(tabName);
        }

        // ==================== تحميل محتوى التبويبات ====================
        function loadTabContent(tabName) {
            switch(tabName) {
                case 'basic':
                    loadBasicInfoTab();
                    break;
                default:
                    document.getElementById(tabName + 'Tab').innerHTML = '<p style="text-align: center; padding: 40px;">قيد التطوير...</p>';
            }
        }

        // ==================== تحميل تبويب البيانات الأساسية ====================
        function loadBasicInfoTab() {
            const panel = document.getElementById('basicTab');
            if (!currentStudentData) {
                panel.innerHTML = '<p>لا توجد بيانات</p>';
                return;
            }
            
            const customer = currentStudentData.customer || {};
            const pricing = currentStudentData.pricing || {};
            
            panel.innerHTML = `
                <div class="info-card">
                    <div class="info-card-header">
                        <div class="info-card-title">
                            <div class="info-card-icon">
                                <i class="fas fa-user"></i>
                            </div>
                            <span>المعلومات الشخصية</span>
                        </div>
                    </div>
                    
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">
                                <i class="fas fa-signature"></i> الاسم
                            </div>
                            <div class="info-value">${customer.name || 'غير محدد'}</div>
                        </div>
                        
                        <div class="info-item">
                            <div class="info-label">
                                <i class="fab fa-whatsapp"></i> واتساب
                            </div>
                            <div class="info-value">${customer.whatsapp || 'غير محدد'}</div>
                        </div>
                        
                        <div class="info-item">
                            <div class="info-label">
                                <i class="fas fa-envelope"></i> البريد
                            </div>
                            <div class="info-value">${customer.email || 'غير محدد'}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        // ==================== وظائف المساعدة ====================
        function showLoading() {
            document.getElementById('loadingScreen').classList.add('active');
        }

        function hideLoading() {
            document.getElementById('loadingScreen').classList.remove('active');
        }

        function goBack() {
            window.location.href = 'manage-individual-bookings.html';
        }
    </script>
</body>
</html>
