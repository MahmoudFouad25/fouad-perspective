<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المستخدم - منظور الفؤاد</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        /* ==================== متغيرات الألوان ==================== */
        :root {
            /* الألوان الأساسية */
            --primary-bg: #1a2332;
            --secondary-bg: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            
            /* ألوان التفاعل */
            --primary-blue: #3b82f6;
            --primary-green: #10b981;
            --accent-orange: #f59e0b;
            --danger-red: #ef4444;
            --gold-accent: #fbbf24;
            
            /* ألوان النصوص */
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            
            /* تأثيرات */
            --glow-blue: 0 0 20px rgba(59, 130, 246, 0.3);
            --glow-green: 0 0 20px rgba(16, 185, 129, 0.3);
            --glow-gold: 0 0 20px rgba(251, 191, 36, 0.3);
            
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --border-radius: 16px;
        }

        /* ==================== إعدادات عامة ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, var(--primary-bg) 0%, var(--secondary-bg) 100%);
            min-height: 100vh;
            color: var(--text-primary);
            direction: rtl;
        }

        /* ==================== شاشة التحميل ==================== */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }

        .loading-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .loading-content {
            text-align: center;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--primary-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
            box-shadow: var(--glow-blue);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        /* ==================== الهيدر ==================== */
        .main-header {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .back-button {
            background: var(--secondary-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            transition: var(--transition);
        }

        .back-button:hover {
            background: var(--primary-blue);
            color: var(--text-primary);
            box-shadow: var(--glow-blue);
            transform: translateY(-2px);
        }

        .page-title {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .title-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-green));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }

        /* ==================== شريط التقدم المتطور ==================== */
        .progress-container {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        .progress-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.1), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .progress-bar {
            height: 6px;
            background: var(--secondary-bg);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 30px;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-blue), var(--primary-green), var(--gold-accent));
            border-radius: 3px;
            width: 20%;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--glow-blue);
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100px;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            animation: progress-shine 2s infinite;
        }

        @keyframes progress-shine {
            0% { transform: translateX(-100px); }
            100% { transform: translateX(100px); }
        }

        .steps-container {
            display: flex;
            justify-content: space-between;
            position: relative;
        }

        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: var(--transition);
            opacity: 0.5;
            position: relative;
        }

        .step.active {
            opacity: 1;
        }

        .step-icon {
            width: 50px;
            height: 50px;
            background: var(--secondary-bg);
            border: 2px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--text-muted);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .step.active .step-icon {
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-green));
            border-color: var(--primary-blue);
            color: white;
            box-shadow: var(--glow-blue);
            transform: scale(1.1);
        }

        .step-icon::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: rotate(45deg);
            transition: var(--transition);
        }

        .step.active .step-icon::before {
            animation: icon-shine 2s infinite;
        }

        @keyframes icon-shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .step-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            text-align: center;
        }

        .step.active .step-label {
            color: var(--text-primary);
        }

        /* ==================== المحتوى الرئيسي ==================== */
        .main-content {
            padding: 40px 30px;
            min-height: calc(100vh - 200px);
        }

        .content-container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .content-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--primary-blue), var(--primary-green), var(--gold-accent));
        }

        /* ==================== التبويبات المتطورة ==================== */
        .tabs-navigation {
            display: flex;
            background: var(--secondary-bg);
            border-bottom: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        .tabs-navigation::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            height: 2px;
            width: 20%;
            background: linear-gradient(90deg, var(--primary-blue), var(--primary-green));
            transition: transform 0.3s ease;
            transform: translateX(0);
        }

        .tab-button {
            flex: 1;
            background: none;
            border: none;
            padding: 20px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .tab-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, transparent, rgba(59, 130, 246, 0.1), transparent);
            opacity: 0;
            transition: var(--transition);
        }

        .tab-button:hover::before {
            opacity: 1;
        }

        .tab-button.active {
            color: var(--text-primary);
            background: var(--card-bg);
        }

        .tab-button.active::before {
            opacity: 1;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(16, 185, 129, 0.1));
        }

        .tab-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: var(--transition);
        }

        .tab-button.active .tab-icon {
            color: var(--primary-blue);
            transform: scale(1.1);
        }

        /* ==================== محتوى التبويبات ==================== */
        .tabs-content {
            padding: 40px;
            min-height: 400px;
        }

        .tab-panel {
            display: none;
            animation: fadeInUp 0.5s ease;
        }

        .tab-panel.active {
            display: block;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .panel-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .panel-title {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
        }

        .panel-description {
            font-size: 16px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .panel-content {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            background: var(--secondary-bg);
            border: 2px dashed var(--border-color);
            border-radius: var(--border-radius);
            position: relative;
            overflow: hidden;
        }

        .panel-content::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, transparent 70%);
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(0.8); opacity: 0.3; }
            50% { transform: scale(1.2); opacity: 0.1; }
        }

        .empty-state {
            text-align: center;
            z-index: 1;
        }

        .empty-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-green));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 40px;
            color: white;
            box-shadow: var(--glow-blue);
        }

        .empty-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .empty-description {
            font-size: 16px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* ==================== أزرار الإجراءات ==================== */
        .actions-bar {
            padding: 30px 40px;
            background: var(--secondary-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .action-button {
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .action-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: var(--transition);
        }

        .action-button:hover::before {
            left: 100%;
        }

        .btn-secondary {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .btn-secondary:hover {
            background: var(--secondary-bg);
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-green));
            color: white;
            box-shadow: var(--glow-blue);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.4);
        }

        /* ==================== Footer ==================== */
        .main-footer {
            text-align: center;
            padding: 30px;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* ==================== الاستجابة للشاشات الصغيرة ==================== */
        @media (max-width: 768px) {
            .header-container {
                padding: 0 20px;
                flex-direction: column;
                gap: 20px;
            }

            .page-title {
                font-size: 24px;
            }

            .progress-container {
                padding: 20px;
            }

            .steps-container {
                display: none;
            }

            .main-content {
                padding: 20px;
            }

            .tabs-content {
                padding: 20px;
            }

            .tabs-navigation {
                overflow-x: auto;
                scrollbar-width: none;
                -ms-overflow-style: none;
            }

            .tabs-navigation::-webkit-scrollbar {
                display: none;
            }

            .tab-button {
                min-width: 120px;
            }

            .actions-bar {
                padding: 20px;
                flex-direction: column;
                gap: 15px;
            }

            .action-button {
                width: 100%;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .panel-title {
                font-size: 28px;
            }

            .empty-icon {
                width: 60px;
                height: 60px;
                font-size: 30px;
            }

            .empty-title {
                font-size: 20px;
            }
        }

        /* ==================== معلومات المستخدم في الهيدر ==================== */
.header-left {
    display: flex;
    align-items: center;
    gap: 20px;
}

.user-badge {
    background: linear-gradient(135deg, var(--card-bg), var(--secondary-bg));
    border: 1px solid var(--border-color);
    padding: 10px 20px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 15px;
}

.user-name {
    font-weight: 600;
    color: var(--text-primary);
    font-size: 16px;
}

.user-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    color: var(--primary-green);
}

.user-status i {
    font-size: 8px;
}

/* ==================== بطاقات المعلومات ==================== */
.info-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: var(--border-radius);
    padding: 25px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
}

.info-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--primary-blue), var(--primary-green));
}

.info-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.info-card-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 10px;
}

.info-card-icon {
    width: 35px;
    height: 35px;
    background: linear-gradient(135deg, var(--primary-blue), var(--primary-green));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
}

.info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

.info-item {
    background: var(--secondary-bg);
    padding: 15px;
    border-radius: 10px;
    border: 1px solid var(--border-color);
}

.info-label {
    color: var(--text-secondary);
    font-size: 13px;
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 5px;
}

.info-value {
    color: var(--text-primary);
    font-size: 16px;
    font-weight: 600;
}

/* ==================== أزرار الإجراءات السريعة ==================== */
.quick-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.quick-action-btn {
    padding: 8px 16px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: var(--transition);
}

.btn-create-account {
    background: linear-gradient(135deg, var(--primary-green), #059669);
    color: white;
}

.btn-create-account:hover {
    transform: translateY(-2px);
    box-shadow: var(--glow-green);
}

.btn-assign-course {
    background: linear-gradient(135deg, var(--primary-blue), #2563eb);
    color: white;
}

.btn-assign-course:hover {
    transform: translateY(-2px);
    box-shadow: var(--glow-blue);
}

.btn-manage-points {
    background: linear-gradient(135deg, var(--gold-accent), var(--accent-orange));
    color: white;
}

.btn-manage-points:hover {
    transform: translateY(-2px);
    box-shadow: var(--glow-gold);
}

        /* ==================== شارات الحالة ==================== */
.status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
}

/* ==================== زر عرض الحساب ==================== */
.btn-view-account {
    background: linear-gradient(135deg, #6b7280, #4b5563);
    color: white;
}

.btn-view-account:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(107, 114, 128, 0.3);
}

/* ==================== تحسينات البطاقات ==================== */
.info-card:hover {
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    transform: translateY(-2px);
    transition: var(--transition);
}

.info-item:hover {
    background: var(--card-bg);
    transition: var(--transition);
}

/* ==================== تأثيرات الحركة ==================== */
@keyframes slideInFromRight {
    from {
        opacity: 0;
        transform: translateX(30px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

.info-card {
    animation: slideInFromRight 0.5s ease;
}

.info-card:nth-child(2) {
    animation-delay: 0.1s;
}

.info-card:nth-child(3) {
    animation-delay: 0.2s;
}

.info-card:nth-child(4) {
    animation-delay: 0.3s;
}
    </style>

</head>

<body>
    <!-- شاشة التحميل -->
    <div id="loadingScreen" class="loading-overlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <div class="loading-text">جاري التحميل...</div>
        </div>
    </div>

    <!-- الهيدر الرئيسي -->
    <header class="main-header">
        <div class="header-container">
            <div class="header-right">
                <button class="back-button" onclick="goBack()">
                    <i class="fas fa-arrow-right"></i>
                    <span>رجوع للحجوزات</span>
                </button>
                <h1 class="page-title">
                    <div class="title-icon">
                        <i class="fas fa-user-cog"></i>
                    </div>
                    <span id="pageTitle">إدارة بيانات العميل</span>
                </h1>
            </div>
            
            <!-- معلومات العميل السريعة -->
            <div class="header-left" id="quickUserInfo" style="display: none;">

        // ==================== انتظار تحميل Firebase ====================
function waitForFirebase() {
    return new Promise((resolve) => {
        if (typeof firebase !== 'undefined' && typeof db !== 'undefined') {
            resolve();
        } else {
            setTimeout(() => {
                waitForFirebase().then(resolve);
            }, 100);
        }
    });
}

// ==================== متغيرات عامة ====================
let currentTab = 'basic';
let currentStudentId = null;
let currentStudentData = null;
let allStudents = []; // إضافة هذا المتغير

// ==================== تهيئة الصفحة ====================
document.addEventListener('DOMContentLoaded', async function() {
    // انتظار تحميل Firebase
    await waitForFirebase();
    console.log('✅ Firebase جاهز');
    
    // استخراج معرف الطالب من URL
    const urlParams = new URLSearchParams(window.location.search);
    currentStudentId = urlParams.get('studentId');
    
    if (!currentStudentId) {
        Swal.fire({
            icon: 'error',
            title: 'خطأ',
            text: 'لم يتم تحديد العميل',
            confirmButtonText: 'العودة للحجوزات'
        }).then(() => {
            window.location.href = 'manage-individual-bookings.html';
        });
        return;
    }
    
    // تحميل بيانات الطالب
    await loadStudentData();
    
    // إخفاء شاشة التحميل
    hideLoading();
});
// ==================== تحميل بيانات الطالب ====================
async function loadStudentData() {
    try {
        showLoading();
        
        console.log('🔍 البحث عن:', currentStudentId);
        
        // البحث أولاً في individualStudents
        let studentDoc = await db.collection('individualStudents').doc(currentStudentId).get();
        
        if (!studentDoc.exists) {
            console.log('⚠️ ليس في individualStudents، البحث في users...');
            
            // البحث في users بواسطة userId
            const userSearch = await db.collection('individualStudents')
                .where('userId', '==', currentStudentId)
                .limit(1)
                .get();
            
            if (!userSearch.empty) {
                studentDoc = userSearch.docs[0];
                currentStudentId = studentDoc.id;
                console.log('✅ تم العثور عليه بمعرف المستخدم');
            } else {
                throw new Error('لم يتم العثور على البيانات');
            }
        }
        
        currentStudentData = {
            id: studentDoc.id,
            ...studentDoc.data()
        };
        
        console.log('✅ البيانات:', currentStudentData);
        
        // تحديث allStudents
        allStudents = [currentStudentData];
        
        updateHeaderInfo();
        loadTabContent(currentTab);
        
    } catch (error) {
        console.error('❌ خطأ:', error);
        
        // عرض قائمة الطلاب المتاحين
        const snapshot = await db.collection('individualStudents').limit(5).get();
        let links = '';
        
        snapshot.forEach(doc => {
            const data = doc.data();
            if (data.customer?.name) {
                const url = `${window.location.pathname}?studentId=${doc.id}`;
                links += `<div style="margin: 10px 0;">
                    <a href="${url}" style="color: #3b82f6; text-decoration: none;">
                        ${data.customer.name} - ${doc.id}
                    </a>
                </div>`;
            }
        });
        
        Swal.fire({
            icon: 'info',
            title: 'اختر طالب',
            html: `<div style="text-align: right; direction: rtl;">
                <p>المعرف المطلوب غير موجود</p>
                <hr style="margin: 20px 0;">
                <strong>طلاب متاحين:</strong>
                ${links}
            </div>`,
            confirmButtonText: 'حسناً'
        });
    } finally {
        hideLoading();
    }
}

// ==================== التبديل بين التبويبات ====================
function switchTab(tabName) {
    // إزالة الحالة النشطة
    document.querySelectorAll('.tab-button').forEach(btn => {
        btn.classList.remove('active');
    });
    document.querySelectorAll('.tab-panel').forEach(panel => {
        panel.classList.remove('active');
    });
    
    // إضافة الحالة النشطة
    document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
    document.getElementById(tabName + 'Tab').classList.add('active');
    
    currentTab = tabName;
    
    // تحميل محتوى التبويب
    loadTabContent(tabName);
}

// ==================== تحميل محتوى التبويبات ====================
function loadTabContent(tabName) {
    switch(tabName) {
        case 'basic':
            loadBasicInfoTab();

        case 'courses':
            loadCoursesTab();
            break;
        case 'points':

            break;
        case 'financial':
            loadFinancialTab();
            break;
    }
}

const UserStructure = {
    generateUniqueSlug: function(name) {
        const timestamp = Date.now();
        const random = Math.floor(Math.random() * 1000);
        const namePart = name ? name.toLowerCase().replace(/[^a-z0-9]/g, '').substring(0, 10) : 'user';
        return `${namePart}-${timestamp}-${random}`;
    },
    
    generateStrongPassword: function() {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%';
        let password = '';
        for (let i = 0; i < 12; i++) {
            password += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return password;
    },
    
    createNewUser: function(student) {
        return {
            id: '',
            personalInfo: {
                name: student.customer?.name || '',
                email: student.customer?.email || '',
                whatsapp: student.customer?.whatsapp || '',

// إضافة دالة addDualPoints
async function addDualPoints(userId, amount, reason, description) {
    try {
        const userRef = db.collection('users').doc(userId);
        const userDoc = await userRef.get();
        
        if (!userDoc.exists) return false;
        
        const userData = userDoc.data();
        const currentJourneyBalance = userData.journeyPoints?.balance || 0;
        const currentWalletBalance = userData.walletPoints?.balance || 0;
        
        await userRef.update({
            'journeyPoints.balance': currentJourneyBalance + amount,
            'journeyPoints.lifetime': (userData.journeyPoints?.lifetime || 0) + amount,
            'journeyPoints.lastUpdated': new Date().toISOString(),
            'journeyPoints.history': firebase.firestore.FieldValue.arrayUnion({
                amount: amount,
                reason: reason,
                description: description,
                timestamp: new Date().toISOString()
            }),
            
            'walletPoints.balance': currentWalletBalance + amount,
            'walletPoints.lifetime': (userData.walletPoints?.lifetime || 0) + amount,
            'walletPoints.lastUpdated': new Date().toISOString(),
            'walletPoints.history': firebase.firestore.FieldValue.arrayUnion({
                amount: amount,
                reason: reason,
                description: description,
                timestamp: new Date().toISOString()
            })
        });
        
        return true;
    } catch (error) {
        console.error('خطأ في إضافة النقاط:', error);
        return false;
    }
}

                    ${formData.assignCourseNow && student.courseName ? `
                        <div style="margin-top: 15px; padding: 15px; background: #FEF3C7; border-radius: 10px;">
                            <p style="color: #92400E; margin: 0;">
                                <i class="fas fa-info-circle"></i> 
                                سيتم الآن تخصيص الدورة للطالب...
                            </p>
                        </div>
                    ` : ''}
                </div>
            `,
            confirmButtonText: 'حسناً',
            confirmButtonColor: '#10B981'
        });
        
        // تخصيص الدورة إذا طُلب
        if (formData.assignCourseNow && student.courseName) {
            await assignCourseToStudent(studentId);
        }
        
        // تحديث العرض
        filterByTab(currentFilter || 'all');
        updateStatistics();
        
    } catch (error) {
        console.error('خطأ في إنشاء الحساب:', error);
        Swal.fire({
            icon: 'error',
            title: 'خطأ!',
            text: error.message || 'حدث خطأ في إنشاء الحساب',
            confirmButtonColor: '#EF4444'
        });
    }
}

window.createAccount = createAccount;
    </script>
</body>
</html>
