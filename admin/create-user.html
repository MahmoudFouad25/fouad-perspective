<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المستخدم - منظور الفؤاد</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        /* ==================== متغيرات الألوان ==================== */
        :root {
            /* الألوان الأساسية */
            --primary-bg: #1a2332;
            --secondary-bg: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            
            /* ألوان التفاعل */
            --primary-blue: #3b82f6;
            --primary-green: #10b981;
            --accent-orange: #f59e0b;
            --danger-red: #ef4444;
            --gold-accent: #fbbf24;
            
            /* ألوان النصوص */
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            
            /* تأثيرات */
            --glow-blue: 0 0 20px rgba(59, 130, 246, 0.3);
            --glow-green: 0 0 20px rgba(16, 185, 129, 0.3);
            --glow-gold: 0 0 20px rgba(251, 191, 36, 0.3);
            
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --border-radius: 16px;
        }

        /* ==================== إعدادات عامة ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, var(--primary-bg) 0%, var(--secondary-bg) 100%);
            min-height: 100vh;
            color: var(--text-primary);
            direction: rtl;
        }

        /* ==================== شاشة التحميل ==================== */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }

        .loading-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .loading-content {
            text-align: center;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--primary-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
            box-shadow: var(--glow-blue);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        /* ==================== الهيدر ==================== */
        .main-header {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .back-button {
            background: var(--secondary-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            transition: var(--transition);
        }

        .back-button:hover {
            background: var(--primary-blue);
            color: var(--text-primary);
            box-shadow: var(--glow-blue);
            transform: translateY(-2px);
        }

        .page-title {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .title-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-green));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }

        /* ==================== شريط التقدم المتطور ==================== */
        .progress-container {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        .progress-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.1), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .progress-bar {
            height: 6px;
            background: var(--secondary-bg);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 30px;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-blue), var(--primary-green), var(--gold-accent));
            border-radius: 3px;
            width: 20%;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--glow-blue);
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100px;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            animation: progress-shine 2s infinite;
        }

        @keyframes progress-shine {
            0% { transform: translateX(-100px); }
            100% { transform: translateX(100px); }
        }

        .steps-container {
            display: flex;
            justify-content: space-between;
            position: relative;
        }

        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: var(--transition);
            opacity: 0.5;
            position: relative;
        }

        .step.active {
            opacity: 1;
        }

        .step-icon {
            width: 50px;
            height: 50px;
            background: var(--secondary-bg);
            border: 2px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--text-muted);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .step.active .step-icon {
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-green));
            border-color: var(--primary-blue);
            color: white;
            box-shadow: var(--glow-blue);
            transform: scale(1.1);
        }

        .step-icon::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: rotate(45deg);
            transition: var(--transition);
        }

        .step.active .step-icon::before {
            animation: icon-shine 2s infinite;
        }

        @keyframes icon-shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .step-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            text-align: center;
        }

        .step.active .step-label {
            color: var(--text-primary);
        }

        /* ==================== المحتوى الرئيسي ==================== */
        .main-content {
            padding: 40px 30px;
            min-height: calc(100vh - 200px);
        }

        .content-container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .content-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--primary-blue), var(--primary-green), var(--gold-accent));
        }

        /* ==================== التبويبات المتطورة ==================== */
        .tabs-navigation {
            display: flex;
            background: var(--secondary-bg);
            border-bottom: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        .tabs-navigation::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            height: 2px;
            width: 20%;
            background: linear-gradient(90deg, var(--primary-blue), var(--primary-green));
            transition: transform 0.3s ease;
            transform: translateX(0);
        }

        .tab-button {
            flex: 1;
            background: none;
            border: none;
            padding: 20px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .tab-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, transparent, rgba(59, 130, 246, 0.1), transparent);
            opacity: 0;
            transition: var(--transition);
        }

        .tab-button:hover::before {
            opacity: 1;
        }

        .tab-button.active {
            color: var(--text-primary);
            background: var(--card-bg);
        }

        .tab-button.active::before {
            opacity: 1;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(16, 185, 129, 0.1));
        }

        .tab-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: var(--transition);
        }

        .tab-button.active .tab-icon {
            color: var(--primary-blue);
            transform: scale(1.1);
        }

        /* ==================== محتوى التبويبات ==================== */
        .tabs-content {
            padding: 40px;
            min-height: 400px;
        }

        .tab-panel {
            display: none;
            animation: fadeInUp 0.5s ease;
        }

        .tab-panel.active {
            display: block;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .panel-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .panel-title {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
        }

        .panel-description {
            font-size: 16px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .panel-content {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            background: var(--secondary-bg);
            border: 2px dashed var(--border-color);
            border-radius: var(--border-radius);
            position: relative;
            overflow: hidden;
        }

        .panel-content::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, transparent 70%);
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(0.8); opacity: 0.3; }
            50% { transform: scale(1.2); opacity: 0.1; }
        }

        .empty-state {
            text-align: center;
            z-index: 1;
        }

        .empty-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-green));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 40px;
            color: white;
            box-shadow: var(--glow-blue);
        }

        .empty-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .empty-description {
            font-size: 16px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* ==================== أزرار الإجراءات ==================== */
        .actions-bar {
            padding: 30px 40px;
            background: var(--secondary-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .action-button {
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .action-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: var(--transition);
        }

        .action-button:hover::before {
            left: 100%;
        }

        .btn-secondary {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .btn-secondary:hover {
            background: var(--secondary-bg);
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-green));
            color: white;
            box-shadow: var(--glow-blue);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.4);
        }

        /* ==================== Footer ==================== */
        .main-footer {
            text-align: center;
            padding: 30px;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* ==================== الاستجابة للشاشات الصغيرة ==================== */
        @media (max-width: 768px) {
            .header-container {
                padding: 0 20px;
                flex-direction: column;
                gap: 20px;
            }

            .page-title {
                font-size: 24px;
            }

            .progress-container {
                padding: 20px;
            }

            .steps-container {
                display: none;
            }

            .main-content {
                padding: 20px;
            }

            .tabs-content {
                padding: 20px;
            }

            .tabs-navigation {
                overflow-x: auto;
                scrollbar-width: none;
                -ms-overflow-style: none;
            }

            .tabs-navigation::-webkit-scrollbar {
                display: none;
            }

            .tab-button {
                min-width: 120px;
            }

            .actions-bar {
                padding: 20px;
                flex-direction: column;
                gap: 15px;
            }

            .action-button {
                width: 100%;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .panel-title {
                font-size: 28px;
            }

            .empty-icon {
                width: 60px;
                height: 60px;
                font-size: 30px;
            }

            .empty-title {
                font-size: 20px;
            }
        }

        /* ==================== معلومات المستخدم في الهيدر ==================== */
.header-left {
    display: flex;
    align-items: center;
    gap: 20px;
}

.user-badge {
    background: linear-gradient(135deg, var(--card-bg), var(--secondary-bg));
    border: 1px solid var(--border-color);
    padding: 10px 20px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 15px;
}

.user-name {
    font-weight: 600;
    color: var(--text-primary);
    font-size: 16px;
}

.user-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    color: var(--primary-green);
}

.user-status i {
    font-size: 8px;
}

/* ==================== بطاقات المعلومات ==================== */
.info-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: var(--border-radius);
    padding: 25px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
}

.info-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--primary-blue), var(--primary-green));
}

.info-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.info-card-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 10px;
}

.info-card-icon {
    width: 35px;
    height: 35px;
    background: linear-gradient(135deg, var(--primary-blue), var(--primary-green));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
}

.info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

.info-item {
    background: var(--secondary-bg);
    padding: 15px;
    border-radius: 10px;
    border: 1px solid var(--border-color);
}

.info-label {
    color: var(--text-secondary);
    font-size: 13px;
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 5px;
}

.info-value {
    color: var(--text-primary);
    font-size: 16px;
    font-weight: 600;
}

/* ==================== أزرار الإجراءات السريعة ==================== */
.quick-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.quick-action-btn {
    padding: 8px 16px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: var(--transition);
}

.btn-create-account {
    background: linear-gradient(135deg, var(--primary-green), #059669);
    color: white;
}

.btn-create-account:hover {
    transform: translateY(-2px);
    box-shadow: var(--glow-green);
}

.btn-assign-course {
    background: linear-gradient(135deg, var(--primary-blue), #2563eb);
    color: white;
}

.btn-assign-course:hover {
    transform: translateY(-2px);
    box-shadow: var(--glow-blue);
}

.btn-manage-points {
    background: linear-gradient(135deg, var(--gold-accent), var(--accent-orange));
    color: white;
}

.btn-manage-points:hover {
    transform: translateY(-2px);
    box-shadow: var(--glow-gold);
}
    </style>
</head>

<body>
    <!-- شاشة التحميل -->
    <div id="loadingScreen" class="loading-overlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <div class="loading-text">جاري التحميل...</div>
        </div>
    </div>

    <!-- الهيدر الرئيسي -->
    <header class="main-header">
        <div class="header-container">
            <div class="header-right">
                <button class="back-button" onclick="goBack()">
                    <i class="fas fa-arrow-right"></i>
                    <span>رجوع للحجوزات</span>
                </button>
                <h1 class="page-title">
                    <div class="title-icon">
                        <i class="fas fa-user-cog"></i>
                    </div>
                    <span id="pageTitle">إدارة بيانات العميل</span>
                </h1>
            </div>
            
            <!-- معلومات العميل السريعة -->
            <div class="header-left" id="quickUserInfo" style="display: none;">
                <div class="user-badge">
                    <span class="user-name" id="headerUserName">--</span>
                    <span class="user-status" id="headerUserStatus">
                        <i class="fas fa-circle"></i> نشط
                    </span>
                </div>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="main-content">
        <div class="content-container">
            <!-- التبويبات -->
            <div class="tabs-navigation">
                <button class="tab-button active" data-tab="basic" onclick="switchTab('basic')">
                    <div class="tab-icon">
                        <i class="fas fa-user"></i>
                    </div>
                    <span>البيانات الأساسية</span>
                </button>
                <button class="tab-button" data-tab="account" onclick="switchTab('account')">
                    <div class="tab-icon">
                        <i class="fas fa-key"></i>
                    </div>
                    <span>إنشاء الحساب</span>
                </button>
                <button class="tab-button" data-tab="courses" onclick="switchTab('courses')">
                    <div class="tab-icon">
                        <i class="fas fa-graduation-cap"></i>
                    </div>
                    <span>الدورات</span>
                </button>
                <button class="tab-button" data-tab="points" onclick="switchTab('points')">
                    <div class="tab-icon">
                        <i class="fas fa-star"></i>
                    </div>
                    <span>النقاط</span>
                </button>
                <button class="tab-button" data-tab="financial" onclick="switchTab('financial')">
                    <div class="tab-icon">
                        <i class="fas fa-wallet"></i>
                    </div>
                    <span>المالية</span>
                </button>
            </div>

            <!-- محتوى التبويبات -->
            <div class="tabs-content">
                <!-- تبويب البيانات الأساسية -->
                <div class="tab-panel active" id="basicTab">
                    <!-- سيتم إضافة المحتوى هنا -->
                </div>

                <!-- تبويب إنشاء الحساب -->
                <div class="tab-panel" id="accountTab">
                    <!-- سيتم إضافة المحتوى هنا -->
                </div>

                <!-- تبويب الدورات -->

    <script>
       // ==================== متغيرات عامة ====================
let currentTab = 'basic';
let currentStudentId = null;
let currentStudentData = null;

// ==================== تهيئة الصفحة ====================
document.addEventListener('DOMContentLoaded', async function() {
    // استخراج معرف الطالب من URL
    const urlParams = new URLSearchParams(window.location.search);
    currentStudentId = urlParams.get('studentId');
    
    if (!currentStudentId) {
        Swal.fire({
            icon: 'error',
            title: 'خطأ',
            text: 'لم يتم تحديد العميل',
            confirmButtonText: 'العودة للحجوزات'
        }).then(() => {
            window.location.href = 'manage-individual-bookings.html';
        });
        return;
    }
    
    // تحميل بيانات الطالب
    await loadStudentData();
    
    // إخفاء شاشة التحميل
    hideLoading();
});

// ==================== تحميل بيانات الطالب ====================
async function loadStudentData() {
    try {
        showLoading();
        
        // جلب بيانات الطالب من Firebase
        const studentDoc = await db.collection('individualStudents').doc(currentStudentId).get();
        
        if (!studentDoc.exists) {
            throw new Error('لم يتم العثور على بيانات العميل');
        }
        
        currentStudentData = {
            id: studentDoc.id,
            ...studentDoc.data()
        };
        
        // تحديث معلومات الهيدر
        updateHeaderInfo();
        
        // تحميل محتوى التبويب الحالي
        loadTabContent(currentTab);
        
    } catch (error) {
        console.error('خطأ في تحميل البيانات:', error);
        Swal.fire({
            icon: 'error',
            title: 'خطأ في التحميل',
            text: error.message || 'حدث خطأ في تحميل بيانات العميل'
        });
    } finally {
        hideLoading();
    }
}

// ==================== تحديث معلومات الهيدر ====================
function updateHeaderInfo() {
    if (!currentStudentData) return;
    
    const quickInfo = document.getElementById('quickUserInfo');
    const userName = document.getElementById('headerUserName');
    const userStatus = document.getElementById('headerUserStatus');
    
    // عرض معلومات المستخدم
    quickInfo.style.display = 'flex';
    userName.textContent = currentStudentData.customer?.name || 'غير محدد';
    
    // تحديد حالة الحساب
    if (currentStudentData.accountCreated) {
        userStatus.innerHTML = '<i class="fas fa-circle"></i> حساب نشط';
        userStatus.style.color = '#10b981';
    } else {
        userStatus.innerHTML = '<i class="fas fa-circle"></i> بدون حساب';
        userStatus.style.color = '#f59e0b';
    }
}

// ==================== التبديل بين التبويبات ====================
function switchTab(tabName) {
    // إزالة الحالة النشطة
    document.querySelectorAll('.tab-button').forEach(btn => {
        btn.classList.remove('active');
    });
    document.querySelectorAll('.tab-panel').forEach(panel => {
        panel.classList.remove('active');
    });
    
    // إضافة الحالة النشطة
    document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
    document.getElementById(tabName + 'Tab').classList.add('active');
    
    currentTab = tabName;
    
    // تحميل محتوى التبويب
    loadTabContent(tabName);
}

// ==================== تحميل محتوى التبويبات ====================
function loadTabContent(tabName) {
    switch(tabName) {
        case 'basic':
            loadBasicInfoTab();
            break;
        case 'account':
            loadAccountTab();
            break;
        case 'courses':
            loadCoursesTab();
            break;
        case 'points':
            loadPointsTab();
            break;
        case 'financial':
            loadFinancialTab();
            break;
    }
}

// ==================== وظائف المساعدة ====================
function showLoading() {
    document.getElementById('loadingScreen').classList.add('active');
}

function hideLoading() {
    document.getElementById('loadingScreen').classList.remove('active');
}

function goBack() {
    if (confirm('هل تريد العودة لصفحة إدارة الحجوزات؟')) {
        window.location.href = 'manage-individual-bookings.html';
    }
}
