<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>مدة الكورسات — منظور الفؤاد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/fouad-ui.css">
<script src="../js/fouad-ui.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="../js/admin-guard.js"></script>
<script src="../js/student-setup.js"></script>
<style>
/* مدة الكورسات: إعداد واحد لكل كورس، بيتحفظ أول ما يتغيّر */
html{direction:rtl}
body.fu{margin:0;min-height:100vh}
[hidden]{display:none!important}
.wrap{max-width:860px;margin:0 auto;padding:26px 20px 90px}
.ph h1{margin:0;font-size:27px;font-weight:700;letter-spacing:-.015em}
.ph p{margin:6px 0 0;color:var(--fu-muted);font-size:14.5px;max-width:640px}
.sf{background:var(--fu-surface);border:1px solid var(--fu-line);border-radius:16px;margin-top:20px;overflow:hidden}
.def{display:flex;align-items:center;gap:16px;padding:16px 20px;flex-wrap:wrap}
.def .t{flex:1;min-width:220px}
.def b{display:block;font-size:15px;font-weight:700}
.def small{display:block;color:var(--fu-muted);font-size:13px;margin-top:2px}
select{font:600 14px var(--fu-font);padding:8px 12px;border:1px solid var(--fu-line-2);border-radius:9px;background:var(--fu-surface);color:var(--fu-ink);min-width:150px;cursor:pointer}
select:focus{outline:2px solid var(--fu-primary);outline-offset:1px}
select.set{border-color:var(--fu-primary);background:var(--fu-primary-soft)}
.lh{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--fu-line);background:var(--fu-paper)}
.lh h2{margin:0;font-size:15px;font-weight:700;flex:1}
.lh input{font:14px var(--fu-font);padding:7px 11px;border:1px solid var(--fu-line-2);border-radius:9px;background:var(--fu-surface);color:var(--fu-ink);width:220px;max-width:100%}
.r{display:flex;align-items:center;gap:14px;padding:12px 20px;border-top:1px solid var(--fu-line)}
.r:first-of-type{border-top:0}
.r .t{flex:1;min-width:0}
.r b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r small{display:block;font-size:12.5px;color:var(--fu-muted)}
.r.off b{color:var(--fu-muted)}
.src{font-size:12px;font-weight:600;color:var(--fu-muted);white-space:nowrap;min-width:70px;text-align:end}
.src.set{color:var(--fu-primary)}
.more{padding:12px 20px;border-top:1px solid var(--fu-line);display:flex;justify-content:center}
.lnk{border:0;background:none;color:var(--fu-primary);font:600 13.5px var(--fu-font);cursor:pointer;padding:4px 6px}
.hist .it{display:flex;gap:10px;padding:10px 20px;border-top:1px solid var(--fu-line);font-size:13.5px}
.hist .it:first-of-type{border-top:0}
.hist .it span{color:var(--fu-muted);font-size:12.5px;white-space:nowrap}
.empty{padding:26px 20px;color:var(--fu-muted);text-align:center;font-size:14px}
.sk{height:13px;border-radius:6px;margin:8px 0;background:linear-gradient(90deg,var(--fu-sunken),var(--fu-paper),var(--fu-sunken));background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.note{padding:14px 16px;border-radius:12px;background:var(--fu-danger-soft);color:var(--fu-danger);font-size:14px;margin-top:20px}
@media (max-width:560px){
  .wrap{padding:18px 14px 70px}
  .r{flex-wrap:wrap}
  .r .t{flex-basis:100%}
  .src{text-align:start}
  .lh{flex-wrap:wrap}.lh input{width:100%}
}
</style>
</head>
<body class="fu" data-fu-nav="bookings" data-fu-dark="on">
<main class="wrap">
  <header class="ph">
    <h1>مدة الكورسات</h1>
    <p>المدة اللي الطالب بياخدها لما الكورس يتخصصله من «تجهيز الطلاب». التغيير بيتحفظ على طول، وبيمشي على اللي هيتجهّزوا بعد كده بس. الاشتراكات الموجودة بتتمدّ من ملف العميل.</p>
  </header>

  <section class="sf" aria-label="المدة الافتراضية">
    <div class="def">
      <div class="t"><b>أي كورس مالوش مدة هنا</b><small>بياخد المدة دي.</small></div>
      <select id="defSel" aria-label="المدة الافتراضية" disabled></select>
    </div>
  </section>

  <section class="sf" aria-label="الكورسات">
    <div class="lh"><h2 id="lt">الكورسات</h2><input id="q" type="search" placeholder="دوّر على كورس…" aria-label="دوّر على كورس" autocomplete="off"></div>
    <div id="list"><div style="padding:14px 20px"><div class="sk" style="width:60%"></div><div class="sk" style="width:40%"></div><div class="sk" style="width:70%"></div></div></div>
  </section>

  <section class="sf hist" aria-label="آخر التغييرات">
    <div class="lh"><h2>آخر التغييرات</h2></div>
    <div id="hist"><div class="empty">…</div></div>
  </section>
</main>
<script>
(function () {
  'use strict';
  var S = window.StudentSetup, db, FV, ADMIN = 'admin';
  var $ = function (id) { return document.getElementById(id); };
  var E = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var REF, HIST;
  var st = { months: {}, defaultMonths: 6, courses: [], q: '', showOff: false, hist: [] };
  var CH = S.MONTH_CHOICES;
  function label(v) { var c = CH.find(function (x) { return x[0] === String(v); }); return c ? c[1] : (v + ' شهر'); }
  function opts(sel, withDefault) {
    return (withDefault ? '<option value="">زي الافتراضي (' + E(label(st.defaultMonths)) + ')</option>' : '') +
      CH.map(function (c) { return '<option value="' + c[0] + '"' + (String(sel) === c[0] ? ' selected' : '') + '>' + E(c[1]) + '</option>'; }).join('');
  }
  function day(t) { var d = t && t.toDate ? t.toDate() : new Date(t); return isNaN(d) ? '' : d.toLocaleDateString('ar-EG', { day: 'numeric', month: 'short' }) + ' · ' + d.toLocaleTimeString('ar-EG', { hour: 'numeric', minute: '2-digit' }); }

  function render() {
    var ds = $('defSel'); ds.innerHTML = opts(st.defaultMonths, false); ds.disabled = false;
    var q = st.q.toLowerCase();
    var on = st.courses.filter(function (c) { return !c.off; }), off = st.courses.filter(function (c) { return c.off; });
    var show = (st.showOff ? on.concat(off) : on).filter(function (c) { return !q || c.title.toLowerCase().indexOf(q) > -1; });
    var setN = st.courses.filter(function (c) { return S.validMonths(st.months[c.id]); }).length;
    $('lt').textContent = 'الكورسات (' + on.length.toLocaleString('ar-EG') + ')' + (setN ? ' · ' + setN.toLocaleString('ar-EG') + ' ليهم مدة خاصة' : '');
    $('list').innerHTML = (show.length ? show.map(function (c) {
      var own = S.validMonths(st.months[c.id]), onCourse = S.validMonths(c.accessMonths);
      var src = own ? '<span class="src set">متحددة هنا</span>' : onCourse ? '<span class="src">من إعداد الكورس</span>' : '<span class="src">افتراضي</span>';
      return '<div class="r' + (c.off ? ' off' : '') + '"><div class="t"><b>' + E(c.title) + '</b><small>' + (c.off ? 'الكورس مقفول' : c.price ? c.price.toLocaleString('ar-EG') + ' ج.م' : '') + '</small></div>' + src +
        '<select data-c="' + E(c.id) + '" class="' + (own ? 'set' : '') + '" aria-label="مدة ' + E(c.title) + '">' + opts(own || '', true).replace('زي الافتراضي (' + E(label(st.defaultMonths)) + ')', onCourse && !own ? 'زي إعداد الكورس (' + E(label(onCourse)) + ')' : 'زي الافتراضي (' + E(label(st.defaultMonths)) + ')') + '</select></div>';
    }).join('') : '<div class="empty">' + (q ? 'مفيش كورس بالاسم ده' : 'مفيش كورسات') + '</div>') +
      (off.length ? '<div class="more"><button type="button" class="lnk" id="offT">' + (st.showOff ? 'اخفي الكورسات المقفولة' : 'اعرض الكورسات المقفولة (' + off.length + ')') + '</button></div>' : '');
    renderHist();
  }
  function renderHist() {
    $('hist').innerHTML = st.hist.length ? st.hist.map(function (h) { return '<div class="it"><div style="flex:1">' + E(h.text) + '</div><span>' + E(day(h.at)) + '</span></div>'; }).join('') : '<div class="empty">لسه مفيش تغييرات.</div>';
  }
  function titleOf(id) { var c = st.courses.find(function (x) { return x.id === id; }); return c ? c.title : id; }

  function log(text) {
    var item = { text: text, at: FV.serverTimestamp(), by: ADMIN };
    st.hist.unshift({ text: text, at: new Date() }); st.hist = st.hist.slice(0, 10); renderHist();
    return HIST.add(item).catch(function (e) { console.warn('السجل', e && e.message); });
  }
  function save(courseId, v, quiet) {
    var prev = st.months[courseId], path = new firebase.firestore.FieldPath('months', courseId);
    var p = v ? REF.set({ months: (function () { var o = {}; o[courseId] = v === 'unlimited' ? 'unlimited' : Number(v); return o; })(), updatedAt: FV.serverTimestamp(), updatedBy: ADMIN }, { merge: true })
      : REF.update(path, FV.delete(), 'updatedAt', FV.serverTimestamp(), 'updatedBy', ADMIN);
    return p.then(function () {
      if (v) st.months[courseId] = v === 'unlimited' ? 'unlimited' : Number(v); else delete st.months[courseId];
      var text = titleOf(courseId) + ': ' + (v ? label(v) : 'رجع للافتراضي');
      log(text); render();
      if (!quiet) FU.toast(text, { undo: function () { save(courseId, prev ? String(prev) : '', true).then(function () { FU.toast('رجع زي ما كان'); }); } });
    }).catch(function (e) { FU.toast('ما اتحفظش: ' + (e.code === 'permission-denied' ? 'القواعد رفضت' : e.message), { type: 'bad' }); render(); });
  }
  function saveDefault(v) {
    var prev = st.defaultMonths;
    return REF.set({ defaultMonths: v === 'unlimited' ? 'unlimited' : Number(v), updatedAt: FV.serverTimestamp(), updatedBy: ADMIN }, { merge: true }).then(function () {
      st.defaultMonths = v === 'unlimited' ? 'unlimited' : Number(v);
      log('المدة الافتراضية: ' + label(v)); render();
      FU.toast('المدة الافتراضية بقت ' + label(v), { undo: function () { saveDefault(String(prev)); } });
    }).catch(function (e) { FU.toast('ما اتحفظش: ' + e.message, { type: 'bad' }); render(); });
  }

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'defSel') saveDefault(t.value);
    else if (t.dataset && t.dataset.c) save(t.dataset.c, t.value);
  });
  document.addEventListener('click', function (e) { if (e.target.id === 'offT') { st.showOff = !st.showOff; render(); } });
  $('q').addEventListener('input', function (e) { st.q = e.target.value.trim(); render(); });

  AdminGuard.ready().then(function (ctx) {
    db = ctx.db; FV = firebase.firestore.FieldValue; ADMIN = (ctx.user && ctx.user.email) || 'admin';
    REF = db.collection('app_settings').doc('course_durations'); HIST = REF.collection('history');
    return Promise.all([
      REF.get(),
      db.collection('courses').get(),
      HIST.orderBy('at', 'desc').limit(10).get().catch(function () { return { docs: [] }; })
    ]).then(function (r) {
      var x = (r[0].exists && r[0].data()) || {};
      st.months = x.months || {}; st.defaultMonths = S.validMonths(x.defaultMonths) || 6;
      r[1].forEach(function (d) { var c = d.data() || {}; st.courses.push({ id: d.id, title: c.title || d.id, price: Number(c.pricing && c.pricing.basePrice) || 0, off: c.isActive === false, accessMonths: c.accessMonths || c.defaultAccessMonths || null }); });
      st.courses.sort(function (a, b) { return a.title.localeCompare(b.title, 'ar'); });
      st.hist = r[2].docs.map(function (d) { var h = d.data(); return { text: h.text, at: h.at }; });
      render();
    });
  }).catch(function (e) {
    console.error(e);
    document.querySelector('.wrap').insertAdjacentHTML('beforeend', '<div class="note">مقدرتش أقرا الإعدادات: ' + E(e.message) + '</div>');
  });
})();
</script>
</body>
</html>
