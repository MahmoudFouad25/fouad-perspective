<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الأسئلة - لوحة التحكم</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(139, 92, 246, 0.3);
        }
        
        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(99, 102, 241, 0.1));
            padding: 25px;
            border-radius: 15px;
            border: 2px solid rgba(139, 92, 246, 0.3);
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
        }
        
        .stat-info h3 {
            font-size: 2rem;
            margin-bottom: 5px;
        }
        
        .stat-info p {
            color: #94a3b8;
            font-size: 0.95rem;
        }
        
        .filters {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.8));
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            border: 2px solid rgba(139, 92, 246, 0.2);
        }
        
        .filters h3 {
            margin-bottom: 20px;
            color: #a78bfa;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .filter-item label {
            display: block;
            color: #c4b5fd;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .filter-item select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid rgba(139, 92, 246, 0.3);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 1rem;
            cursor: pointer;
        }
        
        .filter-item select option {
            background: #1e293b;
            color: white;
        }
        
        .questions-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .question-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.8));
            padding: 25px;
            border-radius: 15px;
            border: 2px solid rgba(139, 92, 246, 0.3);
            transition: all 0.3s ease;
        }
        
        .question-card:hover {
            border-color: rgba(139, 92, 246, 0.6);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.2);
        }
        
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
        
        .user-details h4 {
            color: #c4b5fd;
            margin-bottom: 5px;
        }
        
        .user-details p {
            color: #94a3b8;
            font-size: 0.9rem;
        }
        
        .badges {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .badge {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            white-space: nowrap;
        }
        
        .badge-pending { background: #f59e0b; color: white; }
        .badge-answered { background: #10b981; color: white; }
        .badge-private { background: #ef4444; color: white; }
        .badge-shared { background: #6366f1; color: white; }
        
        .course-info {
            background: rgba(139, 92, 246, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-right: 4px solid #8b5cf6;
        }
        
        .course-info p {
            color: #e9d5ff;
            margin: 5px 0;
            font-size: 0.95rem;
        }
        
        .course-info strong {
            color: #c4b5fd;
        }
        
        .question-text {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .question-text p {
            color: #e9d5ff;
            line-height: 1.7;
            font-size: 1.05rem;
        }
        
        .answer-section {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(5, 150, 105, 0.1));
            padding: 20px;
            border-radius: 10px;
            border-right: 4px solid #10b981;
            margin-bottom: 20px;
        }
        
        .answer-section h4 {
            color: #10b981;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .answer-section p {
            color: #d1fae5;
            line-height: 1.7;
            font-size: 1.05rem;
        }
        
        .answer-form textarea {
            width: 100%;
            min-height: 120px;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid rgba(139, 92, 246, 0.3);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 1rem;
            resize: vertical;
            font-family: inherit;
            margin-bottom: 15px;
        }
        
        .answer-form textarea:focus {
            outline: none;
            border-color: #8b5cf6;
        }
        
        .points-section {
            background: rgba(251, 191, 36, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        
        .points-section label {
            display: block;
            color: #fbbf24;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .points-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }
        
        .points-input {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .points-input label {
            color: #c4b5fd;
            font-size: 0.9rem;
            margin: 0;
        }
        
        .points-input input {
            padding: 10px;
            border-radius: 8px;
            border: 2px solid rgba(139, 92, 246, 0.3);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 1rem;
        }
        
        .pillar-select {
            margin-bottom: 15px;
        }
        
        .pillar-select label {
            display: block;
            color: #c4b5fd;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .pillar-select select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid rgba(139, 92, 246, 0.3);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 1rem;
        }
        
        .btn {
            padding: 12px 25px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            color: white;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }
        
        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.6);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }
        
        .btn-success:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6);
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }
        
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        
        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }
        
        .loading i {
            font-size: 4rem;
            margin-bottom: 20px;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.5rem;
            }
            
            .stats {
                grid-template-columns: 1fr;
            }
            
            .filter-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>
                <i class="fas fa-question-circle"></i>
                إدارة الأسئلة
            </h1>
            <p>إدارة ومتابعة أسئلة الطلاب والرد عليها</p>
        </div>
        
        <!-- Statistics -->
        <div class="stats">
            <div class="stat-card">
                <div class="stat-icon" style="background: linear-gradient(135deg, #f59e0b, #d97706);">
                    ⏳
                </div>
                <div class="stat-info">
                    <h3 id="pendingCount">0</h3>
                    <p>في الانتظار</p>
                </div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon" style="background: linear-gradient(135deg, #10b981, #059669);">
                    ✅
                </div>
                <div class="stat-info">
                    <h3 id="answeredCount">0</h3>
                    <p>تم الرد عليها</p>
                </div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon" style="background: linear-gradient(135deg, #8b5cf6, #6366f1);">
                    📊
                </div>
                <div class="stat-info">
                    <h3 id="totalCount">0</h3>
                    <p>إجمالي الأسئلة</p>
                </div>
            </div>
        </div>
        
        <!-- Filters -->
        <div class="filters">
            <h3>
                <i class="fas fa-filter"></i>
                تصفية الأسئلة
            </h3>
            <div class="filter-grid">
                <div class="filter-item">
                    <label>الدورة</label>
                    <select id="filterCourse">
                        <option value="">جميع الدورات</option>
                    </select>
                </div>
                
                <div class="filter-item">
                    <label>الدرس</label>
                    <select id="filterLesson">
                        <option value="">جميع الدروس</option>
                    </select>
                </div>
                
                <div class="filter-item">
                    <label>الحالة</label>
                    <select id="filterStatus">
                        <option value="">الكل</option>
                        <option value="pending">في الانتظار</option>
                        <option value="answered">تم الرد</option>
                    </select>
                </div>
                
                <div class="filter-item">
                    <label>نوع السؤال</label>
                    <select id="filterType">
                        <option value="">الكل</option>
                        <option value="private">خاص</option>
                        <option value="shared">مشترك</option>
                    </select>
                </div>
            </div>
        </div>
        
        <!-- Questions List -->
        <div id="questionsContainer" class="questions-container">
            <div class="loading">
                <i class="fas fa-spinner fa-spin"></i>
                <h3>جاري تحميل الأسئلة...</h3>
            </div>
        </div>
    </div>

    <script>
        // Firebase Configuration (استخدم نفس config من موقعك)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "fouad-perspective",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        
        // Global Variables
        let allQuestions = [];
        let filteredQuestions = [];
        
        // Load Questions on Page Load
        document.addEventListener('DOMContentLoaded', function() {
            loadAllQuestions();
            setupFilterListeners();
        });
        
        // Load All Questions
        async function loadAllQuestions() {
            try {
                const snapshot = await db.collection('questions')
                    .orderBy('questionDate', 'desc')
                    .get();
                
                allQuestions = [];
                snapshot.forEach(doc => {
                    allQuestions.push({
                        id: doc.id,
                        ...doc.data()
                    });
                });
                
                filteredQuestions = [...allQuestions];
                updateStats();
                populateFilters();
                displayQuestions();
                
            } catch (error) {
                console.error('❌ خطأ في تحميل الأسئلة:', error);
                showError('حدث خطأ في تحميل الأسئلة');
            }
        }
        
        // Update Statistics
        function updateStats() {
            const pending = allQuestions.filter(q => !q.isAnswered).length;
            const answered = allQuestions.filter(q => q.isAnswered).length;
            
            document.getElementById('pendingCount').textContent = pending;
            document.getElementById('answeredCount').textContent = answered;
            document.getElementById('totalCount').textContent = allQuestions.length;
        }
        
        // Populate Filters
        function populateFilters() {
            // Get unique courses
            const courses = [...new Set(allQuestions.map(q => q.courseName))];
            const courseSelect = document.getElementById('filterCourse');
            courseSelect.innerHTML = '<option value="">جميع الدورات</option>';
            courses.forEach(course => {
                const option = document.createElement('option');
                option.value = course;
                option.textContent = course;
                courseSelect.appendChild(option);
            });
            
            // Get unique lessons
            const lessons = [...new Set(allQuestions.map(q => q.lessonTitle))];
            const lessonSelect = document.getElementById('filterLesson');
            lessonSelect.innerHTML = '<option value="">جميع الدروس</option>';
            lessons.forEach(lesson => {
                const option = document.createElement('option');
                option.value = lesson;
                option.textContent = lesson;
                lessonSelect.appendChild(option);
            });
        }
        
        // Setup Filter Listeners
        function setupFilterListeners() {
            document.getElementById('filterCourse').addEventListener('change', applyFilters);
            document.getElementById('filterLesson').addEventListener('change', applyFilters);
            document.getElementById('filterStatus').addEventListener('change', applyFilters);
            document.getElementById('filterType').addEventListener('change', applyFilters);
        }
        
        // Apply Filters
        function applyFilters() {
            const course = document.getElementById('filterCourse').value;
            const lesson = document.getElementById('filterLesson').value;
            const status = document.getElementById('filterStatus').value;
            const type = document.getElementById('filterType').value;
            
            filteredQuestions = allQuestions.filter(q => {
                if (course && q.courseName !== course) return false;
                if (lesson && q.lessonTitle !== lesson) return false;
                if (status === 'pending' && q.isAnswered) return false;
                if (status === 'answered' && !q.isAnswered) return false;
                if (type === 'private' && q.sharingType !== 'private') return false;
                if (type === 'shared' && q.sharingType === 'private') return false;
                return true;
            });
            
            displayQuestions();
        }
        
        // Display Questions
        function displayQuestions() {
            const container = document.getElementById('questionsContainer');
            
            if (filteredQuestions.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <h3>لا توجد أسئلة</h3>
                        <p>لم يتم العثور على أسئلة تطابق الفلاتر المحددة</p>
                    </div>
                `;
                return;
            }
            
            let html = '';
            
            filteredQuestions.forEach(q => {
                const date = q.questionDate?.toDate();
                const formattedDate = date ? date.toLocaleDateString('ar-EG', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                }) : 'تاريخ غير معروف';
                
                html += `
                    <div class="question-card">
                        <div class="question-header">
                            <div class="user-info">
                                <div class="user-avatar">👤</div>
                                <div class="user-details">
                                    <h4>${q.userName || 'مستخدم'}</h4>
                                    <p>${q.userEmail || ''} • ${formattedDate}</p>
                                </div>
                            </div>
                            <div class="badges">
                                ${q.isAnswered ? 
                                    '<span class="badge badge-answered">✅ تم الرد</span>' : 
                                    '<span class="badge badge-pending">⏳ في الانتظار</span>'
                                }
                                ${q.sharingType === 'private' ?
                                    '<span class="badge badge-private">🔐 خاص</span>' :
                                    '<span class="badge badge-shared">👥 مشترك</span>'
                                }
                            </div>
                        </div>
                        
                        <div class="course-info">
                            <p><strong>📚 الدورة:</strong> ${q.courseName || 'غير معروف'}</p>
                            <p><strong>📖 الدرس:</strong> ${q.lessonTitle || 'غير معروف'}</p>
                            <p><strong>🎥 المحتوى:</strong> ${q.contentTitle || 'غير معروف'}</p>
                        </div>
                        
                        <div class="question-text">
                            <p>${q.question}</p>
                        </div>
                        
                        ${q.isAnswered && q.answer ? `
                            <div class="answer-section">
                                <h4><i class="fas fa-reply"></i> الإجابة:</h4>
                                <p>${q.answer}</p>
                                ${q.pointsAwarded > 0 ? `
                                    <p style="margin-top: 10px; color: #fbbf24;">
                                        🎉 تم منح ${q.pointsAwarded} نقطة ${getPillarEmoji(q.pillarType)}
                                    </p>
                                ` : ''}
                            </div>
                        ` : `
                            <div class="answer-form">
                                <textarea id="answer-${q.id}" placeholder="اكتب إجابتك هنا..."></textarea>
                                
                                <div class="points-section">
                                    <label>💎 منح نقاط للطالب (اختياري)</label>
                                    
                                    <div class="pillar-select">
                                        <label>اختر الركيزة:</label>
                                        <select id="pillar-${q.id}">
                                            <option value="">بدون نقاط</option>
                                            <option value="courage">🔥 الشجاعة</option>
                                            <option value="mirror">🪞 المرآة</option>
                                            <option value="action">👣 العمل</option>
                                            <option value="witness">👁️ الشاهد</option>
                                        </select>
                                    </div>
                                    
                                    <div class="points-input">
                                        <label>عدد النقاط:</label>
                                        <input type="number" id="points-${q.id}" min="0" max="100" value="0" placeholder="0">
                                    </div>
                                </div>
                                
                                <button class="btn btn-success" onclick="submitAnswer('${q.id}')">
                                    <i class="fas fa-paper-plane"></i>
                                    إرسال الإجابة
                                </button>
                            </div>
                        `}
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        // Submit Answer
        async function submitAnswer(questionId) {
            try {
                const answer = document.getElementById(`answer-${questionId}`).value.trim();
                const pillarType = document.getElementById(`pillar-${questionId}`).value;
                const pointsAwarded = parseInt(document.getElementById(`points-${questionId}`).value) || 0;
                
                if (!answer) {
                    Swal.fire({
                        icon: 'warning',
                        title: '⚠️ تنبيه',
                        text: 'من فضلك اكتب الإجابة أولاً',
                        confirmButtonColor: '#8b5cf6'
                    });
                    return;
                }
                
                if (pointsAwarded > 0 && !pillarType) {
                    Swal.fire({
                        icon: 'warning',
                        title: '⚠️ تنبيه',
                        text: 'من فضلك اختر الركيزة لمنح النقاط',
                        confirmButtonColor: '#8b5cf6'
                    });
                    return;
                }
                
                Swal.fire({
                    title: 'جاري الإرسال...',
                    allowOutsideClick: false,
                    didOpen: () => Swal.showLoading()
                });
                
                // Get question data
                const question = allQuestions.find(q => q.id === questionId);
                
                // Update question in Firebase
                await db.collection('questions').doc(questionId).update({
                    answer: answer,
                    isAnswered: true,
                    answerDate: firebase.firestore.FieldValue.serverTimestamp(),
                    pointsAwarded: pointsAwarded,
                    pillarType: pillarType || null,
                    adminId: 'admin' // يمكن تعديله لاحقاً
                });
                
                // Add points to user if awarded
                if (pointsAwarded > 0 && pillarType) {
                    await addPointsToUser(question.userId, pillarType, pointsAwarded, {
                        type: 'question_answer',
                        questionId: questionId,
                        contentId: question.contentId
                    });
                }
                
                Swal.fire({
                    icon: 'success',
                    title: '✅ تم الإرسال!',
                    text: 'تم إرسال الإجابة بنجاح',
                    confirmButtonColor: '#10b981',
                    timer: 2000
                });
                
                // Reload questions
                loadAllQuestions();
                
            } catch (error) {
                console.error('❌ خطأ في إرسال الإجابة:', error);
                Swal.fire({
                    icon: 'error',
                    title: '❌ خطأ',
                    text: 'حدث خطأ أثناء إرسال الإجابة',
                    confirmButtonColor: '#dc2626'
                });
            }
        }
        
        // Add Points to User
        async function addPointsToUser(userId, pillarType, points, metadata) {
            try {
                const userRef = db.collection('users').doc(userId);
                const pillarField = `walletPoints.${pillarType}`;
                
                await userRef.update({
                    [pillarField]: firebase.firestore.FieldValue.increment(points)
                });
                
                // Add to history
                await userRef.collection('pointsHistory').add({
                    pillar: pillarType,
                    points: points,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    ...metadata
                });
                
            } catch (error) {
                console.error('❌ خطأ في إضافة النقاط:', error);
            }
        }
        
        // Get Pillar Emoji
        function getPillarEmoji(pillarType) {
            const emojis = {
                'courage': '🔥',
                'mirror': '🪞',
                'action': '👣',
                'witness': '👁️'
            };
            return emojis[pillarType] || '⭐';
        }
        
        // Show Error
        function showError(message) {
            document.getElementById('questionsContainer').innerHTML = `
                <div class="empty-state" style="color: #ef4444;">
                    <i class="fas fa-exclamation-triangle"></i>
                    <h3>حدث خطأ</h3>
                    <p>${message}</p>
                </div>
            `;
        }
    </script>
</body>
</html>
