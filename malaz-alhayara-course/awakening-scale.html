<html lang="ar" dir="rtl">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* الألوان الأساسية */
            --primary-blue: #3b82f6;
            --primary-blue-dark: #2563eb;
            --success-green: #10b981;
            --golden: #fbbf24;
            --golden-dark: #f59e0b;
            
            /* الخلفيات */
            --primary-bg: #1a2332;
            --secondary-bg: #0f172a;
            --card-bg: #1e293b;
            
            /* النصوص */
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --text-dim: #64748b;
            
            /* التوهجات */
            --glow-blue: 0 0 30px rgba(59, 130, 246, 0.4);
            --glow-green: 0 0 30px rgba(16, 185, 129, 0.4);
            --glow-gold: 0 0 30px rgba(251, 191, 36, 0.5);
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--primary-bg);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* الخلفية الكونية */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at top right, rgba(59, 130, 246, 0.1) 0%, transparent 40%),
                radial-gradient(ellipse at bottom left, rgba(16, 185, 129, 0.08) 0%, transparent 40%),
                radial-gradient(ellipse at center, rgba(251, 191, 36, 0.05) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        /* الـ Header */
        .scale-header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease;
        }

        .scale-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .scale-title {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--primary-blue), var(--success-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .scale-subtitle {
            font-size: 1.2rem;
            color: var(--text-secondary);
            font-weight: 300;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* شريط التقدم */
        .progress-container {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(59, 130, 246, 0.2);
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .progress-title {
            font-size: 1rem;
            color: var(--text-secondary);
        }

        .progress-count {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--golden);
        }

        .progress-bar-bg {
            background: rgba(59, 130, 246, 0.1);
            height: 12px;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-blue), var(--success-green));
            border-radius: 10px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--glow-blue);
            position: relative;
            overflow: hidden;
        }

        .progress-bar-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.3),
                transparent
            );
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* بطاقة البُعد */
        .dimension-card {
            background: linear-gradient(135deg, 
                rgba(30, 41, 59, 0.7) 0%, 
                rgba(30, 41, 59, 0.5) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            opacity: 0;
            transform: translateY(20px);
            animation: slideUp 0.6s ease forwards;
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .dimension-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid rgba(59, 130, 246, 0.2);
        }

        .dimension-icon {
            font-size: 2.5rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .dimension-info {
            flex: 1;
        }

        .dimension-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.3rem;
        }

        .dimension-desc {
            font-size: 0.95rem;
            color: var(--text-secondary);
            font-weight: 300;
        }

        .dimension-score {
            background: rgba(59, 130, 246, 0.2);
            padding: 0.5rem 1rem;
            border-radius: 10px;
            font-weight: 700;
            color: var(--primary-blue);
        }

        /* الأسئلة */
        .question-item {
            margin-bottom: 2rem;
            opacity: 0;
            animation: fadeIn 0.5s ease forwards;
        }

        .question-item:nth-child(1) { animation-delay: 0.1s; }
        .question-item:nth-child(2) { animation-delay: 0.2s; }
        .question-item:nth-child(3) { animation-delay: 0.3s; }
        .question-item:nth-child(4) { animation-delay: 0.4s; }

        .question-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-blue-dark));
            border-radius: 50%;
            font-weight: 700;
            font-size: 0.9rem;
            margin-left: 0.8rem;
            box-shadow: var(--glow-blue);
        }

        .question-text {
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--text-primary);
            margin-bottom: 1rem;
            font-weight: 400;
        }

        /* مقياس الليكرت */
        .likert-scale {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1rem;
            padding: 1rem;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 15px;
        }

        .likert-option {
            flex: 1;
            text-align: center;
        }

        .likert-input {
            display: none;
        }

        .likert-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 1rem 0.5rem;
            border-radius: 12px;
        }

        .likert-circle {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(148, 163, 184, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--text-dim);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .likert-text {
            font-size: 0.85rem;
            color: var(--text-dim);
            transition: all 0.3s ease;
        }

        /* حالة Hover */
        .likert-label:hover .likert-circle {
            border-color: var(--primary-blue);
            transform: scale(1.1);
        }

        .likert-label:hover .likert-text {
            color: var(--primary-blue);
        }

        /* حالة Selected */
        .likert-input:checked + .likert-label .likert-circle {
            background: linear-gradient(135deg, var(--primary-blue), var(--success-green));
            border-color: var(--success-green);
            color: white;
            transform: scale(1.15);
            box-shadow: var(--glow-blue);
        }

        .likert-input:checked + .likert-label .likert-circle::after {
            content: '✓';
            position: absolute;
            font-size: 1.5rem;
            animation: checkmark 0.4s ease;
        }

        @keyframes checkmark {
            0% {
                transform: scale(0) rotate(-45deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .likert-input:checked + .likert-label .likert-text {
            color: var(--success-green);
            font-weight: 700;
        }

        /* زر الحفظ */
        .save-button-container {
            position: sticky;
            bottom: 20px;
            margin-top: 3rem;
            text-align: center;
            z-index: 100;
        }

        .save-button {
            background: linear-gradient(135deg, var(--primary-blue), var(--success-green));
            color: white;
            border: none;
            padding: 1.2rem 3rem;
            border-radius: 50px;
            font-size: 1.3rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 1rem;
        }

        .save-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(59, 130, 246, 0.5);
        }

        .save-button:active {
            transform: translateY(-1px);
        }

        .save-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .save-button .btn-reward {
            background: rgba(255, 255, 255, 0.2);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        /* Responsive */
        /* أنيميشنات إضافية */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideOut {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(100px);
            }
        }

        /* نوع المقياس */
        .scale-type-selector {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .scale-type-title {
            text-align: center;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .scale-type-options {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .scale-type-option {
            flex: 1;
            max-width: 200px;
        }

        .scale-type-input {
            display: none;
        }

        .scale-type-label {
            display: block;
            padding: 1rem;
            background: rgba(59, 130, 246, 0.1);
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .scale-type-label:hover {
            background: rgba(59, 130, 246, 0.2);
            border-color: var(--primary-blue);
            transform: translateY(-2px);
        }

        .scale-type-input:checked + .scale-type-label {
            background: linear-gradient(135deg, var(--primary-blue), var(--success-green));
            border-color: var(--success-green);
            color: white;
            box-shadow: var(--glow-blue);
        }

        .scale-type-icon {
            font-size: 2rem;
            display: block;
            margin-bottom: 0.5rem;
        }

        /* مقارنة القبلي-البعدي */
        .comparison-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(251, 191, 36, 0.3);
        }

        .comparison-title {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 900;
            margin-bottom: 1.5rem;
            color: var(--golden);
        }

        .comparison-stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .comparison-stat {
            text-align: center;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
        }

        .comparison-stat-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .comparison-stat-value {
            font-size: 2rem;
            font-weight: 900;
        }

        .comparison-improvement {
            text-align: center;
            padding: 1.5rem;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(16, 185, 129, 0.1));
            border-radius: 15px;
            border: 2px solid var(--success-green);
        }

        .improvement-text {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--success-green);
        }

        .improvement-icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            animation: bounce 1s ease infinite;
        }
        @media (max-width: 768px) {
            .likert-scale {
                gap: 0.3rem;
                padding: 0.8rem 0.5rem;
            }

            .likert-circle {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }

            .likert-text {
                font-size: 0.75rem;
            }

            .scale-title {
                font-size: 2rem;
            }

            .dimension-card {
                padding: 1.5rem;
            }
        }
        
    </style>
</head>

        function getWeekNumber(date) {
            const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
            const dayNum = d.getUTCDay() || 7;
            d.setUTCDate(d.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        }

        function calculateCurrentWeek(courseStartDate) {
            const start = new Date(courseStartDate);
            const now = new Date();
            
            start.setDate(start.getDate() - start.getDay() + 3);
            
            const diffTime = now - start;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            const weekNumber = Math.floor(diffDays / 7) + 1;
            
            return Math.max(1, Math.min(weekNumber, 4));
        }

        async function addPointsToPillar(pillarKey, points, details) {
            if (!userId) {
                console.error('❌ لا يوجد مستخدم مسجل');
                return;
            }

            try {
                // 1. إضافة النقاط إلى pillarProgress
                const pillarRef = db.collection('users')
                    .doc(userId)
                    .collection('pillarProgress')
                    .doc(currentCourseId);
                
                const pillarDoc = await pillarRef.get();
                let currentPillarPoints = 0;
                
                if (pillarDoc.exists) {
                    const data = pillarDoc.data();
                    currentPillarPoints = data[`${pillarKey}.totalPoints`] || 0;
                }
                
                const newPillarPoints = currentPillarPoints + points;
                
                await pillarRef.set({
                    [`${pillarKey}.totalPoints`]: newPillarPoints,
                    [`${pillarKey}.lastEntry`]: {
                        date: new Date().toISOString(),
                        points: points,
                        source: 'awakening_scale',
                        details: details
                    }
                }, { merge: true });
                
                console.log(`✅ تم إضافة ${points} نقطة لركيزة ${pillarKey}`);
                
                // 2. إضافة النقاط إلى Journey Points
                const userRef = db.collection('users').doc(userId);
                const userDoc = await userRef.get();
                
                let currentJourneyPoints = 0;
                if (userDoc.exists) {
                    const userData = userDoc.data();
                    currentJourneyPoints = userData.journeyPoints?.total || 0;
                }
                
                const newJourneyPoints = currentJourneyPoints + points;
                
                await userRef.set({
                    journeyPoints: {
                        total: newJourneyPoints,
                        lastUpdated: new Date().toISOString()
                    }
                }, { merge: true });
                
                console.log(`✅ تم إضافة ${points} نقطة للرحلة الكلية`);
                
            } catch (error) {
                console.error('❌ خطأ في إضافة النقاط:', error);
                throw error;
            }
        }

        // ============================================

        async function saveScale() {
            if (!userId) {
                showNotification('الرجاء تسجيل الدخول أولاً', 'error');
                return;
            }

            const saveBtn = document.getElementById('saveScaleBtn');
            saveBtn.disabled = true;
            saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحفظ...';

            try {
                // جمع الإجابات
                const answers = {};
                let totalScore = 0;
                const dimensionScores = {};

                scaleDimensions.forEach(dimension => {
                    const dimensionInputs = document.querySelectorAll(
                        `.likert-input[data-dimension="${dimension.id}"]:checked`
                    );
                    
                    const dimensionAnswers = [];
                    let dimensionTotal = 0;

                    dimensionInputs.forEach(input => {
                        const value = parseInt(input.value);
                        dimensionAnswers.push(value);
                        dimensionTotal += value;
                    });

                    answers[dimension.id] = dimensionAnswers;
                    dimensionScores[dimension.id] = dimensionTotal;
                    totalScore += dimensionTotal;
                });

                // التحقق من وجود مقياس سابق هذا الأسبوع
                const docRef = db.collection('users')
                    .doc(userId)
                    .collection('awakening_progress')
                    .doc(currentCourseId);

                const doc = await docRef.get();
                let isFirstTime = true;
                

                if (doc.exists) {
                    const data = doc.data();
                    const weekKey = `week${currentWeekNumber}`;
                    
                    // التحقق من وجود مقياس في history لهذا الأسبوع
                    const history = data[`${weekKey}.scale.history`] || [];
                    const thisWeekEntry = history.find(entry => 
                        getWeekNumber(new Date(entry.date)) === getWeekNumber(new Date())
                    );
                    
                    if (thisWeekEntry) {
                        isFirstTime = false;
                    }
                }

               // حفظ البيانات
                const today = new Date().toISOString().split('T')[0];
                const weekKey = `week${currentWeekNumber}`;
                
                const scaleData = {
                    date: today,
                    timestamp: new Date().toISOString(),
                    week: currentWeekNumber,
                    totalScore: totalScore,
                    maxScore: 120,
                    answers: answers,
                    dimensionScores: dimensionScores,
                    type: scaleType
                };

                // حفظ حسب النوع
                await docRef.set({
                    [`${weekKey}.scale.${scaleType}`]: scaleData,
                    [`${weekKey}.scale.lastUpdated`]: new Date().toISOString()
                }, { merge: true });

                // إضافة للـ history
                const currentHistory = doc.exists ? 
                    (doc.data()[`${weekKey}.scale.history`] || []) : [];
                
                // إضافة الإدخال الجديد
                currentHistory.push(scaleData);

                await docRef.set({
                    [`${weekKey}.scale.history`]: currentHistory
                }, { merge: true });

                console.log('✅ تم حفظ المقياس بنجاح');

                // إضافة النقاط فقط إذا كانت المرة الأولى
                if (isFirstTime) {
                    await addPointsToPillar('action', 15, {
                        type: 'awakening_scale',
                        week: currentWeekNumber,
                        totalScore: totalScore
                    });
                    
                    showNotification('🎉 رائع! تم حفظ المقياس وحصلت على 15 نقطة!', 'success');
                } else {
                    showNotification('✅ تم تحديث المقياس بنجاح', 'success');
                }

                // الانتقال لصفحة النتائج
                setTimeout(() => {
                    showResults(scaleData, isFirstTime);
                }, 1500);

            } catch (error) {
                console.error('❌ خطأ في حفظ المقياس:', error);
                showNotification('حدث خطأ في الحفظ. حاول مرة أخرى', 'error');
                
                saveBtn.disabled = false;
                saveBtn.innerHTML = `
                    <i class="fas fa-save"></i>
                    <span>حفظ المقياس</span>
                    <span class="btn-reward">+15 نقطة 🚶</span>
                `;
            }
        }

        // ============================================
        // 📥 تحميل البيانات الموجودة
        // ============================================
        
        async function loadExistingData() {
            try {
                const docRef = db.collection('users')
                    .doc(userId)
                    .collection('awakening_progress')
                    .doc(currentCourseId);

                const doc = await docRef.get();

                if (doc.exists) {
                    const data = doc.data();
                    const weekKey = `week${currentWeekNumber}`;
                    const currentScale = data[`${weekKey}.scale.current`];

                    if (currentScale && currentScale.answers) {
                        console.log('📊 تم العثور على مقياس سابق، جاري التحميل...');
                        
                        // ملء الإجابات
                        Object.keys(currentScale.answers).forEach(dimensionId => {
                            const answers = currentScale.answers[dimensionId];
                            const dimension = scaleDimensions.find(d => d.id === dimensionId);
                            
                            if (dimension) {
                                answers.forEach((value, index) => {
                                    const questionNumber = scaleDimensions
                                        .slice(0, scaleDimensions.indexOf(dimension))
                                        .reduce((sum, d) => sum + d.questions.length, 0) + index + 1;
                                    
                                    const input = document.querySelector(
                                        `input[name="q${questionNumber}"][value="${value}"]`
                                    );
                                    
                                    if (input) {
                                        input.checked = true;
                                    }
                                });
                            }
                        });

                        // تحديث التقدم
                        updateProgress();
                        
                        showNotification('تم تحميل إجاباتك السابقة', 'success');
                    }
                }
            } catch (error) {
                console.error('❌ خطأ في تحميل البيانات:', error);
            }
        }
        
    </script>
