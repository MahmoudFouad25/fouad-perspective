<script>
(function() {
    'use strict';
    
    const isMobile = /Android|webOS|iPhone|iPad|iPod/i.test(navigator.userAgent);
    
    // حماية بسيطة بدون تعارض مع Firebase
    if (!isMobile) {
        // منع كليك يمين
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            return false;
        });
        
        // منع F12 وأدوات المطور
        document.addEventListener('keydown', (e) => {
            if (e.keyCode === 123 || 
                (e.ctrlKey && e.shiftKey && e.keyCode === 73) ||
                (e.ctrlKey && e.shiftKey && e.keyCode === 74) ||
                (e.ctrlKey && e.keyCode === 85)) {
                e.preventDefault();
                return false;
            }
        });
    }
    
    // منع النسخ (للموبايل والكمبيوتر)
    document.addEventListener('copy', (e) => {
        e.preventDefault();
        return false;
    });
    
    // منع التحديد (ماعدا الأسئلة والأزرار)
    document.addEventListener('selectstart', (e) => {
        if (!e.target.matches('input, textarea, button, label, .likert-label, .likert-circle')) {
            e.preventDefault();
            return false;
        }
    });
    
    // CSS للحماية
    const style = document.createElement('style');
    style.innerHTML = `
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        /* السماح بالتفاعل مع عناصر المقياس */
        input, textarea, button, label,
        .likert-input, .likert-label, .likert-circle,
        .scale-type-input, .scale-type-label {
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            user-select: none !important;
            pointer-events: auto !important;
            cursor: pointer !important;
        }
        
        img {
            pointer-events: none;
            -webkit-user-drag: none;
        }
    `;
    document.head.appendChild(style);
})();

        function getWeekNumber(date) {
            const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
            const dayNum = d.getUTCDay() || 7;
            d.setUTCDate(d.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        }

        function calculateCurrentWeek(courseStartDate) {
            const start = new Date(courseStartDate);
            const now = new Date();
            
            start.setDate(start.getDate() - start.getDay() + 3);
            
            const diffTime = now - start;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            const weekNumber = Math.floor(diffDays / 7) + 1;
            
            return Math.max(1, Math.min(weekNumber, 4));
        }

const _encryptAnswers = (data) => {

        // ============================================
        // 📥 تحميل البيانات الموجودة
        // ============================================
        
        async function loadExistingData() {
            try {
                const docRef = db.collection('users')
                    .doc(userId)
                    .collection('awakening_progress')
                    .doc(currentCourseId);

                const doc = await docRef.get();

                if (doc.exists) {
                    const data = doc.data();
                    const weekKey = `week${currentWeekNumber}`;
                    const currentScale = data[`${weekKey}.scale.current`];

                    if (currentScale && currentScale.answers) {
                        console.log('📊 تم العثور على مقياس سابق، جاري التحميل...');
                        
                        // ملء الإجابات
                        Object.keys(currentScale.answers).forEach(dimensionId => {
                            const answers = currentScale.answers[dimensionId];
                            const dimension = scaleDimensions.find(d => d.id === dimensionId);
                            
                            if (dimension) {
                                answers.forEach((value, index) => {
                                    const questionNumber = scaleDimensions
                                        .slice(0, scaleDimensions.indexOf(dimension))
                                        .reduce((sum, d) => sum + d.questions.length, 0) + index + 1;
                                    
                                    const input = document.querySelector(
                                        `input[name="q${questionNumber}"][value="${value}"]`
                                    );
                                    
                                    if (input) {
                                        input.checked = true;
                                    }
                                });
                            }
                        });

                        // تحديث التقدم
                        updateProgress();
                        
                        showNotification('تم تحميل إجاباتك السابقة', 'success');
                    }
                }
            } catch (error) {
                console.error('❌ خطأ في تحميل البيانات:', error);
            }
        }

// 🛡️ Advanced Console Protection for Scale
(function() {
    'use strict';
    
    const isMobile = /Android|webOS|iPhone|iPad|iPod/i.test(navigator.userAgent);
    
    if (!isMobile) {
        // Protect scale data from console extraction
        const protectedData = ['scaleDimensions', 'userId', 'currentCourseId'];
        
        protectedData.forEach(varName => {
            if (window[varName]) {
                let original = window[varName];
                Object.defineProperty(window, varName, {
                    get: function() {
                        const stack = new Error().stack;
                        if (stack && stack.includes('console')) {
                            return '[محمي - لا يمكن العرض]';
                        }
                        return original;
                    },
                    set: function(val) { original = val; },
                    enumerable: true,
                    configurable: false
                });
            }
        });
        
        // Prevent answer theft via DOM inspection
        const originalGetElementsByClassName = document.getElementsByClassName;
        document.getElementsByClassName = function(className) {
            const elements = originalGetElementsByClassName.call(document, className);
            if (className.includes('likert-input')) {
                return new Proxy(elements, {
                    get: function(target, prop) {
                        if (prop === 'length') return target.length;
                        if (typeof prop === 'number' || !isNaN(prop)) {
                            const elem = target[prop];
                            if (elem && elem.checked) {
                                console.warn('⚠️ محاولة غير مصرح بها للوصول للإجابات');
                            }
                            return elem;
                        }
                        return target[prop];
                    }
                });
            }
            return elements;
        };
    }
    
    // Prevent data extraction via JSON.stringify
    const originalStringify = JSON.stringify;
    JSON.stringify = function(obj, ...args) {
        if (obj && typeof obj === 'object') {
            const cleaned = Array.isArray(obj) ? [...obj] : {...obj};
            
            // Remove sensitive data
            delete cleaned.userId;
            delete cleaned.auth;
            delete cleaned.db;
            delete cleaned.firebaseConfig;
            delete cleaned._enc;
            
            return originalStringify(cleaned, ...args);
        }
        return originalStringify(obj, ...args);
    };
    
    // Prevent localStorage/sessionStorage inspection
    const sensitiveKeys = ['_uid', '_lastPoints'];
    const originalGetItem = Storage.prototype.getItem;
    
    Storage.prototype.getItem = function(key) {
        if (sensitiveKeys.includes(key)) {
            const stack = new Error().stack;
            if (stack && stack.includes('console')) {
                return null;
            }
        }
        return originalGetItem.call(this, key);
    };
    
    console.log('🛡️ Scale protection active');
})();
