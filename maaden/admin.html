<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>آراء القرّاء — فصول المعادن</title>
<link href="https://fonts.googleapis.com/css2?family=Zain:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F0E6;--card:#FCF8F1;--bg2:#EFE6D8;--txt:#2A221C;--txt2:#5F5246;--muted:#9C8C7B;--ink:#163A2C;--ink2:#255C45;--gold:#A87A2E;--line:rgba(42,34,28,.10);--line2:rgba(168,122,46,.28)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:'Zain',serif;font-size:18px;line-height:1.8}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:28px 16px 80px}
h1{font-weight:900;font-size:38px;color:var(--ink);line-height:1.3}
.sub{color:var(--muted);font-size:16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0}
.bar select,.bar input{padding:7px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.btn{padding:7px 16px;border-radius:12px;border:0;background:var(--ink);color:#F6F0E6;font-weight:700;cursor:pointer}
.btn.sec{background:var(--bg2);color:var(--txt2)}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin:8px 0 18px;flex-wrap:wrap}
.tab{border:0;background:none;padding:8px 14px;font-weight:800;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab.on{color:var(--ink);border-color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.st{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.st b{display:block;font-size:28px;font-weight:900;color:var(--ink);line-height:1.2}.st span{font-size:14px;color:var(--muted)}
h2{font-weight:900;font-size:22px;color:var(--gold);margin:26px 0 10px;padding-bottom:4px;border-bottom:1px solid var(--line2)}
.it{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:10px}
.q{font-size:16px;line-height:1.85;border-inline-start:4px solid var(--gold);padding-inline-start:12px;color:var(--txt2);margin-bottom:6px}
.tg{display:inline-block;padding:0 10px;border-radius:999px;background:rgba(37,92,69,.1);color:var(--ink2);font-weight:800;font-size:14px;margin-inline-end:4px}
.t{white-space:pre-line}
.m{display:flex;flex-wrap:wrap;gap:12px;font-size:14px;color:var(--muted);margin-top:4px}
.m a{color:var(--ink2)}
.agg{display:grid;gap:6px;margin:6px 0 12px}
.ag{display:grid;grid-template-columns:200px 1fr 40px;gap:10px;align-items:center;font-size:16px}
.ag .bar2{height:10px;background:var(--bg2);border-radius:6px;overflow:hidden}.ag .bar2 i{display:block;height:100%;background:var(--ink2)}
.ag b{text-align:center}
.who{font-size:14px;color:var(--muted)}
.rd{cursor:pointer}
.rd .pg{height:6px;background:var(--bg2);border-radius:4px;overflow:hidden;margin-top:6px}.rd .pg i{display:block;height:100%;background:var(--gold)}
.rdx{margin-top:10px;border-top:1px dashed var(--line2);padding-top:8px;display:none}.rd.open .rdx{display:block}
.empty{text-align:center;color:var(--muted);padding:60px 10px}
dl dt{font-weight:800;color:var(--ink2);font-size:15px}dl dd{white-space:pre-line;margin-bottom:6px}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}.ag{grid-template-columns:120px 1fr 30px;font-size:15px}h1{font-size:30px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>آراء القرّاء</h1>
  <p class="sub">فصول المعادن · ما كتبه القرّاء من روابط القراءة</p>
  <div class="bar">
    <select id="fM"></select>
    <select id="fR"><option value="">كلّ القرّاء</option></select>
    <input id="fQ" placeholder="بحث في الآراء…">
    <button class="btn" id="reload">تحديث</button>
    <button class="btn sec" id="export">تنزيل كملفّ نصّي</button>
  </div>
  <div class="stats" id="stats"></div>
  <div class="tabs">
    <button class="tab on" data-v="text">على النصّ</button>
    <button class="tab" data-v="checks">الوقفات والأسئلة</button>
    <button class="tab" data-v="readers">القرّاء</button>
  </div>
  <div id="out"><div class="empty">جارٍ التحميل…</div></div>
</div>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyDj0bV5gsyRbqpxzW0Zd9wjYmq53-Xdj3w",authDomain:"fouad-perspective.firebaseapp.com",projectId:"fouad-perspective",storageBucket:"fouad-perspective.firebasestorage.app",messagingSenderId:"1068763865336",appId:"1:1068763865336:web:b791abcd22d536aedd5b0d"});
var db=firebase.firestore(),ALL=[],VIEW='text';
var AR='٠١٢٣٤٥٦٧٨٩';function ar(n){return String(n).replace(/[0-9]/g,function(d){return AR[d]})}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function when(x){var d=x&&x.toDate?x.toDate():null;return d?d.toLocaleString('ar-EG',{day:'numeric',month:'long',hour:'numeric',minute:'2-digit'}):''}
function sec(x){return(x.at&&x.at.seconds)||0}
var $=function(s){return document.querySelector(s)};

function load(){
  $('#out').innerHTML='<div class="empty">جارٍ التحميل…</div>';
  Promise.all([
    db.collection('maaden_feedback').get().catch(function(){return null}),
    db.collection('maraya_feedback').where('book','==','maaden').get().catch(function(){return null})
  ]).then(function(r){
    ALL=[];r.forEach(function(s){if(s)s.forEach(function(d){var x=d.data();x._id=d.id;ALL.push(x)})});
    ALL=ALL.filter(function(x){return!x.deleted});
    var ms={};ALL.forEach(function(x){if(x.metalTitle||!ms[x.metal])ms[x.metal]=x.metalTitle||x.metal});
    var sel=$('#fM'),cur=sel.value,keys=Object.keys(ms);
    sel.innerHTML=keys.length?keys.map(function(k){return'<option value="'+k+'">'+esc(ms[k])+'</option>'}).join(''):'<option value="">لا فصول بعد</option>';
    if(cur&&ms[cur])sel.value=cur;
    fillReaders();render();
  });
}
function names(){var N={};ALL.slice().sort(function(a,b){return sec(a)-sec(b)}).forEach(function(x){if(x.name)N[x.rid]=x.name});return N}
function fillReaders(){
  var m=$('#fM').value,N=names(),R={};ALL.forEach(function(x){if(x.metal===m)R[x.rid]=1});
  var sel=$('#fR'),cur=sel.value;
  sel.innerHTML='<option value="">كلّ القرّاء ('+ar(Object.keys(R).length)+')</option>'+Object.keys(R).map(function(r){return'<option value="'+r+'">'+esc(N[r]||'بلا اسم')+'</option>'}).join('');
  if(R[cur])sel.value=cur;
}
function F(){
  var m=$('#fM').value,r=$('#fR').value,q=$('#fQ').value.trim();
  return ALL.filter(function(x){if(x.metal!==m)return false;if(r&&x.rid!==r)return false;if(q&&JSON.stringify(x).indexOf(q)<0)return false;return true});
}
function meta(x,N){return'<div class="m"><span>'+esc(N[x.rid]||x.name||'بلا اسم')+'</span><span>'+when(x.at)+'</span>'+(x.n?'<a href="'+x.metal+'/#b'+x.n+'" target="_blank">افتح الموضع</a>':'')+'</div>'}
function render(){
  var L=F(),N=names(),m=$('#fM').value,all=ALL.filter(function(x){return x.metal===m});
  var R={},fin=0;all.forEach(function(x){R[x.rid]=1});
  all.forEach(function(x){if(x.kind==='progress'&&x.pct>=95)fin++});
  $('#stats').innerHTML=
    '<div class="st"><b>'+ar(Object.keys(R).length)+'</b><span>قارئ فتح الرابط</span></div>'+
    '<div class="st"><b>'+ar(fin)+'</b><span>أتمّ الفصل</span></div>'+
    '<div class="st"><b>'+ar(all.filter(function(x){return x.kind==='para'}).length)+'</b><span>تعليق على النصّ</span></div>'+
    '<div class="st"><b>'+ar(all.filter(function(x){return x.kind==='check'}).length)+'</b><span>إجابة في الوقفات</span></div>';
  var h='';
  if(VIEW==='text'){
    var P=L.filter(function(x){return x.kind==='para'}).sort(function(a,b){return(a.n-b.n)||(sec(a)-sec(b))});
    if(!P.length)h='<div class="empty">لا تعليقات على النصّ بعد.</div>';
    var last=null;
    P.forEach(function(x){
      if(x.sec!==last){h+='<h2>'+esc(x.sec||'—')+'</h2>';last=x.sec}
      h+='<div class="it"><div class="q">'+(x.sel?'«'+esc(x.sel)+'»':esc((x.quote||'').slice(0,260))+((x.quote||'').length>260?'…':''))+'</div>'+
        (x.tags&&x.tags.length?'<div>'+x.tags.map(function(t){return'<span class="tg">'+esc(t)+'</span>'}).join('')+'</div>':'')+
        (x.text?'<div class="t">'+esc(x.text)+'</div>':'')+meta(x,N)+'</div>';
    });
  }else if(VIEW==='checks'){
    var K=L.filter(function(x){return x.kind==='check'}),G={},order=[];
    K.sort(function(a,b){return(a.end?1:0)-(b.end?1:0)}).forEach(function(x){if(!G[x.ck]){G[x.ck]=[];order.push(x.ck)}G[x.ck].push(x)});
    if(!order.length)h='<div class="empty">لا إجابات بعد.</div>';
    order.forEach(function(ck){
      var arr=G[ck];h+='<h2>'+esc(arr[0].ckTitle||ck)+' <span style="color:var(--muted);font-size:15px;font-weight:700">('+ar(arr.length)+' قارئ)</span></h2>';
      var qs={};arr.forEach(function(x){Object.keys(x.answers||{}).forEach(function(k){var a=x.answers[k];qs[k]=qs[k]||{q:a.q,c:{},who:{}};(a.a||[]).forEach(function(o){qs[k].c[o]=(qs[k].c[o]||0)+1;(qs[k].who[o]=qs[k].who[o]||[]).push(N[x.rid]||x.name||'؟')})})});
      Object.keys(qs).sort().forEach(function(k){
        var Q=qs[k],mx=Math.max.apply(null,[1].concat(Object.values(Q.c)));
        h+='<div class="it"><b>'+esc(Q.q)+'</b><div class="agg">'+Object.keys(Q.c).sort(function(a,b){return Q.c[b]-Q.c[a]}).map(function(o){
          return'<div class="ag"><span>'+esc(o)+'</span><span class="bar2"><i style="width:'+Math.round(Q.c[o]/mx*100)+'%"></i></span><b>'+ar(Q.c[o])+'</b></div><div class="who" style="margin-top:-6px">'+Q.who[o].map(esc).join('، ')+'</div>';
        }).join('')+'</div></div>';
      });
      arr.forEach(function(x){
        var t='';if(x.text)t+='<div class="t">'+esc(x.text)+'</div>';
        Object.keys(x.texts||{}).forEach(function(k){var v=x.texts[k];if(v.a)t+='<dl><dt>'+esc(v.q)+'</dt><dd>'+esc(v.a)+'</dd></dl>'});
        if(t)h+='<div class="it">'+t+meta(x,N)+'</div>';
      });
    });
  }else{
    var B={};L.forEach(function(x){(B[x.rid]=B[x.rid]||[]).push(x)});
    var rs=Object.keys(B);if(!rs.length)h='<div class="empty">لا قرّاء بعد.</div>';
    rs.sort(function(a,b){return Math.max.apply(null,B[b].map(sec))-Math.max.apply(null,B[a].map(sec))}).forEach(function(r){
      var arr=B[r],pg=arr.find(function(x){return x.kind==='progress'}),st=arr.find(function(x){return x.kind==='start'});
      var pc=arr.filter(function(x){return x.kind==='para'}).sort(function(a,b){return a.n-b.n}),ks=arr.filter(function(x){return x.kind==='check'});
      var pct=pg?pg.pct:0;
      h+='<div class="it rd"><b>'+esc(N[r]||'بلا اسم')+'</b> <span class="who">· '+ar(pc.length)+' تعليق · '+ar(ks.length)+' وقفة · قرأ '+ar(pct)+'٪'+(st?' · بدأ '+when(st.at):'')+'</span><div class="pg"><i style="width:'+pct+'%"></i></div><div class="rdx">';
      pc.forEach(function(x){h+='<div class="it"><div class="q">'+(x.sel?'«'+esc(x.sel)+'»':esc((x.quote||'').slice(0,200)))+'</div>'+(x.tags||[]).map(function(t){return'<span class="tg">'+esc(t)+'</span>'}).join('')+(x.text?'<div class="t">'+esc(x.text)+'</div>':'')+meta(x,N)+'</div>'});
      ks.forEach(function(x){h+='<div class="it"><b>'+esc(x.ckTitle)+'</b><dl>';Object.keys(x.answers||{}).sort().forEach(function(k){var a=x.answers[k];if(a.a&&a.a.length)h+='<dt>'+esc(a.q)+'</dt><dd>'+a.a.map(esc).join('، ')+'</dd>'});if(x.text)h+='<dt>تعليق</dt><dd>'+esc(x.text)+'</dd>';Object.keys(x.texts||{}).forEach(function(k){var v=x.texts[k];if(v.a)h+='<dt>'+esc(v.q)+'</dt><dd>'+esc(v.a)+'</dd>'});h+='</dl></div>'});
      h+='</div></div>';
    });
  }
  $('#out').innerHTML=h;
}
function exportTxt(){
  var N=names(),L=F(),m=$('#fM');var title=m.options[m.selectedIndex]?m.options[m.selectedIndex].text:'';
  var out='آراء القرّاء — '+title+'\n\n══ التعليقات على النصّ ══\n\n';
  L.filter(function(x){return x.kind==='para'}).sort(function(a,b){return a.n-b.n}).forEach(function(x){
    out+='— '+(x.sec||'')+' · '+(N[x.rid]||x.name||'')+'\n«'+(x.sel||x.quote||'')+'»\n'+((x.tags||[]).length?'['+x.tags.join('، ')+'] ':'')+(x.text||'')+'\n\n';
  });
  out+='\n══ الوقفات والأسئلة ══\n\n';
  L.filter(function(x){return x.kind==='check'}).forEach(function(x){
    out+='— '+x.ckTitle+' · '+(N[x.rid]||x.name||'')+'\n';
    Object.keys(x.answers||{}).sort().forEach(function(k){var a=x.answers[k];if(a.a&&a.a.length)out+='  '+a.q+': '+a.a.join('، ')+'\n'});
    if(x.text)out+='  '+x.text+'\n';
    Object.keys(x.texts||{}).forEach(function(k){var v=x.texts[k];if(v.a)out+='  '+v.q+': '+v.a+'\n'});
    out+='\n';
  });
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'text/plain;charset=utf-8'}));a.download='آراء القرّاء — '+title+'.txt';a.click();
}
document.querySelectorAll('.tab').forEach(function(t){t.addEventListener('click',function(){document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on')});t.classList.add('on');VIEW=t.dataset.v;render()})});
$('#out').addEventListener('click',function(e){var r=e.target.closest('.rd');if(r&&!e.target.closest('a,.rdx'))r.classList.toggle('open')});
$('#fM').addEventListener('change',function(){fillReaders();render()});
$('#fR').addEventListener('change',render);$('#fQ').addEventListener('input',render);
$('#reload').addEventListener('click',load);$('#export').addEventListener('click',exportTxt);
load();
</script>
</body>
</html>
