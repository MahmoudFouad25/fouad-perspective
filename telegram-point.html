<style>

<script>

  
// نظام المحادثات المتكامل مع التليجرام
let telegramChatsData = new Map();
let currentOpenChat = null;
let messagesListener = null;

// دالة تحميل المحادثات مع التصنيف الذكي
async function loadTelegramChatsAdvanced() {
    try {
        console.log('🔄 جاري تحميل المحادثات...');
        
        // جلب المحادثات
        const snapshot = await db.collection('telegramChats')
            .orderBy('lastActivity', 'desc')
            .limit(50)
            .get();
        
        // جلب الحجوزات المؤقتة
        const bookingsSnapshot = await db.collection('tempBookings')
            .get();
        
        // إنشاء خريطة للربط بين chatId والبيانات الكاملة
        const bookingsMap = new Map();
        bookingsSnapshot.forEach(doc => {
            const booking = doc.data();
            
            // التعامل مع البيانات المتداخلة
            let realName = '';
            let bookingType = '';
            let courseName = '';
            let telegramChatId = '';
            
            // البحث عن البيانات في أماكن مختلفة
            if (booking.userData) {
                // البيانات متداخلة في userData
                realName = booking.userData.customer?.name || '';
                bookingType = booking.userData.bookingType || 'individual';
                courseName = booking.userData.courseName || '';
                telegramChatId = String(booking.userData.telegramChatId || '');
            } else {
                // البيانات مباشرة
                realName = booking.customer?.name || booking.applicantName || '';
                bookingType = booking.bookingType || 'individual';
                courseName = booking.courseName || '';
                telegramChatId = String(booking.telegramChatId || '');
            }
            
            if (telegramChatId) {
                bookingsMap.set(telegramChatId, {
                    realName: realName,
                    courseName: courseName,
                    bookingType: bookingType,
                    bookingId: doc.id,
                    grantStatus: booking.grantStatus || booking.userData?.grantStatus || null
                });
                
                console.log(`✅ ربط Chat ${telegramChatId} بالاسم: ${realName}`);
            }
        });
        
        telegramChatsData.clear();
        let stats = {
            total: 0,
            helpRequests: 0,
            grants: 0,
            bookings: 0,
            active: 0
        };
        
        const today = new Date().setHours(0, 0, 0, 0);
        
        for (const doc of snapshot.docs) {
            const data = doc.data();
            const chatId = doc.id;
            
            // الحصول على معلومات الحجز
            const bookingInfo = bookingsMap.get(chatId);
            
            // استخدام الاسم الحقيقي من الحجز أو الاسم من بيانات الشات
            const realName = bookingInfo?.realName || 
                           data.customer?.name ||
                           data.applicantName ||
                           data.userInfo?.firstName || 
                           'غير محدد';
            
            const telegramName = data.userInfo?.firstName || data.userInfo?.username || 'Telegram User';
            
            console.log(`📋 Chat ${chatId}: الاسم الحقيقي = ${realName}, اسم التليجرام = ${telegramName}`);
            
            // تصنيف نوع المحادثة
            let chatType = 'general';
            let priority = 0;
            
            if (data.hasHelpRequest || data.needsHelp) {
                chatType = 'help';
                priority = 3;
                stats.helpRequests++;
            } else if (bookingInfo?.bookingType === 'grant_request' || data.bookingType === 'grant_request') {
                chatType = 'grant';
                priority = 2;
                stats.grants++;
            } else if (bookingInfo || data.bookingId || data.hasBooking) {
                chatType = 'booking';  // حجز فردي
                priority = 1;
                stats.bookings++;
            }
            
            if (data.lastActivity?.toDate() > today) {
                stats.active++;
            }
            
            // جلب آخر الرسائل
            const messagesSnapshot = await db.collection('telegramChats')
                .doc(chatId)
                .collection('messages')
                .orderBy('timestamp', 'desc')
                .limit(20)
                .get();
            
            const messages = [];
            let hasReceipt = false;
            let unreadCount = 0;
            
            messagesSnapshot.forEach(msgDoc => {
                const msg = msgDoc.data();
                messages.push({ id: msgDoc.id, ...msg });
                
                if (msg.hasAttachment && (msg.attachmentType === 'photo' || msg.attachmentType === 'document')) {
                    hasReceipt = true;
                }
                
                if (msg.type === 'user' && !msg.seen) {
                    unreadCount++;
                }
            });
            
            telegramChatsData.set(chatId, {
                ...data,
                realName: realName,
                telegramName: telegramName,
                courseName: bookingInfo?.courseName || data.courseName || '',
                chatType: chatType,
                priority: priority,
                messages: messages.reverse(),
                hasReceipt: hasReceipt,
                unreadCount: unreadCount,
                isUrgent: data.hasHelpRequest || data.needsHelp,
                grantStatus: bookingInfo?.grantStatus || data.grantStatus,
                hasBooking: !!bookingInfo,
                bookingId: bookingInfo?.bookingId
            });
            
            stats.total++;
        }
        
        console.log(`📊 الإحصائيات: المجموع=${stats.total}, مساعدة=${stats.helpRequests}, منح=${stats.grants}, حجوزات=${stats.bookings}`);
        
        updateChatsDisplay(stats);
        updateNotificationBadge();
        
    } catch (error) {
        console.error('❌ خطأ في تحميل المحادثات:', error);
    }
}
// دالة عرض المحادثات المحسنة
function updateChatsDisplay(stats) {
    const container = document.getElementById('telegram-chats-list');
    if (!container) return;
    
    // ترتيب المحادثات حسب الأولوية
    const sortedChats = Array.from(telegramChatsData.entries())
        .sort((a, b) => b[1].priority - a[1].priority);
    
    let html = '';
    
    sortedChats.forEach(([chatId, chat]) => {
        // استخدام الاسم الحقيقي
        const displayName = chat.realName;
        const telegramName = chat.telegramName;
        const lastMessage = chat.messages[chat.messages.length - 1];
        
        // تحديد اللون والأيقونة حسب النوع
        let typeIcon = 'fa-comment';
        let typeColor = '#6B7280';
        let statusBadge = '';
        
        if (chat.chatType === 'help') {
            typeIcon = 'fa-exclamation-triangle';
            typeColor = '#EF4444';
            statusBadge = `<span class="badge bg-danger">🆘 مساعدة</span>`;
        } else if (chat.chatType === 'grant') {
            typeIcon = 'fa-hand-holding-heart';
            typeColor = '#9333EA';
            
            // تحديد حالة المنحة
            if (chat.grantStatus === 'pending') {
                statusBadge = `<span class="badge" style="background: #F59E0B;">🎯 قيد المراجعة</span>`;
            } else if (chat.grantStatus === 'negotiation') {
                statusBadge = `<span class="badge" style="background: #8B5CF6;">💬 تفاوض</span>`;
            } else if (chat.grantStatus === 'approved') {
                statusBadge = `<span class="badge bg-success">✅ معتمدة</span>`;
            } else {
                statusBadge = `<span class="badge" style="background: #9333EA;">🎁 منحة</span>`;
            }
        } else if (chat.chatType === 'booking') {
            typeIcon = 'fa-shopping-cart';
            typeColor = '#3B82F6';
            statusBadge = `<span class="badge bg-info">📋 حجز فردي</span>`;
        }
        
        html += `
            <div class="chat-item ${chat.isUrgent ? 'urgent' : ''} ${chat.unreadCount > 0 ? 'unread' : ''}"
                 data-type="${chat.chatType}"
                 onclick="openAdvancedChat('${chatId}')"
                 style="padding: 15px; border-bottom: 1px solid #E5E7EB; cursor: pointer;
                        ${chat.isUrgent ? 'background: linear-gradient(to right, #FEF2F2, #FFF); border-left: 4px solid #EF4444;' : ''}
                        ${chat.unreadCount > 0 ? 'background: #F0F9FF;' : ''}
                        transition: all 0.3s;">
                
                <div style="display: flex; gap: 15px; align-items: start;">
                    <!-- الأيقونة -->
                    <div style="width: 45px; height: 45px; background: ${typeColor}20; 
                                border-radius: 50%; display: flex; align-items: center; 
                                justify-content: center; flex-shrink: 0;">
                        <i class="fas ${typeIcon}" style="color: ${typeColor};"></i>
                    </div>
                    
                    <!-- المحتوى -->
                    <div style="flex: 1;">
                        <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 5px;">
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <!-- عرض الأسماء بشكل واضح -->
                                <div style="display: flex; flex-direction: column;">
                                    <strong style="color: #1F2937; font-size: 0.95rem;">${displayName}</strong>
                                    ${displayName !== telegramName ? 
                                        `<small style="color: #9CA3AF; font-size: 0.75rem;">
                                            <i class="fab fa-telegram" style="font-size: 0.7rem;"></i> ${telegramName}
                                        </small>` : ''}
                                    ${chat.courseName ? 
                                        `<small style="color: #059669; font-size: 0.75rem;">
                                            <i class="fas fa-book" style="font-size: 0.7rem;"></i> ${chat.courseName}
                                        </small>` : ''}
                                </div>
                                ${statusBadge}
                                ${chat.hasReceipt ? '<span class="badge bg-success">📎 إيصال</span>' : ''}
                            </div>
                            <small style="color: #9CA3AF;">
                                ${chat.lastActivity ? formatTimeAgo(chat.lastActivity.toDate()) : ''}
                            </small>
                        </div>
                        
                        <div style="color: #6B7280; font-size: 0.9rem;">
                            ${lastMessage ? 
                                (lastMessage.hasAttachment ? 
                                    `📎 ${lastMessage.attachmentType === 'photo' ? 'صورة' : 'ملف'}` :
                                    lastMessage.message.substring(0, 60) + (lastMessage.message.length > 60 ? '...' : '')) :
                                'لا توجد رسائل'}
                        </div>
                        
                        ${chat.unreadCount > 0 ? 
                            `<div style="margin-top: 5px;">
                                <span style="background: #EF4444; color: white; padding: 2px 8px; 
                                            border-radius: 12px; font-size: 0.75rem;">
                                    ${chat.unreadCount} رسالة جديدة
                                </span>
                            </div>` : ''}
                    </div>
                </div>
            </div>
        `;
    });
    
    container.innerHTML = html || '<p style="text-align: center; padding: 20px; color: #9CA3AF;">لا توجد محادثات</p>';
    
    // تحديث الإحصائيات
    updateStatsDisplay(stats);
}

// دالة فتح المحادثة المتقدمة
async function openAdvancedChat(chatId) {
    currentOpenChat = chatId;
    const chat = telegramChatsData.get(chatId);
    if (!chat) return;
    
    // إيقاف المستمع السابق
    if (messagesListener) {
        messagesListener();
    }
    
    // إنشاء نافذة المحادثة
    const modal = document.createElement('div');
    modal.id = 'chat-modal';
    modal.style.cssText = `
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.5); z-index: 9999;
        display: flex; align-items: center; justify-content: center;
    `;
    
    modal.innerHTML = `
        <div style="background: white; width: 90%; max-width: 800px; height: 80vh;
                    border-radius: 15px; display: flex; flex-direction: column; overflow: hidden;">
            
            <!-- Header -->
            <div style="background: linear-gradient(135deg, #0EA5E9, #0284C7); 
                        color: white; padding: 20px; display: flex; 
                        justify-content: space-between; align-items: center;">
                <div>
                    <div>
    <h4 style="margin: 0; color: white;">${chat.realName}</h4>
    <div style="font-size: 0.85rem; opacity: 0.9; margin-top: 5px;">
        <i class="fab fa-telegram"></i> @${chat.telegramName}
        ${chat.courseName ? ` | <i class="fas fa-book"></i> ${chat.courseName}` : ''}
    </div>
</div>
                    <small>Chat ID: ${chatId}</small>
                </div>
                <button onclick="closeChatModal()" 
                        style="background: none; border: none; color: white; 
                               font-size: 1.5rem; cursor: pointer;">×</button>
            </div>
            
            <!-- Messages -->
            <div id="messages-container" 
                 style="flex: 1; overflow-y: auto; padding: 20px; background: #F9FAFB;">
                <!-- الرسائل ستظهر هنا -->
            </div>
            
            <!-- Input -->
            <div style="padding: 15px; background: white; border-top: 1px solid #E5E7EB;">
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="message-input" 
                           placeholder="اكتب رسالتك..." 
                           style="flex: 1; padding: 10px; border: 1px solid #E5E7EB; 
                                  border-radius: 25px; outline: none;"
                           onkeypress="if(event.key === 'Enter') sendMessageToChat()">
                    
                    <button onclick="sendQuickReply()" 
                            style="background: #F59E0B; color: white; border: none; 
                                   padding: 10px 20px; border-radius: 25px; cursor: pointer;">
                        <i class="fas fa-bolt"></i> ردود سريعة
                    </button>
                    
                    <button onclick="sendMessageToChat()" 
                            style="background: linear-gradient(135deg, #0EA5E9, #0284C7); 
                                   color: white; border: none; padding: 10px 20px; 
                                   border-radius: 25px; cursor: pointer;">
                        <i class="fas fa-paper-plane"></i> إرسال
                    </button>
                </div>
            </div>
        </div>
    `;
    
    document.body.appendChild(modal);
    
    // بدء الاستماع للرسائل الجديدة
    messagesListener = db.collection('telegramChats')
        .doc(chatId)
        .collection('messages')
        .orderBy('timestamp', 'asc')
        .onSnapshot(snapshot => {
            displayMessages(snapshot.docs);
        });
    
    // تحديث حالة القراءة
    markAsRead(chatId);
}

// دالة عرض الرسائل
function displayMessages(messages) {
    const container = document.getElementById('messages-container');
    if (!container) return;
    
    let html = '';
    
    messages.forEach(doc => {
        const msg = doc.data();
        const isUser = msg.type === 'user';
        
        html += `
            <div style="display: flex; justify-content: ${isUser ? 'flex-start' : 'flex-end'}; 
                        margin-bottom: 15px;">
                <div style="max-width: 60%; padding: 12px 16px; 
                            background: ${isUser ? 'white' : 'linear-gradient(135deg, #0EA5E9, #0284C7)'}; 
                            color: ${isUser ? '#374151' : 'white'};
                            border-radius: 15px; 
                            ${isUser ? 'border-bottom-left-radius: 5px;' : 'border-bottom-right-radius: 5px;'}
                            box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
                    
                    ${msg.hasAttachment ? `
                        <div style="margin-bottom: 10px;">
                            ${msg.attachmentType === 'photo' ? 
                                `<img src="${msg.permanentUrl}" 
                                      style="max-width: 100%; border-radius: 10px; cursor: pointer;"
                                      onclick="window.open('${msg.permanentUrl}', '_blank')">` :
                                `<a href="${msg.permanentUrl}" target="_blank" 
                                    style="display: inline-block; padding: 10px; 
                                           background: ${isUser ? '#F3F4F6' : 'rgba(255,255,255,0.2)'}; 
                                           border-radius: 8px; text-decoration: none; 
                                           color: ${isUser ? '#3B82F6' : 'white'};">
                                    <i class="fas fa-file"></i> ${msg.fileName || 'ملف مرفق'}
                                </a>`
                            }
                        </div>
                    ` : ''}
                    
                    <div>${msg.message}</div>
                    
                    <div style="font-size: 0.75rem; opacity: 0.7; margin-top: 5px; 
                                text-align: ${isUser ? 'left' : 'right'};">
                        ${msg.timestamp ? new Date(msg.timestamp.toDate()).toLocaleTimeString('ar-EG') : ''}
                    </div>
                </div>
            </div>
        `;
    });
    
    container.innerHTML = html;
    container.scrollTop = container.scrollHeight;
}

// دالة إرسال رسالة
async function sendMessageToChat() {
    const input = document.getElementById('message-input');
    const message = input.value.trim();
    
    if (!message || !currentOpenChat) return;
    
    try {
        // إرسال للتليجرام
        const response = await fetch('https://us-central1-fouad-perspective.cloudfunctions.net/telegramBot/send-message-to-chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chatId: currentOpenChat,
                message: `📢 *رسالة من الإدارة:*\n\n${message}`
            })
        });
        
        if (response.ok) {
            // حفظ في Firebase
            await db.collection('telegramChats')
                .doc(currentOpenChat)
                .collection('messages')
                .add({
                    message: message,
                    type: 'bot',
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    sentBy: 'admin'
                });
            
            input.value = '';
        }
    } catch (error) {
        console.error('خطأ:', error);
        Swal.fire('خطأ', 'فشل إرسال الرسالة', 'error');
    }
}

// دالة الردود السريعة

function updateNotificationBadge() {
    let totalUnread = 0;
    telegramChatsData.forEach(chat => {
        totalUnread += chat.unreadCount;
    });
    
    const badge = document.getElementById('telegram-notifications-badge');
    if (badge) {
        badge.textContent = totalUnread;
        badge.style.display = totalUnread > 0 ? 'inline-block' : 'none';
    }
}

// دالة تحديث المحادثة كمقروءة
async function markAsRead(chatId) {
    try {
        await db.collection('telegramChats').doc(chatId).update({
            hasUnread: false,
            needsAdminResponse: false
        });
        
        // تحديث الرسائل كمقروءة
        const messages = await db.collection('telegramChats')
            .doc(chatId)
            .collection('messages')
            .where('type', '==', 'user')
            .where('seen', '==', false)
            .get();
        
        const batch = db.batch();
        messages.forEach(doc => {
            batch.update(doc.ref, { seen: true });
        });
        await batch.commit();
        
        // تحديث البيانات المحلية
        const chat = telegramChatsData.get(chatId);
        if (chat) {
            chat.unreadCount = 0;
            updateNotificationBadge();
        }
    } catch (error) {
        console.error('خطأ في تحديث حالة القراءة:', error);
    }
}

// دوال مساعدة
function formatTimeAgo(date) {
    const now = new Date();
    const diff = now - date;
    const minutes = Math.floor(diff / 60000);
    const hours = Math.floor(diff / 3600000);
    const days = Math.floor(diff / 86400000);
    
    if (minutes < 1) return 'الآن';
    if (minutes < 60) return `منذ ${minutes} دقيقة`;
    if (hours < 24) return `منذ ${hours} ساعة`;
    if (days < 7) return `منذ ${days} يوم`;
    
    return date.toLocaleDateString('ar-EG');
}

function setupRealtimeListener() {
    db.collection('telegramChats')
        .where('lastActivity', '>', new Date(lastMessageTimestamp))
        .onSnapshot(snapshot => {
            snapshot.docChanges().forEach(change => {
                if (change.type === 'added' || change.type === 'modified') {
                    const data = change.doc.data();
                    
                    // تشغيل الإشعارات
                    if (data.hasNewMessage && soundEnabled) {
                        notificationSound.play();
                        showDesktopNotification(data);
                    }
                    
                    // تحديث البيانات
                    loadTelegramChatsAdvanced();
                }
            });
            
            lastMessageTimestamp = Date.now();
        });
}

function showDesktopNotification(data) {
    if (Notification.permission === "granted") {
        const notification = new Notification("رسالة جديدة من التليجرام", {
            body: `${data.userInfo?.firstName || 'عميل'}: ${data.lastMessage || 'رسالة جديدة'}`,
            icon: "https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg",
            tag: data.chatId,
            requireInteraction: true
        });
        
        notification.onclick = function() {
            window.focus();
            openAdvancedChat(data.chatId);
            notification.close();
        };
    }
}
