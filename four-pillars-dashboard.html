<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التطور 📊 - صحوة الحائر</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --sunrise-orange: #FF9F40;
            --sunrise-yellow: #FFD93D;
            --sunrise-gold: #FFB627;
            --dawn-blue: #4DA3FF;
            --deep-blue: #2E5EAA;
            --bg-dark: #0a0e27;
            --bg-gradient-start: #1a1a2e;
            --bg-gradient-end: #16213e;
            --card-bg: rgba(30, 27, 75, 0.6);
            --card-border: rgba(255, 159, 64, 0.3);
            --text-light: #e0e7ff;
            --text-dim: rgba(255, 255, 255, 0.7);
            --success: #10b981;
            --danger: #ef4444;
            --gold: #FFD700;
        }

        body {
            font-family: 'Tajawal', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            color: var(--text-light);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: 50%;
            transform: translateX(-50%);
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 159, 64, 0.1) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .dashboard-header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: linear-gradient(135deg, rgba(255, 159, 64, 0.15) 0%, rgba(77, 163, 255, 0.1) 100%);
            border-radius: 25px;
            border: 2px solid var(--card-border);
            backdrop-filter: blur(10px);
        }

        .dashboard-header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--sunrise-orange), var(--sunrise-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .nav-buttons {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .nav-btn {
            padding: 12px 25px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn.primary {
            background: linear-gradient(135deg, var(--sunrise-orange), var(--sunrise-gold));
            color: white;
        }

        .nav-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-light);
            border: 2px solid var(--card-border);
        }

        .nav-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(255, 159, 64, 0.3);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 159, 64, 0.2);
        }

        .stat-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 10px rgba(255, 159, 64, 0.5));
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--sunrise-orange), var(--sunrise-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 5px;
        }

        .stat-label {
            color: var(--text-dim);
            font-size: 0.95rem;
        }

        /* Charts Section */
        .charts-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .chart-card {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }

        .chart-title {
            font-size: 1.5rem;
            color: var(--sunrise-orange);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 60px 20px;
        }

        .loading-spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 159, 64, 0.3);
            border-top-color: var(--sunrise-orange);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .charts-section {
                grid-template-columns: 1fr;
            }
            
            .dashboard-header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="dashboard-header">
            <h1>📊 لوحة التطور</h1>
            <p style="color: var(--text-dim); font-size: 1.1rem; margin-bottom: 10px;">
                نظرة شاملة على رحلة صحوتك
            </p>
            
            <div class="nav-buttons">
                <button class="nav-btn secondary" onclick="goToMainPage()">
                    <i class="fas fa-home"></i>
                    الصفحة الرئيسية
                </button>
            </div>
        </div>

        <!-- Loading State -->
        <div class="loading" id="loadingState">
            <div class="loading-spinner"></div>
            <p style="color: var(--text-dim);">جاري تحميل بياناتك...</p>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid" id="statsGrid" style="display: none;">
            <!-- Will be filled by JavaScript -->
        </div>

        <!-- Charts Section -->
        <div class="charts-section" id="chartsSection" style="display: none;">
            <!-- Pillar Chart -->
            <div class="chart-card">
                <div class="chart-title">
                    <i class="fas fa-chart-bar"></i>
                    نقاط الركائز الأربعة
                </div>
                <canvas id="pillarChart"></canvas>
            </div>

            <!-- Weekly Progress Chart -->
            <div class="chart-card">
                <div class="chart-title">
                    <i class="fas fa-chart-line"></i>
                    التقدم الأسبوعي
                </div>
                <canvas id="weeklyChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDj0bV5gsyRbqpxzW0Zd9wjYmq53-Xdj3w",
            authDomain: "fouad-perspective.firebaseapp.com",
            projectId: "fouad-perspective",
            storageBucket: "fouad-perspective.firebasestorage.app",
            messagingSenderId: "1068763865336",
            appId: "1:1068763865336:web:b791abcd22d536aedd5b0d",
            measurementId: "G-RY1FYVB3Q9"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();

        let currentUser = null;
        let currentCourseId = null;

        // Initialize
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                const urlParams = new URLSearchParams(window.location.search);
                currentCourseId = urlParams.get('id') || localStorage.getItem('currentCourseId');
                
                if (currentCourseId) {
                    loadDashboard();
                } else {
                    showError();
                }
            } else {
                window.location.href = 'login.html';
            }
        });

        function goToMainPage() {
            window.location.href = `awakening-focus__5_.html?id=${currentCourseId}`;
        }

        async function loadDashboard() {
            try {
                const userId = localStorage.getItem('userId') || currentUser.uid;
                
                // Load data
                const awakeningDoc = await db.collection('users')
                    .doc(userId)
                    .collection('awakening_progress')
                    .doc(currentCourseId)
                    .get();
                
                const pillarDoc = await db.collection('users')
                    .doc(userId)
                    .collection('pillarProgress')
                    .doc(currentCourseId)
                    .get();
                
                const data = awakeningDoc.exists ? awakeningDoc.data() : {};
                const pillarData = pillarDoc.exists ? pillarDoc.data() : {};
                
                // Calculate stats
                const stats = calculateStats(data, pillarData);
                
                // Display stats
                displayStats(stats);
                
                // Create charts
                createPillarChart(pillarData);
                createWeeklyChart(data);
                
                // Hide loading, show content
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('statsGrid').style.display = 'grid';
                document.getElementById('chartsSection').style.display = 'grid';
                
            } catch (error) {
                console.error('خطأ في تحميل Dashboard:', error);
                showError();
            }
        }

        function calculateStats(data, pillarData) {
            let totalPoints = 0;
            
            // Calculate from pillars
            ['courage', 'mirror', 'action', 'witness'].forEach(pillar => {
                totalPoints += pillarData[`${pillar}.totalPoints`] || 0;
            });
            
            // Calculate other stats
            let daysActive = 0;
            if (data['dailyTools.journal.entries']) {
                daysActive = data['dailyTools.journal.entries'].length;
            }
            
            let longestStreak = Math.max(
                data['dailyTools.morningRitual.currentStreak'] || 0,
                data['dailyTools.journal.currentStreak'] || 0
            );
            
            let completionPercentage = Math.round((totalPoints / 500) * 100);
            
            return {
                totalPoints,
                daysActive,
                longestStreak,
                completionPercentage,
                currentWeek: 2 // يمكن حسابه من التاريخ
            };
        }

        function displayStats(stats) {
            const statsGrid = document.getElementById('statsGrid');
            
            statsGrid.innerHTML = `
                <div class="stat-card">
                    <div class="stat-icon">⭐</div>
                    <div class="stat-value">${stats.totalPoints}</div>
                    <div class="stat-label">إجمالي النقاط</div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-icon">📅</div>
                    <div class="stat-value">${stats.daysActive}</div>
                    <div class="stat-label">أيام نشطة</div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-icon">🔥</div>
                    <div class="stat-value">${stats.longestStreak}</div>
                    <div class="stat-label">أطول سلسلة</div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-icon">📈</div>
                    <div class="stat-value">${stats.completionPercentage}%</div>
                    <div class="stat-label">نسبة الإنجاز</div>
                </div>
            `;
        }

        function createPillarChart(pillarData) {
            const ctx = document.getElementById('pillarChart').getContext('2d');
            
            const courage = pillarData['courage.totalPoints'] || 0;
            const mirror = pillarData['mirror.totalPoints'] || 0;
            const action = pillarData['action.totalPoints'] || 0;
            const witness = pillarData['witness.totalPoints'] || 0;
            
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['الجرأة 🔥', 'المرآة 🪞', 'الخطوة 🚶', 'الشهود 👥'],
                    datasets: [{
                        label: 'النقاط',
                        data: [courage, mirror, action, witness],
                        backgroundColor: [
                            'rgba(239, 68, 68, 0.7)',
                            'rgba(139, 92, 246, 0.7)',
                            'rgba(16, 185, 129, 0.7)',
                            'rgba(251, 191, 36, 0.7)'
                        ],
                        borderColor: [
                            '#ef4444',
                            '#8b5cf6',
                            '#10b981',
                            '#fbbf24'
                        ],
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                color: '#e0e7ff',
                                font: {
                                    family: 'Tajawal',
                                    size: 12
                                }
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            }
                        },
                        x: {
                            ticks: {
                                color: '#e0e7ff',
                                font: {
                                    family: 'Tajawal',
                                    size: 12
                                }
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.05)'
                            }
                        }
                    }
                }
            });
        }

        function createWeeklyChart(data) {
    const ctx = document.getElementById('weeklyChart').getContext('2d');
    
    // حساب التقدم الحقيقي لكل أسبوع
    const weeklyProgress = calculateWeeklyProgress(data);
    
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: ['الأسبوع 1', 'الأسبوع 2', 'الأسبوع 3', 'الأسبوع 4'],
            datasets: [{
                label: 'النقاط المكتسبة',
                data: weeklyProgress,
                borderColor: '#FF9F40',
                backgroundColor: 'rgba(255, 159, 64, 0.1)',
                borderWidth: 3,
                tension: 0.4,
                fill: true,
                pointRadius: 6,
                pointBackgroundColor: '#FF9F40',
                pointBorderColor: '#fff',
                pointBorderWidth: 2
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: true,
            plugins: {
                legend: {
                    display: true,
                    labels: {
                        color: '#e0e7ff',
                        font: {
                            family: 'Tajawal',
                            size: 14
                        }
                    }
                },
                tooltip: {
                    backgroundColor: 'rgba(10, 14, 39, 0.9)',
                    titleColor: '#e0e7ff',
                    bodyColor: '#e0e7ff',
                    borderColor: 'rgba(255, 159, 64, 0.5)',
                    borderWidth: 1,
                    padding: 12,
                    titleFont: {
                        family: 'Tajawal',
                        size: 14
                    },
                    bodyFont: {
                        family: 'Tajawal',
                        size: 13
                    },
                    callbacks: {
                        label: function(context) {
                            return 'النقاط: ' + context.parsed.y;
                        }
                    }
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        color: '#e0e7ff',
                        font: {
                            family: 'Tajawal',
                            size: 12
                        }
                    },
                    grid: {
                        color: 'rgba(255, 255, 255, 0.1)'
                    }
                },
                x: {
                    ticks: {
                        color: '#e0e7ff',
                        font: {
                            family: 'Tajawal',
                            size: 12
                        }
                    },
                    grid: {
                        color: 'rgba(255, 255, 255, 0.05)'
                    }
                }
            }
        }
    });
}

// دالة جديدة لحساب التقدم الأسبوعي الحقيقي
function calculateWeeklyProgress(data) {
    const weeklyPoints = [0, 0, 0, 0]; // 4 أسابيع
    
    // 1. من الأسئلة الشخصية
    for (let i = 1; i <= 4; i++) {
        const key = `personalMap.question${i}`;
        if (data[key] && data[key].date) {
            const week = getWeekFromDate(data[key].date);
            if (week >= 0 && week < 4) {
                weeklyPoints[week] += data[key].points || 0;
            }
        }
    }
    
    // 2. من المقياس
    if (data['scale.history']) {
        data['scale.history'].forEach(entry => {
            const week = (entry.week || 1) - 1; // تحويل من 1-4 إلى 0-3
            if (week >= 0 && week < 4) {
                weeklyPoints[week] += 15; // نقاط المقياس
            }
        });
    }
    
    // 3. من طقس الصباح
    if (data['dailyTools.morningRitual.entries']) {
        data['dailyTools.morningRitual.entries'].forEach(entry => {
            if (entry.completed && entry.date) {
                const week = getWeekFromDate(entry.date);
                if (week >= 0 && week < 4) {
                    weeklyPoints[week] += 3;
                }
            }
        });
    }
    
    // 4. من اليوميات
    if (data['dailyTools.journal.entries']) {
        data['dailyTools.journal.entries'].forEach(entry => {
            if (entry.date) {
                const week = getWeekFromDate(entry.date);
                if (week >= 0 && week < 4) {
                    weeklyPoints[week] += 5;
                }
            }
        });
    }
    
    // 5. من الرفيق
    if (data['companion.meetings']) {
        data['companion.meetings'].forEach(meeting => {
            const week = (meeting.weekNumber || 1) - 1;
            if (week >= 0 && week < 4) {
                weeklyPoints[week] += 25;
            }
        });
    }
    
    // 6. من تأملات الركائز
    const pillarReflections = {
        'courage': { points: 15, key: 'pillars.courage.reflection' },
        'mirror': { points: 20, key: 'pillars.mirror.reflection' },
        'action': { points: 20, key: 'pillars.action.reflection' },
        'witness': { points: 30, key: 'pillars.witness.reflection' }
    };
    
    Object.values(pillarReflections).forEach(pillar => {
        if (data[pillar.key] && data[pillar.key].date) {
            const week = getWeekFromDate(data[pillar.key].date);
            if (week >= 0 && week < 4) {
                weeklyPoints[week] += pillar.points;
            }
        }
    });
    
    console.log('📊 النقاط الأسبوعية الحقيقية:', weeklyPoints);
    return weeklyPoints;
}

// دالة مساعدة لحساب الأسبوع من التاريخ
function getWeekFromDate(dateString) {
    if (!dateString) return 0;
    
    // التاريخ بصيغة YYYY-MM-DD أو ISO
    const date = new Date(dateString);
    const courseStartDate = new Date('2025-01-01'); // غيّر هذا لتاريخ بداية الدورة الحقيقي
    
    // حساب الفرق بالأيام
    const diffTime = date - courseStartDate;
    const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
    
    // حساب الأسبوع (0-3)
    const week = Math.floor(diffDays / 7);
    
    return Math.max(0, Math.min(3, week)); // تأكد أنه بين 0 و 3
}

        function showError() {
            document.getElementById('loadingState').innerHTML = `
                <i class="fas fa-exclamation-triangle" style="font-size: 4rem; color: var(--danger);"></i>
                <h2 style="margin: 20px 0;">لم يتم تحديد الدورة</h2>
                <p style="color: rgba(255,255,255,0.7);">يرجى فتح هذه الصفحة من داخل الدورة</p>
                <button onclick="window.location.href='./my-courses__4_.html'" 
                        style="margin-top: 20px; padding: 12px 30px; background: linear-gradient(135deg, #FF9F40, #FFB627); 
                        color: white; border: none; border-radius: 10px; font-size: 1.1rem; cursor: pointer;">
                    العودة للدورات
                </button>
            `;
        }
    </script>
</body>
</html>
