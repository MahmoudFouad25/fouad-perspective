<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة دورات إنسان</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.header{background:#1e293b;padding:20px 30px;border-bottom:1px solid #334155;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:22px;color:#3b82f6}
.header a{color:#94a3b8;text-decoration:none;font-size:14px}
.container{max-width:900px;margin:40px auto;padding:0 20px}
.btn{padding:12px 28px;border:none;border-radius:8px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:all .3s}
.btn-add{background:linear-gradient(135deg,#3b82f6,#10b981);color:#fff;margin-bottom:30px}
.btn-add:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(59,130,246,.3)}
.btn-save{background:#3b82f6;color:#fff}
.btn-save:hover{background:#2563eb}
.btn-cancel{background:#334155;color:#e2e8f0}
.btn-cancel:hover{background:#475569}
.btn-del{background:#ef4444;color:#fff;padding:8px 16px;font-size:13px}
.btn-del:hover{background:#dc2626}
.btn-edit{background:#334155;color:#e2e8f0;padding:8px 16px;font-size:13px}
.btn-edit:hover{background:#475569}

/* Cards */
.course-list{display:flex;flex-direction:column;gap:16px}
.admin-card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:24px;display:flex;align-items:center;gap:20px;transition:all .3s}
.admin-card:hover{border-color:rgba(59,130,246,.3)}
.admin-card img{width:100px;height:70px;object-fit:cover;border-radius:8px;flex-shrink:0}
.admin-card .info{flex:1}
.admin-card .info h3{font-size:18px;color:#fff;margin-bottom:6px}
.admin-card .info p{font-size:13px;color:#94a3b8}
.admin-card .actions{display:flex;gap:8px}
.status-badge{display:inline-block;font-size:11px;padding:3px 10px;border-radius:12px;margin-top:4px}
.status-published{background:rgba(16,185,129,.15);color:#34d399;border:1px solid rgba(16,185,129,.3)}
.status-draft{background:rgba(251,191,36,.1);color:#fbbf24;border:1px solid rgba(251,191,36,.2)}
.order-num{font-size:24px;font-weight:700;color:#3b82f6;min-width:36px;text-align:center}

/* Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto}
.modal-bg.show{display:flex}
.modal{background:#1e293b;border:1px solid #334155;border-radius:16px;width:100%;max-width:640px;padding:36px}
.modal h2{font-size:22px;color:#3b82f6;margin-bottom:24px}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:14px;color:#94a3b8;margin-bottom:6px;font-weight:500}
.form-group input,.form-group textarea,.form-group select{width:100%;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:12px 16px;color:#e2e8f0;font-family:inherit;font-size:15px;transition:border-color .3s}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{outline:none;border-color:#3b82f6}
.form-group textarea{min-height:100px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-buttons{display:flex;gap:12px;justify-content:flex-end;margin-top:28px}

.empty-state{text-align:center;padding:60px;color:#94a3b8}
.empty-state span{font-size:48px;display:block;margin-bottom:12px}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#10b981;color:#fff;padding:14px 28px;border-radius:10px;font-weight:600;z-index:2000;display:none;box-shadow:0 8px 24px rgba(16,185,129,.3)}
.toast.show{display:block;animation:slideDown .4s ease}
@keyframes slideDown{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

@media(max-width:600px){
  .form-row{grid-template-columns:1fr}
  .admin-card{flex-direction:column;text-align:center}
  .admin-card .actions{justify-content:center}
}
</style>
</head>
<body>

<div class="header">
  <h1>🎛️ إدارة دورات إنسان</h1>
  <a href="index.html">← العودة للصفحة الرئيسية</a>
</div>

<div class="container">
  <button class="btn btn-add" onclick="openModal()">+ إضافة دورة جديدة</button>
  <div id="courseList" class="course-list">
    <div class="empty-state"><span>⏳</span>جاري التحميل...</div>
  </div>
</div>

<!-- Modal -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <h2 id="modalTitle">إضافة دورة جديدة</h2>
    <input type="hidden" id="editId">
    
    <div class="form-group">
      <label>عنوان الدورة *</label>
      <input type="text" id="fTitle" placeholder="مثال: رحلة الأشواق التسعة">
    </div>
    
    <div class="form-group">
      <label>وصف مختصر</label>
      <textarea id="fDesc" placeholder="وصف يظهر في البطاقة..."></textarea>
    </div>
    
    <div class="form-row">
      <div class="form-group">
        <label>💰 السعر</label>
        <select id="fPrice">
          <option value="free">مجانية 🎁</option>
          <option value="paid">مدفوعة 💎</option>
        </select>
      </div>
      <div class="form-group">
        <label>📋 الحالة</label>
        <select id="fStatus">
          <option value="published">منشورة ✅</option>
          <option value="draft">مسودة 📝</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>🎬 نوع المحتوى</label>
        <select id="fSessionType" onchange="toggleDelivery()">
          <option value="recorded">دورة مسجلة 🎥</option>
          <option value="live">لقاءات حية مباشرة 🔴</option>
        </select>
      </div>
      <div class="form-group" id="deliveryGroup" style="display:none">
        <label>📍 طريقة اللقاء</label>
        <select id="fDelivery">
          <option value="online">أونلاين 💻</option>
          <option value="offline">في قاعة تدريبية 🏛️</option>
        </select>
      </div>
    </div>
    
    <div class="form-group">
      <label>رابط صورة الغلاف (URL)</label>
      <input type="url" id="fImg" placeholder="https://...">
    </div>
    
    <div class="form-group">
      <label>رابط صفحة الحجز / التفاصيل *</label>
      <input type="url" id="fLink" placeholder="https://...">
    </div>
    
    <div class="form-group">
      <label>ترتيب العرض (رقم)</label>
      <input type="number" id="fOrder" value="1" min="1">
    </div>
    
    <div class="form-buttons">
      <button class="btn btn-cancel" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-save" onclick="saveCourse()">💾 حفظ</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDHg0VrivE3C9A7jvzRu7lQgudLvcD_Fxk",
  authDomain: "fouad-perspective.firebaseapp.com",
  projectId: "fouad-perspective",
  storageBucket: "fouad-perspective.appspot.com",
  messagingSenderId: "564654107574",
  appId: "1:564654107574:web:baebb660288b22f16213e6"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const COL = 'insan_courses';

  function toggleDelivery(){
  var st=document.getElementById('fSessionType').value;
  document.getElementById('deliveryGroup').style.display=st==='live'?'block':'none';
}
// Load
async function loadCourses(){
  const list = document.getElementById('courseList');
  try{
    const snap = await db.collection(COL).orderBy('order','asc').get();
    if(snap.empty){
      list.innerHTML='<div class="empty-state"><span>📭</span>لا توجد دورات بعد. اضغط "إضافة دورة جديدة" للبدء.</div>';
      return;
    }
    list.innerHTML = snap.docs.map(doc=>{
      const d = doc.data();
      const statusClass = d.status==='published'?'status-published':'status-draft';
      const statusText = d.status==='published'?'منشورة':'مسودة';
      return `<div class="admin-card">
        <div class="order-num">${d.order||'-'}</div>
        ${d.thumbnailUrl?`<img src="${d.thumbnailUrl}" alt="">`:``}
        <div class="info">
          <h3>${d.title||'بدون عنوان'}</h3>
          <p>${(d.shortDesc||'').substring(0,80)}</p>
          <span class="status-badge ${statusClass}">${statusText}</span>
          <span class="status-badge" style="background:rgba(59,130,246,.1);color:#60a5fa;border:1px solid rgba(59,130,246,.2)">${d.priceType==='free'?'🎁 مجانية':'💎 مدفوعة'}</span>
          <span class="status-badge" style="background:rgba(239,68,68,.08);color:#f87171;border:1px solid rgba(239,68,68,.2)">${d.sessionType==='live'?'🔴 لقاء حي':'🎥 مسجلة'}</span>
          ${d.sessionType==='live'&&d.deliveryMode?`<span class="status-badge" style="background:rgba(16,185,129,.08);color:#34d399;border:1px solid rgba(16,185,129,.2)">${d.deliveryMode==='offline'?'🏛️ قاعة تدريبية':'💻 أونلاين'}</span>`:''}
        </div>
        <div class="actions">
          <button class="btn btn-edit" onclick="editCourse('${doc.id}')">✏️ تعديل</button>
          <button class="btn btn-del" onclick="deleteCourse('${doc.id}','${(d.title||'').replace(/'/g,"\\'")}')">🗑️</button>
        </div>
      </div>`;
    }).join('');
  }catch(e){
    console.error(e);
    list.innerHTML='<div class="empty-state"><span>⚠️</span>حدث خطأ في التحميل</div>';
  }
}

function openModal(id){
  document.getElementById('modal').classList.add('show');
  document.getElementById('modalTitle').textContent = id ? 'تعديل الدورة' : 'إضافة دورة جديدة';
  if(!id) clearForm();
}
function closeModal(){
  document.getElementById('modal').classList.remove('show');
  clearForm();
}
function clearForm(){
  ['fTitle','fDesc','fImg','fLink','editId'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('fOrder').value='1';
  document.getElementById('fPrice').value='free';
  document.getElementById('fStatus').value='published';
  document.getElementById('fSessionType').value='recorded';
  document.getElementById('fDelivery').value='online';
  document.getElementById('deliveryGroup').style.display='none';
}


async function editCourse(id){
  const doc = await db.collection(COL).doc(id).get();
  if(!doc.exists)return;
  const d=doc.data();
  document.getElementById('editId').value=id;
  document.getElementById('fTitle').value=d.title||'';
  document.getElementById('fDesc').value=d.shortDesc||d.description||'';
  document.getElementById('fPrice').value=d.priceType||'free';
  document.getElementById('fStatus').value=d.status||'published';
  document.getElementById('fImg').value=d.thumbnailUrl||'';
  document.getElementById('fLink').value=d.link||d.bookingUrl||'';
  document.getElementById('fOrder').value=d.order||1;
  document.getElementById('fSessionType').value=d.sessionType||'recorded';
  document.getElementById('fDelivery').value=d.deliveryMode||'online';
  document.getElementById('deliveryGroup').style.display=(d.sessionType==='live')?'block':'none';
  openModal(id);
}

async function saveCourse(){
  const title=document.getElementById('fTitle').value.trim();
  const link=document.getElementById('fLink').value.trim();
  if(!title){alert('عنوان الدورة مطلوب');return}
  if(!link){alert('رابط الحجز مطلوب');return}
  
  const st=document.getElementById('fSessionType').value;
  const data={
    title,
    shortDesc:document.getElementById('fDesc').value.trim(),
    description:document.getElementById('fDesc').value.trim(),
    priceType:document.getElementById('fPrice').value,
    sessionType:st,
    deliveryMode:st==='live'?document.getElementById('fDelivery').value:'',
    status:document.getElementById('fStatus').value,
    thumbnailUrl:document.getElementById('fImg').value.trim(),
    link:link,
    bookingUrl:link,
    order:parseInt(document.getElementById('fOrder').value)||1,
    updatedAt:new Date().toISOString()
  };
  
  const editId=document.getElementById('editId').value;
  try{
    if(editId){
      await db.collection(COL).doc(editId).update(data);
      showToast('✅ تم تحديث الدورة بنجاح');
    }else{
      data.createdAt=new Date().toISOString();
      await db.collection(COL).add(data);
      showToast('✅ تم إضافة الدورة بنجاح');
    }
    closeModal();
    loadCourses();
  }catch(e){
    console.error(e);
    alert('حدث خطأ: '+e.message);
  }
}

async function deleteCourse(id,title){
  if(!confirm(`هل أنت متأكد من حذف "${title}"؟`))return;
  try{
    await db.collection(COL).doc(id).delete();
    showToast('🗑️ تم حذف الدورة');
    loadCourses();
  }catch(e){alert('خطأ: '+e.message)}
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

loadCourses();
</script>
</body>
</html>
