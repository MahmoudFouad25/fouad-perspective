<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الاستقبال والإصغاء — Reignite</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{ --ax-bg:#0f172a; --ax-blue:#3b82f6; --ax-green:#10b981; --ax-gold:#fbbf24;
      --ax-purple:#a78bfa; --ax-text:#e2e8f0; --ax-muted:#94a3b8; --ax-line:#2a3850; --ax-serif:'Amiri',serif; }
    *{box-sizing:border-box} html,body{margin:0;padding:0}
    body{ background:radial-gradient(1200px 620px at 50% -12%, #1a2332 0%, #0f172a 62%);
      color:var(--ax-text); font-family:'Tajawal',sans-serif; min-height:100vh;
      -webkit-font-smoothing:antialiased; line-height:1.9; }
    .rcp-shell{ max-width:760px; margin:0 auto; padding:26px 18px 90px; }
    .rcp-head{ text-align:center; margin-bottom:24px; }
    .rcp-head .ico{ font-size:34px; margin-bottom:6px; }
    .rcp-head .t{ font-family:var(--ax-serif); color:var(--ax-gold); font-size:24px; }
    .rcp-welcome{ font-family:var(--ax-serif); font-size:21px; line-height:1.95; color:#eaf1ff;
      background:rgba(167,139,250,.08); border:1px solid rgba(167,139,250,.28);
      border-inline-start:4px solid var(--ax-purple); border-radius:14px; padding:22px 24px; margin-bottom:22px; }
    .rcp-block{ margin-bottom:20px; }
    .rcp-h{ color:var(--ax-gold); font-family:var(--ax-serif); font-size:18px; margin-bottom:8px; }
    .rcp-p{ color:#cbd5e1; font-size:16px; line-height:2; margin:0; }
    .rcp-closing{ margin-top:8px; color:var(--ax-green); font-family:var(--ax-serif); font-size:18px;
      line-height:1.9; text-align:center; padding-top:18px; border-top:1px solid var(--ax-line); }
    .rcp-actions{ margin-top:30px; text-align:center; }
    .rcp-btn{ display:inline-block; font-family:inherit; font-size:17px; font-weight:800; cursor:pointer;
      padding:15px 44px; border-radius:14px; border:none; color:#fff;
      background:linear-gradient(135deg, var(--ax-blue), var(--ax-green));
      box-shadow:0 8px 26px rgba(59,130,246,.35); transition:transform .15s; }
    .rcp-btn:hover{ transform:translateY(-2px); }
    .rcp-btn:disabled{ opacity:.6; cursor:default; transform:none; }
    .rcp-done{ display:none; background:rgba(16,185,129,.12); border:2px solid rgba(16,185,129,.45);
      color:var(--ax-green); border-radius:14px; padding:16px 24px; font-size:16px; font-weight:700; }
    .rcp-err{ text-align:center; color:var(--ax-muted); padding:60px 20px; font-size:16px; }
  </style>
</head>
<body>
  <div class="rcp-shell">
    <div class="rcp-head">
      <div class="ico">📖</div>
      <div class="t" id="rcpTitle">الاستقبال والإصغاء</div>
    </div>

    <div id="rcpContent"><div class="rcp-err">جاري تحميل المحتوى…</div></div>

    <div class="rcp-actions" id="rcpActions" style="display:none;">
      <button class="rcp-btn" id="rcpCompleteBtn">✔ أتممت القراءة — ابدأ رحلتي</button>
    </div>
    <div class="rcp-actions">
      <div class="rcp-done" id="rcpDoneBadge">✓ أتممت قراءة التمهيد — يمكنك العودة إليه في أيّ وقت</div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="axes-config.js"></script>
  <script src="reignite-embed.js"></script>
  <script src="axes-content.js"></script>
  <script src="axes-bridge.js"></script>
  <script src="axes-store.js"></script>
  <script src="axes-render.js"></script>
  <script src="reignite-roster.js"></script>
  <script src="reignite-flow.js"></script>
  

  <script>
  (function(){
    "use strict";
    var F = window.REIGNITE_FLOW, EMB = window.REIGNITE_EMBED;
    function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    /* ── عرض المحتوى من المصدر الموحّد reignite-flow.js ── */
    var p = (F && F.phases) ? F.phases.reception : null;
    var box = document.getElementById('rcpContent');
    if(!p){
      box.innerHTML = '<div class="rcp-err">محتوى التمهيد غير متاح حاليًا.</div>';
      return;
    }
    if(p.title) document.getElementById('rcpTitle').textContent = p.title;

    var h = '';
    if(p.welcome) h += '<div class="rcp-welcome">'+esc(p.welcome)+'</div>';
    (p.blocks||[]).forEach(function(b){
      h += '<div class="rcp-block"><div class="rcp-h">'+esc(b.h)+'</div><p class="rcp-p">'+esc(b.p)+'</p></div>';
    });
    if(p.closing) h += '<div class="rcp-closing">'+esc(p.closing)+'</div>';
    box.innerHTML = h;

    /* ── منطق التضمين ── */
    var btn   = document.getElementById('rcpCompleteBtn');
    var badge = document.getElementById('rcpDoneBadge');
    var actions = document.getElementById('rcpActions');
    var completed = false;

    function showDone(){
      completed = true;
      actions.style.display = 'none';
      badge.style.display = 'inline-block';
    }

    if(EMB && EMB.isEmbedded()){
      /* مضمّنة جوّه الدورة: نسأل المنصّة الأوّل لو سبق الإكمال */
      EMB.onSavedData(function(data){
        if(data && data.completed){ showDone(); }
        else { actions.style.display = 'block'; }
      });
      EMB.requestSavedData();

      /* احتياط: لو المنصّة ما ردّتش خلال ثانيتين نظهر الزرّ */
      setTimeout(function(){
        if(!completed && actions.style.display === 'none') actions.style.display = 'block';
      }, 2000);

      btn.addEventListener('click', function(){
        if(completed) return;
        btn.disabled = true;
        btn.textContent = 'جاري الحفظ…';
        var sent = EMB.complete({ type:'reception-read', readConfirmed:true });
        if(sent){ setTimeout(showDone, 800); }
        else { btn.disabled = false; btn.textContent = '✔ أتممت القراءة — ابدأ رحلتي'; }
      });

      EMB.onPointsSummary(function(){ showDone(); });
    }
    /* وضع مستقلّ: قراءة فقط بدون زرّ إكمال */
  })();
  </script>
</body>
</html>
