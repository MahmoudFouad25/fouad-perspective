<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مرآة النموذج الإدراكي — Reignite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Readex+Pro:wght@200;300;400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1420;
  --bg-2:#121a28;
  --ink:#e8edf4;
  --ink-soft:#c3cdda;
  --ink-mute:#7d8a9c;
  --exec:#4a90d9;     /* التنفيذ — أزرق فولاذي */
  --exec-soft:#7bb0e8;
  --innov:#c9a227;    /* الابتكار — ذهبي */
  --innov-soft:#e0c45e;
  --eval:#5fb89a;     /* التقييم — أخضر مزرقّ */
  --eval-soft:#8fd4bb;
  --line:rgba(232,237,244,.10);
  --line-soft:rgba(232,237,244,.06);
  --amiri:'Amiri',serif;
  --display:'Readex Pro',sans-serif;
  --body:'IBM Plex Sans Arabic',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--body)}

#deck{position:fixed;inset:0;overflow:hidden}
.slide{
  position:absolute;inset:0;
  display:flex;flex-direction:column;justify-content:center;
  padding:clamp(28px,5vw,90px);
  opacity:0;visibility:hidden;transform:scale(1.012);
  transition:opacity .7s ease,transform .7s ease,visibility .7s;
  background:
    radial-gradient(115% 75% at 80% 15%, rgba(74,144,217,.08), transparent 60%),
    radial-gradient(90% 70% at 14% 90%, rgba(95,184,154,.06), transparent 55%),
    var(--bg);
}
.slide.active{opacity:1;visibility:visible;transform:scale(1);z-index:2}
.slide.prev{z-index:1}
.slide::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.4;
  background-image:radial-gradient(rgba(255,255,255,.02) 1px,transparent 1px);
  background-size:3px 3px;mix-blend-mode:screen;
}
.wrap{position:relative;z-index:3;max-width:1180px;margin:0 auto;width:100%}

/* atoms */
.eyebrow{
  display:inline-flex;align-items:center;gap:12px;
  font-family:var(--display);font-weight:500;
  font-size:clamp(11px,1vw,14px);letter-spacing:.16em;
  color:var(--exec-soft);margin-bottom:26px;
}
.eyebrow .pip{width:7px;height:7px;border-radius:2px;background:var(--exec);box-shadow:0 0 12px var(--exec);transform:rotate(45deg)}
.eyebrow .ln{width:46px;height:1px;background:linear-gradient(90deg,var(--exec-soft),transparent)}

h1{font-family:var(--display);font-weight:700;line-height:1.12;letter-spacing:-.01em}
.k-huge{font-size:clamp(38px,6.4vw,86px)}
.k-big{font-size:clamp(30px,4.8vw,60px)}
.k-mid{font-size:clamp(24px,3.4vw,44px)}
.grad{background:linear-gradient(100deg,var(--exec) 0%,var(--innov-soft) 55%,var(--eval) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:clamp(16px,1.7vw,23px);line-height:1.85;color:var(--ink-soft);font-weight:300;max-width:62ch}
.amiri{font-family:var(--amiri)}

.r{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s ease}
.slide.active .r.show{opacity:1;transform:none}

#bar{position:fixed;top:0;right:0;left:0;height:3px;background:rgba(255,255,255,.05);z-index:50}
#bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--exec),var(--innov),var(--eval));transition:width .5s ease}
#counter{position:fixed;bottom:22px;left:26px;z-index:50;font-family:var(--display);font-size:12px;letter-spacing:.14em;color:var(--ink-mute)}
#counter b{color:var(--exec-soft)}
#hint{position:fixed;bottom:22px;right:26px;z-index:50;font-size:12px;color:var(--ink-mute);opacity:.7}
.kbd{display:inline-block;border:1px solid var(--line);border-radius:5px;padding:1px 7px;color:var(--ink-soft);font-family:var(--display);font-size:11px;margin:0 2px}

/* three-machine signature */
.machines{display:flex;gap:clamp(14px,2.5vw,40px);justify-content:center;align-items:stretch;margin-top:36px;flex-wrap:wrap}
.machine{flex:1;min-width:230px;max-width:330px;border-radius:16px;padding:24px 22px;border:1px solid var(--line);
  background:linear-gradient(160deg,rgba(255,255,255,.025),transparent);position:relative;overflow:hidden}
.machine .verb{font-family:var(--amiri);font-size:clamp(24px,2.6vw,34px);font-weight:700;margin-bottom:4px}
.machine .ar-axis{font-family:var(--display);font-size:13px;letter-spacing:.1em;color:var(--ink-mute);margin-bottom:16px}
.machine .desc{font-size:14px;line-height:1.65;color:var(--ink-soft);font-weight:300}
.machine.exec{border-color:rgba(74,144,217,.3)} .machine.exec .verb{color:var(--exec-soft)}
.machine.innov{border-color:rgba(201,162,39,.3)} .machine.innov .verb{color:var(--innov-soft)}
.machine.eval{border-color:rgba(95,184,154,.3)} .machine.eval .verb{color:var(--eval-soft)}
.machine .icon{height:60px;margin-bottom:14px;display:flex;align-items:center;justify-content:center}
.machine .icon svg{height:100%;width:auto;overflow:visible}

/* axis header */
.axis-head{display:flex;align-items:baseline;gap:20px;flex-wrap:wrap;margin-bottom:8px}
.axis-verb{font-family:var(--amiri);font-size:clamp(15px,1.5vw,21px)}
.axis-tag{font-family:var(--display);font-size:clamp(12px,1.1vw,15px);font-weight:500;border-radius:30px;padding:4px 16px}
.exec .axis-verb,.exec-c{color:var(--exec-soft)}
.exec .axis-tag{border:1px solid rgba(74,144,217,.35);color:var(--exec-soft)}
.innov .axis-verb{color:var(--innov-soft)}
.innov .axis-tag{border:1px solid rgba(201,162,39,.35);color:var(--innov-soft)}
.eval .axis-verb{color:var(--eval-soft)}
.eval .axis-tag{border:1px solid rgba(95,184,154,.35);color:var(--eval-soft)}

/* type rows */
.types{display:flex;flex-direction:column;gap:18px;margin-top:28px}
.type-row{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:start;
  border-right:2px solid var(--line);padding:4px 22px 4px 0;position:relative}
.type-row::before{content:"";position:absolute;right:-5px;top:10px;width:8px;height:8px;border-radius:2px;transform:rotate(45deg)}
.exec .type-row::before{background:var(--exec)} .innov .type-row::before{background:var(--innov)} .eval .type-row::before{background:var(--eval)}
.type-glyph{font-family:var(--display);font-weight:600;font-size:clamp(13px,1.2vw,16px);color:var(--ink);white-space:nowrap;padding-top:1px;min-width:130px}
.type-glyph small{display:block;color:var(--ink-mute);font-weight:300;font-size:.78em;margin-top:3px}
.type-body{font-size:clamp(14px,1.45vw,18px);line-height:1.7;color:var(--ink-soft);font-weight:300}
.exec .hl{color:var(--exec-soft);font-weight:500} .innov .hl{color:var(--innov-soft);font-weight:500} .eval .hl{color:var(--eval-soft);font-weight:500}
.verb-chip{display:inline-block;font-family:var(--amiri);font-size:1em;border-bottom:1px dashed currentColor;padding-bottom:1px}
.exec .verb-chip{color:var(--exec-soft)} .innov .verb-chip{color:var(--innov-soft)} .eval .verb-chip{color:var(--eval-soft)}

/* burnout link */
.link-block{margin-top:32px;border-radius:14px;padding:24px 28px;position:relative;overflow:hidden;
  border:1px solid var(--line);background:linear-gradient(120deg,rgba(255,255,255,.03),transparent)}
.exec .link-block{border-color:rgba(74,144,217,.22);background:linear-gradient(120deg,rgba(74,144,217,.08),transparent)}
.innov .link-block{border-color:rgba(201,162,39,.22);background:linear-gradient(120deg,rgba(201,162,39,.08),transparent)}
.eval .link-block{border-color:rgba(95,184,154,.22);background:linear-gradient(120deg,rgba(95,184,154,.08),transparent)}
.link-block .lab{font-family:var(--display);font-size:12px;letter-spacing:.12em;margin-bottom:9px;font-weight:600}
.exec .link-block .lab{color:var(--exec-soft)} .innov .link-block .lab{color:var(--innov-soft)} .eval .link-block .lab{color:var(--eval-soft)}
.link-block p{font-size:clamp(15px,1.5vw,19px);line-height:1.75;color:var(--ink);font-weight:300}

/* rooting */
.root-card{border-radius:18px;padding:clamp(30px,4vw,56px);position:relative;
  background:linear-gradient(160deg,rgba(201,162,39,.06),transparent);border:1px solid var(--line)}
.root-card .verse{font-family:var(--amiri);font-size:clamp(22px,3vw,38px);line-height:1.7;color:var(--innov-soft)}
.root-card .src{font-family:var(--display);font-size:13px;color:var(--ink-mute);margin-top:18px;letter-spacing:.08em}

/* three verbs of mind (rooting) */
.verbs3{display:flex;gap:14px;flex-wrap:wrap;margin-top:24px}
.verb-cell{flex:1;min-width:200px;border:1px solid var(--line);border-radius:13px;padding:18px 20px}
.verb-cell .ayah{font-family:var(--amiri);font-size:clamp(17px,1.7vw,22px);margin-bottom:8px}
.verb-cell .gl{font-size:13.5px;color:var(--ink-soft);font-weight:300;line-height:1.6}
.verb-cell.c1{border-color:rgba(74,144,217,.3)} .verb-cell.c1 .ayah{color:var(--exec-soft)}
.verb-cell.c2{border-color:rgba(201,162,39,.3)} .verb-cell.c2 .ayah{color:var(--innov-soft)}
.verb-cell.c3{border-color:rgba(95,184,154,.3)} .verb-cell.c3 .ayah{color:var(--eval-soft)}

/* interaction */
.ask{display:flex;align-items:center;gap:16px;margin-top:28px;font-family:var(--display);font-weight:400;
  font-size:clamp(14px,1.4vw,18px)}
.ask .mic{width:34px;height:34px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;flex:none}
.exec-ask{color:var(--exec-soft)} .innov-ask{color:var(--innov-soft)} .eval-ask{color:var(--eval-soft)}

.leave{margin-top:28px;font-family:var(--amiri);font-style:italic;font-size:clamp(18px,2.1vw,28px);
  color:var(--ink);line-height:1.6;padding-right:24px;border-right:3px solid}
.exec .leave{border-color:var(--exec)} .innov .leave{border-color:var(--innov)} .eval .leave{border-color:var(--eval)}

.sec-num{font-family:var(--amiri);font-size:clamp(60px,12vw,150px);line-height:.8;font-weight:700}

.center{align-items:center;text-align:center}
.center .wrap{display:flex;flex-direction:column;align-items:center}
.center .lead{text-align:center}
.bignote{font-family:var(--amiri);font-size:clamp(20px,2.4vw,32px);color:var(--innov-soft);line-height:1.6}

@media (max-width:680px){
  .type-row{grid-template-columns:1fr;gap:8px}
  .type-glyph{min-width:0}
  #hint{display:none}
  .slide{padding:24px 20px}
  .machines{gap:14px}
}
@media (prefers-reduced-motion:reduce){
  .slide,.r{transition:opacity .25s ease}.slide{transform:none}
  .flow{animation:none!important}
}
</style>
</head>
<body>

<div id="bar"><i></i></div>
<div id="deck"></div>
<div id="counter"><b id="cnum">01</b> / <span id="ctot">00</span></div>
<div id="hint"><span class="kbd">→</span> أو مسافة للتقدّم · <span class="kbd">F</span> ملء الشاشة</div>

<script>
/* machine icons: قالب / ورشة / ميزان */
function iconExec(){return `<svg viewBox="0 0 120 60" aria-hidden="true">
  <rect x="20" y="14" width="80" height="32" rx="3" fill="none" stroke="var(--exec)" stroke-width="2"/>
  <rect x="32" y="24" width="56" height="12" rx="2" fill="var(--exec)" opacity=".35"/>
  <path d="M60 2 L60 12" stroke="var(--exec-soft)" stroke-width="2"/>
  <path d="M54 8 L60 13 L66 8" fill="none" stroke="var(--exec-soft)" stroke-width="2"/>
</svg>`;}
function iconInnov(){return `<svg viewBox="0 0 120 60" aria-hidden="true">
  <circle cx="60" cy="30" r="6" fill="var(--innov)"/>
  <path d="M60 30 L30 12 M60 30 L96 14 M60 30 L26 46 M60 30 L92 48 M60 30 L60 6" stroke="var(--innov-soft)" stroke-width="1.6" opacity=".8"/>
  <circle cx="30" cy="12" r="3.5" fill="none" stroke="var(--innov-soft)" stroke-width="1.6"/>
  <circle cx="96" cy="14" r="3.5" fill="none" stroke="var(--innov-soft)" stroke-width="1.6"/>
  <circle cx="26" cy="46" r="3.5" fill="none" stroke="var(--innov-soft)" stroke-width="1.6"/>
  <circle cx="92" cy="48" r="3.5" fill="none" stroke="var(--innov-soft)" stroke-width="1.6"/>
  <circle cx="60" cy="6" r="3.5" fill="none" stroke="var(--innov-soft)" stroke-width="1.6"/>
</svg>`;}
function iconEval(){return `<svg viewBox="0 0 120 60" aria-hidden="true">
  <path d="M60 8 L60 46" stroke="var(--eval)" stroke-width="2"/>
  <path d="M30 18 L90 18" stroke="var(--eval)" stroke-width="2"/>
  <path d="M30 18 L22 34 M30 18 L38 34" stroke="var(--eval-soft)" stroke-width="1.6"/>
  <path d="M90 18 L82 30 M90 18 L98 30" stroke="var(--eval-soft)" stroke-width="1.6"/>
  <path d="M20 34 a10 6 0 0 0 20 0" fill="none" stroke="var(--eval-soft)" stroke-width="1.6"/>
  <path d="M80 30 a10 6 0 0 0 20 0" fill="none" stroke="var(--eval-soft)" stroke-width="1.6"/>
  <rect x="52" y="46" width="16" height="5" rx="1.5" fill="var(--eval)" opacity=".5"/>
</svg>`;}

const SLIDES=[];

/* 01 — title */
SLIDES.push({steps:3, build:()=>`
  <div class="wrap center">
    <div class="eyebrow r" data-step="0"><span class="pip"></span> المرآة الرابعة · Reignite <span class="ln"></span></div>
    <h1 class="k-huge r" data-step="1">مرآة النموذج الإدراكي</h1>
    <p class="lead r" data-step="2" style="margin-top:24px">
      عقلك بيعمل إيه بالمعلومة بعد ما توصل؟<br>
      <span class="amiri" style="color:var(--innov-soft);font-size:1.12em">معالجةُ المعطى بعد إحضاره</span>
    </p>
  </div>`});

/* 02 — opening: from/to */
SLIDES.push({steps:5, build:()=>`
  <div class="wrap">
    <div class="eyebrow r" data-step="0"><span class="pip"></span> المحطة ١ · الافتتاح</div>
    <h1 class="k-mid r" data-step="0" style="margin-bottom:34px">نزلنا تلات طبقات… ودي من جنس تاني</h1>
    <div style="display:flex;flex-direction:column;gap:18px;max-width:64ch">
      <div class="r" data-step="1" style="display:flex;gap:18px;align-items:baseline">
        <span class="amiri" style="color:var(--ink-mute);font-size:1.5em;min-width:90px">السلوك</span>
        <span class="lead" style="margin:0">جسمك بيعمل إيه — اللي يخرج منك</span></div>
      <div class="r" data-step="2" style="display:flex;gap:18px;align-items:baseline">
        <span class="amiri" style="color:var(--ink-mute);font-size:1.5em;min-width:90px">الانتباه</span>
        <span class="lead" style="margin:0">نظرك بيروح فين — اللي يدخل ليك</span></div>
      <div class="r" data-step="3" style="display:flex;gap:18px;align-items:baseline">
        <span class="amiri" style="color:var(--ink-mute);font-size:1.5em;min-width:90px">المشاعر</span>
        <span class="lead" style="margin:0">الإحساس بيحصله إيه — اللي يستقرّ جوّاك</span></div>
      <div class="r" data-step="4" style="display:flex;gap:18px;align-items:baseline;padding-top:6px;border-top:1px solid var(--line)">
        <span class="amiri grad" style="font-size:1.55em;min-width:90px">النموذج</span>
        <span class="lead" style="margin:0;color:var(--ink)">عقلك بيعمل <span style="color:var(--exec-soft)">إيه بالمعلومة</span> — بعد ما توصل</span></div>
    </div>
  </div>`});

/* 03 — the question / same news, three minds */
SLIDES.push({steps:3, build:()=>`
  <div class="wrap center">
    <div class="eyebrow r" data-step="0"><span class="pip"></span> السؤال الجوهريّ</div>
    <p class="lead r" data-step="1" style="margin-bottom:14px">وصلتك رسالة فيها خبر. في <span style="color:var(--exec-soft)">نفس اللحظة</span> اللي بتقروها فيها، عقلك مش بيستناها — بياخدها على طول ويعمل بيها حاجة.</p>
    <div class="r" data-step="2" class="bignote" style="margin-top:22px;max-width:60ch">
      وكل واحد فيكم بيعمل حاجة <span style="color:var(--innov-soft)">مختلفة خالص</span> بنفس الخبر — من غير ما يقرّر.
    </div>
    <p class="lead r" data-step="2" style="margin-top:26px;font-size:clamp(15px,1.6vw,20px)">المرآة دي مابتسألش «بتشوف إيه» ولا «بتحسّ بإيه» — بتسأل: <span style="color:var(--ink)">عقلك بيعالج المعلومة إزاي قبل ما تستأذنه؟</span></p>
  </div>`});

/* 04 — distinguish from attention */
SLIDES.push({steps:3, build:()=>`
  <div class="wrap center">
    <div class="eyebrow r" data-step="0"><span class="pip"></span> فرق لازم نثبّته</div>
    <h1 class="k-big r" data-step="1">الانتباه <span style="color:var(--ink-mute)">بينوّر</span>… والنموذج <span class="grad">بيحوّل</span></h1>
    <p class="lead r" data-step="2" style="margin-top:26px">الانتباه بيجيب المعلومة ويحطّها قدّام وعيك — وخلص شغله. النموذج بيبدأ <span style="color:var(--exec-soft)">بعد كده</span>: بياخد المعلومة الحاضرة ويعمل بيها حاجة. فيه فرق بين إن النور يقع على حاجة، وإن إيد تشتغل في الحاجة.</p>
    <div class="r" data-step="2" style="margin-top:24px;font-family:var(--amiri);font-size:clamp(18px,2.1vw,28px);color:var(--ink)">الانتباه <span style="color:var(--ink-mute)">نور</span> — والنموذج <span class="grad">إيد</span>.</div>
  </div>`});

/* 05 — rooting: three verbs of the mind */
SLIDES.push({steps:4, build:()=>`
  <div class="wrap">
    <div class="eyebrow r" data-step="0"><span class="pip"></span> التأصيل · وظائف العقل الثلاث</div>
    <p class="lead r" data-step="0" style="margin-bottom:6px">فرّق الغزّاليّ بين تلات وظايف للعقل، والقرآن نادى عليها بصيغٍ متمايزة لا مترادفة:</p>
    <div class="verbs3">
      <div class="verb-cell c1 r" data-step="1">
        <div class="ayah">﴿أَفَلَا يَعْقِلُونَ﴾</div>
        <div class="gl">يَعقل — يشتغل بالمعلوم ويطبّق ما يعرفه</div>
      </div>
      <div class="verb-cell c2 r" data-step="2">
        <div class="ayah">﴿أَفَلَا يَتَفَكَّرُونَ﴾</div>
        <div class="gl">يَتفكّر — يفتح المُغلق ويُخرج ما لم يكن</div>
      </div>
      <div class="verb-cell c3 r" data-step="3">
        <div class="ayah">﴿أَفَلَا يَتَدَبَّرُونَ﴾</div>
        <div class="gl">يَتدبّر — يقلّب الوجوه ويوازن قبل أن يحكم</div>
      </div>
    </div>
    <p class="lead r" data-step="3" style="margin-top:22px;font-size:clamp(15px,1.5vw,19px)">كلٌّ منّا يحمل الثلاث، لكنّ <span style="color:var(--ink)">واحدةً تتصدّر</span> فتصير الإطار الذي يرجع إليه العقل قبل غيره.</p>
  </div>`});

/* 06 — three machines overview (signature) */
SLIDES.push({steps:4, build:()=>`
  <div class="wrap">
    <div class="eyebrow r" data-step="0"><span class="pip"></span> القاعدة الكبيرة · تلات أدوات</div>
    <h1 class="k-mid r" data-step="0">نفس الخبر… بيدخل تلات آلات مختلفة</h1>
    <div class="machines">
      <div class="machine exec r" data-step="1">
        <div class="icon">${iconExec()}</div>
        <div class="verb">يَصبّ</div>
        <div class="ar-axis">التنفيذ</div>
        <div class="desc">قالب جاهز قبل المعلومة — يحطّ الخبر فيه فيخرج محكومًا عليه: صح/غلط، يخدم الناتج/لا، له سابقة/لا.</div>
      </div>

/* build & run */
const deck=document.getElementById('deck');
SLIDES.forEach((s,i)=>{const el=document.createElement('section');el.className='slide';el.dataset.idx=i;el.innerHTML=s.build();deck.appendChild(el);});
const slides=[...document.querySelectorAll('.slide')];
document.getElementById('ctot').textContent=String(slides.length).padStart(2,'0');
let cur=0, step=0;
const stepsOf=i=>SLIDES[i].steps||1;
function revealUpTo(el,n){el.querySelectorAll('.r').forEach(r=>{const st=parseInt(r.dataset.step||'0',10);r.classList.toggle('show',st<=n);});}
function render(){
  slides.forEach((s,i)=>{s.classList.toggle('active',i===cur);s.classList.toggle('prev',i<cur);});
  revealUpTo(slides[cur],step);
  document.querySelector('#bar>i').style.width=((cur+(step/Math.max(stepsOf(cur)-1,1)))/(slides.length-1)*100)+'%';
  document.getElementById('cnum').textContent=String(cur+1).padStart(2,'0');
}
function next(){if(step<stepsOf(cur)-1)step++;else if(cur<slides.length-1){cur++;step=0;}render();}
function prev(){if(step>0)step--;else if(cur>0){cur--;step=stepsOf(cur)-1;}render();}
render();
let introTimer=setInterval(()=>{if(cur===0&&step<stepsOf(0)-1){step++;render();}else clearInterval(introTimer);},520);
window.__jump=(i,s)=>{clearInterval(introTimer);cur=Math.max(0,Math.min(i,slides.length-1));step=Math.max(0,Math.min(s,stepsOf(cur)-1));render();};
document.addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();clearInterval(introTimer);next();}
  else if(['ArrowRight','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();clearInterval(introTimer);prev();}
  else if(e.key==='f'||e.key==='F'){if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();}
  else if(e.key==='Home'){cur=0;step=0;render();}
  else if(e.key==='End'){cur=slides.length-1;step=stepsOf(cur)-1;render();}
});
deck.addEventListener('click',e=>{clearInterval(introTimer);const x=e.clientX,w=window.innerWidth;if(x<w*0.5)next();else prev();});
let tx=0;
deck.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
deck.addEventListener('touchend',e=>{clearInterval(introTimer);const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)<40)return;if(dx>0)next();else prev();},{passive:true});
</script>
</body>
</html>
