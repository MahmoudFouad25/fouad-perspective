<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>مرآة الدوافع — Reignite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Readex+Pro:wght@300;400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#16110c;
  --bg2:#1d160f;
  --ink:#f3ead9;
  --muted:#a3927c;
  --faint:#6f6151;
  --line:rgba(243,234,217,.10);

  --gold:#e8b65e;     /* حب · السير · اشتعال */
  --gold-soft:#f0cd8a;
  --ember:#d8602f;    /* خوف · الفرار · احتراق */
  --ember-soft:#e8855a;
  --ash:#7b7066;      /* الغياب */
  --rose:#e08aa0;     /* محور الأنس */
  --teal:#5cb9a8;     /* محور اليقين */

  --accent:var(--gold);
  --accent-soft:var(--gold-soft);
  --serif:'Amiri',serif;
  --frame:'Readex Pro',sans-serif;
  --body:'IBM Plex Sans Arabic',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);}
body{
  font-family:var(--body);color:var(--ink);
  background:
    radial-gradient(1200px 700px at 75% -10%, rgba(232,182,94,.07), transparent 60%),
    radial-gradient(900px 700px at 10% 115%, rgba(216,96,47,.06), transparent 60%),
    var(--bg);
  -webkit-font-smoothing:antialiased;
}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:6vh 8vw;}
.slide{width:100%;max-width:1080px;}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.slide>*{animation:rise .55s cubic-bezier(.2,.7,.2,1) both;}

.kicker{font-family:var(--frame);font-weight:500;font-size:clamp(12px,1.5vw,15px);letter-spacing:.18em;
  color:var(--accent);text-transform:none;margin-bottom:2.2rem;display:flex;align-items:center;gap:.8rem;}
.kicker::before{content:"";width:34px;height:1px;background:var(--accent);opacity:.7;}

h1{font-family:var(--frame);font-weight:600;font-size:clamp(40px,7.5vw,86px);line-height:1.04;letter-spacing:-.01em;}
h2{font-family:var(--frame);font-weight:500;font-size:clamp(28px,4.6vw,52px);line-height:1.15;}
.sub{font-family:var(--serif);font-size:clamp(20px,3vw,32px);color:var(--accent-soft);margin-top:1.1rem;}
.lead{font-size:clamp(17px,2.2vw,23px);line-height:1.85;color:var(--muted);margin-top:1.6rem;max-width:30ch;}

.q-hero{font-family:var(--serif);font-size:clamp(22px,3.4vw,38px);line-height:1.55;color:var(--ink);margin-top:2.6rem;
  padding-top:1.8rem;border-top:1px solid var(--line);max-width:24ch;}

/* steps */
.step{opacity:0;transform:translateY(12px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1);}
.step.on{opacity:1;transform:none;}

/* statement */
.statement{font-family:var(--serif);font-size:clamp(30px,5.6vw,64px);line-height:1.32;letter-spacing:-.005em;text-align:center;}
.statement .em{color:var(--accent);}
.statement .ember{color:var(--ember-soft);}
.statement .small{display:block;font-family:var(--body);font-size:clamp(16px,2vw,22px);color:var(--muted);margin-top:1.8rem;font-weight:300;line-height:1.7;}

/* concept points */
.pts{margin-top:1rem;display:flex;flex-direction:column;gap:1.15rem;}
.pt{display:flex;gap:1.1rem;align-items:flex-start;}
.pt .n{font-family:var(--frame);font-weight:600;color:var(--accent);font-size:clamp(15px,1.8vw,19px);min-width:1.6em;padding-top:.15em;opacity:.85;}
.pt .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:.7em;flex:none;opacity:.85;}
.pt .tx{font-size:clamp(17px,2.3vw,25px);line-height:1.6;}
.pt .tx b{font-weight:500;color:var(--ink);}
.pt .tx span{display:block;color:var(--muted);font-size:.82em;margin-top:.25em;line-height:1.6;}
.note{margin-top:2rem;font-size:clamp(15px,1.9vw,19px);color:var(--faint);line-height:1.7;font-weight:300;border-right:2px solid var(--accent);padding-right:1rem;max-width:42ch;}

/* divider (محور) */
.divider{text-align:center;}
.divider .big{font-family:var(--frame);font-weight:600;font-size:clamp(48px,9vw,110px);line-height:1;}
.divider .mtag{font-family:var(--frame);letter-spacing:.2em;color:var(--accent);font-size:clamp(13px,1.7vw,16px);margin-bottom:1.6rem;}
.divider .mline{font-family:var(--serif);font-size:clamp(20px,3vw,32px);color:var(--accent-soft);margin-top:1.2rem;}

/* type card */
.tcard{position:relative;}
.tcard .ghost{position:absolute;top:50%;inset-inline-start:-2%;transform:translateY(-50%);
  font-family:var(--frame);font-weight:600;font-size:clamp(180px,34vw,360px);line-height:.8;
  color:var(--accent);opacity:.08;pointer-events:none;z-index:0;}
.tcard>*{position:relative;z-index:1;}
.tcard .ttag{font-family:var(--frame);letter-spacing:.16em;color:var(--accent);font-size:clamp(12px,1.5vw,15px);margin-bottom:1rem;}
.tcard .fuel{font-family:var(--frame);font-weight:600;font-size:clamp(34px,5.4vw,60px);line-height:1.1;}
.tcard .mech{font-size:clamp(17px,2.3vw,24px);line-height:1.7;color:var(--ink);margin-top:1.3rem;max-width:30ch;}
.tcard .tell{margin-top:1.6rem;padding:1rem 1.25rem;border:1px solid var(--line);border-inline-start:3px solid var(--accent);
  border-radius:10px;background:rgba(243,234,217,.025);max-width:34ch;}
.tcard .tell .lab{font-family:var(--frame);font-size:13px;letter-spacing:.12em;color:var(--accent);margin-bottom:.4rem;}
.tcard .tell .tx{font-size:clamp(15px,1.95vw,20px);line-height:1.6;color:var(--muted);}
.tcard .first{margin-top:1.5rem;font-size:clamp(14px,1.7vw,18px);color:var(--faint);}
.tcard .first b{font-family:var(--serif);color:var(--ink);font-weight:400;font-size:1.15em;}

/* interaction */
.inter{text-align:center;}
.inter . qmark{font-family:var(--serif);font-size:clamp(60px,12vw,140px);color:var(--accent);opacity:.5;line-height:.7;margin-bottom:1rem;}
.inter .q{font-family:var(--serif);font-size:clamp(26px,4.6vw,52px);line-height:1.45;max-width:22ch;margin:0 auto;}
.inter .s{margin-top:1.6rem;color:var(--muted);font-size:clamp(15px,1.9vw,21px);line-height:1.7;font-weight:300;}
.inter .tag{display:inline-block;margin-bottom:2rem;font-family:var(--frame);letter-spacing:.18em;font-size:13px;color:var(--accent);}

/* burnout */
.burn .head{font-family:var(--serif);font-size:clamp(24px,3.8vw,40px);line-height:1.4;max-width:26ch;}
.burn .punch{margin-top:2.2rem;font-family:var(--frame);font-weight:500;font-size:clamp(20px,3vw,30px);line-height:1.4;color:var(--ember-soft);max-width:24ch;}
.burn .pts{margin-top:1.8rem;}

/* rooting */
.root{max-width:50ch;}
.root .src{font-family:var(--frame);letter-spacing:.14em;color:var(--accent);font-size:clamp(12px,1.6vw,15px);margin-bottom:1.6rem;}
.root .body{font-family:var(--serif);font-size:clamp(22px,3.4vw,38px);line-height:1.7;}
.root .body .hl{color:var(--accent);}
.root .modern{margin-top:1.8rem;font-size:clamp(15px,1.9vw,20px);line-height:1.8;color:var(--muted);font-weight:300;border-top:1px solid var(--line);padding-top:1.5rem;}

/* compare + signature svg holders */
.viz{margin:1.2rem 0;}
.viz svg{width:100%;height:auto;display:block;}
.cap{font-family:var(--serif);font-size:clamp(19px,2.7vw,30px);line-height:1.5;color:var(--ink);text-align:center;margin-top:1.4rem;max-width:28ch;margin-inline:auto;}
.cap .em{color:var(--accent);}

/* closing thread */
.close .lines{font-family:var(--serif);font-size:clamp(26px,4.4vw,50px);line-height:1.35;}
.close .lines .em{color:var(--accent);}
.close .thread{margin-top:2rem;display:flex;flex-direction:column;gap:.55rem;}
.close .thread .row{display:flex;gap:.7rem;align-items:baseline;font-size:clamp(14px,1.8vw,18px);color:var(--muted);}
.close .thread .row .m{font-family:var(--frame);color:var(--faint);min-width:7.5em;font-size:.92em;}
.close .thread .row .v{color:var(--ink);font-weight:300;}
.close .thread .row.final .v{color:var(--accent);font-weight:500;}
.close .cta{margin-top:2.4rem;font-family:var(--serif);font-size:clamp(22px,3.4vw,38px);color:var(--gold-soft);}

/* results */
.results{text-align:center;}
.results h2{font-family:var(--serif);}
.results .cta{margin-top:2rem;font-family:var(--frame);letter-spacing:.16em;color:var(--accent);font-size:clamp(15px,2vw,20px);}

/* chrome */
#bar{position:fixed;inset-inline:0;bottom:0;height:3px;background:rgba(243,234,217,.06);z-index:40;}
#barfill{height:100%;width:0;background:var(--accent);transition:width .4s ease;}
#count{position:fixed;bottom:18px;inset-inline-start:26px;font-family:var(--frame);font-size:13px;letter-spacing:.1em;color:var(--faint);z-index:40;}
#mind{position:fixed;bottom:18px;inset-inline-end:26px;font-family:var(--frame);font-size:12px;letter-spacing:.08em;color:var(--accent);opacity:.7;z-index:40;}
#hint{position:fixed;top:18px;inset-inline-end:26px;font-family:var(--frame);font-size:11.5px;letter-spacing:.06em;color:var(--faint);z-index:40;transition:opacity .6s ease;}
@media(max-width:640px){#hint{display:none}#count,#mind{font-size:11px}}
.svgcap{font-family:var(--frame);font-size:12px;}
</style>
</head>
<body>
<div id="stage"></div>
<div id="bar"><div id="barfill"></div></div>
<div id="count"></div>
<div id="mind"></div>
<div id="hint">مسافة / ← تقدّم · → رجوع · F ملء الشاشة</div>

<script>
/* ===================== visuals ===================== */
function svgRunning(){
  return `<svg viewBox="0 0 900 380" role="img" aria-label="نفس الحركة بوقودين">
    <defs>
      <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#e8b65e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
      <marker id="ae" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#d8602f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    </defs>
    <!-- motion trail (forward = left, RTL) -->
    <g opacity=".5">
      <line x1="560" y1="200" x2="470" y2="200" stroke="#6f6151" stroke-width="1" stroke-dasharray="3 7"/>
      <line x1="600" y1="200" x2="560" y2="200" stroke="#6f6151" stroke-width="1" stroke-dasharray="3 7" opacity=".6"/>
    </g>
    <!-- the figure / the action: abstract striding mark -->
    <g transform="translate(450 200)">
      <circle cx="0" cy="-46" r="20" fill="none" stroke="#f3ead9" stroke-width="2.2"/>
      <path d="M0 -24 L0 36 M0 -8 L-30 14 M0 -8 L26 6 M0 36 L-26 70 M0 36 L24 66"
        fill="none" stroke="#f3ead9" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <!-- pull from front (left/ahead) gold -->
    <path d="M340 130 C 260 130, 250 170, 300 188" fill="none" stroke="#e8b65e" stroke-width="2.4"
      stroke-linecap="round" marker-end="url(#ag)"/>
    <circle cx="150" cy="118" r="6" fill="#e8b65e"/>
    <text x="150" y="100" text-anchor="middle" fill="#e8b65e" font-family="Readex Pro" font-size="19" font-weight="500">حبّ</text>
    <text x="150" y="146" text-anchor="middle" fill="#a3927c" font-family="IBM Plex Sans Arabic" font-size="15">يجذب من قُدّام</text>
    <!-- push from behind (right/back) ember -->
    <path d="M610 272 C 540 272, 540 230, 590 214" fill="none" stroke="#d8602f" stroke-width="2.4"
      stroke-linecap="round" marker-end="url(#ae)"/>
    <text x="720" y="262" text-anchor="middle" fill="#e8855a" font-family="Readex Pro" font-size="19" font-weight="500">خوف</text>
    <text x="720" y="298" text-anchor="middle" fill="#a3927c" font-family="IBM Plex Sans Arabic" font-size="15">يدفع من وَرا</text>
    <!-- forward arrow -->
    <line x1="430" y1="320" x2="300" y2="320" stroke="#f3ead9" stroke-width="1.6" opacity=".55" marker-end="url(#ag)" style="marker-end:url(#ag)"/>
  </svg>`;
}
function svgCompare(){
  return `<svg viewBox="0 0 900 360" role="img" aria-label="الغياب عن الصفاء">
    <!-- clarity: still + living pulse -->
    <g transform="translate(255 175)">
      <circle r="92" fill="none" stroke="rgba(243,234,217,.14)" stroke-width="1"/>
      <circle r="66" fill="none" stroke="rgba(232,182,94,.30)" stroke-width="1"/>
      <circle r="40" fill="none" stroke="rgba(232,182,94,.55)" stroke-width="1.4"/>
      <circle r="15" fill="#e8b65e"/>
      <text y="150" text-anchor="middle" fill="#e8b65e" font-family="Readex Pro" font-size="22" font-weight="500">صفاء</text>
      <text y="180" text-anchor="middle" fill="#a3927c" font-family="IBM Plex Sans Arabic" font-size="15">ساكن… وفيه نبض حيّ</text>
    </g>
    <!-- absence: still + extinguished -->
    <g transform="translate(645 175)">
      <circle r="92" fill="none" stroke="rgba(243,234,217,.14)" stroke-width="1"/>
      <circle r="66" fill="none" stroke="rgba(123,112,102,.22)" stroke-width="1"/>
      <circle r="40" fill="none" stroke="rgba(123,112,102,.30)" stroke-width="1"/>
      <circle r="15" fill="none" stroke="#7b7066" stroke-width="1.6"/>
      <text y="150" text-anchor="middle" fill="#9a8f82" font-family="Readex Pro" font-size="22" font-weight="500">غياب</text>
      <text y="180" text-anchor="middle" fill="#7b7066" font-family="IBM Plex Sans Arabic" font-size="15">ساكن… بس مطفي</text>
    </g>
    <line x1="450" y1="70" x2="450" y2="240" stroke="rgba(243,234,217,.10)" stroke-width="1" stroke-dasharray="2 8"/>
  </svg>`;
}
function svgFlames(){
  return `<svg viewBox="0 0 900 340" role="img" aria-label="اشتعال واحتراق">
    <!-- ignite: clean rising flame -->
    <g transform="translate(280 200)">
      <path d="M0 60 C -42 18, -28 -32, 0 -78 C 22 -34, 46 -6, 24 40 C 16 58, 0 60, 0 60 Z"
        fill="none" stroke="#e8b65e" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M2 56 C -16 30, -8 -2, 4 -38 C 16 -6, 22 18, 8 42 C 4 52, 2 56, 2 56 Z"
        fill="#e8b65e" opacity=".22"/>
      <text y="118" text-anchor="middle" fill="#e8b65e" font-family="Readex Pro" font-size="22" font-weight="500">اشتعال</text>
      <text y="148" text-anchor="middle" fill="#a3927c" font-family="IBM Plex Sans Arabic" font-size="15">طاقة بالحبّ</text>
    </g>
    <!-- burn: consuming + smoke -->
    <g transform="translate(620 200)">
      <path d="M0 60 C -46 22, -34 -24, -6 -70 C 4 -38, 30 -28, 22 6 C 18 30, 36 30, 30 52 C 24 64, 0 60, 0 60 Z"
        fill="none" stroke="#d8602f" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M-2 54 C -22 30, -16 -4, 0 -34 C 6 -10, 18 -8, 12 16 C 8 34, 18 38, 8 48 C 2 54, -2 54, -2 54 Z"
        fill="#d8602f" opacity=".22"/>
      <path d="M-4 -66 C -18 -86, 6 -96, -6 -118" fill="none" stroke="#7b7066" stroke-width="1.6" opacity=".55" stroke-linecap="round"/>
      <path d="M8 -60 C 22 -82, -2 -94, 10 -116" fill="none" stroke="#7b7066" stroke-width="1.4" opacity=".4" stroke-linecap="round"/>
      <text y="118" text-anchor="middle" fill="#e8855a" font-family="Readex Pro" font-size="22" font-weight="500">احتراق</text>
      <text y="148" text-anchor="middle" fill="#a3927c" font-family="IBM Plex Sans Arabic" font-size="15">طاقة بالخوف</text>
    </g>
  </svg>`;
}
function svgLayers(){
  const rows=[['السلوك','اللي بيخرج منك'],['الانتباه','اللي بيدخل ليك'],['المشاعر','اللي بيستقرّ جوّاك'],['النموذج الإدراكي','إزاي عقلك بينظّمه']];
  let y=40,h='';
  rows.forEach((r,i)=>{
    h+=`<g opacity="${0.45+i*0.0}">
      <rect x="120" y="${y}" width="660" height="44" rx="8" fill="none" stroke="rgba(243,234,217,.18)" stroke-width="1"/>
      <text x="150" y="${y+28}" fill="#cdbfa9" font-family="Readex Pro" font-size="20" font-weight="500">${r[0]}</text>
      <text x="770" y="${y+28}" text-anchor="end" fill="#7b7066" font-family="IBM Plex Sans Arabic" font-size="15">${r[1]}</text>
    </g>`; y+=60;
  });
  h+=`<line x1="450" y1="${y-6}" x2="450" y2="${y+34}" stroke="#e8b65e" stroke-width="1.4" stroke-dasharray="2 6"/>
  <polygon points="450,${y+44} 444,${y+30} 456,${y+30}" fill="#e8b65e"/>
  <rect x="120" y="${y+56}" width="660" height="56" rx="9" fill="rgba(232,182,94,.08)" stroke="#e8b65e" stroke-width="1.4"/>
  <text x="150" y="${y+91}" fill="#e8b65e" font-family="Readex Pro" font-size="22" font-weight="600">الدوافع</text>
  <text x="770" y="${y+91}" text-anchor="end" fill="#e8b65e" font-family="IBM Plex Sans Arabic" font-size="16">الوقود اللي تحتهم كلهم</text>`;
  return `<svg viewBox="0 0 900 ${y+150}" role="img" aria-label="الطبقات الأربع والوقود تحتها">${h}</svg>`;
}
const SVG={running:svgRunning,compare:svgCompare,flames:svgFlames,layers:svgLayers};

/* ===================== slides ===================== */
const A='gold', R='rose', T='teal';
const slides=[

/* —— محطة ١ : الافتتاح —— */
{type:'cover',accent:A,kicker:'Reignite · المرآة الخامسة',
 title:'مرآة الدوافع',sub:'الوقودُ الذي يحرّك كلّ ما سبق',
 q:'اللي بيحرّكك… حبٌّ يجذبك من قُدّام، ولّا خوفٌ يدفعك من وَرا؟'},

{type:'concept',accent:A,kicker:'أربع طبقات… وتحتهم',
 heading:'كل اللي فات وصف ما يظهر ويجري فيك. دي بتنزل تحتهم كلهم.',
 svg:'layers'},

{type:'statement',accent:A,
 lines:'الفعل <span class="em">بيتشاف</span>.<br>الوقود <span class="ember">مخفي</span>.',
 small:'كل حركة في يومك وراها وقود — حاجة بتخلّيك تتحرّك. المرآة دي مابتسألش «بتعمل إيه»، بتسأل: <b>إيه اللي بيحرّكك فعلًا؟</b>'},

{type:'concept',accent:A,kicker:'ليه دي من أهم المرايا',
 heading:'الاحتراق مش مشكلة في كميّة الشغل.',
 pts:[
  {t:'ناس بتشتغل قدّ كده وأكتر وعمرها ما بتحترق',s:'الفرق مش في الكميّة'},
  {t:'نوعين وقود بيعملوا <b>نفس الحركة</b> من بره',s:'بس اللي جوّه مختلف خالص'},
  {t:'واحد بيخلّيك <b>تشتعل</b>، والتاني بيخلّيك <b>تحترق</b>',s:'والفرق بينهم موضوع النهارده'},
 ]},

/* —— محطة ٢ : القاعدة الكبيرة —— */
{type:'signature',accent:A,kicker:'القاعدة الكبيرة',
 heading:'نفس الحركة بالظبط. وقودين مختلفين جذريًا.',
 svg:'running',
 cap:'واحد بيجري <span class="em">ناحية</span> اللي بيحبّه. وواحد <span class="em">هربان</span> من اللي وراه. من بعيد… نفس المنظر.'},

/* ===================== render ===================== */
function renderSlide(s){
  switch(s.type){
    case 'cover': return `<div class="slide">
      <div class="kicker">${s.kicker}</div>
      <h1>${s.title}</h1>
      <div class="sub">${s.sub}</div>
      <div class="q-hero step">${s.q}</div></div>`;

    case 'concept':{
      let mid = s.svg ? `<div class="viz step">${SVG[s.svg]()}</div>`
        : (s.pts?`<div class="pts">${s.pts.map(p=>`<div class="pt step"><span class="dot"></span><span class="tx"><b>${p.t}</b>${p.s?`<span>${p.s}</span>`:''}</span></div>`).join('')}</div>`:'');
      return `<div class="slide">
        <div class="kicker">${s.kicker}</div>
        <h2>${s.heading}</h2>
        ${mid}
        ${s.note?`<div class="note step">${s.note}</div>`:''}</div>`;
    }

    case 'statement': return `<div class="slide"><div class="statement">
      <div>${s.lines}</div>
      ${s.small?`<span class="small step">${s.small}</span>`:''}</div></div>`;

    case 'divider': return `<div class="slide divider">
      <div class="mtag">${s.mtag}</div>
      <div class="big">${s.big}</div>
      <div class="mline step">${s.mline}</div></div>`;

    case 'type': return `<div class="slide tcard">
      <div class="ghost">${s.num}</div>
      <div class="ttag">${s.ttag}</div>
      <div class="fuel">${s.fuel}</div>
      <div class="mech step">${s.mech}</div>
      <div class="tell step"><div class="lab">${s.tellLab}</div><div class="tx">${s.tell}</div></div>
      <div class="first step">${s.first.replace(/«(.+?)»/,'<b>«$1»</b>')}</div></div>`;

    case 'interaction': return `<div class="slide inter">
      <div class="tag">${s.tag}</div>
      <div class="qmark">؟</div>
      <div class="q">${s.q}</div>
      <div class="s step">${s.s}</div></div>`;

    case 'burnout': return `<div class="slide burn">
      <div class="kicker">${s.kicker}</div>
      <div class="head">${s.head}</div>
      <div class="pts">${s.pts.map(p=>`<div class="pt step"><span class="dot"></span><span class="tx"><b>${p.t}</b></span></div>`).join('')}</div>
      <div class="punch step">${s.punch}</div></div>`;

    case 'rooting': return `<div class="slide root">
      <div class="src">${s.src}</div>
      <div class="body">${s.body}</div>
      ${s.modern?`<div class="modern step">${s.modern}</div>`:''}</div>`;

    case 'signature': return `<div class="slide">
      <div class="kicker">${s.kicker}</div>
      <h2 style="margin-bottom:.4rem">${s.heading}</h2>
      <div class="viz step">${SVG[s.svg]()}</div>
      <div class="cap step">${s.cap}</div></div>`;

    case 'compare': return `<div class="slide">
      <div class="kicker">${s.kicker}</div>
      <h2 style="margin-bottom:.4rem">${s.heading}</h2>
      <div class="viz step">${SVG[s.svg]()}</div>
      <div class="cap step">${s.cap}</div></div>`;

    case 'close': return `<div class="slide close">
      <div class="kicker">${s.kicker}</div>
      <div class="lines">${s.lines}</div>
      <div class="thread">${s.thread.map(r=>`<div class="row step ${r.final?'final':''}"><span class="m">${r.m}</span><span class="v">${r.v}</span></div>`).join('')}</div></div>`;

    case 'results': return `<div class="slide results">
      <h2>${s.title}</h2>
      <div class="cta step">${s.cta}</div></div>`;
  }
  return '';
}

/* ===================== engine ===================== */
let si=0, sp=0, steps=[];
const stage=document.getElementById('stage');
const arabicNum=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const accentVar={gold:['var(--gold)','var(--gold-soft)'],rose:['var(--rose)','#efb3c2'],teal:['var(--teal)','#8fd6c9']};
const mindLabel={gold:'الهِمّة',rose:'الأنس',teal:'اليقين'};

function applyAccent(a){
  const [c,cs]=accentVar[a]||accentVar.gold;
  document.documentElement.style.setProperty('--accent',c);
  document.documentElement.style.setProperty('--accent-soft',cs);
}
function chrome(){
  document.getElementById('barfill').style.width=((si)/(slides.length-1)*100)+'%';
  document.getElementById('count').textContent=arabicNum(si+1)+' / '+arabicNum(slides.length);
  const s=slides[si];
  const lbl=(s.type==='type'||s.type==='divider'||s.type==='burnout'||s.type==='interaction'||s.type==='concept')?mindLabel[s.accent]:'';
  document.getElementById('mind').textContent=lbl||'';
}
function show(reveal){
  const s=slides[si];
  applyAccent(s.accent||'gold');
  stage.innerHTML=renderSlide(s);
  steps=[...stage.querySelectorAll('.step')];
  if(reveal){steps.forEach(e=>e.classList.add('on'));sp=steps.length;}
  else sp=0;
  chrome();
}
function advance(){
  if(sp<steps.length){steps[sp].classList.add('on');sp++;return;}
  if(si<slides.length-1){si++;show(false);}
}
function back(){
  if(sp>0){sp--;steps[sp].classList.remove('on');return;}
  if(si>0){si--;show(true);}
}
show(false);

let hintTimer=setTimeout(()=>{document.getElementById('hint').style.opacity='0';},5000);
function poke(){clearTimeout(hintTimer);document.getElementById('hint').style.opacity='.7';hintTimer=setTimeout(()=>{document.getElementById('hint').style.opacity='0';},3500);}

document.addEventListener('keydown',e=>{
  if(e.key===' '||e.key==='ArrowLeft'||e.key==='ArrowDown'||e.key==='Enter'){e.preventDefault();advance();poke();}
  else if(e.key==='ArrowRight'||e.key==='ArrowUp'){e.preventDefault();back();poke();}
  else if(e.key==='f'||e.key==='F'){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();}
  else if(e.key==='Home'){si=0;show(false);}
  else if(e.key==='End'){si=slides.length-1;show(true);}
});
stage.addEventListener('click',()=>{advance();poke();});
let tx=0,ty=0;
document.addEventListener('touchstart',e=>{tx=e.changedTouches[0].clientX;ty=e.changedTouches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){ if(dx<0)advance(); else back(); poke(); }
},{passive:true});
</script>
