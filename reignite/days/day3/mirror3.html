<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مرآة المشاعر — Reignite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Readex+Pro:wght@200;300;400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a0e10;
  --bg-2:#22141a;
  --ink:#f3e7e4;
  --ink-soft:#d9c4c0;
  --ink-mute:#9a8087;
  --pulse:#e8654f;
  --pulse-deep:#c44536;
  --gold:#d4a574;
  --gold-soft:#e6c79c;
  --shadow:#6b5560;
  --shadow-deep:#4a3a44;
  --line:rgba(212,165,116,.16);
  --line-soft:rgba(243,231,228,.08);
  --amiri:'Amiri',serif;
  --display:'Readex Pro',sans-serif;
  --body:'IBM Plex Sans Arabic',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--body)}

/* ====== Deck shell ====== */
#deck{position:fixed;inset:0;overflow:hidden}
.slide{
  position:absolute;inset:0;
  display:flex;flex-direction:column;justify-content:center;
  padding:clamp(28px,5vw,90px);
  opacity:0;visibility:hidden;
  transform:scale(1.012);
  transition:opacity .7s ease,transform .7s ease,visibility .7s;
  background:
    radial-gradient(120% 80% at 78% 18%, rgba(232,101,79,.07), transparent 60%),
    radial-gradient(90% 70% at 12% 92%, rgba(107,85,96,.10), transparent 55%),
    var(--bg);
}
.slide.active{opacity:1;visibility:visible;transform:scale(1);z-index:2}
.slide.prev{z-index:1}

/* grain / atmosphere */
.slide::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:3px 3px;mix-blend-mode:screen;
}

.wrap{position:relative;z-index:3;max-width:1180px;margin:0 auto;width:100%}

/* ====== Shared atoms ====== */
.eyebrow{
  display:inline-flex;align-items:center;gap:12px;
  font-family:var(--display);font-weight:500;
  font-size:clamp(11px,1vw,14px);letter-spacing:.18em;
  color:var(--gold);text-transform:none;margin-bottom:26px;
}
.eyebrow .pip{width:7px;height:7px;border-radius:50%;background:var(--pulse);box-shadow:0 0 14px var(--pulse)}
.eyebrow .ln{width:46px;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}

h1{font-family:var(--display);font-weight:700;line-height:1.12;letter-spacing:-.01em}
.k-huge{font-size:clamp(38px,6.4vw,86px)}
.k-big{font-size:clamp(30px,4.8vw,62px)}
.k-mid{font-size:clamp(24px,3.4vw,44px)}
.grad{
  background:linear-gradient(105deg,var(--pulse) 0%,var(--gold-soft) 95%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.lead{font-size:clamp(16px,1.7vw,23px);line-height:1.85;color:var(--ink-soft);font-weight:300;max-width:60ch}
.amiri{font-family:var(--amiri)}

/* reveal items */
.r{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s ease}
.slide.active .r.show{opacity:1;transform:none}

/* ====== Progress + chrome ====== */
#bar{position:fixed;top:0;right:0;left:0;height:3px;background:rgba(255,255,255,.05);z-index:50}
#bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pulse-deep),var(--pulse),var(--gold));transition:width .5s ease;box-shadow:0 0 12px var(--pulse)}
#counter{position:fixed;bottom:22px;left:26px;z-index:50;font-family:var(--display);font-size:12px;letter-spacing:.16em;color:var(--ink-mute)}
#counter b{color:var(--gold)}
#hint{position:fixed;bottom:22px;right:26px;z-index:50;font-family:var(--body);font-size:12px;color:var(--ink-mute);opacity:.7}
.kbd{display:inline-block;border:1px solid var(--line);border-radius:5px;padding:1px 7px;color:var(--ink-soft);font-family:var(--display);font-size:11px;margin:0 2px}

/* ====== Heart-journey signature ====== */
.journey{position:relative;width:100%;max-width:920px;margin:38px auto 0}
.journey svg{width:100%;height:auto;display:block;overflow:visible}
.stop-label{font-family:var(--display);font-size:clamp(11px,1.1vw,15px);fill:var(--ink-mute);font-weight:500}
.stop-num{font-family:var(--amiri);font-size:13px;fill:var(--gold)}

/* ====== Axis cards ====== */
.axis-head{display:flex;align-items:baseline;gap:20px;flex-wrap:wrap;margin-bottom:8px}
.axis-tag{font-family:var(--amiri);font-size:clamp(15px,1.4vw,19px);color:var(--gold)}
.axis-where{font-family:var(--display);font-size:clamp(12px,1.1vw,15px);color:var(--pulse);font-weight:500;
  border:1px solid rgba(232,101,79,.3);border-radius:30px;padding:4px 16px}

/* three-type rows */
.types{display:flex;flex-direction:column;gap:18px;margin-top:30px}
.type-row{
  display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:start;
  border-right:2px solid var(--line);padding:4px 22px 4px 0;position:relative;
}
.type-row::before{content:"";position:absolute;right:-5px;top:10px;width:8px;height:8px;border-radius:50%;background:var(--shadow)}
.type-row.t-pulse::before{background:var(--pulse);box-shadow:0 0 12px rgba(232,101,79,.6)}
.type-row.t-gold::before{background:var(--gold)}
.type-glyph{
  font-family:var(--display);font-weight:600;font-size:clamp(13px,1.2vw,16px);
  color:var(--ink);white-space:nowrap;padding-top:1px;min-width:120px;
}
.type-glyph small{display:block;color:var(--ink-mute);font-weight:300;font-size:.78em;margin-top:3px}
.type-body{font-size:clamp(14px,1.45vw,18px);line-height:1.7;color:var(--ink-soft);font-weight:300}
.type-body .hl{color:var(--pulse);font-weight:500}
.type-body .gl{color:var(--gold-soft);font-weight:500}

/* central verb chip */
.verb{display:inline-block;font-family:var(--amiri);font-size:.95em;color:var(--gold);
  border-bottom:1px dashed rgba(212,165,116,.4);padding-bottom:1px}

/* burnout link block */
.link-block{
  margin-top:34px;border-radius:16px;padding:26px 30px;position:relative;overflow:hidden;
  background:linear-gradient(120deg,rgba(232,101,79,.10),rgba(196,69,54,.04));
  border:1px solid rgba(232,101,79,.22);
}
.link-block .lab{font-family:var(--display);font-size:12px;letter-spacing:.14em;color:var(--pulse);margin-bottom:10px;font-weight:600}
.link-block p{font-size:clamp(15px,1.5vw,19px);line-height:1.75;color:var(--ink);font-weight:300}

/* rooting / quote slide */
.root-card{
  border-radius:18px;padding:clamp(30px,4vw,56px);position:relative;
  background:linear-gradient(160deg,rgba(212,165,116,.07),rgba(26,14,16,0));
  border:1px solid var(--line);
}
.root-card .verse{font-family:var(--amiri);font-size:clamp(22px,3vw,40px);line-height:1.7;color:var(--gold-soft)}
.root-card .src{font-family:var(--display);font-size:13px;color:var(--ink-mute);margin-top:18px;letter-spacing:.1em}

/* interaction prompt */
.ask{
  display:flex;align-items:center;gap:16px;margin-top:30px;
  font-family:var(--display);font-weight:400;color:var(--gold);
  font-size:clamp(14px,1.4vw,18px);
}
.ask .mic{width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);
  display:grid;place-items:center;flex:none;color:var(--gold)}

/* "you leave saying" */
.leave{
  margin-top:30px;font-family:var(--amiri);font-style:italic;
  font-size:clamp(18px,2.1vw,28px);color:var(--ink);line-height:1.6;
  padding-right:24px;border-right:3px solid var(--pulse);
}

/* divider lockup for section slides */
.sec-num{font-family:var(--amiri);font-size:clamp(60px,12vw,150px);color:rgba(212,165,116,.14);line-height:.8;font-weight:700}

/* center stage helper */
.center{align-items:center;text-align:center}
.center .wrap{display:flex;flex-direction:column;align-items:center}
.center .lead{text-align:center}

/* pull stat */
.bignote{font-family:var(--amiri);font-size:clamp(20px,2.4vw,32px);color:var(--gold-soft);line-height:1.6}

@media (max-width:680px){
  .type-row{grid-template-columns:1fr;gap:8px}
  .type-glyph{min-width:0}
  #hint{display:none}
  .slide{padding:24px 20px}
}
@media (prefers-reduced-motion:reduce){
  .slide,.r{transition:opacity .25s ease}
  .slide{transform:none}
  .pulse-anim,.beat{animation:none!important}
}
</style>
</head>
<body>

<div id="bar"><i></i></div>
<div id="deck"></div>
<div id="counter"><b id="cnum">01</b> / <span id="ctot">00</span></div>
<div id="hint"><span class="kbd">→</span> أو مسافة للتقدّم · <span class="kbd">F</span> ملء الشاشة</div>

<script>
/* ============================================================
   SLIDE DEFINITIONS
   each slide: { build:()=>html, steps:n }
   ============================================================ */

/* shared SVG: heart-journey line. mode = which stop "breaks" */
function journeySVG(mode){
  // mode: 'full' | 'door' | 'stay' | 'swap'
  const breakAt = {full:null, door:1, stay:2, swap:0}[mode];
  const stops = [
    {x:120, lbl:'الباب'},
    {x:340, lbl:'الدخول'},
    {x:560, lbl:'القعدة'},
    {x:780, lbl:'المُضيّ'},
  ];
  let dots = stops.map((s,i)=>{
    const broke = (breakAt!==null && i===breakAt);
    const col = broke ? 'var(--pulse)' : 'var(--gold)';
    const r = broke ? 9 : 5.5;
    const glow = broke ? 'filter:drop-shadow(0 0 8px var(--pulse))' : '';
    return `<circle cx="${s.x}" cy="70" r="${r}" fill="${col}" style="${glow}"/>
            <text x="${s.x}" y="105" text-anchor="middle" class="stop-label">${s.lbl}</text>`;
  }).join('');
  // the heart at the start (the door)
  return `
  <svg viewBox="0 0 900 140" role="img" aria-label="رحلة الإحساس على القلب">
    <defs>
      <linearGradient id="jg" x1="900" y1="0" x2="0" y2="0">
        <stop offset="0" stop-color="var(--gold)"/>
        <stop offset="1" stop-color="var(--pulse)"/>
      </linearGradient>
    </defs>
    <path d="M40 70 H860" stroke="rgba(243,231,228,.12)" stroke-width="2"/>
    <path d="M40 70 H860" stroke="url(#jg)" stroke-width="2.5" stroke-dasharray="6 7" opacity=".7"/>
    ${dots}
  </svg>`;
}

const SLIDES = [];

/* 01 — Title */
SLIDES.push({steps:3, build:()=>`
  <div class="wrap center">
    <div class="eyebrow r" data-step="0"><span class="pip"></span> المرآة الثالثة · Reignite <span class="ln"></span></div>
    <h1 class="k-huge r" data-step="1">مرآة المشاعر</h1>
    <p class="lead r" data-step="2" style="margin-top:24px">
      الإحساس… وصل، ولّا اتعطّل في السكّة؟<br>
      <span class="amiri" style="color:var(--gold-soft);font-size:1.15em">رحلة الوارد على القلب</span>
    </p>
  </div>`});

/* 02 — Opening: from→to */
SLIDES.push({steps:4, build:()=>`
  <div class="wrap">
    <div class="eyebrow r" data-step="0"><span class="pip"></span> المحطة ١ · الافتتاح</div>
    <h1 class="k-mid r" data-step="1" style="margin-bottom:36px">نزلنا طبقة… ورا طبقة</h1>
    <div style="display:flex;flex-direction:column;gap:20px;max-width:62ch">
      <div class="r" data-step="1" style="display:flex;gap:18px;align-items:baseline">
        <span class="amiri" style="color:var(--shadow);font-size:1.5em;min-width:90px">السلوك</span>
        <span class="lead" style="margin:0">جسمك بيعمل إيه؟ — الحركة اللي بتخرج منك</span>
      </div>
      <div class="r" data-step="2" style="display:flex;gap:18px;align-items:baseline">
        <span class="amiri" style="color:var(--shadow);font-size:1.5em;min-width:90px">الانتباه</span>
        <span class="lead" style="margin:0">نظرك بيروح فين؟ — الكشّاف اللي بيوجّهك</span>
      </div>
      <div class="r" data-step="3" style="display:flex;gap:18px;align-items:baseline;padding-top:6px;border-top:1px solid var(--line)">
        <span class="amiri grad" style="font-size:1.6em;min-width:90px">المشاعر</span>
        <span class="lead" style="margin:0;color:var(--ink)">بيحصل إيه <span style="color:var(--pulse)">جوّه القلب نفسه</span>؟ — للإحساس بعد ما يجي</span>
      </div>
    </div>
  </div>`});

/* 03 — the question */
SLIDES.push({steps:4, build:()=>`
  <div class="wrap center">
    <div class="eyebrow r" data-step="0"><span class="pip"></span> السؤال الجوهريّ</div>
    <p class="lead r" data-step="1" style="margin-bottom:30px">الإحساس القويّ اللي جالك آخر مرة في شغلك… بعد ما جه، حصله إيه؟</p>
    <div style="display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:880px">
      <div class="r" data-step="2" style="flex:1;min-width:200px;border:1px solid var(--line);border-radius:14px;padding:20px;background:rgba(212,165,116,.04)">
        <span class="amiri" style="color:var(--gold-soft);font-size:1.3em">دخل وعاش ومشي</span>
        <p style="color:var(--ink-mute);margin-top:8px;font-size:14px">القلب الحيّ — وسابك في حالك</p>
      </div>
      <div class="r" data-step="3" style="flex:1;min-width:200px;border:1px solid rgba(232,101,79,.25);border-radius:14px;padding:20px;background:rgba(232,101,79,.05)">
        <span class="amiri" style="color:var(--pulse);font-size:1.3em">اتعطّل في السكّة</span>
        <p style="color:var(--ink-mute);margin-top:8px;font-size:14px">اتمسك… أو قعد… أو اتبدّل</p>
      </div>
    </div>
    <p class="lead r" data-step="3" style="margin-top:30px;font-size:clamp(15px,1.6vw,20px)">والاحتراق، في جزء كبير منه، <span style="color:var(--pulse)">إحساس اتعطّل في السكّة من سنين</span>.</p>
  </div>`});

/* 04 — Big idea: the guest at the door */
SLIDES.push({steps:4, build:()=>`
  <div class="wrap">
    <div class="eyebrow r" data-step="0"><span class="pip"></span> المحطة ٢ · القاعدة الكبيرة</div>
    <h1 class="k-big r" data-step="1">أي إحساس… <span class="grad">ضيف بيطرق باب قلبك</span></h1>
    <p class="lead r" data-step="2" style="margin-top:26px">الرحلة السليمة بسيطة: الضيف يطرق، تفتح، يدخل، ياخد حقّه ويقول اللي جاي يقوله، وبعدين <span style="color:var(--gold-soft)">يمشي</span> — وقلبك يرجع بيت مفتوح، مستني اللي بعده، مرتاح لو محدش جه.</p>
    <div class="r" data-step="3" class="bignote" style="margin-top:30px;font-family:var(--amiri);font-size:clamp(17px,2vw,26px);color:var(--gold-soft);line-height:1.7;max-width:70ch">
      «القلب الحيّ مش اللي مفيهوش مشاعر — ده اللي المشاعر بتمرّ عليه فتاخد منه ما تاخد، ثمّ يعود إلى مقامه.»
    </div>
  </div>`});

/* 05 — Ibn al-Qayyim rooting */
SLIDES.push({steps:3, build:()=>`
  <div class="wrap center">
    <div class="eyebrow r" data-step="0"><span class="pip"></span> التأصيل</div>
    <div class="root-card r" data-step="1" style="max-width:880px">
      <p class="verse">الأحوال تَرِد وترحل،<br>والمقامات تثبت وتستوطن.</p>
      <p class="lead" style="margin-top:22px;color:var(--ink-soft)">والصحّة أن تظلّ الواردات <span style="color:var(--gold-soft)">أحوالًا تَرِد</span>، لا أن تتحوّل إلى <span style="color:var(--pulse)">مقاماتٍ تستوطن</span>. والعافية — كما قال الغزّاليّ — ليست في غياب المشاعر، بل في أن تمرّ دون أن تستعبد صاحبها.</p>
      <p class="src">ابن القيّم · مدارج السالكين — والغزّاليّ · الإحياء</p>
    </div>
  </div>`});

/* 06 — three break-points overview */
SLIDES.push({steps:5, build:()=>`
  <div class="wrap">
    <div class="eyebrow r" data-step="0"><span class="pip"></span> الرحلة بتتعطّل فين؟</div>
    <h1 class="k-mid r" data-step="0" style="margin-bottom:10px">تلات نقط مختلفة خالص</h1>
    <div class="journey r" data-step="1">${journeySVG('full')}</div>
    <div style="display:flex;flex-direction:column;gap:16px;margin-top:30px;max-width:74ch">
      <div class="r" data-step="2" style="display:flex;gap:16px;align-items:baseline">
        <span class="axis-where" style="white-space:nowrap">قبل ما يدخل</span>
        <span class="lead" style="margin:0">بتقابله على الباب وتحوّله لحاجة أصغر — فما وصلش جوّه. <b style="color:var(--gold)">الاحتواء</b></span>
      </div>
      <div class="r" data-step="3" style="display:flex;gap:16px;align-items:baseline">
        <span class="axis-where" style="white-space:nowrap">بعد ما يدخل</span>
        <span class="lead" style="margin:0">دخل، واتكلّم بصوت عالي — بس ما مشيش. نقل عفشه وقعد. <b style="color:var(--gold)">التعبير الكامل</b></span>
      </div>
      <div class="r" data-step="4" style="display:flex;gap:16px;align-items:baseline">
        <span class="axis-where" style="white-space:nowrap;border-color:var(--pulse);color:var(--pulse)">قبل ما تعرفه</span>
        <span class="lead" style="margin:0">اتبدّل بضيف تاني وإنت لسه ما فتحتش — وأنت متأكد إنه هو. <b style="color:var(--pulse)">التحويل</b></span>
      </div>
    </div>
  </div>`});

/* ============ AXIS 1 — CONTAINMENT ============ */

/* 07 — section divider */
SLIDES.push({steps:3, build:()=>`
  <div class="wrap">
    <div class="sec-num r" data-step="0">١</div>
    <div class="axis-head r" data-step="1" style="margin-top:-10px">
      <h1 class="k-big">الاحتواء</h1>
      <span class="axis-where">الاضطراب قبل الورود</span>
    </div>
    <p class="lead r" data-step="2" style="margin-top:18px">الإحساس بيتعطّل <span style="color:var(--gold-soft)">قبل ما يوصل لوعيك كامل</span>. بيطرق الباب، وقبل ما يدخل بصورته الحقيقية، بيحصله حاجة في السكّة.</p>
    <div class="journey r" data-step="2" style="margin-top:24px;max-width:760px">${journeySVG('door')}</div>
  </div>`});

/* 08 — containment three types */
SLIDES.push({steps:4, build:()=>`
  <div class="wrap">
    <div class="eyebrow r" data-step="0"><span class="pip"></span> الاحتواء · تلات صور</div>
    <div class="types">
      <div class="type-row t-pulse r" data-step="1">
        <div class="type-glyph">الإمساك<small>الطابع الأوّل</small></div>
        <div class="type-body">الإحساس <span class="hl">بيتمسك قبل ما يكمّل شكله</span> — مش بيقرّر يحبسه، بيلاقيه اتمسك خلاص. بينقسم: نص بينزل في الجسم كشدّ تقدر تحطّ صباعك عليه (فكّ بيتطحن، كتفين مرفوعين)، ونص بيلبس ثوب الدقّة والانتباه. <span class="gl">يقولك: «منزعج شوية»</span> — اسم أهدى من الحقيقي.</div>
      </div>
      <div class="type-row t-gold r" data-step="2">
        <div class="type-glyph">التأجيل<small>الطابع الثالث</small></div>
        <div class="type-body">بيلاحظ وصوله لحظة، وبعدين <span class="hl">«هرجعله بعد المهمّة دي»</span> — والمهمّة مابتخلصش. الجسم بيدفع الفاتورة: ضيق صدر هادي، نَفَس سطحي، وتعب مالوش سبب واضح. <span class="gl">يقولك: «مشغول»</span> — حالة عملية مكان إحساس اتدفع للغد، والغد ماجاش.</div>

/* ============ build & run ============ */
const deck=document.getElementById('deck');
SLIDES.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide';el.dataset.idx=i;
  el.innerHTML=s.build();
  deck.appendChild(el);
});
const slides=[...document.querySelectorAll('.slide')];
document.getElementById('ctot').textContent=String(slides.length).padStart(2,'0');

let cur=0, step=0;
function stepsOf(i){return SLIDES[i].steps||1;}
function revealUpTo(slideEl,n){
  slideEl.querySelectorAll('.r').forEach(r=>{
    const st=parseInt(r.dataset.step||'0',10);
    r.classList.toggle('show', st<=n);
  });
}
function render(){
  slides.forEach((s,i)=>{
    s.classList.toggle('active',i===cur);
    s.classList.toggle('prev',i<cur);
  });
  revealUpTo(slides[cur],step);
  document.querySelector('#bar>i').style.width=((cur+(step/Math.max(stepsOf(cur)-1,1)))/(slides.length-1)*100)+'%';
  document.getElementById('cnum').textContent=String(cur+1).padStart(2,'0');
}
function next(){
  if(step<stepsOf(cur)-1){step++;}
  else if(cur<slides.length-1){cur++;step=0;}
  render();
}
function prev(){
  if(step>0){step--;}
  else if(cur>0){cur--;step=stepsOf(cur)-1;}
  render();
}
// init: first slide reveals all its steps progressively, start at 0
render();
// advance through steps within slide 1 on load for a gentle intro
let introTimer=setInterval(()=>{
  if(cur===0 && step<stepsOf(0)-1){step++;render();}
  else clearInterval(introTimer);
},520);

window.__jump=(i,s)=>{clearInterval(introTimer);cur=Math.max(0,Math.min(i,slides.length-1));step=Math.max(0,Math.min(s,stepsOf(cur)-1));render();};
document.addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();clearInterval(introTimer);next();}
  else if(['ArrowRight','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();clearInterval(introTimer);prev();}
  else if(e.key==='f'||e.key==='F'){if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();}
  else if(e.key==='Home'){cur=0;step=0;render();}
  else if(e.key==='End'){cur=slides.length-1;step=stepsOf(cur)-1;render();}
});
// click / tap
deck.addEventListener('click',e=>{clearInterval(introTimer);
  const x=e.clientX, w=window.innerWidth;
  // RTL: clicking left half = next (forward through the deck)
  if(x < w*0.5) next(); else prev();
});
// touch swipe
let tx=0;
deck.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
deck.addEventListener('touchend',e=>{clearInterval(introTimer);
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)<40)return;
  if(dx>0) next(); else prev(); // RTL: swipe right → next
},{passive:true});
</script>
