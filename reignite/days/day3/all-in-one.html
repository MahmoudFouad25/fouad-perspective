<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المرايا السبع — رحلة في معرفة النفس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Readex+Pro:wght@200;300;400;500;600;700&family=Reem+Kufi:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* الأرض الليلية */
  --night-0:#0a0e16;
  --night-1:#0f1420;
  --night-2:#161d2e;
  --ink:#f4f1ea;
  --paper:#f5f1e8;
  --paper-dim:rgba(245,241,232,.72);
  --paper-faint:rgba(245,241,232,.42);
  --line:rgba(245,241,232,.12);

  /* ألوان المرايا — كل مرآة معناها */
  --m1:#e0723a;  --m1-soft:#f0a878;  /* السلوك — جمر */
  --m2:#5b8fd6;  --m2-soft:#9cc0f0;  /* الانتباه — ضوء كشّاف */
  --m3:#d65b7a;  --m3-soft:#f09cb4;  /* المشاعر — نبض */
  --m4:#7d9b6f;  --m4-soft:#aecaa0;  /* النموذج — بنية */
  --m5:#e0a13a;  --m5-soft:#f0c878;  /* الدوافع — شعلة */
  --m6:#b89a5e;  --m6-soft:#d8c290;  /* المعتقدات — أرض */
  --m7:#9b7fc4;  --m7-soft:#c4adea;  /* الجرح — عمق دافئ */
  --gold:#d8b15e;

  --accent:var(--m1);
  --accent-soft:var(--m1-soft);

  --display:'Amiri',serif;
  --frame:'Readex Pro',sans-serif;
  --kufi:'Reem Kufi',sans-serif;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  background:var(--night-0);
  color:var(--paper);
  font-family:var(--frame);
  -webkit-font-smoothing:antialiased;
}

/* ============ المسرح ============ */
#stage{position:fixed;inset:0;overflow:hidden}

.slide{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:clamp(28px,5vw,80px);
  opacity:0;visibility:hidden;
  transform:scale(.985);
  transition:opacity .7s ease,transform .7s ease,visibility .7s;
  overflow-y:auto;
}
.slide.active{opacity:1;visibility:visible;transform:scale(1);z-index:2}
.slide-inner{
  width:100%;max-width:1180px;margin:auto;
  position:relative;z-index:3;
}

/* خلفية متدرّجة حسب المرآة */
.slide::before{
  content:'';position:absolute;inset:0;z-index:0;
  background:
    radial-gradient(120% 90% at 50% 0%, color-mix(in srgb,var(--accent) 14%,transparent) 0%, transparent 55%),
    radial-gradient(100% 80% at 50% 110%, color-mix(in srgb,var(--accent) 9%,transparent) 0%, transparent 50%),
    linear-gradient(180deg,var(--night-1),var(--night-0));
  transition:background .9s ease;
}

/* ذرّات/شرر خفيف في الخلفية */
.embers{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.ember{
  position:absolute;border-radius:50%;
  background:var(--accent-soft);opacity:0;
  filter:blur(.5px);
}
@keyframes drift{
  0%{opacity:0;transform:translateY(20px) scale(.6)}
  20%{opacity:.5}
  80%{opacity:.3}
  100%{opacity:0;transform:translateY(-120px) scale(1.1)}
}

/* ============ عناصر نصية ============ */
.eyebrow{
  font-family:var(--kufi);
  font-size:clamp(13px,1.5vw,17px);
  letter-spacing:.18em;
  color:var(--accent-soft);
  text-transform:none;
  margin-bottom:clamp(16px,2vw,26px);
  display:inline-flex;align-items:center;gap:12px;
  opacity:0;animation:rise .8s .1s forwards;
}
.eyebrow::before{
  content:'';width:38px;height:1.5px;
  background:linear-gradient(90deg,var(--accent),transparent);
}

h1.display{
  font-family:var(--display);
  font-weight:700;
  font-size:clamp(38px,7vw,92px);
  line-height:1.08;
  letter-spacing:-.01em;
  margin-bottom:clamp(20px,3vw,34px);
  opacity:0;animation:rise .9s .2s forwards;
}
h1.display .grad{
  background:linear-gradient(120deg,var(--accent-soft),var(--accent));
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}

h2.mirror-title{
  font-family:var(--display);
  font-weight:700;
  font-size:clamp(34px,6vw,76px);
  line-height:1.1;
  margin-bottom:clamp(10px,1.5vw,18px);
  opacity:0;animation:rise .9s .15s forwards;
}
.mirror-q{
  font-family:var(--display);
  font-style:italic;
  font-size:clamp(20px,3vw,34px);
  color:var(--accent-soft);
  margin-bottom:clamp(24px,3vw,40px);
  opacity:0;animation:rise .9s .3s forwards;
}

.lead{
  font-size:clamp(18px,2.3vw,27px);
  line-height:1.75;
  color:var(--paper-dim);
  max-width:42ch;
  opacity:0;animation:rise .9s .4s forwards;
}
.lead strong{color:var(--paper);font-weight:600}
.lead .hot{color:var(--accent-soft);font-weight:600}

/* ============ بطاقات الطبائع الثلاثة ============ */
.axis-label{
  font-family:var(--kufi);
  font-size:clamp(16px,2vw,24px);
  font-weight:600;
  color:var(--accent-soft);
  margin-bottom:clamp(18px,2.4vw,30px);
  display:flex;align-items:center;gap:14px;
  opacity:0;animation:rise .7s forwards;
}
.axis-label .axis-dir{
  font-family:var(--display);
  font-style:italic;
  color:var(--paper-faint);
  font-size:.82em;
}

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:clamp(14px,1.8vw,24px);
  width:100%;
}
.card{
  position:relative;
  background:linear-gradient(165deg,color-mix(in srgb,var(--accent) 8%,var(--night-2)),var(--night-1));
  border:1px solid var(--line);
  border-radius:18px;
  padding:clamp(20px,2.4vw,30px);
  opacity:0;transform:translateY(24px);
  transition:opacity .6s ease,transform .6s ease,border-color .4s;
  overflow:hidden;
}
.card.show{opacity:1;transform:translateY(0)}
.card::before{
  content:'';position:absolute;top:0;right:0;left:0;height:3px;
  background:linear-gradient(90deg,var(--accent),var(--accent-soft));
  opacity:.85;
}
.card .ty{
  font-family:var(--kufi);
  font-size:clamp(13px,1.4vw,16px);
  font-weight:600;
  color:var(--accent-soft);
  letter-spacing:.04em;
  margin-bottom:10px;
  display:flex;align-items:center;gap:9px;
}
.card .ty .dot{
  width:10px;height:10px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 14px var(--accent);
  flex:none;
}
.card .move{
  font-family:var(--display);
  font-weight:700;
  font-size:clamp(18px,2vw,25px);
  line-height:1.3;
  margin-bottom:10px;
  color:var(--paper);
}
.card .desc{
  font-size:clamp(14.5px,1.55vw,18px);
  line-height:1.65;
  color:var(--paper-dim);
}
.card .tag{
  margin-top:14px;padding-top:13px;
  border-top:1px solid var(--line);
  font-size:clamp(13px,1.35vw,16px);
  color:var(--accent-soft);
  font-weight:500;
}

/* صفّ من سطرين للبطاقات الصغيرة */
.cards.compact .card{padding:clamp(16px,2vw,24px)}

/* ============ بطاقة لقطة تفاعل ============ */
.beat{
  margin-top:clamp(20px,2.6vw,34px);
  background:color-mix(in srgb,var(--accent) 10%,var(--night-1));
  border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
  border-radius:16px;
  padding:clamp(18px,2.2vw,26px) clamp(22px,2.6vw,32px);
  font-size:clamp(16px,1.9vw,22px);
  line-height:1.6;
  color:var(--paper);
  display:flex;gap:16px;align-items:flex-start;
  opacity:0;transform:translateY(20px);
  transition:opacity .6s,transform .6s;
}
.beat.show{opacity:1;transform:translateY(0)}
.beat .icon{
  font-family:var(--display);font-style:italic;
  color:var(--accent-soft);font-size:1.6em;line-height:1;flex:none;
}
.beat strong{color:var(--accent-soft)}

/* ============ بطاقة الإجابة (الأولى/الأعمق) ============ */
.depth{
  display:grid;grid-template-columns:1fr 1fr;gap:clamp(16px,2vw,26px);
  width:100%;margin-top:8px;
}
.depth .layer{
  border-radius:16px;padding:clamp(20px,2.4vw,30px);
  opacity:0;transform:translateY(20px);transition:.6s;
}
.depth .layer.show{opacity:1;transform:translateY(0)}
.depth .first{
  background:var(--night-2);border:1px solid var(--line);
}
.depth .deep{
  background:linear-gradient(165deg,color-mix(in srgb,var(--accent) 16%,var(--night-2)),var(--night-1));
  border:1px solid color-mix(in srgb,var(--accent) 34%,transparent);
}
.depth .lbl{
  font-family:var(--kufi);font-size:clamp(13px,1.4vw,16px);
  font-weight:600;letter-spacing:.05em;margin-bottom:12px;
}
.depth .first .lbl{color:var(--paper-faint)}
.depth .deep .lbl{color:var(--accent-soft)}
.depth .txt{font-size:clamp(15.5px,1.8vw,21px);line-height:1.6;color:var(--paper-dim)}
.depth .deep .txt{color:var(--paper)}

/* ============ التأصيل ============ */
.root-quote{
  font-family:var(--display);
  font-size:clamp(20px,2.6vw,30px);
  line-height:1.7;
  color:var(--paper);
  text-align:center;
  max-width:30ch;margin:0 auto;
  opacity:0;animation:rise .9s .25s forwards;
}
.root-quote .src{
  display:block;margin-top:18px;
  font-family:var(--frame);font-style:normal;
  font-size:clamp(14px,1.5vw,17px);
  color:var(--accent-soft);font-weight:500;
}

/* ============ القوس U — خريطة الرحلة ============ */
.arc-wrap{width:100%;max-width:1000px;margin:clamp(20px,3vw,40px) auto 0}
.arc-svg{width:100%;height:auto;overflow:visible}
.arc-node circle{transition:.5s}
.arc-node text{font-family:var(--kufi);font-size:15px;fill:var(--paper-dim)}
.arc-node.lit text{fill:var(--paper);font-weight:600}

/* ============ الخيط الجامع ============ */
.thread{
  display:flex;flex-direction:column;gap:clamp(10px,1.3vw,16px);
  width:100%;max-width:760px;margin:clamp(16px,2vw,26px) auto 0;
}
.thread .row{
  display:flex;align-items:center;gap:18px;
  padding:clamp(13px,1.5vw,18px) clamp(18px,2vw,24px);
  background:var(--night-2);border:1px solid var(--line);
  border-radius:13px;
  opacity:0;transform:translateX(-24px);transition:.55s;
}
.thread .row.show{opacity:1;transform:translateX(0)}
.thread .row .m{
  font-family:var(--kufi);font-weight:600;
  font-size:clamp(15px,1.7vw,19px);
  color:var(--accent-soft);min-width:6.5em;
}
.thread .row .law{
  font-family:var(--display);font-style:italic;
  font-size:clamp(16px,1.9vw,22px);color:var(--paper);
}
.thread .row .arr{color:var(--paper-faint);font-size:1.2em}

/* ============ التنقّل والواجهة ============ */
.progress{
  position:fixed;top:0;right:0;left:0;height:3px;z-index:50;
  background:rgba(255,255,255,.06);
}
.progress .fill{
  height:100%;width:0;
  background:linear-gradient(90deg,var(--accent),var(--accent-soft));
  transition:width .5s ease, background .8s ease;
}
.hud{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  z-index:50;display:flex;align-items:center;gap:18px;
  background:rgba(10,14,22,.7);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:100px;
  padding:9px 18px;
  opacity:.5;transition:opacity .3s;
}
.hud:hover{opacity:1}
.hud button{
  background:none;border:none;color:var(--paper-dim);
  cursor:pointer;font-size:18px;width:30px;height:30px;
  border-radius:50%;transition:.2s;display:grid;place-items:center;
}
.hud button:hover{background:rgba(255,255,255,.1);color:var(--paper)}
.hud .count{
  font-family:var(--frame);font-size:14px;color:var(--paper-faint);
  min-width:62px;text-align:center;letter-spacing:.05em;
}
.hud .count b{color:var(--accent-soft)}

.hint{
  position:fixed;bottom:24px;right:28px;z-index:50;
  font-size:13px;color:var(--paper-faint);
  font-family:var(--frame);letter-spacing:.03em;
  opacity:0;animation:fadeHint 1s 1.5s forwards;
}
@keyframes fadeHint{to{opacity:.6}}

/* ============ حركات ============ */
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}

/* الموبايل */
@media (max-width:820px){
  .cards{grid-template-columns:1fr;gap:14px}
  .depth{grid-template-columns:1fr}
  .slide{padding:24px 18px;align-items:flex-start}
  .slide-inner{padding-top:30px}
  .hint{display:none}
}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.15s!important}
  .ember{display:none}
}

/* أداة مساعدة: محاذاة للبداية في السلايدات الطويلة */
.slide.top{align-items:flex-start}
.slide.top .slide-inner{margin-top:clamp(20px,4vh,60px)}
</style>
</head>

/* ===== المرآة 2 — الانتباه ===== */
{m:'m2',type:'mtitle',html:`
  <span class="eyebrow">المرآة الثانية · أعمق خطوة</span>
  <h2 class="mirror-title">الانتباه</h2>
  <p class="mirror-q">«نظرك بيروح فين؟»</p>
  <p class="lead">تخيّل إن جوّاك كشّاف في الضلمة — بينوّر حاجات، ويسيب حاجات في الضلمة، وإنت مش ماسكه. بيروح <span class="hot">لجوّه</span>، أو <span class="hot">لبرّه</span>، أو <span class="hot">متأرجح</span>. والإمام الغزالي قال: عين القلب ممكن تكون مفتوحة وشايفة — بس موجّهة في اتجاه واحد.</p>
`},
{m:'m2',type:'cards',html:cardsHTML('المحور الأول — الكشّاف لجوّه','',[
  {ty:'النوع ١',move:'مسطرة الصح والغلط',desc:'نظره يروح للحاجة المش مظبوطة، والصح يعدّي بصمت. حتى الكفاية تبقى "الحد الأدنى".'},
  {ty:'النوع ٤',move:'مسطرة الكامل والناقص',desc:'يقيس اللي قدّامه على صورة أحلى غايبة، فالحاضر الطيب يبقى "عادي".'},
  {ty:'النوع ٥',move:'مسطرة المفهوم والغامض',desc:'أي إحساس يحوّله لفكرة عنه — يعرف عن الغضب قبل ما يكون غضب.'},
])},
{m:'m2',type:'cards',html:cardsHTML('المحور الثاني — الكشّاف لبرّه','',[
  {ty:'النوع ٢',move:'مسطرة الاحتياج',desc:'أول ما يدخل مكان، نظره يمسح الوشوش: مين تعبان، مين محتاج. خريطة قلوب.'},
  {ty:'النوع ٧',move:'مسطرة المتاح والمسدود',desc:'نظره للفرصة، للباب اللي ممكن يتفتح، للي جاي بعد اللحظة.'},
  {ty:'النوع ٨',move:'مسطرة القوة والضعف',desc:'يمسح في ثواني: مين ماسك، مين أضعف، مين فيه تهديد خفيّ.',tag:'المشترك: هو غايب من خريطته — والأخطر، مش عارف إنه مش عارف'},
])},
{m:'m2',type:'cards',html:cardsHTML('المحور الثالث — الكشّاف المتأرجح','',[
  {ty:'النوع ٣',move:'بين ذاته والصورة',desc:'يتأرجح بين اللي يحسّه واللي يعرضه، ويستقرّ تدريجيًا على الصورة. أي شاهد يسحبه.'},
  {ty:'النوع ٦',move:'بين حكمه ومرجع برّه',desc:'"ماذا لو" تطلع فيخرج يتأكّد، وبعدين يشكّ فيرجع لنفسه، وهكذا.'},
  {ty:'النوع ٩',move:'بين إرادته وإرادة غيره',desc:'انزلاق بطيء ناحية اللي غيره عايزه، يكتشفه بعد ما اللحظة تفوت.'},
])},
{m:'m2',type:'beat',html:`
  <span class="eyebrow">لحظة من القاعة</span>
  <div class="beat reveal"><span class="icon">"</span><div>"الناس بتيجيلي بأوجاعها وأنا حاضر لهم كلهم، أما همّي أنا فدوري ييجي في الآخر." — دي مش طِيبة زيادة. دي <strong>كشّاف اتعوّد يروح لبرّه وما اتعلّمش يرجع.</strong></div></div>
`},
{m:'m2',type:'depth',html:`
  <span class="eyebrow">الإجابة الأولى… والأعمق</span>
  <div class="depth">
    <div class="layer first reveal"><div class="lbl">الإجابة الأولى — الوصف</div><div class="txt">"بلاحظ اللي محتاج إصلاح" · "بشوف الفرص" · "بين حاجتين". دي اللي بتحبّ تشوفه في نفسك.</div></div>
    <div class="layer deep reveal"><div class="lbl">الإجابة الأعمق — الوقوع</div><div class="txt">الوقوع يسبق الوصف. وصعب تشوف كشّافك لأنك بتبصّ <strong>بيه</strong>، مش <strong>عليه</strong> — والعدسة مابتشوفش نفسها.</div></div>
  </div>
`},

/* ===== المرآة 3 — المشاعر ===== */
{m:'m3',type:'mtitle',html:`
  <span class="eyebrow">المرآة الثالثة · جوّه القلب</span>
  <h2 class="mirror-title">المشاعر</h2>
  <p class="mirror-q">«الإحساس وصل… ولّا اتعطّل في السكة؟»</p>
  <p class="lead">تخيّل أي إحساس زيّ ضيف بيطرق باب قلبك. الرحلة السليمة: يطرق، تفتح، يقعد قدّ ما محتاج، وبعدين يمشي. ابن القيّم فرّق بين قلب الواردة <span class="hot">بتعدّي عليه</span>، وقلب الواردة بتدخله فـ<span class="hot">تستوطن</span> وتبقى صفته. والرحلة بتتعطّل في تلات أماكن.</p>
`},
{m:'m3',type:'cards',html:cardsHTML('المحور الأول — الاحتواء','',[
  {ty:'النوع ١',move:'الإحساس بيتمسك',desc:'قبل ما يكمّل شكله. بينزل شدّ في الجسم (فكّ، كتفين)، ويتحوّل لحرص يقظ.',tag:'لو سألته: "منزعج شوية"'},
  {ty:'النوع ٣',move:'الإحساس بيتأجّل',desc:'"هرجعله بعد المهمة" — والمهمة مابتخلصش. ضيق صدر وتعب مالوش سبب.',tag:'لو سألته: "مشغول"'},
  {ty:'النوع ٥',move:'الإحساس بيوصل من بعيد',desc:'كمعرفة عنه — يعرف عن الحزن بدل ما يكون حزن. أطراف باردة.',tag:'لو سألته: "أعتقد إني قلق"'},
])},
{m:'m3',type:'cards',html:cardsHTML('المحور الثاني — التعبير الكامل','',[
  {ty:'النوع ٤',move:'العودة',desc:'الإحساس يخرج بطيء، وبعدين يرجعله ويعيد تذوّقه — يفتح المحادثة القديمة من تاني.'},
  {ty:'النوع ٦',move:'التوليد',desc:'يخرج كسؤال بيدوّر، ودورة تطعم نفسها: تأكّد، شكّ، تأكّد جديد.'},
  {ty:'النوع ٨',move:'البحث',desc:'يخرج فوري، ولما مايلاقيش اللي يستفزّه — يدوّر على اللي يبقيه مولّع.'},
])},
{m:'m3',type:'cards',html:cardsHTML('المحور الثالث — التحويل','',[
  {ty:'النوع ٢',move:'الاحتياج يتقلب عطاء',desc:'"مين محتاجني أنا؟" — يدّي ويستنى امتنان يملا المكان.'},
  {ty:'النوع ٧',move:'الألم يتقلب حماس',desc:'"ما الذي يمكن فعله؟" — يقفز لاحتمال، والألم يتراكم في الخلفية.'},
  {ty:'النوع ٩',move:'الغضب يتقلب "مش مهمّ"',desc:'ينزل لتحت ويُدفن لسنين، لحد ما ينفجر في غير وقته.'},
])},
{m:'m3',type:'beat',html:`
  <span class="eyebrow">لحظة من القاعة</span>
  <div class="beat reveal"><span class="icon">"</span><div>مين فيكم لما حد يقوله "إنت زعلان"، أول رد فعل: "لأ أنا تمام، عادي"؟ ده مش كدب — <strong>اللي وصلكم من نفسكم مش مطابق للي وصل اللي قدامكم.</strong></div></div>
`},
{m:'m3',type:'depth',html:`
  <span class="eyebrow">الإجابة الأولى… والأعمق</span>
  <div class="depth">
    <div class="layer first reveal"><div class="lbl">الإجابة الأولى — اللي وصل</div><div class="txt">"منزعج" · "مشغول" · "أعتقد إني قلق". صادقة — بس دي اللي وصل لوعيك بعد الرحلة.</div></div>
    <div class="layer deep reveal"><div class="lbl">الإجابة الأعمق — اللي حصل</div><div class="txt">اللي وصلك مش دايمًا اللي حصل. الإحساس عدّى رحلته — اتمسك، أو استوطن، أو اتقلب — قبل ما توصفه.</div></div>
  </div>

/* ===== المرآة 4 — النموذج الإدراكي ===== */

  <p class="lead">الانتباه بينوّر، والنموذج بيحوّل. الغزالي فرّق بين تلات وظايف للعقل: <span class="hot">يَعقل</span> (يطبّق)، <span class="hot">يَتفكّر</span> (يفتح المُغلق)، <span class="hot">يَتدبّر</span> (يوازن). نفس الخبر بيوصل لتلات ناس: واحد يصبّ في قالب، وواحد يولّد إطار، وواحد يعلّق في ميزان.</p>
`},

  {ty:'النوع ١',move:'يحوّر',desc:'قالبه الصح/الغلط. ولما حاجة ماتدخلش، يعيد تفسيرها عشان تطابق.'},

])},
{m:'m4',type:'cards',html:cardsHTML('المحور الثاني — الابتكار','يولّد إطار',[
  {ty:'النوع ٤',move:'يعمّق',desc:'ينزل تحت السطح ويضيف طبقة — مش يقبل المعطى زي ما هو.'},
  {ty:'النوع ٧',move:'يشعّب',desc:'يفتح حقل احتمالات متفرّعة، ويدوّر على باب تالت.'},
  {ty:'النوع ٨',move:'يعيد التشكيل',desc:'يدوّر على نقطة الضغط اللي تغيّر معادلة الموقف كلها.'},
])},
{m:'m4',type:'cards',html:cardsHTML('المحور الثالث — التقييم','يزن في ميزان',[
  {ty:'النوع ٢',move:'يقرا الحقل العاطفي',desc:'مين محتاج، مين حاسس بإيه، العلاقات هتتأثّر إزاي.'},
  {ty:'النوع ٥',move:'يفحص المعطيات',desc:'إيه المصدر، إيه الافتراضات المضمرة، إيه الناقص.'},
  {ty:'النوع ٩',move:'يستوعب الزوايا',desc:'مايقبلش زاوية واحدة — كل زاوية شايلة صاحبها.'},
])},
{m:'m4',type:'depth',html:`
  <span class="eyebrow">الإجابة الأولى… والأعمق</span>
  <div class="depth">
    <div class="layer first reveal"><div class="lbl">الإجابة الأولى — الوصف</div><div class="txt">"أنا دقيق" · "بشوف العمق" · "بفهم الناس". دي اللي بتحبّ تشوفه في عقلك.</div></div>
    <div class="layer deep reveal"><div class="lbl">الإجابة الأعمق — المعالجة</div><div class="txt">المعالجة تسبق الوصف. إنت بتبصّ <strong>بإطارك</strong> مش عليه — عشان كده الناس بتمدحك عليه، والمديح جزء من الحجاب.</div></div>
  </div>
`},

/* ===== المرآة 5 — الدوافع ===== */
{m:'m5',type:'mtitle',html:`
  <span class="eyebrow">المرآة الخامسة · الوقود تحت الكل</span>
  <h2 class="mirror-title">الدوافع</h2>
  <p class="mirror-q">«اللي بيحرّكك… حب ولّا خوف لابس ثوب الإنجاز؟»</p>
  <p class="lead">تخيّل واحد بيجري: يا بيجري ناحية صاحبه — <span class="hot">جري فرح</span>، يا هربان من كلب — <span class="hot">جري خوف</span>. نفس المنظر، واللي جوّه مختلف. ابن القيّم فرّق بين السير إلى الله والفرار إليه. والمشكلة لما الخوف يبقى المحرّك، والحب تابع.</p>
`},

  {ty:'النوع ٨',move:'خوف الموقع الأضعف',desc:'يتحرّك ناحية الحضور، والإلحاح من خوف. بعد كل معركة يدوّر على التانية.'},
  {ty:'النوع ٩',move:'غياب',desc:'مش قلق — توقّف عن سؤال "أنا عايز إيه؟". الطاقة تتسحب، فينزلق لإرادة غيره.'},
])},
{m:'m5',type:'cards',html:cardsHTML('المحور الثاني — الأنس','عين الآخر في حركة القلب',[
  {ty:'النوع ٢',move:'شرط اكتمال العطاء',desc:'لو العطاء ما اتلاحظش، المكان ما اتحفظش.'},
  {ty:'النوع ٣',move:'مقياس قيمة الإنجاز',desc:'الإنجاز في الخفا يفضل ناقص لحد ما عين تشوفه.'},
  {ty:'النوع ٤',move:'العين بتخنق الفعل',desc:'محتاج يُرى، بس مش واثق إن فيه عين تشوفه زي ما هو.'},
])},
{m:'m5',type:'cards',html:cardsHTML('المحور الثالث — اليقين','علاقة العقل بالمجهول',[
  {ty:'النوع ٥',move:'القلق ينزل لجوّه',desc:'نشاط ذهني صامت. السؤال الخفي: "إزاي أكون كافي بنفسي؟"'},
  {ty:'النوع ٦',move:'القلق يتعاش موسّع',desc:'شجرة "ماذا لو". السؤال: "فين الأرض الصلبة؟"'},
  {ty:'النوع ٧',move:'القلق يتحوّل حماس',desc:'اندفاع للجديد. السؤال: "إيه اللي مستنّيني بعد دي؟"'},
])},
{m:'m5',type:'beat',html:`
  <span class="eyebrow">لحظة من القاعة</span>
  <div class="beat reveal"><span class="icon">"</span><div>نص ساعة فراغ، مفيش حاجة مطلوبة، مفيش موبايل — تقدر تقعد فيها مع نفسك زي ما هي؟ <strong>الفراغ الصغير بيكشف الوقود أكتر من أي موقف كبير.</strong></div></div>
`},
{m:'m5',type:'depth',html:`
  <span class="eyebrow">الإجابة الأولى… والأعمق</span>
  <div class="depth">
    <div class="layer first reveal"><div class="lbl">الإجابة الأولى — الشوق</div><div class="txt">"بحب الإتقان" · "بحب العطاء" · "بحب أفهم". صادقة — بس ساكتة عن الطبقة التانية.</div></div>
    <div class="layer deep reveal"><div class="lbl">الإجابة الأعمق — الاتجاه</div><div class="txt">الاتجاه يسبق التسمية. والفرق بين إنك تشتعل وإنك تحترق هو <strong>الوقود نفسه</strong>.</div></div>
  </div>
`},

/* ===== المرآة 6 — المعتقدات ===== */
{m:'m6',type:'mtitle',html:`
  <span class="eyebrow">المرآة السادسة · الأرض اللي بتقف عليها</span>
  <h2 class="mirror-title">المعتقدات</h2>
  <p class="mirror-q">«قيمتك معلّقة على إيه؟»</p>
  <p class="lead">قبل ما نبصّ — نقف على الأرض: ﴿وَلَقَدْ كَرَّمْنَا بَنِي آدَمَ﴾، قيمتك سابقة على أي إنجاز وأي علاقة. وعليها، الفرق اللي بيحكم: <span class="hot">الشوق</span> يهديك بفرح، و<span class="hot">الشرط</span> ("أنا مالیش قيمة من غير…") يحاسبك بثقل.</p>
`},
{m:'m6',type:'cards',html:cardsHTML('المحور الأول — الصيرورة','قيمتك في حاجة لسه جايّة',[
  {ty:'النوع ١',move:'مثال محكَم',desc:'المسافة من فوق كفجوة. كل ما يوصل معيار، يكتشف تحته معيار أعلى.'},
  {ty:'النوع ٣',move:'مثال معترف بناتجه',desc:'المسافة قدّامه كطريق. يسبق الإنجاز للي بعده قبل ما يدوقه.'},
  {ty:'النوع ٧',move:'مثال مفتوح',desc:'المسافة حواليه من كل جهة. الحدود تنكشف فيتفرّع لباب تالت.'},
])},

/* ============================================================
   محرّك العرض
   ============================================================ */
const stage = document.getElementById('stage');
let idx = 0;
let revealStep = 0;
const slideEls = [];

SLIDES.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide';
  // محاذاة للأعلى للسلايدات الطويلة (٣ بطاقات + عنوان)
  if(s.type==='cards' || s.type==='thread') el.classList.add('top');
  el.style.setProperty('--accent', `var(${M[s.m].c})`);
  el.style.setProperty('--accent-soft', `var(${M[s.m].cs})`);
  el.innerHTML = `<div class="slide-inner">${s.html}</div>`;
  stage.appendChild(el);
  slideEls.push(el);
});

document.getElementById('totNum').textContent = SLIDES.length;

function reveals(el){ return [...el.querySelectorAll('.reveal')]; }

function showSlide(n, dir){
  n = Math.max(0, Math.min(SLIDES.length-1, n));
  const prev = idx;
  idx = n;
  slideEls.forEach((el,i)=>el.classList.toggle('active', i===idx));

  // ضبط ألوان الواجهة على المرآة الحالية
  const m = SLIDES[idx].m;
  document.documentElement.style.setProperty('--accent', `var(${M[m].c})`);
  document.documentElement.style.setProperty('--accent-soft', `var(${M[m].cs})`);
  document.getElementById('progressFill').style.background =
    `linear-gradient(90deg, var(${M[m].c}), var(${M[m].cs}))`;

  // تقدّم
  document.getElementById('progressFill').style.width = ((idx+1)/SLIDES.length*100)+'%';
  document.getElementById('curNum').textContent = idx+1;

  // إعادة ضبط الكشف التدريجي
  revealStep = 0;
  const r = reveals(slideEls[idx]);
  r.forEach(x=>x.classList.remove('show'));

  spawnEmbers(slideEls[idx]);
}

function stepReveal(){
  const r = reveals(slideEls[idx]);
  if(revealStep < r.length){
    r[revealStep].classList.add('show');
    revealStep++;
    return true; // كشف عنصر، مش انتقال
  }
  return false; // مفيش عناصر، انتقل
}

function next(){
  // لو فيه عناصر للكشف، اكشف الأول
  if(stepReveal()) return;
  if(idx < SLIDES.length-1) showSlide(idx+1, 1);
}
function prev(){
  if(idx > 0) showSlide(idx-1, -1);
}

/* شرر الخلفية */
function spawnEmbers(el){
  el.querySelectorAll('.embers').forEach(e=>e.remove());
  if(window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const wrap = document.createElement('div');
  wrap.className='embers';
  const n = 12;
  for(let i=0;i<n;i++){
    const e=document.createElement('div');
    e.className='ember';
    const sz = 2+Math.random()*4;
    e.style.width=e.style.height=sz+'px';
    e.style.left=Math.random()*100+'%';
    e.style.bottom=(-10+Math.random()*40)+'%';
    e.style.animation=`drift ${5+Math.random()*6}s ${Math.random()*5}s infinite`;
    wrap.appendChild(e);
  }
  el.insertBefore(wrap, el.firstChild);
}

/* تنقّل */
document.getElementById('nextBtn').onclick=next;
document.getElementById('prevBtn').onclick=prev;
document.getElementById('fsBtn').onclick=()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
};

document.addEventListener('keydown',e=>{
  if(e.key===' '||e.key==='ArrowLeft'||e.key==='PageDown'){e.preventDefault();next();}
  else if(e.key==='ArrowRight'||e.key==='PageUp'){e.preventDefault();prev();}
  else if(e.key==='f'||e.key==='F'){document.getElementById('fsBtn').click();}
  else if(e.key==='Home'){showSlide(0);}
  else if(e.key==='End'){showSlide(SLIDES.length-1);}
});

/* نقر للتقدّم (مش على أزرار الـHUD) */
stage.addEventListener('click',e=>{ next(); });

/* لمس */
let tx=0;
stage.addEventListener('touchstart',e=>tx=e.changedTouches[0].clientX,{passive:true});
stage.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>50){ dx>0 ? next() : prev(); } // RTL: سحب يمين = التالي
},{passive:true});

/* بدء */
showSlide(0);
</script>
