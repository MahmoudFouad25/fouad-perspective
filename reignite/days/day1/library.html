<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مكتبة اليوم الأوّل — Reignite</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../core/reignite-stage.css">
  <style>
    :root{ --ax-bg:#0f172a; --ax-blue:#3b82f6; --ax-green:#10b981; --ax-gold:#fbbf24;
      --ax-purple:#a78bfa; --ax-text:#e2e8f0; --ax-muted:#94a3b8; --ax-line:#2a3850; --ax-serif:'Amiri',serif; }
    *{box-sizing:border-box} html,body{margin:0;padding:0}
    body{ background:radial-gradient(1200px 620px at 50% -12%, #1a2332 0%, #0f172a 62%);
      color:var(--ax-text); font-family:'Tajawal',sans-serif; min-height:100vh;
      -webkit-font-smoothing:antialiased; line-height:1.9; }
    .lib-shell{ max-width:860px; margin:0 auto; padding:22px 16px 90px; }
    .lib-head{ text-align:center; margin-bottom:18px; }
    .lib-head .ico{ font-size:32px; margin-bottom:4px; }
    .lib-head .t{ font-family:var(--ax-serif); color:var(--ax-gold); font-size:23px; }
    .lib-head .n{ color:var(--ax-muted); font-size:13px; margin-top:4px; }
    .lib-nav{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; justify-content:center; }
    .lib-chip{ background:#101a28; border:1px solid var(--ax-line); border-radius:99px; padding:7px 14px;
      font-size:13px; font-family:inherit; color:var(--ax-text); cursor:pointer; }
    .lib-chip.active{ background:var(--ax-purple); border-color:var(--ax-purple); color:#1a1430; font-weight:700; }
    .lib-stage{ background:linear-gradient(180deg, rgba(22,32,46,.95), rgba(15,23,42,.7));
      border:1px solid var(--ax-line); border-radius:16px; padding:24px 22px; min-height:200px; }
    .lib-empty{ color:var(--ax-muted); text-align:center; padding:60px 20px; font-size:16px; }
    .lib-foot{ margin-top:26px; text-align:center; }
    .lib-btn{ display:inline-block; font-family:inherit; font-size:16px; font-weight:800; cursor:pointer;
      padding:14px 40px; border-radius:14px; border:none; color:#fff;
      background:linear-gradient(135deg, var(--ax-blue), var(--ax-green));
      box-shadow:0 8px 26px rgba(59,130,246,.35); transition:transform .15s; }
    .lib-btn:hover{ transform:translateY(-2px); }
    .lib-btn:disabled{ opacity:.6; cursor:default; transform:none; }
    .lib-done{ display:none; background:rgba(16,185,129,.12); border:2px solid rgba(16,185,129,.45);
      color:var(--ax-green); border-radius:14px; padding:14px 24px; font-size:15px; font-weight:700; }
    @media(max-width:520px){ .lib-shell{ padding:16px 10px 80px; } .lib-stage{ padding:18px 14px; } }
  </style>
</head>
<body>
  <div class="lib-shell">
    <div class="lib-head">
      <div class="ico">📚</div>
      <div class="t">مكتبة اليوم الأوّل</div>
      <div class="n">راجع محطات اليوم في أيّ وقت — المحتوى الذي عشته في القاعة، بين يديك</div>
    </div>

    <div class="lib-nav" id="libNav"></div>
    <div class="lib-stage" id="libStage"><div class="lib-empty">جاري تحميل المكتبة…</div></div>

    <div class="lib-foot" id="libFoot" style="display:none;">
      <button class="lib-btn" id="libCompleteBtn">✔ أتممت مراجعة مكتبة اليوم الأوّل</button>
    </div>
    <div class="lib-foot">
      <div class="lib-done" id="libDoneBadge">✓ أتممت مراجعة المكتبة — تبقى مفتوحة لك دائمًا</div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="../../../js/firebase-config.js"></script>
  <script src="../../scale/axes-config.js"></script>
  <script src="../../core/reignite-embed.js"></script>
  <script src="../../scale/axes-content.js"></script>
  <script src="../../scale/axes-bridge.js"></script>
  <script src="../../scale/axes-store.js"></script>
  <script src="../../scale/axes-render.js"></script>
  <script src="../../core/reignite-roster.js"></script>
  <script src="flow.js"></script>
  <script src="../../core/reignite-stage.js"></script>
  

  <script>
  (function(){
    "use strict";
    var F = window.REIGNITE_FLOW, STAGE = window.REIGNITE_STAGE,
        ROSTER = window.REIGNITE_ROSTER, EMB = window.REIGNITE_EMBED;
    function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function arNum(n){ var m=['٠','١','٢','٣','٤','٥','٦','٧','٨','٩']; return String(n).replace(/\d/g,function(d){return m[+d];}); }

    var LIB_PHASES=['ack_open','ack_charter','ack_exhaustion','ack_symptom','levels_three','axes_lens','axes_order','strategy_four','curve_mirror','cards_nine','pattern_live','recovery','closing'];
    var myRole = localStorage.getItem('reignite_role') || 'leader';
    var libAllowed = null;   /* null = الكلّ مسموح افتراضيًّا */
    var sessionId = 'reignite-active';

    var qs = new URLSearchParams(window.location.search);
    if(qs.get('session')) sessionId = qs.get('session');

    /* ── عرض المحطات ── */
    function visiblePhases(){
      return LIB_PHASES.filter(function(pid){
        if(!F.phases[pid]) return false;
        if(libAllowed && libAllowed[pid]===false) return false;
        return true;
      });
    }
    function buildNav(active){
      var nav=document.getElementById('libNav'), phs=visiblePhases();
      nav.innerHTML=phs.map(function(pid){
        return '<button class="lib-chip'+(pid===active?' active':'')+'" data-pid="'+pid+'">'+esc(F.phases[pid].title)+'</button>';
      }).join('');
      nav.querySelectorAll('.lib-chip').forEach(function(ch){
        ch.addEventListener('click', function(){ showPhase(ch.getAttribute('data-pid')); });
      });
    }
    function cardsFull(){
      var p=F.phases.cards_nine;
      var h='<div class="stg"><div class="stg-kicker">'+esc(p.title)+'</div><p class="stg-p">'+esc(p.intro)+'</p>';
      h+='<div class="stg-cards-grid client">';
      F.CARDS.forEach(function(c){
        h+='<div class="stg-card open" data-card="'+c.id+'">'
          + '<div class="stg-card-front" style="cursor:default">'
          +   '<div class="stg-card-num">'+arNum(c.order)+'</div>'
          +   '<div class="stg-card-name">'+esc(c.name)+'</div>'
          +   '<div class="stg-card-tag">'+esc(c.tag)+'</div>'
          +   '<div class="stg-card-fline">'+esc(c.front)+'</div>'
          + '</div>'
          + '<div class="stg-card-back">'+ c.back.map(function(par){ return '<p class="stg-p">'+esc(par)+'</p>'; }).join('') +'</div>'
          + '</div>';
      });
      h+='</div></div>';
      return h;
    }
    function showPhase(pid){
      buildNav(pid);
      if(pid==='cards_nine'){ document.getElementById('libStage').innerHTML=cardsFull(); return; }
      STAGE.render(document.getElementById('libStage'), pid, 'display', { role: myRole });
    }
    function start(){
      var phs=visiblePhases();
      if(!phs.length){
        document.getElementById('libStage').innerHTML='<div class="lib-empty">المدرّب لم يفعّل أيّ محتوى للمراجعة بعد — عُد لاحقًا.</div>';
        return;
      }
      showPhase(phs[0]);
    }

    /* ── الجلسة وإعداداتها ── */
    function resolveSession(){
      if(qs.get('session')) return Promise.resolve();
      var uid = (EMB && EMB.ctx && EMB.ctx.userId) || null;
      if(!uid){
        try{ var u=window.AXES_STORE&&window.AXES_STORE.getCurrentUser&&window.AXES_STORE.getCurrentUser(); if(u) uid=u.id; }catch(e){}
      }
      if(uid && ROSTER && ROSTER.getMySessionId){
        return ROSTER.getMySessionId(uid).then(function(s){ if(s) sessionId=s; }).catch(function(){});
      }
      return Promise.resolve();
    }
    function readSettings(){
      return new Promise(function(res){
        try{
          if(!window.db){ res(); return; }
          window.db.collection('reignite_sessions').doc(sessionId).get().then(function(d){
            if(d.exists){ var cd=d.data().customData||{}; var lk=cd['library_d1']||cd.library; if(lk) libAllowed=lk; }
            res();
          }).catch(function(){ res(); });
        }catch(e){ res(); }
      });
    }

    /* ── منطق التضمين ── */
    var btn=document.getElementById('libCompleteBtn'),
        badge=document.getElementById('libDoneBadge'),
        foot=document.getElementById('libFoot'),
        completed=false;
    function showDone(){ completed=true; foot.style.display='none'; badge.style.display='inline-block'; }

    if(EMB && EMB.isEmbedded()){
      EMB.onSavedData(function(data){
        if(data && data.completed){ showDone(); }
        else { foot.style.display='block'; }
      });
      EMB.requestSavedData();
      setTimeout(function(){ if(!completed && foot.style.display==='none') foot.style.display='block'; }, 2000);

      btn.addEventListener('click', function(){
        if(completed) return;
        btn.disabled=true; btn.textContent='جاري الحفظ…';
        var sent=EMB.complete({ type:'library-reviewed', day:'d1' });
        if(sent){ setTimeout(showDone, 800); }
        else { btn.disabled=false; btn.textContent='✔ أتممت مراجعة مكتبة اليوم الأوّل'; }
      });
      EMB.onPointsSummary(function(){ showDone(); });
    }

    resolveSession().then(readSettings).then(start).catch(start);
  })();
  </script>
</body>
</html>
