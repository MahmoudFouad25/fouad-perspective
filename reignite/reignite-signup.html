<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
  --bg:#0f172a; --bg2:#1a2332; --card:#16202e; --line:#2a3850;
  --blue:#3b82f6; --green:#10b981; --gold:#fbbf24; --red:#ef4444;
  --text:#e2e8f0; --muted:#94a3b8; --serif:'Amiri',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100vh;overflow-x:hidden}
body{
  font-family:'Tajawal',sans-serif; color:var(--text); line-height:1.9;
  background:radial-gradient(1100px 600px at 50% -10%, #1a2332 0%, #0f172a 60%);
  display:flex; align-items:center; justify-content:center; padding:24px 16px;
  -webkit-font-smoothing:antialiased;
}
/* نجوم خفيفة */
.stars{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.4;animation:tw 4s infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.8}}

.wrap{position:relative;z-index:1;width:100%;max-width:460px}

.brand{text-align:center;margin-bottom:26px}
.brand .logo{font-family:var(--serif);font-size:34px;color:var(--gold);text-shadow:0 0 30px rgba(251,191,36,.25)}
.brand .sub{color:var(--muted);font-size:14px;margin-top:4px}

.card{
  background:linear-gradient(180deg, rgba(22,32,46,.96), rgba(15,23,42,.8));
  border:1px solid var(--line); border-radius:22px; padding:30px 26px;
  box-shadow:0 24px 70px rgba(0,0,0,.45);
}
.card h2{font-family:var(--serif);font-size:22px;color:var(--text);margin-bottom:6px;text-align:center}
.card .lead{color:var(--muted);font-size:14px;text-align:center;margin-bottom:24px}

.field{margin-bottom:18px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:500}
.field label i{color:var(--blue);margin-left:6px}
.in{
  width:100%; background:rgba(15,23,42,.6); border:1px solid var(--line);
  border-radius:12px; color:var(--text); font-family:inherit; font-size:16px;
  padding:13px 14px; outline:none; transition:border-color .2s, box-shadow .2s;
}
.in:focus{border-color:var(--blue); box-shadow:0 0 0 3px rgba(59,130,246,.12)}
.in::placeholder{color:#64748b}

.pass-row{position:relative}
.pass-row .toggle{
  position:absolute; inset-inline-start:12px; top:50%; transform:translateY(-50%);
  background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;
}
.gen{
  margin-top:8px; background:none; border:none; color:var(--blue);
  font-family:inherit; font-size:13px; cursor:pointer; padding:0;
}
.gen:hover{color:var(--green)}

.go{
  margin-top:10px; width:100%; border:none; cursor:pointer; font-family:inherit;
  font-size:17px; font-weight:700; padding:15px; border-radius:14px; color:#fff;
  background:linear-gradient(135deg,var(--blue),var(--green));
  box-shadow:0 10px 28px rgba(59,130,246,.32); transition:transform .15s, box-shadow .2s;
  display:flex; align-items:center; justify-content:center; gap:10px;
}
.go:hover{transform:translateY(-2px); box-shadow:0 14px 34px rgba(59,130,246,.45)}
.go:disabled{opacity:.6;cursor:not-allowed;transform:none}

.err{color:#fca5a5;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);
  border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:16px;display:none}
.err.show{display:block;animation:shake .4s}
@keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(3px)}50%{transform:translateX(-3px)}}

.note{color:var(--muted);font-size:12px;text-align:center;margin-top:18px;line-height:1.8}
.note a{color:var(--blue);text-decoration:none}

/* شاشة النجاح */
.success{display:none;text-align:center;animation:fade .5s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.success .check{font-size:54px;color:var(--green);margin-bottom:14px}
.success h2{margin-bottom:8px}
.success p{color:var(--muted);font-size:15px;margin-bottom:22px}
.link-box{
  background:rgba(15,23,42,.6);border:1px dashed var(--line);border-radius:12px;
  padding:12px;font-size:12px;color:var(--muted);word-break:break-all;
  direction:ltr;text-align:left;margin-bottom:16px;
}
.dots{display:flex;gap:8px;justify-content:center;margin-top:18px}
.dots span{width:9px;height:9px;border-radius:50%;background:var(--blue);opacity:.4;animation:d 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes d{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}

@media(max-width:480px){ .card{padding:26px 18px} .brand .logo{font-size:28px} }
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<div class="wrap">
  <div class="brand">
    <div class="logo">Reignite</div>
    <div class="sub">رحلة من الاحتراق إلى استعادة الاتّزان</div>
  </div>

  <div class="card">
    <!-- نموذج التسجيل -->
    <div id="formView">
      <h2>ابدأ رحلتك في دقيقة</h2>
      <p class="lead">اكتب بياناتك واضغط زر واحد — هنجهّز حسابك ودورتك فورًا.</p>

      <div class="err" id="err"></div>

      <div class="field">
        <label><i class="fas fa-user"></i> اسمك</label>
        <input type="text" id="name" class="in" placeholder="اسمك الكريم" autocomplete="name">
      </div>

      <div class="field">
        <label><i class="fas fa-envelope"></i> البريد الإلكتروني</label>
        <input type="email" id="email" class="in" placeholder="email@example.com" autocomplete="email" dir="ltr">
      </div>

      <div class="field">
        <label><i class="fas fa-lock"></i> كلمة السر</label>
        <div class="pass-row">
          <input type="password" id="pass" class="in" placeholder="٦ حروف على الأقل (إنجليزي وأرقام)" autocomplete="new-password" dir="ltr">
          <button type="button" class="toggle" id="toggle" title="إظهار/إخفاء"><i class="fas fa-eye"></i></button>
        </div>
        <button type="button" class="gen" id="gen"><i class="fas fa-dice"></i> اقترح لي كلمة سر قوية</button>
      </div>

      <button class="go" id="go"><i class="fas fa-rocket"></i> أنشئ حسابي وابدأ</button>

      <div class="note">
        عندك حساب بالفعل؟ <a href="login.html">سجّل دخولك من هنا</a>
      </div>
    </div>

    <!-- شاشة النجاح -->
    <div class="success" id="successView">
      <div class="check"><i class="fas fa-circle-check"></i></div>
      <h2 id="successName">أهلًا بك 🌟</h2>
      <p>اتعمل حسابك واتخصصت لك دورة <b>Reignite</b>.<br>جاري إدخالك تلقائيًا…</p>
      <a class="go" id="enterBtn" href="#"><i class="fas fa-right-to-bracket"></i> ادخل لرحلتك الآن</a>
      <div class="link-box" id="linkBox"></div>
      <button class="gen" id="copyLink" style="margin:0 auto;display:block"><i class="fas fa-copy"></i> انسخ رابط الدخول السريع</button>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════
   ⚙️ الإعدادات — عدّلها من هنا فقط
   ════════════════════════════════════════════════════════════ */
const CONFIG = {
  // اسم دورة reignite بالظبط زي ما هو مكتوب في كولكشن "courses" (يُستخدم للبحث عن المعرّف الحقيقي)
  courseName: 'reignite',

  // (اختياري) لو عارف الـ document id الحقيقي لدورة reignite في courses، حطه هنا
  // ولو سِبته فاضي، الصفحة هتدوّر عليه بنفسها بالاسم. حطّه لو عايز ضمان ١٠٠٪.
  courseId: '',

  // مدة الوصول للدورة بالشهور. حط 0 لو عايزها "غير محدود".
  accessMonths: 12,

  // مسار صفحة الدخول (نسبي لو في نفس الفولدر مع هذه الصفحة)
  loginUrl: 'login.html',

  // بعد كام ميلي ثانية يروح تلقائيًا لرابط الدخول السريع
  redirectDelayMs: 2400
};

/* ════════════════════════════════════════════════════════════
   🔥 Firebase
   ════════════════════════════════════════════════════════════ */
const firebaseConfig = {
  apiKey: "AIzaSyDj0bV5gsyRbqpxzW0Zd9wjYmq53-Xdj3w",
  authDomain: "fouad-perspective.firebaseapp.com",
  projectId: "fouad-perspective",
  storageBucket: "fouad-perspective.firebasestorage.app",
  messagingSenderId: "1068763865336",
  appId: "1:1068763865336:web:b791abcd22d536aedd5b0d",
  measurementId: "G-RY1FYVB3Q9"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ════════════════════════════════════════════════════════════
   🗂️ بنية المستخدم — منسوخة كما هي من صفحة الإدارة (للتوافق الكامل)
   ════════════════════════════════════════════════════════════ */
const UserStructure = {
  createNewUser: function(studentData){
    const now = new Date().toISOString();
    const customer = studentData.customer || {};
    const uniqueId = this.generateUniqueSlug(customer.name);
    return {
      id: uniqueId,
      personalInfo: {
        name: customer.name || '', title: customer.title || '', email: customer.email || '',
        whatsapp: customer.whatsapp || '', phone: customer.phone || customer.whatsapp || '',
        age: customer.age || null, gender: customer.gender || '', country: customer.country || '',
        city: customer.city || '', job: customer.job || ''
      },
      auth: {
        tempPassword: btoa(this.generateStrongPassword()), lastLogin: null, loginCount: 0,
        createdAt: now, createdBy: 'self', createdFrom: 'reignite-signup',
        lastPasswordChange: null, twoFactorEnabled: false
      },
      accountStatus: {
        status: 'active', journeyStage: 1, journeyTitle: 'ملبي النداء', journeyStars: 1, journeyProgress: 0,
        seeds: 0, fruits: 0, totalPoints: 0, verified: false, suspended: false, suspensionReason: null,
        lastActivityAt: now, accountHealth: 100, joinedAt: now, daysInSystem: 0
      },
      enrollments: [],
      financial: {
        totalPaid: 0, totalDue: 0, totalSavings: 0, totalOriginalPrice: 0,
        paymentHistory: [], preferredPaymentMethods: customer.paymentMethods || [],
        creditLimit: 0, creditUsed: 0
      },
      journeyPoints: { balance: 0, stage: 1, stageTitle: 'ملبي النداء', stageStars: 1, history: [], lastUpdated: now, lifetime: 0 },
      walletPoints: { balance: 0, used: 0, lifetime: 0, history: [], lastUpdated: now, conversionRate: 0.1, minRedemption: 100 },
      referralProgram: {
        myCode: this.generateReferralCode(customer.name), status: 'inactive', usageCount: 0,
        earnings: { cashRewards: 0, pointsEarned: 0, freeCoursesEarned: 0, totalValue: 0 },
        referredUsers: [], referredBy: null
      },
      bookingHistory: [],
      engagement: { coursesStarted: 0, coursesCompleted: 0, averageProgress: 0, lastCourseAccess: null, totalStudyHours: 0, certificates: [], achievements: [] },
      communication: { preferences: { email: true, whatsapp: true, sms: false }, lastContacted: null, messagesReceived: 0, unsubscribed: false },
      metadata: { originalStudentDocId: studentData.id, dataCompleteness: this.calculateDataCompleteness(studentData), importSource: 'self-signup', tags: [], customFields: {}, internalNotes: '' },
      timestamps: { createdAt: now, updatedAt: now, lastModifiedBy: 'self', deletedAt: null }
    };
  },
  generateUniqueSlug: function(name){
    const timestamp = Date.now().toString().slice(-6);
    const random = Math.random().toString(36).substring(2, 5);
    const isArabic = /[\u0600-\u06FF]/.test(name || '');
    if (isArabic && name){
      const map = {'ا':'a','أ':'a','إ':'e','آ':'aa','ب':'b','ت':'t','ث':'th','ج':'j','ح':'h','خ':'kh','د':'d','ذ':'z','ر':'r','ز':'z','س':'s','ش':'sh','ص':'s','ض':'d','ط':'t','ظ':'z','ع':'a','غ':'gh','ف':'f','ق':'q','ك':'k','ل':'l','م':'m','ن':'n','ه':'h','و':'w','ي':'y','ى':'a','ة':'h','ئ':'e','ء':'a','ؤ':'o'};
      let latin = '';
      for (let ch of name){ if (map[ch]) latin += map[ch]; else if (ch === ' ') latin += '-'; }
      latin = latin.toLowerCase().slice(0, 15);
      if (latin.length < 3) latin = 'user';
      return `${latin}-${timestamp}-${random}`;
    } else {
      const clean = (name || 'user').toLowerCase().trim().replace(/[^\w\s-]/g, '').replace(/[\s_-]+/g, '-').slice(0, 15);
      if (!clean || clean.length < 3) return `user-${timestamp}-${random}`;
      return `${clean}-${timestamp}-${random}`;
    }
  },
  generateStrongPassword: function(){
    const sets = { upper:'ABCDEFGHIJKLMNOPQRSTUVWXYZ', lower:'abcdefghijklmnopqrstuvwxyz', numbers:'0123456789', special:'!@#$%^&*+-=' };
    let p = '';
    p += sets.upper[Math.floor(Math.random()*26)];
    p += sets.lower[Math.floor(Math.random()*26)];
    p += sets.numbers[Math.floor(Math.random()*10)];
    p += sets.special[Math.floor(Math.random()*11)];
    const all = Object.values(sets).join('');
    for (let i=4; i<14; i++) p += all[Math.floor(Math.random()*all.length)];
    return p.split('').sort(()=>Math.random()-0.5).join('');
  },
  generateReferralCode: function(name){
    const cn = (name || 'USER').toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);
    const year = new Date().getFullYear();
    const r = Math.floor(Math.random()*1000).toString().padStart(3,'0');
    return `${cn}${year}${r}`;
  },
  calculateDataCompleteness: function(studentData){
    const c = studentData.customer || {};
    const req = ['name','email','whatsapp','age','gender','country','city','job'];
    let filled = 0; req.forEach(f=>{ if (c[f] && c[f] !== '') filled++; });
    const pct = Math.round((filled/req.length)*100);
    return { percentage: pct, isComplete: pct === 100, missingFields: req.filter(f=>!c[f]) };
  }
};

/* ════════════════════════════════════════════════════════════
   📚 مدير التخصيص — منسوخ كما هو من صفحة الإدارة
   ════════════════════════════════════════════════════════════ */
const EnrollmentManager = {
  getCourseIdByName: async function(courseName){
    if (!courseName) return null;
    try{
      const snap = await db.collection('courses').where('title','==',courseName).limit(1).get();
      if (!snap.empty) return snap.docs[0].id;
      const slugSnap = await db.collection('courses').where('slug','==',courseName.toLowerCase().replace(/\s+/g,'-')).limit(1).get();
      if (!slugSnap.empty) return slugSnap.docs[0].id;
      return null;
    }catch(e){ console.error('getCourseIdByName', e); return null; }
  },
  createEnrollment: function(studentData, courseSettings){
    const now = new Date().toISOString();
    const enrollmentId = `enrollment-${Date.now()}-${Math.random().toString(36).substr(2,9)}`;
    return {
      id: enrollmentId,
      courseId: studentData.actualCourseId || studentData.courseId || null,
      title: studentData.courseName || 'دورة غير محددة',
      type: studentData.journey?.type || 'individual',
      enrollmentType: courseSettings.enrollmentType || 'new',
      previousEnrollmentId: courseSettings.previousEnrollmentId || null,
      dates: { enrolledAt: now, startDate: courseSettings.startDate, endDate: courseSettings.endDate, lastAccessedAt: null, completedAt: null, expiredAt: null, renewedAt: courseSettings.isRenewal ? now : null },
      courseInfo: { instructor: studentData.instructor || 'كوتش محمود فؤاد', category: studentData.category || 'تطوير شخصي', level: studentData.experience || 'beginner', duration: courseSettings.duration || '6 أشهر', totalLessons: 0, completedLessons: 0, progress: 0 },
      pricing: {
        originalPrice: studentData.pricing?.basePriceNumber || 0, finalPrice: studentData.pricing?.finalPriceNumber || 0, currency: 'EGP',
        discounts: this.processDiscounts(studentData), totalDiscountAmount: studentData.totalSavings || 0, totalDiscountPercentage: this.calculateDiscountPercentage(studentData),
        activeOffer: null, coupon: null
      },
      payment: {
        method: this.determinePaymentMethod(studentData), status: this.determinePaymentStatus(studentData),
        totalAmount: studentData.pricing?.finalPriceNumber || 0, paidAmount: this.calculatePaidAmount(studentData), remainingAmount: this.calculateRemainingAmount(studentData),
        firstPaymentDate: studentData.paymentConfirmed ? now : null, lastPaymentDate: null, fullyPaidDate: null,
        installments: this.createInstallmentSystem(studentData),
        paymentDetails: { reference: null, method: null, gateway: null, transactionId: null, receipt: null }
      },
      progress: { overallProgress: 0, lessonsProgress: 0, assignmentsProgress: 0, quizzesProgress: 0, milestones: [], certificates: [], badges: [] },
      metadata: { originalBookingId: studentData.id, transferredFrom: 'reignite-signup', notes: courseSettings.notes || '', tags: [], customFields: {} },
      enrollmentFormData: { expectations: '', applicationPlan: '', experience: '', source: 'reignite-signup', notes: '', submittedAt: now },
      status: { current: 'active', isActive: true, isPaused: false, isExpired: false, reason: null, updatedAt: now }
    };
  },
  processDiscounts: function(){ return []; },
  calculateDiscountPercentage: function(){ return 0; },
  determinePaymentMethod: function(){ return 'free'; },
  calculatePaidAmount: function(){ return 0; },
  calculateRemainingAmount: function(){ return 0; },
  determinePaymentStatus: function(){ return 'free'; },
  createInstallmentSystem: function(){ return null; },
  calculateFinancialTotals: function(enrollments){
    let t = { totalPaid:0, totalDue:0, totalSavings:0, totalOriginalPrice:0, activeCourses:0, completedCourses:0 };
    enrollments.forEach(e=>{
      t.totalPaid += e.payment.paidAmount || 0; t.totalDue += e.payment.remainingAmount || 0;
      t.totalSavings += e.pricing.totalDiscountAmount || 0; t.totalOriginalPrice += e.pricing.originalPrice || 0;
      if (e.status.current === 'active') t.activeCourses++; else if (e.status.current === 'completed') t.completedCourses++;
    });
    return t;
  }
};

/* توكن الدخول السريع — نفس صياغة صفحة الإدارة */
function generateSecureToken(){
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  let token = '';
  for (let i=0;i<64;i++) token += chars.charAt(Math.floor(Math.random()*chars.length));
  return token + '_' + Date.now();
}

/* ════════════════════════════════════════════════════════════
   🖥️ واجهة الصفحة
   ════════════════════════════════════════════════════════════ */
// نجوم
(function(){ const c=document.getElementById('stars'); for(let i=0;i<70;i++){ const s=document.createElement('div'); s.className='star'; s.style.left=Math.random()*100+'%'; s.style.top=Math.random()*100+'%'; s.style.animationDelay=Math.random()*4+'s'; c.appendChild(s); } })();

const $ = id => document.getElementById(id);
function showErr(msg){ const e=$('err'); e.textContent=msg; e.classList.add('show'); }
function clearErr(){ $('err').classList.remove('show'); }

// إظهار/إخفاء الباسورد
$('toggle').addEventListener('click', ()=>{
  const p=$('pass'); const icon=$('toggle').querySelector('i');
  if(p.type==='password'){ p.type='text'; icon.className='fas fa-eye-slash'; } else { p.type='password'; icon.className='fas fa-eye'; }
});
// اقتراح باسورد
$('gen').addEventListener('click', ()=>{ $('pass').value = UserStructure.generateStrongPassword(); $('pass').type='text'; $('toggle').querySelector('i').className='fas fa-eye-slash'; });

$('go').addEventListener('click', createAndStart);
$('pass').addEventListener('keydown', e=>{ if(e.key==='Enter') createAndStart(); });

async function createAndStart(){
  clearErr();
  const name  = $('name').value.trim();
  const email = $('email').value.trim().toLowerCase();
  const pass  = $('pass').value;

  // تحققات
  if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ showErr('اكتب بريد إلكتروني صحيح'); return; }
  if(!pass || pass.length < 6){ showErr('كلمة السر لازم تكون ٦ حروف على الأقل'); return; }
  // الباسورد لازم يكون ASCII عشان يشتغل مع نظام الدخول (btoa/atob)
  if(!/^[\x20-\x7E]+$/.test(pass)){ showErr('استخدم حروف وأرقام ورموز إنجليزية في كلمة السر'); return; }

  const btn = $('go'); const orig = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> جاري التجهيز…';

  try{
    // ١) فحص التكرار — لو الإيميل موجود، نوجّهه للدخول العادي (أأمن من سرقة الحسابات)
    const dup = await db.collection('users').where('personalInfo.email','==',email).limit(1).get();
    if(!dup.empty){
      btn.disabled=false; btn.innerHTML=orig;
      await Swal.fire({
        icon:'info', title:'الإيميل ده مسجّل قبل كده',
        html:'عندك حساب بالفعل بنفس البريد.<br>سجّل دخولك بكلمة سرك من صفحة الدخول.',
        confirmButtonText:'روح لصفحة الدخول', confirmButtonColor:'#3b82f6',
        background:'#16202e', color:'#e2e8f0'
      });
      window.location.href = CONFIG.loginUrl;
      return;
    }

    // ٢) جلب المعرّف الحقيقي لدورة reignite
    let courseId = CONFIG.courseId || null;
    if(!courseId) courseId = await EnrollmentManager.getCourseIdByName(CONFIG.courseName);

    // ٣) تجهيز بيانات الطالب
    const today = new Date().toISOString().split('T')[0];
    let endDate;
    if(CONFIG.accessMonths === 0){ endDate = '2099-12-31'; }
    else { const d=new Date(); d.setMonth(d.getMonth()+CONFIG.accessMonths); endDate = d.toISOString().split('T')[0]; }

    const finalName = name || email.split('@')[0];
    const studentData = {
      id: 'self-' + Date.now(),
      customer: { name: finalName, email: email, whatsapp:'', phone:'' },
      courseName: CONFIG.courseName,
      actualCourseId: courseId,
      pricing: { basePriceNumber:0, finalPriceNumber:0, basePrice:'0', finalPrice:'مجانًا' },
      paymentConfirmed: false,
      journey: { type:'individual' }
    };

    // ٤) توليد معرّف فريد (مع تأكيد عدم التكرار)
    let slug = UserStructure.generateUniqueSlug(finalName), tries=0;
    while(tries<5){ const ex = await db.collection('users').doc(slug).get(); if(!ex.exists) break; slug = UserStructure.generateUniqueSlug(finalName); tries++; }

    // ٥) بناء الحساب
    const token = generateSecureToken();
    const now = new Date().toISOString();
    const newUser = UserStructure.createNewUser(studentData);
    newUser.id = slug;
    newUser.personalInfo.name  = finalName;
    newUser.personalInfo.email = email;
    newUser.auth.tempPassword = btoa(pass);                 // كلمة سر العميل
    newUser.auth.telegramAutoLoginToken = token;            // نفس الحقل اللي بتقرأه login.html
    newUser.auth.tokenGeneratedAt = now;

    // نقاط الترحيب (٥٠ لكل نظام — مطابق لسلوك صفحة الإدارة)
    const welcome = { amount:50, reason:'إنشاء حساب جديد (تسجيل ذاتي)', description:'نقاط ترحيبية عند الانضمام لمنظور الفؤاد', timestamp: now };
    newUser.journeyPoints.balance = 50; newUser.journeyPoints.lifetime = 50; newUser.journeyPoints.history = [{...welcome, type:'journey'}];
    newUser.walletPoints.balance  = 50; newUser.walletPoints.lifetime  = 50; newUser.walletPoints.history  = [{...welcome, type:'wallet'}];

    newUser.metadata.source = 'self-signup-reignite';
    newUser.metadata.automatedCreation = true;

    // ٦) تخصيص دورة reignite
    const enrollment = EnrollmentManager.createEnrollment(studentData, {
      enrollmentType:'new', startDate: today, endDate: endDate,
      duration: CONFIG.accessMonths===0 ? 'غير محدود' : (CONFIG.accessMonths+' شهر'),
      notes:'تسجيل ذاتي — دورة Reignite', isRenewal:false
    });
    newUser.enrollments = [enrollment];

    const totals = EnrollmentManager.calculateFinancialTotals([enrollment]);
    newUser.financial.totalPaid = totals.totalPaid;
    newUser.financial.totalDue = totals.totalDue;
    newUser.financial.totalSavings = totals.totalSavings;
    newUser.financial.totalOriginalPrice = totals.totalOriginalPrice;

    // ٧) الحفظ — كتابة واحدة
    await db.collection('users').doc(slug).set(newUser);

    // ٨) رابط الدخول السريع + التحويل
    const quickUrl = CONFIG.loginUrl + '?uid=' + encodeURIComponent(slug) + '&token=' + encodeURIComponent(token);
    showSuccess(finalName, quickUrl);

  }catch(err){
    console.error(err);
    btn.disabled=false; btn.innerHTML=orig;
    showErr('حصل خطأ: ' + (err.message || 'حاول تاني'));
  }
}

function showSuccess(name, url){
  $('formView').style.display = 'none';
  const v = $('successView'); v.style.display = 'block';
  $('successName').textContent = 'أهلًا، ' + name + ' 🌟';
  $('enterBtn').href = url;
  // الرابط الكامل (لو حابب يحفظه أو يشاركه — زي اللي بيتبعت على التليجرام)
  const full = (url.indexOf('http') === 0) ? url : (window.location.origin + window.location.pathname.replace(/[^/]*$/, '') + url);
  $('linkBox').textContent = full;
  $('copyLink').addEventListener('click', ()=>{
    navigator.clipboard.writeText(full).then(()=>{
      Swal.fire({ toast:true, position:'top', icon:'success', title:'اتنسخ الرابط', showConfirmButton:false, timer:1600, background:'#16202e', color:'#e2e8f0' });
    });
  });
  // تحويل تلقائي
  setTimeout(()=>{ window.location.href = url; }, CONFIG.redirectDelayMs);
}
</script>
