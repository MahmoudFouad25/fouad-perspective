<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تقرير المحاور المفصّل — Reignite</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{ --ax-bg:#0f172a; --ax-blue:#3b82f6; --ax-green:#10b981; --ax-gold:#fbbf24;
      --ax-purple:#a78bfa; --ax-text:#e2e8f0; --ax-muted:#94a3b8; --ax-line:#2a3850; --ax-serif:'Amiri',serif; }
    *{box-sizing:border-box} html,body{margin:0;padding:0}
    body{ background:radial-gradient(1200px 620px at 50% -12%, #1a2332 0%, #0f172a 62%);
      color:var(--ax-text); font-family:'Tajawal',sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased; line-height:1.9; }
    .rp-shell{ max-width:680px; margin:0 auto; padding:24px 16px 90px; }
    .rp-top{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
    .rp-brand{ font-family:var(--ax-serif); font-size:20px; color:var(--ax-gold); }
    .rp-back{ font-size:13px; color:var(--ax-blue); text-decoration:none; border:1px solid var(--ax-line); padding:7px 14px; border-radius:9px; }
    .rp-empty{ background:linear-gradient(180deg, rgba(22,32,46,.92), rgba(15,23,42,.72)); border:1px solid var(--ax-line);
      border-radius:18px; padding:44px 26px; text-align:center; }
    .rp-empty .t{ font-family:var(--ax-serif); font-size:22px; margin-bottom:12px; }
    .rp-empty .n{ color:var(--ax-muted); font-size:15px; margin-bottom:22px; }
    .rp-empty a{ display:inline-block; text-decoration:none; background:var(--ax-blue); color:#fff; font-weight:700;
      padding:12px 26px; border-radius:12px; }

    .ax-card{ background:linear-gradient(180deg, rgba(22,32,46,.92), rgba(15,23,42,.72)); border:1px solid var(--ax-line);
      border-radius:18px; padding:32px 28px; box-shadow:0 22px 54px rgba(0,0,0,.38); animation:axFade .5s ease; }
    @keyframes axFade{ from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }
    .ax-centered{ text-align:center; }
    .ax-btn{ border:none; cursor:pointer; font-family:inherit; font-size:16px; font-weight:700; padding:13px 30px; border-radius:12px; transition:transform .15s; }
    .ax-btn.primary{ background:var(--ax-blue); color:#fff; box-shadow:0 8px 22px rgba(59,130,246,.30); } .ax-btn.primary:hover{ transform:translateY(-2px); }
    .ax-btn.ghost{ background:transparent; color:var(--ax-text); border:1px solid var(--ax-line); }
    .ax-p{ font-size:17px; line-height:2; color:#cbd5e1; margin:0 0 14px; }
    .ax-spectrum-bar{ direction:ltr; margin:14px 0 10px; }
    .axsb-track{ position:relative; display:flex; height:12px; border-radius:99px; overflow:hidden; background:#101a28; }
    .axsb-zone{ flex:1; height:100%; } .axsb-deficit{ background:rgba(59,130,246,.30); } .axsb-balance{ background:rgba(16,185,129,.30); } .axsb-excess{ background:rgba(251,191,36,.32); }
    .axsb-dot{ position:absolute; top:50%; width:16px; height:16px; border-radius:50%; transform:translate(-50%,-50%); box-shadow:0 0 0 3px rgba(15,23,42,.65); }
    .axsb-band{ position:absolute; top:50%; inset-inline-start:18%; width:64%; height:14px; transform:translateY(-50%); border-radius:99px; background:rgba(167,139,250,.32); }
    .axsb-labels{ direction:ltr; display:flex; justify-content:space-between; color:var(--ax-muted); font-size:12px; margin-top:8px; }
    .axsb-whisper{ direction:rtl; color:var(--ax-purple); font-size:13px; margin-top:8px; }
    .ax-wellness{ margin-top:8px; } .ax-wl-caption{ color:var(--ax-muted); font-size:14px; margin-bottom:14px; }
    .ax-wl-row{ display:flex; align-items:center; gap:12px; margin-bottom:12px; } .ax-wl-name{ flex:0 0 120px; font-size:14px; }
    .ax-wl-tag{ color:var(--ax-gold); font-size:11px; } .ax-wl-bar{ flex:1; height:8px; background:#22304a; border-radius:99px; overflow:hidden; }
    .ax-wl-fill{ height:100%; } .ax-wl-val{ flex:0 0 32px; text-align:left; font-size:14px; color:var(--ax-muted); }
    .ax-result .ax-section{ margin-bottom:28px; padding-bottom:22px; border-bottom:1px solid var(--ax-line); }
    .ax-result .ax-section:last-child{ border-bottom:none; }
    .ax-ground{ background:rgba(167,139,250,.06); border:1px solid rgba(167,139,250,.22); border-radius:14px; padding:22px; margin-bottom:28px; }
    .ax-ground-title{ color:var(--ax-purple); font-size:15px; margin-bottom:12px; font-family:var(--ax-serif); }
    .ax-ground p{ margin:0; font-size:17px; line-height:2; color:#cbd5e1; }
    .ax-h{ color:var(--ax-gold); font-size:18px; font-weight:700; margin-bottom:14px; font-family:var(--ax-serif); }
    .ax-seed{ color:var(--ax-purple); }
    .ax-bridge{ background:rgba(16,185,129,.05); border-radius:12px; padding:16px 18px; }
    .ax-actions{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:8px; }
    .ax-spinner{ width:34px; height:34px; border:3px solid #22304a; border-top-color:var(--ax-blue); border-radius:50%; margin:0 auto 14px; animation:axSpin 1s linear infinite; }
    @keyframes axSpin{ to{transform:rotate(360deg)} }
    .ax-saving{ color:var(--ax-muted); }
    .ax-practice-card{ background:rgba(251,191,36,.08); border:1px solid rgba(251,191,36,.25); border-radius:12px; padding:16px 18px; font-size:17px; line-height:2; color:#fde9b8; }
    @media print{
      body{ background:#fff; color:#1a1a1a; } .rp-top{ display:none; }
      .rp-shell{ max-width:none; padding:0; }
      .ax-card{ background:#fff; border:none; box-shadow:none; }
      .ax-actions{ display:none; } .ax-ground{ background:#f4f1fb; }
    }
    @media(max-width:520px){ .rp-shell{ padding:18px 12px 70px; } .ax-card{ padding:24px 18px; } .ax-wl-name{ flex-basis:92px; } }

/* ════════ axes-scale.css — ستايل شاشات مقياس المحاور (أسئلة + شرح + نتيجة) ════════
   يُربَط في reignite-report.html و reignite-client.html.
   لا يُعرّف .ax-card عمدًا — كل صفحة تحتفظ بكارتها. */

/* ── شاشة التمهيد والكشف ── */
.ax-tag{ color:var(--ax-gold); font-size:14px; margin-bottom:18px; font-family:var(--ax-serif); }
.ax-core{ font-size:22px; font-weight:700; line-height:1.8; margin-bottom:18px; font-family:var(--ax-serif); }
.ax-reminder{ color:var(--ax-muted); font-size:15px; margin-bottom:24px; }
.ax-lead{ color:#cbd5e1; font-size:16px; margin:0 0 18px; line-height:1.9; }
.ax-section-title{ color:var(--ax-gold); font-size:15px; margin-bottom:16px; font-family:var(--ax-serif); }
.ax-reveal{ font-size:26px; font-weight:700; color:var(--ax-green); text-align:center; font-family:var(--ax-serif); margin:18px 0 22px; }

/* ── شريط التقدّم ── */
.ax-progress-row{ display:flex; align-items:center; gap:14px; margin-bottom:26px; }
.ax-progress-label{ color:var(--ax-muted); font-size:13px; white-space:nowrap; }
.ax-progress-bar{ flex:1; height:6px; background:#22304a; border-radius:99px; overflow:hidden; }
.ax-progress-fill{ height:100%; background:linear-gradient(90deg,var(--ax-blue),var(--ax-green)); transition:width .4s; }

/* ── السؤال والاختيارات والعبارات ── */
.ax-question{ font-size:21px; font-weight:700; line-height:1.7; margin-bottom:16px; }
.ax-statement-text{ font-size:20px; font-weight:700; line-height:1.7; margin-bottom:24px; }
.ax-options{ display:flex; flex-direction:column; gap:22px; margin-bottom:24px; }
.ax-option{ background:#101a28; border:1px solid var(--ax-line); border-radius:14px; padding:18px 18px 14px; }
.ax-option-text{ display:flex; gap:12px; align-items:flex-start; font-size:17px; line-height:1.85; margin-bottom:16px; }
.ax-letter{ flex:0 0 32px; height:32px; border-radius:50%; background:#1c2a40; color:var(--ax-gold); display:flex; align-items:center; justify-content:center; font-weight:700; }

/* ── مقياس ليكرت ── */
.ax-scale{ display:flex; gap:10px; justify-content:flex-start; flex-wrap:wrap; }
.ax-likert{ width:46px; height:46px; border-radius:50%; border:1px solid var(--ax-line); background:#101a28; color:var(--ax-text); font-family:inherit; font-size:16px; font-weight:700; cursor:pointer; transition:all .15s; }
.ax-likert:hover{ border-color:var(--ax-green); transform:translateY(-2px); color:var(--ax-green); }
.ax-likert.selected{ background:linear-gradient(135deg, var(--ax-blue), var(--ax-green)); border-color:var(--ax-blue); color:#fff; transform:scale(1.12); }
.ax-scale-labels{ display:flex; justify-content:space-between; color:var(--ax-muted); font-size:12px; margin-top:8px; }
.ax-nav{ display:flex; gap:12px; margin-top:8px; }

/* ── الشرح العاميّ والمقدّمات (كانت مفقودة في كل الصفحات) ── */
.ax-intro{ background:rgba(167,139,250,.06); border:1px solid rgba(167,139,250,.22); border-radius:12px; padding:14px 16px; color:#ddd6fe; font-size:15px; line-height:1.95; margin-bottom:18px; }
.ax-question-hint{ color:var(--ax-muted); font-size:14px; line-height:1.85; margin:0 0 14px; }
.ax-option-hint{ color:var(--ax-muted); font-size:14px; line-height:1.8; margin:-8px 0 14px; padding-inline-start:44px; }
.ax-statement-hint{ color:var(--ax-muted); font-size:14px; line-height:1.85; margin:0 0 16px; }

/* ── شاشة الإتمام (renderDone) ── */
.ax-check{ font-size:46px; color:var(--ax-green); margin-bottom:14px; }
.ax-done-line{ font-size:20px; font-weight:700; margin-bottom:10px; }
.ax-done-note{ color:var(--ax-muted); }

/* ════════ شاشة النتيجة (axr-* + ax-lead-line) — كانت مفقودة في كل الصفحات ════════ */
.axr-ground{ background:rgba(167,139,250,.06); border:1px solid rgba(167,139,250,.22); border-radius:14px; padding:22px; margin-bottom:26px; }
.axr-ground-title{ color:var(--ax-purple); font-size:15px; margin-bottom:12px; font-family:var(--ax-serif); }
.axr-card{ position:relative; background:#101a28; border:1px solid var(--ax-line); border-radius:16px; padding:24px 22px 22px; margin-bottom:22px; }
.axr-hero{ border-color:rgba(59,130,246,.35); }
.axr-diag{ border-color:rgba(251,191,36,.30); }
.axr-step{ position:absolute; inset-inline-start:18px; top:-15px; width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg,var(--ax-blue),var(--ax-green)); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; box-shadow:0 4px 12px rgba(59,130,246,.35); }
.axr-kicker{ color:var(--ax-gold); font-size:13px; font-family:var(--ax-serif); margin:6px 0 10px; }
.ax-lead-line{ font-size:19px !important; font-weight:700; color:#eaf1ff !important; line-height:1.85 !important; }
.axr-chip{ display:inline-flex; align-items:center; gap:8px; background:#1c2a40; border:1px solid var(--ax-line); border-radius:99px; padding:7px 16px; margin-bottom:14px; font-size:14px; }
.axr-chip-dim{ color:var(--ax-gold); font-weight:700; }
.axr-chip-sep{ color:var(--ax-muted); }
.axr-chip-shape{ color:var(--ax-text); }
.axr-bridge{ background:rgba(16,185,129,.06); border:1px solid rgba(16,185,129,.22); border-radius:14px; padding:20px 22px; margin-bottom:22px; }
.axr-practice-wrap{ border-color:rgba(251,191,36,.25); }


    
  </style>
</head>
<body>
  <div class="rp-shell">
    <div class="rp-top">
      <div class="rp-brand">تقرير المحاور المفصّل</div>
      <a class="rp-back" href="course-view.html?id=reignite">⌂ صفحة رحلتك</a>
    </div>
    <div id="reignite-axes-root">
      <div class="ax-card ax-centered"><div class="ax-spinner"></div><div class="ax-saving">نحمّل تقريرك…</div></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="../../js/firebase-config.js"></script>
  <script src="axes-config.js"></script>
  <script src="../core/reignite-embed.js"></script>
  <script src="axes-questions.js"></script>
  <script src="axes-content.js"></script>
  <script src="axes-engine.js"></script>
  <script src="axes-bridge.js"></script>
  <script src="axes-store.js"></script>
  <script src="axes-render.js"></script>
  <script src="axes-app.js"></script>
  

  <script>
  (function(){
    "use strict";
    function run(){
      var STORE=window.AXES_STORE;
      var user=(STORE&&STORE.getCurrentUser)?STORE.getCurrentUser():null;
      /* في الوضع المضمّن لا نحوّل أبدًا للوجين — نعرض رسالة بدل كسر الإطار */
      if(!user||!user.id){
        var isEmb=false; try{ isEmb=window.REIGNITE_EMBED&&window.REIGNITE_EMBED.isEmbedded(); }catch(e){}
        if(isEmb){
          document.getElementById('reignite-axes-root').innerHTML=
            '<div class="rp-empty"><div class="t">تعذّر التعرّف على حسابك</div>'+
            '<div class="n">أغلق الدرس وافتحه مرّةً أخرى من صفحة الدورة.</div></div>';
          return;
        }
        try{ window.location.href='../login.html'; }catch(e){}
        return;
      }

      /* حارس: التقرير لمن أتمّ المقياس فقط — لا نبدأ حلًّا جديدًا من هنا */
      STORE.loadAssessment(user.id).then(function(d){
        if(d && d.results && d.results.ranking){
          /* AXES_APP يقرأ المحفوظ ويعرض النتيجة الكاملة بنفس تفاصيلها */
          window.AXES_APP.init({ rootId:'reignite-axes-root', loginPath:'../login.html' });
        } else {
          /* لسه ما عملش المقياس (مجموعة واجب / فاته اللقاء / مشي بدري) —
             نخلّيه يعمله من هنا بإيقاعه بدل ما نوقفه. AXES_APP.init بيعرض شاشة
             تمهيد المقياس ويبدأ الحلّ، وأوّل ما يخلّص تتحفظ نتيجته وتظهر هنا. */
          window.AXES_APP.init({ rootId:'reignite-axes-root', loginPath:'../login.html' });
        }
      }).catch(function(){
        document.getElementById('reignite-axes-root').innerHTML=
          '<div class="rp-empty"><div class="t">تعذّر تحميل التقرير</div>'+
          '<div class="n">حاول مرّةً أخرى بعد قليل.</div><a href="course-view.html?id=reignite">العودة لصفحة رحلتك</a></div>';
      });
    }
    /* في الوضع المضمّن: نخفي زرّ العودة — المشارك يغلق الدرس من المنصّة */
    function hideBackIfEmbedded(){
      try{
        if(window.REIGNITE_EMBED && window.REIGNITE_EMBED.isEmbedded()){
          var b=document.querySelector('.rp-back'); if(b) b.style.display='none';
        }
      }catch(e){}
    }
    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', hideBackIfEmbedded); else hideBackIfEmbedded();
    
    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', run); else run();
  })();
  </script>
</body>
</html>
