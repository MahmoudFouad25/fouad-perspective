<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Reignite — القاعة المباشرة</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../core/reignite-stage.css">
  <style>
    :root{ --ax-bg:#0f172a; --ax-blue:#3b82f6; --ax-green:#10b981; --ax-gold:#fbbf24;
      --ax-purple:#a78bfa; --ax-red:#ef4444; --ax-text:#e2e8f0; --ax-muted:#94a3b8; --ax-line:#2a3850; --ax-serif:'Amiri',serif; }
    *{box-sizing:border-box} html,body{margin:0;padding:0}
    body{ background:radial-gradient(1200px 620px at 50% -12%, #1a2332 0%, #0f172a 62%);
      color:var(--ax-text); font-family:'Tajawal',sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased; line-height:1.9; }
    .cv-shell{ max-width:760px; margin:0 auto; padding:22px 16px 100px; }
    .cv-top{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; padding:18px 20px; margin-bottom:20px;
      border-radius:18px; background:linear-gradient(180deg, rgba(22,32,46,.95), rgba(15,23,42,.7)); border:1px solid var(--ax-line); }
    .cv-brand{ font-family:var(--ax-serif); font-size:22px; color:var(--ax-gold); }
    .cv-brand .sub{ display:block; font-family:'Tajawal',sans-serif; font-size:12px; color:var(--ax-muted); margin-top:2px; }
    .cv-back{ font-size:13px; color:var(--ax-blue); text-decoration:none; border:1px solid var(--ax-line); padding:7px 14px; border-radius:9px; }
    .cv-section{ margin-bottom:26px; } .cv-sec-title{ font-family:var(--ax-serif); color:var(--ax-gold); font-size:17px; margin-bottom:14px; }
    .cv-panel{ background:linear-gradient(180deg, rgba(22,32,46,.95), rgba(15,23,42,.7)); border:1px solid var(--ax-line); border-radius:18px; padding:8px; overflow:hidden; }
    .cv-panel-head{ display:flex; align-items:center; gap:14px; padding:16px 18px; border-bottom:1px solid var(--ax-line); }
    .cv-pulse{ flex:0 0 10px; width:10px; height:10px; border-radius:50%; background:var(--ax-green); animation:cvp 2s infinite; }
    @keyframes cvp{ 0%{box-shadow:0 0 0 0 rgba(16,185,129,.55)} 70%{box-shadow:0 0 0 12px rgba(16,185,129,0)} 100%{box-shadow:0 0 0 0 rgba(16,185,129,0)} }
    .cv-panel-head .t{ font-family:var(--ax-serif); color:var(--ax-gold); font-size:16px; } .cv-panel-head .n{ color:var(--ax-muted); font-size:13px; }
    .cv-panel-body{ padding:16px 14px; }
    #reignite-axes-root{ display:none; }
    .cv-rolebar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:12px 14px; margin-bottom:14px; background:#101a28; border:1px solid var(--ax-line); border-radius:12px; }
    .cv-rolebar .lbl{ color:var(--ax-muted); font-size:13px; }
    .cv-role-chip{ background:#1c2a40; border:1px solid var(--ax-line); border-radius:99px; padding:5px 12px; font-size:13px; color:var(--ax-text); cursor:pointer; }
    .cv-role-chip.active{ background:var(--ax-blue); border-color:var(--ax-blue); color:#fff; }

    /* ستايل المقياس المضمّن */
    .ax-card{ background:transparent; border:none; box-shadow:none; padding:18px 6px; animation:axFade .5s ease; }
    @keyframes axFade{ from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }
    .ax-centered{ text-align:center; } .ax-tag{ color:var(--ax-gold); font-size:14px; margin-bottom:18px; font-family:var(--ax-serif); }
    .ax-core{ font-size:22px; font-weight:700; line-height:1.8; margin-bottom:18px; font-family:var(--ax-serif); }
    .ax-reminder{ color:var(--ax-muted); font-size:15px; margin-bottom:24px; } .ax-lead{ color:#cbd5e1; font-size:16px; margin:0 0 18px; line-height:1.9; }
    .ax-section-title{ color:var(--ax-gold); font-size:15px; margin-bottom:16px; font-family:var(--ax-serif); }
    .ax-btn{ border:none; cursor:pointer; font-family:inherit; font-size:16px; font-weight:700; padding:13px 30px; border-radius:12px; transition:transform .15s; }
    .ax-btn.primary{ background:var(--ax-blue); color:#fff; box-shadow:0 8px 22px rgba(59,130,246,.30); } .ax-btn.primary:hover{ transform:translateY(-2px); }
    .ax-btn.ghost{ background:transparent; color:var(--ax-text); border:1px solid var(--ax-line); }
    .ax-progress-row{ display:flex; align-items:center; gap:14px; margin-bottom:26px; } .ax-progress-label{ color:var(--ax-muted); font-size:13px; white-space:nowrap; }
    .ax-progress-bar{ flex:1; height:6px; background:#22304a; border-radius:99px; overflow:hidden; } .ax-progress-fill{ height:100%; background:linear-gradient(90deg,var(--ax-blue),var(--ax-green)); transition:width .4s; }
    .ax-question{ font-size:21px; font-weight:700; line-height:1.7; margin-bottom:16px; }
    .ax-options{ display:flex; flex-direction:column; gap:22px; margin-bottom:24px; }
    .ax-option{ background:#101a28; border:1px solid var(--ax-line); border-radius:14px; padding:18px 18px 14px; }
    .ax-option-text{ display:flex; gap:12px; align-items:flex-start; font-size:17px; line-height:1.85; margin-bottom:16px; }
    .ax-letter{ flex:0 0 32px; height:32px; border-radius:50%; background:#1c2a40; color:var(--ax-gold); display:flex; align-items:center; justify-content:center; font-weight:700; }
    .ax-statement-text{ font-size:20px; font-weight:700; line-height:1.7; margin-bottom:24px; }
    .ax-scale{ display:flex; gap:10px; justify-content:flex-start; flex-wrap:wrap; }
    .ax-likert{ width:46px; height:46px; border-radius:50%; border:1px solid var(--ax-line); background:#101a28; color:var(--ax-text); font-family:inherit; font-size:16px; font-weight:700; cursor:pointer; transition:all .15s; }
    .ax-likert:hover{ border-color:var(--ax-green); transform:translateY(-2px); color:var(--ax-green); }
    .ax-likert.selected{ background:linear-gradient(135deg, var(--ax-blue), var(--ax-green)); border-color:var(--ax-blue); color:#fff; transform:scale(1.12); }
    .ax-scale-labels{ display:flex; justify-content:space-between; color:var(--ax-muted); font-size:12px; margin-top:8px; }
    .ax-nav{ display:flex; gap:12px; margin-top:8px; }
    .ax-reveal{ font-size:26px; font-weight:700; color:var(--ax-green); text-align:center; font-family:var(--ax-serif); margin:18px 0 22px; }
    .ax-p{ font-size:17px; line-height:2; color:#cbd5e1; margin:0 0 14px; }
    .ax-spectrum-bar{ direction:ltr; margin:14px 0 10px; }
    .axsb-track{ position:relative; display:flex; height:12px; border-radius:99px; overflow:hidden; background:#101a28; }
    .axsb-zone{ flex:1; height:100%; } .axsb-deficit{ background:rgba(59,130,246,.30); } .axsb-balance{ background:rgba(16,185,129,.30); } .axsb-excess{ background:rgba(251,191,36,.32); }
    .axsb-dot{ position:absolute; top:50%; width:16px; height:16px; border-radius:50%; transform:translate(-50%,-50%); box-shadow:0 0 0 3px rgba(15,23,42,.65); }
    .axsb-band{ position:absolute; top:50%; inset-inline-start:18%; width:64%; height:14px; transform:translateY(-50%); border-radius:99px; background:rgba(167,139,250,.32); }
    .axsb-labels{ direction:ltr; display:flex; justify-content:space-between; color:var(--ax-muted); font-size:12px; margin-top:8px; } .axsb-whisper{ direction:rtl; color:var(--ax-purple); font-size:13px; margin-top:8px; }
    .ax-wellness{ margin-top:8px; } .ax-wl-caption{ color:var(--ax-muted); font-size:14px; margin-bottom:14px; }
    .ax-wl-row{ display:flex; align-items:center; gap:12px; margin-bottom:12px; } .ax-wl-name{ flex:0 0 120px; font-size:14px; } .ax-wl-tag{ color:var(--ax-gold); font-size:11px; }
    .ax-wl-bar{ flex:1; height:8px; background:#22304a; border-radius:99px; overflow:hidden; } .ax-wl-fill{ height:100%; } .ax-wl-val{ flex:0 0 32px; text-align:left; font-size:14px; color:var(--ax-muted); }
    .ax-result .ax-section{ margin-bottom:28px; padding-bottom:22px; border-bottom:1px solid var(--ax-line); } .ax-result .ax-section:last-child{ border-bottom:none; }
    .ax-ground{ background:rgba(167,139,250,.06); border:1px solid rgba(167,139,250,.22); border-radius:14px; padding:22px; margin-bottom:28px; }
    .ax-ground-title{ color:var(--ax-purple); font-size:15px; margin-bottom:12px; font-family:var(--ax-serif); } .ax-ground p{ margin:0; font-size:17px; line-height:2; color:#cbd5e1; }
    .ax-h{ color:var(--ax-gold); font-size:18px; font-weight:700; margin-bottom:14px; font-family:var(--ax-serif); } .ax-seed{ color:var(--ax-purple); }
    .ax-bridge{ background:rgba(16,185,129,.05); border-radius:12px; padding:16px 18px; }
    .ax-actions{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:8px; }
    .ax-spinner{ width:34px; height:34px; border:3px solid #22304a; border-top-color:var(--ax-blue); border-radius:50%; margin:0 auto 14px; animation:axSpin 1s linear infinite; } @keyframes axSpin{ to{transform:rotate(360deg)} }
    .ax-saving{ color:var(--ax-muted); } .ax-check{ font-size:46px; color:var(--ax-green); margin-bottom:14px; } .ax-done-line{ font-size:20px; font-weight:700; margin-bottom:10px; } .ax-done-note{ color:var(--ax-muted); }
    .ax-practice-card{ background:rgba(251,191,36,.08); border:1px solid rgba(251,191,36,.25); border-radius:12px; padding:16px 18px; font-size:17px; line-height:2; color:#fde9b8; }
    @media(max-width:520px){ .cv-shell{ padding:18px 12px 80px; } .ax-question{ font-size:19px; } .ax-likert{ width:40px; height:40px; } }
  </style>
</head>
<body>
  <div class="cv-shell">
    <div class="cv-top">
      <div class="cv-brand">القاعة المباشرة<span class="sub">Reignite — اللقاء الحيّ</span></div>
      <a class="cv-back" href="course-view.html?id=reignite">⌂ صفحة رحلتك</a>
    </div>

    <div class="cv-section">
      <!-- شريط اختيار الدور (للسيناريوهات) -->
      <div class="cv-rolebar" id="cvRoleBar"><span class="lbl">دورك:</span></div>

      <div class="cv-panel">
        <div class="cv-panel-head">
          <span class="cv-pulse"></span>
          <div><div class="t" id="cvPhaseTitle">…</div><div class="n" id="cvPhaseNote"></div></div>
        </div>
        <div class="cv-panel-body">
          <div id="cvStage"></div>
          <div id="reignite-axes-root"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="../../js/firebase-config.js"></script>
  <script src="../scale/axes-config.js"></script>
  <script src="../scale/axes-questions.js"></script>
  <script src="../scale/axes-content.js"></script>
  <script src="../scale/axes-engine.js"></script>
  <script src="../scale/axes-bridge.js"></script>
  <script src="../scale/axes-store.js"></script>
  <script src="../scale/axes-render.js"></script>
  <script src="../scale/axes-app.js"></script>
  <script src="../core/axes-session.js"></script>
  <script src="../core/reignite-roster.js"></script>
  <script src="../core/flow-loader.js"></script>
  <script src="../core/reignite-live.js"></script>
  <script src="../core/reignite-stage.js"></script>

 <script>
  (function(){
    "use strict";
    var S=window.AXES_SESSION, STORE=window.AXES_STORE,
        LIVE=window.REIGNITE_LIVE, STAGE=window.REIGNITE_STAGE, F=window.REIGNITE_FLOW,
        ROSTER=window.REIGNITE_ROSTER;

    var user=(STORE&&STORE.getCurrentUser)?STORE.getCurrentUser():null;
    if(!user||!user.id){ try{ window.location.href='../../login.html'; }catch(e){} return; }

    /* ── شريط الدور ── */
    var myRole = localStorage.getItem('reignite_role') || 'leader';
    function buildRoleBar(){
      var bar=document.getElementById('cvRoleBar');
      bar.innerHTML='<span class="lbl">دورك:</span>';
      F.ROLES.forEach(function(r){
        var b=document.createElement('button');
        b.className='cv-role-chip'+(r.id===myRole?' active':'');
        b.textContent=r.name;
        b.addEventListener('click', function(){ myRole=r.id; localStorage.setItem('reignite_role', myRole); buildRoleBar(); renderStage(); });
        bar.appendChild(b);
      });
    }

    /* ── حالة المراحل ── */
    var curPhase='waiting', myStage='waiting', scaleInited=false, myAnswers={};
    function setStage(st){ myStage=st; try{ S.heartbeat(user,{stage:st}); }catch(e){} }

    function showScaleMount(){
      document.getElementById('cvStage').style.display='none';
      var root=document.getElementById('reignite-axes-root'); root.style.display='block';
      if(!scaleInited && window.AXES_APP){ scaleInited=true; window.AXES_APP.init({ rootId:'reignite-axes-root', loginPath:'../login.html' }); }
      if(myStage==='waiting'||myStage==='flow') setStage('scale');
    }
    function showFlow(){
      document.getElementById('reignite-axes-root').style.display='none';
      document.getElementById('cvStage').style.display='block';
    }

    function renderStage(){
      var p=F.phases[curPhase];
      document.getElementById('cvPhaseTitle').textContent=p?p.title:'';
      document.getElementById('cvPhaseNote').textContent=p?(p.clientNote||''):'';

      if(curPhase==='scale' || curPhase==='result'){ showScaleMount(); return; }
      showFlow();

      var ctx={ user:user, role:myRole, answers:myAnswers,
        onAnswer:function(phaseId, data){
          myAnswers[phaseId]=Object.assign({}, myAnswers[phaseId]||{}, data);
          LIVE.saveResponse(user, phaseId, myAnswers[phaseId]);
        } };
      STAGE.render(document.getElementById('cvStage'), curPhase, 'client', ctx);
    }

    /* إن كان قد أتمّ المقياس سابقًا → مرحلته نتيجة */
    if(STORE&&STORE.loadAssessment){
      STORE.loadAssessment(user.id).then(function(d){
        if(d&&d.results&&d.results.ranking){ myStage='result'; setStage('result'); }
      }).catch(function(){});
    }

    /* استرجاع إجاباتي السابقة في التدفّق (استئناف عبر الأجهزة) */
    if(LIVE&&LIVE.getMyResponses){
      LIVE.getMyResponses(user.id).then(function(a){ myAnswers=a||{}; if(curPhase!=='scale'&&curPhase!=='result') renderStage(); }).catch(function(){});
    }

    window.onAxesComplete=function(lean){ setStage('result'); };

    /* ── الإقلاع: نحلّ الجلسة من تسكين العميل أوّلًا، ثمّ نربط المستمعات ── */
    function boot(){
      buildRoleBar(); renderStage();
      try{ S.registerPresence(user,{stage:'waiting'}); }catch(e){}
      setInterval(function(){ try{ S.heartbeat(user,{stage:myStage}); }catch(e){} }, 30000);
      S.onSessionChange(function(s){
        var sDay=(s&&s.customData&&s.customData.day)?String(s.customData.day):'1';
        if(sDay!==String(window.REIGNITE_DAY||'1')){
          var q=new URLSearchParams(location.search); q.set('day', sDay);
          location.search='?'+q.toString(); return;
        }
        curPhase=(s&&s.currentPhase)||'waiting';
        if(curPhase!=='waiting' && myStage==='waiting') setStage('flow');
        renderStage();
      });
    }

    if(S.resolveSessionFromRoster){ S.resolveSessionFromRoster(user).then(boot).catch(boot); }
    else {
      var qs=new URLSearchParams(window.location.search); var sid=qs.get('session'); if(sid) S.setSessionId(sid);
      boot();
    }
  })();
  </script>
</body>
</html>
