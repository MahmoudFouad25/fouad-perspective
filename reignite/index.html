<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title data-i18n="meta.title">Reignite — من الاحتراق إلى التألق | Burnout to Brilliance Program</title>
<meta name="description" data-i18n-attr="content" data-i18n="meta.desc" content="مش رحلة عن الاحتراق. دي رحلة بتنزل بيك للطريقة الواحدة اللي بنيت بيها نجاحك — وهي نفسها اللي واقفة ورا تعبك دلوقتي — وتخرج منها وإنت عارف نفسك بشكل معرفتوش قبل كده. بقيادة كوتش محمود فؤاد، وتُقدَّم حصريًا من خلال Proactive Development Solutions." />
<meta name="author" content="كوتش محمود فؤاد — منظور الفؤاد" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Reignite — Burnout to Brilliance Program" />
<meta property="og:description" content="الاستراتيجية اللي بنيت بيها نجاحك… هي نفسها اللي واقفة ورا تعبك دلوقتي." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#0b1220;
  --bg-2:#0e1730;
  --surface:#121d38;
  --card:#16223f;
  --card-2:#1b294a;
  --gold:#e3b341;
  --gold-2:#f3d588;
  --gold-deep:#b98a17;
  --ember:#e8633f;
  --ember-2:#f3895b;
  --teal:#4a7c8c;
  --violet:#a86fd8;
  --violet-2:#d9a7ff;
  --text:#ece8df;
  --text-soft:#c3c8d6;
  --muted:#8a93a8;
  --line:rgba(255,255,255,.08);
  --line-gold:rgba(227,179,65,.22);
  --radius:18px;
  --maxw:1120px;
  /* font roles swap with language */
  --font-display:"El Messiri",serif;
  --font-body:"IBM Plex Sans Arabic",sans-serif;
}
html[lang="en"]{
  --font-display:"Fraunces",serif;
  --font-body:"Inter",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--text);
  line-height:1.95;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
html[lang="en"] body{line-height:1.75}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.4;font-weight:700;color:#fff}
html[lang="en"] h1,html[lang="en"] h2,html[lang="en"] h3,html[lang="en"] h4{line-height:1.2;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
.en{font-family:var(--font-body);direction:ltr;unicode-bidi:embed;letter-spacing:.02em}

.wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}
section{position:relative}
.sec{padding:100px 0}
@media(max-width:720px){.sec{padding:66px 0}}
.eyebrow{
  font-size:.78rem;letter-spacing:.26em;font-weight:600;
  color:var(--gold);margin-bottom:18px;
  display:inline-flex;align-items:center;gap:10px
}
html[lang="en"] .eyebrow{letter-spacing:.18em;text-transform:uppercase;font-size:.72rem}
.eyebrow::before{content:"";width:26px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
[dir="ltr"] .eyebrow::before{background:linear-gradient(270deg,transparent,var(--gold))}
.sec-title{font-size:clamp(1.7rem,4.2vw,2.7rem);margin-bottom:16px}
.sec-sub{color:var(--text-soft);font-size:1.06rem;max-width:740px;margin-bottom:50px;line-height:1.9}
html[lang="en"] .sec-sub{line-height:1.7}
.center{text-align:center}
.center .eyebrow::before{display:none}
.center .sec-sub{margin-inline:auto}

.btn{
  display:inline-flex;align-items:center;gap:10px;
  font-family:var(--font-body);font-weight:700;font-size:1.02rem;
  padding:16px 30px;border-radius:60px;cursor:pointer;border:none;
  background:linear-gradient(135deg,var(--gold-2),var(--gold),var(--gold-deep));
  color:#1a1408;box-shadow:0 14px 40px -14px rgba(227,179,65,.7);
  transition:transform .25s ease, box-shadow .25s ease;position:relative
}
.btn:hover{transform:translateY(-2px);box-shadow:0 20px 50px -14px rgba(227,179,65,.85)}
[dir="rtl"] .btn svg{transform:scaleX(-1)}
.btn-ghost{background:transparent;color:var(--gold);border:1.5px solid var(--line-gold);box-shadow:none}
.btn-ghost:hover{border-color:var(--gold);background:rgba(227,179,65,.06)}
.cta-note{margin-top:18px;color:var(--muted);font-size:.9rem;display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.cta-note span{display:inline-flex;align-items:center;gap:6px}
.cta-note b{color:var(--gold)}

/* ===== language switch ===== */
.lang-switch{
  position:fixed;top:16px;inset-inline-end:18px;z-index:320;
  display:inline-flex;align-items:center;gap:2px;
  background:rgba(11,18,32,.82);backdrop-filter:blur(12px);
  border:1px solid var(--line-gold);border-radius:60px;padding:4px
}
.lang-switch button{
  font-family:"Inter",sans-serif;font-weight:600;font-size:.82rem;letter-spacing:.04em;
  border:none;background:transparent;color:var(--text-soft);
  padding:7px 15px;border-radius:60px;cursor:pointer;transition:all .25s ease
}
.lang-switch button.active{
  background:linear-gradient(135deg,var(--gold-2),var(--gold));color:#1a1408;box-shadow:0 4px 14px -6px rgba(227,179,65,.7)
}
.lang-switch button:not(.active):hover{color:#fff}
@media(max-width:560px){.lang-switch{top:12px;inset-inline-end:12px}.lang-switch button{padding:6px 12px;font-size:.76rem}}

#progress{position:fixed;top:0;inset-inline-end:0;height:3px;width:0;z-index:300;
  background:linear-gradient(90deg,var(--ember),var(--gold));box-shadow:0 0 12px var(--gold)}
#sticky{
  position:fixed;left:0;right:0;bottom:-120px;z-index:280;
  background:rgba(11,18,32,.92);backdrop-filter:blur(14px);
  border-top:1px solid var(--line-gold);
  padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;
  transition:bottom .4s cubic-bezier(.4,0,.2,1)
}
#sticky.show{bottom:0}
#sticky .s-txt b{display:block;font-family:var(--font-display);color:#fff;font-size:1.05rem}
#sticky .s-txt span{color:var(--gold);font-size:.85rem}
@media(max-width:560px){#sticky .s-txt span{display:none}#sticky .btn{padding:13px 20px;font-size:.92rem}}

.hero{
  min-height:100vh;display:flex;align-items:center;
  background:
    radial-gradient(800px 500px at 70% -5%, rgba(232,99,63,.22), transparent 60%),
    radial-gradient(700px 600px at 15% 10%, rgba(227,179,65,.13), transparent 55%),
    linear-gradient(180deg,var(--bg-2),var(--bg));
  overflow:hidden;padding:120px 0 80px
}
.hero::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(227,179,65,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(227,179,65,.04) 1px,transparent 1px);
  background-size:64px 64px;
  -webkit-mask-image:radial-gradient(circle at 50% 30%,#000,transparent 75%);
  mask-image:radial-gradient(circle at 50% 30%,#000,transparent 75%)
}
.hero .wrap{position:relative;z-index:2;display:grid;grid-template-columns:1.25fr .75fr;gap:50px;align-items:center}
@media(max-width:860px){.hero .wrap{grid-template-columns:1fr;gap:36px}}
.hero-pre{
  display:inline-flex;align-items:center;gap:12px;flex-wrap:wrap;
  font-size:.82rem;color:var(--text-soft);border:1px solid var(--line);
  padding:8px 16px;border-radius:60px;background:rgba(255,255,255,.02);margin-bottom:28px
}
.hero-pre b{color:var(--gold)}
.hero-pre .dot{width:6px;height:6px;border-radius:50%;background:var(--ember);box-shadow:0 0 10px var(--ember)}
.hero h1{font-size:clamp(2.1rem,6vw,3.7rem);font-weight:700;letter-spacing:-.01em;line-height:1.3}
html[lang="en"] .hero h1{line-height:1.12}
.hero h1 .grad{
  background:linear-gradient(120deg,var(--gold-2),var(--ember));
  -webkit-background-clip:text;background-clip:text;color:transparent
}
.hero p.lead{font-size:clamp(1.05rem,2.4vw,1.3rem);color:var(--text-soft);margin:26px 0 38px;max-width:600px;line-height:1.95}
html[lang="en"] .hero p.lead{line-height:1.7}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.hero .cta-note{justify-content:flex-start;margin-top:26px}

.flame-wrap{position:relative;display:flex;justify-content:center}
.flame{width:min(320px,80%);filter:drop-shadow(0 0 40px rgba(232,99,63,.35))}
.flame .f1{animation:flick 3.4s ease-in-out infinite}
.flame .f2{animation:flick 2.6s ease-in-out infinite reverse}
@keyframes flick{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-6px) scaleY(1.05)}}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--gold-2);box-shadow:0 0 12px var(--gold);opacity:0}
.s1{top:30%;left:38%;animation:rise 4s ease-in infinite}
.s2{top:45%;left:60%;animation:rise 5.2s ease-in infinite 1.4s}
.s3{top:55%;left:46%;animation:rise 4.6s ease-in infinite 2.6s}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-130px) scale(.2)}}

.pain{background:linear-gradient(180deg,var(--bg),var(--bg-2))}
.pain-body{max-width:780px}
.pain-body p{font-size:1.12rem;color:var(--text-soft);margin-bottom:22px;line-height:1.95}
html[lang="en"] .pain-body p{line-height:1.7}
.pain-body p strong{color:#fff;font-weight:600}
.symptoms{display:grid;gap:14px;margin:36px 0;max-width:640px}
.symptom{display:flex;gap:14px;align-items:flex-start;color:var(--text-soft);
  background:rgba(232,99,63,.05);border:1px solid rgba(232,99,63,.16);padding:16px 20px;border-radius:14px;line-height:1.85}
.symptom .x{color:var(--ember);font-weight:800;flex:0 0 auto;margin-top:2px}
.pain-punch{
  font-family:var(--font-display);font-size:clamp(1.3rem,3.6vw,1.9rem);color:#fff;
  border-inline-start:3px solid var(--gold);padding:10px 22px;margin-top:20px;max-width:700px;line-height:1.55
}

.idea{background:radial-gradient(600px 400px at 80% 0%,rgba(227,179,65,.1),transparent 60%),var(--bg)}
.idea-card{
  background:linear-gradient(160deg,var(--card-2),var(--card));
  border:1px solid var(--line-gold);border-radius:28px;padding:56px 46px;text-align:center;
  position:relative;overflow:hidden;max-width:900px;margin:0 auto
}
.idea-card::before{content:"";position:absolute;top:-60px;left:50%;transform:translateX(-50%);
  width:240px;height:240px;background:radial-gradient(circle,rgba(232,99,63,.3),transparent 70%);filter:blur(20px)}
.idea-card .big{font-family:var(--font-display);font-size:clamp(1.6rem,4.6vw,2.4rem);color:#fff;position:relative;margin-bottom:22px;line-height:1.5}
.idea-card .big em{font-style:normal;color:var(--ember)}
.idea-card p{color:var(--text-soft);font-size:1.08rem;position:relative;max-width:680px;margin:0 auto 18px;line-height:1.95}
html[lang="en"] .idea-card p{line-height:1.7}
.idea-card .last{color:var(--gold-2);font-family:var(--font-display);font-size:1.22rem;margin-top:10px;line-height:1.6}

.cycle-sec{background:linear-gradient(180deg,var(--bg),var(--bg-2))}
.lifecurve-box{background:rgba(255,255,255,.02);border:1px solid var(--line);
  border-radius:22px;padding:34px 24px 18px;margin-bottom:40px}
.lifecurve{width:100%;height:auto;display:block}
.lifecurve text{font-family:var(--font-body);font-size:15px}
.moments{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
@media(max-width:720px){.moments{grid-template-columns:1fr}}
.moment{background:linear-gradient(160deg,var(--card),var(--bg-2));
  border:1px solid var(--line);border-radius:20px;padding:30px;position:relative;overflow:hidden;
  transition:border-color .3s ease,transform .3s ease}
.moment:hover{border-color:var(--line-gold);transform:translateY(-3px)}
.moment .m-num{font-family:var(--font-display);font-size:1.35rem;color:var(--gold);
  width:44px;height:44px;border-radius:12px;border:1px solid var(--line-gold);
  display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.moment h4{font-size:1.3rem;margin-bottom:6px}
.moment .m-tag{font-size:.8rem;letter-spacing:.04em;color:var(--gold);margin-bottom:14px;font-weight:600}
.moment p{color:var(--text-soft);font-size:1rem;line-height:1.9}
html[lang="en"] .moment p{line-height:1.65}
.moment.m1{border-top:3px solid var(--teal)}
.moment.m2{border-top:3px solid var(--gold)}
.moment.m3{border-top:3px solid var(--ember-2)}
.moment.m4{border-top:3px solid var(--ember)}
.moment.m4 .m-num{color:var(--ember-2);border-color:rgba(232,99,63,.35)}
.reveal-card{margin-top:32px;background:
  radial-gradient(500px 280px at 85% 0%,rgba(232,99,63,.16),transparent 60%),
  linear-gradient(160deg,var(--card-2),var(--card));
  border:1px solid var(--line-gold);border-radius:24px;padding:46px 42px;text-align:center}
@media(max-width:600px){.reveal-card{padding:34px 24px}}
.reveal-card .rc-big{font-family:var(--font-display);font-size:clamp(1.4rem,3.8vw,2rem);color:#fff;margin-bottom:16px;line-height:1.5}
.reveal-card .rc-big em{font-style:normal;color:var(--gold-2)}
.reveal-card p{color:var(--text-soft);font-size:1.06rem;max-width:700px;margin:0 auto 16px;line-height:1.95}
html[lang="en"] .reveal-card p{line-height:1.7}
.reveal-card .last{color:var(--gold-2);font-family:var(--font-display);font-size:1.2rem;line-height:1.6}

.who{background:radial-gradient(600px 400px at 20% 0%,rgba(232,99,63,.07),transparent 55%),var(--bg)}
.voice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:860px){.voice-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.voice-grid{grid-template-columns:1fr}}
.voice{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 26px;
  transition:transform .3s ease,border-color .3s ease;display:flex;flex-direction:column}
.voice:hover{transform:translateY(-4px);border-color:var(--line-gold)}
.voice .v-tag{font-family:var(--font-display);font-weight:700;color:var(--gold-2);font-size:1.06rem;margin-bottom:16px;
  display:flex;align-items:center;gap:10px;line-height:1.5}
.voice .v-tag::before{content:"";width:8px;height:8px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),var(--ember));flex:0 0 auto}
.voice p{color:var(--text-soft);font-size:1rem;line-height:1.9}
html[lang="en"] .voice p{line-height:1.65}
.who-foot{text-align:center;margin-top:46px;color:var(--text-soft);font-size:1.1rem;max-width:760px;margin-inline:auto;line-height:1.9}
html[lang="en"] .who-foot{line-height:1.7}
.who-foot b{color:var(--gold-2)}

.diff-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:760px){.diff-grid{grid-template-columns:1fr}}
.diff{background:linear-gradient(160deg,var(--card),var(--bg-2));
  border:1px solid var(--line);border-radius:20px;padding:32px;position:relative;overflow:hidden}
.diff::after{content:"";position:absolute;top:0;inset-inline-end:0;width:90px;height:90px;
  background:radial-gradient(circle at top right,rgba(227,179,65,.16),transparent 70%)}
.diff .num{font-family:var(--font-display);font-size:1.5rem;color:var(--gold);
  width:46px;height:46px;border-radius:12px;border:1px solid var(--line-gold);
  display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.diff h4{font-size:1.22rem;margin-bottom:12px;line-height:1.5}
.diff p{color:var(--text-soft);font-size:1rem;line-height:1.9}
html[lang="en"] .diff p{line-height:1.65}

.journey{background:radial-gradient(700px 500px at 80% 0%,rgba(232,99,63,.08),transparent 55%),var(--bg-2)}
.flip-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:860px){.flip-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.flip-grid{grid-template-columns:1fr}}
.phase-head{grid-column:1/-1;display:flex;align-items:center;gap:16px;margin-top:32px;transition:opacity .5s ease}
.phase-head:first-child{margin-top:0}
.phase-head.dim{opacity:.15}
.phase-head .ph-label{font-family:var(--font-display);font-weight:700;font-size:1.18rem;white-space:nowrap}
.phase-head .ph-line{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
[dir="ltr"] .phase-head .ph-line{background:linear-gradient(270deg,var(--line),transparent)}
.phase-head.t-pre .ph-label{color:var(--text-soft)}
.phase-head.t-down .ph-label{color:var(--ember-2)}
.phase-head.t-bottom .ph-label{color:var(--violet-2)}
.phase-head.t-up .ph-label{color:var(--gold-2)}
.phase-head .ph-note{color:var(--muted);font-size:.85rem;white-space:nowrap}
@media(max-width:560px){.phase-head .ph-note{display:none}}

.flip{perspective:1600px;cursor:pointer;transition:opacity .5s ease,transform .5s ease,filter .5s ease}
.flip.dim{opacity:.18;transform:scale(.97);filter:blur(2px);pointer-events:none}
.flip.open{grid-column:1/-1}
.flip-inner{position:relative;width:100%;min-height:280px;transition:transform .75s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.flip.open .flip-inner{transform:rotateY(180deg)}
[dir="ltr"] .flip.open .flip-inner{transform:rotateY(-180deg)}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;width:100%}
.front{position:relative;background:linear-gradient(160deg,var(--card-2),var(--card));
  border:1px solid var(--line);padding:26px;min-height:280px;
  display:flex;flex-direction:column;transition:border-color .3s ease,box-shadow .3s ease}
.flip:hover .front{border-color:var(--line-gold);box-shadow:0 16px 40px -22px rgba(227,179,65,.5)}
.flip.open .front{position:absolute;inset:0}
.front .top-row{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.front .st-num{font-family:var(--font-display);font-weight:700;color:#1a1408;font-size:.85rem;
  background:linear-gradient(135deg,var(--gold-2),var(--gold));padding:3px 13px;border-radius:8px}
.front .st-phase{font-size:.74rem;letter-spacing:.05em;color:var(--muted);
  border:1px solid var(--line);padding:3px 10px;border-radius:8px}
.flip[data-tone="bottom"] .front .st-num{background:linear-gradient(135deg,var(--violet-2),var(--violet));color:#1d0a2e}
.flip[data-tone="up"] .front .st-num{background:linear-gradient(135deg,var(--gold-2),var(--ember-2));color:#1a1408}
.front h3{font-size:1.32rem;margin-bottom:10px;line-height:1.4}
.front .st-q{font-family:var(--font-display);color:var(--gold-2);font-size:1.04rem;margin-bottom:14px;line-height:1.6}
.front .fdesc{color:var(--text-soft);font-size:.96rem;flex:1;line-height:1.85}
html[lang="en"] .front .fdesc{line-height:1.6}
.front .explore{color:var(--gold);font-size:.85rem;font-weight:600;margin-top:18px;opacity:.85}
.back{position:absolute;inset:0;transform:rotateY(180deg);
  background:linear-gradient(165deg,var(--card-2),var(--bg-2));
  border:1px solid var(--line-gold);padding:34px 34px 30px;overflow:hidden}
[dir="ltr"] .back{transform:rotateY(-180deg)}
.flip.open .back{position:relative;inset:auto}
@media(max-width:560px){.back{padding:28px 24px}}
.back-head{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.back-head .st-num{font-family:var(--font-display);font-weight:700;color:#1a1408;font-size:.95rem;
  background:linear-gradient(135deg,var(--gold-2),var(--gold));padding:5px 14px;border-radius:10px}
.back-head h3{font-size:1.42rem;line-height:1.4}
.back .objective{color:var(--text-soft);font-size:1rem;margin-bottom:24px;
  padding-bottom:22px;border-bottom:1px solid var(--line);line-height:1.9}
html[lang="en"] .back .objective{line-height:1.65}
.back .b-label{font-size:.74rem;letter-spacing:.22em;color:var(--gold);font-weight:600;margin-bottom:14px}
html[lang="en"] .back .b-label{letter-spacing:.18em}
.back ul{list-style:none;display:grid;gap:11px;grid-template-columns:1fr 1fr}
@media(max-width:760px){.back ul{grid-template-columns:1fr}}

.inst{background:linear-gradient(180deg,var(--bg),var(--bg-2))}

.inst-bio{color:var(--text-soft);font-size:1rem;border-top:1px solid var(--line);padding-top:22px;line-height:1.95}
html[lang="en"] .inst-bio{line-height:1.7}

.spark-sec{background:linear-gradient(180deg,var(--bg-2),var(--bg))}
.spark-card{position:relative;overflow:hidden;border-radius:28px;
  background:radial-gradient(600px 420px at 85% 115%,rgba(232,99,63,.30),transparent 60%),
    linear-gradient(160deg,var(--card-2),var(--bg-2));
  border:1px solid rgba(232,99,63,.32);padding:58px 50px}
@media(max-width:640px){.spark-card{padding:40px 26px}}
.spark-glow{position:absolute;bottom:-90px;left:50%;transform:translateX(-50%);
  width:360px;height:360px;border-radius:50%;
  background:radial-gradient(circle,rgba(232,99,63,.42),transparent 70%);filter:blur(34px);pointer-events:none}
.spark-inner{position:relative;z-index:2;display:grid;grid-template-columns:1.3fr .7fr;gap:48px;align-items:center}
@media(max-width:760px){.spark-inner{grid-template-columns:1fr;gap:34px}}
.spark-text h2{font-size:clamp(1.9rem,5vw,2.8rem);margin-bottom:18px;
  background:linear-gradient(120deg,var(--gold-2),var(--ember));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.spark-lead{color:var(--text-soft);font-size:1.1rem;margin-bottom:24px;max-width:580px;line-height:1.95}
html[lang="en"] .spark-lead{line-height:1.7}
.spark-points{list-style:none;display:grid;gap:13px;margin-bottom:32px}
.spark-points li{display:flex;gap:12px;align-items:center;color:var(--text);font-size:1rem;line-height:1.7}
.spark-points li::before{content:"✓";flex:0 0 auto;width:22px;height:22px;border-radius:50%;
  background:linear-gradient(135deg,var(--ember-2),var(--ember));color:#fff;font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center}
.btn-spark{background:linear-gradient(135deg,var(--ember-2),var(--ember),#b22f12);color:#fff;
  box-shadow:0 14px 40px -14px rgba(232,99,63,.8)}
.btn-spark:hover{box-shadow:0 20px 50px -14px rgba(232,99,63,.95)}
.spark-note{margin-top:18px;color:var(--muted);font-size:.88rem}
.spark-steps{display:grid;gap:12px}
.sp-step{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.03);
  border:1px solid var(--line);border-radius:14px;padding:15px 16px;transition:transform .3s ease,border-color .3s ease}
[dir="rtl"] .sp-step:hover{transform:translateX(-6px);border-color:rgba(232,99,63,.4)}
[dir="ltr"] .sp-step:hover{transform:translateX(6px);border-color:rgba(232,99,63,.4)}
.sp-step .n{flex:0 0 auto;width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,rgba(232,99,63,.25),rgba(227,179,65,.18));color:var(--gold-2);
  font-family:var(--font-display);font-weight:700;display:flex;align-items:center;justify-content:center}
.sp-step span{color:var(--text-soft);font-size:.95rem}
.ember-rise{position:absolute;bottom:26px;width:5px;height:5px;border-radius:50%;
  background:var(--ember-2);box-shadow:0 0 10px var(--ember);opacity:0;z-index:1}
.er1{left:22%;animation:emberUp 4.5s ease-in infinite}
.er2{left:50%;animation:emberUp 5.6s ease-in infinite 1.5s}
.er3{left:76%;animation:emberUp 5s ease-in infinite 2.8s}
@keyframes emberUp{0%{opacity:0;transform:translateY(0) scale(.8)}15%{opacity:1}100%{opacity:0;transform:translateY(-210px) scale(.2)}}

.faq{max-width:840px;margin:0 auto}
.qa{border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden;
  background:var(--card);transition:border-color .3s ease}
.qa[open]{border-color:var(--line-gold)}
.qa summary{list-style:none;cursor:pointer;padding:22px 26px;display:flex;justify-content:space-between;
  gap:16px;align-items:center;font-family:var(--font-display);font-weight:600;color:#fff;font-size:1.08rem;line-height:1.5}

.qa summary .pl{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:1px solid var(--line-gold);
  color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;transition:transform .3s ease}
.qa[open] summary .pl{transform:rotate(45deg)}
.qa .ans{padding:0 26px 24px;color:var(--text-soft);font-size:1rem;line-height:1.95}

.call{background:
  radial-gradient(700px 400px at 50% 0%,rgba(232,99,63,.18),transparent 60%),

.call .seats{color:var(--gold-2);font-family:var(--font-display);font-size:1.05rem;margin:28px auto 0;max-width:640px;line-height:1.75}
.register{background:var(--bg-2)}
.form-frame{background:#fff;border-radius:22px;overflow:hidden;border:1px solid var(--line-gold);
  box-shadow:0 30px 80px -30px rgba(0,0,0,.7);max-width:760px;margin:0 auto}
.form-frame iframe{width:100%;height:1100px;border:0;display:block}
.form-fallback{text-align:center;margin-top:24px;color:var(--muted);font-size:.95rem}

footer{background:var(--bg);border-top:1px solid var(--line);padding:56px 0 40px}

        <path class="f2" d="M100 96c8 22 30 30 30 60 0 27-20 44-42 44-20 0-40-16-30-46 6-18 18-18 22-6 4 12-4 18 2 28 2-26-4-40 6-56 2-10 8-18 12-28Z" fill="url(#g2)"/>

        <path d="M 770 195 C 700 188, 640 60, 545 56 C 480 53, 445 100, 405 135 C 372 164, 330 192, 270 200"
              fill="none" stroke="url(#lc1)" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M 270 200 C 210 206, 150 150, 110 80 C 98 58, 90 46, 80 40"

        <circle cx="770" cy="195" r="6" fill="#4a7c8c"/>

        <text x="420" y="120" text-anchor="middle" fill="#f3895b" data-i18n="curve.strain"></text>

    <div class="moments rv">
