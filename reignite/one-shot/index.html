<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reignite — اليوم الختامي · منظور الفؤاد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Readex+Pro:wght@200;300;400;500;600&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#15100E; --bg2:#1C1512; --surf:#241B16; --surf2:#2C211A; --surf3:#33261D;
  --line:#3A2C23; --line2:#4A382C;
  --ink:#F4ECE3; --muted:#B7A99B; --faint:#857A6D;
  --ember:#E3A95B; --ember-soft:#F0C98E; --fire:#CB6A3E;
  --bal:#5FB094; --exc:#DB6A4E; --def:#928677;
  --hifz:#CDA152; --hayawiyya:#DC6650; --intima:#849BC7;
  --disp:'El Messiri', serif; --body:'Readex Pro', sans-serif; --turath:'Amiri', serif;
  --r:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden}
body{
  background:
    radial-gradient(120% 90% at 85% -10%, rgba(203,106,62,.16), transparent 55%),
    radial-gradient(100% 80% at 10% 110%, rgba(227,169,91,.10), transparent 55%),
    var(--bg);
}

/* ---------- stage ---------- */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:34px 40px 56px}
.slide{
  position:absolute;width:min(1180px,94vw);height:min(680px,86vh);
  background:linear-gradient(160deg,var(--bg2),#120D0B);
  border:1px solid var(--line);border-radius:var(--r);
  box-shadow:0 30px 80px -30px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.03);
  padding:40px 48px;opacity:0;transform:translateY(14px) scale(.985);
  transition:opacity .45s ease, transform .45s cubic-bezier(.2,.8,.2,1);
  pointer-events:none;overflow:hidden;display:flex;flex-direction:column}
.slide.active{opacity:1;transform:none;pointer-events:auto;z-index:2}
.slide.dense{padding:26px 34px}
.slide-body{flex:1;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.slide-body::-webkit-scrollbar{width:7px}
.slide-body::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}

/* ---------- shared bits ---------- */
.eyebrow{font-size:12px;letter-spacing:.22em;color:var(--ember);font-weight:600;
  text-transform:none;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.eyebrow::before{content:"";width:26px;height:1px;background:linear-gradient(90deg,var(--ember),transparent)}
h1.title{font-family:var(--disp);font-weight:700;line-height:1.18}
h2.head{font-family:var(--disp);font-weight:700;font-size:clamp(26px,3.4vw,40px);line-height:1.2;margin-bottom:6px}
.subhead{color:var(--muted);font-size:clamp(15px,1.6vw,19px);font-weight:300;line-height:1.7;max-width:74ch}
.q{color:var(--ember-soft);font-family:var(--disp);font-weight:500;font-size:clamp(17px,2vw,23px);line-height:1.5}
.lead{font-size:clamp(16px,1.8vw,21px);line-height:1.8;font-weight:300;color:var(--ink);max-width:70ch}
.turath{font-family:var(--turath);font-size:18px;color:var(--ember-soft);line-height:1.9}
.flame{display:inline-block;width:9px;height:9px;border-radius:50% 50% 50% 0;transform:rotate(45deg);
  background:var(--ember);box-shadow:0 0 12px var(--fire)}

/* ---------- title slide ---------- */
.cover{justify-content:center;align-items:flex-start;text-align:right}
.cover .brand{font-family:var(--turath);font-size:22px;color:var(--ember);letter-spacing:.04em;margin-bottom:30px}
.cover h1{font-size:clamp(42px,7vw,82px);background:linear-gradient(120deg,#F6E7CF,var(--ember) 55%,var(--fire));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.cover .tag{font-family:var(--disp);font-weight:500;font-size:clamp(18px,2.4vw,28px);color:var(--ink);margin-top:18px;line-height:1.5}
.cover .sub{color:var(--muted);font-weight:300;margin-top:22px;font-size:17px;line-height:1.8;max-width:62ch}
.ribbon{display:flex;gap:8px;margin-top:34px}
.ribbon span{height:6px;flex:1;border-radius:6px;opacity:.85}
.ribbon .a{background:linear-gradient(90deg,var(--def),#6f655a)}
.ribbon .b{background:linear-gradient(90deg,#6f655a,var(--bal))}
.ribbon .c{background:linear-gradient(90deg,var(--bal),var(--ember),var(--exc))}

/* ---------- two-pane (compare) ---------- */
.split{display:grid;grid-template-columns:1fr 1fr;gap:22px;height:100%}
.panel{border:1px solid var(--line);border-radius:14px;padding:26px;display:flex;flex-direction:column;gap:10px;background:var(--surf)}
.panel.green{border-color:rgba(95,176,148,.4);background:linear-gradient(160deg,rgba(95,176,148,.08),var(--surf))}
.panel.red{border-color:rgba(219,106,78,.4);background:linear-gradient(160deg,rgba(219,106,78,.09),var(--surf))}
.panel .ph{font-family:var(--disp);font-weight:700;font-size:24px}
.panel.green .ph{color:var(--bal)} .panel.red .ph{color:var(--exc)}
.panel p{color:var(--muted);font-weight:300;line-height:1.8;font-size:17px}

/* ---------- axis cards ---------- */
.axis-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;height:100%}
.axis-card{border:1px solid var(--line);border-radius:14px;padding:22px 20px;background:var(--surf);
  display:flex;flex-direction:column;gap:14px;border-top:3px solid var(--ax)}
.axis-card .ax-name{font-family:var(--disp);font-weight:700;font-size:21px;color:var(--ax)}
.axis-card .ax-q{font-size:13px;color:var(--faint)}
.dim{display:flex;gap:11px;align-items:flex-start}
.dim .dn{font-family:var(--disp);font-weight:600;color:var(--ink);font-size:16px;white-space:nowrap}
.dim .dd{color:var(--muted);font-size:13.5px;font-weight:300;line-height:1.6}
.dim .bullet{width:7px;height:7px;border-radius:50%;background:var(--ax);margin-top:7px;flex:none;opacity:.85}

/* ---------- strategy list (1->9) ---------- */
.strat-list{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.scard{border:1px solid var(--line);border-radius:12px;padding:14px 15px;background:var(--surf);position:relative;overflow:hidden}
.scard .num{position:absolute;left:12px;top:6px;font-family:var(--disp);font-weight:700;font-size:30px;color:rgba(227,169,91,.22)}
.scard h4{font-family:var(--disp);font-weight:600;font-size:16px;margin-bottom:6px;color:var(--ember-soft)}
.scard p{font-size:13px;color:var(--muted);font-weight:300;line-height:1.65}
.scard .ex{font-size:12px;color:var(--faint);margin-top:7px;border-right:2px solid var(--line2);padding-right:8px;line-height:1.6}

/* ---------- phases (timeline) ---------- */
.phases{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:stretch}
.phase{border:1px solid var(--line);border-radius:12px;padding:18px;background:var(--surf);position:relative}
.phase .pn{font-size:12px;color:var(--ember);letter-spacing:.1em;font-weight:600}
.phase h4{font-family:var(--disp);font-weight:700;font-size:20px;margin:6px 0}
.phase p{font-size:13.5px;color:var(--muted);font-weight:300;line-height:1.7}
.phase:nth-child(4){border-color:rgba(219,106,78,.5);background:linear-gradient(160deg,rgba(219,106,78,.1),var(--surf))}
.phase:nth-child(4) h4{color:var(--exc)}

/* ---------- spectrum bar ---------- */
.specbar{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:10px;margin-top:8px}
.specbar .seg{border-radius:10px;padding:16px;border:1px solid var(--line)}
.specbar .def{background:linear-gradient(160deg,rgba(146,134,119,.14),var(--surf));border-color:rgba(146,134,119,.4)}
.specbar .bal{background:linear-gradient(160deg,rgba(95,176,148,.14),var(--surf));border-color:rgba(95,176,148,.45)}
.specbar .exc{background:linear-gradient(160deg,rgba(219,106,78,.14),var(--surf));border-color:rgba(219,106,78,.45)}
.specbar .sl{font-family:var(--disp);font-weight:700;font-size:17px;margin-bottom:6px}
.specbar .def .sl{color:var(--def)} .specbar .bal .sl{color:var(--bal)} .specbar .exc .sl{color:var(--exc)}
.specbar p{font-size:14px;color:var(--muted);font-weight:300;line-height:1.7}

/* ---------- numbers (clifton) ---------- */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:8px 0 18px}
.stat{border:1px solid var(--line);border-radius:14px;padding:20px;background:var(--surf);text-align:center}
.stat .big{font-family:var(--disp);font-weight:700;font-size:clamp(34px,5vw,52px);
  background:linear-gradient(120deg,var(--ember-soft),var(--ember),var(--fire));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
.stat .cap{font-size:13.5px;color:var(--muted);margin-top:8px;font-weight:300;line-height:1.6}
.readbox{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;
  border:1px solid var(--line);border-radius:14px;padding:18px 22px;background:var(--surf2)}
.readbox .who{font-size:13px;color:var(--faint)}
.readbox .jump{font-family:var(--disp);font-weight:700;font-size:clamp(20px,2.4vw,30px);color:var(--ember-soft)}
.readbox .arrow{font-size:22px;color:var(--fire)}
.note{font-size:13px;color:var(--faint);margin-top:14px;line-height:1.7;border-top:1px solid var(--line);padding-top:12px}

/* ---------- equation ---------- */
.eq{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin:18px 0}
.eq .chip{border:1px solid var(--line);border-radius:12px;padding:16px 22px;text-align:center;background:var(--surf);min-width:140px}
.eq .chip .t{font-family:var(--disp);font-weight:700;font-size:20px;color:var(--ember-soft)}
.eq .chip .s{font-size:12px;color:var(--faint);margin-top:4px}
.eq .op{font-family:var(--disp);font-weight:700;font-size:30px;color:var(--fire)}
.eq .res{border-color:var(--ember);background:linear-gradient(160deg,rgba(227,169,91,.14),var(--surf))}
.eq .res .t{color:var(--ember)}

/* ---------- strength detail ---------- */
.str-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:4px}
.str-head .sn{font-family:var(--disp);font-weight:700;font-size:13px;color:#1a1410;background:var(--ember);
  width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.str-head h2{font-family:var(--disp);font-weight:700;font-size:26px}
.str-head .alias{color:var(--muted);font-size:14px}
.essence{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--faint);margin:6px 0 14px}
.essence b{color:var(--ember-soft);font-weight:500}
.str-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.str-col{border:1px solid var(--line);border-radius:13px;padding:14px 13px;background:var(--surf);border-top:3px solid var(--ax)}
.str-col .col-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.str-col .col-h .an{font-family:var(--disp);font-weight:700;font-size:15px;color:var(--ax)}
.str-col .col-h .aa{font-size:11px;color:var(--faint)}
.pt{padding:9px 0;border-top:1px dashed var(--line)}
.pt:first-of-type{border-top:none}
.pt .pn{font-family:var(--disp);font-weight:600;font-size:15px;color:var(--ink)}
.pt .pbal{font-size:12px;color:var(--muted);font-weight:300;line-height:1.55;margin:3px 0 5px;
  display:flex;gap:6px}
.pt .pbal::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--bal);margin-top:5px;flex:none}
.pt .row{font-size:11.5px;line-height:1.5;display:flex;gap:6px;margin-top:3px;color:var(--faint)}
.pt .row .lab{font-weight:600;flex:none;font-size:10.5px;padding:1px 6px;border-radius:6px;height:fit-content;margin-top:1px}
.pt .row.ov .lab{color:var(--exc);background:rgba(219,106,78,.14)}
.pt .row.un .lab{color:var(--def);background:rgba(146,134,119,.16)}
.pt .row b{color:var(--muted);font-weight:500}

/* ---------- restore ---------- */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:10px 0 16px}
.step{border:1px solid var(--line);border-radius:14px;padding:20px;background:var(--surf);position:relative}
.step .sni{font-family:var(--disp);font-weight:700;font-size:28px;color:var(--ember);opacity:.5}
.step h4{font-family:var(--disp);font-weight:700;font-size:18px;margin:6px 0}
.step p{font-size:14px;color:var(--muted);font-weight:300;line-height:1.7}

/* ---------- mirror slide ---------- */
.mir-head{display:flex;align-items:center;gap:14px;margin-bottom:4px}
.mir-head .mn{font-family:var(--disp);font-weight:700;font-size:18px;color:#1a1410;background:var(--ember-soft);
  width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.mir-dims{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:6px}
.mir-dim{border:1px solid var(--line);border-radius:13px;padding:16px;background:var(--surf)}
.mir-dim .mdh{font-family:var(--disp);font-weight:700;font-size:19px;color:var(--ember-soft)}
.mir-dim .mds{font-size:12.5px;color:var(--faint);margin:3px 0 12px;line-height:1.6}
.mir-item{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px dashed var(--line)}
.mir-item:first-of-type{border-top:none}
.mir-item .ic{font-family:var(--disp);font-weight:700;font-size:13px;width:24px;height:24px;border-radius:7px;
  display:flex;align-items:center;justify-content:center;background:var(--surf3);color:var(--ember);
  border:1px solid var(--line2);flex:none}
.mir-item .st{font-size:13.5px;color:var(--muted);font-weight:300}
.thread{margin-top:14px;font-size:13.5px;color:var(--ember-soft);font-family:var(--turath);
  background:rgba(227,169,91,.07);border:1px solid rgba(227,169,91,.2);border-radius:10px;padding:11px 16px;line-height:1.8}

/* ---------- fingerprint slide ---------- */
.fp-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:2px}
.fp-head .fn{font-family:var(--disp);font-weight:700;font-size:15px;color:#1a1410;background:var(--ember);
  width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.fp-head h2{font-family:var(--disp);font-weight:700;font-size:25px}
.fp-head .alias{font-size:13.5px;color:var(--muted)}
.fp-essence{font-size:12.5px;color:var(--faint);margin:4px 0 10px}
.fp-essence b{color:var(--ember-soft);font-weight:500}
.fp-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;position:relative;margin:6px 0 16px}
.fp-node{border:1px solid var(--line);border-radius:11px;padding:11px 8px 12px;background:linear-gradient(160deg,var(--surf2),var(--surf));
  text-align:center;display:flex;flex-direction:column;gap:3px;position:relative}
.fp-node .mname{font-size:10.5px;color:var(--faint);font-weight:400}
.fp-node .mdim{font-family:var(--disp);font-weight:700;font-size:16px;color:var(--ember-soft)}
.fp-node .mstyle{font-size:10px;color:var(--muted);line-height:1.45;min-height:26px}
.fp-node::after{content:"";position:absolute;top:14px;left:-8px;width:8px;height:1px;background:var(--line2)}
.fp-node:last-child::after{display:none}
.fp-axes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.fp-axc{border:1px solid var(--line);border-radius:12px;padding:13px;background:var(--surf);border-top:3px solid var(--ax)}
.fp-axc .axh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.fp-axc .axh .n{font-family:var(--disp);font-weight:700;font-size:14px;color:var(--ax)}
.fp-axc .axh .a{font-size:10.5px;color:var(--faint)}
.fp-pt{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px dashed var(--line)}
.fp-pt:first-of-type{border-top:none}
.fp-pt .ptn{font-family:var(--disp);font-weight:600;font-size:14.5px}
.minispec{display:flex;gap:2px}
.minispec i{width:11px;height:5px;border-radius:2px;display:block}
.minispec .d{background:var(--def)} .minispec .b{background:var(--bal)} .minispec .e{background:var(--exc)}

/* ---------- closing ---------- */
.cta{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:18px}
.cta h2{font-size:clamp(30px,4vw,46px)}
.qr-row{display:flex;gap:18px;align-items:center;border:1px solid var(--ember);border-radius:16px;
  padding:18px 24px;background:linear-gradient(160deg,rgba(227,169,91,.1),var(--surf));margin-top:6px}
.qr{width:120px;height:120px;border-radius:12px;background:#fff;display:grid;place-items:center;flex:none}
.qr img{width:108px;height:108px}
.cta .small{font-size:14px;color:var(--muted);font-weight:300;line-height:1.8;max-width:64ch}

/* ---------- chrome ---------- */
#bar{position:fixed;bottom:0;left:0;right:0;height:4px;background:rgba(255,255,255,.05);z-index:50}
#bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ember),var(--fire));width:0;transition:width .4s ease}
#hud{position:fixed;bottom:16px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:60;pointer-events:none}
.nav{pointer-events:auto;background:var(--surf2);border:1px solid var(--line2);color:var(--muted);
  width:38px;height:38px;border-radius:11px;font-size:18px;cursor:pointer;display:grid;place-items:center;
  transition:.2s}
.nav:hover{color:var(--ember);border-color:var(--ember)}
#count{pointer-events:auto;background:var(--surf2);border:1px solid var(--line2);border-radius:11px;
  height:38px;display:flex;align-items:center;padding:0 16px;font-size:13px;color:var(--muted);gap:6px}
#count b{color:var(--ember);font-family:var(--disp)}
#menuBtn{position:fixed;top:18px;left:18px;z-index:60;background:var(--surf2);border:1px solid var(--line2);
  color:var(--muted);border-radius:11px;height:38px;padding:0 14px;font-size:13px;cursor:pointer;font-family:var(--body)}
#menuBtn:hover{color:var(--ember);border-color:var(--ember)}
#logo{position:fixed;top:20px;right:24px;z-index:55;font-family:var(--turath);color:var(--ember);font-size:16px;opacity:.7}

/* ---------- overview ---------- */
#ov{position:fixed;inset:0;background:rgba(10,7,6,.96);z-index:100;display:none;overflow:auto;padding:60px 40px}
#ov.show{display:block}
#ov h3{font-family:var(--disp);color:var(--ember);font-size:14px;letter-spacing:.1em;margin:22px 0 12px;font-weight:600}
.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.ov-card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surf);cursor:pointer;transition:.15s}
.ov-card:hover{border-color:var(--ember);background:var(--surf2)}
.ov-card .oi{font-family:var(--disp);color:var(--faint);font-size:12px}
.ov-card .ot{font-size:14px;margin-top:3px;color:var(--ink)}
#ov .close{position:fixed;top:20px;left:24px;color:var(--muted);background:var(--surf2);border:1px solid var(--line2);
  border-radius:10px;height:36px;padding:0 14px;cursor:pointer}

@media (max-width:760px){
  .slide{padding:24px 20px;height:90vh}
  .axis-grid,.str-cols,.mir-dims,.specbar,.stat-row,.steps,.fp-axes,.strat-list{grid-template-columns:1fr}
  .fp-strip{grid-template-columns:repeat(2,1fr)}
  .split,.phases{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="logo">منظور الفؤاد</div>
<button id="menuBtn">☰ الخريطة</button>
<div id="stage"></div>

<div id="hud">
  <button class="nav" id="next">‹</button>
  <div id="count"><b id="cur">1</b> / <span id="tot">45</span></div>
  <button class="nav" id="prev">›</button>
</div>
<div id="bar"><i id="barfill"></i></div>

<div id="ov"><button class="close" onclick="toggleOv(false)">✕ إغلاق</button><div id="ovInner"></div></div>

<script src="data.js"></script>
<script>
/* ============ helpers ============ */
const axColor = k => AXES[k].color;
const strat = n => STRATEGIES[n-1];

function essenceLine(s){
  return `<div class="essence"><span>الجوهر <b>${s.jawhar}</b></span><span>الشوق <b>${s.shawq}</b></span><span>الفضيلة <b>${s.fadila}</b></span></div>`;
}

/* ---- strength detail (one strategy) ---- */
function strengthSlide(s){
  const cols = AXIS_ORDER.map(k=>{
    const g=s.groups[k], ax=AXES[k];
    const pts = g.pts.map(p=>`
      <div class="pt">
        <div class="pn">${p.name}</div>
        <div class="pbal">${p.it}</div>
        <div class="row ov"><span class="lab">إفراط</span><span><b>${p.ov.n}</b> — ${p.ov.d}</span></div>
        <div class="row un"><span class="lab">تفريط</span><span><b>${p.un.n}</b> — ${p.un.d}</span></div>
      </div>`).join('');
    return `<div class="str-col" style="--ax:${ax.color}">
      <div class="col-h"><span class="an">${ax.name.split(' ')[0]}</span><span class="aa">${g.alias}</span></div>
      ${pts}</div>`;
  }).join('');
  return `<section class="slide dense" data-title="نقاط القوة — ${s.n}. ${s.name}" data-group="نقاط القوة">
    <div class="eyebrow">نقاط القوة على الطيف · المرجع</div>
    <div class="str-head"><span class="sn">${s.n}</span><h2>${s.name}</h2><span class="alias">${s.alias}</span></div>
    ${essenceLine(s)}
    <div class="slide-body"><div class="str-cols">${cols}</div></div>
  </section>`;
}

/* ---- mirror slide ---- */
function mirrorSlide(m){
  const dims = m.dims.map(d=>{
    const items = d.items.map(it=>`
      <div class="mir-item"><span class="ic">${it.s}</span><span class="st">${it.style}</span></div>`).join('');
    return `<div class="mir-dim"><div class="mdh">${d.name}</div><div class="mds">${d.sub}</div>${items}</div>`;
  }).join('');
  const beh = m.isBehavior
    ? `<div class="thread" style="margin-bottom:10px">تطبيق حيّ: افتكروا آخر موقف ضغط — جسمكم راح فين أول لحظة: نحو، ضدّ، ولا بعيدًا؟ والفجوة بينه وبين اللي بتفتكروه هي بصمة الاحتراق وهو بيشتغل.</div>`
    : '';
  return `<section class="slide dense" data-title="مرآة ${m.n} — ${m.name}" data-group="المرايا السبع">
    <div class="eyebrow">المرايا السبع · مرآة ${m.n} من 7</div>
    <div class="mir-head"><span class="mn">${m.n}</span><div><h2 class="head" style="font-size:26px;margin:0">${m.name}</h2></div></div>
    <div class="q" style="margin:2px 0 8px">${m.q}</div>
    <div class="slide-body">
      ${beh}
      <div class="mir-dims">${dims}</div>
      <div class="thread">${m.note}</div>
    </div>
  </section>`;
}

/* ---- fingerprint slide (one strategy) ---- */
function fingerprintSlide(s){
  const nodes = MIRROR_ORDER.map(k=>{
    const mm = MIRRORS.find(x=>x.key===k);
    const cell = s.mirror[k];
    return `<div class="fp-node"><span class="mname">${mm.name.replace('مرآة ','')}</span>
      <span class="mdim">${cell.dim}</span><span class="mstyle">${cell.style}</span></div>`;
  }).join('');
  const axes = AXIS_ORDER.map(k=>{
    const g=s.groups[k], ax=AXES[k];
    const pts=g.pts.map(p=>`<div class="fp-pt"><span class="ptn">${p.name}</span>
      <span class="minispec"><i class="d"></i><i class="b"></i><i class="e"></i></span></div>`).join('');
    return `<div class="fp-axc" style="--ax:${ax.color}">
      <div class="axh"><span class="n">${ax.name.split(' ')[0]}</span><span class="a">${g.alias}</span></div>${pts}</div>`;
  }).join('');
  return `<section class="slide dense" data-title="البصمة ${s.n} — ${s.name}" data-group="البصمات التسع">
    <div class="eyebrow">البصمة الكاملة · ${s.n} من 9</div>
    <div class="fp-head"><span class="fn">${s.n}</span><h2>${s.name}</h2><span class="alias">${s.alias}</span></div>
    <div class="fp-essence">الجوهر <b>${s.jawhar}</b> · الشوق <b>${s.shawq}</b> · الفضيلة <b>${s.fadila}</b></div>
    <div class="slide-body">
      <div style="font-size:12px;color:var(--faint);margin-bottom:4px">موقعها في المرايا السبع</div>
      <div class="fp-strip">${nodes}</div>
      <div style="font-size:12px;color:var(--faint);margin:2px 0 4px">نقاط قوتها التسعة على المحاور الثلاثة <span style="opacity:.7">(لكل نقطة طيف: تفريط · اتزان · إفراط)</span></div>
      <div class="fp-axes">${axes}</div>
    </div>
  </section>`;
}

/* ============================================================
   المحرّك — تركيب الشرائح + التنقّل + الخريطة + الكيبورد + الشريط
   ============================================================ */
const stage   = document.getElementById('stage');
stage.innerHTML = S.join('');
const slides  = Array.from(stage.querySelectorAll('.slide'));
const total   = slides.length;
const curEl   = document.getElementById('cur');
const barfill = document.getElementById('barfill');
document.getElementById('tot').textContent = total;

let cur = 0;

function show(i){
  cur = Math.max(0, Math.min(total - 1, i));
  slides.forEach((sl, idx) => sl.classList.toggle('active', idx === cur));
  curEl.textContent = cur + 1;
  barfill.style.width = ((cur + 1) / total * 100) + '%';
}
function next(){ show(cur + 1); }
function prev(){ show(cur - 1); }

document.getElementById('next').addEventListener('click', next);
document.getElementById('prev').addEventListener('click', prev);

/* تنقّل بالكيبورد — RTL: السهم لليسار يقدّم، لليمين يرجّع */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === ' ' || e.key === 'PageDown'){ next(); e.preventDefault(); }
  else if (e.key === 'ArrowRight' || e.key === 'PageUp'){ prev(); e.preventDefault(); }
  else if (e.key === 'Home'){ show(0); }
  else if (e.key === 'End'){ show(total - 1); }
  else if (e.key === 'Escape'){ toggleOv(false); }
});

/* الخريطة (overview) */
const ovInner = document.getElementById('ovInner');
function buildOverview(){
  const groups = {};
  slides.forEach((sl, idx) => {
    const g = sl.getAttribute('data-group') || 'أخرى';
    (groups[g] = groups[g] || []).push({ idx, title: sl.getAttribute('data-title') || ('شريحة ' + (idx + 1)) });
  });
  let html = '';
  Object.keys(groups).forEach(g => {
    html += `<h3>${g}</h3><div class="ov-grid">`;
    groups[g].forEach(item => {
      html += `<div class="ov-card" data-i="${item.idx}"><div class="oi">${item.idx + 1}</div><div class="ot">${item.title}</div></div>`;
    });
    html += `</div>`;
  });
  ovInner.innerHTML = html;
  ovInner.querySelectorAll('.ov-card').forEach(card => {
    card.addEventListener('click', () => { show(parseInt(card.getAttribute('data-i'), 10)); toggleOv(false); });
  });
}
function toggleOv(open){
  document.getElementById('ov').classList.toggle('show', open === undefined ? true : !!open);
}
window.toggleOv = toggleOv;
document.getElementById('menuBtn').addEventListener('click', () => toggleOv(true));

buildOverview();
show(0);
</script>
