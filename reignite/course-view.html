<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Reignite — رحلتك</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --ax-bg:#0f172a; --ax-bg2:#1a2332; --ax-blue:#3b82f6; --ax-green:#10b981;
      --ax-gold:#fbbf24; --ax-purple:#a78bfa; --ax-red:#ef4444; --ax-text:#e2e8f0; --ax-muted:#94a3b8;
      --ax-line:#2a3850; --ax-card:#16202e; --ax-serif:'Amiri',serif;
    }
    *{box-sizing:border-box} html,body{margin:0;padding:0}
    body{
      background:radial-gradient(1200px 620px at 50% -12%, #1a2332 0%, #0f172a 62%);
      color:var(--ax-text); font-family:'Tajawal',sans-serif; min-height:100vh;
      -webkit-font-smoothing:antialiased; line-height:1.9;
    }
    .cv-shell{ max-width:760px; margin:0 auto; padding:22px 16px 100px; }

    /* ── ترويسة الهَب ── */
    .cv-top{
      display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
      padding:18px 20px; margin-bottom:20px; border-radius:18px;
      background:linear-gradient(180deg, rgba(22,32,46,.95), rgba(15,23,42,.7));
      border:1px solid var(--ax-line);
    }
    .cv-brand{ font-family:var(--ax-serif); font-size:22px; color:var(--ax-gold); }
    .cv-brand .sub{ display:block; font-family:'Tajawal',sans-serif; font-size:12px; color:var(--ax-muted); margin-top:2px; }
    .cv-welcome{ font-size:15px; color:#cbd5e1; }
    .cv-welcome b{ color:var(--ax-text); }

    .cv-section{ margin-bottom:26px; }
    .cv-sec-title{ font-family:var(--ax-serif); color:var(--ax-gold); font-size:17px; margin-bottom:14px; }

    /* ── شريط الحركات ── */
    .cv-rail{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px; }
    .cv-mv{
      position:relative; background:#101a28; border:1px solid var(--ax-line); border-radius:14px;
      padding:16px 16px 14px; transition:transform .15s, border-color .2s; min-height:96px;
    }
    .cv-mv .mv-kicker{ color:var(--ax-muted); font-size:12px; margin-bottom:6px; }
    .cv-mv .mv-title{ font-size:16px; font-weight:700; line-height:1.5; }
    .cv-mv .mv-badge{ position:absolute; inset-inline-start:14px; bottom:12px; font-size:11px; font-weight:700;
      padding:3px 10px; border-radius:99px; }
    .cv-mv.active{ border-color:var(--ax-blue); background:linear-gradient(160deg, rgba(59,130,246,.14), #101a28); cursor:pointer; }
    .cv-mv.active:hover{ transform:translateY(-2px); }
    .cv-mv.active .mv-badge{ background:linear-gradient(135deg,var(--ax-blue),var(--ax-green)); color:#fff; }
    .cv-mv.done{ border-color:rgba(16,185,129,.4); }
    .cv-mv.done .mv-badge{ background:rgba(16,185,129,.18); color:var(--ax-green); }
    .cv-mv.locked{ opacity:.55; }
    .cv-mv.locked .mv-badge{ background:#1c2a40; color:var(--ax-muted); }
    .cv-mv .mv-lock{ position:absolute; inset-inline-end:14px; top:14px; color:var(--ax-muted); font-size:14px; }

    /* ── لوحة اليوم التفاعليّ ── */
    .cv-panel{
      background:linear-gradient(180deg, rgba(22,32,46,.95), rgba(15,23,42,.7));
      border:1px solid var(--ax-line); border-radius:18px; padding:8px; overflow:hidden;
    }
    .cv-panel-head{
      display:flex; align-items:center; gap:14px; padding:16px 18px; border-bottom:1px solid var(--ax-line);
    }
    .cv-pulse{ flex:0 0 10px; width:10px; height:10px; border-radius:50%; background:var(--ax-green);
      animation:cvp 2s infinite; }
    @keyframes cvp{ 0%{box-shadow:0 0 0 0 rgba(16,185,129,.55)} 70%{box-shadow:0 0 0 12px rgba(16,185,129,0)} 100%{box-shadow:0 0 0 0 rgba(16,185,129,0)} }
    .cv-panel-head .t{ font-family:var(--ax-serif); color:var(--ax-gold); font-size:16px; }
    .cv-panel-head .n{ color:var(--ax-muted); font-size:13px; }
    .cv-panel-body{ padding:8px; }

    .rg-wait{ padding:46px 28px; text-align:center; }
    .rg-wait .ttl{ font-family:var(--ax-serif); font-size:23px; font-weight:700; margin-bottom:14px; }
    .rg-wait .sub{ color:var(--ax-muted); font-size:16px; line-height:1.9; }
    .rg-dots{ display:flex; gap:8px; justify-content:center; margin-top:24px; }
    .rg-dots span{ width:10px; height:10px; border-radius:50%; background:var(--ax-blue); opacity:.4; animation:rgd 1.2s infinite; }
    .rg-dots span:nth-child(2){ animation-delay:.2s } .rg-dots span:nth-child(3){ animation-delay:.4s }
    @keyframes rgd{ 0%,100%{opacity:.3; transform:translateY(0)} 50%{opacity:1; transform:translateY(-4px)} }

    #reignite-axes-root{ display:none; }

    /* ── بطاقة خريطتك (النتائج العائدة) ── */
    .cv-map{
      background:linear-gradient(180deg, rgba(22,32,46,.95), rgba(15,23,42,.7));
      border:1px solid var(--ax-line); border-radius:18px; padding:22px 24px;
    }
    .cv-map-empty{ color:var(--ax-muted); font-size:15px; text-align:center; padding:14px; }
    .cv-map-axis{ font-size:18px; margin-bottom:16px; }
    .cv-map-axis b{ color:var(--ax-gold); }
    .cv-map-note{ color:var(--ax-muted); font-size:13px; margin-top:12px; }

    /* ════ ستايل المقياس المضمّن (مطابق لصفحة المقياس) ════ */
    .ax-card{ background:transparent; border:none; box-shadow:none; padding:24px 18px; animation:axFade .5s ease; }
    @keyframes axFade{ from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }
    .ax-centered{ text-align:center; }
    .ax-tag{ color:var(--ax-gold); font-size:14px; letter-spacing:.5px; margin-bottom:18px; font-family:var(--ax-serif); }
    .ax-core{ font-size:22px; font-weight:700; line-height:1.8; margin-bottom:18px; font-family:var(--ax-serif); }
    .ax-reminder{ color:var(--ax-muted); font-size:15px; margin-bottom:24px; }
    .ax-lead{ color:#cbd5e1; font-size:16px; margin:0 0 18px; line-height:1.9; }
    .ax-section-title{ color:var(--ax-gold); font-size:15px; margin-bottom:16px; font-family:var(--ax-serif); }
    .ax-btn{ border:none; cursor:pointer; font-family:inherit; font-size:16px; font-weight:700;
      padding:13px 30px; border-radius:12px; transition:transform .15s, box-shadow .15s, background .2s; }
    .ax-btn.primary{ background:var(--ax-blue); color:#fff; box-shadow:0 8px 22px rgba(59,130,246,.30); }
    .ax-btn.primary:hover{ transform:translateY(-2px); }
    .ax-btn.ghost{ background:transparent; color:var(--ax-text); border:1px solid var(--ax-line); }
    .ax-btn.ghost:hover{ border-color:var(--ax-blue); }
    .ax-progress-row{ display:flex; align-items:center; gap:14px; margin-bottom:26px; }
    .ax-progress-label{ color:var(--ax-muted); font-size:13px; white-space:nowrap; }
    .ax-progress-bar{ flex:1; height:6px; background:#22304a; border-radius:99px; overflow:hidden; }
    .ax-progress-fill{ height:100%; background:linear-gradient(90deg,var(--ax-blue),var(--ax-green)); transition:width .4s; }
    .ax-question{ font-size:21px; font-weight:700; line-height:1.7; margin-bottom:16px; }
    .ax-options{ display:flex; flex-direction:column; gap:22px; margin-bottom:24px; }
    .ax-option{ background:#101a28; border:1px solid var(--ax-line); border-radius:14px; padding:18px 18px 14px; }
    .ax-option-text{ display:flex; gap:12px; align-items:flex-start; font-size:17px; line-height:1.85; margin-bottom:16px; }
    .ax-letter{ flex:0 0 32px; height:32px; border-radius:50%; background:#1c2a40; color:var(--ax-gold);
      display:flex; align-items:center; justify-content:center; font-weight:700; }
    .ax-statement-text{ font-size:20px; font-weight:700; line-height:1.7; margin-bottom:24px; }
    .ax-scale{ display:flex; gap:10px; justify-content:flex-start; flex-wrap:wrap; }
    .ax-likert{ width:46px; height:46px; border-radius:50%; border:1px solid var(--ax-line);
      background:#101a28; color:var(--ax-text); font-family:inherit; font-size:16px; font-weight:700;
      cursor:pointer; transition:all .15s; }
    .ax-likert:hover{ border-color:var(--ax-green); background:#13202f; transform:translateY(-2px); color:var(--ax-green); }
    .ax-likert.selected{ background:linear-gradient(135deg, var(--ax-blue), var(--ax-green));
      border-color:var(--ax-blue); color:#fff; transform:scale(1.12); }
    .ax-scale-labels{ display:flex; justify-content:space-between; color:var(--ax-muted); font-size:12px; margin-top:8px; }
    .ax-nav{ display:flex; gap:12px; margin-top:8px; }
    .ax-reveal{ font-size:26px; font-weight:700; color:var(--ax-green); text-align:center; font-family:var(--ax-serif); margin:18px 0 22px; }
    .ax-p{ font-size:17px; line-height:2; color:#cbd5e1; margin:0 0 14px; }
    .ax-spectrum-bar{ direction:ltr; margin:14px 0 10px; }
    .axsb-track{ position:relative; display:flex; height:12px; border-radius:99px; overflow:hidden; background:#101a28; }
    .axsb-zone{ flex:1; height:100%; }
    .axsb-deficit{ background:rgba(59,130,246,.30); }
    .axsb-balance{ background:rgba(16,185,129,.30); }
    .axsb-excess{ background:rgba(251,191,36,.32); }
    .axsb-dot{ position:absolute; top:50%; width:16px; height:16px; border-radius:50%; transform:translate(-50%,-50%); box-shadow:0 0 0 3px rgba(15,23,42,.65); }
    .axsb-band{ position:absolute; top:50%; inset-inline-start:18%; width:64%; height:14px; transform:translateY(-50%); border-radius:99px; background:rgba(167,139,250,.32); box-shadow:inset 0 0 0 1px rgba(167,139,250,.4); }
    .axsb-labels{ direction:ltr; display:flex; justify-content:space-between; color:var(--ax-muted); font-size:12px; margin-top:8px; }
    .axsb-whisper{ direction:rtl; color:var(--ax-purple); font-size:13px; margin-top:8px; }
    .ax-wellness{ margin-top:8px; }
    .ax-wl-caption{ color:var(--ax-muted); font-size:14px; margin-bottom:14px; }
    .ax-wl-row{ display:flex; align-items:center; gap:12px; margin-bottom:12px; }
    .ax-wl-name{ flex:0 0 120px; font-size:14px; }
    .ax-wl-tag{ color:var(--ax-gold); font-size:11px; }
    .ax-wl-bar{ flex:1; height:8px; background:#22304a; border-radius:99px; overflow:hidden; }
    .ax-wl-fill{ height:100%; }
    .ax-wl-val{ flex:0 0 32px; text-align:left; font-size:14px; color:var(--ax-muted); }
    .ax-result .ax-section{ margin-bottom:28px; padding-bottom:22px; border-bottom:1px solid var(--ax-line); }
    .ax-result .ax-section:last-child{ border-bottom:none; }
    .ax-ground{ background:rgba(167,139,250,.06); border:1px solid rgba(167,139,250,.22); border-radius:14px; padding:22px; margin-bottom:28px; }
    .ax-ground-title{ color:var(--ax-purple); font-size:15px; letter-spacing:.5px; margin-bottom:12px; font-family:var(--ax-serif); }
    .ax-ground p{ margin:0; font-size:17px; line-height:2; color:#cbd5e1; }
    .ax-h{ color:var(--ax-gold); font-size:18px; font-weight:700; margin-bottom:14px; font-family:var(--ax-serif); }
    .ax-seed{ color:var(--ax-purple); }
    .ax-bridge{ background:rgba(16,185,129,.05); border-radius:12px; padding:16px 18px; }
    .ax-actions{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:8px; }
    .ax-spinner{ width:34px; height:34px; border:3px solid #22304a; border-top-color:var(--ax-blue); border-radius:50%; margin:0 auto 14px; animation:axSpin 1s linear infinite; }
    @keyframes axSpin{ to{ transform:rotate(360deg) } }
    .ax-saving{ color:var(--ax-muted); }
    .ax-check{ font-size:46px; color:var(--ax-green); margin-bottom:14px; }
    .ax-done-line{ font-size:20px; font-weight:700; margin-bottom:10px; }
    .ax-done-note{ color:var(--ax-muted); }
    .ax-practice-card{ background:rgba(251,191,36,.08); border:1px solid rgba(251,191,36,.25); border-radius:12px; padding:16px 18px; font-size:17px; line-height:2; color:#fde9b8; }

    @media print{
      body{ background:#fff; color:#1a1a1a; }
      .cv-top, .cv-rail, .cv-panel-head, .rg-wait{ display:none !important; }
      .cv-shell{ max-width:none; padding:0; }
      .cv-panel, .cv-map{ background:#fff; border:none; }
      .ax-actions{ display:none; }
      .ax-ground{ background:#f4f1fb; }
    }
    @media(max-width:520px){
      .cv-shell{ padding:18px 12px 80px; }
      .ax-question{ font-size:19px; } .ax-core{ font-size:20px; }
      .ax-likert{ width:40px; height:40px; }
      .ax-wl-name{ flex-basis:92px; }
    }
  </style>
</head>
<body>
  <div class="cv-shell">

    <!-- ترويسة الهَب -->
    <div class="cv-top">
      <div class="cv-brand">Reignite<span class="sub">رحلة من الاحتراق إلى استعادة الاتّزان</span></div>
      <div class="cv-welcome" id="cvWelcome"></div>
    </div>

    <!-- شريط الحركات -->
    <div class="cv-section">
      <div class="cv-sec-title">رحلتك</div>
      <div class="cv-rail" id="cvRail"></div>
    </div>

    <!-- لوحة اليوم التفاعليّ (الحركة النشطة) -->
    <div class="cv-section">
      <div class="cv-sec-title" id="cvDayTitle">اليوم التفاعليّ</div>
      <div class="cv-panel">
        <div class="cv-panel-head">
          <span class="cv-pulse"></span>
          <div>
            <div class="t" id="cvPhaseTitle">…</div>
            <div class="n" id="cvPhaseNote"></div>
          </div>
        </div>
        <div class="cv-panel-body">
          <div class="rg-wait" id="cvWait">
            <div class="ttl">أنت في مكانٍ آمن</div>
            <div class="sub" id="cvWaitNote">استعدّ… سنبدأ معًا بعد قليل. حين يفتح المدرّب المقياس سيظهر هنا تلقائيًّا.</div>
            <div class="rg-dots"><span></span><span></span><span></span></div>
          </div>
          <div id="reignite-axes-root"></div>
        </div>
      </div>
    </div>

    <!-- خريطتك (النتائج العائدة إلى الصفحة الرئيسية) -->
    <div class="cv-section">
      <div class="cv-sec-title">خريطتك</div>
      <div class="cv-map" id="cvMap">
        <div class="cv-map-empty">ستظهر خريطتك هنا بعد أن تُتمّ المقياس — وتعود إليها في أيّ وقت.</div>
      </div>
    </div>

  </div>

  <!-- ١) Firebase SDK 8.10.1 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <!-- ٢) تهيئة Firebase -->
  <script src="../js/firebase-config.js"></script>

  <!-- ٣) محتوى المقياس + محرّكه + جسره -->
  <script src="axes-config.js"></script>
  <script src="axes-questions.js"></script>
  <script src="axes-content.js"></script>
  <script src="axes-engine.js"></script>
  <script src="axes-bridge.js"></script>

  <!-- ٤) المخزن + العرض + التطبيق -->
  <script src="axes-store.js"></script>
  <script src="axes-render.js"></script>
  <script src="axes-app.js"></script>

  <!-- ٥) طبقة الجلسة الحيّة -->
  <script src="axes-session.js"></script>

  <!-- ٦) إقلاع الهَب: الهويّة + الحركات + متابعة المدرّب + الحضور + النتائج -->
  <script>
  (function(){
    "use strict";
    var S = window.AXES_SESSION, STORE = window.AXES_STORE, CFG = window.AXES_CONFIG, RND = window.AXES_RENDER;

    function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function axisName(id){ var a=((CFG&&CFG.axes)||[]).find(function(x){return x.id===id;}); return a?a.name:(id||'—'); }

    // هويّة العميل (نفس أكونت الموقع)
    var user = (STORE && STORE.getCurrentUser) ? STORE.getCurrentUser() : null;
    if(!user || !user.id){ try{ window.location.href='../login.html'; }catch(e){} return; }

    document.getElementById('cvWelcome').innerHTML = 'أهلًا، <b>' + esc(user.name || 'بك') + '</b>';

    /* ════ شريط الحركات ════ */
    var MOVEMENTS = [
      { id:'m0', kicker:'تمهيد',          title:'الاستقبال والإصغاء',        state:'done'   },
      { id:'m1', kicker:'الحركة الأولى',  title:'الاعتراف',                  state:'active' },
      { id:'m2', kicker:'الحركة الثانية', title:'الميكانيكية المخفية',       state:'locked' },
      { id:'m3', kicker:'الحركة الثالثة', title:'النزول الكبير — المرايا',   state:'locked' },
      { id:'m4', kicker:'الحركة الرابعة', title:'القاع',                     state:'locked' },
      { id:'m5', kicker:'الحركة الخامسة', title:'الدوران',                   state:'locked' },
      { id:'m6', kicker:'الحركة السادسة', title:'الصعود',                    state:'locked' }
    ];
    var activeMovementId = 'm1';

    function badgeText(st){ return st==='active' ? 'نشطة الآن' : (st==='done' ? 'تمّت' : 'قادمة'); }
    function buildRail(){
      var rail=document.getElementById('cvRail'); rail.innerHTML='';
      MOVEMENTS.forEach(function(mv){
        var st = (mv.id===activeMovementId) ? 'active' : (mv.state==='done' ? 'done' : 'locked');
        var el=document.createElement('div');
        el.className='cv-mv '+st;
        el.innerHTML =
          (st==='locked' ? '<span class="mv-lock">🔒</span>' : '') +
          '<div class="mv-kicker">'+esc(mv.kicker)+'</div>' +
          '<div class="mv-title">'+esc(mv.title)+'</div>' +
          '<span class="mv-badge">'+badgeText(st)+'</span>';
        if(st==='active'){
          el.addEventListener('click', function(){
            var p=document.querySelector('.cv-panel'); if(p) p.scrollIntoView({behavior:'smooth', block:'start'});
          });
        }
        rail.appendChild(el);
      });
      var act = MOVEMENTS.find(function(m){return m.id===activeMovementId;});
      if(act) document.getElementById('cvDayTitle').textContent = act.kicker + ' — ' + act.title;
    }

    /* ════ خريطتك (النتائج العائدة) ════ */
    function renderMap(d){
      var box=document.getElementById('cvMap');
      if(!d || !d.results || !d.results.ranking){
        box.innerHTML='<div class="cv-map-empty">ستظهر خريطتك هنا بعد أن تُتمّ المقياس — وتعود إليها في أيّ وقت.</div>';
        return;
      }
      var primary = d.results.primaryAxis || (d.results.ranking && d.results.ranking.primaryAxis);
      var w = d.results.wellness || {};
      var wp = w.wellnessPoint || {};
      var worst = w.worstLevel;
      var levelMap = { tawaqud:'التوقّد', hudur:'الحضور', imtila:'الامتلاء' };
      var points = ['tawaqud','hudur','imtila'].map(function(l){
        return { name: levelMap[l], wellness: wp[l], isWorst: (l===worst) };
      });
      var wl = (RND && RND.wellnessLine) ? RND.wellnessLine(points) : '';
      box.innerHTML =
        '<div class="cv-map-axis">محورك الرئيسيّ: <b>'+esc(axisName(primary))+'</b></div>' +
        wl +
        '<div class="cv-map-note">هذه خريطتك كما تبدو اليوم — طرفُ خيطٍ سيتّضح أكثر كلّما نزلنا في الرحلة.</div>';
    }
    function loadMap(){
      if(!(STORE && STORE.loadAssessment)) return;
      STORE.loadAssessment(user.id).then(renderMap).catch(function(){});
    }

    /* ════ لوحة اليوم — متابعة المدرّب وكشف المقياس ════ */
    var revealed=false, curPhase='waiting', myStage='waiting';
    function setStage(st){ myStage=st; try{ S.heartbeat(user, { stage:st }); }catch(e){} }

    function reveal(){
      if(revealed) return; revealed=true;
      var w=document.getElementById('cvWait'); if(w) w.style.display='none';
      var root=document.getElementById('reignite-axes-root'); if(root) root.style.display='block';
      if(window.AXES_APP) window.AXES_APP.init({ rootId:'reignite-axes-root', loginPath:'../login.html' });
      if(myStage==='waiting') setStage('scale');
    }
    function renderBanner(p){
      document.getElementById('cvPhaseTitle').textContent = p ? p.title : '';
      document.getElementById('cvPhaseNote').textContent = p ? (p.clientNote||'') : '';
      var wn=document.getElementById('cvWaitNote');
      if(wn && p && p.clientNote && !revealed) wn.textContent = p.clientNote;
    }

    S.onSessionChange(function(s){
      curPhase=(s&&s.currentPhase)||'waiting';
      // مرونة مستقبليّة: الأدمن قد يحدّد الحركة النشطة عبر customData.activeMovement
      if(s && s.customData && s.customData.activeMovement){ activeMovementId = s.customData.activeMovement; buildRail(); }
      var p=S.PHASES[curPhase];
      renderBanner(p);
      if(curPhase==='scale' || curPhase==='result' || curPhase==='closing'){
        reveal();
      } else if(!revealed){
        var root=document.getElementById('reignite-axes-root'); if(root) root.style.display='none';
        var w=document.getElementById('cvWait'); if(w) w.style.display='block';
      }
    });

    // إن أتمّ المقياس سابقًا → علّم مرحلته، وأظهر خريطته فورًا
    if(STORE && STORE.loadAssessment){
      STORE.loadAssessment(user.id).then(function(d){
        if(d && d.results && d.results.ranking){ myStage='result'; setStage('result'); renderMap(d); }
      }).catch(function(){});
    }

    // حضور + نبضة كل ٣٠ ثانية
    try{ S.registerPresence(user, { stage:'waiting' }); }catch(e){}
    setInterval(function(){ try{ S.heartbeat(user, { stage:myStage }); }catch(e){} }, 30000);

    // عند إتمام المقياس → علّم المرحلة وأرجِع الخريطة للهَب
    window.onAxesComplete = function(lean){ setStage('result'); loadMap(); };

    /* ════ إقلاع ════ */
    buildRail();
    loadMap();
  })();
  </script>
</body>
</html>
