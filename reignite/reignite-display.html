<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>شاشة العرض — Reignite</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="reignite-stage.css">
  <style>
    :root{ --ax-bg:#0f172a; --ax-gold:#fbbf24; --ax-green:#10b981; --ax-blue:#3b82f6; --ax-purple:#a78bfa; --ax-red:#ef4444; }
    *{box-sizing:border-box} html,body{margin:0;padding:0;height:100%}
    body{ background:radial-gradient(1400px 760px at 50% -10%, #1a2332 0%, #0f172a 64%);
      color:#f8fafc; font-family:'Tajawal',sans-serif; height:100vh; overflow:hidden;
      display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; }
    .d-timer{ align-self:center; margin-top:20px; font-size:clamp(36px,8vw,100px); font-weight:800;
      font-variant-numeric:tabular-nums; letter-spacing:2px; transition:color .3s; }
    .d-timer.hidden{ display:none; }
    .d-timer.warn{ color:var(--ax-gold); } .d-timer.danger{ color:var(--ax-red); animation:pulse 1s infinite; }
    @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.55} }
    .d-stage{ flex:1; display:flex; align-items:center; justify-content:center; padding:24px 5vw 50px; overflow-y:auto; }
    .d-stage-inner{ width:100%; max-width:1100px; }
    .d-hint{ position:fixed; bottom:12px; inset-inline-start:0; width:100%; text-align:center; color:#94a3b8; font-size:13px; opacity:.5; }
    .stars{ position:fixed; inset:0; z-index:-1; overflow:hidden; }
    .star{ position:absolute; background:#fff; border-radius:50%; opacity:.5; animation:tw 4s infinite; }
    @keyframes tw{ 0%,100%{opacity:.2} 50%{opacity:.7} }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="d-timer hidden" id="dTimer">٠٠:٠٠</div>
  <div class="d-stage"><div class="d-stage-inner" id="dStage"></div></div>
  <div class="d-hint">انقر مرّة لملء الشاشة</div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="axes-config.js"></script>
  <script src="axes-session.js"></script>
  <script src="reignite-flow.js"></script>
  <script src="reignite-live.js"></script>
  <script src="reignite-stage.js"></script>

  <script>
  (function(){
    "use strict";
    var S=window.AXES_SESSION, LIVE=window.REIGNITE_LIVE, STAGE=window.REIGNITE_STAGE, F=window.REIGNITE_FLOW;
    (function(){ var q=new URLSearchParams(window.location.search); var sid=q.get('session'); if(sid) S.setSessionId(sid); })();
    function arNum(n){ var m=['٠','١','٢','٣','٤','٥','٦','٧','٨','٩']; return String(n).replace(/\d/g,function(d){return m[+d];}); }
    function fmtTime(sec){ var m=Math.floor(sec/60),s=sec%60; return arNum(('0'+m).slice(-2))+':'+arNum(('0'+s).slice(-2)); }

    // نجوم
    (function(){ var box=document.getElementById('stars');
      for(var i=0;i<120;i++){ var s=document.createElement('div'); s.className='star';
        var sz=Math.random()<0.85?1.4:2.4; s.style.width=s.style.height=sz+'px';
        s.style.left=(Math.random()*100)+'%'; s.style.top=(Math.random()*100)+'%';
        s.style.animationDelay=(Math.random()*4)+'s'; box.appendChild(s); } })();

    document.addEventListener('click', function(){
      if(document.fullscreenEnabled && !document.fullscreenElement)
        document.documentElement.requestFullscreen().catch(function(){});
    }, { once:true });

    var clients=[], results=[], responses=[], curPhase='waiting';
    var timerInt=null, localTimer=0;

    function presentCount(){ return clients.filter(function(c){
      try{ var t=(c.lastSeen&&c.lastSeen.toMillis)?c.lastSeen.toMillis():0; if(t) return (Date.now()-t)<60000; }catch(e){}
      return c.status==='online'; }).length; }
    function doneCount(){ return results.filter(function(r){return r&&r.results&&r.results.ranking;}).length; }

    function updTimer(){ var el=document.getElementById('dTimer'); el.textContent=fmtTime(Math.max(0,localTimer));
      el.classList.remove('warn','danger');
      if(localTimer<=30&&localTimer>0) el.classList.add('danger'); else if(localTimer<=60&&localTimer>0) el.classList.add('warn'); }
    function stopLocal(){ if(timerInt){clearInterval(timerInt);timerInt=null;} }
    function startLocal(){ stopLocal(); updTimer(); timerInt=setInterval(function(){ if(localTimer>0){localTimer--;updTimer();} else stopLocal(); },1000); }
    function syncTimer(s){ var el=document.getElementById('dTimer');
      if(s.timerRunning&&s.timerSeconds>0){ var e=s.timerStartedAt?Math.floor((Date.now()-s.timerStartedAt)/1000):0;
        localTimer=Math.max(0,s.timerSeconds-e); el.classList.remove('hidden'); startLocal(); }
      else if(s.timerSeconds>0){ localTimer=s.timerSeconds; el.classList.remove('hidden'); stopLocal(); updTimer(); }
      else { el.classList.add('hidden'); stopLocal(); } }

    function buildCtx(){
      var ctx={ role:'leader' };
      var p=F.phases[curPhase];
      if(p && p.kind==='poll'){
        var ids=(p.options||[]).map(function(o){return o.id;});
        ctx.tally=LIVE.tallyPoll(responses, curPhase, ids, 'choice');
      } else if(p && p.kind==='levels'){
        var lids=F.LEVELS.map(function(l){return l.id;});
        ctx.tally=LIVE.tallyPoll(responses, curPhase, lids, 'choice');
      } else if(p && p.kind==='pattern'){
        ctx.words=LIVE.collectWords(responses, curPhase, 'word');
      } else if(p && p.kind==='cards'){
        ctx.touchedCount=LIVE.countTouched(responses, curPhase);
      }
      return ctx;
    }
    function renderPhase(){
      STAGE.render(document.getElementById('dStage'), curPhase, 'display', buildCtx());
      // عدّاد المقياس
      if(curPhase==='scale'){
        var el=document.getElementById('scaleCounter');
        if(el) el.innerHTML='أتمّوا: '+arNum(doneCount())+' · حاضرون: '+arNum(presentCount());
      }
    }
    function applySession(s){ curPhase=(s&&s.currentPhase)||'waiting'; renderPhase(); syncTimer(s); }

    S.ensureSession({ cohort:'Reignite' });
    S.onSessionChange(applySession);
    S.onClientsChange(function(arr){ clients=arr; if(curPhase==='scale'||curPhase==='waiting') renderPhase(); });
    S.onResultsChange(function(arr){ results=arr; if(curPhase==='scale') renderPhase(); });
    LIVE.onResponsesChange(function(arr){ responses=arr;
      var p=F.phases[curPhase];
      if(p && (p.kind==='poll'||p.kind==='levels'||p.kind==='pattern'||p.kind==='cards')) renderPhase();
    });
  })();
  </script>
</body>
</html>
