<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بوصلتك — Reignite</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* ══════════════════════════════════════════════════════════════════
       كل القواعد ببادئة .bn- تفاديًا لأيّ تصادمٍ مع مقياس المحاور (.ax-)
       أو المرايا (.fp-) حين تتعايش الصفحات. الهويّة البصريّة نفسها.
       ══════════════════════════════════════════════════════════════════ */

    :root{
      --bn-bg:#0f172a;      --bn-bg2:#1a2332;    --bn-card:#16202e;
      --bn-line:#2a3850;    --bn-text:#e2e8f0;   --bn-muted:#94a3b8;
      --bn-blue:#3b82f6;    --bn-green:#10b981;  --bn-gold:#fbbf24;
      --bn-purple:#a78bfa;  --bn-red:#f87171;
      --bn-serif:'Amiri',serif;
    }

    *{ box-sizing:border-box }
    html,body{ margin:0; padding:0 }
    body{
      background:radial-gradient(1200px 620px at 50% -12%, #1a2332 0%, #0f172a 62%);
      color:var(--bn-text);
      font-family:'Tajawal',sans-serif;
      min-height:100vh;
      line-height:1.9;
      -webkit-font-smoothing:antialiased;
    }

    #burn-scale-root{ max-width:700px; margin:0 auto; padding:42px 18px 90px }

    /* ─────────────── البطاقة ─────────────── */
    .bn-card{
      background:linear-gradient(180deg, rgba(22,32,46,.92), rgba(15,23,42,.72));
      border:1px solid var(--bn-line);
      border-radius:18px;
      padding:34px 30px;
      box-shadow:0 22px 54px rgba(0,0,0,.38);
      animation:bnFade .45s ease;
      margin-bottom:22px;
    }
    @keyframes bnFade{ from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }

    .bn-centered{ text-align:center }
    .bn-kicker{ color:var(--bn-muted); font-size:13px; letter-spacing:.5px; margin-bottom:14px }
    .bn-title{ font-family:var(--bn-serif); font-size:24px; font-weight:700; line-height:1.7; margin:0 0 18px }
    .bn-title-sm{ font-family:var(--bn-serif); font-size:19px; font-weight:700; margin:8px 0 6px }
    .bn-sub{ color:var(--bn-muted); font-size:15px; margin-bottom:18px }
    .bn-p{ font-size:17px; line-height:2; color:#cbd5e1; margin:0 0 15px }
    .bn-p:last-child{ margin-bottom:0 }
    .bn-muted{ color:var(--bn-muted); font-size:15px }
    .bn-note-line{ color:var(--bn-muted); font-size:14px; text-align:center; margin:18px 0 6px }

    /* الآية: أرض الكرامة، تُعرَض أوّلًا لا ختامًا */
    .bn-ayah{
      font-family:var(--bn-serif); font-size:21px; color:var(--bn-purple);
      margin:0 0 24px; line-height:2;
    }

    .bn-note{
      background:rgba(59,130,246,.06);
      border-inline-start:3px solid rgba(59,130,246,.32);
      border-radius:10px; padding:14px 16px; margin:0 0 16px;
    }
    .bn-note-label{ color:var(--bn-gold); font-size:13px; margin-bottom:6px; font-family:var(--bn-serif) }
    .bn-note .bn-p{ font-size:15.5px; margin:0 }

    /* ─────────────── التعليمات ─────────────── */
    .bn-rule{ margin-bottom:20px }
    .bn-rule-head{ font-weight:700; font-size:17px; margin-bottom:6px; color:#eaf1ff }
    .bn-rule-body{ color:var(--bn-muted); font-size:15.5px; line-height:1.95 }
    .bn-instructions-short{
      color:var(--bn-muted); font-size:13.5px; line-height:1.8;
      padding:10px 14px; border-radius:10px; background:rgba(148,163,184,.06);
      margin:0 0 20px;
    }

    /* ─────────────── الأزرار ─────────────── */
    .bn-btn{
      border:none; cursor:pointer; font-family:inherit; font-size:16px; font-weight:700;
      padding:13px 30px; border-radius:12px;
      transition:transform .15s, box-shadow .15s, background .2s, border-color .2s;
    }
    .bn-btn.primary{ background:var(--bn-blue); color:#fff; box-shadow:0 8px 22px rgba(59,130,246,.30) }
    .bn-btn.primary:hover:not(:disabled){ transform:translateY(-2px) }
    .bn-btn.ghost{ background:transparent; color:var(--bn-text); border:1px solid var(--bn-line) }
    .bn-btn.ghost:hover{ border-color:var(--bn-blue) }
    .bn-btn:disabled{ opacity:.45; cursor:not-allowed }
    .bn-nav{ display:flex; gap:12px; margin-top:26px; flex-wrap:wrap }
    .bn-nav .bn-btn.primary{ margin-inline-start:auto }

    /* ─────────────── شريط التقدّم ─────────────── */
    .bn-progress-row{ display:flex; align-items:center; gap:14px; margin-bottom:24px }
    .bn-progress-label{ color:var(--bn-muted); font-size:13px; white-space:nowrap }
    .bn-progress-bar{ flex:1; height:6px; background:#22304a; border-radius:99px; overflow:hidden }
    .bn-progress-fill{
      height:100%; border-radius:99px;
      background:linear-gradient(90deg,var(--bn-blue),var(--bn-green));
      transition:width .4s ease;
    }

    /* ─────────────── المقدّمات والتلميحات ─────────────── */
    .bn-intro{
      color:#cbd5e1; font-size:15.5px; line-height:2;
      background:rgba(167,139,250,.06); border:1px solid rgba(167,139,250,.22);
      border-radius:14px; padding:20px 22px; margin:0 0 26px;
    }
    .bn-hint{
      color:var(--bn-muted); font-size:14.5px; line-height:1.95;
      background:rgba(59,130,246,.06); border-inline-start:3px solid rgba(59,130,246,.32);
      border-radius:10px; padding:12px 14px; margin:0 0 22px;
    }

    /* ─────────────── المشهد والعبارات ─────────────── */
    .bn-scene{ margin-bottom:8px }
    .bn-prompt{ font-size:20px; font-weight:700; line-height:1.75; margin-bottom:14px }
    .bn-prompt-pulse{ font-size:17px; color:var(--bn-muted); font-weight:500 }

    .bn-options{ display:flex; flex-direction:column; gap:20px }
    .bn-option, .bn-statement, .bn-boolean{
      background:#101a28; border:1px solid var(--bn-line);
      border-radius:14px; padding:20px 20px 16px;
    }
    .bn-statement, .bn-boolean{ margin-bottom:18px }
    .bn-option-text{ display:flex; gap:12px; align-items:flex-start; font-size:17px; line-height:1.85; margin-bottom:16px }
    .bn-letter{
      flex:0 0 32px; height:32px; border-radius:50%; background:#1c2a40; color:var(--bn-gold);
      display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px;
    }
    .bn-statement-text{ font-size:18px; font-weight:600; line-height:1.8; margin-bottom:20px }

    /* ─────────────── ليكرت ─────────────── */
    .bn-scale{ display:flex; gap:9px; flex-wrap:wrap }
    .bn-likert{
      width:44px; height:44px; border-radius:50%;
      border:1px solid var(--bn-line); background:#0d1521;
      color:var(--bn-text); font-family:inherit; font-size:16px; font-weight:700;
      cursor:pointer; transition:all .15s;
    }
    .bn-likert:hover{ border-color:var(--bn-green); color:var(--bn-green); transform:translateY(-2px) }
    .bn-likert.selected{
      background:linear-gradient(135deg,var(--bn-blue),var(--bn-green));
      border-color:var(--bn-blue); color:#fff; transform:scale(1.10);
    }
    .bn-scale-labels{ display:flex; justify-content:space-between; color:var(--bn-muted); font-size:12px; margin-top:9px }

    /* ─────────────── ثنائيّ ─────────────── */
    .bn-bool-row{ display:flex; gap:12px }
    .bn-bool{
      flex:1; padding:14px; border-radius:12px; border:1px solid var(--bn-line);
      background:#0d1521; color:var(--bn-text); font-family:inherit; font-size:16px;
      font-weight:700; cursor:pointer; transition:all .15s;
    }
    .bn-bool:hover{ border-color:var(--bn-blue) }
    .bn-bool.selected{ background:var(--bn-blue); border-color:var(--bn-blue); color:#fff }

    /* ─────────────── السؤال الفارز ─────────────── */
    .bn-tie{ display:flex; flex-direction:column; gap:16px; margin-top:8px }
    .bn-tie-option{
      text-align:start; padding:22px 22px; border-radius:14px;
      border:1px solid var(--bn-line); background:#101a28; color:var(--bn-text);
      font-family:inherit; font-size:17px; line-height:1.85; cursor:pointer;
      transition:all .18s;
    }
    .bn-tie-option:hover{ border-color:var(--bn-gold); background:#13202f; transform:translateY(-2px) }

    /* ─────────────── تنبيهات ─────────────── */
    .bn-warn{
      color:var(--bn-gold); font-size:14.5px; margin-top:18px;
      padding:11px 14px; border-radius:10px;
      background:rgba(251,191,36,.08); border:1px solid rgba(251,191,36,.24);
    }

    /* ─────────────── إغلاق الجرعة ─────────────── */
    .bn-closing .bn-title{ font-size:22px }
    .bn-reflect{
      background:rgba(16,185,129,.06); border:1px solid rgba(16,185,129,.22);
      border-radius:14px; padding:20px 22px; margin:18px 0;
      font-size:16.5px; line-height:2; color:#cbd5e1;
    }
    .bn-outro{ color:var(--bn-muted); font-size:15.5px; margin:0 }

    /* ─────────────── كتل النتيجة ─────────────── */
    .bn-block{
      position:relative; margin:0 0 26px; padding:24px 24px;
      border-radius:16px; border:1px solid var(--bn-line);
      background:linear-gradient(180deg, rgba(22,32,46,.55), rgba(15,23,42,.25));
    }
    .bn-block:last-child{ margin-bottom:0 }
    .bn-block-label{ color:var(--bn-gold); font-size:13px; letter-spacing:.5px; margin-bottom:10px; font-family:var(--bn-serif) }
    .bn-block-title{ font-family:var(--bn-serif); font-size:20px; font-weight:700; margin-bottom:14px; color:#eaf1ff }

    /* الفقرة المشروطة: مفصولةٌ بصريًّا عن جسم النصّ عمدًا،
       فتُقرَأ اهتمامًا إضافيًّا لا جزءًا من التشخيص فتُثقله. */
    .bn-block-aside{
      margin-top:20px; padding-top:18px; border-top:1px solid var(--bn-line);
    }
    .bn-block-aside .bn-p{ font-size:15.5px; color:var(--bn-muted) }

    .bn-block-ground{ background:rgba(167,139,250,.06); border-color:rgba(167,139,250,.24) }
    .bn-block-bridge{
      background:rgba(16,185,129,.07); border-color:rgba(16,185,129,.26);
      border-inline-start:4px solid var(--bn-green);
    }
    .bn-block-bridge .bn-block-label{ color:var(--bn-green) }
    .bn-block-hero{
      background:linear-gradient(180deg, rgba(59,130,246,.10), rgba(15,23,42,.2));
      border-color:rgba(59,130,246,.34);
    }
    .bn-block-diag{
      background:linear-gradient(180deg, rgba(251,191,36,.07), rgba(15,23,42,.2));
      border-color:rgba(251,191,36,.30);
    }

    /* رقاقة البُعد الهدف */
    .bn-chip{
      display:inline-flex; align-items:center; gap:10px; margin:2px 0 18px;
      padding:9px 18px; border-radius:99px;
      background:rgba(251,191,36,.14); border:1px solid rgba(251,191,36,.4);
    }
    .bn-chip-dim{ color:var(--bn-gold); font-weight:700; font-size:16px }
    .bn-chip-sep{ color:var(--bn-muted) }
    .bn-chip-state{ color:#fde9b8; font-size:15px }
    .bn-chip-sev{ color:var(--bn-muted); font-size:14px }

    /* ─────────────── الممارسة ─────────────── */
    .bn-practice{
      background:rgba(251,191,36,.08); border:1px solid rgba(251,191,36,.26);
      border-radius:16px; padding:24px; margin-top:26px;
    }
    .bn-practice-name{ font-family:var(--bn-serif); font-size:21px; font-weight:700; color:var(--bn-gold); margin-bottom:14px }
    .bn-practice .bn-p{ color:#fde9b8 }
    .bn-practice-when{ font-size:15.5px; color:#e8d9a8 }
    .bn-practice-role{ font-size:15.5px; opacity:.9 }
    .bn-practice-sign{
      margin-top:16px; padding-top:14px; border-top:1px solid rgba(251,191,36,.22);
      font-size:15px; color:#e8d9a8;
    }
    .bn-practice-sign-label{ color:var(--bn-gold); font-weight:700 }

    /* ─────────────── شريط الطيف ─────────────── */
    .bn-spectrum-set{ margin:22px 0 }
    .bn-spectrum{ margin-bottom:20px }
    .bn-spectrum-target .bn-sb-name{ color:var(--bn-gold); font-weight:700 }
    .bn-sb-name{ font-size:15px; margin-bottom:9px; color:#cbd5e1 }
    .bn-sb-track{
      position:relative; display:flex; height:12px;
      border-radius:99px; overflow:hidden; background:#0d1521;
    }
    .bn-sb-zone{ flex:1; height:100% }
    .bn-sb-def{ background:rgba(59,130,246,.28) }
    .bn-sb-bal{ background:rgba(16,185,129,.28) }
    .bn-sb-exc{ background:rgba(251,191,36,.30) }
    .bn-sb-dot{
      position:absolute; top:50%; width:16px; height:16px; border-radius:50%;
      transform:translate(50%,-50%); box-shadow:0 0 0 3px rgba(15,23,42,.7);
    }
    /* التذبذب شريطٌ ممتدٌّ لا نقطة — لأنّ صاحبه لا يقف في طرفٍ بل يتأرجح،
       والنقطة الواحدة تكذب عليه. */
    .bn-sb-band{
      position:absolute; top:50%; inset-inline-start:16%; width:68%; height:14px;
      transform:translateY(-50%); border-radius:99px;
      background:rgba(167,139,250,.34);
      box-shadow:inset 0 0 0 1px rgba(167,139,250,.5);
      animation:bnPulse 2.6s ease-in-out infinite;
    }
    @keyframes bnPulse{ 0%,100%{opacity:.7} 50%{opacity:1} }
    .bn-sb-labels{ display:flex; justify-content:space-between; color:var(--bn-muted); font-size:12px; margin-top:8px }

    /* ─────────────── خطّ العافية: النقطة الأولى ─────────────── */
    .bn-wellbeing{ margin:22px 0 6px }
    .bn-wl-row{ display:flex; align-items:center; gap:12px; margin-bottom:13px }
    .bn-wl-name{ flex:0 0 132px; font-size:14.5px }
    .bn-wl-domain{ color:var(--bn-muted); font-size:11.5px }
    .bn-wl-bar{ flex:1; height:8px; background:#22304a; border-radius:99px; overflow:hidden }
    .bn-wl-fill{ height:100%; border-radius:99px; transition:width .5s ease }
    .bn-wl-val{ flex:0 0 34px; text-align:start; font-size:14px; color:var(--bn-muted) }

    /* ─────────────── الخطّ عبر الأسابيع ─────────────── */
    .bn-line{ margin:20px 0 }
    .bn-line-title{ font-family:var(--bn-serif); font-size:17px; color:var(--bn-gold); margin-bottom:14px }
    .bn-line-svg{ width:100%; height:auto; direction:ltr; display:block }
    .bn-grid{ stroke:#22304a; stroke-width:1 }
    .bn-axis-label{ fill:#5b6b85; font-size:10px; text-anchor:middle; font-family:'Tajawal',sans-serif }
    /* أسابيع النزول المتوقَّع تُظلَّل بلا نصّ حكمٍ عليها */
    .bn-dip{ fill:rgba(167,139,250,.07) }
    .bn-legend{ display:flex; gap:18px; justify-content:center; margin-top:12px; flex-wrap:wrap }
    .bn-legend-item{ display:inline-flex; align-items:center; gap:7px; font-size:13.5px; color:var(--bn-muted) }
    .bn-legend-dot{ width:10px; height:10px; border-radius:50%; display:inline-block }
    .bn-line-caption{ color:var(--bn-muted); font-size:13.5px; text-align:center; margin-top:10px }

    /* ─────────────── النبضة ─────────────── */
    .bn-pulse .bn-statement{ padding:16px 18px 12px; margin-bottom:14px }
    .bn-pulse .bn-statement-text{ font-size:16.5px; margin-bottom:14px }
    .bn-pulse-open{ margin-top:20px }
    .bn-pulse-open-label{ display:block; color:var(--bn-muted); font-size:14.5px; margin-bottom:10px }
    .bn-pulse-open-input{
      width:100%; padding:13px 15px; border-radius:12px;
      border:1px solid var(--bn-line); background:#0d1521; color:var(--bn-text);
      font-family:inherit; font-size:15.5px;
    }
    .bn-pulse-open-input:focus{ outline:none; border-color:var(--bn-blue) }
    .bn-comment-head{ font-family:var(--bn-serif); font-size:19px; font-weight:700; margin-bottom:10px; color:#eaf1ff }
    .bn-comment-ask{ color:var(--bn-gold); font-size:16px; margin-top:12px }

    /* ─────────────── حالات النظام ─────────────── */
    .bn-spinner{
      width:34px; height:34px; border:3px solid #22304a; border-top-color:var(--bn-blue);
      border-radius:50%; margin:0 auto 16px; animation:bnSpin 1s linear infinite;
    }
    @keyframes bnSpin{ to{ transform:rotate(360deg) } }
    .bn-saving{ color:var(--bn-muted); font-size:14px }
    .bn-check{ font-size:46px; color:var(--bn-green); margin-bottom:14px }

    /* ─────────────── المعاينة البنيويّة المؤقّتة ─────────────── */
    .bn-diag{ margin:18px 0; border-top:1px solid var(--bn-line) }
    .bn-diag-row{
      display:flex; justify-content:space-between; gap:16px;
      padding:9px 0; border-bottom:1px solid var(--bn-line); font-size:14.5px;
    }
    .bn-diag-k{ color:var(--bn-muted); flex:0 0 auto }
    .bn-diag-v{ color:#cbd5e1; text-align:end; direction:ltr; unicode-bidi:plaintext }

    /* ─────────────── الطباعة ─────────────── */
    @media print{
      body{ background:#fff; color:#1a1a1a }
      #burn-scale-root{ max-width:none; padding:0 }
      .bn-card{ background:#fff; border:none; box-shadow:none; page-break-inside:avoid }
      .bn-nav, .bn-progress-row{ display:none }
      .bn-block, .bn-practice{ background:#fafafa !important; border-color:#ddd }
      .bn-p, .bn-block-title{ color:#1a1a1a }
      .bn-ayah{ color:#5b3fa8 }
    }

    /* ─────────────── الشاشات الصغيرة ─────────────── */
    @media(max-width:520px){
      #burn-scale-root{ padding:26px 13px 70px }
      .bn-card{ padding:24px 18px }
      .bn-title{ font-size:21px }
      .bn-prompt{ font-size:18px }
      .bn-statement-text{ font-size:16.5px }
      .bn-likert{ width:40px; height:40px; font-size:15px }
      .bn-scale{ gap:7px }
      .bn-wl-name{ flex-basis:104px; font-size:13.5px }
      .bn-block{ padding:20px 17px }
      .bn-practice{ padding:20px 17px }
      .bn-nav{ gap:10px }
      .bn-btn{ padding:12px 22px; font-size:15px }
    }

    /* تقليل الحركة لمن يطلبها */
    @media (prefers-reduced-motion: reduce){
      *, *::before, *::after{ animation-duration:.01ms !important; transition-duration:.01ms !important }
    }
  </style>
</head>
<body>

  <!-- حاوية المودويل: أيّ صفحةٍ تضمّ هذا العنصر حيث تشاء -->
  <div id="burn-scale-root"></div>

  <!-- ═══ ١) Firebase SDK 8.10.1 ═══ -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <!-- ═══ ٢) تهيئة Firebase (نفس قيم المشروع) ═══ -->
  <script src="../../js/firebase-config.js"></script>

  <!-- ═══ ٣) البيانات النقيّة ═══ -->
  <script src="burn-config.js"></script>
  <script src="burn-items.js"></script>
  <script src="burn-strings.js"></script>

  <!-- ═══ ٤) المحتوى — يصل في المراحل ١٠ و١١ ═══
       الصفحة تعمل بدونها: تُعرَض معاينةٌ بنيويّةٌ مؤقّتةٌ مكان النتيجة،
       ★ عمدًا — ليُختبَر المقياس بنيويًّا قبل أن يُستثمَر في النصوص.
       فكّ التعليق عن هذه الأسطر حين تصل ملفّاتها. -->
  
  <script src="burn-content.js"></script>
  <script src="burn-content-target.js"></script>
  <script src="burn-practices-coh.js"></script>
  <script src="burn-practices-vit.js"></script>
  <script src="burn-practices-bel.js"></script>
  

  <!-- ═══ ٥) المنطق ═══ -->
  <script src="burn-engine.js"></script>
  <script src="burn-flags.js"></script>

  <!-- الجسر — يصل في المرحلة ١٢ -->
  <!-- <script src="burn-bridge.js"></script> -->

  <!-- ═══ ٦) المخزن ثمّ العرض ثمّ التطبيق ═══ -->
  <script src="burn-store.js"></script>
  <script src="burn-render.js"></script>
  <script src="burn-app.js"></script>

  <!-- ═══ ٧) الإقلاع ═══ -->
  <script>
    (function(){
      'use strict';

      /* قراءة السياق من الرابط:
         ?role=lead&cohort=r1&alias=... — أو من التضمين في منصّة الدورة. */
      var q = new URLSearchParams(window.location.search);

      var VALID_ROLES = ['lead','mgr','found','free','sale','hr'];
      var role = q.get('role');
      if (VALID_ROLES.indexOf(role) === -1) role = null;

      function run(){
        if(!window.BURN_APP){
          document.getElementById('burn-scale-root').innerHTML =
            '<pre dir="ltr" style="color:#f87171">BURN_APP لم يُحمَّل</pre>';
          return;
        }
        window.BURN_APP.init({
          rootId: 'burn-scale-root',
          loginPath: '../../login.html',
          role: role,
          cohortId: q.get('cohort') || null,
          alias: q.get('alias') || null,
          courseId: q.get('courseId') || 'reignite'
        });
      }

      if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run);
      else run();
    })();
  </script>

</body>
</html>
