<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>خريطتك — Reignite</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* ══════════════════════════════════════════════════════════════════
       نفس هويّة burn-scale.html ببادئة .bn- — مع فروقٍ ثلاثة:
         • الشاشات الثلاث تُعرَض متتابعةً لا بأزرار، فالتقرير للقراءة
           لا للكشف التدريجيّ. الكشف حدث مرّةً وانتهى.
         • خطّ العافية عبر الأسابيع يظهر هنا إن وُجدت نبضات.
         • تنسيق طباعةٍ كامل، لأنّ المشارك سيحفظ نسخةً غالبًا.
       ══════════════════════════════════════════════════════════════════ */

    :root{
      --bn-bg:#0f172a;      --bn-bg2:#1a2332;    --bn-card:#16202e;
      --bn-line:#2a3850;    --bn-text:#e2e8f0;   --bn-muted:#94a3b8;
      --bn-blue:#3b82f6;    --bn-green:#10b981;  --bn-gold:#fbbf24;
      --bn-purple:#a78bfa;  --bn-red:#f87171;
      --bn-serif:'Amiri',serif;
    }
    *{ box-sizing:border-box }
    html,body{ margin:0; padding:0 }
    body{
      background:radial-gradient(1200px 620px at 50% -12%, #1a2332 0%, #0f172a 62%);
      color:var(--bn-text); font-family:'Tajawal',sans-serif;
      min-height:100vh; line-height:1.9; -webkit-font-smoothing:antialiased;
    }
    #burn-report-root{ max-width:720px; margin:0 auto; padding:42px 18px 90px }

    .bn-card{
      background:linear-gradient(180deg, rgba(22,32,46,.92), rgba(15,23,42,.72));
      border:1px solid var(--bn-line); border-radius:18px; padding:34px 30px;
      box-shadow:0 22px 54px rgba(0,0,0,.38); margin-bottom:22px;
      animation:bnFade .45s ease;
    }
    @keyframes bnFade{ from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }

    .bn-centered{ text-align:center }
    .bn-kicker{ color:var(--bn-muted); font-size:13px; letter-spacing:.5px; margin-bottom:14px }
    .bn-title{ font-family:var(--bn-serif); font-size:24px; font-weight:700; line-height:1.7; margin:0 0 18px }
    .bn-title-sm{ font-family:var(--bn-serif); font-size:19px; font-weight:700; margin:8px 0 6px }
    .bn-p{ font-size:17px; line-height:2; color:#cbd5e1; margin:0 0 15px }
    .bn-p:last-child{ margin-bottom:0 }
    .bn-muted{ color:var(--bn-muted); font-size:15px }
    .bn-note-line{ color:var(--bn-muted); font-size:14px; text-align:center; margin:18px 0 6px }
    .bn-ayah{ font-family:var(--bn-serif); font-size:21px; color:var(--bn-purple); margin:0 0 24px; line-height:2 }
    .bn-lead-in{ color:var(--bn-muted); font-size:16px; margin:26px 0 14px }

    .bn-btn{
      border:none; cursor:pointer; font-family:inherit; font-size:16px; font-weight:700;
      padding:13px 30px; border-radius:12px; transition:transform .15s, border-color .2s;
    }
    .bn-btn.primary{ background:var(--bn-blue); color:#fff; box-shadow:0 8px 22px rgba(59,130,246,.30) }
    .bn-btn.primary:hover{ transform:translateY(-2px) }
    .bn-btn.ghost{ background:transparent; color:var(--bn-text); border:1px solid var(--bn-line) }
    .bn-btn.ghost:hover{ border-color:var(--bn-blue) }
    .bn-nav{ display:flex; gap:12px; margin-top:26px; flex-wrap:wrap; justify-content:center }

    /* كتل النتيجة */
    .bn-block{
      position:relative; margin:0 0 26px; padding:24px;
      border-radius:16px; border:1px solid var(--bn-line);
      background:linear-gradient(180deg, rgba(22,32,46,.55), rgba(15,23,42,.25));
    }
    .bn-block:last-child{ margin-bottom:0 }
    .bn-block-label{ color:var(--bn-gold); font-size:13px; letter-spacing:.5px; margin-bottom:10px; font-family:var(--bn-serif) }
    .bn-block-title{ font-family:var(--bn-serif); font-size:20px; font-weight:700; margin-bottom:14px; color:#eaf1ff }
    .bn-block-aside{ margin-top:20px; padding-top:18px; border-top:1px solid var(--bn-line) }
    .bn-block-aside .bn-p{ font-size:15.5px; color:var(--bn-muted) }
    .bn-block-ground{ background:rgba(167,139,250,.06); border-color:rgba(167,139,250,.24) }
    .bn-block-bridge{
      background:rgba(16,185,129,.07); border-color:rgba(16,185,129,.26);
      border-inline-start:4px solid var(--bn-green);
    }
    .bn-block-bridge .bn-block-label{ color:var(--bn-green) }
    .bn-block-hero{ background:linear-gradient(180deg, rgba(59,130,246,.10), rgba(15,23,42,.2)); border-color:rgba(59,130,246,.34) }
    .bn-block-diag{ background:linear-gradient(180deg, rgba(251,191,36,.07), rgba(15,23,42,.2)); border-color:rgba(251,191,36,.30) }

    .bn-chip{
      display:inline-flex; align-items:center; gap:10px; margin:2px 0 18px;
      padding:9px 18px; border-radius:99px;
      background:rgba(251,191,36,.14); border:1px solid rgba(251,191,36,.4);
    }
    .bn-chip-dim{ color:var(--bn-gold); font-weight:700; font-size:16px }
    .bn-chip-sep{ color:var(--bn-muted) }
    .bn-chip-state{ color:#fde9b8; font-size:15px }
    .bn-chip-sev{ color:var(--bn-muted); font-size:14px }

    /* الممارسة */
    .bn-practice{
      background:rgba(251,191,36,.08); border:1px solid rgba(251,191,36,.26);
      border-radius:16px; padding:24px; margin-top:26px;
    }
    .bn-practice-name{ font-family:var(--bn-serif); font-size:21px; font-weight:700; color:var(--bn-gold); margin-bottom:14px }
    .bn-practice .bn-p{ color:#fde9b8 }
    .bn-practice-when{ font-size:15.5px; color:#e8d9a8 }
    .bn-practice-role{ font-size:15.5px; opacity:.9 }
    .bn-practice-sign{ margin-top:16px; padding-top:14px; border-top:1px solid rgba(251,191,36,.22); font-size:15px; color:#e8d9a8 }
    .bn-practice-sign-label{ color:var(--bn-gold); font-weight:700 }
    .bn-practice-intro{ color:var(--bn-muted); font-size:16px; margin:26px 0 6px }
    .bn-practice-outro{ color:var(--bn-muted); font-size:15px; margin:16px 0 0; text-align:center }

    /* شريط الطيف */
    .bn-spectrum-set{ margin:22px 0 }
    .bn-spectrum{ margin-bottom:20px }
    .bn-spectrum-target .bn-sb-name{ color:var(--bn-gold); font-weight:700 }
    .bn-sb-name{ font-size:15px; margin-bottom:9px; color:#cbd5e1 }
    .bn-sb-track{ position:relative; display:flex; height:12px; border-radius:99px; overflow:hidden; background:#0d1521 }
    .bn-sb-zone{ flex:1; height:100% }
    .bn-sb-def{ background:rgba(59,130,246,.28) }
    .bn-sb-bal{ background:rgba(16,185,129,.28) }
    .bn-sb-exc{ background:rgba(251,191,36,.30) }
    .bn-sb-dot{ position:absolute; top:50%; width:16px; height:16px; border-radius:50%; transform:translate(50%,-50%); box-shadow:0 0 0 3px rgba(15,23,42,.7) }
    .bn-sb-band{
      position:absolute; top:50%; inset-inline-start:16%; width:68%; height:14px;
      transform:translateY(-50%); border-radius:99px; background:rgba(167,139,250,.34);
      box-shadow:inset 0 0 0 1px rgba(167,139,250,.5); animation:bnPulse 2.6s ease-in-out infinite;
    }
    @keyframes bnPulse{ 0%,100%{opacity:.7} 50%{opacity:1} }
    .bn-sb-labels{ display:flex; justify-content:space-between; color:var(--bn-muted); font-size:12px; margin-top:8px }

    /* خطّ العافية */
    .bn-wellbeing{ margin:22px 0 6px }
    .bn-wl-row{ display:flex; align-items:center; gap:12px; margin-bottom:13px }
    .bn-wl-name{ flex:0 0 132px; font-size:14.5px }
    .bn-wl-domain{ color:var(--bn-muted); font-size:11.5px }
    .bn-wl-bar{ flex:1; height:8px; background:#22304a; border-radius:99px; overflow:hidden }
    .bn-wl-fill{ height:100%; border-radius:99px }
    .bn-wl-val{ flex:0 0 34px; text-align:start; font-size:14px; color:var(--bn-muted) }

    .bn-line{ margin:20px 0 }
    .bn-line-title{ font-family:var(--bn-serif); font-size:17px; color:var(--bn-gold); margin-bottom:14px }
    .bn-line-svg{ width:100%; height:auto; direction:ltr; display:block }
    .bn-grid{ stroke:#22304a; stroke-width:1 }
    .bn-axis-label{ fill:#5b6b85; font-size:10px; text-anchor:middle; font-family:'Tajawal',sans-serif }
    .bn-dip{ fill:rgba(167,139,250,.07) }
    .bn-legend{ display:flex; gap:18px; justify-content:center; margin-top:12px; flex-wrap:wrap }
    .bn-legend-item{ display:inline-flex; align-items:center; gap:7px; font-size:13.5px; color:var(--bn-muted) }
    .bn-legend-dot{ width:10px; height:10px; border-radius:50%; display:inline-block }
    .bn-line-caption{ color:var(--bn-muted); font-size:13.5px; text-align:center; margin-top:10px }

    /* فواصل الأقسام في التقرير المتّصل */
    .bn-part{ margin-bottom:34px }
    .bn-part-head{
      display:flex; align-items:center; gap:14px; margin:0 0 20px;
      color:var(--bn-muted); font-size:14px; font-family:var(--bn-serif);
    }
    .bn-part-head::after{ content:''; flex:1; height:1px; background:var(--bn-line) }

    /* الترويسة */
    .bn-report-head{ text-align:center; margin-bottom:30px }
    .bn-report-title{ font-family:var(--bn-serif); font-size:28px; font-weight:700; margin:0 0 8px }
    .bn-report-sub{ color:var(--bn-muted); font-size:15px }
    .bn-report-date{ color:var(--bn-muted); font-size:13px; margin-top:6px }

    /* حالات */
    .bn-spinner{ width:34px; height:34px; border:3px solid #22304a; border-top-color:var(--bn-blue); border-radius:50%; margin:0 auto 16px; animation:bnSpin 1s linear infinite }
    @keyframes bnSpin{ to{ transform:rotate(360deg) } }

    /* ═══════════ الطباعة ═══════════
       المشارك سيحفظ نسخةً غالبًا، فالطباعة ليست ثانويّة هنا. */
    @media print{
      body{ background:#fff; color:#1a1a1a }
      #burn-report-root{ max-width:none; padding:0 }
      .bn-card{ background:#fff; border:none; box-shadow:none; padding:0 0 18px; margin-bottom:14px }
      .bn-nav, .bn-print-hide{ display:none !important }
      .bn-block{ background:#fafafa !important; border-color:#ddd; page-break-inside:avoid }
      .bn-block-ground{ background:#f4f1fb !important }
      .bn-block-bridge{ background:#eefaf4 !important; border-inline-start-color:#10b981 }
      .bn-practice{ background:#fdf6e3 !important; border-color:#e3cf8a; page-break-inside:avoid }
      .bn-p, .bn-block-title, .bn-title{ color:#1a1a1a }
      .bn-practice .bn-p, .bn-practice-when, .bn-practice-role, .bn-practice-sign{ color:#5a4a1a }
      .bn-ayah{ color:#5b3fa8 }
      .bn-part{ page-break-inside:avoid }
      .bn-sb-band{ animation:none }
    }

    @media(max-width:520px){
      #burn-report-root{ padding:26px 13px 70px }
      .bn-card{ padding:24px 18px }
      .bn-report-title{ font-size:23px }
      .bn-title{ font-size:21px }
      .bn-block{ padding:20px 17px }
      .bn-practice{ padding:20px 17px }
      .bn-wl-name{ flex-basis:104px; font-size:13.5px }
    }

    @media (prefers-reduced-motion: reduce){
      *, *::before, *::after{ animation-duration:.01ms !important; transition-duration:.01ms !important }
    }
  </style>
</head>
<body>

  <div id="burn-report-root"></div>

  <!-- ١) Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="../../js/firebase-config.js"></script>

  <!-- ٢) البيانات -->
  <script src="burn-config.js"></script>
  <script src="burn-items.js"></script>
  <script src="burn-strings.js"></script>
  <script src="burn-content.js"></script>
  <script src="burn-content-target.js"></script>
  <script src="burn-practices-coh.js"></script>
  <script src="burn-practices-vit.js"></script>
  <script src="burn-practices-bel.js"></script>

  <!-- ٣) المنطق -->
  <script src="burn-engine.js"></script>
  <script src="burn-flags.js"></script>
  <script src="burn-bridge.js"></script>

  <!-- ٤) المخزن والعرض -->
  <script src="burn-store.js"></script>
  <script src="burn-render.js"></script>

  <!-- ٥) التقرير -->
  <script>
  (function(){
    'use strict';

    /* ═══════════════════════════════════════════════════════════════
       burn-report — عرض خريطة المشارك

       ★ التقرير يُبنى من computed المخزَّن لا من إعادة حساب.
         فما يراه المشارك بعد شهورٍ هو نفسه ما رآه يوم اكتمل المقياس،
         حتى لو تغيّرت عتبةٌ في burn-config بعدها.
         وإعادة الحساب لا تقع إلّا إن كانت الوثيقة قديمةً بلا computed.

       ★ وصفحة قراءةٍ فقط: لا تكتب في Firestore حرفًا.
       ═══════════════════════════════════════════════════════════════ */

    var q = new URLSearchParams(location.search);
    var ROOT = 'burn-report-root';

    function el(){ return document.getElementById(ROOT); }
    function paint(html){ var e = el(); if(e) e.innerHTML = html; }
    function R(){ return window.BURN_RENDER; }
    function S(){ return window.BURN_STRINGS; }
    function BR(){ return window.BURN_BRIDGE; }

    function fail(msg){
      paint(R().card('<div class="bn-centered"><p class="bn-p">' +
        R().esc(msg) + '</p></div>'));
    }

    function formatDate(ts){
      try{
        var d = ts && ts.toDate ? ts.toDate() : (ts ? new Date(Number(ts)) : null);
        if(!d || isNaN(d)) return '';
        return d.toLocaleDateString('ar-EG', { day:'numeric', month:'long', year:'numeric' });
      }catch(e){ return ''; }
    }

    /* ─── الترويسة ─── */
    function head(doc){
      var when = formatDate(doc.progress && doc.progress.completedAt);
      return '' +
        '<div class="bn-report-head">' +
          '<div class="bn-report-title">خريطة طاقتك</div>' +
          '<div class="bn-report-sub">' + R().esc(S().disclaimer.footer) + '</div>' +
          (when ? '<div class="bn-report-date">' + R().esc(when) + '</div>' : '') +
        '</div>';
    }

    /* ─── قسمٌ من التقرير ─── */
    function part(label, inner){
      return '<div class="bn-part">' +
               (label ? '<div class="bn-part-head">' + R().esc(label) + '</div>' : '') +
               inner +
             '</div>';
    }

    /* ─── خطّ العافية عبر الأسابيع ─── */
    function pulseSection(doc){
      var pulses = doc.weeklyPulses || [];
      var withData = pulses.filter(function(p){ return p.computed; });
      if(withData.length < 2) return '';
      return part('خطّك عبر الأسابيع', R().wellbeingLine(pulses));
    }

    /* ─── التقرير الكامل ─── */
    function renderFull(doc, result, flags){
      var br = BR();
      var raw = doc.raw || {};
      var html = head(doc);

      /* الحالات الخاصّة تحلّ محلّ كل شيء */
      var special = flags && flags.specialScreen;
      if(special){
        html += R().card(br.specialScreenHtml(special, result));
        html += printBar();
        return paint(html);
      }

      html += R().card(
        part('من أنت',            br.screenHtml(1, result, flags, raw)) +
        part('أين تنزف ولماذا',   br.screenHtml(2, result, flags, raw)) +
        part('ما التالي',         br.screenHtml(3, result, flags, raw)) +
        pulseSection(doc) +
        '<p class="bn-note-line bn-print-hide">' + R().esc(S().result.reopenNote) + '</p>'
      );
      html += printBar();
      paint(html);
    }

    function printBar(){
      return '<div class="bn-nav bn-print-hide">' +
               '<button class="bn-btn ghost" onclick="window.print()">' +
                 R().esc(S().result.printBtn) +
               '</button>' +
             '</div>';
    }

    /* ─── الإقلاع ─── */
    async function boot(){
      paint(R().card('<div class="bn-centered"><div class="bn-spinner"></div>' +
                     '<div class="bn-muted">' + R().esc(S().system.loading) + '</div></div>'));

      /* الهويّة: المشارك نفسه، أو معرّفٌ يمرّره المدرّب */
      var uid = q.get('uid');
      if(!uid){
        var u = window.BURN_STORE.requireAuth({ loginPath: '../../login.html' });
        if(!u) return;
        uid = u.id;
      }

      var doc = await window.BURN_STORE.load(uid);
      if(!doc) return fail(S().system.errorLoad);

      var p = doc.progress || {};
      if(!p.completed){
        return paint(R().card(
          '<h2 class="bn-title">الخريطة لم تكتمل بعد</h2>' +
          '<p class="bn-p">أنهيت ' + S().arabicNum((p.dosesCompleted||[]).length) +
          ' من ' + S().arabicNum(BURN_CONFIG.meta.totalDoses) + ' جرعات.</p>' +
          '<div class="bn-nav"><a class="bn-btn primary" href="burn-scale.html">' +
            R().esc(S().resume.continueBtn) + '</a></div>'
        ));
      }

      var result = doc.computed;

      /* ★ إعادة الحساب لا تقع إلّا إن غاب computed — وهي حالة وثيقةٍ قديمة.
         وما دام محفوظًا، فما يراه المشارك اليوم هو ما رآه يوم اكتمل. */
      if(!result){
        var progress = doc.progress || {};
        result = BURN_ENGINE.computeAll(doc.raw || {}, {
          role: (doc.meta && doc.meta.role) || 'lead',
          primaryOverride: progress.lockedAxis || null,
          tieChoice: progress.tieChoice || null
        });
        console.warn('[BURN_REPORT] لا computed مخزَّن — أُعيد الحساب من الخام');
      }

      var flags = doc.flags || BURN_FLAGS.evaluate(result, doc.raw || {});

      renderFull(doc, result, flags);
    }

    function run(){
      var missing = [];
      ['BURN_CONFIG','BURN_STRINGS','BURN_CONTENT','BURN_CONTENT_TARGET',
       'BURN_ENGINE','BURN_FLAGS','BURN_BRIDGE','BURN_STORE','BURN_RENDER']
        .forEach(function(n){ if(!window[n]) missing.push(n); });
      if(missing.length){
        document.getElementById(ROOT).innerHTML =
          '<pre dir="ltr" style="color:#f87171">Missing: ' + missing.join(', ') + '</pre>';
        return;
      }
      boot();
    }

    if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run);
    else run();

  })();
  </script>
</body>
</html>
