<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة المدرّب — مقياس الاحتراق المحوري</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* ══════════════════════════════════════════════════════════════════
       بادئة .bna- (burnout admin) — منفصلةٌ عن .bn- الخاصّة بواجهة
       المشارك، فلا تتصادم لو فُتحت الصفحتان في إطارٍ واحد.
       ══════════════════════════════════════════════════════════════════ */
    :root{
      --bg:#0f172a; --bg2:#1a2332; --card:#16202e; --line:#2a3850;
      --text:#e2e8f0; --muted:#94a3b8;
      --blue:#3b82f6; --green:#10b981; --gold:#fbbf24; --purple:#a78bfa;
      --red:#f87171; --orange:#fb923c;
      --serif:'Amiri',serif;
    }
    *{ box-sizing:border-box }
    html,body{ margin:0; padding:0 }
    body{
      background:var(--bg); color:var(--text);
      font-family:'Tajawal',sans-serif; line-height:1.8; min-height:100vh;
      -webkit-font-smoothing:antialiased;
    }
    .bna-wrap{ max-width:1400px; margin:0 auto; padding:26px 18px 80px }

    /* ─── الترويسة ─── */
    .bna-head{
      display:flex; align-items:center; gap:16px; flex-wrap:wrap;
      padding-bottom:18px; border-bottom:1px solid var(--line); margin-bottom:24px;
    }
    .bna-title{ font-family:var(--serif); font-size:24px; font-weight:700; margin:0 }
    .bna-sub{ color:var(--muted); font-size:14px }
    .bna-spacer{ flex:1 }
    .bna-field{
      background:#0d1521; border:1px solid var(--line); color:var(--text);
      border-radius:10px; padding:9px 13px; font-family:inherit; font-size:14px;
    }
    .bna-field:focus{ outline:none; border-color:var(--blue) }
    .bna-btn{
      background:transparent; border:1px solid var(--line); color:var(--text);
      border-radius:10px; padding:9px 18px; font-family:inherit; font-size:14px;
      font-weight:700; cursor:pointer; transition:border-color .2s;
    }
    .bna-btn:hover{ border-color:var(--blue) }
    .bna-btn.on{ background:var(--blue); border-color:var(--blue); color:#fff }

    /* ─── بطاقات الملخّص ─── */
    .bna-cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px; margin-bottom:26px }
    .bna-card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 20px }
    .bna-card-label{ color:var(--muted); font-size:12.5px; margin-bottom:8px }
    .bna-card-value{ font-size:26px; font-weight:700; font-family:var(--serif) }
    .bna-card-note{ color:var(--muted); font-size:12.5px; margin-top:6px }
    .bna-bars{ display:flex; gap:5px; margin-top:10px; height:7px }
    .bna-bar{ border-radius:99px }

    /* ─── ملاحظة تنظيميّة ───
       تُعرَض حين ينخفض متوسّط البيئة عند أغلب الدفعة. */
    .bna-org{
      background:rgba(251,191,36,.09); border:1px solid rgba(251,191,36,.32);
      border-radius:14px; padding:18px 20px; margin-bottom:24px;
      color:#fde9b8; font-size:15.5px; line-height:2;
    }
    .bna-org-title{ color:var(--gold); font-weight:700; font-family:var(--serif); margin-bottom:8px }

    /* ─── التنبيهات ─── */
    .bna-alerts{ margin-bottom:26px }
    .bna-alert{
      display:flex; align-items:flex-start; gap:14px;
      background:var(--card); border:1px solid var(--line); border-inline-start-width:4px;
      border-radius:12px; padding:14px 18px; margin-bottom:10px;
    }
    .bna-alert.critical{ border-inline-start-color:var(--red);    background:rgba(248,113,113,.06) }
    .bna-alert.high    { border-inline-start-color:var(--orange); background:rgba(251,146,60,.05) }
    .bna-alert.normal  { border-inline-start-color:var(--gold) }
    .bna-alert.low     { border-inline-start-color:var(--line) }
    .bna-alert-who{ font-weight:700; min-width:120px }
    .bna-alert-what{ flex:1 }
    .bna-alert-flag{ color:var(--gold); font-size:14px; font-weight:700 }
    .bna-alert-why{ color:var(--muted); font-size:13.5px; margin-top:3px }
    .bna-alert-when{ color:var(--muted); font-size:13px; white-space:nowrap }

    /* ─── الجدول ─── */
    .bna-table-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:14px; background:var(--card) }
    table{ width:100%; border-collapse:collapse; font-size:14px; min-width:1100px }
    th{
      text-align:start; color:var(--muted); font-weight:500; font-size:12.5px;
      padding:13px 12px; border-bottom:1px solid var(--line); white-space:nowrap;
      position:sticky; top:0; background:var(--card); z-index:1;
    }
    td{ padding:13px 12px; border-bottom:1px solid rgba(42,56,80,.5); vertical-align:top }
    tr:last-child td{ border-bottom:none }
    tr:hover td{ background:rgba(59,130,246,.04) }

    .bna-alias{ font-weight:700 }
    .bna-role{ color:var(--muted); font-size:12.5px }
    .bna-axis{ display:inline-block; padding:3px 11px; border-radius:99px; font-size:12.5px; font-weight:700 }
    .bna-axis.coh{ background:rgba(59,130,246,.16);  color:#93c5fd }
    .bna-axis.vit{ background:rgba(251,191,36,.16);  color:#fcd34d }
    .bna-axis.bel{ background:rgba(167,139,250,.16); color:#c4b5fd }
    .bna-order{ color:var(--muted); font-size:12px; margin-top:4px }

    .bna-state{ font-size:12.5px }
    .bna-state.exc{ color:var(--gold) }
    .bna-state.def{ color:#93c5fd }
    .bna-state.osc{ color:var(--purple); font-weight:700 }
    .bna-state.bal,.bna-state.tlt{ color:var(--green) }

    .bna-num{ font-variant-numeric:tabular-nums; direction:ltr; unicode-bidi:plaintext }
    .bna-dim{ color:var(--muted) }
    .bna-warn{ color:var(--orange) }
    .bna-bad{ color:var(--red) }
    .bna-ok{ color:var(--green) }

    .bna-lean{ display:flex; gap:3px; height:6px; width:88px; border-radius:99px; overflow:hidden; margin-bottom:5px }
    .bna-lean span{ display:block }
    .bna-lean-txt{ font-size:12px; color:var(--muted) }

    /* ★ العلامات تُبرَز بلونها لا بموقعها */
    .bna-flags{ display:flex; flex-wrap:wrap; gap:5px; max-width:230px }
    .bna-flag{ font-size:11.5px; padding:2px 8px; border-radius:99px; white-space:nowrap }
    .bna-flag.critical{ background:rgba(248,113,113,.18); color:#fca5a5 }
    .bna-flag.high    { background:rgba(251,146,60,.16);  color:#fdba74 }
    .bna-flag.normal  { background:rgba(251,191,36,.14);  color:#fcd34d }
    .bna-flag.low     { background:rgba(148,163,184,.13); color:var(--muted) }

    .bna-prog{ display:flex; gap:3px }
    .bna-dot{ width:11px; height:11px; border-radius:50%; background:#22304a }
    .bna-dot.on{ background:var(--green) }
    .bna-prog-txt{ color:var(--muted); font-size:12px; margin-top:4px }

    .bna-link{ color:var(--blue); text-decoration:none; font-size:13px }
    .bna-link:hover{ text-decoration:underline }
    .bna-key{ font-family:monospace; font-size:10.5px; color:#5b6b85; direction:ltr; display:block; margin-top:5px }

    .bna-empty{ text-align:center; color:var(--muted); padding:60px 20px }
    .bna-spinner{ width:32px; height:32px; border:3px solid #22304a; border-top-color:var(--blue); border-radius:50%; margin:0 auto 14px; animation:sp 1s linear infinite }
    @keyframes sp{ to{ transform:rotate(360deg) } }

    /* ─── التذييل: حدود الاستعمال ─── */
    .bna-foot{
      margin-top:34px; padding-top:20px; border-top:1px solid var(--line);
      color:var(--muted); font-size:13px; line-height:2;
    }
    .bna-foot-title{ color:var(--gold); font-family:var(--serif); font-size:15px; margin-bottom:10px }
    .bna-foot ul{ margin:0; padding-inline-start:20px }
    .bna-never{ color:#fca5a5; margin-top:14px }

    @media(max-width:640px){
      .bna-wrap{ padding:18px 12px 60px }
      .bna-title{ font-size:20px }
    }
  </style>
</head>
<body>
<div class="bna-wrap">

  <div class="bna-head">
    <div>
      <h1 class="bna-title">لوحة المدرّب</h1>
      <div class="bna-sub">مقياس الاحتراق المحوري · Reignite</div>
    </div>
    <div class="bna-spacer"></div>
    <input id="cohort" class="bna-field" placeholder="معرّف الدفعة (اتركه فارغًا للكلّ)" />
    <button id="reload" class="bna-btn">تحديث</button>
    <button id="live" class="bna-btn">لحظيّ</button>
  </div>

  <div id="body"><div class="bna-empty"><div class="bna-spinner"></div>جارٍ التحميل…</div></div>

  <div class="bna-foot" id="foot"></div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="../../js/firebase-config.js"></script>

<!-- البيانات والمنطق -->
<script src="burn-config.js"></script>
<script src="burn-items.js"></script>
<script src="burn-strings.js"></script>
<script src="burn-engine.js"></script>
<script src="burn-flags.js"></script>
<script src="burn-store.js"></script>

<script>
(function(){
  'use strict';

  /* ═══════════════════════════════════════════════════════════════════
     لوحة المدرّب

     ★ قراءةٌ فقط. لا تكتب في وثيقة المشارك حرفًا.

     ★ والترتيب أبجديٌّ لا بالشدّة، والعلامات تُبرَز بلونها لا بموقعها —
       فالمدرّب لا ينبغي أن يرى الناس مرتَّبين بأوجاعهم.

     ★ وما يظهر هنا لا يظهر للمشارك: الميل النوعيّ، وهويّة المكبوت،
       ودرجات النقد والفجوة، والحمل المضاعف، وعلامة ضبط الجودة.
       كلّها تُحسَب وتُخزَّن وتُعلَن في موضعها من البرنامج لا قبله.
     ═══════════════════════════════════════════════════════════════════ */

  var S = window.BURN_STRINGS, CFG = window.BURN_CONFIG;
  var rows = [], unsub = null, liveOn = false;

  function esc(s){
    return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function num(n){ return (typeof n === 'number') ? n.toFixed(1) : '—'; }
  function arabic(n){ return S.arabicNum(n); }
  function $(id){ return document.getElementById(id); }

  /* ─────────────── بناء الصفوف ─────────────── */
  function buildRow(doc){
    var meta = doc.meta || {}, prog = doc.progress || {};
    var base = {
      uid: doc._id,
      alias: meta.alias || (doc._id || '').slice(0,8),
      role: meta.role || null,
      cohort: meta.cohortId || null,
      completed: !!prog.completed,
      dosesDone: (prog.dosesCompleted || []).length,
      acuteCrisis: !!(doc.filters && doc.filters.acuteCrisis),
      deferred: !!prog.deferred,
      accuracy: (doc.verification && doc.verification.week2AccuracyScore) || null,
      pulses: (doc.weeklyPulses || []).filter(function(p){ return p.status==='completed'; }).length
    };

    if(!prog.completed || !doc.computed) return Object.assign(base, { computed:null, flags:null });

    var result = doc.computed;
    var flags  = doc.flags || window.BURN_FLAGS.evaluate(result, doc.raw || {});
    var coach  = window.BURN_FLAGS.coachRow(result, flags, { alias: base.alias, progress: prog });

    return Object.assign(base, { computed: result, flags: flags, coach: coach });
  }

  /* ─────────────── بطاقات الملخّص ─────────────── */
  function summaryCards(){
    var done = rows.filter(function(r){ return r.completed && r.coach; });
    var coachRows = done.map(function(r){ return r.coach; });
    var sum = window.BURN_FLAGS.cohortSummary(coachRows);

    function spread(obj, colors){
      var total = Object.keys(obj).reduce(function(a,k){ return a + obj[k]; }, 0) || 1;
      return '<div class="bna-bars">' + Object.keys(obj).map(function(k,i){
        var pct = Math.round((obj[k]/total)*100);
        return '<span class="bna-bar" style="flex:'+(obj[k]||0.001)+';background:'+colors[i]+'"></span>';
      }).join('') + '</div>';
    }

    var axisTxt = sum.axisSpread ? ['coh','vit','bel'].map(function(a){
      return (CFG.getAxis(a)||{}).shortName + ' ' + arabic(sum.axisSpread[a]||0);
    }).join(' · ') : '';

    var typeTxt = sum.typeSpread ? [
      'محترق ' + arabic(sum.typeSpread.burnt||0),
      'مجوّع ' + arabic(sum.typeSpread.starved||0),
      'مكبوت ' + arabic(sum.typeSpread.repressed||0),
      'مركّب ' + arabic((sum.typeSpread.composite||0)+(sum.typeSpread.unresolved||0))
    ].join(' · ') : '';

    var alertCount = rows.reduce(function(a,r){
      return a + ((r.flags && r.flags.alerts) ? r.flags.alerts.length : 0);
    }, 0);

    return '<div class="bna-cards">' +
      '<div class="bna-card">' +
        '<div class="bna-card-label">المشاركون</div>' +
        '<div class="bna-card-value">' + arabic(rows.length) + '</div>' +
        '<div class="bna-card-note">أنهوا المقياس: ' + arabic(done.length) + '</div>' +
      '</div>' +
      '<div class="bna-card">' +
        '<div class="bna-card-label">توزيع المحاور</div>' +
        '<div class="bna-card-value" style="font-size:15px;line-height:1.9">' + esc(axisTxt) + '</div>' +
        (sum.axisSpread ? spread(sum.axisSpread, ['#3b82f6','#fbbf24','#a78bfa']) : '') +
        '<div class="bna-card-note">' + esc(S.admin.cohortNotes.axisSpread) + '</div>' +
      '</div>' +
      '<div class="bna-card">' +
        '<div class="bna-card-label">الميل النوعيّ</div>' +
        '<div class="bna-card-value" style="font-size:15px;line-height:1.9">' + esc(typeTxt) + '</div>' +
        '<div class="bna-card-note">لا يُعلَن للمشارك — يُحسم في القاع</div>' +
      '</div>' +
      '<div class="bna-card">' +
        '<div class="bna-card-label">متوسّط البيئة</div>' +
        '<div class="bna-card-value ' + (sum.organizationalIssue ? 'bna-bad' : '') + '">' +
          num(sum.envAverage) + '</div>' +
        '<div class="bna-card-note">تنبيهاتٌ مفتوحة: ' + arabic(alertCount) + '</div>' +
      '</div>' +
    '</div>' +
    (sum.organizationalIssue ? organizationalNote(sum) : '');
  }

  /* ★ حين ينخفض متوسّط البيئة عند أغلب الدفعة، فالمشكلة تنظيميّةٌ لا فرديّة —
     وتُقال للشريك المؤسّسيّ بصراحة، وإلّا حمّلنا الأفراد مسؤوليّة ما ليس منهم. */
  function organizationalNote(sum){
    return '<div class="bna-org">' +
             '<div class="bna-org-title">ملاحظةٌ على الدفعة ككلّ</div>' +
             esc(sum.organizationalNote) +
           '</div>';
  }

  /* ─────────────── التنبيهات ─────────────── */
  function alertsSection(){
    var order = { critical:0, high:1, normal:2, low:3 };
    var all = [];
    rows.forEach(function(r){
      if(!r.flags) return;
      (r.flags.alerts || []).forEach(function(a){
        all.push({ alias: r.alias, uid: r.uid, id: a.id, reason: a.reason, win: a.window });
      });
      /* الأزمة الحادّة تُرفَع قبل اكتمال المقياس */
      if(r.acuteCrisis && !r.completed){
        all.push({
          alias: r.alias, uid: r.uid, id: 'FLG_ACUTE_CRISIS',
          reason: 'أعلن المشارك حدثًا كبيرًا خلال الشهر الأخير.',
          win: window.BURN_FLAGS.alertWindow('FLG_ACUTE_CRISIS')
        });
      }
    });

    if(!all.length) return '';

    all.sort(function(a,b){
      var d = order[a.win.urgency] - order[b.win.urgency];
      return d !== 0 ? d : String(a.alias).localeCompare(String(b.alias),'ar');
    });

    return '<div class="bna-alerts">' +
      '<h2 class="bna-title" style="font-size:18px;margin:0 0 14px">التنبيهات</h2>' +
      all.map(function(a){
        return '<div class="bna-alert ' + a.win.urgency + '">' +
                 '<div class="bna-alert-who">' + esc(a.alias) + '</div>' +
                 '<div class="bna-alert-what">' +
                   '<div class="bna-alert-flag">' + esc(S.admin.flagNames[a.id] || a.id) + '</div>' +
                   (a.reason ? '<div class="bna-alert-why">' + esc(a.reason) + '</div>' : '') +
                 '</div>' +
                 '<div class="bna-alert-when">' + esc(a.win.label) + '</div>' +
               '</div>';
      }).join('') +
    '</div>';
  }

  /* ─────────────── الجدول ─────────────── */
  function flagClass(id){
    var w = window.BURN_FLAGS.alertWindow(id);
    return w.urgency || 'low';
  }

  function leanBar(pct){
    if(!pct) return '<span class="bna-dim">—</span>';
    var top = ['burnt','starved','repressed'].sort(function(a,b){ return pct[b]-pct[a]; })[0];
    var names = { burnt:'محترق', starved:'مجوّع', repressed:'مكبوت' };
    return '<div class="bna-lean">' +
             '<span style="flex:'+(pct.burnt||1)+';background:#fb923c"></span>' +
             '<span style="flex:'+(pct.starved||1)+';background:#3b82f6"></span>' +
             '<span style="flex:'+(pct.repressed||1)+';background:#a78bfa"></span>' +
           '</div>' +
           '<div class="bna-lean-txt">' + names[top] + ' ' + arabic(pct[top]) + '٪</div>';
  }

  function progressDots(n){
    var total = CFG.meta.totalDoses, out = '';
    for(var i=1;i<=total;i++) out += '<span class="bna-dot' + (i<=n?' on':'') + '"></span>';
    return '<div class="bna-prog">' + out + '</div>' +
           '<div class="bna-prog-txt">' + arabic(n) + '/' + arabic(total) + '</div>';
  }

  function table(){
    if(!rows.length) return '<div class="bna-empty">لا مشاركين في هذه الدفعة بعد.</div>';

    /* ★ الترتيب أبجديّ — لا بالشدّة ولا بالعلامات */
    var sorted = rows.slice().sort(function(a,b){
      return String(a.alias).localeCompare(String(b.alias), 'ar');
    });

    var head = ['المشارك','المحور','البُعد الهدف','البيئة','الوظيفية','العافية',
                'الميل النوعيّ','العلامات','التقدّم','']
      .map(function(h){ return '<th>' + esc(h) + '</th>'; }).join('');

    var body = sorted.map(function(r){
      if(!r.completed || !r.coach){
        return '<tr>' +
          '<td><div class="bna-alias">' + esc(r.alias) + '</div>' +
              '<div class="bna-role">' + esc((CFG.getRole(r.role)||{}).name || '—') + '</div></td>' +
          '<td colspan="7" class="bna-dim">' +
            (r.deferred ? 'مؤجَّل' : 'لم يكتمل بعد') +
            (r.acuteCrisis ? ' · <span class="bna-bad">أزمةٌ حادّةٌ معلَنة</span>' : '') +
          '</td>' +
          '<td>' + progressDots(r.dosesDone) + '</td>' +
          '<td></td>' +
        '</tr>';
      }

      var c = r.coach;
      var envFlagName = { feed:'تُعطي', starve:'لا تُعطي', block:'تُعطي ولا يصل', both:'الأشدّ' };
      var accWarn = (r.accuracy !== null && r.accuracy < CFG.thresholds.display.accuracyMinScore);

      return '<tr>' +
        /* المشارك */
        '<td><div class="bna-alias">' + esc(c.alias || r.alias) + '</div>' +
            '<div class="bna-role">' + esc((CFG.getRole(c.role)||{}).name || '—') + '</div></td>' +

        /* المحور — الرئيسيّ ظاهر، والفرعيّ والمكبوت تحته */
        '<td><span class="bna-axis ' + c.axis.id + '">' + esc(c.axis.name) + '</span>' +
            '<div class="bna-order">فرعيّ: ' + esc((CFG.getAxis(c.secondary)||{}).shortName) +
            ' · مكبوت: ' + esc((CFG.getAxis(c.repressed)||{}).shortName) +
            ' (' + esc(c.repressionClass) + ')</div></td>' +

        /* البُعد الهدف */
        '<td>' + esc(c.target.name) +
            '<div class="bna-state ' + c.target.cls + '">' +
              esc(S.labels.stateNames[c.target.cls] || c.target.cls) +
              ' · شدّة <span class="bna-num">' + num(c.target.severity) + '</span></div>' +
            '<div class="bna-order">المحور: <span class="bna-num">' + num(c.axisSeverity) + '</span></div></td>' +

        /* البيئة */
        '<td><span class="bna-num ' + (c.environment.ENV <= 3.4 ? 'bna-bad' : c.environment.ENV >= 5 ? 'bna-ok' : 'bna-warn') + '">' +
              num(c.environment.ENV) + '</span>' +
            '<div class="bna-order">' + esc(envFlagName[c.environment.flag] || '—') +
            ' · RCV <span class="bna-num">' + num(c.environment.RCV) + '</span></div></td>' +

        /* الوظيفية — المؤشّرات الأربعة مستقلّةً لا مجموعة */
        '<td class="bna-num" style="font-size:12.5px;line-height:1.9">' +
            'SLF ' + num(c.functionality.SLF) + '<br>' +
            'FUE <span class="' + (c.functionality.FUE <= 3.4 ? 'bna-bad' : '') + '">' + num(c.functionality.FUE) + '</span><br>' +
            'AGN ' + num(c.functionality.AGN) + '<br>' +
            'DBL <span class="' + (c.functionality.DBL >= 5.5 ? 'bna-warn' : '') + '">' + num(c.functionality.DBL) + '</span></td>' +

        /* العافية */
        '<td class="bna-num" style="font-size:12.5px;line-height:1.9">' +
            'توقّد ' + num(c.wellbeing.vig) + '<br>' +
            'حضور ' + num(c.wellbeing.prs) + '<br>' +
            'امتلاء ' + num(c.wellbeing.ful) +
            '<div class="bna-order">نبضات: ' + arabic(r.pulses) + '</div></td>' +

        /* الميل النوعيّ */
        '<td>' + leanBar(c.typeLean.pct) +
            (c.typeLean.unresolved ? '<div class="bna-order">غير محسوم</div>' :
             c.typeLean.composite  ? '<div class="bna-order">مركّب</div>' : '') + '</td>' +

        /* ★ العلامات — تُبرَز بلونها لا بموقعها */
        '<td><div class="bna-flags">' +
              (c.flags || []).map(function(f){
                return '<span class="bna-flag ' + flagClass(f) + '">' +
                       esc(S.admin.flagNames[f] || f) + '</span>';
              }).join('') +
            '</div></td>' +

        /* التقدّم */
        '<td>' + progressDots(r.dosesDone) +
            (r.accuracy !== null ? '<div class="bna-order ' + (accWarn?'bna-warn':'') + '">دقّة: ' +
              arabic(r.accuracy) + '/١٠</div>' : '') + '</td>' +

        /* الخريطة */
        '<td><a class="bna-link" href="burn-report.html?uid=' + encodeURIComponent(r.uid) + '" target="_blank">الخريطة</a>' +
            '<span class="bna-key">' + esc(c.textKey || '') + '</span></td>' +
      '</tr>';
    }).join('');

    return '<div class="bna-table-wrap"><table>' +
             '<thead><tr>' + head + '</tr></thead>' +
             '<tbody>' + body + '</tbody>' +
           '</table></div>' +
           '<div style="color:var(--muted);font-size:12.5px;margin-top:10px">' +
             esc(S.admin.sortNote) + '</div>';
  }

  /* ─────────────── التذييل: حدود الاستعمال ─────────────── */
  function footer(){
    return '<div class="bna-foot-title">حدود الاستعمال</div>' +
      '<ul>' + CFG.usageLimits.map(function(l){ return '<li>' + esc(l) + '</li>'; }).join('') + '</ul>' +
      '<div class="bna-never">' +
        '<strong>ما لا يُقال أبدًا في التواصل:</strong><ul>' +
        S.admin.neverSay.map(function(n){ return '<li>' + esc(n) + '</li>'; }).join('') +
        '</ul></div>';
  }

  /* ─────────────── الرسم ─────────────── */
  function render(){
    $('body').innerHTML = summaryCards() + alertsSection() + table();
    $('foot').innerHTML = footer();
  }

  /* ─────────────── التحميل ─────────────── */
  async function load(){
    $('body').innerHTML = '<div class="bna-empty"><div class="bna-spinner"></div>جارٍ التحميل…</div>';
    var cohort = $('cohort').value.trim() || null;
    var docs = await window.BURN_STORE.listCohort(cohort, 300);
    rows = docs.map(buildRow);
    render();
  }

  function toggleLive(){
    var cohort = $('cohort').value.trim() || null;
    if(liveOn){
      if(unsub) unsub();
      unsub = null; liveOn = false;
      $('live').classList.remove('on');
      return;
    }
    unsub = window.BURN_STORE.watchCohort(cohort, function(docs){
      rows = docs.map(buildRow);
      render();
    });
    liveOn = true;
    $('live').classList.add('on');
  }

  /* ─────────────── الإقلاع ─────────────── */
  function run(){
    var missing = [];
    ['BURN_CONFIG','BURN_STRINGS','BURN_ENGINE','BURN_FLAGS','BURN_STORE']
      .forEach(function(n){ if(!window[n]) missing.push(n); });
    if(missing.length){
      $('body').innerHTML = '<pre dir="ltr" style="color:#f87171">Missing: ' + missing.join(', ') + '</pre>';
      return;
    }
    var q = new URLSearchParams(location.search);
    if(q.get('cohort')) $('cohort').value = q.get('cohort');
    $('reload').addEventListener('click', load);
    $('live').addEventListener('click', toggleLive);
    $('cohort').addEventListener('keydown', function(e){ if(e.key === 'Enter') load(); });
    load();
  }

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run);
  else run();

})();
</script>
</body>
</html>
