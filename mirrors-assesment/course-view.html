<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مقياس الفؤاد</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- خطوط أدبيّة للعناوين والوقفات (إضافة غير كاسرة) -->
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0f172a; --bg2:#1a2332; --blue:#3b82f6; --green:#10b981;
      --gold:#fbbf24; --purple:#a78bfa; --text:#e2e8f0; --muted:#94a3b8;
      --line:#2a3850; --card:#16202e;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      background:radial-gradient(1200px 620px at 50% -12%, #1a2332 0%, #0f172a 62%);
      color:var(--text); font-family:'Tajawal',sans-serif; min-height:100vh;
      -webkit-font-smoothing:antialiased; line-height:1.9;
    }
    #app{ max-width:680px; margin:0 auto; padding:42px 18px 90px; }
    .card{
      background:linear-gradient(180deg, rgba(22,32,46,.92), rgba(15,23,42,.72));
      border:1px solid var(--line); border-radius:18px; padding:32px 28px;
      box-shadow:0 22px 54px rgba(0,0,0,.38); animation:fade .5s ease;
    }
    @keyframes fade{ from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }
    .centered{ text-align:center; }
    .mirror-tag{ color:var(--gold); font-size:14px; letter-spacing:.5px; margin-bottom:18px; opacity:.92; }
    .core-question{ font-size:26px; font-weight:700; line-height:1.7; margin-bottom:22px; }
    .reminder{ color:var(--muted); font-size:15px; margin-bottom:28px; }
    .btn{ border:none; cursor:pointer; font-family:inherit; font-size:16px; font-weight:700;
      padding:13px 30px; border-radius:12px; transition:transform .15s, box-shadow .15s, background .2s; }
    .btn.primary{ background:var(--blue); color:#fff; box-shadow:0 8px 22px rgba(59,130,246,.30); }
    .btn.primary:hover{ transform:translateY(-2px); }
    .btn.ghost{ background:transparent; color:var(--text); border:1px solid var(--line); }
    .btn.ghost:hover{ border-color:var(--blue); }
    .progress-row{ display:flex; align-items:center; gap:14px; margin-bottom:26px; }
    .progress-label{ color:var(--muted); font-size:13px; white-space:nowrap; }
    .progress-bar{ flex:1; height:6px; background:#22304a; border-radius:99px; overflow:hidden; }
    .progress-fill{ height:100%; background:linear-gradient(90deg,var(--blue),var(--green)); transition:width .4s; }
    .question-text, .statement-text{ font-size:21px; font-weight:700; line-height:1.7; margin-bottom:26px; }
    .options{ display:flex; flex-direction:column; gap:12px; }
    .option{ display:flex; gap:14px; align-items:flex-start; text-align:right;
      background:#101a28; border:1px solid var(--line); color:var(--text);
      padding:16px 18px; border-radius:14px; cursor:pointer; font-family:inherit;
      font-size:16px; line-height:1.78; transition:border-color .2s, background .2s, transform .12s; }
    .option:hover{ border-color:var(--blue); background:#13202f; transform:translateY(-1px); }
    .opt-letter{ flex:0 0 32px; height:32px; border-radius:50%; background:#1c2a40; color:var(--gold);
      display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; }
    .opt-text{ flex:1; }
    .likert-scale{ display:flex; gap:10px; justify-content:center; direction:rtl; flex-wrap:wrap; }
    .likert{ width:46px; height:46px; border-radius:50%; border:1px solid var(--line);
      background:#101a28; color:var(--text); font-family:inherit; font-size:16px; font-weight:700;
      cursor:pointer; transition:all .15s; }
    .likert:hover{ border-color:var(--green); background:#13202f; transform:translateY(-2px); color:var(--green); }
    .likert-labels{ display:flex; justify-content:space-between; color:var(--muted); font-size:12px; margin-top:8px; }
    .section-title{ color:var(--gold); font-size:15px; margin-bottom:18px; }
    .dominant{ font-size:19px; margin-bottom:22px; }
    .dominant strong{ color:var(--green); }
    .ranking{ display:flex; flex-direction:column; gap:12px; margin-bottom:28px; }
    .rank-row{ display:flex; align-items:center; gap:12px; }
    .rank-row.top .rank-axis{ color:var(--gold); }
    .rank-axis{ flex:0 0 134px; font-size:14px; }
    .type-badge{ display:inline-block; min-width:20px; padding:1px 6px; border-radius:6px;
      background:#1c2a40; color:var(--muted); font-size:12px; margin-inline-start:5px; }
    .rank-bar{ flex:1; height:8px; background:#22304a; border-radius:99px; overflow:hidden; }
    .rank-fill{ height:100%; background:var(--blue); }
    .rank-row.top .rank-fill{ background:linear-gradient(90deg,var(--gold),var(--green)); }
    .rank-pct{ flex:0 0 46px; text-align:left; font-size:14px; color:var(--muted); }
    .edu-block{ margin-bottom:22px; }
    .edu-block.door{ border-inline-start:3px solid var(--blue); padding-inline-start:16px; }
    .edu-block p{ margin:0 0 14px; font-size:17px; line-height:2; }
    .edu-after{ color:#cbd5e1; }
    .lead{ color:#cbd5e1; font-size:16px; margin:0 0 20px; line-height:1.9; }
    .edu-axis-name{ color:var(--gold); font-weight:700; font-size:18px; margin-bottom:12px; }
    .edu-intro{ font-size:17px; line-height:2; }
    .edu-rooting{ border-top:1px dashed var(--line); padding-top:14px; margin-top:8px; }
    .edu-rooting-tag{ color:var(--green); font-size:13px; margin-bottom:8px; }
    .edu-rooting p{ color:var(--muted); font-size:16px; margin:0; line-height:2; }
    .edu-block.weak p{ color:#cbd5e1; }
    .spectrum-result{ border:1px solid var(--line); border-inline-start-width:4px; border-radius:14px;
      padding:18px 20px; margin-bottom:18px; background:#101a28; }
    .sr-axis{ font-weight:700; font-size:16px; margin-bottom:10px; }
    .sr-text{ margin:0; font-size:17px; line-height:2; color:#cbd5e1; }
    .rest-check{ font-size:46px; color:var(--green); margin-bottom:14px; }
    .rest-line{ font-size:20px; font-weight:700; margin-bottom:18px; }
    .rest-line.warn{ color:var(--gold); }
    .done-note{ color:var(--muted); margin:10px 0 6px; }
    .saving{ color:var(--muted); margin-top:14px; }
    .spinner{ width:34px; height:34px; border:3px solid #22304a; border-top-color:var(--blue);
      border-radius:50%; margin:0 auto; animation:spin 1s linear infinite; }
    @keyframes spin{ to{ transform:rotate(360deg) } }
    .pause{ text-align:center; }
    .pause-verse{ color:var(--gold); font-size:22px; line-height:2; margin-bottom:16px; }
    .pause-note{ color:var(--muted); font-size:16px; margin-bottom:26px; line-height:1.9; }
    .rest .btn, .centered .btn{ margin-top:6px; }

    /* ───── شاشة التقرير الذاتيّ المتكامل ───── */
    .card.report{ padding:30px 26px; }
    .report-section{ margin-bottom:30px; padding-bottom:24px; border-bottom:1px solid var(--line); }
    .report-section:last-child{ border-bottom:none; margin-bottom:8px; }
    .report-ground{ background:rgba(167,139,250,.06); border:1px solid rgba(167,139,250,.22);
      border-radius:14px; padding:22px 22px; margin-bottom:30px; }
    .report-ground-title{ color:var(--purple); font-size:15px; letter-spacing:.5px; margin-bottom:12px; }
    .report-ground p{ margin:0; font-size:17px; line-height:2; color:#cbd5e1; }
    .report-partial{ margin-top:14px !important; color:var(--gold) !important; font-size:15px !important; }
    .report-h{ color:var(--gold); font-size:18px; font-weight:700; margin-bottom:16px; }
    .report-p{ font-size:17px; line-height:2; color:#cbd5e1; margin:0 0 12px; }
    .report-mirror{ margin-bottom:22px; }
    .report-mirror-name{ color:var(--text); font-size:16px; font-weight:700; margin-bottom:12px;
      padding-inline-start:10px; border-inline-start:3px solid var(--line); }
    .report-axis{ border:1px solid var(--line); border-inline-start-width:4px; border-radius:12px;
      padding:16px 18px; margin-bottom:14px; background:#101a28; }
    .report-axis-name{ font-weight:700; font-size:15px; margin-bottom:10px; }
    .report-dom-tag{ display:inline-block; font-size:12px; color:var(--muted); background:#1c2a40;
      padding:1px 8px; border-radius:6px; margin-inline-start:6px; font-weight:400; }
    .report-axis-text{ margin:0; font-size:16px; line-height:2; color:#cbd5e1; }
    .report-map-line{ font-size:15px; line-height:1.9; color:var(--muted); margin:0 0 8px; }
    .report-map-line span{ font-weight:700; }
    .report-flags{ }
    .report-flag{ display:flex; align-items:center; gap:12px; flex-wrap:wrap;
      background:rgba(167,139,250,.06); border:1px solid rgba(167,139,250,.2);
      border-radius:10px; padding:12px 16px; margin-bottom:10px; }
    .report-flag-axis{ color:var(--purple); font-weight:700; font-size:15px; }
    .report-flag-note{ color:var(--muted); font-size:14px; }
    .report-actions{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:24px; }

    /* طباعة نظيفة للتقرير */
    @media print{
      body{ background:#fff; color:#1a1a1a; }
      #app{ max-width:none; padding:0; }
      .card.report{ background:#fff; border:none; box-shadow:none; }
      .report-section{ border-color:#ddd; }
      .report-axis{ background:#f7f7f7; border-color:#ddd; }
      .report-ground{ background:#f4f1fb; }
      .report-actions{ display:none; }
      .report-h, .report-axis-name, .report-ground-title{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    }

    @media(max-width:520px){
      #app{ padding:28px 14px 70px; }
      .card{ padding:24px 18px; } .core-question{ font-size:22px; }
      .question-text,.statement-text{ font-size:19px; }
      .rank-axis{ flex-basis:96px; } .likert{ width:40px; height:40px; }
      .card.report{ padding:22px 16px; }
      .report-h{ font-size:16px; } .report-axis-text{ font-size:15px; }
    }

    /* ════════════════════════════════════════════════════════════════════
       ترقية طبقة العرض — الرحلة لا اللوحة (إضافة غير كاسرة، تبني فوق المتغيّرات)
       النخلة · البيت · المراجعة · الاكتمال · شريط الطيف التوقيعيّ · خريطة التحرّك
       ════════════════════════════════════════════════════════════════════ */
    :root{
      --palm-trunk-1:#3a4f44; --palm-trunk-2:#5c7459;
      --palm-frond:#5c7459; --done-neutral:#94a3b8;
      --serif:'Amiri','Scheherazade New',serif;
    }

    /* عناوين بخطّ أدبيّ + تباعدٌ أوسع (الصقل التيبوغرافيّ) */
    .core-question,.section-title,.report-h,.report-ground-title,.pause-verse,
    .home-greet,.completion-line,.edu-axis-name,.sr-axis{
      font-family:var(--serif); letter-spacing:.3px;
    }
    .core-question,.home-greet,.completion-line{ line-height:1.8; }

    /* انتقالات fade أنعم للشاشات الجديدة */
    .card.home,.card.review,.card.completion-card{ animation:fadeSlow .7s ease; }
    @keyframes fadeSlow{ from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none} }
    .layers-svg{ animation:layersIn .9s ease; }
    @keyframes layersIn{ from{opacity:0} to{opacity:1} }

    /* الوقفة القرآنيّة: سكونٌ ومساحة (تنفّس لا ازدحام) */
    .card.pause{ padding:64px 32px; }
    .pause-verse{ font-size:26px; line-height:2.4; }
    .pause-note{ margin:40px 0 30px; }

    /* ───── شريط الطيف التوقيعيّ ───── */
    .spectrum-bar{ direction:ltr; margin:14px 0 6px; }
    .sb-track{ position:relative; display:flex; height:12px; border-radius:99px; overflow:hidden; background:#101a28; }
    .sb-zone{ flex:1; height:100%; }
    .sb-deficit{ background:rgba(59,130,246,.30); }
    .sb-balance{ background:rgba(16,185,129,.30); }
    .sb-excess{ background:rgba(251,191,36,.32); }
    .sb-dot{ position:absolute; top:50%; width:16px; height:16px; border-radius:50%;
      transform:translate(-50%,-50%); box-shadow:0 0 0 3px rgba(15,23,42,.65); }
    .sb-band{ position:absolute; top:50%; inset-inline-start:18%; width:64%; height:14px;
      transform:translateY(-50%); border-radius:99px; background:rgba(167,139,250,.32);
      box-shadow:inset 0 0 0 1px rgba(167,139,250,.4); }
    .sb-labels{ direction:rtl; display:flex; justify-content:space-between;
      color:var(--muted); font-size:12px; margin-top:8px; }
    .sb-suffix{ direction:rtl; color:var(--muted); font-size:12px; margin-top:6px; }
    .sb-whisper{ direction:rtl; color:var(--purple); font-size:13px; margin-top:8px; }

    /* ───── النخلة / المسار الصاعد ───── */
    .layers-wrap{ max-width:420px; margin:8px auto 4px; }
    .layers-svg{ width:100%; height:auto; display:block; }
    .layer-name{ font-family:var(--serif); fill:var(--text); font-size:16px; direction:rtl; }
    .layer-status{ font-size:12px; direction:rtl; }
    .layer-surface{ fill:var(--gold); font-size:12px; opacity:.8; direction:rtl; }
    .layer-hit{ transition:opacity .2s; }
    .layer-hit:hover{ opacity:.10; fill:var(--gold); }

    /* ───── شاشة البيت ───── */
    .home-head{ text-align:center; margin-bottom:8px; }
    .home-greet{ font-size:24px; font-weight:700; margin-bottom:8px; }
    .home-sub{ color:var(--muted); font-size:15px; line-height:1.9; }
    .home-progress{ margin:22px 0 6px; }
    .home-progress .progress-bar{ height:6px; }
    .home-progress-label{ color:var(--muted); font-size:13px; text-align:center; margin-top:10px; }
    .home-actions{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:24px; }
    .home-hint{ color:var(--muted); font-size:13px; text-align:center; margin-top:16px; opacity:.85; }

    /* ───── شاشة المراجعة ───── */
    .card.review .mirror-tag{ margin-bottom:14px; }
    .review-note{ color:var(--muted); font-size:14px; margin-bottom:22px; line-height:1.9; }
    .review-spectrum{ border:1px solid var(--line); border-radius:14px;
      padding:18px 20px; margin-bottom:18px; background:#101a28; }
    .review-spectrum .sr-axis{ font-weight:700; font-size:16px; margin-bottom:6px; }

    /* ───── شاشة الاكتمال ───── */
    .card.completion-card{ text-align:center; }
    .completion .layers-complete{ margin-bottom:8px; }
    .completion-line{ font-size:21px; font-weight:700; line-height:1.9; margin:14px 0 10px; }
    .completion-sub{ color:var(--muted); font-size:15px; margin-bottom:28px; line-height:1.9; }

    /* ───── خريطة التحرّك البصريّة (داخل التقرير) ───── */
    .movemap{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:6px 0 18px; }
    .mm-cell{ width:84px; text-align:center; }
    .mm-cell.is-empty{ opacity:.5; }
    .mm-mini{ direction:ltr; position:relative; display:flex; height:8px; border-radius:99px; overflow:hidden; background:#101a28; }
    .mm-z{ flex:1; height:100%; }
    .mm-d{ background:rgba(59,130,246,.30); }
    .mm-b{ background:rgba(16,185,129,.30); }
    .mm-e{ background:rgba(251,191,36,.32); }
    .mm-dot{ position:absolute; top:50%; width:10px; height:10px; border-radius:50%;
      transform:translate(-50%,-50%); box-shadow:0 0 0 2px rgba(15,23,42,.65); }
    .mm-band{ position:absolute; top:50%; inset-inline-start:18%; width:64%; height:10px;
      transform:translateY(-50%); border-radius:99px; background:rgba(167,139,250,.32); }
    .mm-empty{ position:absolute; top:50%; inset-inline-start:50%; width:6px; height:6px; border-radius:50%;
      transform:translate(-50%,-50%); background:var(--line); }
    .mm-name{ direction:rtl; color:var(--muted); font-size:12px; margin-top:8px; line-height:1.5; }
    .movemap-appendix{ margin-top:6px; }

    @media(max-width:520px){
      .layers-wrap{ max-width:100%; }
      .home-greet{ font-size:21px; }
      .completion-line{ font-size:19px; }
      .pause-verse{ font-size:22px; line-height:2.2; }
      .card.pause{ padding:44px 20px; }
      .mm-cell{ width:64px; }
    }

        /* ───── id-option: حاوية السؤال مع الـ likert ───── */

    .id-options{ display:flex; flex-direction:column; gap:22px; margin-bottom:24px; }
    .id-option{ background:#101a28; border:1px solid var(--line); border-radius:14px; padding:18px 18px 14px; }
    .id-option-text{ display:flex; gap:12px; align-items:flex-start; font-size:17px; line-height:1.85; margin-bottom:16px; }
    .id-option-text .opt-letter{ flex:0 0 32px; height:32px; border-radius:50%; background:#1c2a40;
      color:var(--gold); display:flex; align-items:center; justify-content:center; font-weight:700; }
    .id-option .likert-scale{ justify-content:flex-start; }
    @media(max-width:520px){ .id-option .likert{ width:38px; height:38px; } }

    .id-likert.selected{
      background:linear-gradient(135deg, var(--blue), var(--green));
      border-color:var(--blue); color:#fff; transform:scale(1.12);
    }
    

    /* ═══ شاشة الترحيب ═══ */
    .welcome-title{ font-family:var(--serif); font-size:26px; font-weight:700; color:var(--gold); margin-bottom:18px; line-height:1.7; }
    .welcome-p{ color:var(--text); font-size:16px; line-height:2; margin:0 0 14px; }
    .welcome-blocks{ margin:20px 0; display:flex; flex-direction:column; gap:12px; }
    .welcome-block{ background:rgba(59,130,246,.06); border:1px solid var(--line); border-radius:12px; padding:14px 16px; line-height:1.95; }
    .welcome-h{ color:var(--gold); font-weight:700; }
    .welcome-bp{ color:var(--text); }
    .gender-q{ margin:22px 0 26px; }
    .gender-label{ color:var(--muted); font-size:14px; margin-bottom:10px; }
    .gender-opts{ display:flex; gap:10px; flex-wrap:wrap; }
    .gender-opt{ display:flex; align-items:center; gap:7px; background:var(--card); border:1px solid var(--line);
      border-radius:10px; padding:9px 14px; cursor:pointer; font-size:14px; transition:border-color .2s; }
    .gender-opt:hover{ border-color:var(--blue); }
    .gender-opt input{ accent-color:var(--blue); }

    /* ═══ رسالة العودة وجملة التأسيس ═══ */
    .resume-card .lead{ margin:14px 0 6px; }
    .founding-line{ color:var(--muted); font-size:15px; line-height:1.95; margin:0 0 16px; }
    .subtle-lead{ font-size:14px; opacity:.9; margin-top:12px; }

    /* ═══ رحلة التقرير (المحطات السبع) ═══ */
    .jr .jr-head{ text-align:center; margin-bottom:22px; }
    .jr-station-name{ font-family:var(--serif); font-size:23px; font-weight:700; color:var(--gold); margin-bottom:6px; }
    .jr-progress{ color:var(--muted); font-size:13px; margin-bottom:12px; }
    .jr-dots{ display:flex; justify-content:center; gap:8px; }
    .jr-dot{ width:8px; height:8px; border-radius:50%; background:var(--line); transition:background .3s; }
    .jr-dot.done{ background:var(--muted); }
    .jr-dot.on{ background:var(--gold); }
    .jr-body{ margin-bottom:24px; }
    .jr-p{ color:var(--text); font-size:16px; line-height:2.05; margin:0 0 16px; }
    .jr-note{ color:var(--muted); font-size:14px; line-height:1.9; margin:0 0 14px; }
    .jr-ground{ background:rgba(167,139,250,.07); border:1px solid rgba(167,139,250,.25);
      border-radius:14px; padding:20px 22px; margin-bottom:14px; }
    .jr-ground p{ margin:0; color:var(--text); font-size:16px; line-height:2.05; }
    .jr-portrait{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px 22px; margin-bottom:14px; }
    .jr-type-name{ font-family:var(--serif); font-size:22px; font-weight:700; color:var(--gold); margin-bottom:12px; }
    .jr-motive{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:12px; }
    .jr-motive-name{ color:var(--gold); font-weight:700; font-size:17px; margin-bottom:4px; }
    .jr-motive-desc{ color:var(--muted); font-size:13.5px; margin-bottom:8px; }
    .jr-motive-face{ color:var(--text); font-size:15px; line-height:1.9; }
    .jr-motive-note{ color:var(--muted); font-size:13.5px; }
    .jr-mirror{ margin-bottom:26px; }
    .jr-mirror-name{ font-family:var(--serif); color:var(--gold); font-size:18px; font-weight:700; margin-bottom:6px; }
    .jr-mirror-intro{ color:var(--muted); font-size:14.5px; line-height:1.95; margin:0 0 12px; }
    .jr-axis{ border-inline-start:3px solid var(--line); padding:4px 16px 4px 0; margin-bottom:16px; }
    .jr-axis-name{ font-weight:700; font-size:15px; margin-bottom:8px; }
    .jr-dom-tag{ background:rgba(251,191,36,.14); color:var(--gold); font-size:11.5px; font-weight:700;
      border-radius:8px; padding:2px 8px; margin-inline-start:6px; }
    .jr-axis-text{ color:var(--text); font-size:15px; line-height:2; margin:10px 0 0; }
    .jr-flag{ color:var(--purple); font-size:14px; line-height:1.9; margin:10px 0 0;
      background:rgba(167,139,250,.07); border-radius:10px; padding:10px 14px; }
    .jr-experiment{ background:rgba(16,185,129,.07); border:1px solid rgba(16,185,129,.25);
      border-radius:14px; padding:18px 20px; margin-bottom:14px; }
    .jr-experiment p{ margin:0; color:var(--text); font-size:15.5px; line-height:2; }
    .jr-nav{ display:flex; gap:12px; justify-content:center; }
    .jr-final{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:14px; }
    .jr-full-section{ margin-bottom:34px; padding-bottom:24px; border-bottom:1px solid var(--line); }
    .jr-full-section:last-of-type{ border-bottom:none; }
    .jr-full .jr-station-name{ text-align:center; margin-bottom:16px; }
    @media print{
      .jr-nav, .jr-final, .no-print{ display:none !important; }
      .jr-ground, .jr-portrait, .jr-motive, .jr-experiment{ border-color:#ccc; }
    }

    /* ═══ الوقفات بأنواعها ═══ */
    .pause{ text-align:center; }
    .pause-line{ font-family:var(--serif); font-size:19px; line-height:2.1; color:var(--text);
      max-width:520px; margin:18px auto 30px; }
    .pause-wisdom{ color:var(--gold); }
    .pause-question{ color:var(--purple); }
    .pause-breath{ font-family:var(--serif); font-size:21px; line-height:2.2; color:var(--muted);
      padding:52px 0 58px; max-width:420px; margin:0 auto; }
    .pause-kind-breath{ background:linear-gradient(180deg, rgba(22,32,46,.55), rgba(15,23,42,.45)); }
  </style>
