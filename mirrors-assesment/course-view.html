<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مقياس الفؤاد</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0f172a; --bg2:#1a2332; --blue:#3b82f6; --green:#10b981;
      --gold:#fbbf24; --purple:#a78bfa; --text:#e2e8f0; --muted:#94a3b8;
      --line:#2a3850; --card:#16202e;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      background:radial-gradient(1200px 620px at 50% -12%, #1a2332 0%, #0f172a 62%);
      color:var(--text); font-family:'Tajawal',sans-serif; min-height:100vh;
      -webkit-font-smoothing:antialiased; line-height:1.9;
    }
    #app{ max-width:680px; margin:0 auto; padding:42px 18px 90px; }
    .card{
      background:linear-gradient(180deg, rgba(22,32,46,.92), rgba(15,23,42,.72));
      border:1px solid var(--line); border-radius:18px; padding:32px 28px;
      box-shadow:0 22px 54px rgba(0,0,0,.38); animation:fade .5s ease;
    }
    @keyframes fade{ from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }
    .centered{ text-align:center; }
    .mirror-tag{ color:var(--gold); font-size:14px; letter-spacing:.5px; margin-bottom:18px; opacity:.92; }
    .core-question{ font-size:26px; font-weight:700; line-height:1.7; margin-bottom:22px; }
    .reminder{ color:var(--muted); font-size:15px; margin-bottom:28px; }
    .btn{ border:none; cursor:pointer; font-family:inherit; font-size:16px; font-weight:700;
      padding:13px 30px; border-radius:12px; transition:transform .15s, box-shadow .15s, background .2s; }
    .btn.primary{ background:var(--blue); color:#fff; box-shadow:0 8px 22px rgba(59,130,246,.30); }
    .btn.primary:hover{ transform:translateY(-2px); }
    .btn.ghost{ background:transparent; color:var(--text); border:1px solid var(--line); }
    .btn.ghost:hover{ border-color:var(--blue); }
    .progress-row{ display:flex; align-items:center; gap:14px; margin-bottom:26px; }
    .progress-label{ color:var(--muted); font-size:13px; white-space:nowrap; }
    .progress-bar{ flex:1; height:6px; background:#22304a; border-radius:99px; overflow:hidden; }
    .progress-fill{ height:100%; background:linear-gradient(90deg,var(--blue),var(--green)); transition:width .4s; }
    .question-text, .statement-text{ font-size:21px; font-weight:700; line-height:1.7; margin-bottom:26px; }
    .options{ display:flex; flex-direction:column; gap:12px; }
    .option{ display:flex; gap:14px; align-items:flex-start; text-align:right;
      background:#101a28; border:1px solid var(--line); color:var(--text);
      padding:16px 18px; border-radius:14px; cursor:pointer; font-family:inherit;
      font-size:16px; line-height:1.78; transition:border-color .2s, background .2s, transform .12s; }
    .option:hover{ border-color:var(--blue); background:#13202f; transform:translateY(-1px); }
    .opt-letter{ flex:0 0 32px; height:32px; border-radius:50%; background:#1c2a40; color:var(--gold);
      display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; }
    .opt-text{ flex:1; }
    .likert-scale{ display:flex; gap:10px; justify-content:center; direction:rtl; flex-wrap:wrap; }
    .likert{ width:46px; height:46px; border-radius:50%; border:1px solid var(--line);
      background:#101a28; color:var(--text); font-family:inherit; font-size:16px; font-weight:700;
      cursor:pointer; transition:all .15s; }
    .likert:hover{ border-color:var(--green); background:#13202f; transform:translateY(-2px); color:var(--green); }
    .likert-labels{ display:flex; justify-content:space-between; color:var(--muted); font-size:12px; margin-top:8px; }
    .section-title{ color:var(--gold); font-size:15px; margin-bottom:18px; }
    .dominant{ font-size:19px; margin-bottom:22px; }
    .dominant strong{ color:var(--green); }
    .ranking{ display:flex; flex-direction:column; gap:12px; margin-bottom:28px; }
    .rank-row{ display:flex; align-items:center; gap:12px; }
    .rank-row.top .rank-axis{ color:var(--gold); }
    .rank-axis{ flex:0 0 134px; font-size:14px; }
    .type-badge{ display:inline-block; min-width:20px; padding:1px 6px; border-radius:6px;
      background:#1c2a40; color:var(--muted); font-size:12px; margin-inline-start:5px; }
    .rank-bar{ flex:1; height:8px; background:#22304a; border-radius:99px; overflow:hidden; }
    .rank-fill{ height:100%; background:var(--blue); }
    .rank-row.top .rank-fill{ background:linear-gradient(90deg,var(--gold),var(--green)); }
    .rank-pct{ flex:0 0 46px; text-align:left; font-size:14px; color:var(--muted); }
    .edu-block{ margin-bottom:22px; }
    .edu-block.door{ border-inline-start:3px solid var(--blue); padding-inline-start:16px; }
    .edu-block p{ margin:0 0 14px; font-size:17px; line-height:2; }
    .edu-after{ color:#cbd5e1; }
    .edu-rooting{ color:var(--muted); font-size:16px; border-top:1px dashed var(--line); padding-top:14px; }
    .edu-block.weak p{ color:#cbd5e1; }
    .spectrum-result{ border:1px solid var(--line); border-inline-start-width:4px; border-radius:14px;
      padding:18px 20px; margin-bottom:18px; background:#101a28; }
    .sr-axis{ font-weight:700; font-size:16px; margin-bottom:10px; }
    .sr-text{ margin:0; font-size:17px; line-height:2; color:#cbd5e1; }
    .rest-check{ font-size:46px; color:var(--green); margin-bottom:14px; }
    .rest-line{ font-size:20px; font-weight:700; margin-bottom:18px; }
    .rest-line.warn{ color:var(--gold); }
    .done-note{ color:var(--muted); margin:10px 0 6px; }
    .saving{ color:var(--muted); margin-top:14px; }
    .spinner{ width:34px; height:34px; border:3px solid #22304a; border-top-color:var(--blue);
      border-radius:50%; margin:0 auto; animation:spin 1s linear infinite; }
    @keyframes spin{ to{ transform:rotate(360deg) } }
    .pause{ text-align:center; }
    .pause-verse{ color:var(--gold); font-size:22px; line-height:2; margin-bottom:16px; }
    .pause-note{ color:var(--muted); font-size:16px; margin-bottom:26px; line-height:1.9; }
    .rest .btn, .centered .btn{ margin-top:6px; }
    @media(max-width:520px){
      #app{ padding:28px 14px 70px; }
      .card{ padding:24px 18px; } .core-question{ font-size:22px; }
      .question-text,.statement-text{ font-size:19px; }
      .rank-axis{ flex-basis:96px; } .likert{ width:40px; height:40px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <!-- ١) Firebase SDK 8.10.1 (app + auth + firestore) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <!-- ٢) تهيئة Firebase
       ضع هنا قيم مشروعك الحقيقيّة (نفس القيم المستعملة في باقي صفحات المشروع).
       أو احذف هذا البلوك بالكامل وحمّل مكانه ملفّك firebase-config.js إن كان
       يضبط window.db ويطلق حدث firebaseReady. -->
  <script src="../js/firebase-config.js"></script>

  <!-- ٣) ملفّات المحتوى (بيانات صرفة) ثمّ المحرّك -->
  <script src="mirrors-config.js"></script>
  <script src="identification-questions.js"></script>
  <script src="spectrum-questions.js"></script>
  <script src="educational-content.js"></script>
  <script src="reflection-pauses.js"></script>
  <script src="calc-engine.js"></script>

  <!-- ٤) الجسر ثمّ المخزن ثمّ التطبيق -->
  <script src="fouad-bridge.js"></script>
  <script src="fouad-store.js"></script>
  <script src="fouad-app.js"></script>

  <!-- ٥) تشغيل التطبيق بعد تحميل كل الطبقات -->
  <script>
    (function(){
      function run(){ if(window.FOUAD_APP) window.FOUAD_APP.init(); }
      if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run);
      else run();
    })();
  </script>
</body>
</html>
