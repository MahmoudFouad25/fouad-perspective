<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تقريرك المكتوب — مقياس الفؤاد</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet" />

<style>
  :root{
    --bg:#0f172a; --bg2:#1a2332; --card:#16202e; --line:#2a3850;
    --text:#e2e8f0; --muted:#94a3b8;
    --blue:#3b82f6; --green:#10b981; --gold:#fbbf24; --purple:#a78bfa;
    --serif:'Amiri', serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 620px at 50% -12%, #1a2332 0%, #0f172a 62%);
    color:var(--text); font-family:'Tajawal',sans-serif; min-height:100vh;
    -webkit-font-smoothing:antialiased; line-height:1.9;
  }
  #app{ max-width:720px; margin:0 auto; padding:40px 18px 90px; }

  .spinner{ width:34px;height:34px;border-radius:50%;
    border:3px solid rgba(148,163,184,.25); border-top-color:var(--blue);
    animation:spin .8s linear infinite; margin:0 auto 14px; }
  @keyframes spin{ to{ transform:rotate(360deg) } }
  .state{ text-align:center; color:var(--muted); padding:80px 16px; line-height:2.1; }
  .state .big{ font-size:38px; margin-bottom:14px; }

  .head{ text-align:center; margin-bottom:34px; }
  .head .kicker{ color:var(--gold); font-size:13px; letter-spacing:.6px; margin-bottom:10px; }
  .head h1{ font-family:var(--serif); font-size:31px; font-weight:700; margin:0 0 10px; line-height:1.6; }
  .head .sub{ color:var(--muted); font-size:14px; }

  .group{ margin:38px 0 18px; display:flex; align-items:center; gap:12px; }
  .group .ln{ flex:1; height:1px; background:linear-gradient(90deg, transparent, var(--line), transparent); }
  .group .tx{ color:var(--gold); font-size:14px; font-weight:700; white-space:nowrap; }

  .sec{
    background:linear-gradient(180deg, rgba(22,32,46,.92), rgba(15,23,42,.72));
    border:1px solid var(--line); border-radius:18px; padding:28px 26px; margin-bottom:16px;
    box-shadow:0 18px 44px rgba(0,0,0,.30);
  }
  .sec .tag{ display:inline-block; font-size:11.5px; font-weight:700; padding:3px 10px;
    border-radius:8px; background:rgba(148,163,184,.12); color:var(--muted); margin-bottom:12px; }
  .sec.portrait .tag{ background:rgba(167,139,250,.14); color:var(--purple); }
  .sec.session  .tag{ background:rgba(59,130,246,.14);  color:var(--blue); }
  .sec.homework .tag{ background:rgba(16,185,129,.14);  color:var(--green); }
  .sec.action_plan .tag{ background:rgba(251,191,36,.14); color:var(--gold); }
  .sec.insight  .tag{ background:rgba(167,139,250,.14); color:var(--purple); }
  .sec h2{ font-family:var(--serif); font-size:23px; font-weight:700; margin:0 0 16px; line-height:1.7; }
  .sec.portrait{ border-inline-start:3px solid var(--purple); }
  .sec.homework{ border-inline-start:3px solid var(--green); }
  .sec.action_plan{ border-inline-start:3px solid var(--gold); }
  .sec p{ margin:0 0 16px; font-size:17px; line-height:2.15; }
  .sec p:last-child{ margin-bottom:0; }

  .foot{ margin-top:44px; text-align:center; color:var(--muted); font-size:13px; line-height:2; }
  .btn{ border:1px solid var(--line); background:transparent; color:var(--text);
    font-family:inherit; font-size:14px; font-weight:700; padding:10px 22px;
    border-radius:11px; cursor:pointer; transition:.18s; }
  .btn:hover{ border-color:var(--blue); }
  .prevbar{ background:rgba(251,191,36,.12); border:1px solid rgba(251,191,36,.32);
    border-radius:12px; padding:11px 15px; margin-bottom:22px; font-size:13px; color:var(--gold); }
  @media print{
    body{ background:#fff; color:#111; }
    .sec{ background:none; border:1px solid #ddd; box-shadow:none; page-break-inside:avoid; }
    .btn,.prevbar{ display:none; }
  }
</style>
</head>
<body>

<div id="app">
  <div class="state"><div class="spinner"></div>جارٍ فتح تقريرك…</div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="./mirrors-config.js"></script>
<script src="./fouad-store.js"></script>

<script>
(function () {
  'use strict';

  var REPORTS_COLLECTION = 'fouad_v2_reports';
  var LOGIN_PATH = '../login.html';

  var SECTION_TYPES = {
    portrait:    '🎭 بورتريه',
    session:     '📋 قراءة',
    homework:    '📝 واجب عمليّ',
    action_plan: '🎯 خطّة عمل',
    insight:     '💡 رؤية',
    text:        ''
  };

  var app = document.getElementById('app');
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function setHTML(h) { app.innerHTML = h; window.scrollTo(0, 0); }
  function state(icon, msg, extra) {
    setHTML('<div class="state"><div class="big">' + icon + '</div>' + msg +
            (extra ? ('<div style="margin-top:22px">' + extra + '</div>') : '') + '</div>');
  }

  function param(k) {
    var m = new RegExp('[?&]' + k + '=([^&]*)').exec(window.location.search);
    return m ? decodeURIComponent(m[1]) : null;
  }

  // ترتيب المواضع: عامّ ← المرايا بترتيب الـconfig ← الختام
  function placementOrder() {
    var o = { general: 0 };
    var cfg = window.FOUAD_CONFIG;
    var ms = (cfg && Array.isArray(cfg.mirrors))
      ? cfg.mirrors.slice().sort(function (a, b) { return (a.order || 0) - (b.order || 0); })
      : [];
    ms.forEach(function (m, i) { o[m.id] = i + 1; });
    o.final = 99;
    return { order: o, names: ms.reduce(function (acc, m) { acc[m.id] = m.name || m.id; return acc; }, {}) };
  }

  function groupLabel(p, names) {
    if (p === 'general') return null;                 // العامّ بلا عنوان فاصل
    if (p === 'final')   return 'الختام';
    return names[p] ? ('مرآة ' + names[p]) : null;
  }

  function paragraphs(text) {
    return String(text || '')
      .split(/\n\s*\n/)
      .map(function (b) { return b.trim(); })
      .filter(Boolean)
      .map(function (b) { return '<p>' + esc(b).replace(/\n/g, '<br>') + '</p>'; })
      .join('');
  }

  function render(doc, isPreview) {
    var po = placementOrder();
    var secs = (doc.sections || [])
      .filter(function (s) { return s && s.visible !== false && String(s.content || '').trim(); })
      .sort(function (a, b) {
        var d = (po.order[a.placement] != null ? po.order[a.placement] : 50) -
                (po.order[b.placement] != null ? po.order[b.placement] : 50);
        return d || ((a.order || 0) - (b.order || 0));
      });

    if (!secs.length) {
      state('🕊', 'تقريرك المكتوب قيد الإعداد.<br>سيصلك حين يكتمل.',
            '<button class="btn" onclick="history.back()">رجوع</button>');
      return;
    }

    var h = '';
    if (isPreview) h += '<div class="prevbar">👁 معاينة الأدمن — هذه هي الصورة التي يراها العميل.</div>';

    h += '<div class="head">' +
         '<div class="kicker">منظور الفؤاد</div>' +
         '<h1>تقريرك المكتوب</h1>' +
         (doc.clientName ? '<div class="sub">' + esc(doc.clientName) + '</div>' : '') +
         '</div>';

    var last = '__none__';
    secs.forEach(function (s) {
      if (s.placement !== last) {
        last = s.placement;
        var lbl = groupLabel(s.placement, po.names);
        if (lbl) h += '<div class="group"><span class="ln"></span><span class="tx">' + esc(lbl) + '</span><span class="ln"></span></div>';
      }
      var t = SECTION_TYPES[s.type] != null ? SECTION_TYPES[s.type] : '';
      h += '<div class="sec ' + esc(s.type || 'text') + '">' +
             (t ? '<span class="tag">' + t + '</span>' : '') +
             (s.title ? '<h2>' + esc(s.title) + '</h2>' : '') +
             paragraphs(s.content) +
           '</div>';
    });

    h += '<div class="foot">' +
         '<button class="btn" onclick="window.print()">🖨 طباعة / حفظ PDF</button>' +
         '<div style="margin-top:16px">اقرأه على مهلك. ليس امتحانًا له وقت.</div>' +
         '</div>';

    setHTML(h);
  }

  function boot() {
    var previewUid = param('u');
    var isPreview  = !!previewUid && param('preview') === '1';

    var uid = previewUid;
    if (!uid) {
      var S = window.FOUAD_STORE;
      var u = (S && S.getCurrentUser) ? S.getCurrentUser() : null;
      if (!u || !u.id) {
        state('🔒', 'تحتاج إلى تسجيل الدخول أوّلًا.',
              '<button class="btn" onclick="location.href=\'' + LOGIN_PATH + '\'">تسجيل الدخول</button>');
        return;
      }
      uid = u.id;
    }

    if (!window.db) {
      state('⚠️', 'تعذّر الاتّصال بالخادم.<br>حدِّث الصفحة بعد قليل.');
      return;
    }

    window.db.collection(REPORTS_COLLECTION).doc(uid).get()
      .then(function (d) {
        if (!d.exists) {
          state('🕊', 'تقريرك المكتوب قيد الإعداد.<br>سيصلك حين يكتمل.');
          return;
        }
        var doc = d.data() || {};
        if (!doc.published && !isPreview) {
          state('🕊', 'تقريرك المكتوب قيد الإعداد.<br>سيصلك حين يكتمل.');
          return;
        }
        render(doc, isPreview);
      })
      .catch(function (e) {
        console.error('[MY-REPORT]', e);
        state('⚠️', 'تعذّرت قراءة تقريرك.<br>حاول مرّةً أخرى بعد قليل.');
      });
  }

  // ننتظر جاهزيّة Firebase كما تفعل باقي صفحات المشروع
  if (window.db) boot();
  else {
    var fired = false;
    document.addEventListener('firebaseReady', function () { if (!fired) { fired = true; boot(); } });
    var n = 0;
    var iv = setInterval(function () {
      n += 120;
      if (window.db) { clearInterval(iv); if (!fired) { fired = true; boot(); } }
      else if (n >= 9000) { clearInterval(iv); if (!fired) { fired = true; boot(); } }
    }, 120);
  }
})();
</script>
</body>
</html>
