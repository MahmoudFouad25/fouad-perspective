<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>لوحة الأدمن — مقياس الفؤاد</title>

<!-- خطّ المشروع -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />

<style>
  /* ═══════════ هويّة المشروع البصريّة ═══════════ */
  :root {
    --bg-0:    #0f172a;   /* الخلفية الأعمق */
    --bg-1:    #1a2332;   /* البطاقات */
    --bg-2:    #243049;   /* عناصر داخليّة / hover */
    --border:  #2d3a52;
    --text:    #e8eef7;
    --muted:   #94a3b8;
    --blue:    #3b82f6;   /* تفريط / أساسيّ */
    --green:   #10b981;   /* اتزان / مكتمل */
    --gold:    #fbbf24;   /* إفراط */
    --purple:  #a78bfa;   /* ملتبس / مشكوك */
    --red:     #ef4444;   /* اتزان مشكوك فيه */
    --radius:  14px;
    --shadow:  0 10px 30px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Tajawal', sans-serif;
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(59,130,246,.10), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(167,139,250,.08), transparent 55%),
      var(--bg-0);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.7;
  }

  /* شاشة انتظار التحقّق من الهويّة */
  #gate {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: var(--bg-0); z-index: 50; gap: 14px; flex-direction: column; color: var(--muted);
  }
  .spinner {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--blue);
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* الهيكل العام */
  #app { display: none; max-width: 1280px; margin: 0 auto; padding: 22px clamp(14px,3vw,32px) 60px; }

  header.topbar {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 16px 20px; margin-bottom: 22px;
    background: linear-gradient(180deg, var(--bg-1), #16202f);
    border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .brand { display: flex; flex-direction: column; gap: 2px; margin-inline-end: auto; }
  .brand h1 { font-size: 20px; font-weight: 800; margin: 0; letter-spacing: -.2px; }
  .brand .sub { font-size: 13px; color: var(--muted); }
  .admin-chip {
    font-size: 12.5px; color: var(--green); background: rgba(16,185,129,.12);
    border: 1px solid rgba(16,185,129,.3); padding: 4px 10px; border-radius: 999px;
  }

  /* الأزرار */
  .btn {
    font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
    border: 1px solid var(--border); background: var(--bg-2); color: var(--text);
    padding: 9px 16px; border-radius: 10px; transition: .15s ease;
    display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
  }
  .btn:hover { transform: translateY(-1px); border-color: var(--blue); }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.ghost   { background: transparent; }
  .btn.danger  { color: var(--red); border-color: rgba(239,68,68,.35); }

  /* تخطيط لوحين */
  .layout { display: grid; grid-template-columns: 360px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 880px) { .layout { grid-template-columns: 1fr; } }

  .panel {
    background: var(--bg-1); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .panel .panel-head {
    padding: 14px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; justify-content: space-between;
  }
  .panel .panel-head h2 { font-size: 15px; margin: 0; font-weight: 800; }
  .count-pill { font-size: 12px; color: var(--muted); background: var(--bg-2); padding: 2px 9px; border-radius: 999px; }

  /* قائمة العملاء */
  .search-wrap { padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .search-wrap input {
    width: 100%; font-family: inherit; font-size: 14px; color: var(--text);
    background: var(--bg-0); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; outline: none;
  }
  .search-wrap input:focus { border-color: var(--blue); }

  .client-list { max-height: 70vh; overflow-y: auto; padding: 8px; }
  .client-item {
    display: flex; flex-direction: column; gap: 4px; width: 100%; text-align: start;
    padding: 11px 13px; margin-bottom: 6px; border-radius: 11px; cursor: pointer;
    background: transparent; border: 1px solid transparent; transition: .14s ease;
  }
  .client-item:hover { background: var(--bg-2); }
  .client-item.active { background: var(--bg-2); border-color: var(--blue); }
  .client-item .ci-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .client-item .ci-name { font-weight: 700; font-size: 14.5px; }
  .client-item .ci-email { font-size: 12.5px; color: var(--muted); word-break: break-all; }
  .client-item .ci-meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }

  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.done { background: var(--green); }
  .dot.prog { background: var(--gold); }

  .empty { padding: 28px 18px; text-align: center; color: var(--muted); font-size: 14px; }

  /* لوحة التفاصيل */
  #detail { min-height: 60vh; }
  .detail-head {
    padding: 18px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap;
  }
  .detail-head .dh-name { font-size: 19px; font-weight: 800; }
  .detail-head .dh-email { font-size: 13px; color: var(--muted); }
  .detail-head .dh-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .detail-body { padding: 18px 20px; }

  /* بطاقة مرآة */
  .mirror-card {
    background: var(--bg-0); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px;
  }
  .mirror-card .mc-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
  .mirror-card .mc-order { color: var(--blue); font-weight: 800; font-size: 13px; }
  .mirror-card .mc-name { font-size: 17px; font-weight: 800; }
  .mc-dominant { font-size: 13.5px; color: var(--muted); margin-bottom: 4px; }
  .mc-dominant b { color: var(--text); }
  .mc-scenario { font-size: 14px; color: var(--text); background: var(--bg-2); border-radius: 10px; padding: 9px 12px; margin: 8px 0 14px; }

  .section-label { font-size: 12.5px; color: var(--muted); font-weight: 700; margin: 12px 0 8px; }

  /* ترتيب المحاور بالنسب */
  .rank-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .rank-row .rk-name { width: 130px; font-size: 13.5px; font-weight: 700; }
  .rank-row .rk-bar { flex: 1; height: 9px; background: var(--bg-2); border-radius: 999px; overflow: hidden; }
  .rank-row .rk-fill { height: 100%; background: linear-gradient(90deg, var(--blue), var(--purple)); border-radius: 999px; }
  .rank-row .rk-pct { width: 52px; text-align: end; font-size: 13px; color: var(--muted); }

  /* صفّ طيف المحور */
  .spectrum-row {
    border: 1px solid var(--border); border-radius: 11px; padding: 11px 13px; margin-bottom: 10px;
    background: var(--bg-1);
  }
  .spectrum-row .sr-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .spectrum-row .sr-axis { font-weight: 700; font-size: 14px; }
  .position-tag {
    font-size: 12.5px; font-weight: 800; padding: 3px 11px; border-radius: 999px;
    border: 1px solid currentColor; background: color-mix(in srgb, currentColor 14%, transparent);
  }
  .sr-scores { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-top: 7px; }
  .sr-scores b { color: var(--text); font-weight: 700; }
  .sr-key { font-size: 12.5px; color: var(--muted); margin-top: 5px; }
  .sr-key b { color: var(--text); }

  /* شارات الأعلام */
  .flags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .badge { font-size: 12px; font-weight: 800; padding: 3px 11px; border-radius: 999px; }
  .badge.ambiguous { color: var(--purple); background: rgba(167,139,250,.13); border: 1px solid rgba(167,139,250,.35); }
  .badge.suspicious { color: var(--red); background: rgba(239,68,68,.13); border: 1px solid rgba(239,68,68,.35); }

  /* مفتاح الألوان */
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 4px 0 18px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }

  .placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 50vh; color: var(--muted); gap: 8px; text-align: center; padding: 20px; }

  /* إشعار صغير */
  #toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--bg-2); color: var(--text); border: 1px solid var(--green);
    padding: 11px 18px; border-radius: 12px; font-size: 14px; font-weight: 700;
    opacity: 0; pointer-events: none; transition: .25s ease; z-index: 60; box-shadow: var(--shadow);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .warn-bar { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.35); color: #fecaca;
    padding: 10px 14px; border-radius: 10px; font-size: 13.5px; margin-bottom: 16px; }
</style>
</head>
<body>

<!-- بوابة التحقّق من الهويّة (تختفي بعد تأكيد الأدمن) -->
<div id="gate">
  <div class="spinner"></div>
  <div>جارٍ التحقّق من الصلاحيّة…</div>
</div>

<!-- التطبيق (يظهر فقط للأدمن) -->
<div id="app">
  <header class="topbar">
    <div class="brand">
      <h1>لوحة الأدمن · مقياس الفؤاد</h1>
      <span class="sub">عرض نتائج العملاء — قراءة واحدة عند الفتح</span>
    </div>
    <span class="admin-chip" id="adminEmail">—</span>
    <button class="btn" id="btnRefresh">↻ تحديث</button>
    <button class="btn ghost danger" id="btnLogout">خروج</button>
  </header>

  <div class="layout">
    <!-- ░░░ اللوح الأيمن: قائمة العملاء ░░░ -->
    <aside class="panel">
      <div class="panel-head">
        <h2>العملاء</h2>
        <span class="count-pill" id="clientCount">0</span>
      </div>
      <div class="search-wrap">
        <input id="searchInput" type="text" placeholder="بحث بالاسم أو الإيميل…" autocomplete="off" />
      </div>
      <div class="client-list" id="clientList">
        <div class="empty">لم تُحمَّل البيانات بعد.</div>
      </div>
    </aside>

    <!-- ░░░ اللوح الأيسر: تفاصيل العميل ░░░ -->
    <main class="panel" id="detail">
      <div class="placeholder" id="detailPlaceholder">
        <div style="font-size:32px;opacity:.5">↘</div>
        <div>اختر عميلًا من القائمة لعرض نتائجه.</div>
      </div>
    </main>
  </div>
</div>

<div id="toast"></div>

<!-- ═══════════ Firebase compat 9.22.1 (ملفات -compat موجودة من نسخة 9 فصاعدًا) ═══════════ -->
<!-- مهمّ: ملفات -compat لا تُوجد في نسخة 8؛ لذلك نستعمل 9.22.1 كما في باقي صفحات المشروع. -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

<!-- تكوين المشروع وتهيئته — مصدر الحقيقة الوحيد للـ config وحماية الأدمن.
     يُهيّئ Firebase ويُصدّر window.db و window.auth و window.firebaseAuth (فيه checkAdminAuth/signOut).
     عدّل المسار حسب موضع admin.html — هنا بافتراض أنّها في مجلّد فرعيّ وjs/ في جذر المشروع. -->
<script src="../js/firebase-config.js"></script>

<!-- بنية المرايا والمحاور — مصدر أسماء المرايا والمحاور (لا تُكتب يدويًّا هنا) -->
<!-- عدّل المسار حسب موضع admin.html من mirrors-config.js -->
<script src="../mirrors-assesment/mirrors-config.js"></script>

<script>
(function () {
  'use strict';

  // ═══════════════════════════════════════════════════════════
  // ثوابت
  // ═══════════════════════════════════════════════════════════
  var COLLECTION = 'fouad_v2_results';   // المجموعة الوحيدة المقروءة

  // نعيد استعمال تهيئة المشروع من js/firebase-config.js (لا تكرار للـ config هنا):
  //   • window.db جاهز للقراءة بعد تحميل ملفّ التكوين
  //   • window.firebaseAuth.checkAdminAuth() يحرس الصفحة (أدمن فقط) ويحوّل للدخول عند الرفض
  //   • window.firebaseAuth.signOut() لتسجيل الخروج (وجهته من إعداد المشروع)
  var db = window.db;

  // ═══════════════════════════════════════════════════════════
  // الحالة المحلّيّة (في الذاكرة) — لا قراءة جديدة عند الاختيار/البحث
  // ═══════════════════════════════════════════════════════════
  var CLIENTS  = [];     // كل العملاء من قراءة واحدة: [{ id, data }]
  var SELECTED = null;   // العميل المعروض حاليًّا
  var FILTER   = '';     // نصّ البحث المحلّي

  // عناصر DOM
  var $ = function (id) { return document.getElementById(id); };

  // مسار صفحة دخول الأدمن (موجودة في مجلّد admin/ بجذر المشروع).
  // من mirrors-assesment/ نصعد للجذر ثمّ ندخل admin/ — عدّله لو نقلت login.html.
  var ADMIN_EMAIL = 'admin@fouad-academy.com';
  var LOGIN_PATH  = '../admin/login.html';

  // ═══════════════════════════════════════════════════════════
  // 🔐 حماية الصفحة — أدمن فقط (مع تشخيص دقيق لجاهزيّة Firebase)
  //    نتحكّم بوجهة التحويل بأنفسنا، فلا نعتمد على ./login.html في firebase-config.
  // ═══════════════════════════════════════════════════════════
  var problem = null;
  if (typeof firebase === 'undefined')
    problem = 'حزم Firebase لم تُحمّل أصلًا — تحقّق من وسوم gstatic الثلاثة (app/auth/firestore) أعلى الصفحة.';
  else if (typeof firebase.auth !== 'function')
    problem = 'حزمة firebase-auth-compat لم تُحمّل (وسم auth-compat ناقص أو فشل تحميله).';
  else if (typeof firebase.firestore !== 'function')
    problem = 'حزمة firebase-firestore-compat لم تُحمّل (وسم firestore-compat ناقص أو فشل تحميله).';
  else if (!window.auth || !window.db)
    problem = 'js/firebase-config.js لم يُنفَّذ لآخره — راجع تبويب Console لرؤية الخطأ الأحمر، أو تأكّد من مساره.';

  if (problem) {
    console.error('[ADMIN] سبب التوقّف:', problem);
    $('gate').innerHTML = '<div style="max-width:500px;text-align:center;color:#fecaca;line-height:1.9;padding:20px">' +
      '<b style="font-size:16px">تعذّر بدء اللوحة</b><br>' + esc(problem) + '</div>';
    return;
  }
  db = window.db;

  // نراقب حالة الدخول بأنفسنا: لو مش الأدمن نحوّل لمسار الدخول الصحيح.
  // (الدخول يكون عبر admin/login.html؛ وبعده تبقى الجلسة سارية فيُسمح بالعرض هنا.)
  window.auth.onAuthStateChanged(function (user) {
    var email = (user && user.email) ? user.email.toLowerCase() : '';
    if (!user || email !== ADMIN_EMAIL.toLowerCase()) {
      window.location.href = LOGIN_PATH;   // غير مصرّح — تحويل لصفحة الدخول
      return;
    }
    // أدمن مؤكَّد: أظهر الواجهة وحمّل البيانات (قراءة واحدة)
    $('gate').style.display = 'none';
    $('app').style.display  = 'block';
    $('adminEmail').textContent = user.email;
    wireEvents();
    loadClients();
  });

  // ═══════════════════════════════════════════════════════════
  // ربط الأحداث (مرّة واحدة بعد تأكيد الأدمن)
  // ═══════════════════════════════════════════════════════════
  function wireEvents() {
    $('btnRefresh').addEventListener('click', loadClients);
    $('btnLogout').addEventListener('click', function () {
      window.auth.signOut().then(function () { window.location.href = LOGIN_PATH; });
    });
    // بحث محلّيّ — يفلتر القائمة المحمّلة فقط، بلا أيّ قراءة جديدة
    $('searchInput').addEventListener('input', function (e) {
      FILTER = e.target.value || '';
      renderList();
    });
    // اختيار عميل عبر تفويض الحدث على الحاوية
    $('clientList').addEventListener('click', function (e) {
      var item = e.target.closest('.client-item');
      if (!item) return;
      selectClient(item.getAttribute('data-id'));
    });
  }

  // ═══════════════════════════════════════════════════════════
  // 📥 قراءة المجموعة مرّة واحدة (.get() — لا onSnapshot، لا تحديث تلقائيّ)
  //    تُستدعى فقط: عند فتح الصفحة + عند ضغط زرّ التحديث.
  // ═══════════════════════════════════════════════════════════
  function loadClients() {
    var listEl = $('clientList');
    listEl.innerHTML = '<div class="empty">جارٍ التحميل…</div>';
    $('btnRefresh').disabled = true;

    db.collection(COLLECTION).get()
      .then(function (snap) {
        // كل وثيقة = عميل واحد بمعرّفه
        CLIENTS = snap.docs.map(function (d) {
          return { id: d.id, data: d.data() || {} };
        });
        renderList();
        // لو كان هناك عميل مختار، حدّث مرجعه من البيانات الجديدة (دون قراءة)
        if (SELECTED) {
          var still = CLIENTS.filter(function (c) { return c.id === SELECTED.id; })[0];
          SELECTED = still || null;
          renderDetail();
        }
      })
      .catch(function (err) {
        console.error('[ADMIN] فشل القراءة:', err);
        listEl.innerHTML = '<div class="empty">تعذّر تحميل البيانات: ' + esc(err && err.message || err) + '</div>';
      })
      .then(function () { $('btnRefresh').disabled = false; });
  }

  // ═══════════════════════════════════════════════════════════
  // عرض قائمة العملاء (مع تطبيق البحث المحلّي)
  // ═══════════════════════════════════════════════════════════
  function renderList() {
    var listEl = $('clientList');
    var q = FILTER.trim().toLowerCase();

    // فلترة في الذاكرة بالاسم أو الإيميل
    var items = CLIENTS.filter(function (c) {
      if (!q) return true;
      var m = c.data.meta || {};
      return ((m.name || '').toLowerCase().indexOf(q) !== -1) ||
             ((m.email || '').toLowerCase().indexOf(q) !== -1);
    });

    $('clientCount').textContent = String(CLIENTS.length);

    if (!CLIENTS.length) {
      listEl.innerHTML = '<div class="empty">لا يوجد عملاء بعد.</div>';
      return;
    }
    if (!items.length) {
      listEl.innerHTML = '<div class="empty">لا نتائج للبحث.</div>';
      return;
    }

    listEl.innerHTML = items.map(function (c) {
      var m = c.data.meta || {};
      var prog = c.data.progress || {};
      var doneCount = Array.isArray(prog.completedMirrors) ? prog.completedMirrors.length : 0;
      var isDone = !!m.completed;
      var active = (SELECTED && SELECTED.id === c.id) ? ' active' : '';
      return '' +
        '<div class="client-item' + active + '" data-id="' + esc(c.id) + '">' +
          '<div class="ci-top">' +
            '<span class="ci-name">' + esc(m.name || 'بلا اسم') + '</span>' +
            '<span class="dot ' + (isDone ? 'done' : 'prog') + '" title="' + (isDone ? 'مكتمل' : 'قيد التقدّم') + '"></span>' +
          '</div>' +
          '<span class="ci-email">' + esc(m.email || '—') + '</span>' +
          '<div class="ci-meta">' +
            '<span>' + doneCount + ' / ' + cfgMirrors().length + ' مرايا</span>' +
            '<span>·</span>' +
            '<span>' + (isDone ? 'مكتمل' : 'قيد التقدّم') + '</span>' +
          '</div>' +
        '</div>';
    }).join('');
  }

  // ═══════════════════════════════════════════════════════════
  // اختيار عميل — من البيانات المحمّلة فقط (بلا قراءة جديدة)
  // ═══════════════════════════════════════════════════════════
  function selectClient(id) {
    SELECTED = CLIENTS.filter(function (c) { return c.id === id; })[0] || null;
    renderList();    // لتحديث التظليل
    renderDetail();
  }

  // ═══════════════════════════════════════════════════════════
  // عرض تفاصيل العميل المختار — من الوثيقة المحمّلة بالفعل
  // ═══════════════════════════════════════════════════════════
  function renderDetail() {
    var el = $('detail');
    if (!SELECTED) {
      el.innerHTML = '<div class="placeholder" id="detailPlaceholder">' +
        '<div style="font-size:32px;opacity:.5">↘</div>' +
        '<div>اختر عميلًا من القائمة لعرض نتائجه.</div></div>';
      return;
    }

    var meta = SELECTED.data.meta || {};
    var results = SELECTED.data.results || {};
    var mirrors = cfgMirrors();

    var html = '';
    // رأس البطاقة + أزرار التصدير
    html += '<div class="detail-head">' +
      '<div>' +
        '<div class="dh-name">' + esc(meta.name || 'بلا اسم') + '</div>' +
        '<div class="dh-email">' + esc(meta.email || '—') + '</div>' +
      '</div>' +
      '<div class="dh-actions">' +
        '<button class="btn primary" id="btnExport">⬇ تصدير JSON</button>' +
        '<button class="btn" id="btnCopy">📋 نسخ JSON</button>' +
      '</div>' +
    '</div>';

    html += '<div class="detail-body">';

    // تحذير لو بنية المرايا غير محمّلة
    if (!mirrors.length) {
      html += '<div class="warn-bar">تعذّر قراءة بنية المرايا — تأكّد من تحميل mirrors-config.js وصحّة مساره.</div>';
    }

    // مفتاح ألوان الطيف
    html += '<div class="legend">' +
      '<span><i style="background:var(--green)"></i> اتزان</span>' +
      '<span><i style="background:var(--gold)"></i> إفراط</span>' +
      '<span><i style="background:var(--blue)"></i> تفريط</span>' +
      '<span><i style="background:var(--purple)"></i> ملتبس / مشكوك</span>' +
    '</div>';

    // المرايا بترتيب config — المكتملة فقط (التي لها نتائج)
    var rendered = 0;
    mirrors.forEach(function (mirror) {
      var mr = results[mirror.id];
      if (!mr) return;   // مرآة غير محلولة — تُتجاوز
      rendered++;
      html += renderMirrorCard(mirror, mr);
    });

    if (!rendered) {
      html += '<div class="empty">لا توجد مرايا مكتملة لهذا العميل بعد.</div>';
    }

    html += '</div>';
    el.innerHTML = html;

    // ربط أزرار التصدير (تُعاد كتابة الـ DOM في كل عرض)
    var bx = $('btnExport'); if (bx) bx.addEventListener('click', exportJSON);
    var bc = $('btnCopy');   if (bc) bc.addEventListener('click', copyJSON);
  }

  // بطاقة مرآة واحدة
  function renderMirrorCard(mirror, mr) {
    var domId = asId(mr.dominantAxis);
    var s = '';
    s += '<div class="mirror-card">';
    s += '<div class="mc-head">' +
        '<span class="mc-order">مرآة ' + (mirror.order || '') + '</span>' +
        '<span class="mc-name">' + esc(mirror.name || mirror.id) + '</span>' +
      '</div>';

    // المحور الأظهر
    s += '<div class="mc-dominant">المحور الأظهر: <b>' + esc(axisName(mirror, domId)) + '</b></div>';

    // أعلام على مستوى المرآة (إن وُجدت)
    var mf = mirrorFlags(mr);
    if (mf.ambiguous || mf.suspiciousBalance) {
      s += '<div class="flags">' + flagBadges(mf) + '</div>';
    }

    // السيناريو
    var scenario = asText(mr.scenario);
    if (scenario) s += '<div class="mc-scenario">' + esc(scenario) + '</div>';

    // ترتيب المحاور الثلاثة بنسبها
    var ranking = normalizeRanking(mr, mirror);
    if (ranking.length) {
      s += '<div class="section-label">ترتيب المحاور</div>';
      ranking.forEach(function (r) {
        var pct = (r.percent == null) ? null : Math.max(0, Math.min(100, r.percent));
        s += '<div class="rank-row">' +
            '<span class="rk-name">' + esc(r.name) + '</span>' +
            '<span class="rk-bar"><span class="rk-fill" style="width:' + (pct == null ? 0 : pct) + '%"></span></span>' +
            '<span class="rk-pct">' + (pct == null ? '—' : (Math.round(pct) + '%')) + '</span>' +
          '</div>';
      });
    }

    // الطيف لكل محور
    var spectrum = normalizeSpectrum(mr, mirror);
    if (spectrum.length) {
      s += '<div class="section-label">الطيف لكل محور</div>';
      spectrum.forEach(function (sp) {
        var color = spectrumColor(sp.positionLabel, sp.category);
        s += '<div class="spectrum-row">' +
            '<div class="sr-top">' +
              '<span class="sr-axis">' + esc(sp.name) + '</span>' +
              (sp.positionLabel ? '<span class="position-tag" style="color:' + color + '">' + esc(sp.positionLabel) + '</span>' : '') +
            '</div>';

        // الدرجات الخام
        var scoreParts = [];
        if (sp.balance != null) scoreParts.push('اتزان: <b>' + fmt(sp.balance) + '</b>');
        if (sp.excess  != null) scoreParts.push('إفراط: <b>' + fmt(sp.excess) + '</b>');
        if (sp.deficit != null) scoreParts.push('تفريط: <b>' + fmt(sp.deficit) + '</b>');
        if (scoreParts.length) s += '<div class="sr-scores">' + scoreParts.map(function (p) { return '<span>' + p + '</span>'; }).join('') + '</div>';

        // مفتاح القراءة
        if (sp.key) s += '<div class="sr-key">مفتاح القراءة: <b>' + esc(sp.key) + '</b></div>';

        // أعلام على مستوى المحور
        var af = { ambiguous: sp.ambiguous, suspiciousBalance: sp.suspiciousBalance };
        if (af.ambiguous || af.suspiciousBalance) {
          s += '<div class="flags">' + flagBadges(af) + '</div>';
        }
        s += '</div>';
      });
    }

    s += '</div>';
    return s;
  }

  // شارات الأعلام (بنفس النصوص المطلوبة)
  function flagBadges(f) {
    var out = '';
    if (f.ambiguous)         out += '<span class="badge ambiguous">ملتبس — يُفرَز في الجلسة</span>';
    if (f.suspiciousBalance) out += '<span class="badge suspicious">اتزان مشكوك فيه — يُفرَز في الجلسة</span>';
    return out;
  }

  // ═══════════════════════════════════════════════════════════
  // 📤 تصدير JSON منظّم (بترتيب المرايا في config) + نسخ للحافظة
  // ═══════════════════════════════════════════════════════════
  function buildExport(client) {
    var meta = client.data.meta || {};
    var results = client.data.results || {};
    var prog = client.data.progress || {};

    var mirrorsOut = [];
    cfgMirrors().forEach(function (mirror) {
      var mr = results[mirror.id];
      if (!mr) return;
      var domId = asId(mr.dominantAxis);
      mirrorsOut.push({
        mirrorId: mirror.id,
        order: mirror.order || null,
        mirrorName: mirror.name || mirror.id,
        dominantAxis: { id: domId, name: axisName(mirror, domId) },
        scenario: asText(mr.scenario) || null,
        flags: mirrorFlags(mr),
        ranking: normalizeRanking(mr, mirror).map(function (r) {
          return { axisId: r.axisId, axisName: r.name, percent: r.percent };
        }),
        spectrum: normalizeSpectrum(mr, mirror).map(function (sp) {
          return {
            axisId: sp.axisId, axisName: sp.name,
            positionLabel: sp.positionLabel || null,
            category: sp.category || null,
            balance: sp.balance, excess: sp.excess, deficit: sp.deficit,
            key: sp.key || null,
            flags: { ambiguous: sp.ambiguous, suspiciousBalance: sp.suspiciousBalance }
          };
        })
      });
    });

    return {
      name: meta.name || null,
      email: meta.email || null,
      userId: meta.userId || client.id,
      courseId: meta.courseId || null,
      completed: !!meta.completed,
      completedMirrors: Array.isArray(prog.completedMirrors) ? prog.completedMirrors : [],
      exportedAt: new Date().toISOString(),
      mirrors: mirrorsOut
    };
  }

  function exportJSON() {
    if (!SELECTED) return;
    var obj = buildExport(SELECTED);
    var json = JSON.stringify(obj, null, 2);
    var blob = new Blob([json], { type: 'application/json;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var base = obj.name || obj.email || obj.userId || 'client';
    var safe = String(base).replace(/[^\w\u0600-\u06FF\-]+/g, '_');
    a.href = url; a.download = 'fouad_' + safe + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function copyJSON() {
    if (!SELECTED) return;
    var json = JSON.stringify(buildExport(SELECTED), null, 2);
    function ok() { toast('نُسخ JSON إلى الحافظة'); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(json).then(ok).catch(fallback);
    } else { fallback(); }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = json; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); ok(); } catch (e) {}
      document.body.removeChild(ta);
    }
  }

  // ═══════════════════════════════════════════════════════════
  // 🧰 أدوات قراءة دفاعيّة — لا نفترض شكلًا صارمًا للنتائج،
  //     ونتعامل بأمان مع الحقول الناقصة.
  // ═══════════════════════════════════════════════════════════

  // مرايا config مرتّبة (تُقرأ من FOUAD_CONFIG — لا تُكتب يدويًّا)
  function cfgMirrors() {
    if (!window.FOUAD_CONFIG || !Array.isArray(FOUAD_CONFIG.mirrors)) return [];
    return FOUAD_CONFIG.mirrors.slice().sort(function (a, b) {
      return (a.order || 0) - (b.order || 0);
    });
  }

  // اسم المحور من config حسب معرّفه
  function axisName(mirror, axisId) {
    if (!axisId) return '—';
    if (mirror && Array.isArray(mirror.axes)) {
      var ax = mirror.axes.filter(function (a) { return a.id === axisId; })[0];
      if (ax) return ax.name || axisId;
    }
    return axisId;
  }

  // dominantAxis قد يكون نصًّا أو كائنًا
  function asId(v) {
    if (!v) return null;
    if (typeof v === 'string') return v;
    if (typeof v === 'object') return v.id || v.axisId || v.module || v.axis || null;
    return null;
  }

  // قيمة نصّيّة من نصّ أو كائن
  function asText(v) {
    if (v == null) return '';
    if (typeof v === 'string') return v;
    if (typeof v === 'object') return v.text || v.label || v.value || '';
    return String(v);
  }

  function numOrNull(v) {
    if (v === '' || v == null) return null;
    var n = Number(v);
    return isFinite(n) ? n : null;
  }
  function sumAB(a, b) {
    var x = Number(a), y = Number(b);
    if (isFinite(x) || isFinite(y)) return (isFinite(x) ? x : 0) + (isFinite(y) ? y : 0);
    return null;
  }
  function fmt(n) { return (Math.round(n * 100) / 100); }

  // ترتيب المحاور بنسبها — يقبل مصفوفة أو خريطة، ويشتقّ من النسب عند غياب ranking
  function normalizeRanking(mr, mirror) {
    var out = [];
    var r = mr.ranking;
    if (Array.isArray(r)) {
      out = r.map(function (item) {
        if (typeof item === 'string') return { axisId: item, percent: null };
        var id = item.axisId || item.id || item.module || item.axis || null;
        var p = item.percent != null ? item.percent
              : item.percentage != null ? item.percentage
              : item.value != null ? item.value
              : item.score;
        return { axisId: id, percent: numOrNull(p) };
      });
    } else if (r && typeof r === 'object') {
      out = Object.keys(r).map(function (k) { return { axisId: k, percent: numOrNull(r[k]) }; });
    } else if (mr.percentages && typeof mr.percentages === 'object') {
      out = Object.keys(mr.percentages).map(function (k) {
        return { axisId: k, percent: numOrNull(mr.percentages[k]) };
      });
    }
    // ترتيب تنازليّ بالنسبة حين تتوفّر
    out.sort(function (a, b) {
      return (b.percent == null ? -1 : b.percent) - (a.percent == null ? -1 : a.percent);
    });
    out.forEach(function (o) { o.name = axisName(mirror, o.axisId); });
    return out;
  }

  // طيف كل محور — مفاتيحه معرّفات المحاور؛ نقرأ positionLabel والدرجات والمفتاح والأعلام
  function normalizeSpectrum(mr, mirror) {
    var rows = [];
    var sp = mr.spectrum;
    if (sp && typeof sp === 'object') {
      Object.keys(sp).forEach(function (axisId) {
        var e = sp[axisId] || {};
        rows.push({
          axisId: axisId,
          name: axisName(mirror, axisId),
          positionLabel: asText(e.positionLabel || e.label || e.position),
          category: asText(e.category),
          balance: (e.balance != null) ? numOrNull(e.balance) : null,
          excess:  (e.excess  != null) ? numOrNull(e.excess)  : sumAB(e.excess_a, e.excess_b),
          deficit: (e.deficit != null) ? numOrNull(e.deficit) : sumAB(e.deficit_a, e.deficit_b),
          key: asText(e.key),
          ambiguous: !!(e.ambiguous || (e.flags && e.flags.ambiguous)),
          suspiciousBalance: !!(e.suspiciousBalance || (e.flags && e.flags.suspiciousBalance))
        });
      });
    }
    // ترتيب المحاور حسب ترتيبها في config
    if (mirror && Array.isArray(mirror.axes)) {
      var orderMap = {};
      mirror.axes.forEach(function (a, i) { orderMap[a.id] = a.order || (i + 1); });
      rows.sort(function (a, b) { return (orderMap[a.axisId] || 99) - (orderMap[b.axisId] || 99); });
    }
    return rows;
  }

  // أعلام على مستوى المرآة
  function mirrorFlags(mr) {
    var f = mr.flags || {};
    return { ambiguous: !!f.ambiguous, suspiciousBalance: !!f.suspiciousBalance };
  }

  // لون موضع الطيف — نفحص «مشكوك/ملتبس» أوّلًا (تسبق «اتزان»)
  function spectrumColor(label, category) {
    var l = (label || '') + ' ' + (category || '');
    if (/مشكوك|ملتبس|ambig|suspic/i.test(l)) return 'var(--purple)';
    if (/إفراط|افراط|excess/i.test(l))        return 'var(--gold)';
    if (/تفريط|deficit/i.test(l))             return 'var(--blue)';
    if (/اتزان|توازن|balance/i.test(l))        return 'var(--green)';
    return 'var(--muted)';
  }

  // تهريب HTML لمنع الحقن في الأسماء/النصوص
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // إشعار صغير
  var _toastTimer = null;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1800);
  }

})();
</script>
</body>
