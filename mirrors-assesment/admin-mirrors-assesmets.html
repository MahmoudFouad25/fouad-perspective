<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>لوحة الأدمن — مقياس الفؤاد</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg-0:#0f172a; --bg-1:#1a2332; --bg-2:#243049; --bg-3:#2d3a52;
    --border:#2d3a52; --border-soft:rgba(148,163,184,.14);
    --text:#e8eef7; --muted:#94a3b8; --dim:#64748b;
    --blue:#3b82f6; --green:#10b981; --gold:#fbbf24; --purple:#a78bfa; --red:#ef4444;
    --blue-b:rgba(59,130,246,.12); --green-b:rgba(16,185,129,.12);
    --gold-b:rgba(251,191,36,.12); --purple-b:rgba(167,139,250,.13); --red-b:rgba(239,68,68,.13);
    --radius:14px; --radius-lg:18px;
    --shadow:0 10px 30px rgba(0,0,0,.35);
    --f:'Tajawal',sans-serif;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body {
    font-family:var(--f); color:var(--text); line-height:1.7; min-height:100vh;
    background:
      radial-gradient(1200px 600px at 88% -12%, rgba(59,130,246,.10), transparent 60%),
      radial-gradient(900px 520px at -8% 112%, rgba(167,139,250,.09), transparent 55%),
      var(--bg-0);
  }
  ::selection { background:rgba(251,191,36,.25); }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background:var(--bg-3); border-radius:8px; }
  ::-webkit-scrollbar-track { background:transparent; }

  #gate { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:var(--bg-0); z-index:50; flex-direction:column; gap:14px; color:var(--muted); }
  .spinner { width:34px; height:34px; border-radius:50%;
    border:3px solid var(--border); border-top-color:var(--blue); animation:spin .9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  #app { display:none; }

  .layout { display:grid; grid-template-columns:320px 1fr; min-height:100vh; }
  @media (max-width:920px){ .layout { grid-template-columns:1fr; } .side { display:none; } .side.open { display:flex; position:fixed; inset:0 0 0 auto; width:84%; max-width:340px; z-index:40; } }

  .side { background:linear-gradient(180deg,var(--bg-1),#15202f);
    border-inline-start:1px solid var(--border); display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh; }
  .side-hd { padding:20px 18px 14px; border-bottom:1px solid var(--border); text-align:center; }
  .side-logo { width:52px; height:52px; margin:0 auto 8px; border-radius:14px;
    background:linear-gradient(135deg,var(--blue),var(--green)); display:flex; align-items:center;
    justify-content:center; font-size:24px; font-weight:900; color:#0b1220;
    box-shadow:0 8px 22px rgba(59,130,246,.32); }
  .side-title { font-size:16px; font-weight:800; }
  .side-sub { font-size:11.5px; color:var(--muted); margin-top:2px; }

  .side-search { padding:12px 14px; }
  .side-search input { width:100%; background:var(--bg-0); border:1px solid var(--border);
    border-radius:10px; padding:10px 12px; color:var(--text); font-family:var(--f); font-size:13px; outline:none; }
  .side-search input:focus { border-color:var(--blue); }
  .side-search input::placeholder { color:var(--dim); }

  .side-list { flex:1; overflow-y:auto; padding:6px 10px; }
  .client { display:flex; align-items:center; gap:11px; padding:10px 11px; border-radius:12px;
    cursor:pointer; margin-bottom:4px; border:1px solid transparent; transition:.14s; width:100%; text-align:start; }
  .client:hover { background:var(--bg-2); }
  .client.active { background:var(--bg-2); border-color:var(--blue); }
  .avatar { width:40px; height:40px; border-radius:11px; flex-shrink:0; display:flex;
    align-items:center; justify-content:center; font-size:14px; font-weight:800; color:#fff; }
  .client-info { flex:1; min-width:0; }
  .client-name { font-size:13.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .client-meta { font-size:11px; color:var(--muted); margin-top:1px; }
  .client-badge { flex-shrink:0; font-size:11px; padding:2px 9px; border-radius:999px; font-weight:800; }
  .client-badge.done { background:var(--green-b); color:var(--green); }
  .client-badge.prog { background:var(--gold-b); color:var(--gold); }
  .side-foot { padding:11px 14px; border-top:1px solid var(--border); font-size:11.5px;
    color:var(--muted); text-align:center; }

  .main { min-width:0; }
  .topbar { display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:15px 22px;
    border-bottom:1px solid var(--border); background:rgba(26,35,50,.7); backdrop-filter:blur(8px);
    position:sticky; top:0; z-index:20; }
  .topbar h1 { font-size:18px; font-weight:800; margin:0; display:flex; align-items:center; gap:9px; margin-inline-end:auto; }
  .topbar .hamburger { display:none; }
  @media (max-width:920px){ .topbar .hamburger { display:inline-flex; } }

  .admin-chip { font-size:12px; color:var(--green); background:var(--green-b);
    border:1px solid rgba(16,185,129,.3); padding:4px 11px; border-radius:999px; }

  .btn { font-family:var(--f); font-size:13px; font-weight:700; cursor:pointer; border:1px solid var(--border);
    background:var(--bg-2); color:var(--text); padding:8px 14px; border-radius:10px; transition:.15s;
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
  .btn:hover { transform:translateY(-1px); border-color:var(--blue); }
  .btn:disabled { opacity:.45; cursor:not-allowed; transform:none; }
  .btn.primary { background:var(--blue); border-color:var(--blue); color:#fff; }
  .btn.gold { background:var(--gold); border-color:var(--gold); color:#3a2c05; }
  .btn.ghost { background:transparent; }
  .btn.danger { color:var(--red); border-color:rgba(239,68,68,.35); }
  .btn.sm { padding:6px 11px; font-size:12px; }

  .content { padding:22px clamp(14px,3vw,30px) 60px; max-width:1180px; }

  .placeholder { display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:65vh; color:var(--muted); gap:10px; text-align:center; }
  .placeholder .pic { font-size:46px; opacity:.5; }

  .client-hero { display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    background:linear-gradient(135deg,var(--bg-1),#16202f); border:1px solid var(--border);
    border-radius:var(--radius-lg); padding:20px 22px; box-shadow:var(--shadow); margin-bottom:20px; }
  .client-hero .avatar { width:60px; height:60px; border-radius:16px; font-size:21px; }
  .hero-info { flex:1; min-width:180px; }
  .hero-name { font-size:21px; font-weight:800; }
  .hero-email { font-size:13px; color:var(--muted); word-break:break-all; }
  .hero-actions { display:flex; gap:8px; flex-wrap:wrap; }

  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:22px; }
  .stat { background:var(--bg-1); border:1px solid var(--border); border-radius:var(--radius); padding:15px 17px; }
  .stat .lbl { font-size:11px; color:var(--muted); font-weight:700; margin-bottom:5px; }
  .stat .val { font-size:23px; font-weight:900; }
  .stat .val.blue { color:var(--blue); } .stat .val.green { color:var(--green); }
  .stat .val.gold { color:var(--gold); } .stat .val.purple { color:var(--purple); }

  .section-title { font-size:15px; font-weight:800; margin:26px 0 13px; display:flex; align-items:center; gap:8px; color:var(--text); }
  .section-title .em { font-size:18px; }

  .legend { display:flex; gap:15px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-bottom:16px; }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .legend i { width:11px; height:11px; border-radius:3px; }

  .mirrors-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:15px; }
  .mirror-card { background:var(--bg-1); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:18px; transition:.18s; border-inline-end:4px solid var(--gold); }
  .mirror-card:hover { transform:translateY(-2px); box-shadow:0 14px 34px rgba(0,0,0,.3); }
  .mc-head { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .mc-order { width:30px; height:30px; flex-shrink:0; border-radius:9px; background:var(--bg-2);
    color:var(--blue); font-weight:900; font-size:13px; display:flex; align-items:center; justify-content:center; }
  .mc-name { font-size:16px; font-weight:800; flex:1; }
  .mc-dom-pill { font-size:11px; padding:3px 10px; border-radius:999px; font-weight:800;
    background:var(--blue-b); color:var(--blue); }

  .mc-scenario { font-size:13px; color:var(--text); background:var(--bg-2); border-radius:10px;
    padding:9px 12px; margin-bottom:13px; }
  .mc-scenario b { color:var(--gold); }

  .mini-label { font-size:11px; color:var(--muted); font-weight:700; margin:13px 0 8px; }

  .axis-row { display:flex; align-items:center; gap:10px; padding:7px 9px; border-radius:9px; margin-bottom:5px;
    border:1px solid var(--border-soft); background:var(--bg-0); }
  .axis-row.top { border-color:rgba(251,191,36,.35); background:var(--gold-b); }
  .axis-row .rank-no { width:20px; text-align:center; font-weight:900; font-size:12px; color:var(--muted); }
  .axis-row.top .rank-no { color:var(--gold); }
  .axis-row .axis-name { flex:1; font-size:13px; font-weight:700; }
  .axis-row .axis-bar { width:96px; height:7px; background:var(--bg-2); border-radius:999px; overflow:hidden; }
  .axis-row .axis-fill { height:100%; background:linear-gradient(90deg,var(--blue),var(--purple)); border-radius:999px; }
  .axis-row.top .axis-fill { background:linear-gradient(90deg,var(--gold),#f59e0b); }
  .axis-row .axis-pct { width:42px; text-align:end; font-size:12.5px; font-weight:800; color:var(--muted); }

  /* كتلة المحور: تجمع رأس المحور + طبائعه + طيفه */
  .axis-block { border:1px solid var(--border-soft); border-radius:12px; padding:10px 11px; margin-bottom:11px; background:var(--bg-0); }
  .axis-block.top { border-color:rgba(251,191,36,.3); }
  .axis-block .axis-row { border:none; background:transparent; padding:2px 0 8px; margin-bottom:6px; border-bottom:1px solid var(--border-soft); }

  /* قائمة الطبائع الثلاثة داخل المحور */
  .type-list { margin:8px 2px 4px; }
  .type-row { display:flex; align-items:center; gap:8px; padding:4px 0; }
  .type-ic { width:20px; text-align:center; font-size:14px; flex-shrink:0; }
  .type-nm { flex:1; font-size:12.5px; color:var(--text); font-weight:500; }
  .type-bar { width:74px; height:6px; background:var(--bg-2); border-radius:999px; overflow:hidden; flex-shrink:0; }
  .type-fill { height:100%; background:linear-gradient(90deg,var(--green),var(--blue)); border-radius:999px; }
  .type-val { width:58px; text-align:end; font-size:11px; font-weight:700; color:var(--muted); flex-shrink:0; }

  .spectrum-axis { border:1px solid var(--border); border-radius:12px; padding:12px 13px; margin-bottom:10px; background:var(--bg-0); }
  .sa-head { display:flex; align-items:center; justify-content:space-between; gap:9px; flex-wrap:wrap; margin-bottom:9px; }
  .sa-name { font-size:13.5px; font-weight:800; }
  .pos-tag { font-size:11.5px; font-weight:800; padding:3px 11px; border-radius:999px; border:1px solid currentColor;
    background:color-mix(in srgb, currentColor 14%, transparent); }
  .sa-bars { margin:4px 0; }
  .bar-row { display:flex; align-items:center; gap:9px; margin-bottom:5px; font-size:11.5px; }
  .bar-row .bl { width:46px; color:var(--muted); }
  .bar-row .bk { flex:1; height:7px; background:var(--bg-2); border-radius:999px; overflow:hidden; }
  .bar-row .bf { height:100%; border-radius:999px; }
  .bar-row .bf.balance { background:var(--green); }
  .bar-row .bf.excess { background:var(--gold); }
  .bar-row .bf.deficit { background:var(--blue); }
  .bar-row .bv { width:26px; text-align:end; font-weight:800; color:var(--text); }
  .sa-sub { font-size:11.5px; color:var(--muted); margin-top:6px; line-height:1.7; }
  .sa-sub b { color:var(--text); }
  .sa-key { font-size:11.5px; color:var(--muted); margin-top:4px; }
  .sa-key b { color:var(--text); }

  .flags { display:flex; flex-direction:column; gap:7px; margin-top:9px; }
  .flag { font-size:11.5px; font-weight:700; padding:7px 11px; border-radius:9px; line-height:1.6; }
  .flag.purple { background:var(--purple-b); color:var(--purple); border:1px solid rgba(167,139,250,.3); }
  .flag.red { background:var(--red-b); color:var(--red); border:1px solid rgba(239,68,68,.3); }
  .flag.dim { background:var(--bg-2); color:var(--muted); border:1px solid var(--border); }

  .warn-bar { background:var(--red-b); border:1px solid rgba(239,68,68,.35); color:#fecaca;
    padding:10px 14px; border-radius:10px; font-size:13px; margin-bottom:16px; }
  .empty-note { padding:24px; text-align:center; color:var(--muted); font-size:13.5px;
    background:var(--bg-1); border:1px solid var(--border); border-radius:var(--radius); }

  #toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--bg-2); color:var(--text); border:1px solid var(--green); padding:11px 18px;
    border-radius:12px; font-size:14px; font-weight:700; opacity:0; pointer-events:none;
    transition:.25s; z-index:60; box-shadow:var(--shadow); }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="gate">
  <div class="spinner"></div>
  <div>جارٍ التحقّق من الصلاحيّة…</div>
</div>

<div id="app">
  <div class="layout">
    <aside class="side" id="side">
      <div class="side-hd">
        <div class="side-logo">ف</div>
        <div class="side-title">لوحة الأدمن</div>
        <div class="side-sub">مقياس الفؤاد — نتائج العملاء</div>
      </div>
      <div class="side-search">
        <input id="searchInput" type="text" placeholder="🔍 بحث بالاسم أو الإيميل…" autocomplete="off" />
      </div>
      <div class="side-list" id="clientList">
        <div class="empty-note" style="margin:10px">لم تُحمَّل البيانات بعد.</div>
      </div>
      <div class="side-foot" id="clientCount">—</div>
    </aside>

    <main class="main">
      <div class="topbar">
        <button class="btn ghost sm hamburger" id="btnMenu">☰</button>
        <h1>📊 إدارة النتائج</h1>
        <span class="admin-chip" id="adminEmail">—</span>
        <button class="btn sm" id="btnRefresh">↻ تحديث</button>
        <button class="btn ghost danger sm" id="btnLogout">خروج</button>
      </div>

      <div class="content" id="detail">
        <div class="placeholder">
          <div class="pic">🧭</div>
          <div>اختر عميلًا من القائمة لعرض نتائجه التفصيليّة.</div>
        </div>
      </div>
    </main>
  </div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="./mirrors-config.js"></script>

<script>
(function () {
  'use strict';

  var ADMIN_EMAIL = 'admin@fouad-academy.com';
  var LOGIN_PATH  = '../admin/login.html';
  var COLLECTION  = 'fouad_v2_results';

  var db = null;
  var $ = function (id) { return document.getElementById(id); };
  var AVATAR_COLORS = ['#3b82f6','#a78bfa','#10b981','#fbbf24','#ef4444','#ec4899','#06b6d4','#f97316','#6366f1','#14b8a6'];

  // أسماء الطبائع التسعة وأيقوناتها ومركز دافعها (منقولة من لوحة الكوتشينج القديمة).
  // المفاتيح هنا برقم الطبع "1".."9"؛ نحوّل من "type8" → "8" عند القراءة.
  var TYPE_INFO = {
    '1': { name:'المُحسِّن المُتقِن',  icon:'⚖️', center:'agency'    },
    '2': { name:'العطوف المُعطي',    icon:'💚', center:'bonding'   },
    '3': { name:'الناجح المُنجِز',    icon:'🏆', center:'bonding'   },
    '4': { name:'الحالم العميق',      icon:'🎨', center:'bonding'   },
    '5': { name:'المُفكّر المُتأمّل',  icon:'🧠', center:'certainty' },
    '6': { name:'الحذِر المُستعِدّ',  icon:'🛡️', center:'certainty' },
    '7': { name:'المُتفائل المُتحمّس',icon:'✨', center:'certainty' },
    '8': { name:'القويّ المؤثّر',     icon:'🔴', center:'agency'    },
    '9': { name:'الوسيط الهادئ',      icon:'☮️', center:'agency'    }
  };
  // رقم الطبع من "type8" أو 8 أو "8"
  function typeNum(t) {
    if (t == null) return null;
    var s = String(t).replace(/[^0-9]/g, '');
    return s || null;
  }
  function typeName(t) { var n = typeNum(t); return (n && TYPE_INFO[n]) ? TYPE_INFO[n].name : ('طبع ' + (n || '?')); }
  function typeIcon(t) { var n = typeNum(t); return (n && TYPE_INFO[n]) ? TYPE_INFO[n].icon : '•'; }

  var CLIENTS = [];
  var SELECTED = null;
  var FILTER = '';

  // 🔐 حماية الصفحة
  var problem = null;
  if (typeof firebase === 'undefined')
    problem = 'حزم Firebase لم تُحمّل — تحقّق من وسوم gstatic الثلاثة أعلى الصفحة.';
  else if (typeof firebase.auth !== 'function')
    problem = 'حزمة firebase-auth-compat لم تُحمّل.';
  else if (typeof firebase.firestore !== 'function')
    problem = 'حزمة firebase-firestore-compat لم تُحمّل.';
  else if (!window.auth || !window.db)
    problem = 'js/firebase-config.js لم يُنفَّذ لآخره — راجع Console أو مساره.';

  if (problem) {
    console.error('[ADMIN] سبب التوقّف:', problem);
    $('gate').innerHTML = '<div style="max-width:500px;text-align:center;color:#fecaca;line-height:1.9;padding:20px">' +
      '<b style="font-size:16px">تعذّر بدء اللوحة</b><br>' + esc(problem) + '</div>';
    return;
  }
  db = window.db;

  window.auth.onAuthStateChanged(function (user) {
    var email = (user && user.email) ? user.email.toLowerCase() : '';
    if (!user || email !== ADMIN_EMAIL.toLowerCase()) { window.location.href = LOGIN_PATH; return; }
    $('gate').style.display = 'none';
    $('app').style.display = 'block';
    $('adminEmail').textContent = user.email;
    wireEvents();
    loadClients();
  });

  function wireEvents() {
    $('btnRefresh').addEventListener('click', loadClients);
    $('btnLogout').addEventListener('click', function () {
      window.auth.signOut().then(function () { window.location.href = LOGIN_PATH; });
    });
    $('searchInput').addEventListener('input', function (e) { FILTER = e.target.value || ''; renderList(); });
    $('clientList').addEventListener('click', function (e) {
      var item = e.target.closest('.client');
      if (!item) return;
      selectClient(item.getAttribute('data-id'));
      $('side').classList.remove('open');
    });
    var bm = $('btnMenu');
    if (bm) bm.addEventListener('click', function () { $('side').classList.toggle('open'); });
  }

  function loadClients() {
    var listEl = $('clientList');
    listEl.innerHTML = '<div class="empty-note" style="margin:10px">جارٍ التحميل…</div>';
    $('btnRefresh').disabled = true;
    db.collection(COLLECTION).get()
      .then(function (snap) {
        CLIENTS = snap.docs.map(function (d) { return { id: d.id, data: d.data() || {} }; });
        renderList();
        if (SELECTED) {
          SELECTED = CLIENTS.filter(function (c) { return c.id === SELECTED.id; })[0] || null;
          renderDetail();
        }
      })
      .catch(function (err) {
        console.error('[ADMIN] فشل القراءة:', err);
        listEl.innerHTML = '<div class="empty-note" style="margin:10px">تعذّر التحميل: ' + esc(err && err.message || err) + '</div>';
      })
      .then(function () { $('btnRefresh').disabled = false; });
  }

  function renderList() {
    var listEl = $('clientList');
    var q = FILTER.trim().toLowerCase();
    var items = CLIENTS.filter(function (c) {
      if (!q) return true;
      var m = c.data.meta || {};
      return ((m.name || '').toLowerCase().indexOf(q) !== -1) || ((m.email || '').toLowerCase().indexOf(q) !== -1);
    });
    $('clientCount').textContent = CLIENTS.length + ' عميل';
    if (!CLIENTS.length) { listEl.innerHTML = '<div class="empty-note" style="margin:10px">لا يوجد عملاء بعد.</div>'; return; }
    if (!items.length) { listEl.innerHTML = '<div class="empty-note" style="margin:10px">لا نتائج للبحث.</div>'; return; }
    var total = cfgMirrors().length || 7;
    listEl.innerHTML = items.map(function (c) {
      var m = c.data.meta || {};
      var prog = c.data.progress || {};
      var done = Array.isArray(prog.completedMirrors) ? prog.completedMirrors.length : 0;
      var isDone = !!m.completed;
      var name = m.name || 'بلا اسم';
      var active = (SELECTED && SELECTED.id === c.id) ? ' active' : '';
      return '<button class="client' + active + '" data-id="' + esc(c.id) + '">' +
          '<span class="avatar" style="background:' + avatarColor(c.id) + '">' + esc(initials(name)) + '</span>' +
          '<span class="client-info">' +
            '<span class="client-name">' + esc(name) + '</span>' +
            '<span class="client-meta">' + done + '/' + total + ' مرايا · ' + (isDone ? 'مكتمل' : 'قيد التقدّم') + '</span>' +
          '</span>' +
          '<span class="client-badge ' + (isDone ? 'done' : 'prog') + '">' + (isDone ? '✅' : '🔄') + '</span>' +
        '</button>';
    }).join('');
  }

  function selectClient(id) {
    SELECTED = CLIENTS.filter(function (c) { return c.id === id; })[0] || null;
    renderList();
    renderDetail();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderDetail() {
    var el = $('detail');
    if (!SELECTED) {
      el.innerHTML = '<div class="placeholder"><div class="pic">🧭</div><div>اختر عميلًا من القائمة لعرض نتائجه.</div></div>';
      return;
    }
    var meta = SELECTED.data.meta || {};
    var prog = SELECTED.data.progress || {};
    var results = SELECTED.data.results || {};
    var mirrors = cfgMirrors();
    var name = meta.name || 'بلا اسم';
    var doneCount = Array.isArray(prog.completedMirrors) ? prog.completedMirrors.length : 0;
    var total = mirrors.length || 7;

    var h = '';
    h += '<div class="client-hero">' +
        '<span class="avatar" style="background:' + avatarColor(SELECTED.id) + '">' + esc(initials(name)) + '</span>' +
        '<div class="hero-info">' +
          '<div class="hero-name">' + esc(name) + '</div>' +
          '<div class="hero-email">' + esc(meta.email || '—') + '</div>' +
        '</div>' +
        '<div class="hero-actions">' +
          '<button class="btn primary" id="btnExport">⬇ تصدير JSON</button>' +
          '<button class="btn gold" id="btnCopy">📋 نسخ JSON</button>' +
        '</div>' +
      '</div>';

    var triLabel = computeTriType(results, mirrors);
    h += '<div class="stats">' +
        statCard('المرايا المكتملة', doneCount + '/' + total, 'blue') +
        statCard('الحالة', meta.completed ? 'مكتمل' : 'قيد التقدّم', meta.completed ? 'green' : 'gold') +
        statCard('المحور الأظهر للدوافع', triLabel || '—', 'purple') +
        statCard('المعرّف', shortId(SELECTED.id), 'gold') +
      '</div>';

    if (!mirrors.length) {
      h += '<div class="warn-bar">تعذّر قراءة بنية المرايا — تأكّد من تحميل mirrors-config.js وصحّة مساره.</div>';
    }

    h += '<div class="legend">' +
        '<span><i style="background:var(--green)"></i> اتزان</span>' +
        '<span><i style="background:var(--gold)"></i> إفراط</span>' +
        '<span><i style="background:var(--blue)"></i> تفريط</span>' +
        '<span><i style="background:var(--purple)"></i> ملتبس / مشكوك</span>' +
      '</div>';

    h += '<div class="section-title"><span class="em">📐</span> النتائج حسب المرايا</div>';
    var cards = '';
    var rendered = 0;
    mirrors.forEach(function (mirror) {
      var mr = results[mirror.id];
      if (!mr) return;
      rendered++;
      cards += renderMirrorCard(mirror, mr);
    });
    if (!rendered) {
      h += '<div class="empty-note">لا توجد مرايا مكتملة لهذا العميل بعد.</div>';
    } else {
      h += '<div class="mirrors-grid">' + cards + '</div>';
    }

    el.innerHTML = h;
    var bx = $('btnExport'); if (bx) bx.addEventListener('click', exportJSON);
    var bc = $('btnCopy');   if (bc) bc.addEventListener('click', copyJSON);
  }

  function statCard(lbl, val, color) {
    return '<div class="stat"><div class="lbl">' + esc(lbl) + '</div>' +
      '<div class="val ' + color + '">' + esc(val) + '</div></div>';
  }

  function renderMirrorCard(mirror, mr) {
    var domId = asId(mr.dominantAxis);
    var s = '<div class="mirror-card">';
    s += '<div class="mc-head">' +
        '<span class="mc-order">' + (mirror.order || '•') + '</span>' +
        '<span class="mc-name">' + esc(mirror.name || mirror.id) + '</span>' +
        (domId ? '<span class="mc-dom-pill">' + esc(axisName(mirror, domId)) + '</span>' : '') +
      '</div>';

    var scenario = asText(mr.scenario);
    if (scenario) s += '<div class="mc-scenario">السيناريو: <b>' + esc(scenarioLabel(scenario)) + '</b></div>';

    // ترتيب المحاور (٣) مع طبائعها، ونجهّز خريطة الطيف للربط بكل محور
    var ranking = rankAxes(mr, mirror);
    var specByAxis = {};
    readSpectrum(mr, mirror).forEach(function (sp) { specByAxis[sp.axisId] = sp; });

    if (ranking.length) {
      // أقصى نسبة بين المحاور لتطبيع عرض الأشرطة بصدق (لا نجعل الأعلى 100% قسرًا)
      var maxPct = Math.max.apply(null, ranking.map(function (r) { return r.percent || 0; }).concat([1]));

      ranking.forEach(function (r, i) {
        var pct = (r.percent == null) ? 0 : r.percent;
        var w = Math.max(2, Math.min(100, Math.round((pct / maxPct) * 100)));
        var isTop = (i === 0);

        // ── رأس المحور ──
        s += '<div class="axis-block' + (isTop ? ' top' : '') + '">';
        s += '<div class="axis-row' + (isTop ? ' top' : '') + '">' +
            '<span class="rank-no">' + (i + 1) + '</span>' +
            '<span class="axis-name">' + esc(r.name) + '</span>' +
            '<span class="axis-bar"><span class="axis-fill" style="width:' + w + '%"></span></span>' +
            '<span class="axis-pct">' + Math.round(pct) + '%</span>' +
          '</div>';

        // ── طبائع المحور الثلاثة بأسمائها ونقاطها ──
        if (r.types && r.types.length) {
          var maxTypeRaw = Math.max.apply(null, r.types.map(function (t) { return (t.raw != null ? t.raw : (t.percent || 0)); }).concat([1]));
          s += '<div class="type-list">';
          r.types.forEach(function (t) {
            var tv = (t.raw != null) ? t.raw : (t.percent || 0);
            var tw = Math.max(3, Math.min(100, Math.round((tv / maxTypeRaw) * 100)));
            var rawTxt = (t.raw != null) ? (t.raw + ' نقطة') : ((t.percent != null) ? (t.percent + '%') : '');
            s += '<div class="type-row">' +
                '<span class="type-ic">' + t.icon + '</span>' +
                '<span class="type-nm">' + esc(t.name) + '</span>' +
                '<span class="type-bar"><span class="type-fill" style="width:' + tw + '%"></span></span>' +
                '<span class="type-val">' + esc(rawTxt) + '</span>' +
              '</div>';
          });
          s += '</div>';
        }

        // ── طيف هذا المحور (إن وُجد) ──
        if (specByAxis[r.axisId]) {
          s += renderSpectrumAxis(specByAxis[r.axisId]);
        }

        s += '</div>'; // .axis-block
      });
    }

    // طيف لمحاور لم تظهر في الترتيب (احتياط)
    Object.keys(specByAxis).forEach(function (axisId) {
      var seen = ranking.some(function (r) { return r.axisId === axisId; });
      if (!seen) s += renderSpectrumAxis(specByAxis[axisId]);
    });

    var mf = mr.flags || {};
    var mflags = '';
    if (mf.ambiguous) mflags += flag('purple', '⚑ ملتبس — يُفرَز في الجلسة');
    if (mf.suspiciousBalance) mflags += flag('red', '⚑ اتزان مشكوك فيه — يُفرَز في الجلسة');
    if (mf.weakSignal) mflags += flag('dim', 'إشارة ضعيفة — الدرجات منخفضة، تُؤخذ بحذر');
    if (mf.sameAxisCloseness) mflags += flag('dim', 'تقارب داخل المحور');
    if (mflags) s += '<div class="flags">' + mflags + '</div>';

    s += '</div>';
    return s;
  }

  function renderSpectrumAxis(sp) {
    var color = spectrumColor(sp.positionLabel, sp.category, sp.position);
    var maxBar = 14;
    var s = '<div class="spectrum-axis">';
    s += '<div class="sa-head">' +
        '<span class="sa-name">' + esc(sp.name) + '</span>' +
        (sp.positionLabel ? '<span class="pos-tag" style="color:' + color + '">' + esc(sp.positionLabel) +
          (sp.image ? (' · ' + esc(imageLabel(sp.image))) : '') + '</span>' : '') +
      '</div>';
    s += '<div class="sa-bars">';
    [['balance','اتزان',sp.balance],['excess','إفراط',sp.excess],['deficit','تفريط',sp.deficit]].forEach(function (row) {
      if (row[2] == null) return;
      var w = Math.max(0, Math.min(100, Math.round((row[2] / maxBar) * 100)));
      s += '<div class="bar-row">' +
          '<span class="bl">' + row[1] + '</span>' +
          '<span class="bk"><span class="bf ' + row[0] + '" style="width:' + w + '%"></span></span>' +
          '<span class="bv">' + fmt(row[2]) + '</span>' +
        '</div>';
    });
    s += '</div>';
    var sub = [];
    if (sp.excess_a != null || sp.excess_b != null) sub.push('الإفراط: أ=<b>' + fmt(sp.excess_a) + '</b> · ب=<b>' + fmt(sp.excess_b) + '</b>');
    if (sp.deficit_a != null || sp.deficit_b != null) sub.push('التفريط: أ=<b>' + fmt(sp.deficit_a) + '</b> · ب=<b>' + fmt(sp.deficit_b) + '</b>');
    if (sub.length) s += '<div class="sa-sub">' + sub.join(' — ') + '</div>';
    if (sp.key) s += '<div class="sa-key">مفتاح القراءة: <b>' + esc(sp.key) + '</b></div>';
    var f = '';
    if (sp.ambiguous) f += flag('purple', '⚑ الموقع ملتبس (الفارق أقلّ من ٣ نقاط) — يُفرَز في الجلسة');
    if (sp.suspiciousBalance) f += flag('red', '⚑ اتزان مشكوك فيه (الاتزان والتفريط مرتفعان معًا) — يُفرَز في الجلسة');
    if (f) s += '<div class="flags">' + f + '</div>';
    s += '</div>';
    return s;
  }

  function flag(cls, txt) { return '<div class="flag ' + cls + '">' + esc(txt) + '</div>'; }

  function buildExport(client) {
    var meta = client.data.meta || {};
    var prog = client.data.progress || {};
    var results = client.data.results || {};
    var mirrorsOut = [];
    cfgMirrors().forEach(function (mirror) {
      var mr = results[mirror.id];
      if (!mr) return;
      var domId = asId(mr.dominantAxis);
      mirrorsOut.push({
        mirrorId: mirror.id,
        order: mirror.order || null,
        mirrorName: mirror.name || mirror.id,
        dominantAxis: { id: domId, name: axisName(mirror, domId) },
        scenario: asText(mr.scenario) || null,
        flags: mr.flags || {},
        ranking: rankAxes(mr, mirror).map(function (r) {
          return {
            axisId: r.axisId, axisName: r.name, percent: r.percent, raw: r.raw,
            types: (r.types || []).map(function (t) {
              return { type: t.type, typeName: t.name, raw: t.raw, percent: t.percent };
            })
          };
        }),
        spectrum: readSpectrum(mr, mirror).map(function (sp) {
          return {
            axisId: sp.axisId, axisName: sp.name,
            position: sp.position || null, positionLabel: sp.positionLabel || null, image: sp.image || null,
            scores: { balance: sp.balance, excess: sp.excess, deficit: sp.deficit,
                      excess_a: sp.excess_a, excess_b: sp.excess_b, deficit_a: sp.deficit_a, deficit_b: sp.deficit_b },
            key: sp.key || null,
            flags: { ambiguous: !!sp.ambiguous, suspiciousBalance: !!sp.suspiciousBalance }
          };
        })
      });
    });
    return {
      name: meta.name || null,
      email: meta.email || null,
      userId: meta.userId || client.id,
      courseId: meta.courseId || null,
      completed: !!meta.completed,
      completedMirrors: Array.isArray(prog.completedMirrors) ? prog.completedMirrors : [],
      exportedAt: new Date().toISOString(),
      mirrors: mirrorsOut
    };
  }

  function exportJSON() {
    if (!SELECTED) return;
    var obj = buildExport(SELECTED);
    var json = JSON.stringify(obj, null, 2);
    var blob = new Blob([json], { type: 'application/json;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var base = obj.name || obj.email || obj.userId || 'client';
    var safe = String(base).replace(/[^\w\u0600-\u06FF\-]+/g, '_');
    a.href = url; a.download = 'fouad_' + safe + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('تم تنزيل JSON');
  }

  function copyJSON() {
    if (!SELECTED) return;
    var json = JSON.stringify(buildExport(SELECTED), null, 2);
    function ok() { toast('نُسخ JSON إلى الحافظة'); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(json).then(ok).catch(fallback);
    } else { fallback(); }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = json; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); ok(); } catch (e) {}
      document.body.removeChild(ta);
    }
  }

  function cfgMirrors() {
    var cfg = (typeof FOUAD_CONFIG !== 'undefined') ? FOUAD_CONFIG : (window.FOUAD_CONFIG || null);
    if (!cfg || !Array.isArray(cfg.mirrors)) return [];
    return cfg.mirrors.slice().sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
  }

  function axisName(mirror, axisId) {
    if (!axisId) return '—';
    if (mirror && Array.isArray(mirror.axes)) {
      var ax = mirror.axes.filter(function (a) { return a.id === axisId; })[0];
      if (ax) return ax.name || axisId;
    }
    return axisId;
  }

  // تجميع الترتيب على المحاور الثلاثة، مع الاحتفاظ بطبائع كل محور بنقاطها.
  // المُخرَج: [{ axisId, name, raw, percent, types:[{type,num,name,icon,raw,percent}] }]
  function rankAxes(mr, mirror) {
    var raw = mr.ranking;
    var byAxis = {}; // axisId -> { raw, percent, hasRaw, hasPct, types:[] }

    function ensure(axisId) {
      if (!byAxis[axisId]) byAxis[axisId] = { axisId: axisId, raw: 0, percent: 0, hasRaw: false, hasPct: false, types: [] };
      return byAxis[axisId];
    }
    function add(axisId, typeKey, rawVal, pctVal) {
      if (!axisId) return;
      var b = ensure(axisId);
      var rv = numOrNull(rawVal), pv = numOrNull(pctVal);
      if (rv != null) { b.raw += rv; b.hasRaw = true; }
      if (pv != null) { b.percent += pv; b.hasPct = true; }
      if (typeKey != null) {
        var num = typeNum(typeKey);
        b.types.push({ type: typeKey, num: num, name: typeName(typeKey), icon: typeIcon(typeKey), raw: rv, percent: pv });
      }
    }

    if (Array.isArray(raw)) {
      raw.forEach(function (item) {
        if (!item || typeof item !== 'object') return;
        var axisId = item.axisId || item.module || item.axis || null;
        add(axisId, item.type, item.raw, item.percent != null ? item.percent : item.percentage);
      });
    } else if (raw && typeof raw === 'object') {
      Object.keys(raw).forEach(function (k) { add(k, null, null, raw[k]); });
    }

    var rows = Object.keys(byAxis).map(function (k) {
      var b = byAxis[k];
      // ترتيب طبائع المحور تنازليًّا بالنقطة الخام ثمّ النسبة
      b.types.sort(function (x, y) {
        return ((y.raw != null ? y.raw : (y.percent || 0)) - (x.raw != null ? x.raw : (x.percent || 0)));
      });
      return { axisId: k, raw: b.hasRaw ? b.raw : null, percent: b.hasPct ? b.percent : null, name: axisName(mirror, k), types: b.types };
    });

    // النسبة المعروضة للمحور: لو لم تتوفّر، نشتقّها كحصّة من مجموع المحاور
    var anyPct = rows.some(function (r) { return r.percent != null; });
    if (!anyPct) {
      var sum = rows.reduce(function (a, r) { return a + (r.raw || 0); }, 0) || 1;
      rows.forEach(function (r) { r.percent = Math.round(((r.raw || 0) / sum) * 100); });
    }

    rows.sort(function (a, b) {
      var av = (a.percent != null) ? a.percent : (a.raw || 0);
      var bv = (b.percent != null) ? b.percent : (b.raw || 0);
      return bv - av;
    });
    return rows;
  }

  function readSpectrum(mr, mirror) {
    var rows = [];
    var sp = mr.spectrum;
    if (sp && typeof sp === 'object') {
      Object.keys(sp).forEach(function (axisId) {
        var e = sp[axisId] || {};
        rows.push({
          axisId: axisId, name: axisName(mirror, axisId),
          position: asText(e.position),
          positionLabel: asText(e.positionLabel || e.label || e.position),
          category: asText(e.category),
          image: asText(e.image),
          balance: numOrNull(e.balance), excess: numOrNull(e.excess), deficit: numOrNull(e.deficit),
          excess_a: numOrNull(e.excess_a), excess_b: numOrNull(e.excess_b),
          deficit_a: numOrNull(e.deficit_a), deficit_b: numOrNull(e.deficit_b),
          key: asText(e.key),
          ambiguous: !!(e.ambiguous || (e.flags && e.flags.ambiguous)),
          suspiciousBalance: !!(e.suspiciousBalance || (e.flags && e.flags.suspiciousBalance))
        });
      });
    }
    if (mirror && Array.isArray(mirror.axes)) {
      var orderMap = {};
      mirror.axes.forEach(function (a, i) { orderMap[a.id] = a.order || (i + 1); });
      rows.sort(function (a, b) { return (orderMap[a.axisId] || 99) - (orderMap[b.axisId] || 99); });
    }
    return rows;
  }

  function computeTriType(results, mirrors) {
    var driveMirror = mirrors.filter(function (m) {
      return Array.isArray(m.axes) && m.axes.some(function (a) { return /الهمّة|الأنس|اليقين/.test(a.name || ''); });
    })[0];
    if (!driveMirror) return null;
    var mr = results[driveMirror.id];
    if (!mr) return null;
    var ranked = rankAxes(mr, driveMirror);
    if (!ranked.length) return null;
    return ranked[0].name;
  }

  function scenarioLabel(s) {
    var map = { weak:'إشارة ضعيفة', clear:'واضح', dual:'مزدوج', ambiguous:'ملتبس', balanced:'متوازن' };
    return map[s] || s;
  }
  function imageLabel(img) {
    var map = { excess_a:'إفراط (صورة أ)', excess_b:'إفراط (صورة ب)', deficit_a:'تفريط (صورة أ)', deficit_b:'تفريط (صورة ب)', balance:'اتزان' };
    return map[img] || img;
  }

  function asId(v) {
    if (!v) return null;
    if (typeof v === 'string') return v;
    if (typeof v === 'object') return v.id || v.axisId || v.module || v.axis || null;
    return null;
  }
  function asText(v) {
    if (v == null) return '';
    if (typeof v === 'string') return v;
    if (typeof v === 'object') return v.text || v.label || v.value || '';
    return String(v);
  }
  function numOrNull(v) { if (v === '' || v == null) return null; var n = Number(v); return isFinite(n) ? n : null; }
  function fmt(n) { return (n == null) ? '—' : (Math.round(n * 100) / 100); }

  function spectrumColor(label, category, position) {
    var l = (label || '') + ' ' + (category || '') + ' ' + (position || '');
    if (/مشكوك|ملتبس|ambig|suspic/i.test(l)) return 'var(--purple)';
    if (/إفراط|افراط|excess/i.test(l)) return 'var(--gold)';
    if (/تفريط|deficit/i.test(l)) return 'var(--blue)';
    if (/اتزان|توازن|balance/i.test(l)) return 'var(--green)';
    return 'var(--muted)';
  }

  function avatarColor(str) {
    var hash = 0; str = String(str || '');
    for (var i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
    return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
  }
  function initials(name) {
    if (!name) return '؟';
    var parts = String(name).trim().split(/\s+/);
    if (parts.length >= 2) return (parts[0][0] || '') + (parts[1][0] || '');
    return String(name).substring(0, 2);
  }
  function shortId(id) { return String(id || '').substring(0, 8); }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  var _toastTimer = null;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1800);
  }

})();
</script>
</body>
</html>
