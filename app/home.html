<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>منظور الفؤاد</title>
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="منظور الفؤاد">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="./app.css">
</head>
<body>

  <div class="offline-bar hidden" id="offlineBar"><i class="fas fa-wifi"></i> لا يوجد اتصال بالإنترنت</div>

  <header class="app-header">
    <h2 id="headerTitle">رحلاتي</h2>
    <button class="icon-btn" id="refreshBtn" aria-label="تحديث"><i class="fas fa-rotate-right"></i></button>
  </header>

  <!-- ═══════════ رحلاتي ═══════════ -->
  <section class="view" id="view-courses">
    <div class="hello">
      <small id="stageLine">مرحلة النداء</small>
      <h3 id="greeting">أهلًا بك</h3>
      <div class="stats">
        <div class="stat"><b id="statCourses">–</b><span>رحلة</span></div>
        <div class="stat"><b id="statProgress">–</b><span>متوسط التقدّم</span></div>
        <div class="stat"><b id="statDone">–</b><span>مكتملة</span></div>
      </div>
    </div>

    <div class="chips" id="filters">
      <button class="chip active" data-filter="all">الكل <span class="n" id="n-all">0</span></button>
      <button class="chip" data-filter="active">نشطة <span class="n" id="n-active">0</span></button>
      <button class="chip" data-filter="pending">جديدة <span class="n" id="n-pending">0</span></button>
      <button class="chip" data-filter="completed">مكتملة <span class="n" id="n-completed">0</span></button>
    </div>

    <div id="coursesList">
      <div class="skel" style="height:300px;margin-bottom:16px"></div>
      <div class="skel" style="height:300px"></div>
    </div>
  </section>

  <!-- ═══════════ المحفظة ═══════════ -->
  <section class="view hidden" id="view-wallet">
    <div class="wallet-card">
      <small><i class="fas fa-coins"></i> رصيد النقاط</small>
      <div class="pts" id="walletPoints">0</div>
      <div class="cash">تعادل <b id="walletCash">0</b> جنيه <span class="t-muted">(كل ١٠ نقاط = ١ جنيه)</span></div>
    </div>

    <div class="panel">
      <h5>أنشئ كوبون خصم</h5>
      <p class="hint">حوّل نقاطك إلى كوبون تستخدمه عند الحجز أو تهديه لصديق. الحد الأدنى ١٠ جنيه.</p>
      <div class="inline-form">
        <input type="number" id="couponAmount" inputmode="numeric" min="10" step="1" placeholder="القيمة بالجنيه">
        <button class="btn btn-gold btn-sm" id="createCouponBtn" style="min-height:48px">إنشاء</button>
      </div>
      <div class="calc" id="couponCalc"></div>
    </div>

    <div class="section-title">كوبوناتي</div>
    <div id="couponsList"><div class="skel" style="height:72px"></div></div>
  </section>

  <!-- ═══════════ حسابي ═══════════ -->
  <section class="view hidden" id="view-account">
    <div class="profile-head">
      <div class="avatar" id="avatar">؟</div>
      <h3 id="profileName">—</h3>
      <p id="profileEmail"></p>
    </div>

    <div class="list">
      <button class="list-item" id="contactAdmin">
        <span class="li-ico" style="background:rgba(37,211,102,.14);color:#4ade80"><i class="fab fa-whatsapp"></i></span>
        <span class="li-text">تواصل مع الإدارة<small>للاستفسار أو الاشتراك في رحلة جديدة</small></span>
        <i class="fas fa-chevron-left chev"></i>
      </button>
      <button class="list-item" id="installItem">
        <span class="li-ico" style="background:var(--gold-soft);color:var(--gold)"><i class="fas fa-mobile-screen"></i></span>
        <span class="li-text">تثبيت التطبيق<small id="installHint">أضِف الأيقونة إلى شاشتك الرئيسية</small></span>
        <i class="fas fa-chevron-left chev"></i>
      </button>
    </div>

    <div class="list">
      <button class="list-item" id="logoutItem">
        <span class="li-ico" style="background:var(--red-soft);color:#fca5a5"><i class="fas fa-right-from-bracket"></i></span>
        <span class="li-text" style="color:#fca5a5">تسجيل الخروج</span>
      </button>
    </div>

    <div class="version">منظور الفؤاد · الإصدار 1.0</div>
  </section>

  <!-- ═══════════ الشريط السفلي ═══════════ -->
  <nav class="tabbar">
    <a class="tab active" href="#courses" data-tab="courses"><i class="fas fa-compass"></i>رحلاتي</a>
    <a class="tab" href="#wallet" data-tab="wallet"><i class="fas fa-wallet"></i>المحفظة</a>
    <a class="tab" href="#account" data-tab="account"><i class="fas fa-user"></i>حسابي</a>
  </nav>

  <!-- ═══════════ الورقة السفلية ═══════════ -->
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grip"></div><div id="sheetBody"></div></div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="./core.js"></script>

  <script>
  (function () {
    'use strict';
    const { auth, db, PATHS, Session, isBlocked, escapeHtml: esc, formatText, openExternal, toast, SUPPORT_WHATSAPP, DEFAULT_NAME } = FP;
    const $ = id => document.getElementById(id);
    const AR = n => Number(n || 0).toLocaleString('ar-EG');
    // عدّ عربي سليم: ١ درس، درسان، ٣ دروس، ١١ درسًا…
    function count(n, one, two, few, many) {
      n = Number(n || 0);
      if (n === 2) return two;
      if (n >= 3 && n <= 10) return `${AR(n)} ${few}`;
      if (n >= 11) return `${AR(n)} ${many}`;
      return `${AR(n)} ${one}`;
    }
    const lessonsTxt = n => count(n, 'درس', 'درسان', 'دروس', 'درسًا');
    const hoursTxt = n => count(n, 'ساعة', 'ساعتان', 'ساعات', 'ساعة');
    const minutesTxt = n => count(n, 'دقيقة', 'دقيقتان', 'دقائق', 'دقيقة');

    let userId = Session.userId();
    let userData = null;
    let courses = [];
    let filter = 'all';

    if (!userId) { location.replace(PATHS.login); return; }

    // ═══════════════════════════════════════════════
    // التنقّل بين التبويبات (يدعم زر الرجوع في الموبايل)
    // ═══════════════════════════════════════════════
    const TITLES = { courses: 'رحلاتي', wallet: 'المحفظة', account: 'حسابي' };

    function route() {
      const tab = (location.hash || '#courses').slice(1);
      const name = TITLES[tab] ? tab : 'courses';
      Object.keys(TITLES).forEach(t => $('view-' + t).classList.toggle('hidden', t !== name));
      document.querySelectorAll('.tab').forEach(a => a.classList.toggle('active', a.dataset.tab === name));
      $('headerTitle').textContent = TITLES[name];
      if (name === 'wallet') loadCoupons();
      window.scrollTo(0, 0);
    }
    window.addEventListener('hashchange', () => { if (!sheetOpen) route(); });
    document.querySelectorAll('.tab').forEach(a => a.addEventListener('click', e => {
      e.preventDefault();
      if (location.hash !== a.getAttribute('href')) history.replaceState(null, '', a.getAttribute('href'));
      route();
    }));

    // ═══════════════════════════════════════════════
    // الورقة السفلية
    // ═══════════════════════════════════════════════
    let sheetOpen = false;
    let closing = null;
    function openSheet(html) {
      $('sheetBody').innerHTML = html;
      $('sheet').scrollTop = 0;
      $('sheet').classList.add('open');
      $('sheetBackdrop').classList.add('open');
      if (!sheetOpen) history.pushState({ sheet: true }, '');
      sheetOpen = true;
    }
    // تُغلق الورقة وتنتظر رجوع السجل، حتى لا تُغلق ورقة جديدة تُفتح بعدها مباشرة
    function closeSheet(fromPop) {
      if (!sheetOpen) return Promise.resolve();
      sheetOpen = false;
      $('sheet').classList.remove('open');
      $('sheetBackdrop').classList.remove('open');
      if (fromPop) return Promise.resolve();
      return new Promise(res => {
        closing = res;
        history.back();
        setTimeout(() => { if (closing === res) { closing = null; res(); } }, 500);
      });
    }
    window.addEventListener('popstate', () => {
      if (closing) { const r = closing; closing = null; r(); return; }
      if (sheetOpen) closeSheet(true);
    });
    $('sheetBackdrop').addEventListener('click', () => closeSheet());

    function confirmSheet({ icon, title, body, okText, okClass = 'btn-gold' }) {
      return new Promise(resolve => {
        openSheet(`
          <div class="confirm-ico">${icon}</div>
          <h3 style="text-align:center">${title}</h3>
          <p class="lead">${body}</p>
          <div class="sheet-actions">
            <button class="btn ${okClass} btn-block" id="cOk">${okText}</button>
            <button class="btn btn-ghost btn-block" id="cNo">إلغاء</button>
          </div>`);
        $('cOk').onclick = async () => { await closeSheet(); resolve(true); };
        $('cNo').onclick = async () => { await closeSheet(); resolve(false); };
      });
    }

    // ═══════════════════════════════════════════════
    // البيانات
    // ═══════════════════════════════════════════════
    async function loadUser() {
      const snap = await db.collection('users').doc(userId).get();
      if (!snap.exists) { await Session.clear(); location.replace(PATHS.login); return false; }
      userData = snap.data();
      if (isBlocked(userData)) {
        await Session.clear();
        location.replace(PATHS.login);
        return false;
      }
      return true;
    }

    async function buildCourse(enrollment) {
      const id = enrollment.courseId || enrollment.courseInfo?.id || enrollment.id;
      let cd = null;
      try {
        const doc = await db.collection('courses').doc(id).get();
        if (doc.exists) cd = doc.data();
      } catch (e) { console.warn('تعذّر جلب الدورة', id); }

      let progress = 0, completedLessons = [], lastActivity = null;
      const p = userData.progress && userData.progress[id];
      if (p) {
        progress = p.percentage || 0;
        completedLessons = p.completedLessons || [];
        lastActivity = p.lastActivity || null;
      } else if (enrollment.learningProgress !== undefined) {
        progress = enrollment.learningProgress || 0;
        completedLessons = enrollment.completedLessons || [];
        lastActivity = enrollment.lastActivity || null;
      }

      let lessons = 0, minutes = 0;
      (cd?.modules || []).forEach(m => (m.lessons || []).forEach(l => {
        lessons++;
        minutes += parseInt(l.duration) || 0;
      }));

      return {
        id,
        title: enrollment.title || cd?.title || 'رحلة غير معنونة',
        journeyName: cd?.journeyName || enrollment.journeyName || '',
        journeyIcon: cd?.journeyIcon || enrollment.journeyIcon || '✨',
        stageName: cd?.stageName || enrollment.stageName || '',
        stageIcon: cd?.stageIcon || enrollment.stageIcon || '📍',
        type: enrollment.type || cd?.type || 'course',
        status: progress >= 100 ? 'completed' : progress > 0 ? 'active' : 'pending',
        progress,
        completedLessons,
        lastActivity,
        description: cd?.description || enrollment.description || 'استكشف رحلة تحويلية جديدة في منظور الفؤاد',
        instructor: cd?.instructor || enrollment.instructorName || 'كوتش محمود فؤاد',
        minutes,
        lessons,
        objectives: cd?.objectives || enrollment.objectives || [],
        thumbnail: cd?.thumbnailUrl || cd?.thumbnail || enrollment.thumbnailUrl || enrollment.thumbnail || null,
        whatsapp: cd?.whatsappGroupLink || null,
        live: null
      };
    }

    async function checkLive(courseId) {
      try {
        const now = new Date();
        const from = new Date(now.getTime() - 3 * 24 * 3600 * 1000);
        const s = await db.collection('liveSessions')
          .where('courseId', '==', courseId)
          .where('scheduledDate', '>=', from)
          .get();
        if (s.empty) return null;
        const list = s.docs.map(d => d.data()).filter(x => x.scheduledDate?.toDate)
          .sort((a, b) => a.scheduledDate.toDate() - b.scheduledDate.toDate());
        let isLive = false, upcoming = null;
        list.forEach(x => {
          const h = (x.scheduledDate.toDate() - now) / 3600000;
          if (x.status === 'active' || (h >= -1 && h <= 1)) isLive = true;
          if (!upcoming && h > 0 && h <= 24) upcoming = { title: x.title, hours: Math.round(h) };
        });
        return { isLive, upcoming };
      } catch (e) { return null; }
    }

    async function loadAll() {
      $('refreshBtn').firstElementChild.classList.add('fa-spin');
      try {
        if (!(await loadUser())) return;
        renderProfile();
        renderWalletHead();
        if (location.hash === '#wallet') loadCoupons();

        const enrollments = userData.enrollments || userData.courses || [];
        courses = await Promise.all(enrollments.map(buildCourse));
        renderCourses();
        renderHello();

        // مؤشرات البث المباشر بعد الرسم الأول
        courses.forEach(async c => {
          c.live = await checkLive(c.id);
          if (c.live && (c.live.isLive || c.live.upcoming)) renderCourses();
        });
      } catch (e) {
        console.error(e);
        if (!courses.length) {
          $('coursesList').innerHTML = `
            <div class="empty"><div class="em">🌙</div><h4>تعذّر تحميل رحلاتك</h4>
            <p>تأكد من اتصالك بالإنترنت ثم حاول مرة أخرى.</p>
            <button class="btn btn-ghost" onclick="location.reload()">إعادة المحاولة</button></div>`;
        } else {
          toast('تعذّر التحديث — تحقق من الاتصال', 'error');
        }
      } finally {
        $('refreshBtn').firstElementChild.classList.remove('fa-spin');
      }
    }

    // ═══════════════════════════════════════════════
    // الرسم: رحلاتي
    // ═══════════════════════════════════════════════
    function userName() {
      return userData?.personalInfo?.name || userData?.name || userData?.displayName || DEFAULT_NAME;
    }

    function renderHello() {
      const h = new Date().getHours();
      const g = h < 6 ? 'ليلة هادئة' : h < 12 ? 'صباح الأنوار' : h < 18 ? 'يومك مبارك' : 'مساء الخيرات';
      $('greeting').textContent = `${g} يا ${userName().split(' ')[0]}`;
      $('stageLine').textContent = `مرحلة ${userData?.journeyPoints?.stageName || 'النداء'}`;

      const n = courses.length;
      const avg = n ? Math.round(courses.reduce((s, c) => s + (c.progress || 0), 0) / n) : 0;
      $('statCourses').textContent = AR(n);
      $('statProgress').textContent = AR(avg) + '٪';
      $('statDone').textContent = AR(courses.filter(c => c.status === 'completed').length);

      ['all', 'active', 'pending', 'completed'].forEach(f => {
        $('n-' + f).textContent = AR(f === 'all' ? n : courses.filter(c => c.status === f).length);
      });
    }

    function validImage(url) {
      return !!url && /^https?:\/\//.test(url);
    }

    function lastActivityText(c) {
      if (c.lastActivity) {
        try {
          const d = c.lastActivity.toDate ? c.lastActivity.toDate() : new Date(c.lastActivity);
          const days = Math.floor((Date.now() - d) / 86400000);
          if (!isNaN(days)) return days <= 0 ? 'اليوم' : days === 1 ? 'أمس' : days === 2 ? 'منذ يومين' : `منذ ${count(days, 'يوم', 'يومين', 'أيام', 'يومًا')}`;
        } catch (e) { /* تجاهل */ }
      }
      return c.completedLessons.length ? `أكملت ${lessonsTxt(c.completedLessons.length)}` : 'لم تبدأ بعد';
    }

    function durationText(min) {
      const h = Math.floor(min / 60);
      return h > 0 ? hoursTxt(h) : minutesTxt(min % 60);
    }

    function achievement(p) {
      if (p >= 100) return '<span class="achv"><i class="fas fa-trophy"></i> بطل الرحلة</span>';
      if (p >= 75) return '<span class="achv"><i class="fas fa-star"></i> متقدّم</span>';
      if (p >= 50) return '<span class="achv"><i class="fas fa-medal"></i> في الطريق</span>';
      if (p >= 25) return '<span class="achv"><i class="fas fa-seedling"></i> بداية قوية</span>';
      return '';
    }

    const STATUS = {
      completed: ['s-completed', 'مكتملة'],
      active: ['s-active', 'نشطة'],
      pending: ['s-pending', 'جديدة']
    };

    function courseCard(c) {
      const [sCls, sTxt] = STATUS[c.status];
      const p = Math.min(100, Math.round(c.progress || 0));
      const mainText = p >= 100 ? 'مراجعة' : p > 0 ? 'متابعة الرحلة' : 'ابدأ الرحلة';
      const mainIco = p >= 100 ? 'rotate-left' : p > 0 ? 'play' : 'rocket';
      const cover = validImage(c.thumbnail)
        ? `<img src="${esc(c.thumbnail)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=&quot;ph&quot;>${esc(c.journeyIcon)}</div>'">`
        : `<div class="ph">${esc(c.journeyIcon)}</div>`;

      const journey = [
        c.journeyName ? `<span>${esc(c.journeyIcon)} ${esc(c.journeyName)}</span>` : '',
        c.stageName ? `<span>${esc(c.stageIcon)} ${esc(c.stageName)}</span>` : ''
      ].join('');

      return `
        <article class="course">
          <div class="course-cover">
            ${cover}
            <span class="badge-status ${sCls}">${sTxt}</span>
            ${c.live?.isLive ? '<span class="badge-live"><i></i> بث مباشر الآن</span>' : ''}
          </div>
          <div class="course-body">
            ${journey ? `<div class="journey">${journey}</div>` : ''}
            <h4>${esc(c.title)}</h4>
            ${c.live?.upcoming ? `<div class="upcoming">⏰ <span>لقاء مباشر قادم بعد <b>${hoursTxt(c.live.upcoming.hours)}</b></span></div>` : ''}
            <div class="progress-row"><span>التقدّم</span><b>${AR(p)}٪</b></div>
            <div class="bar"><i style="width:${p}%"></i></div>
            <div class="meta">
              <span><i class="fas fa-book-open"></i>${lessonsTxt(c.lessons)}</span>
              ${c.minutes ? `<span><i class="fas fa-clock"></i>${durationText(c.minutes)}</span>` : ''}
              <span><i class="fas fa-calendar-check"></i>${lastActivityText(c)}</span>
              ${achievement(p)}
            </div>
            <div class="course-actions">
              <button class="btn btn-gold btn-sm" data-open="${esc(c.id)}"><i class="fas fa-${mainIco}"></i> ${mainText}</button>
              <button class="btn btn-ghost btn-sm" data-details="${esc(c.id)}" aria-label="التفاصيل"><i class="fas fa-circle-info"></i></button>
              <button class="btn btn-wa btn-sm" data-wa="${esc(c.id)}" aria-label="مجموعة الواتساب"><i class="fab fa-whatsapp"></i></button>
            </div>
          </div>
        </article>`;
    }

    function renderCourses() {
      const box = $('coursesList');
      if (!courses.length) {
        box.innerHTML = `
          <div class="empty"><div class="em">💛</div>
            <h4>مرحبًا بك في رحلتك التحويلية</h4>
            <p>لم تُخصَّص لك أي رحلة بعد. تواصل مع الإدارة لتبدأ رحلتك في منظور الفؤاد.</p>
            <button class="btn btn-wa" id="emptyContact"><i class="fab fa-whatsapp"></i> تواصل مع الإدارة</button>
          </div>`;
        $('emptyContact').onclick = () => openExternal(SUPPORT_WHATSAPP);
        return;
      }
      const list = filter === 'all' ? courses : courses.filter(c => c.status === filter);
      box.innerHTML = list.length
        ? list.map(courseCard).join('')
        : `<div class="empty"><div class="em">🍃</div><h4>لا توجد رحلات هنا</h4><p>جرّب تصنيفًا آخر.</p></div>`;
    }

    $('filters').addEventListener('click', e => {
      const b = e.target.closest('.chip');
      if (!b) return;
      filter = b.dataset.filter;
      document.querySelectorAll('.chip').forEach(x => x.classList.toggle('active', x === b));
      renderCourses();
    });

    $('coursesList').addEventListener('click', e => {
      const open = e.target.closest('[data-open]');
      const det = e.target.closest('[data-details]');
      const wa = e.target.closest('[data-wa]');
      if (open) openCourse(open.dataset.open);
      else if (det) showDetails(det.dataset.details);
      else if (wa) openWhatsApp(wa.dataset.wa);
    });

    function openCourse(id) {
      localStorage.setItem('currentCourseId', id);
      location.href = PATHS.course(id);
    }

    function openWhatsApp(id) {
      const c = courses.find(x => x.id === id);
      if (c?.whatsapp) { openExternal(c.whatsapp); return; }
      openSheet(`
        <div class="confirm-ico">💬</div>
        <h3 style="text-align:center">قريبًا</h3>
        <p class="lead">رابط مجموعة الواتساب لهذه الرحلة سيكون متاحًا قريبًا. يمكنك التواصل معنا مباشرة الآن.</p>
        <div class="sheet-actions">
          <button class="btn btn-wa btn-block" id="waSupport"><i class="fab fa-whatsapp"></i> تواصل مع الإدارة</button>
          <button class="btn btn-ghost btn-block" id="waClose">حسنًا</button>
        </div>`);
      $('waSupport').onclick = async () => { await closeSheet(); openExternal(SUPPORT_WHATSAPP); };
      $('waClose').onclick = () => closeSheet();
    }

    function showDetails(id) {
      const c = courses.find(x => x.id === id);
      if (!c) return;
      const objectives = (c.objectives && c.objectives.length)
        ? c.objectives.map(o => `<li>${formatText(o)}</li>`).join('')
        : '<li>استكشاف منظور جديد للحياة</li><li>تطوير المهارات الشخصية</li><li>تحقيق التوازن الداخلي</li>';
      openSheet(`
        <h3>${esc(c.title)}</h3>
        <div class="type">${c.type === 'bundle' ? '🎯 مسار تحويلي متكامل' : '📚 رحلة تدريبية فردية'}</div>
        <div class="block"><strong class="lbl">الوصف</strong>${formatText(c.description)}</div>
        <div class="block green"><strong class="lbl">ما ستتعلّمه</strong><ul>${objectives}</ul></div>
        <div class="facts">
          <div class="fact"><small>المدرّب</small><b>${esc(c.instructor)}</b></div>
          <div class="fact"><small>المحتوى</small><b>${lessonsTxt(c.lessons)}</b></div>
          <div class="fact"><small>المدة حتى الآن</small><b>${durationText(c.minutes)}</b></div>
          <div class="fact"><small>التقدّم</small><b>${AR(Math.round(c.progress))}٪</b></div>
        </div>
        <div class="sheet-actions">
          <button class="btn btn-gold btn-block" id="dOpen">${c.progress >= 100 ? 'مراجعة' : c.progress > 0 ? 'متابعة الرحلة' : 'ابدأ الرحلة'}</button>
          <button class="btn btn-ghost btn-block" id="dClose">إغلاق</button>
        </div>`);
      $('dOpen').onclick = () => {
        closeSheet(true);
        localStorage.setItem('currentCourseId', c.id);
        location.replace(PATHS.course(c.id));
      };
      $('dClose').onclick = () => closeSheet();
    }

    // ═══════════════════════════════════════════════
    // المحفظة والكوبونات
    // ═══════════════════════════════════════════════
    const balance = () => userData?.walletPoints?.balance || 0;

    function renderWalletHead() {
      $('walletPoints').textContent = AR(balance());
      $('walletCash').textContent = AR(balance() * 0.1);
    }

    $('couponAmount').addEventListener('input', () => {
      const v = parseInt($('couponAmount').value);
      if (!v) { $('couponCalc').textContent = ''; return; }
      const need = v * 10;
      $('couponCalc').innerHTML = need > balance()
        ? `<span style="color:#fca5a5">تحتاج ${AR(need)} نقطة — رصيدك ${AR(balance())}</span>`
        : `سيُخصم ${AR(need)} نقطة من رصيدك`;
    });

    let couponsLoading = false;
    async function loadCoupons() {
      if (couponsLoading || !userData) return;
      couponsLoading = true;
      const box = $('couponsList');
      try {
        const s = await db.collection('coupons')
          .where('createdBy', '==', userId)
          .where('source', '==', 'wallet_points')
          .orderBy('createdAt', 'desc')
          .get();
        if (s.empty) {
          box.innerHTML = `<div class="empty" style="padding:28px 16px"><div class="em">🎟️</div><p style="margin:0">لم تُنشئ أي كوبون بعد</p></div>`;
          return;
        }
        box.innerHTML = s.docs.map(d => {
          const c = d.data();
          const used = c.status === 'used';
          let usedDate = '';
          try { usedDate = c.usedAt?.toDate ? c.usedAt.toDate().toLocaleDateString('ar-EG') : ''; } catch (e) {}
          return `
            <div class="coupon ${used ? 'used' : ''}">
              <div class="info">
                <div class="code">${esc(c.code)}</div>
                <small>خصم ${AR(c.value)} جنيه · ${used ? `استُخدم${usedDate ? ' في ' + usedDate : ''}` : 'صالح للاستخدام'}</small>
              </div>
              ${used ? '' : `
              <div class="acts">
                <button class="icon-btn" data-copy="${esc(c.code)}" aria-label="نسخ"><i class="fas fa-copy"></i></button>
                <button class="icon-btn" data-del="${d.id}" data-pts="${c.pointsDeducted || 0}" aria-label="حذف"><i class="fas fa-trash" style="color:#fca5a5"></i></button>
              </div>`}
            </div>`;
        }).join('');
      } catch (e) {
        console.error(e);
        box.innerHTML = `<div class="empty" style="padding:28px 16px"><p style="margin:0">تعذّر تحميل الكوبونات</p></div>`;
      } finally {
        couponsLoading = false;
      }
    }

    $('couponsList').addEventListener('click', e => {
      const cp = e.target.closest('[data-copy]');
      const del = e.target.closest('[data-del]');
      if (cp) copyCode(cp.dataset.copy);
      if (del) deleteCoupon(del.dataset.del, parseInt(del.dataset.pts) || 0);
    });

    async function copyCode(code) {
      try { await navigator.clipboard.writeText(code); toast('تم نسخ الكود: ' + code, 'success'); }
      catch (e) { toast('الكود: ' + code); }
    }

    $('createCouponBtn').addEventListener('click', async () => {
      const amount = parseInt($('couponAmount').value);
      if (!amount || amount < 10) { toast('الحد الأدنى للكوبون ١٠ جنيه', 'error'); return; }
      const need = amount * 10;
      if (balance() < need) { toast(`رصيدك غير كافٍ — تحتاج ${AR(need)} نقطة`, 'error'); return; }

      const ok = await confirmSheet({
        icon: '🎟️',
        title: `كوبون بقيمة ${AR(amount)} جنيه`,
        body: `سيُخصم <b>${AR(need)}</b> نقطة من محفظتك.`,
        okText: 'نعم، أنشئ الكوبون'
      });
      if (!ok) return;

      const btn = $('createCouponBtn');
      btn.disabled = true;
      try {
        const name = userName();
        const code = `${name.split(' ')[0].toUpperCase()}-${Math.random().toString(36).substring(2, 8).toUpperCase()}`;
        await db.collection('coupons').add({
          code, type: 'fixed', value: amount, limit: 1, used: 0,
          source: 'wallet_points', createdBy: userId, createdByName: name,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          pointsDeducted: need, usedBy: null, usedByName: null, usedAt: null, usedInCourse: null,
          status: 'active'
        });
        await db.collection('users').doc(userId).update({
          'walletPoints.balance': firebase.firestore.FieldValue.increment(-need),
          'walletPoints.lastUpdate': firebase.firestore.FieldValue.serverTimestamp()
        });
        userData.walletPoints = userData.walletPoints || {};
        userData.walletPoints.balance = balance() - need;
        $('couponAmount').value = '';
        $('couponCalc').textContent = '';
        renderWalletHead();
        loadCoupons();

        openSheet(`
          <div class="confirm-ico">✨</div>
          <h3 style="text-align:center">تم إنشاء الكوبون</h3>
          <p class="lead">استخدمه عند الحجز أو شاركه مع صديق.</p>
          <div class="big-code">${esc(code)}</div>
          <div class="sheet-actions">
            <button class="btn btn-gold btn-block" id="ccCopy"><i class="fas fa-copy"></i> نسخ الكود</button>
            <button class="btn btn-ghost btn-block" id="ccClose">تم</button>
          </div>`);
        $('ccCopy').onclick = () => copyCode(code);
        $('ccClose').onclick = () => closeSheet();
      } catch (e) {
        console.error(e);
        toast('لم نتمكن من إنشاء الكوبون — حاول مرة أخرى', 'error');
      } finally {
        btn.disabled = false;
      }
    });

    async function deleteCoupon(id, pts) {
      try {
        const doc = await db.collection('coupons').doc(id).get();
        if (!doc.exists) { toast('الكوبون غير موجود', 'error'); loadCoupons(); return; }
        const c = doc.data();
        if (c.status !== 'active') { toast('هذا الكوبون استُخدم بالفعل', 'error'); loadCoupons(); return; }

        const ok = await confirmSheet({
          icon: '🗑️',
          title: 'حذف الكوبون؟',
          body: `<span style="font-family:monospace;color:var(--gold)">${esc(c.code)}</span><br>سيعود <b>${AR(pts)}</b> نقطة إلى محفظتك.`,
          okText: 'نعم، احذف',
          okClass: 'btn-danger'
        });
        if (!ok) return;

        await db.collection('coupons').doc(id).delete();
        await db.collection('users').doc(userId).update({
          'walletPoints.balance': firebase.firestore.FieldValue.increment(pts),
          'walletPoints.lastUpdate': firebase.firestore.FieldValue.serverTimestamp()
        });
        userData.walletPoints = userData.walletPoints || {};
        userData.walletPoints.balance = balance() + pts;
        renderWalletHead();
        loadCoupons();
        toast(`تم الحذف وعاد ${AR(pts)} نقطة إلى محفظتك`, 'success');
      } catch (e) {
        console.error(e);
        toast('حدث خطأ في الحذف — حاول مرة أخرى', 'error');
      }
    }

    // ═══════════════════════════════════════════════
    // حسابي
    // ═══════════════════════════════════════════════
    function renderProfile() {
      const name = userName();
      $('profileName').textContent = name;
      $('profileEmail').textContent = userData?.personalInfo?.email || '';
      $('avatar').textContent = name.trim().charAt(0) || '؟';
    }

    $('contactAdmin').onclick = () => openExternal(SUPPORT_WHATSAPP);

    $('logoutItem').onclick = async () => {
      const ok = await confirmSheet({
        icon: '👋',
        title: 'تسجيل الخروج',
        body: 'هل تريد الخروج من حسابك على هذا الجهاز؟',
        okText: 'نعم، سجّل خروجي',
        okClass: 'btn-danger'
      });
      if (!ok) return;
      await Session.clear();
      location.replace(PATHS.login);
    };

    // تثبيت التطبيق
    let deferredPrompt = null;
    const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
    if (standalone) $('installItem').classList.add('hidden');
    window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; });
    window.addEventListener('appinstalled', () => $('installItem').classList.add('hidden'));
    $('installItem').onclick = async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        return;
      }
      const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
      openSheet(`
        <div class="confirm-ico">📲</div>
        <h3 style="text-align:center">تثبيت التطبيق</h3>
        <p class="lead">${ios
          ? 'من متصفح سفاري اضغط زر المشاركة <i class="fas fa-arrow-up-from-bracket"></i> ثم اختر «إضافة إلى الشاشة الرئيسية».'
          : 'من قائمة المتصفح <i class="fas fa-ellipsis-vertical"></i> اختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».'}</p>
        <div class="sheet-actions"><button class="btn btn-ghost btn-block" id="iClose">حسنًا</button></div>`);
      $('iClose').onclick = () => closeSheet();
    };

    // ═══════════════════════════════════════════════
    // التحديث والاتصال
    // ═══════════════════════════════════════════════
    $('refreshBtn').onclick = () => { loadAll(); if (location.hash === '#wallet') loadCoupons(); };

    // عند الرجوع من صفحة كورس: حدّث التقدّم
    window.addEventListener('pageshow', e => { if (e.persisted) loadAll(); });

    function netState() { $('offlineBar').classList.toggle('hidden', navigator.onLine); }
    window.addEventListener('online', () => { netState(); loadAll(); });
    window.addEventListener('offline', netState);
    netState();

    route();
    loadAll();
  })();
  </script>
</body>
</html>
