<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>لا يوجد اتصال — منظور الفؤاد</title>
  <meta name="theme-color" content="#0f172a">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <main class="auth-screen">
    <div class="auth-inner" style="text-align:center">
      <img class="brand-mark" src="./icons/icon-192.png" alt="" style="width:84px;height:84px;margin:0 auto 22px;border-radius:24px">
      <h1 style="font-size:1.5rem;font-weight:900;color:var(--cream);margin-bottom:8px">لا يوجد اتصال بالإنترنت</h1>
      <p style="color:var(--muted);margin-bottom:26px">رحلاتك محفوظة في انتظارك. تأكد من اتصالك ثم حاول مرة أخرى.</p>
      <button class="btn btn-gold btn-block" onclick="location.reload()">إعادة المحاولة</button>
    </div>
  </main>
  <script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
