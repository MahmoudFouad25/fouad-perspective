<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 تأملات الصاحين - ملاذ الحياري</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --sunrise-orange: #FF9F40;
            --sunrise-yellow: #FFD93D;
            --sunrise-gold: #FFB627;
            --dawn-blue: #4DA3FF;
            --deep-blue: #2E5EAA;
            --bg-dark: #0a0e27;
            --bg-gradient-start: #1a1a2e;
            --bg-gradient-end: #16213e;
            --card-bg: rgba(30, 27, 75, 0.6);
            --card-border: rgba(255, 159, 64, 0.3);
            --text-light: #e0e7ff;
            --text-dim: rgba(255, 255, 255, 0.7);
            --success: #10b981;
            --danger: #ef4444;
            --gold: #FFD700;
        }

        body {
            font-family: 'Tajawal', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            color: var(--text-light);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: 50%;
            transform: translateX(-50%);
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 159, 64, 0.1) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ==== HEADER ==== */
        .page-header {
            text-align: center;
            margin-bottom: 40px;
            padding: 40px 30px;
            background: linear-gradient(135deg, 
                rgba(255, 159, 64, 0.15) 0%, 
                rgba(77, 163, 255, 0.1) 100%
            );
            border-radius: 25px;
            border: 2px solid var(--card-border);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            animation: headerGlow 3s ease-in-out infinite;
        }

        @keyframes headerGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 159, 64, 0.2); }
            50% { box-shadow: 0 0 40px rgba(255, 159, 64, 0.4); }
        }

        .page-header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--sunrise-orange), var(--sunrise-gold), var(--sunrise-yellow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .page-header p {
            color: var(--text-dim);
            font-size: 1.1rem;
        }

        /* ==== FILTERS ==== */
        .filters-section {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .filters-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-btn {
            padding: 12px 25px;
            background: rgba(255, 159, 64, 0.1);
            border: 2px solid var(--card-border);
            border-radius: 12px;
            color: var(--text-light);
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Tajawal', sans-serif;
        }

        .filter-btn:hover {
            background: rgba(255, 159, 64, 0.2);
            border-color: var(--sunrise-orange);
            transform: translateY(-2px);
        }

        .filter-btn.active {
            background: linear-gradient(135deg, var(--sunrise-orange), var(--sunrise-gold));
            border-color: var(--sunrise-orange);
            color: white;
            font-weight: 600;
        }

        .filter-icon {
            margin-left: 8px;
            font-size: 1.2rem;
        }

        /* ==== REFLECTIONS GRID ==== */
        .reflections-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .reflection-card {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .reflection-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 159, 64, 0.3);
            border-color: var(--sunrise-orange);
        }

        .reflection-card.courage {
            border-left: 4px solid #ef4444;
        }

        .reflection-card.mirror {
            border-left: 4px solid #8b5cf6;
        }

        .reflection-card.action {
            border-left: 4px solid #10b981;
        }

        .reflection-card.witness {
            border-left: 4px solid #fbbf24;
        }

        .reflection-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255, 159, 64, 0.2);
        }

        .reflection-user {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, var(--sunrise-orange), var(--sunrise-gold));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: white;
            font-weight: 700;
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-light);
            margin-bottom: 3px;
        }

        .reflection-date {
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .pillar-badge {
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .pillar-badge.courage {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
        }

        .pillar-badge.mirror {
            background: rgba(139, 92, 246, 0.2);
            color: #8b5cf6;
            border: 1px solid #8b5cf6;
        }

        .pillar-badge.action {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid #10b981;
        }

        .pillar-badge.witness {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
            border: 1px solid #fbbf24;
        }

        .reflection-content {
            margin-bottom: 20px;
        }

        .reflection-text {
            color: var(--text-light);
            font-size: 1.05rem;
            line-height: 1.8;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            border-right: 3px solid var(--sunrise-orange);
            font-style: italic;
        }

        .reflection-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 159, 64, 0.2);
        }

        .reflection-actions {
            display: flex;
            gap: 15px;
        }

        .action-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: var(--text-dim);
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .action-btn:hover {
            background: rgba(255, 159, 64, 0.2);
            border-color: var(--sunrise-orange);
            color: var(--sunrise-orange);
            transform: translateY(-2px);
        }

        .action-btn.active {
            background: rgba(255, 159, 64, 0.3);
            border-color: var(--sunrise-orange);
            color: var(--sunrise-orange);
        }

        .support-count {
            font-weight: 600;
        }

        /* ==== LOADING & EMPTY ==== */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-dim);
        }

        .loading-spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 159, 64, 0.3);
            border-top-color: var(--sunrise-orange);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-dim);
        }

        .empty-state i {
            font-size: 5rem;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            color: var(--text-light);
            margin-bottom: 10px;
        }

        /* ==== STATS BAR ==== */
        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .stat-item {
            text-align: center;
            flex: 1;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--sunrise-orange);
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        /* ==== NOTIFICATION ==== */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            z-index: 10000;
            animation: slideIn 0.3s ease;
            max-width: 350px;
        }

        .notification.error {
            background: linear-gradient(135deg, var(--danger), #dc2626);
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* ==== RESPONSIVE ==== */
        @media (max-width: 768px) {
            .reflections-grid {
                grid-template-columns: 1fr;
            }
            
            .page-header h1 {
                font-size: 1.8rem;
            }
            
            .filters-row {
                flex-direction: column;
            }
            
            .filter-btn {
                width: 100%;
            }
            
            .stats-bar {
                flex-direction: column;
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="page-header">
            <h1>🌟 تأملات الصاحين</h1>
            <p>شارك رحلتك وألهم الآخرين في طريق الصحوة</p>
        </div>

        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-value" id="totalReflections">0</div>
                <div class="stat-label">تأمل مشترك</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="activeUsers">0</div>
                <div class="stat-label">صاحي نشط</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="totalSupport">0</div>
                <div class="stat-label">دعم وتشجيع</div>
            </div>
        </div>

        <!-- Filters -->
        <div class="filters-section">
            <div class="filters-row">
                <button class="filter-btn active" onclick="filterByPillar('all')">
                    <span class="filter-icon">🌅</span> كل التأملات
                </button>
                <button class="filter-btn" onclick="filterByPillar('courage')">
                    <span class="filter-icon">🔥</span> الجرأة
                </button>
                <button class="filter-btn" onclick="filterByPillar('mirror')">
                    <span class="filter-icon">🪞</span> المرآة
                </button>
                <button class="filter-btn" onclick="filterByPillar('action')">
                    <span class="filter-icon">🚶</span> الخطوة
                </button>
                <button class="filter-btn" onclick="filterByPillar('witness')">
                    <span class="filter-icon">👥</span> الشهود
                </button>
            </div>
        </div>

        <!-- Loading State -->
        <div class="loading" id="loadingState">
            <div class="loading-spinner"></div>
            <p>جاري تحميل التأملات...</p>
        </div>

        <!-- Reflections Grid -->
        <div class="reflections-grid" id="reflectionsGrid" style="display: none;">
            <!-- سيتم ملؤها بـ JavaScript -->
        </div>

        <!-- Empty State -->
        <div class="empty-state" id="emptyState" style="display: none;">
            <i class="fas fa-heart-broken"></i>
            <h3>لا توجد تأملات بعد</h3>
            <p>كن أول من يشارك تأمله مع المجتمع</p>
        </div>
    </div>

    <script>
       // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDj0bV5gsyRbqpxzW0Zd9wjYmq53-Xdj3w",
            authDomain: "fouad-perspective.firebaseapp.com",
            projectId: "fouad-perspective",
            storageBucket: "fouad-perspective.firebasestorage.app",
            messagingSenderId: "1068763865336",
            appId: "1:1068763865336:web:b791abcd22d536aedd5b0d",
            measurementId: "G-RY1FYVB3Q9"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();

        let currentUser = null;
        let allReflections = [];
        let currentFilter = 'all';
        let usersCache = {}; // Cache لأسماء المستخدمين

        // Initialize
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                loadPublicReflections();
            } else {
                window.location.href = 'login.html';
            }
        });

        // Load Public Reflections
        async function loadPublicReflections() {
            try {
                console.log('🔄 جاري تحميل التأملات العامة...');
                
                // Show loading
                document.getElementById('loadingState').style.display = 'block';
                document.getElementById('reflectionsGrid').style.display = 'none';
                document.getElementById('emptyState').style.display = 'none';
                
                // Get all users
                const usersSnapshot = await db.collection('users').get();
                
                allReflections = [];
                let uniqueUsers = new Set();
                let totalSupportCount = 0;
                
                // Build users cache
usersSnapshot.docs.forEach(doc => {
    const userData = doc.data();
    
    // محاولة الحصول على الاسم من مصادر متعددة
    let userName = 'مستخدم';
    
    // 1️⃣ من displayName أو name
    if (userData.displayName && userData.displayName.trim() !== '') {
        userName = userData.displayName;
    } else if (userData.name && userData.name.trim() !== '') {
        userName = userData.name;
    } 
    // 2️⃣ من firstName + lastName
    else if (userData.firstName && userData.lastName) {
        userName = `${userData.firstName} ${userData.lastName}`;
    } else if (userData.firstName) {
        userName = userData.firstName;
    } 
    // 3️⃣ من payment reference في enrollments 🆕
    else if (userData.enrollments && userData.enrollments.length > 0) {
        try {
            const enrollment = userData.enrollments[0];
            if (enrollment.payment?.installments?.schedule?.[0]?.reference) {
                const reference = enrollment.payment.installments.schedule[0].reference;
                // استخرج الاسم من reference (قبل underscore أو رقم)
                userName = reference.split('_')[0].trim();
            }
        } catch (e) {
            console.warn('⚠️ فشل استخراج الاسم من enrollments');
        }
    }
    // 4️⃣ من الإيميل كخيار أخير
    else if (userData.email) {
        const emailName = userData.email.split('@')[0];
        userName = emailName.replace(/-\d+-.+$/, '').replace(/-/g, ' ');
    }
    
    usersCache[doc.id] = {
        name: userName,
        email: userData.email,
        userId: doc.id
    };
    
    console.log('👤 مستخدم:', doc.id, '- الاسم:', userName);
});
                
                console.log('👥 تم تحميل', Object.keys(usersCache).length, 'مستخدم');
                
                // Loop through all users
                for (const userDoc of usersSnapshot.docs) {
                    const userId = userDoc.id;
                    const userName = usersCache[userId].name;
                    
                    // Get all courses for this user
                    const coursesSnapshot = await db.collection('users')
                        .doc(userId)
                        .collection('awakening_progress')
                        .get();
                    
                    // Loop through all courses
                    for (const courseDoc of coursesSnapshot.docs) {
                        const courseData = courseDoc.data();
                        
                        // Check all 4 pillars
                        const pillars = ['courage', 'mirror', 'action', 'witness'];
                        
                        for (const pillar of pillars) {
                            const reflectionKey = `pillars.${pillar}.reflection`;
                            const reflection = courseData[reflectionKey];
                            
                            // If reflection exists and is public
                            if (reflection && reflection.isPublic && reflection.text) {
                                uniqueUsers.add(userId);
                                
                                const supportCount = reflection.supports ? reflection.supports.length : 0;
                                totalSupportCount += supportCount;
                                
                                allReflections.push({
                                    id: `${userId}_${courseDoc.id}_${pillar}`,
                                    userId: userId,
                                    courseId: courseDoc.id,
                                    userName: userName,
                                    pillar: pillar,
                                    text: reflection.text,
                                    date: reflection.date || reflection.timestamp,
                                    supports: reflection.supports || [],
                                    supportCount: supportCount
                                });
                            }
                        }
                    }
                }
                
                console.log(`✅ تم تحميل ${allReflections.length} تأمل من ${uniqueUsers.size} مستخدم`);
                
                // Update stats
                document.getElementById('totalReflections').textContent = allReflections.length;
                document.getElementById('activeUsers').textContent = uniqueUsers.size;
                document.getElementById('totalSupport').textContent = totalSupportCount;
                
                // Sort by date (newest first)
                allReflections.sort((a, b) => {
                    const dateA = new Date(a.date || 0);
                    const dateB = new Date(b.date || 0);
                    return dateB - dateA;
                });
                
                // Display reflections
                displayReflections(allReflections);
                
            } catch (error) {
                console.error('❌ خطأ في تحميل التأملات:', error);
                showNotification('حدث خطأ في تحميل التأملات', 'error');
            }
        }

        // Display Reflections
        function displayReflections(reflections) {
            const grid = document.getElementById('reflectionsGrid');
            const loading = document.getElementById('loadingState');
            const empty = document.getElementById('emptyState');
            
            loading.style.display = 'none';
            
            if (reflections.length === 0) {
                grid.style.display = 'none';
                empty.style.display = 'block';
                return;
            }
            
            grid.style.display = 'grid';
            empty.style.display = 'none';
            
            const pillarInfo = {
                courage: { icon: '🔥', name: 'الجرأة' },
                mirror: { icon: '🪞', name: 'المرآة' },
                action: { icon: '🚶', name: 'الخطوة' },
                witness: { icon: '👥', name: 'الشهود' }
            };
            
            grid.innerHTML = reflections.map(reflection => {
                const info = pillarInfo[reflection.pillar];
                const initial = reflection.userName.charAt(0).toUpperCase();
                const dateStr = reflection.date ? 
                    new Date(reflection.date).toLocaleDateString('ar-EG', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    }) : 'تاريخ غير محدد';
                
                const isSupported = reflection.supports.includes(currentUser.uid);
                
                // Get supporters names
                const supportersNames = reflection.supports
                    .map(uid => usersCache[uid]?.name || 'مستخدم')
                    .slice(0, 3)
                    .join('، ');
                
                const moreSupporters = reflection.supports.length > 3 ? 
                    ` وآخرون (${reflection.supports.length - 3})` : '';
                
                const supportersTooltip = reflection.supports.length > 0 ? 
                    `title="دعمه: ${supportersNames}${moreSupporters}"` : '';
                
                return `
                    <div class="reflection-card ${reflection.pillar}">
                        <div class="reflection-header">
                            <div class="reflection-user">
                                <div class="user-avatar">${initial}</div>
                                <div class="user-info">
                                    <div class="user-name">${reflection.userName}</div>
                                    <div class="reflection-date">
                                        <i class="fas fa-calendar"></i> ${dateStr}
                                    </div>
                                </div>
                            </div>
                            <div class="pillar-badge ${reflection.pillar}">
                                ${info.icon} ${info.name}
                            </div>
                        </div>
                        
                        <div class="reflection-content">
                            <div class="reflection-text">
                                "${reflection.text}"
                            </div>
                        </div>
                        
                        <div class="reflection-footer">
                            <div class="reflection-actions">
                                <button class="action-btn ${isSupported ? 'active' : ''}" 
                                        onclick="toggleSupport('${reflection.id}')"
                                        ${supportersTooltip}>
                                    <i class="fas fa-heart"></i>
                                    <span class="support-count">${reflection.supportCount}</span>
                                    ${isSupported ? 'دعمت' : 'ادعم'}
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Filter by Pillar
        function filterByPillar(pillarType) {
            currentFilter = pillarType;
            
            // Update button states
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // Find the button that was clicked
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => {
                const btnText = btn.textContent;
                if (
                    (pillarType === 'all' && btnText.includes('كل التأملات')) ||
                    (pillarType === 'courage' && btnText.includes('الجرأة')) ||
                    (pillarType === 'mirror' && btnText.includes('المرآة')) ||
                    (pillarType === 'action' && btnText.includes('الخطوة')) ||
                    (pillarType === 'witness' && btnText.includes('الشهود'))
                ) {
                    btn.classList.add('active');
                }
            });
            
            // Filter reflections
            let filtered = allReflections;
            if (pillarType !== 'all') {
                filtered = allReflections.filter(r => r.pillar === pillarType);
            }
            
            displayReflections(filtered);
        }

        // Toggle Support
        async function toggleSupport(reflectionId) {
            try {
                console.log('❤️ تحديث الدعم للتأمل:', reflectionId);
                
                // Parse reflection ID
                const parts = reflectionId.split('_');
                const userId = parts[0];
                const courseId = parts[1];
                const pillar = parts[2];
                
                const docRef = db.collection('users')
                    .doc(userId)
                    .collection('awakening_progress')
                    .doc(courseId);
                
                const doc = await docRef.get();
                if (!doc.exists) {
                    console.error('❌ المستند غير موجود');
                    return;
                }
                
                const data = doc.data();
                const reflectionKey = `pillars.${pillar}.reflection`;
                const reflection = data[reflectionKey];
                
                if (!reflection) {
                    console.error('❌ التأمل غير موجود');
                    return;
                }
                
                let supports = reflection.supports || [];
                const currentUserSupported = supports.includes(currentUser.uid);
                
                if (currentUserSupported) {
                    // Remove support
                    supports = supports.filter(id => id !== currentUser.uid);
                    showNotification('تم إلغاء الدعم', 'success');
                } else {
                    // Add support
                    supports.push(currentUser.uid);
                    showNotification('شكراً لدعمك! ❤️', 'success');
                }
                
                console.log('💾 حفظ التحديث... الداعمين الجدد:', supports.length);
                
                // Update in Firebase
                await docRef.set({
                    [reflectionKey]: {
                        ...reflection,
                        supports: supports
                    }
                }, { merge: true });
                
                console.log('✅ تم التحديث بنجاح');
                
                // Update the reflection in memory
                const reflectionInList = allReflections.find(r => r.id === reflectionId);
                if (reflectionInList) {
                    reflectionInList.supports = supports;
                    reflectionInList.supportCount = supports.length;
                }
                
                // Re-display with current filter
                let filtered = allReflections;
                if (currentFilter !== 'all') {
                    filtered = allReflections.filter(r => r.pillar === currentFilter);
                }
                displayReflections(filtered);
                
            } catch (error) {
                console.error('❌ خطأ في تحديث الدعم:', error);
                showNotification('حدث خطأ. حاول مرة أخرى', 'error');
            }
        }

        // Show Notification
        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i>
                ${message}
            `;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }
    </script>
</body>
