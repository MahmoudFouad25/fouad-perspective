<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة مقياس الفؤاد</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F2ED;--bg2:#EDEAE4;--card:#FFF;--txt:#2C2420;--txt2:#6B5D52;--mu:#A89888;--grn:#1B4332;--grn2:#2D6A4F;--grn-b:rgba(45,106,79,0.06);--gld:#C8963E;--gld-b:rgba(200,150,62,0.06);--red:#B44040;--red-b:rgba(180,64,64,0.06);--bdr:rgba(44,36,32,0.1);--fb:'Noto Naskh Arabic',serif;--fd:'Amiri',serif;--r:10px}
*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--txt);font-family:var(--fb);font-size:14px;line-height:1.6}
.app{display:flex;min-height:100vh}

/* Sidebar */
.side{width:260px;background:var(--card);border-left:.5px solid var(--bdr);position:fixed;top:0;bottom:0;right:0;overflow-y:auto;z-index:10}
.main{flex:1;margin-right:260px;padding:18px 24px}
.s-hd{padding:16px;border-bottom:.5px solid var(--bdr);display:flex;align-items:center;gap:8px}
.s-logo{width:32px;height:32px;border-radius:8px;background:var(--grn-b);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:18px;font-weight:700;color:var(--grn)}
.s-t{font-size:13px;font-weight:600}
.s-st{font-size:11px;color:var(--mu)}
.s-nav{padding:10px}
.sn-i{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--txt2);transition:all .15s;margin-bottom:2px}
.sn-i:hover{background:var(--bg)}
.sn-i.act{background:var(--grn-b);color:var(--grn);font-weight:600}
.sn-sec{padding:3px 12px;font-size:11px;color:var(--mu);font-weight:600;margin-top:10px;margin-bottom:3px}
.sn-m{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:12px;color:var(--txt2);transition:all .15s;margin-bottom:1px}
.sn-m:hover{background:var(--bg)}
.sn-m.act{background:var(--gld-b);color:var(--gld);font-weight:600}
.sn-m .ico{font-size:14px}
.sn-mod{padding:5px 12px 5px 36px;font-size:11px;color:var(--mu);cursor:pointer;border-radius:6px;transition:all .15s;display:flex;align-items:center;gap:6px}
.sn-mod:hover{background:var(--bg);color:var(--txt2)}
.sn-mod.act{color:var(--grn);font-weight:600}
.sn-mod .dot{width:6px;height:6px;border-radius:50%;background:var(--bdr);flex-shrink:0}
.sn-mod.has-file .dot{background:var(--grn2)}
.sn-mod.no-file .dot{background:var(--red)}

/* Top */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:14px;border-bottom:.5px solid var(--bdr);flex-wrap:wrap;gap:8px}
.top h1{font-size:16px;font-weight:600}
.top-a{display:flex;gap:6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border:.5px solid var(--bdr);border-radius:8px;background:var(--card);color:var(--txt2);font-family:var(--fb);font-size:12px;cursor:pointer;transition:all .15s;font-weight:500}
.btn:hover{background:var(--bg);color:var(--txt)}
.btn-p{background:var(--grn);color:#F8F3EC;border-color:var(--grn)}
.btn-p:hover{background:#163a2b}
.btn-g{background:var(--gld);color:#fff;border-color:var(--gld)}
.btn-g:hover{background:#a67a30}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.st{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:0 1px 6px rgba(0,0,0,.03)}
.st-l{font-size:11px;color:var(--mu);margin-bottom:3px}
.st-v{font-size:22px;font-weight:600}

/* Cards */
.cl{background:var(--card);border-radius:var(--r);box-shadow:0 1px 6px rgba(0,0,0,.03);overflow:hidden;margin-bottom:16px}
.cl-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:.5px solid var(--bdr)}
.cl-t{font-size:14px;font-weight:600}
.ci{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:.5px solid var(--bdr);cursor:pointer;transition:background .15s}
.ci:hover{background:var(--bg)}
.ci:last-child{border-bottom:none}
.ci-n{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.ci-info{flex:1}
.ci-name{font-size:13px;font-weight:500}
.ci-meta{font-size:10px;color:var(--mu);margin-top:1px}
.ci-badge{font-size:10px;padding:2px 8px;border-radius:8px;font-weight:500}
.ci-badge.ok{background:var(--grn-b);color:var(--grn2)}
.ci-badge.no{background:var(--red-b);color:var(--red)}

/* Editor */
.ed{background:var(--card);border-radius:var(--r);box-shadow:0 1px 6px rgba(0,0,0,.03);overflow:hidden;margin-bottom:16px}
.ed-sec{padding:18px;border-bottom:.5px solid var(--bdr)}
.ed-sec:last-child{border-bottom:none}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11px;color:var(--mu);margin-bottom:3px;font-weight:500}
.fld input,.fld select{width:100%;padding:8px 12px;border:.5px solid var(--bdr);border-radius:8px;font-family:var(--fb);font-size:13px;background:var(--bg);color:var(--txt)}
.fld input:focus{outline:none;border-color:var(--grn)}
.fld .hint{font-size:10px;color:var(--mu);margin-top:3px}

/* Results table */
table{width:100%;border-collapse:collapse}
th,td{padding:10px 14px;text-align:right;border-bottom:.5px solid var(--bdr);font-size:12px}
th{background:var(--bg);color:var(--mu);font-weight:600;font-size:11px}
td{color:var(--txt2)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(70px);background:var(--grn);color:#F8F3EC;padding:10px 20px;border-radius:10px;font-size:12px;font-weight:500;z-index:600;transition:transform .3s}
.toast.on{transform:translateX(-50%) translateY(0)}
.saving{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:var(--gld);color:#fff;padding:6px 16px;border-radius:20px;font-size:11px;font-weight:600;z-index:600;opacity:0;transition:opacity .3s}
.saving.on{opacity:1}

@media(max-width:768px){.side{display:none}.main{margin-right:0}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <div class="main" id="mainArea"></div>
</div>
<div class="toast" id="toast"></div>
<div class="saving" id="saving">جاري الحفظ...</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyDj0bV5gsyRbqpxzW0Zd9wjYmq53-Xdj3w",authDomain:"fouad-perspective.firebaseapp.com",projectId:"fouad-perspective",storageBucket:"fouad-perspective.firebasestorage.app",messagingSenderId:"1068763865336",appId:"1:1068763865336:web:b791abcd22d536aedd5b0d"});
const db=firebase.firestore();
const toAr=n=>String(n).replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);

/* ═══════════════════════════════════════════════════════════
   MODULE CONFIG (same as viewer)
   ═══════════════════════════════════════════════════════════ */
const MIRRORS=[
  {id:'motivation',name:'مرآة الدوافع',icon:'💫',modules:[
    {id:'module-1',title:'قوة الهمة والعزيمة',types:[1,8,9],htmlFile:'fouad-assessment-module-1.html'},
    {id:'module-2',title:'قوة الأنس والقرب',types:[2,3,4],htmlFile:''},
    {id:'module-3',title:'قوة اليقين والبيان',types:[5,6,7],htmlFile:''}
  ]},
  {id:'attention',name:'مرآة الانتباه',icon:'👁',modules:[
    {id:'module-4',title:'الانتباه الداخلي',types:[1,4,5],htmlFile:''},
    {id:'module-5',title:'الانتباه الخارجي',types:[2,7,8],htmlFile:''},
    {id:'module-6',title:'الانتباه المتأرجح',types:[3,6,9],htmlFile:''}
  ]},
  {id:'emotions',name:'مرآة المشاعر',icon:'💗',modules:[
    {id:'module-7',title:'الاحتواء',types:[1,3,5],htmlFile:''},
    {id:'module-8',title:'التعبير الكامل',types:[4,6,8],htmlFile:''},
    {id:'module-9',title:'التحويل',types:[2,7,9],htmlFile:''}
  ]},
  {id:'behavior',name:'مرآة السلوك',icon:'⚡',modules:[
    {id:'module-10',title:'الامتثال',types:[1,2,6],htmlFile:''},
    {id:'module-11',title:'الحزم',types:[3,7,8],htmlFile:''},
    {id:'module-12',title:'الانسحاب',types:[4,5,9],htmlFile:''}
  ]},
  {id:'perception',name:'مرآة النموذج الإدراكي',icon:'🧠',modules:[
    {id:'module-13',title:'التنفيذي',types:[1,3,8],htmlFile:''},
    {id:'module-14',title:'الابتكاري',types:[4,5,7],htmlFile:''},
    {id:'module-15',title:'التقييمي',types:[2,6,9],htmlFile:''}
  ]},
  {id:'beliefs',name:'مرآة المعتقدات',icon:'🔑',modules:[
    {id:'module-16',title:'الصيرورة',types:[1,3,7],htmlFile:''},
    {id:'module-17',title:'الانتماء',types:[2,6,9],htmlFile:''},
    {id:'module-18',title:'الكينونة',types:[4,5,8],htmlFile:''}
  ]},
  {id:'wounds',name:'مرآة الجروح',icon:'🩹',modules:[
    {id:'module-19',title:'الاحتياج والعلاقات',types:[2,5,8],htmlFile:''},
    {id:'module-20',title:'الاتصال والهوية',types:[3,6,9],htmlFile:''},
    {id:'module-21',title:'الواقع والكمال',types:[1,4,7],htmlFile:''}
  ]}
];

const TYPE_NAMES={1:'العبقرية المتألقة',2:'الحبّ المنصهر',3:'الإنسان الحقيقي',4:'الهويّة الحقيقيّة',5:'العقل الفيّاض',6:'الإرادة المتجسّدة',7:'الحرّية الداخلية',8:'القوة المشتعلة',9:'الحبّ الخالص'};

// Firestore config doc — stores htmlFile overrides
let configData = {}; // {module-1: {htmlFile:'...'}, ...}
let curView = 'dash'; // dash | mirror-X | module-X | results
let curMirrorIdx = -1;
let curModuleId = '';
let allUserResults = []; // loaded from Firebase

/* ═══════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════ */
async function init() {
  showSaving();
  try {
    const doc = await db.collection('fouad_assessment_config').doc('modules').get();
    if (doc.exists) configData = doc.data();
    // Apply overrides
    MIRRORS.forEach(m => m.modules.forEach(mod => {
      if (configData[mod.id] && configData[mod.id].htmlFile !== undefined) {
        mod.htmlFile = configData[mod.id].htmlFile;
      }
    }));
  } catch(e) { console.error(e); }
  hideSaving();
  buildSide();
  showDash();
}

async function saveConfig() {
  showSaving();
  try {
    // Build config from current state
    const cfg = {};
    MIRRORS.forEach(m => m.modules.forEach(mod => {
      cfg[mod.id] = {htmlFile: mod.htmlFile || '', title: mod.title};
    }));
    await db.collection('fouad_assessment_config').doc('modules').set(cfg);
    configData = cfg;
    toast('✅ تم الحفظ');
  } catch(e) {
    console.error(e);
    toast('⚠️ خطأ في الحفظ');
  }
  hideSaving();
  buildSide();
}

/* ═══════════════════════════════════════════════════════════
   SIDEBAR
   ═══════════════════════════════════════════════════════════ */
function buildSide() {
  let h = `<div class="s-hd"><div class="s-logo">ف</div><div><div class="s-t">إدارة المقياس</div><div class="s-st">مقياس الفؤاد</div></div></div>
  <div class="s-nav">
    <div class="sn-i ${curView==='dash'?'act':''}" onclick="showDash()">📊 لوحة التحكم</div>
    <div class="sn-i ${curView==='results'?'act':''}" onclick="showResults()">👥 نتائج العملاء</div>
    <div class="sn-sec">المرايا السبع</div>`;

  MIRRORS.forEach((m, mi) => {
    const isOpen = curView === 'mirror-'+mi || (curModuleId && m.modules.some(mod => mod.id === curModuleId));
    h += `<div class="sn-m ${isOpen?'act':''}" onclick="showMirror(${mi})"><span class="ico">${m.icon}</span><span>${m.name}</span></div>`;
    if (isOpen) {
      m.modules.forEach(mod => {
        const hasFile = mod.htmlFile && mod.htmlFile.length > 0;
        h += `<div class="sn-mod ${curModuleId===mod.id?'act':''} ${hasFile?'has-file':'no-file'}" onclick="editModule('${mod.id}')">
          <span class="dot"></span>${mod.title}
        </div>`;
      });
    }
  });

  h += `<div style="padding:12px"><a href="fouad-assessment-view.html" target="_blank" class="btn" style="width:100%;justify-content:center">👁 معاينة المقياس</a></div></div>`;
  document.getElementById('side').innerHTML = h;
}

/* ═══════════════════════════════════════════════════════════
   DASHBOARD
   ═══════════════════════════════════════════════════════════ */
function showDash() {
  curView = 'dash'; curModuleId = ''; buildSide();
  const total = 21;
  let ready = 0;
  MIRRORS.forEach(m => m.modules.forEach(mod => { if (mod.htmlFile) ready++; }));

  let h = `<div class="top"><h1>📊 لوحة تحكم مقياس الفؤاد</h1></div>
  <div class="stats">
    <div class="st"><div class="st-l">إجمالي المحطات</div><div class="st-v">${toAr(total)}</div></div>
    <div class="st"><div class="st-l">محطات جاهزة</div><div class="st-v" style="color:var(--grn2)">${toAr(ready)}</div></div>
    <div class="st"><div class="st-l">محطات قيد الإعداد</div><div class="st-v" style="color:var(--gld)">${toAr(total - ready)}</div></div>
    <div class="st"><div class="st-l">المرايا</div><div class="st-v">${toAr(7)}</div></div>
  </div>`;

  h += '<div class="cl"><div class="cl-hd"><span class="cl-t">المرايا السبع</span></div>';
  MIRRORS.forEach((m, mi) => {
    const readyCount = m.modules.filter(mod => mod.htmlFile).length;
    h += `<div class="ci" onclick="showMirror(${mi})">
      <div class="ci-n" style="font-size:18px">${m.icon}</div>
      <div class="ci-info"><div class="ci-name">${m.name}</div><div class="ci-meta">${toAr(readyCount)} من ٣ محطات جاهزة</div></div>
      <span class="ci-badge ${readyCount===3?'ok':'no'}">${readyCount===3?'مكتملة':'قيد الإعداد'}</span>
    </div>`;
  });
  h += '</div>';

  document.getElementById('mainArea').innerHTML = h;
}

/* ═══════════════════════════════════════════════════════════
   MIRROR VIEW
   ═══════════════════════════════════════════════════════════ */
function showMirror(mi) {
  curView = 'mirror-'+mi; curMirrorIdx = mi; curModuleId = ''; buildSide();
  const m = MIRRORS[mi];

  let h = `<div class="top"><h1>${m.icon} ${m.name}</h1></div>
  <div class="cl"><div class="cl-hd"><span class="cl-t">المحطات الثلاث</span></div>`;

  m.modules.forEach((mod, i) => {
    const hasFile = mod.htmlFile && mod.htmlFile.length > 0;
    h += `<div class="ci" onclick="editModule('${mod.id}')">
      <div class="ci-n" style="background:${hasFile?'var(--grn)':'var(--bg2)'};color:${hasFile?'#F8F3EC':'var(--mu)'}; border-radius:6px;font-size:11px">${toAr(i+1)}</div>
      <div class="ci-info">
        <div class="ci-name">${mod.title}</div>
        <div class="ci-meta">يقارن: ${mod.types.map(t=>TYPE_NAMES[t]).join(' + ')}</div>
      </div>
      <span class="ci-badge ${hasFile?'ok':'no'}">${hasFile?'جاهز':'بدون ملف'}</span>
    </div>`;
  });

  h += '</div>';
  document.getElementById('mainArea').innerHTML = h;
}

/* ═══════════════════════════════════════════════════════════
   MODULE EDITOR
   ═══════════════════════════════════════════════════════════ */
function editModule(modId) {
  curModuleId = modId; buildSide();
  let mod = null, mirror = null;
  MIRRORS.forEach(m => m.modules.forEach(md => { if (md.id === modId) { mod = md; mirror = m; } }));
  if (!mod) return;

  let h = `<div class="top">
    <h1><span style="color:var(--mu);cursor:pointer" onclick="showMirror(${MIRRORS.indexOf(mirror)})">${mirror.name} ›</span> ${mod.title}</h1>
    <div class="top-a">
      <button class="btn btn-p" onclick="saveConfig()">💾 حفظ</button>
      ${mod.htmlFile ? `<a href="${mod.htmlFile}" target="_blank" class="btn">👁 معاينة</a>` : ''}
    </div>
  </div>
  <div class="ed">
    <div class="ed-sec">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div class="fld"><label>معرّف المودويل</label><input value="${mod.id}" readonly style="opacity:.5"></div>
        <div class="fld"><label>المرآة</label><input value="${mirror.name}" readonly style="opacity:.5"></div>
      </div>
      <div class="fld"><label>عنوان المودويل</label><input value="${mod.title}" onchange="updMod('${modId}','title',this.value)"></div>
      <div class="fld">
        <label>📄 ملف الصفحة (HTML)</label>
        <input value="${mod.htmlFile||''}" placeholder="مثال: fouad-assessment-module-1.html" onchange="updMod('${modId}','htmlFile',this.value)" style="font-family:monospace;direction:ltr;text-align:left">
        <div class="hint">💡 رابط صفحة HTML المصممة للمودويل — تظهر في iframe للعميل</div>
      </div>
      <div class="fld"><label>الطبائع المقارَنة</label><input value="${mod.types.map(t=>TYPE_NAMES[t]).join(' ، ')}" readonly style="opacity:.6"></div>
    </div>
  </div>`;

  document.getElementById('mainArea').innerHTML = h;
}

function updMod(modId, key, val) {
  MIRRORS.forEach(m => m.modules.forEach(mod => {
    if (mod.id === modId) mod[key] = val;
  }));
  clearTimeout(window._autoSave);
  window._autoSave = setTimeout(() => saveConfig(), 1500);
}

/* ═══════════════════════════════════════════════════════════
   RESULTS VIEW — Show all users who took the assessment
   ═══════════════════════════════════════════════════════════ */
async function showResults() {
  curView = 'results'; curModuleId = ''; buildSide();
  document.getElementById('mainArea').innerHTML = '<div style="padding:40px;text-align:center;color:var(--mu)">جاري التحميل...</div>';

  try {
    const snap = await db.collection('fouad_assessment_progress').get();
    allUserResults = [];
    snap.forEach(doc => allUserResults.push({uid: doc.id, ...doc.data()}));
  } catch(e) {
    console.error(e);
    allUserResults = [];
  }

  let h = `<div class="top"><h1>👥 نتائج العملاء</h1><div class="top-a"><span class="btn">${toAr(allUserResults.length)} عميل</span></div></div>`;

  if (allUserResults.length === 0) {
    h += '<div style="padding:40px;text-align:center;color:var(--mu)">لا توجد نتائج بعد</div>';
  } else {
    h += '<div class="cl"><table><thead><tr><th>المعرّف</th><th>المحطات المكتملة</th><th>آخر نشاط</th><th>إجراء</th></tr></thead><tbody>';

    allUserResults.forEach(u => {
      const completed = u.modules ? Object.values(u.modules).filter(m => m.completed).length : 0;
      const lastAct = u.lastActivity ? new Date(u.lastActivity).toLocaleDateString('ar-EG') : '—';

      h += `<tr>
        <td style="font-family:monospace;font-size:11px;direction:ltr">${u.uid.substring(0,12)}...</td>
        <td><span style="color:${completed>0?'var(--grn2)':'var(--mu)'};font-weight:600">${toAr(completed)}</span> / ٢١</td>
        <td>${lastAct}</td>
        <td><button class="btn" onclick="viewUserDetail('${u.uid}')" style="font-size:11px">📋 التفاصيل</button></td>
      </tr>`;
    });

    h += '</tbody></table></div>';
  }

  document.getElementById('mainArea').innerHTML = h;
}

function viewUserDetail(userId) {
  const u = allUserResults.find(r => r.uid === userId);
  if (!u) return;

  let h = `<div class="top"><h1><span style="color:var(--mu);cursor:pointer" onclick="showResults()">النتائج ›</span> عميل ${userId.substring(0,8)}</h1></div>`;

  if (!u.modules || Object.keys(u.modules).length === 0) {
    h += '<div style="padding:40px;text-align:center;color:var(--mu)">لا توجد إجابات بعد</div>';
  } else {
    h += '<div class="cl"><table><thead><tr><th>المودويل</th><th>الحالة</th><th>الطابع الأعلى</th><th>الاتزان</th><th>الإفراط</th><th>التفريط</th></tr></thead><tbody>';

    Object.entries(u.modules).forEach(([modId, data]) => {
      const topName = data.results && data.results.topTypeName ? data.results.topTypeName : '—';
      const eq = data.results && data.results.spectrumPercentages ? data.results.spectrumPercentages.eq + '٪' : '—';
      const ex = data.results && data.results.spectrumPercentages ? data.results.spectrumPercentages.ex + '٪' : '—';
      const df = data.results && data.results.spectrumPercentages ? data.results.spectrumPercentages.df + '٪' : '—';

      h += `<tr>
        <td>${modId}</td>
        <td><span style="color:${data.completed?'var(--grn2)':'var(--gld)'}">${data.completed?'✅ مكتمل':'📝 مسودة'}</span></td>
        <td style="font-weight:600">${topName}</td>
        <td style="color:var(--grn2)">${eq}</td>
        <td style="color:var(--gld)">${ex}</td>
        <td style="color:var(--mu)">${df}</td>
      </tr>`;
    });

    h += '</tbody></table></div>';

    // Export button
    h += `<div style="margin-top:16px"><button class="btn btn-g" onclick="exportUserData('${userId}')">📤 تصدير البيانات للتقرير</button></div>`;
  }

  document.getElementById('mainArea').innerHTML = h;
}

function exportUserData(userId) {
  const u = allUserResults.find(r => r.uid === userId);
  if (!u) return;
  const json = JSON.stringify(u, null, 2);
  const blob = new Blob([json], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `fouad-assessment-${userId.substring(0,8)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('✅ تم التصدير');
}

   UTILS
   ═══════════════════════════════════════════════════════════ */
function showSaving(){document.getElementById('saving').classList.add('on')}
function hideSaving(){document.getElementById('saving').classList.remove('on')}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}

init();
</script>
