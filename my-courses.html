    <style>
        :root {
            /* ألوان الأشواق التسعة من الهوية */
           /* هوية مرحلة النداء - ملاذ الحياري */

/* الألوان الأساسية */
--primary-blue: #3b82f6;
--primary-blue-dark: #2563eb;
--primary-blue-light: #60a5fa;
--success-green: #10b981;
--success-green-dark: #059669;
--golden: #fbbf24;
--golden-dark: #f59e0b;
--golden-light: #fde68a;

/* ألوان الخلفيات */
--primary-bg: #0f172a;
--secondary-bg: #1a2332;
--card-bg: #1e293b;
--card-hover: #293548;

/* ألوان النصوص */
--text-primary: #ffffff;
--text-secondary: #94a3b8;
--text-accent: #FFF3CD;

/* الحدود والتوهجات */
--border: rgba(59, 130, 246, 0.2);
--border-hover: rgba(59, 130, 246, 0.4);
--glow-blue: rgba(59, 130, 246, 0.4);
--glow-green: rgba(16, 185, 129, 0.4);
--glow-gold: rgba(251, 191, 36, 0.5);

/* التحولات */
--transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

       body {
    font-family: 'Tajawal', sans-serif;
    background-color: var(--primary-bg);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
               max-width: 100vw;

    position: relative;
           
}

        html {
    
    max-width: 100%;
}

* {
    max-width: 100vw;
    
}

        /* الخلفية الكونية */
       .cosmic-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    background: linear-gradient(180deg, 
        #0a0e1b 0%,
        #0f172a 30%,
        #1a2332 60%,
        #0f172a 100%);
    background-image:
        radial-gradient(ellipse 900px 700px at top center, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse 700px 600px at bottom center, rgba(16, 185, 129, 0.12) 0%, transparent 50%),
        radial-gradient(circle 500px at 80% 40%, rgba(251, 191, 36, 0.08) 0%, transparent 60%);
}

        .islamic-pattern {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        /* نجوم متحركة للخلفية */
.stars-container {
    position: fixed;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: -1;
}

.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    animation: twinkle 4s infinite;
}

.star:nth-child(odd) {
    animation-delay: 2s;
}

@keyframes twinkle {
    0%, 100% { opacity: 0; }
    50% { opacity: 1; }
}

        
       /* ═══════════════════════════════════════
   جزيئات سماء الأعماق
   ═══════════════════════════════════════ */

.depth-particles {
    position: fixed;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
}

.depth-particle {
    position: absolute;
    width: 3px;
    height: 3px;
    background: radial-gradient(circle, rgba(255, 215, 0, 0.8), transparent);
    border-radius: 50%;
    animation: floatFromDepth 12s ease-in-out infinite;
    opacity: 0;
    box-shadow: 0 0 6px rgba(255, 215, 0, 0.6);
}

/* تنويع الألوان */
.depth-particle:nth-child(3n) {
    background: radial-gradient(circle, rgba(59, 130, 246, 0.7), transparent);
    box-shadow: 0 0 6px rgba(59, 130, 246, 0.5);
}

.depth-particle:nth-child(3n+1) {
    background: radial-gradient(circle, rgba(251, 191, 36, 0.6), transparent);
    box-shadow: 0 0 6px rgba(251, 191, 36, 0.4);
}

.depth-particle:nth-child(3n+2) {
    background: radial-gradient(circle, rgba(16, 185, 129, 0.5), transparent);
    box-shadow: 0 0 6px rgba(16, 185, 129, 0.4);
}

/* الحركة من الأعماق للأعلى */
@keyframes floatFromDepth {
    0% {
        bottom: -20px;
        transform: translateX(0) scale(0.3);
        opacity: 0;
    }
    10% {
        opacity: 0.8;
    }
    50% {
        opacity: 1;
        transform: translateX(var(--drift)) scale(1);
    }
    90% {
        opacity: 0.6;
    }
    100% {
        bottom: 110%;
        transform: translateX(var(--drift)) scale(0.5);
        opacity: 0;
    }
}

/* موجات ضوئية أفقية خفيفة */
.cosmic-bg::after {
    content: '';
    position: absolute;
    width: 100%;
    height: 2px;
    background: linear-gradient(90deg, 
        transparent 0%, 
        rgba(59, 130, 246, 0.3) 50%, 
        transparent 100%);
    top: 30%;
    animation: waveMove 8s ease-in-out infinite;
    opacity: 0.4;
}

@keyframes waveMove {
    0%, 100% {
        transform: translateX(-100%);
        opacity: 0;
    }
    50% {
        transform: translateX(100%);
        opacity: 0.6;
    }
}

        
/* ═══════════════════════════════════════
   دوائر الطاقة المتوسعة
   ═══════════════════════════════════════ */

.energy-circles-container {
    position: fixed;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
}

.energy-circle {
    position: absolute;
    border-radius: 50%;
    border: 1px solid;
    animation: expandEnergyCircle 8s ease-out infinite;
    opacity: 0;
}

/* دوائر ذهبية */
.energy-circle.golden {
    border-color: rgba(251, 191, 36, 0.6);
}

/* دوائر زرقاء */
.energy-circle.blue {
    border-color: rgba(59, 130, 246, 0.5);
}

/* دوائر خضراء */
.energy-circle.green {
    border-color: rgba(16, 185, 129, 0.4);
}

@keyframes expandEnergyCircle {
    0% {
        width: 20px;
        height: 20px;
        opacity: 0;
        border-width: 3px;
    }
    15% {
        opacity: 0.8;
    }
    50% {
        opacity: 0.6;
        border-width: 2px;
    }
    100% {
        width: 800px;
        height: 800px;
        opacity: 0;
        border-width: 1px;
    }
}

/* دوائر ثابتة خفيفة حول المحتوى الرئيسي */
.content-container::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    max-width: 1500px;
    height: 90%;
    border: 1px solid rgba(59, 130, 246, 0.1);
    border-radius: 50%;
    pointer-events: none;
    animation: breatheCircle 6s ease-in-out infinite;
}

@keyframes breatheCircle {
    0%, 100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.3;
    }
    50% {
        transform: translate(-50%, -50%) scale(1.05);
        opacity: 0.6;
    }
}
        /* Header المطور */
      .header {

        rgba(30, 41, 59, 0.98) 0%, 
        rgba(15, 23, 42, 0.95) 100%);
       
    top: 0;

    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);

}

        .header-content {

    margin: 0 auto;
    padding: 0 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;

    width: 100%; /* إضافة */
}

        .header-title {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        
        h1 {

        /* Stats Cards */
        .header-stats {

        }

        .stat-item {
    text-align: center;
    position: relative;

        /* Hero Banner */
        .hero-banner {

}

    );

}

@keyframes waveFlow {
    0% { background-position: 0% 0%; }
    100% { background-position: 200% 0%; }
}

        @keyframes rainbowSlide {
            0% { background-position: 0% 0%; }
            100% { background-position: 200% 0%; }
        }

        .hero-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
            text-align: center;
        }

        .motivational-quote {
    font-size: 1.9rem;
    color: var(--text-accent);

}

        .progress-summary {

        }

        .summary-item {
            display: flex;
            align-items: center;

        }

       .summary-icon {
    width: 45px;

    background: linear-gradient(135deg, var(--primary-blue) 0%, var(--primary-blue-dark) 100%);
    border-radius: 50%;

    justify-content: center;

}

        .summary-text {

       .summary-value {

}

        .summary-label {
            font-size: 0.9rem;

        /* Content Container */
        .content-container {
    max-width: 1400px;
    margin: 3rem auto 0;
    padding: 0 2rem 4rem;
                position: relative;
    z-index: 2;

}

        /* Courses Grid المطورة */
        .courses-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 2rem;
    margin-bottom: 3rem;
    padding: 1rem;
}

        .course-card {
    background: rgba(30, 41, 59, 0.6);
    backdrop-filter: blur(15px);
    border-radius: 20px;
    overflow: hidden;
    border: 2px solid rgba(59, 130, 246, 0.2);
    transition: all 0.3s ease;
    position: relative;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
}

      .course-card::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, 
        rgba(59, 130, 246, 0.1) 0%, 
        transparent 70%);
    opacity: 0;
    transition: var(--transition);
    pointer-events: none;
}
     .course-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 20px 50px rgba(59, 130, 246, 0.4);
    border-color: var(--primary-blue);
}

.course-card:hover::before {
    opacity: 1;
}

        .course-header {
    position: relative;
    height: 200px;
    background: linear-gradient(180deg, 
        rgba(59, 130, 246, 0.15) 0%, 
        rgba(30, 41, 59, 0.9) 100%);
    overflow: hidden;
}
        .course-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: var(--transition);
    background: linear-gradient(135deg, 
        rgba(59, 130, 246, 0.1), 
        rgba(16, 185, 129, 0.05));
}

/* في حالة عدم تحميل الصورة */
.course-image[src=""],
.course-image:not([src]) {
    display: none;
}

        .course-card:hover .course-image {
            transform: scale(1.1);
        }

      .default-course-image {
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, 
        rgba(59, 130, 246, 0.8) 0%,

    align-items: center;
    justify-content: center;
    font-size: 4rem;
    color: white;
    position: relative;
}

      
      .course-type-badge {
    position: absolute;

    right: 1rem;
    padding: 0.5rem 1rem;
    border-radius: 20px;
    font-size: 0.8rem;

       .status-completed {

    box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);

        .status-pending {

}

        /* Progress Overlay */
        .course-progress-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(10, 22, 40, 0.95) 0%, transparent 100%);
            padding: 1.5rem;
            transform: translateY(100%);
            transition: var(--transition);
        }

        .course-card:hover .course-progress-overlay {
            transform: translateY(0);
        }

      .progress-bar {
    width: 100%;
    height: 10px;
    background: rgba(15, 23, 42, 0.6);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 0.8rem;
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
}

       .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, 
        var(--primary-blue) 0%, 
        var(--success-green) 100%);
    border-radius: 10px;
    transition: width 1s ease;
    position: relative;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
}

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .progress-text {
            color: var(--gold-light);
            font-size: 0.9rem;
            text-align: center;
            font-weight: 600;
        }

        /* Course Content */
      .course-content {
    padding: 2rem;
    position: relative;
    z-index: 1;
    background: linear-gradient(180deg, 
        transparent 0%, 
        rgba(15, 23, 42, 0.3) 100%);
}

       .course-title {
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 0.8rem;
    color: var(--text-primary);

    overflow: hidden;

.course-card:hover .course-title {

}

        .course-description {

        .course-meta {

            margin-bottom: 1.5rem;
        }

       .meta-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--text-secondary);
    font-size: 0.9rem;
    transition: var(--transition);
}

.course-card:hover .meta-item {

}

       .meta-item i {
    color: var(--primary-blue);

    transition: var(--transition);
}

.course-card:hover .meta-item i {
    color: var(--success-green);

}

        /* Achievement Badges */

            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

       .achievement-badge {

        rgba(245, 158, 11, 0.1) 100%);

    border-radius: 20px;

    color: var(--golden);

}

.achievement-badge:hover {
    background: linear-gradient(135deg, 
        rgba(251, 191, 36, 0.3) 0%, 
        rgba(245, 158, 11, 0.2) 100%);
    transform: scale(1.1);
}

        /* Action Buttons */
        .course-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

       .btn {
    padding: 1rem 1.8rem;
    border: none;
    border-radius: 30px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    font-family: inherit;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    position: relative;
    overflow: hidden;

       .btn-primary {

.loading-screen-fixed {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    background: radial-gradient(ellipse at center, #1a2332 0%, #0a0e1b 100%);

    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    background: 
        radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(251, 191, 36, 0.08) 0%, transparent 40%);
    animation: pulse-bg 6s ease-in-out infinite;
}

@keyframes pulse-bg {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.7; }
}

.loading-screen-fixed.hide {
    opacity: 0;
    pointer-events: none;
}

body.loading {
    overflow: hidden !important;
    height: 100vh;
}

.loading-heart-container {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3rem;

}

    width: 300px;
    height: 300px;
    position: relative;
    overflow: visible !important;
}

/* الهالة المتنفسة */
.fouad-logo-loading .breathing-aura {
    position: absolute;
    width: 400px;
    height: 400px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, 
        rgba(255, 215, 0, 0.08) 0%, 
        rgba(225, 48, 108, 0.04) 40%, 
        transparent 70%);
    animation: gentleBreathing 4s ease-in-out infinite;
    pointer-events: none;
}

@keyframes gentleBreathing {
    0%, 100% { 
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.6;
    }
    50% { 
        transform: translate(-50%, -50%) scale(1.15);
        opacity: 0.9;
    }
}

/* الحلقات المتوسعة للتحميل */
.pulse-rings-container-loading {
    position: absolute;
    width: 400px;
    height: 400px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    overflow: visible !important;
}

.pulse-ring-loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 2px solid rgba(255, 215, 0, 0.9);
    animation: expandFromCoreLoading 6s ease-out infinite;
}

@keyframes expandFromCoreLoading {
    0% {
        width: 12px;
        height: 12px;
        opacity: 0;
        border-color: rgba(255, 215, 0, 0.9);
        border-width: 3px;
    }
    15% {
        opacity: 1;
    }
    50% {
        width: 150px;
        height: 150px;
        border-color: rgba(225, 48, 108, 0.6);
        border-width: 2px;
    }
    100% {
        width: 350px;
        height: 350px;
        opacity: 0;
        border-color: rgba(131, 58, 180, 0.3);
        border-width: 1px;
    }
}

/* إضاءة الأشواق بالتتابع */

    opacity: 0.2 !important;

<script>


   
// إضافة تفاعل عند النقر على المراحل
document.addEventListener('DOMContentLoaded', function() {
    // توليد جزيئات سماء الأعماق
    const depthParticlesContainer = document.querySelector('.depth-particles');
    
    if (depthParticlesContainer) {
        function createDepthParticle() {
            const particle = document.createElement('div');
            particle.className = 'depth-particle';
            
            // موضع أفقي عشوائي
            const leftPos = Math.random() * 100;
            particle.style.left = leftPos + '%';
            
            // انحراف أفقي عشوائي أثناء الصعود
            const drift = (Math.random() - 0.5) * 100;
            particle.style.setProperty('--drift', drift + 'px');
            
            // تأخير عشوائي
            particle.style.animationDelay = (Math.random() * 8) + 's';
            
            // حجم عشوائي
            const size = 2 + Math.random() * 3;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            
            depthParticlesContainer.appendChild(particle);
            
            // إزالة بعد انتهاء الأنيميشن
            setTimeout(() => {
                particle.remove();
            }, 12000);
        }
        
        // إنشاء جزيئات بشكل مستمر
        setInterval(createDepthParticle, 400); // جزيء كل 0.4 ثانية
        
        // إنشاء دفعة أولية
        for (let i = 0; i < 20; i++) {
            setTimeout(createDepthParticle, i * 200);
        }
    }
    // إنشاء الحلقات المتوسعة لشاشة التحميل
    const loadingRingsContainer = document.querySelector('.pulse-rings-container-loading');
    if (loadingRingsContainer) {
        setInterval(() => {
            const ring = document.createElement('div');
            ring.className = 'pulse-ring-loading';
            loadingRingsContainer.appendChild(ring);
            
            setTimeout(() => ring.remove(), 6000);
        }, 2000);
    }
    
   // إضاءة الأشواق التسعة كلهم مع بعض عند وصول الموجة
    const longingsLoading = document.querySelectorAll('.longing-symbol-loading');
    
    // إضاءة الأشواق كلهم مع بعض
    function illuminateAllLongings() {
        // إضاءة كل الأشواق
        longingsLoading.forEach(l => l.classList.add('illuminated'));
        
        // إطفاء بعد 1.5 ثانية
        setTimeout(() => {
            longingsLoading.forEach(l => l.classList.remove('illuminated'));
        }, 1500);
    }
    
    // أول إضاءة بعد 3 ثواني (وقت وصول أول موجة)
    setTimeout(() => {
        illuminateAllLongings();
    }, 3000);
    
    // تكرار الإضاءة كل 6 ثواني
    setInterval(() => {
        illuminateAllLongings();
    }, 6000);
    
    document.querySelectorAll('.stage-item').forEach(stage => {
        stage.addEventListener('click', function() {
            const stageNum = parseInt(this.dataset.stage);
            const currentStage = userData?.journeyPoints?.stage || 1;
            
            if (stageNum <= currentStage) {
                showStageInfo(stageNum);
            } else {
                Swal.fire({
                    icon: 'info',
                    title: 'مرحلة مقفلة',
                    text: 'أكمل المراحل السابقة لفتح هذه المرحلة',
                    confirmButtonColor: '#3b82f6'
                });
            }
        });
    });
});

     // دالة فحص الجلسات المباشرة للدورة - محسّنة
async function checkLiveSession(courseId) {
    try {
        const now = new Date();
        const threeDaysAgo = new Date(now.getTime() - (3 * 24 * 60 * 60 * 1000));
        
        // استعلام مبسط بدون orderBy لتجنب مشاكل الـ Index
        const sessionsSnapshot = await db.collection('liveSessions')
            .where('courseId', '==', courseId)
            .where('scheduledDate', '>=', threeDaysAgo)
            .get();
        
        if (sessionsSnapshot.empty) {
            return { isLive: false, upcomingSession: null };
        }
        
        // ترتيب النتائج يدوياً بدلاً من orderBy
        const sessions = [];
        sessionsSnapshot.forEach(doc => {
            sessions.push({ id: doc.id, ...doc.data() });
        });
        
        // ترتيب حسب التاريخ
        sessions.sort((a, b) => {
            const dateA = a.scheduledDate.toDate();
            const dateB = b.scheduledDate.toDate();
            return dateA - dateB;
        });
        
        let isLive = false;
        let upcomingSession = null;
        
        sessions.forEach(session => {
            const sessionDate = session.scheduledDate.toDate();
            const timeDiff = sessionDate - now;
            const hoursDiff = timeDiff / (1000 * 60 * 60);
            
            // التحقق من البث المباشر الآن (في نطاق ساعتين من الموعد)
            if (session.status === 'active' || (hoursDiff >= -1 && hoursDiff <= 1)) {
                isLive = true;
            }
            
            // البحث عن أقرب جلسة قادمة (خلال 24 ساعة)
            if (!upcomingSession && hoursDiff > 0 && hoursDiff <= 24) {
                upcomingSession = {
                    title: session.title,
                    date: sessionDate,
                    hoursUntil: Math.round(hoursDiff)
                };
            }
        });
        
        return { isLive, upcomingSession };
        
    } catch (error) {
        console.log('خطأ في فحص الجلسات:', error);
        return { isLive: false, upcomingSession: null };
    }
}

function validateImageUrl(url) {
    if (!url) return false;
    
    // التحقق من أن الرابط يبدأ بـ http أو https
    if (!url.startsWith('http://') && !url.startsWith('https://')) {
        return false;
    }
    
    // التحقق من امتداد الصورة
    const imageExtensions = ['.jpg', '.jpeg', '.png', '.gif', '.webp', '.svg'];
    const hasValidExtension = imageExtensions.some(ext => 
        url.toLowerCase().includes(ext)
    );
    
    return hasValidExtension;
}

        // إذا لم نجد الرابط محلياً، نجلبه من Firebase
        const courseDoc = await db.collection('courses').doc(courseId).get();
        
        if (!courseDoc.exists) {
            throw new Error('الدورة غير موجودة');

        // دالة لتحويل الرموز إلى HTML
function formatText(text) {
    if (!text) return '';
    
    return text
        // **نص** = نص عريض بلون أزرق
        .replace(/\*\*(.*?)\*\*/g, '<strong style="color: var(--primary-blue); font-weight: 700;">$1</strong>')
        // <<نص>> = نص مميز بخلفية
        .replace(/<<(.*?)>>/g, '<span style="background: rgba(59, 130, 246, 0.15); padding: 3px 10px; border-radius: 6px; border: 1px solid rgba(59, 130, 246, 0.3);">$1</span>')
        // ##نص## = نص مهم بلون ذهبي
        .replace(/##(.*?)##/g, '<span style="color: var(--golden); font-weight: 600; text-shadow: 0 0 8px rgba(251, 191, 36, 0.3);">$1</span>')
        // ||نص|| = نص بخط مائل
        .replace(/\|\|(.*?)\|\|/g, '<em style="color: var(--text-secondary); font-style: italic;">$1</em>')
        // ^^نص^^ = نص مرتفع مع توهج
        .replace(/\^\^(.*?)\^\^/g, '<span style="color: var(--success-green); text-shadow: 0 0 10px rgba(16, 185, 129, 0.5); font-weight: 600;">$1</span>')
        // تحويل الأسطر الجديدة إلى <br>
        .replace(/\n/g, '<br>');
}

                    <div style="
                        background: rgba(16, 185, 129, 0.1);
                        padding: 0.75rem 1.5rem;

                        border: 1px solid rgba(16, 185, 129, 0.3);
                    ">
                        <span style="color: var(--text-secondary); font-size: 0.9rem;">عدد الدورات:</span>
                        <span style="color: var(--success-green); font-weight: 700; font-size: 1.3rem; margin-right: 0.5rem;">

                </div>
            </div>
        `;
        
        // بطاقات الدورات
        journey.courses.forEach(course => {
            allHtml += createCourseCard(course);
        });
    });
    
    coursesGrid.innerHTML = allHtml;
    
    // تحميل مؤشرات البث
    setTimeout(() => {
        filteredCourses.forEach(course => {
            updateLiveIndicators(course.id);
        });
    }, 100);
}

        // تحديث مؤشرات البث المباشر لكل دورة
async function updateLiveIndicators(courseId) {
    const liveData = await checkLiveSession(courseId);
    const liveIndicator = document.getElementById(`live-indicator-${courseId}`);
    const upcomingDiv = document.getElementById(`upcoming-session-${courseId}`);
    
    if (!liveIndicator || !upcomingDiv) return;
    
    // عرض مؤشر البث المباشر
    if (liveData.isLive) {
        liveIndicator.style.display = 'block';
        liveIndicator.innerHTML = `
            <div style="
                position: absolute;
                top: 10px;
                left: 10px;
                background: linear-gradient(135deg, #ef4444, #dc2626);
                color: white;
                padding: 0.5rem 1rem;
                border-radius: 20px;
                font-size: 0.85rem;
                font-weight: 700;
                display: flex;
                align-items: center;
                gap: 0.5rem;
                box-shadow: 0 4px 15px rgba(239, 68, 68, 0.5);
                z-index: 10;
                animation: pulse-live 2s infinite;
            ">
                <span style="
                    width: 10px;
                    height: 10px;
                    background: white;
                    border-radius: 50%;
                    animation: blink 1s infinite;
                "></span>
                <span>بث مباشر الآن</span>
            </div>
        `;
    }
    
    // عرض معلومات الجلسة القادمة
    if (liveData.upcomingSession) {
        upcomingDiv.style.display = 'block';
        upcomingDiv.innerHTML = `
            <div style="
                background: linear-gradient(135deg, rgba(251, 191, 36, 0.15), rgba(245, 158, 11, 0.1));
                border: 1px solid rgba(251, 191, 36, 0.4);
                border-radius: 12px;
                padding: 0.75rem 1rem;
                margin-bottom: 1rem;
                display: flex;
                align-items: center;
                gap: 0.75rem;
            ">
                <div style="
                    width: 40px;
                    height: 40px;
                    background: linear-gradient(135deg, var(--golden), var(--golden-dark));
                    border-radius: 50%;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-size: 1.2rem;
                    flex-shrink: 0;
                ">⏰</div>
                <div style="flex: 1;">
                    <div style="
                        color: var(--golden);
                        font-weight: 700;
                        font-size: 0.9rem;
                        margin-bottom: 0.25rem;
                    ">لقاء مباشر قادم</div>
                    <div style="
                        color: var(--text-secondary);
                        font-size: 0.85rem;
                    ">بعد ${liveData.upcomingSession.hoursUntil} ساعة</div>
                </div>
                <i class="fas fa-chevron-left" style="color: var(--golden); font-size: 0.9rem;"></i>
            </div>
        `;
    }
}

    <script>
// 🛡️ حماية البيانات من Console
(function() {
    'use strict';
    
    const isMobile = /Android|webOS|iPhone|iPad|iPod/i.test(navigator.userAgent);
    
    if (!isMobile) {
        // حماية المتغيرات الحساسة
        const protectedVars = ['userData', 'allCourses', 'filteredCourses', 'userId', 'currentUser'];
        
        protectedVars.forEach(varName => {
            let originalValue = window[varName];
            
            Object.defineProperty(window, varName, {
                get: function() {
                    const stack = new Error().stack;
                    if (stack && !stack.includes('console')) {
                        return originalValue;
                    }
                    return '[محمي 🔒]';
                },
                set: function(value) {
                    originalValue = value;
                },
                enumerable: false,
                configurable: false
            });
        });
    }
    
    // منع استخراج البيانات عبر JSON.stringify
    const originalStringify = JSON.stringify;
    JSON.stringify = function(...args) {
        if (args[0] && typeof args[0] === 'object') {
            const cleaned = {...args[0]};
            delete cleaned.apiKey;
            delete cleaned.enrollments;
            delete cleaned.progress;
            delete cleaned.personalInfo;
            args[0] = cleaned;
        }
        return originalStringify.apply(this, args);
    };
})();
</script>
