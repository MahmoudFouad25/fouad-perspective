<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رحلاتي التحويلية - منظور الفؤاد</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root {
            /* ألوان الأشواق التسعة من الهوية */
           /* هوية مرحلة النداء - ملاذ الحياري */

/* الألوان الأساسية */
--primary-blue: #3b82f6;
--primary-blue-dark: #2563eb;
--primary-blue-light: #60a5fa;
--success-green: #10b981;
--success-green-dark: #059669;
--golden: #fbbf24;
--golden-dark: #f59e0b;
--golden-light: #fde68a;

/* ألوان الخلفيات */
--primary-bg: #0f172a;
--secondary-bg: #1a2332;
--card-bg: #1e293b;
--card-hover: #293548;

/* ألوان النصوص */
--text-primary: #ffffff;
--text-secondary: #94a3b8;
--text-accent: #FFF3CD;

/* الحدود والتوهجات */
--border: rgba(59, 130, 246, 0.2);
--border-hover: rgba(59, 130, 246, 0.4);
--glow-blue: rgba(59, 130, 246, 0.4);
--glow-green: rgba(16, 185, 129, 0.4);
--glow-gold: rgba(251, 191, 36, 0.5);

/* التحولات */
--transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

       body {
    font-family: 'Tajawal', sans-serif;
    background-color: var(--primary-bg);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
               max-width: 100vw;

    position: relative;
           
}

        html {
    overflow-x: hidden;
    max-width: 100%;
}

* {
    max-width: 100vw;
    overflow-x: hidden;
}

        /* الخلفية الكونية */
        .cosmic-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    background: var(--primary-bg);
    background-image:
        radial-gradient(ellipse 800px 600px at top right, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
        radial-gradient(ellipse 600px 500px at bottom left, rgba(16, 185, 129, 0.12) 0%, transparent 40%),
        radial-gradient(circle 400px at 80% 50%, rgba(251, 191, 36, 0.08) 0%, transparent 50%);
}

        .islamic-pattern {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        /* نجوم متحركة للخلفية */
.stars-container {
    position: fixed;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: -1;
}

.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    animation: twinkle 4s infinite;
}

.star:nth-child(odd) {
    animation-delay: 2s;
}

@keyframes twinkle {
    0%, 100% { opacity: 0; }
    50% { opacity: 1; }
}

        /* الجسيمات المتطايرة */
        .floating-particles {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            font-size: 20px;
            animation: floatUp 10s linear infinite;
            opacity: 0.2;
        }

        @keyframes floatUp {
            0% {
                bottom: -50px;
                transform: translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.2;
            }
            90% {
                opacity: 0.2;
            }
            100% {
                bottom: 110%;
                transform: translateX(100px) rotate(720deg);
                opacity: 0;
            }
        }

        /* Header المطور */
        .header {
    background: linear-gradient(180deg, 
        rgba(30, 41, 59, 0.98) 0%, 
        rgba(15, 23, 42, 0.95) 100%);
    backdrop-filter: blur(20px);
    padding: 1.5rem 0;
    border-bottom: 2px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
}

        .header-content {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 2rem;
    position: relative;
}

        .header-title {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        
        h1 {
    font-size: 2.5rem;
    font-weight: 900;
    background: linear-gradient(135deg, var(--primary-blue) 0%, var(--success-green) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 40px var(--glow-blue);
    letter-spacing: -0.5px;
}

        .subtitle {
    font-size: 1.1rem;
    color: var(--text-secondary);
    opacity: 0.95;
    margin-top: 0.5rem;
    font-weight: 400;
}

        /* Stats Cards */
        .header-stats {
            display: flex;
            gap: 2.5rem;
            align-items: center;
        }

        .stat-item {
    text-align: center;
    position: relative;
    padding: 1rem 1.8rem;
    background: linear-gradient(135deg, 
        rgba(59, 130, 246, 0.08) 0%, 
        rgba(16, 185, 129, 0.05) 100%);
    border-radius: 20px;
    border: 1px solid var(--border);
    transition: var(--transition);
    backdrop-filter: blur(10px);
}

       .stat-item:hover {
    background: linear-gradient(135deg, 
        rgba(59, 130, 246, 0.15) 0%, 
        rgba(16, 185, 129, 0.1) 100%);
    transform: translateY(-5px) scale(1.05);
    border-color: var(--primary-blue);
    box-shadow: 0 10px 40px rgba(59, 130, 246, 0.2);
}

        .stat-value {
    font-size: 2.2rem;
    font-weight: 900;
    background: linear-gradient(135deg, var(--primary-blue-light) 0%, var(--success-green) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    display: block;
    text-shadow: 0 2px 20px var(--glow-blue);
}

        .stat-label {
    font-size: 0.9rem;
    color: var(--text-secondary);
    margin-top: 0.3rem;
    font-weight: 500;
    letter-spacing: 0.5px;
}

        /* Hero Banner */
        .hero-banner {
    background: linear-gradient(135deg, 
        rgba(59, 130, 246, 0.1) 0%, 
        rgba(16, 185, 129, 0.05) 50%,
        rgba(15, 23, 42, 0.8) 100%);
    padding: 4rem 0;
    position: relative;
    overflow: hidden;
    border-bottom: 2px solid var(--border);
}

        .hero-banner::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, 
        var(--primary-blue) 0%, 
        var(--success-green) 25%, 
        var(--golden) 50%, 
        var(--primary-blue) 75%, 
        var(--success-green) 100%
    );
    background-size: 200% 100%;
    animation: waveFlow 6s linear infinite;
}

@keyframes waveFlow {
    0% { background-position: 0% 0%; }
    100% { background-position: 200% 0%; }
}

        @keyframes rainbowSlide {
            0% { background-position: 0% 0%; }
            100% { background-position: 200% 0%; }
        }

        .hero-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
            text-align: center;
        }

        .motivational-quote {
    font-size: 1.9rem;
    color: var(--text-accent);
    margin-bottom: 1.5rem;
    font-weight: 300;
    opacity: 0.95;
    text-shadow: 0 2px 15px rgba(251, 191, 36, 0.3);
    line-height: 1.6;
}

        .progress-summary {
            display: flex;
            justify-content: center;
            gap: 3rem;
            margin-top: 2rem;
        }

        .summary-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

       .summary-icon {
    width: 45px;
    height: 45px;
    background: linear-gradient(135deg, var(--primary-blue) 0%, var(--primary-blue-dark) 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-primary);
    box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
    transition: var(--transition);
}

        .summary-item:hover .summary-icon {
    transform: rotate(360deg) scale(1.1);
    background: linear-gradient(135deg, var(--success-green) 0%, var(--success-green-dark) 100%);
    box-shadow: 0 6px 30px rgba(16, 185, 129, 0.4);
}

        .summary-text {
            text-align: right;
        }

       .summary-value {
    font-size: 1.6rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--golden) 0%, var(--golden-dark) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

        .summary-label {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
        }

       

        /* Content Container */
        .content-container {
    max-width: 1400px;
    margin: 3rem auto 0;
    padding: 0 2rem 4rem;
}

        /* Courses Grid المطورة */
        .courses-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 2rem;
    margin-bottom: 3rem;
    padding: 1rem;
}

        .course-card {
    background: linear-gradient(135deg, 
        rgba(30, 41, 59, 0.7) 0%, 
        rgba(15, 23, 42, 0.5) 100%);
    backdrop-filter: blur(15px);
    border-radius: 25px;
    overflow: hidden;
    border: 1px solid var(--border);
    transition: var(--transition);
    position: relative;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
}

       .course-card::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, 
        rgba(59, 130, 246, 0.1) 0%, 
        transparent 70%);
    opacity: 0;
    transition: var(--transition);
    pointer-events: none;
}
       .course-card:hover {
    transform: translateY(-10px) scale(1.02);
    box-shadow: 0 20px 60px rgba(59, 130, 246, 0.3);
    border-color: var(--primary-blue);
    background: linear-gradient(135deg, 
        rgba(30, 41, 59, 0.8) 0%, 
        rgba(59, 130, 246, 0.1) 100%);
}

.course-card:hover::before {
    opacity: 1;
}

        .course-header {
    position: relative;
    height: 220px;
    background: linear-gradient(180deg, 
        rgba(59, 130, 246, 0.2) 0%, 
        rgba(15, 23, 42, 0.8) 100%);
    overflow: hidden;
}
        .course-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }

        .course-card:hover .course-image {
            transform: scale(1.1);
        }

      .default-course-image {
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, 
        var(--primary-blue) 0%, 
        var(--success-green) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 4rem;
    color: var(--text-primary);
    position: relative;
    overflow: hidden;
}

        .default-course-image::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

       .course-type-badge {
    position: absolute;
    top: 1rem;
    right: 1rem;
    padding: 0.6rem 1.2rem;
    border-radius: 25px;
    font-size: 0.85rem;
    font-weight: 600;
    backdrop-filter: blur(20px);
    background: linear-gradient(135deg, 
        rgba(59, 130, 246, 0.9) 0%, 
        rgba(37, 99, 235, 0.8) 100%);
    color: white;
    border: 1px solid rgba(96, 165, 250, 0.5);
    display: flex;
    align-items: center;
    gap: 0.5rem;
    box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
}
        .course-status {
            position: absolute;
            top: 1rem;
            left: 1rem;
            padding: 0.5rem 1rem;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

       .status-active {
    background: linear-gradient(135deg, 
        var(--success-green) 0%, 
        var(--success-green-dark) 100%);
    color: white;
    box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
}
       .status-completed {
    background: linear-gradient(135deg, 
        var(--primary-blue) 0%, 
        var(--primary-blue-dark) 100%);
    color: white;
    box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
}

        .status-pending {
    background: linear-gradient(135deg, 
        rgba(148, 163, 184, 0.9) 0%, 
        rgba(100, 116, 139, 0.8) 100%);
    color: white;
    box-shadow: 0 4px 15px rgba(100, 116, 139, 0.3);
}

        /* Progress Overlay */
        .course-progress-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(10, 22, 40, 0.95) 0%, transparent 100%);
            padding: 1.5rem;
            transform: translateY(100%);
            transition: var(--transition);
        }

        .course-card:hover .course-progress-overlay {
            transform: translateY(0);
        }

      .progress-bar {
    width: 100%;
    height: 10px;
    background: rgba(15, 23, 42, 0.6);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 0.8rem;
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
}

       .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, 
        var(--primary-blue) 0%, 
        var(--success-green) 50%, 
        var(--golden) 100%);
    border-radius: 10px;
    transition: width 1s ease;
    position: relative;
    overflow: hidden;
    box-shadow: 0 2px 10px rgba(59, 130, 246, 0.4);
}

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .progress-text {
            color: var(--gold-light);
            font-size: 0.9rem;
            text-align: center;
            font-weight: 600;
        }

        /* Course Content */
      .course-content {
    padding: 2rem;
    position: relative;
    z-index: 1;
    background: linear-gradient(180deg, 
        transparent 0%, 
        rgba(15, 23, 42, 0.3) 100%);
}

       .course-title {
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 0.8rem;
    color: var(--text-primary);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    line-height: 1.4;
    transition: var(--transition);
}

.course-card:hover .course-title {
    color: var(--primary-blue-light);
    text-shadow: 0 2px 10px rgba(59, 130, 246, 0.3);
}

        .course-description {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .course-meta {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

       .meta-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--text-secondary);
    font-size: 0.9rem;
    transition: var(--transition);
}

.course-card:hover .meta-item {
    color: var(--text-primary);
}

       .meta-item i {
    color: var(--primary-blue);
    width: 20px;
    transition: var(--transition);
}

.course-card:hover .meta-item i {
    color: var(--success-green);
    transform: scale(1.2);
}

        /* Achievement Badges */
        .achievement-badges {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

       .achievement-badge {
    padding: 0.4rem 0.9rem;
    background: linear-gradient(135deg, 
        rgba(251, 191, 36, 0.15) 0%, 
        rgba(245, 158, 11, 0.1) 100%);
    border: 1px solid rgba(251, 191, 36, 0.4);
    border-radius: 20px;
    font-size: 0.8rem;
    color: var(--golden);
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    box-shadow: 0 2px 10px rgba(251, 191, 36, 0.2);
    transition: var(--transition);
}

.achievement-badge:hover {
    background: linear-gradient(135deg, 
        rgba(251, 191, 36, 0.3) 0%, 
        rgba(245, 158, 11, 0.2) 100%);
    transform: scale(1.1);
}

        /* Action Buttons */
        .course-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

       .btn {
    padding: 1rem 1.8rem;
    border: none;
    border-radius: 30px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    font-family: inherit;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    position: relative;
    overflow: hidden;
}

       .btn-primary {
    background: linear-gradient(135deg, var(--primary-blue) 0%, var(--primary-blue-dark) 100%);
    color: var(--text-primary);
    flex: 1;
}

.btn-primary::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.3);
    transform: translate(-50%, -50%);
    transition: width 0.6s, height 0.6s;
}

.btn-primary:hover::before {
    width: 400px;
    height: 400px;
}

       .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 30px rgba(59, 130, 246, 0.4);
    background: linear-gradient(135deg, var(--success-green) 0%, var(--success-green-dark) 100%);
}

        .btn-secondary {
    background: rgba(30, 41, 59, 0.6);
    backdrop-filter: blur(10px);
    color: var(--text-primary);
    border: 1px solid var(--border);
}

      .btn-secondary:hover {
    background: linear-gradient(135deg, 
        rgba(59, 130, 246, 0.2) 0%, 
        rgba(16, 185, 129, 0.1) 100%);
    border-color: var(--primary-blue);
    transform: translateY(-3px);
    box-shadow: 0 6px 25px rgba(59, 130, 246, 0.3);
}

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Empty State */
        .empty-state {
    text-align: center;
    padding: 6rem 2rem;
    color: var(--text-primary);
    background: linear-gradient(135deg, 
        rgba(30, 41, 59, 0.3) 0%, 
        rgba(15, 23, 42, 0.2) 100%);
    border-radius: 25px;
    border: 1px solid var(--border);
}

        .empty-icon {
    font-size: 5rem;
    background: linear-gradient(135deg, var(--primary-blue) 0%, var(--success-green) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 1.5rem;
    display: block;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.1); opacity: 0.8; }
}

        .empty-title {
    font-size: 2rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--golden) 0%, var(--golden-dark) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 1rem;
    text-shadow: 0 2px 15px rgba(251, 191, 36, 0.3);
}

        .empty-description {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 2rem;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Loading State */
        .loading-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid var(--border);
            border-top-color: var(--gold-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--dark-bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--gold-primary);

                <span class="course-type-badge">
                    <i class="fas fa-${course.type === 'bundle' ? 'layer-group' : 'graduation-cap'}"></i>
                    ${course.type === 'bundle' ? 'مسار تحويلي' : 'دورة تأسيسية'}
                </span>
                
                <span class="course-status ${statusClass}">
                    <i class="fas fa-${statusIcon}"></i> ${statusText}
                </span>
                
                <!-- مؤشر التقدم المحسّن -->
                <div class="course-progress-overlay">
                    <div class="progress-info" style="
                        display: flex;
                        justify-content: space-between;
                        align-items: center;
                        margin-bottom: 8px;
                    ">
                        <span style="
                            font-size: 0.85rem;
                            color: rgba(255, 255, 255, 0.8);
                            font-weight: 600;
                        ">التقدم</span>
                        <span style="
                            font-size: 1.1rem;
                            font-weight: 700;
                            background: linear-gradient(135deg, #3b82f6, #10b981);
                            -webkit-background-clip: text;
                            -webkit-text-fill-color: transparent;
                        ">${actualProgress}%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${actualProgress}%"></div>
                    </div>
                    <div style="
                        display: flex;
                        justify-content: space-between;
                        margin-top: 8px;
                        font-size: 0.8rem;
                        color: rgba(255, 255, 255, 0.7);
                    ">
                        <span><i class="fas fa-check-circle" style="color: #10b981;"></i> ${completedCount} درس</span>
                        <span><i class="fas fa-list" style="color: #3b82f6;"></i> ${totalLessonsInCourse} إجمالي</span>
                    </div>
                </div>
            </div>
            
            <div class="course-content">
                <h3 class="course-title">${course.title}</h3>
                <p class="course-description">${course.description}</p>
                
                <div class="course-meta">
                    <div class="meta-item">
                        <i class="fas fa-user-circle"></i>
                        <span>${course.instructor}</span>
                    </div>
                    <div class="meta-item">
                        <i class="fas fa-book-reader"></i>
                        <span>${totalLessonsInCourse} درس</span>
                    </div>
                    <div class="meta-item">
                        <i class="fas fa-clock"></i>
                        <span>${actualProgress > 0 ? timeSpentText : Math.floor(course.duration / 60) + ' ساعة'}</span>
                    </div>
                    <div class="meta-item" style="grid-column: 1 / -1;">
                        <i class="fas fa-history"></i>
                        <span style="
                            font-size: 0.85rem;
                            color: ${completedCount > 0 ? 'rgba(16, 185, 129, 0.9)' : 'rgba(255, 255, 255, 0.5)'};
                        ">${lastActivityText}</span>
                    </div>
                </div>
                
                ${achievementBadges ? `
                    <div class="achievement-badges">
                        ${achievementBadges}
                    </div>
                ` : ''}
                
                <div class="course-actions">
                    <button class="btn btn-primary" 
                            ${canAccess ? '' : 'disabled'} 
                            onclick="${canAccess ? `openContent('${course.id}', '${course.type}')` : 'void(0)'}">
                        <i class="fas fa-${buttonIcon}"></i>
                        ${buttonText}
                    </button>
                    <button class="btn btn-secondary" onclick="showDetails('${course.id}')">
                        <i class="fas fa-info-circle"></i>
                        التفاصيل
                    </button>
                </div>
            </div>
        </div>
    `;
}

        

        // فتح المحتوى
       function openContent(courseId, contentType) {
    // استخدام معرف الدورة الحقيقي وليس معرف التسجيل
    if (contentType === 'bundle') {
        window.location.href = `./bundle-view.html?id=${courseId}`;
    } else {
        window.location.href = `./course-view.html?id=${courseId}`;
    }
}

        // عرض تفاصيل المحتوى
        async function showDetails(courseId) {
            const course = allCourses.find(c => c.id === courseId);
            
            if (!course) return;
            
            const objectives = course.objectives.length > 0 ? 
                course.objectives.map(obj => `<li>${obj}</li>`).join('') : 
                '<li>استكشاف منظور جديد للحياة</li><li>تطوير المهارات الشخصية</li><li>تحقيق التوازن الداخلي</li>';
            
            Swal.fire({
                title: course.title,
                html: `
                    <div style="text-align: right; direction: rtl;">
                        <div style="margin-bottom: 1.5rem;">
                            <strong style="color: var(--gold-primary);">النوع:</strong> 
                            ${course.type === 'bundle' ? '🎯 مسار تحويلي متكامل' : '📚 دورة تدريبية فردية'}
                        </div>
                        
                        <div style="margin-bottom: 1.5rem;">
                            <strong style="color: var(--gold-primary);">الوصف:</strong><br>
                            ${course.description}
                        </div>
                        
                        <div style="margin-bottom: 1.5rem;">
                            <strong style="color: var(--gold-primary);">ما ستتعلمه:</strong>
                            <ul style="text-align: right; margin-top: 0.5rem;">
                                ${objectives}
                            </ul>
                        </div>
                        
                        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-top: 2rem;">
                            <div style="background: rgba(255, 215, 0, 0.1); padding: 1rem; border-radius: 10px;">
                                <i class="fas fa-user" style="color: var(--gold-primary);"></i>
                                <strong>المدرب:</strong><br>
                                ${course.instructor}
                            </div>
                            <div style="background: rgba(255, 215, 0, 0.1); padding: 1rem; border-radius: 10px;">
                                <i class="fas fa-book" style="color: var(--gold-primary);"></i>
                                <strong>المحتوى:</strong><br>
                                ${course.lessonsCount} درس
                            </div>
                            <div style="background: rgba(255, 215, 0, 0.1); padding: 1rem; border-radius: 10px;">
                                <i class="fas fa-clock" style="color: var(--gold-primary);"></i>
                                <strong>المدة:</strong><br>
                                ${Math.floor(course.duration / 60)} ساعة
                            </div>
                            <div style="background: rgba(255, 215, 0, 0.1); padding: 1rem; border-radius: 10px;">
                                <i class="fas fa-chart-line" style="color: var(--gold-primary);"></i>
                                <strong>التقدم:</strong><br>
                                ${Math.round(course.learningProgress)}%
                            </div>
                        </div>
                    </div>
                `,
                confirmButtonText: 'رائع!',
                confirmButtonColor: '#FFD700',
                width: 700,
                background: '#1E3A5F',
                color: '#FFF3CD'
            });
        }

        // عرض رسالة خطأ
        function showError(message) {
            Swal.fire({
                icon: 'error',
                title: 'عذراً',
                text: message,
                confirmButtonColor: '#FFD700',
                confirmButtonText: 'حسناً',
                background: '#1E3A5F',
                color: '#FFF3CD'
            });
        }

       
        // تسجيل الخروج
async function handleLogout() {
    const result = await Swal.fire({
        title: 'تأكيد الخروج',
        text: 'هل أنت متأكد من رغبتك في الخروج من حسابك؟',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#EF4444',
        cancelButtonColor: '#6B7280',
        confirmButtonText: 'نعم، سجل خروجي',
        cancelButtonText: 'إلغاء',
        background: '#1E3A5F',
        color: '#FFF3CD'
    });

    if (result.isConfirmed) {
        try {
            // تسجيل الخروج من Firebase
            await auth.signOut();
            
            // مسح البيانات المحلية
            localStorage.clear();
            sessionStorage.clear();
            
            // رسالة نجاح سريعة
            await Swal.fire({
                icon: 'success',
                title: 'تم تسجيل الخروج',
                text: 'شكراً لك، نتطلع لرؤيتك قريباً',
                timer: 1500,
                showConfirmButton: false,
                background: '#1E3A5F',
                color: '#FFF3CD'
            });
            
            // التوجيه لصفحة تسجيل الدخول
            window.location.href = './login.html';
            
        } catch (error) {
            console.error('خطأ في تسجيل الخروج:', error);
            Swal.fire({
                icon: 'error',
                title: 'حدث خطأ',
                text: 'لم نتمكن من تسجيل خروجك، حاول مرة أخرى',
                confirmButtonColor: '#FFD700',
                background: '#1E3A5F',
                color: '#FFF3CD'
            });
        }
    }
}
        

        // معالج الأخطاء
        window.addEventListener('error', function(e) {
            console.error('خطأ في الصفحة:', e.error);
        });

        window.addEventListener('unhandledrejection', function(e) {
            console.error('خطأ غير معالج:', e.reason);
        });
    </script>
</body>
</html>
