<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة إدارة — ولادة قلب</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F2ED;--bg2:#EDEAE4;--card:#FFFFFF;--text:#2C2420;--text2:#6B5D52;--muted:#A89888;--green:#1B4332;--green2:#2D6A4F;--green-bg:rgba(45,106,79,0.06);--gold:#C8963E;--gold-bg:rgba(200,150,62,0.06);--red:#B44040;--red-bg:rgba(180,64,64,0.06);--border:rgba(44,36,32,0.1);--shadow:0 1px 8px rgba(0,0,0,0.04);--font:'Noto Naskh Arabic',serif;--font-d:'Amiri',serif;--font-q:'Scheherazade New',serif;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.6}

/* Layout */
.app{display:flex;min-height:100vh}
.sidebar{width:260px;background:var(--card);border-left:0.5px solid var(--border);padding:0;position:fixed;top:0;bottom:0;right:0;overflow-y:auto;z-index:10}
.main{flex:1;margin-right:260px;padding:20px 28px}

/* Sidebar */
.sb-header{padding:20px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:10px}
.sb-logo{width:36px;height:36px;border-radius:8px;background:var(--green-bg);display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:20px;font-weight:700;color:var(--green)}
.sb-title{font-size:14px;font-weight:600;color:var(--text)}
.sb-sub{font-size:11px;color:var(--muted)}
.sb-nav{padding:12px}
.sb-nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text2);transition:all .2s;margin-bottom:2px}
.sb-nav-item:hover{background:var(--bg);color:var(--text)}
.sb-nav-item.active{background:var(--green-bg);color:var(--green);font-weight:600}
.sb-nav-item svg{width:18px;height:18px;flex-shrink:0}
.sb-section{padding:4px 12px;font-size:11px;color:var(--muted);font-weight:600;margin-top:12px;margin-bottom:4px}
.sb-baab{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text2);transition:all .2s;margin-bottom:1px}
.sb-baab:hover{background:var(--bg)}
.sb-baab.active{background:var(--gold-bg);color:var(--gold);font-weight:600}
.sb-baab-num{width:24px;height:24px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.sb-baab.active .sb-baab-num{background:var(--gold);color:#fff}
.sb-ch{padding:6px 14px 6px 46px;font-size:12px;color:var(--muted);cursor:pointer;border-radius:6px;transition:all .15s}
.sb-ch:hover{background:var(--bg);color:var(--text2)}
.sb-ch.active{color:var(--green);font-weight:600}

/* Top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:16px;border-bottom:0.5px solid var(--border)}
.topbar h1{font-size:18px;font-weight:600}
.topbar-actions{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border:0.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--text2);font-family:var(--font);font-size:13px;cursor:pointer;transition:all .2s;font-weight:500}
.btn:hover{background:var(--bg);color:var(--text)}
.btn-primary{background:var(--green);color:#F8F3EC;border-color:var(--green)}
.btn-primary:hover{background:#163a2b}
.btn-gold{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn-danger{color:var(--red);border-color:rgba(180,64,64,0.2)}
.btn-danger:hover{background:var(--red-bg)}
.btn svg{width:16px;height:16px}

/* Stats cards */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:24px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stat-label{font-size:12px;color:var(--muted);margin-bottom:4px}
.stat-val{font-size:24px;font-weight:600}
.stat-val.green{color:var(--green2)}
.stat-val.gold{color:var(--gold)}

/* Chapter list */
.ch-list{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.ch-list-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:0.5px solid var(--border)}
.ch-list-title{font-size:15px;font-weight:600}
.ch-item{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:0.5px solid var(--border);cursor:pointer;transition:background .15s}
.ch-item:hover{background:var(--bg)}
.ch-item:last-child{border-bottom:none}
.ch-handle{cursor:grab;color:var(--muted);padding:4px}
.ch-handle:active{cursor:grabbing}
.ch-num{width:28px;height:28px;border-radius:6px;background:var(--green);color:#F8F3EC;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.ch-info{flex:1}
.ch-name{font-size:14px;font-weight:500}
.ch-meta{font-size:11px;color:var(--muted);margin-top:1px}
.ch-status{font-size:11px;padding:3px 10px;border-radius:10px;font-weight:500}
.ch-status.pub{background:var(--green-bg);color:var(--green2)}
.ch-status.draft{background:var(--gold-bg);color:var(--gold)}
.ch-actions{display:flex;gap:4px}
.ch-action{width:30px;height:30px;border:none;background:none;cursor:pointer;border-radius:6px;color:var(--muted);display:flex;align-items:center;justify-content:center;transition:all .15s}
.ch-action:hover{background:var(--bg);color:var(--text)}
.ch-action.del:hover{background:var(--red-bg);color:var(--red)}

/* Editor */
.editor{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.editor-header{padding:16px 20px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.editor-title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.editor-breadcrumb{font-size:12px;color:var(--muted);font-weight:400}
.editor-meta{padding:16px 20px;border-bottom:0.5px solid var(--border);display:grid;grid-template-columns:1fr 120px 120px;gap:12px}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:500}
.field input,.field select,.field textarea{width:100%;padding:8px 12px;border:0.5px solid var(--border);border-radius:6px;font-family:var(--font);font-size:14px;background:var(--bg);color:var(--text);transition:border .2s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--green)}
.field textarea{resize:vertical;min-height:100px;line-height:1.9}

/* Content blocks */
.blocks{padding:16px 20px}
.blocks-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.blocks-title{font-size:13px;font-weight:600;color:var(--text2)}
.block{border:0.5px solid var(--border);border-radius:8px;margin-bottom:8px;overflow:hidden;transition:border-color .2s}
.block:hover{border-color:rgba(44,36,32,0.2)}
.block-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg)}
.block-type{font-size:12px;font-weight:600;padding:2px 10px;border-radius:4px}
.block-type.prose{background:var(--green-bg);color:var(--green2)}
.block-type.verse{background:var(--gold-bg);color:var(--gold)}
.block-type.hadith{background:rgba(27,67,50,0.08);color:var(--green)}
.block-type.reflection{background:rgba(45,106,79,0.1);color:var(--green2)}
.block-type.pause{background:var(--gold-bg);color:var(--gold)}
.block-type.divider{background:var(--bg2);color:var(--muted)}
.block-handle{cursor:grab;color:var(--muted);display:flex;align-items:center}
.block-actions{display:flex;gap:2px}
.block-action{width:26px;height:26px;border:none;background:none;cursor:pointer;border-radius:4px;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:12px}
.block-action:hover{background:var(--card);color:var(--text)}
.block-action.del:hover{color:var(--red)}
.block-body{padding:10px 12px}
.block-body textarea{width:100%;border:none;background:transparent;font-family:var(--font);font-size:13px;line-height:1.9;color:var(--text);resize:vertical;min-height:60px}
.block-body textarea:focus{outline:none}
.block-ref{display:flex;gap:8px;margin-top:6px}
.block-ref input{flex:1;padding:6px 10px;border:0.5px solid var(--border);border-radius:4px;font-family:var(--font);font-size:12px;background:var(--bg)}

/* Add block */
.add-blocks{display:flex;gap:6px;flex-wrap:wrap;padding:8px 20px 20px}
.add-block-btn{padding:6px 14px;border:0.5px dashed;border-radius:6px;background:none;cursor:pointer;font-family:var(--font);font-size:12px;font-weight:500;transition:all .2s}
.add-block-btn.prose{color:var(--green2);border-color:rgba(45,106,79,0.3)}
.add-block-btn.prose:hover{background:var(--green-bg)}
.add-block-btn.verse{color:var(--gold);border-color:rgba(200,150,62,0.3)}
.add-block-btn.verse:hover{background:var(--gold-bg)}
.add-block-btn.hadith{color:var(--green);border-color:rgba(27,67,50,0.3)}
.add-block-btn.hadith:hover{background:var(--green-bg)}
.add-block-btn.reflection{color:var(--green2);border-color:rgba(45,106,79,0.3)}
.add-block-btn.reflection:hover{background:var(--green-bg)}
.add-block-btn.pause{color:var(--gold);border-color:rgba(200,150,62,0.3)}
.add-block-btn.pause:hover{background:var(--gold-bg)}
.add-block-btn.divider{color:var(--muted);border-color:var(--border)}
.add-block-btn.divider:hover{background:var(--bg)}

/* Preview */
.preview-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:500;display:none;align-items:center;justify-content:center}
.preview-overlay.open{display:flex}
.preview-frame{width:480px;max-width:95vw;max-height:90vh;background:#F8F3EC;border-radius:16px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.preview-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:rgba(27,67,50,0.04);border-bottom:0.5px solid rgba(27,67,50,0.1)}
.preview-bar span{font-family:var(--font-d);font-size:14px;font-weight:700;color:#1B4332}
.preview-close{width:28px;height:28px;border:none;background:none;cursor:pointer;color:#6B5D52;font-size:18px;border-radius:6px}
.preview-close:hover{background:rgba(0,0,0,0.05)}
.preview-content{padding:28px 24px;overflow-y:auto;max-height:calc(90vh - 52px);direction:rtl}
.preview-content .pv-ch-label{text-align:center;font-size:13px;color:#C8963E;margin-bottom:8px}
.preview-content .pv-ch-title{text-align:center;font-family:var(--font-d);font-size:24px;font-weight:700;color:#1B4332;margin-bottom:24px}
.preview-content .pv-prose{font-family:var(--font);font-size:16px;line-height:2.1;color:#2C2420;margin-bottom:1.3em;text-align:justify}
.preview-content .pv-divider{text-align:center;margin:2em 0;display:flex;align-items:center;justify-content:center;gap:10px}
.preview-content .pv-divider span{width:5px;height:5px;border-radius:50%;background:#C8963E;opacity:.5}
.preview-content .pv-divider i{width:28px;height:0.5px;background:#A89888;opacity:.3}
.preview-content .pv-verse{margin:1.5em 0;padding:20px;background:rgba(200,150,62,0.06);border-radius:10px;border-right:3px solid #C8963E;text-align:center}
.preview-content .pv-verse p{font-family:var(--font-q);font-size:18px;line-height:2.2;color:#1B4332}
.preview-content .pv-verse small{font-size:12px;color:#A89888;display:block;margin-top:8px}
.preview-content .pv-hadith{margin:1.5em 0;padding:20px;background:rgba(27,67,50,0.04);border-radius:10px;border-right:3px solid #2D6A4F;text-align:center}
.preview-content .pv-hadith p{font-size:15px;line-height:2;color:#2C2420;font-style:italic}
.preview-content .pv-hadith small{font-size:12px;color:#A89888;display:block;margin-top:8px}
.preview-content .pv-reflection{margin:1.5em 0;padding:20px;background:rgba(45,106,79,0.05);border-radius:12px;border:0.5px solid rgba(45,106,79,0.1)}
.preview-content .pv-reflection p{font-size:15px;line-height:2;color:#6B5D52;white-space:pre-line}
.preview-content .pv-pause{margin:1.5em 0;padding:16px 20px;background:rgba(200,150,62,0.06);border-radius:12px;border:0.5px solid rgba(200,150,62,0.15);text-align:center}
.preview-content .pv-pause p{font-size:15px;line-height:2;color:#C8963E;font-weight:500}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--green);color:#F8F3EC;padding:12px 24px;border-radius:10px;font-size:13px;font-weight:500;z-index:600;transition:transform .3s;box-shadow:0 4px 16px rgba(0,0,0,0.15)}
.toast.show{transform:translateX(-50%) translateY(0)}

/* Empty state */
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty svg{width:48px;height:48px;margin-bottom:12px;opacity:.4}
.empty p{margin-bottom:16px}

@media(max-width:768px){
  .sidebar{display:none}
  .main{margin-right:0}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .editor-meta{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar"></aside>

  <!-- Main Content -->
  <div class="main" id="mainArea"></div>
</div>

<!-- Preview Overlay -->
<div class="preview-overlay" id="previewOverlay" onclick="if(event.target===this)closePreview()">
  <div class="preview-frame">
    <div class="preview-bar">
      <span>ولادة قلب</span>
      <button class="preview-close" onclick="closePreview()">&times;</button>
    </div>
    <div class="preview-content" id="previewContent"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ─── State ───
let bookData = null;
let currentBaabId = null;
let currentChId = null;
let editingData = null; // deep copy for editing

const arabNum = n => String(n).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const arabWord = n => ['','الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر'][n]||arabNum(n);
const typeLabels = {prose:'نص',verse:'آية',hadith:'حديث',reflection:'وقفة تأمل',pause:'وقفة',divider:'فاصل'};

// ─── Initialize ───
async function init() {
  // Try loading from localStorage first (for edits), then from file
  const saved = localStorage.getItem('wq-admin-data');
  if (saved) {
    bookData = JSON.parse(saved);
  } else {
    try {
      const r = await fetch('data/baab1.json');
      const baab1 = await r.json();
      bookData = { baabs: [baab1] };
    } catch(e) {
      bookData = { baabs: [] };
    }
  }
  buildSidebar();
  showDashboard();
}

function save() {
  localStorage.setItem('wq-admin-data', JSON.stringify(bookData));
  buildSidebar();
  toast('تم الحفظ');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ─── Sidebar ───
function buildSidebar() {
  const sb = document.getElementById('sidebar');
  let html = `<div class="sb-header">
    <div class="sb-logo">و</div>
    <div><div class="sb-title">لوحة الإدارة</div><div class="sb-sub">ولادة قلب</div></div>
  </div>
  <div class="sb-nav">
    <div class="sb-nav-item ${!currentBaabId?'active':''}" onclick="showDashboard()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      لوحة التحكم
    </div>
    <div class="sb-section">الأبواب</div>`;

  bookData.baabs.forEach(b => {
    const isActive = currentBaabId === b.id;
    html += `<div class="sb-baab ${isActive?'active':''}" onclick="selectBaab('${b.id}')">
      <div class="sb-baab-num">${arabNum(b.number)}</div>
      <span>${b.title}</span>
    </div>`;
    if (isActive && b.chapters) {
      b.chapters.forEach((ch, i) => {
        html += `<div class="sb-ch ${currentChId===ch.id?'active':''}" onclick="editChapter('${b.id}','${ch.id}')">${ch.title}</div>`;
      });
    }
  });

  html += `<div style="padding:12px"><button class="btn" style="width:100%;justify-content:center" onclick="addBaab()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M12 5v14M5 12h14"/></svg>
    إضافة باب
  </button></div></div>`;

  sb.innerHTML = html;
}

// ─── Dashboard ───
function showDashboard() {
  currentBaabId = null;
  currentChId = null;
  buildSidebar();
  const main = document.getElementById('mainArea');
  let totalCh = 0, totalSec = 0;
  bookData.baabs.forEach(b => {
    if (b.chapters) {
      totalCh += b.chapters.length;
      b.chapters.forEach(ch => { if(ch.sections) totalSec += ch.sections.length; });
    }
  });

  let html = `<div class="topbar">
    <h1>لوحة التحكم</h1>
    <div class="topbar-actions">
      <button class="btn" onclick="exportAll()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg> تصدير JSON</button>
      <a href="index.html" class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg> الموقع</a>
    </div>
  </div>
  <div class="stats">
    <div class="stat-card"><div class="stat-label">الأبواب</div><div class="stat-val">${arabNum(bookData.baabs.length)}</div></div>
    <div class="stat-card"><div class="stat-label">الفصول</div><div class="stat-val">${arabNum(totalCh)}</div></div>
    <div class="stat-card"><div class="stat-label">أقسام المحتوى</div><div class="stat-val green">${arabNum(totalSec)}</div></div>
    <div class="stat-card"><div class="stat-label">آخر تعديل</div><div class="stat-val gold" style="font-size:14px">${new Date().toLocaleDateString('ar-EG')}</div></div>
  </div>`;

  // Baabs list
  html += `<div class="ch-list">
    <div class="ch-list-header">
      <span class="ch-list-title">الأبواب</span>
    </div>`;

  bookData.baabs.forEach(b => {
    const chCount = b.chapters ? b.chapters.length : 0;
    html += `<div class="ch-item" onclick="selectBaab('${b.id}')">
      <div class="ch-num">${arabNum(b.number)}</div>
      <div class="ch-info">
        <div class="ch-name">الباب ${arabWord(b.number)}: ${b.title}</div>
        <div class="ch-meta">${arabNum(chCount)} فصل · ${b.subtitle||''}</div>
      </div>
      <span class="ch-status ${b.status==='published'?'pub':'draft'}">${b.status==='published'?'منشور':'مسودة'}</span>
    </div>`;
  });

  html += `</div>`;
  main.innerHTML = html;
}

// ─── Select Baab (show chapters) ───
function selectBaab(baabId) {
  currentBaabId = baabId;
  currentChId = null;
  buildSidebar();
  const baab = bookData.baabs.find(b => b.id === baabId);
  if (!baab) return;

  const main = document.getElementById('mainArea');
  let html = `<div class="topbar">
    <h1>الباب ${arabWord(baab.number)}: ${baab.title}</h1>
    <div class="topbar-actions">
      <button class="btn" onclick="toggleBaabStatus('${baabId}')">${baab.status==='published'?'إلغاء النشر':'نشر'}</button>
      <button class="btn btn-primary" onclick="addChapter('${baabId}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M12 5v14M5 12h14"/></svg> إضافة فصل</button>
    </div>
  </div>`;

  // Baab meta editor
  html += `<div class="editor" style="margin-bottom:20px">
    <div class="editor-meta">
      <div class="field"><label>عنوان الباب</label><input value="${baab.title}" onchange="updateBaab('${baabId}','title',this.value)"></div>
      <div class="field"><label>الوصف</label><input value="${baab.subtitle||''}" onchange="updateBaab('${baabId}','subtitle',this.value)"></div>
      <div class="field"><label>الحالة</label>
        <select onchange="updateBaab('${baabId}','status',this.value)">
          <option value="draft" ${baab.status!=='published'?'selected':''}>مسودة</option>
          <option value="published" ${baab.status==='published'?'selected':''}>منشور</option>
        </select>
      </div>
    </div>
  </div>`;

  // Chapters list
  html += `<div class="ch-list"><div class="ch-list-header"><span class="ch-list-title">الفصول</span></div>`;

  if (baab.chapters && baab.chapters.length > 0) {
    baab.chapters.forEach((ch, i) => {
      const secCount = ch.sections ? ch.sections.length : 0;
      html += `<div class="ch-item">
        <div class="ch-handle" title="اسحب لإعادة الترتيب">⠿</div>
        <div class="ch-num">${arabNum(i+1)}</div>
        <div class="ch-info" onclick="editChapter('${baabId}','${ch.id}')">
          <div class="ch-name">${ch.title}</div>
          <div class="ch-meta">${arabNum(secCount)} قسم</div>
        </div>
        <div class="ch-actions">
          <button class="ch-action" onclick="editChapter('${baabId}','${ch.id}')" title="تعديل">✎</button>
          <button class="ch-action" onclick="previewChapter('${baabId}','${ch.id}')" title="معاينة">👁</button>
          <button class="ch-action del" onclick="deleteChapter('${baabId}','${ch.id}')" title="حذف">✕</button>
        </div>
      </div>`;
    });
  } else {
    html += `<div class="empty"><p>لا يوجد فصول بعد</p>
      <button class="btn btn-primary" onclick="addChapter('${baabId}')">إضافة أول فصل</button></div>`;
  }

  html += `</div>`;
  main.innerHTML = html;
}

// ─── Chapter Editor ───
function editChapter(baabId, chId) {
  currentBaabId = baabId;
  currentChId = chId;
  buildSidebar();

  const baab = bookData.baabs.find(b => b.id === baabId);
  const ch = baab.chapters.find(c => c.id === chId);
  if (!ch) return;

  const main = document.getElementById('mainArea');
  let html = `<div class="topbar">
    <h1 style="display:flex;align-items:center;gap:8px">
      <span style="color:var(--muted);font-weight:400;font-size:14px">${baab.title} ›</span>
      ${ch.title}
    </h1>
    <div class="topbar-actions">
      <button class="btn" onclick="previewChapter('${baabId}','${chId}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> معاينة</button>
      <button class="btn btn-primary" onclick="save()">حفظ</button>
    </div>
  </div>`;

  html += `<div class="editor">
    <div class="editor-meta">
      <div class="field"><label>عنوان الفصل</label><input value="${ch.title}" onchange="updateCh('${baabId}','${chId}','title',this.value)"></div>
      <div class="field"><label>الترتيب</label><input type="number" value="${ch.number}" onchange="updateCh('${baabId}','${chId}','number',parseInt(this.value))"></div>
      <div class="field"><label>المعرّف</label><input value="${ch.id}" readonly style="opacity:.5"></div>
    </div>
    <div class="blocks">
      <div class="blocks-header">
        <span class="blocks-title">أقسام المحتوى (${arabNum(ch.sections?ch.sections.length:0)})</span>
      </div>`;

  if (ch.sections) {
    ch.sections.forEach((sec, si) => {
      html += renderBlockEditor(baabId, chId, sec, si);
    });
  }

  html += `</div>
    <div class="add-blocks">
      <button class="add-block-btn prose" onclick="addBlock('${baabId}','${chId}','prose')">+ نص</button>
      <button class="add-block-btn verse" onclick="addBlock('${baabId}','${chId}','verse')">+ آية</button>
      <button class="add-block-btn hadith" onclick="addBlock('${baabId}','${chId}','hadith')">+ حديث</button>
      <button class="add-block-btn reflection" onclick="addBlock('${baabId}','${chId}','reflection')">+ وقفة تأمل</button>
      <button class="add-block-btn pause" onclick="addBlock('${baabId}','${chId}','pause')">+ وقفة</button>
      <button class="add-block-btn divider" onclick="addBlock('${baabId}','${chId}','divider')">+ فاصل</button>
    </div>
  </div>`;

  main.innerHTML = html;
}

function renderBlockEditor(baabId, chId, sec, index) {
  if (sec.type === 'divider') {
    return `<div class="block">
      <div class="block-header">
        <div style="display:flex;align-items:center;gap:8px">
          <span class="block-handle">⠿</span>
          <span class="block-type divider">فاصل</span>
        </div>
        <div class="block-actions">
          <button class="block-action" onclick="moveBlock('${baabId}','${chId}',${index},-1)" title="أعلى">↑</button>
          <button class="block-action" onclick="moveBlock('${baabId}','${chId}',${index},1)" title="أسفل">↓</button>
          <button class="block-action del" onclick="removeBlock('${baabId}','${chId}',${index})" title="حذف">✕</button>
        </div>
      </div>
    </div>`;
  }

  const hasRef = sec.type === 'verse' || sec.type === 'hadith';
  return `<div class="block">
    <div class="block-header">
      <div style="display:flex;align-items:center;gap:8px">
        <span class="block-handle">⠿</span>
        <span class="block-type ${sec.type}">${typeLabels[sec.type]}</span>
      </div>
      <div class="block-actions">
        <button class="block-action" onclick="moveBlock('${baabId}','${chId}',${index},-1)" title="أعلى">↑</button>
        <button class="block-action" onclick="moveBlock('${baabId}','${chId}',${index},1)" title="أسفل">↓</button>
        <button class="block-action del" onclick="removeBlock('${baabId}','${chId}',${index})" title="حذف">✕</button>
      </div>
    </div>
    <div class="block-body">
      <textarea onchange="updateBlock('${baabId}','${chId}',${index},'content',this.value)">${sec.content||''}</textarea>
      ${hasRef ? `<div class="block-ref">
        <input placeholder="المرجع (مثل: سورة الروم: ٣٠)" value="${sec.reference||''}" onchange="updateBlock('${baabId}','${chId}',${index},'reference',this.value)">
      </div>` : ''}
    </div>
  </div>`;
}

// ─── CRUD Operations ───
function addBaab() {
  const num = bookData.baabs.length + 1;
  bookData.baabs.push({
    id: 'baab' + num, number: num,
    title: 'باب جديد', subtitle: '', status: 'draft', chapters: []
  });
  save();
  selectBaab('baab' + num);
}

function updateBaab(id, key, val) {
  const b = bookData.baabs.find(x => x.id === id);
  if (b) { b[key] = val; save(); }
}

function toggleBaabStatus(id) {
  const b = bookData.baabs.find(x => x.id === id);
  if (b) { b.status = b.status === 'published' ? 'draft' : 'published'; save(); selectBaab(id); }
}

function addChapter(baabId) {
  const b = bookData.baabs.find(x => x.id === baabId);
  if (!b.chapters) b.chapters = [];
  const num = b.chapters.length + 1;
  const ch = { id: 'ch' + num, number: num, title: 'فصل جديد', sections: [] };
  b.chapters.push(ch);
  save();
  editChapter(baabId, ch.id);
}

function deleteChapter(baabId, chId) {
  if (!confirm('هل أنت متأكد من حذف هذا الفصل؟')) return;
  const b = bookData.baabs.find(x => x.id === baabId);
  b.chapters = b.chapters.filter(c => c.id !== chId);
  save();
  selectBaab(baabId);
}

function updateCh(baabId, chId, key, val) {
  const b = bookData.baabs.find(x => x.id === baabId);
  const ch = b.chapters.find(c => c.id === chId);
  if (ch) { ch[key] = val; save(); }
}

function addBlock(baabId, chId, type) {
  const b = bookData.baabs.find(x => x.id === baabId);
  const ch = b.chapters.find(c => c.id === chId);
  if (!ch.sections) ch.sections = [];
  const block = { type };
  if (type !== 'divider') block.content = '';
  if (type === 'verse' || type === 'hadith') block.reference = '';
  ch.sections.push(block);
  save();
  editChapter(baabId, chId);
  // Scroll to bottom
  setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 100);
}

function removeBlock(baabId, chId, index) {
  const b = bookData.baabs.find(x => x.id === baabId);
  const ch = b.chapters.find(c => c.id === chId);
  ch.sections.splice(index, 1);
  save();
  editChapter(baabId, chId);
}

function moveBlock(baabId, chId, index, dir) {
  const b = bookData.baabs.find(x => x.id === baabId);
  const ch = b.chapters.find(c => c.id === chId);
  const newIndex = index + dir;
  if (newIndex < 0 || newIndex >= ch.sections.length) return;
  [ch.sections[index], ch.sections[newIndex]] = [ch.sections[newIndex], ch.sections[index]];
  save();
  editChapter(baabId, chId);
}

function updateBlock(baabId, chId, index, key, val) {
  const b = bookData.baabs.find(x => x.id === baabId);
  const ch = b.chapters.find(c => c.id === chId);
  ch.sections[index][key] = val;
  // Auto-save after a delay
  clearTimeout(window._saveTimeout);
  window._saveTimeout = setTimeout(() => save(), 1000);
}

// ─── Preview ───
function previewChapter(baabId, chId) {
  const b = bookData.baabs.find(x => x.id === baabId);
  const ch = b.chapters.find(c => c.id === chId);
  if (!ch) return;

  const pc = document.getElementById('previewContent');
  let html = `<div class="pv-ch-label">الفصل ${arabWord(ch.number)}</div>
    <div class="pv-ch-title">${ch.title}</div>`;

  if (ch.sections) {
    ch.sections.forEach(sec => {
      switch(sec.type) {
        case 'prose': html += `<p class="pv-prose">${sec.content}</p>`; break;
        case 'divider': html += `<div class="pv-divider"><i></i><span></span><i></i></div>`; break;
        case 'verse': html += `<div class="pv-verse"><p>﴿${sec.content}﴾</p><small>${sec.reference||''}</small></div>`; break;
        case 'hadith': html += `<div class="pv-hadith"><p>«${sec.content}»</p><small>${sec.reference||''}</small></div>`; break;
        case 'reflection': html += `<div class="pv-reflection"><p>${sec.content}</p></div>`; break;
        case 'pause': html += `<div class="pv-pause"><p>${sec.content}</p></div>`; break;
      }
    });
  }

  pc.innerHTML = html;
  document.getElementById('previewOverlay').classList.add('open');
}

function closePreview() {
  document.getElementById('previewOverlay').classList.remove('open');
}

// ─── Export ───
function exportAll() {
  bookData.baabs.forEach(baab => {
    const json = JSON.stringify(baab, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = baab.id + '.json';
    a.click();
    URL.revokeObjectURL(url);
  });

  // Also export book.json
  const bookMeta = {
    title: 'ولادة قلب',
    subtitle: 'منظور الفؤاد',
    author: 'م. أحمد سالم',
    baabs: bookData.baabs.map(b => ({
      id: b.id, number: b.number, title: b.title,
      subtitle: b.subtitle, status: b.status,
      chaptersCount: b.chapters ? b.chapters.length : 0
    }))
  };
  const blob2 = new Blob([JSON.stringify(bookMeta, null, 2)], { type: 'application/json' });
  const url2 = URL.createObjectURL(blob2);
  const a2 = document.createElement('a');
  a2.href = url2; a2.download = 'book.json'; a2.click();
  URL.revokeObjectURL(url2);

  toast('تم تصدير جميع الملفات');
}
