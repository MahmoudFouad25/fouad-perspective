<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ولادة قلب — منظور الفؤاد</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Scheherazade+New:wght@400;700&family=Tajawal:wght@300;400;500;700&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F3EC;--bg2:#F0EAE0;--card:#FFFDF8;--txt:#2C2420;--txt2:#6B5D52;--muted:#A89888;--grn:#1B4332;--grn2:#2D6A4F;--grn-bg:rgba(27,67,50,0.04);--gld:#C8963E;--gld2:#D4A574;--gld-bg:rgba(200,150,62,0.06);--bdr:rgba(44,36,32,0.08);--bdr-gld:rgba(200,150,62,0.2);--fd:'Amiri',serif;--fb:'Noto Naskh Arabic',serif;--fq:'Scheherazade New',serif;--fs:17px;--lh:2.15;--cw:720px;--bar-bg:rgba(248,243,236,0.92);--bar-bdr:rgba(44,36,32,0.06);--tr:0.35s cubic-bezier(0.4,0,0.2,1)}
[data-theme=dark]{--bg:#12100E;--bg2:#1C1916;--card:#252119;--txt:#E8DDD0;--txt2:#B5A48C;--muted:#7A6E60;--grn:#7BC4A5;--grn2:#5DCAA5;--gld:#D4A574;--gld2:#C8963E;--gld-bg:rgba(200,150,62,0.08);--grn-bg:rgba(45,106,79,0.08);--bdr:rgba(232,221,208,0.06);--bdr-gld:rgba(200,150,62,0.12);--bar-bg:rgba(18,16,14,0.94);--bar-bdr:rgba(232,221,208,0.06)}
[data-theme=sepia]{--bg:#F4EDE0;--bg2:#EDE4D4;--card:#FBF6ED;--txt:#3D2E1E;--txt2:#6B5740;--muted:#9A8568;--grn:#2D5A3F;--grn2:#3D7A5A;--gld:#B8862E;--gld2:#C8963E;--gld-bg:rgba(184,134,46,0.07);--grn-bg:rgba(45,90,63,0.05);--bdr:rgba(61,46,30,0.08);--bdr-gld:rgba(184,134,46,0.15);--bar-bg:rgba(244,237,224,0.94);--bar-bdr:rgba(61,46,30,0.06)}
*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:var(--fb);font-size:var(--fs);line-height:var(--lh);transition:background var(--tr),color var(--tr);-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:rgba(200,150,62,0.25)}::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--gld);border-radius:10px}

.pbar{position:fixed;top:0;left:0;right:0;height:3px;z-index:300;background:var(--bdr)}.pfill{height:100%;width:0%;background:linear-gradient(90deg,var(--grn),var(--gld));border-radius:0 2px 2px 0;transition:width .15s}

/* ═══ BARS ═══ */
.tbar{position:fixed;top:0;left:0;right:0;z-index:200;background:var(--bar-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:.5px solid var(--bar-bdr);transform:translateY(0);transition:transform .3s,opacity .3s}.tbar.hid{transform:translateY(-100%);opacity:0}
.tbar-in{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 20px}
.tbar-r{display:flex;align-items:center;gap:8px}
.tlogo{width:30px;height:30px;border-radius:8px;background:var(--grn-bg);border:.5px solid var(--bdr);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:15px;font-weight:700;color:var(--grn);cursor:pointer;transition:all .2s}.tlogo:hover{background:var(--grn);color:#F8F3EC}
.tbar-c{flex:1;text-align:center;padding:0 12px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tbar-c b{color:var(--gld);font-weight:600}
.tbar-l{display:flex;align-items:center;gap:6px}
.bb{width:34px;height:34px;border-radius:8px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--txt2);font-size:15px;transition:all .2s}.bb:hover{background:var(--bg2);color:var(--txt)}.bb.on{background:var(--grn-bg);color:var(--grn)}

.bbar{position:fixed;bottom:0;left:0;right:0;z-index:200;background:var(--bar-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:.5px solid var(--bar-bdr);transform:translateY(0);transition:transform .3s,opacity .3s}.bbar.hid{transform:translateY(100%);opacity:0}
.bbar-in{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:8px 16px}
.nb{display:flex;align-items:center;gap:4px;padding:8px 12px;border-radius:10px;border:none;background:transparent;cursor:pointer;font-family:var(--fb);font-size:11px;color:var(--txt2);transition:all .2s}.nb:hover{background:var(--grn-bg);color:var(--grn)}.nb svg{width:14px;height:14px;flex-shrink:0}
.bbar-c{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}.bbar-dot{width:3px;height:3px;border-radius:50%;background:var(--gld)}
.bbar-a{display:flex;align-items:center;gap:2px}

/* ═══ PANELS ═══ */
.ov{position:fixed;inset:0;z-index:249;background:rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .3s}.ov.on{opacity:1;pointer-events:all}
.side{position:fixed;top:0;right:0;bottom:0;z-index:260;width:300px;max-width:84vw;background:var(--bg);border-left:.5px solid var(--bdr);transform:translateX(100%);transition:transform var(--tr);overflow-y:auto;box-shadow:-4px 0 24px rgba(0,0,0,.06)}.side.on{transform:translateX(0)}
.side-hd{padding:20px;display:flex;align-items:center;justify-content:space-between;border-bottom:.5px solid var(--bdr)}.side-t{font-family:var(--fd);font-size:18px;font-weight:700;color:var(--grn)}
.xb{width:30px;height:30px;border:none;background:none;cursor:pointer;color:var(--txt2);border-radius:8px;font-size:16px;display:flex;align-items:center;justify-content:center}.xb:hover{background:var(--bg2)}
.side-bd{padding:14px}
.sb-b{padding:12px 14px;margin-bottom:8px;border-radius:12px;background:var(--gld-bg);border:.5px solid var(--bdr-gld);cursor:pointer;transition:all .2s}.sb-b:hover{border-color:var(--gld)}.sb-b.act{border-color:var(--gld);box-shadow:0 0 0 2px var(--gld-bg)}.sb-bn{font-family:var(--fd);font-size:13px;font-weight:700;color:var(--gld);margin-bottom:2px}.sb-bt{font-size:14px;font-weight:600;color:var(--txt)}
.sb-ch{padding:9px 14px;margin:2px 0;border-radius:8px;cursor:pointer;font-size:13px;color:var(--txt2);display:flex;align-items:center;gap:8px;transition:all .15s}.sb-ch:hover{background:var(--bg2);color:var(--txt)}.sb-ch.act{background:var(--grn-bg);color:var(--grn);font-weight:600}.sb-cd{width:6px;height:6px;border-radius:50%;background:var(--muted);flex-shrink:0}.sb-ch.act .sb-cd{background:var(--grn)}.sb-ch.done .sb-cd{background:var(--gld)}

/* Settings */
.sett{position:fixed;top:0;left:0;bottom:0;z-index:260;width:320px;max-width:88vw;background:var(--bg);border-right:.5px solid var(--bdr);transform:translateX(-100%);transition:transform var(--tr);overflow-y:auto;box-shadow:4px 0 24px rgba(0,0,0,.06)}.sett.on{transform:translateX(0)}
.sett-hd{padding:18px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:.5px solid var(--bdr)}.sett-t{font-size:15px;font-weight:600}
.sett-bd{padding:18px 20px}.sg{margin-bottom:24px}.sg-l{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:10px;letter-spacing:.3px}
.sg-g{display:grid;gap:8px}.sg-g.g3{grid-template-columns:1fr 1fr 1fr}.sg-g.g4{grid-template-columns:1fr 1fr 1fr 1fr}
.sg-b{padding:10px 8px;background:var(--bg2);border:1.5px solid transparent;border-radius:8px;color:var(--txt2);font-family:var(--fb);font-size:12px;cursor:pointer;transition:all .2s;text-align:center}.sg-b:hover{border-color:var(--gld)}.sg-b.on{background:var(--grn);border-color:var(--grn);color:#F8F3EC;font-weight:600}
.thr{display:flex;gap:10px}.thb{width:46px;height:46px;border-radius:12px;border:2px solid transparent;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;font-size:20px}.thb:hover{transform:scale(1.08)}.thb.on{border-color:var(--gld);box-shadow:0 0 0 3px var(--gld-bg)}.thl{background:#F8F3EC;border-color:#ddd}.thd{background:#12100E;border-color:#333}.ths{background:#F4EDE0;border-color:#ccc}
.sslider{width:100%;height:6px;border-radius:3px;background:var(--bg2);-webkit-appearance:none;appearance:none;cursor:pointer;margin-top:8px}.sslider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--grn);cursor:pointer}

/* ═══ MAIN ═══ */
.mc{max-width:var(--cw);margin:0 auto;padding:76px 24px 100px;min-height:100vh;transition:max-width .3s}

/* ═══ IFRAME MODE ═══ */
.iframe-wrap{position:fixed;top:0;left:0;right:0;bottom:0;z-index:1}
.iframe-wrap iframe{width:100%;height:100%;border:none}
.iframe-wrap.pad{top:52px;bottom:52px}

/* ═══ COVER ═══ */
.cover{min-height:85vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;position:relative}
.cover::before{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:radial-gradient(ellipse at center top,rgba(200,150,62,0.05) 0%,transparent 65%);pointer-events:none}
.clogo{font-family:var(--fd);font-size:44px;font-weight:700;color:var(--gld);width:90px;height:90px;border-radius:50%;background:var(--gld-bg);display:flex;align-items:center;justify-content:center;border:1.5px solid var(--bdr-gld);margin-bottom:28px;animation:cpulse 3s ease-in-out infinite;position:relative;z-index:1}
@keyframes cpulse{0%,100%{box-shadow:0 0 0 0 rgba(200,150,62,.12)}50%{box-shadow:0 0 0 16px rgba(200,150,62,0)}}
.cover h1{font-family:var(--fd);font-size:2.6em;font-weight:700;color:var(--grn);line-height:1.4;margin-bottom:8px;position:relative;z-index:1}
.cover .csub{font-size:1.1em;color:var(--gld);margin-bottom:4px;font-weight:500}.cover .cauth{font-size:.9em;color:var(--muted);margin-bottom:36px}
.cstart{display:inline-flex;align-items:center;gap:8px;padding:14px 36px;background:var(--grn);color:#F8F3EC;border:none;border-radius:12px;font-family:var(--fb);font-size:1em;font-weight:600;cursor:pointer;transition:all .3s;box-shadow:0 4px 18px rgba(27,67,50,.2);position:relative;z-index:1}.cstart:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(27,67,50,.3)}
.toc{max-width:600px;margin:0 auto;padding:0 24px 60px}.toc h2{font-family:var(--fd);font-size:1.6em;color:var(--grn);text-align:center;margin-bottom:28px}
.tq{margin-bottom:24px}.tq-l{display:inline-flex;align-items:center;gap:8px;margin-bottom:10px;padding:5px 14px;background:var(--gld-bg);border-radius:16px;font-size:12px;color:var(--gld);font-weight:600}
.ti{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:8px;border-radius:12px;border:.5px solid var(--bdr);cursor:pointer;transition:all .25s}.ti:hover{background:var(--grn-bg);border-color:rgba(45,106,79,0.12);transform:translateX(-3px)}.ti.lk{opacity:.42;cursor:default}.ti.lk:hover{background:transparent;border-color:var(--bdr);transform:none}
.ti-n{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:15px;font-weight:700;flex-shrink:0}.ti-n.pub{background:var(--grn);color:#F8F3EC}.ti-n.dft{background:var(--gld-bg);color:var(--gld);border:1px solid var(--bdr-gld)}
.ti-info{flex:1}.ti-tt{font-size:14px;font-weight:600}.ti-st{font-size:12px;color:var(--txt2);margin-top:2px}
.ti-badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500}.ti-badge.pub{background:rgba(45,106,79,0.08);color:var(--grn2)}.ti-badge.soon{background:var(--gld-bg);color:var(--gld)}

/* ═══ BLOCKS FALLBACK ═══ */
.chd{text-align:center;margin-bottom:56px;position:relative}
.chd::before{content:'';position:absolute;top:-40px;left:50%;transform:translateX(-50%);width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,var(--gld-bg) 0%,transparent 70%);pointer-events:none;animation:pglow 4s ease-in-out infinite}
@keyframes pglow{0%,100%{opacity:.4;transform:translateX(-50%) scale(1)}50%{opacity:.8;transform:translateX(-50%) scale(1.1)}}
.chlbl{display:inline-flex;align-items:center;gap:14px;margin-bottom:16px;position:relative}.chlbl-l{width:50px;height:.5px;background:var(--gld)}.chlbl-t{font-size:12px;color:var(--gld);letter-spacing:1.5px;font-weight:600}
.chtit{font-family:var(--fd);font-size:2.2em;font-weight:700;color:var(--grn);line-height:1.5;margin-bottom:10px;position:relative}
.chorn{color:var(--gld);font-size:20px;opacity:.4;letter-spacing:8px}
.blk{opacity:0;transform:translateY(20px);transition:opacity .7s ease,transform .7s ease}.blk.vis{opacity:1;transform:translateY(0)}
.bk-prose{margin-bottom:1.6em;text-align:justify}.bk-prose strong{color:var(--grn);font-weight:600}.bk-prose em{color:var(--gld);font-style:normal;font-weight:500}
.bk-verse{margin:2.4em 0;padding:28px 32px;position:relative;background:var(--gld-bg);border-radius:16px;border-right:4px solid var(--gld);text-align:center;overflow:hidden}.bk-verse::after{content:'﴿﴾';position:absolute;top:8px;left:14px;font-family:var(--fq);font-size:48px;color:var(--gld);opacity:.08}.bk-verse p{font-family:var(--fq);font-size:1.25em;line-height:2.3;color:var(--grn);position:relative}.bk-verse small{font-size:.72em;color:var(--muted);display:block;margin-top:12px;font-family:var(--fb);position:relative}
.bk-hadith{margin:2.4em 0;padding:24px 28px;background:var(--grn-bg);border-radius:14px;border-right:4px solid var(--grn2);text-align:center}.bk-hadith p{font-size:1.02em;line-height:2.1;font-style:italic}.bk-hadith small{font-size:.72em;color:var(--muted);display:block;margin-top:10px}
.bk-refl{margin:2.8em 0;padding:26px 28px;background:var(--grn-bg);border-radius:16px;border:.5px solid rgba(45,106,79,0.1);position:relative}.bk-refl::before{content:'؟';position:absolute;top:-14px;right:22px;width:28px;height:28px;background:var(--grn2);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#F8F3EC;font-size:14px;line-height:28px;text-align:center}.bk-refl p{font-size:.93em;line-height:2.1;color:var(--txt2);white-space:pre-line;padding-top:4px}
.bk-pause{margin:2.4em 0;padding:20px 24px;background:var(--gld-bg);border-radius:16px;border:.5px solid rgba(200,150,62,0.15);text-align:center}.bk-pause p{font-size:.93em;line-height:2;color:var(--gld);font-weight:500}
.bk-div{text-align:center;margin:3em 0;display:flex;align-items:center;justify-content:center;gap:10px}.bk-div i{width:30px;height:.5px;background:var(--muted);opacity:.25;display:inline-block}.bk-div b{width:5px;height:5px;border-radius:50%;background:var(--gld);opacity:.5;display:inline-block}
.bk-emph{margin:2.4em 0;padding:24px 28px;background:linear-gradient(135deg,var(--gld-bg),transparent);border-right:4px solid var(--gld);border-radius:0 14px 14px 0}.bk-emph p{font-size:1em;line-height:2.1}

.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px}.loading .llogo{font-family:var(--fd);font-size:40px;font-weight:700;color:var(--gld);width:80px;height:80px;border-radius:50%;background:var(--gld-bg);display:flex;align-items:center;justify-content:center;border:1.5px solid var(--bdr-gld);animation:cpulse 2s ease-in-out infinite}.loading p{font-size:14px;color:var(--muted)}
.authwall{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;gap:16px}.authwall h2{font-family:var(--fd);font-size:1.8em;color:var(--grn)}.authwall p{color:var(--txt2);font-size:1em;max-width:400px}.authwall a{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;background:var(--grn);color:#F8F3EC;border-radius:10px;font-family:var(--fb);font-size:.95em;font-weight:600;text-decoration:none}
.cnav{display:flex;align-items:center;justify-content:space-between;margin-top:52px;padding-top:22px;border-top:.5px solid var(--bdr)}.cn-b{display:flex;align-items:center;gap:6px;padding:10px 16px;border:.5px solid var(--bdr);border-radius:10px;background:none;cursor:pointer;font-family:var(--fb);font-size:13px;color:var(--txt2);transition:all .2s;max-width:45%}.cn-b:hover{background:var(--grn-bg);color:var(--grn)}.cn-b svg{width:14px;height:14px;flex-shrink:0}.cn-c{font-size:12px;color:var(--muted)}

@media(max-width:600px){.mc{padding:68px 18px 90px}.chtit{font-size:1.6em}.bk-verse,.bk-hadith{margin:1.6em 0;padding:20px 18px}.side{width:260px}.sett{width:100%}.tbar-in,.bbar-in{padding:8px 14px}.nb span{display:none}.cover h1{font-size:2em}}
</style>
</head>
<body>

<div class="pbar"><div class="pfill" id="pf"></div></div>

<nav class="tbar" id="tbar">
  <div class="tbar-in">
    <div class="tbar-r"><div class="tlogo" onclick="toggleSide()">و</div><button class="bb" onclick="toggleSide()">☰</button></div>
    <div class="tbar-c" id="tbarTitle"></div>
    <div class="tbar-l"><button class="bb" onclick="toggleSett()">⚙</button><button class="bb" onclick="toggleThQ()" id="thqBtn">🌙</button></div>
  </div>
</nav>

<div class="bbar" id="bbar">
  <div class="bbar-in">
    <button class="nb" id="navNext" onclick="goNext()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg><span id="navNextT"></span></button>
    <div class="bbar-a">
      <button class="bb" onclick="toggleAS()" id="asBtn" title="قراءة تلقائية" style="font-size:14px">▶</button>
      <button class="bb" onclick="saveBM()" id="bmBtn" title="حفظ الموضع" style="font-size:14px">🔖</button>
    </div>
    <div class="bbar-c"><span id="chNum"></span><span class="bbar-dot"></span><span id="chTotal"></span></div>
    <button class="nb" id="navPrev" onclick="goPrev()"><span id="navPrevT"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>
</div>

<div class="ov" id="ov" onclick="closeAll()"></div>

<aside class="side" id="side">
  <div class="side-hd"><span class="side-t">ولادة قلب</span><button class="xb" onclick="toggleSide()">✕</button></div>
  <div class="side-bd" id="sideBd"></div>
</aside>

<div class="sett" id="sett">
  <div class="sett-hd"><span class="sett-t">⚙ إعدادات القراءة</span><button class="xb" onclick="toggleSett()">✕</button></div>
  <div class="sett-bd">
    <div class="sg"><div class="sg-l">🔤 حجم الخط</div><div class="sg-g g4"><button class="sg-b" onclick="setFS(this,15)">صغير</button><button class="sg-b on" onclick="setFS(this,17)">متوسط</button><button class="sg-b" onclick="setFS(this,20)">كبير</button><button class="sg-b" onclick="setFS(this,24)">ضخم</button></div></div>
    <div class="sg"><div class="sg-l">📏 تباعد الأسطر</div><div class="sg-g g4"><button class="sg-b" onclick="setLH(this,1.7)">مضغوط</button><button class="sg-b on" onclick="setLH(this,2.15)">عادي</button><button class="sg-b" onclick="setLH(this,2.4)">مريح</button><button class="sg-b" onclick="setLH(this,2.7)">واسع</button></div></div>
    <div class="sg"><div class="sg-l">📐 عرض المحتوى</div><div class="sg-g g3"><button class="sg-b" onclick="setCW(this,580)">ضيق</button><button class="sg-b on" onclick="setCW(this,720)">عادي</button><button class="sg-b" onclick="setCW(this,920)">واسع</button></div></div>
    <div class="sg"><div class="sg-l">🎨 وضع القراءة</div><div class="thr"><button class="thb thl on" onclick="setTh(this,'')">☀</button><button class="thb thd" onclick="setTh(this,'dark')">🌙</button><button class="thb ths" onclick="setTh(this,'sepia')">📜</button></div></div>
    <div class="sg"><div class="sg-l">⏬ سرعة القراءة التلقائية</div><input type="range" class="sslider" min="1" max="5" value="2" id="aSpeed"><div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:4px"><span>بطيء</span><span>سريع</span></div></div>
    <div class="sg" style="font-size:11px;color:var(--muted);border-top:1px solid var(--bdr);padding-top:16px">
      <p>💡 <b>ملاحظة:</b> إعدادات الخط والتباعد تعمل فقط مع الفصول النصية. الفصول المصممة لها تصميمها الخاص.</p>
    </div>
  </div>
</div>

<!-- IFRAME for designed chapters -->
<div class="iframe-wrap pad" id="iframeWrap" style="display:none">
  <iframe id="chFrame" src="about:blank"></iframe>
</div>

<!-- Content for blocks-based chapters + cover -->
<main class="mc" id="mc"><div class="loading"><div class="llogo">و</div><p>جاري التحميل...</p></div></main>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyDj0bV5gsyRbqpxzW0Zd9wjYmq53-Xdj3w",authDomain:"fouad-perspective.firebaseapp.com",projectId:"fouad-perspective",storageBucket:"fouad-perspective.firebasestorage.app",messagingSenderId:"1068763865336",appId:"1:1068763865336:web:b791abcd22d536aedd5b0d"});
const db=firebase.firestore(),auth=firebase.auth();
const toAr=n=>String(n).replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const arW=n=>['','الأوّل','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر'][n]||toAr(n);
const QS={'السؤال الأول':'مين أنا؟','السؤال الثاني':'ليه مش عايش كده؟','السؤال الثالث':'إزاي المنظومة بتشتغل؟','السؤال الرابع':'أنا فين دلوقتي؟','السؤال الخامس':'إزاي أرجع؟'};

let uid=null,allBaabs=[],curBaab=null,curChIdx=0,curTh='',curMode='blocks'; // 'blocks' or 'iframe'

/* ═══ AUTH ═══ */
auth.onAuthStateChanged(async u=>{
  uid=u?u.uid:null;
  if(!uid){try{const enc=localStorage.getItem('_enc_user');if(enc){uid=JSON.parse(decodeURIComponent(atob(enc.split('').reverse().join('')))).id}}catch(e){}}
  if(!uid)uid=localStorage.getItem('userId');
  if(!uid){showAuth();return}
  restorePrefs();await loadBook();
});
function showAuth(){document.getElementById('tbar').style.display='none';document.getElementById('bbar').style.display='none';document.getElementById('mc').innerHTML=`<div class="authwall"><div class="clogo" style="margin-bottom:20px">و</div><h2>ولادة قلب</h2><p>يجب تسجيل الدخول أولاً</p><a href="../login.html">تسجيل الدخول ←</a></div>`}

/* ═══ LOAD ═══ */
async function loadBook(){
  try{const s=await db.collection('wiladatqalb_baabs').orderBy('number').get();allBaabs=[];if(!s.empty)s.forEach(d=>allBaabs.push({id:d.id,...d.data()}))}catch(e){allBaabs=[]}
  const p=new URLSearchParams(location.search);const bid=p.get('baab'),cid=p.get('ch');
  if(bid){const b=allBaabs.find(x=>x.id===bid);if(b&&b.chapters&&b.chapters.length){curBaab=b;curChIdx=cid?Math.max(0,b.chapters.findIndex(c=>c.id===cid)):0;showReader();return}}
  if(uid){try{const pr=await db.collection('wiladatqalb_progress').doc(uid).get();if(pr.exists){const d=pr.data(),b=allBaabs.find(x=>x.id===d.currentBaab);if(b&&b.chapters&&b.chapters.length){curBaab=b;curChIdx=d.currentChapter||0;showReader();return}}}catch(e){}}
  showCover();
}

/* ═══ COVER ═══ */
function showCover(){
  hideIframe();document.getElementById('tbar').style.display='none';document.getElementById('bbar').style.display='none';
  let h=`<div class="cover"><div class="clogo">و</div><h1>ولادة قلب</h1><p class="csub">منظور الفؤاد</p><p class="cauth">م. أحمد سالم</p><button class="cstart" onclick="startRead()">ابدأ الرحلة ←</button></div><div class="toc"><h2>رحلة الكتاب</h2>`;
  let cq='';allBaabs.forEach(b=>{const q=b.q||'';if(q!==cq){if(cq)h+='</div>';cq=q;h+=`<div class="tq"><div class="tq-l">◆ ${q}: ${QS[q]||''}</div>`}const pub=b.status==='published',hasCh=b.chapters&&b.chapters.length>0,ok=pub&&hasCh;h+=`<div class="ti ${ok?'':'lk'}" ${ok?`onclick="openBaab('${b.id}')"`:''}>
  <div class="ti-n ${pub?'pub':'dft'}">${toAr(b.number)}</div><div class="ti-info"><div class="ti-tt">الباب ${arW(b.number)}: ${b.title}</div><div class="ti-st">${b.subtitle||b.sub||''}</div></div><span class="ti-badge ${ok?'pub':'soon'}">${ok?'متاح':'قريبًا'}</span></div>`});if(cq)h+='</div>';h+='</div>';document.getElementById('mc').innerHTML=h;
}
function startRead(){const p=allBaabs.find(b=>b.status==='published'&&b.chapters&&b.chapters.length);if(p)openBaab(p.id)}
function openBaab(id){const b=allBaabs.find(x=>x.id===id);if(!b||!b.chapters||!b.chapters.length)return;curBaab=b;curChIdx=0;showReader();history.replaceState(null,'',`?baab=${id}`)}

/* ═══ READER ═══ */
function showReader(){
  document.getElementById('tbar').style.display='';document.getElementById('bbar').style.display='';
  buildSide();renderCh();
}

/* ═══ RENDER CHAPTER — HYBRID ═══ */
function renderCh(){
  const ch=curBaab.chapters[curChIdx];if(!ch)return;
  updateNav();saveProg();

  // CHECK: does chapter have htmlFile?
  if(ch.htmlFile){
    // ═══ IFRAME MODE: load designed HTML page ═══
    curMode='iframe';
    document.getElementById('mc').style.display='none';
    document.getElementById('iframeWrap').style.display='';
    document.getElementById('chFrame').src=ch.htmlFile;
    // Listen for scroll from iframe
    window.addEventListener('message',handleIframeMsg);
  } else {
    // ═══ BLOCKS MODE: render from sections ═══
    curMode='blocks';
    hideIframe();
    let h=`<div class="chd blk"><div class="chlbl"><div class="chlbl-l"></div><span class="chlbl-t">الفصل ${arW(ch.number||curChIdx+1)}</span><div class="chlbl-l"></div></div><h1 class="chtit">${ch.title}</h1><div class="chorn">❦ ❦ ❦</div></div>`;
    if(ch.sections)ch.sections.forEach(s=>{switch(s.type){
      case'prose':h+=`<div class="blk bk-prose">${rich(s.content)}</div>`;break;
      case'verse':h+=`<div class="blk bk-verse"><p>﴿${s.content}﴾</p><small>${s.reference||''}</small></div>`;break;
      case'hadith':h+=`<div class="blk bk-hadith"><p>«${s.content}»</p><small>${s.reference||''}</small></div>`;break;
      case'reflection':h+=`<div class="blk bk-refl"><p>${rich(s.content)}</p></div>`;break;
      case'pause':h+=`<div class="blk bk-pause"><p>${rich(s.content)}</p></div>`;break;
      case'divider':h+=`<div class="blk bk-div"><i></i><b></b><i></i></div>`;break;
      case'emphasis':h+=`<div class="blk bk-emph"><p>${rich(s.content)}</p></div>`;break;
    }});
    // Chapter nav
    h+=`<div class="cnav">`;
    if(curChIdx<curBaab.chapters.length-1){const nx=curBaab.chapters[curChIdx+1];h+=`<button class="cn-b" onclick="goNext()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg><span>${nx.title}</span></button>`}else h+='<div></div>';
    h+=`<span class="cn-c">${toAr(curChIdx+1)} من ${toAr(curBaab.chapters.length)}</span>`;
    if(curChIdx>0){const pv=curBaab.chapters[curChIdx-1];h+=`<button class="cn-b" onclick="goPrev()"><span>${pv.title}</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>`}else h+='<div></div>';
    h+='</div>';
    document.getElementById('mc').innerHTML=h;window.scrollTo({top:0});
    setTimeout(()=>{const obs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('vis');obs.unobserve(e.target)}})},{threshold:.06});document.querySelectorAll('.blk').forEach(el=>obs.observe(el))},50);
  }
}

function hideIframe(){document.getElementById('iframeWrap').style.display='none';document.getElementById('mc').style.display='';window.removeEventListener('message',handleIframeMsg)}
function handleIframeMsg(e){if(e.data&&e.data.type==='scroll')document.getElementById('pf').style.width=e.data.pct+'%'}
function rich(t){if(!t)return'';return t.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>').replace(/\n/g,'<br>')}

/* ═══ NAV ═══ */
function updateNav(){
  const ch=curBaab.chapters[curChIdx];
  document.getElementById('tbarTitle').innerHTML=`<b>${curBaab.title}</b> · ${ch.title}`;
  document.getElementById('chNum').textContent=toAr(curChIdx+1);document.getElementById('chTotal').textContent='من '+toAr(curBaab.chapters.length);
  const nx=curChIdx<curBaab.chapters.length-1?curBaab.chapters[curChIdx+1]:null;const pv=curChIdx>0?curBaab.chapters[curChIdx-1]:null;
  document.getElementById('navNextT').textContent=nx?nx.title:'';document.getElementById('navPrevT').textContent=pv?pv.title:'';
  document.getElementById('navNext').style.visibility=nx?'':'hidden';document.getElementById('navPrev').style.visibility=pv?'':'hidden';
  updateSideActive();
}
function goNext(){if(curChIdx<curBaab.chapters.length-1){curChIdx++;renderCh();closeAll()}}
function goPrev(){if(curChIdx>0){curChIdx--;renderCh();closeAll()}}
function goToCh(idx){curChIdx=idx;renderCh();closeAll()}

/* ═══ SIDEBAR ═══ */
function buildSide(){
  if(!curBaab)return;let h=`<div class="sb-b act"><div class="sb-bn">الباب ${arW(curBaab.number)}</div><div class="sb-bt">${curBaab.title}</div></div>`;
  if(curBaab.chapters)curBaab.chapters.forEach((ch,i)=>{h+=`<div class="sb-ch ${i===curChIdx?'act':''} ${i<curChIdx?'done':''}" onclick="goToCh(${i})" data-i="${i}"><span class="sb-cd"></span>${ch.title}</div>`});
  allBaabs.filter(b=>b.id!==curBaab.id&&b.status==='published'&&b.chapters&&b.chapters.length).forEach(b=>{h+=`<div class="sb-b" style="margin-top:12px;opacity:.6" onclick="openBaab('${b.id}')"><div class="sb-bn">الباب ${arW(b.number)}</div><div class="sb-bt">${b.title}</div></div>`});
  document.getElementById('sideBd').innerHTML=h;
}
function updateSideActive(){document.querySelectorAll('.sb-ch').forEach(el=>{const i=parseInt(el.dataset.i);el.classList.toggle('act',i===curChIdx);el.classList.toggle('done',i<curChIdx)})}
function toggleSide(){const s=document.getElementById('side'),on=s.classList.contains('on');closeAll();if(!on){s.classList.add('on');document.getElementById('ov').classList.add('on')}}
function toggleSett(){const s=document.getElementById('sett'),on=s.classList.contains('on');closeAll();if(!on){s.classList.add('on');document.getElementById('ov').classList.add('on')}}
function closeAll(){document.getElementById('side').classList.remove('on');document.getElementById('sett').classList.remove('on');document.getElementById('ov').classList.remove('on')}

/* ═══ SETTINGS ═══ */
function act(b){const p=b.closest('.sg-g')||b.closest('.thr');if(p)p.querySelectorAll('.sg-b,.thb').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
function setFS(b,v){act(b);document.documentElement.style.setProperty('--fs',v+'px');localStorage.setItem('wq-fs',v)}
function setLH(b,v){act(b);document.documentElement.style.setProperty('--lh',v);localStorage.setItem('wq-lh',v)}
function setCW(b,v){act(b);document.documentElement.style.setProperty('--cw',v+'px');localStorage.setItem('wq-cw',v)}
function setTh(b,th){act(b);curTh=th;document.documentElement.setAttribute('data-theme',th);document.getElementById('thqBtn').textContent=th==='dark'?'☀':'🌙';localStorage.setItem('wq-th',th)}
function toggleThQ(){setTh(document.querySelector(curTh==='dark'?'.thl':'.thd'),curTh==='dark'?'':'dark')}
function restorePrefs(){const fs=localStorage.getItem('wq-fs');if(fs)document.documentElement.style.setProperty('--fs',fs+'px');const lh=localStorage.getItem('wq-lh');if(lh)document.documentElement.style.setProperty('--lh',lh);const cw=localStorage.getItem('wq-cw');if(cw)document.documentElement.style.setProperty('--cw',cw+'px');const th=localStorage.getItem('wq-th');if(th){curTh=th;document.documentElement.setAttribute('data-theme',th);document.getElementById('thqBtn').textContent=th==='dark'?'☀':'🌙'}}

/* ═══ PROGRESS ═══ */
function saveProg(){if(!uid||!curBaab)return;db.collection('wiladatqalb_progress').doc(uid).set({currentBaab:curBaab.id,currentChapter:curChIdx,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}).catch(e=>{})}
function saveBM(){if(!uid||!curBaab)return;const sy=curMode==='iframe'?0:window.scrollY;db.collection('wiladatqalb_bookmarks').doc(uid).set({baabId:curBaab.id,chapterIdx:curChIdx,scrollY:sy,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}).catch(e=>{});const b=document.getElementById('bmBtn');b.textContent='✅';setTimeout(()=>b.textContent='🔖',1500)}

/* ═══ AUTO-SCROLL ═══ */
let asOn=false,asInt;
function toggleAS(){asOn=!asOn;const b=document.getElementById('asBtn');b.textContent=asOn?'⏸':'▶';b.classList.toggle('on',asOn);
  if(asOn){const sp=document.getElementById('aSpeed').value;const px=[0.3,0.6,1,1.8,3][sp-1];
    if(curMode==='iframe'){const f=document.getElementById('chFrame');asInt=setInterval(()=>{try{f.contentWindow.scrollBy(0,px)}catch(e){}},16)}
    else{asInt=setInterval(()=>window.scrollBy(0,px),16)}
  }else clearInterval(asInt)}

/* ═══ SCROLL ═══ */
let lastY=0,bHid=false;
window.addEventListener('scroll',()=>{
  if(curMode==='iframe')return;
  const y=window.scrollY,h=document.documentElement.scrollHeight-window.innerHeight;
  if(h>0)document.getElementById('pf').style.width=Math.round(y/h*100)+'%';
  if(y>120&&y>lastY+8&&!bHid){document.getElementById('tbar').classList.add('hid');document.getElementById('bbar').classList.add('hid');bHid=true}
  else if(y<lastY-8&&bHid){document.getElementById('tbar').classList.remove('hid');document.getElementById('bbar').classList.remove('hid');bHid=false}lastY=y;
});

/* ═══ KEYBOARD ═══ */
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll();if(e.key==='ArrowLeft'&&curBaab)goNext();if(e.key==='ArrowRight'&&curBaab)goPrev()});
</script>
</body>
</html>
