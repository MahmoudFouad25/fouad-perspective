<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ولادة قلب — منظور الفؤاد</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Scheherazade+New:wght@400;700&family=Tajawal:wght@300;400;500;700&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8F3EC;--bg2:#F0EAE0;--card:#FFF;
  --txt:#2C2420;--txt2:#6B5D52;--muted:#A89888;
  --grn:#1B4332;--grn2:#2D6A4F;--grn-bg:rgba(27,67,50,0.04);
  --gld:#C8963E;--gld2:#D4A574;--gld-bg:rgba(200,150,62,0.06);
  --bdr:rgba(44,36,32,0.08);--bdr-gld:rgba(200,150,62,0.2);
  --shd:0 2px 20px rgba(44,36,32,0.06);
  --fd:'Amiri',serif;--fb:'Noto Naskh Arabic',serif;--fq:'Scheherazade New',serif;
  --fs:17px;--lh:2.15;--cw:700px;
  --tr:0.35s cubic-bezier(0.4,0,0.2,1);
}
[data-theme=dark]{
  --bg:#1A1612;--bg2:#231E19;--card:#2C261F;
  --txt:#E8DDD0;--txt2:#B5A48C;--muted:#7A6E60;
  --grn:#7BC4A5;--grn2:#5DCAA5;--gld:#D4A574;--gld2:#C8963E;
  --gld-bg:rgba(200,150,62,0.08);--grn-bg:rgba(45,106,79,0.08);
  --bdr:rgba(232,221,208,0.08);--bdr-gld:rgba(200,150,62,0.15);
  --shd:0 2px 20px rgba(0,0,0,.2);
}
[data-theme=sepia]{
  --bg:#F4EDE0;--bg2:#EDE4D4;--card:#FBF6ED;
  --txt:#3D2E1E;--txt2:#6B5740;--muted:#9A8568;
  --grn:#2D5A3F;--grn2:#3D7A5A;--gld:#B8862E;--gld2:#C8963E;
  --gld-bg:rgba(184,134,46,0.07);--grn-bg:rgba(45,90,63,0.05);
  --bdr:rgba(61,46,30,0.1);--bdr-gld:rgba(184,134,46,0.2);
  --shd:0 2px 20px rgba(61,46,30,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:var(--fb);font-size:var(--fs);line-height:var(--lh);transition:background var(--tr),color var(--tr);-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:rgba(200,150,62,0.25)}
::-webkit-scrollbar{width:7px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--gld);border-radius:10px;opacity:.5}

/* ═══ PROGRESS BAR ═══ */
.pbar{position:fixed;top:0;left:0;right:0;height:3px;background:var(--bdr);z-index:200}
.pfill{height:100%;background:linear-gradient(90deg,var(--grn),var(--grn2));width:0%;transition:width .15s;border-radius:0 2px 2px 0}

/* ═══ TOP NAV ═══ */
.tnav{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--bg);border-bottom:.5px solid var(--bdr);transition:background var(--tr),transform .3s;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.tnav.hid{transform:translateY(-100%)}
.tnav-in{max-width:calc(var(--cw) + 80px);margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 24px}
.tnav-t{font-family:var(--fd);font-size:15px;font-weight:700;color:var(--grn);cursor:pointer;display:flex;align-items:center;gap:6px}
.tnav-logo{width:26px;height:26px;border-radius:6px;background:var(--grn-bg);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:14px;font-weight:700;color:var(--grn)}
.tnav-ch{font-size:12px;color:var(--muted);text-align:center;flex:1;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tnav-r{display:flex;align-items:center;gap:6px}
.nb{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:none;background:none;cursor:pointer;color:var(--txt2);border-radius:8px;transition:background .2s,color .2s;font-size:15px}
.nb:hover{background:var(--bg2);color:var(--txt)}
.nb.act{background:var(--grn-bg);color:var(--grn)}

/* ═══ OVERLAY ═══ */
.ov{position:fixed;inset:0;z-index:149;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .3s}
.ov.on{opacity:1;pointer-events:all}

/* ═══ SIDEBAR ═══ */
.sb{position:fixed;top:0;right:0;bottom:0;z-index:150;width:300px;max-width:84vw;background:var(--bg);transform:translateX(100%);transition:transform var(--tr);overflow-y:auto;border-left:.5px solid var(--bdr)}
.sb.on{transform:translateX(0)}
.sb-hd{padding:20px;display:flex;align-items:center;justify-content:space-between;border-bottom:.5px solid var(--bdr)}
.sb-t{font-family:var(--fd);font-size:18px;font-weight:700;color:var(--grn)}
.sb-x{width:30px;height:30px;border:none;background:none;cursor:pointer;color:var(--txt2);border-radius:8px;font-size:18px;display:flex;align-items:center;justify-content:center}
.sb-x:hover{background:var(--bg2)}
.sb-chs{padding:12px}
.sb-baab{padding:10px 14px;margin-bottom:6px;border-radius:10px;display:flex;align-items:center;gap:10px}
.sb-bn{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:13px;font-weight:700;flex-shrink:0;background:var(--gld-bg);color:var(--gld);border:1.5px solid var(--gld)}
.sb-bi{flex:1}
.sb-bt{font-size:13px;font-weight:600;color:var(--txt)}
.sb-bs{font-size:11px;color:var(--muted);margin-top:1px}
.sb-ch{padding:7px 14px 7px 44px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--txt2);transition:all .15s;display:flex;align-items:center;gap:6px;margin:1px 0}
.sb-ch:hover{background:var(--bg2);color:var(--txt)}
.sb-ch.act{color:var(--gld);font-weight:600;background:var(--gld-bg)}
.sb-dot{width:4px;height:4px;border-radius:50%;background:var(--muted);flex-shrink:0}
.sb-ch.act .sb-dot{background:var(--gld)}

/* ═══ SETTINGS PANEL ═══ */
.sp{position:fixed;top:0;left:0;bottom:0;z-index:160;width:320px;max-width:88vw;background:var(--bg);transform:translateX(-100%);transition:transform var(--tr);overflow-y:auto;border-right:.5px solid var(--bdr);box-shadow:4px 0 24px rgba(0,0,0,.08)}
.sp.on{transform:translateX(0)}
.sp-hd{padding:18px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:.5px solid var(--bdr)}
.sp-t{font-size:15px;font-weight:600;color:var(--txt)}
.sp-body{padding:16px 20px}
.sg{margin-bottom:22px}
.sg-l{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:10px;letter-spacing:.5px}
.sg-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.sg-grid.g3{grid-template-columns:repeat(3,1fr)}
.sg-grid.g4{grid-template-columns:repeat(4,1fr)}
.sg-b{padding:10px 8px;background:var(--bg2);border:1.5px solid transparent;border-radius:8px;color:var(--txt2);font-family:var(--fb);font-size:13px;cursor:pointer;transition:all .2s;text-align:center}
.sg-b:hover{border-color:var(--gld);transform:translateY(-1px)}
.sg-b.act{background:var(--grn);border-color:var(--grn);color:#F8F3EC;font-weight:600}
/* Theme buttons */
.thm-row{display:flex;gap:10px;align-items:center}
.thm-b{width:44px;height:44px;border-radius:12px;border:2px solid transparent;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;font-size:18px}
.thm-b:hover{transform:scale(1.08)}
.thm-b.act{border-color:var(--gld);box-shadow:0 0 0 3px var(--gld-bg)}
.thm-light{background:#F8F3EC;border:1px solid #ddd}
.thm-dark{background:#1A1612;border:1px solid #444}
.thm-sepia{background:#F4EDE0;border:1px solid #ccc}

/* ═══ MAIN CONTENT ═══ */
.mc{max-width:var(--cw);margin:0 auto;padding:72px 28px 100px;min-height:100vh;transition:max-width .3s}

/* ═══ CHAPTER HEADER ═══ */
.chd{text-align:center;margin-bottom:44px;padding-top:16px;animation:fadeUp .6s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.chl{display:inline-flex;align-items:center;gap:12px;margin-bottom:14px}
.chl-l{width:44px;height:.5px;background:var(--gld)}
.chl-t{font-size:12px;color:var(--gld);letter-spacing:1px}
.cht{font-family:var(--fd);font-size:1.9em;font-weight:700;color:var(--grn);line-height:1.5;margin-bottom:6px}
.orn{color:var(--gld);font-size:18px;opacity:.4}

/* ═══ CONTENT BLOCKS ═══ */
.blk{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s ease}
.blk.vis{opacity:1;transform:translateY(0)}
.blk-prose{margin-bottom:1.4em;text-align:justify}
.blk-prose strong{color:var(--grn);font-weight:600}
.blk-prose em{color:var(--gld);font-style:normal;font-weight:500}
.blk-divider{text-align:center;margin:2.4em 0;display:flex;align-items:center;justify-content:center;gap:8px}
.blk-divider i{width:28px;height:.5px;background:var(--muted);opacity:.3;display:inline-block}
.blk-divider b{width:5px;height:5px;border-radius:50%;background:var(--gld);opacity:.5;display:inline-block}

.blk-verse{margin:2em 8px;padding:22px 26px;background:var(--gld-bg);border-radius:12px;border-right:3.5px solid var(--gld);text-align:center;position:relative;overflow:hidden}
.blk-verse::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:repeating-linear-gradient(45deg,transparent,transparent 20px,rgba(200,150,62,0.015) 20px,rgba(200,150,62,0.015) 40px);pointer-events:none}
.blk-verse p{font-family:var(--fq);font-size:1.2em;line-height:2.2;color:var(--grn);position:relative}
.blk-verse small{font-size:.72em;color:var(--muted);display:block;margin-top:10px;font-family:var(--fb);position:relative}

.blk-hadith{margin:2em 8px;padding:22px 26px;background:var(--grn-bg);border-radius:12px;border-right:3.5px solid var(--grn2);text-align:center}
.blk-hadith p{font-size:1.02em;line-height:2;font-style:italic}
.blk-hadith small{font-size:.72em;color:var(--muted);display:block;margin-top:10px}

.blk-reflection{margin:2.2em 0;padding:22px 26px;background:var(--grn-bg);border-radius:14px;border:.5px solid rgba(45,106,79,0.1);position:relative}
.blk-reflection::before{content:'؟';position:absolute;top:-13px;right:22px;width:26px;height:26px;background:var(--grn2);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#F8F3EC;font-size:13px;line-height:26px;text-align:center}
.blk-reflection p{font-size:.93em;line-height:2;color:var(--txt2);white-space:pre-line;padding-top:4px}

.blk-pause{margin:2.2em 0;padding:18px 22px;background:var(--gld-bg);border-radius:14px;border:.5px solid var(--bdr-gld);text-align:center}
.blk-pause p{font-size:.93em;line-height:2;color:var(--gld);font-weight:500}

/* emphasis (rendered from **text**) */
.blk-emphasis{margin:2em 0;padding:22px 24px;background:linear-gradient(135deg,var(--gld-bg),transparent);border-right:3.5px solid var(--gld);border-radius:0 12px 12px 0;position:relative}
.blk-emphasis p{font-size:1em;line-height:2;color:var(--txt)}

/* ═══ CHAPTER NAV ═══ */
.cnav{display:flex;align-items:center;justify-content:space-between;margin-top:52px;padding-top:22px;border-top:.5px solid var(--bdr);animation:fadeUp .6s ease .2s both}
.cn-b{display:flex;align-items:center;gap:6px;padding:10px 16px;border:.5px solid var(--bdr);border-radius:10px;background:none;cursor:pointer;font-family:var(--fb);font-size:13px;color:var(--txt2);transition:all .2s;max-width:45%}
.cn-b:hover{background:var(--grn-bg);color:var(--grn);border-color:rgba(45,106,79,0.15)}
.cn-b svg{width:14px;height:14px;flex-shrink:0}
.cn-c{font-size:12px;color:var(--muted)}

/* ═══ FLOATING CONTROLS ═══ */
.fctrl{position:fixed;left:14px;bottom:90px;z-index:80;display:flex;flex-direction:column;gap:8px}
.fc-b{width:40px;height:40px;border-radius:50%;background:var(--bg);border:.5px solid var(--bdr);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--txt2);font-size:15px;transition:all .2s;box-shadow:var(--shd)}
.fc-b:hover{background:var(--grn-bg);color:var(--grn);border-color:rgba(45,106,79,0.2)}

/* ═══ HIGHLIGHT SYSTEM ═══ */
.hl-yellow{background:rgba(251,191,36,0.3);padding:1px 0;border-radius:2px;cursor:pointer}
.hl-green{background:rgba(34,197,94,0.3);padding:1px 0;border-radius:2px;cursor:pointer}
.hl-red{background:rgba(239,68,68,0.3);padding:1px 0;border-radius:2px;cursor:pointer}
.hl-blue{background:rgba(59,130,246,0.3);padding:1px 0;border-radius:2px;cursor:pointer}
.hl-menu{position:fixed;background:var(--bg);border:1px solid var(--gld);border-radius:12px;padding:12px;z-index:300;box-shadow:0 8px 28px rgba(0,0,0,.15);display:none}
.hl-menu.on{display:block}
.hl-colors{display:flex;gap:8px;margin-bottom:8px}
.hl-c{width:32px;height:32px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all .2s}
.hl-c:hover{transform:scale(1.2);border-color:var(--txt)}
.hl-c-y{background:linear-gradient(135deg,#fbbf24,#f59e0b)}
.hl-c-g{background:linear-gradient(135deg,#22c55e,#16a34a)}
.hl-c-r{background:linear-gradient(135deg,#ef4444,#dc2626)}
.hl-c-b{background:linear-gradient(135deg,#3b82f6,#2563eb)}
.hl-rm{width:100%;padding:7px;background:rgba(239,68,68,0.1);border:1px solid #ef4444;border-radius:8px;color:#ef4444;font-family:var(--fb);font-size:11px;font-weight:600;cursor:pointer;display:none}
.hl-rm:hover{background:#ef4444;color:#fff}

/* ═══ COVER ═══ */
.cover{min-height:85vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;position:relative}
.cover::before{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:radial-gradient(ellipse at center top,rgba(200,150,62,0.05) 0%,transparent 65%);pointer-events:none}
.cover .logo{font-family:var(--fd);font-size:44px;font-weight:700;color:var(--gld);width:90px;height:90px;border-radius:50%;background:var(--gld-bg);display:flex;align-items:center;justify-content:center;border:1.5px solid var(--bdr-gld);margin-bottom:28px;animation:pulse 3s ease-in-out infinite;position:relative;z-index:1}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(200,150,62,.12)}50%{box-shadow:0 0 0 16px rgba(200,150,62,0)}}
.cover h1{font-family:var(--fd);font-size:2.6em;font-weight:700;color:var(--grn);line-height:1.4;margin-bottom:8px;position:relative;z-index:1}
.cover .sub{font-size:1.1em;color:var(--gld);margin-bottom:4px;font-weight:500}
.cover .auth{font-size:.9em;color:var(--muted);margin-bottom:36px}
.cover .start{display:inline-flex;align-items:center;gap:8px;padding:14px 36px;background:var(--grn);color:#F8F3EC;border:none;border-radius:12px;font-family:var(--fb);font-size:1em;font-weight:600;cursor:pointer;transition:all .3s;box-shadow:0 4px 18px rgba(27,67,50,.2);position:relative;z-index:1}
.cover .start:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(27,67,50,.3)}

/* ═══ TOC ═══ */
.toc{max-width:600px;margin:0 auto;padding:0 24px 60px}
.toc h2{font-family:var(--fd);font-size:1.6em;color:var(--grn);text-align:center;margin-bottom:8px}
.toc .desc{text-align:center;font-size:.9em;color:var(--txt2);line-height:1.8;margin-bottom:32px}
.toc-q{margin-bottom:28px}
.toc-ql{display:inline-flex;align-items:center;gap:8px;margin-bottom:12px;padding:5px 14px;background:var(--gld-bg);border-radius:16px;font-size:12px;color:var(--gld);font-weight:600}
.toc-item{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:8px;border-radius:12px;border:.5px solid var(--bdr);cursor:pointer;transition:all .25s}
.toc-item:hover{background:var(--grn-bg);border-color:rgba(45,106,79,0.12);transform:translateX(-3px)}
.toc-item.locked{opacity:.42;cursor:default}
.toc-item.locked:hover{background:transparent;border-color:var(--bdr);transform:none}
.toc-n{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:15px;font-weight:700;flex-shrink:0}
.toc-n.pub{background:var(--grn);color:#F8F3EC}
.toc-n.dft{background:var(--gld-bg);color:var(--gld);border:1px solid var(--bdr-gld)}
.toc-info{flex:1}
.toc-tt{font-size:14px;font-weight:600}
.toc-st{font-size:12px;color:var(--txt2);margin-top:2px}
.toc-badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500}
.toc-badge.pub{background:rgba(45,106,79,0.08);color:var(--grn2)}
.toc-badge.soon{background:var(--gld-bg);color:var(--gld)}

/* ═══ LOADING ═══ */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px}
.loading .logo{font-family:var(--fd);font-size:40px;font-weight:700;color:var(--gld);width:80px;height:80px;border-radius:50%;background:var(--gld-bg);display:flex;align-items:center;justify-content:center;border:1.5px solid var(--bdr-gld);animation:pulse 2s ease-in-out infinite}
.loading p{font-size:14px;color:var(--muted)}

/* ═══ RESPONSIVE ═══ */
@media(max-width:600px){
  .mc{padding:68px 18px 90px}
  .cht{font-size:1.5em}
  .blk-verse,.blk-hadith{margin:1.4em 0;padding:16px 18px}
  .blk-reflection,.blk-pause{padding:16px 18px}
  .tnav-in{padding:8px 14px}
  .sb{width:260px}
  .sp{width:100%}
  .fctrl{left:10px;bottom:70px}
  .fc-b{width:36px;height:36px;font-size:14px}
  .cover h1{font-size:2em}
  .cn-b{padding:8px 12px;font-size:12px}
}
</style>
</head>
<body>

<div class="pbar"><div class="pfill" id="pf"></div></div>

<nav class="tnav" id="tnav">
  <div class="tnav-in">
    <div class="tnav-t" onclick="toggleSB()"><div class="tnav-logo">و</div> <span style="font-size:12px;color:var(--muted);cursor:pointer">☰</span></div>
    <span class="tnav-ch" id="navCh"></span>
    <div class="tnav-r">
      <button class="nb" id="settBtn" onclick="toggleSP()" title="إعدادات القراءة">⚙</button>
      <button class="nb" onclick="goHome()" title="الرئيسية">🏠</button>
    </div>
  </div>
</nav>

<!-- Settings Panel -->
<div class="sp" id="sp">
  <div class="sp-hd">
    <span class="sp-t">⚙ إعدادات القراءة</span>
    <button class="sb-x" onclick="toggleSP()">✕</button>
  </div>
  <div class="sp-body">
    <div class="sg">
      <div class="sg-l">🔤 حجم الخط</div>
      <div class="sg-grid g4">
        <button class="sg-b" data-fs="15" onclick="setFS(this)">صغير</button>
        <button class="sg-b act" data-fs="17" onclick="setFS(this)">متوسط</button>
        <button class="sg-b" data-fs="20" onclick="setFS(this)">كبير</button>
        <button class="sg-b" data-fs="24" onclick="setFS(this)">ضخم</button>
      </div>
    </div>
    <div class="sg">
      <div class="sg-l">📏 تباعد الأسطر</div>
      <div class="sg-grid g4">
        <button class="sg-b" data-lh="1.7" onclick="setLH(this)">مضغوط</button>
        <button class="sg-b act" data-lh="2.15" onclick="setLH(this)">عادي</button>
        <button class="sg-b" data-lh="2.4" onclick="setLH(this)">مريح</button>
        <button class="sg-b" data-lh="2.7" onclick="setLH(this)">واسع</button>
      </div>
    </div>
    <div class="sg">
      <div class="sg-l">📐 عرض المحتوى</div>
      <div class="sg-grid g3">
        <button class="sg-b" data-cw="580px" onclick="setCW(this)">ضيق</button>
        <button class="sg-b act" data-cw="700px" onclick="setCW(this)">عادي</button>
        <button class="sg-b" data-cw="900px" onclick="setCW(this)">واسع</button>
      </div>
    </div>
    <div class="sg">
      <div class="sg-l">✏️ نوع الخط</div>

        <button class="thm-b thm-dark" data-th="dark" onclick="setTh(this)" title="ليلي">🌙</button>

  <button class="fc-b" onclick="toggleSP()" title="الإعدادات">⚙</button>

</aside>

<!-- Highlight menu -->
<div class="hl-menu" id="hlMenu">

<main class="mc" id="mc"></main>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyDj0bV5gsyRbqpxzW0Zd9wjYmq53-Xdj3w",authDomain:"fouad-perspective.firebaseapp.com",projectId:"fouad-perspective",storageBucket:"fouad-perspective.firebasestorage.app",messagingSenderId:"1068763865336",appId:"1:1068763865336:web:b791abcd22d536aedd5b0d"});
const db=firebase.firestore(),auth=firebase.auth();
const toAr=n=>String(n).replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const arW=n=>['','الأوّل','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر'][n]||toAr(n);

let userId=null,allBaabs=[],curBaab=null,curChIdx=0,highlights=[];

const BOOK_META=[
  {id:'baab1',n:1,title:'البداية',sub:'مين أنا؟',q:'السؤال الأول',status:'published'},
  {id:'baab2',n:2,title:'الجوهر',sub:'حقيقتك الأصلية',q:'السؤال الأول',status:'draft'},
  {id:'baab3',n:3,title:'الشوق',sub:'اتجاهك الفطري',q:'السؤال الأول',status:'draft'},
  {id:'baab4',n:4,title:'الفضيلة',sub:'الجوهر مُعاشًا',q:'السؤال الأول',status:'draft'},
  {id:'baab5',n:5,title:'القناع',sub:'ليه مش عايش كده',q:'السؤال الثاني',status:'draft'},
  {id:'baab6',n:6,title:'المحاور القلبية',sub:'فين طاقتك رايحة',q:'السؤال الثالث',status:'draft'},
  {id:'baab7',n:7,title:'نقاط القوة',sub:'الميزان',q:'السؤال الثالث',status:'draft'},
  {id:'baab8',n:8,title:'الحركة',sub:'شبكة الطبائع الحية',q:'السؤال الثالث',status:'draft'},
  {id:'baab9',n:9,title:'المرايا السبع',sub:'أنت فين دلوقتي',q:'السؤال الرابع',status:'draft'},
  {id:'baab10',n:10,title:'الطريق',sub:'إزاي ترجع',q:'السؤال الخامس',status:'draft'}
];

// ═══ AUTH & INIT ═══
auth.onAuthStateChanged(async u=>{
  userId=u?u.uid:localStorage.getItem('userId');
  if(!userId){try{const enc=localStorage.getItem('_enc_user');if(enc){userId=JSON.parse(decodeURIComponent(atob(enc.split('').reverse().join('')))).id}}catch(e){}}
  await loadBook();
});

async function loadBook(){
  showLoading();
  try{
    const snap=await db.collection('wiladatqalb_baabs').orderBy('number').get();
    allBaabs=[];
    if(!snap.empty) snap.forEach(d=>allBaabs.push({id:d.id,...d.data()}));
    else allBaabs=BOOK_META.map(m=>({...m,number:m.n,chapters:[]}));
  }catch(e){allBaabs=BOOK_META.map(m=>({...m,number:m.n,chapters:[]}))}

  const p=new URLSearchParams(location.search);
  const bid=p.get('baab'),cid=p.get('ch');
  if(bid){const b=allBaabs.find(x=>x.id===bid);if(b&&b.chapters&&b.chapters.length){curBaab=b;curChIdx=cid?Math.max(0,b.chapters.findIndex(c=>c.id===cid)):0;renderReader();await loadHL();return}}

  if(userId){try{const pr=await db.collection('wiladatqalb_progress').doc(userId).get();if(pr.exists){const d=pr.data(),b=allBaabs.find(x=>x.id===d.currentBaab);if(b&&b.chapters&&b.chapters.length){curBaab=b;curChIdx=d.currentChapter||0;renderReader();await loadHL();return}}}catch(e){}}
  renderCover();
}

// ═══ RICH TEXT ═══
function richText(txt){
  if(!txt) return '';
  return txt
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.*?)\*/g,'<em>$1</em>')
    .replace(/\n/g,'<br>');
}

// ═══ COVER ═══
function renderCover(){
  document.getElementById('tnav').style.display='none';
  document.querySelector('.fctrl').style.display='none';
  const mc=document.getElementById('mc');
  const questions={'السؤال الأول':'مين أنا؟','السؤال الثاني':'ليه مش عايش كده؟','السؤال الثالث':'إزاي المنظومة بتشتغل؟','السؤال الرابع':'أنا فين دلوقتي؟','السؤال الخامس':'إزاي أرجع؟'};
  let h=`<div class="cover"><div class="logo">و</div><h1>ولادة قلب</h1><p class="sub">منظور الفؤاد</p><p class="auth">م. أحمد سالم</p><button class="start" onclick="startRead()">ابدأ الرحلة ←</button></div><div class="toc"><h2>رحلة الكتاب</h2><p class="desc">عشرة أبواب تجيب على خمسة أسئلة. كل سؤال يبني على ما قبله.</p>`;
  let cq='';
  allBaabs.forEach(b=>{const q=b.q||'';if(q!==cq){if(cq)h+='</div>';cq=q;h+=`<div class="toc-q"><div class="toc-ql">◆ ${q}: ${questions[q]||''}</div>`}
    const pub=b.status==='published',hasCh=b.chapters&&b.chapters.length>0,cls=pub&&hasCh?'':'locked',ck=pub&&hasCh?`onclick="openBaab('${b.id}')"`:'';
    h+=`<div class="toc-item ${cls}" ${ck}><div class="toc-n ${pub?'pub':'dft'}">${toAr(b.number)}</div><div class="toc-info"><div class="toc-tt">الباب ${arW(b.number)}: ${b.title}</div><div class="toc-st">${b.sub||''}</div></div><span class="toc-badge ${pub&&hasCh?'pub':'soon'}">${pub&&hasCh?'متاح':'قريبًا'}</span></div>`});
  if(cq)h+='</div>';h+='</div>';mc.innerHTML=h;
}
function startRead(){const p=allBaabs.find(b=>b.status==='published'&&b.chapters&&b.chapters.length);if(p)openBaab(p.id)}
function openBaab(id){const b=allBaabs.find(x=>x.id===id);if(!b||!b.chapters||!b.chapters.length)return;curBaab=b;curChIdx=0;renderReader();loadHL();history.replaceState(null,'',`?baab=${id}`)}

// ═══ READER ═══
function renderReader(){
  document.getElementById('tnav').style.display='';
  document.querySelector('.fctrl').style.display='';
  buildSB();renderCh(curChIdx);restorePrefs();
}

function renderCh(idx){
  curChIdx=idx;
  const ch=curBaab.chapters[idx];if(!ch)return;
  const mc=document.getElementById('mc');
  let h=`<div class="chd"><div class="chl"><div class="chl-l"></div><span class="chl-t">الفصل ${arW(ch.number||idx+1)}</span><div class="chl-l"></div></div><h1 class="cht">${ch.title}</h1><div class="orn">❦</div></div>`;

  if(ch.sections){ch.sections.forEach((s,i)=>{
    const d=Math.min(i*50,400);
    switch(s.type){
      case 'prose':h+=`<div class="blk blk-prose" style="transition-delay:${d}ms">${richText(s.content)}</div>`;break;
      case 'divider':h+=`<div class="blk blk-divider" style="transition-delay:${d}ms"><i></i><b></b><i></i></div>`;break;
      case 'verse':h+=`<div class="blk blk-verse" style="transition-delay:${d}ms"><p>﴿${s.content}﴾</p><small>${s.reference||''}</small></div>`;break;
      case 'hadith':h+=`<div class="blk blk-hadith" style="transition-delay:${d}ms"><p>«${s.content}»</p><small>${s.reference||''}</small></div>`;break;
      case 'reflection':h+=`<div class="blk blk-reflection" style="transition-delay:${d}ms"><p>${richText(s.content)}</p></div>`;break;
      case 'pause':h+=`<div class="blk blk-pause" style="transition-delay:${d}ms"><p>${richText(s.content)}</p></div>`;break;
    }
  })}

  h+=`<div class="cnav">`;
  if(idx<curBaab.chapters.length-1){const nx=curBaab.chapters[idx+1];h+=`<button class="cn-b" onclick="goCh(${idx+1})"><span>التالي: ${nx.title}</span> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>`}else h+='<div></div>';
  h+=`<span class="cn-c">${toAr(idx+1)} من ${toAr(curBaab.chapters.length)}</span>`;
  if(idx>0){const pv=curBaab.chapters[idx-1];h+=`<button class="cn-b" onclick="goCh(${idx-1})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg> <span>${pv.title}</span></button>`}else h+='<div></div>';
  h+='</div>';

  mc.innerHTML=h;
  window.scrollTo({top:0});
  document.getElementById('navCh').textContent=`${curBaab.title} · ${ch.title}`;
  updateSBActive();saveProg();

  // Animate blocks in
  setTimeout(()=>{const obs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('vis');obs.unobserve(e.target)}})},{threshold:.08});document.querySelectorAll('.blk').forEach(el=>obs.observe(el))},50);

  // Re-apply highlights
  setTimeout(()=>applyHL(),100);
}

function goCh(i){renderCh(i);closeSB();closeSP()}

// ═══ SIDEBAR ═══
function buildSB(){
  const el=document.getElementById('sbChs');if(!curBaab)return;
  let h=`<div class="sb-baab"><div class="sb-bn">${toAr(curBaab.number)}</div><div class="sb-bi"><div class="sb-bt">الباب ${arW(curBaab.number)}: ${curBaab.title}</div><div class="sb-bs">${curBaab.chapters?curBaab.chapters.length:0} فصول</div></div></div>`;
  if(curBaab.chapters) curBaab.chapters.forEach((ch,i)=>{h+=`<div class="sb-ch ${i===curChIdx?'act':''}" onclick="goCh(${i})" data-chi="${i}"><span class="sb-dot"></span>${ch.title}</div>`});
  el.innerHTML=h;
}
function updateSBActive(){document.querySelectorAll('.sb-ch').forEach((el,i)=>el.classList.toggle('act',i===curChIdx))}
function toggleSB(){document.getElementById('sb').classList.toggle('on');document.getElementById('ov').classList.toggle('on')}
function closeSB(){document.getElementById('sb').classList.remove('on');document.getElementById('ov').classList.remove('on')}

// ═══ SETTINGS ═══
function toggleSP(){const sp=document.getElementById('sp'),isOn=sp.classList.contains('on');closeAll();if(!isOn){sp.classList.add('on');document.getElementById('ov').classList.add('on')}}
function closeSP(){document.getElementById('sp').classList.remove('on')}
function closeAll(){closeSB();closeSP();document.getElementById('ov').classList.remove('on')}

function setFS(btn){document.documentElement.style.setProperty('--fs',btn.dataset.fs+'px');btn.closest('.sg-grid').querySelectorAll('.sg-b').forEach(b=>b.classList.remove('act'));btn.classList.add('act');localStorage.setItem('wq-fs',btn.dataset.fs)}
function setLH(btn){document.documentElement.style.setProperty('--lh',btn.dataset.lh);btn.closest('.sg-grid').querySelectorAll('.sg-b').forEach(b=>b.classList.remove('act'));btn.classList.add('act');localStorage.setItem('wq-lh',btn.dataset.lh)}
function setCW(btn){document.documentElement.style.setProperty('--cw',btn.dataset.cw);btn.closest('.sg-grid').querySelectorAll('.sg-b').forEach(b=>b.classList.remove('act'));btn.classList.add('act');localStorage.setItem('wq-cw',btn.dataset.cw)}
function setFF(btn){document.body.style.fontFamily=btn.dataset.ff;btn.closest('.sg-grid').querySelectorAll('.sg-b').forEach(b=>b.classList.remove('act'));btn.classList.add('act');localStorage.setItem('wq-ff',btn.dataset.ff)}
function setTh(btn){document.documentElement.setAttribute('data-theme',btn.dataset.th);document.querySelectorAll('.thm-b').forEach(b=>b.classList.remove('act'));btn.classList.add('act');localStorage.setItem('wq-th',btn.dataset.th)}

function restorePrefs(){
  const fs=localStorage.getItem('wq-fs');if(fs){document.documentElement.style.setProperty('--fs',fs+'px');document.querySelectorAll('[data-fs]').forEach(b=>b.classList.toggle('act',b.dataset.fs===fs))}
  const lh=localStorage.getItem('wq-lh');if(lh){document.documentElement.style.setProperty('--lh',lh);document.querySelectorAll('[data-lh]').forEach(b=>b.classList.toggle('act',b.dataset.lh===lh))}
  const cw=localStorage.getItem('wq-cw');if(cw){document.documentElement.style.setProperty('--cw',cw);document.querySelectorAll('[data-cw]').forEach(b=>b.classList.toggle('act',b.dataset.cw===cw))}
  const ff=localStorage.getItem('wq-ff');if(ff){document.body.style.fontFamily=ff;document.querySelectorAll('[data-ff]').forEach(b=>b.classList.toggle('act',b.dataset.ff===ff))}
  const th=localStorage.getItem('wq-th');if(th){document.documentElement.setAttribute('data-theme',th);document.querySelectorAll('.thm-b').forEach(b=>b.classList.toggle('act',b.dataset.th===th))}
}
restorePrefs();

// ═══ PROGRESS ═══
function saveProg(){if(!userId||!curBaab)return;db.collection('wiladatqalb_progress').doc(userId).set({currentBaab:curBaab.id,currentChapter:curChIdx,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}).catch(e=>{})}

// ═══ BOOKMARK ═══
function saveBookmark(){
  if(!userId||!curBaab)return;
  const pos=window.scrollY;
  db.collection('wiladatqalb_bookmarks').doc(userId).set({baabId:curBaab.id,chapterIdx:curChIdx,scrollY:pos,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
  const btn=document.getElementById('bmkBtn');btn.textContent='✅';setTimeout(()=>btn.textContent='🔖',1500);
}

// ═══ HIGHLIGHTING ═══
let selText='',selRange=null,curHlId=null;

async function loadHL(){
  if(!userId||!curBaab)return;
  try{const d=await db.collection('wiladatqalb_highlights').doc(`${userId}_${curBaab.id}`).get();highlights=d.exists?(d.data().highlights||[]):[]}catch(e){highlights=[]}
}
async function saveHL(){
  if(!userId||!curBaab)return;
  try{await db.collection('wiladatqalb_highlights').doc(`${userId}_${curBaab.id}`).set({highlights,updatedAt:firebase.firestore.FieldValue.serverTimestamp()})}catch(e){}
}
function applyHL(){
  document.querySelectorAll('[data-hlid]').forEach(el=>{const p=el.parentNode;p.replaceChild(document.createTextNode(el.textContent),el);p.normalize()});
  const containers=document.querySelectorAll('.blk-prose,.blk-verse,.blk-hadith,.blk-reflection,.blk-pause,.blk-emphasis');
  highlights.forEach(hl=>{containers.forEach(c=>{if(!c.textContent.includes(hl.text))return;
    const w=document.createTreeWalker(c,NodeFilter.SHOW_TEXT);let n;const reps=[];
    while(n=w.nextNode()){const i=n.textContent.indexOf(hl.text);if(i!==-1)reps.push({node:n,index:i})}
    reps.forEach(r=>{const{node,index}=r,before=node.textContent.substring(0,index),after=node.textContent.substring(index+hl.text.length);
      const span=document.createElement('span');span.className=`hl-${hl.color}`;span.setAttribute('data-hlid',hl.id);span.textContent=hl.text;
      const p=node.parentNode;if(before)p.insertBefore(document.createTextNode(before),node);p.insertBefore(span,node);if(after)p.insertBefore(document.createTextNode(after),node);p.removeChild(node)})})
  });
}

document.addEventListener('mouseup',handleSel);document.addEventListener('touchend',handleSel);
function handleSel(e){
  if(e.target.closest('.hl-menu')||e.target.closest('.sp')||e.target.closest('.sb')||e.target.closest('.fctrl'))return;
  setTimeout(()=>{
    const sel=window.getSelection(),txt=sel.toString().trim();
    if(txt.length>2){selText=txt;try{selRange=sel.getRangeAt(0)}catch(er){return}
      const valid=sel.anchorNode.parentElement.closest('.blk-prose,.blk-verse,.blk-hadith,.blk-reflection,.blk-pause,.blk-emphasis');
      if(valid){showHLMenu()}else hideHLMenu()
    }else hideHLMenu()
  },120);
}
function showHLMenu(){
  const m=document.getElementById('hlMenu');
  try{const r=selRange.getBoundingClientRect();let x=r.left+(r.width/2)-80,y=r.top+window.scrollY-110;
    if(window.innerWidth<=768){x=(window.innerWidth/2)-80;y=r.top+window.scrollY-130}
    if(y<80)y=r.bottom+window.scrollY+10;if(x+160>window.innerWidth)x=window.innerWidth-180;if(x<10)x=10;
    m.style.left=x+'px';m.style.top=y+'px'}catch(e){m.style.left='50%';m.style.top='50%'}
  m.classList.add('on');
  const ex=highlights.find(h=>h.text===selText);
  document.getElementById('hlRm').style.display=ex?'block':'none';
  if(ex)curHlId=ex.id;
}
function hideHLMenu(){document.getElementById('hlMenu').classList.remove('on')}
function doHL(btn){
  const color=btn.dataset.color,ei=highlights.findIndex(h=>h.text===selText);
  if(ei!==-1)highlights[ei].color=color;
  else highlights.push({id:Date.now(),text:selText,color,createdAt:new Date().toISOString()});
  saveHL();applyHL();hideHLMenu();window.getSelection().removeAllRanges();
}
function rmHL(){
  if(curHlId){highlights=highlights.filter(h=>h.id!==curHlId);saveHL();applyHL()}
  hideHLMenu();window.getSelection().removeAllRanges();
}
document.addEventListener('mousedown',e=>{if(!e.target.closest('.hl-menu'))hideHLMenu()});

// ═══ SCROLL ═══
let lastSc=0;
window.addEventListener('scroll',()=>{
  const st=window.scrollY,h=document.documentElement.scrollHeight-window.innerHeight;
  if(h>0)document.getElementById('pf').style.width=Math.round(st/h*100)+'%';
  const nav=document.getElementById('tnav');
  if(st>150&&st>lastSc)nav.classList.add('hid');else nav.classList.remove('hid');
  lastSc=st;
});

// ═══ NAV ═══
function goHome(){
  const p=new URLSearchParams(location.search),cid=p.get('id')||p.get('courseId');
  if(cid)window.location.href=`../course-view.html?id=${cid}`;
  else{curBaab=null;renderCover();history.replaceState(null,'',location.pathname)}
}
function showLoading(){document.getElementById('mc').innerHTML=`<div class="loading"><div class="logo">و</div><p>جاري التحميل...</p></div>`}
</script>
