<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F0E6">
<title>ولادة قلب — منظور الفؤاد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zain:wght@300;400;700;800;900&family=Amiri:wght@400;700&family=Amiri+Quran&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
/* زين محلّيًا من المستودع — احتياطٌ لو تعذّر خط جوجل */
@font-face{font-family:'ZainLocal';src:url('../external-exercise/Adam-journey/fonts/Zain-Light.ttf') format('truetype');font-weight:300;font-display:swap}
@font-face{font-family:'ZainLocal';src:url('../external-exercise/Adam-journey/fonts/Zain-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'ZainLocal';src:url('../external-exercise/Adam-journey/fonts/Zain-Bold.ttf') format('truetype');font-weight:700;font-display:swap}
@font-face{font-family:'ZainLocal';src:url('../external-exercise/Adam-journey/fonts/Zain-ExtraBold.ttf') format('truetype');font-weight:800;font-display:swap}
@font-face{font-family:'ZainLocal';src:url('../external-exercise/Adam-journey/fonts/Zain-Black.ttf') format('truetype');font-weight:900;font-display:swap}

/* ═══════════ ألوان ═══════════ */
:root{
  --bg:#F6F0E6;--bg2:#EFE6D8;--card:#FCF8F1;--txt:#2A221C;--txt2:#5F5246;--muted:#9C8C7B;
  --ink:#163A2C;--ink2:#255C45;--ink-bg:rgba(22,58,44,.06);
  --gold:#A87A2E;--gold2:#C99A4B;--gold-bg:rgba(168,122,46,.08);
  --line:rgba(42,34,28,.10);--line2:rgba(168,122,46,.28);
  --bar:rgba(246,240,230,.9);--shadow:0 10px 40px rgba(42,34,28,.10);
  --hl-y:rgba(245,190,50,.38);--hl-g:rgba(80,180,120,.30);--hl-r:rgba(230,100,90,.28);--hl-b:rgba(80,140,230,.26);
  --f-body:'Zain','ZainLocal','Noto Naskh Arabic',serif;
  --f-head:'Zain','ZainLocal','Noto Naskh Arabic',serif;
  --f-quran:'Amiri Quran','Amiri',serif;
  --f-classic:'Amiri',serif;
  --fs:20px;--lh:2;--cw:700px;--ta:justify;
}
[data-theme=sepia]{
  --bg:#EFE3CC;--bg2:#E6D7BB;--card:#F5EBD7;--txt:#3B2C1C;--txt2:#65513B;--muted:#98825F;
  --ink:#2F4F35;--ink2:#3E6B48;--ink-bg:rgba(47,79,53,.07);
  --gold:#9A6C22;--gold2:#B8863A;--gold-bg:rgba(154,108,34,.09);
  --line:rgba(59,44,28,.12);--line2:rgba(154,108,34,.3);--bar:rgba(239,227,204,.92);
}
[data-theme=dark]{
  --bg:#101412;--bg2:#171D1A;--card:#1A211D;--txt:#E6DDCF;--txt2:#B3A794;--muted:#7B7263;
  --ink:#8FCBAE;--ink2:#6DB894;--ink-bg:rgba(143,203,174,.08);
  --gold:#D6AE6E;--gold2:#C99A4B;--gold-bg:rgba(214,174,110,.09);
  --line:rgba(230,221,207,.09);--line2:rgba(214,174,110,.25);
  --bar:rgba(16,20,18,.9);--shadow:0 10px 40px rgba(0,0,0,.45);
  --hl-y:rgba(245,190,50,.28);--hl-g:rgba(80,180,120,.26);--hl-r:rgba(230,100,90,.26);--hl-b:rgba(80,140,230,.28);
}

*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--f-body);font-size:var(--fs);line-height:var(--lh);-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .35s,color .35s}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
::selection{background:rgba(168,122,46,.28)}
svg.i{width:20px;height:20px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}

/* ═══════════ شعار الدوائر الأربع (يستعمل كمُحمّل وفي الواجهة) ═══════════ */
.rings{position:relative;width:var(--rs,120px);height:var(--rs,120px)}
.rings i{position:absolute;inset:0;margin:auto;border-radius:50%;border:1.5px solid var(--gold);opacity:.55}
.rings i:nth-child(1){width:100%;height:100%;opacity:.18;animation:breathe 6s ease-in-out infinite}
.rings i:nth-child(2){width:74%;height:74%;opacity:.32;animation:breathe 6s ease-in-out .5s infinite}
.rings i:nth-child(3){width:48%;height:48%;opacity:.55;border-color:var(--ink2);animation:breathe 6s ease-in-out 1s infinite}
.rings i:nth-child(4){width:22%;height:22%;opacity:1;background:var(--gold);border:0;box-shadow:0 0 30px var(--gold);animation:breathe 6s ease-in-out 1.5s infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

.boot{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:var(--bg);transition:opacity .6s,visibility .6s}
.boot.gone{opacity:0;visibility:hidden}
.boot p{font-family:var(--f-head);font-weight:800;font-size:28px;color:var(--ink);letter-spacing:.5px}

/* ═══════════ الواجهة (الغلاف + الفهرس) ═══════════ */
#home{display:none}
.hero{min-height:100svh;display:grid;place-items:center;padding:48px 24px 40px;position:relative;overflow:hidden;text-align:center}
.hero-bg{position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 50% at 50% 42%,var(--gold-bg),transparent 70%)}
.hero-art{position:absolute;top:50%;left:50%;transform:translate(-50%,-54%);--rs:min(96vw,680px);opacity:.5;pointer-events:none}
.hero-art i:nth-child(4){width:3%;height:3%;opacity:.7;box-shadow:0 0 60px 30px var(--gold-bg)}
.hero-in{position:relative;z-index:1;max-width:760px}
.hero .series{display:inline-flex;align-items:center;gap:12px;font-size:15px;color:var(--gold);font-weight:700;letter-spacing:.5px;margin-bottom:10px}
.hero .series::before,.hero .series::after{content:'';width:34px;height:1px;background:var(--line2)}
.hero h1{font-family:var(--f-head);font-weight:900;font-size:clamp(64px,15vw,136px);line-height:1.05;color:var(--ink);letter-spacing:-1px;margin-bottom:8px}
.hero .blabel{font-size:18px;color:var(--txt2);font-weight:700}
.hero .auth{font-size:16px;color:var(--muted);margin-top:2px}
.hero .epi{margin:30px auto 34px;max-width:520px;font-size:clamp(19px,2.6vw,23px);line-height:1.9;color:var(--txt2);font-weight:300}
.cta{display:inline-flex;align-items:center;gap:14px;padding:15px 30px 15px 22px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:19px;font-weight:700;box-shadow:0 10px 30px rgba(22,58,44,.25);transition:transform .25s,box-shadow .25s}
[data-theme=dark] .cta{color:#0F1512}
.cta:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(22,58,44,.3)}
.cta small{display:block;font-size:13px;font-weight:400;opacity:.8;line-height:1.3}
.cta .ct{text-align:right;line-height:1.35}
.cta svg{width:22px;height:22px}
.hero-links{margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ghost{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:16px;color:var(--txt2);transition:all .2s}
.ghost:hover{border-color:var(--line2);color:var(--ink)}
.ghost svg{width:17px;height:17px}
.home-top{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;padding-top:max(14px,env(safe-area-inset-top))}
.home-top .grp{display:flex;gap:6px}

.stats{max-width:880px;margin:0 auto;padding:0 20px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px;text-align:center}
.stat b{display:block;font-size:30px;font-weight:900;color:var(--ink);line-height:1.2}
.stat span{font-size:15px;color:var(--muted)}
.meter{grid-column:1/-1;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 20px;display:flex;align-items:center;gap:16px}
.meter .bar{flex:1;height:8px;border-radius:9px;background:var(--bg2);overflow:hidden}
.meter .bar i{display:block;height:100%;background:linear-gradient(270deg,var(--gold),var(--ink2));border-radius:9px;transition:width .8s}
.meter span{font-size:16px;color:var(--txt2);white-space:nowrap}

.toc{max-width:880px;margin:0 auto;padding:64px 20px 90px}
.toc-h{text-align:center;margin-bottom:40px}
.toc-h h2{font-family:var(--f-head);font-weight:900;font-size:clamp(34px,5vw,46px);color:var(--ink);line-height:1.2}
.toc-h p{color:var(--muted);font-size:17px}
.part{margin-bottom:56px}
.part-h{display:flex;align-items:baseline;gap:16px;padding-bottom:14px;margin-bottom:22px;border-bottom:2px solid var(--ink)}
.part-h small{font-size:16px;font-weight:700;color:var(--gold);white-space:nowrap}
.part-h h3{font-family:var(--f-head);font-weight:900;font-size:clamp(30px,4.4vw,40px);color:var(--ink);line-height:1.15}
.part-h em{margin-inline-start:auto;font-style:normal;font-size:15px;color:var(--muted);white-space:nowrap}
.station{margin-bottom:30px}
.st-h{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.st-h .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--gold);margin-top:12px;flex-shrink:0}
.st-h h4{font-family:var(--f-head);font-weight:800;font-size:25px;color:var(--gold);line-height:1.4}
.st-h p{font-size:17px;color:var(--txt2);line-height:1.8}
.chs{display:grid;gap:10px;padding-inline-start:26px}
.chrow{display:flex;align-items:center;gap:18px;padding:16px 20px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-align:right;width:100%;transition:transform .2s,border-color .2s,box-shadow .2s;position:relative;overflow:hidden}
.chrow:hover{transform:translateX(-4px);border-color:var(--line2);box-shadow:var(--shadow)}
.chrow .n{font-family:var(--f-head);font-weight:900;font-size:36px;line-height:1;color:var(--gold);min-width:44px;text-align:center}
.chrow .t{flex:1;min-width:0}
.chrow .t b{display:block;font-size:21px;font-weight:700;color:var(--txt);line-height:1.5}
.chrow .t span{font-size:15px;color:var(--muted)}
.chrow .st{flex-shrink:0;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.chrow.done .st{color:var(--ink2)}
.chrow.cur{border-color:var(--ink2);box-shadow:0 0 0 1px var(--ink2) inset}
.chrow.cur::before{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--ink2)}
.chrow.lock{opacity:.55;cursor:default}.chrow.lock:hover{transform:none;box-shadow:none;border-color:var(--line)}
.chrow.lock .n{color:var(--muted)}
.prog-ring{width:30px;height:30px}
.prog-ring circle{fill:none;stroke-width:3}
.prog-ring .bgc{stroke:var(--bg2)}.prog-ring .fgc{stroke:var(--gold);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.foot{text-align:center;padding:30px 20px 60px;color:var(--muted);font-size:15px}
.foot a{text-decoration:none;color:var(--txt2)}

/* ═══════════ القارئ ═══════════ */
#reader{display:none}
.pbar{position:fixed;top:0;left:0;right:0;height:3px;z-index:310;pointer-events:none}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(270deg,var(--ink2),var(--gold));margin-inline-start:auto;transition:width .15s}
.tbar,.bbar{position:fixed;left:0;right:0;z-index:300;background:var(--bar);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);transition:transform .35s ease,opacity .35s}
.tbar{top:0;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bbar{bottom:0;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bars-hidden .tbar{transform:translateY(-110%)}
.bars-hidden .bbar{transform:translateY(110%)}
.tbar-in,.bbar-in{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:8px 12px}
.tbar-c{flex:1;min-width:0;text-align:center;line-height:1.3}
.tbar-c b{display:block;font-size:17px;font-weight:700;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbar-c span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--txt2);transition:background .2s,color .2s;position:relative}
.ib:hover{background:var(--bg2);color:var(--ink)}
.ib.on{background:var(--ink-bg);color:var(--ink)}
.ib .badge{position:absolute;top:6px;left:6px;min-width:16px;height:16px;border-radius:8px;background:var(--gold);color:#fff;font-size:10px;line-height:16px;font-weight:700;padding:0 4px}
.bbar-in{justify-content:space-between}
.navb{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:12px;font-size:15px;color:var(--txt2);max-width:30%;min-width:42px;transition:background .2s}
.navb:hover{background:var(--bg2);color:var(--ink)}
.navb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navb[disabled]{visibility:hidden}
.bbar-mid{display:flex;align-items:center;gap:2px}
.left-info{font-size:13px;color:var(--muted);text-align:center;min-width:90px;line-height:1.2}

.page{max-width:var(--cw);margin:0 auto;padding:96px 24px 140px;transition:max-width .3s}
.opener{text-align:center;padding:40px 0 34px;margin-bottom:34px;position:relative}
.opener .crumb{font-size:15px;color:var(--muted);font-weight:700;letter-spacing:.3px}
.opener .num{display:block;font-size:22px;font-weight:800;color:var(--gold);margin:18px 0 4px}
.opener h1{font-family:var(--f-head);font-weight:900;font-size:clamp(38px,6.6vw,62px);line-height:1.25;color:var(--ink)}
.opener .meta{display:flex;justify-content:center;gap:18px;margin-top:18px;font-size:15px;color:var(--muted);flex-wrap:wrap}
.opener .meta span{display:inline-flex;align-items:center;gap:6px}
.opener .meta svg{width:16px;height:16px}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--gold);margin-top:26px}
.orn::before,.orn::after{content:'';width:70px;height:1px;background:var(--line2)}
.orn svg{width:22px;height:22px;fill:var(--gold);stroke:none}

.art{font-size:var(--fs);line-height:var(--lh)}
.b{position:relative;scroll-margin-top:90px}
.b-p{margin-bottom:1.05em;text-align:var(--ta);text-justify:inter-word}
.b-p strong,.b-e strong{color:var(--ink);font-weight:700}
.b-p em{font-style:normal;color:var(--gold);font-weight:700}
.art>.b-p:first-of-type{font-size:1.08em}
.b-h{font-family:var(--f-head);font-weight:800;font-size:1.55em;line-height:1.45;color:var(--ink);margin:1.9em 0 .7em;display:flex;align-items:center;gap:14px}
.b-h::before{content:'';width:10px;height:10px;transform:rotate(45deg);background:var(--gold);flex-shrink:0;border-radius:2px}
.b-d{display:flex;justify-content:center;gap:14px;margin:2.2em 0;color:var(--gold);opacity:.7}
.b-d i{width:6px;height:6px;transform:rotate(45deg);background:currentColor;border-radius:1px}
.b-d i:nth-child(2){opacity:.55}
.b-v{margin:1.8em 0;padding:1.4em 1.6em 1.1em;text-align:center;background:var(--gold-bg);border-radius:22px;border:1px solid var(--line2);position:relative}
.b-v .bt{font-family:var(--f-quran);font-size:1.28em;line-height:2.25;color:var(--ink)}
.b-v .br{font-family:var(--f-quran);color:var(--gold);font-size:1.1em}
.ref{display:block;margin-top:.5em;font-size:.72em;color:var(--muted);font-family:var(--f-body);font-weight:700}
.b-hd{margin:1.8em 0;padding:1.3em 1.6em 1.1em;text-align:center;background:var(--ink-bg);border-radius:22px}
.b-hd .lbl,.b-r .lbl,.b-pz .lbl{display:block;font-size:.66em;font-weight:800;letter-spacing:.5px;color:var(--ink2);margin-bottom:.35em}
.b-hd .bt{font-family:var(--f-classic);font-size:1.08em;line-height:2.1}
.b-e{margin:2.1em 0;padding:.4em 0;text-align:center}
.b-e .bt{display:block;font-family:var(--f-head);font-weight:700;font-size:1.3em;line-height:1.75;color:var(--ink);max-width:560px;margin:0 auto}
.b-e::before,.b-e::after{content:'';display:block;width:56px;height:2px;background:var(--gold);margin:0 auto .9em;border-radius:2px}
.b-e::after{margin:.9em auto 0}
.b-pz{margin:2.2em 0;padding:1.6em 1.6em 1.3em;text-align:center;border-radius:24px;background:var(--card);border:1px solid var(--line)}
.b-pz .lbl{color:var(--gold)}
.b-pz .bt{display:block;color:var(--txt2);font-size:.98em;white-space:pre-line}
.breath{width:54px;height:54px;margin:0 auto 14px;border-radius:50%;border:2px solid var(--gold);position:relative;animation:inhale 8s ease-in-out infinite}
.breath::after{content:'';position:absolute;inset:14px;border-radius:50%;background:var(--gold);opacity:.35}
@keyframes inhale{0%,100%{transform:scale(.8);opacity:.6}45%,55%{transform:scale(1.15);opacity:1}}
.b-r{margin:2em 0;padding:1.4em 1.5em 1.2em;border-radius:24px;background:var(--ink-bg);border:1px solid var(--line)}
.b-r .lbl{display:flex;align-items:center;gap:8px}
.b-r .lbl svg{width:17px;height:17px}
.b-r .bt{display:block;white-space:pre-line;font-size:1em;color:var(--txt)}
.ans{margin-top:1em}
.ans textarea{width:100%;min-height:110px;resize:vertical;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-family:var(--f-body);font-size:.92em;line-height:1.9;padding:12px 16px;outline:none;transition:border-color .2s}
.ans textarea:focus{border-color:var(--ink2)}
.ans .st{font-size:.66em;color:var(--muted);margin-top:4px;min-height:1.4em}

mark.hl{color:inherit;border-radius:3px;padding:.05em 0;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone}
mark.hl-yellow{background:var(--hl-y)}mark.hl-green{background:var(--hl-g)}mark.hl-red{background:var(--hl-r)}mark.hl-blue{background:var(--hl-b)}
mark.hl.has-note{border-bottom:2px dotted var(--gold)}
.flash{animation:flash 2.2s ease}
@keyframes flash{0%,60%{background:var(--gold-bg);box-shadow:0 0 0 10px var(--gold-bg)}100%{background:transparent;box-shadow:0 0 0 10px transparent}}

.gate{text-align:center;padding:48px 26px 44px;margin:16px 0 8px;border-radius:30px;background:radial-gradient(80% 90% at 50% 0%,var(--gold-bg),transparent 75%);border:1px solid var(--line2)}
.gate .gl{font-size:15px;font-weight:800;color:var(--gold);letter-spacing:.3px}
.gate h2{font-family:var(--f-head);font-weight:900;font-size:clamp(34px,5.4vw,50px);color:var(--ink);line-height:1.3;margin:8px 0 10px}
.gate p{max-width:520px;margin:0 auto;font-size:20px;line-height:1.9;color:var(--txt2);font-weight:300}
.st-close{margin-top:22px!important;font-weight:700;color:var(--gold)!important}
.end{margin-top:3.2em;text-align:center;padding:40px 22px;border-radius:28px;background:var(--card);border:1px solid var(--line)}
.end .rings{--rs:84px;margin:0 auto 18px}
.end h3{font-family:var(--f-head);font-weight:900;font-size:30px;color:var(--ink);line-height:1.3}
.end p{font-size:17px;color:var(--txt2);margin-top:6px}
.next-card{display:flex;align-items:center;gap:16px;margin:26px auto 0;max-width:520px;padding:18px 22px;border-radius:20px;background:var(--ink);color:var(--bg);text-align:right;width:100%;transition:transform .2s}
[data-theme=dark] .next-card{color:#0F1512}
.next-card:hover{transform:translateY(-2px)}
.next-card .t{flex:1}
.next-card small{display:block;font-size:14px;opacity:.8}
.next-card b{font-size:21px;line-height:1.4}

var ORD_M=['','الأوّل','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر','الحادي عشر','الثاني عشر','الثالث عشر','الرابع عشر','الخامس عشر'];
var ORD_F=['','الأولى','الثانية','الثالثة','الرابعة','الخامسة','السادسة','السابعة','الثامنة','التاسعة','العاشرة'];
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function minutes(m){m=Math.max(1,Math.round(m));if(m===1)return'دقيقة';if(m===2)return'دقيقتان';if(m<=10)return ar(m)+' دقائق';return ar(m)+' دقيقة'}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('on')},2300)}
function ls(k,v){try{if(v===undefined){var x=localStorage.getItem(k);return x?JSON.parse(x):null}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function tc(e,sel){var t=e.target;if(t&&t.nodeType===3)t=t.parentElement;return t&&t.closest?t.closest(sel):null}
function debounce(fn,ms){var t;return function(){var a=arguments,s=this;clearTimeout(t);t=setTimeout(function(){fn.apply(s,a)},ms)}}

/* تهذيب طباعيّ عند العرض فقط (لا يمسّ ملفّات المحتوى) */
function typo(t){
  return t
    .replace(/ - /g,' — ')
    .replace(/([؀-ۿ])\s*,\s*/g,'$1، ')
    .replace(/"([^"\n]{1,200})"/g,'«$1»');
}
function rich(t){
  if(!t)return'';
  return esc(typo(t))
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>');
}
function plain(t){return typo(String(t||'')).replace(/\*\*(.+?)\*\*/g,'$1').replace(/\*(.+?)\*/g,'$1')}

/* ══════════════════════════════════════════════
   ٢. الحالة
   ══════════════════════════════════════════════ */
var book=null,uid=null;
var flat=[];                 /* الفصول المنشورة بالترتيب */
var allCh=[];                /* كل الفصول (منشورة ومسودّة) */
var content={};              /* محتوى الفصول المحمّلة */
var loading={};              /* وعود التحميل */
var cur=-1;                  /* فهرس الفصل المفتوح في flat */
var prog={chapters:{}};      /* تقدّم القارئ */
var hls=[],notes=[],refl={}; /* بيانات الفصل المفتوح */
var nbCache={};              /* بيانات الدفتر لكلّ الفصول */

var PREF_DEF={fs:0,lh:2,cw:700,font:'zain',theme:'light',ta:'justify',as:2};
var prefs=Object.assign({},PREF_DEF,ls('wq3-prefs')||{});

/* ══════════════════════════════════════════════
   ٣. الإقلاع: الفهرس + الدخول
   ══════════════════════════════════════════════ */
var mReady=false,aReady=false;
window.__mOK=function(){
  if(!window.WQ_BOOK)return window.__mFail();
  book=window.WQ_BOOK;buildIndex();mReady=true;start();
};
window.__mFail=function(){hideBoot();$('#home').style.display='block';$('#home').innerHTML=wall('تعذّر فتح الكتاب','حدث خطأ أثناء التحميل. تأكّد من اتصالك ثمّ حدّث الصفحة.','')};

function buildIndex(){
  var parts={};(book.parts||[]).forEach(function(p){parts[p.id]=p});
  flat=[];allCh=[];
  (book.stations||[]).forEach(function(st){
    var part=parts[st.part]||{id:'_',label:'',title:'',unit:'الفصل',unitGender:'m'};
    (st.chapters||[]).forEach(function(c){
      var o={id:c.id,number:c.number,title:c.title,file:c.file,v:c.v||1,pub:c.status==='published',station:st,part:part};
      o.label=unitLabel(o);
      allCh.push(o);
      if(o.pub){o.fi=flat.length;flat.push(o)}
    });
  });
}
function unitLabel(c){
  if(c.number===0)return'مدخل';
  var f=c.part.unitGender==='f';var w=(f?ORD_F:ORD_M)[c.number]||ar(c.number);
  return(c.part.unit||'الفصل')+' '+w;
}

auth.onAuthStateChanged(function(u){
  var id=u?u.uid:null;
  if(!id){try{var enc=localStorage.getItem('_enc_user');if(enc)id=JSON.parse(decodeURIComponent(atob(enc.split('').reverse().join('')))).id}catch(e){}}
  if(!id)id=localStorage.getItem('userId');
  uid=id;aReady=true;start();
});

function start(){
  if(!mReady||!aReady||start.done)return;start.done=true;
  applyPrefs();
  if(!uid){hideBoot();$('#home').style.display='block';$('#home').innerHTML=wall(book.title,'سجّل دخولك لتفتح الكتاب وتكمل رحلتك من حيث توقّفت.','<a class="cta" href="../login.html"><span class="ct">تسجيل الدخول</span><svg class="i"><use href="#i-next"/></svg></a>');return}
  var local=ls(BOOK_KEY+'-prog');if(local&&local.chapters)prog=local;
  db.collection(C_PROG).doc(uid+'_'+BOOK_KEY).get().then(function(d){
    if(d.exists){var r=d.data();prog=mergeProg(prog,r)}
  }).catch(function(){}).then(function(){
    route(true);
    hideBoot();
    idle(prefetchAll);
  });
}
function mergeProg(a,b){
  var out={chapterId:b.chapterId||a.chapterId,chapters:Object.assign({},a.chapters||{})};
  var bc=b.chapters||{};
  Object.keys(bc).forEach(function(k){
    var x=out.chapters[k]||{},y=bc[k]||{};
    out.chapters[k]={pct:Math.max(x.pct||0,y.pct||0),done:!!(x.done||y.done),b:(y.t||0)>(x.t||0)?y.b:x.b,t:Math.max(x.t||0,y.t||0)};
  });
  return out;
}
function hideBoot(){$('#boot').classList.add('gone')}
function idle(fn){(window.requestIdleCallback||function(f){setTimeout(f,1200)})(fn)}
function wall(t,p,btn){return'<div class="wall"><div><div class="rings"><i></i><i></i><i></i><i></i></div><h2>'+esc(t)+'</h2><p>'+esc(p)+'</p>'+btn+'</div></div>'}

/* ══════════════════════════════════════════════
   ٤. التوجيه (الواجهة ↔ الفصل) مع زرّ الرجوع
   ══════════════════════════════════════════════ */
function route(first){
  var p=new URLSearchParams(location.search),cid=p.get('ch');
  var i=cid?flat.findIndex(function(c){return c.id===cid}):-1;
  if(i>=0){var b=location.hash.match(/^#b(\d+)$/);openChapter(i,{push:false,block:b?+b[1]:null})}
  else showHome();
}
window.addEventListener('popstate',function(){closeAll();stopAS();route()});
function go(url,push){if(push)history.pushState(null,'',url);else history.replaceState(null,'',url)}

/* ══════════════════════════════════════════════
   ٥. تحميل الفصول
   ══════════════════════════════════════════════ */
function load(c){
  if(content[c.id])return Promise.resolve(content[c.id]);
  if(loading[c.id])return loading[c.id];
  loading[c.id]=new Promise(function(res,rej){
    window.WQ_CONTENT=window.WQ_CONTENT||{};
    var s=document.createElement('script');
    s.src=book.contentPath+c.file+'?v='+c.v+'.'+(book.version||1);
    s.onload=function(){var d=window.WQ_CONTENT[c.id];if(!d){delete loading[c.id];return rej()}content[c.id]=prep(d);res(content[c.id])};
    s.onerror=function(){delete loading[c.id];rej()};
    document.head.appendChild(s);
  });
  return loading[c.id];
}
function prep(d){
  var words=0,secs=[];
  (d.sections||[]).forEach(function(s,i){
    var t=(s.content||'');words+=t.split(/\s+/).filter(Boolean).length;
    if(s.type==='section_header')secs.push({i:i,t:t});
  });
  d._words=words;d._min=words/WPM;d._secs=secs;return d;
}
function prefetchAll(){flat.reduce(function(p,c){return p.then(function(){return load(c).catch(function(){})})},Promise.resolve()).then(function(){if($('#home').style.display==='block')refreshHomeTimes()})}

/* ══════════════════════════════════════════════
   ٦. الواجهة: غلاف + تقدّم + فهرس الرحلة
   ══════════════════════════════════════════════ */
function showHome(){
  cur=-1;stopAS();hideSel();
  $('#reader').style.display='none';$('#home').style.display='block';
  document.body.classList.remove('bars-hidden');
  go(location.pathname,false);
  var last=lastChapter(),lc=last?flat[last.i]:null;
  var doneN=flat.filter(function(c){return(prog.chapters[c.id]||{}).done}).length;
  var pct=flat.length?Math.round(flat.reduce(function(a,c){var x=prog.chapters[c.id]||{};return a+(x.done?100:(x.pct||0))},0)/flat.length):0;

  var h='<section class="hero"><div class="hero-bg"></div><div class="hero-art rings"><i></i><i></i><i></i><i></i></div>';
  h+='<div class="home-top"><a class="ghost" href="../my-courses.html"><svg class="i"><use href="#i-back"/></svg>رحلاتي</a><div class="grp"><button class="ib" data-act="search" aria-label="بحث"><svg class="i"><use href="#i-search"/></svg></button><button class="ib" data-act="theme" aria-label="الوضع الليلي"><svg class="i"><use href="#i-'+(prefs.theme==='dark'?'sun':'moon')+'"/></svg></button></div></div>';
  h+='<div class="hero-in"><div class="series">'+esc(book.seriesTitle||'')+'</div><h1>'+esc(book.title)+'</h1>';
  h+='<div class="blabel">'+esc(book.bookLabel||'')+'</div><div class="auth">'+esc(book.author||'')+'</div>';
  if(book.epigraph)h+='<p class="epi">'+esc(book.epigraph)+'</p>';else h+='<div style="height:34px"></div>';
  if(lc&&last.started){
    h+='<button class="cta" data-open="'+lc.fi+'" data-resume="1"><span class="ct"><small>تابع من حيث توقّفت</small>'+esc(lc.label)+' — '+esc(lc.title)+'</span><svg class="i"><use href="#i-next"/></svg></button>';
  }else if(flat.length){
    h+='<button class="cta" data-open="0"><span class="ct">ابدأ القراءة</span><svg class="i"><use href="#i-next"/></svg></button>';
  }
  h+='<div class="hero-links"><button class="ghost" data-act="scrollToc"><svg class="i"><use href="#i-list"/></svg>فهرس الرحلة</button><button class="ghost" data-act="notebookHome"><svg class="i"><use href="#i-note"/></svg>دفتري</button></div>';
  h+='</div></section>';

  h+='<section class="stats">';
  h+='<div class="stat"><b>'+ar(flat.length)+'</b><span>فصول متاحة</span></div>';
  h+='<div class="stat"><b>'+ar(doneN)+'</b><span>أتممتها</span></div>';
  h+='<div class="stat"><b id="totTime">—</b><span>زمن القراءة</span></div>';
  h+='<div class="meter"><span>تقدّمك في الكتاب</span><div class="bar"><i style="width:'+pct+'%"></i></div><span>'+ar(pct)+'٪</span></div>';
  h+='</section>';

  h+='<section class="toc" id="tocAnchor"><div class="toc-h"><h2>رحلة الكتاب</h2><p>كلّ فصلٍ باب، وكلّ بابٍ يفتح ما بعده.</p></div>';
  (book.parts||[{id:'_'}]).forEach(function(p){
    var sts=(book.stations||[]).filter(function(s){return(s.part||'_')===p.id||(!book.parts)});
    if(!sts.length)return;
    var pc=allCh.filter(function(c){return c.part.id===p.id});
    var pub=pc.filter(function(c){return c.pub}).length;
    h+='<div class="part"><div class="part-h"><small>'+esc(p.label||'')+'</small><h3>'+esc(p.title||'')+'</h3><em>'+(pub?ar(pub)+' من '+ar(pc.length)+' متاحة':'قيد الكتابة')+'</em></div>';
    sts.forEach(function(st){
      h+='<div class="station"><div class="st-h"><span class="dot"></span><div><h4>'+esc(st.title)+'</h4>'+(st.gate?'<p>'+esc(st.gate)+'</p>':'')+'</div></div><div class="chs">';
      allCh.filter(function(c){return c.station===st}).forEach(function(c){h+=chRow(c,lc)});
      h+='</div></div>';
    });
    h+='</div>';
  });
  h+='</section><footer class="foot">'+esc(book.title)+' · '+esc(book.seriesTitle||'')+' · '+esc(book.author||'')+'</footer>';
  $('#home').innerHTML=h;
  window.scrollTo(0,0);
  refreshHomeTimes();
}
function chRow(c,lc){
  var p=prog.chapters[c.id]||{};
  if(!c.pub)return'<div class="chrow lock" aria-disabled="true"><span class="n">'+(c.number?ar(c.number):'٠')+'</span><span class="t"><b>'+esc(c.title)+'</b><span>'+esc(c.label)+'</span></span><span class="st"><svg class="i"><use href="#i-lock"/></svg><span class="lbl">قريبًا</span></span></div>';
  var st;
  if(p.done)st='<svg class="i"><use href="#i-check"/></svg><span class="lbl">أتممته</span>';
  else if(p.pct>0)st=ring(p.pct)+'<span class="lbl">'+ar(p.pct)+'٪</span>';
  else st='';
  var cls='chrow'+(p.done?' done':'')+(lc&&lc.id===c.id?' cur':'');
  return'<button class="'+cls+'" data-open="'+c.fi+'"><span class="n">'+(c.number?ar(c.number):'٠')+'</span><span class="t"><b>'+esc(c.title)+'</b><span data-time="'+c.id+'">'+esc(c.label)+'</span></span><span class="st">'+st+'</span></button>';
}
function ring(p){var r=12,C=2*Math.PI*r;return'<svg class="prog-ring" viewBox="0 0 30 30"><circle class="bgc" cx="15" cy="15" r="'+r+'"/><circle class="fgc" cx="15" cy="15" r="'+r+'" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-p/100))+'"/></svg>'}
function refreshHomeTimes(){
  var tot=0,all=true;
  flat.forEach(function(c){var d=content[c.id];var el=$('[data-time="'+c.id+'"]');
    if(d){tot+=d._min;if(el)el.textContent=c.label+' · '+minutes(d._min)}else all=false});
  var t=$('#totTime');if(t&&all){var hrs=tot/60;t.textContent=hrs>=1?ar(Math.round(hrs*10)/10).replace('.','٫')+' س':minutes(tot)}
}
function lastChapter(){
  var id=prog.chapterId;var i=id?flat.findIndex(function(c){return c.id===id}):-1;
  if(i<0)return null;
  var p=prog.chapters[id]||{};
  if(p.done&&i<flat.length-1)return{i:i+1,started:true};
  return{i:i,started:true};
}

/* ══════════════════════════════════════════════
   ٧. فتح الفصل وعرضه
   ══════════════════════════════════════════════ */
function openChapter(i,opt){
  opt=opt||{};
  if(i<0||i>=flat.length)return;
  var c=flat[i];
  closeAll();stopAS();hideSel();
  if(cur>=0)flushPos();
  cur=i;
  $('#home').style.display='none';$('#reader').style.display='block';
  document.body.classList.remove('bars-hidden');
  if(opt.push!==false)go(location.pathname+'?ch='+c.id,true);else go(location.pathname+'?ch='+c.id+location.hash,false);
  updateBars();
  $('#page').innerHTML='<div class="wall" style="min-height:60vh"><div><div class="rings" style="--rs:80px"><i></i><i></i><i></i><i></i></div></div></div>';
  load(c).then(function(d){
    if(cur!==i)return;
    render(c,d);
    var target=opt.block;
    if(target==null&&opt.resume!==false){var p=prog.chapters[c.id];if(p&&!p.done&&p.b>2)target=p.b}
    requestAnimationFrame(function(){
      if(target!=null){jumpBlock(target,opt.block!=null)}else window.scrollTo(0,0);
    });
    loadChapterData(c);
    saveProg(true);
    if(i+1<flat.length)idle(function(){load(flat[i+1]).catch(function(){})});
  }).catch(function(){
    $('#page').innerHTML=wall('تعذّر فتح الفصل','تأكّد من اتصالك بالإنترنت ثمّ أعد المحاولة.','<button class="cta" data-open="'+i+'"><span class="ct">إعادة المحاولة</span></button>');
  });
}

function render(c,d){
  var secs=d.sections||[];
  var h='';
  var stFirst=c.station.chapters&&c.station.chapters[0]&&c.station.chapters[0].id===c.id;
  if(stFirst&&c.station.gate)h+='<section class="gate"><span class="gl">'+esc(c.part.label?c.part.label+' · '+c.part.title:'')+'</span><h2>محطّة '+esc(c.station.title)+'</h2><p>'+esc(c.station.gate)+'</p></section>';
  h+='<header class="opener">'+(stFirst&&c.station.gate?'':'<div class="crumb">'+esc(c.part.label?c.part.label+' · ':'')+esc(c.station.title)+'</div>');
  h+='<span class="num">'+esc(c.label)+'</span><h1>'+esc(d.title||c.title)+'</h1>';
  h+='<div class="meta"><span><svg class="i"><use href="#i-clock"/></svg>'+minutes(d._min)+' قراءة</span>'+(d._secs.length?'<span><svg class="i"><use href="#i-list"/></svg>'+ar(d._secs.length)+' '+(d._secs.length>10?'وقفة':'وقفات')+'</span>':'')+'</div>';
  h+='<div class="orn"><svg><use href="#i-orn"/></svg></div></header><article class="art" id="art">';
  secs.forEach(function(s,i){h+=block(s,i)});
  h+='</article>'+endCard(c);
  $('#page').innerHTML=h;
  cacheLayout();
}
function block(s,i){
  var a=' id="b'+i+'" data-b="'+i+'"';
  switch(s.type){
    case'prose':return'<p class="b b-p"'+a+'><span class="bt">'+rich(s.content)+'</span></p>';
    case'section_header':return'<h2 class="b b-h"'+a+'><span class="bt">'+rich(s.content)+'</span></h2>';
    case'divider':return'<div class="b b-d"'+a+' aria-hidden="true"><i></i><i></i><i></i></div>';
    case'verse':return'<figure class="b b-v"'+a+'><span class="br">﴿ </span><span class="bt">'+esc(s.content)+'</span><span class="br"> ﴾</span>'+(s.reference?'<figcaption class="ref">'+esc(s.reference)+'</figcaption>':'')+'</figure>';
    case'hadith':return'<figure class="b b-hd"'+a+'><span class="lbl">قال رسول الله ﷺ</span><span class="bt">«'+esc(s.content)+'»</span>'+(s.reference?'<figcaption class="ref">'+esc(s.reference)+'</figcaption>':'')+'</figure>';
    case'emphasis':return'<blockquote class="b b-e"'+a+'><span class="bt">'+rich(s.content)+'</span></blockquote>';
    case'pause':return'<aside class="b b-pz"'+a+'><div class="breath" aria-hidden="true"></div><span class="lbl">وقفة</span><span class="bt">'+rich(s.content)+'</span></aside>';
    case'reflection':return'<aside class="b b-r"'+a+'><span class="lbl"><svg class="i"><use href="#i-leaf"/></svg>سؤال للتأمّل</span><span class="bt">'+rich(s.content)+'</span><div class="ans"><textarea data-refl="'+i+'" placeholder="اكتب ما يحضرك هنا… لا يراه أحدٌ غيرك." aria-label="إجابتك"></textarea><div class="st" data-rst="'+i+'"></div></div></aside>';
    case'closing_quote':return'<blockquote class="b b-e"'+a+'><span class="bt">'+rich(s.content)+'</span>'+(s.reference?'<span class="ref">'+esc(s.reference)+'</span>':'')+'</blockquote>';
    case'exercise':return'<aside class="b b-r"'+a+'><span class="lbl">'+esc(s.title||'تمرين')+'</span><span class="bt">'+rich(s.content||s.description||'')+'</span>'+(s.url?'<p style="margin-top:.6em"><a class="ghost" href="'+esc(s.url)+'" target="_blank" rel="noopener">ابدأ التمرين</a></p>':'')+'</aside>';
    default:return'';
  }
}
function endCard(c){
  var n=flat[c.fi+1];
  var h='<section class="end" id="endCard"><div class="rings"><i></i><i></i><i></i><i></i></div><h3>أتممت '+esc(c.label)+'</h3><p>خذ ما وصلك منه، ولا تستعجل ما لم يصل بعد.</p>';
  if(n&&n.station!==c.station)h+='<p class="st-close">هنا تنتهي محطّة «'+esc(c.station.title)+'»، وتبدأ محطّة «'+esc(n.station.title)+'».</p>';
  if(n)h+='<button class="next-card" data-open="'+n.fi+'" data-fresh="1"><span class="t"><small>التالي · '+esc(n.label)+'</small><b>'+esc(n.title)+'</b></span><svg class="i"><use href="#i-next"/></svg></button>';
  else{var nx=allCh[allCh.indexOf(c)+1];h+='<p style="margin-top:18px">'+(nx?'الفصل التالي «'+esc(nx.title)+'» قيد الكتابة، وسيظهر هنا حين يكتمل.':'وصلت إلى آخر ما نُشر من الكتاب.')+'</p>'}
  h+='<div><button class="ghost" data-act="home"><svg class="i"><use href="#i-book"/></svg>فهرس الرحلة</button> <button class="ghost" data-act="notebook"><svg class="i"><use href="#i-note"/></svg>دفتري</button></div></section>';
  return h;
}
function updateBars(){
  var c=flat[cur];if(!c)return;
  $('#tTitle').textContent=c.title;
  $('#tCrumb').textContent=c.label+' · '+c.station.title;
  var p=flat[cur-1],n=flat[cur+1];
  $('#bPrev').disabled=!p;$('#bNext').disabled=!n;
  $('#bPrevT').textContent=p?p.title:'';$('#bNextT').textContent=n?n.title:'';
  $('#thBtn').innerHTML='<svg class="i"><use href="#i-'+(prefs.theme==='dark'?'sun':'moon')+'"/></svg>';
}
function jumpBlock(i,flash){
  var el=document.getElementById('b'+i);if(!el){window.scrollTo(0,0);return}
  var y=el.getBoundingClientRect().top+window.scrollY-110;

function btOf(i){var b=document.getElementById('b'+i);return b&&$('.bt',b)}

  unpaint();
  var noteByHl={};notes.forEach(function(n){if(n.hl)noteByHl[n.hl]=1});
  hls.forEach(function(h){
    var bt=null,s=h.s,e=h.e;
    if(h.b!=null){bt=btOf(h.b);if(bt&&bt.textContent.slice(s,e)!==h.text){var k=bt.textContent.indexOf(h.text);s=k;e=k+h.text.length;if(k<0)bt=null}}

      var all=$$('#art .bt');for(var j=0;j<all.length;j++){var k2=all[j].textContent.indexOf(h.text);if(k2>=0){bt=all[j];s=k2;e=k2+h.text.length;break}}
    }

function wrap(bt,s,e,h,hasNote){

}

function renderNb(){
  if(cur<0&&nbTab==='nb-ch')nbTab='nb-all';
  $$('#dNb .tab').forEach(function(t){t.classList.toggle('on',t.dataset.tab===nbTab);if(t.dataset.tab==='nb-ch')t.style.display=cur>=0?'':'none'});
  var body=$('#nbBody');
  if(nbTab==='nb-ch'){
    var c=flat[cur];var inner=chapterNb(c,{hls:hls,notes:notes});
    body.innerHTML='<div class="nb-tools"><button class="ghost" data-act="freeNote"><svg class="i"><use href="#i-pen"/></svg>ملاحظة عامّة</button></div>'+(inner||'<div class="empty"><svg class="i"><use href="#i-pen"/></svg><br>حدّد أيّ جملة في الفصل لتظلّلها أو تكتب عليها ملاحظة.</div>');
    return;
  }
  body.innerHTML='<div class="empty">جارٍ جمع دفترك…</div>';
  fetchAllNb().then(function(){
    var h='';
    if(nbTab==='nb-all'){
      flat.forEach(function(c){var d=nbCache[c.id];if(!d)return;var inner=chapterNb(c,d);if(inner)h+='<div class="nb-chh">'+esc(c.label+' · '+c.title)+'</div>'+inner});
      if(h)h='<div class="nb-tools"><button class="ghost" data-act="exportNb"><svg class="i"><use href="#i-dl"/></svg>تنزيل دفتري كملفّ نصّي</button></div>'+h;
      else h='<div class="empty"><svg class="i"><use href="#i-note"/></svg><br>دفترك فارغ حتى الآن.<br>كلّ ما تظلّله أو تكتبه أثناء القراءة يُجمع هنا.</div>';
    }else{
      flat.forEach(function(c){var d=nbCache[c.id];if(!d||!d.refl)return;var keys=Object.keys(d.refl).filter(function(k){return d.refl[k].text&&d.refl[k].text.trim()});if(!keys.length)return;
        var cc=content[c.id];h+='<div class="nb-chh">'+esc(c.label+' · '+c.title)+'</div>';
        keys.sort(function(a,b){return a-b}).forEach(function(k){var q=cc&&cc.sections[k]?plain(cc.sections[k].content):'سؤال للتأمّل';h+='<div class="nb-item" data-goto="'+c.fi+'" data-gb="'+k+'"><div class="nb-q c-green">'+esc(q)+'</div><div class="nb-n">'+esc(d.refl[k].text)+'</div></div>'})});
      if(!h)h='<div class="empty"><svg class="i"><use href="#i-leaf"/></svg><br>في آخر كلّ فصلٍ أسئلة للتأمّل.<br>ما تكتبه فيها يُحفظ لك ويُجمع هنا.</div>';
    }
    body.innerHTML=h;
  });
}
function fetchAllNb(){
  if(!uid)return Promise.resolve();
  return Promise.all(flat.map(function(c){
    if(nbCache[c.id]&&c.fi!==cur)return Promise.resolve();
    if(c.fi===cur){nbCache[c.id]={hls:hls,notes:notes,refl:refl};return Promise.resolve()}
    return Promise.all([db.collection(C_HL).doc(docId(c.id)).get().catch(function(){return null}),db.collection(C_NOTES).doc(docId(c.id)).get().catch(function(){return null})]).then(function(r){
      var nd=r[1]&&r[1].exists?r[1].data():{};
      nbCache[c.id]={hls:r[0]&&r[0].exists?(r[0].data().items||[]):[],notes:nd.items||[],refl:nd.reflections||{}};
    });
  })).then(function(){return Promise.all(flat.filter(function(c){var d=nbCache[c.id];return d&&Object.keys(d.refl||{}).length}).map(function(c){return load(c).catch(function(){})}))});
}
function exportNb(){
  var out=book.title+' — دفتري\n'+(book.author||'')+'\n\n';
  flat.forEach(function(c){var d=nbCache[c.id];if(!d)return;var body='';
    (d.hls||[]).slice().sort(function(a,b){return(a.b-b.b)||(a.s-b.s)}).forEach(function(h){body+='«'+h.text+'»\n';var n=(d.notes||[]).find(function(x){return x.hl===h.id});if(n)body+='   ✎ '+n.text+'\n';body+='\n'});
    (d.notes||[]).filter(function(n){return!n.hl}).forEach(function(n){body+='✎ '+n.text+'\n\n'});
    var cc=content[c.id];Object.keys(d.refl||{}).forEach(function(k){if(!d.refl[k].text)return;body+='؟ '+(cc?plain(cc.sections[k].content):'')+'\n   '+d.refl[k].text+'\n\n'});
    if(body)out+='━━━━ '+c.label+': '+c.title+' ━━━━\n\n'+body;
  });
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'text/plain;charset=utf-8'}));a.download='دفتري — ولادة قلب.txt';a.click();
}

/* ─── الإعدادات ─── */
var FONTS={zain:"'Zain','ZainLocal','Noto Naskh Arabic',serif",amiri:"'Amiri',serif",naskh:"'Noto Naskh Arabic',serif"};
function baseFs(){return window.innerWidth<640?19:20}
function applyPrefs(){
  var r=document.documentElement;
  r.setAttribute('data-theme',prefs.theme==='light'?'':prefs.theme);
  r.style.setProperty('--fs',(prefs.fs||baseFs())+'px');
  r.style.setProperty('--lh',prefs.lh);
  r.style.setProperty('--cw',prefs.cw+'px');
  r.style.setProperty('--ta',prefs.ta);
  r.style.setProperty('--f-body',FONTS[prefs.font]||FONTS.zain);
  var mc={light:'#F6F0E6',sepia:'#EFE3CC',dark:'#101412'}[prefs.theme];$('meta[name=theme-color]').setAttribute('content',mc);
  $$('[data-act=theme]').forEach(function(b){b.innerHTML='<svg class="i"><use href="#i-'+(prefs.theme==='dark'?'sun':'moon')+'"/></svg>'});
  ls('wq3-prefs',prefs);
  if(cur>=0)setTimeout(cacheLayout,60);
}
function renderSet(){
  var fs=prefs.fs||baseFs();
  var seg=function(key,opts){return'<div class="seg">'+opts.map(function(o){return'<button data-pref="'+key+'" data-v="'+o[0]+'" class="'+(String(prefs[key])===String(o[0])?'on':'')+'">'+o[1]+'</button>'}).join('')+'</div>'};
  var h='';
  h+='<div class="set-g"><div class="set-l">حجم الخط <b id="fsv">'+ar(fs)+'</b></div><input type="range" min="16" max="30" step="1" value="'+fs+'" data-range="fs" aria-label="حجم الخط"><div class="fprev">وحين يحلّ الليل وترتخي الستائر، تجلس لتُحصي ما أنجزت.</div></div>';
  h+='<div class="set-g"><div class="set-l">نوع الخط</div>'+seg('font',[['zain','زين'],['amiri','أميري'],['naskh','نسخ']])+'</div>';
  h+='<div class="set-g"><div class="set-l">تباعد الأسطر</div>'+seg('lh',[[1.7,'متقارب'],[2,'عادي'],[2.3,'مريح'],[2.6,'واسع']])+'</div>';
  h+='<div class="set-g"><div class="set-l">عرض النصّ</div>'+seg('cw',[[600,'ضيّق'],[700,'عادي'],[840,'واسع']])+'</div>';
  h+='<div class="set-g"><div class="set-l">محاذاة الفقرات</div>'+seg('ta',[['justify','ضبط الطرفين'],['right','إلى اليمين']])+'</div>';
  h+='<div class="set-g"><div class="set-l">لون الصفحة</div><div class="themes"><button data-pref="theme" data-v="light" class="'+(prefs.theme==='light'?'on':'')+'">فاتح</button><button data-pref="theme" data-v="sepia" class="'+(prefs.theme==='sepia'?'on':'')+'">ورقيّ</button><button data-pref="theme" data-v="dark" class="'+(prefs.theme==='dark'?'on':'')+'">ليليّ</button></div></div>';
  h+='<div class="set-g"><div class="set-l">سرعة التمرير التلقائيّ <b id="asv">'+ar(prefs.as)+'</b></div><input type="range" min="1" max="6" step="1" value="'+prefs.as+'" data-range="as" aria-label="سرعة التمرير"></div>';
  h+='<div class="set-g"><button class="ghost" data-act="resetPrefs">استعادة الإعدادات الافتراضيّة</button></div>';
  $('#setBody').innerHTML=h;
}
$('#setBody').addEventListener('input',function(e){
  var r=e.target.dataset.range;if(!r)return;
  prefs[r]=+e.target.value;$('#'+r+'v').textContent=ar(prefs[r]);applyPrefs();
});
$('#setBody').addEventListener('click',function(e){
  var b=tc(e,'[data-pref]');if(!b)return;
  var k=b.dataset.pref,v=b.dataset.v;prefs[k]=isNaN(+v)?v:+v;applyPrefs();renderSet();
});

/* ─── البحث في الكتاب ─── */
function norm(s){return String(s).replace(/[ً-ْٰـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')}
function openSearch(){
  openModal('mSearch');var inp=$('#sIn');inp.value='';$('#sRes').innerHTML='<div class="sr-cnt">اكتب كلمةً أو جزءًا من جملة.</div>';setTimeout(function(){inp.focus()},60);
  Promise.all(flat.map(function(c){return load(c).catch(function(){})}));
}
$('#sIn').addEventListener('input',debounce(function(){
  var q=$('#sIn').value.trim();var res=$('#sRes');
  if(q.length<2){res.innerHTML='<div class="sr-cnt">اكتب كلمةً أو جزءًا من جملة.</div>';return}
  Promise.all(flat.map(function(c){return load(c).catch(function(){})})).then(function(){
    var nq=norm(q),out=[],count=0;
    flat.forEach(function(c){var d=content[c.id];if(!d)return;
      d.sections.forEach(function(s,i){if(!s.content)return;var t=plain(s.content),n=norm(t),k=n.indexOf(nq);if(k<0)return;count++;
        if(out.length>=80)return;
        /* خريطة من النصّ المُطبَّع إلى الأصليّ */
        var map=[],j=0;for(var z=0;z<t.length;z++){if(!/[ً-ْٰـ]/.test(t[z]))map.push(z)}
        var a=map[k]||0,b=(map[k+nq.length-1]||a)+1;
        var st=Math.max(0,a-60),en=Math.min(t.length,b+80);
        out.push('<button class="sr-i" data-goto="'+c.fi+'" data-gb="'+i+'"><small>'+esc(c.label+' · '+c.title)+'</small><p>'+(st>0?'… ':'')+esc(t.slice(st,a))+'<mark>'+esc(t.slice(a,b))+'</mark>'+esc(t.slice(b,en))+(en<t.length?' …':'')+'</p></button>');
      });
    });
    res.innerHTML='<div class="sr-cnt">'+(count?ar(count)+' نتيجة':'لا نتائج')+'</div>'+out.join('');
  });
},220));

/* ─── التمرير التلقائيّ ─── */
var asOn=false,asRaf=0,asAcc=0;
function toggleAS(){asOn?stopAS():startAS()}
function startAS(){asOn=true;$('#asBtn').classList.add('on');$('#asBtn').innerHTML='<svg class="i"><use href="#i-pause"/></svg>';document.body.classList.add('bars-hidden');var last=performance.now();
  (function step(t){if(!asOn)return;var dt=t-last;last=t;asAcc+=[0,14,22,32,45,62,85][prefs.as]*dt/1000;var px=Math.floor(asAcc);if(px){window.scrollBy(0,px);asAcc-=px}
    if(window.scrollY+window.innerHeight>=document.documentElement.scrollHeight-2){stopAS();return}asRaf=requestAnimationFrame(step)})(last);}
function stopAS(){if(!asOn)return;asOn=false;cancelAnimationFrame(asRaf);var b=$('#asBtn');b.classList.remove('on');b.innerHTML='<svg class="i"><use href="#i-play"/></svg>';document.body.classList.remove('bars-hidden')}
['wheel','touchstart','keydown'].forEach(function(ev){window.addEventListener(ev,function(e){if(asOn&&!(tc(e,'.bbar')))stopAS()},{passive:true})});

/* ══════════════════════════════════════════════
   ١١. توزيع النقرات
   ══════════════════════════════════════════════ */
document.addEventListener('click',function(e){
  var t=tc(e,'[data-act],[data-open],[data-jump],[data-goto],[data-tab],[data-nbdel],[data-nbnote]');if(!t)return;
  if(t.dataset.open!=null){var fi=+t.dataset.open;var fresh=t.dataset.fresh;closeModal();openChapter(fi,{resume:!fresh});return}
  if(t.dataset.jump!=null){closeAll();jumpBlock(+t.dataset.jump,false);return}
  if(t.dataset.goto!=null){var gi=+t.dataset.goto,gb=t.dataset.gb===''?null:+t.dataset.gb;closeAll();closeModal();
    if(gi===cur){if(gb!=null)jumpBlock(gb,true)}else openChapter(gi,{block:gb});return}
  if(t.dataset.tab){var tb=t.dataset.tab;if(tb.indexOf('toc')===0){tocTab=tb;renderToc()}else{nbTab=tb;renderNb()}return}
  if(t.dataset.nbdel){var k=t.dataset.nbdel,id=+k.slice(1);if(k[0]==='h')removeHL(id);else{notes=notes.filter(function(n){return n.id!==id});saveNotes();paintHL()}renderNb();return}
  if(t.dataset.nbnote!=null){var hid=+t.dataset.nbnote,nid=+t.dataset.nbn;var h=hid?hls.find(function(x){return x.id===hid}):null;var n=nid?notes.find(function(x){return x.id===nid}):null;closeAll();openNote(h,n);return}
  switch(t.dataset.act){
    case'home':closeAll();flushPos();showHome();break;
    case'toc':if(cur<0)return;tocTab='toc-ch';renderToc();openDrawer('dToc');break;
    case'notebook':nbTab=cur>=0?'nb-ch':'nb-all';renderNb();openDrawer('dNb');break;
    case'notebookHome':nbTab='nb-all';renderNb();openDrawer('dNb');break;
    case'settings':renderSet();openDrawer('dSet');break;
    case'search':openSearch();break;
    case'theme':prefs.theme=prefs.theme==='dark'?'light':'dark';applyPrefs();break;
    case'autoscroll':toggleAS();break;
    case'prev':if(cur>0)openChapter(cur-1,{});break;
    case'next':if(cur<flat.length-1)openChapter(cur+1,{});break;
    case'close':closeAll();break;
    case'mclose':closeModal();break;
    case'scrollToc':$('#tocAnchor').scrollIntoView({behavior:'smooth'});break;
    case'freeNote':closeAll();openNote(null,null);break;
    case'exportNb':exportNb();break;
    case'resetPrefs':prefs=Object.assign({},PREF_DEF);applyPrefs();renderSet();break;
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closeAll();closeModal();hideSel();return}
  if(tc(e,'input,textarea'))return;
  if(cur<0)return;
  if(e.key==='ArrowLeft'&&!e.altKey&&!e.metaKey){if(cur<flat.length-1)openChapter(cur+1,{})}
  else if(e.key==='ArrowRight'&&!e.altKey&&!e.metaKey){if(cur>0)openChapter(cur-1,{})}
  else if(e.key==='/'){e.preventDefault();openSearch()}
});
window.addEventListener('resize',function(){if(!prefs.fs)applyPrefs()});

})();
</script>
