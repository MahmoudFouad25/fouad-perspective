<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F0E6">
<title>ولادة قلب — منظور الفؤاد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zain:wght@300;400;700;800;900&family=Amiri:wght@400;700&family=Amiri+Quran&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
/* زين محلّيًا من المستودع — احتياطٌ لو تعذّر خط جوجل */
@font-face{font-family:'ZainLocal';src:url('../external-exercise/Adam-journey/fonts/Zain-Light.ttf') format('truetype');font-weight:300;font-display:swap}
@font-face{font-family:'ZainLocal';src:url('../external-exercise/Adam-journey/fonts/Zain-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'ZainLocal';src:url('../external-exercise/Adam-journey/fonts/Zain-Bold.ttf') format('truetype');font-weight:700;font-display:swap}
@font-face{font-family:'ZainLocal';src:url('../external-exercise/Adam-journey/fonts/Zain-ExtraBold.ttf') format('truetype');font-weight:800;font-display:swap}
@font-face{font-family:'ZainLocal';src:url('../external-exercise/Adam-journey/fonts/Zain-Black.ttf') format('truetype');font-weight:900;font-display:swap}

/* ═══════════ ألوان ═══════════ */
:root{
  --bg:#F6F0E6;--bg2:#EFE6D8;--card:#FCF8F1;--txt:#2A221C;--txt2:#5F5246;--muted:#9C8C7B;
  --ink:#163A2C;--ink2:#255C45;--ink-bg:rgba(22,58,44,.06);
  --gold:#A87A2E;--gold2:#C99A4B;--gold-bg:rgba(168,122,46,.08);
  --line:rgba(42,34,28,.10);--line2:rgba(168,122,46,.28);
  --bar:rgba(246,240,230,.9);--shadow:0 10px 40px rgba(42,34,28,.10);
  --hl-y:rgba(245,190,50,.38);--hl-g:rgba(80,180,120,.30);--hl-r:rgba(230,100,90,.28);--hl-b:rgba(80,140,230,.26);
  --f-body:'Zain','ZainLocal','Noto Naskh Arabic',serif;
  --f-head:'Zain','ZainLocal','Noto Naskh Arabic',serif;
  --f-quran:'Amiri Quran','Amiri',serif;
  --f-classic:'Amiri',serif;
  --fs:20px;--lh:2;--cw:700px;--ta:justify;
}
[data-theme=sepia]{
  --bg:#EFE3CC;--bg2:#E6D7BB;--card:#F5EBD7;--txt:#3B2C1C;--txt2:#65513B;--muted:#98825F;
  --ink:#2F4F35;--ink2:#3E6B48;--ink-bg:rgba(47,79,53,.07);
  --gold:#9A6C22;--gold2:#B8863A;--gold-bg:rgba(154,108,34,.09);
  --line:rgba(59,44,28,.12);--line2:rgba(154,108,34,.3);--bar:rgba(239,227,204,.92);
}
[data-theme=dark]{
  --bg:#101412;--bg2:#171D1A;--card:#1A211D;--txt:#E6DDCF;--txt2:#B3A794;--muted:#7B7263;
  --ink:#8FCBAE;--ink2:#6DB894;--ink-bg:rgba(143,203,174,.08);
  --gold:#D6AE6E;--gold2:#C99A4B;--gold-bg:rgba(214,174,110,.09);
  --line:rgba(230,221,207,.09);--line2:rgba(214,174,110,.25);
  --bar:rgba(16,20,18,.9);--shadow:0 10px 40px rgba(0,0,0,.45);
  --hl-y:rgba(245,190,50,.28);--hl-g:rgba(80,180,120,.26);--hl-r:rgba(230,100,90,.26);--hl-b:rgba(80,140,230,.28);
}

*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--f-body);font-size:var(--fs);line-height:var(--lh);-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .35s,color .35s}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
::selection{background:rgba(168,122,46,.28)}
svg.i{width:20px;height:20px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}

/* ═══════════ شعار الدوائر الأربع (يستعمل كمُحمّل وفي الواجهة) ═══════════ */
.rings{position:relative;width:var(--rs,120px);height:var(--rs,120px)}
.rings i{position:absolute;inset:0;margin:auto;border-radius:50%;border:1.5px solid var(--gold);opacity:.55}
.rings i:nth-child(1){width:100%;height:100%;opacity:.18;animation:breathe 6s ease-in-out infinite}
.rings i:nth-child(2){width:74%;height:74%;opacity:.32;animation:breathe 6s ease-in-out .5s infinite}
.rings i:nth-child(3){width:48%;height:48%;opacity:.55;border-color:var(--ink2);animation:breathe 6s ease-in-out 1s infinite}
.rings i:nth-child(4){width:22%;height:22%;opacity:1;background:var(--gold);border:0;box-shadow:0 0 30px var(--gold);animation:breathe 6s ease-in-out 1.5s infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

.boot{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:var(--bg);transition:opacity .6s,visibility .6s}
.boot.gone{opacity:0;visibility:hidden}
.boot p{font-family:var(--f-head);font-weight:800;font-size:28px;color:var(--ink);letter-spacing:.5px}

/* ═══════════ الواجهة (الغلاف + الفهرس) ═══════════ */
#home{display:none}
.hero{min-height:100svh;display:grid;place-items:center;padding:48px 24px 40px;position:relative;overflow:hidden;text-align:center}
.hero-bg{position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 50% at 50% 42%,var(--gold-bg),transparent 70%)}
.hero-art{position:absolute;top:50%;left:50%;transform:translate(-50%,-54%);--rs:min(96vw,680px);opacity:.5;pointer-events:none}
.hero-art i:nth-child(4){width:3%;height:3%;opacity:.7;box-shadow:0 0 60px 30px var(--gold-bg)}
.hero-in{position:relative;z-index:1;max-width:760px}
.hero .series{display:inline-flex;align-items:center;gap:12px;font-size:15px;color:var(--gold);font-weight:700;letter-spacing:.5px;margin-bottom:10px}
.hero .series::before,.hero .series::after{content:'';width:34px;height:1px;background:var(--line2)}
.hero h1{font-family:var(--f-head);font-weight:900;font-size:clamp(64px,15vw,136px);line-height:1.05;color:var(--ink);letter-spacing:-1px;margin-bottom:8px}
.hero .blabel{font-size:18px;color:var(--txt2);font-weight:700}
.hero .auth{font-size:16px;color:var(--muted);margin-top:2px}
.hero .epi{margin:30px auto 34px;max-width:520px;font-size:clamp(19px,2.6vw,23px);line-height:1.9;color:var(--txt2);font-weight:300}
.cta{display:inline-flex;align-items:center;gap:14px;padding:15px 30px 15px 22px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:19px;font-weight:700;box-shadow:0 10px 30px rgba(22,58,44,.25);transition:transform .25s,box-shadow .25s}
[data-theme=dark] .cta{color:#0F1512}
.cta:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(22,58,44,.3)}
.cta small{display:block;font-size:13px;font-weight:400;opacity:.8;line-height:1.3}
.cta .ct{text-align:right;line-height:1.35}
.cta svg{width:22px;height:22px}
.hero-links{margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ghost{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:16px;color:var(--txt2);transition:all .2s}
.ghost:hover{border-color:var(--line2);color:var(--ink)}
.ghost svg{width:17px;height:17px}
.home-top{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;padding-top:max(14px,env(safe-area-inset-top))}
.home-top .grp{display:flex;gap:6px}

.stats{max-width:880px;margin:0 auto;padding:0 20px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px;text-align:center}
.stat b{display:block;font-size:30px;font-weight:900;color:var(--ink);line-height:1.2}
.stat span{font-size:15px;color:var(--muted)}
.meter{grid-column:1/-1;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 20px;display:flex;align-items:center;gap:16px}
.meter .bar{flex:1;height:8px;border-radius:9px;background:var(--bg2);overflow:hidden}
.meter .bar i{display:block;height:100%;background:linear-gradient(270deg,var(--gold),var(--ink2));border-radius:9px;transition:width .8s}
.meter span{font-size:16px;color:var(--txt2);white-space:nowrap}

.toc{max-width:880px;margin:0 auto;padding:64px 20px 90px}
.toc-h{text-align:center;margin-bottom:40px}
.toc-h h2{font-family:var(--f-head);font-weight:900;font-size:clamp(34px,5vw,46px);color:var(--ink);line-height:1.2}
.toc-h p{color:var(--muted);font-size:17px}
.part{margin-bottom:56px}
.part-h{display:flex;align-items:baseline;gap:16px;padding-bottom:14px;margin-bottom:22px;border-bottom:2px solid var(--ink)}
.part-h small{font-size:16px;font-weight:700;color:var(--gold);white-space:nowrap}
.part-h h3{font-family:var(--f-head);font-weight:900;font-size:clamp(30px,4.4vw,40px);color:var(--ink);line-height:1.15}
.part-h em{margin-inline-start:auto;font-style:normal;font-size:15px;color:var(--muted);white-space:nowrap}
.station{margin-bottom:30px}
.st-h{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.st-h .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--gold);margin-top:12px;flex-shrink:0}
.st-h h4{font-family:var(--f-head);font-weight:800;font-size:25px;color:var(--gold);line-height:1.4}
.st-h p{font-size:17px;color:var(--txt2);line-height:1.8}
.chs{display:grid;gap:10px;padding-inline-start:26px}
.chrow{display:flex;align-items:center;gap:18px;padding:16px 20px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-align:right;width:100%;transition:transform .2s,border-color .2s,box-shadow .2s;position:relative;overflow:hidden}
.chrow:hover{transform:translateX(-4px);border-color:var(--line2);box-shadow:var(--shadow)}
.chrow .n{font-family:var(--f-head);font-weight:900;font-size:36px;line-height:1;color:var(--gold);min-width:44px;text-align:center}
.chrow .t{flex:1;min-width:0}
.chrow .t b{display:block;font-size:21px;font-weight:700;color:var(--txt);line-height:1.5}
.chrow .t span{font-size:15px;color:var(--muted)}
.chrow .st{flex-shrink:0;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.chrow.done .st{color:var(--ink2)}
.chrow.cur{border-color:var(--ink2);box-shadow:0 0 0 1px var(--ink2) inset}
.chrow.cur::before{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--ink2)}
.chrow.lock{opacity:.55;cursor:default}.chrow.lock:hover{transform:none;box-shadow:none;border-color:var(--line)}
.chrow.lock .n{color:var(--muted)}
.rv{font-size:12px;font-weight:800;color:#fff;background:var(--gold);padding:1px 8px;border-radius:999px;vertical-align:middle}
.prog-ring{width:30px;height:30px}
.prog-ring circle{fill:none;stroke-width:3}
.prog-ring .bgc{stroke:var(--bg2)}.prog-ring .fgc{stroke:var(--gold);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.foot{text-align:center;padding:30px 20px 60px;color:var(--muted);font-size:15px}
.foot a{text-decoration:none;color:var(--txt2)}

/* ═══════════ القارئ ═══════════ */
#reader{display:none}
.pbar{position:fixed;top:0;left:0;right:0;height:3px;z-index:310;pointer-events:none}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(270deg,var(--ink2),var(--gold));margin-inline-start:auto;transition:width .15s}
.tbar,.bbar{position:fixed;left:0;right:0;z-index:300;background:var(--bar);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);transition:transform .35s ease,opacity .35s}
.tbar{top:0;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bbar{bottom:0;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bars-hidden .tbar{transform:translateY(-110%)}
.bars-hidden .bbar{transform:translateY(110%)}
.tbar-in,.bbar-in{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:8px 12px}
.tbar-c{flex:1;min-width:0;text-align:center;line-height:1.3}
.tbar-c b{display:block;font-size:17px;font-weight:700;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbar-c span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--txt2);transition:background .2s,color .2s;position:relative}
.ib:hover{background:var(--bg2);color:var(--ink)}
.ib.on{background:var(--ink-bg);color:var(--ink)}
.ib .badge{position:absolute;top:6px;left:6px;min-width:16px;height:16px;border-radius:8px;background:var(--gold);color:#fff;font-size:10px;line-height:16px;font-weight:700;padding:0 4px}
.bbar-in{justify-content:space-between}
.navb{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:12px;font-size:15px;color:var(--txt2);max-width:30%;min-width:42px;transition:background .2s}
.navb:hover{background:var(--bg2);color:var(--ink)}
.navb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navb[disabled]{visibility:hidden}
.bbar-mid{display:flex;align-items:center;gap:2px}
.left-info{font-size:13px;color:var(--muted);text-align:center;min-width:90px;line-height:1.2}

.page{max-width:var(--cw);margin:0 auto;padding:96px 24px 140px;transition:max-width .3s}
.opener{text-align:center;padding:40px 0 34px;margin-bottom:34px;position:relative}
.opener .crumb{font-size:15px;color:var(--muted);font-weight:700;letter-spacing:.3px}
.opener .num{display:block;font-size:22px;font-weight:800;color:var(--gold);margin:18px 0 4px}
.opener h1{font-family:var(--f-head);font-weight:900;font-size:clamp(38px,6.6vw,62px);line-height:1.25;color:var(--ink)}
.opener .meta{display:flex;justify-content:center;gap:18px;margin-top:18px;font-size:15px;color:var(--muted);flex-wrap:wrap}
.opener .meta span{display:inline-flex;align-items:center;gap:6px}
.opener .meta svg{width:16px;height:16px}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--gold);margin-top:26px}
.orn::before,.orn::after{content:'';width:70px;height:1px;background:var(--line2)}
.orn svg{width:22px;height:22px;fill:var(--gold);stroke:none}

.art{font-size:var(--fs);line-height:var(--lh)}
.b{position:relative;scroll-margin-top:90px}
.b-p{margin-bottom:1.05em;text-align:var(--ta);text-justify:inter-word}
.b-p strong,.b-e strong{color:var(--ink);font-weight:700}
.b-p em{font-style:normal;color:var(--gold);font-weight:700}
.art>.b-p:first-of-type{font-size:1.08em}
.b-h{font-family:var(--f-head);font-weight:800;font-size:1.55em;line-height:1.45;color:var(--ink);margin:1.9em 0 .7em;display:flex;align-items:center;gap:14px}
.b-h::before{content:'';width:10px;height:10px;transform:rotate(45deg);background:var(--gold);flex-shrink:0;border-radius:2px}
.b-d{display:flex;justify-content:center;gap:14px;margin:2.2em 0;color:var(--gold);opacity:.7}
.b-d i{width:6px;height:6px;transform:rotate(45deg);background:currentColor;border-radius:1px}
.b-d i:nth-child(2){opacity:.55}
.b-v{margin:1.8em 0;padding:1.4em 1.6em 1.1em;text-align:center;background:var(--gold-bg);border-radius:22px;border:1px solid var(--line2);position:relative}
.b-v .bt{font-family:var(--f-quran);font-size:1.28em;line-height:2.25;color:var(--ink)}
.b-v .br{font-family:var(--f-quran);color:var(--gold);font-size:1.1em}
.ref{display:block;margin-top:.5em;font-size:.72em;color:var(--muted);font-family:var(--f-body);font-weight:700}
.b-hd{margin:1.8em 0;padding:1.3em 1.6em 1.1em;text-align:center;background:var(--ink-bg);border-radius:22px}
.b-hd .lbl,.b-r .lbl,.b-pz .lbl{display:block;font-size:.66em;font-weight:800;letter-spacing:.5px;color:var(--ink2);margin-bottom:.35em}
.b-hd .bt{font-family:var(--f-classic);font-size:1.08em;line-height:2.1}
.b-e{margin:2.1em 0;padding:.4em 0;text-align:center}
.b-e .bt{display:block;font-family:var(--f-head);font-weight:700;font-size:1.3em;line-height:1.75;color:var(--ink);max-width:560px;margin:0 auto}
.b-e::before,.b-e::after{content:'';display:block;width:56px;height:2px;background:var(--gold);margin:0 auto .9em;border-radius:2px}
.b-e::after{margin:.9em auto 0}
.b-pz{margin:2.2em 0;padding:1.6em 1.6em 1.3em;text-align:center;border-radius:24px;background:var(--card);border:1px solid var(--line)}
.b-pz .lbl{color:var(--gold)}
.b-pz .bt{display:block;color:var(--txt2);font-size:.98em;white-space:pre-line}
.breath{width:54px;height:54px;margin:0 auto 14px;border-radius:50%;border:2px solid var(--gold);position:relative;animation:inhale 8s ease-in-out infinite}
.breath::after{content:'';position:absolute;inset:14px;border-radius:50%;background:var(--gold);opacity:.35}
@keyframes inhale{0%,100%{transform:scale(.8);opacity:.6}45%,55%{transform:scale(1.15);opacity:1}}
.b-r{margin:2em 0;padding:1.4em 1.5em 1.2em;border-radius:24px;background:var(--ink-bg);border:1px solid var(--line)}
.b-r .lbl{display:flex;align-items:center;gap:8px}
.b-r .lbl svg{width:17px;height:17px}
.b-r .bt{display:block;white-space:pre-line;font-size:1em;color:var(--txt)}
.ans{margin-top:1em}
.ans textarea{width:100%;min-height:110px;resize:vertical;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-family:var(--f-body);font-size:.92em;line-height:1.9;padding:12px 16px;outline:none;transition:border-color .2s}
.ans textarea:focus{border-color:var(--ink2)}
.ans .st{font-size:.66em;color:var(--muted);margin-top:4px;min-height:1.4em}

mark.hl{color:inherit;border-radius:3px;padding:.05em 0;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone}
mark.hl-yellow{background:var(--hl-y)}mark.hl-green{background:var(--hl-g)}mark.hl-red{background:var(--hl-r)}mark.hl-blue{background:var(--hl-b)}
mark.hl.has-note{border-bottom:2px dotted var(--gold)}
.flash{animation:flash 2.2s ease}
@keyframes flash{0%,60%{background:var(--gold-bg);box-shadow:0 0 0 10px var(--gold-bg)}100%{background:transparent;box-shadow:0 0 0 10px transparent}}

.gate{text-align:center;padding:48px 26px 44px;margin:16px 0 8px;border-radius:30px;background:radial-gradient(80% 90% at 50% 0%,var(--gold-bg),transparent 75%);border:1px solid var(--line2)}
.gate .gl{font-size:15px;font-weight:800;color:var(--gold);letter-spacing:.3px}
.gate h2{font-family:var(--f-head);font-weight:900;font-size:clamp(34px,5.4vw,50px);color:var(--ink);line-height:1.3;margin:8px 0 10px}
.gate p{max-width:520px;margin:0 auto;font-size:20px;line-height:1.9;color:var(--txt2);font-weight:300}
.st-close{margin-top:22px!important;font-weight:700;color:var(--gold)!important}
.end{margin-top:3.2em;text-align:center;padding:40px 22px;border-radius:28px;background:var(--card);border:1px solid var(--line)}
.end .rings{--rs:84px;margin:0 auto 18px}
.end h3{font-family:var(--f-head);font-weight:900;font-size:30px;color:var(--ink);line-height:1.3}
.end p{font-size:17px;color:var(--txt2);margin-top:6px}
.next-card{display:flex;align-items:center;gap:16px;margin:26px auto 0;max-width:520px;padding:18px 22px;border-radius:20px;background:var(--ink);color:var(--bg);text-align:right;width:100%;transition:transform .2s}
[data-theme=dark] .next-card{color:#0F1512}
.next-card:hover{transform:translateY(-2px)}
.next-card .t{flex:1}
.next-card small{display:block;font-size:14px;opacity:.8}
.next-card b{font-size:21px;line-height:1.4}
.end .ghost{margin-top:14px}

/* ═══════════ الألواح الجانبيّة ═══════════ */
.scrim{position:fixed;inset:0;z-index:400;background:rgba(10,12,10,.35);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;z-index:410;width:400px;max-width:92vw;background:var(--bg);box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.drawer.r{right:0;transform:translateX(105%)}
.drawer.l{left:0;transform:translateX(-105%)}
.drawer.on{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;padding-top:max(16px,env(safe-area-inset-top));border-bottom:1px solid var(--line)}
.dh h3{font-family:var(--f-head);font-weight:800;font-size:23px;color:var(--ink)}
.tabs{display:flex;gap:6px;padding:12px 16px 0}
.tab{flex:1;padding:9px;border-radius:12px;font-size:16px;color:var(--txt2);background:var(--bg2);font-weight:700}
.tab.on{background:var(--ink);color:var(--bg)}
[data-theme=dark] .tab.on{color:#0F1512}
.db{flex:1;overflow-y:auto;padding:14px 16px 40px;-webkit-overflow-scrolling:touch}
.tl-sec{display:flex;gap:12px;align-items:center;width:100%;text-align:right;padding:10px 12px;border-radius:12px;font-size:17px;color:var(--txt2);line-height:1.6;transition:background .15s}
.tl-sec:hover{background:var(--bg2)}
.tl-sec i{width:8px;height:8px;border-radius:2px;transform:rotate(45deg);background:var(--line2);flex-shrink:0}
.tl-sec.on{background:var(--ink-bg);color:var(--ink);font-weight:700}
.tl-sec.on i{background:var(--gold)}
.tl-sec.past i{background:var(--gold2);opacity:.6}
.tl-grp{font-size:14px;font-weight:800;color:var(--gold);padding:14px 12px 4px}
.tl-ch{display:flex;gap:12px;align-items:center;width:100%;text-align:right;padding:10px 12px;border-radius:12px;font-size:17px;color:var(--txt2);line-height:1.5}
.tl-ch:hover{background:var(--bg2)}
.tl-ch .n{font-weight:900;color:var(--gold);min-width:24px;text-align:center}
.tl-ch.on{background:var(--ink-bg);color:var(--ink);font-weight:700}
.tl-ch.lock{opacity:.5}
.tl-ch .ok{margin-inline-start:auto;color:var(--ink2)}
.empty{text-align:center;padding:50px 20px;color:var(--muted);font-size:17px;line-height:1.8}
.empty svg{width:40px;height:40px;margin-bottom:10px;opacity:.6}
.nb-item{padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:10px;cursor:pointer;transition:border-color .2s}
.nb-item:hover{border-color:var(--line2)}
.nb-q{font-size:17px;line-height:1.8;padding-inline-start:12px;border-inline-start:4px solid var(--gold)}
.nb-q.c-yellow{border-color:#E8B53A}.nb-q.c-green{border-color:#4FAE78}.nb-q.c-red{border-color:#D86E62}.nb-q.c-blue{border-color:#5C8EE0}
.nb-n{margin-top:8px;font-size:16px;color:var(--txt2);background:var(--bg2);border-radius:10px;padding:8px 12px;line-height:1.7;white-space:pre-line}
.nb-m{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--muted)}
.nb-m .sp{flex:1}
.nb-m button{padding:4px 8px;border-radius:8px;color:var(--muted);font-size:13px}
.nb-m button:hover{background:var(--bg2);color:var(--txt)}
.nb-tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.nb-tools .ghost{font-size:14px;padding:7px 14px}
.nb-chh{font-size:15px;font-weight:800;color:var(--gold);margin:16px 4px 8px}

.set-g{margin-bottom:26px}
.set-l{font-size:15px;font-weight:800;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between}
.set-l b{color:var(--ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--bg2);padding:5px;border-radius:14px}
.seg button{padding:10px 6px;border-radius:10px;font-size:16px;color:var(--txt2);transition:all .2s}
.seg button.on{background:var(--card);color:var(--ink);font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.themes button{padding:14px 8px;border-radius:14px;border:2px solid var(--line);font-size:16px;font-weight:700}
.themes button.on{border-color:var(--gold)}
.themes [data-v=light]{background:#F6F0E6;color:#2A221C}.themes [data-v=sepia]{background:#EFE3CC;color:#3B2C1C}.themes [data-v=dark]{background:#101412;color:#E6DDCF}
input[type=range]{width:100%;accent-color:var(--ink2);height:28px}
.fprev{margin-top:8px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:var(--fs);line-height:var(--lh);color:var(--txt2)}

/* ═══════════ شريط التحديد ═══════════ */
.selbar{position:absolute;z-index:350;display:none;align-items:center;gap:4px;padding:6px;border-radius:16px;background:var(--txt);color:var(--bg);box-shadow:0 12px 36px rgba(0,0,0,.25);direction:rtl}
.selbar.on{display:flex}
.selbar .sw{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.25)}
.selbar .sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--gold)}
.selbar .sep{width:1px;height:24px;background:rgba(128,128,128,.4);margin:0 4px}
.selbar .ac{height:34px;padding:0 10px;border-radius:10px;display:flex;align-items:center;gap:5px;font-size:15px;color:inherit}
.selbar .ac:hover{background:rgba(128,128,128,.25)}
.selbar .ac svg{width:18px;height:18px}
.sw-yellow{background:#E8B53A}.sw-green{background:#4FAE78}.sw-red{background:#D86E62}.sw-blue{background:#5C8EE0}

/* ═══════════ النوافذ ═══════════ */
.modal{position:fixed;inset:0;z-index:500;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(10,12,10,.45)}
.modal.on{display:flex}
.mbox{width:100%;max-width:560px;background:var(--bg);border-radius:26px;box-shadow:var(--shadow);max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.mh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh h3{font-size:21px;font-weight:800;color:var(--ink)}
.mb{padding:16px 18px;overflow-y:auto}
.mb blockquote{font-size:17px;color:var(--txt2);border-inline-start:4px solid var(--gold);padding-inline-start:12px;margin-bottom:12px;line-height:1.8;max-height:140px;overflow:auto}
.mb textarea{width:100%;min-height:140px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-family:var(--f-body);font-size:18px;line-height:1.9;padding:12px 14px;outline:none;resize:vertical}
.mf{display:flex;gap:8px;justify-content:flex-start;padding:12px 18px 16px}
.btn{padding:10px 22px;border-radius:12px;font-size:17px;font-weight:700;background:var(--ink);color:var(--bg)}
[data-theme=dark] .btn{color:#0F1512}
.btn.sec{background:var(--bg2);color:var(--txt2)}
.srch{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.srch input::-webkit-search-cancel-button{display:none}
.srch input{flex:1;border:0;background:none;outline:none;font-family:var(--f-body);font-size:20px;color:var(--txt)}
.sres{padding:8px 10px 18px;overflow-y:auto;flex:1}
.sr-i{display:block;width:100%;text-align:right;padding:12px;border-radius:14px;transition:background .15s}
.sr-i:hover{background:var(--bg2)}
.sr-i small{display:block;font-size:13px;color:var(--gold);font-weight:800}
.sr-i p{font-size:16px;line-height:1.8;color:var(--txt2)}
.sr-i mark{background:var(--hl-y);color:inherit;border-radius:3px}
.sr-cnt{font-size:14px;color:var(--muted);padding:6px 12px}
.share-prev{width:100%;border-radius:16px;display:block;box-shadow:var(--shadow)}

.toast{position:fixed;bottom:88px;left:50%;z-index:600;transform:translate(-50%,30px);opacity:0;background:var(--txt);color:var(--bg);padding:10px 20px;border-radius:12px;font-size:16px;transition:all .3s;pointer-events:none;white-space:nowrap}
.toast.on{transform:translate(-50%,0);opacity:1}

.wall{min-height:100svh;display:grid;place-items:center;text-align:center;padding:30px}
.wall .rings{--rs:110px;margin:0 auto 26px}
.wall h2{font-family:var(--f-head);font-weight:900;font-size:44px;color:var(--ink);line-height:1.2}
.wall p{color:var(--txt2);font-size:19px;margin:10px 0 26px}

@media(max-width:640px){
  :root{--fs:19px}
  .page{padding:84px 20px 130px}
  .stats{grid-template-columns:repeat(3,1fr);gap:8px}
  .stat{padding:14px 8px}.stat b{font-size:24px}.stat span{font-size:13px}
  .chs{padding-inline-start:0}
  .chrow{padding:14px 14px;gap:12px}.chrow .n{font-size:28px;min-width:34px}.chrow .t b{font-size:19px}
  .chrow .st .lbl{display:none}
  .part-h{flex-wrap:wrap;gap:4px 12px}.part-h em{width:100%;margin:0}
  .navb span{display:none}
  .b-v,.b-hd,.b-r,.b-pz{padding-inline:1.1em;border-radius:18px}
  .tbar-c span{display:none}
}

/* ═══════════ لغة المرايا ═══════════ */
:root{--d-idhn:#2B6B5C;--d-mub:#B0533A;--d-ikh:#4A5E8C;--d-idhn-bg:rgba(43,107,92,.08);--d-mub-bg:rgba(176,83,58,.08);--d-ikh-bg:rgba(74,94,140,.08)}
[data-theme=sepia]{--d-idhn:#2F6A55;--d-mub:#A24B2F;--d-ikh:#465884}
[data-theme=dark]{--d-idhn:#7CC6AF;--d-mub:#E59478;--d-ikh:#9FB2E0;--d-idhn-bg:rgba(124,198,175,.09);--d-mub-bg:rgba(229,148,120,.09);--d-ikh-bg:rgba(159,178,224,.09)}
.dr-idhn{--dc:var(--d-idhn);--dbg:var(--d-idhn-bg)}.dr-mub{--dc:var(--d-mub);--dbg:var(--d-mub-bg)}.dr-ikh{--dc:var(--d-ikh);--dbg:var(--d-ikh-bg)}
.qv{font-family:var(--f-quran);color:var(--ink);font-size:1.08em}

/* افتتاحيّة المرآة */
.mirror-art{width:120px;height:150px;margin:6px auto 4px;position:relative;border-radius:60px 60px 56px 56px;border:2px solid var(--gold);background:linear-gradient(135deg,var(--gold-bg),transparent 55%);box-shadow:inset 0 0 0 7px var(--bg),inset 0 0 0 8px var(--line2)}
.mirror-art i{position:absolute;top:22px;inset-inline-end:28px;width:12px;height:52px;border-radius:8px;background:linear-gradient(180deg,rgba(255,255,255,.7),transparent);transform:rotate(22deg);opacity:.55}
[data-theme=dark] .mirror-art i{opacity:.18}
.omap{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:26px auto 0;max-width:640px}
.omap button{display:inline-flex;align-items:center;gap:7px;padding:7px 14px 7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:15px;color:var(--txt2);transition:all .2s}
.omap button b{font-size:12px;font-weight:800;color:var(--gold)}
.omap button.dr-idhn,.omap button.dr-mub,.omap button.dr-ikh{border-color:var(--dc);color:var(--dc)}
.omap button.dr-idhn b,.omap button.dr-mub b,.omap button.dr-ikh b{color:var(--dc)}
.omap button:hover{transform:translateY(-1px);box-shadow:var(--shadow)}

/* شريط الخريطة تحت الشريط العلويّ */
.rail{display:flex;gap:4px;max-width:1000px;margin:0 auto;padding:0 12px 8px}
.rail[hidden]{display:none}
.rs{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;align-items:stretch;padding:0}
.rl{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;transition:color .2s}
.rb{display:block;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.rb i{display:block;height:100%;width:0;background:var(--dc,var(--gold));border-radius:4px;margin-inline-start:0;transition:width .2s}
.rs.on .rl{color:var(--dc,var(--gold));font-weight:800}
.rs.past .rb i{width:100%!important;opacity:.55}
.has-rail .page{padding-top:118px}
@media(max-width:640px){.rl{display:none}.rail{gap:3px;padding-bottom:6px}.has-rail .page{padding-top:98px}}

/* فاتحة جزء */
.b-part{text-align:center;margin:3.6em 0 1.6em;padding-top:1.2em}
.b-part .po{display:flex;justify-content:center;gap:10px;margin-bottom:.8em}
.b-part .po i{width:7px;height:7px;transform:rotate(45deg);background:var(--gold);border-radius:1px}
.b-part .po i:nth-child(2){background:var(--ink2);width:9px;height:9px}
.b-part h2{font-family:var(--f-head);font-weight:900;font-size:1.95em;line-height:1.35;color:var(--ink)}

/* الباب */
.b-door{position:relative;margin:4.5em -8px 2.4em;padding:2.2em 1.4em 1.8em;text-align:center;border-radius:34px;background:radial-gradient(90% 100% at 50% 0%,var(--dbg),transparent 70%);border:1px solid var(--dc)}
.door-frame{position:relative;width:92px;height:120px;margin:-3.8em auto 1em;border:2.5px solid var(--dc);border-bottom:0;border-radius:46px 46px 0 0;background:var(--bg);display:grid;place-items:center}
.door-frame .dleaf{position:absolute;inset:8px 8px 0;border-radius:40px 40px 0 0;background:var(--dbg)}
.door-frame .dg{position:relative;width:40px;height:40px;stroke:var(--dc);stroke-width:1.6;fill:none}
.b-door .dn{display:block;font-size:.72em;font-weight:800;color:var(--dc);letter-spacing:.5px}
.b-door h2{font-family:var(--f-head);font-weight:900;font-size:2.35em;line-height:1.25;color:var(--dc);margin:.1em 0 .15em}
.b-door .dm{font-size:.7em;color:var(--muted);font-weight:700}

/* الأسلوب */
.b-style{margin:3.2em 0 1.2em;padding:1.1em 1.3em 1em;border-radius:22px;background:var(--dbg);border-inline-start:6px solid var(--dc)}
.b-style .sl{display:flex;align-items:center;gap:8px;font-size:.68em;font-weight:800;color:var(--dc)}
.b-style .sl svg{width:18px;height:18px}
.sdots{display:inline-flex;gap:4px;margin-inline-start:auto}
.sdots i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--dc)}
.sdots i.on{background:var(--dc)}
.b-style h3{font-family:var(--f-head);font-weight:900;font-size:1.55em;line-height:1.4;color:var(--txt);margin-top:.15em}

/* الأداة والحال */
.b-tool{display:flex;gap:16px;align-items:center;margin:2.6em 0 1em}
.b-tool .tn{flex-shrink:0;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:var(--ink);color:var(--bg);font-family:var(--f-head);font-weight:900;font-size:1.5em}
[data-theme=dark] .b-tool .tn{color:#0F1512}
.b-tool h3,.b-state h3{font-family:var(--f-head);font-weight:800;font-size:1.35em;line-height:1.45;color:var(--ink)}
.pre{color:var(--gold);font-weight:800}
.b-state{margin:3em 0 1.1em}
.scale{display:flex;gap:6px;margin-bottom:.55em}
.scale i{font-style:normal;flex:1;max-width:64px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--muted);background:var(--bg2)}
.scale i.past{color:var(--gold);background:var(--gold-bg)}
.scale i.on{color:var(--bg);background:var(--gold)}
[data-theme=dark] .scale i.on{color:#0F1512}

/* فقرات مزخرفة */
.b-x{position:relative;margin-bottom:1.05em}
.b-x>.bt{text-align:var(--ta);text-justify:inter-word}
.b-x.dr-idhn,.b-x.dr-mub,.b-x.dr-ikh{padding-inline-start:1em;border-inline-start:3px solid var(--dc)}
.dchip,.sign,.who,.kl,.cl{display:inline-flex;align-items:center;gap:6px;font-size:.66em;font-weight:800;line-height:1.5;margin-bottom:.35em}
.dchip{color:var(--dc)}.dchip svg,.who svg,.kl svg{width:17px;height:17px}
.sign{color:var(--dc)}
.sign b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--dc);color:var(--bg);font-size:12px}
[data-theme=dark] .sign b{color:#0F1512}
.who{padding:3px 12px 3px 10px;border-radius:999px;background:var(--gold-bg);color:var(--gold)}
.has-who.dr-idhn .who,.has-who.dr-mub .who,.has-who.dr-ikh .who{background:var(--dbg);color:var(--dc)}
.has-who>.bt{display:block}
.k-first{margin:1.5em 0;padding:1em 1.3em;border-radius:22px 22px 22px 6px;background:var(--card);border:1px solid var(--line)}
.k-first .kl{color:var(--muted)}
.k-carry{margin:1.6em 0 2.2em;padding:1.1em 1.3em 1em;border-radius:22px;background:linear-gradient(135deg,var(--ink-bg),var(--gold-bg));border:1px solid var(--line2)}
.k-carry .kl{color:var(--ink2)}
.carry-btn{display:inline-flex;align-items:center;gap:6px;margin-top:.5em;padding:6px 14px;border-radius:999px;border:1px solid var(--ink2);color:var(--ink2);font-size:.7em;font-weight:800;transition:all .2s}
.carry-btn svg{width:15px;height:15px}
.carry-btn.on{background:var(--ink2);color:var(--bg)}
[data-theme=dark] .carry-btn.on{color:#0F1512}
.k-bridge{text-align:center;margin:2.2em auto 1em;max-width:560px;color:var(--txt2)}
.k-bridge>.bt{text-align:center;font-weight:700}
.bridge-arrow{display:block;width:2px;height:36px;margin:.6em auto 0;background:linear-gradient(var(--gold),transparent)}
.k-term{padding:.7em 1.1em;border-radius:14px;background:var(--gold-bg);border:1px dashed var(--line2)}
.k-term>.bt{font-weight:700;color:var(--ink)}
.k-askq{display:flex;gap:14px;align-items:flex-start;margin:1.4em 0 .9em}
.k-askq .qn{flex-shrink:0;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--gold);color:var(--gold);font-weight:900;font-size:.9em;margin-top:.1em}
.k-askq>.bt{font-weight:700;flex:1;min-width:0}

/* المجموعات */
.grp{margin:1.5em 0}
.gin{display:block}
.gs-quad .gin,.gs-trio .gin,.gs-pair .gin,.gs-pictures .gin,.gs-answers .gin{display:grid;gap:10px}
.gs-quad .gin{grid-template-columns:repeat(2,1fr)}
.gs-trio .gin,.gs-pictures .gin,.gs-answers .gin{grid-template-columns:repeat(3,1fr)}
.gs-pair .gin{grid-template-columns:repeat(2,1fr)}
.gs-quad .b,.gs-trio .b,.gs-pair .b,.gs-pictures .b,.gs-answers .b{margin:0;padding:.85em 1em .9em;border-radius:18px;background:var(--card);border:1px solid var(--line);font-size:.92em}
.gs-quad .bt,.gs-trio .bt,.gs-pair .bt,.gs-pictures .bt,.gs-answers .bt{text-align:right!important}
.cl{display:flex;color:var(--gold);font-size:.72em}
.gs-quad .b:last-child:nth-child(4) .cl{color:var(--ink2)}
.gs-trio .b.dr-idhn,.gs-trio .b.dr-mub,.gs-trio .b.dr-ikh{border-color:var(--dc);border-inline-start-width:1px;padding-inline-start:1em}
.gs-trio .b.dr-idhn .cl,.gs-trio .b.dr-mub .cl,.gs-trio .b.dr-ikh .cl{color:var(--dc)}
.pic{width:44px;height:36px;display:block;margin-bottom:4px;stroke:var(--gold);fill:none;stroke-width:1.6}
.pic .fr{stroke:var(--line2);stroke-dasharray:3 3}
.pic .ghost{stroke-dasharray:2 3;opacity:.55}
.gs-pictures .cl,.gs-answers .cl{flex-direction:column;align-items:flex-start;gap:4px}
.gs-answers .cl svg{width:26px;height:26px;stroke:var(--gold)}
.gs-story>.gin{padding:1.1em 1.3em .4em;border-radius:22px;background:var(--card);border:1px solid var(--line);position:relative}
.gs-story>.gin::before{content:'';position:absolute;top:18px;bottom:18px;inset-inline-start:0;width:3px;border-radius:3px;background:var(--gold2);opacity:.6}
.gs-story .b-e{margin:1em 0}
.gs-ex>.gin{padding-inline-start:1.1em;border-inline-start:2px dotted var(--line2)}
.gs-ex .b{position:relative}
.gs-ex .b::before{content:'';position:absolute;inset-inline-start:-1.45em;top:.95em;width:8px;height:8px;border-radius:50%;background:var(--bg);border:2px solid var(--gold2)}
.gs-said .gin{display:grid;gap:10px;max-width:560px;margin:0 auto}

.gs-side{position:relative;margin:2.4em 0;padding:1.6em 1.6em .6em;border-radius:40px 40px 36px 36px;border:2px solid var(--gold);background:linear-gradient(135deg,var(--gold-bg),transparent 60%);box-shadow:inset 0 0 0 6px var(--bg),inset 0 0 0 7px var(--line2);overflow:hidden}

/* المشهد */
.b-beat{text-align:center;margin:2.2em 0}
.b-beat .bt{font-family:var(--f-head);font-weight:900;font-size:1.6em;color:var(--ink);line-height:1.5}
.waves{position:relative;display:block;width:120px;height:90px;margin:0 auto .2em}

.waves i{position:absolute;inset:0;margin:auto;width:44px;height:44px;border-radius:50%;border:2px solid var(--gold);opacity:0}
.beat-bell.in .waves i{animation:wave 2.4s ease-out 3}
.beat-bell.in .waves i:nth-child(2){animation-delay:.35s}.beat-bell.in .waves i:nth-child(3){animation-delay:.7s}
.beat-bell.in .bell{animation:shake .5s ease-in-out 5}
@keyframes wave{0%{transform:scale(.8);opacity:.8}100%{transform:scale(2.6);opacity:0}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(12deg)}75%{transform:rotate(-12deg)}}
.arc{width:64px;height:64px;display:block;margin:0 auto .3em;fill:none;stroke-width:3;transform:rotate(-90deg)}

.b-cast{margin:2em 0;padding:1.2em 1em 1.1em;border-radius:24px;background:var(--card);border:1px solid var(--line)}

.cm{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;opacity:0;transform:translateY(8px);transition:all .6s ease var(--d)}

.b-dmap{margin:2em 0}

.dcol{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:22px;background:var(--dbg);border:1px solid var(--dc)}

.dcol .ds i{font-style:normal;flex-shrink:0;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--dc);color:var(--bg);font-size:11px;font-weight:800;margin-top:2px}
[data-theme=dark] .dcol .ds i{color:#0F1512}
.b-flames{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:460px;margin:1.6em auto}
.fcell{text-align:center}.fcell svg{width:70px;height:88px}
.fcell b{display:block;font-size:.66em;font-weight:800;color:var(--txt2)}
.fcell .pot{fill:none;stroke:var(--txt2);stroke-width:1.6;stroke-linejoin:round}
.fcell .fl{fill:var(--mub-fl,#D98B3A)}
.fcell.high .fl{fill:#D2543A}.fcell.low .fl{fill:var(--muted)}
.b-flames.in .fcell.mid .fl,.b-flames.in .fcell.high .fl{animation:flick 1.6s ease-in-out infinite;transform-origin:20px 44px}
.b-flames.in .fcell.high .fl{animation-duration:.9s}
@keyframes flick{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.12)}}
.b-prompt{margin:1.6em auto;max-width:560px;text-align:center;padding:1em 1.2em;border-radius:20px;border:2px solid var(--gold)}

/* البطاقة */

.cf-margin{display:flex;align-items:center;justify-content:center;gap:10px;padding:.4em;border-radius:12px;background:var(--gold-bg);margin-bottom:.8em;font-size:.72em;color:var(--txt2)}

.cf-hint{font-size:.62em;color:var(--gold);margin-top:.4em}

/* الفهرس الداخليّ بالمستويات */

.tl-sec.lv2{padding-inline-start:30px;font-size:16px}

.tl-sec.lv1.dr-idhn,.tl-sec.lv1.dr-mub,.tl-sec.lv1.dr-ikh{color:var(--dc)}
.nb-card{padding:14px 16px;border-radius:16px;border:2px solid var(--line2);background:var(--card);margin-bottom:10px}

}

/* ═══════════ المقدّمة والبطاقة ═══════════ */
.tchip{display:inline-block;font-size:.72em;font-weight:800;padding:0 10px;border-radius:999px;background:var(--gold-bg);color:var(--gold);border:1px solid var(--line2);line-height:1.8;vertical-align:.1em}
.b-e.big{margin:1.4em 0 2em}

.k-qual{margin:0}

.gs-quality{margin:1.1em 0;padding:1.1em 1.3em .3em;border-radius:22px;background:var(--card);border:1px solid var(--line);position:relative;overflow:hidden}

.k-desc{margin:0 0 .45em;margin-inline-start:calc((var(--dp) - 1) * 4%);padding:.55em 1em .6em;border-radius:16px;background:var(--bg);border:1px solid var(--line);box-shadow:0 calc(var(--dp) * 1px) calc(var(--dp) * 3px) rgba(0,0,0,.05)}
.k-desc>.bt{font-size:.95em}
.mh{display:inline-flex;align-items:center;gap:8px;font-size:.64em;font-weight:800;color:var(--gold);margin-bottom:.15em}
button.mh{text-decoration:underline;text-underline-offset:4px}

.gs-cols .gin{display:grid;gap:10px}
.gs-cols .b{margin:0}
.gs-cols .b:not(:first-child){padding:.8em 1.1em;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.cnl{color:var(--ink2)}
.gs-side2{padding:1.1em 1.3em .3em;border-radius:22px;background:var(--gold-bg);border:1px dashed var(--line2)}
.b-fig{margin:1.8em auto;max-width:440px;text-align:center}
.fsvg{width:100%;height:auto;overflow:visible}
.fsvg .fr2{fill:var(--card);stroke:var(--line2);stroke-width:1.5}

.fig-map.in .pin{animation:drop .9s cubic-bezier(.3,1.6,.5,1) both}
@keyframes drop{0%{transform:translateY(-40px);opacity:0}100%{transform:none;opacity:1}}
.fsvg .ftx{font-family:var(--f-head);font-weight:800;font-size:15px;fill:var(--txt2);text-anchor:middle}

@keyframes gust{to{stroke-dashoffset:-40}}

.fsvg .tree{transform-origin:215px 140px}

@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(-5deg)}}
.fsvg .mf{fill:var(--card);stroke:var(--line2);stroke-width:2}
.fsvg .m-fl .mf{stroke:var(--gold);stroke-width:2.5}

.stg{display:flex;align-items:stretch;gap:8px;justify-content:center}
.stg-i{flex:1;max-width:130px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 8px;border-radius:18px;background:var(--card);border:1px solid var(--line);position:relative}

.stg-n{position:absolute;top:-10px;inset-inline-start:10px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:11px;font-weight:800;display:grid;place-items:center}
[data-theme=dark] .stg-n{color:#0F1512}
.stg-a{align-self:center;width:18px;height:2px;background:var(--gold2);position:relative}

.fsvg .core{fill:var(--gold)}.fsvg .halo{fill:none;stroke:var(--gold);stroke-width:1.5;opacity:.3}
.fig-heptad.in .halo{animation:breathe 4s ease-in-out infinite;transform-origin:130px 112px}
.fsvg .ray{stroke:var(--line2);stroke-width:1.5;stroke-dasharray:3 4}

/* البطاقة الكاملة */
.b-cardfull{margin:2.2em -10px;padding:1.2em 1em 1em;border-radius:26px;background:var(--card);border:2px solid var(--line2);box-shadow:var(--shadow)}

/* تثبيت السطر */
.cf-foot{display:flex;align-items:center;gap:12px;margin-top:1em}

@media(max-width:640px){

function load(c){
  if(content[c.id])return Promise.resolve(content[c.id]);
  if(loading[c.id])return loading[c.id];
  loading[c.id]=new Promise(function(res,rej){
    window.WQ_CONTENT=window.WQ_CONTENT||{};
    var s=document.createElement('script');
    s.src=book.contentPath+c.file+'?v='+c.v+'.'+(book.version||1);
    s.onload=function(){var d=window.WQ_CONTENT[c.id];if(!d){delete loading[c.id];return rej()}content[c.id]=prep(d);res(content[c.id])};
    s.onerror=function(){delete loading[c.id];rej()};
    document.head.appendChild(s);
  });
  return loading[c.id];
}
function prep(d){
  var words=0,secs=[];
  (d.sections||[]).forEach(function(s,i){
    var t=(s.content||'');words+=t.split(/\s+/).filter(Boolean).length;
    if(s.type==='section_header')secs.push({i:i,t:t,lv:s.lv===1?1:2,rail:s.rail});
    else if(s.type==='door_open')secs.push({i:i,t:t,lv:1,door:s.door,rail:s.rail});
    else if(s.type==='style_open')secs.push({i:i,t:t,lv:2,door:s.door,style:1});
    else if(s.type==='tool_open'||s.type==='state_open')secs.push({i:i,t:t,lv:2});
  });
  d._words=words;d._min=words/WPM;d._secs=secs;d._rail=secs.filter(function(x){return x.rail});return d;
}
function prefetchAll(){flat.reduce(function(p,c){return p.then(function(){return load(c).catch(function(){})})},Promise.resolve()).then(function(){if($('#home').style.display==='block')refreshHomeTimes()})}

function refreshHomeTimes(){

function openChapter(i,opt){
  opt=opt||{};
  if(i<0||i>=flat.length)return;
  var c=flat[i];
  closeAll();stopAS();hideSel();
  if(cur>=0)flushPos();
  cur=i;
  $('#home').style.display='none';$('#reader').style.display='block';
  document.body.classList.remove('bars-hidden');
  if(opt.push!==false)go(location.pathname+'?ch='+c.id,true);else go(location.pathname+'?ch='+c.id+location.hash,false);
  updateBars();
  $('#page').innerHTML='<div class="wall" style="min-height:60vh"><div><div class="rings" style="--rs:80px"><i></i><i></i><i></i><i></i></div></div></div>';
  load(c).then(function(d){
    if(cur!==i)return;
    render(c,d);
    var target=opt.block;
    if(target==null&&opt.resume!==false){var p=prog.chapters[c.id];if(p&&!p.done&&p.b>2)target=p.b}
    requestAnimationFrame(function(){
      if(target!=null){jumpBlock(target,opt.block!=null)}else window.scrollTo(0,0);
    });
    loadChapterData(c);
    saveProg(true);
    if(i+1<flat.length)idle(function(){load(flat[i+1]).catch(function(){})});
  }).catch(function(){
    $('#page').innerHTML=wall('تعذّر فتح الفصل','تأكّد من اتصالك بالإنترنت ثمّ أعد المحاولة.','<button class="cta" data-open="'+i+'"><span class="ct">إعادة المحاولة</span></button>');
  });
}

  if(d._rail.length)h+='<nav class="omap" aria-label="خريطة '+esc(c.label)+'">'+d._rail.map(function(r,k){return'<button data-jump="'+r.i+'"'+(r.door?' class="dr-'+r.door+'"':'')+'><b>'+ar(k+1)+'</b>'+esc(r.rail)+'</button>'}).join('')+'</nav>';

function block(s,i){

function cardData(){
  var ms=mirrorChapters(),ids=Object.keys(ms);
  return Promise.all(ids.map(function(n){
    var c=ms[n];
    if(flat[cur]&&flat[cur].id===c.id)return Promise.resolve([n,card]);
    if(nbCache[c.id]&&nbCache[c.id].card)return Promise.resolve([n,nbCache[c.id].card]);
    if(!uid)return Promise.resolve([n,{}]);
    return db.collection(C_NOTES).doc(docId(c.id)).get().then(function(d){var cd=d.exists?(d.data().card||{}):{};nbCache[c.id]=Object.assign(nbCache[c.id]||{},{card:cd});return[n,cd]}).catch(function(){return[n,{}]});
  })).then(function(arr){var o={};arr.forEach(function(x){o[x[0]]=x[1]});return o});
}

function btOf(i){var b=document.getElementById('b'+i);return b&&$('.bt',b)}
function textNodes(el){var out=[],w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);var n;while((n=w.nextNode()))out.push(n);return out}

  unpaint();

    if(h.b!=null){bt=btOf(h.b);if(bt&&bt.textContent.slice(s,e)!==h.text){var k=bt.textContent.indexOf(h.text);s=k;e=k+h.text.length;if(k<0)bt=null}}

      var all=$$('#art .bt');for(var j=0;j<all.length;j++){var k2=all[j].textContent.indexOf(h.text);if(k2>=0){bt=all[j];s=k2;e=k2+h.text.length;break}}
    }
    if(bt)wrap(bt,s,e,h,noteByHl[h.id]);
  });

function wrap(bt,s,e,h,hasNote){
  var pos=0;textNodes(bt).forEach(function(n){
    var len=n.length,a=Math.max(s,pos),b=Math.min(e,pos+len);
    if(a<b){
      var mid=n;if(a>pos)mid=n.splitText(a-pos);
      if(b<pos+len)mid.splitText(b-a);
      var m=document.createElement('mark');m.className='hl hl-'+h.color+(hasNote?' has-note':'');m.dataset.hl=h.id;
      mid.parentNode.insertBefore(m,mid);m.appendChild(mid);
    }
    pos+=len;
  });
}

function readSel(){
  var s=window.getSelection();if(!s||s.rangeCount===0||s.isCollapsed)return null;
  var r=s.getRangeAt(0);
  var sb=(r.startContainer.nodeType===3?r.startContainer.parentElement:r.startContainer).closest('.bt');
  if(!sb||!$('#art').contains(sb))return null;
  var eb=(r.endContainer.nodeType===3?r.endContainer.parentElement:r.endContainer).closest('.bt');
  var bi=+sb.closest('[data-b]').dataset.b;
  var st=offsetIn(sb,r.startContainer,r.startOffset);
  var en=eb===sb?offsetIn(sb,r.endContainer,r.endOffset):sb.textContent.length; /* لو امتدّ التحديد لفقرة أخرى نقف عند آخر الأولى */
  var raw=sb.textContent.slice(st,en);
  var lt=raw.length-raw.replace(/^\s+/,'').length,rt=raw.length-raw.replace(/\s+$/,'').length;
  st+=lt;en-=rt;var text=sb.textContent.slice(st,en);

  return{b:bi,s:st,e:en,text:text,rect:r.getBoundingClientRect(),multi:eb!==sb};
}

  (navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(function(){toast('نُسخ الاقتباس')}).catch(function(){toast('تعذّر النسخ')});

var shareBlob=null;
function shareQuote(t){
  hideSel();window.getSelection().removeAllRanges();
  var dark=prefs.theme==='dark';
  var W=1080,H=1350,cv=document.createElement('canvas');cv.width=W;cv.height=H;var x=cv.getContext('2d');
  var bg=dark?'#101412':'#F6F0E6',ink=dark?'#8FCBAE':'#163A2C',gold=dark?'#D6AE6E':'#A87A2E',txt=dark?'#E6DDCF':'#2A221C',mut=dark?'#7B7263':'#9C8C7B';
  var fam="'Zain','ZainLocal',serif";
  Promise.all([document.fonts.load('700 60px Zain'),document.fonts.load('900 60px Zain'),document.fonts.load('700 60px ZainLocal')]).catch(function(){}).then(function(){
    x.fillStyle=bg;x.fillRect(0,0,W,H);
    var g=x.createRadialGradient(W/2,H*0.42,10,W/2,H*0.42,W*0.7);g.addColorStop(0,dark?'rgba(214,174,110,.10)':'rgba(168,122,46,.10)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
    x.strokeStyle=gold;[420,310,200].forEach(function(r,k){x.globalAlpha=[.10,.16,.24][k];x.lineWidth=3;x.beginPath();x.arc(W/2,H*0.42,r,0,Math.PI*2);x.stroke()});x.globalAlpha=1;
    x.direction='rtl';x.textAlign='center';
    x.fillStyle=gold;x.font='700 150px '+fam;x.fillText('«',W/2,300);
    var size=t.length>260?46:t.length>160?54:t.length>90?62:72,lh=size*1.75;
    x.font='700 '+size+'px '+fam;x.fillStyle=txt;
    var words=t.split(/\s+/),lines=[],line='';
    words.forEach(function(w){var test=line?line+' '+w:w;if(x.measureText(test).width>W-200&&line){lines.push(line);line=w}else line=test});if(line)lines.push(line);
    var maxL=Math.floor(640/lh);if(lines.length>maxL){lines=lines.slice(0,maxL);lines[maxL-1]+=' …'}
    var y0=H*0.44-(lines.length*lh)/2+size*0.6;
    lines.forEach(function(l,k){x.fillText(l,W/2,y0+k*lh)});
    x.fillStyle=gold;x.fillRect(W/2-40,H-300,80,4);
    x.fillStyle=ink;x.font='900 64px '+fam;x.fillText(book.title,W/2,H-200);
    x.fillStyle=mut;x.font='400 36px '+fam;x.fillText(flat[cur].title+' · '+(book.author||''),W/2,H-140);
    cv.toBlob(function(b){shareBlob=b;$('#shareImg').src=URL.createObjectURL(b);openModal('mShare')},'image/png');
  });
}

  Promise.all(flat.map(function(c){return load(c).catch(function(){})}));
}
$('#sIn').addEventListener('input',debounce(function(){
  var q=$('#sIn').value.trim();var res=$('#sRes');
  if(q.length<2){res.innerHTML='<div class="sr-cnt">اكتب كلمةً أو جزءًا من جملة.</div>';return}
  Promise.all(flat.map(function(c){return load(c).catch(function(){})})).then(function(){
    var nq=norm(q),out=[],count=0;
    flat.forEach(function(c){var d=content[c.id];if(!d)return;
      d.sections.forEach(function(s,i){if(!s.content)return;var t=plain(s.content),n=norm(t),k=n.indexOf(nq);if(k<0)return;count++;
        if(out.length>=80)return;
        /* خريطة من النصّ المُطبَّع إلى الأصليّ */
        var map=[],j=0;for(var z=0;z<t.length;z++){if(!/[ً-ْٰـ]/.test(t[z]))map.push(z)}
        var a=map[k]||0,b=(map[k+nq.length-1]||a)+1;
        var st=Math.max(0,a-60),en=Math.min(t.length,b+80);
        out.push('<button class="sr-i" data-goto="'+c.fi+'" data-gb="'+i+'"><small>'+esc(c.label+' · '+c.title)+'</small><p>'+(st>0?'… ':'')+esc(t.slice(st,a))+'<mark>'+esc(t.slice(a,b))+'</mark>'+esc(t.slice(b,en))+(en<t.length?' …':'')+'</p></button>');
      });
    });
    res.innerHTML='<div class="sr-cnt">'+(count?ar(count)+' نتيجة':'لا نتائج')+'</div>'+out.join('');
  });
},220));

/* ─── التمرير التلقائيّ ─── */
var asOn=false,asRaf=0,asAcc=0;
function toggleAS(){asOn?stopAS():startAS()}
function startAS(){asOn=true;$('#asBtn').classList.add('on');$('#asBtn').innerHTML='<svg class="i"><use href="#i-pause"/></svg>';document.body.classList.add('bars-hidden');var last=performance.now();
  (function step(t){if(!asOn)return;var dt=t-last;last=t;asAcc+=[0,14,22,32,45,62,85][prefs.as]*dt/1000;var px=Math.floor(asAcc);if(px){window.scrollBy(0,px);asAcc-=px}
    if(window.scrollY+window.innerHeight>=document.documentElement.scrollHeight-2){stopAS();return}asRaf=requestAnimationFrame(step)})(last);}
function stopAS(){if(!asOn)return;asOn=false;cancelAnimationFrame(asRaf);var b=$('#asBtn');b.classList.remove('on');b.innerHTML='<svg class="i"><use href="#i-play"/></svg>';document.body.classList.remove('bars-hidden')}
['wheel','touchstart','keydown'].forEach(function(ev){window.addEventListener(ev,function(e){if(asOn&&!(tc(e,'.bbar')))stopAS()},{passive:true})});

/* ══════════════════════════════════════════════
   ١١. توزيع النقرات
   ══════════════════════════════════════════════ */
document.addEventListener('click',function(e){
  var t=tc(e,'[data-act],[data-open],[data-jump],[data-goto],[data-tab],[data-nbdel],[data-nbnote]');if(!t)return;
  if(t.dataset.open!=null){var fi=+t.dataset.open;var fresh=t.dataset.fresh;closeModal();openChapter(fi,{resume:!fresh});return}
  if(t.dataset.jump!=null){closeAll();jumpBlock(+t.dataset.jump,false);return}
  if(t.dataset.goto!=null){var gi=+t.dataset.goto,gb=t.dataset.gb===''?null:+t.dataset.gb;closeAll();closeModal();
    if(gi===cur){if(gb!=null)jumpBlock(gb,true)}else openChapter(gi,{block:gb});return}
  if(t.dataset.tab){var tb=t.dataset.tab;if(tb.indexOf('toc')===0){tocTab=tb;renderToc()}else{nbTab=tb;renderNb()}return}
  if(t.dataset.nbdel){var k=t.dataset.nbdel,id=+k.slice(1);if(k[0]==='h')removeHL(id);else{notes=notes.filter(function(n){return n.id!==id});saveNotes();paintHL()}renderNb();return}
  if(t.dataset.nbnote!=null){var hid=+t.dataset.nbnote,nid=+t.dataset.nbn;var h=hid?hls.find(function(x){return x.id===hid}):null;var n=nid?notes.find(function(x){return x.id===nid}):null;closeAll();openNote(h,n);return}
  switch(t.dataset.act){
    case'home':closeAll();flushPos();showHome();break;
    case'toc':if(cur<0)return;tocTab='toc-ch';renderToc();openDrawer('dToc');break;
    case'notebook':nbTab=cur>=0?'nb-ch':'nb-all';renderNb();openDrawer('dNb');break;
    case'notebookHome':nbTab='nb-all';renderNb();openDrawer('dNb');break;
    case'settings':renderSet();openDrawer('dSet');break;
    case'search':openSearch();break;
    case'theme':prefs.theme=prefs.theme==='dark'?'light':'dark';applyPrefs();break;
    case'autoscroll':toggleAS();break;
    case'prev':if(cur>0)openChapter(cur-1,{});break;
    case'next':if(cur<flat.length-1)openChapter(cur+1,{});break;
    case'close':closeAll();break;
    case'mclose':closeModal();break;
    case'scrollToc':$('#tocAnchor').scrollIntoView({behavior:'smooth'});break;
    case'freeNote':closeAll();openNote(null,null);break;
    case'exportNb':exportNb();break;
    case'resetPrefs':prefs=Object.assign({},PREF_DEF);applyPrefs();renderSet();break;
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closeAll();closeModal();hideSel();return}
  if(tc(e,'input,textarea'))return;
  if(cur<0)return;
  if(e.key==='ArrowLeft'&&!e.altKey&&!e.metaKey){if(cur<flat.length-1)openChapter(cur+1,{})}
  else if(e.key==='ArrowRight'&&!e.altKey&&!e.metaKey){if(cur>0)openChapter(cur-1,{})}
  else if(e.key==='/'){e.preventDefault();openSearch()}
});
window.addEventListener('resize',function(){if(!prefs.fs)applyPrefs()});

})();
</script>
