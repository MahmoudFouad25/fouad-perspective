<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ولادة قلب — منظور الفؤاد</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Scheherazade+New:wght@400;700&family=Tajawal:wght@300;400;500;700&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Zain';src:url('https://mahmoudfouad25.github.io/fouad-perspective/external-exercise/Adam-journey/fonts/Zain-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'Zain';src:url('https://mahmoudfouad25.github.io/fouad-perspective/external-exercise/Adam-journey/fonts/Zain-Bold.ttf') format('truetype');font-weight:700;font-display:swap}

:root{
  --bg:#F8F3EC;--bg2:#F0EAE0;--card:#FFFDF8;--txt:#2C2420;--txt2:#6B5D52;--muted:#A89888;
  --grn:#1B4332;--grn2:#2D6A4F;--grn-bg:rgba(27,67,50,0.04);
  --gld:#C8963E;--gld2:#D4A574;--gld-bg:rgba(200,150,62,0.06);
  --bdr:rgba(44,36,32,0.08);--bdr-gld:rgba(200,150,62,0.2);
  --bar-bg:rgba(248,243,236,0.94);--bar-bdr:rgba(44,36,32,0.06);
  --fd:'Amiri',serif;--fb:'Noto Naskh Arabic',serif;--fq:'Scheherazade New',serif;
  --fs:17px;--lh:2.1;--cw:720px;--tr:0.3s ease
}
[data-theme=dark]{
  --bg:#12100E;--bg2:#1C1916;--card:#252119;--txt:#E8DDD0;--txt2:#B5A48C;--muted:#7A6E60;
  --grn:#7BC4A5;--grn2:#5DCAA5;--gld:#D4A574;--gld2:#C8963E;
  --gld-bg:rgba(200,150,62,0.08);--grn-bg:rgba(45,106,79,0.08);
  --bdr:rgba(232,221,208,0.06);--bdr-gld:rgba(200,150,62,0.12);
  --bar-bg:rgba(18,16,14,0.95);--bar-bdr:rgba(232,221,208,0.06)
}
[data-theme=sepia]{
  --bg:#F4EDE0;--bg2:#EDE4D4;--card:#FBF6ED;--txt:#3D2E1E;--txt2:#6B5740;--muted:#9A8568;
  --grn:#2D5A3F;--grn2:#3D7A5A;--gld:#B8862E;--gld2:#C8963E;
  --gld-bg:rgba(184,134,46,0.07);--grn-bg:rgba(45,90,63,0.05);
  --bdr:rgba(61,46,30,0.08);--bdr-gld:rgba(184,134,46,0.15);
  --bar-bg:rgba(244,237,224,0.95);--bar-bdr:rgba(61,46,30,0.06)
}

*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:var(--fb);font-size:var(--fs);line-height:var(--lh);transition:background var(--tr),color var(--tr);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.no-scroll{overflow:hidden!important;height:100vh}
::selection{background:rgba(200,150,62,0.25)}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--gld);border-radius:10px}

/* SPLASH */
.splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#1a1714 0%,#0f0d0a 100%);transition:opacity .8s ease-out,visibility .8s;overflow:hidden}
.splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 40%,rgba(200,150,62,0.08) 0%,transparent 50%),radial-gradient(circle at 70% 60%,rgba(27,67,50,0.06) 0%,transparent 50%);animation:splash-glow 5s ease-in-out infinite}
@keyframes splash-glow{0%,100%{opacity:.5}50%{opacity:.8}}
.splash-logo{position:relative;width:160px;height:160px;margin-bottom:32px}
.splash-rings{position:absolute;inset:0}
.splash-ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:50%;border:1.5px solid rgba(200,150,62,0.5);opacity:0;animation:splash-ring-expand 4s ease-out infinite}
.splash-ring:nth-child(1){animation-delay:0s}.splash-ring:nth-child(2){animation-delay:1.3s}.splash-ring:nth-child(3){animation-delay:2.6s}
@keyframes splash-ring-expand{0%{width:20px;height:20px;opacity:0;border-color:rgba(200,150,62,.7)}15%{opacity:.7}60%{border-color:rgba(45,106,79,.4)}100%{width:200px;height:200px;opacity:0;border-color:rgba(45,106,79,.1)}}
.splash-waw{position:relative;z-index:2;width:100px;height:100px;margin:30px auto;display:flex;align-items:center;justify-content:center}
.splash-waw span{font-family:'Amiri',serif;font-size:56px;font-weight:700;background:linear-gradient(135deg,#C8963E 0%,#E8C87A 40%,#C8963E 60%,#A67A30 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 20px rgba(200,150,62,.3));animation:splash-waw-breathe 3s ease-in-out infinite}
@keyframes splash-waw-breathe{0%,100%{transform:scale(1);filter:drop-shadow(0 0 20px rgba(200,150,62,.3))}50%{transform:scale(1.06);filter:drop-shadow(0 0 30px rgba(200,150,62,.5))}}
.splash-core{position:absolute;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(200,150,62,.1) 0%,transparent 70%);animation:splash-waw-breathe 3s ease-in-out infinite}
.splash-text{text-align:center;position:relative;z-index:2}
.splash-title{font-family:'Amiri',serif;font-size:28px;font-weight:700;color:#C8963E;margin-bottom:8px;text-shadow:0 0 20px rgba(200,150,62,.3);opacity:0;animation:splash-text-in 1.2s ease-out .5s forwards}
.splash-sub{font-family:'Noto Naskh Arabic',serif;font-size:14px;color:rgba(232,221,208,.5);letter-spacing:1px;opacity:0;animation:splash-text-in 1.2s ease-out .9s forwards}
@keyframes splash-text-in{to{opacity:1}}
.splash-dots{display:flex;gap:6px;margin-top:36px;position:relative;z-index:2}
.splash-dot{width:5px;height:5px;border-radius:50%;background:rgba(200,150,62,.4);animation:splash-dot-pulse 1.2s ease-in-out infinite}
.splash-dot:nth-child(2){animation-delay:.2s}.splash-dot:nth-child(3){animation-delay:.4s}
@keyframes splash-dot-pulse{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(1.4)}}

.pbar{position:fixed;top:0;left:0;right:0;height:3px;z-index:300;background:var(--bdr)}.pfill{height:100%;width:0%;background:linear-gradient(90deg,var(--grn),var(--gld));border-radius:0 2px 2px 0;transition:width .12s}

/* TOP BAR */
.tbar{position:fixed;top:0;left:0;right:0;z-index:200;background:var(--bar-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:.5px solid var(--bar-bdr);transform:translateY(0);transition:transform .3s,opacity .3s}
.tbar.hid{transform:translateY(-100%);opacity:0}
.tbar-in{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 20px}
.tbar-r{display:flex;align-items:center;gap:8px}
.tlogo{width:32px;height:32px;border-radius:8px;background:var(--grn-bg);border:.5px solid var(--bdr);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;position:relative}
.tlogo:hover{background:var(--grn);border-color:var(--grn)}.tlogo:hover svg{stroke:#F8F3EC}
.tlogo svg{width:16px;height:16px;stroke:var(--grn);stroke-width:2;fill:none}
.tbar-c{flex:1;text-align:center;padding:0 12px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tbar-c b{color:var(--gld);font-weight:600}
.tbar-l{display:flex;align-items:center;gap:6px}
.bb{width:34px;height:34px;border-radius:8px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--txt2);font-size:15px;transition:all .2s}.bb:hover{background:var(--bg2);color:var(--txt)}.bb.on{background:var(--grn-bg);color:var(--grn)}
.bb svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none}
.back-btn{text-decoration:none;display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:8px;font-family:var(--fb);font-size:11px;color:var(--txt2);transition:all .2s;border:.5px solid var(--bdr);background:var(--bg2)}.back-btn:hover{background:var(--grn-bg);color:var(--grn);border-color:rgba(45,106,79,.15)}
.back-btn svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;flex-shrink:0}

/* BOTTOM BAR */
.bbar{position:fixed;bottom:0;left:0;right:0;z-index:200;background:var(--bar-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:.5px solid var(--bar-bdr);transform:translateY(0);transition:transform .3s,opacity .3s}
.bbar.hid{transform:translateY(100%);opacity:0}
.bbar-in{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:8px 16px}
.nb{display:flex;align-items:center;gap:4px;padding:8px 12px;border-radius:10px;border:none;background:transparent;cursor:pointer;font-family:var(--fb);font-size:11px;color:var(--txt2);transition:all .2s;max-width:35%}.nb:hover{background:var(--grn-bg);color:var(--grn)}.nb svg{width:14px;height:14px;flex-shrink:0}
.bbar-c{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}.bbar-dot{width:3px;height:3px;border-radius:50%;background:var(--gld)}
.bbar-a{display:flex;align-items:center;gap:2px}

.ov{position:fixed;inset:0;z-index:249;background:rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .3s}.ov.on{opacity:1;pointer-events:all}

/* SIDEBAR */
.side{position:fixed;top:0;right:0;bottom:0;z-index:260;width:320px;max-width:86vw;background:var(--bg);border-left:.5px solid var(--bdr);transform:translateX(100%);transition:transform var(--tr);overflow-y:auto;box-shadow:-4px 0 24px rgba(0,0,0,.06)}.side.on{transform:translateX(0)}
.side-hd{padding:20px;display:flex;align-items:center;justify-content:space-between;border-bottom:.5px solid var(--bdr)}.side-t{font-family:var(--fd);font-size:18px;font-weight:700;color:var(--grn)}
.xb{width:30px;height:30px;border:none;background:none;cursor:pointer;color:var(--txt2);border-radius:8px;font-size:16px;display:flex;align-items:center;justify-content:center}.xb:hover{background:var(--bg2)}
.side-bd{padding:14px}
.sb-st{padding:10px 12px;margin:10px 0 4px;display:flex;align-items:center;gap:8px}
.sb-st-dot{width:8px;height:8px;border-radius:50%;background:var(--gld);flex-shrink:0}
.sb-st-t{font-family:var(--fd);font-size:15px;font-weight:700;color:var(--gld)}
.sb-ch{padding:9px 14px;margin:2px 0;border-radius:8px;cursor:pointer;font-size:13px;color:var(--txt2);display:flex;align-items:center;gap:8px;transition:all .15s}.sb-ch:hover{background:var(--bg2);color:var(--txt)}.sb-ch.act{background:var(--grn-bg);color:var(--grn);font-weight:600}.sb-cd{width:6px;height:6px;border-radius:50%;background:var(--muted);flex-shrink:0}.sb-ch.act .sb-cd{background:var(--grn)}.sb-ch.done .sb-cd{background:var(--gld)}

/* SETTINGS */
.sett{position:fixed;top:0;left:0;bottom:0;z-index:260;width:320px;max-width:88vw;background:var(--bg);border-right:.5px solid var(--bdr);transform:translateX(-100%);transition:transform var(--tr);overflow-y:auto;box-shadow:4px 0 24px rgba(0,0,0,.06)}.sett.on{transform:translateX(0)}
.sett-hd{padding:18px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:.5px solid var(--bdr)}.sett-t{font-size:15px;font-weight:600}
.sett-bd{padding:18px 20px}.sg{margin-bottom:24px}.sg-l{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:10px;letter-spacing:.3px}
.sg-g{display:grid;gap:8px}.sg-g.g3{grid-template-columns:1fr 1fr 1fr}.sg-g.g4{grid-template-columns:1fr 1fr 1fr 1fr}.sg-g.g5{grid-template-columns:1fr 1fr 1fr 1fr 1fr}
.sg-b{padding:10px 8px;background:var(--bg2);border:1.5px solid transparent;border-radius:8px;color:var(--txt2);font-family:var(--fb);font-size:12px;cursor:pointer;transition:all .2s;text-align:center}.sg-b:hover{border-color:var(--gld)}.sg-b.on{background:var(--grn);border-color:var(--grn);color:#F8F3EC;font-weight:600}
.thr{display:flex;gap:10px}.thb{width:46px;height:46px;border-radius:12px;border:2px solid transparent;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;font-size:20px}.thb:hover{transform:scale(1.08)}.thb.on{border-color:var(--gld);box-shadow:0 0 0 3px var(--gld-bg)}.thl{background:#F8F3EC;border-color:#ddd}.thd{background:#12100E;border-color:#333}.ths{background:#F4EDE0;border-color:#ccc}
.sslider{width:100%;height:6px;border-radius:3px;background:var(--bg2);-webkit-appearance:none;appearance:none;cursor:pointer;margin-top:8px}.sslider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--grn);cursor:pointer}

.mc{max-width:var(--cw);margin:0 auto;padding:66px 24px 90px;min-height:100vh;transition:max-width .3s}

/* COVER */
.cover{display:flex;flex-direction:column;align-items:center;text-align:center;padding:20px 24px 40px;position:relative}
.cover::before{content:'';position:absolute;top:-66px;left:0;right:0;height:320px;background:radial-gradient(ellipse at center top,rgba(200,150,62,0.06) 0%,transparent 70%);pointer-events:none}
.clogo{font-family:var(--fd);font-size:50px;font-weight:700;color:var(--gld);width:100px;height:100px;border-radius:50%;background:var(--gld-bg);display:flex;align-items:center;justify-content:center;border:1.5px solid var(--bdr-gld);margin-bottom:20px;position:relative;z-index:1;box-shadow:0 4px 24px rgba(200,150,62,.08)}
.cover .cser{font-size:.85em;color:var(--muted);margin-bottom:6px;letter-spacing:.5px}
.cover h1{font-family:var(--fd);font-size:2.8em;font-weight:700;color:var(--grn);line-height:1.4;margin-bottom:6px;position:relative;z-index:1}
.cover .csub{font-size:1.15em;color:var(--gld);margin-bottom:3px;font-weight:500}.cover .cauth{font-size:.92em;color:var(--muted);margin-bottom:24px}
.cstart{display:inline-flex;align-items:center;gap:8px;padding:14px 40px;background:var(--grn);color:#F8F3EC;border:none;border-radius:12px;font-family:var(--fb);font-size:1em;font-weight:600;cursor:pointer;transition:all .3s;box-shadow:0 4px 18px rgba(27,67,50,.18);position:relative;z-index:1;margin-bottom:10px}.cstart:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(27,67,50,.25)}
.scroll-hint{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:24px;color:var(--muted);font-size:11px;animation:hint-bob 2s ease-in-out infinite}
.scroll-hint svg{width:18px;height:18px;stroke:var(--gld);opacity:.5;stroke-width:2;fill:none}
@keyframes hint-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}

/* JOURNEY MAP (stations) */
.journey{max-width:660px;width:100%;margin:0 auto;padding:0 8px 60px}
.journey-hd{display:flex;align-items:center;gap:14px;margin-bottom:30px}
.journey-hd .jl{flex:1;height:1px;background:var(--bdr)}
.journey-hd h2{font-family:var(--fd);font-size:1.4em;color:var(--grn);white-space:nowrap}

.station{position:relative;margin-bottom:14px}
.st-head{display:flex;align-items:flex-start;gap:14px;padding:4px 4px 14px}
.st-mark{display:flex;flex-direction:column;align-items:center;flex-shrink:0;padding-top:2px}
.st-orb{width:34px;height:34px;border-radius:50%;background:var(--gld-bg);border:1.5px solid var(--bdr-gld);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:15px;font-weight:700;color:var(--gld);position:relative;z-index:2}
.st-line{width:1.5px;flex:1;background:linear-gradient(to bottom,var(--bdr-gld),transparent);margin-top:4px;min-height:20px}
.st-info{flex:1;padding-top:3px}
.st-title{font-family:var(--fd);font-size:1.35em;font-weight:700;color:var(--grn);margin-bottom:4px}
.st-gate{font-size:.86em;color:var(--txt2);line-height:1.8}

.st-chapters{padding-right:48px;padding-bottom:8px}
.ji{display:flex;align-items:center;gap:12px;padding:13px 16px;margin-bottom:7px;border-radius:13px;border:.5px solid var(--bdr);cursor:pointer;transition:all .25s;background:var(--card)}
.ji:hover{background:var(--grn-bg);border-color:rgba(45,106,79,0.12);transform:translateX(-4px);box-shadow:0 2px 12px rgba(0,0,0,.04)}
.ji.lk{opacity:.4;cursor:default;background:transparent}.ji.lk:hover{background:transparent;border-color:var(--bdr);transform:none;box-shadow:none}
.ji-n{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:13px;font-weight:700;flex-shrink:0}
.ji-n.pub{background:var(--grn);color:#F8F3EC}.ji-n.dft{background:var(--gld-bg);color:var(--gld);border:1px solid var(--bdr-gld)}
.ji-n.done{background:var(--gld);color:#fff}
.ji-info{flex:1}.ji-tt{font-size:14px;font-weight:600}
.ji-badge{font-size:10px;padding:3px 9px;border-radius:10px;font-weight:600;flex-shrink:0}.ji-badge.cur{background:var(--grn-bg);color:var(--grn2)}.ji-badge.soon{background:var(--gld-bg);color:var(--gld)}.ji-badge.done{background:var(--gld-bg);color:var(--gld)}

/* CHAPTER HEADER */
.chd{text-align:center;margin-bottom:32px;padding-top:10px}
.chlbl{display:inline-flex;align-items:center;gap:14px;margin-bottom:10px}
.chlbl-l{width:40px;height:.5px;background:var(--gld);opacity:.5}
.chlbl-t{font-size:12px;color:var(--gld);letter-spacing:1.5px;font-weight:600}
.chtit{font-family:var(--fd);font-size:1.8em;font-weight:700;color:var(--grn);line-height:1.5;margin-bottom:6px}
.chorn{color:var(--gld);font-size:16px;opacity:.3;letter-spacing:6px}

/* CONTENT BLOCKS */
.bk-prose{margin-bottom:1em;text-align:justify;transition:color var(--tr)}
.bk-prose strong{color:var(--grn);font-weight:600}
.bk-prose em{color:var(--gld);font-style:normal;font-weight:500}
.bk-sec{display:flex;align-items:center;gap:14px;margin:2em 0 .8em;opacity:.7}
.bk-sec .sl{flex:1;height:1px;background:var(--bdr)}
.bk-sec span{font-family:'Cairo',sans-serif;font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--gld);white-space:nowrap}
.bk-verse{margin:1.5em 0;padding:22px 26px;position:relative;background:var(--gld-bg);border-radius:14px;border-right:3px solid var(--gld);text-align:center;overflow:hidden;transition:background var(--tr),border-color var(--tr)}
.bk-verse::after{content:'\FD3F\FD3E';position:absolute;top:6px;left:12px;font-family:var(--fq);font-size:40px;color:var(--gld);opacity:.07}
.bk-verse p{font-family:var(--fq);font-size:1.15em;line-height:2.3;color:var(--grn);position:relative}
.bk-verse small{font-size:.72em;color:var(--muted);display:block;margin-top:8px;font-family:var(--fb);position:relative}
.bk-hadith{margin:1.5em 0;padding:20px 24px;background:var(--grn-bg);border-radius:14px;border-right:3px solid var(--grn2);text-align:center;transition:background var(--tr),border-color var(--tr)}
.bk-hadith p{font-size:.98em;line-height:2.1;font-style:italic}
.bk-hadith small{font-size:.72em;color:var(--muted);display:block;margin-top:8px}
.bk-refl{margin:1.5em 0;padding:22px 24px;padding-top:32px;background:var(--grn-bg);border-radius:14px;border:.5px solid rgba(45,106,79,0.1);position:relative;transition:background var(--tr),border-color var(--tr)}
.bk-refl::before{content:'\061F';position:absolute;top:-12px;right:20px;width:26px;height:26px;background:var(--grn2);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#F8F3EC;font-size:13px;line-height:26px;text-align:center;transition:background var(--tr)}
.bk-refl p{font-size:.92em;line-height:2.1;color:var(--txt2);white-space:pre-line}
.bk-pause{margin:1.5em 0;padding:18px 22px;text-align:center;background:var(--gld-bg);border-radius:14px;border:.5px solid rgba(200,150,62,0.15);transition:background var(--tr),border-color var(--tr)}
.bk-pause p{font-size:.9em;line-height:2;color:var(--gld);font-weight:500;white-space:pre-line}
.bk-div{text-align:center;margin:1.5em 0;display:flex;align-items:center;justify-content:center;gap:10px}
.bk-div i{width:28px;height:1px;background:var(--muted);opacity:.2;display:inline-block}

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyDj0bV5gsyRbqpxzW0Zd9wjYmq53-Xdj3w",authDomain:"fouad-perspective.firebaseapp.com",projectId:"fouad-perspective",storageBucket:"fouad-perspective.firebasestorage.app",messagingSenderId:"1068763865336",appId:"1:1068763865336:web:b791abcd22d536aedd5b0d"});
var db=firebase.firestore(),auth=firebase.auth();

/* ═══ معرّف الكتاب — يُستعمل في مفاتيح الفايرستور وlocalStorage عشان كل كتاب منفصل ═══ */
var BOOK_KEY='wq-b1';

var toAr=function(n){return String(n).replace(/[0-9]/g,function(d){return'\u0660\u0661\u0662\u0663\u0664\u0665\u0666\u0667\u0668\u0669'[d]})};
var arW=function(n){return['','\u0627\u0644\u0623\u0648\u0651\u0644','\u0627\u0644\u062B\u0627\u0646\u064A','\u0627\u0644\u062B\u0627\u0644\u062B','\u0627\u0644\u0631\u0627\u0628\u0639','\u0627\u0644\u062E\u0627\u0645\u0633','\u0627\u0644\u0633\u0627\u062F\u0633','\u0627\u0644\u0633\u0627\u0628\u0639','\u0627\u0644\u062B\u0627\u0645\u0646','\u0627\u0644\u062A\u0627\u0633\u0639','\u0627\u0644\u0639\u0627\u0634\u0631','\u0627\u0644\u062D\u0627\u062F\u064A \u0639\u0634\u0631','\u0627\u0644\u062B\u0627\u0646\u064A \u0639\u0634\u0631','\u0627\u0644\u062B\u0627\u0644\u062B \u0639\u0634\u0631','\u0627\u0644\u0631\u0627\u0628\u0639 \u0639\u0634\u0631','\u0627\u0644\u062E\u0627\u0645\u0633 \u0639\u0634\u0631','\u0627\u0644\u0633\u0627\u062F\u0633 \u0639\u0634\u0631','\u0627\u0644\u0633\u0627\u0628\u0639 \u0639\u0634\u0631','\u0627\u0644\u062B\u0627\u0645\u0646 \u0639\u0634\u0631'][n]||toAr(n)};

var uid=null,book=null;
/* قائمة مسطّحة للفصول المنشورة فقط — مصدر التنقّل */
var flatChapters=[];   /* [{id,number,title,file,v,stationId,stationTitle}] */
var curIdx=0;          /* مكان العميل في القائمة المسطّحة */
var loadedContent={};  /* كاش للفصول المحمّلة */
var _pendingScroll=0;

/* ═══ SPLASH ═══ */
function hideSplash(){var sp=document.getElementById('splash');sp.classList.add('hide');document.body.classList.remove('no-scroll');setTimeout(function(){sp.style.display='none'},900)}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(function(){t.classList.remove('on')},2200)}

/* ═══ MANIFEST READY ═══ */
var _manifestLoaded=false,_authChecked=false,_authUid=null;
window.__manifestReady=function(){
  if(!window.WQ_BOOK){window.__manifestFail();return}
  book=window.WQ_BOOK;
  buildFlat();
  _manifestLoaded=true;
  tryStart();
};
window.__manifestFail=function(){
  hideSplash();
  document.getElementById('mc').innerHTML='<div class="authwall"><div class="clogo">\u0648</div><h2>\u062A\u0639\u0630\u0651\u0631 \u062A\u062D\u0645\u064A\u0644 \u0627\u0644\u0643\u062A\u0627\u0628</h2><p>\u062D\u062F\u062B \u062E\u0637\u0623 \u0641\u064A \u062A\u062D\u0645\u064A\u0644 \u0645\u062D\u062A\u0648\u0649 \u0627\u0644\u0643\u062A\u0627\u0628. \u062D\u0627\u0648\u0644 \u062A\u062D\u062F\u064A\u062B \u0627\u0644\u0635\u0641\u062D\u0629.</p></div>';
};

/* نبني القائمة المسطّحة للفصول المنشورة عبر المحطّات */
function buildFlat(){
  flatChapters=[];
  (book.stations||[]).forEach(function(st){
    (st.chapters||[]).forEach(function(ch){
      if(ch.status==='published'){
        flatChapters.push({id:ch.id,number:ch.number,title:ch.title,file:ch.file,v:ch.v||1,stationId:st.id,stationTitle:st.title});
      }
    });
  });
}

/* ═══ AUTH ═══ */
auth.onAuthStateChanged(function(u){
  _authUid=u?u.uid:null;
  if(!_authUid){try{var enc=localStorage.getItem('_enc_user');if(enc){_authUid=JSON.parse(decodeURIComponent(atob(enc.split('').reverse().join('')))).id}}catch(e){}}
  if(!_authUid)_authUid=localStorage.getItem('userId');
  _authChecked=true;
  tryStart();
});

/* لا نبدأ إلا بعد جاهزية الفهرس والتحقّق من الدخول معاً */
function tryStart(){
  if(!_manifestLoaded||!_authChecked)return;
  uid=_authUid;
  if(!uid){hideSplash();showAuth();return}
  restorePrefs();
  decideEntry();
}
function showAuth(){
  document.getElementById('tbar').style.display='none';document.getElementById('bbar').style.display='none';
  document.getElementById('mc').innerHTML='<div class="authwall"><div class="clogo">\u0648</div><h2>'+(book?book.title:'\u0648\u0644\u0627\u062F\u0629 \u0642\u0644\u0628')+'</h2><p>\u064A\u062C\u0628 \u062A\u0633\u062C\u064A\u0644 \u0627\u0644\u062F\u062E\u0648\u0644 \u0644\u0644\u0648\u0635\u0648\u0644 \u0625\u0644\u0649 \u0627\u0644\u0643\u062A\u0627\u0628</p><a href="../login.html">\u062A\u0633\u062C\u064A\u0644 \u0627\u0644\u062F\u062E\u0648\u0644 \u2190</a></div>';
}

/* ═══ تحديد نقطة الدخول (رابط مباشر / تقدّم محفوظ / الغلاف) ═══ */
function decideEntry(){
  var p=new URLSearchParams(location.search),cid=p.get('ch');
  if(cid){var i=flatChapters.findIndex(function(c){return c.id===cid});if(i>=0){curIdx=i;restoreBMThenOpen();return}}
  /* نقرأ تقدّم العميل — بالمعرّف لا بالرقم */
  db.collection('wiladatqalb_progress').doc(uid+'_'+BOOK_KEY).get().then(function(pr){
    if(pr.exists){var d=pr.data(),i=flatChapters.findIndex(function(c){return c.id===d.chapterId});if(i>=0){curIdx=i;restoreBMThenOpen();return}}
    hideSplash();showCover();
  }).catch(function(){hideSplash();showCover()});
}
function restoreBMThenOpen(){
  var bm=localStorage.getItem(BOOK_KEY+'-bm');
  if(bm){try{var d=JSON.parse(bm);if(d.chapterId===flatChapters[curIdx].id&&d.y>100)_pendingScroll=d.y}catch(e){}}
  hideSplash();openReaderUI();loadAndRender();
}

/* ═══ COVER + JOURNEY MAP ═══ */
function showCover(){
  document.getElementById('tbar').style.display='none';document.getElementById('bbar').style.display='none';
  var anyPublished=flatChapters.length>0;
  var h='<div class="cover"><div class="clogo">\u0648</div>';
  h+='<p class="cser">'+(book.seriesTitle||'')+'</p>';
  h+='<h1>'+book.title+'</h1><p class="csub">'+(book.subtitle||'')+'</p><p class="cauth">'+(book.author||'')+'</p>';
  if(anyPublished)h+='<button class="cstart" onclick="startRead()">\u0627\u0628\u062F\u0623 \u0627\u0644\u0631\u062D\u0644\u0629 \u2190</button>';
  h+='<div class="scroll-hint"><span>\u062E\u0631\u064A\u0637\u0629 \u0627\u0644\u0631\u062D\u0644\u0629</span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div></div>';

  h+='<div class="journey"><div class="journey-hd"><div class="jl"></div><h2>\u0631\u062D\u0644\u0629 \u0627\u0644\u0643\u062A\u0627\u0628</h2><div class="jl"></div></div>';
  (book.stations||[]).forEach(function(st,si){
    var isLast=si===book.stations.length-1;
    h+='<div class="station"><div class="st-head"><div class="st-mark"><div class="st-orb">'+toAr(si+1)+'</div>'+(isLast?'':'<div class="st-line"></div>')+'</div><div class="st-info"><div class="st-title">'+st.title+'</div><div class="st-gate">'+(st.gate||'')+'</div></div></div>';
    h+='<div class="st-chapters">';
    (st.chapters||[]).forEach(function(ch){
      var pub=ch.status==='published';
      var flatI=flatChapters.findIndex(function(c){return c.id===ch.id});
      h+='<div class="ji '+(pub?'':'lk')+'" '+(pub?'onclick="openByIdx('+flatI+')"':'')+'><div class="ji-n '+(pub?'pub':'dft')+'">'+toAr(ch.number)+'</div><div class="ji-info"><div class="ji-tt">'+ch.title+'</div></div><span class="ji-badge '+(pub?'cur':'soon')+'">'+(pub?'\u0645\u062A\u0627\u062D':'\u0642\u0631\u064A\u0628\u064B\u0627')+'</span></div>';
    });
    h+='</div></div>';
  });
  h+='</div>';
  document.getElementById('mc').innerHTML=h;
}
function goHome(){flatChapters.length;curIdx=0;showCoverFromReader()}
function showCoverFromReader(){document.getElementById('tbar').style.display='';showCover();history.replaceState(null,'',location.pathname)}
function startRead(){if(flatChapters.length){openByIdx(0)}}
function openByIdx(i){if(i<0||i>=flatChapters.length)return;curIdx=i;_pendingScroll=0;openReaderUI();loadAndRender();history.replaceState(null,'',location.pathname+'?ch='+flatChapters[i].id)}

/* ═══ READER UI ═══ */
function openReaderUI(){document.getElementById('tbar').style.display='';document.getElementById('bbar').style.display='';buildSide()}

/* ═══ تحميل ملف الفصل (كسول + كاش + كسر تخزين بالنسخة) ثم العرض ═══ */
function loadAndRender(){
  var ch=flatChapters[curIdx];if(!ch)return;
  if(loadedContent[ch.id]){renderCh();afterRender();return}
  /* لودر خفيف داخل المحتوى */
  document.getElementById('mc').innerHTML='<div class="loading"><div class="llogo">و</div><p>\u062C\u0627\u0631\u064A \u0641\u062A\u062D \u0627\u0644\u0641\u0635\u0644...</p></div>';
  window.WQ_CONTENT=window.WQ_CONTENT||{};
  var s=document.createElement('script');
  s.src=book.contentPath+ch.file+'?v='+ch.v;  /* رقم النسخة يكسر التخزين عند التعديل */
  s.onload=function(){
    var data=window.WQ_CONTENT[ch.id];
    if(!data){document.getElementById('mc').innerHTML='<div class="authwall"><div class="clogo">و</div><h2>\u062A\u0639\u0630\u0651\u0631 \u062A\u062D\u0645\u064A\u0644 \u0627\u0644\u0641\u0635\u0644</h2><p>\u062D\u0627\u0648\u0644 \u062A\u062D\u062F\u064A\u062B \u0627\u0644\u0635\u0641\u062D\u0629.</p></div>';return}
    loadedContent[ch.id]=data;
    renderCh();afterRender();
  };
  s.onerror=function(){document.getElementById('mc').innerHTML='<div class="authwall"><div class="clogo">و</div><h2>\u062A\u0639\u0630\u0651\u0631 \u062A\u062D\u0645\u064A\u0644 \u0627\u0644\u0641\u0635\u0644</h2><p>\u062A\u0623\u0643\u0651\u062F \u0645\u0646 \u0627\u062A\u0635\u0627\u0644\u0643 \u0648\u062D\u0627\u0648\u0644 \u062A\u062D\u062F\u064A\u062B \u0627\u0644\u0635\u0641\u062D\u0629.</p></div>'};
  document.head.appendChild(s);
}
function afterRender(){loadHL();loadNotes()}

/* ═══ RENDER CHAPTER ═══ */
function renderCh(){
  var ch=flatChapters[curIdx];
  var data=loadedContent[ch.id];if(!data)return;
  updateNav();saveProg();
  var h='<div class="chd"><div class="chlbl"><div class="chlbl-l"></div><span class="chlbl-t">'+ch.stationTitle+' \u00B7 \u0627\u0644\u0641\u0635\u0644 '+arW(data.number||ch.number)+'</span><div class="chlbl-l"></div></div><h1 class="chtit">'+data.title+'</h1><div class="chorn">\u2766 \u2766 \u2766</div></div>';
  if(data.sections)data.sections.forEach(function(s){h+=renderBlock(s)});
  h+='<div class="cnav">';
  if(curIdx<flatChapters.length-1){var nx=flatChapters[curIdx+1];h+='<button class="cn-b" onclick="goNext()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg><span>'+nx.title+'</span></button>'}else h+='<div></div>';
  h+='<span class="cn-c">'+toAr(curIdx+1)+' \u0645\u0646 '+toAr(flatChapters.length)+'</span>';
  if(curIdx>0){var pv=flatChapters[curIdx-1];h+='<button class="cn-b" onclick="goPrev()"><span>'+pv.title+'</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>'}else h+='<div></div>';
  h+='</div>';
  document.getElementById('mc').innerHTML=h;
  if(_pendingScroll>0){setTimeout(function(){window.scrollTo({top:_pendingScroll});_pendingScroll=0},100)}else{window.scrollTo({top:0})}
  setTimeout(function(){applyHL()},150);
}

function renderBlock(s){
  switch(s.type){
    case 'prose': return '<div class="bk-prose">'+rich(s.content)+'</div>';
    case 'verse': return '<div class="bk-verse"><p>\uFD3F'+esc(s.content)+'\uFD3E</p><small>'+(s.reference||'')+'</small></div>';
    case 'hadith': return '<div class="bk-hadith"><p>\u00AB'+esc(s.content)+'\u00BB</p><small>'+(s.reference||'')+'</small></div>';
    case 'reflection': return '<div class="bk-refl"><p>'+rich(s.content)+'</p></div>';
    case 'pause': return '<div class="bk-pause"><p>'+rich(s.content)+'</p></div>';
    case 'divider': return '<div class="bk-div"><i></i><b></b><i></i></div>';
    case 'emphasis': return '<div class="bk-emph"><p>'+rich(s.content)+'</p></div>';
    case 'section_header': return '<div class="bk-sec"><div class="sl"></div><span>'+(s.content||'')+'</span><div class="sl"></div></div>';
    case 'closing_quote': return '<div class="bk-closing"><span class="cl-icon">\u2766</span><blockquote>'+rich(s.content)+'</blockquote>'+(s.reference?'<div class="cl-src">'+s.reference+'</div>':'')+'</div>';
    case 'exercise':
      var eh='<div class="bk-exercise"><span class="exi">'+(s.icon||'\uD83E\uDE9E')+'</span><div class="ext">'+(s.title||'\u062A\u0645\u0631\u064A\u0646')+'</div><div class="exd">'+rich(s.content||s.description||'')+'</div>';
      if(s.url)eh+='<a href="'+s.url+'" target="_blank">\u0627\u0628\u062F\u0623 \u0627\u0644\u062A\u0645\u0631\u064A\u0646 \u2190</a>';
      return eh+'</div>';
    default: return '';
  }
}
function rich(t){if(!t)return'';return esc(t).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>').replace(/\n/g,'<br>')}
function esc(t){if(!t)return'';var d=document.createElement('div');d.textContent=t;return d.innerHTML}

/* ═══ NAV ═══ */
function updateNav(){
  var ch=flatChapters[curIdx];
  document.getElementById('tbarTitle').innerHTML='<b>'+ch.stationTitle+'</b> \u00B7 '+ch.title;
  document.getElementById('chNum').textContent=toAr(curIdx+1);
  document.getElementById('chTotal').textContent='\u0645\u0646 '+toAr(flatChapters.length);
  var nx=curIdx<flatChapters.length-1?flatChapters[curIdx+1]:null;
  var pv=curIdx>0?flatChapters[curIdx-1]:null;
  document.getElementById('navNextT').textContent=nx?nx.title:'';
  document.getElementById('navPrevT').textContent=pv?pv.title:'';
  document.getElementById('navNext').style.visibility=nx?'':'hidden';
  document.getElementById('navPrev').style.visibility=pv?'':'hidden';
  updateSideActive();
}
function goNext(){if(curIdx<flatChapters.length-1){curIdx++;_pendingScroll=0;loadAndRender();closeAll()}}
function goPrev(){if(curIdx>0){curIdx--;_pendingScroll=0;loadAndRender();closeAll()}}

/* ═══ SIDEBAR (محطّات + فصول) ═══ */
function buildSide(){
  if(!book)return;
  var h='';
  (book.stations||[]).forEach(function(st,si){
    var hasPub=(st.chapters||[]).some(function(c){return c.status==='published'});
    if(!hasPub)return;
    h+='<div class="sb-st"><span class="sb-st-dot"></span><span class="sb-st-t">'+st.title+'</span></div>';
    (st.chapters||[]).forEach(function(ch){
      if(ch.status!=='published')return;
      var flatI=flatChapters.findIndex(function(c){return c.id===ch.id});
      var cls=flatI===curIdx?'act':(flatI<curIdx?'done':'');
      h+='<div class="sb-ch '+cls+'" onclick="openByIdx('+flatI+')" data-i="'+flatI+'"><span class="sb-cd"></span>'+ch.title+'</div>';
    });
  });
  document.getElementById('sideBd').innerHTML=h;
}
function updateSideActive(){document.querySelectorAll('.sb-ch').forEach(function(el){var i=parseInt(el.dataset.i);el.classList.toggle('act',i===curIdx);el.classList.toggle('done',i<curIdx)})}
function toggleSide(){var s=document.getElementById('side'),on=s.classList.contains('on');closeAll();if(!on){buildSide();s.classList.add('on');document.getElementById('ov').classList.add('on')}}
function toggleSett(){var s=document.getElementById('sett'),on=s.classList.contains('on');closeAll();if(!on){s.classList.add('on');document.getElementById('ov').classList.add('on')}}
function closeAll(){document.getElementById('side').classList.remove('on');document.getElementById('sett').classList.remove('on');document.getElementById('ov').classList.remove('on');document.getElementById('npanel').style.display='none';hideHLM()}

/* ═══ SETTINGS ═══ */
function act(b){var p=b.closest('.sg-g')||b.closest('.thr');if(p)p.querySelectorAll('.sg-b,.thb').forEach(function(x){x.classList.remove('on')});b.classList.add('on')}
function setFS(b,v){act(b);document.documentElement.style.setProperty('--fs',v+'px');localStorage.setItem('wq-fs',v)}
function setLH(b,v){act(b);document.documentElement.style.setProperty('--lh',v);localStorage.setItem('wq-lh',v)}
function setCW(b,v){act(b);document.documentElement.style.setProperty('--cw',v+'px');localStorage.setItem('wq-cw',v)}
var FF=["'Noto Naskh Arabic',serif","'Amiri',serif","'Cairo',sans-serif","'Tajawal',sans-serif","'Zain','Amiri',serif"];
function setFF(b,i){act(b);document.body.style.fontFamily=FF[i];localStorage.setItem('wq-ff',i)}
function setTh(b,th){act(b);curTh=th;document.documentElement.setAttribute('data-theme',th);document.getElementById('thqBtn').textContent=th==='dark'?'\u2600':'\uD83C\uDF19';localStorage.setItem('wq-th',th)}
var curTh='';
function toggleThQ(){setTh(document.querySelector(curTh==='dark'?'.thl':'.thd'),curTh==='dark'?'':'dark')}
function restorePrefs(){
  var fs=localStorage.getItem('wq-fs');if(fs)document.documentElement.style.setProperty('--fs',fs+'px');
  var lh=localStorage.getItem('wq-lh');if(lh)document.documentElement.style.setProperty('--lh',lh);
  var cw=localStorage.getItem('wq-cw');if(cw)document.documentElement.style.setProperty('--cw',cw+'px');
  var ff=localStorage.getItem('wq-ff');if(ff)document.body.style.fontFamily=FF[parseInt(ff)]||FF[0];
  var th=localStorage.getItem('wq-th');if(th){curTh=th;document.documentElement.setAttribute('data-theme',th);document.getElementById('thqBtn').textContent=th==='dark'?'\u2600':'\uD83C\uDF19'}
}

/* ═══ HIGHLIGHTS — مفتاح فايرستور بمعرّف الفصل (يثبت رغم تغيّر الترتيب) ═══ */
var highlights=[],selTxt='',selRange=null,curHlId=null;
function hlDocId(){return uid+'_'+BOOK_KEY+'_'+flatChapters[curIdx].id}
function loadHL(){if(!uid)return;db.collection('wiladatqalb_highlights').doc(hlDocId()).get().then(function(d){highlights=d.exists?(d.data().items||[]):[];applyHL()}).catch(function(){highlights=[]})}
function saveHLs(){if(!uid)return;db.collection('wiladatqalb_highlights').doc(hlDocId()).set({items:highlights,updatedAt:firebase.firestore.FieldValue.serverTimestamp()}).catch(function(){})}
function applyHL(){
  var mc=document.getElementById('mc');
  mc.querySelectorAll('[data-hlid]').forEach(function(el){var p=el.parentNode;p.replaceChild(document.createTextNode(el.textContent),el);p.normalize()});
  var ctr=mc.querySelectorAll('.bk-prose,.bk-verse,.bk-hadith,.bk-refl,.bk-pause,.bk-emph,.bk-closing');
  highlights.forEach(function(hl){
    ctr.forEach(function(c){
      if(!c.textContent.includes(hl.text))return;
      var w=document.createTreeWalker(c,NodeFilter.SHOW_TEXT);var n;
      while(n=w.nextNode()){var i=n.textContent.indexOf(hl.text);if(i===-1)continue;
        var before=n.textContent.substring(0,i),after=n.textContent.substring(i+hl.text.length);
        var span=document.createElement('span');span.className='hl-'+hl.color;span.setAttribute('data-hlid',hl.id);span.textContent=hl.text;
        var p=n.parentNode;if(before)p.insertBefore(document.createTextNode(before),n);p.insertBefore(span,n);if(after)p.insertBefore(document.createTextNode(after),n);p.removeChild(n);return}})});
}
document.addEventListener('mouseup',handleSel);document.addEventListener('touchend',handleSel);
var READABLE='.bk-prose,.bk-verse,.bk-hadith,.bk-refl,.bk-pause,.bk-emph,.bk-closing';
function nodeInReadable(node){if(!node)return false;var el=node.nodeType===3?node.parentElement:node;return el&&el.closest&&el.closest(READABLE)}
function handleSel(e){if(e.target&&e.target.closest&&e.target.closest('#hlm,#sett,#side,#npanel,.bbar,.tbar'))return;
  setTimeout(function(){
    var sel=window.getSelection();
    if(!sel||sel.rangeCount===0){hideHLM();return}
    var txt=sel.toString().trim();
    if(txt.length<=2){hideHLM();return}
    /* يكفي أن يكون أيّ طرف من التحديد داخل نصّ قابل للقراءة — أمرن من فحص البداية وحدها */
    var ok=nodeInReadable(sel.anchorNode)||nodeInReadable(sel.focusNode);
    if(!ok){hideHLM();return}
    selTxt=txt;
    try{selRange=sel.getRangeAt(0)}catch(er){selRange=null}
    showHLM();
  },60);
}
function showHLM(){
  var m=document.getElementById('hlm');
  var x,y;
  try{
    var r=selRange.getBoundingClientRect();
    if(r&&(r.width||r.height)){
      x=r.left+(r.width/2)-80; y=r.top+window.scrollY-130;
      if(y<window.scrollY+70)y=r.bottom+window.scrollY+10;
    }else{ throw 0 }
  }catch(e){
    /* احتياط: لو تعذّر القياس، أظهر القائمة قرب منتصف الشاشة فلا تختفي أبداً */
    x=(window.innerWidth/2)-80; y=window.scrollY+(window.innerHeight/2)-60;
  }
  if(x+160>window.innerWidth)x=window.innerWidth-170;
  if(x<10)x=10;
  m.style.left=x+'px';m.style.top=y+'px';m.style.display='block';
  var ex=highlights.find(function(h){return h.text===selTxt});
  document.getElementById('hlmDel').style.display=ex?'block':'none';
  if(ex)curHlId=ex.id;
}
function hideHLM(){document.getElementById('hlm').style.display='none'}
function doHL(color){var ei=highlights.findIndex(function(h){return h.text===selTxt});if(ei!==-1)highlights[ei].color=color;else highlights.push({id:Date.now(),text:selTxt,color:color,at:new Date().toISOString()});saveHLs();applyHL();hideHLM();window.getSelection().removeAllRanges()}
function rmHL(){if(curHlId){highlights=highlights.filter(function(h){return h.id!==curHlId});saveHLs();applyHL()}hideHLM();window.getSelection().removeAllRanges()}
document.addEventListener('mousedown',function(e){if(e.target.closest&&e.target.closest('#hlm'))return;
  /* أخفِ القائمة فقط إذا لم يكن هناك تحديد قائم — حتى لا تختفي لحظة بدء تحديد جديد */
  var sel=window.getSelection();if(!sel||sel.toString().trim().length<=2)hideHLM();
});

/* ═══ NOTES — مفتاح بمعرّف الفصل ═══ */
var notes=[];
function notesDocId(){return uid+'_'+BOOK_KEY+'_'+flatChapters[curIdx].id}
function loadNotes(){if(!uid)return;db.collection('wiladatqalb_notes').doc(notesDocId()).get().then(function(d){notes=d.exists?(d.data().items||[]):[];renderNotes()}).catch(function(){notes=[];renderNotes()})}
function saveNotes(){if(!uid)return;db.collection('wiladatqalb_notes').doc(notesDocId()).set({items:notes,updatedAt:firebase.firestore.FieldValue.serverTimestamp()}).catch(function(){})}
function renderNotes(){
  var el=document.getElementById('notesList');var h='';
  if(!notes.length)h='<div style="text-align:center;padding:40px 20px;color:var(--muted)"><div style="font-size:36px;margin-bottom:12px">\uD83D\uDCDD</div><p style="font-size:14px">\u0644\u0627 \u0645\u0644\u0627\u062D\u0638\u0627\u062A \u0641\u064A \u0647\u0630\u0627 \u0627\u0644\u0641\u0635\u0644 \u0628\u0639\u062F</p><p style="font-size:12px;margin-top:6px">\u062D\u062F\u062F \u0646\u0635\u064B\u0627 \u0648\u0627\u062E\u062A\u0631 \u201C\u0625\u0636\u0627\u0641\u0629 \u0645\u0644\u0627\u062D\u0638\u0629\u201D \u0623\u0648 \u0623\u0636\u0641 \u0645\u0644\u0627\u062D\u0638\u0629 \u0639\u0627\u0645\u0629</p></div>';
  else notes.forEach(function(n){h+='<div class="ni" onclick="scrollToNote(\''+encodeURIComponent(n.ref||'')+'\')" title="\u0627\u0636\u063A\u0637 \u0644\u0644\u0627\u0646\u062A\u0642\u0627\u0644"><div class="ni-t">'+escH(n.text)+'</div><div class="ni-r"><span>'+(n.ref&&n.ref!=='\u0645\u0644\u0627\u062D\u0638\u0629 \u0639\u0627\u0645\u0629'?'\uD83D\uDCCD '+escH(n.ref.substring(0,50)):'\uD83D\uDCCC \u0645\u0644\u0627\u062D\u0638\u0629 \u0639\u0627\u0645\u0629')+'</span><button class="ni-del" onclick="event.stopPropagation();delNote('+n.id+')">\u2715</button></div></div>'});
  h+='<button class="np-add" onclick="addFreeNote()">+ \u0625\u0636\u0627\u0641\u0629 \u0645\u0644\u0627\u062D\u0638\u0629 \u0639\u0627\u0645\u0629</button>';el.innerHTML=h;
}
function escH(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function delNote(id){notes=notes.filter(function(n){return n.id!==id});saveNotes();renderNotes()}
function addFreeNote(){var text=prompt('\u0627\u0643\u062A\u0628 \u0645\u0644\u0627\u062D\u0638\u062A\u0643:');if(!text)return;notes.push({id:Date.now(),text:text,ref:'\u0645\u0644\u0627\u062D\u0638\u0629 \u0639\u0627\u0645\u0629',at:new Date().toISOString()});saveNotes();renderNotes()}
function scrollToNote(encodedRef){var ref=decodeURIComponent(encodedRef);if(!ref||ref==='\u0645\u0644\u0627\u062D\u0638\u0629 \u0639\u0627\u0645\u0629')return;var mc=document.getElementById('mc');var w=document.createTreeWalker(mc,NodeFilter.SHOW_TEXT);var node;while(node=w.nextNode()){if(node.textContent.includes(ref.substring(0,40))){var el=node.parentElement;if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.transition='background .4s,box-shadow .4s';el.style.background='rgba(200,150,62,0.2)';el.style.boxShadow='0 0 0 4px rgba(200,150,62,0.15)';setTimeout(function(){el.style.background='';el.style.boxShadow=''},2500)}return}}}
function toggleNotes(){var p=document.getElementById('npanel');if(p.style.display==='flex'){p.style.display='none'}else{p.style.display='flex';renderNotes()}}
function addNoteFromHL(){hideHLM();var text=prompt('\u0627\u0643\u062A\u0628 \u0645\u0644\u0627\u062D\u0638\u062A\u0643:');if(!text)return;notes.push({id:Date.now(),text:text,ref:selTxt?selTxt.substring(0,60):'',at:new Date().toISOString()});saveNotes();renderNotes();window.getSelection().removeAllRanges()}

/* ═══ PROGRESS + BOOKMARK — بالمعرّف لا بالرقم ═══ */
function saveProg(){if(!uid)return;var ch=flatChapters[curIdx];db.collection('wiladatqalb_progress').doc(uid+'_'+BOOK_KEY).set({book:BOOK_KEY,chapterId:ch.id,chapterTitle:ch.title,stationId:ch.stationId,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}).catch(function(){})}
function saveBM(){if(!uid)return;var ch=flatChapters[curIdx];var y=window.scrollY;localStorage.setItem(BOOK_KEY+'-bm',JSON.stringify({chapterId:ch.id,y:y}));db.collection('wiladatqalb_bookmarks').doc(uid+'_'+BOOK_KEY).set({chapterId:ch.id,scrollY:y,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}).then(function(){toast('\u062A\u0645 \u062D\u0641\u0638 \u0627\u0644\u0645\u0648\u0636\u0639 \u2713')}).catch(function(){toast('\u062A\u0645 \u0627\u0644\u062D\u0641\u0638 \u0645\u062D\u0644\u064A\u064B\u0627')})}

/* ═══ AUTO-SCROLL ═══ */
var asOn=false,asInt;
function toggleAS(){asOn=!asOn;var b=document.getElementById('asBtn');b.textContent=asOn?'\u23F8':'\u25B6';b.classList.toggle('on',asOn);if(asOn){var sp=document.getElementById('aSpeed').value;var px=[0.3,0.6,1,1.8,3][sp-1];asInt=setInterval(function(){window.scrollBy(0,px)},16)}else{clearInterval(asInt)}}

/* ═══ SCROLL ═══ */
var lastY=0,bHid=false;
window.addEventListener('scroll',function(){
  var y=window.scrollY,h=document.documentElement.scrollHeight-window.innerHeight;
  if(h>0)document.getElementById('pf').style.width=Math.round(y/h*100)+'%';
  if(y>120&&y>lastY+8&&!bHid){document.getElementById('tbar').classList.add('hid');document.getElementById('bbar').classList.add('hid');bHid=true}
  else if(y<lastY-8&&bHid){document.getElementById('tbar').classList.remove('hid');document.getElementById('bbar').classList.remove('hid');bHid=false}
  lastY=y;
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeAll();if(e.key==='ArrowLeft'&&flatChapters.length)goNext();if(e.key==='ArrowRight'&&flatChapters.length)goPrev()});
</script>
