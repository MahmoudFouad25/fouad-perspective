<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F0E6">
<title>ولادة قلب — منظور الفؤاد</title>
<!--
  كتاب «ولادة قلب» يُقرأ الآن من التطبيق وحده: https://fouad-perspective.web.app
  هذه الصفحة باب إليه فقط — نسخةٌ واحدة من الكتاب، وأيّ تعديلٍ من لوحة الإدارة يظهر فيها.
  ⚠ لا تحذف reader.js ولا reader.css ولا content/ من هذا المجلّد:
    · رابط المرايا العامّ (maraya/) يقرأ بهما.
    · «المزامنة» في لوحة الإدارة تقرأ الفصول الجديدة من manifest.js و content/.
-->
<script>
(function(){
  var APP='https://fouad-perspective.web.app/';
  var q=location.search.replace(/([?&])review=[^&]*&?/,'$1').replace(/[?&]$/,'');
  var to=APP+q+location.hash;
  window.__WQ_TO=to;
  location.replace(to);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zain:wght@400;800;900&display=swap" rel="stylesheet">
<style>
  html,body{height:100%;margin:0}
  body{background:#F6F0E6;color:#2A221C;font-family:'Zain','Noto Naskh Arabic',serif;display:grid;place-items:center;padding:16px;box-sizing:border-box}
  .c{max-width:420px;text-align:center}
  .r{width:56px;height:56px;margin:0 auto 18px;border-radius:50%;border:2px solid #A87A2E;position:relative}
  .r::after{content:'';position:absolute;inset:12px;border-radius:50%;background:#A87A2E;opacity:.35;animation:b 2.4s ease-in-out infinite}
  @keyframes b{50%{opacity:.8;transform:scale(1.15)}}
  h1{font-weight:900;font-size:1.6em;color:#163A2C;margin:0 0 .3em}
  p{line-height:1.9;color:#5F5246;margin:0 0 1.4em}
  a{display:inline-block;background:#163A2C;color:#F6F0E6;text-decoration:none;font-weight:800;padding:.7em 1.8em;border-radius:999px}
  small{display:block;margin-top:1.2em;color:#9C8C7B;line-height:1.8}
</style>
</head>
<body>
<div class="c">
  <div class="r" aria-hidden="true"></div>
  <h1>ولادة قلب</h1>
  <p>الكتاب صار في تطبيقه. ادخل بنفس حسابك، وكمّل من حيث توقّفت.</p>
  <a id="go" href="https://fouad-perspective.web.app/">افتح الكتاب</a>
  <small>ويمكنك تثبيته على هاتفك من داخل التطبيق.</small>
</div>
<script>try{document.getElementById('go').href=window.__WQ_TO}catch(e){}</script>
</body>
</html>
