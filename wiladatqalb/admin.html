<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة إدارة — ولادة قلب</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F2ED;--bg2:#EDEAE4;--card:#FFFFFF;--txt:#2C2420;--txt2:#6B5D52;--mu:#A89888;--grn:#1B4332;--grn2:#2D6A4F;--grn-b:rgba(45,106,79,0.06);--gld:#C8963E;--gld-b:rgba(200,150,62,0.06);--red:#B44040;--red-b:rgba(180,64,64,0.06);--bdr:rgba(44,36,32,0.1);--fn:'Noto Naskh Arabic',serif;--fd:'Amiri',serif;--fq:'Scheherazade New',serif;--r:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:var(--fn);font-size:14px;line-height:1.6}
.app{display:flex;min-height:100vh}

/* SIDEBAR */
.side{width:250px;background:var(--card);border-left:.5px solid var(--bdr);position:fixed;top:0;bottom:0;right:0;overflow-y:auto;z-index:10}
.main{flex:1;margin-right:250px;padding:18px 24px}
.side-hd{padding:16px;border-bottom:.5px solid var(--bdr);display:flex;align-items:center;gap:8px}
.side-logo{width:32px;height:32px;border-radius:8px;background:var(--grn-b);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:18px;font-weight:700;color:var(--grn)}
.side-t{font-size:13px;font-weight:600}
.side-s{font-size:11px;color:var(--mu)}
.side-nav{padding:10px}
.sn-i{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--txt2);transition:all .15s;margin-bottom:2px}
.sn-i:hover{background:var(--bg)}
.sn-i.act{background:var(--grn-b);color:var(--grn);font-weight:600}
.sn-sec{padding:3px 12px;font-size:11px;color:var(--mu);font-weight:600;margin-top:10px;margin-bottom:3px}
.sn-baab{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:12px;color:var(--txt2);transition:all .15s;margin-bottom:1px}
.sn-baab:hover{background:var(--bg)}
.sn-baab.act{background:var(--gld-b);color:var(--gld);font-weight:600}
.sn-num{width:22px;height:22px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0}
.sn-baab.act .sn-num{background:var(--gld);color:#fff}
.sn-ch{padding:5px 12px 5px 40px;font-size:11px;color:var(--mu);cursor:pointer;border-radius:6px;transition:all .15s}
.sn-ch:hover{background:var(--bg);color:var(--txt2)}
.sn-ch.act{color:var(--grn);font-weight:600}

/* TOP */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:14px;border-bottom:.5px solid var(--bdr)}
.top h1{font-size:16px;font-weight:600}
.top-a{display:flex;gap:6px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border:.5px solid var(--bdr);border-radius:8px;background:var(--card);color:var(--txt2);font-family:var(--fn);font-size:12px;cursor:pointer;transition:all .15s;font-weight:500}
.btn:hover{background:var(--bg);color:var(--txt)}
.btn-p{background:var(--grn);color:#F8F3EC;border-color:var(--grn)}
.btn-p:hover{background:#163a2b}
.btn-d{color:var(--red);border-color:rgba(180,64,64,0.2)}
.btn-d:hover{background:var(--red-b)}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.st{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:0 1px 6px rgba(0,0,0,.03)}
.st-l{font-size:11px;color:var(--mu);margin-bottom:3px}
.st-v{font-size:22px;font-weight:600}
.st-v.g{color:var(--grn2)}.st-v.gl{color:var(--gld)}

/* CHAPTER LIST */
.cl{background:var(--card);border-radius:var(--r);box-shadow:0 1px 6px rgba(0,0,0,.03);overflow:hidden}
.cl-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:.5px solid var(--bdr)}
.cl-t{font-size:14px;font-weight:600}
.ci{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:.5px solid var(--bdr);cursor:pointer;transition:background .15s}
.ci:hover{background:var(--bg)}
.ci:last-child{border-bottom:none}
.ci-n{width:26px;height:26px;border-radius:6px;background:var(--grn);color:#F8F3EC;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.ci-info{flex:1}
.ci-name{font-size:13px;font-weight:500}
.ci-meta{font-size:10px;color:var(--mu);margin-top:1px}
.ci-acts{display:flex;gap:3px}
.ci-a{width:28px;height:28px;border:none;background:none;cursor:pointer;border-radius:6px;color:var(--mu);display:flex;align-items:center;justify-content:center;transition:all .15s;font-size:13px}
.ci-a:hover{background:var(--bg);color:var(--txt)}
.ci-a.del:hover{background:var(--red-b);color:var(--red)}

/* EDITOR */
.ed{background:var(--card);border-radius:var(--r);box-shadow:0 1px 6px rgba(0,0,0,.03);overflow:hidden}
.ed-hd{padding:14px 18px;border-bottom:.5px solid var(--bdr);display:flex;align-items:center;justify-content:space-between}
.ed-meta{padding:14px 18px;border-bottom:.5px solid var(--bdr);display:grid;grid-template-columns:1fr 100px 100px;gap:10px}
.fld label{display:block;font-size:10px;color:var(--mu);margin-bottom:3px;font-weight:500}
.fld input,.fld select,.fld textarea{width:100%;padding:7px 10px;border:.5px solid var(--bdr);border-radius:6px;font-family:var(--fn);font-size:13px;background:var(--bg);color:var(--txt);transition:border .2s}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--grn)}
.fld textarea{resize:vertical;min-height:80px;line-height:1.9}

/* BLOCKS */
.bks{padding:14px 18px}
.bks-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.bks-t{font-size:12px;font-weight:600;color:var(--txt2)}
.bk{border:.5px solid var(--bdr);border-radius:8px;margin-bottom:6px;overflow:hidden;transition:border-color .2s}
.bk:hover{border-color:rgba(44,36,32,0.2)}
.bk-hd{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:var(--bg)}
.bk-tp{font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px}
.bk-tp.prose{background:var(--grn-b);color:var(--grn2)}
.bk-tp.verse{background:var(--gld-b);color:var(--gld)}
.bk-tp.hadith{background:rgba(27,67,50,0.08);color:var(--grn)}
.bk-tp.reflection{background:rgba(45,106,79,0.1);color:var(--grn2)}
.bk-tp.pause{background:var(--gld-b);color:var(--gld)}
.bk-tp.divider{background:var(--bg2);color:var(--mu)}
.bk-acts{display:flex;gap:2px}
.bk-a{width:24px;height:24px;border:none;background:none;cursor:pointer;border-radius:4px;color:var(--mu);display:flex;align-items:center;justify-content:center;font-size:11px}
.bk-a:hover{background:var(--card);color:var(--txt)}
.bk-a.del:hover{color:var(--red)}
.bk-bd{padding:8px 10px}
.bk-bd textarea{width:100%;border:none;background:transparent;font-family:var(--fn);font-size:12px;line-height:1.9;color:var(--txt);resize:vertical;min-height:50px}
.bk-bd textarea:focus{outline:none}
.bk-ref{display:flex;gap:6px;margin-top:5px}
.bk-ref input{flex:1;padding:5px 8px;border:.5px solid var(--bdr);border-radius:4px;font-family:var(--fn);font-size:11px;background:var(--bg)}
.add-bks{display:flex;gap:5px;flex-wrap:wrap;padding:6px 18px 16px}
.add-b{padding:5px 12px;border:.5px dashed;border-radius:6px;background:none;cursor:pointer;font-family:var(--fn);font-size:11px;font-weight:500;transition:all .15s}
.add-b.prose{color:var(--grn2);border-color:rgba(45,106,79,0.3)}.add-b.prose:hover{background:var(--grn-b)}
.add-b.verse{color:var(--gld);border-color:rgba(200,150,62,0.3)}.add-b.verse:hover{background:var(--gld-b)}
.add-b.hadith{color:var(--grn);border-color:rgba(27,67,50,0.3)}.add-b.hadith:hover{background:var(--grn-b)}
.add-b.reflection{color:var(--grn2);border-color:rgba(45,106,79,0.3)}.add-b.reflection:hover{background:var(--grn-b)}
.add-b.pause{color:var(--gld);border-color:rgba(200,150,62,0.3)}.add-b.pause:hover{background:var(--gld-b)}
.add-b.divider{color:var(--mu);border-color:var(--bdr)}.add-b.divider:hover{background:var(--bg)}

/* PREVIEW */
.pv-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:center;justify-content:center}
.pv-ov.on{display:flex}
.pv-fr{width:460px;max-width:94vw;max-height:88vh;background:#F8F3EC;border-radius:14px;overflow:hidden;box-shadow:0 16px 50px rgba(0,0,0,.25)}
.pv-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;background:rgba(27,67,50,0.04);border-bottom:.5px solid rgba(27,67,50,0.1)}
.pv-bar span{font-family:var(--fd);font-size:13px;font-weight:700;color:#1B4332}
.pv-x{width:26px;height:26px;border:none;background:none;cursor:pointer;color:#6B5D52;font-size:16px;border-radius:6px}
.pv-x:hover{background:rgba(0,0,0,.05)}
.pv-ct{padding:24px 20px;overflow-y:auto;max-height:calc(88vh - 44px);direction:rtl}
.pv-ct .pv-label{text-align:center;font-size:12px;color:#C8963E;margin-bottom:6px}
.pv-ct .pv-title{text-align:center;font-family:var(--fd);font-size:22px;font-weight:700;color:#1B4332;margin-bottom:20px}
.pv-ct .pp{font-family:var(--fn);font-size:15px;line-height:2.1;color:#2C2420;margin-bottom:1.2em;text-align:justify}
.pv-ct .pd{text-align:center;margin:1.8em 0;display:flex;align-items:center;justify-content:center;gap:8px}
.pv-ct .pd b{width:4px;height:4px;border-radius:50%;background:#C8963E;opacity:.5;display:inline-block}
.pv-ct .pd i{width:24px;height:.5px;background:#A89888;opacity:.3;display:inline-block}
.pv-ct .pv{margin:1.4em 0;padding:18px;background:rgba(200,150,62,.06);border-radius:10px;border-right:3px solid #C8963E;text-align:center}
.pv-ct .pv p{font-family:var(--fq);font-size:16px;line-height:2.2;color:#1B4332}
.pv-ct .pv small{font-size:11px;color:#A89888;display:block;margin-top:6px}
.pv-ct .ph{margin:1.4em 0;padding:18px;background:rgba(27,67,50,.04);border-radius:10px;border-right:3px solid #2D6A4F;text-align:center}
.pv-ct .ph p{font-size:14px;line-height:2;font-style:italic}
.pv-ct .ph small{font-size:11px;color:#A89888;display:block;margin-top:6px}
.pv-ct .pr{margin:1.4em 0;padding:18px;background:rgba(45,106,79,.05);border-radius:12px;border:.5px solid rgba(45,106,79,.1)}
.pv-ct .pr p{font-size:14px;line-height:2;color:#6B5D52;white-space:pre-line}
.pv-ct .pp-p{margin:1.4em 0;padding:14px 18px;background:rgba(200,150,62,.06);border-radius:12px;border:.5px solid rgba(200,150,62,.15);text-align:center}
.pv-ct .pp-p p{font-size:14px;line-height:2;color:#C8963E;font-weight:500}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(70px);background:var(--grn);color:#F8F3EC;padding:10px 20px;border-radius:10px;font-size:12px;font-weight:500;z-index:600;transition:transform .3s;box-shadow:0 3px 12px rgba(0,0,0,.12)}
.toast.on{transform:translateX(-50%) translateY(0)}

/* EMPTY */
.empty{text-align:center;padding:50px 18px;color:var(--mu)}
.empty p{margin-bottom:14px}

/* SAVING INDICATOR */
.saving{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:var(--gld);color:#fff;padding:6px 16px;border-radius:20px;font-size:11px;font-weight:600;z-index:600;opacity:0;transition:opacity .3s}
.saving.on{opacity:1}

@media(max-width:768px){
  .side{display:none}
  .main{margin-right:0}
  .stats{grid-template-columns:1fr 1fr}
  .ed-meta{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <div class="main" id="mainArea"></div>
</div>
<div class="pv-ov" id="pvOv" onclick="if(event.target===this)closePv()">
  <div class="pv-fr">
    <div class="pv-bar"><span>ولادة قلب</span><button class="pv-x" onclick="closePv()">✕</button></div>
    <div class="pv-ct" id="pvCt"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="saving" id="saving">جاري الحفظ...</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyDj0bV5gsyRbqpxzW0Zd9wjYmq53-Xdj3w",
  authDomain:"fouad-perspective.firebaseapp.com",
  projectId:"fouad-perspective",
  storageBucket:"fouad-perspective.firebasestorage.app",
  messagingSenderId:"1068763865336",
  appId:"1:1068763865336:web:b791abcd22d536aedd5b0d"
});
const db=firebase.firestore();
const toAr=n=>String(n).replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const arW=n=>['','الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر'][n]||toAr(n);
const TL={prose:'نص',verse:'آية',hadith:'حديث',reflection:'وقفة تأمل',pause:'وقفة',divider:'فاصل'};

let allBaabs=[], curBaabId=null, curChId=null, isSaving=false;

// ═══ INIT ═══
async function init(){
  showSaving();
  try{
    const snap=await db.collection('wiladatqalb_baabs').orderBy('number').get();
    allBaabs=[];
    snap.forEach(doc=>allBaabs.push({id:doc.id,...doc.data()}));
    // If no baabs exist, seed with empty structure
    if(allBaabs.length===0) await seedBaabs();
  }catch(e){
    console.error('Load error:',e);
    allBaabs=[];
  }
  hideSaving();
  buildSide();
  showDash();
}

async function seedBaabs(){
  const meta=[
    {number:1,title:'البداية',subtitle:'مين أنا؟',q:'السؤال الأول',status:'draft',chapters:[]},
    {number:2,title:'الجوهر',subtitle:'حقيقتك الأصلية',q:'السؤال الأول',status:'draft',chapters:[]},
    {number:3,title:'الشوق',subtitle:'اتجاهك الفطري',q:'السؤال الأول',status:'draft',chapters:[]},
    {number:4,title:'الفضيلة',subtitle:'الجوهر مُعاشًا',q:'السؤال الأول',status:'draft',chapters:[]},
    {number:5,title:'القناع',subtitle:'ليه مش عايش كده',q:'السؤال الثاني',status:'draft',chapters:[]},
    {number:6,title:'المحاور القلبية',subtitle:'فين طاقتك رايحة',q:'السؤال الثالث',status:'draft',chapters:[]},
    {number:7,title:'نقاط القوة',subtitle:'الميزان',q:'السؤال الثالث',status:'draft',chapters:[]},
    {number:8,title:'الحركة',subtitle:'شبكة الطبائع الحية',q:'السؤال الثالث',status:'draft',chapters:[]},
    {number:9,title:'المرايا السبع',subtitle:'أنت فين دلوقتي',q:'السؤال الرابع',status:'draft',chapters:[]},
    {number:10,title:'الطريق',subtitle:'إزاي ترجع',q:'السؤال الخامس',status:'draft',chapters:[]}
  ];
  for(const m of meta){
    const ref=await db.collection('wiladatqalb_baabs').add(m);
    allBaabs.push({id:ref.id,...m});
  }
  toast('تم إنشاء الأبواب العشرة');
}

// ═══ SAVE TO FIRESTORE ═══
async function saveBaab(baabId){
  const b=allBaabs.find(x=>x.id===baabId);
  if(!b) return;
  showSaving();
  try{
    const {id,...data}=b;
    await db.collection('wiladatqalb_baabs').doc(baabId).set(data);
    toast('تم الحفظ');
  }catch(e){
    console.error('Save error:',e);
    toast('خطأ في الحفظ!');
  }
  hideSaving();
  buildSide();
}

function showSaving(){document.getElementById('saving').classList.add('on')}
function hideSaving(){document.getElementById('saving').classList.remove('on')}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2000)}

// ═══ SIDEBAR ═══
function buildSide(){
  const s=document.getElementById('side');
  let h=`<div class="side-hd"><div class="side-logo">و</div><div><div class="side-t">لوحة الإدارة</div><div class="side-s">ولادة قلب</div></div></div>
  <div class="side-nav">
    <div class="sn-i ${!curBaabId?'act':''}" onclick="showDash()">📊 لوحة التحكم</div>
    <div class="sn-sec">الأبواب</div>`;
  allBaabs.forEach(b=>{
    const act=curBaabId===b.id;
    h+=`<div class="sn-baab ${act?'act':''}" onclick="selBaab('${b.id}')"><div class="sn-num">${toAr(b.number)}</div><span>${b.title}</span></div>`;
    if(act&&b.chapters){
      b.chapters.forEach(ch=>{
        h+=`<div class="sn-ch ${curChId===ch.id?'act':''}" onclick="editCh('${b.id}','${ch.id}')">${ch.title}</div>`;
      });
    }
  });
  h+=`<div style="padding:10px"><a href="reader.html" class="btn" style="width:100%;justify-content:center;text-decoration:none">👁 معاينة الكتاب</a></div></div>`;
  s.innerHTML=h;
}

// ═══ DASHBOARD ═══
function showDash(){
  curBaabId=null;curChId=null;buildSide();
  let tc=0,ts=0;
  allBaabs.forEach(b=>{if(b.chapters){tc+=b.chapters.length;b.chapters.forEach(c=>{if(c.sections)ts+=c.sections.length})}});
  const m=document.getElementById('mainArea');
  let h=`<div class="top"><h1>لوحة التحكم</h1><div class="top-a"><a href="reader.html" class="btn" style="text-decoration:none">👁 الكتاب</a></div></div>
  <div class="stats">
    <div class="st"><div class="st-l">الأبواب</div><div class="st-v">${toAr(allBaabs.length)}</div></div>
    <div class="st"><div class="st-l">الفصول</div><div class="st-v">${toAr(tc)}</div></div>
    <div class="st"><div class="st-l">أقسام المحتوى</div><div class="st-v g">${toAr(ts)}</div></div>
  </div>
  <div class="cl"><div class="cl-hd"><span class="cl-t">الأبواب</span></div>`;
  allBaabs.forEach(b=>{
    const cc=b.chapters?b.chapters.length:0;
    h+=`<div class="ci" onclick="selBaab('${b.id}')">
      <div class="ci-n">${toAr(b.number)}</div>
      <div class="ci-info"><div class="ci-name">الباب ${arW(b.number)}: ${b.title}</div><div class="ci-meta">${toAr(cc)} فصل · ${b.subtitle||''}</div></div>
      <span style="font-size:10px;padding:2px 8px;border-radius:8px;font-weight:500;${b.status==='published'?'background:'+('var(--grn-b)')+';color:var(--grn2)':'background:var(--gld-b);color:var(--gld)'}">${b.status==='published'?'منشور':'مسودة'}</span>
    </div>`;
  });
  h+=`</div>`;
  m.innerHTML=h;
}

// ═══ SELECT BAAB ═══
function selBaab(id){
  curBaabId=id;curChId=null;buildSide();
  const b=allBaabs.find(x=>x.id===id);
  if(!b) return;
  const m=document.getElementById('mainArea');
  let h=`<div class="top"><h1>الباب ${arW(b.number)}: ${b.title}</h1><div class="top-a">
    <button class="btn" onclick="toggleStatus('${id}')">${b.status==='published'?'إلغاء النشر':'نشر الباب'}</button>
    <button class="btn btn-p" onclick="addCh('${id}')">+ إضافة فصل</button>
  </div></div>`;
  // Baab meta
  h+=`<div class="ed" style="margin-bottom:16px"><div class="ed-meta">
    <div class="fld"><label>عنوان الباب</label><input value="${b.title}" onchange="updBaab('${id}','title',this.value)"></div>
    <div class="fld"><label>الوصف</label><input value="${b.subtitle||''}" onchange="updBaab('${id}','subtitle',this.value)"></div>
    <div class="fld"><label>الحالة</label><select onchange="updBaab('${id}','status',this.value)">
      <option value="draft" ${b.status!=='published'?'selected':''}>مسودة</option>
      <option value="published" ${b.status==='published'?'selected':''}>منشور</option>
    </select></div>
  </div></div>`;
  // Chapters
  h+=`<div class="cl"><div class="cl-hd"><span class="cl-t">الفصول</span></div>`;
  if(b.chapters&&b.chapters.length>0){
    b.chapters.forEach((ch,i)=>{
      const sc=ch.sections?ch.sections.length:0;
      h+=`<div class="ci">
        <div class="ci-n">${toAr(i+1)}</div>
        <div class="ci-info" onclick="editCh('${id}','${ch.id}')"><div class="ci-name">${ch.title}</div><div class="ci-meta">${toAr(sc)} قسم</div></div>
        <div class="ci-acts">
          <button class="ci-a" onclick="editCh('${id}','${ch.id}')" title="تعديل">✎</button>
          <button class="ci-a" onclick="pvCh('${id}','${ch.id}')" title="معاينة">👁</button>
          <button class="ci-a del" onclick="delCh('${id}','${ch.id}')" title="حذف">✕</button>
        </div>
      </div>`;
    });
  } else {
    h+=`<div class="empty"><p>لا يوجد فصول بعد</p><button class="btn btn-p" onclick="addCh('${id}')">إضافة أول فصل</button></div>`;
  }
  h+=`</div>`;
  m.innerHTML=h;
}

// ═══ CHAPTER EDITOR ═══
function editCh(baabId,chId){
  curBaabId=baabId;curChId=chId;buildSide();
  const b=allBaabs.find(x=>x.id===baabId);
  const ch=b.chapters.find(c=>c.id===chId);
  if(!ch) return;
  const m=document.getElementById('mainArea');
  let h=`<div class="top"><h1 style="display:flex;align-items:center;gap:6px"><span style="color:var(--mu);font-weight:400;font-size:13px">${b.title} ›</span>${ch.title}</h1>
    <div class="top-a"><button class="btn" onclick="pvCh('${baabId}','${chId}')">👁 معاينة</button><button class="btn btn-p" onclick="saveBaab('${baabId}')">💾 حفظ</button></div></div>`;
  h+=`<div class="ed"><div class="ed-meta">
    <div class="fld"><label>عنوان الفصل</label><input value="${ch.title}" onchange="updCh('${baabId}','${chId}','title',this.value)"></div>
    <div class="fld"><label>الترتيب</label><input type="number" value="${ch.number||''}" onchange="updCh('${baabId}','${chId}','number',parseInt(this.value))"></div>
    <div class="fld"><label>المعرّف</label><input value="${ch.id}" readonly style="opacity:.5"></div>
  </div>
  <div class="bks"><div class="bks-hd"><span class="bks-t">أقسام المحتوى (${toAr(ch.sections?ch.sections.length:0)})</span></div>`;
  if(ch.sections){
    ch.sections.forEach((sec,si)=>{h+=renderBk(baabId,chId,sec,si)});
  }
  h+=`</div><div class="add-bks">
    <button class="add-b prose" onclick="addBk('${baabId}','${chId}','prose')">+ نص</button>
    <button class="add-b verse" onclick="addBk('${baabId}','${chId}','verse')">+ آية</button>
    <button class="add-b hadith" onclick="addBk('${baabId}','${chId}','hadith')">+ حديث</button>
    <button class="add-b reflection" onclick="addBk('${baabId}','${chId}','reflection')">+ وقفة تأمل</button>
    <button class="add-b pause" onclick="addBk('${baabId}','${chId}','pause')">+ وقفة</button>
    <button class="add-b divider" onclick="addBk('${baabId}','${chId}','divider')">+ فاصل</button>
  </div></div>`;
  m.innerHTML=h;
}

function renderBk(baabId,chId,sec,idx){
  if(sec.type==='divider'){
    return `<div class="bk"><div class="bk-hd"><div style="display:flex;align-items:center;gap:6px"><span style="cursor:grab;color:var(--mu)">⠿</span><span class="bk-tp divider">فاصل</span></div><div class="bk-acts">
      <button class="bk-a" onclick="moveBk('${baabId}','${chId}',${idx},-1)">↑</button>
      <button class="bk-a" onclick="moveBk('${baabId}','${chId}',${idx},1)">↓</button>
      <button class="bk-a del" onclick="rmBk('${baabId}','${chId}',${idx})">✕</button>
    </div></div></div>`;
  }
  const hasRef=sec.type==='verse'||sec.type==='hadith';
  return `<div class="bk"><div class="bk-hd"><div style="display:flex;align-items:center;gap:6px"><span style="cursor:grab;color:var(--mu)">⠿</span><span class="bk-tp ${sec.type}">${TL[sec.type]}</span></div><div class="bk-acts">
    <button class="bk-a" onclick="moveBk('${baabId}','${chId}',${idx},-1)">↑</button>
    <button class="bk-a" onclick="moveBk('${baabId}','${chId}',${idx},1)">↓</button>
    <button class="bk-a del" onclick="rmBk('${baabId}','${chId}',${idx})">✕</button>
  </div></div><div class="bk-bd">
    <textarea onchange="updBk('${baabId}','${chId}',${idx},'content',this.value)">${sec.content||''}</textarea>
    ${hasRef?`<div class="bk-ref"><input placeholder="المرجع (سورة الروم: ٣٠)" value="${sec.reference||''}" onchange="updBk('${baabId}','${chId}',${idx},'reference',this.value)"></div>`:''}
  </div></div>`;
}

// ═══ CRUD ═══
function updBaab(id,key,val){
  const b=allBaabs.find(x=>x.id===id);
  if(b){b[key]=val;autoSave(id)}
}
function toggleStatus(id){
  const b=allBaabs.find(x=>x.id===id);
  if(b){b.status=b.status==='published'?'draft':'published';saveBaab(id);selBaab(id)}
}
function addCh(baabId){
  const b=allBaabs.find(x=>x.id===baabId);
  if(!b.chapters) b.chapters=[];
  const num=b.chapters.length+1;
  const ch={id:'ch'+Date.now(),number:num,title:'فصل جديد',sections:[]};
  b.chapters.push(ch);
  saveBaab(baabId);
  editCh(baabId,ch.id);
}
function delCh(baabId,chId){
  if(!confirm('حذف هذا الفصل؟')) return;
  const b=allBaabs.find(x=>x.id===baabId);
  b.chapters=b.chapters.filter(c=>c.id!==chId);
  saveBaab(baabId);
  selBaab(baabId);
}
function updCh(baabId,chId,key,val){
  const b=allBaabs.find(x=>x.id===baabId);
  const ch=b.chapters.find(c=>c.id===chId);
  if(ch){ch[key]=val;autoSave(baabId)}
}
function addBk(baabId,chId,type){
  const b=allBaabs.find(x=>x.id===baabId);
  const ch=b.chapters.find(c=>c.id===chId);
  if(!ch.sections) ch.sections=[];
  const bk={type};
  if(type!=='divider') bk.content='';
  if(type==='verse'||type==='hadith') bk.reference='';
  ch.sections.push(bk);
  autoSave(baabId);
  editCh(baabId,chId);
  setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),80);
}
function rmBk(baabId,chId,idx){
  const b=allBaabs.find(x=>x.id===baabId);
  const ch=b.chapters.find(c=>c.id===chId);
  ch.sections.splice(idx,1);
  autoSave(baabId);
  editCh(baabId,chId);
}
function moveBk(baabId,chId,idx,dir){
  const b=allBaabs.find(x=>x.id===baabId);
  const ch=b.chapters.find(c=>c.id===chId);
  const ni=idx+dir;
  if(ni<0||ni>=ch.sections.length) return;
  [ch.sections[idx],ch.sections[ni]]=[ch.sections[ni],ch.sections[idx]];
  autoSave(baabId);
  editCh(baabId,chId);
}
function updBk(baabId,chId,idx,key,val){
  const b=allBaabs.find(x=>x.id===baabId);
  const ch=b.chapters.find(c=>c.id===chId);
  ch.sections[idx][key]=val;
  clearTimeout(window._ast);
  window._ast=setTimeout(()=>saveBaab(baabId),1500);
}

let _autoTimer;
function autoSave(baabId){
  clearTimeout(_autoTimer);
  _autoTimer=setTimeout(()=>saveBaab(baabId),800);
}

// ═══ PREVIEW ═══
function pvCh(baabId,chId){
  const b=allBaabs.find(x=>x.id===baabId);
  const ch=b.chapters.find(c=>c.id===chId);
  if(!ch) return;
  const pc=document.getElementById('pvCt');
  let h=`<div class="pv-label">الفصل ${arW(ch.number||1)}</div><div class="pv-title">${ch.title}</div>`;
  if(ch.sections){
    ch.sections.forEach(s=>{
      switch(s.type){
        case 'prose':h+=`<p class="pp">${s.content}</p>`;break;
        case 'divider':h+=`<div class="pd"><i></i><b></b><i></i></div>`;break;
        case 'verse':h+=`<div class="pv"><p>﴿${s.content}﴾</p><small>${s.reference||''}</small></div>`;break;
        case 'hadith':h+=`<div class="ph"><p>«${s.content}»</p><small>${s.reference||''}</small></div>`;break;
        case 'reflection':h+=`<div class="pr"><p>${s.content}</p></div>`;break;
        case 'pause':h+=`<div class="pp-p"><p>${s.content}</p></div>`;break;
      }
    });
  }
  pc.innerHTML=h;
  document.getElementById('pvOv').classList.add('on');
}
function closePv(){document.getElementById('pvOv').classList.remove('on')}

init();
</script>

</html>
