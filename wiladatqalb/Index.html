<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ولادة قلب — منظور الفؤاد</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F3EC;--bg2:#F0EAE0;--text:#2C2420;--text2:#6B5D52;--muted:#A89888;--green:#1B4332;--green2:#2D6A4F;--gold:#C8963E;--gold2:#D4A574;--border:rgba(44,36,32,0.08);--font-d:'Amiri',serif;--font-b:'Noto Naskh Arabic',serif}
[data-theme=dark]{--bg:#1A1612;--bg2:#231E19;--text:#E8DDD0;--text2:#B5A48C;--muted:#7A6E60;--green:#7BC4A5;--green2:#5DCAA5;--gold:#D4A574;--gold2:#C8963E;--border:rgba(232,221,208,0.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font-b);-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .4s,color .4s}
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center;position:relative}
.hero::before{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:radial-gradient(ellipse at center top,rgba(200,150,62,0.06) 0%,transparent 70%);pointer-events:none}
.book-icon{width:100px;height:100px;margin:0 auto 32px;border-radius:50%;background:rgba(200,150,62,0.08);display:flex;align-items:center;justify-content:center;border:2px solid rgba(200,150,62,0.2);position:relative;animation:pulse 4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(200,150,62,0.15)}50%{box-shadow:0 0 0 20px rgba(200,150,62,0)}}
.book-icon span{font-family:var(--font-d);font-size:44px;font-weight:700;color:var(--gold)}
.hero h1{font-family:var(--font-d);font-size:3em;font-weight:700;color:var(--green);line-height:1.4;margin-bottom:8px}
.hero .subtitle{font-size:1.15em;color:var(--gold);margin-bottom:6px;font-weight:500}
.hero .author{font-size:0.95em;color:var(--muted);margin-bottom:40px}
.start-btn{display:inline-flex;align-items:center;gap:10px;padding:16px 40px;background:var(--green);color:#F8F3EC;border:none;border-radius:12px;font-family:var(--font-b);font-size:1.05em;font-weight:600;cursor:pointer;transition:all .3s;box-shadow:0 4px 20px rgba(27,67,50,0.25)}
.start-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(27,67,50,0.35)}
.start-btn svg{width:20px;height:20px}
.scroll-hint{position:absolute;bottom:32px;color:var(--muted);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:8px;animation:bounce 2s ease infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
.scroll-hint svg{width:20px;height:20px}

/* Table of Contents */
.toc-section{max-width:720px;margin:0 auto;padding:0 24px 80px}
.toc-header{text-align:center;margin-bottom:48px}
.toc-header h2{font-family:var(--font-d);font-size:1.8em;color:var(--green);margin-bottom:8px}
.toc-header p{font-size:0.95em;color:var(--text2);line-height:1.8}
.question-group{margin-bottom:40px}
.question-label{display:inline-flex;align-items:center;gap:10px;margin-bottom:16px;padding:6px 16px;background:rgba(200,150,62,0.08);border-radius:20px;font-size:13px;color:var(--gold);font-weight:600}
.question-label .dot{width:6px;height:6px;border-radius:50%;background:var(--gold)}
.baab-card{display:flex;align-items:center;gap:16px;padding:18px 20px;margin-bottom:10px;border-radius:14px;border:0.5px solid var(--border);cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
.baab-card:hover{background:rgba(45,106,79,0.04);border-color:rgba(45,106,79,0.15);transform:translateX(-4px)}
.baab-card.locked{opacity:0.5;cursor:default}
.baab-card.locked:hover{background:transparent;border-color:var(--border);transform:none}
.baab-card.published::after{content:'';position:absolute;top:0;bottom:0;right:0;width:3px;background:var(--green);border-radius:0 3px 3px 0}
.baab-num{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:18px;font-weight:700;flex-shrink:0;transition:all .3s}
.baab-num.pub{background:var(--green);color:#F8F3EC}
.baab-num.draft{background:rgba(200,150,62,0.1);color:var(--gold);border:1.5px solid rgba(200,150,62,0.3)}
.baab-num.lock{background:var(--bg2);color:var(--muted)}
.baab-info{flex:1}
.baab-title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:3px}
.baab-sub{font-size:13px;color:var(--text2)}
.baab-arrow{color:var(--muted);transition:color .2s}
.baab-card:hover .baab-arrow{color:var(--green)}
.baab-card:hover .baab-num.lock{background:rgba(45,106,79,0.06);color:var(--green2)}
.baab-status{font-size:11px;padding:3px 10px;border-radius:12px;font-weight:500}
.baab-status.pub{background:rgba(45,106,79,0.08);color:var(--green2)}
.baab-status.draft{background:rgba(200,150,62,0.08);color:var(--gold)}

/* Journey Map */
.journey{display:flex;flex-direction:column;align-items:center;margin:48px 0;position:relative}
.journey::before{content:'';position:absolute;top:28px;bottom:28px;right:50%;width:1.5px;background:linear-gradient(to bottom,var(--gold),var(--green),var(--muted));opacity:0.2;transform:translateX(0.75px)}
.journey-dot{width:12px;height:12px;border-radius:50%;background:var(--gold);margin:8px 0;position:relative;z-index:1;box-shadow:0 0 0 4px var(--bg)}

/* Footer */
.footer{text-align:center;padding:40px 24px;border-top:0.5px solid var(--border)}
.footer p{font-size:13px;color:var(--muted)}
.footer a{color:var(--gold);text-decoration:none}

/* Theme toggle */
.theme-btn{position:fixed;bottom:24px;left:24px;width:44px;height:44px;border-radius:50%;background:var(--bg2);border:0.5px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);z-index:100;transition:all .3s}
.theme-btn:hover{background:var(--green);color:#F8F3EC}
.theme-btn svg{width:20px;height:20px}

/* Admin link */
.admin-link{position:fixed;bottom:24px;right:24px;padding:8px 16px;background:var(--bg2);border:0.5px solid var(--border);border-radius:8px;font-size:12px;color:var(--muted);text-decoration:none;z-index:100;transition:all .3s}
.admin-link:hover{color:var(--gold);border-color:var(--gold)}

@media(max-width:600px){
  .hero h1{font-size:2.2em}
  .toc-section{padding:0 16px 60px}
  .baab-card{padding:14px 16px;gap:12px}
}
</style>
</head>
<body>

<section class="hero">
  <div class="book-icon"><span>و</span></div>
  <h1>ولادة قلب</h1>
  <p class="subtitle">منظور الفؤاد</p>
  <p class="author">م. أحمد سالم</p>
  <button class="start-btn" onclick="location.href='reader.html'">
    <span>ابدأ الرحلة</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="scroll-hint">
    <span>تعرّف على الرحلة</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
  </div>
</section>

<section class="toc-section" id="toc"></section>

<footer class="footer">
  <p>ولادة قلب — منظور الفؤاد &copy; م. أحمد سالم</p>
</footer>

<button class="theme-btn" onclick="toggleTheme()" title="تبديل الوضع">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
</button>

<a href="admin.html" class="admin-link">لوحة الإدارة</a>

<script>
const arabNum = n => String(n).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const arabWord = n => ['','الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر'][n]||arabNum(n);

const questions = {
  'السؤال الأول': { label: 'مين أنا؟', baabs: '١-٤' },
  'السؤال الثاني': { label: 'ليه مش عايش كده؟', baabs: '٥' },
  'السؤال الثالث': { label: 'إزاي المنظومة بتشتغل؟', baabs: '٦-٨' },
  'السؤال الرابع': { label: 'أنا فين دلوقتي؟', baabs: '٩' },
  'السؤال الخامس': { label: 'إزاي أرجع؟', baabs: '١٠' }
};

async function loadTOC() {
  let book;
  try {
    const r = await fetch('data/book.json');
    book = await r.json();
  } catch(e) {
    book = {"baabs":[
      {"id":"baab1","number":1,"title":"البداية","subtitle":"مين أنا؟","question":"السؤال الأول","status":"published","chaptersCount":6},
      {"id":"baab2","number":2,"title":"الجوهر","subtitle":"حقيقتك الأصلية","question":"السؤال الأول","status":"draft","chaptersCount":11},
      {"id":"baab3","number":3,"title":"الشوق","subtitle":"اتجاهك الفطري","question":"السؤال الأول","status":"draft","chaptersCount":9},
      {"id":"baab4","number":4,"title":"الفضيلة","subtitle":"الجوهر مُعاشًا","question":"السؤال الأول","status":"draft","chaptersCount":10},
      {"id":"baab5","number":5,"title":"القناع","subtitle":"ليه مش عايش كده","question":"السؤال الثاني","status":"draft","chaptersCount":12},
      {"id":"baab6","number":6,"title":"المحاور القلبية","subtitle":"فين طاقتك رايحة","question":"السؤال الثالث","status":"draft","chaptersCount":8},
      {"id":"baab7","number":7,"title":"نقاط القوة","subtitle":"الميزان","question":"السؤال الثالث","status":"draft","chaptersCount":11},
      {"id":"baab8","number":8,"title":"الحركة","subtitle":"شبكة الطبائع الحية","question":"السؤال الثالث","status":"draft","chaptersCount":15},
      {"id":"baab9","number":9,"title":"المرايا السبع","subtitle":"أنت فين دلوقتي","question":"السؤال الرابع","status":"draft","chaptersCount":9},
      {"id":"baab10","number":10,"title":"الطريق","subtitle":"إزاي ترجع","question":"السؤال الخامس","status":"draft","chaptersCount":7}
    ]};
  }

  const toc = document.getElementById('toc');
  let html = `<div class="toc-header">
    <h2>رحلة الكتاب</h2>
    <p>عشرة أبواب تجيب على خمسة أسئلة.<br>كل سؤال يبني على ما قبله ولا يمكنك أن تجيب عن الذي بعده دون أن تكون قد عشت الذي قبله.</p>
  </div>`;

  let currentQ = '';
  book.baabs.forEach(b => {
    if (b.question !== currentQ) {
      currentQ = b.question;
      const q = questions[currentQ];
      html += `<div class="question-group">
        <div class="question-label"><span class="dot"></span> ${currentQ}: ${q.label}</div>`;
    }

    const isPub = b.status === 'published';
    const statusCls = isPub ? 'pub' : 'draft';
    const numCls = isPub ? 'pub' : (b.status === 'draft' ? 'draft' : 'lock');
    const cardCls = isPub ? 'published' : '';
    const click = isPub ? `onclick="location.href='reader.html?baab=${b.id}'"` : '';

    html += `<div class="baab-card ${cardCls}" ${click}>
      <div class="baab-num ${numCls}">${arabNum(b.number)}</div>
      <div class="baab-info">
        <div class="baab-title">الباب ${arabWord(b.number)}: ${b.title}</div>
        <div class="baab-sub">${arabNum(b.chaptersCount)} فصل · ${b.subtitle}</div>
      </div>
      <span class="baab-status ${statusCls}">${isPub ? 'متاح' : 'قريبًا'}</span>
      ${isPub ? '<svg class="baab-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>' : ''}
    </div>`;

    // Check if next baab has different question to close the group
    const idx = book.baabs.indexOf(b);
    const next = book.baabs[idx + 1];
    if (!next || next.question !== currentQ) {
      html += `</div>`;
    }
  });

  toc.innerHTML = html;
}

function toggleTheme() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', isDark ? '' : 'dark');
  localStorage.setItem('wq-theme', isDark ? 'light' : 'dark');
}

// Restore theme
if (localStorage.getItem('wq-theme') === 'dark') {
  document.documentElement.setAttribute('data-theme', 'dark');
}

loadTOC();
</script>
</body>
</html>
