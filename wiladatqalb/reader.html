<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ولادة قلب — منظور الفؤاد</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ═══ VARIABLES ═══ */
:root {
  --bg:#F8F3EC;--bg2:#F0EAE0;--card:#FFFFFF;
  --txt:#2C2420;--txt2:#6B5D52;--muted:#A89888;
  --grn:#1B4332;--grn2:#2D6A4F;--grn-bg:rgba(27,67,50,0.04);
  --gld:#C8963E;--gld2:#D4A574;--gld-bg:rgba(200,150,62,0.06);
  --bdr:rgba(44,36,32,0.08);--bdr-gld:rgba(200,150,62,0.2);
  --fd:'Amiri',serif;--fb:'Noto Naskh Arabic',serif;--fq:'Scheherazade New',serif;
  --fs:17px;--lh:2.15;--cw:700px;
  --trans:0.35s cubic-bezier(0.4,0,0.2,1);
}
[data-theme=dark]{
  --bg:#1A1612;--bg2:#231E19;--card:#2C261F;
  --txt:#E8DDD0;--txt2:#B5A48C;--muted:#7A6E60;
  --grn:#7BC4A5;--grn2:#5DCAA5;--gld:#D4A574;--gld2:#C8963E;
  --gld-bg:rgba(200,150,62,0.08);--grn-bg:rgba(45,106,79,0.08);
  --bdr:rgba(232,221,208,0.08);--bdr-gld:rgba(200,150,62,0.15);
}
[data-theme=sepia]{
  --bg:#F4EDE0;--bg2:#EDE4D4;--card:#FBF6ED;
  --txt:#3D2E1E;--txt2:#6B5740;--muted:#9A8568;
  --grn:#2D5A3F;--grn2:#3D7A5A;--gld:#B8862E;--gld2:#C8963E;
  --gld-bg:rgba(184,134,46,0.07);--grn-bg:rgba(45,90,63,0.05);
  --bdr:rgba(61,46,30,0.1);--bdr-gld:rgba(184,134,46,0.2);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:var(--fb);font-size:var(--fs);line-height:var(--lh);transition:background var(--trans),color var(--trans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:rgba(200,150,62,0.25)}

/* ═══ PROGRESS BAR ═══ */
.pbar{position:fixed;top:0;left:0;right:0;height:3px;background:var(--bdr);z-index:200}
.pfill{height:100%;background:var(--grn);width:0%;transition:width .2s;border-radius:0 2px 2px 0}

/* ═══ TOP NAV ═══ */
.tnav{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--bg);border-bottom:.5px solid var(--bdr);transition:background var(--trans),transform .3s}
.tnav.hid{transform:translateY(-100%)}
.tnav-in{max-width:var(--cw);margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 24px}
.tnav-t{font-family:var(--fd);font-size:15px;font-weight:700;color:var(--grn);cursor:pointer}
.tnav-ch{font-size:12px;color:var(--muted);text-align:center;flex:1;padding:0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tnav-r{display:flex;align-items:center;gap:10px}
.nb{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:none;background:none;cursor:pointer;color:var(--txt2);border-radius:8px;transition:background .2s;font-size:16px}
.nb:hover{background:var(--bg2)}

/* ═══ SIDEBAR ═══ */
.ov{position:fixed;inset:0;z-index:149;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .3s}
.ov.on{opacity:1;pointer-events:all}
.sb{position:fixed;top:0;right:0;bottom:0;z-index:150;width:300px;max-width:84vw;background:var(--bg);transform:translateX(100%);transition:transform var(--trans);overflow-y:auto;border-left:.5px solid var(--bdr)}
.sb.on{transform:translateX(0)}
.sb-hd{padding:20px;display:flex;align-items:center;justify-content:space-between;border-bottom:.5px solid var(--bdr)}
.sb-t{font-family:var(--fd);font-size:18px;font-weight:700;color:var(--grn)}
.sb-x{width:30px;height:30px;border:none;background:none;cursor:pointer;color:var(--txt2);display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:18px}
.sb-x:hover{background:var(--bg2)}
.sb-chs{padding:12px}
.sb-baab{padding:10px 14px;margin-bottom:6px;border-radius:10px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:background .2s}
.sb-baab:hover{background:var(--bg2)}
.sb-baab.act{background:var(--gld-bg);border:.5px solid var(--bdr-gld)}
.sb-bn{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:13px;font-weight:700;flex-shrink:0}
.sb-bn.cur{background:var(--gld-bg);color:var(--gld);border:1.5px solid var(--gld)}
.sb-bi{flex:1}
.sb-bt{font-size:13px;font-weight:600;color:var(--txt)}
.sb-bs{font-size:11px;color:var(--muted);margin-top:2px}
.sb-ch{padding:7px 14px 7px 44px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--txt2);transition:background .2s;display:flex;align-items:center;gap:6px;margin:1px 0}
.sb-ch:hover{background:var(--bg2);color:var(--txt)}
.sb-ch.act{color:var(--gld);font-weight:600}
.sb-dot{width:4px;height:4px;border-radius:50%;background:var(--muted);flex-shrink:0}
.sb-ch.act .sb-dot{background:var(--gld)}

/* ═══ SETTINGS PANEL ═══ */
.sp{position:fixed;top:52px;left:50%;transform:translateX(-50%);z-index:160;width:280px;max-width:90vw;background:var(--bg);border:.5px solid var(--bdr);border-radius:12px;padding:18px;box-shadow:0 8px 32px rgba(0,0,0,.1);opacity:0;pointer-events:none;transition:opacity .2s}
.sp.on{opacity:1;pointer-events:all}
.sr{display:flex;align-items:center;justify-content:space-between;padding:10px 0}
.sr+.sr{border-top:.5px solid var(--bdr)}
.sl{font-size:13px;color:var(--txt2)}
.fc{display:flex;align-items:center;gap:6px}
.fbn{width:34px;height:34px;border:.5px solid var(--bdr);background:var(--bg2);color:var(--txt);border-radius:8px;cursor:pointer;font-family:var(--fd);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:background .2s}
.fbn:hover{background:var(--grn-bg)}
.fsd{font-size:13px;color:var(--txt);min-width:26px;text-align:center}
.thm{display:flex;gap:6px}
.thm-b{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all .2s}
.thm-b:hover{transform:scale(1.15)}
.thm-b.act{border-color:var(--gld);box-shadow:0 0 0 2px var(--gld-bg)}
.thm-l{background:#F8F3EC;border:1px solid #ddd}
.thm-d{background:#1A1612;border:1px solid #444}
.thm-s{background:#F4EDE0;border:1px solid #ccc}

/* ═══ MAIN CONTENT ═══ */
.mc{max-width:var(--cw);margin:0 auto;padding:72px 28px 100px;min-height:100vh;transition:max-width .3s}

/* ═══ CHAPTER HEADER ═══ */
.chd{text-align:center;margin-bottom:44px;padding-top:16px}
.chl{display:inline-flex;align-items:center;gap:12px;margin-bottom:14px}
.chl-l{width:40px;height:.5px;background:var(--gld)}
.chl-t{font-size:12px;color:var(--gld);letter-spacing:1px}
.cht{font-family:var(--fd);font-size:1.9em;font-weight:700;color:var(--grn);line-height:1.5;margin-bottom:6px}
.orn{text-align:center;color:var(--gld);font-size:18px;opacity:.4}

/* ═══ CONTENT BLOCKS ═══ */
.blk-prose{margin-bottom:1.4em;text-align:justify}
.blk-divider{text-align:center;margin:2.2em 0;display:flex;align-items:center;justify-content:center;gap:8px}
.blk-divider i{width:28px;height:.5px;background:var(--muted);opacity:.3;display:inline-block}
.blk-divider b{width:4px;height:4px;border-radius:50%;background:var(--gld);opacity:.5;display:inline-block}
.blk-verse{margin:1.8em 8px;padding:20px 24px;background:var(--gld-bg);border-radius:10px;border-right:3px solid var(--gld);text-align:center}
.blk-verse p{font-family:var(--fq);font-size:1.15em;line-height:2.2;color:var(--grn)}
.blk-verse small{font-size:.72em;color:var(--muted);display:block;margin-top:8px;font-family:var(--fb)}
.blk-hadith{margin:1.8em 8px;padding:20px 24px;background:var(--grn-bg);border-radius:10px;border-right:3px solid var(--grn2);text-align:center}
.blk-hadith p{font-size:1em;line-height:2;font-style:italic}
.blk-hadith small{font-size:.72em;color:var(--muted);display:block;margin-top:8px}
.blk-reflection{margin:2em 0;padding:20px 24px;background:var(--grn-bg);border-radius:12px;border:.5px solid rgba(45,106,79,0.1);position:relative}
.blk-reflection::before{content:'؟';position:absolute;top:-12px;right:20px;width:24px;height:24px;background:var(--grn2);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#F8F3EC;font-size:12px;line-height:24px;text-align:center}
.blk-reflection p{font-size:.92em;line-height:2;color:var(--txt2);white-space:pre-line;padding-top:4px}
.blk-pause{margin:2em 0;padding:16px 20px;background:var(--gld-bg);border-radius:12px;border:.5px solid var(--bdr-gld);text-align:center}
.blk-pause p{font-size:.92em;line-height:2;color:var(--gld);font-weight:500}

/* ═══ CHAPTER NAV ═══ */
.cnav{display:flex;align-items:center;justify-content:space-between;margin-top:48px;padding-top:20px;border-top:.5px solid var(--bdr)}
.cn-b{display:flex;align-items:center;gap:6px;padding:10px 16px;border:.5px solid var(--bdr);border-radius:8px;background:none;cursor:pointer;font-family:var(--fb);font-size:13px;color:var(--txt2);transition:all .2s}
.cn-b:hover{background:var(--grn-bg);color:var(--grn);border-color:rgba(45,106,79,0.15)}
.cn-b svg{width:14px;height:14px;flex-shrink:0}
.cn-c{font-size:12px;color:var(--muted)}

/* ═══ SCROLL TOP ═══ */
.sctop{position:fixed;bottom:20px;left:20px;width:40px;height:40px;border-radius:50%;background:var(--grn);color:#F8F3EC;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transform:translateY(10px);transition:opacity .3s,transform .3s;box-shadow:0 3px 10px rgba(27,67,50,.25);z-index:80;font-size:16px}
.sctop.vis{opacity:1;transform:translateY(0)}

/* ═══ LOADING ═══ */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px}
.loading .logo{font-family:var(--fd);font-size:40px;font-weight:700;color:var(--gld);width:80px;height:80px;border-radius:50%;background:var(--gld-bg);display:flex;align-items:center;justify-content:center;border:1.5px solid var(--bdr-gld);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(200,150,62,.15)}50%{box-shadow:0 0 0 14px rgba(200,150,62,0)}}
.loading p{font-size:14px;color:var(--muted)}

/* ═══ COVER PAGE ═══ */
.cover{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px}
.cover .logo{font-family:var(--fd);font-size:44px;font-weight:700;color:var(--gld);width:90px;height:90px;border-radius:50%;background:var(--gld-bg);display:flex;align-items:center;justify-content:center;border:1.5px solid var(--bdr-gld);margin-bottom:28px;animation:pulse 3s ease-in-out infinite}
.cover h1{font-family:var(--fd);font-size:2.6em;font-weight:700;color:var(--grn);line-height:1.4;margin-bottom:8px}
.cover .sub{font-size:1.1em;color:var(--gld);margin-bottom:4px;font-weight:500}
.cover .auth{font-size:.9em;color:var(--muted);margin-bottom:36px}
.cover .start{display:inline-flex;align-items:center;gap:8px;padding:14px 36px;background:var(--grn);color:#F8F3EC;border:none;border-radius:10px;font-family:var(--fb);font-size:1em;font-weight:600;cursor:pointer;transition:all .3s;box-shadow:0 3px 16px rgba(27,67,50,.2)}
.cover .start:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(27,67,50,.3)}

/* ═══ TOC ═══ */
.toc{max-width:600px;margin:0 auto;padding:0 24px 60px}
.toc h2{font-family:var(--fd);font-size:1.6em;color:var(--grn);text-align:center;margin-bottom:8px}
.toc .desc{text-align:center;font-size:.9em;color:var(--txt2);line-height:1.8;margin-bottom:32px}
.toc-q{margin-bottom:28px}
.toc-ql{display:inline-flex;align-items:center;gap:8px;margin-bottom:10px;padding:4px 14px;background:var(--gld-bg);border-radius:16px;font-size:12px;color:var(--gld);font-weight:600}
.toc-ql b{width:5px;height:5px;border-radius:50%;background:var(--gld);display:inline-block}
.toc-item{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:8px;border-radius:12px;border:.5px solid var(--bdr);cursor:pointer;transition:all .2s}
.toc-item:hover{background:var(--grn-bg);border-color:rgba(45,106,79,0.12);transform:translateX(-3px)}
.toc-item.locked{opacity:.45;cursor:default}
.toc-item.locked:hover{background:transparent;border-color:var(--bdr);transform:none}
.toc-n{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:15px;font-weight:700;flex-shrink:0}
.toc-n.pub{background:var(--grn);color:#F8F3EC}
.toc-n.dft{background:var(--gld-bg);color:var(--gld);border:1px solid var(--bdr-gld)}
.toc-info{flex:1}
.toc-tt{font-size:14px;font-weight:600;color:var(--txt)}
.toc-st{font-size:12px;color:var(--txt2);margin-top:2px}
.toc-badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500}
.toc-badge.pub{background:rgba(45,106,79,0.08);color:var(--grn2)}
.toc-badge.soon{background:var(--gld-bg);color:var(--gld)}

/* ═══ RESPONSIVE ═══ */
@media(max-width:600px){
  .mc{padding:68px 18px 90px}
  .cht{font-size:1.5em}
  .blk-verse,.blk-hadith{margin:1.4em 0;padding:16px}
  .blk-reflection,.blk-pause{padding:16px}
  .tnav-in{padding:8px 14px}
  .sb{width:260px}
  .sp{width:260px}
  .cover h1{font-size:2em}
}
</style>
</head>
<body>

<div class="pbar"><div class="pfill" id="pf"></div></div>

<nav class="tnav" id="tnav">
  <div class="tnav-in">
    <button class="nb" onclick="toggleSB()" title="الفهرس">☰</button>
    <span class="tnav-ch" id="navCh"></span>
    <div class="tnav-r">
      <button class="nb" onclick="toggleSP()" title="الإعدادات">⚙</button>
      <button class="nb" onclick="goHome()" title="الرئيسية">🏠</button>
    </div>
  </div>
</nav>

<div class="sp" id="sp">
  <div class="sr">
    <span class="sl">حجم الخط</span>
    <div class="fc">
      <button class="fbn" onclick="chFS(-1)">أ-</button>
      <span class="fsd" id="fsD">17</span>
      <button class="fbn" onclick="chFS(1)">أ+</button>
    </div>
  </div>
  <div class="sr">
    <span class="sl">وضع القراءة</span>
    <div class="thm">
      <button class="thm-b thm-l act" data-th="" onclick="setTh(this)" title="نهاري"></button>
      <button class="thm-b thm-d" data-th="dark" onclick="setTh(this)" title="ليلي"></button>
      <button class="thm-b thm-s" data-th="sepia" onclick="setTh(this)" title="بيج"></button>
    </div>
  </div>
</div>

<div class="ov" id="ov" onclick="toggleSB()"></div>
<aside class="sb" id="sb">
  <div class="sb-hd">
    <span class="sb-t">ولادة قلب</span>
    <button class="sb-x" onclick="toggleSB()">✕</button>
  </div>
  <div class="sb-chs" id="sbChs"></div>
</aside>

<main class="mc" id="mc"></main>

<button class="sctop" id="sctop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
// ═══ FIREBASE INIT ═══
firebase.initializeApp({
  apiKey:"AIzaSyDj0bV5gsyRbqpxzW0Zd9wjYmq53-Xdj3w",
  authDomain:"fouad-perspective.firebaseapp.com",
  projectId:"fouad-perspective",
  storageBucket:"fouad-perspective.firebasestorage.app",
  messagingSenderId:"1068763865336",
  appId:"1:1068763865336:web:b791abcd22d536aedd5b0d"
});
const db=firebase.firestore(), auth=firebase.auth();

// ═══ ARABIC HELPERS ═══
const toAr=n=>String(n).replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const arW=n=>['','الأوّل','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر'][n]||toAr(n);

// ═══ STATE ═══
let userId=null, allBaabs=[], currentBaab=null, currentChIdx=0, fontSize=17;

// ═══ BOOK METADATA (fallback if Firestore empty) ═══
const BOOK_META=[
  {id:'baab1',n:1,title:'البداية',sub:'مين أنا؟',q:'السؤال الأول',status:'published'},
  {id:'baab2',n:2,title:'الجوهر',sub:'حقيقتك الأصلية',q:'السؤال الأول',status:'draft'},
  {id:'baab3',n:3,title:'الشوق',sub:'اتجاهك الفطري',q:'السؤال الأول',status:'draft'},
  {id:'baab4',n:4,title:'الفضيلة',sub:'الجوهر مُعاشًا',q:'السؤال الأول',status:'draft'},
  {id:'baab5',n:5,title:'القناع',sub:'ليه مش عايش كده',q:'السؤال الثاني',status:'draft'},
  {id:'baab6',n:6,title:'المحاور القلبية',sub:'فين طاقتك رايحة',q:'السؤال الثالث',status:'draft'},
  {id:'baab7',n:7,title:'نقاط القوة',sub:'الميزان',q:'السؤال الثالث',status:'draft'},
  {id:'baab8',n:8,title:'الحركة',sub:'شبكة الطبائع الحية',q:'السؤال الثالث',status:'draft'},
  {id:'baab9',n:9,title:'المرايا السبع',sub:'أنت فين دلوقتي',q:'السؤال الرابع',status:'draft'},
  {id:'baab10',n:10,title:'الطريق',sub:'إزاي ترجع',q:'السؤال الخامس',status:'draft'}
];

// ═══ INIT ═══
auth.onAuthStateChanged(async user=>{
  if(!user){
    // Try getting userId from localStorage (encrypted or plain)
    userId=localStorage.getItem('userId');
    if(!userId){
      // Not logged in — show anyway but without saving progress
      userId=null;
    }
  } else {
    userId=user.uid;
  }
  // Also check encrypted storage
  if(!userId){
    try{
      const enc=localStorage.getItem('_enc_user');
      if(enc){const d=JSON.parse(decodeURIComponent(atob(enc.split('').reverse().join(''))));userId=d.id;}
    }catch(e){}
  }
  await loadBook();
});

async function loadBook(){
  showLoading();
  try{
    const snap=await db.collection('wiladatqalb_baabs').orderBy('number').get();
    if(!snap.empty){
      allBaabs=[];
      snap.forEach(doc=>{allBaabs.push({id:doc.id,...doc.data()})});
    } else {
      // No data in Firestore yet — use metadata
      allBaabs=BOOK_META.map(m=>({...m,number:m.n,chapters:[]}));
    }
  }catch(e){
    console.error('Load error:',e);
    allBaabs=BOOK_META.map(m=>({...m,number:m.n,chapters:[]}));
  }

  // Check URL params
  const p=new URLSearchParams(location.search);
  const baabId=p.get('baab'), chId=p.get('ch');

  if(baabId){
    const b=allBaabs.find(x=>x.id===baabId);
    if(b && b.chapters && b.chapters.length>0){
      currentBaab=b;
      currentChIdx=chId?Math.max(0,b.chapters.findIndex(c=>c.id===chId)):0;
      renderReader();
      return;
    }
  }

  // Try to restore last position
  if(userId){
    try{
      const prog=await db.collection('wiladatqalb_progress').doc(userId).get();
      if(prog.exists){
        const d=prog.data();
        const b=allBaabs.find(x=>x.id===d.currentBaab);
        if(b && b.chapters && b.chapters.length>0){
          currentBaab=b;
          currentChIdx=d.currentChapter||0;
          renderReader();
          return;
        }
      }
    }catch(e){}
  }

  // Show cover
  renderCover();
}

// ═══ COVER PAGE ═══
function renderCover(){
  document.getElementById('tnav').style.display='none';
  const mc=document.getElementById('mc');
  let html=`<div class="cover">
    <div class="logo">و</div>
    <h1>ولادة قلب</h1>
    <p class="sub">منظور الفؤاد</p>
    <p class="auth">م. أحمد سالم</p>
    <button class="start" onclick="startReading()">ابدأ الرحلة ←</button>
  </div>
  <div class="toc">
    <h2>رحلة الكتاب</h2>
    <p class="desc">عشرة أبواب تجيب على خمسة أسئلة. كل سؤال يبني على ما قبله.</p>`;

  let curQ='';
  const questions={'السؤال الأول':'مين أنا؟','السؤال الثاني':'ليه مش عايش كده؟','السؤال الثالث':'إزاي المنظومة بتشتغل؟','السؤال الرابع':'أنا فين دلوقتي؟','السؤال الخامس':'إزاي أرجع؟'};

  allBaabs.forEach(b=>{
    const q=b.q||'';
    if(q!==curQ){
      if(curQ) html+=`</div>`;
      curQ=q;
      html+=`<div class="toc-q"><div class="toc-ql"><b></b> ${q}: ${questions[q]||''}</div>`;
    }
    const pub=b.status==='published';
    const hasCh=b.chapters&&b.chapters.length>0;
    const cls=pub&&hasCh?'':'locked';
    const click=pub&&hasCh?`onclick="openBaab('${b.id}')"`:'';
    html+=`<div class="toc-item ${cls}" ${click}>
      <div class="toc-n ${pub?'pub':'dft'}">${toAr(b.number)}</div>
      <div class="toc-info">
        <div class="toc-tt">الباب ${arW(b.number)}: ${b.title}</div>
        <div class="toc-st">${b.sub||''}</div>
      </div>
      <span class="toc-badge ${pub?'pub':'soon'}">${pub&&hasCh?'متاح':'قريبًا'}</span>
    </div>`;
  });
  if(curQ) html+=`</div>`;
  html+=`</div>`;
  mc.innerHTML=html;
}

function startReading(){
  const pub=allBaabs.find(b=>b.status==='published'&&b.chapters&&b.chapters.length>0);
  if(pub) openBaab(pub.id);
}

function openBaab(id){
  const b=allBaabs.find(x=>x.id===id);
  if(!b||!b.chapters||!b.chapters.length) return;
  currentBaab=b;
  currentChIdx=0;
  renderReader();
  history.replaceState(null,'',`?baab=${id}`);
}

// ═══ READER ═══
function renderReader(){
  document.getElementById('tnav').style.display='';
  buildSidebar();
  renderChapter(currentChIdx);
  restorePrefs();
}

function renderChapter(idx){
  currentChIdx=idx;
  const ch=currentBaab.chapters[idx];
  if(!ch) return;
  const mc=document.getElementById('mc');

  let html=`<div class="chd">
    <div class="chl">
      <div class="chl-l"></div>
      <span class="chl-t">الفصل ${arW(ch.number||idx+1)}</span>
      <div class="chl-l"></div>
    </div>
    <h1 class="cht">${ch.title}</h1>
    <div class="orn">❦</div>
  </div>`;

  if(ch.sections){
    ch.sections.forEach(sec=>{
      switch(sec.type){
        case 'prose':
          html+=`<p class="blk-prose">${sec.content}</p>`;break;
        case 'divider':
          html+=`<div class="blk-divider"><i></i><b></b><i></i></div>`;break;
        case 'verse':
          html+=`<div class="blk-verse"><p>﴿${sec.content}﴾</p><small>${sec.reference||''}</small></div>`;break;
        case 'hadith':
          html+=`<div class="blk-hadith"><p>«${sec.content}»</p><small>${sec.reference||''}</small></div>`;break;
        case 'reflection':
          html+=`<div class="blk-reflection"><p>${sec.content}</p></div>`;break;
        case 'pause':
          html+=`<div class="blk-pause"><p>${sec.content}</p></div>`;break;
      }
    });
  }

  // Chapter navigation
  html+=`<div class="cnav">`;
  if(idx<currentBaab.chapters.length-1){
    const nx=currentBaab.chapters[idx+1];
    html+=`<button class="cn-b" onclick="goChapter(${idx+1})"><span>التالي: ${nx.title}</span> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>`;
  } else html+=`<div></div>`;
  html+=`<span class="cn-c">${toAr(idx+1)} من ${toAr(currentBaab.chapters.length)}</span>`;
  if(idx>0){
    const pv=currentBaab.chapters[idx-1];
    html+=`<button class="cn-b" onclick="goChapter(${idx-1})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg> <span>${pv.title}</span></button>`;
  } else html+=`<div></div>`;
  html+=`</div>`;

  mc.innerHTML=html;
  window.scrollTo({top:0});

  // Update nav
  document.getElementById('navCh').textContent=`الباب ${arW(currentBaab.number)} · ${ch.title}`;
  updateSBActive();
  saveProgress();
}

function goChapter(i){
  renderChapter(i);
  closeSB();
}

// ═══ SIDEBAR ═══
function buildSidebar(){
  const el=document.getElementById('sbChs');
  if(!currentBaab) return;
  let h=`<div class="sb-baab act">
    <div class="sb-bn cur">${toAr(currentBaab.number)}</div>
    <div class="sb-bi">
      <div class="sb-bt">الباب ${arW(currentBaab.number)}: ${currentBaab.title}</div>
      <div class="sb-bs">${currentBaab.chapters?currentBaab.chapters.length:0} فصول</div>
    </div>
  </div>`;
  if(currentBaab.chapters){
    currentBaab.chapters.forEach((ch,i)=>{
      h+=`<div class="sb-ch ${i===currentChIdx?'act':''}" onclick="goChapter(${i})" data-chi="${i}">
        <span class="sb-dot"></span>${ch.title}
      </div>`;
    });
  }
  el.innerHTML=h;
}

function updateSBActive(){
  document.querySelectorAll('.sb-ch').forEach((el,i)=>{
    el.classList.toggle('act',i===currentChIdx);
  });
}

function toggleSB(){
  document.getElementById('sb').classList.toggle('on');
  document.getElementById('ov').classList.toggle('on');
}
function closeSB(){
  document.getElementById('sb').classList.remove('on');
  document.getElementById('ov').classList.remove('on');
}

// ═══ SETTINGS ═══
function toggleSP(){document.getElementById('sp').classList.toggle('on')}
function chFS(d){
  fontSize=Math.max(14,Math.min(24,fontSize+d));
  document.documentElement.style.setProperty('--fs',fontSize+'px');
  document.getElementById('fsD').textContent=fontSize;
  localStorage.setItem('wq-fs',fontSize);
}
function setTh(btn){
  const th=btn.dataset.th;
  document.documentElement.setAttribute('data-theme',th);
  document.querySelectorAll('.thm-b').forEach(b=>b.classList.remove('act'));
  btn.classList.add('act');
  localStorage.setItem('wq-th',th);
}
function restorePrefs(){
  const sf=localStorage.getItem('wq-fs');
  if(sf){fontSize=parseInt(sf);document.documentElement.style.setProperty('--fs',fontSize+'px');document.getElementById('fsD').textContent=fontSize}
  const th=localStorage.getItem('wq-th');
  if(th){document.documentElement.setAttribute('data-theme',th);document.querySelectorAll('.thm-b').forEach(b=>b.classList.toggle('act',b.dataset.th===th))}
}
restorePrefs();

// ═══ PROGRESS ═══
function saveProgress(){
  if(!userId||!currentBaab) return;
  db.collection('wiladatqalb_progress').doc(userId).set({
    currentBaab:currentBaab.id,
    currentChapter:currentChIdx,
    updatedAt:firebase.firestore.FieldValue.serverTimestamp()
  },{merge:true}).catch(e=>console.log('Save progress error:',e));
}

// ═══ SCROLL ═══
let lastSc=0;
window.addEventListener('scroll',()=>{
  const st=window.scrollY;
  const h=document.documentElement.scrollHeight-window.innerHeight;
  if(h>0) document.getElementById('pf').style.width=Math.round(st/h*100)+'%';
  const nav=document.getElementById('tnav');
  if(st>150&&st>lastSc) nav.classList.add('hid'); else nav.classList.remove('hid');
  lastSc=st;
  document.getElementById('sctop').classList.toggle('vis',st>400);
});

// Close settings on outside click
document.addEventListener('click',e=>{
  const sp=document.getElementById('sp');
  if(sp.classList.contains('on')&&!sp.contains(e.target)&&!e.target.closest('.nb')) sp.classList.remove('on');
});

// ═══ NAVIGATION ═══
function goHome(){
  const courseId=new URLSearchParams(location.search).get('courseId');
  if(courseId) window.location.href=`../course-view.html?id=${courseId}`;
  else{currentBaab=null;renderCover();history.replaceState(null,'','reader.html')}
}

function showLoading(){
  document.getElementById('mc').innerHTML=`<div class="loading"><div class="logo">و</div><p>جاري التحميل...</p></div>`;
}
</script>
