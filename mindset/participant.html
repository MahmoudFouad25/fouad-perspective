<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>المشارك — تحت السطح</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E✨%3C/text%3E%3C/svg%3E">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- Chart.js للخريطة العنكبوتية -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="stars-background" id="starsBackground"></div>

    <div class="participant-container">

        <!-- شاشة التسجيل -->
        <div id="registrationScreen" class="screen active">
            <div class="full-center">
                <div class="card card-glow" style="max-width: 440px; width: 100%;">
                    <div class="text-center mb-3">
                        <h1 class="gold-text">تحت السطح</h1>
                        <p style="color: var(--text-secondary); margin-top: 0.5rem;">منظور الفؤاد · مؤسسة غيث</p>
                    </div>

                    <div class="divider"></div>

                    <label>اسمك الكامل</label>
                    <input type="text" id="nameInput" placeholder="اكتب اسمك هنا..." autocomplete="off">

                    <button class="btn btn-gold w-full mt-3" onclick="registerParticipant()">
                        أنا هنا ✨
                    </button>
                </div>
            </div>
        </div>

        <!-- الشاشة الديناميكية -->
        <div id="dynamicScreen" class="screen hidden">
            <div class="participant-header">
                <span style="color: var(--text-muted); font-size: 0.9rem;">👋 <span id="welcomeName"></span></span>
                <div id="timerMini" class="timer-mini hidden"></div>
            </div>

            <div class="content-area" id="contentArea">
                <!-- يتم تعبئتها ديناميكياً -->
            </div>
        </div>

    </div>

    <div id="toastContainer"></div>

    <style>
        .participant-container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
        }

        .screen {
            min-height: 100vh;
            transition: opacity 0.6s ease;
        }

        .screen.hidden {
            display: none;
        }

        .participant-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.2rem;
            border-bottom: 1px solid var(--border-subtle);
            background: rgba(10, 14, 39, 0.5);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .timer-mini {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gold);
            font-variant-numeric: tabular-nums;
        }

        .timer-mini.warning { color: #fb923c; }
        .timer-mini.danger { color: var(--red-soft); animation: pulse 0.5s infinite; }

        .content-area {
            padding: 1.5rem 1.2rem;
            max-width: 600px;
            margin: 0 auto;
            min-height: calc(100vh - 70px);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .phase-display {
            animation: fadeInUp 0.6s ease;
        }

        .phase-display h1 {
            font-size: clamp(1.8rem, 6vw, 2.5rem);
            margin-bottom: 1rem;
            line-height: 1.3;
        }

        .phase-display .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            line-height: 1.7;
            margin-bottom: 1.5rem;
        }

        .question-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid var(--border-subtle);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .question-card:hover {
            border-color: var(--gold);
            background: rgba(251, 191, 36, 0.05);
        }

        .question-card.selected {
            border-color: var(--gold);
            background: rgba(251, 191, 36, 0.1);
        }

        .question-text {
            color: var(--text-primary);
            font-size: 1.05rem;
            line-height: 1.7;
        }

        .progress-text {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-align: center;
            margin: 1rem 0;
        }

        .waiting-display {
            text-align: center;
            padding: 3rem 1rem;
        }

        .waiting-display .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: pulse 2s infinite;
        }

        .immunity-box {
            background: rgba(220, 38, 38, 0.05);
            border: 1.5px solid rgba(220, 38, 38, 0.2);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            position: relative;
        }

        .immunity-box.completed {
            border-color: rgba(16, 185, 129, 0.4);
            background: rgba(16, 185, 129, 0.05);
        }

        .immunity-box.locked {
            opacity: 0.5;
            pointer-events: none;
        }

        .box-number {
            position: absolute;
            top: -12px;
            right: 1rem;
            background: var(--gold);
            color: var(--bg-cosmic-1);
            padding: 0.3rem 0.8rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .box-title {
            color: var(--gold);
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .box-description {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .focus-card {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid var(--border-subtle);
            border-radius: 12px;
            padding: 1.2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .focus-card:hover {
            border-color: var(--gold);
            transform: translateY(-2px);
        }

        .focus-card.selected {
            border-color: var(--gold);
            background: rgba(251, 191, 36, 0.1);
        }

        .focus-card h4 {
            color: var(--text-primary);
            margin-bottom: 0.3rem;
        }

        .focus-card .score {
            color: var(--gold);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
        }

        .results-table td {
            padding: 0.8rem 0.5rem;
            border-bottom: 1px solid var(--border-subtle);
        }

        .results-table .score-cell {
            font-weight: 700;
            color: var(--gold);
            font-size: 1.1rem;
            text-align: center;
        }

        .charter-form .form-group {
            margin-bottom: 1.5rem;
        }

        .charter-form label {
            color: var(--gold);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
    </style>

    <!-- ترتيب السكريبتات -->
    <script src="../js/firebase-config.js"></script>
    <script src="js/training-session.js"></script>
    <script src="js/session-data.js"></script>
    <script src="js/participant.js"></script>
</body>
</html>
