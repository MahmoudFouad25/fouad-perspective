<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحت السطح — منظور الفؤاد</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E✨%3C/text%3E%3C/svg%3E">
</head>
<body>
    <div class="stars-background" id="starsBackground"></div>

    <div class="container">
        <div class="full-center">
            <div class="max-w-lg mx-auto w-full text-center">

                <!-- العنوان الرئيسي -->
                <div class="fade-in">
                    <div class="badge mb-2">منظور الفؤاد</div>
                    <h1 class="gold-text mb-2">تحت السطح</h1>
                    <p class="mb-5" style="color: var(--text-secondary); font-size: 1.3rem; line-height: 1.7;">
                        هندسة العقلية ورحلة التحوّل<br>
                        من الاحتياج إلى القدرة
                    </p>
                </div>

                <!-- بطاقات الأدوار -->
                <div class="role-grid fade-in-up fade-in-delay-2">
                    <a href="participant.html" class="card card-interactive role-card">
                        <div class="role-icon">👤</div>
                        <h3>أنا مشارك</h3>
                        <p>للدخول إلى التدريب من هاتفك أو جهازك اللوحي</p>
                    </a>

                    <a href="admin.html" class="card card-interactive role-card">
                        <div class="role-icon">🎯</div>
                        <h3>أنا المدرّب</h3>
                        <p>لوحة التحكم الكاملة في كل مراحل التدريب</p>
                    </a>

                    <a href="display.html" class="card card-interactive role-card">
                        <div class="role-icon">📺</div>
                        <h3>شاشة العرض</h3>
                        <p>للعرض على الشاشة الكبيرة في القاعة</p>
                    </a>
                </div>

                <!-- توقيع -->
                <div class="mt-5 fade-in-up fade-in-delay-4" style="color: var(--text-muted); font-size: 0.9rem;">
                    <p>مؤسسة غيث · منظور الفؤاد</p>
                </div>
            </div>
        </div>
    </div>

    <style>
        .role-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .role-card {
            text-decoration: none;
            color: inherit;
            text-align: center;
            padding: 2.5rem 1.5rem;
        }

        .role-icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
        }

        .role-card h3 {
            color: var(--gold);
            margin-bottom: 0.8rem;
        }

        .role-card p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
        }
    </style>

    <script>
        // إنشاء النجوم
        (function() {
            const container = document.getElementById('starsBackground');
            const starCount = 100;
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                const size = Math.random();
                star.className = 'star ' + (size < 0.6 ? 'star-small' : size < 0.9 ? 'star-medium' : 'star-large');
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 4 + 's';
                star.style.animationDuration = (3 + Math.random() * 3) + 's';
                container.appendChild(star);
            }
        })();
    </script>
</body>
</html>
