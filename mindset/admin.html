<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة المدرّب — تحت السطح</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎯%3C/text%3E%3C/svg%3E">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="stars-background" id="starsBackground"></div>

    <div class="admin-container">
        <!-- الشريط العلوي -->
        <header class="admin-header">
            <div class="header-left">
                <h2 class="gold-text" style="font-size: 1.4rem;">🎯 لوحة المدرّب</h2>
                <span class="badge" id="sessionStatusBadge">جاهز</span>
            </div>
            <div class="header-right">
                <div class="stats-mini">
                    <span>👥 <strong id="participantCount">0</strong></span>
                    <span>📍 <strong id="currentPhaseLabel">—</strong></span>
                </div>
                <button class="btn btn-outline" onclick="resetSession()" title="إعادة تعيين كاملة">🔄 إعادة تعيين</button>
            </div>
        </header>

        <!-- المحتوى الرئيسي -->
        <main class="admin-main">

            <!-- الشريط الجانبي - تنقل المراحل -->
            <aside class="admin-sidebar">
                <h3 class="sidebar-title">المراحل</h3>
                <div class="phase-list" id="phaseList">
                    <!-- يتم بناؤها ديناميكياً -->
                </div>
            </aside>

            <!-- منطقة العمل المركزية -->
            <section class="admin-workspace">

                <!-- معلومات المرحلة الحالية -->
                <div class="current-phase-info card">
                    <div class="flex justify-between items-center mb-2">
                        <div>
                            <div class="badge mb-1" id="phaseBlockBadge">—</div>
                            <h2 id="phaseTitle">جاهز للبدء</h2>
                            <p id="phaseSubtitle" style="color: var(--text-secondary);"></p>
                        </div>
                        <div class="phase-nav">
                            <button class="btn btn-ghost" onclick="goPreviousPhase()">→ السابق</button>
                            <button class="btn btn-gold" onclick="goNextPhase()">التالي ←</button>
                        </div>
                    </div>
                </div>

                <!-- منطقة التحكمات الخاصة بكل مرحلة -->
                <div class="phase-controls card" id="phaseControls">
                    <!-- يتم تعبئتها ديناميكياً حسب المرحلة -->
                </div>

                <!-- المؤقت -->
                <div class="card mt-3">
                    <div class="flex justify-between items-center">
                        <div class="timer-display" id="timerDisplay">00:00</div>
                        <div class="flex gap-2">
                            <button class="btn btn-ghost" onclick="setTimer(180)">٣ دق</button>
                            <button class="btn btn-ghost" onclick="setTimer(240)">٤ دق</button>
                            <button class="btn btn-ghost" onclick="setTimer(300)">٥ دق</button>
                            <button class="btn btn-ghost" onclick="setTimer(420)">٧ دق</button>
                            <button class="btn btn-ghost" onclick="setTimer(900)">١٥ دق</button>
                            <button class="btn btn-gold" id="timerToggle" onclick="toggleTimer()">▶</button>
                            <button class="btn btn-outline" onclick="resetTimer()">↺</button>
                        </div>
                    </div>
                </div>

                <!-- لوحة المشاركين -->
                <div class="card mt-3">
                    <div class="flex justify-between items-center mb-2">
                        <h3 style="color: var(--gold);">المشاركون</h3>
                        <div class="flex gap-2">
                            <button class="btn btn-ghost" onclick="toggleParticipantsView()">
                                <span id="participantsViewLabel">عرض الإجابات</span>
                            </button>
                        </div>
                    </div>
                    <div class="participants-grid" id="participantsGrid">
                        <!-- يتم تعبئتها ديناميكياً -->
                    </div>
                </div>

            </section>

        </main>
    </div>

    <!-- التوست -->
    <div id="toastContainer"></div>

    <style>
        .admin-container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .admin-header {
            background: rgba(10, 14, 39, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .stats-mini {
            display: flex;
            gap: 1.5rem;
            color: var(--text-secondary);
        }

        .stats-mini strong {
            color: var(--gold);
            font-size: 1.2rem;
            margin-right: 0.3rem;
        }

        .admin-main {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 1.5rem;
            padding: 1.5rem;
            flex: 1;
        }

        .admin-sidebar {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 1rem;
            max-height: calc(100vh - 120px);
            overflow-y: auto;
            position: sticky;
            top: 100px;
        }

        .sidebar-title {
            color: var(--gold);
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-subtle);
        }

        .phase-list {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .phase-session-group {
            margin-bottom: 1rem;
        }

        .phase-session-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
            padding: 0.3rem 0.5rem;
            background: rgba(251, 191, 36, 0.05);
            border-radius: 6px;
        }

        .phase-item {
            padding: 0.6rem 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            color: var(--text-secondary);
            border-right: 3px solid transparent;
        }

        .phase-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .phase-item.active {
            background: rgba(251, 191, 36, 0.15);
            color: var(--gold);
            border-right-color: var(--gold);
            font-weight: 600;
        }

        .phase-item.break {
            color: var(--green-sufi);
            font-style: italic;
        }

        .admin-workspace {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .current-phase-info {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.05) 0%, rgba(251, 191, 36, 0.02) 100%);
            border-color: rgba(251, 191, 36, 0.2);
        }

        .phase-nav {
            display: flex;
            gap: 0.5rem;
        }

        .phase-controls {
            min-height: 150px;
        }

        .control-section {
            margin-bottom: 1.5rem;
        }

        .control-section h4 {
            color: var(--gold);
            margin-bottom: 0.8rem;
            font-size: 1.1rem;
        }

        .timer-display {
            font-size: 3rem;
            font-weight: 800;
            color: var(--gold);
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.3);
        }

        .toast-message {
            position: fixed;
            bottom: 2rem;
            right: 50%;
            transform: translateX(50%);
            background: rgba(0, 0, 0, 0.95);
            color: var(--text-primary);
            padding: 1rem 2rem;
            border-radius: 12px;
            border: 1px solid var(--gold);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            z-index: 9999;
            animation: slideUp 0.4s ease;
        }

        @media (max-width: 1024px) {
            .admin-main {
                grid-template-columns: 1fr;
            }

            .admin-sidebar {
                position: relative;
                top: 0;
                max-height: 300px;
            }
        }

        /* بطاقات المجموعات */
        .groups-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1rem;
        }

        .group-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid var(--border-subtle);
            border-radius: 12px;
            padding: 1rem;
        }

        .group-card h5 {
            color: var(--gold);
            margin-bottom: 0.5rem;
        }

        .group-card .members {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 0.8rem;
        }

        .group-card .responses {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* جدول الاحصاءات */
        .stats-table {
            width: 100%;
            border-collapse: collapse;
        }

        .stats-table th,
        .stats-table td {
            padding: 0.8rem;
            text-align: right;
            border-bottom: 1px solid var(--border-subtle);
        }

        .stats-table th {
            color: var(--gold);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .stats-table tbody tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }
    </style>

    <!-- 
        ============================================
        ترتيب السكريبتات مهم:
        1. firebase-config.js الأصلي (من الـ root) - بيهيّأ Firebase والـ db عالمياً
        2. training-session.js - بيضيف SessionManager فوق الـ db العام
        3. session-data.js - بيانات المراحل
        4. admin.js - منطق الصفحة
        ============================================
    -->
    <script src="../js/firebase-config.js"></script>
    <script src="js/training-session.js"></script>
    <script src="js/session-data.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
