<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة العرض — تحت السطح</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📺%3C/text%3E%3C/svg%3E">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="stars-background" id="starsBackground"></div>

    <div class="display-container">
        <!-- شريط المؤقت العلوي -->
        <div class="display-timer-bar hidden" id="timerBar">
            <div class="timer-massive" id="timerMassive">00:00</div>
        </div>

        <!-- المحتوى الديناميكي -->
        <div class="display-content" id="displayContent">
            <div class="fade-in text-center">
                <h1 class="gold-text" style="font-size: 5rem;">تحت السطح</h1>
                <p style="font-size: 1.8rem; color: var(--text-secondary); margin-top: 1rem;">
                    هندسة العقلية ورحلة التحوّل من الاحتياج إلى القدرة
                </p>
            </div>
        </div>

        <!-- شريط معلومات المشاركين السفلي -->
        <div class="display-footer" id="displayFooter">
            <div class="participants-strip" id="participantsStrip">
                <span style="color: var(--text-muted);">👥 المشاركون: <strong id="participantCountDisplay" style="color: var(--gold);">0</strong></span>
            </div>
        </div>
    </div>

    <style>
        body { overflow: hidden; }
        
        .display-container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .display-timer-bar {
            background: rgba(10, 14, 39, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 2px solid var(--gold);
            padding: 1rem 2rem;
            text-align: center;
            transition: all 0.5s ease;
        }

        .timer-massive {
            font-size: 4rem;
            font-weight: 800;
            color: var(--gold);
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 40px rgba(251, 191, 36, 0.5);
            letter-spacing: 0.1em;
        }

        .timer-massive.warning { color: #fb923c; text-shadow: 0 0 40px rgba(251, 146, 60, 0.5); }
        .timer-massive.danger { color: var(--red-soft); animation: pulse 0.5s infinite; text-shadow: 0 0 40px rgba(220, 38, 38, 0.6); }

        .display-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            text-align: center;
            overflow: hidden;
        }

        .display-content h1 {
            font-size: clamp(3rem, 7vw, 6rem) !important;
            line-height: 1.2;
            margin-bottom: 2rem;
        }

        .display-content .subtitle {
            font-size: clamp(1.5rem, 3vw, 2.5rem) !important;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .display-content .massive-text {
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            line-height: 1.4;
            font-weight: 700;
        }

        .display-content .big-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            border: 1.5px solid var(--border-subtle);
            border-radius: 24px;
            padding: 3rem;
            max-width: 1200px;
            margin: 0 auto;
            text-align: right;
        }

        .display-footer {
            background: rgba(10, 14, 39, 0.85);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-subtle);
            padding: 0.8rem 2rem;
        }

        .participants-strip {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 1.1rem;
        }

        /* قائمة المشاركين المتدفقة */
        .participants-flow {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
        }

        .participant-display-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(16, 185, 129, 0.3);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            min-height: 100px;
        }

        .participant-display-card .name {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .participant-display-card .answer {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-top: 0.5rem;
            font-style: italic;
        }

        /* عرض الشفرة */
        .code-display {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem 4rem;
            font-size: 2.5rem;
            line-height: 1.5;
            margin: 2rem 0;
            text-align: center;
        }

        .code-display strong {
            color: var(--gold);
        }

        /* الجبل الجليدي البصري */
        .iceberg-visual {
            display: grid;
            grid-template-rows: auto auto;
            max-width: 900px;
            margin: 0 auto;
        }

        .iceberg-above {
            background: linear-gradient(180deg, rgba(59, 130, 246, 0.15) 0%, rgba(59, 130, 246, 0.05) 100%);
            border-bottom: 3px solid var(--blue-light);
            padding: 2rem;
            text-align: center;
        }

        .iceberg-below {
            background: linear-gradient(180deg, rgba(10, 14, 39, 0.8) 0%, rgba(251, 191, 36, 0.15) 100%);
            padding: 2rem;
        }

        .layer-row {
            padding: 0.8rem 1.5rem;
            border-bottom: 1px solid rgba(251, 191, 36, 0.2);
            font-size: 1.4rem;
        }

        .layer-row strong {
            color: var(--gold);
            margin-left: 0.5rem;
        }

        /* جدول الطبائع للعرض الكبير */
        .natures-display-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 1.3rem;
        }

        .natures-display-table th,
        .natures-display-table td {
            padding: 1rem;
            text-align: right;
            border-bottom: 1px solid var(--border-subtle);
        }

        .natures-display-table th {
            color: var(--gold);
            font-weight: 700;
            font-size: 1.4rem;
            border-bottom: 2px solid var(--gold);
        }

        /* خريطة عنكبوتية كبيرة */
        .big-chart-container {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.3);
            padding: 2rem;
            border-radius: 24px;
        }

        /* عرض المجموعات */
        .groups-display-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            max-width: 1600px;
            margin: 0 auto;
            padding: 1rem;
        }

        .group-display-card {
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid;
            border-radius: 16px;
            padding: 1.5rem;
        }

        .group-display-card h4 {
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
        }

        .group-display-card p {
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        /* heatmap لتوزيع الاختيارات */
        .heatmap-display {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1rem;
            max-width: 1200px;
            margin: 2rem auto;
        }

        .heatmap-cell {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            border: 2px solid var(--border-subtle);
            transition: all 0.5s ease;
        }

        .heatmap-cell h4 { color: var(--text-primary); }
        .heatmap-cell .count {
            font-size: 4rem;
            font-weight: 800;
            color: var(--gold);
            margin: 0.5rem 0;
        }

        @media (max-width: 768px) {
            .display-content { padding: 1.5rem; }
            .iceberg-visual { padding: 0 1rem; }
            .heatmap-display { grid-template-columns: repeat(2, 1fr); }
        }
    </style>

    <!-- ترتيب السكريبتات -->
    <script src="../js/firebase-config.js"></script>
    <script src="js/training-session.js"></script>
    <script src="js/session-data.js"></script>
    <script src="js/display.js"></script>
</body>
</html>
