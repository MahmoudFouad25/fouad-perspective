<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0F1B2D">
  <title>منظور الفؤاد — التجربة التفاعليّة</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="screen">
    <div class="screen-content">

      <!-- Brand -->
      <div class="brand animate-in">
        <div class="brand-mark">م.ف</div>
        <div>
          <div class="brand-name">منظور الفؤاد</div>
          <span class="brand-tagline">بالشراكة مع Proactive</span>
        </div>
      </div>

      <!-- Hero -->
      <div class="status-pill animate-in delay-1">جلسة حيّة</div>

      <h1 class="title-hero animate-in delay-2">
        من الاحتراق<br>
        إلى استعادة الاتّزان
      </h1>

      <p class="subtitle animate-in delay-3">
        تجربة تفاعليّة على شاشتك، تمشي مع الويبينار خطوة بخطوة.<br>
        مفيش بيانات، مفيش حسابات — اضغط ابدأ وادخل.
      </p>

      <button id="joinBtn" class="cta-btn animate-in delay-4">
        <span>ابدأ التجربة</span>
      </button>

      <p class="hint animate-in delay-4">
        تأكّد إنّك متابع الويبينار على الزووم
      </p>

    </div>
  </main>

  <!-- ──────────────────────────────────────────────────────────────────
       Firebase SDK (compat mode)
       ────────────────────────────────────────────────────────────────── -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <!-- إعدادات Firebase الموجودة في الجذر -->
  <script src="../js/firebase-config.js"></script>

  <!-- منطق الجلسة الخاص بالـ Webinar -->
  <script src="js/session.js"></script>

  <script>
    const btn = document.getElementById('joinBtn');

    // لو دخل قبل كده، انقله مباشرة للـ live
    if (getParticipantId()) {
      btn.querySelector('span').textContent = 'كمّل التجربة';
    }

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.querySelector('span').textContent = 'جاري الدخول...';
      try {
        await joinSession();
        window.location.href = 'live.html';
      } catch (err) {
        console.error(err);
        btn.disabled = false;
        btn.querySelector('span').textContent = 'حاول تاني';
        alert('حصل خطأ في الاتّصال. تأكّد من الإنترنت وحاول تاني.');
      }
    });
  </script>

</body>
</html>
