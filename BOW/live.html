<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0F1B2D">
  <title>منظور الفؤاد — التجربة الحيّة</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="screen">
    <div id="stage-container" class="live-stage">
      <!-- Initial loader before first stage subscription resolves -->
      <div class="brand animate-in">
        <div class="brand-mark">م.ف</div>
        <div>
          <div class="brand-name">منظور الفؤاد</div>
          <span class="brand-tagline">جلسة حيّة</span>
        </div>
      </div>
      <div class="pulse"></div>
      <p class="text-faint">جاري الاتّصال...</p>
    </div>
  </main>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <!-- إعدادات Firebase الموجودة في الجذر -->
  <script src="../js/firebase-config.js"></script>

  <!-- منطق الجلسة الخاص بالـ Webinar -->
  <script src="js/session.js"></script>

  <script>
    // ────────────────────────────────────────────────────────────────
    // التأكد من وجود participant ID — لو مفيش، يرجع للصفحة الرئيسيّة
    // ────────────────────────────────────────────────────────────────
    if (!getParticipantId()) {
      window.location.href = 'index.html';
    }

    const container = document.getElementById('stage-container');
    let currentStage = null;

    // Heartbeat — يأكّد للنظام إنّ المشارك لسه موجود
    startHeartbeat();

    // ────────────────────────────────────────────────────────────────
    // الاستماع للمرحلة الحاليّة من Firebase وتغيير الواجهة تلقائيًّا
    // ────────────────────────────────────────────────────────────────
    subscribeToStage((stage, sessionData) => {
      if (stage !== currentStage) {
        currentStage = stage;
        renderStage(stage);
      }
    });

    // ────────────────────────────────────────────────────────────────
    // عرض المرحلة المناسبة
    // ────────────────────────────────────────────────────────────────
    function renderStage(stage) {
      const html = stages[stage] ? stages[stage]() : stages.welcome();
      container.innerHTML = html;
    }

    // ────────────────────────────────────────────────────────────────
    // Stage views
    // ────────────────────────────────────────────────────────────────
    const stages = {
      welcome: () => `
        <div class="brand animate-in">
          <div class="brand-mark">م.ف</div>
          <div>
            <div class="brand-name">منظور الفؤاد</div>
            <span class="brand-tagline">جلسة حيّة</span>
          </div>
        </div>
        <div class="status-pill animate-in delay-1">موجود في الجلسة</div>
        <h2 class="title-section animate-in delay-2">أهلًا بيك</h2>
        <p class="subtitle animate-in delay-3">
          الجلسة شغّالة على الزووم.<br>
          هتلاقي تفاعلات على الشاشة دي خلال الويبينار.<br>
          سيب الموبايل قدّامك ومتشيلش الصفحة دي.
        </p>
        <div class="pulse animate-in delay-4"></div>
      `,

      opening_poll: () => `
        <span class="placeholder-tag">Phase 6 — قيد التطوير</span>
        <h2 class="title-section">Poll الافتتاح</h2>
        <p class="subtitle">المرحلة دي هتُبنى لاحقًا (إرهاق ولّا احتراق)</p>
        <div class="pulse"></div>
      `,

      khalid_moment: () => `
        <span class="placeholder-tag">Phase 5 — قيد التطوير</span>
        <h2 class="title-section">لحظة خالد</h2>
        <p class="subtitle">"حصلّك إنّك بتصحى الـ٣ الفجر بحجر على صدرك؟"</p>
        <div class="pulse"></div>
      `,

      diagnostic: () => `
        <span class="placeholder-tag">Phase 2 — قيد التطوير</span>
        <h2 class="title-section">الاختبار التشخيصيّ</h2>
        <p class="subtitle">٩ مواقف هتكشفلك محورك الرئيسيّ</p>
        <div class="pulse"></div>
      `,

      type_guess: () => `
        <span class="placeholder-tag">Phase 3 — قيد التطوير</span>
        <h2 class="title-section">حدس الطابع</h2>
        <p class="subtitle">٩ كروت — اختار اللي حسّيت إنّه يخصّك</p>
        <div class="pulse"></div>
      `,

      burnout_stage: () => `
        <span class="placeholder-tag">Phase 4 — قيد التطوير</span>
        <h2 class="title-section">على Timeline الاحتراق</h2>
        <p class="subtitle">حدّد المرحلة اللي حاسس إنّك فيها</p>
        <div class="pulse"></div>
      `,

      closing: () => `
        <h2 class="title-section animate-in">شكرًا ليك</h2>
        <p class="subtitle animate-in delay-1">
          الجلسة قاربت تنتهي.<br>
          الإنسان مش مخلوق ليحترق — هو مخلوق ليتّزن.
        </p>
      `
    };
  </script>

</body>
</html>
