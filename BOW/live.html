<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0F1B2D">
  <title>منظور الفؤاد — التجربة الحيّة</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="screen">
    <div id="stage-container" class="live-stage">
      <div class="brand animate-in">
        <div class="brand-mark">م.ف</div>
        <div>
          <div class="brand-name">منظور الفؤاد</div>
          <span class="brand-tagline">جلسة حيّة</span>
        </div>
      </div>
      <div class="pulse"></div>
      <p class="text-faint">جاري الاتّصال...</p>
    </div>
  </main>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>

  <!-- Webinar modules -->
  <script src="js/session.js"></script>
  <script src="js/polls.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/type-guess.js"></script>
  <script src="js/burnout-stage.js"></script>

  <script>
    // ────────────────────────────────────────────────────────────────
    // التأكد من participant ID
    // ────────────────────────────────────────────────────────────────
    if (!getParticipantId()) {
      window.location.href = 'index.html';
    }

    const container = document.getElementById('stage-container');
    let currentStage = null;
    let isInActiveMode = false;

    startHeartbeat();

    // ────────────────────────────────────────────────────────────────
    // الاستماع للمرحلة
    // ────────────────────────────────────────────────────────────────
    subscribeToStage((stage) => {
      if (stage !== currentStage) {
        currentStage = stage;
        isInActiveMode = false;
        renderStage(stage, false);
      }
    });

    // ────────────────────────────────────────────────────────────────
    // عرض المرحلة (ready / active)
    // ────────────────────────────────────────────────────────────────
    function renderStage(stage, isActive) {
      const def = stageDefinitions[stage] || stageDefinitions.welcome;

      // Welcome page = خاصّة، مفيش ready/active
      if (def.view) {
        container.innerHTML = def.view();
        return;
      }

      if (isActive) {
        if (def.activate) {
          container.innerHTML = '';
          def.activate(container);
        } else {
          container.innerHTML = def.activeView();
        }
      } else {
        container.innerHTML = def.readyView();
        const enterBtn = container.querySelector('#enterStageBtn');
        if (enterBtn) {
          enterBtn.addEventListener('click', () => {
            isInActiveMode = true;
            renderStage(stage, true);
          });
        }
      }
    }

    // ────────────────────────────────────────────────────────────────
    // تعريف كل المراحل السبعة
    // ────────────────────────────────────────────────────────────────
    const stageDefinitions = {

      // ─── المرحلة صفر: الترحيب البسيط ─────────────────────────
      welcome: {
        view: () => `
          <div class="welcome-screen animate-in">
            <div class="brand">
              <div class="brand-mark">م.ف</div>
              <div>
                <div class="brand-name">منظور الفؤاد</div>
                <span class="brand-tagline">جلسة حيّة</span>
              </div>
            </div>
            <div class="status-pill animate-in delay-1">موجود في الجلسة</div>
            <h2 class="title-section animate-in delay-2">أهلًا بيك</h2>
            <p class="subtitle animate-in delay-3">
              الجلسة هتبدأ على الزووم.<br>
              الشاشة دي هتمشي معاك خطوة بخطوة في كل التفاعلات.
            </p>
            <p class="hint animate-in delay-4" style="margin-top: 2rem;">
              متشيلش الصفحة دي — هتيجي مرحلة جاهزة عند بداية الويبينار
            </p>
            <div class="pulse animate-in delay-4" style="margin-top: 1.5rem;"></div>
          </div>
        `
      },

      // ─── المرحلة الأولى: السؤال الافتتاحيّ ───────────────────
      welcome_question: {
        readyView: () => readyTemplate({
          title: 'سؤال واحد',
          desc: 'قبل ما نبدأ — سؤال هتجاوبه لنفسك. خد دقيقة معاه.',
          btn: 'استعدّيت'
        }),
        activate: (host) => {
          PollEngine.init(host, 'welcome_question');
        }
      },

      // ─── المرحلة الثانية: Poll الافتتاح ────────────────────────
      opening_poll: {
        readyView: () => readyTemplate({
          title: 'عبارة واحدة',
          desc: 'خمس عبارات قدّامك — اختار اللي يوصف حالتك بصدق.',
          btn: 'ابدأ التفاعل'
        }),
        activate: (host) => {
          PollEngine.init(host, 'opening_poll');
        }
      },

      // ─── المرحلة الثالثة: لحظة خالد ─────────────────────────────
      khalid_moment: {
        readyView: () => readyTemplate({
          title: 'لحظة شخصيّة',
          desc: 'سؤال واحد بصدق مع نفسك بعد قصّة خالد.',
          btn: 'دخّلني'
        }),
        activate: (host) => {
          PollEngine.init(host, 'khalid_moment');
        }
      },

      // ─── المرحلة الرابعة: الاختبار التشخيصيّ ───────────────────
      diagnostic: {
        readyView: () => readyTemplate({
          title: 'الاختبار التشخيصيّ',
          desc: 'تسع مواقف، عشر دقايق — هتكتشف محورك الرئيسيّ.',
          btn: 'ابدأ الاختبار'
        }),
        activate: (host) => {
          DiagnosticQuiz.init(host);
        }
      },

      // ─── المرحلة الخامسة: حدس الطابع ───────────────────────────
      type_guess: {
        readyView: () => readyTemplate({
          title: 'حدس الطابع',
          desc: 'تسع شخصيّات حقيقيّة — اختار اللي حسّيت إنّه يخصّك.',
          btn: 'يلّا'
        }),
        activate: (host) => {
          TypeGuess.init(host);
        }
      },

      // ─── المرحلة السادسة: مرحلة الاحتراق ───────────────────────
      burnout_stage: {
        readyView: () => readyTemplate({
          title: 'على Timeline الاحتراق',
          desc: 'إنت في أيّ مرحلة من السبعة؟ حدّد بصدق.',
          btn: 'افتح الـ Timeline'
        }),
        activate: (host) => {
          BurnoutStageApp.init(host);
        }
      },

      // ─── المرحلة السابعة: قرار الإغلاق ─────────────────────────
      closing: {
        readyView: () => readyTemplate({
          title: 'قبل ما نسيب بعض',
          desc: 'سؤال أخير — مش هياخد منّك دقيقة.',
          btn: 'اللحظة دي'
        }),
        activate: (host) => {
          PollEngine.init(host, 'closing_decision');
        }
      }
    };

    // ────────────────────────────────────────────────────────────────
    // قوالب
    // ────────────────────────────────────────────────────────────────
    function readyTemplate({ title, desc, btn }) {
      return `
        <div class="ready-card animate-scale">
          <div class="ready-pulse"></div>
          <h2 class="title-section">${title}</h2>
          <p class="subtitle" style="margin-bottom: 2rem;">${desc}</p>
          <button id="enterStageBtn" class="cta-btn">
            <span>${btn}</span>
          </button>
          <p class="hint" style="margin-top: 1.5rem;">
            خد وقتك — اضغط لمّا تكون جاهز
          </p>
        </div>
      `;
    }
  </script>

</body>
</html>
