<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0F1B2D">
  <title>منظور الفؤاد — التجربة الحيّة</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="screen">
    <div id="stage-container" class="live-stage">
      <div class="brand animate-in">
        <div class="brand-mark">م.ف</div>
        <div>
          <div class="brand-name">منظور الفؤاد</div>
          <span class="brand-tagline">جلسة حيّة</span>
        </div>
      </div>
      <div class="pulse"></div>
      <p class="text-faint">جاري الاتّصال...</p>
    </div>
  </main>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="js/session.js"></script>
  <script src="js/quiz.js"></script>

  <script>
    // ────────────────────────────────────────────────────────────────
    // التأكد من وجود participant ID
    // ────────────────────────────────────────────────────────────────
    if (!getParticipantId()) {
      window.location.href = 'index.html';
    }

    const container = document.getElementById('stage-container');
    let currentStage = null;
    let isInActiveMode = false;

    startHeartbeat();

    // ────────────────────────────────────────────────────────────────
    // الاستماع للمرحلة
    // ────────────────────────────────────────────────────────────────
    subscribeToStage((stage, sessionData) => {
      if (stage !== currentStage) {
        currentStage = stage;
        isInActiveMode = false;
        renderStage(stage, false);
      }
    });

    // ────────────────────────────────────────────────────────────────
    // عرض المرحلة (ready / active)
    // ────────────────────────────────────────────────────────────────
    function renderStage(stage, isActive) {
      const def = stageDefinitions[stage] || stageDefinitions.welcome;

      // مراحل الانتقال الأوتوماتيكيّ (welcome / closing)
      if (def.view) {
        container.innerHTML = def.view();
        return;
      }

      // مراحل Opt-in
      if (isActive) {
        // الـ active state — قد يستدعي وحدة خارجيّة (مثل Quiz)
        if (def.activate) {
          container.innerHTML = '';
          def.activate(container);
        } else {
          container.innerHTML = def.activeView();
        }
      } else {
        container.innerHTML = def.readyView();
        const enterBtn = container.querySelector('#enterStageBtn');
        if (enterBtn) {
          enterBtn.addEventListener('click', () => {
            isInActiveMode = true;
            renderStage(stage, true);
          });
        }
      }
    }

    // ────────────────────────────────────────────────────────────────
    // تعريف المراحل
    // ────────────────────────────────────────────────────────────────
    const stageDefinitions = {
      welcome: {
        view: () => `
          <div class="brand animate-in">
            <div class="brand-mark">م.ف</div>
            <div>
              <div class="brand-name">منظور الفؤاد</div>
              <span class="brand-tagline">جلسة حيّة</span>
            </div>
          </div>
          <div class="status-pill animate-in delay-1">موجود في الجلسة</div>
          <h2 class="title-section animate-in delay-2">أهلًا بيك</h2>
          <p class="subtitle animate-in delay-3">
            الجلسة شغّالة على الزووم.<br>
            خلّي الموبايل قدّامك — هتلاقي تفاعلات على الشاشة دي خلال الويبينار.
          </p>
          <div class="pulse animate-in delay-4"></div>
        `
      },

      opening_poll: {
        readyView: () => readyTemplate({
          title: 'Poll الافتتاح',
          desc: 'سؤال واحد، خمس إجابات — اختار الأقرب لإحساسك.',
          btn: 'ابدأ التفاعل'
        }),
        activeView: () => activeUnderConstruction('Poll الافتتاح', 'إرهاق ولّا احتراق؟')
      },

      khalid_moment: {
        readyView: () => readyTemplate({
          title: 'لحظة شخصيّة',
          desc: 'سؤال واحد بصدق مع نفسك — جوابك بيظهر على شاشتك إنت بسّ.',
          btn: 'دخّلني'
        }),
        activeView: () => activeUnderConstruction('لحظة خالد', 'هل ده إنت؟')
      },

      // ─── Phase 2: الاختبار التشخيصيّ كامل ───
      diagnostic: {
        readyView: () => readyTemplate({
          title: 'الاختبار التشخيصيّ',
          desc: 'تسع مواقف، عشر دقايق — هتكتشف محورك الرئيسيّ.',
          btn: 'ابدأ الاختبار'
        }),
        activate: (host) => {
          DiagnosticQuiz.init(host);
        }
      },

      type_guess: {
        readyView: () => readyTemplate({
          title: 'حدس الطابع',
          desc: 'تسع شخصيّات قدّامك — اختار اللي حسّيت إنّه يخصّك.',
          btn: 'يلّا'
        }),
        activeView: () => activeUnderConstruction('حدس الطابع', 'تسع كروت — اختار اللي يشبهك')
      },

      burnout_stage: {
        readyView: () => readyTemplate({
          title: 'على Timeline الاحتراق',
          desc: 'إنت في أيّ مرحلة من السبعة؟ حدّد بصدق.',
          btn: 'افتح الـ Timeline'
        }),
        activeView: () => activeUnderConstruction('Timeline الاحتراق', 'إنت في أيّ مرحلة؟')
      },

      closing: {
        view: () => `
          <h2 class="title-section animate-in">شكرًا ليك</h2>
          <p class="subtitle animate-in delay-1">
            الإنسان مش مخلوق ليحترق.<br>
            هو مخلوق ليتّزن.
          </p>
          <p class="text-faint animate-in delay-2" style="margin-top: 1.5rem;">
            والاتّزان — رحلة، مش لحظة.
          </p>
        `
      }
    };

    // ────────────────────────────────────────────────────────────────
    // قوالب
    // ────────────────────────────────────────────────────────────────
    function readyTemplate({ title, desc, btn }) {
      return `
        <div class="ready-card animate-scale">
          <div class="ready-pulse"></div>
          <h2 class="title-section">${title}</h2>
          <p class="subtitle" style="margin-bottom: 2rem;">${desc}</p>
          <button id="enterStageBtn" class="cta-btn">
            <span>${btn}</span>
          </button>
          <p class="hint" style="margin-top: 1.5rem;">
            خد وقتك — اضغط لمّا تكون جاهز
          </p>
        </div>
      `;
    }

    function activeUnderConstruction(title, desc) {
      return `
        <h2 class="title-section animate-in">${title}</h2>
        <p class="subtitle animate-in delay-1">${desc}</p>
        <p class="text-faint animate-in delay-2" style="margin-top: 2rem;">
          المرحلة دي بنبنيها دلوقتي — هتظهر بالكامل قريب
        </p>
        <div class="pulse animate-in delay-3"></div>
      `;
    }
  </script>

</body>
</html>
