<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0F1B2D">
  <title>منظور الفؤاد — المسجّلون</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <div class="app">

    <!-- ─── Header ─── -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">م.ف</div>
        <div>
          <div class="brand-name">منظور الفؤاد</div>
          <span class="brand-tagline">لوحة المسجّلين</span>
        </div>
      </div>
      <div class="header-meta">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusLabel">جاري الاتّصال...</span>
      </div>
    </header>

    <!-- ─── Banner host (Firebase warning if missing) ─── -->
    <div id="bannerHost"></div>

    <!-- ─── Stats strip ─── -->
    <div class="stats" id="statsStrip"></div>

    <!-- ─── Toolbar ─── -->
    <div class="toolbar">
      <div class="search-field">
        <input type="text" id="searchInput" placeholder="ابحث بالاسم أو الرقم أو الكود..." dir="auto">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </div>
      <div class="filter-segment" id="filterBar"></div>
      <div class="toolbar-right">
        <button class="btn btn-ghost btn-sm" id="exportCsvBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          تصدير CSV
        </button>
      </div>
    </div>

    <!-- ─── List ─── -->
    <div class="table-wrap" id="participantsList"></div>

    <!-- ─── Footer note ─── -->
    <div style="margin-top: 28px; text-align: center; font-size: 12px; color: var(--text-faint); line-height: 1.7;">
      كل مشارك بيكمّل الاختبار التشخيصيّ بيظهر هنا تلقائيًّا. الكود بيتولّد مرّة واحدة وبيتخزّن لحدّ ما تبعت الرسالة.<br>
      جروب الواتس: <a href="https://chat.whatsapp.com/H0RyRnCJP1bJVC6YDF0yju" target="_blank" style="color: var(--intima);">انضم</a>
      ·
      تسجيل اللقاء: <a href="https://youtu.be/AlfsYx-2z3M" target="_blank" style="color: var(--intima);">يوتيوب</a>
    </div>

  </div>

  <!-- ─── Firebase SDK + config (تتلاحق نفس الـ live.html) ─── -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>

  <!-- ─── منظور الفؤاد modules ─── -->
  <script src="js/result-codes.js"></script>
  <script src="js/axis-content.js"></script>
  <script src="js/admin-data.js"></script>
  <script src="js/admin-app.js"></script>

  <!-- ─── Demo mode (لو الرابط فيه ?demo=1) ─── -->
  <script>
    // وضع المعاينة — يحقن مشاركين تجريبيّين فقط لو ?demo=1.
    // لا يلمس Firebase، يخدم العرض المحلّيّ فقط.
    if (new URLSearchParams(location.search).get('demo') === '1') {
      const demoRows = [
        mk('فاطمة عبد العزيز','+201005551234','tamasok', {a:6,b:2,c:1}, 'haywiyya','intima', 25, false),
        mk('أحمد إبراهيم','+201112223344','haywiyya',{a:1,b:6,c:2}, 'tamasok','intima', 42, true),
        mk('ندى السيّد','+201207778899','intima',  {a:2,b:1,c:6}, 'tamasok','haywiyya', 90, false),
        mk('خالد الشاذلي','+201556667788','tamasok',{a:7,b:1,c:1}, 'intima','haywiyya', 130, false),
        mk('ليلى منصور','+201023456789','tamasok', {a:5,b:2,c:2}, 'haywiyya','intima', 8, false),
        mk('يوسف رضوان','+201198765432','haywiyya',{a:2,b:5,c:2}, 'intima','tamasok', 60, false),
        mk('سارة عاشور','+201224445566','intima',  {a:1,b:3,c:5}, 'haywiyya','tamasok', 175, true),
        mk('مهند فرغلي','+201501239876','haywiyya',{a:3,b:4,c:2}, 'tamasok','intima', 220, false),
        mk('داليا حلمي','+201156784321','intima',  {a:2,b:2,c:5}, 'haywiyya','tamasok', 12, false),
        mk('عمر صلاح','+201088997766','tamasok',  {a:4,b:3,c:2}, 'haywiyya','intima', 380, true),
        mk('هبة ربيع','+201066554433','intima',    {a:3,b:1,c:5}, 'tamasok','haywiyya', 480, false),
        mk('محمود زهران','+201509871234','tamasok',{a:6,b:1,c:2}, 'intima','haywiyya', 620, false),
      ];

      function mk(name, wa, axis, letters, sec, rep, minsAgo, sent) {
        const letterMap = { a:'tamasok', b:'haywiyya', c:'intima' };
        const counts = { tamasok:letters.a, haywiyya:letters.b, intima:letters.c };
        return {
          id: 'demo-' + Math.random().toString(36).slice(2, 10),
          name, whatsapp: wa,
          created_at: new Date(Date.now() - minsAgo * 60000),
          completed_at: new Date(Date.now() - (minsAgo - 5) * 60000),
          result: {
            main_axis: axis, secondary_axis: sec, repressed_axis: rep,
            counts, letters
          },
          result_code: null,
          whatsapp_sent_at: sent ? new Date(Date.now() - minsAgo * 30000) : null
        };
      }

      // override the list method
      const origList = MFPData.listParticipants;
      MFPData.listParticipants = async () => demoRows;
      MFPData.hasFirebase = () => true;  // pretend connected so banner hides
    }
  </script>

</body>
</html>
