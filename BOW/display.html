<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0F1B2D">
  <title>منظور الفؤاد — شاشة العرض</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { overflow: hidden; }

    .display-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 4rem;
      position: relative;
    }

    .display-brand {
      position: absolute;
      top: 2rem;
      right: 2rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      opacity: 0.85;
      z-index: 10;
    }

    .display-content {
      text-align: center;
      max-width: 1300px;
      width: 100%;
    }

    .stage-indicator {
      position: absolute;
      bottom: 2rem;
      left: 2rem;
      font-size: 0.85rem;
      color: var(--white-faint);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .stage-indicator-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--sky);
      animation: pulse 2s var(--ease-smooth) infinite;
    }

    .display-counter-wrap {
      display: flex;
      justify-content: center;
      margin-top: var(--space-lg);
    }
  </style>
</head>
<body>

  <div class="display-shell">

    <div class="display-brand">
      <div class="brand-mark">م.ف</div>
      <div>
        <div class="brand-name">منظور الفؤاد</div>
        <span class="brand-tagline">بالشراكة مع Proactive</span>
      </div>
    </div>

    <div id="display-content" class="display-content">
      <h1 class="display-title animate-in">من الاحتراق<br>إلى استعادة الاتّزان</h1>
      <p class="display-subtitle animate-in delay-1">جلسة حيّة — ساعتان وثلث</p>
      <div class="display-counter-wrap animate-in delay-2">
        <div class="display-counter">
          <div class="display-counter-icon"></div>
          <span class="display-counter-text">المتّصلون الآن:</span>
          <span class="display-counter-num" id="liveCount">٠</span>
        </div>
      </div>
    </div>

    <div class="stage-indicator">
      <div class="stage-indicator-dot"></div>
      <span id="stageLabel">في انتظار الجلسة</span>
    </div>

  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="js/session.js"></script>

  <script>
    const content = document.getElementById('display-content');
    const stageLabel = document.getElementById('stageLabel');
    let currentStage = null;
    let activeStageUnsub = null;

    function toArabic(n) {
      const map = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
      return String(n).split('').map(d => map[+d] ?? d).join('');
    }

    const AXES = {
      tamasok:  { name: 'التماسك', q: 'هل أنا بخير؟', color: '#D4A24E', glow: 'rgba(212, 162, 78, 0.4)' },
      haywiyya: { name: 'الحيوية',  q: 'هل أنا حيّ؟',  color: '#E8543F', glow: 'rgba(232, 84, 63, 0.4)' },
      intima:   { name: 'الانتماء', q: 'هل أنا منتمي؟', color: '#4ABEDF', glow: 'rgba(74, 190, 223, 0.4)' }
    };

    // الطبائع منظّمة بالمرايا (بنفس ترتيب البطايق في live.html)
    const MIRROR_GROUPS_DISPLAY = [
      {
        mirror: 'الاحتواء',
        color: '#D4A24E',
        glow: 'rgba(212, 162, 78, 0.3)',
        types: [
          { id: 1, name: 'الدقيق المصلح',  persona: 'ليلى', color: '#D4A24E' },
          { id: 3, name: 'المُنجِز المؤثّر', persona: 'كريم', color: '#F0B859' },
          { id: 5, name: 'العقل الفيّاض',  persona: 'عمر',  color: '#5BA8B8' }
        ]
      },
      {
        mirror: 'التعبير الكامل',
        color: '#9B7EBD',
        glow: 'rgba(155, 126, 189, 0.3)',
        types: [
          { id: 4, name: 'العميق الأصيل',   persona: 'سلمى', color: '#9B7EBD' },
          { id: 6, name: 'الإرادة المتجسّدة', persona: 'طارق', color: '#7B92C7' },
          { id: 8, name: 'القوّة الحقيقيّة',  persona: 'سامي', color: '#C84028' }
        ]
      },
      {
        mirror: 'التحويل',
        color: '#4ABEDF',
        glow: 'rgba(74, 190, 223, 0.3)',
        types: [
          { id: 2, name: 'الكريم الحنون',  persona: 'ندى',   color: '#E58FA2' },
          { id: 7, name: 'الحرّ المتدفّق',  persona: 'أحمد',  color: '#E8543F' },
          { id: 9, name: 'السلام الداخليّ', persona: 'هانم',  color: '#4ABEDF' }
        ]
      }
    ];

    const TYPES_DISPLAY = MIRROR_GROUPS_DISPLAY.flatMap(g => g.types);

    const STAGES_DISPLAY = [
      { num: 1, name: 'الاندفاع',  color: '#F5D78E' },
      { num: 2, name: 'الإهمال',   color: '#E8B86E' },
      { num: 3, name: 'الإزاحة',   color: '#E89954' },
      { num: 4, name: 'الانسحاب',  color: '#E47844' },
      { num: 5, name: 'التبلّد',   color: '#DC5A38' },
      { num: 6, name: 'الفراغ',    color: '#C84028' },
      { num: 7, name: 'الانهيار',  color: '#9E2818' }
    ];

    // عدّاد المتّصلين
    subscribeToParticipantCount((active, total) => {
      const el = document.getElementById('liveCount');
      if (el) el.textContent = toArabic(active);
      const elTotal = document.getElementById('totalParticipants');
      if (elTotal) elTotal.textContent = toArabic(active);
    });

    // تغييرات المرحلة
    subscribeToStage((stage) => {
      if (stage !== currentStage) {
        if (activeStageUnsub) {
          activeStageUnsub();
          activeStageUnsub = null;
        }
        currentStage = stage;
        const meta = STAGES[stage] || STAGES.welcome;
        stageLabel.textContent = meta.label;
        renderStage(stage);
      }
    });

    function renderStage(stage) {
      const view = views[stage] || views.welcome;
      content.innerHTML = view();
      if (initializers[stage]) {
        initializers[stage]();
      }
    }

    // ────────────────────────────────────────────────────────────────
    // قوالب الشاشات
    // ────────────────────────────────────────────────────────────────
    const views = {
      welcome: () => `
        <h1 class="display-title animate-in">من الاحتراق<br>إلى استعادة الاتّزان</h1>
        <p class="display-subtitle animate-in delay-1">جلسة حيّة — ساعتان وثلث</p>
        <div class="display-counter-wrap animate-in delay-2">
          <div class="display-counter">
            <div class="display-counter-icon"></div>
            <span class="display-counter-text">المتّصلون الآن:</span>
            <span class="display-counter-num" id="liveCount">٠</span>
          </div>
        </div>
        <p class="display-hint animate-in delay-3" style="margin-top: 3rem;">
          افتحوا الرابط في الشات على موبايلاتكم — كل التفاعلات هتيجي على الموبايل
        </p>
      `,

      welcome_question: () => `
        <div class="display-poll-screen animate-fade">
          <p class="display-poll-headline">السؤال الافتتاحيّ</p>
          <h1 class="display-title">إمتى آخر مرّة حسّيت إنّك كويّس فعلًا؟</h1>
          <p class="display-poll-note">مش بس ماشي حالك... كويّس فعلًا.</p>

          <div class="display-poll-bars" id="welcomeBars">
            ${[
              { id: 'recent', text: 'إمبارح أو الأسبوع اللي فات', color: '#7DD3F0' },
              { id: 'month',  text: 'شهر مضى تقريبًا',           color: '#D4A24E' },
              { id: 'far',    text: 'أكتر من شهر، مش متذكّر',    color: '#E89954' },
              { id: 'never',  text: 'بصدق، مش فاكر آخر مرّة',     color: '#E8543F' }
            ].map(o => `
              <div class="display-poll-bar" data-id="${o.id}" style="--c: ${o.color};">
                <div class="display-poll-bar-text">${o.text}</div>
                <div class="display-poll-bar-track">
                  <div class="display-poll-bar-fill" style="width: 0%;"></div>
                </div>
                <div class="display-poll-bar-stat">
                  <span class="display-poll-percent">٠٪</span>
                  <span class="display-poll-count">٠</span>
                </div>
              </div>
            `).join('')}
          </div>

          <div class="diagnostic-status">
            <span id="completedCount">٠</span>
            <span class="diagnostic-status-sep">من</span>
            <span id="totalParticipants">٠</span>
            <span class="diagnostic-status-label">جاوبوا</span>
          </div>
        </div>
      `,

      opening_poll: () => `
        <div class="display-poll-screen animate-fade">
          <p class="display-poll-headline">Poll الافتتاح</p>
          <h1 class="display-title">إرهاق ولّا احتراق؟</h1>

          <div class="display-poll-bars" id="openingBars">
            ${[
              { id: 'physical', text: 'تعبان جسديًّا، بس قلبي وعقلي معايا', color: '#7DD3F0' },
              { id: 'distant',  text: 'حاضر بجسمي، بعيد بقلبي',           color: '#D4A24E' },
              { id: 'empty',    text: 'بنجز ومنتج، بس فاضي من جوّا',       color: '#E89954' },
              { id: 'all',      text: 'حاسس بكل اللي فات في نفس الوقت',    color: '#E8543F' },
              { id: 'fine',     text: 'بخير فعلًا — جاي أتعلّم',           color: '#A8B8CD' }
            ].map(o => `
              <div class="display-poll-bar" data-id="${o.id}" style="--c: ${o.color};">
                <div class="display-poll-bar-text">${o.text}</div>
                <div class="display-poll-bar-track">
                  <div class="display-poll-bar-fill" style="width: 0%;"></div>
                </div>
                <div class="display-poll-bar-stat">
                  <span class="display-poll-percent">٠٪</span>
                  <span class="display-poll-count">٠</span>
                </div>
              </div>
            `).join('')}
          </div>

          <div class="diagnostic-status">
            <span id="completedCount">٠</span>
            <span class="diagnostic-status-sep">من</span>
            <span id="totalParticipants">٠</span>
            <span class="diagnostic-status-label">جاوبوا</span>
          </div>
        </div>
      `,

      khalid_moment: () => `
        <div class="display-poll-screen animate-fade">
          <p class="display-poll-headline">لحظة خالد</p>
          <h1 class="display-title">حصلّك تصحى الـ٣ الفجر بحجر على صدرك؟</h1>

          <div class="display-poll-bars compact" id="khalidBars">
            ${[
              { id: 'often',     text: 'أيوه، كتير',     color: '#E8543F' },
              { id: 'sometimes', text: 'حصل مرّات قليلة', color: '#D4A24E' },
              { id: 'never',     text: 'لأ، ما حصلش',    color: '#7DD3F0' }
            ].map(o => `
              <div class="display-poll-bar" data-id="${o.id}" style="--c: ${o.color};">
                <div class="display-poll-bar-text">${o.text}</div>
                <div class="display-poll-bar-track">
                  <div class="display-poll-bar-fill" style="width: 0%;"></div>
                </div>
                <div class="display-poll-bar-stat">
                  <span class="display-poll-percent">٠٪</span>
                  <span class="display-poll-count">٠</span>
                </div>
              </div>
            `).join('')}
          </div>

          <div class="diagnostic-status">
            <span id="completedCount">٠</span>
            <span class="diagnostic-status-sep">من</span>
            <span id="totalParticipants">٠</span>
            <span class="diagnostic-status-label">جاوبوا</span>
          </div>
        </div>
      `,

      diagnostic: () => `
        <div class="diagnostic-display animate-fade">
          <h1 class="display-title">توزيع المحاور</h1>
          <p class="display-subtitle">الجمهور الحاضر — لحظة بلحظة</p>

          <div class="diagnostic-chart" id="diagnosticChart">
            ${['tamasok', 'haywiyya', 'intima'].map(key => {
              const ax = AXES[key];
              return `
                <div class="chart-column" data-axis="${key}" style="--c: ${ax.color}; --g: ${ax.glow};">
                  <div class="chart-question">${ax.q}</div>
                  <div class="chart-bar-wrap">
                    <div class="chart-bar-track">
                      <div class="chart-bar-fill" style="height: 0%;"></div>
                    </div>
                    <div class="chart-percent">٠٪</div>
                  </div>
                  <div class="chart-axis-info">
                    <div class="chart-axis-name">${ax.name}</div>
                    <div class="chart-axis-count">٠ شخص</div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          <div class="diagnostic-status">
            <span id="completedCount">٠</span>
            <span class="diagnostic-status-sep">من</span>
            <span id="totalParticipants">٠</span>
            <span class="diagnostic-status-label">أكملوا الاختبار</span>
          </div>
        </div>
      `,

      // ════════════════════════════════════════════════════════════
      // ⭐ المرايا التلاتة — Mirror Comparisons
      // ════════════════════════════════════════════════════════════

      mirror_containment: () => mirrorPollView({
        mirrorLabel: 'المحور الأوّل في مرآة المشاعر',
        mirrorName: 'الاحتواء',
        subtitle: 'بيحبس الشعور قبل ما يخرج',
        question: 'في معالجة مشاعرك القويّة — إنت أقرب لمين؟',
        containerId: 'containmentBars',
        options: [
          { id: 'leila',  persona: 'ليلى', name: 'الدقيق المصلح',   line: 'بتحبس الشعور قبل ما يكتمل', color: '#D4A24E' },
          { id: 'kareem', persona: 'كريم', name: 'المُنجِز المؤثّر', line: 'بيؤجّل الشعور للمهمّة الجاية', color: '#F0B859' },
          { id: 'omar',   persona: 'عمر',  name: 'العقل الفيّاض',   line: 'بينقل الشعور لمساحة معرفيّة', color: '#5BA8B8' }
        ]
      }),

      mirror_full_expression: () => mirrorPollView({
        mirrorLabel: 'المحور الثاني في مرآة المشاعر',
        mirrorName: 'التعبير الكامل',
        subtitle: 'بيخرج الشعور بقوّته بس مش بيمشي',
        question: 'في خروج مشاعرك القويّة — إنت أقرب لمين؟',
        containerId: 'expressionBars',
        options: [
          { id: 'salma', persona: 'سلمى', name: 'العميق الأصيل',    line: 'بتغوص في الإحساس وتمتدّ معه',     color: '#9B7EBD' },
          { id: 'tariq', persona: 'طارق', name: 'الإرادة المتجسّدة', line: 'بيخرج كسؤال يبحث عن طمأنينة',     color: '#7B92C7' },
          { id: 'samy',  persona: 'سامي', name: 'القوّة الحقيقيّة',   line: 'بيخرج فوريّ، ثمّ يبحث عن وقود', color: '#C84028' }
        ]
      }),

      mirror_transformation: () => mirrorPollView({
        mirrorLabel: 'المحور الثالث في مرآة المشاعر',
        mirrorName: 'التحويل',
        subtitle: 'بيحوّل الشعور قبل ما يصل للوعي',
        question: 'في تحويل مشاعرك — إنت أقرب لمين؟',
        containerId: 'transformationBars',
        options: [
          { id: 'nada',  persona: 'ندى',   name: 'الكريم الحنون',  line: 'احتياجها بيتحوّل لـ "من يحتاجني؟"', color: '#E58FA2' },
          { id: 'ahmed', persona: 'أحمد',  name: 'الحرّ المتدفّق',  line: 'ألمه بيتحوّل لـ "ما الخطّة الجاية؟"', color: '#E8543F' },
          { id: 'hanem', persona: 'هانم',  name: 'السلام الداخليّ', line: 'غضبها بيتحوّل لـ "مش مهمّ"',         color: '#4ABEDF' }
        ]
      }),

      // ════════════════════════════════════════════════════════════
      // ⭐ Type Guess — منظّم بالمرايا + بيعرض الـ Echoes
      // ════════════════════════════════════════════════════════════
      type_guess: () => `
        <div class="tg-display animate-fade">
          <h1 class="display-title">الإطار الكامل</h1>
          <p class="display-subtitle">التسعة طبائع منظّمين على المرايا التلاتة</p>

          <div class="tg-display-mirrors" id="tgDisplayMirrors">
            ${MIRROR_GROUPS_DISPLAY.map((group, idx) => `
              <div class="tg-display-mirror-row" style="--mc: ${group.color}; --mg: ${group.glow};">
                <div class="tg-display-mirror-label">
                  <span class="tg-mirror-idx">المحور ${toArabic(idx + 1)}</span>
                  <span class="tg-mirror-name">${group.mirror}</span>
                </div>
                <div class="tg-display-mirror-cards">
                  ${group.types.map(t => `
                    <div class="tg-display-card" data-id="${t.id}" style="--c: ${t.color};">
                      <div class="tg-display-num">${toArabic(t.id)}</div>
                      <div class="tg-display-name">${t.name}</div>
                      <div class="tg-display-persona">${t.persona}</div>
                      <div class="tg-display-count">٠</div>
                    </div>
                  `).join('')}
                </div>
              </div>
            `).join('')}
          </div>

          <div class="diagnostic-status">
            <span id="completedCount">٠</span>
            <span class="diagnostic-status-sep">من</span>
            <span id="totalParticipants">٠</span>
            <span class="diagnostic-status-label">اختاروا بصمتهم</span>
          </div>
        </div>
      `,

      burnout_stage: () => `
        <div class="bs-display animate-fade">
          <h1 class="display-title">على Timeline الاحتراق</h1>
          <p class="display-subtitle">توزيع الجمهور على المراحل السبعة</p>

          <div class="bs-display-timeline" id="bsDisplayTimeline">
            ${STAGES_DISPLAY.map(s => `
              <div class="bs-display-stage" data-num="${s.num}" style="--c: ${s.color};">
                <div class="bs-display-stage-cluster"></div>
                <div class="bs-display-stage-bar"></div>
                <div class="bs-display-stage-num">${toArabic(s.num)}</div>
                <div class="bs-display-stage-name">${s.name}</div>
                <div class="bs-display-stage-count">٠</div>
              </div>
            `).join('')}
          </div>

          <div class="diagnostic-status">
            <span id="completedCount">٠</span>
            <span class="diagnostic-status-sep">من</span>
            <span id="totalParticipants">٠</span>
            <span class="diagnostic-status-label">حدّدوا مرحلتهم</span>
          </div>
        </div>
      `,

      closing: () => `
        <div class="display-poll-screen animate-fade">
          <p class="display-poll-headline">قبل ما نسيب بعض</p>
          <h1 class="display-title">هل ده اللحظة اللي قرّرت؟</h1>
          <p class="display-poll-note">القرار قرارك — وكل إجابة محترمة</p>

          <div class="display-poll-bars compact" id="closingBars">
            ${[
              { id: 'yes',      text: 'أيوه — بدأت دلوقتي',       color: '#7DD3F0' },
              { id: 'thinking', text: 'محتاج أفكّر شويّة',         color: '#D4A24E' },
              { id: 'later',    text: 'لسه ما جاش الوقت',          color: '#A8B8CD' }
            ].map(o => `
              <div class="display-poll-bar" data-id="${o.id}" style="--c: ${o.color};">
                <div class="display-poll-bar-text">${o.text}</div>
                <div class="display-poll-bar-track">
                  <div class="display-poll-bar-fill" style="width: 0%;"></div>
                </div>
                <div class="display-poll-bar-stat">
                  <span class="display-poll-percent">٠٪</span>
                  <span class="display-poll-count">٠</span>
                </div>
              </div>
            `).join('')}
          </div>

          <div class="closing-callout" id="closingCallout">
            <div class="closing-callout-num" id="closingYesCount">٠</div>
            <div class="closing-callout-text">شخص أعلنوا بداية رحلتهم</div>
          </div>
        </div>
      `
    };

    // ────────────────────────────────────────────────────────────────
    // قالب موحّد لشاشات المرايا (٣ بطايق Personas مع Bars)
    // ────────────────────────────────────────────────────────────────
    function mirrorPollView({ mirrorLabel, mirrorName, subtitle, question, containerId, options }) {
      return `
        <div class="display-mirror-screen animate-fade">
          <p class="display-poll-headline">${mirrorLabel}</p>
          <h1 class="display-mirror-title">${mirrorName}</h1>
          <p class="display-mirror-subtitle">${subtitle}</p>
          <h2 class="display-mirror-question">${question}</h2>

          <div class="display-mirror-cards" id="${containerId}">
            ${options.map(o => `
              <div class="display-mirror-card" data-id="${o.id}" style="--c: ${o.color};">
                <div class="display-mirror-card-persona">${o.persona}</div>
                <div class="display-mirror-card-name">${o.name}</div>
                <div class="display-mirror-card-line">${o.line}</div>
                <div class="display-mirror-card-bar-wrap">
                  <div class="display-mirror-card-bar">
                    <div class="display-mirror-card-fill" style="width: 0%;"></div>
                  </div>
                </div>
                <div class="display-mirror-card-stats">
                  <span class="display-mirror-percent">٠٪</span>
                  <span class="display-mirror-count">٠</span>
                </div>
              </div>
            `).join('')}
          </div>

          <div class="diagnostic-status">
            <span id="completedCount">٠</span>
            <span class="diagnostic-status-sep">من</span>
            <span id="totalParticipants">٠</span>
            <span class="diagnostic-status-label">اختاروا</span>
          </div>
        </div>
      `;
    }

    // ────────────────────────────────────────────────────────────────
    // Initializers
    // ────────────────────────────────────────────────────────────────
    const initializers = {
      welcome_question: () => subscribeToPollLive('welcome_question', 'welcomeBars'),
      opening_poll:     () => subscribeToPollLive('opening_poll', 'openingBars'),
      khalid_moment:    () => subscribeToPollLive('khalid_moment', 'khalidBars'),

      // ⭐ Mirror initializers
      mirror_containment:     () => subscribeToMirrorPoll('mirror_containment', 'containmentBars'),
      mirror_full_expression: () => subscribeToMirrorPoll('mirror_full_expression', 'expressionBars'),
      mirror_transformation:  () => subscribeToMirrorPoll('mirror_transformation', 'transformationBars'),

      closing: () => subscribeToPollLive('closing_decision', 'closingBars', { showYesCount: true }),

      diagnostic: () => {
        activeStageUnsub = subscribeToStageResults('diagnostic', (results) => {
          updateDiagnosticChart(results);
        });
      },

      type_guess: () => {
        activeStageUnsub = subscribeToStageResults('type_guess', (results) => {
          updateTypeGuessGrid(results);
        });
      },

      burnout_stage: () => {
        activeStageUnsub = subscribeToStageResults('burnout_stage', (results) => {
          updateBurnoutTimeline(results);
        });
      }
    };

    // ────────────────────────────────────────────────────────────────
    // ⚡ Live Updates — Generic poll (vertical bars)
    // ────────────────────────────────────────────────────────────────
    function subscribeToPollLive(stageKey, containerId, opts = {}) {
      activeStageUnsub = subscribeToStageResults(stageKey, (results) => {
        const counts = {};
        results.forEach(r => {
          const id = r.result?.answer_id;
          if (id) counts[id] = (counts[id] || 0) + 1;
        });
        updatePollDisplay(containerId, counts, results.length, opts);
      });
    }

    function updatePollDisplay(containerId, counts, total, opts = {}) {
      const cont = document.getElementById(containerId);
      if (!cont) return;

      const bars = cont.querySelectorAll('.display-poll-bar');
      bars.forEach(bar => {
        const id = bar.dataset.id;
        const c = counts[id] || 0;
        const pct = total > 0 ? Math.round((c / total) * 100) : 0;

        bar.querySelector('.display-poll-bar-fill').style.width = `${pct}%`;
        bar.querySelector('.display-poll-percent').textContent = `${toArabic(pct)}٪`;
        bar.querySelector('.display-poll-count').textContent = toArabic(c);
      });

      const completedEl = document.getElementById('completedCount');
      if (completedEl) completedEl.textContent = toArabic(total);

      if (opts.showYesCount) {
        const yesCount = counts['yes'] || 0;
        const yesEl = document.getElementById('closingYesCount');
        if (yesEl) yesEl.textContent = toArabic(yesCount);
      }
    }

    // ────────────────────────────────────────────────────────────────
    // ⚡ Live Updates — Mirror Polls (3 personas with horizontal bars)
    // ────────────────────────────────────────────────────────────────
    function subscribeToMirrorPoll(stageKey, containerId) {
      activeStageUnsub = subscribeToStageResults(stageKey, (results) => {
        const counts = {};
        results.forEach(r => {
          const id = r.result?.answer_id;
          if (id) counts[id] = (counts[id] || 0) + 1;
        });
        updateMirrorDisplay(containerId, counts, results.length);
      });
    }

    function updateMirrorDisplay(containerId, counts, total) {
      const cont = document.getElementById(containerId);
      if (!cont) return;

      const cards = cont.querySelectorAll('.display-mirror-card');
      cards.forEach(card => {
        const id = card.dataset.id;
        const c = counts[id] || 0;
        const pct = total > 0 ? Math.round((c / total) * 100) : 0;

        card.querySelector('.display-mirror-card-fill').style.width = `${pct}%`;
        card.querySelector('.display-mirror-percent').textContent = `${toArabic(pct)}٪`;
        card.querySelector('.display-mirror-count').textContent = toArabic(c);

        // Highlight the leading card
        card.classList.toggle('leading', c > 0 && c === Math.max(...Object.values(counts), 0));
      });

      const completedEl = document.getElementById('completedCount');
      if (completedEl) completedEl.textContent = toArabic(total);
    }

    // ────────────────────────────────────────────────────────────────
    // Diagnostic Chart
    // ────────────────────────────────────────────────────────────────
    function updateDiagnosticChart(results) {
      const counts = { tamasok: 0, haywiyya: 0, intima: 0 };
      results.forEach(r => {
        if (r.result?.main_axis) counts[r.result.main_axis]++;
      });

      const total = counts.tamasok + counts.haywiyya + counts.intima;
      const max = Math.max(counts.tamasok, counts.haywiyya, counts.intima, 1);

      ['tamasok', 'haywiyya', 'intima'].forEach(key => {
        const col = document.querySelector(`.chart-column[data-axis="${key}"]`);
        if (!col) return;
        const c = counts[key];
        const heightPct = max > 0 ? (c / max) * 100 : 0;
        const sharePct = total > 0 ? Math.round((c / total) * 100) : 0;

        col.querySelector('.chart-bar-fill').style.height = `${heightPct}%`;
        col.querySelector('.chart-percent').textContent = `${toArabic(sharePct)}٪`;
        col.querySelector('.chart-axis-count').textContent = `${toArabic(c)} شخص`;
      });

      const completedEl = document.getElementById('completedCount');
      if (completedEl) completedEl.textContent = toArabic(total);
    }

    // ────────────────────────────────────────────────────────────────
    // Type Guess Grid (organized by mirrors)
    // ────────────────────────────────────────────────────────────────
    function updateTypeGuessGrid(results) {
      const counts = {};
      let totalParticipants = 0;
      results.forEach(r => {
        totalParticipants++;
        const selected = r.result?.selected_types || [];
        selected.forEach(id => {
          counts[id] = (counts[id] || 0) + 1;
        });
      });

      const max = Math.max(...Object.values(counts), 1);

      TYPES_DISPLAY.forEach(t => {
        const card = document.querySelector(`.tg-display-card[data-id="${t.id}"]`);
        if (!card) return;
        const c = counts[t.id] || 0;
        const intensity = max > 0 ? c / max : 0;

        card.style.setProperty('--intensity', intensity);
        card.classList.toggle('has-votes', c > 0);
        card.querySelector('.tg-display-count').textContent = toArabic(c);
      });

      const completedEl = document.getElementById('completedCount');
      if (completedEl) completedEl.textContent = toArabic(totalParticipants);
    }

    // ────────────────────────────────────────────────────────────────
    // Burnout Timeline
    // ────────────────────────────────────────────────────────────────
    function updateBurnoutTimeline(results) {
      const counts = {};
      results.forEach(r => {
        const num = r.result?.stage_num;
        if (num) counts[num] = (counts[num] || 0) + 1;
      });

      const total = Object.values(counts).reduce((a, b) => a + b, 0);
      const max = Math.max(...Object.values(counts), 1);

      STAGES_DISPLAY.forEach(s => {
        const stageEl = document.querySelector(`.bs-display-stage[data-num="${s.num}"]`);
        if (!stageEl) return;
        const c = counts[s.num] || 0;
        const heightPct = max > 0 ? (c / max) * 100 : 0;

        const bar = stageEl.querySelector('.bs-display-stage-bar');
        if (bar) bar.style.height = `${heightPct}%`;

        stageEl.querySelector('.bs-display-stage-count').textContent = toArabic(c);
        stageEl.classList.toggle('has-votes', c > 0);
      });

      const completedEl = document.getElementById('completedCount');
      if (completedEl) completedEl.textContent = toArabic(total);
    }
  </script>

</body>
</html>
