<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0F1B2D">
  <title>منظور الفؤاد — شاشة العرض</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { overflow: hidden; }

    .display-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 4rem;
      position: relative;
    }

    .display-brand {
      position: absolute;
      top: 2rem;
      right: 2rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      opacity: 0.85;
      z-index: 10;
    }

    .display-content {
      text-align: center;
      max-width: 1300px;
      width: 100%;
    }

    .stage-indicator {
      position: absolute;
      bottom: 2rem;
      left: 2rem;
      font-size: 0.85rem;
      color: var(--white-faint);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .stage-indicator-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--sky);
      animation: pulse 2s var(--ease-smooth) infinite;
    }

    .display-counter-wrap {
      display: flex;
      justify-content: center;
      margin-top: var(--space-lg);
    }
  </style>
</head>
<body>

  <div class="display-shell">

    <div class="display-brand">
      <div class="brand-mark">م.ف</div>
      <div>
        <div class="brand-name">منظور الفؤاد</div>
        <span class="brand-tagline">بالشراكة مع Proactive</span>
      </div>
    </div>

    <div id="display-content" class="display-content">
      <h1 class="display-title animate-in">من الاحتراق<br>إلى استعادة الاتّزان</h1>
      <p class="display-subtitle animate-in delay-1">جلسة حيّة — ساعتان وثلث</p>

      <div class="display-counter-wrap animate-in delay-2">
        <div class="display-counter">
          <div class="display-counter-icon"></div>
          <span class="display-counter-text">المتّصلون الآن:</span>
          <span class="display-counter-num" id="liveCount">٠</span>
        </div>
      </div>
    </div>

    <div class="stage-indicator">
      <div class="stage-indicator-dot"></div>
      <span id="stageLabel">في انتظار الجلسة</span>
    </div>

  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="js/session.js"></script>

  <script>
    const content = document.getElementById('display-content');
    const stageLabel = document.getElementById('stageLabel');
    let currentStage = null;
    let activeStageUnsub = null; // cleanup للمرحلة السابقة

    // ────────────────────────────────────────────────────────────────
    // أرقام عربيّة
    // ────────────────────────────────────────────────────────────────
    function toArabic(n) {
      const map = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
      return String(n).split('').map(d => map[+d] ?? d).join('');
    }

    // ────────────────────────────────────────────────────────────────
    // عدّاد المتّصلين
    // ────────────────────────────────────────────────────────────────
    subscribeToParticipantCount((active, total) => {
      const el = document.getElementById('liveCount');
      if (el) el.textContent = toArabic(active);
    });

    // ────────────────────────────────────────────────────────────────
    // تغييرات المرحلة
    // ────────────────────────────────────────────────────────────────
    subscribeToStage((stage, data) => {
      if (stage !== currentStage) {
        // تنظيف الـ listener السابق
        if (activeStageUnsub) {
          activeStageUnsub();
          activeStageUnsub = null;
        }
        currentStage = stage;
        const meta = STAGES[stage] || STAGES.welcome;
        stageLabel.textContent = meta.label;
        renderStage(stage);
      }
    });

    // ────────────────────────────────────────────────────────────────
    // Renderer
    // ────────────────────────────────────────────────────────────────
    function renderStage(stage) {
      const view = views[stage] || views.welcome;
      content.innerHTML = view();
      // Initializer لكل مرحلة (لو فيها logic خاصّة)
      if (initializers[stage]) {
        initializers[stage]();
      }
    }

    // ────────────────────────────────────────────────────────────────
    // قوالب الشاشات
    // ────────────────────────────────────────────────────────────────
    const views = {
      welcome: () => `
        <h1 class="display-title animate-in">من الاحتراق<br>إلى استعادة الاتّزان</h1>
        <p class="display-subtitle animate-in delay-1">جلسة حيّة — ساعتان وثلث</p>
        <div class="display-counter-wrap animate-in delay-2">
          <div class="display-counter">
            <div class="display-counter-icon"></div>
            <span class="display-counter-text">المتّصلون الآن:</span>
            <span class="display-counter-num" id="liveCount">٠</span>
          </div>
        </div>
      `,

      opening_poll: () => `
        <h1 class="display-title animate-in">Poll الافتتاح</h1>
        <p class="display-subtitle animate-in delay-1">إرهاق ولّا احتراق؟</p>
      `,

      khalid_moment: () => `
        <h1 class="display-title animate-in">لحظة خالد</h1>
        <p class="display-subtitle animate-in delay-1">"بتصحى الـ٣ الفجر؟"</p>
      `,

      // ─── Phase 2: chart التشخيصيّ ───
      diagnostic: () => `
        <div class="diagnostic-display animate-fade">
          <h1 class="display-title">توزيع المحاور</h1>
          <p class="display-subtitle">الجمهور الحاضر — لحظة بلحظة</p>

          <div class="diagnostic-chart" id="diagnosticChart">
            ${['tamasok', 'haywiyya', 'intima'].map(key => {
              const ax = AXES[key];
              return `
                <div class="chart-column" data-axis="${key}" style="--c: ${ax.color}; --g: ${ax.glow};">
                  <div class="chart-question">${ax.question}</div>
                  <div class="chart-bar-wrap">
                    <div class="chart-bar-track">
                      <div class="chart-bar-fill" style="height: 0%;"></div>
                    </div>
                    <div class="chart-percent">٠٪</div>
                  </div>
                  <div class="chart-axis-info">
                    <div class="chart-axis-name">${ax.name}</div>
                    <div class="chart-axis-count">٠ شخص</div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          <div class="diagnostic-status">
            <span id="completedCount">٠</span>
            <span class="diagnostic-status-sep">من</span>
            <span id="totalParticipants">٠</span>
            <span class="diagnostic-status-label">أكملوا الاختبار</span>
          </div>
        </div>
      `,

      type_guess: () => `
        <h1 class="display-title animate-in">حدس الطابع</h1>
        <p class="display-subtitle animate-in delay-1">تسع شخصيّات — اختار اللي يشبهك</p>
      `,

      burnout_stage: () => `
        <h1 class="display-title animate-in">على Timeline الاحتراق</h1>
        <p class="display-subtitle animate-in delay-1">إنت في أيّ مرحلة؟</p>
      `,

      closing: () => `
        <h1 class="display-title animate-in">الإنسان مش مخلوق ليحترق</h1>
        <p class="display-subtitle animate-in delay-1">هو مخلوق ليتّزن</p>
        <p class="display-subtitle animate-in delay-2" style="opacity:0.6;">والاتّزان — رحلة، مش لحظة</p>
      `
    };

    // ────────────────────────────────────────────────────────────────
    // ميتاداتا المحاور للعرض (نسخة مصغّرة من quiz.js)
    // ────────────────────────────────────────────────────────────────
    const AXES = {
      tamasok:  {
        name: 'التماسك',
        question: 'هل أنا بخير؟',
        color: '#D4A24E',
        glow: 'rgba(212, 162, 78, 0.4)'
      },
      haywiyya: {
        name: 'الحيوية',
        question: 'هل أنا حيّ؟',
        color: '#E8543F',
        glow: 'rgba(232, 84, 63, 0.4)'
      },
      intima:   {
        name: 'الانتماء',
        question: 'هل أنا منتمي؟',
        color: '#4ABEDF',
        glow: 'rgba(74, 190, 223, 0.4)'
      }
    };

    // ────────────────────────────────────────────────────────────────
    // Initializers — كل مرحلة محتاجة logic خاصّة بعد الـ render
    // ────────────────────────────────────────────────────────────────
    const initializers = {
      diagnostic: () => {
        // اشتراك Live على نتائج الاختبار التشخيصيّ
        activeStageUnsub = subscribeToStageResults('diagnostic', (results) => {
          updateDiagnosticChart(results);
        });

        // عدد المشاركين الإجماليّ (للـ "X من Y")
        fetchParticipantCounts().then(({ active }) => {
          const el = document.getElementById('totalParticipants');
          if (el) el.textContent = toArabic(active);
        });
      }
    };

    // ────────────────────────────────────────────────────────────────
    // تحديث Chart الاختبار التشخيصيّ Live
    // ────────────────────────────────────────────────────────────────
    function updateDiagnosticChart(results) {
      const counts = { tamasok: 0, haywiyya: 0, intima: 0 };
      results.forEach(r => {
        if (r.result?.main_axis) counts[r.result.main_axis]++;
      });

      const total = counts.tamasok + counts.haywiyya + counts.intima;
      const max = Math.max(counts.tamasok, counts.haywiyya, counts.intima, 1);

      ['tamasok', 'haywiyya', 'intima'].forEach(key => {
        const col = document.querySelector(`.chart-column[data-axis="${key}"]`);
        if (!col) return;
        const c = counts[key];
        const heightPct = max > 0 ? (c / max) * 100 : 0;
        const sharePct = total > 0 ? Math.round((c / total) * 100) : 0;

        const fill = col.querySelector('.chart-bar-fill');
        const percent = col.querySelector('.chart-percent');
        const countEl = col.querySelector('.chart-axis-count');

        fill.style.height = `${heightPct}%`;
        percent.textContent = `${toArabic(sharePct)}٪`;
        countEl.textContent = `${toArabic(c)} ${c === 1 ? 'شخص' : 'شخص'}`;
      });

      const completedEl = document.getElementById('completedCount');
      if (completedEl) completedEl.textContent = toArabic(total);
    }
  </script>

</body>
</html>
