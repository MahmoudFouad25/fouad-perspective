<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0F1B2D">
  <title>منظور الفؤاد — شاشة العرض</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { overflow: hidden; }

    .display-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem;
      position: relative;
    }

    .display-brand {
      position: absolute;
      top: 2rem;
      right: 2rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      opacity: 0.85;
    }

    .display-content {
      text-align: center;
      max-width: 1100px;
      width: 100%;
    }

    .stage-indicator {
      position: absolute;
      bottom: 2rem;
      left: 2rem;
      font-size: 0.85rem;
      color: var(--white-faint);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .stage-indicator-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--sky);
      animation: pulse 2s var(--ease-smooth) infinite;
    }

    .display-counter-wrap {
      display: flex;
      justify-content: center;
      margin-top: var(--space-lg);
    }
  </style>
</head>
<body>

  <div class="display-shell">

    <div class="display-brand">
      <div class="brand-mark">م.ف</div>
      <div>
        <div class="brand-name">منظور الفؤاد</div>
        <span class="brand-tagline">بالشراكة مع Proactive</span>
      </div>
    </div>

    <div id="display-content" class="display-content">
      <h1 class="display-title animate-in">من الاحتراق<br>إلى استعادة الاتّزان</h1>
      <p class="display-subtitle animate-in delay-1">جلسة حيّة — ساعتان وثلث</p>

      <div class="display-counter-wrap animate-in delay-2">
        <div class="display-counter">
          <div class="display-counter-icon"></div>
          <span class="display-counter-text">المتّصلون الآن:</span>
          <span class="display-counter-num" id="liveCount">٠</span>
        </div>
      </div>
    </div>

    <div class="stage-indicator">
      <div class="stage-indicator-dot"></div>
      <span id="stageLabel">في انتظار الجلسة</span>
    </div>

  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <!-- إعدادات Firebase الموجودة في الجذر -->
  <script src="../js/firebase-config.js"></script>

  <!-- منطق الجلسة الخاص بالـ Webinar -->
  <script src="js/session.js"></script>

  <script>
    const content = document.getElementById('display-content');
    const stageLabel = document.getElementById('stageLabel');
    let currentStage = null;

    // تحويل الأرقام لأرقام عربية
    function toArabic(n) {
      const map = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
      return String(n).split('').map(d => map[+d] ?? d).join('');
    }

    // عدّاد المشاركين
    subscribeToParticipantCount((active, total) => {
      const el = document.getElementById('liveCount');
      if (el) el.textContent = toArabic(active);
    });

    // تغييرات المرحلة
    subscribeToStage((stage, data) => {
      if (stage !== currentStage) {
        currentStage = stage;
        const meta = STAGES[stage] || STAGES.welcome;
        stageLabel.textContent = `المرحلة ${meta.num} — ${meta.label}`;
        renderStage(stage);
      }
    });

    function renderStage(stage) {
      content.innerHTML = views[stage] ? views[stage]() : views.welcome();
    }

    const views = {
      welcome: () => `
        <h1 class="display-title animate-in">من الاحتراق<br>إلى استعادة الاتّزان</h1>
        <p class="display-subtitle animate-in delay-1">جلسة حيّة — ساعتان وثلث</p>
        <div class="display-counter-wrap animate-in delay-2">
          <div class="display-counter">
            <div class="display-counter-icon"></div>
            <span class="display-counter-text">المتّصلون الآن:</span>
            <span class="display-counter-num" id="liveCount">٠</span>
          </div>
        </div>
      `,

      opening_poll: () => `
        <h1 class="display-title animate-in">Poll الافتتاح</h1>
        <p class="display-subtitle animate-in delay-1">إرهاق ولّا احتراق؟</p>
        <div class="display-counter-wrap animate-in delay-2">
          <div class="display-counter">
            <div class="display-counter-icon"></div>
            <span class="display-counter-text">المتّصلون:</span>
            <span class="display-counter-num" id="liveCount">٠</span>
          </div>
        </div>
        <p class="text-faint" style="margin-top: 2rem;">— Phase 6 — هيتم تطويره لاحقًا —</p>
      `,

      khalid_moment: () => `
        <h1 class="display-title animate-in">لحظة خالد</h1>
        <p class="display-subtitle animate-in delay-1">"بتصحى الـ٣ الفجر؟"</p>
        <p class="text-faint" style="margin-top: 2rem;">— Phase 5 —</p>
      `,

      diagnostic: () => `
        <h1 class="display-title animate-in">الاختبار التشخيصيّ</h1>
        <p class="display-subtitle animate-in delay-1">٩ مواقف — ٣ محاور</p>
        <p class="text-faint" style="margin-top: 2rem;">— Phase 2 — هتُبنى بالكامل في المرحلة الجاية —</p>
      `,

      type_guess: () => `
        <h1 class="display-title animate-in">حدس الطابع</h1>
        <p class="display-subtitle animate-in delay-1">٩ شخصيّات — اختار اللي يشبهك</p>
        <p class="text-faint" style="margin-top: 2rem;">— Phase 3 —</p>
      `,

      burnout_stage: () => `
        <h1 class="display-title animate-in">على Timeline الاحتراق</h1>
        <p class="display-subtitle animate-in delay-1">إنت في أيّ مرحلة؟</p>
        <p class="text-faint" style="margin-top: 2rem;">— Phase 4 —</p>
      `,

      closing: () => `
        <h1 class="display-title animate-in">الإنسان مش مخلوق ليحترق</h1>
        <p class="display-subtitle animate-in delay-1">هو مخلوق ليتّزن</p>
        <p class="display-subtitle animate-in delay-2" style="opacity:0.6;">والاتّزان — رحلة، مش لحظة</p>
      `
    };
  </script>

</body>
</html>
