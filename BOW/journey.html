<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0a1729" />
<title>هندسة العقلية — Reignite | Proactive Development Solutions</title>
<meta name="description" content="رحلة هندسة العقلية — مرحلة الأساس من برنامج Reignite، Burnout to Brilliance، مع كوتش محمود فؤاد من Proactive Development Solutions.">

<!-- خطوط -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Reem+Kufi:wght@400;500;600;700&family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- PDS Branding (مشترك) -->
<link rel="stylesheet" href="css/pds-branding.css">

<!-- ستايل الرحلة الأصلي -->
<link rel="stylesheet" href="css/journey.css">

<!-- html2pdf -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body data-screen-label="هندسة العقلية — Reignite">

<!-- ========== Hero PDS — يظهر مرة واحدة في الأعلى ========== -->
<div id="pdsHeroMount"></div>

<!-- ========== الهيدر العائم ========== -->
<header class="site-header" id="journeyHeader" hidden dir="ltr">
  <div class="site-header__inner" style="display:flex !important; flex-direction:row !important; align-items:center !important; gap:0 !important; width:100% !important; max-width:1400px !important; margin:0 auto !important; padding:14px 28px !important;">
    <div id="journeyBrandMount" style="direction:ltr; margin-right:auto;"></div>
    <div class="participant" dir="rtl" style="direction:rtl; margin-left:auto;">
      <span class="participant__label">المشارك:</span>
      <span class="participant__name" id="participantName">—</span>
    </div>
  </div>
</header>

<!-- ========== شريط التقدم ========== -->
<nav class="rail" aria-label="تقدّم الرحلة" id="journeyRail" hidden>
  <ol class="rail__list" id="rail"></ol>
</nav>

<!-- ========== المحتوى ========== -->
<main id="stationContainer" aria-live="polite" hidden></main>

<!-- ========== شاشة البصمة النهائية (overlay) ========== -->
<div id="fingerprintScreen" class="fp-screen" hidden aria-hidden="true">
  <button type="button" class="fp-back" data-action="back-to-journey" aria-label="الرجوع للرحلة">
    <span class="fp-back__arrow" aria-hidden="true">→</span>
    <span>الرجوع للرحلة</span>
  </button>
  <div class="fp-doc-wrap">
    <article class="fp-doc" id="fpDoc" aria-label="بصمة هندسة العقلية"></article>
  </div>
</div>

<!-- toast -->
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>

<!-- موديولات الرحلة -->
<script src="js/result-codes.js"></script>
<script src="js/journey-content.js"></script>
<script src="js/journey-axis-report.js"></script>
<script src="js/journey-data.js"></script>

<!-- PDS Branding (قبل journey-app) -->
<script src="js/pds-branding.js"></script>

<!-- التطبيق -->
<script src="js/journey-app.js"></script>

<!-- Bootstrap للـPDS Hero -->
<script>
(function(){
  function initPDS(){
    if (!window.PDS) { setTimeout(initPDS, 50); return; }
    window.PDS.init({ heroMount: "#pdsHeroMount" });
    // حقن الـbrand block في الهيدر
    const brandMount = document.getElementById("journeyBrandMount");
    if (brandMount && !brandMount.innerHTML.trim()){
      brandMount.innerHTML = window.PDS.brand({ showProgram: true });
    }
    // أظهر باقي عناصر الرحلة بعد ما الـHero يبدأ ظهوره
    setTimeout(() => {
      document.getElementById("journeyHeader")?.removeAttribute("hidden");
      document.getElementById("journeyRail")?.removeAttribute("hidden");
      document.getElementById("stationContainer")?.removeAttribute("hidden");
    }, 100);
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initPDS);
  } else {
    initPDS();
  }
})();
</script>

</body>
</html>
