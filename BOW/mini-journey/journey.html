<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#1a2e4a" />
<title>هندسة العقلية — منظور الفؤاد</title>

<!-- خطوط Google -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

<!-- ستايل الرحلة -->
<link rel="stylesheet" href="css/journey.css">

<!-- html2pdf — تصدير البصمة -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body data-screen-label="هندسة العقلية — الأساس">

<!-- ========== الهيدر ========== -->
<header class="site-header">
  <div class="site-header__inner">
    <div class="brand">
      <span class="brand__dot" aria-hidden="true"></span>
      <span class="brand__name">منظور الفؤاد</span>
      <span class="brand__tag">· هندسة العقلية</span>
    </div>
    <div class="participant">
      <span class="participant__label">المشارك:</span>
      <span class="participant__name" id="participantName">—</span>
    </div>
  </div>
</header>

<!-- ========== شريط التقدم ========== -->
<nav class="rail" aria-label="تقدّم الرحلة">
  <ol class="rail__list" id="rail"></ol>
</nav>

<!-- ========== المحتوى ========== -->
<main id="stationContainer" aria-live="polite"></main>

<!-- ========== شاشة البصمة النهائية (overlay) ========== -->
<div id="fingerprintScreen" class="fp-screen" hidden aria-hidden="true">
  <button type="button" class="fp-back" data-action="back-to-journey" aria-label="الرجوع للرحلة">
    <span class="fp-back__arrow" aria-hidden="true">→</span>
    <span>الرجوع للرحلة</span>
  </button>
  <div class="fp-doc-wrap">
    <article class="fp-doc" id="fpDoc" aria-label="بصمة هندسة العقلية"></article>
  </div>
</div>

<!-- toast للنسخ -->
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<!-- ========== Firebase SDK + config ========== -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src=".../js/firebase-config.js"></script>

<!-- ========== موديولات الرحلة ========== -->
<script src="js/result-codes.js"></script>
<script src="js/journey-content.js"></script>
<script src="js/journey-data.js"></script>
<script src="js/journey-app.js"></script>

</body>
</html>
