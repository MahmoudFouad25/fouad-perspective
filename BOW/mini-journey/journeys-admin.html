<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f1b2d">
  <title>هندسة العقلية — المكمّلون</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/journeys-admin.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">م.ف</div>
        <div>
          <div class="brand-name">هندسة العقلية</div>
          <span class="brand-tagline">لوحة المكمّلين</span>
        </div>
      </div>
      <div class="header-meta">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusLabel">جاري الاتّصال…</span>
      </div>
    </header>

    <div id="bannerHost"></div>
    <div class="stats" id="statsStrip"></div>

    <div class="toolbar">
      <div class="search-field">
        <input type="text" id="searchInput" placeholder="ابحث بالاسم أو الرقم أو الكود أو البصمة…" dir="auto">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </div>
      <div class="filter-segment" id="filterBar"></div>
      <div class="toolbar-right">
        <button class="btn btn-ghost btn-sm" id="exportCsvBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          تصدير CSV
        </button>
      </div>
    </div>

    <div class="table-wrap" id="participantsList"></div>

    <div style="margin-top:26px;text-align:center;font-size:12px;color:var(--faint);line-height:1.8;">
      كل مشارك بيخلّص رحلة "هندسة العقلية" بيظهر هنا تلقائيًّا ببصمته الكاملة.<br>
      الكود بيتولّد مرّة واحدة عند التسجيل، ورسالة الواتس بتحمل ملخّص البصمة + لينك التقرير الدائم.
    </div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://github.com/MahmoudFouad25/fouad-perspective/blob/main/js/firebase-config.js"></script>

  <!-- موديولات -->
  <script src="https://github.com/MahmoudFouad25/fouad-perspective/blob/main/BOW/js/result-codes.js"></script>
  <script src="js/journey-content.js"></script>
  <script src="js/journey-data.js"></script>
  <script src="js/journey-admin.js"></script>
</body>
</html>
