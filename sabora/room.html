<title>غرفة التمرين — النموذج الرباعي</title>
<style>
:root{
  --ink:#0C1015; --ink2:#161C24; --line:#2A333F;
  --chalk:#F4F1E8; --mute:#8A97A6;
  --raei:#4CA6FF; --tager:#FF8A3D; --raqib:#5FD08A;
  --gold:#FFD24A; --danger:#FF5C5C;
  --pad:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--ink); color:var(--chalk); direction:rtl;
  font-family:"SF Arabic",-apple-system,"Segoe UI","Noto Kufi Arabic",Tahoma,Arial,sans-serif;
  font-size:17px; line-height:1.55; overflow-x:hidden;
}
/* ===== الجرس: الخلفية نفسها هي المؤقت ===== */
#drain{position:fixed;inset:0;z-index:0;pointer-events:none}
#drain i{position:absolute;left:0;right:0;bottom:0;height:0%;
  background:linear-gradient(0deg,color-mix(in srgb,var(--role) 26%,transparent),transparent);
  transition:height .95s linear}
@media(prefers-reduced-motion:reduce){#drain i{transition:none}}
#wrap{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:var(--pad) var(--pad) 120px}

.eyebrow{display:flex;justify-content:space-between;align-items:center;
  font-size:12px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase;
  border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px}
.eyebrow b{color:var(--chalk);font-weight:800}
.dot{width:7px;height:7px;border-radius:50%;background:var(--danger);display:inline-block;margin-inline-start:6px}
.dot.on{background:var(--raqib)}

.roleband{border:1px solid var(--role);border-radius:14px;padding:10px 14px;
  display:flex;align-items:baseline;gap:10px;margin-bottom:14px;
  background:color-mix(in srgb,var(--role) 12%,transparent)}
.roleband small{color:var(--mute);font-size:12px}
.roleband h1{margin:0;font-size:30px;font-weight:900;color:var(--role);letter-spacing:-.01em}

/* المؤقت */
.clock{font-variant-numeric:tabular-nums;font-size:74px;font-weight:900;line-height:.95;
  letter-spacing:-.04em;margin:6px 0 2px;color:var(--chalk)}
.clock.warn{color:var(--gold)} .clock.over{color:var(--danger)}
.phase{font-size:13px;color:var(--mute);letter-spacing:.1em;margin-bottom:16px}

h2.sec{font-size:12px;letter-spacing:.16em;color:var(--mute);margin:22px 0 8px;font-weight:700}
.card{background:var(--ink2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.gold{color:var(--gold);font-weight:800}
.big{font-size:24px;font-weight:800;line-height:1.4}
.huge{font-size:30px;font-weight:900;line-height:1.35}

/* شرايح الكلمات المفتاحية */
.chip{width:100%;text-align:right;background:var(--ink2);border:1px solid var(--line);
  border-radius:14px;padding:14px;margin-bottom:8px;color:var(--chalk);font:inherit;cursor:pointer;
  display:block;position:relative}
.chip:focus-visible{outline:3px solid var(--role);outline-offset:2px}
.chip .k{font-size:22px;font-weight:900;line-height:1.3}
.chip .n{position:absolute;left:12px;top:12px;font-size:11px;color:var(--mute);letter-spacing:.1em}
.chip .d{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);
  font-size:17px;color:#D7DEE7;line-height:1.6}
.chip.open .d{display:block}
.chip.open{border-color:var(--role)}
.chip .hint{font-size:11px;color:var(--mute);margin-top:6px}

.btn{display:block;width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);
  background:var(--ink2);color:var(--chalk);font:inherit;font-weight:800;cursor:pointer;margin-bottom:8px}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--role);border-color:var(--role);color:#08101A}
.btn.ghost{background:transparent;color:var(--mute)}
.btn.warn{border-color:var(--gold);color:var(--gold)}

.check{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);
  border-radius:12px;margin-bottom:8px;background:var(--ink2);cursor:pointer}
.check .box{flex:0 0 auto;width:30px;height:30px;border-radius:8px;border:2px solid var(--mute);
  display:grid;place-items:center;font-weight:900;font-size:16px;color:transparent}
.check.yes .box{background:var(--raqib);border-color:var(--raqib);color:#08101A}
.check.no  .box{background:var(--danger);border-color:var(--danger);color:#fff}
.check .t{font-size:16px;line-height:1.5}
.check small{color:var(--mute);display:block;margin-top:3px;font-size:12px}

.note{border-inline-start:3px solid var(--gold);padding:10px 12px;background:#1A1710;
  border-radius:0 10px 10px 0;font-size:15px;color:#E8DFC4;margin-bottom:10px}
.stop{border-inline-start:3px solid var(--danger);background:#1B1113;color:#F2C9C9}

/* شيت النص الكامل */
#sheet{position:fixed;inset:0;background:rgba(6,9,13,.86);z-index:50;display:none;
  overflow:auto;padding:var(--pad)}
#sheet.on{display:block}
#sheet .inner{max-width:620px;margin:0 auto;background:var(--ink2);border:1px solid var(--line);
  border-radius:16px;padding:16px}

/* الأدمن */
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.grid button{padding:12px 0;border-radius:10px;border:1px solid var(--line);background:var(--ink2);
  color:var(--mute);font:inherit;font-weight:900;font-size:18px;cursor:pointer}
.grid button.on{background:var(--gold);border-color:var(--gold);color:#0C1015}
.bar{height:8px;background:var(--ink2);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--raqib);width:0}
.bar i.over{background:var(--danger)}
.say{border:1px dashed var(--gold);border-radius:12px;padding:14px;background:#151209;margin-bottom:12px}
.say small{color:var(--gold);font-size:11px;letter-spacing:.14em}
.say p{margin:6px 0 0;font-size:19px;font-weight:800;line-height:1.5}
.row{display:flex;gap:8px}.row>*{flex:1}
.mini{font-size:12px;color:var(--mute)}
.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:3px 10px;
  font-size:11px;color:var(--mute);margin-inline-start:6px}
</style>

<div id="drain"><i></i></div>
<div id="wrap"></div>
<div id="sheet" onclick="if(event.target.id==='sheet')closeSheet()"><div class="inner" id="sheetIn"></div></div>

async function push(){
  S.seq++;
  try{ await window.storage.set(KEY, JSON.stringify(S), true); me.synced=true; }
  catch(e){ me.synced=false; }
  render();
}
async function pull(){
  try{
    const r = await window.storage.get(KEY, true);
    if(r && r.value){
      const n = JSON.parse(r.value);
      if(n.seq !== S.seq || n.phase !== S.phase || n.round !== S.round || n.lap !== S.lap){
        S = n; me.marks={};
      }
      me.synced = true;
    }
  }catch(e){ me.synced=false; }
}
function startPoll(){ if(poll) clearInterval(poll); poll=setInterval(async()=>{ await pull(); render(); },3000); }

/* ---- المراقب بيبعت نتيجته مرة واحدة أول ما الجرس يضرب ---- */
const resKey = (r,l) => `sbm:res:${r}:${l}:`;
async function submitMarks(){
  const k = `${S.round}:${S.lap}`;
  if(myRole()!=="raqib" || Object.keys(me.marks).length===0) return;
  me.sent[k]=true;
  const arr = R().raqib.map((_,i)=> me.marks[i]||"skip");
  try{ await window.storage.set(resKey(S.round,S.lap)+DEV, JSON.stringify(arr), true); }
  catch(e){ me.sent[k]="fail"; }
}
function maybeSubmit(){
  const k = `${S.round}:${S.lap}`;
  if(S.phase==="feedback" && !me.sent[k]) submitMarks();
  if(S.phase==="prep"||S.phase==="run"){ if(me.sent[k]) delete me.sent[k]; }
}


/* ==========  تحكم  ========== */
function setPhase(p){ S.phase=p; S.t0=Date.now(); push(); }
function nextLap(){ if(S.lap<3){ S.lap++; setPhase("prep"); } else { S.phase="done"; push(); } }
function setRound(n){ S.round=n; S.lap=1; me.marks={}; me.worry=null; setPhase("prep"); }
function localAdvance(){ // وضع الجرس: كل جهاز بيمشي بنفسه
  if(S.phase==="idle"||S.phase==="done") setPhase("prep");
  else if(S.phase==="prep") setPhase("run");
  else if(S.phase==="run") setPhase("feedback");
  else nextLap();
}

/* ==========  الرسم  ========== */
function render(){
  const w=$("#wrap");
  if(me.view==="play") maybeSubmit();
  if(me.view==="pick") return w.innerHTML = pick();
  w.innerHTML = player(); paint();
}
function paint(){
  const r = myRole(); const c = r ? ROLES[r].c : "var(--gold)";
  document.documentElement.style.setProperty("--role", c);
  const d=$("#drain i");
  if(d){ const D=dur(); d.style.height = (S.phase==="run"&&D) ? (left()/D*100)+"%" : "0%"; }
}

function pick(){
  return `
  <div class="eyebrow"><span>سبورة المحروسة · النموذج الرباعي</span><span>غرفة التمرين</span></div>
  <h1 style="font-size:34px;font-weight:900;margin:18px 0 6px">انت مين في مجموعتك؟</h1>
  <p style="color:var(--mute);margin:0 0 18px">اختار دورك في <b style="color:var(--chalk)">اللفة الأولى</b> بس. بعد كده الأدوار بتلف لوحدها مع كل جرس — الصفحة عارفة انت بقيت مين.</p>
  ${ORDER.map(k=>`<button class="btn" style="border-color:${ROLES[k].c};color:${ROLES[k].c};font-size:22px;padding:20px"
      onclick="me.start='${k}';me.view='play';startPoll();render()">${ROLES[k].label}</button>`).join("")}
  <div class="note" style="margin-top:18px">الدورة ناحية اليمين: صاحب السبورة ← التاجر ← المراقب ← صاحب السبورة. يعني اللفة التالتة كل واحد يكون لعب التلات أدوار.</div>`;
}

function head(){
  const r=myRole(); const D=dur(); const L=left();
  const cls = S.phase!=="run" ? "" : L<=5 ? "over" : L<=10 ? "warn" : "";
  const ph = {idle:"مستنيين الجرس",prep:"تجهيز — اقرا وانت مستني",run:"شغال — الجرس ماشي",feedback:"فيدباك وتبديل",done:"الجولة خلصت"}[S.phase];
  return `
  <div class="eyebrow">
    <span>الجولة <b>${S.round}</b> · اللفة <b>${S.lap}</b> من ٣</span>
    <span>${R().name} <span class="dot ${me.synced?'on':''}"></span></span>
  </div>
  <div class="roleband"><small>انت دلوقتي</small><h1>${ROLES[r].label}</h1></div>
  <div class="clock ${cls}">${S.phase==="idle"||S.phase==="done" ? "—" : mmss(L)}</div>
  <div class="phase">${ph}</div>`;
}

function player(){
  const r=myRole();
  let bodyHtml = r==="raei" ? viewRaei() : r==="tager" ? viewTager() : viewRaqib();
  return head() + bodyHtml + `
  <div style="margin-top:26px;border-top:1px solid var(--line);padding-top:12px">
    <button class="btn ghost" onclick="localAdvance()">وضع الجرس: دوس مع كل صافرة من محمود</button>
    <div class="mini" style="text-align:center">استخدم الزرار ده لو النت وقع أو الأدمن مش شغال. ${me.synced?'<span class="pill">متصل بالأدمن</span>':'<span class="pill">شغال محليًا</span>'}</div>
  </div>`;
}

/* ---- صاحب السبورة: المحتوى بيتقفل ويتفتح حسب اللحظة ---- */
function viewRaei(){
  const R0=R();
  if(S.phase==="run"){
    return `
    <div class="note">الجرس شغال. دي كلماتك المفتاحية بس — دوس على أي واحدة تفتحلك <b>هي لوحدها</b>.</div>
    ${R0.raei.map((c,i)=>chip(c,i)).join("")}
    <button class="btn warn" onclick="me.peeks++;openSheet(fullText())">اتوهت؟ افتح النص الكامل</button>
    ${me.peeks?`<div class="mini" style="text-align:center">فتحت النص ${me.peeks} مرة في اللفة دي — عادي. بس في الشارع مفيش ورقة.</div>`:""}`;
  }
  if(S.phase==="feedback"||S.phase==="done"){
    return `<div class="note">اللفة خلصت — النص الكامل مفتوح تاني. اسمع فيدباك المراقب الأول، وبعدين قارن.</div>
      <h2 class="sec">النص النموذجي — صيغة ${VARIANTS[me.variant]||"الأساس"}</h2>
      <div class="card big">${fullText()}</div>`;
  }
  return `
    <div class="note">مساحة التجهيز: اقرا دلوقتي براحتك. أول ما الجرس يضرب، النص هيتقفل ويفضل الكلمات المفتاحية بس.</div>
    <h2 class="sec">اختار صيغة المحل</h2>
    <div class="row" style="margin-bottom:12px">
      ${["الأساس",...VARIANTS].map((v,i)=>`<button class="btn ${me.variant===i?'pri':''}" style="font-size:14px;padding:10px" onclick="me.variant=${i};render()">${v}</button>`).join("")}
    </div>
    <div class="card big">${fullText()}</div>
    <h2 class="sec">الكلمات المفتاحية اللي هتفضل قدامك</h2>
    ${R0.raei.map((c,i)=>chip(c,i,true)).join("")}`;
}
function chip(c,i,open){
  return `<button class="chip ${open?'open':''}" onclick="this.classList.toggle('open')">
    <span class="n">${c.s}</span>
    <span class="k ${c.gold?'gold':''}">${c.gold?'«'+c.k+'»':c.k}</span>
    <span class="d">${c.d}${c.warn?`<div class="note stop" style="margin:10px 0 0">⛔ ${c.warn}</div>`:""}</span>
  </button>`;
}
function fullText(){ return R().full[me.variant] || R().full[0]; }

/* ---- التاجر ---- */
function viewTager(){
  const t=R().tager;
  if(S.round===3){
    const idx = me.worry===null ? (S.lap-1)%4 : me.worry;
    return `
      <div class="note">قلقك في اللفة دي — اتوزع أوتوماتيك عشان ما تكررش قلق زميلك.</div>
      <div class="card"><div class="huge gold">«${t.worries[idx]}»</div></div>
      <div class="note stop"><b>⛔ ${t.stop}</b></div>
      <div class="card">${t.mid}</div>
      <h2 class="sec">تغيير القلق</h2>
      ${t.worries.map((w,i)=>`<button class="btn ${i===idx?'pri':''}" style="font-size:14px;text-align:right;padding:10px" onclick="me.worry=${i};render()">${i+1}. ${w}</button>`).join("")}`;
  }
  return `
    <div class="card"><div class="mini">${t.type}</div>
      <div class="huge" style="margin-top:8px">«${t.open}»</div></div>
    <h2 class="sec">وبعدين</h2>
    <div class="card">${t.mid}</div>
    ${t.close && t.close!=="—" ? `<h2 class="sec">تقفل بيها</h2><div class="card big">«${t.close}»</div>`:""}
    <div class="note stop"><b>⛔ ${t.stop}</b></div>`;
}

/* ---- المراقب: التشيك ليست بتتحول لفيدباك أوتوماتيك ---- */
function viewRaqib(){
  const list=R().raqib;
  if(S.phase==="feedback"||S.phase==="done"){
    const bad = list.map((c,i)=>[c,i]).filter(([c,i])=>me.marks[i]==="no");
    const good = list.map((c,i)=>[c,i]).filter(([c,i])=>me.marks[i]==="yes");
    return `
      <div class="note"><b>دورك دلوقتي.</b> جملتين بس: حاجة عملها صح + حاجة واحدة يظبطها. مش تلاتة… واحدة.</div>
      <h2 class="sec">قوله الأول</h2>
      <div class="card big">${good.length?`«${good[0][0][0].replace('؟','')} — دي عملتها صح.»`:"«اختار حاجة شفتها كويسة فعلًا — أي حاجة.»"}</div>
      <h2 class="sec">وبعدين حاجة واحدة بس</h2>
      <div class="card big" style="border-color:var(--gold)">${bad.length?`«الحاجة الواحدة اللي تظبطها: ${bad[0][0][0].replace('؟','')}${bad[0][0][1]?" — "+bad[0][0][1]:""}»`:"«مفيش حاجة كبيرة — قوله الحاجة اللي حسيتها أضعف حتة.»"}</div>
      ${bad.length>1?`<div class="mini" style="margin-top:10px">في ${bad.length} حاجات مش متعلمة — بس قوله واحدة بس. الباقي بيتقال بالليل مش دلوقتي.</div>`:""}`;
  }
  return `
    <div class="note">علّم وانت ساكت. ممنوع تساعد، ممنوع تلقّن، ممنوع تضحك.</div>
    ${list.map((c,i)=>`
      <div class="check ${me.marks[i]==='yes'?'yes':me.marks[i]==='no'?'no':''}" onclick="mark(${i})">
        <span class="box">${me.marks[i]==='no'?'✕':'✓'}</span>
        <span class="t">${c[0]}${c[1]?`<small>${c[1]}</small>`:""}</span>
      </div>`).join("")}
    <div class="mini">دوسة = نعم · دوستين = لأ · تلاتة = فاضي</div>`;
}
function mark(i){ const v=me.marks[i]; me.marks[i] = v===undefined?"yes" : v==="yes"?"no" : undefined; render(); }

function openSheet(html){ $("#sheetIn").innerHTML = `<div class="big">${html}</div>
  <button class="btn" style="margin-top:14px" onclick="closeSheet()">اقفل وارجع للكلمات المفتاحية</button>`; $("#sheet").classList.add("on"); }
function closeSheet(){ $("#sheet").classList.remove("on"); }

/* تشغيل */
document.documentElement.style.setProperty("--role","var(--gold)");
tick = setInterval(()=>{ if(me.view==="play") render(); },1000);
render();
</script>
