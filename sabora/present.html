<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>العرض — النموذج الرباعي | سبورة المحروسة</title>
<style>
:root{
  --ink:#0C1015; --ink2:#161C24; --line:#2A333F;
  --chalk:#F4F1E8; --mute:#8A97A6;
  --gold:#FFD24A; --go:#5FD08A; --danger:#FF5C5C;
  --raei:#4CA6FF; --tager:#FF8A3D; --raqib:#5FD08A;
  --u:clamp(13px,1.35vw,20px);            /* وحدة الخط الأساسية للعرض */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:var(--ink);color:var(--chalk);direction:rtl;
  font-family:"SF Arabic",-apple-system,"Segoe UI","Noto Kufi Arabic",Tahoma,Arial,sans-serif;
  font-size:var(--u);line-height:1.5;
}

/* ===== المسرح ===== */
#stage{position:fixed;inset:0;display:flex;flex-direction:column;padding:2.2vh 3vw;z-index:1}
#top{display:flex;justify-content:space-between;align-items:center;gap:12px;
  font-size:.72em;letter-spacing:.14em;color:var(--mute);
  border-bottom:1px solid var(--line);padding-bottom:.8vh;flex:0 0 auto}
#top b{color:var(--chalk);font-weight:800;letter-spacing:0}
#top .sync{display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--danger);display:inline-block}
.dot.on{background:var(--go)}

#slide{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;
  padding:1vh 0;overflow:hidden}
#bot{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;
  font-size:.66em;color:#4C5866;border-top:1px solid var(--line);padding-top:.8vh}
#steps{display:flex;gap:4px}
#steps i{width:14px;height:4px;border-radius:99px;background:#232C37;display:block}
#steps i.on{background:var(--gold)}
#steps i.done{background:#3A4552}

/* ===== عناصر الشرايح ===== */
.kicker{font-size:.8em;letter-spacing:.18em;color:var(--gold);font-weight:800;margin-bottom:.6vh}
.kicker.blue{color:var(--raei)} .kicker.red{color:var(--danger)} .kicker.green{color:var(--go)}
h1{margin:0 0 1.4vh;font-size:3.5em;font-weight:900;line-height:1.08;letter-spacing:-.02em}
h1.mega{font-size:5em}
h2{margin:0 0 1.2vh;font-size:2.3em;font-weight:900;line-height:1.15}
.lede{font-size:1.35em;color:#C3CDD9;max-width:46ch;line-height:1.5}
.lede b{color:var(--chalk)}

.rows{display:flex;flex-direction:column;gap:.9vh}
.row{display:flex;gap:14px;align-items:flex-start;background:var(--ink2);
  border:1px solid var(--line);border-radius:14px;padding:1.3vh 16px}
.row .num{flex:0 0 auto;width:2em;height:2em;border-radius:10px;background:#0C1015;
  border:1px solid var(--line);display:grid;place-items:center;font-weight:900;color:var(--gold);font-size:1.05em}
.row .txt{flex:1 1 auto;font-size:1.3em;font-weight:800;line-height:1.35}
.row .txt small{display:block;font-weight:600;font-size:.72em;color:var(--mute);margin-top:3px;line-height:1.45}
.row .sec{flex:0 0 auto;color:var(--mute);font-size:.85em;font-variant-numeric:tabular-nums;white-space:nowrap}
.row.gold{border-color:#4A3D14;background:#151209}
.row.gold .txt{color:var(--gold)}

.quote{background:#151209;border:1px dashed var(--gold);border-radius:16px;padding:2vh 20px;
  font-size:1.5em;font-weight:800;line-height:1.65;color:#F7EFD6;max-width:60ch}
.quote .stage{color:var(--mute);font-weight:600;font-size:.8em}
.quote em{color:var(--gold);font-style:normal}
.meta{margin-top:1vh;font-size:.85em;color:var(--mute)}

.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{border:1px solid var(--line);border-radius:14px;padding:1.6vh 16px;background:var(--ink2)}
.box.bad{border-color:#4A1F22;background:#1B1113}
.box.good{border-color:#1F4430;background:#101A14}
.box h3{margin:0 0 .8vh;font-size:.8em;letter-spacing:.16em;font-weight:800}
.box.bad h3{color:var(--danger)} .box.good h3{color:var(--go)}
.box p{margin:0;font-size:1.15em;line-height:1.55}
.box .why{margin-top:1vh;padding-top:1vh;border-top:1px dashed var(--line);
  font-size:.92em;color:#B9C4D1;line-height:1.5}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{border:1px solid var(--line);border-radius:14px;padding:1.6vh 14px;background:var(--ink2)}
.tile b{display:block;font-size:1.25em;margin-bottom:.5vh}
.tile.raei{border-color:var(--raei)} .tile.raei b{color:var(--raei)}
.tile.tager{border-color:var(--tager)} .tile.tager b{color:var(--tager)}
.tile.raqib{border-color:var(--raqib)} .tile.raqib b{color:var(--raqib)}
.tile p{margin:0;font-size:.95em;color:#B9C4D1;line-height:1.5}

.stopline{border-inline-start:3px solid var(--danger);background:#1B1113;color:#F2C9C9;
  border-radius:0 12px 12px 0;padding:1.1vh 14px;font-size:1.05em;margin-bottom:.8vh}
.goldline{border-inline-start:3px solid var(--gold);background:#1A1710;color:#E8DFC4;
  border-radius:0 12px 12px 0;padding:1.1vh 14px;font-size:1.05em;margin-bottom:.8vh}

/* ===== شريحة الجولة ===== */
.cue{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;align-items:stretch}
.cue .left{display:flex;flex-direction:column;justify-content:center}
.cue .say{border:1px dashed var(--gold);background:#151209;border-radius:16px;padding:2vh 18px}
.cue .say small{color:var(--gold);font-size:.75em;letter-spacing:.14em;font-weight:800}
.cue .say p{margin:.8vh 0 0;font-size:1.45em;font-weight:900;line-height:1.5}
.live{border:1px solid var(--line);background:var(--ink2);border-radius:16px;padding:2vh 18px;
  display:flex;flex-direction:column;justify-content:center;text-align:center}
.live .lbl{font-size:.75em;letter-spacing:.14em;color:var(--mute)}
.clock{font-variant-numeric:tabular-nums;font-size:6em;font-weight:900;line-height:.95;letter-spacing:-.05em;margin:.4vh 0}
.clock.warn{color:var(--gold)} .clock.over{color:var(--danger)}
.clock.idle{color:#3A4552}
.live .phase{font-size:1.05em;font-weight:800;color:var(--chalk)}
.live .lap{font-size:.85em;color:var(--mute);margin-top:.6vh}
.roles{display:flex;gap:8px;justify-content:center;margin-top:1.4vh}
.roles span{border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:.8em;font-weight:800}
.roles .r1{color:var(--raei);border-color:var(--raei)}
.roles .r2{color:var(--tager);border-color:var(--tager)}
.roles .r3{color:var(--raqib);border-color:var(--raqib)}
.checks{margin-top:1vh;text-align:right}
.checks div{font-size:.95em;color:#B9C4D1;padding:.45vh 0;border-bottom:1px dashed #202832}
.checks div:last-child{border:0}

/* ===== ملاحظات المدرب ===== */
#notes{position:fixed;inset:auto 0 0 0;z-index:9;background:#080B0F;border-top:2px solid var(--gold);
  padding:14px 3vw 18px;max-height:46vh;overflow:auto;transform:translateY(101%);
  transition:transform .22s ease;font-size:.95em}
#notes.on{transform:none}
#notes h4{margin:0 0 8px;font-size:.72em;letter-spacing:.16em;color:var(--gold)}
#notes .n{font-size:1.15em;line-height:1.7;color:#E8DFC4;max-width:100ch}
#notes .n em{color:var(--mute);font-style:normal}

/* ===== الخريطة ===== */
#map{position:fixed;inset:0;z-index:20;background:rgba(6,9,13,.96);padding:4vh 4vw;overflow:auto;display:none}
#map.on{display:block}
#map .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:14px}
#map button{text-align:right;background:var(--ink2);border:1px solid var(--line);border-radius:12px;
  padding:12px;color:var(--chalk);font:inherit;cursor:pointer}
#map button.on{border-color:var(--gold)}
#map button small{display:block;color:var(--mute);font-size:.72em;letter-spacing:.1em;margin-bottom:4px}
#map button b{font-size:1.05em;font-weight:800;line-height:1.35}

kbd{border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--mute);font:inherit;font-size:.9em}
@media (max-width:820px){
  .cue{grid-template-columns:1fr} .pair,.grid3{grid-template-columns:1fr}
  h1{font-size:2.6em} .clock{font-size:4em}
}
@media (prefers-reduced-motion:reduce){#notes{transition:none}}
</style>

<script src="sync.js" onerror="window.__nosync=1"></script>

<div id="stage">
  <div id="top">
    <span id="tsec">—</span>
    <span id="tmid"><b>النموذج الرباعي</b> · سبورة المحروسة · الجمعة ١١:٥٠–١٢:٢٠</span>
    <span class="sync"><span id="tsync">—</span><span class="dot" id="tdot"></span></span>
  </div>
  <div id="slide"></div>
  <div id="bot">
    <span id="steps"></span>
    <span><kbd>←</kbd> اللي بعده · <kbd>→</kbd> اللي قبله · <kbd>N</kbd> ملاحظاتي · <kbd>M</kbd> الخريطة · <kbd>F</kbd> ملء الشاشة</span>
    <span id="tnum">1 / 1</span>
  </div>
</div>

<div id="notes"><h4>اللي بتقوله دلوقتي — لوحدك، مش على الشاشة الكبيرة</h4><div class="n" id="notesIn"></div></div>
<div id="map"><b style="font-size:1.4em">خريطة العرض — دوس على أي شريحة</b><div class="g" id="mapIn"></div></div>

<script>
/* ============================================================
   العرض التقديمي — «النموذج الرباعي» (٣٠ دقيقة)
   الفلسفة: بند → جولته فورًا. مش شرح كامل وبعدين تمرين.
   الشرايح بتتحرك بإيدك. الجولات بتتفتح من coach.html — والعدّاد
   هنا بيتزامن معاها لوحده لو sync.js شغال على Firebase.
   ============================================================ */

const RD = [ /* بيانات الجولات — نفس أرقام coach.html بالظبط */
 { n:1, name:"الافتتاحية وبس", prep:20, lap:40, fb:25, budget:240,
   say:"يالا — الجولة الأولى: الافتتاحية وبس! مفيش قيمة، مفيش اعتراضات، مفيش إغلاق. أربع قطع بس. أربعين ثانية وجرس! جهزوا… ابدأوا!",
   raqib:["قال مين إحنا؟","وصف السبورة في جملتين؟","قال «تمنها مدفوع… وكرامته كاملة» نصًا؟","قال «والمؤسسة مش بتاخد قرش» قبل ما يُسأل؟","خلص في ٤٠ ثانية؟"] },
 { n:2, name:"القيمة وبس", prep:20, lap:50, fb:20, budget:240,
   say:"يالا — الجولة التانية: القيمة وبس! التاجر هيسألك «وأنا استفادتي إيه أنا؟» — ورده تلات حاجات. وممنوع… ممنوع تعد بأي رقم. خمسين ثانية وجرس! ابدأوا!",
   raqib:["سمع السؤال للآخر قبل ما يرد؟","صدّق على السؤال في أوله؟","ذكر التلات حاجات (زباين + سمعة + اسمه مع الوزارة)؟","ما وعدش بأي رقم أو ربح أو إعلان؟","خلص في ٥٠ ثانية؟"] },
 { n:3, name:"امتصاص القلق وبس", prep:20, lap:60, fb:30, budget:300,
   say:"يالا — الجولة التالتة، وهي أصعب واحدة النهارده: امتصاص القلق. التاجر معاه أربع قلوق هيختار واحد. وانت — أول حاجة عليك مش الرد… أول حاجة عليك السكوت. دقيقة وجرس! ابدأوا!",
   raqib:["سكت لحد ما التاجر خلص جملته بالكامل؟","قال «حقك تسأل… وأنا مكانك كنت هسأل نفس السؤال» نصًا؟","سكت لحظة بعد التصديق وما قالش «بس»؟","رد على القلق نفسه مش على المؤسسة؟","قفل بحاجة التاجر يتحقق منها؟"] },
 { n:4, name:"الإغلاق وبس", prep:20, lap:30, fb:20, budget:180,
   say:"يالا — الجولة الرابعة: الإغلاق وبس! التاجر هيقولك «خليني أفكر وتعالى بعدين» — وانت عندك تلاتين ثانية تخرج بحاجة اتعملت ومعاد بيوم وساعة. مش بوعد. ابدأوا!",
   raqib:["قال «نجرب أسبوعين؟…» نصًا؟","طلب خطوة فورية ملموسة؟","حدد معاد بيوم وساعة؟","ما سألش سؤال مفتوح («إيه رأيك؟»)؟","قفل بكرامة وما زنّش؟"] },
 { n:5, name:"الحوار الكامل", prep:20, lap:90, fb:10, budget:360,
   say:"يالا — الجولة الخامسة والأخيرة: الحوار كامل من السلام للإغلاق. وانتوا دلوقتي مش بتجربوا حاجة جديدة — انتوا بتجمّعوا أربع حاجات اتدربتوا عليها الربع ساعة اللي فاتت. دقيقة ونص لكل واحد. ابدأوا!",
   raqib:["الأربع بنود اتقالوا بالترتيب؟","الجمل الذهبية الأربعة اتقالوا نصًا؟","خلص في أقل من دقيقة ونص؟","مسك خيط التاجر؟","خرج بحاجة اتعملت ومعاد؟"] }
];

const S = [];   /* الشرايح */
const P = (sec, kicker, html, notes, cue) => S.push({sec, kicker, html, notes, cue:cue||0});

/* ---------- ٠ · الافتتاح (٣ دقايق) ---------- */
P("الافتتاح","",
  `<div class="kicker">المقطع التاني · الجمعة ١١:٥٠</div>
   <h1 class="mega">النموذج الرباعي</h1>
   <p class="lede">سلاح النهارده. <b>الثقة مش إحساس — الثقة خطة كلام.</b></p>`,
  `افتح بالجملة دي بالظبط، وبهدوء، ومن غير ما تبص في الورق:<br>
   <b>«دلوقتي هديكم سلاح اليوم. وعندي خبر حلو: انتوا شفتوه اشتغل امبارح بالفعل — بس محدش قالكم اسمه.»</b><br>
   <em>وقفة. سيبهم يفتكروا. وبعدين دوس اللي بعده.</em><br><em>⏱ الشريحة دي ٣٠ ثانية.</em>`);

P("الافتتاح","",
  `<div class="kicker blue">الكشف</div>
   <h1>كريم… والحاج أبو حسين</h1>
   <p class="lede">المشهد اللي شفتوه امبارح مكانش تمثيل حلو — ده كان <b>النموذج الرباعي</b> شغّال قدامكم.
   كريم عمل أربع حاجات… بالترتيب.</p>`,
  `<b>«افتكروا كريم مع الحاج أبو حسين. كريم عمل أربع حاجات بالترتيب — وده اللي إحنا بنسميه النموذج الرباعي.»</b><br>
   اسأل القاعة: <b>«مين فاكر كريم بدأ بإيه؟»</b> — خد إجابة واحدة بس ودوس. <em>⏱ ٣٠ ثانية.</em>`);

P("الافتتاح","",
  `<div class="kicker">اللي في دماغ التاجر وانت بتتكلم</div>
   <h2>هو مش سامعك… هو بيسأل نفسه تلات أسئلة</h2>
   <div class="grid3">
     <div class="tile"><b>هيضيع وقتي؟</b><p>← الافتتاحية بتجاوب عليه في ٣٠ ثانية.</p></div>
     <div class="tile"><b>هياخد مني فلوس؟</b><p>← القيمة والطمأنة بيجاوبوا عليه.</p></div>
     <div class="tile"><b>هيجيبلي مشاكل؟</b><p>← امتصاص القلق بيجاوب عليه.</p></div>
   </div>
   <div class="goldline" style="margin-top:1.4vh">لو جاوبت التلاتة في أول دقيقة… الباب اتفتح. ولو لأ — أشطر كلام في الدنيا مش هيدخل.</div>`,
  `دي أهم شريحة في الشرح كله — النموذج مش أربع خطوات محفوظة، ده أربع إجابات على تلات أسئلة في دماغ الراجل.<br>
   <b>«التاجر بيسأل نفسه تلات أسئلة وانت بتتكلم — مش سامع كلامك أصلًا غير من خلالهم.»</b> <em>⏱ ٤٥ ثانية.</em>`);

P("الافتتاح","",
  `<div class="kicker">نظرة سريعة — وبعدين بند بند بالجولات</div>
   <h2>الأربع خطوات</h2>
   <div class="rows">
     <div class="row"><span class="num">١</span><span class="txt">افتتاحية التلاتين ثانية<small>تذكرة الدخول — مش ملخص.</small></span></div>
     <div class="row"><span class="num">٢</span><span class="txt">القيمة ليه هو<small>مصلحته المشروعة مش عيب — دي أساس الشراكة.</small></span></div>
     <div class="row"><span class="num">٣</span><span class="txt">امتصاص القلق<small>ما تجاوبش على الاعتراض قبل ما تسمعه للآخر وتصدّقه.</small></span></div>
     <div class="row"><span class="num">٤</span><span class="txt">الإغلاق البسيط<small>ما تطلبش جواز — اطلب معاد.</small></span></div>
   </div>`,
  `اقراهم بسرعة — <b>ما تشرحش أي واحد فيهم دلوقتي</b>. ده فهرس مش درس.<br>
   <b>«الأربعة دول هناخدهم واحد واحد — وكل واحد هننزل نتمرن عليه على طول قبل ما نروح للي بعده.»</b> <em>⏱ ٣٠ ثانية.</em>`);

P("الافتتاح","",
  `<div class="kicker">ممنوع تتغير كلمة فيها</div>
   <h2>الأربع جمل الذهبية</h2>
   <div class="rows">
     <div class="row gold"><span class="num">◄</span><span class="txt">«تمنها مدفوع… وكرامته كاملة»</span></div>
     <div class="row gold"><span class="num">◄</span><span class="txt">«والمؤسسة مش بتاخد قرش»</span></div>
     <div class="row gold"><span class="num">◄</span><span class="txt">«حقك تسأل… وأنا مكانك كنت هسأل نفس السؤال»</span></div>
     <div class="row gold"><span class="num">◄</span><span class="txt">«نجرب أسبوعين؟ لو مش مرتاح… بناخدها وصحابنا برضه»</span></div>
   </div>`,
  `قولهم بصوت عالي، واحدة واحدة، وخلي القاعة تعيدهم وراك مرة واحدة. دي أول حاجة المراقب هيعلم عليها.<br>
   <b>«الكلام كله بروحكم انتوا — إلا الأربع جمل دول. دول بالنص.»</b> <em>⏱ ٣٠ ثانية.</em>`);

P("الافتتاح","",
  `<div class="kicker red">دي مش نصايح — دي خطوط حمرا</div>
   <h2>الممنوعات</h2>
   <div class="stopline">ممنوع تعد بأرباح أو نسبة زيادة في البيع — «مبيعاتك هتزيد ٢٠٪» دي كدبة.</div>
   <div class="stopline">ممنوع تعد بزيارات مسؤولين أو تصوير أو إعلانات — إحنا مش بنملك ده.</div>
   <div class="stopline">ممنوع تعد بإعفاءات ضريبية — الشراكة مع الوزارة شراكة مبادرة، مش واسطة.</div>
   <div class="stopline">ممنوع تقول رقم انت مش متأكد منه — قول: «ما أعرفش، هسأل وأرد عليك».</div>

   «وأنا مش هطلب منك تصدقني بكلامي: دي ورقة الانضمام، وده رقمي أنا شخصيًا، وده رقم الحاج اللي سبورته شغالة من ست شهور — اتصل بيه انت دلوقتي وأنا قاعد.»</div>`,
  `اسأل القاعة بعد ما تقراها: <b>«ليه الرد ده بيشتغل؟»</b> — خد إجابتين وبعدين اقفل بالجملة دي:<br>
   <b>«لأنه ما بيدافعش — بيوصف آلية. «الفلوس ما بتعدّيش علينا» دي حقيقة تشغيلية التاجر يشوفها بعينه، مش وعد.»</b><br>
   <em>في الحزمة مثال تاني محلول بالكامل («الزحمة هتطفش زبايني») — سيبه لهم يقروه، ما تقولوش دلوقتي. ⏱ ٥٠ ثانية.</em>`);

P("الجولة ٣","cue",``,
  `<b>أهم جولة في اليوم.</b> افتح <b>الجولة ٣</b> — واللفة دقيقة مش ٤٠ ثانية.<br>
   قبل ما تدوس ابدأ، قول الجملة دي: <b>«أول حاجة عليك مش الرد… أول حاجة عليك السكوت. ولو قاطعته، التاجر هيرجع من الأول والوقت هيروح منك.»</b><br>
   في الفيدباك خلي المراقبين على سؤال واحد بس: <b>قاطع ولا سكت؟</b>`, 3);

/* ---------- ٤ · البند الرابع ---------- */
P("البند الرابع","",
  `<div class="kicker">البند الرابع</div>
   <h1>الإغلاق البسيط</h1>
   <p class="lede">الهدف: تشيل من على التاجر أتقل حاجة — <b>الخوف من القرار الدايم</b>.</p>
   <div class="goldline" style="margin-top:1.4vh;font-size:1.2em"><b>ما تطلبش جواز… اطلب معاد.</b></div>
   <div class="lede" style="margin-top:1.2vh">وحاجة اتعلمناها من الشارع: <b>الحماس بيروح في يومين… والمسمار بيفضل.</b> فما تخرجش بوعد — اخرج بحاجة اتعملت.</div>`,
  `<b>«التاجر مش خايف من السبورة — خايف إنه يرتبط بحاجة ما يعرفش آخرها. لما بتقوله أسبوعين وبعدين انت حر، انت بتحوّل القرار من قرار عمر لقرار تجربة. والتجربة سهل يقول عليها آه.»</b> <em>⏱ ٢٥ ثانية.</em>`);

P("البند الرابع","",
  `<div class="kicker">التشريح — القطع والزمن</div>
   <h2>تلاتين ثانية… مفيش فيها سؤال مفتوح واحد</h2>
   <div class="rows">
     <div class="row"><span class="num">١</span><span class="txt">اشيل ضغط القرار<small>«أنا مش طالب منك قرار عمر» — وبعدها الجملة الذهبية بالنص.</small></span><span class="sec">٨ ثواني</span></div>
     <div class="row"><span class="num">٢</span><span class="txt">اطلب خطوة فورية ملموسة<small>السبورة تتعلق وانت واقف، والورقة تتمضي دلوقتي. مش بكرة.</small></span><span class="sec">١٠ ثواني</span></div>
     <div class="row"><span class="num">٣</span><span class="txt">حدد معاد بيوم وساعة<small>«الخميس الجاي الساعة أربعة» — مش «هعدي عليك».</small></span><span class="sec">٨ ثواني</span></div>
     <div class="row"><span class="num">٤</span><span class="txt">لو رفض: اقفل بكرامة وسيب الباب مفتوح<small>«تحت أمرك لو غيرت رأيك — ودي أرقامنا».</small></span><span class="sec">٤ ثواني</span></div>
   </div>`,
  `<b>«كل سؤال في الإغلاق إجابته آه… أو معاد. مفيش سؤال مفتوح واحد.»</b> <em>⏱ ٣٥ ثانية.</em>`);

P("البند الرابع","",
  `<div class="kicker">النص النموذجي — كلمة كلمة</div>
   <div class="quote">طب يا حاج، أنا مش طالب منك قرار عمر. <em>نجرب أسبوعين؟ لو مش مرتاح… بناخدها وصحابنا برضه.</em> ولو عجبتك، تفضل ومعاك على طول. وأنا معايا السبورة في العربية دلوقتي — نعلقها وأنا واقف، ودي ورقة واحدة بس: بياناتك وإمضاءك، ورقمي أنا شخصيًا مكتوب فوق. ونتفق دلوقتي على معاد أعدي عليك فيه أطمن — <b>الخميس الجاي الساعة أربعة يناسبك؟</b></div>
   <div class="meta">⏱ ٧٠ كلمة ≈ ٣٠ ثانية</div>`,
  `اقراها كلها بصوت عالي — قصيرة. وبعدين اسأل: <b>«مين لاحظ إن مفيش فيها سؤال مفتوح واحد؟»</b> <em>⏱ ٣٥ ثانية.</em>`);

P("البند الرابع","",
  `<div class="kicker red">أخطر غلطتين — واحدة بتضيع السبورة وواحدة بتحرق الشارع</div>
   <div class="pair">
     <div class="box bad"><h3>✗ السؤال المفتوح</h3><p>«طب إيه رأيك بقى؟ فكر وقولّي.»</p>
       <div class="why">«فكر» دعوة رسمية لـ«هفكر». واللي بيقول هفكر بينساك في يومين — مش لأنه كداب، لأنه مشغول. وانت خرجت من غير حاجة اتعملت ومن غير معاد.</div></div>
     <div class="box bad"><h3>✗ الزن بعد الرفض</h3><p>«طب دقيقة واحدة بس يا حاج… اسمعني… دي حاجة بسيطة والله… طب خليني أوريك بس…»</p>
       <div class="why">بيحرق المطعم ده خالص، وبيحرق اسمنا في الحتة كلها — لأن الراجل هيحكي.</div></div>
   </div>
   <div class="goldline" style="margin-top:1.2vh"><b>الصح:</b> «ربنا يكرمك يا حاج، أنا فهمتك. تحت أمرك لو غيرت رأيك في أي وقت — ودي أرقامنا.» — والراجل ده أول ما حد يسأله عن المبادرة هيقول: <b>ناس محترمة.</b></div>`,
  `اقفل الشريحة دي بالجملة اللي هترجع تاني بالليل في السوق:<br>
   <b>«افتكروا: التاجر بيرفض الفكرة في اللحظة دي… مش بيرفضك انت.»</b> <em>⏱ ٣٥ ثانية.</em>`);

P("الجولة ٤","cue",``,
  `افتح <b>الجولة ٤</b>. أقصر جولة — ٣٠ ثانية للفة، فالجرس هنا لازم يبقى قاسي.<br>
   في الفيدباك بند واحد بس: <b>حدد معاد بيوم وساعة… ولا لأ؟</b>`, 4);

/* ---------- ٥ · الحوار الكامل ---------- */
P("الجولة ٥","",
  `<div class="kicker green">دلوقتي بنجمّع</div>
   <h1>الحوار الكامل</h1>
   <p class="lede">انتوا مش بتجربوا حاجة جديدة — انتوا بتحطوا أربع حاجات اتدربتوا عليها الربع ساعة اللي فاتت ورا بعض.</p>
   <div class="rows" style="margin-top:1.4vh">
     <div class="row"><span class="num">١</span><span class="txt">افتتاحية ٣٠ ثانية</span><span class="sec">اتدربنا</span></div>
     <div class="row"><span class="num">٢</span><span class="txt">القيمة ليه هو</span><span class="sec">اتدربنا</span></div>
     <div class="row"><span class="num">٣</span><span class="txt">امتصاص القلق</span><span class="sec">اتدربنا</span></div>
     <div class="row"><span class="num">٤</span><span class="txt">الإغلاق البسيط</span><span class="sec">اتدربنا</span></div>
   </div>`,
  `<b>«دي مش قفزة في المجهول — دي تجميع لحاجات انتوا متمكنين منها.»</b> ودوس على طول، ما تشرحش. <em>⏱ ٢٠ ثانية.</em>`);

P("الجولة ٥","cue",``,
  `افتح <b>الجولة ٥</b> — دقيقة ونص للفة، والفيدباك ١٠ ثواني بس (بيتقال بعدين في القفلة).<br>
   وانت واقف بينهم: اسمع جملة حلوة واحدة من أي حد — هتحتاجها في القفلة بالاسم.`, 5);

/* ---------- القفلة ---------- */
P("القفلة","",
  `<div class="kicker">القفلة</div>
   <h1 class="mega">هيكل… مش قفص</h1>
   <p class="lede">الأربع خطوات بترتيبهم ثابتين — <b>والكلام جواهم بروحكم انتوا</b>.
   اللي هيحفظه كالببغاء هيتكسف أول ما التاجر يخرج عن النص. واللي فاهم <b>ليه</b> كل خطوة موجودة… عمره ما هيتوه.</p>`,
  `قولها ببطء، ووقفة. ده معنى النهارده كله. <em>⏱ ٣٠ ثانية.</em>`);

P("القفلة","",
  `<div class="kicker gold">الجسر للساعة الجاية</div>
   <h1 style="font-size:3em">والتاجر… <span style="color:var(--gold)">هيخرج عن النص</span></h1>
   <p class="lede" style="font-size:1.5em">التاجر في التمرين ده كان طيب. التاجر الحقيقي هيقولكم كلام تاني خالص —
   <b>وده بالظبط موضوع الساعة الجاية.</b></p>`,
  `آخر جملة قبل فقرة «اخلع من دماغي». قولها وانت ماشي ناحية الفليب شارت — الحركة نفسها بتفتح الفقرة اللي بعدها.<br>
   <em>⏱ ١٥ ثانية. الساعة المفروض ١٢:٢٠.</em>`);

/* ============================================================
   المحرك
   ============================================================ */
let i = 0, notesOn = false, mapOn = false;
let live = { round:0, lap:1, phase:"idle", t0:0 }, synced = false;
const $ = s => document.querySelector(s);
const mmss = s => Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
const AR = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);

/* --- شريحة الجولة: بتتبني لحظيًا عشان العدّاد --- */
function cueHTML(n){
  const r = RD[n-1];
  const on = live.round === n && live.phase !== "idle";
  const D = on ? (live.phase==="prep" ? r.prep : live.phase==="run" ? r.lap : live.phase==="feedback" ? r.fb : 0) : 0;
  const L = on && D ? Math.max(0, D - Math.floor((Date.now()-live.t0)/1000)) : null;
  const cls = live.phase!=="run" ? "idle" : L<=5 ? "over" : L<=10 ? "warn" : "";
  const ph = {idle:"مستني الجرس", prep:"تجهيز", run:"شغال — الجرس ماشي", feedback:"فيدباك وتبديل", done:"الجولة خلصت"}[on?live.phase:"idle"];
  return `<div class="cue">
    <div class="left">
      <div class="kicker gold">الجولة ${AR(n)} من ٥ · ${r.name}</div>
      <div class="say"><small>قول دي بصوت عالي… وبعدين دوس «ابدأ اللفة»</small><p>«${r.say}»</p></div>
      <div class="checks" style="border:1px solid var(--line);border-radius:14px;padding:1.2vh 14px;background:var(--ink2)">
        <div style="color:var(--raqib);font-weight:800;border:0;padding-bottom:.6vh">اللي المراقب بيعلّم عليه دلوقتي</div>
        ${r.raqib.map(t=>`<div>• ${t}</div>`).join("")}
      </div>
    </div>
    <div class="live">
      <div class="lbl">${synced ? "متزامن مع لوحة المدرب" : "الشاشة دي بتتفرج بس — امشِ بجرسك"}</div>
      <div class="clock ${cls}">${L===null ? "—" : mmss(L)}</div>
      <div class="phase">${ph}</div>
      <div class="lap">${on ? `اللفة ${AR(live.lap)} / ٣` : `٣ لفات · اللفة ${AR(r.lap)} ثانية`}</div>
      <div class="roles"><span class="r1">راعي</span><span class="r2">تاجر</span><span class="r3">مراقب</span></div>
      <div class="lbl" style="margin-top:1.2vh">الأدوار بتلف مع كل لفة</div>
    </div>
  </div>`;
}

function render(){
  const s = S[i];
  $("#slide").innerHTML = s.cue ? cueHTML(s.cue) : s.html;
  $("#tsec").textContent = s.sec;
  $("#tnum").textContent = AR(i+1) + " / " + AR(S.length);
  $("#notesIn").innerHTML = s.notes || "—";
  $("#steps").innerHTML = S.map((x,j)=>`<i class="${j===i?'on':j<i?'done':''}"></i>`).join("");
  $("#tsync").textContent = synced ? "لوحة المدرب متصلة" : (window.__nosync ? "بدون مزامنة" : "مش متصل");
  $("#tdot").className = "dot" + (synced ? " on" : "");
}
function go(n){ i = Math.max(0, Math.min(S.length-1, n)); render(); }
function next(){ go(i+1) } function prev(){ go(i-1) }

/* --- الخريطة --- */
function drawMap(){
  $("#mapIn").innerHTML = S.map((s,j)=>`<button class="${j===i?'on':''}" onclick="go(${j});toggleMap()">
    <small>${s.sec}</small><b>${s.cue ? "▶ افتح الجولة "+AR(s.cue) : (s.html.match(/<h1[^>]*>([\s\S]*?)<\/h1>/) || s.html.match(/<h2[^>]*>([\s\S]*?)<\/h2>/) || [,"—"])[1].replace(/<[^>]+>/g,"")}</b></button>`).join("");
}
function toggleMap(){ mapOn = !mapOn; $("#map").classList.toggle("on", mapOn); if(mapOn) drawMap(); }
function toggleNotes(){ notesOn = !notesOn; $("#notes").classList.toggle("on", notesOn); }

/* --- المزامنة مع لوحة المدرب (اختيارية بالكامل) --- */
async function pull(){
  if(window.__nosync || typeof SYNC === "undefined") return;
  try{
    const st = await SYNC.getState();
    if(st){ live = { round:st.round, lap:st.lap, phase:st.phase, t0:st.t0 }; synced = true; }
  }catch(e){ synced = false; }
}
if(!window.__nosync && typeof SYNC !== "undefined"){
  pull().then(render);
  setInterval(async ()=>{ const before = live.round; await pull();
    /* لو محمود فتح جولة من لوحة المدرب والعرض لسه على شريحة تانية — العرض بيلحقه */
    if(live.round && live.round !== before){
      const t = S.findIndex(s=>s.cue===live.round); if(t>=0) i = t;
    }
    render();
  }, 2000);
}
setInterval(()=>{ if(S[i].cue) render(); }, 1000);

/* --- التحكم --- */
addEventListener("keydown", e=>{
  if(e.key==="ArrowLeft" || e.key===" " || e.key==="PageDown"){ e.preventDefault(); next(); }
  else if(e.key==="ArrowRight" || e.key==="PageUp"){ e.preventDefault(); prev(); }
  else if(e.key==="Home"){ go(0) } else if(e.key==="End"){ go(S.length-1) }
  else if(e.key.toLowerCase()==="n" || e.key==="ن"){ toggleNotes() }
  else if(e.key.toLowerCase()==="m" || e.key==="م"){ toggleMap() }
  else if(e.key.toLowerCase()==="f"){ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
  else if(e.key==="Escape"){ if(mapOn) toggleMap(); if(notesOn) toggleNotes(); }
});
let x0=null;
addEventListener("touchstart", e=>{ x0 = e.touches[0].clientX }, {passive:true});
addEventListener("touchend", e=>{
  if(x0===null) return; const dx = e.changedTouches[0].clientX - x0; x0=null;
  if(Math.abs(dx) > 60){ dx > 0 ? prev() : next(); }
}, {passive:true});
addEventListener("click", e=>{
  if(mapOn || notesOn || e.target.closest("#notes,#map")) return;
  (e.clientX < innerWidth/2) ? next() : prev();
});

render();
</script>
