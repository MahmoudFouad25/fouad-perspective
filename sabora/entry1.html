<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سبورة المحروسة — شاشات الدخلة</title>
<style>
  :root{
    --bg:#12100c;            /* أسود دافئ */
    --bg-black:#070503;      /* شرائح شبه سوداء */
    --chalk:#f5efe1;         /* أبيض طبشوري دافئ */
    --gold:#f0b429;          /* ذهبي دافئ للأرقام */
    --gold-soft:#e8862e;     /* برتقالي */
    --wood-1:#6b4a2b;
    --wood-2:#3d2a17;
    --muted:#b7a98d;
    --font:"Tahoma","Segoe UI","Arial",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#000}
  body{
    font-family:var(--font);
    direction:rtl;
    color:var(--chalk);
    -webkit-font-smoothing:antialiased;
  }

  /* إطار السبورة الخشبي حوالين الشاشة كلها */
  .board{
    position:fixed;inset:0;
    background:
      radial-gradient(120% 120% at 50% 0%, rgba(240,180,41,.06), transparent 55%),
      var(--bg);
    padding:clamp(10px,1.6vh,22px);
  }
  .board::before{ /* لمسة الخشب */
    content:"";position:absolute;inset:0;
    padding:clamp(10px,1.6vh,22px);
    background:linear-gradient(135deg,var(--wood-1),var(--wood-2) 45%,#241609 90%);
    -webkit-mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
            mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
    border-radius:14px;
    box-shadow:inset 0 0 0 2px rgba(0,0,0,.5);
    pointer-events:none;
  }
  .inner{
    position:relative;height:100%;width:100%;
    border-radius:8px;overflow:hidden;
    background:
      radial-gradient(90% 120% at 50% 40%, rgba(255,255,255,.015), transparent 60%);
  }
  .chalkdust{ /* غبار طبشور خفيف جداً */
    position:absolute;inset:0;pointer-events:none;opacity:.5;
    background:
      radial-gradient(1px 1px at 20% 30%, rgba(245,239,225,.10), transparent),
      radial-gradient(1px 1px at 70% 60%, rgba(245,239,225,.08), transparent),
      radial-gradient(1px 1px at 45% 80%, rgba(245,239,225,.07), transparent),
      radial-gradient(1px 1px at 85% 25%, rgba(245,239,225,.06), transparent);
  }

  /* الشرائح */
  .slide{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:6vh 6vw;gap:2.2vh;
    opacity:0;visibility:hidden;transform:scale(.985);
    transition:opacity .6s ease,transform .6s ease,visibility .6s;
  }
  .slide.active{opacity:1;visibility:visible;transform:scale(1)}
  .slide.dark{background:var(--bg-black)}

  .kicker{color:var(--muted);font-size:clamp(1rem,2.4vh,2rem);font-weight:bold}
  .hero{
    color:var(--gold);
    font-weight:bold;line-height:.95;
    font-size:26vh;                     /* الأرقام هي البطل — فوق 25% من الارتفاع */
    text-shadow:0 0 40px rgba(240,180,41,.35),0 0 4px rgba(240,180,41,.5);
    letter-spacing:0;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .hero.med{font-size:20vh}
  .unit{color:var(--gold-soft);font-size:clamp(1.4rem,5vh,4rem);font-weight:bold;margin-top:-.5vh}
  .line{color:var(--chalk);font-size:clamp(1.6rem,5.6vh,4.6rem);font-weight:bold;line-height:1.25;max-width:22ch}
  .sub{color:var(--muted);font-size:clamp(1.1rem,3vh,2.4rem);font-weight:bold}

  /* شريحة الفكرة والدخلة */
  .statement{color:var(--chalk);font-size:clamp(2rem,9vh,7rem);font-weight:bold;line-height:1.2;max-width:20ch}

  /* شريحة الهدف — رقمين */
  .duo{display:flex;align-items:center;justify-content:center;gap:5vw;flex-wrap:wrap}
  .duo .cell{display:flex;flex-direction:column;align-items:center;gap:.4vh}
  .duo .num{color:var(--gold);font-weight:bold;font-size:19vh;line-height:.95;
    text-shadow:0 0 34px rgba(240,180,41,.32);font-variant-numeric:tabular-nums}
  .duo .lbl{color:var(--gold-soft);font-size:clamp(1.3rem,4vh,3rem);font-weight:bold}
  .duo .sep{color:var(--muted);font-size:12vh;font-weight:bold}

  /* شريحة اللغز */
  .riddle{color:var(--chalk);font-size:clamp(2rem,8vh,6rem);font-weight:bold;line-height:1.25;max-width:24ch}
  .qmark{color:var(--gold);font-size:34vh;font-weight:bold;line-height:.8;
    text-shadow:0 0 50px rgba(240,180,41,.4);}

  /* أدوات التحكم */
  .fs-btn{
    position:fixed;top:16px;left:16px;z-index:10;
    background:rgba(0,0,0,.35);color:var(--muted);border:1px solid rgba(245,239,225,.18);
    border-radius:10px;padding:8px 14px;font-family:var(--font);font-weight:bold;
    font-size:14px;cursor:pointer;opacity:.5;transition:opacity .3s;
  }
  .fs-btn:hover{opacity:1;color:var(--chalk)}
  .dots{position:fixed;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:10}
  .dot{width:10px;height:10px;border-radius:50%;background:rgba(245,239,225,.22);transition:.3s}
  .dot.on{background:var(--gold);transform:scale(1.25);box-shadow:0 0 12px rgba(240,180,41,.6)}
  .hint{position:fixed;bottom:34px;left:0;right:0;text-align:center;color:var(--muted);
    font-size:13px;opacity:.4;z-index:10}

  @media (prefers-reduced-motion:reduce){
    .slide{transition:opacity .2s}
  }
</style>
</head>
<body>
<div class="board">
  <div class="inner">
    <div class="chalkdust"></div>

    <!-- 1 -->
    <section class="slide dark">
      <div class="statement">الفكرة دي عمرها أكتر من ١٠٠ سنة</div>
    </section>

    <!-- 2 -->
    <section class="slide">
      <div class="hero" data-count="4750000">0</div>
      <div class="unit">وجبة</div>
      <div class="sub">حملة عيش وملح</div>
    </section>

    <!-- 3 -->
    <section class="slide">
      <div class="hero" data-count="470">0</div>
      <div class="line">سبورة معلقة… في ٢٠ محافظة</div>
      <div class="sub">بشراكة رسمية مع وزارة التضامن الاجتماعي</div>
    </section>

    <!-- 4 -->
    <section class="slide">
      <div class="duo">
        <div class="cell">
          <div class="num" data-count="5000">0</div>
          <div class="lbl">مطعم</div>
        </div>
        <div class="sep">—</div>
        <div class="cell">
          <div class="num" data-count="1500000">0</div>
          <div class="lbl">وجبة</div>
        </div>
      </div>
      <div class="sub">بنهاية رمضان ٢٠٢٧</div>
    </section>

    <!-- 5 -->
    <section class="slide">
      <div class="qmark">؟</div>
      <div class="riddle">إيه علاقة سبورة المحروسة… بأحمد السقا؟</div>
    </section>

  </div>
</div>

<button class="fs-btn" id="fsBtn">⛶ ملء الشاشة</button>
<div class="hint">الأسهم أو المسافة للتنقّل</div>
<div class="dots" id="dots"></div>

<script>
  const slides=[...document.querySelectorAll('.slide')];
  const dotsWrap=document.getElementById('dots');
  let idx=0;
  slides.forEach((_,i)=>{const d=document.createElement('div');d.className='dot';dotsWrap.appendChild(d);});
  const dots=[...document.querySelectorAll('.dot')];

  function fmt(n){return n.toLocaleString('en-US');}
  function countUp(el){
    const target=+el.dataset.count;
    const dur=1500;const start=performance.now();
    function step(now){
      const p=Math.min((now-start)/dur,1);
      const e=1-Math.pow(1-p,3);           // ease-out
      el.textContent=fmt(Math.round(target*e));
      if(p<1)requestAnimationFrame(step);
      else el.textContent=fmt(target);
    }
    requestAnimationFrame(step);
  }
  function show(i){
    idx=(i+slides.length)%slides.length;
    slides.forEach((s,k)=>s.classList.toggle('active',k===idx));
    dots.forEach((d,k)=>d.classList.toggle('on',k===idx));
    const active=slides[idx];
    active.querySelectorAll('[data-count]').forEach(el=>{el.textContent='0';countUp(el);});
  }
  function next(){show(idx+1);}
  function prev(){show(idx-1);}

  document.addEventListener('keydown',e=>{
    if(['ArrowRight','ArrowDown','PageDown',' ','Spacebar'].includes(e.key)){e.preventDefault();next();}
    else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();prev();}
    else if(e.key==='Home'){show(0);}else if(e.key==='End'){show(slides.length-1);}
    else if(e.key.toLowerCase()==='f'){toggleFs();}
  });
  document.querySelector('.inner').addEventListener('click',next);

  function toggleFs(){
    if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  }
  document.getElementById('fsBtn').addEventListener('click',e=>{e.stopPropagation();toggleFs();});

  show(0);
</script>
</body>
</html>
