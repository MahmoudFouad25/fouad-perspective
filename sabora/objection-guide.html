<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دليل الاعتراضات — سبورة المحروسة</title>
<style>
:root{
  --bg:#0F1319; --panel:#161C24; --panel2:#1C232D; --panel3:#222B36;
  --line:#2A333F; --line2:#3A4552;
  --ink:#F1EEE6; --soft:#C7D0DB; --mute:#93A0AE; --dim:#63707E;
  --gold:#FFD24A; --gold-d:#4A3D14; --gold-bg:#171308;
  --mind:#5AA9FF; --mind-bg:#0E1A28;
  --heart:#FF7E9B; --heart-bg:#231016;
  --act:#5FD08A; --act-bg:#0E1E16;
  --warn:#FF6B6B; --warn-bg:#201113;
  --keep:#FFD24A;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
html,body{margin:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:"SF Arabic",-apple-system,"Segoe UI","Noto Kufi Arabic",Tahoma,Arial,sans-serif;
  font-size:16px;line-height:1.75;-webkit-text-size-adjust:100%;
}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(1100px 520px at 88% -8%,rgba(255,210,74,.05),transparent 60%),
             radial-gradient(900px 500px at -8% 108%,rgba(90,169,255,.05),transparent 62%)}

/* ===================== الهيكل ===================== */
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 20px}
@media(max-width:900px){ .wrap{padding:0 15px} }

header.top{position:sticky;top:0;z-index:40;background:rgba(15,19,25,.9);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:12px 20px}
@media(max-width:900px){ header.top{padding:10px 15px} }
.top .row{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px}
.top .brand{font-weight:900;font-size:17px;white-space:nowrap}
.top .brand small{display:block;font-size:11px;color:var(--mute);font-weight:600;letter-spacing:.04em}
.top .spacer{flex:1}
.search{position:relative;flex:1;max-width:340px}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);
  font:inherit;font-size:14px;border-radius:11px;padding:9px 36px 9px 12px}
.search input::placeholder{color:var(--dim)}
.search svg{position:absolute;right:11px;top:50%;transform:translateY(-50%);opacity:.5}
.modetog{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.modetog button{background:transparent;border:0;color:var(--mute);font:inherit;font-weight:800;font-size:13px;
  border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.modetog button.on{background:var(--gold);color:#0F1319}
.menubtn{display:none;background:var(--panel);border:1px solid var(--line);color:var(--ink);
  font:inherit;font-weight:800;font-size:14px;border-radius:11px;padding:9px 13px;cursor:pointer}
@media(max-width:900px){ .search{display:none} .menubtn{display:block} }

/* شبكة المحتوى */
.layout{display:grid;grid-template-columns:270px 1fr;gap:30px;padding:26px 0 90px;align-items:start}
@media(max-width:900px){ .layout{grid-template-columns:1fr;gap:0;padding:16px 0 90px} }

/* ===================== الشريط الجانبي ===================== */
aside{position:sticky;top:78px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;
  padding-inline-end:6px}
@media(max-width:900px){ aside{display:none} }
aside .grp{font-size:11px;letter-spacing:.14em;color:var(--dim);font-weight:800;margin:16px 6px 6px}
aside a{display:flex;gap:9px;align-items:center;text-decoration:none;color:var(--soft);
  border-radius:10px;padding:8px 10px;font-size:14px;line-height:1.4;transition:background .15s,color .15s}
aside a .dot{width:7px;height:7px;border-radius:50%;background:var(--line2);flex:0 0 auto}
aside a:hover{background:var(--panel)}
aside a.active{background:var(--panel2);color:var(--ink);font-weight:700}
aside a.active .dot{background:var(--gold)}
aside a.intro-link{color:var(--gold);font-weight:800}

/* شرائط التصنيف (كل الشاشات) */
.filters{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px;margin-bottom:6px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{background:var(--panel);border:1px solid var(--line);color:var(--soft);font:inherit;
  font-weight:800;font-size:13px;border-radius:99px;padding:8px 14px;cursor:pointer;white-space:nowrap;flex:0 0 auto}
.filters button.on{background:var(--ink);color:#0F1319;border-color:var(--ink)}
@media(min-width:901px){ .filters{position:sticky;top:78px;z-index:20;background:linear-gradient(var(--bg) 70%,transparent);
  padding-top:8px} }

/* ===================== المقدمة ===================== */
.hero{margin:2px 0 8px}
.hero .eyebrow{font-size:12px;letter-spacing:.22em;color:var(--gold);font-weight:800}
.hero h1{font-size:clamp(30px,5vw,46px);font-weight:900;line-height:1.08;letter-spacing:-.02em;margin:10px 0 8px}
.hero p{font-size:18px;color:var(--soft);max-width:56ch;margin:0}

.method{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin:20px 0}
.method h2{margin:0 0 4px;font-size:15px;letter-spacing:.04em;color:var(--gold);font-weight:900}
.method .flow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 6px}
@media(max-width:640px){ .method .flow{grid-template-columns:1fr 1fr} }
.method .step{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
.method .step .k{font-size:22px;font-weight:900;color:var(--gold);line-height:1}
.method .step .t{font-weight:800;margin-top:6px;font-size:15px}
.method .step .d{font-size:13px;color:var(--mute);margin-top:2px;line-height:1.5}

.styles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:8px}
@media(max-width:720px){ .styles{grid-template-columns:1fr} }
.stylec{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel2)}
.stylec .hd{display:flex;align-items:center;gap:9px;font-weight:900;font-size:16px}
.stylec .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto}
.stylec.mind .ic{background:var(--mind-bg)} .stylec.mind .hd{color:var(--mind)}
.stylec.heart .ic{background:var(--heart-bg)} .stylec.heart .hd{color:var(--heart)}
.stylec.act .ic{background:var(--act-bg)} .stylec.act .hd{color:var(--act)}
.stylec p{margin:8px 0 0;font-size:14px;color:var(--soft);line-height:1.6}
.stylec p b{color:var(--ink)}

/* ===================== كارت الاعتراض ===================== */
.obj{scroll-margin-top:150px;background:var(--panel);border:1px solid var(--line);border-radius:20px;
  padding:22px;margin:16px 0;transition:opacity .2s}
@media(max-width:900px){ .obj{padding:18px;scroll-margin-top:120px} }
.obj.hide{display:none}

.obj .head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.obj .idx{font-size:13px;font-weight:900;color:var(--gold);background:var(--gold-bg);border:1px solid var(--gold-d);
  border-radius:8px;padding:3px 10px}
.obj .cat{font-size:12px;font-weight:800;color:var(--mute);background:var(--panel3);border-radius:99px;padding:4px 11px}

/* فقاعة التاجر */
.bubble{position:relative;background:var(--panel2);border:1px solid var(--line2);border-radius:16px 16px 16px 4px;
  padding:16px 18px;font-size:20px;font-weight:800;line-height:1.5;color:#fff}
@media(max-width:900px){ .bubble{font-size:18px} }
.bubble::before{content:"التاجر بيقولك";position:absolute;top:-9px;right:14px;background:var(--panel);
  border:1px solid var(--line2);border-radius:99px;padding:1px 10px;font-size:11px;font-weight:800;color:var(--mute)}
.bubble .q{color:var(--gold);font-weight:900}

/* زر الكشف (وضع الاختبار) */
.reveal-btn{display:none;width:100%;margin-top:14px;background:var(--panel2);border:1px dashed var(--line2);
  color:var(--soft);font:inherit;font-weight:800;font-size:15px;border-radius:12px;padding:14px;cursor:pointer}
.reveal-btn:hover{border-color:var(--gold);color:var(--gold)}
body.test .obj .answer{display:none}
body.test .obj.open .answer{display:block}
body.test .obj:not(.open) .reveal-btn{display:block}

.answer{margin-top:16px}

/* القلق الحقيقي */
.concern{display:flex;gap:12px;align-items:flex-start;background:var(--gold-bg);border:1px solid var(--gold-d);
  border-radius:12px;padding:12px 14px;margin-bottom:16px}
.concern .lbl{flex:0 0 auto;font-size:12px;font-weight:900;color:var(--gold);letter-spacing:.02em;
  border-inline-end:1px solid var(--gold-d);padding-inline-end:12px;align-self:stretch;display:flex;align-items:center}
.concern .txt{font-size:14.5px;color:var(--soft);line-height:1.55}
.concern .txt b{color:var(--ink)}

/* الردود */
.resp-title{font-size:12px;letter-spacing:.12em;color:var(--mute);font-weight:800;margin:0 0 10px}
.resp{border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-bottom:10px;
  border-inline-start-width:3px}
.resp .rh{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.resp .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto}
.resp .nm{font-weight:900;font-size:15px}
.resp .when{font-size:12px;color:var(--mute);font-weight:600;margin-inline-start:auto;white-space:nowrap}
.resp p{margin:0;font-size:16px;line-height:1.7;color:var(--ink)}
@media(max-width:900px){ .resp .when{display:none} }

.resp.mind{border-color:var(--line);border-inline-start-color:var(--mind);background:linear-gradient(90deg,var(--mind-bg),transparent 55%)}
.resp.mind .ic{background:var(--mind-bg)} .resp.mind .nm{color:var(--mind)}
.resp.heart{border-inline-start-color:var(--heart);background:linear-gradient(90deg,var(--heart-bg),transparent 55%)}
.resp.heart .ic{background:var(--heart-bg)} .resp.heart .nm{color:var(--heart)}
.resp.act{border-inline-start-color:var(--act);background:linear-gradient(90deg,var(--act-bg),transparent 55%)}
.resp.act .ic{background:var(--act-bg)} .resp.act .nm{color:var(--act)}

/* الجملة اللي تتحفظ */
.keep{display:flex;gap:13px;align-items:center;background:var(--gold-bg);border:1px solid var(--gold-d);
  border-radius:14px;padding:15px 16px;margin:16px 0 12px}
.keep .star{flex:0 0 auto;width:34px;height:34px;border-radius:10px;background:#241C08;display:grid;place-items:center}
.keep .bd .l{font-size:11px;letter-spacing:.1em;color:var(--gold);font-weight:800;margin-bottom:3px}
.keep .bd .q{font-size:18px;font-weight:900;color:#FBEFCB;line-height:1.5}
@media(max-width:900px){ .keep .bd .q{font-size:16px} }

/* خلي بالك */
.avoid{display:flex;gap:12px;align-items:flex-start;background:var(--warn-bg);border:1px solid #3A1D1F;
  border-radius:14px;padding:13px 15px}
.avoid .ic{flex:0 0 auto;margin-top:2px}
.avoid .bd .l{font-size:12px;font-weight:900;color:var(--warn);margin-bottom:3px}
.avoid .bd p{margin:0;font-size:14.5px;color:#EBC4C4;line-height:1.6}
.avoid .bd p .said{color:#FF9B9B;font-weight:800}

.noresult{text-align:center;color:var(--mute);padding:50px 20px;font-size:17px;display:none}
.foot{text-align:center;color:var(--dim);font-size:13px;margin-top:36px;padding-top:20px;border-top:1px solid var(--line)}

/* ===================== الفهرس المنبثق (موبايل) ===================== */
#sheet{position:fixed;inset:0;z-index:60;background:rgba(8,11,15,.96);backdrop-filter:blur(6px);
  display:none;overflow:auto;padding:18px 15px 40px}
#sheet.on{display:block}
#sheet .sh-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
#sheet .sh-top h3{margin:0;font-size:20px}
#sheet .sh-top button{background:var(--panel);border:1px solid var(--line);color:var(--ink);font:inherit;
  font-weight:800;border-radius:10px;padding:8px 14px;cursor:pointer}
#sheet .grp{font-size:11px;letter-spacing:.14em;color:var(--dim);font-weight:800;margin:16px 4px 6px}
#sheet a{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink);background:var(--panel);
  border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:6px;font-size:15px;line-height:1.4}
#sheet a .n{font-size:12px;font-weight:900;color:var(--gold);flex:0 0 auto}
</style>

<body class="read">

<header class="top">
  <div class="row">
    <div class="brand">دليل الاعتراضات<small>سبورة المحروسة · إزاي ترد على التاجر</small></div>
    <div class="spacer"></div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
      <input id="q" type="search" placeholder="دوّر على اعتراض…" oninput="applyFilters()">
    </div>
    <div class="modetog">
      <button id="mRead" class="on" onclick="setMode('read')">قراءة</button>
      <button id="mTest" onclick="setMode('test')">اختبر نفسك</button>
    </div>
    <button class="menubtn" onclick="openSheet()">الفهرس</button>
  </div>
</header>

<div class="wrap">
  <div class="layout">
    <aside id="side"></aside>
    <main>
      <div class="filters" id="filters"></div>
      <div id="content"></div>
      <div class="noresult" id="noresult">مفيش اعتراض بالكلمة دي — جرّب كلمة تانية.</div>
      <div class="foot">
        سبورة المحروسة · صناع الحياة × وزارة التضامن<br>
        ١٧ اعتراض · لكل واحد ٣ طُرق للرد + الجملة اللي تتحفظ + غلطة توقعك. كل رد بيبدأ بالتصديق على قلق التاجر قبل الرد عليه.
      </div>
    </main>
  </div>
</div>

<div id="sheet">
  <div class="sh-top"><h3>كل الاعتراضات</h3><button onclick="closeSheet()">اقفل ✕</button></div>
  <div id="sheetList"></div>
</div>

<script>
/* أيقونات SVG صغيرة */
const IC = {
  mind:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5AA9FF" stroke-width="2" stroke-linecap="round"><path d="M9 18h6M10 21h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2h6c0-.8.4-1.5 1-2A7 7 0 0 0 12 2Z"/></svg>',
  heart:'<svg width="16" height="16" viewBox="0 0 24 24" fill="#FF7E9B" stroke="#FF7E9B" stroke-width="1.5"><path d="M12 21s-7-4.5-9.5-8.5C.8 9.5 2 6 5.2 6c1.9 0 3 .9 3.8 2 .8-1.1 1.9-2 3.8-2 3.2 0 4.4 3.5 2.7 6.5C19 16.5 12 21 12 21Z"/></svg>',
  act:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5FD08A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  star:'<svg width="18" height="18" viewBox="0 0 24 24" fill="#FFD24A"><path d="m12 2 2.9 6.3 6.9.7-5.1 4.7 1.4 6.8L12 17.8 5.9 20.5l1.4-6.8L2.2 9l6.9-.7L12 2Z"/></svg>',
  warn:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF6B6B" stroke-width="2" stroke-linecap="round"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>'
};

/* التصنيفات */
const CATS = {
  time:{label:"وقت وتأجيل"}, trust:{label:"ثقة وشك"}, official:{label:"خوف من الرسمية"},
  rep:{label:"سمعة ومكان"}, load:{label:"عبء وحسابات"}, dignity:{label:"كرامة ومبادئ"}
};

/* ===== البيانات — ١٧ اعتراض ===== */
const DATA = [
 { cat:"time", concern:"وقت", inside:"مش رفض للفكرة، ده رفض للّحظة. خايف تاخد من وقت شغله في الذروة.",
   obj:"أنا مش فاضي يا ابني، عندي أوردرات",
   mind:"معاك حق يا حاج، دلوقتي وقت شغل. أنا مش محتاج منك غير تلاتين ثانية دلوقتي، والباقي لما الدنيا تهدا. والفكرة نفسها ما بتاخدش من وقتك ولا دقيقة بعد ما تتعلق.",
   heart:"حاضر يا معلم، ما أطولش عليك. أنا اشتغلت في مطعم زي بتاعك وعارف الذروة بتبقى إزاي — عشان كده جاي أقولك حاجة في نص دقيقة، مش جاي أقعّدك.",
   act:"تمام يا حاج، مش وقته. أنا هعدي عليك بعد العصر لما الزحمة تهدا — الساعة كام تكون فاضية؟",
   keep:"أنا مش محتاج منك غير تلاتين ثانية دلوقتي — والفكرة ما بتاخدش من وقتك بعد ما تتعلق.",
   avoid:{said:"«دقيقتين بس والله هتعجبك!»", why:"وتفضل تتكلم خمس دقايق — بتأكد خوفه إنك هتضيّع وقته، وبيقفل."} },

 { cat:"trust", concern:"شك في النية", inside:"مش سؤال عن فلوس، ده اختبار لصدقك. خايف يتنصب عليه.",
   obj:"وانتوا هتاخدوا نسبة أكيد… مفيش حد بيشتغل ببلاش",
   mind:"حقك تشك يا حاج، الدنيا مليانة كلام. بس اسمع الآلية: الفلوس ما بتعدّيش علينا أصلًا — المتبرع بيدفع في إيدك انت، والإيصال من دفترك انت، وإحنا بنعد الوجبات بس. المؤسسة مش بتاخد قرش لا منك ولا منه.",
   heart:"وأنا مكانك كنت هسأل نفس السؤال يا حاج. بس بص، لو كنا بناخد نسبة كنت هبقى ببيعلك — مش بطلب منك تجرب أسبوعين وترجّعها لو مش عاجباك.",
   act:"ما تصدقنيش بكلامي — دي ورقة الانضمام مكتوب فيها ده بالنص، وده رقم حاج شغّال بالسبورة من ست شهور. كلمه واسأله دفع لنا قرش ولا لأ.",
   keep:"الفلوس ما بتعدّيش علينا أصلًا — المتبرع بيدفع في إيدك انت، والإيصال من دفترك انت.",
   avoid:{said:"«لأ لأ لأ إحنا ما بناخدش حاجة والله!»", why:"بسرعة وبقطع — القطع والحلفان بيأكدوا الشك بدل ما يفكّوه."} },

 { cat:"official", concern:"خوف رسمي", inside:"خوف من الرقابة والتفتيش. فهم الشراكة مع الوزارة كإنها عين حكومية عليه.",
   obj:"الحكومة وراكم؟ أنا مش عايز حد يجيلي المحل",
   mind:"سؤال مهم يا حاج. الشراكة مع الوزارة معناها إن المبادرة معترف بيها رسميًا — يعني انت مغطّى، مش متراقب. محدش هييجي يفتشك ولا يسألك، دي مبادرة خير مش جهة رقابية.",
   heart:"أنا فاهم قلقك، كلنا بنحب نبعد عن وجع الدماغ. بس الحكاية بالعكس: اسمك بيبقى في ورق مبادرة محترمة — حاجة تُحسبلك، مش عليك.",
   act:"الورق كله هيبقى عندك نسخة منه، تقراه وتوريه لأي حد. ولو حسّيت أي وقت إن في حاجة مضايقاك، بننزّل السبورة في نص ساعة — إحنا مش بنربطك بأي حاجة رسمية.",
   keep:"الشراكة معناها إنك مغطّى، مش متراقب — دي ضمانة ليك مش عين عليك.",
   avoid:{said:"«لأ خالص الوزارة مالهاش دعوة بيك، دي مجرد اسم بنحطه!»", why:"بتقلل من الشراكة اللي هي نفسها نقطة قوة، وبتبان بتتنصل."} },

 { cat:"trust", concern:"جرح قديم", inside:"مش شك، ده جرح. اتنصب عليه قبل كده باسم الخير. أصعبهم عاطفيًا.",
   obj:"جت ناس قبلكم باسم الخير وخدوا فلوس ومشيوا",
   mind:"ربنا يسامح اللي عملوا كده يا حاج، وبيصعّبوا على اللي بعدهم. عشان كده إحنا ما بناخدش منك ولا مليم أصلًا — مفيش فلوس تدّيها لحد عشان يهرب بيها. الوجبة بيدفعها المتبرع في إيدك انت.",
   heart:"أنا حاسس بيك، اللي اتنصب مرة بيبقى حذر مية مرة، وده حقك. أنا مش جاي آخد — أنا جاي أعلّق حاجة في محلك وأمشي، واللي هيدفع مش انت.",
   act:"ما تصدقش حد — لا أنا ولا غيري. دي ورقة رسمية باسم صناع الحياة، وده رقم حاج شغال معانا من ست شهور، وده مطعم تعدي عليه بنفسك. جرّب أسبوعين وانت اللي تحكم.",
   keep:"إحنا ما بناخدش منك مليم أصلًا — مفيش فلوس تدّيها لحد عشان يهرب بيها.",
   avoid:{said:"«لأ إحنا مش زي الناس دي، إحنا ناس محترمة!»", why:"ده كلام أي نصاب بيقوله؛ الدفاع بالكلام بيزوّد الشك. رُد بالآلية والورق مش بالوعد."} },

 { cat:"rep", concern:"سمعة", inside:"قلق على سمعة المحل وصورته. خايف يتحوّل لجمعية.",
   obj:"الجعانين هيزحموا المحل ويطفشوا الزباين",
   mind:"حقك تقلق على سمعة محلك. بس بص للي بيحصل فعلًا: اللي بياخد الإيصال بيدخل زي أي زبون، بيقعد على ترابيزة وبيدفع بإيصال بدل كاش. محدش بيعرف مين دافع فلوس ومين جاي بإيصال — ولا الزباين ولا حتى عمالك.",
   heart:"ده محلك وسمعتك اللي تعبت فيها سنين، ومن حقك تحميها. عشان كده إحنا نفسنا مصرّين إن اللي بياخد ما يتسألش وما يتبصّلوش — عشان محلك يفضل مطعم، مش يتحوّل لتوزيع.",
   act:"ولو حسّيت أي وقت إن في زحمة، بنقلل الإيصالات أو نخليها في ساعات محددة أو ننزلها خالص. جرّب أسبوعين، وانت اللي تقرر.",
   keep:"محدش بيعرف مين دافع كاش ومين جاي بإيصال — ده زبون داخل بياكل، مش صف ولا توزيع.",
   avoid:{said:"«لأ يا حاج دول ناس غلابة مش هيزحموا!»", why:"بتقلل من قلقه وبتأكدله إن فيه «دول» متميزين، وده نفسه اللي خايف منه."} },

 { cat:"load", concern:"عبء", inside:"قلق من عبء إداري ومسؤولية حسابات جديدة على عاتقه.",
   obj:"ومين هيحاسبني على الوجبات؟ أنا مش هبقى شغال محاسب عندكم",
   mind:"مفيش أي محاسبة عليك يا حاج. الإيصال بيتكتب مرة واحدة وبيتعلق، وخلاص. اللي بيحاسب ويعد ده إحنا — بيعدّي حد مننا يمر يسجّل، انت مالكش دعوة بأي ورقة.",
   heart:"انت مشغول بمحلك وبرزقك، وأنا مش جاي أزوّدك شغل — جاي أشيل عنك، مش أحمّلك.",
   act:"أول أسبوع أنا نفسي هعدي أوريك إن مفيش حاجة عليك خالص — بس تعلّق وتنساها. ولو لقيت أي عبء، قولي وبنظبطه أو ننزلها.",
   keep:"الإيصال بيتكتب مرة واحدة وبيتعلق وخلاص — اللي بيعد ويحاسب ده إحنا مش انت.",
   avoid:{said:"«بسيطة، هتكتب كام إيصال في اليوم يعني!»", why:"بتأكدله إن فيه شغل ورق يومي، وده اللي خايف منه بالظبط."} },

 { cat:"dignity", concern:"اعتزاز", inside:"مش رفض، ده اعتزاز. بيعمل خير فعلًا وحاسس إن الفكرة بتقلل منه. أذكى اعتراض.",
   obj:"طب ما أنا بتصدق أصلًا على كيفي من غير سبورة ولا دوشة",
   mind:"وده شرف ليك يا حاج، وربنا يكرمك. الفرق إن صدقتك بتوصل لما انت موجود وفي مزاج — السبورة بتخلي الخير يوصل كل يوم حتى في يوم ما تكونش فاكر، ولناس ما كانتش هتيجي تطلب منك في وشك.",
   heart:"أنا عارف إنك بتعمل خير كتير محدش شايفه، ودي أحلى حاجة فيك. إحنا مش جايين نعلّمك الخير — جايين نضيفلك طريقة توصّل بيها أكتر، من غير ما المحتاج يحرج ويطلب.",
   act:"خليها تمشي جنب اللي بتعمله، مش بدله. جرّب أسبوعين وشوف كام وجبة زيادة وصلت من اللي حابين يشاركوك — لو حسّيت إنها ما ضافتش حاجة، بناخدها.",
   keep:"صدقتك بتوصل لما انت موجود وفي مزاج — السبورة بتخلي الخير يوصل كل يوم، ولناس ما كانتش هتطلب في وشها.",
   avoid:{said:"«لأ ده اللي بتعمله مش كفاية، لازم حاجة منظمة!»", why:"بتقلل من خيره وبتهينه؛ هو فخور باللي بيعمله فيرفض عناد."} },

 { cat:"dignity", concern:"شرعي / ديني", inside:"قلق شرعي صادق — خايف يبقى رياء. أخطر نوع لو الرد غلط.",
   obj:"الصدقة في السر أحسن… ليه المنظرة والسبورة دي؟",
   mind:"كلامك صح يا حاج، وستر الصدقة أصله عظيم. وده بالظبط اللي الفكرة مبنية عليه: السبورة فيها إيصال مش اسم — المتبرع محدش يعرفه، والمحتاج بياخد من غير ما حد يعرفه. الاتنين مستورين عن بعض. اللي بيتشاف هو الفكرة نفسها عشان اللي محتاج يعرف إنها موجودة.",
   heart:"أنا بحب فيك خوفك ده يا حاج، ده خوف راجل قلبه حي. طمّنك: محدش هيعرف مين اللي حط ولا مين اللي خد. السبورة بتقول «في أكل مدفوع هنا» وبس — ما بتقولش مين دفعه ولا مين خده.",
   act:"لو حابب، اسم المتبرع ما يتكتبش خالص — إيصال برقم وخلاص. وانت نفسك لو مش عايز اسمك يبان، ما نحطش استيكر ولا حاجة. اللي يهمنا إن الوجبة توصل مستورة، مش إن حد يتشاف.",
   keep:"السبورة فيها إيصال مش اسم — المتبرع مستور والمحتاج مستور، والاتنين ما يعرفوش بعض. ده نفسه ستر الصدقة.",
   avoid:{said:"«لأ يا حاج ده مش رياء، ده عشان الناس تعرف وتقلّدك!»", why:"بتأكد مخاوفه إن فيه استعراض، وبتفتح باب جدال ديني انت خسرانه. صدّق على القيمة اللي بيخاف عليها وبيّن إن الفكرة بتحققها."} },

 { cat:"load", concern:"تشغيلي / طاقم", inside:"قلق من التنفيذ وطاقمه — مش من الفكرة نفسها.",
   obj:"العيال اللي شغالين عندي هيلخبطوا في الإيصالات ويعملوها مصيبة",
   mind:"قلق في محله يا حاج، أي نظام جديد بيخوّف من اللخبطة. بس ده أبسط من ما تتخيّل: إيصال بيتعلق بمشبك على السبورة، واللي بياخد بيشيل واحد. مفيش حسابات ولا تسجيل على عمالك — إحنا اللي بنعدّي نعد.",
   heart:"أنا اشتغلت مع عيال في مطاعم وعارف قصدك، مش كلهم بياخدوا بالهم. عشان كده خليناها حاجة ما تحتاجش منهم غير إنهم يعلّقوا ويسيبوا — أبسط من الأوردر العادي.",
   act:"تعالى نجرّبها أسبوع بعامل واحد بس اللي انت واثق فيه، وأنا أعدي أظبط معاه. لو لقيتها بتلخبط، بنغيّر الطريقة أو ننزلها.",
   keep:"مفيش حسابات ولا تسجيل على عمالك — إيصال بيتعلق واللي محتاج بيشيله، وإحنا اللي بنعد.",
   avoid:{said:"«العيال هيتعلموا بسرعة متقلقش!»", why:"بترمي قلقه على ناس هو مش واثق فيهم؛ صدّق وبسّط التنفيذ بدل ما تعده بتعلّمهم."} },

 { cat:"rep", concern:"المكان", inside:"عائق مادي حقيقي — وممكن يكون ذريعة مؤدبة للرفض.",
   obj:"المحل صغير ومفيش حتة أعلّق فيها حاجة",
   mind:"معاك حق، المكان مهم. بس السبورة صغيرة، أصغر من اللافتة اللي فوق بابك — بتتعلق ورا الكاشير أو على أي عمود، حتة ما بتاخدش أكتر من ورقة كبيرة. مش محتاجة مساحة، محتاجة تتشاف بس.",
   heart:"أنا شفت محلات أصغر من بتاعك علّقوها ولاقيوا لها حتة ما كانوش واخدين بالهم منها. تعالى نبص سوا، أنا متأكد هنلاقي ركن.",
   act:"خليني أشوف المكان دلوقتي معاك — لو مفيش أي حتة تنفع، أنا أول واحد هقولك خليها. مش هعلّقها في مكان يضايقك.",
   keep:"السبورة أصغر من اللافتة اللي فوق بابك — محتاجة تتشاف مش تاخد مساحة.",
   avoid:{said:"«هنلزّقها في أي مكان متقلقش!»", why:"بتوحي إنك هتفرض حاجة في محله من غير إذنه؛ اعرض المعاينة والاختيار بدل الفرض."} },

 { cat:"trust", concern:"تجربة فاشلة", inside:"خوف من الفشل مبني على شاهد قريب شافه بعينه.",
   obj:"في مطعم جنبنا حط حاجة زي دي وشالها بعد أسبوع",
   mind:"سؤال مهم، ولازم نعرف شالها ليه. في فرق بين حاجة فردية بتقف لما صاحبها يزهق، وحاجة متنظمة ورا مؤسسة بمتابعة أسبوعية. إحنا مش سبورة معلقة لوحدها.",
   heart:"أنا مش هقولك اللي جنبك غلط، يمكن حاجته ما كانتش متظبطة. بس ده بالظبط سبب إننا موجودين نتابع — عشان ما تبقاش لوحدك في نص السكة.",
   act:"تعرف اللي شالها؟ اسأله شالها ليه — وأنا كمان هديك رقم مطعم شغال معانا من ست شهور، اسأله هو كمّل إزاي. اسمع الاتنين وقارن.",
   keep:"في فرق بين حاجة فردية بتقف لما صاحبها يزهق، وحاجة ورا مؤسسة بتتابع كل أسبوع.",
   avoid:{said:"«دول أكيد عملوا حاجة غلط، إحنا مختلفين!»", why:"بتهاجم غيرك من غير ما تعرف وبتبان متعالي؛ اعترف إن الفشل وارد ووضّح فرق المتابعة."} },

 { cat:"time", concern:"تأجيل مزمن", inside:"تأجيل مؤدب — غالبًا رفض ناعم متخبّي في «هكلمكم».",
   obj:"سيبلي ورقة وأنا هبصلها وهكلمكم",
   mind:"تمام يا حاج، وأنا هسيبلك كل الورق. بس بصراحة: الورق لوحده بيتنسى في الدرج مش لأنك مش مهتم، لأنك مشغول. عشان كده أنا مش طالب قرار دلوقتي — طالب نجرب أسبوعين وانت حر بعدها.",
   heart:"أنا فاهمك ومش عايز أضغط عليك. بس اللي بيقول «هكلمكم» بيبقى قصده كويس والدنيا بتاخده — وأنا مش عايز أضيّع عليك حاجة حلوة عشان الزحمة.",
   act:"خد الورقة، وخليني بس أعلّق السبورة دلوقتي على تجربة — لو مش عاجباك في أي يوم، اتصل بيّ وأنا آجي أشيلها بنفسي. ونتفق على معاد، الخميس الساعة أربعة يناسبك؟",
   keep:"أنا مش طالب قرار دلوقتي — طالب نجرب أسبوعين وانت حر بعدها.",
   avoid:{said:"«تمام هسيبلك ورقة وربنا يوفقك!» وتمشي", why:"خرجت من غير خطوة ولا معاد، والورقة اتنست. حوّل التأجيل لتجربة + معاد محدد."} },

 { cat:"time", concern:"شريك غايب", inside:"ممكن حقيقي وممكن مخرج مؤدب — بيهرب من مسؤولية القرار لوحده.",
   obj:"أنا مش لوحدي في المحل، شريكي مسافر ولازم أرجعله",
   mind:"كلام سليم، والقرار المشترك حقه يتاخد سوا. بس التجربة دي ما بتلزمش الاتنين بحاجة — أسبوعين وبتترجّع لو محدش مرتاح. تقدر تبدأها وتقول لشريكك، ولو مش عاجبه بنشيلها.",
   heart:"احترامي إنك بتحترم شريكك ومستنيه، دي أمانة. بس الخير ما بيستناش حد يرجع من السفر — نجرب لحد ما يرجع، وهو يقرر معاك وهو شايف بعينه.",
   act:"كلّمه دلوقتي بالتليفون واحكيله في نص دقيقة وأنا مستني — أو نعلّقها تجربة وأنا أرجع لما يرجع نتكلم سوا، ورقمي معاك.",
   keep:"التجربة ما بتلزمش الاتنين بحاجة — ابدأها وقول لشريكك، ولو مش عاجبه بنشيلها.",
   avoid:{said:"«طب اتصل بيه دلوقتي!» بإلحاح", why:"لو ضغطت حسّسته إنك مستعجل ومش محترم غيابه؛ اعرض التجربة اللي ما بتلزمش حد كمخرج مريح."} },

 { cat:"trust", concern:"حجم الجدوى", inside:"شك في جدوى الفكرة نفسها، مش في نيتك.",
   obj:"هو مين اللي هيتبرع أصلًا؟ الناس مش معاها تاكل نفسها",
   mind:"سؤال منطقي يا حاج. بس اللي شفناه: مش محتاجين ناس كتير، محتاجين اللي بيدفع أصلًا يزوّد شوية. اللي بيدفع مية جنيه أكل، لو حب يزوّد تمن ساندوتش، دي وجبة. الناس بتحب تعمل خير وهي بتاكل لو الطريقة سهلة قدامها.",
   heart:"تصدّق أنا فاكرتها زيك في الأول؟ وبعدين شفت واحد بسيط بيزوّد جنيه على فطاره كل يوم عشان حد تاني ياكل. الخير مش في جيوب الأغنيا بس، الخير في اللي بيحس.",
   act:"خليها تمشي أسبوعين وشوف بعينك كام إيصال هيتعلق — ما تصدقنيش، صدّق السبورة. لو فضلت فاضية، يبقى معاك حق وبناخدها.",
   keep:"مش محتاجين ناس كتير — محتاجين اللي بيدفع أصلًا يزوّد تمن ساندوتش وهو بيدفع.",
   avoid:{said:"«الناس كلها هتتبرع متقلقش، دي هتتملّى في يوم!»", why:"وعد بحجم انت ما تضمنوش، ولو ما حصلش خسرته؛ رد بالآلية وبالتجربة اللي هو يشوفها بعينه."} },

 { cat:"trust", concern:"الاستغلال", inside:"قلق من إن الخير يروح لغير مستحقه.",
   obj:"اللي هياخدوا الوجبات دول نصهم مش محتاجين، هيستغلوها",
   mind:"قلق في محله، ومحدش عايز الخير يضيع. بس فكّر: اللي مش محتاج مش هيقف قدام الناس ياخد إيصال أكل — الكرامة بتفلتر بنفسها. وفي النموذج التاني، متطوعينا بيعرفوا الأسر ويوصّلوها بإيدهم.",
   heart:"أنا فاهم خوفك، مفيش أوجع من إن الخير يتاخد بغير حقه. بس اللي مضطر ياخد أكل من سبورة قدام الناس، غالبًا محتاج فعلًا — الغني ما بينزلش لده.",
   act:"في نموذجين: يا المحتاج ياخد من عندك، يا متطوعينا ياخدوا الوجبات ويوصّلوها لأسر معروفة ليهم. لو قلقان من الأول، نبدأ بالتاني — الوجبة توصل لحد انت مطمّن إنه محتاج.",
   keep:"اللي مش محتاج مش هيقف قدام الناس ياخد إيصال أكل — الكرامة بتفلتر بنفسها.",
   avoid:{said:"«لأ إحنا بنتأكد من كل واحد وبنسأله!»", why:"ده بيناقض الكرامة اللي هي أساس الفكرة (المحتاج بياخد من غير أسئلة)؛ رُد إن الكرامة نفسها فلتر."} },

 { cat:"load", concern:"حسابات وضرايب", inside:"قلق مالي ومحاسبي واقعي. المهم هنا: ما تعدش بأي إعفاء.",
   obj:"ده هيلخبطلي الحسابات والضرايب آخر السنة",
   mind:"سؤال مهم وحسّاس. الحكاية بسيطة محاسبيًا: الوجبة اللي بتتباع بإيصال تبرع بتتباع بسعرها العادي وبتتحسب مبيعات عادية زي أي وجبة — مفيش رقم جديد ولا بند غريب في دفترك. مفيش أي إعفاء ولا تغيير في وضعك الضريبي، وأنا مش هوعدك بده عشان ده مش من إيدي.",
   heart:"أنا مش محاسب ومش هلعب في اللي بيقلقك، ده رزقك. بس اللي أعرفه إنها ما بتزودش عليك أي ورقة رسمية جديدة — نفس دفترك، نفس حساباتك.",
   act:"لو حابب، اسأل محاسبك واحكيله الفكرة: وجبة بتتباع بسعرها ومتبرع دفعها. وأنا لو في أي سؤال ما أعرفوش، بقولك «هسأل وأرد عليك» — مش هخترع إجابة تلخبطك.",
   keep:"الوجبة بتتحسب مبيعات عادية بسعرها — مفيش رقم جديد ولا بند غريب في دفترك.",
   avoid:{said:"«متقلقش ده ممكن يجيبلك إعفاء ضريبي كمان!»", why:"وعد كاذب خطير؛ لو اتبنى عليه بيحرق كل حاجة. قول الحقيقة: مفيش إعفاء، وحساباتها عادية."} },

 { cat:"dignity", concern:"المقارنة", inside:"عنده بديل بيعمله فعلًا (الجامع) وحاسس إنكم زيادة عليه.",
   obj:"ما أنا ممكن أطلّع الأكل للجامع اللي جنبي وخلاص، مالكوا انتوا",
   mind:"وده خير كبير يا حاج، كمّل عليه. الفرق إن الأكل اللي بيروح للجامع بيوصل وقت معين ولناس بتيجي الجامع — السبورة بتخلي اللي محتاج وما بيروحش الجامع، أو اللي بيحرج، ياخد وهو قاعد زي أي زبون عندك.",
   heart:"اللي بتعمله مع الجامع جميل وربنا يتقبله. إحنا مش بديل ليه — إحنا نضيفلك ناس تانية: اللي نفسه ياكل في مطعم زي الناس مرة، مش ياخد أكل في كيس وهو مكسوف.",
   act:"خلي اللي بتعمله مع الجامع زي ما هو، وجرّب السبورة جنبه أسبوعين. لو لقيت إنها كررت نفس الناس ونفس الخير، بناخدها — بس أنا شايف إنها هتوصّل لناس تانية خالص.",
   keep:"السبورة بتوصّل للي محتاج وما بيروحش الجامع، أو اللي بيحرج ياخد قدام الناس — بياكل زي أي زبون عندك.",
   avoid:{said:"«لأ ده الجامع مش هيوصّل صح زينا!»", why:"بتقلل من خيره القائم وبتنافس مؤسسة دينية، فيرفض عناد؛ اعترف بخيره وبيّن إنك بتضيف مش بتبدّل."} }
];

const AR = n => String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
let activeCat = "all", query = "";

/* ===== بناء كارت ===== */
function card(o, i){
  return `
  <section class="obj" id="o${i}" data-cat="${o.cat}" data-text="${(o.obj+' '+o.concern+' '+o.inside).replace(/"/g,'')}">
    <div class="head">
      <span class="idx">${AR(i+1)}</span>
      <span class="cat">${CATS[o.cat].label}</span>
    </div>
    <div class="bubble">«<span class="q">${o.obj}</span>»</div>

    <button class="reveal-btn" onclick="this.closest('.obj').classList.add('open')">🤔 فكّر في ردك… وبعدين اكشف الحل</button>

    <div class="answer">
      <div class="concern">
        <span class="lbl">القلق الحقيقي</span>
        <span class="txt"><b>${o.concern}.</b> ${o.inside}</span>
      </div>

      <div class="resp-title">تلات طُرق للرد — اختار اللي يناسب التاجر اللي قدامك</div>
      <div class="resp mind">
        <div class="rh"><span class="ic">${IC.mind}</span><span class="nm">بالعقل</span><span class="when">لو بيفكّر بدماغه ويسأل «إزاي»</span></div>
        <p>${o.mind}</p>
      </div>
      <div class="resp heart">
        <div class="rh"><span class="ic">${IC.heart}</span><span class="nm">بالقلب</span><span class="when">لو بيتحرّك بإحساسه</span></div>
        <p>${o.heart}</p>
      </div>
      <div class="resp act">
        <div class="rh"><span class="ic">${IC.act}</span><span class="nm">بخطوة</span><span class="when">لو عايز يشوف مش يسمع</span></div>
        <p>${o.act}</p>
      </div>

      <div class="keep">
        <span class="star">${IC.star}</span>
        <span class="bd"><span class="l">لو هتفتكر جملة واحدة</span><span class="q">«${o.keep}»</span></span>
      </div>

      <div class="avoid">
        <span class="ic">${IC.warn}</span>
        <span class="bd"><span class="l">غلطة بتولّع الموقف</span><p><span class="said">${o.avoid.said}</span> — ${o.avoid.why}</p></span>
      </div>
    </div>
  </section>`;
}

/* ===== المقدمة ===== */
function intro(){
  return `
  <div class="hero" id="intro">
    <div class="eyebrow">دليل ميداني · بعد الكامب</div>
    <h1>لما التاجر يقولك «لأ»…<br>يبقى قال إيه بالظبط؟</h1>
    <p>كل اعتراض بيتقال في الشارع، جواه قلق حقيقي. الدليل ده بياخدك من كلمة التاجر ← للقلق اللي وراها ← لتلات طُرق ترد بيها ← للجملة اللي تتحفظ. اقراه براحتك، ولو حابب تختبر نفسك دوس «اختبر نفسك» فوق.</p>
  </div>

  <div class="method">
    <h2>إزاي أي رد بيتبني — أربع خطوات</h2>
    <div class="flow">
      <div class="step"><div class="k">١</div><div class="t">اسمع للآخر</div><div class="d">سيبه يخلّص، ما تقاطعش.</div></div>
      <div class="step"><div class="k">٢</div><div class="t">افهم القلق</div><div class="d">هو خايف من إيه فعلًا؟</div></div>
      <div class="step"><div class="k">٣</div><div class="t">صدّق وبعدين رُد</div><div class="d">«حقك تسأل» الأول.</div></div>
      <div class="step"><div class="k">٤</div><div class="t">اقفل بخطوة</div><div class="d">تجربة، ورقة، رقم يتصل بيه.</div></div>
    </div>
    <div class="styles">
      <div class="stylec mind"><div class="hd"><span class="ic">${IC.mind}</span>بالعقل</div><p>منطق ومعلومة. بتشرح الآلية والحقيقة. <b>للتاجر اللي بيفكّر بدماغه</b> وعايز يفهم «إزاي بيحصل».</p></div>
      <div class="stylec heart"><div class="hd"><span class="ic">${IC.heart}</span>بالقلب</div><p>مشهد أو حكاية صغيرة تلمسه. <b>للتاجر اللي بيتحرّك بإحساسه</b> أكتر من المنطق.</p></div>
      <div class="stylec act"><div class="hd"><span class="ic">${IC.act}</span>بخطوة</div><p>مش كلام — فِعل يطمّنه دلوقتي. <b>للتاجر الحَذِر</b> اللي بيقول «الكلام كتير، ورّيني».</p></div>
    </div>
    <p style="margin:14px 0 0;color:var(--mute);font-size:14px">مش لازم تقول التلاتة — دي ذخيرة تختار منها حسب اللي قدامك. و<b style="color:var(--soft)">«الجملة اللي تتحفظ»</b> في كل اعتراض هي أقوى جملة لو نسيت كل حاجة تفتكرها.</p>
  </div>`;
}

/* ===== الرندر ===== */
function build(){
  document.getElementById("content").innerHTML = intro() + DATA.map(card).join("");

  // الفلاتر
  const cats = ["all", ...Object.keys(CATS)];
  document.getElementById("filters").innerHTML = cats.map(c=>
    `<button class="${c==='all'?'on':''}" data-c="${c}" onclick="setCat('${c}')">${c==='all'?'الكل':CATS[c].label}</button>`).join("");

  // الشريط الجانبي
  const side = ['<a class="intro-link" href="#intro">إزاي تستخدم الدليل</a>'];
  Object.keys(CATS).forEach(c=>{
    side.push(`<div class="grp">${CATS[c].label}</div>`);
    DATA.forEach((o,i)=>{ if(o.cat===c) side.push(
      `<a href="#o${i}" data-i="${i}" data-cat="${c}"><span class="dot"></span>${o.obj.length>34?o.obj.slice(0,32)+'…':o.obj}</a>`); });
  });
  document.getElementById("side").innerHTML = side.join("");

  // فهرس الموبايل
  const sl = [];
  Object.keys(CATS).forEach(c=>{
    sl.push(`<div class="grp">${CATS[c].label}</div>`);
    DATA.forEach((o,i)=>{ if(o.cat===c) sl.push(
      `<a href="#o${i}" onclick="closeSheet()"><span class="n">${AR(i+1)}</span>${o.obj}</a>`); });
  });
  document.getElementById("sheetList").innerHTML = sl.join("");

  setupSpy();
}

/* الفلترة والبحث */
function setCat(c){ activeCat=c;
  document.querySelectorAll('#filters button').forEach(b=>b.classList.toggle('on',b.dataset.c===c));
  applyFilters(); }
function applyFilters(){
  query = (document.getElementById('q')?.value||"").trim();
  let shown=0;
  document.querySelectorAll('.obj').forEach(el=>{
    const okCat = activeCat==='all' || el.dataset.cat===activeCat;
    const okQ = !query || el.dataset.text.includes(query);
    const show = okCat && okQ; el.classList.toggle('hide',!show); if(show) shown++;
  });
  document.querySelectorAll('#side a[data-i]').forEach(a=>{
    a.style.display = (activeCat==='all'||a.dataset.cat===activeCat)?'':'none'; });
  document.querySelectorAll('#side .grp').forEach(g=>{
    // اخفي عنوان المجموعة لو كل عناصرها متخفية
    let n=g.nextElementSibling, any=false;
    while(n && n.tagName==='A'){ if(n.style.display!=='none'){any=true;break;} n=n.nextElementSibling; }
    g.style.display = any?'':'none';
  });
  document.querySelector('.hero').style.display = (activeCat==='all'&&!query)?'':'none';
  document.querySelector('.method').style.display = (activeCat==='all'&&!query)?'':'none';
  document.getElementById('noresult').style.display = shown?'none':'block';
}

/* الوضع */
function setMode(m){
  document.body.classList.toggle('test', m==='test');
  document.body.classList.toggle('read', m==='read');
  document.getElementById('mRead').classList.toggle('on', m==='read');
  document.getElementById('mTest').classList.toggle('on', m==='test');
  if(m==='read') document.querySelectorAll('.obj.open').forEach(o=>o.classList.remove('open'));
}

/* scroll-spy */
function setupSpy(){
  const links = [...document.querySelectorAll('#side a[data-i]')];
  const map = {}; links.forEach(a=> map[a.getAttribute('href').slice(1)] = a);
  const io = new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting){
      links.forEach(l=>l.classList.remove('active'));
      const a = map[e.target.id]; if(a) a.classList.add('active');
    }});
  }, {rootMargin:"-45% 0px -50% 0px", threshold:0});
  document.querySelectorAll('.obj').forEach(s=>io.observe(s));
}

/* فهرس الموبايل */
function openSheet(){ document.getElementById('sheet').classList.add('on'); }
function closeSheet(){ document.getElementById('sheet').classList.remove('on'); }
addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });

build();
</script>
</body>
</html>
