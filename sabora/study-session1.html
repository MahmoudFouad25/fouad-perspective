<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ذاكر النموذج الرباعي — سبورة المحروسة</title>
<style>
:root{
  --ink:#0C1015; --ink2:#141A22; --ink3:#1B2029; --line:#28313D;
  --chalk:#F4F1E8; --mute:#8A97A6; --dim:#5A6675;
  --gold:#FFD24A; --gold-d:#4A3D14;
  --raei:#4CA6FF; --tager:#FF8A3D; --raqib:#5FD08A;
  --danger:#FF5C5C; --danger-d:#4A1F22; --go:#5FD08A; --go-d:#1F4430;
  --maxw:640px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
html,body{margin:0}
body{
  background:var(--ink);color:var(--chalk);direction:rtl;
  font-family:"SF Arabic",-apple-system,"Segoe UI","Noto Kufi Arabic",Tahoma,Arial,sans-serif;
  font-size:17px;line-height:1.7;-webkit-text-size-adjust:100%;
}
/* رسم الطباشير الخفيف على الخلفية */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(255,210,74,.05), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(76,166,255,.05), transparent 60%);}
#doc{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto;padding:0 16px 90px}

/* ===== الشريط العلوي ===== */
#bar{position:sticky;top:0;z-index:30;background:rgba(12,16,21,.9);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);margin:0 -16px 0;padding:10px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:10px}
#bar .brand{font-size:13px;letter-spacing:.06em;color:var(--mute)}
#bar .brand b{color:var(--chalk);font-weight:800}
#bar button{background:var(--ink2);border:1px solid var(--line);color:var(--chalk);
  font:inherit;font-size:14px;font-weight:800;border-radius:10px;padding:8px 12px;cursor:pointer;white-space:nowrap}
#bar button:active{transform:translateY(1px)}
#prog{height:3px;background:var(--ink2);margin:0 -16px}
#prog i{display:block;height:100%;background:var(--gold);width:0;transition:width .25s}

/* ===== الغلاف ===== */
.cover{padding:9vh 0 5vh;text-align:center}
.cover .eyebrow{font-size:13px;letter-spacing:.24em;color:var(--gold);font-weight:800;margin-bottom:14px}
.cover h1{font-size:clamp(44px,13vw,74px);font-weight:900;line-height:1.02;letter-spacing:-.03em;margin:0 0 12px}
.cover p{font-size:19px;color:#C3CDD9;max-width:34ch;margin:0 auto}
.cover p b{color:var(--chalk)}
.cover .tag{display:inline-block;margin-top:22px;border:1px solid var(--gold-d);background:#151209;
  color:var(--gold);border-radius:99px;padding:7px 16px;font-size:14px;font-weight:800}

/* ===== الأقسام والعناوين ===== */
.section{scroll-margin-top:72px;padding-top:8px}
.divider{display:flex;align-items:center;gap:14px;margin:40px 0 18px}
.divider .n{flex:0 0 auto;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
  font-weight:900;font-size:20px;background:var(--ink2);border:1px solid var(--line)}
.divider.b1 .n{color:var(--raei);border-color:var(--raei)}
.divider.b2 .n{color:var(--tager);border-color:var(--tager)}
.divider.b3 .n{color:var(--raqib);border-color:var(--raqib)}
.divider.b4 .n{color:var(--gold);border-color:var(--gold)}
.divider .tt{flex:1 1 auto}
.divider .tt small{display:block;font-size:12px;letter-spacing:.16em;color:var(--mute);font-weight:700}
.divider .tt h2{margin:2px 0 0;font-size:30px;font-weight:900;line-height:1.15}
.divider .done{flex:0 0 auto;font-size:12px;color:var(--dim)}

h3.sub{font-size:13px;letter-spacing:.16em;color:var(--mute);font-weight:800;margin:26px 0 10px;
  display:flex;align-items:center;gap:8px}
h3.sub::before{content:"";width:16px;height:2px;background:var(--gold);border-radius:2px}

/* ===== الكروت ===== */
.card{background:var(--ink2);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.lede{font-size:18px;color:#CBD4DF;line-height:1.65}
.lede b{color:var(--chalk)}

.goldbox{border-inline-start:3px solid var(--gold);background:#1A1710;color:#EBE1C4;
  border-radius:0 12px 12px 0;padding:12px 14px;margin:12px 0;line-height:1.6}
.goldbox b{color:var(--gold)}
.stopbox{border-inline-start:3px solid var(--danger);background:#1B1113;color:#F2C9C9;
  border-radius:0 12px 12px 0;padding:12px 14px;margin:8px 0;line-height:1.6}

/* الجمل الذهبية */
.golden{display:flex;gap:12px;align-items:center;background:#151209;border:1px solid var(--gold-d);
  border-radius:14px;padding:14px;margin-bottom:8px}
.golden .m{color:var(--gold);font-weight:900;font-size:22px;flex:0 0 auto}
.golden .q{font-size:20px;font-weight:800;color:#F7EFD6;line-height:1.45}

/* التلات أسئلة */
.q3{display:grid;gap:10px}
.q3 .item{background:var(--ink2);border:1px solid var(--line);border-radius:14px;padding:14px}
.q3 .item .h{font-size:22px;font-weight:900;margin-bottom:4px}
.q3 .item .a{font-size:15px;color:#B9C4D1}
.q3 .item.a1 .h{color:var(--raei)} .q3 .item.a2 .h{color:var(--tager)} .q3 .item.a3 .h{color:var(--raqib)}

/* تشريح — القطع والزمن */
.piece{display:flex;gap:12px;align-items:flex-start;background:var(--ink2);border:1px solid var(--line);
  border-radius:14px;padding:13px 14px;margin-bottom:8px}
.piece .num{flex:0 0 auto;width:30px;height:30px;border-radius:9px;background:var(--ink);border:1px solid var(--line);
  display:grid;place-items:center;font-weight:900;color:var(--gold);font-size:15px}
.piece.gold{border-color:var(--gold-d);background:#151209}
.piece .bd{flex:1 1 auto}
.piece .k{font-size:18px;font-weight:800;line-height:1.4}
.piece.gold .k{color:var(--gold)}
.piece .s{font-size:12px;color:var(--mute);font-weight:700;white-space:nowrap;margin-inline-start:6px}
.piece .d{font-size:15px;color:#B9C4D1;margin-top:6px;line-height:1.6}
.piece .w{font-size:14px;color:#E7B4B4;margin-top:8px;padding-top:8px;border-top:1px dashed var(--danger-d)}
.piece .w::before{content:"⛔ ";}

/* النص النموذجي */
.script{background:#12100A;border:1px dashed var(--gold);border-radius:16px;padding:18px;
  font-size:18px;line-height:1.85;color:#F5EEDA;margin:8px 0}
.script em{color:var(--gold);font-style:normal;font-weight:800}
.script .stage{color:var(--mute);font-weight:600;font-size:15px}
.meta{font-size:13px;color:var(--mute);margin-top:8px;display:flex;gap:6px;align-items:center}
.meta b{color:#C9D2DD}

/* تبويبات الصيغ */
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{flex:1 1 auto;background:var(--ink2);border:1px solid var(--line);color:var(--mute);
  font:inherit;font-weight:800;font-size:14px;border-radius:10px;padding:9px 10px;cursor:pointer}
.tabs button.on{background:var(--gold);border-color:var(--gold);color:#0C1015}

/* الأخطاء */
.wrong{border:1px solid var(--danger-d);background:#1B1113;border-radius:14px;padding:14px;margin-bottom:10px}
.wrong .lbl{font-size:12px;letter-spacing:.12em;color:var(--danger);font-weight:800;margin-bottom:6px}
.wrong .said{font-size:17px;color:#F2C9C9;font-weight:700;line-height:1.5}
.wrong .why{font-size:14px;color:#C6A9A9;margin-top:8px;line-height:1.6}
.right{border:1px solid var(--go-d);background:#101A14;border-radius:14px;padding:14px;margin:-4px 0 12px}
.right .lbl{font-size:12px;letter-spacing:.12em;color:var(--go);font-weight:800;margin-bottom:6px}
.right p{margin:0;font-size:16px;color:#CFE6D8;line-height:1.6}
.right p b{color:#EAF6EE}

/* بلوك سؤال/رد (استفادتي + القلوق) */
.qa{background:var(--ink2);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:10px}
.qa .ask{background:var(--ink3);padding:12px 14px;font-weight:800;color:var(--tager);border-bottom:1px solid var(--line)}
.qa .ask::before{content:"التاجر: ";color:var(--mute);font-weight:600}
.qa .rep{padding:12px 14px;font-size:16px;line-height:1.7;color:#DDE5EE}
.qa .rep::before{content:"انت: ";color:var(--raei);font-weight:800}

/* القلق المحلول بالخطوات */
.steps{counter-reset:st}
.step{display:flex;gap:12px;margin-bottom:10px}
.step .b{flex:0 0 auto;width:28px;height:28px;border-radius:8px;background:var(--ink3);border:1px solid var(--line);
  display:grid;place-items:center;font-weight:900;color:var(--raqib);font-size:14px}
.step .c{flex:1 1 auto}
.step .c .t{font-weight:800;color:var(--raqib);font-size:15px}
.step .c .x{font-size:16px;color:#DDE5EE;line-height:1.7;margin-top:2px}

/* اختبر نفسك — كروت مقلوبة */
.flip{background:var(--ink2);border:1px solid var(--line);border-radius:14px;padding:0;margin-bottom:10px;
  cursor:pointer;overflow:hidden}
.flip .front{padding:15px 16px;font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:10px}
.flip .front .hint{font-size:12px;color:var(--dim);font-weight:600;white-space:nowrap}
.flip .back{max-height:0;overflow:hidden;transition:max-height .28s ease;
  border-top:1px dashed var(--line);background:#12100A}
.flip.open .back{max-height:400px}
.flip .back .in{padding:14px 16px;font-size:16px;line-height:1.7;color:#F5EEDA}
.flip .back .in em{color:var(--gold);font-style:normal;font-weight:800}

/* كارت «إزاي التمرين» — الأدوار */
.roles{display:grid;gap:10px}
.role{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--ink2)}
.role h4{margin:0 0 4px;font-size:18px}
.role.raei{border-color:var(--raei)} .role.raei h4{color:var(--raei)}
.role.tager{border-color:var(--tager)} .role.tager h4{color:var(--tager)}
.role.raqib{border-color:var(--raqib)} .role.raqib h4{color:var(--raqib)}
.role p{margin:0;font-size:15px;color:#B9C4D1}

.roundbar{display:flex;gap:6px;margin:10px 0}
.roundbar span{flex:1 1 auto;text-align:center;background:var(--ink2);border:1px solid var(--line);
  border-radius:10px;padding:8px 4px;font-size:12px;font-weight:800;color:var(--mute)}
.roundbar span b{display:block;color:var(--gold);font-size:16px}

/* زر «ذاكرت البند» */
.markbtn{display:block;width:100%;background:var(--ink2);border:1px solid var(--line);color:var(--chalk);
  font:inherit;font-weight:800;font-size:16px;border-radius:12px;padding:14px;cursor:pointer;margin:14px 0 4px}
.markbtn.on{background:var(--go-d);border-color:var(--go);color:#Dff2e6}
.markbtn.on::before{content:"✓ "}

/* الفهرس */
#idx{position:fixed;inset:0;z-index:50;background:rgba(6,9,13,.94);backdrop-filter:blur(6px);
  display:none;overflow:auto;padding:20px 16px 40px}
#idx.on{display:block}
#idx .top{display:flex;justify-content:space-between;align-items:center;max-width:var(--maxw);margin:0 auto 16px}
#idx .top h3{margin:0;font-size:22px;font-weight:900}
#idx .list{max-width:var(--maxw);margin:0 auto;display:grid;gap:8px}
#idx a{display:flex;justify-content:space-between;align-items:center;gap:10px;text-decoration:none;
  background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--chalk)}
#idx a .lead{display:flex;gap:12px;align-items:center}
#idx a .num{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:900;
  background:var(--ink);border:1px solid var(--line);font-size:14px;color:var(--gold)}
#idx a b{font-weight:800;font-size:17px}
#idx a .tick{color:var(--go);font-size:16px}

.foot{text-align:center;color:var(--dim);font-size:13px;margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}
kbd{border:1px solid var(--line);border-radius:6px;padding:1px 6px;font:inherit;font-size:.85em;color:var(--mute)}
</style>

<div id="bar">
  <span class="brand"><b>النموذج الرباعي</b> · للمذاكرة</span>
  <button onclick="openIdx()">☰ الفهرس</button>
</div>
<div id="prog"><i id="progi"></i></div>

<div id="doc"></div>

<div id="idx">
  <div class="top"><h3>الفهرس</h3><button onclick="closeIdx()" style="background:var(--ink2);border:1px solid var(--line);color:var(--chalk);font:inherit;font-weight:800;border-radius:10px;padding:8px 14px;cursor:pointer">اقفل ✕</button></div>
  <div class="list" id="idxList"></div>
</div>

<script>
/* ============================================================
   ذاكر النموذج الرباعي — كتيب مذاكرة فردية
   جامع لكل المحتوى: العرض + غرفة التمرين (room.html) + الحزمة الأولى.
   بيشتغل لوحده — مالوش علاقة بـ coach.html ولا بالنت.
   ============================================================ */

const GOLD = {
  karama:"تمنها مدفوع… وكرامته كاملة",
  qersh:"والمؤسسة مش بتاخد قرش",
  haqak:"حقك تسأل… وأنا مكانك كنت هسأل نفس السؤال",
  osbo3:"نجرب أسبوعين؟ لو مش مرتاح… بناخدها وصحابنا برضه"
};
const VARLABEL = ["فول وطعمية","كشري","مشويات / فطاطري"];

/* ---- بيانات البنود الأربعة (نصوص كاملة + صيغ + قطع + أخطاء) ---- */
const BANDS = [
{
 id:"b1", n:"١", color:"raei", name:"افتتاحية التلاتين ثانية",
 q:"هيضيع وقتي؟",
 goal:"تخلي الفكرة مفهومة قبل ما تتكلم عن نفسك — وتجاوب على «هيضيع وقتي؟» قبل ما يسأله.",
 why:"التاجر بيحكم عليك قبل ما تكمل دقيقة. الافتتاحية مش ملخص — <b>دي تذكرة دخول</b>. لو فيها كلمة زيادة، الباب بيتقفل قبل ما توصل للجملة المهمة. وعشان كده مبنية على أربع قطع بس، وكل قطعة ليها زمن.",
 pieces:[
   {k:"مين إحنا", s:"٧ ثواني", d:"اسمك + اسم المبادرة + الجهة، في نفس واحد. مش سيرة ذاتية.", w:"ما تحكيش تاريخ المؤسسة. التاجر مش بيسأل انتوا مين — بيسأل انتوا عايزين إيه."},
   {k:"إيه السبورة في جملتين", s:"١٢ ثانية", d:"الزبون بيزوّد تمن وجبة ← إيصال بيتعلق ← المحتاج بياخده وبياكل. بس.", w:"ممنوع تفاصيل الإيصال والمتابعة دلوقتي — دي بند تاني."},
   {k:GOLD.karama, s:"٤ ثواني · ذهبية", gold:1, d:"بالنص كده، وبهدوء، وبعدها وقفة صغيرة. دي اللي بتفرق بيننا وبين أي حاجة شافها قبل كده."},
   {k:GOLD.qersh, s:"٧ ثواني · ذهبية", gold:1, d:"«انت مش هتدفع قرش، والمؤسسة مش بتاخد قرش» — قولها قبل ما يسأل، مش بعد.", w:"ممنوع: «والتفاصيل المالية نتكلم فيها بعدين» — دي معناها عنده: في فلوس."}
 ],
 timing:"٨٠ كلمة ≈ ٣٣ ثانية · لو زادت عن ٤٠ ثانية، انت بتزوّد كلام مش في الورقة.",
 full:[
  "السلام عليكم يا حاج. أنا [اسمك] من مبادرة «سبورة المحروسة» — صناع الحياة، وبشراكة رسمية مع وزارة التضامن. معايا كلام تلاتين ثانية — لو مش عاجبك أقوم على طول. الفكرة سبورة خشب بتتعلق عندك: الزبون وهو بيدفع، لو حب، بيدفع تمن وجبة زيادة — نكتبلها إيصال ونعلقه على السبورة. واللي محتاج بيعدي، بياخد الإيصال، وبياكل عندك زي أي زبون دافع. §تمنها مدفوع… وكرامته كاملة.§ وقبل ما تسأل: انت مش هتدفع قرش، §والمؤسسة مش بتاخد قرش.§",
  "صباح الخير يا حاج. أنا [اسمك] من «سبورة المحروسة» — مبادرة من صناع الحياة وبشراكة مع وزارة التضامن. تلاتين ثانية وأمشي: انت عندك من الصبح ناس بتفطر، صح؟ اللي منهم يحب، وهو بيدفع، يدفع تمن طبق زيادة — نكتبله إيصال ونعلقه على سبورة خشب هنا. واللي محتاج بيدخل، بياخد الإيصال، وبيفطر زي أي زبون. §تمنها مدفوع… وكرامته كاملة.§ وانت مش هتدفع قرش، §والمؤسسة مش بتاخد قرش.§",
  "السلام عليكم يا أسطى. أنا [اسمك] من «سبورة المحروسة» — صناع الحياة، وبشراكة رسمية مع وزارة التضامن. كلامي تلاتين ثانية: عندك الزبون بيدفع عند الكاشير الأول قبل ما ياكل — دي أحسن لحظة في الدنيا للفكرة دي. وهو بيدفع بنسأله: تحب تزوّد طبق؟ لو قال آه — إيصال بيتعلق على السبورة اللي وراك. واللي محتاج بياخده وبيقعد على ترابيزة وبياكل زي أي حد. §تمنها مدفوع… وكرامته كاملة.§ وانت مش هتدفع قرش، §والمؤسسة مش بتاخد قرش.§"
 ],
 wrongs:[
   {said:"«أهلًا يا حاج. إحنا مؤسسة صناع الحياة، مؤسسة مصرية اتأسست من كذا سنة، وشغالة في التعليم والصحة والتنمية في ١٢ محافظة، وليها شراكات مع…»",
    why:"بدأت بنفسك مش بالفكرة. التاجر مش بيسأل «انتوا مين» — بيسأل «انتوا عايزين إيه». وبكده ضيّعت ١٥ ثانية من التلاتين.",
    right:"السبورة الأول في جملتين، والمؤسسة في نص جملة جنب اسمك، وكمّل."},
   {said:"«والتفاصيل المالية نتكلم فيها بعدين لما نتفق.»",
    why:"أخطر جملة في أول تلاتين ثانية. في دماغ التاجر معناها: «في فلوس، وهو بيأجل الكلام عنها». من الثانية دي هو بيدور على مخرج.",
    right:"الطمأنة تتقال بدري ومباشرة: «انت مش هتدفع قرش، والمؤسسة مش بتاخد قرش» — ده مش تفصيل مالي، ده شرط دخول."},
   {said:"«الإيصال بيبقى فيه التاريخ والختم والرقم المسلسل، وأميرة مسؤولة المتابعة بتيجي كل أسبوع تعد وتسجل على السيستم…»",
    why:"تفاصيل تشغيلية بند تاني خالص، وبتغرق الافتتاحية. التاجر لسه ما قالش «آه» أصلًا.",
    right:"خلي الافتتاحية أربع قطع بس. التفاصيل دي ليها وقتها: لما يقول «طب إزاي؟» — ساعتها اشرح."}
 ],
 round:{lap:"٤٠ ثانية", tager:"تاجر عادي سهل عن قصد: «اتفضل يا ابني… عايز إيه؟» — بيسكت ويسمع، ما بيقاطعش.",
   raqib:["قال مين إحنا؟","وصف السبورة في جملتين؟","قال «تمنها مدفوع… وكرامته كاملة» نصًا؟","قال «والمؤسسة مش بتاخد قرش» قبل ما يُسأل؟","خلص في ٤٠ ثانية؟"]}
},
{
 id:"b2", n:"٢", color:"tager", name:"القيمة ليه هو",
 q:"هياخد مني فلوس؟",
 goal:"تجاوب على «وأنا استفادتي إيه؟» وتحترم عقل التاجر: مصلحته المشروعة مش عيب — دي أساس الشراكة.",
 why:"اللي بيستعطف تاجر بيحوله من <b>شريك</b> لـ<b>متبرع محرج</b>، والمحرج بيرفض. واللي بيديله مصلحة حقيقية بيمشي معاه سنين. القاعدة الحاكمة: <b>مصلحة حقيقية مش وعد كاذب</b> — الوعد الكاذب بيكسب سبورة النهارده وبيخسر خمس مطاعم بعد شهر.",
 pieces:[
   {k:"صدّق على السؤال", s:"٥ ثواني", d:"«سؤال في محله، ده محلك ورزقك». التاجر لازم يحس إن سؤاله مشروع مش وقح.", w:"ممنوع: «مالكش دعوة بالاستفادة، إحنا بنعمل خير» — دي إهانة لعقله."},
   {k:"انزع الوعد الكاذب بنفسك", s:"٨ ثواني", d:"«أنا مش هقولك مبيعاتك هتزيد كذا — ده كلام ما أقدرش أضمنه ومش هكدب عليك». الجملة دي بتشتري مصداقية أغلى من أي وعد.", w:"ممنوع: «صدقني مبيعاتك هتزيد ٢٠٪» — كدبة بتتكشف بعد ٣٠ يوم."},
   {k:"التلات حاجات الحقيقية", s:"٣٠ ثانية", d:"① الناس بتحب تاكل في المكان اللي فيه خير، والسبورة بتتشاف من الباب. ② سمعتك في الحتة — بيتحكى على القهوة قبل أي إعلان. ③ اسمك كشريك في مبادرة وراها صناع الحياة وبشراكة رسمية مع الوزارة — ورق واسم مش كلام.", w:"ممنوع الاستعطاف: «ربنا هيعوضك… في ناس بتنام من غير عشا»."},
   {k:"التذكير بالأساس", s:"٧ ثواني", d:"«انت بتبيع أكلك بسعره عادي — الوجبة بيدفعها المتبرع كاملة، وانت بتاخد فلوسك»."}
 ],
 timing:"١٢٠ كلمة ≈ ٥٠ ثانية · لو هز دماغه في نص التلات حاجات — اسكت وخلّيه يتكلم. المطلوب توصل، مش تخلص النص.",
 full:[
  "سؤال في محله يا حاج، وأنا كنت هزعل لو ما سألتوش — ده محلك ورزقك وحقك تعرف. بس خليني أقولك حاجة الأول: أنا مش هقولك مبيعاتك هتزيد كذا في المية — ده كلام ما أقدرش أضمنه، ومش هكدب عليك. اللي أقدر أقوله وشفته بعيني تلات حاجات. أول حاجة: الناس بتحب تاكل في المكان اللي فيه خير، والسبورة بتتشاف من الباب. تاني حاجة: سمعتك في الحتة — بقيت المطعم اللي بيعمل حاجة، وده بيتحكى على القهوة قبل أي إعلان. تالت حاجة: اسمك عندنا كشريك في مبادرة وراها صناع الحياة وبشراكة رسمية مع وزارة التضامن — وده ورق واسم، مش كلام. وفوق ده كله: انت بتبيع أكلك بسعره عندك عادي. الوجبة بيدفعها المتبرع كاملة… وانت بتاخد فلوسك.",
  "حقك تسأل يا حاج. أنا مش هوعدك بأرقام — بس بص: الناس هنا بتفطر عندك عشان أكلك حلو وقريب. اللي هيزيد إن اللي بيفطر بره وشايف السبورة من الشارع بيدخل. وحاجة تانية: العمال والصنايعية في الحتة بيتكلموا كتير — والمحل اللي فيه سبورة اسمه بيمشي بينهم من غير ما تدفع مليم إعلانات. وتالت حاجة: اسمك معانا كشريك في مبادرة وراها صناع الحياة وبشراكة مع وزارة التضامن — بالورق. وفي الآخر: انت بتبيع فولك وطعميتك بسعرهم عادي، والوجبة بيدفعها المتبرع كاملة.",
  "سؤال مظبوط يا أسطى، وأنا مكانك كنت هسأله. أنا مش هقولك هتبيع أكتر — أنا ما بضمنش حاجة زي دي. بس اللي أعرفه: عندك ناس بتيجي من بره الحتة مخصوص، وناس بتاخد أوردرات لبيوتها. السبورة بتخلي الحكاية عن محلك تتحكى — «الكشري اللي فيه سبورة» — ودي بتوصل لناس ما كانتش هتعرفك. وتاني حاجة: سمعتك وسط تجار الشارع، وده رصيد بيلزمك في يوم. وتالت حاجة: اسمك مسجل عندنا كشريك في مبادرة وراها صناع الحياة وبشراكة رسمية مع الوزارة. والأساس ما بيتغيرش: انت بتبيع طبقك بسعره، والوجبة بيدفعها المتبرع كاملة."
 ],
 extra:{ title:"لما يستفيض في «استفادتي إيه؟» — ردود جاهزة", pairs:[
   {q:"طب هي هتزوّد بيعي بكام؟", a:"ما أقدرش أقولك رقم يا حاج، واللي هيقولك رقم يبقى بيبيعلك كلام. اللي أقدر أعملهولك: أديك رقم حاج شغال بالسبورة من ست شهور — كلمه انت بنفسك واسأله. أنا مش هطلب منك تصدقني بكلامي."},
   {q:"أنا مش عايز شهرة ولا أسامي.", a:"تمام يا حاج، وده حقك. الاسم مش شرط — في مطاعم معلقة سبورة ومحدش عارف صاحبها مين. الاستيكر نفسه لو مضايقك ما نحطوش. اللي بيهمنا إن الوجبة توصل، مش إن اسمك يتنشر."},
   {q:"وأنا مالي بالوزارة؟ ما أنا مش عايز حد يجيلي المحل.", a:"الوزارة مش هتيجي محلك يا حاج ولا حد هيفتشك — الشراكة معناها إن المبادرة معترف بيها رسميًا، يعني انت مغطى، مش متراقب. ده ضمانة ليك مش عبء عليك."},
   {q:"طب هتجيبولي زباين إزاي؟ انتوا هتعملوا إعلان؟", a:"أنا مش هوعدك بإعلان ولا بتصوير — إحنا ما بنعملش كده. اللي بيحصل طبيعي: السبورة بتتشاف من الباب، والناس بتتكلم. ده اللي شفته، وده اللي أقدر أقوله."},
   {q:"وفيها إعفاء ضرايب ولا حاجة؟", a:"لأ يا حاج، وأنا مش هقولك آه عشان تمضي. الشراكة دي شراكة مبادرة خيرية، مالهاش علاقة بأي حاجة رسمية تانية. لو حد قالك غير كده يبقى بيضحك عليك."}
 ]},

{

 rule:{ t:"قاعدة لسان — احفظها", bad:"«حقك تسأل… <b>بس</b> بص يا حاج، إحنا…»", badwhy:"التاجر بيسمعها كده: «هو مستني أخلص عشان يرد». التصديق اتقال… وما وصلش.",
   good:"«حقك تسأل… <b>و</b>أنا هقولك اللي بيحصل بالظبط.»", goodwhy:"قولها مرة، ببطء، وقفة ثانية كاملة، وبعدين «و…» مش «بس…»." },
 full:[
  "(التاجر بيتكلم… وانت ساكت تمامًا لحد ما يخلص آخر كلمة) … §حقك تسأل يا حاج… وأنا مكانك كنت هسأل نفس السؤال.§ (وقفة ثانية) اللي بيحصل بالظبط كده: [الرد على قلقه هو بالتحديد، في جملتين تلاتة]. وأنا مش طالب منك تصدقني بكلامي: دي ورقة الانضمام، وده رقمي أنا شخصيًا، وده رقم حاج بيشغّل سبورة من ست شهور — اتصل بيه انت بنفسك.",
  "«يا ابني إحنا كبرنا في السوق… انتوا أكيد بتاخدوا نسبة.» ← §حقك تسأل يا حاج… وأنا مكانك كنت هسأل نفس السؤال.§ المؤسسة مش بتاخد قرش، لا منك ولا من المتبرع. الفلوس ما بتعدّيش علينا أصلًا — المتبرع بيدفعلك انت، والإيصال بيتكتب من دفترك. إحنا بنمشي على الفكرة مش على الفلوس. ودي ورقة الانضمام مكتوب فيها ده بالنص، وده رقم حاج شغال بالسبورة — كلمه.",
  "«أنا مش بشتغل من غير ما أعرف مين بياخد إيه.» ← §كلام سليم يا حاج… وأنا مكانك كنت هسأل نفس السؤال.§ الحكاية كلها مكتوبة: المؤسسة مش بتاخد قرش، انت مش بتدفع قرش، والمتبرع بيدفع تمن الوجبة كاملة بسعرها عندك — في إيدك انت. ودي ورقة الانضمام وفوقيها رقمي. اقراها براحتك ولو حاجة مش عاجباك ما تمضيش."
 ],

    <div class="lede">هو مش سامع كلامك أصلًا غير من خلال تلات أسئلة بيسألها لنفسه. لو جاوبت التلاتة في أول دقيقة… <b>الباب اتفتح</b>. ولو لأ — أشطر كلام في الدنيا مش هيدخل.</div>
    <div class="q3" style="margin-top:14px">
      ${Q3.map(q=>`<div class="item ${q.c}"><div class="h">${q.h}</div><div class="a">← ${q.a}</div></div>`).join("")}

  ${bandsHtml}

  <div class="section" id="test">
    <div class="divider"><div class="n">✎</div><div class="tt"><small>غطّي الإجابة وجاوب بصوت عالي</small><h2>اختبر نفسك</h2></div></div>
    <div class="lede">دوس على أي سؤال عشان تشوف الإجابة. لو جاوبت صح قبل ما تفتح — البند اتحفر.</div>
    <div style="margin-top:14px">
      ${FLASH.map((f,i)=>`
        <div class="flip" id="flip-${i}" onclick="flip(${i})">
          <div class="front"><span>${f.q}</span><span class="hint">دوس للإجابة</span></div>

  <div class="section" id="camp">

    <div class="roles" style="margin-top:14px">

      <div class="role raqib"><h4>المراقب</h4><p>معاه تشيك ليست — بيعلّم نعم/لا، وبعد كل لفة بيقول لزميله: حاجة صح + حاجة واحدة يظبطها.</p></div>
    </div>

/* ---- تبديل الصيغ ---- */
function pickVar(id, i){
  const b = BANDS.find(x=>x.id===id);
  document.querySelectorAll(`#tabs-${id} button`).forEach((el,j)=>el.classList.toggle("on", j===i));
  document.getElementById("var-"+id).innerHTML = `<div class="script">${gold(b.full[i]||b.full[0])}</div>`;
}

/* ---- كروت الاختبار ---- */
function flip(i){ document.getElementById("flip-"+i).classList.toggle("open"); }

/* ---- التقدم (بيتحفظ لو المتصفح سامح) ---- */
const KEY = "sbm:study:done";
let doneSet = new Set();
function storeGet(){ try{ return JSON.parse(localStorage.getItem(KEY)||"[]"); }catch(e){ return []; } }
function storeSet(a){ try{ localStorage.setItem(KEY, JSON.stringify(a)); }catch(e){} }
function loadDone(){ doneSet = new Set(storeGet()); BANDS.forEach(b=>reflectDone(b.id)); updateProg(); buildIdx(); }
function toggleDone(id){
  doneSet.has(id) ? doneSet.delete(id) : doneSet.add(id);
  storeSet([...doneSet]); reflectDone(id); updateProg(); buildIdx();
}
function reflectDone(id){
  const btn = document.getElementById("mark-"+id);
  const tag = document.getElementById("done-"+id);
  const on = doneSet.has(id);
  if(btn){ btn.classList.toggle("on", on); btn.textContent = on ? "ذاكرت البند ده" : "علّم إني ذاكرت البند ده"; }
  if(tag){ tag.textContent = on ? "✓ اتذاكر" : ""; tag.style.color = on ? "var(--go)" : ""; }
}
function updateProg(){
  const pct = Math.round(doneSet.size / BANDS.length * 100);
  document.getElementById("progi").style.width = pct + "%";
}

/* ---- الفهرس ---- */
const IDX = [
  ["؟","إزاي تذاكر ده","howto"],["◆","الأربع جمل الذهبية","golden"],["⛔","الممنوعات","forbid"],
  ["٣","التلات أسئلة","q3"],
  ["١","الافتتاحية","b1"],["٢","القيمة ليه هو","b2"],["٣","امتصاص القلق","b3"],["٤","الإغلاق البسيط","b4"],
  ["✎","اختبر نفسك","test"],["⚑","إزاي التمرين بيتعمل","camp"],["✓","القفلة","close"]
];
function buildIdx(){
  document.getElementById("idxList").innerHTML = IDX.map(([n,t,id])=>{
    const done = doneSet.has(id);
    return `<a href="#${id}" onclick="closeIdx()"><span class="lead"><span class="num">${n}</span><b>${t}</b></span><span class="tick">${done?'✓':''}</span></a>`;
  }).join("");
}
function openIdx(){ document.getElementById("idx").classList.add("on"); }
function closeIdx(){ document.getElementById("idx").classList.remove("on"); }

/* ---- تحديث شريط التقدم أثناء التمرير (تلميح بصري) ---- */
function observe(){
  addEventListener("keydown", e=>{ if(e.key==="Escape") closeIdx(); });
}

build();
</script>
