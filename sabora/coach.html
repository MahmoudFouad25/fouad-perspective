<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لوحة المدرب — النموذج الرباعي</title>
<style>
:root{
  --ink:#0C1015; --ink2:#161C24; --line:#2A333F;
  --chalk:#F4F1E8; --mute:#8A97A6;
  --gold:#FFD24A; --go:#5FD08A; --danger:#FF5C5C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--ink);color:var(--chalk);direction:rtl;
  font-family:"SF Arabic",-apple-system,"Segoe UI","Noto Kufi Arabic",Tahoma,Arial,sans-serif;
  font-size:17px;line-height:1.55}
#wrap{max-width:660px;margin:0 auto;padding:16px 16px 60px}
.eyebrow{display:flex;justify-content:space-between;align-items:center;font-size:12px;
  letter-spacing:.14em;color:var(--mute);border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--danger);display:inline-block;margin-inline-start:6px}
.dot.on{background:var(--go)}
.clock{font-variant-numeric:tabular-nums;font-size:60px;font-weight:900;line-height:.95;letter-spacing:-.04em;margin:4px 0 2px}
.clock.warn{color:var(--gold)} .clock.over{color:var(--danger)}
.phase{font-size:13px;color:var(--mute);letter-spacing:.1em;margin-bottom:14px}
h2.sec{font-size:12px;letter-spacing:.16em;color:var(--mute);margin:22px 0 8px;font-weight:700}
.card{background:var(--ink2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.grid button{padding:14px 0;border-radius:10px;border:1px solid var(--line);background:var(--ink2);
  color:var(--mute);font:inherit;font-weight:900;font-size:20px;cursor:pointer}
.grid button.on{background:var(--gold);border-color:var(--gold);color:#0C1015}
.bar{height:8px;background:var(--ink2);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--go);width:0}
.bar i.over{background:var(--danger)}
.say{border:1px dashed var(--gold);border-radius:12px;padding:14px;background:#151209;margin-bottom:12px}
.say small{color:var(--gold);font-size:11px;letter-spacing:.14em}
.say p{margin:6px 0 0;font-size:20px;font-weight:800;line-height:1.5}
.btn{display:block;width:100%;padding:16px;border-radius:12px;border:1px solid var(--line);
  background:var(--ink2);color:var(--chalk);font:inherit;font-weight:800;cursor:pointer;margin-bottom:8px}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:8px}.row>*{flex:1}
.mini{font-size:12px;color:var(--mute)}
.note{border-inline-start:3px solid var(--gold);padding:10px 12px;background:#1A1710;border-radius:0 10px 10px 0;font-size:15px;color:#E8DFC4;margin-bottom:10px}
.stop{border-inline-start:3px solid var(--danger);background:#1B1113;color:#F2C9C9}
input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--ink2);
  color:var(--chalk);font:inherit;text-align:center;font-size:22px;font-weight:800}
</style>
<script src="sync.js"></script>
<div id="wrap"></div>
<script>
/* ===== نفس مفاتيح التخزين بتاعة صفحة الناس ===== */
const PASS = "جرس";

const ROUNDS = [
 { n:1, name:"الافتتاحية وبس", prep:20, lap:40, fb:25, budget:240,
   raqib:["قال مين إحنا؟","وصف السبورة في جملتين؟","قال «تمنها مدفوع… وكرامته كاملة» نصًا؟","قال «والمؤسسة مش بتاخد قرش» قبل ما يُسأل؟","خلص في ٤٠ ثانية؟"],
   say:{ start:"يالا — الجولة الأولى: الافتتاحية وبس! مفيش قيمة، مفيش اعتراضات، مفيش إغلاق. أربع قطع بس. أربعين ثانية وجرس! جهزوا… ابدأوا!",
     swap:"(جرس) وقفوا! مراقبين — جملتين: حاجة صح وحاجة واحدة تتظبط. عشرين ثانية… بدلوا! الدورة ناحية اليمين. أربعين ثانية… ابدأوا!",
     end:"(جرس) وقفوا! سمعت حاجتين بتتكررا: ناس بدأت بالمؤسسة مش بالسبورة — التاجر مش بيسأل انتوا مين، بيسأل انتوا عايزين إيه. وناس نست «المؤسسة مش بتاخد قرش» — دي مش تفصيل، دي شرط دخول." } },
 { n:2, name:"القيمة وبس", prep:20, lap:50, fb:20, budget:240,
   raqib:["سمع السؤال للآخر قبل ما يرد؟","صدّق على السؤال في أوله؟","ذكر التلات حاجات (زباين + سمعة + اسمه مع الوزارة)؟","ما وعدش بأي رقم أو ربح أو إعلان؟","خلص في ٥٠ ثانية؟"],
   say:{ start:"يالا — الجولة التانية: القيمة وبس! التاجر هيسألك «وأنا استفادتي إيه أنا؟» — ورده تلات حاجات. وممنوع… ممنوع تعد بأي رقم. خمسين ثانية وجرس! ابدأوا!",
     swap:"(جرس) خلاص! مراقبين — لو زميلك وعد بأي رقم أو أي إعلان، قوله الجملة اللي قالها بالنص. عشرين ثانية… بدلوا! خمسين ثانية… ابدأوا!",
     end:"(جرس) وقفوا! سمعت واحد بيقول «مبيعاتك هتزيد» — واتنين بيقولوا «ربنا هيعوضك يا حاج». الوعد الكاذب بيكسب سبورة النهارده وبيخسر خمس مطاعم بعد شهر. والاستعطاف بيحوّل التاجر من شريك لمتبرع محرج — والمحرج بيرفض." } },
 { n:3, name:"امتصاص القلق وبس", prep:20, lap:60, fb:30, budget:300,
   raqib:["سكت لحد ما التاجر خلص جملته بالكامل؟","قال «حقك تسأل… وأنا مكانك كنت هسأل نفس السؤال» نصًا؟","سكت لحظة بعد التصديق وما قالش «بس»؟","رد على القلق نفسه مش على المؤسسة؟","قفل بحاجة التاجر يتحقق منها؟"],
   say:{ start:"يالا — الجولة التالتة، وهي أصعب واحدة النهارده: امتصاص القلق. التاجر معاه أربع قلوق هيختار واحد. وانت — أول حاجة عليك مش الرد… أول حاجة عليك السكوت. ولو قاطعته، التاجر هيرجع من الأول، والوقت هيروح منك. دقيقة وجرس! ابدأوا!",
     swap:"(جرس) وقفوا! مراقبين — سؤال واحد بس: قاطع ولا سكت؟ قولوهاله بصراحة. تلاتين ثانية… بدلوا! والتاجر الجديد يختار قلق تاني. دقيقة… ابدأوا!",
     end:"(جرس) خلاص! حاجة سمعتها من نص القاعة: «حقك تسأل… بس بص يا حاج». كلمة «بس» بتمسح كل اللي قبلها. شيلوا «بس» وحطوا «و». وسيبوا وقفة ثانية كاملة بعد جملة التصديق." } },
 { n:4, name:"الإغلاق وبس", prep:20, lap:30, fb:20, budget:180,
   raqib:["قال «نجرب أسبوعين؟…» نصًا؟","طلب خطوة فورية ملموسة؟","حدد معاد بيوم وساعة؟","ما سألش سؤال مفتوح («إيه رأيك؟»)؟","قفل بكرامة وما زنّش؟"],
   say:{ start:"يالا — الجولة الرابعة: الإغلاق وبس! التاجر هيقولك «خليني أفكر وتعالى بعدين» — وانت عندك تلاتين ثانية تخرج بحاجة اتعملت ومعاد بيوم وساعة. مش بوعد. تلاتين ثانية وجرس! ابدأوا!",
     swap:"(جرس) خلاص! مراقبين — بند واحد: حدد معاد بيوم وساعة ولا لأ؟ عشرين ثانية… بدلوا! تلاتين ثانية… ابدأوا!",
     end:"(جرس) وقفوا! أكتر جملة سمعتها: «طب إيه رأيك؟ فكر وقولّي». دي دعوة رسمية لـ«هفكر». اسألوا سؤال إجابته آه أو معاد. وما تخرجش بوعد… اخرج بحاجة اتعملت." } },
 { n:5, name:"الحوار الكامل", prep:20, lap:90, fb:10, budget:360,
   raqib:["الأربع بنود اتقالوا بالترتيب؟","الجمل الذهبية الأربعة اتقالوا نصًا؟","خلص في أقل من دقيقة ونص؟","مسك خيط التاجر؟","خرج بحاجة اتعملت ومعاد؟"],
   say:{ start:"يالا — الجولة الخامسة والأخيرة: الحوار كامل من السلام للإغلاق. وانتوا دلوقتي مش بتجربوا حاجة جديدة — انتوا بتجمّعوا أربع حاجات اتدربتوا عليها الربع ساعة اللي فاتت. دقيقة ونص لكل واحد. ابدأوا!",
     swap:"(جرس) بدلوا فورًا — عشر ثواني بس، الفيدباك بعدين! دقيقة ونص… ابدأوا!",
     end:"(جرس) وقفوا كلكم! النموذج ده هيكل مش قفص. الأربع خطوات بترتيبهم ثابتين… والكلام جواهم بروحكم انتوا. وبصوا: التاجر في التمرين ده كان طيب. التاجر الحقيقي هيقولكم كلام تاني خالص — وده بالظبط موضوع الساعة الجاية." } }
];

let S = { round:1, lap:1, phase:"idle", t0:0, seq:0 };
let ui = { gate:true, synced:false, err:null, test:null, testing:false };
let stats = { scope:null, n:0, rows:[], loading:false, err:null };

const $ = s => document.querySelector(s);
const R = () => ROUNDS[S.round-1];
const dur = () => S.phase==="prep"?R().prep : S.phase==="run"?R().lap : S.phase==="feedback"?R().fb : 0;
const left = () => Math.max(0, dur() - Math.floor((Date.now()-S.t0)/1000));
const mmss = s => Math.floor(s/60)+":"+String(s%60).padStart(2,"0");

async function push(){
  S.seq++;
  try{ await SYNC.setState(S); ui.synced=true; ui.err=null; }
  catch(e){ ui.synced=false; ui.err="المزامنة وقعت — قول للناس يستخدموا «وضع الجرس» ويمشوا بصوتك."; }
  render();
}
function setPhase(p){ S.phase=p; S.t0=Date.now(); push(); }
function nextLap(){ if(S.lap<3){ S.lap++; S.phase="idle"; S.t0=0; push(); } else { S.phase="done"; push(); } }
function setRound(n){ S.round=n; S.lap=1; clearStats(true); S.phase="idle"; S.t0=0; push(); }

async function collect(scope){
  stats.loading=true; stats.err=null; stats.scope=scope; render();
  try{
    const good = await SYNC.getResults(S.round, scope==="lap" ? S.lap : null);
    stats.rows = R().raqib.map((t,i)=>{
      const m = good.filter(v=>v[i]==="yes"||v[i]==="no");
      const no = m.filter(v=>v[i]==="no").length;
      return { t, no, m:m.length, pct: m.length? Math.round(no/m.length*100):0 };
    }).sort((a,b)=>b.pct-a.pct);
    stats.n = good.length;
    if(!good.length) stats.err = "مفيش نتايج لسه — المراقبين بيبعتوا أول ما تدوس الجرس.";
  }catch(e){ stats.err="مقدرتش أجمع. امشي بعينك."; stats.rows=[]; stats.n=0; }
  stats.loading=false; render();
}
function clearStats(quiet){ stats={scope:null,n:0,rows:[],loading:false,err:null}; if(!quiet) render(); }

function gate(){
  return `
  <div style="max-width:420px;margin:12vh auto 0;text-align:center">
    <div class="mini" style="letter-spacing:.2em">سبورة المحروسة · النموذج الرباعي</div>
    <h1 style="font-size:40px;font-weight:900;margin:10px 0 4px">لوحة المدرب</h1>
    <p class="mini" style="margin:0 0 12px">الصفحة دي لمحمود لوحده. لو انت متدرب — اقفلها وافتح لينك غرفة التمرين.</p>
    <div class="mini" style="margin:0 0 22px;color:${SYNC.crossDevice?'var(--go)':'var(--danger)'}">وضع المزامنة: ${SYNC.label}${SYNC.crossDevice?'':' — حط لينك Firebase في sync.js عشان يوصل لموبايلات الناس'}</div>
    <input id="p" placeholder="مفتاح المدرب" autocomplete="off"
      onkeydown="if(event.key==='Enter')tryGate()">
    <button class="btn" style="margin-top:10px;border-color:var(--gold);color:var(--gold)" onclick="tryGate()">افتح</button>
    <div id="ge" class="mini" style="color:var(--danger);height:18px;margin-top:8px"></div>
    <button class="btn" style="margin-top:18px;background:transparent;color:var(--mute)" onclick="runTest()">${ui.testing?"بختبر…":"اختبر الاتصال بالقاعدة"}</button>
    ${ui.test?`<div class="note ${ui.test.ok?'':'stop'}" style="text-align:right;border-inline-start-color:${ui.test.ok?'var(--go)':'var(--danger)'}">
        <b>${ui.test.ok?"✅ تمام":"❌ في مشكلة"}</b><br>${ui.test.msg}</div>`:""}
  </div>`;
}
async function runTest(){
  ui.testing=true; ui.test=null; render();
  ui.test = await SYNC.test();
  ui.testing=false; render();
}
function tryGate(){
  if($("#p").value.trim()===PASS){ ui.gate=false; setPhase("idle"); }
  else $("#ge").textContent = "المفتاح غلط.";
}

function topFix(){
  const r = stats.rows[0];
  if(!r || stats.n<3 || r.pct<30) return "";
  return `<div class="say stop" style="border:1px dashed var(--danger);background:#1B1113">
    <small style="color:var(--danger)">أهم تدخل دلوقتي · من ${stats.n} مراقب</small>
    <p><b style="color:var(--danger);font-size:28px">${r.pct}%</b> وقعوا في: ${r.t.replace("؟","")}</p>
    <div class="mini" style="margin-top:6px;color:#F2C9C9">قول دي بدل الجملة المكتوبة تحت — دي اللي حصلت في القاعة فعلًا.</div>
  </div>`;
}

function panel(){
  const R0=R(); const el=Math.floor((Date.now()-(S.t0||Date.now()))/1000);
  const L=left(); const cls = S.phase!=="run" ? "" : L<=5?"over" : L<=10?"warn" : "";
  const say = (S.phase==="prep"||S.phase==="idle") ? ["اقرا ده وبعدين دوس «ابدأ اللفة»", R0.say.start]
    : S.phase==="run" ? ["الجرس ماشي — استنى", "…"]
    : S.lap<3 ? ["اقرا ده وانت بتبدّل", R0.say.swap]
    : ["قفلة الجولة — اقرا ده", R0.say.end];
  return `
  <div class="eyebrow"><span>لوحة المدرب · محمود</span>
    <span>${ui.synced?SYNC.label:"مش متصل"}<span class="dot ${ui.synced?'on':''}"></span></span></div>
  ${ui.err?`<div class="note stop">${ui.err}</div>`:""}
  <div class="grid">${ROUNDS.map(r=>`<button class="${S.round===r.n?'on':''}" onclick="setRound(${r.n})">${r.n}</button>`).join("")}</div>
  <div style="display:flex;justify-content:space-between;align-items:baseline">
    <b style="font-size:22px">${R0.name}</b>
    <span class="mini">اللفة ${S.lap}/٣ · ميزانية الجولة ${mmss(R0.budget)}</span>
  </div>
  <div class="bar"><i class="${el>R0.budget?'over':''}" style="width:${Math.min(100, el/R0.budget*100)}%"></i></div>
  <div class="clock ${cls}">${S.phase==="run"?mmss(L):"—"}</div>
  <div class="phase">${{idle:"مستني",prep:"تجهيز",run:"شغال",feedback:"فيدباك وتبديل",done:"الجولة خلصت"}[S.phase]}</div>
  ${topFix()}
  <div class="say"><small>${say[0]}</small><p>«${say[1]}»</p></div>
  <div class="row">
    <button class="btn" style="border-color:var(--gold);color:var(--gold)" onclick="setPhase('prep')">تجهيز</button>
    <button class="btn" style="background:var(--go);border-color:var(--go);color:#08101A" onclick="setPhase('run')">ابدأ اللفة</button>
  </div>
  <div class="row">
    <button class="btn" style="border-color:var(--danger);color:var(--danger)" onclick="setPhase('feedback')">🔔 جرس — وقفوا</button>
    <button class="btn" onclick="nextLap()">${S.lap<3?"اللفة الجاية":"قفلة الجولة"}</button>
  </div>
  <div class="row" style="margin-bottom:4px">
    <button class="btn" style="background:transparent;color:var(--mute);padding:10px;font-size:13px" onclick="runTest()">${ui.testing?"بختبر…":"اختبر الاتصال"}</button>
  </div>
  ${ui.test?`<div class="note ${ui.test.ok?'':'stop'}" style="border-inline-start-color:${ui.test.ok?'var(--go)':'var(--danger)'}">${ui.test.ok?"✅":"❌"} ${ui.test.msg}</div>`:""}
  <h2 class="sec">نتايج المراقبين</h2>
  <div class="row">
    <button class="btn" onclick="collect('lap')">اجمع اللفة دي</button>
    <button class="btn" onclick="collect('round')">الجولة كلها</button>
  </div>
  ${stats.loading?`<div class="card mini">بجمع…</div>`:""}
  ${stats.err?`<div class="note">${stats.err}</div>`:""}
  ${stats.rows.length?`<div class="card">
      <div class="mini" style="margin-bottom:10px">${stats.scope==="lap"?`اللفة ${S.lap} من الجولة ${S.round}`:`الجولة ${S.round} — التلات لفات`} · <b style="color:var(--chalk)">${stats.n}</b> مراقب بعت</div>
      ${stats.rows.map(r=>{const c=r.pct>=50?"var(--danger)":r.pct>=25?"var(--gold)":"var(--go)";return `
        <div style="margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;font-size:14px;gap:10px">
            <span>${r.t}</span><b style="color:${c};white-space:nowrap">${r.pct}% لأ</b>
          </div>
          <div class="bar" style="margin:4px 0 0"><i style="width:${r.pct}%;background:${c}"></i></div>
          <div class="mini">${r.no} من ${r.m} علّموا لأ</div>
        </div>`;}).join("")}
      <button class="btn" style="margin:0;background:transparent;color:var(--mute)" onclick="clearStats()">امسح العرض</button>
    </div>`:""}
  <div class="note" style="margin-top:14px">الجرس بتاعك انت هو المرجع — الشاشة بتساعدك مش بتحكمك. لو النت وقع، الناس عندهم «وضع الجرس» وهيمشوا بصوتك عادي.</div>`;
}

function render(){ $("#wrap").innerHTML = ui.gate ? gate() : panel(); }
setInterval(()=>{ if(!ui.gate) render(); },1000);
render();
</script>
