<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>أوراق القطاعات — اخلع من دماغي</title>
<style>
:root{
  --ink:#12151A; --paper:#FBF8F0; --line:#D8D2C4; --line2:#C0B9A6;
  --text:#20242B; --mute:#6B7280; --gold:#B8860B; --gold-bg:#FBF3DC;
  --secret:#B23A3A; --secret-bg:#FBEDED;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ink);color:var(--text);direction:rtl;
  font-family:"SF Arabic",-apple-system,"Segoe UI","Noto Kufi Arabic",Tahoma,Arial,sans-serif;
  font-size:15px;line-height:1.6}

/* شريط الطباعة — بيختفي في الطباعة */
#toolbar{position:sticky;top:0;z-index:10;background:#0C0F13;border-bottom:1px solid #2A333F;
  padding:12px 16px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
#toolbar .t{color:#F4F1E8;font-weight:800;font-size:15px;margin-inline-end:auto}
#toolbar .t small{color:#8A97A6;font-weight:400;display:block;font-size:12px}
#toolbar button{background:#1B2029;border:1px solid #2A333F;color:#F4F1E8;font:inherit;font-weight:800;
  border-radius:10px;padding:10px 16px;cursor:pointer}
#toolbar button.pri{background:var(--gold);border-color:var(--gold);color:#12151A}
#toolbar button:active{transform:translateY(1px)}

#stack{max-width:820px;margin:0 auto;padding:20px 16px 60px}

/* الورقة = صفحة A4 */
.sheet{background:var(--paper);color:var(--text);border-radius:8px;padding:22px 28px;margin-bottom:22px;
  box-shadow:0 8px 30px rgba(0,0,0,.4);position:relative}

.sheet .top{display:flex;justify-content:space-between;align-items:flex-start;
  border-bottom:2px solid var(--text);padding-bottom:10px;margin-bottom:4px}
.sheet .top .brand{font-size:12px;letter-spacing:.1em;color:var(--mute)}
.sheet .top .brand b{color:var(--text);display:block;font-size:20px;font-weight:900;letter-spacing:0;margin-top:2px}
.sheet .top .sec{text-align:left}
.sheet .top .sec .lbl{font-size:11px;color:var(--mute);letter-spacing:.1em}
.sheet .top .sec .name{font-size:24px;font-weight:900;color:var(--gold)}

.namerow{display:flex;gap:20px;margin:8px 0 12px;font-size:13px;color:var(--mute)}
.namerow .f{flex:1;border-bottom:1px dashed var(--line2);padding-bottom:3px}
.namerow .f b{color:var(--text)}

h3.blk{font-size:13px;letter-spacing:.08em;color:var(--text);font-weight:900;margin:12px 0 6px;
  display:flex;align-items:center;gap:8px}
h3.blk .tag{font-size:11px;font-weight:800;letter-spacing:.04em;padding:2px 8px;border-radius:99px}
h3.blk .tag.reg{background:#EDEEF0;color:var(--mute)}

/* الجدول */
table{width:100%;border-collapse:collapse;margin-bottom:4px}
th{font-size:12px;color:var(--mute);text-align:right;font-weight:800;padding:5px 10px;
  border-bottom:1.5px solid var(--line2)}
th.c2{width:52%}
td{border-bottom:1px solid var(--line);padding:0;vertical-align:top}
td.obj{padding:9px 10px;font-weight:700;font-size:13.5px;line-height:1.45;width:48%;background:#F5F1E6}
td.obj .num{color:var(--gold);font-weight:900;margin-inline-end:4px}
td.write{padding:8px 10px;height:52px}
td.write .lines{height:100%;background-image:repeating-linear-gradient(transparent,transparent 26px,var(--line) 26px,var(--line) 27px);min-height:44px}

/* القسم السري */
.secret{border:2px solid var(--secret);background:var(--secret-bg);border-radius:8px;padding:12px 14px;margin:12px 0}
.secret .hd{display:flex;align-items:center;gap:8px;color:var(--secret);font-weight:900;font-size:14px;margin-bottom:3px}
.secret .sub{font-size:12px;color:#9A5555;margin-bottom:8px}
.secret table{margin:0}
.secret td.obj{background:#F7E4E4}
.secret td.obj .num{color:var(--secret)}

/* صندوق القواعد */
.rules{border:1.5px solid var(--gold);background:var(--gold-bg);border-radius:8px;padding:10px 16px;margin-top:12px}
.rules b{color:var(--gold);font-weight:900}
.rules .steps{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-weight:700;font-size:13.5px}
.rules .steps span{white-space:nowrap}
.rules .steps span::before{content:"◄ ";color:var(--gold)}

.pagetag{position:absolute;bottom:10px;left:16px;font-size:11px;color:var(--line2)}

@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff}
  #toolbar{display:none}
  #stack{max-width:none;margin:0;padding:0}
  .sheet{box-shadow:none;border-radius:0;margin:0;padding:0;page-break-after:always;min-height:auto}
  .sheet:last-child{page-break-after:auto}
  td.write{height:58px}
  .sheet .top .sec .name{font-size:22px}
}
</style>

<div id="toolbar">
  <span class="t">أوراق القطاعات الخمسة<small>«بقولك إيه… اخلع من دماغي!» · للطباعة والتوزيع</small></span>
  <button onclick="window.print()" class="pri">🖨 اطبع الخمس ورقات</button>
</div>

<div id="stack"></div>

<script src="data.js"></script>
<script>
const AR = n => String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);

function writeCell(){ return `<td class="write"><div class="lines"></div></td>`; }

function sheetHTML(sec){
  const specials = SPECIAL.filter(x=>x.sector===sec.n);
  const sharedRows = SHARED.map((o,i)=>`
    <tr><td class="obj"><span class="num">${AR(i+1)}.</span> «${o.obj}»</td>${writeCell()}</tr>`).join("");
  const specialRows = specials.map((o,i)=>`
    <tr><td class="obj"><span class="num">${['أ','ب'][i]}.</span> «${o.obj}»</td>${writeCell()}</tr>`).join("");

  return `
  <div class="sheet">
    <div class="top">
      <div class="brand">سبورة المحروسة · صناع الحياة × وزارة التضامن<b>بقولك إيه… اخلع من دماغي!</b></div>
      <div class="sec"><div class="lbl">ورقة القطاع</div><div class="name">${sec.name}</div></div>
    </div>
    <div class="namerow">
      <div class="f">اسم القطاع: <b>${sec.name}</b></div>
      <div class="f">المتحدثون: ______________________</div>
    </div>

    <h3 class="blk">الاعتراضات المشتركة <span class="tag reg">بتترمى على كل القطاعات</span></h3>
    <table>
      <tr><th>الاعتراض</th><th class="c2">ردنا المعتمد</th></tr>
      ${sharedRows}
    </table>

    <div class="secret">
      <div class="hd">🔒 اعتراضاتكم الخاصة — سرية عن باقي القطاعات</div>
      <div class="sub">دول اتنين لوحدكم، مش عند حد غيركم. جهّزوا ردكم قبل ما يتقالوا على القاعة.</div>
      <table>
        <tr><th>الاعتراض</th><th class="c2">ردنا المعتمد</th></tr>
        ${specialRows}
      </table>
    </div>

    <div class="rules">
      <b>قواعد الرد الناجح</b>
      <div class="steps">
        <span>اسمع للآخر — ما تقاطعش</span>
        <span>صدّق على قلقه قبل ما ترد</span>
        <span>رد بجملة تتحفظ</span>
        <span>اقفل بخطوة عملية</span>
      </div>
    </div>
    <div class="pagetag">${sec.name} · صفحة واحدة</div>
  </div>`;
}

document.getElementById("stack").innerHTML = SECTORS.map(sheetHTML).join("");
</script>
