<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مرجع الردود الكامل — سري | اخلع من دماغي</title>
<style>
:root{
  --ink:#0B0E12; --ink2:#141A22; --ink3:#1B222B; --line:#28313D;
  --chalk:#F4F1E8; --mute:#8A97A6; --dim:#5A6675;
  --gold:#FFD24A; --gold-d:#4A3D14;
  --aql:#4CA6FF;     /* عقلاني */
  --qalb:#FF7A9A;    /* قلبي */
  --amali:#5FD08A;   /* عملي */
  --secret:#FF5C5C; --secret-d:#4A1F22;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
html,body{margin:0}
body{background:var(--ink);color:var(--chalk);direction:rtl;
  font-family:"SF Arabic",-apple-system,"Segoe UI","Noto Kufi Arabic",Tahoma,Arial,sans-serif;
  font-size:16px;line-height:1.7}
#doc{max-width:660px;margin:0 auto;padding:0 15px 90px}

/* شريط سري */
#bar{position:sticky;top:0;z-index:30;background:rgba(11,14,18,.94);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--secret-d);margin:0 -15px;padding:9px 15px;
  display:flex;align-items:center;justify-content:space-between;gap:10px}
#bar .l{display:flex;align-items:center;gap:8px;font-size:13px}
#bar .lock{color:var(--secret);font-weight:900}
#bar .l b{color:var(--chalk);font-weight:800}
#bar .l small{color:var(--secret);display:block;font-size:11px;letter-spacing:.02em}
#bar button{background:var(--ink2);border:1px solid var(--line);color:var(--chalk);
  font:inherit;font-size:14px;font-weight:800;border-radius:10px;padding:8px 12px;cursor:pointer;white-space:nowrap}

/* بانر التحذير */
.warn{border:1px solid var(--secret-d);background:#180F10;border-radius:14px;padding:14px 16px;margin:16px 0 8px}
.warn .h{color:var(--secret);font-weight:900;font-size:16px;margin-bottom:4px}
.warn p{margin:0;color:#E6C4C4;font-size:14px;line-height:1.6}

/* الغلاف المصغّر */
.cover{padding:20px 0 6px}
.cover .eyebrow{font-size:12px;letter-spacing:.2em;color:var(--gold);font-weight:800}
.cover h1{font-size:36px;font-weight:900;line-height:1.1;margin:8px 0 6px}
.cover .sub{color:#C3CDD9;font-size:16px}

/* قفز سريع */
.jump{margin:18px 0 6px}
.jump .lbl{font-size:12px;letter-spacing:.14em;color:var(--mute);font-weight:800;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips a{text-decoration:none;background:var(--ink2);border:1px solid var(--line);color:var(--chalk);
  border-radius:9px;padding:7px 11px;font-size:13px;font-weight:800}
.chips a.sp{border-color:var(--secret-d);color:#FFC9C9}
.chips .grouplbl{width:100%;font-size:11px;color:var(--dim);letter-spacing:.1em;margin:8px 0 2px}

/* كارت الاعتراض */
.obj{scroll-margin-top:64px;border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0;background:var(--ink2)}
.obj .id{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.obj .id .code{font-size:12px;font-weight:900;color:#0B0E12;background:var(--gold);border-radius:7px;padding:3px 9px}
.obj .id .code.sp{background:var(--secret);color:#fff}
.obj .id .type{font-size:12px;color:var(--mute);font-weight:700}
.obj .id .type b{color:#C9D2DD}
.obj .said{font-size:20px;font-weight:900;line-height:1.4;color:#fff;margin-bottom:4px}
.obj .said::before{content:"«";color:var(--mute)} .obj .said::after{content:"»";color:var(--mute)}
.obj .inside{font-size:14px;color:#AEB9C6;background:var(--ink3);border-radius:10px;padding:9px 12px;margin:8px 0 4px}
.obj .inside b{color:var(--gold)}

.resp{border-inline-start:3px solid var(--c);border-radius:0 12px 12px 0;padding:9px 13px;margin:8px 0;background:color-mix(in srgb,var(--c) 8%,transparent)}
.resp .rl{font-size:12px;font-weight:900;letter-spacing:.06em;color:var(--c);margin-bottom:3px}
.resp p{margin:0;font-size:16px;line-height:1.65;color:#E7EDF4}
.resp.aql{--c:var(--aql)} .resp.qalb{--c:var(--qalb)} .resp.amali{--c:var(--amali)}

.bank{border:1px dashed var(--gold);background:#151209;border-radius:12px;padding:10px 13px;margin:10px 0 6px}
.bank .rl{font-size:12px;font-weight:900;letter-spacing:.06em;color:var(--gold);margin-bottom:3px}
.bank p{margin:0;font-size:16px;font-weight:800;color:#F7EFD6;line-height:1.55}
.bank .rl::before{content:"★ "}

.trap{border-inline-start:3px solid var(--secret);background:#180F10;border-radius:0 12px 12px 0;padding:9px 13px;margin:6px 0 0}
.trap .rl{font-size:12px;font-weight:900;color:var(--secret);margin-bottom:3px}
.trap .rl::before{content:"⚠ الفخ — "}
.trap p{margin:0;font-size:14.5px;color:#E6C4C4;line-height:1.6}

.divider{display:flex;align-items:center;gap:12px;margin:34px 0 6px}
.divider .n{flex:0 0 auto;font-size:12px;letter-spacing:.16em;color:var(--gold);font-weight:900;
  border:1px solid var(--gold-d);background:#151209;border-radius:99px;padding:6px 14px}
.divider .n.sp{color:#FFC9C9;border-color:var(--secret-d);background:#180F10}
.divider .ln{flex:1;height:1px;background:var(--line)}

.sectag{font-size:12px;color:var(--secret);font-weight:800;letter-spacing:.08em;margin:22px 0 -4px}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin:10px 0 4px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

.foot{text-align:center;color:var(--dim);font-size:13px;margin-top:36px;padding-top:18px;border-top:1px solid var(--line)}

/* الفهرس المنبثق */
#idx{position:fixed;inset:0;z-index:50;background:rgba(6,9,13,.95);backdrop-filter:blur(6px);
  display:none;overflow:auto;padding:18px 15px 40px}
#idx.on{display:block}
#idx .top{display:flex;justify-content:space-between;align-items:center;max-width:660px;margin:0 auto 14px}
#idx .top h3{margin:0;font-size:20px}
#idx .list{max-width:660px;margin:0 auto;display:grid;gap:7px}
#idx a{display:flex;gap:10px;align-items:center;text-decoration:none;background:var(--ink2);
  border:1px solid var(--line);border-radius:11px;padding:12px;color:var(--chalk)}
#idx a .code{font-size:11px;font-weight:900;color:#0B0E12;background:var(--gold);border-radius:6px;padding:2px 7px}
#idx a.sp .code{background:var(--secret);color:#fff}
#idx a b{font-weight:700;font-size:15px}
@media print{ #bar,#idx,.jump{display:none} body{background:#fff;color:#000} }
</style>

<div id="bar">
  <span class="l"><span class="lock">🔒</span><span><b>مرجع الردود الكامل</b><small>سري — للميسر والمنتورز فقط</small></span></span>
  <button onclick="openIdx()">☰ الاعتراضات</button>
</div>

<div id="doc"></div>

<div id="idx">
  <div class="top"><h3>كل الاعتراضات (١٧)</h3><button onclick="closeIdx()" style="background:var(--ink2);border:1px solid var(--line);color:var(--chalk);font:inherit;font-weight:800;border-radius:10px;padding:8px 14px;cursor:pointer">اقفل ✕</button></div>
  <div class="list" id="idxList"></div>
</div>

<script src="data.js"></script>
<script>
const AR = n => String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const SECNAMES = {1:"القطاع الأول",2:"القطاع التاني",3:"القطاع التالت",4:"القطاع الرابع",5:"القطاع الخامس"};

function objCard(o, sp, label){
  return `
  <div class="obj" id="${o.id}">
    <div class="id">
      <span class="code ${sp?'sp':''}">${label}</span>
      <span class="type">النوع: <b>${o.type}</b></span>
    </div>
    <div class="said">${o.obj}</div>
    <div class="inside"><b>اللي جوه الاعتراض:</b> ${o.inside}</div>
    <div class="resp aql"><div class="rl">الرد العقلاني — منطق ومعلومة</div><p>${o.aql}</p></div>
    <div class="resp qalb"><div class="rl">الرد القلبي — مشهد إنساني</div><p>${o.qalb}</p></div>
    <div class="resp amali"><div class="rl">الرد العملي — خطوة ملموسة</div><p>${o.amali}</p></div>
    <div class="bank"><div class="rl">الصيغة المرشحة للبنك</div><p>«${o.bank}»</p></div>
    <div class="trap"><div class="rl">أسوأ رد شائع</div><p>${o.trap}</p></div>
  </div>`;
}

function build(){
  const sharedCards = SHARED.map((o,i)=>objCard(o,false,"مشترك "+AR(i+1))).join("");

  let specialCards = "";
  for(let s=1;s<=5;s++){
    const items = SPECIAL.filter(x=>x.sector===s);
    specialCards += `<div class="sectag">🔒 خاص بـ${SECNAMES[s]}</div>`;
    specialCards += items.map(o=>objCard(o,true,o.kind)).join("");
  }

  document.getElementById("doc").innerHTML = `
  <div class="cover">
    <div class="eyebrow">بقولك إيه… اخلع من دماغي!</div>
    <h1>مرجع الردود الكامل</h1>
    <div class="sub">١٧ اعتراض · ٣ ردود لكل واحد · صيغة البنك · الفخ. سلاح الميسر عشان أي رد يطلع من القطاعات تقدر تقيّمه وتكمّل عليه وتصفّيه.</div>
  </div>

  <div class="warn">
    <div class="h">🔒 ده الملف ده يفضل معاك أنت وسهام والمنتورز بس</div>
    <p>ممنوع يتطبع للقطاعات أو يتبعت على أي جروب. لو الردود الجاهزة وصلت للناس قبل اللعبة، اللعبة ماتت — هيقروا بدل ما يفكروا. اللي بيوصلهم ورقهم بالأعمدة الفاضية فقط.</p>
  </div>

  <div class="legend">
    <span><i style="background:var(--aql)"></i> عقلاني</span>
    <span><i style="background:var(--qalb)"></i> قلبي</span>
    <span><i style="background:var(--amali)"></i> عملي</span>
    <span><i style="background:var(--gold)"></i> صيغة البنك</span>
    <span><i style="background:var(--secret)"></i> الفخ</span>
  </div>

  <div class="jump">
    <div class="lbl">قفز سريع</div>
    <div class="chips">
      <div class="grouplbl">المشتركة (٧)</div>
      ${SHARED.map((o,i)=>`<a href="#${o.id}">${AR(i+1)}</a>`).join("")}
      <div class="grouplbl">الخاصة (١٠)</div>
      ${SPECIAL.map(o=>`<a class="sp" href="#${o.id}">${o.kind}</a>`).join("")}
    </div>
  </div>

  <div class="divider"><span class="n">الاعتراضات السبعة المشتركة</span><span class="ln"></span></div>
  ${sharedCards}

  <div class="divider"><span class="n sp">العشرة الخاصة — اتنين لكل قطاع</span><span class="ln"></span></div>
  ${specialCards}

  <div class="foot">
    سبورة المحروسة · فقرة الاعتراضات «اخلع من دماغي»<br>
    كل رد بيبدأ بالتصديق على القلق قبل الرد · مفيش وعود كاذبة (لا أرباح، لا إعفاءات، لا حماية رسمية).
  </div>`;

  buildIdx();
}

function buildIdx(){
  const rows = [];
  SHARED.forEach((o,i)=> rows.push(`<a href="#${o.id}" onclick="closeIdx()"><span class="code">${AR(i+1)}</span><b>${o.obj}</b></a>`));
  for(let s=1;s<=5;s++){
    SPECIAL.filter(x=>x.sector===s).forEach(o=>
      rows.push(`<a class="sp" href="#${o.id}" onclick="closeIdx()"><span class="code">${o.kind}</span><b>${o.obj}</b></a>`));
  }
  document.getElementById("idxList").innerHTML = rows.join("");
}
function openIdx(){ document.getElementById("idx").classList.add("on"); }
function closeIdx(){ document.getElementById("idx").classList.remove("on"); }
addEventListener("keydown",e=>{ if(e.key==="Escape") closeIdx(); });

build();
</script>
