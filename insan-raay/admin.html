<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>إنسان — آراء القرّاء</title>
<link href="https://fonts.googleapis.com/css2?family=Zain:wght@300;400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1">
<style>
body{font-size:18px;line-height:1.9}
.wrap{max-width:960px}
.top{display:flex;justify-content:space-between;align-items:center;padding:26px 0 10px;flex-wrap:wrap;gap:10px}
.top h1{font-weight:900;font-size:30px;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 14px;text-align:center}
.stat b{display:block;font-size:30px;font-weight:900;color:var(--ink)}
.stat span{font-size:15px;color:var(--muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.tabs button{border:1.5px solid var(--line2);background:var(--paper);border-radius:999px;padding:2px 16px;cursor:pointer;font-size:17px}
.tabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.item{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:8px 0}
.item .who{font-size:14px;color:var(--muted)}
.item .txt{font-size:19px;color:var(--txt)}
.item .txt.qalb{color:var(--err)}
h3.grp{font-weight:900;font-size:22px;color:var(--ink);margin:22px 0 6px}
.person{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:12px 0}
.person .hd{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.person .nm{font-weight:900;font-size:22px;color:var(--ink)}
.person .meta{font-size:14px;color:var(--muted)}
.person dl{margin-top:8px}
.person dt{font-weight:800;color:var(--ink2);font-size:15.5px;margin-top:8px}
.person dd{margin:0;font-size:18px}
.badge{font-size:13px;font-weight:800;border-radius:999px;padding:0 10px;background:var(--hl);color:var(--gold)}
.badge.done{background:rgba(46,125,87,.12);color:var(--ok)}
.wa{font-size:15px;color:var(--ok);font-weight:800;text-decoration:none}
.bars .r{display:flex;gap:10px;align-items:center;margin:4px 0;font-size:16px}
.bars .r .l{width:170px;flex-shrink:0}
.bars .r .b{flex:1;height:10px;background:var(--bg2);border-radius:6px;overflow:hidden}
.bars .r .b i{display:block;height:100%;background:var(--ink2)}
.bars .r .n{width:30px;text-align:center;font-weight:800}
#login{max-width:420px;margin:80px auto}
.err{color:var(--err);font-size:15px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">

<div id="login" class="card" hidden>
  <h2>آراء القرّاء في «إنسان»</h2>
  <p class="lead">الدخول بحساب الإدارة.</p>
  <div class="fld"><label>الإيميل</label><input id="ae" type="email" dir="ltr" value="admin@fouad-academy.com"></div>
  <div class="fld"><label>كلمة السر</label><input id="ap" type="password" dir="ltr"></div>
  <button class="btn wide" id="bl">دخول</button>
  <div class="err" id="le"></div>
</div>

<div id="main" hidden>
  <div class="top">
    <h1>«إنسان» — آراء القرّاء</h1>
    <div style="display:flex;gap:8px">
      <button class="btn ghost" id="br">تحديث</button>
      <button class="btn ghost" id="bx">تنزيل Excel</button>
      <button class="btn ghost" id="bo">خروج</button>
    </div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="tabs" id="tabs">
    <button data-t="one" class="on">الجملة الواحدة</button>
    <button data-t="sub">العناوين الفرعيّة</button>
    <button data-t="sec">جمل الأقسام</button>
    <button data-t="react">التفاعل والملاحظات</button>
    <button data-t="people">كلّ شخص</button>
  </div>
  <div id="view"></div>
</div>

</div>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
(function(){
firebase.initializeApp({apiKey:"AIzaSyDj0bV5gsyRbqpxzW0Zd9wjYmq53-Xdj3w",authDomain:"fouad-perspective.firebaseapp.com",projectId:"fouad-perspective",storageBucket:"fouad-perspective.firebasestorage.app",messagingSenderId:"1068763865336",appId:"1:1068763865336:web:b791abcd22d536aedd5b0d"});
var auth=firebase.auth(), db=firebase.firestore(), ALL=[], TAB='one';
function $(s){return document.querySelector(s)}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function when(ts){if(!ts||!ts.toDate)return'';var d=ts.toDate();return d.toLocaleDateString('ar-EG',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('ar-EG',{hour:'numeric',minute:'2-digit'})}
function wa(p){var d=String(p||'').replace(/\D/g,'');if(d.indexOf('01')===0&&d.length===11)d='2'+d;return d?'<a class="wa" target="_blank" href="https://wa.me/'+d+'">واتساب</a>':''}
var SEC={secDar:'دارُه',secSaey:'سعيُه',secTina:'طينتُه'};
var RK={core:'مدفون لا مكسور',dar:'دارُه',saey:'سعيُه',tina:'طينتُه',end:'الخاتمة'};

$('#bl').onclick=function(){
  $('#le').textContent='';
  auth.signInWithEmailAndPassword($('#ae').value.trim(),$('#ap').value).catch(function(e){$('#le').textContent='لم يتمّ الدخول: '+(e.code||e.message)});
};
$('#bo').onclick=function(){auth.signOut()};
$('#br').onclick=load;
auth.onAuthStateChanged(function(u){
  $('#login').hidden=!!u;$('#main').hidden=!u;
  if(u)load();
});
document.querySelectorAll('#tabs button').forEach(function(b){b.onclick=function(){
  TAB=b.dataset.t;document.querySelectorAll('#tabs button').forEach(function(x){x.classList.toggle('on',x===b)});render();
}});

function load(){
  $('#view').innerHTML='<p style="text-align:center;color:var(--muted)">يُحمَّل…</p>';
  db.collection('insan_raay').get().then(function(q){
    ALL=q.docs.map(function(d){var x=d.data();x._id=d.id;return x});
    ALL.sort(function(a,b){return((b.updatedAt&&b.updatedAt.seconds)||0)-((a.updatedAt&&a.updatedAt.seconds)||0)});
    render();
  }).catch(function(e){$('#view').innerHTML='<p class="err">تعذّرت القراءة: '+esc(e.code||e.message)+'</p>'});
}

function render(){
  var done=ALL.filter(function(x){return x.status==='خلص'}).length;
  var feel={};ALL.forEach(function(x){if(x.feel)feel[x.feel]=(feel[x.feel]||0)+1});
  $('#stats').innerHTML=
    '<div class="stat"><b>'+ALL.length+'</b><span>سجّلوا</span></div>'+
    '<div class="stat"><b>'+done+'</b><span>أكملوا الأسئلة</span></div>'+
    '<div class="stat"><b>'+ALL.filter(function(x){return x.address==='f'}).length+'</b><span>بصيغة «أنتِ»</span></div>'+
    '<div class="stat"><b>'+(feel['كثيرًا']||0)+'</b><span>يعرفون الفراغ جيّدًا</span></div>';
  var h='';
  if(TAB==='one'){
    ALL.filter(function(x){return x.oneLine}).forEach(function(x){h+=item(x.oneLine,x)});
  }else if(TAB==='sub'){
    ALL.forEach(function(x){(x.subtitles||[]).forEach(function(s,i){if(s)h+=item(s,x,/قلب|قلوب/.test(s),i)})});
  }else if(TAB==='sec'){
    Object.keys(SEC).forEach(function(k){
      h+='<h3 class="grp">'+SEC[k]+'</h3>';
      ALL.filter(function(x){return x[k]}).forEach(function(x){h+=item(x[k],x)});
    });
  }else if(TAB==='react'){
    h+='<h3 class="grp">هل مرّ بك هذا الإحساس؟</h3>'+bars(feel);
    Object.keys(RK).forEach(function(k){
      var c={};ALL.forEach(function(x){var v=(x.reactions||{})[k];if(v)c[v]=(c[v]||0)+1});
      h+='<h3 class="grp">'+RK[k]+'</h3>'+bars(c);
      ALL.filter(function(x){return(x.notes||{})[k]}).forEach(function(x){h+=item(x.notes[k],x)});
    });
  }else{
    ALL.forEach(function(x){
      h+='<div class="person"><div class="hd"><div><span class="nm">'+esc(x.name)+'</span> '+
        (x.status==='خلص'?'<span class="badge done">أكمل</span>':'<span class="badge">'+esc(x.status||'')+'</span>')+
        '</div><div class="meta" dir="ltr">'+esc(x.phone)+' · '+wa(x.phone)+'</div></div>'+
        '<div class="meta">'+(x.address==='f'?'أنتِ':'أنتَ')+' · بدأ '+when(x.startedAt)+' · آخر حفظ '+when(x.updatedAt)+'</div><dl>'+
        dd('مرّ به الإحساس',x.feel)+dd('جملة واحدة',x.oneLine)+
        dd('العناوين الفرعيّة',(x.subtitles||[]).filter(Boolean).join(' · '))+
        dd('دارُه',x.secDar)+dd('سعيُه',x.secSaey)+dd('طينتُه',x.secTina)+
        Object.keys(RK).map(function(k){var r=(x.reactions||{})[k],n=(x.notes||{})[k];return(r||n)?dd(RK[k],[r,n].filter(Boolean).join(' — ')):''}).join('')+
        '</dl></div>';
    });
  }
  $('#view').innerHTML=h||'<p style="text-align:center;color:var(--muted)">لا شيء بعد.</p>';
}
function item(t,x,warn,i){return'<div class="item"><div class="txt'+(warn?' qalb':'')+'">'+esc(t)+(warn?' <small>(فيه «قلب»)</small>':'')+'</div><div class="who">'+esc(x.name)+(i>0?' · اقتراح '+(i+1):'')+'</div></div>'}
function dd(k,v){return v?'<dt>'+k+'</dt><dd>'+esc(v)+'</dd>':''}
function bars(c){
  var ks=Object.keys(c),max=Math.max.apply(null,ks.map(function(k){return c[k]}).concat([1]));
  if(!ks.length)return'<p style="color:var(--muted)">لا شيء بعد.</p>';
  return'<div class="bars">'+ks.sort(function(a,b){return c[b]-c[a]}).map(function(k){return'<div class="r"><span class="l">'+esc(k)+'</span><span class="b"><i style="width:'+(c[k]/max*100)+'%"></i></span><span class="n">'+c[k]+'</span></div>'}).join('')+'</div>';
}

$('#bx').onclick=function(){
  var cols=['الاسم','التليفون','الصيغة','الحالة','مرّ به الإحساس','جملة واحدة','عنوان ١','عنوان ٢','عنوان ٣','دارُه','سعيُه','طينتُه'];
  Object.keys(RK).forEach(function(k){cols.push('تفاعل: '+RK[k],'ملاحظة: '+RK[k])});
  cols.push('بدأ','آخر حفظ');
  var rows=ALL.map(function(x){
    var s=x.subtitles||[];
    var r=[x.name,x.phone,x.address==='f'?'أنتِ':'أنتَ',x.status,x.feel,x.oneLine,s[0],s[1],s[2],x.secDar,x.secSaey,x.secTina];
    Object.keys(RK).forEach(function(k){r.push((x.reactions||{})[k],(x.notes||{})[k])});
    r.push(when(x.startedAt),when(x.updatedAt));
    return r;
  });
  var csv='﻿'+[cols].concat(rows).map(function(r){return r.map(function(v){return'"'+String(v==null?'':v).replace(/"/g,'""')+'"'}).join(',')}).join('\r\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='insan-raay.csv';a.click();
};
})();
</script>
</body>
</html>
