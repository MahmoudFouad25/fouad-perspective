<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قسم الشهادات - منظور الفؤاد</title>
    
    <!-- External CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* ألوان الأشواق التسعة من الهوية */
            --longing-1: #E11D48; /* أحمر قرمزي/ياقوتي فاتح - الارتقاء المحكم */
            --longing-2: #EC4899; /* وردي - الانسجام المؤثر */
            --longing-3: #F97316; /* برتقالي - التميز الساطع */
            --longing-4: #9333EA; /* بنفسجي - الانتماء الأصيل */
            --longing-5: #22C55E; /* أخضر - الاكتفاء الواثق */
            --longing-6: #3B82F6; /* أزرق سماوي - الأمان المطمئن */
            --longing-7: #FBBF24; /* ذهبي - الانطلاق المبهج */
            --longing-8: #7F1D1D; /* أحمر غامق/نبيذي - الاقتدار الحازم */
            --longing-9: #14B8A6; /* فيروزي - السلام المتصالح */
            
            /* الألوان الأساسية من الهوية */
            --gold-primary: #FFD700;
            --gold-light: #FFF3CD;
            --gold-glow: rgba(255, 215, 0, 0.3);
            --sun-orange: #FFA500;
            --sun-red: #FF6347;
            
            --dark-bg: #0A1628;
            --dark-lighter: #1E3A5F;
            --dark-overlay: rgba(10, 22, 40, 0.95);
            
            --white: #FFFFFF;
            --gray-light: #F8F9FA;
            --gray-medium: #6C757D;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--dark-bg);
            color: var(--white);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* تصميم قسم الشهادات المبتكر */
        .testimonials-section {
            padding: 120px 20px;
            background: linear-gradient(135deg, rgba(20, 184, 166, 0.03) 0%, rgba(147, 51, 234, 0.03) 100%);
            position: relative;
            overflow: hidden;
        }

        .testimonials-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, 
                transparent, 
                var(--gold-primary), 
                transparent
            );
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .testimonials-container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
        }

        /* العنوان المبتكر */
        .testimonials-header {
            text-align: center;
            margin-bottom: 80px;
            position: relative;
        }

        .section-title-wrapper {
            display: inline-block;
            position: relative;
        }

        .testimonials-title {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            position: relative;
        }

        .title-text {
            background: linear-gradient(135deg, var(--gold-primary) 0%, var(--sun-orange) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: titleGlow 4s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.2); }
        }

        .title-icon {
            font-size: 1.5rem;
            color: var(--gold-primary);
            opacity: 0.5;
            animation: iconFloat 3s ease-in-out infinite;
        }

        .title-icon:first-child {
            animation-delay: 0s;
        }

        .title-icon:last-child {
            animation-delay: 1.5s;
        }

        @keyframes iconFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .testimonials-subtitle {
            font-size: 1.3rem;
            color: var(--gold-light);
            opacity: 0.8;
        }

        /* حاوية الشهادات */
        .testimonials-carousel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
            position: relative;
            max-width: 1200px;
            margin: 0 auto 40px;
        }

        @media (min-width: 1200px) {
            .testimonials-carousel {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (min-width: 768px) and (max-width: 1199px) {
            .testimonials-carousel {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* بطاقة الشهادة */
        .testimonial-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.1);
            border-radius: 24px;
            padding: 40px 35px;
            position: relative;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            animation: cardEntry 0.8s ease-out;
        }

        @keyframes cardEntry {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.95) rotateX(-10deg);
                filter: blur(3px);
            }
            50% {
                opacity: 0.7;
                transform: translateY(10px) scale(0.98) rotateX(-5deg);
                filter: blur(1px);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1) rotateX(0);
                filter: blur(0);
            }
        }

        .testimonial-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, 
                var(--longing-1) 0%, 
                var(--longing-3) 25%, 
                var(--longing-5) 50%, 
                var(--longing-7) 75%, 
                var(--longing-9) 100%
            );
            transform: scaleX(0);
            transition: transform 0.5s ease;
        }

        .testimonial-card:hover::before {
            transform: scaleX(1);
        }

        .testimonial-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 
                0 20px 40px rgba(255, 215, 0, 0.15),
                0 0 60px rgba(255, 215, 0, 0.05);
            border-color: rgba(255, 215, 0, 0.3);
        }

        /* الشهادة المميزة */
        .testimonial-card.highlighted {
            background: linear-gradient(135deg, 
                rgba(255, 215, 0, 0.08) 0%, 
                rgba(255, 165, 0, 0.05) 100%
            );
            border: 2px solid rgba(255, 215, 0, 0.3);
            transform: scale(1.05);
        }

        .testimonial-card.highlighted::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, 
                rgba(255, 215, 0, 0.1) 0%, 
                transparent 70%
            );
            animation: highlightRotate 20s linear infinite;
        }

        @keyframes highlightRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* رأس البطاقة */
        .testimonial-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            position: relative;
        }

        .stars {
            display: flex;
            gap: 5px;
        }

        .stars i {
            color: var(--gold-primary);
            font-size: 1.1rem;
            animation: starPulse 2s ease-in-out infinite;
        }

        .stars i:nth-child(1) { animation-delay: 0s; }
        .stars i:nth-child(2) { animation-delay: 0.2s; }
        .stars i:nth-child(3) { animation-delay: 0.4s; }
        .stars i:nth-child(4) { animation-delay: 0.6s; }
        .stars i:nth-child(5) { animation-delay: 0.8s; }

        @keyframes starPulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
        }

        /* الشارات */
        .highlight-badge {
            position: absolute;
            top: 9px;
            right: 20px;
            background: linear-gradient(135deg, var(--gold-primary), var(--sun-orange));
            color: var(--dark-bg);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
            animation: badgePulse 2s ease-in-out infinite;
        }

        @keyframes badgePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .verified-badge {
            background: rgba(34, 197, 94, 0.1);
            color: var(--longing-5);
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 5px;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        /* نص الشهادة */
        .testimonial-text {
            font-size: 1.15rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 30px;
            font-style: italic;
            position: relative;
            padding: 0 25px;
        }

        .testimonial-text::before,
        .testimonial-text::after {
            position: absolute;
            font-family: 'Font Awesome 5 Free';
            font-weight: 900;
            color: var(--gold-primary);
            opacity: 0.2;
            font-size: 2rem;
        }

        .testimonial-text::before {
            content: '\f10d';
            top: -10px;
            right: 0;
        }

        .testimonial-text::after {
            content: '\f10e';
            bottom: -10px;
            left: 0;
        }

        /* معلومات المؤلف */
        .testimonial-author {
            display: flex;
            align-items: center;
            gap: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 215, 0, 0.1);
        }

        .author-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold-primary), var(--sun-orange));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: var(--dark-bg);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .author-avatar::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, 
                transparent 30%, 
                rgba(255, 255, 255, 0.2) 100%
            );
            transform: translate(-50%, -50%);
        }

        .author-info {
            flex: 1;
        }

        .author-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--gold-primary);
            margin-bottom: 5px;
        }

        .author-job {
            display: block;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.95rem;
            margin-bottom: 3px;
        }

        .author-course {
            display: block;
            color: var(--longing-6);
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* التحميل Skeleton */
        .testimonial-skeleton {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.05);
            border-radius: 24px;
            padding: 40px 35px;
            animation: skeletonPulse 1.5s ease-in-out infinite;
        }

        @keyframes skeletonPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        .skeleton-header,
        .skeleton-text,
        .skeleton-footer {
            background: linear-gradient(90deg, 
                rgba(255, 215, 0, 0.1) 25%, 
                rgba(255, 215, 0, 0.2) 50%, 
                rgba(255, 215, 0, 0.1) 75%
            );
            background-size: 200% 100%;
            animation: skeletonShimmer 1.5s linear infinite;
            border-radius: 8px;
        }

        @keyframes skeletonShimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .skeleton-header {
            height: 30px;
            width: 120px;
            margin-bottom: 20px;
        }

        .skeleton-text {
            height: 20px;
            margin-bottom: 15px;
        }

        .skeleton-text.short {
            width: 70%;
        }

        .skeleton-footer {
            height: 60px;
            margin-top: 20px;
        }

        /* مؤشرات التنقل */
        .testimonials-indicators {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 40px;
        }

        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 215, 0, 0.2);
            border: 1px solid rgba(255, 215, 0, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .indicator.active {
            width: 40px;
            border-radius: 20px;
            background: linear-gradient(90deg, var(--gold-primary), var(--sun-orange));
        }

        .indicator:hover {
            transform: scale(1.2);
            background: rgba(255, 215, 0, 0.4);
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .testimonials-carousel {
                grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
                gap: 30px;
            }
        }

        @media (max-width: 768px) {
            .testimonials-section {
                padding: 80px 15px;
            }
            
            .testimonials-title {
                font-size: 2rem;
                flex-direction: column;
                gap: 15px;
            }
            
            .testimonials-carousel {
                grid-template-columns: 1fr;
                gap: 25px;
            }
            
            .testimonial-card {
                padding: 30px 25px;
            }
            
            .testimonial-text {
                font-size: 1.05rem;
                padding: 0 15px;
            }
        }

        /* تأثيرات إضافية للتفاعل */
        .testimonial-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
            transition: width 0.5s ease;
        }

        .testimonial-card:hover::after {
            width: 80%;
        }

        /* أنيميشن الدخول المتتالي */
        .testimonial-card:nth-child(1) { animation-delay: 0.1s; }
        .testimonial-card:nth-child(2) { animation-delay: 0.3s; }
        .testimonial-card:nth-child(3) { animation-delay: 0.5s; }
    </style>
</head>
<body>

<!-- قسم الشهادات الديناميكي -->
<section class="testimonials-section" id="testimonials">
    <div class="testimonials-container">
        <!-- العنوان مع تأثير متحرك -->
        <div class="testimonials-header">
            <div class="section-title-wrapper">
                <h2 class="testimonials-title">
                    <span class="title-icon">
                        <i class="fas fa-quote-right"></i>
                    </span>
                    <span class="title-text">قصص نجاح من رحلاتنا التحويلية</span>
                    <span class="title-icon">
                        <i class="fas fa-quote-left"></i>
                    </span>
                </h2>
                <p class="testimonials-subtitle">كلمات من القلب من أشخاص تغيّرت حياتهم</p>
            </div>
        </div>
        
        <!-- حاوية الشهادات الديناميكية -->
        <div class="testimonials-carousel" id="testimonialsContainer">
            <!-- سيتم ملؤها تلقائياً من JavaScript -->
            <div class="testimonial-skeleton">
                <div class="skeleton-header"></div>
                <div class="skeleton-text"></div>
                <div class="skeleton-text short"></div>
                <div class="skeleton-footer"></div>
            </div>
            <div class="testimonial-skeleton">
                <div class="skeleton-header"></div>
                <div class="skeleton-text"></div>
                <div class="skeleton-text short"></div>
                <div class="skeleton-footer"></div>
            </div>
            <div class="testimonial-skeleton">
                <div class="skeleton-header"></div>
                <div class="skeleton-text"></div>
                <div class="skeleton-text short"></div>
                <div class="skeleton-footer"></div>
            </div>
        </div>

        <!-- مؤشرات التنقل -->
        <div class="testimonials-indicators" id="testimonialsIndicators">
            <!-- سيتم إضافتها ديناميكياً -->
        </div>
    </div>
</section>

<script>
// نظام الشهادات الكامل
// نظام الشهادات الاحترافي مع الظهور المتتابع
const TestimonialsManager = {
    allTestimonials: [],
    highlightedTestimonials: [],
    regularTestimonials: [],
    currentRegularIndex: 0,
    rotationInterval: null,
    isAnimating: false,
    container: null,
    
    init() {
        this.container = document.getElementById('testimonialsContainer');
        if (!this.container) return;
        
        // انتظار البيانات
        this.waitForData();
    },
    
   waitForData() {
    console.log('انتظار تحميل البيانات...');
    let checkCount = 0;
    const maxChecks = 20; // 10 ثواني كحد أقصى
    
    const checkInterval = setInterval(() => {
        checkCount++;
        console.log(`محاولة ${checkCount} - الكورسات المتاحة: ${typeof allCourses !== 'undefined' ? allCourses.length : 0}`);
        
        if (typeof allCourses !== 'undefined' && allCourses.length > 0) {
            clearInterval(checkInterval);
            console.log('البيانات جاهزة!');
            setTimeout(() => {
                this.extractTestimonials();
            }, 1000); // انتظار ثانية إضافية للتأكد
        } else if (checkCount >= maxChecks) {
            clearInterval(checkInterval);
            console.log('انتهت المهلة - عرض البيانات الافتراضية');
            this.showDefault();
        }
    }, 500);
},
    
   extractTestimonials() {
    console.log('بدء استخراج الشهادات...');
    console.log('عدد الكورسات المتاحة:', allCourses ? allCourses.length : 0);
    
    // بيانات افتراضية في حالة عدم وجود كورسات
    if (!allCourses || allCourses.length === 0) {
        this.showDefault();
        return;
    }
    
    // استخراج الشهادات من كل كورس
    allCourses.forEach(course => {
        console.log('فحص كورس:', course.title);
        console.log('محتويات testimonials:', course.testimonials);
        
        // الطريقة الصحيحة: testimonials.testimonials كـ array
        if (course.testimonials && course.testimonials.testimonials) {
            const testimonialsData = course.testimonials.testimonials;
            console.log('نوع البيانات:', Array.isArray(testimonialsData) ? 'Array' : typeof testimonialsData);
            console.log('البيانات الموجودة:', testimonialsData);
            
            // إذا كانت array
            if (Array.isArray(testimonialsData)) {
                console.log('عدد الشهادات في هذا الكورس:', testimonialsData.length);
                
                testimonialsData.forEach((t, index) => {
                    console.log(`شهادة ${index + 1}:`, t);
                    
                    if (t && t.text && (t.verified === true || t.verified === 'true')) {
                        const testimonial = {
                            name: t.name || 'متدرب من رحلة ' + (course.title || 'تحويلية'),
                            text: t.text,
                            rating: parseInt(t.rating) || 5,
                            verified: t.verified === true || t.verified === 'true',
                            highlight: t.highlight === true || t.highlight === 'true',
                            course: t.course || course.title || 'رحلة تحويلية',
                            date: t.date || '',
                            type: t.type || 'sample'
                        };
                        
                        this.allTestimonials.push(testimonial);
                        console.log('✅ أضيفت شهادة:', testimonial.name);
                    }
                });
            }
            // إذا كانت object (للتوافق مع البنية القديمة)
            else if (typeof testimonialsData === 'object') {
                console.log('البيانات من نوع Object، نحول للـ Array');
                
                Object.keys(testimonialsData).forEach(key => {
                    const t = testimonialsData[key];
                    console.log(`شهادة ${key}:`, t);
                    
                    if (t && t.text && (t.verified === true || t.verified === 'true')) {
                        const testimonial = {
                            name: t.name || 'متدرب من رحلة ' + (course.title || 'تحويلية'),
                            text: t.text,
                            rating: parseInt(t.rating) || 5,
                            verified: t.verified === true || t.verified === 'true',
                            highlight: t.highlight === true || t.highlight === 'true',
                            course: t.course || course.title || 'رحلة تحويلية',
                            date: t.date || '',
                            type: t.type || 'sample'
                        };
                        
                        this.allTestimonials.push(testimonial);
                        console.log('✅ أضيفت شهادة:', testimonial.name);
                    }
                });
            }
        }
        // جرب أيضاً testimonials مباشرة كـ array
        else if (course.testimonials && Array.isArray(course.testimonials)) {
            console.log('testimonials موجودة كـ array مباشرة');
            
            course.testimonials.forEach((t, index) => {
                if (t && t.text && (t.verified === true || t.verified === 'true')) {
                    const testimonial = {
                        name: t.name || 'متدرب من رحلة ' + (course.title || 'تحويلية'),
                        text: t.text,
                        rating: parseInt(t.rating) || 5,
                        verified: t.verified === true || t.verified === 'true',
                        highlight: t.highlight === true || t.highlight === 'true',
                        course: t.course || course.title || 'رحلة تحويلية',
                        date: t.date || '',
                        type: t.type || 'sample'
                    };
                    
                    this.allTestimonials.push(testimonial);
                    console.log('✅ أضيفت شهادة:', testimonial.name);
                }
            });
        }
    });
    
    console.log('🎯 إجمالي الشهادات المستخرجة:', this.allTestimonials.length);
    
    if (this.allTestimonials.length === 0) {
        console.log('❌ لم يتم العثور على شهاداات، عرض الافتراضية');
        this.showDefault();
        return;
    }
    
    // فصل المميزة عن العادية
    this.highlightedTestimonials = this.allTestimonials.filter(t => t.highlight);
    this.regularTestimonials = this.allTestimonials.filter(t => !t.highlight);
    
    console.log('⭐ شهادات مميزة:', this.highlightedTestimonials.length);
    console.log('📝 شهادات عادية:', this.regularTestimonials.length);
    
    // إذا لم توجد عادية، اعتبر الكل عادي
    if (this.regularTestimonials.length === 0) {
        this.regularTestimonials = this.allTestimonials;
        this.highlightedTestimonials = [];
    }
    
    // بدء العرض المتتابع
    this.startSequentialDisplay();
},
    
  async startSequentialDisplay() {
    this.container.innerHTML = '';
    
    // تحديد عدد الشهادات للعرض
    const maxHighlighted = 2; // حد أقصى للمميزة
    const totalSlots = 6; // إجمالي الشهادات المعروضة
    
    // عرض الشهادات المميزة أولاً
    let displayedCount = 0;
    
    // عرض المميزة
    for (let i = 0; i < this.highlightedTestimonials.length && i < maxHighlighted; i++) {
        await this.addCardWithAnimation(this.highlightedTestimonials[i], true);
        displayedCount++;
        await this.delay(400); // تأخير أقل للسلاسة
    }
    
    // ملء باقي الأماكن بالعادية
    const regularSlotsNeeded = Math.min(totalSlots - displayedCount, this.regularTestimonials.length);
    for (let i = 0; i < regularSlotsNeeded; i++) {
        await this.addCardWithAnimation(this.regularTestimonials[i], false);
        await this.delay(400);
    }
    
    // بدء التدوير إذا كان هناك شهادات أكثر
    if (this.regularTestimonials.length > regularSlotsNeeded) {
        this.currentRegularIndex = regularSlotsNeeded;
        setTimeout(() => {
            this.startRotation();
        }, 5000); // انتظار 5 ثواني قبل بدء التدوير
    }
},
    
    async addCardWithAnimation(testimonial, isHighlighted) {
    const card = this.createCard(testimonial, isHighlighted);
    
    // إضافة البطاقة مخفية
    card.style.opacity = '0';
    card.style.transform = 'translateY(50px) scale(0.9) rotateX(-10deg)';
    card.style.filter = 'blur(5px)';
    card.style.perspective = '1000px';
    this.container.appendChild(card);
    
    // تشغيل الأنيميشن بتأثير سلس
    await this.delay(100);
    card.style.transition = 'all 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
    card.style.opacity = '1';
    card.style.transform = 'translateY(0) scale(1) rotateX(0)';
    card.style.filter = 'blur(0)';
    
    // إضافة تأثير hover بعد الظهور
    setTimeout(() => {
        card.style.transition = 'all 0.4s ease';
    }, 1200);
},
    
  createCard(testimonial, isHighlighted) {
    const div = document.createElement('div');
    div.className = `testimonial-card ${isHighlighted ? 'highlighted' : ''}`;
    
    // فصل الاسم والوظيفة
    let name = testimonial.name;
    let job = '';
    
    // البحث عن الفاصل $$ أو ## أو ||
    if (name && name.includes('$$')) {
        const parts = name.split('$$');
        name = parts[0].trim();
        job = parts[1] ? parts[1].trim() : '';
    } else if (name && name.includes('##')) {
        const parts = name.split('##');
        name = parts[0].trim();
        job = parts[1] ? parts[1].trim() : '';
    }
    
    // النجوم بناءً على التقييم
    let stars = '';
    const rating = parseInt(testimonial.rating) || 5;
    for (let i = 1; i <= 5; i++) {
        if (i <= rating) {
            stars += '<i class="fas fa-star"></i>';
        } else {
            stars += '<i class="far fa-star" style="opacity: 0.3;"></i>';
        }
    }
    
    // أيقونة الصورة الشخصية بناءً على الاسم
    const icons = ['👤', '👨', '👩', '🧑', '👱', '👨‍💼', '👩‍💼', '🧑‍💼'];
    const iconIndex = name.length % icons.length;
    const userIcon = icons[iconIndex];
    
    div.innerHTML = `
        ${isHighlighted ? '<span class="highlight-badge"><i class="fas fa-crown"></i> مميز</span>' : ''}
        <div class="testimonial-header">
            <div class="stars">${stars}</div>
            ${testimonial.verified ? '<span class="verified-badge"><i class="fas fa-check-circle"></i> موثق</span>' : ''}
        </div>
        <p class="testimonial-text">"${testimonial.text}"</p>
        <div class="testimonial-author">
            <div class="author-avatar" style="font-size: 1.8rem;">
                ${userIcon}
            </div>
            <div class="author-info">
                <h5 class="author-name">${name}</h5>
                ${job ? `<small class="author-job">${job}</small>` : ''}
                <small class="author-course">
                    <i class="fas fa-graduation-cap" style="font-size: 0.8rem; margin-left: 5px;"></i>
                    ${testimonial.course}
                </small>
                ${testimonial.date ? `
                    <small style="display: block; color: rgba(255,255,255,0.4); font-size: 0.8rem; margin-top: 2px;">
                        <i class="far fa-calendar" style="font-size: 0.7rem; margin-left: 3px;"></i>
                        ${testimonial.date}
                    </small>
                ` : ''}
            </div>
        </div>
    `;
    
    return div;
},
    
    startRotation() {
        this.rotationInterval = setInterval(() => {
            this.rotateNext();
        }, 8000);
    },
    
    async rotateNext() {
        if (this.isAnimating) return;
        this.isAnimating = true;
        
        // البحث عن أول بطاقة عادية (غير مميزة)
        const regularCards = this.container.querySelectorAll('.testimonial-card:not(.highlighted)');
        if (regularCards.length === 0) {
            this.isAnimating = false;
            return;
        }
        
        // إخفاء أول بطاقة عادية
        const firstRegular = regularCards[0];
        firstRegular.style.transition = 'all 0.6s ease-in';
        firstRegular.style.opacity = '0';
        firstRegular.style.transform = 'translateX(-50px) scale(0.9)';
        
        await this.delay(700);
        firstRegular.remove();
        
        // إضافة بطاقة جديدة من النهاية
        if (this.currentRegularIndex < this.regularTestimonials.length) {
            await this.addCardWithAnimation(
                this.regularTestimonials[this.currentRegularIndex], 
                false
            );
            this.currentRegularIndex++;
        } else {
            // العودة للبداية
            this.currentRegularIndex = 0;
            await this.addCardWithAnimation(
                this.regularTestimonials[this.currentRegularIndex], 
                false
            );
            this.currentRegularIndex++;
        }
        
        this.isAnimating = false;
    },
    
    delay(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    },

};
