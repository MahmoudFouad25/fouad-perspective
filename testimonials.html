<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قسم الشهادات - منظور الفؤاد</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    
    <!-- External CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* ألوان الأشواق التسعة من الهوية */
            --longing-1: #E11D48;
            --longing-2: #EC4899;
            --longing-3: #F97316;
            --longing-4: #9333EA;
            --longing-5: #22C55E;
            --longing-6: #3B82F6;
            --longing-7: #FBBF24;
            --longing-8: #7F1D1D;
            --longing-9: #14B8A6;
            
            /* الألوان الأساسية */
            --gold-primary: #FFD700;
            --gold-light: #FFF3CD;
            --gold-glow: rgba(255, 215, 0, 0.3);
            --sun-orange: #FFA500;
            --sun-red: #FF6347;
            
            --dark-bg: #0A1628;
            --dark-lighter: #1E3A5F;
            --dark-overlay: rgba(10, 22, 40, 0.95);
            
            --white: #FFFFFF;
            --gray-light: #F8F9FA;
            --gray-medium: #6C757D;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--dark-bg);
            color: var(--white);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* قسم الشهادات */
        .testimonials-section {
            padding: 120px 20px;
            background: linear-gradient(135deg, rgba(20, 184, 166, 0.03) 0%, rgba(147, 51, 234, 0.03) 100%);
            position: relative;
            overflow: hidden;
        }

        .testimonials-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .testimonials-container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
        }

        /* العنوان */
        .testimonials-header {
            text-align: center;
            margin-bottom: 80px;
            position: relative;
        }

        .testimonials-title {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            position: relative;
        }

        .title-text {
            background: linear-gradient(135deg, var(--gold-primary) 0%, var(--sun-orange) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: titleGlow 4s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.2); }
        }

        .title-icon {
            font-size: 1.5rem;
            color: var(--gold-primary);
            opacity: 0.5;
            animation: iconFloat 3s ease-in-out infinite;
        }

        .title-icon:first-child { animation-delay: 0s; }
        .title-icon:last-child { animation-delay: 1.5s; }

        @keyframes iconFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .testimonials-subtitle {
            font-size: 1.3rem;
            color: var(--gold-light);
            opacity: 0.8;
            margin-bottom: 30px;
        }

        /* زر إضافة شهادة */
        .add-testimonial-btn {
            background: linear-gradient(135deg, var(--longing-3) 0%, var(--gold-primary) 100%);
            color: var(--dark-bg);
            border: none;
            padding: 18px 40px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(255, 165, 0, 0.3);
            animation: buttonPulse 3s ease-in-out infinite;
        }

        .add-testimonial-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.5s;
        }

        .add-testimonial-btn:hover::before {
            left: 100%;
        }

        .add-testimonial-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 45px rgba(255, 165, 0, 0.4);
        }

        @keyframes buttonPulse {
            0%, 100% { box-shadow: 0 8px 32px rgba(255, 165, 0, 0.3); }
            50% { box-shadow: 0 12px 40px rgba(255, 165, 0, 0.5); }
        }

        /* التخطيط الذكي للشهادات */
        .smart-testimonials-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 25px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* أنواع الشهادات حسب الطول */
        .testimonial-card-wide {
            grid-column: span 8;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.03) 100%);
        }

        .testimonial-card-wide .testimonial-text.text-long {
            columns: 2;
            column-gap: 20px;
            text-align: justify;
            line-height: 1.7;
        }

        .testimonial-card-medium {
            grid-column: span 6;
        }

        .testimonial-card-compact {
            grid-column: span 4;
        }

        /* بطاقة الشهادة الأساسية */
        .testimonial-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.1);
            border-radius: 24px;
            padding: 40px 35px;
            position: relative;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .testimonial-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, 
                var(--longing-1) 0%, var(--longing-3) 25%, 
                var(--longing-5) 50%, var(--longing-7) 75%, 
                var(--longing-9) 100%);
            transform: scaleX(0);
            transition: transform 0.5s ease;
        }

        .testimonial-card:hover::before {
            transform: scaleX(1);
        }

        /* الشهادة المميزة */
        .testimonial-card.highlighted {
            background: linear-gradient(135deg, 
                rgba(255, 215, 0, 0.08) 0%, 
                rgba(255, 165, 0, 0.05) 100%);
            border: 2px solid rgba(255, 215, 0, 0.3);
        }

        .testimonial-card-wide.highlighted::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--gold-primary), var(--sun-orange), var(--gold-primary));
            animation: shimmer 3s ease-in-out infinite;
        }

        /* تأثيرات hover مختلفة حسب الحجم */
        .testimonial-card-wide:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow: 0 25px 50px rgba(255, 215, 0, 0.2);
        }

        .testimonial-card-medium:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 20px 40px rgba(255, 215, 0, 0.15);
        }

        .testimonial-card-compact:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 15px 30px rgba(255, 215, 0, 0.1);
        }

        /* رأس البطاقة */
        .testimonial-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            position: relative;
        }

        .stars {
            display: flex;
            gap: 5px;
        }

        .stars i {
            color: var(--gold-primary);
            font-size: 1.1rem;
            animation: starPulse 2s ease-in-out infinite;
        }

        .stars i:nth-child(1) { animation-delay: 0s; }
        .stars i:nth-child(2) { animation-delay: 0.2s; }
        .stars i:nth-child(3) { animation-delay: 0.4s; }
        .stars i:nth-child(4) { animation-delay: 0.6s; }
        .stars i:nth-child(5) { animation-delay: 0.8s; }

        @keyframes starPulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
        }

        /* الشارات */
        .highlight-badge {
            position: absolute;
            top: -15px;
            right: 20px;
            background: linear-gradient(135deg, var(--gold-primary), var(--sun-orange));
            color: var(--dark-bg);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
            animation: badgePulse 2s ease-in-out infinite;
            z-index: 2;
        }

        @keyframes badgePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .verified-badge {
            background: rgba(34, 197, 94, 0.1);
            color: var(--longing-5);
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 5px;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        /* نص الشهادة مع تحسينات الطول */
        .testimonial-text {
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 30px;
            font-style: italic;
            position: relative;
            padding: 0 25px;
        }

        .text-long {
            font-size: 1.05rem;
            line-height: 1.8;
            text-align: justify;
            hyphens: auto;
        }

        .text-medium {
            font-size: 1.1rem;
            line-height: 1.7;
        }

        .text-short {
            font-size: 1.15rem;
            line-height: 1.6;
            text-align: center;
        }

        .testimonial-text::before,
        .testimonial-text::after {
            position: absolute;
            font-family: 'Font Awesome 5 Free';
            font-weight: 900;
            color: var(--gold-primary);
            opacity: 0.2;
            font-size: 2rem;
        }

        .testimonial-text::before {
            content: '\f10d';
            top: -10px;
            right: 0;
        }

        .testimonial-text::after {
            content: '\f10e';
            bottom: -10px;
            left: 0;
        }

        /* معلومات المؤلف */
        .testimonial-author {
            display: flex;
            align-items: center;
            gap: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 215, 0, 0.1);
        }

        .author-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold-primary), var(--sun-orange));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: var(--dark-bg);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .author-avatar::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 30%, rgba(255, 255, 255, 0.2) 100%);
            transform: translate(-50%, -50%);
        }

        .author-info {
            flex: 1;
        }

        .author-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--gold-primary);
            margin-bottom: 5px;
        }

        .author-job {
            display: block;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.95rem;
            margin-bottom: 3px;
        }

        .author-course {
            display: block;
            color: var(--longing-6);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .author-date {
            display: block;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.8rem;
            margin-top: 2px;
        }

        /* نموذج إضافة الشهادة */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 22, 40, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: linear-gradient(135deg, rgba(30, 58, 95, 0.95) 0%, rgba(10, 22, 40, 0.98) 100%);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 215, 0, 0.2);
            border-radius: 32px;
            padding: 40px;
            max-width: 650px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            transform: scale(0.7) rotateX(-15deg);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1) rotateX(0);
        }

        .modal-header {
            text-align: center;
            margin-bottom: 35px;
            position: relative;
        }

        .modal-title {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--gold-primary), var(--sun-orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .modal-subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.1rem;
        }

        .close-btn {
            position: absolute;
            top: -10px;
            left: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--white);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        /* تصميم النموذج */
        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-label {
            display: block;
            color: var(--gold-light);
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 1.05rem;
        }

        .form-input,
        .form-textarea,
        .form-select {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 215, 0, 0.2);
            border-radius: 16px;
            padding: 15px 20px;
            color: var(--white);
            font-size: 1rem;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.3s ease;
        }

        .form-input:focus,
        .form-textarea:focus,
        .form-select:focus {
            outline: none;
            border-color: var(--gold-primary);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .form-textarea {
            min-height: 120px;
            resize: vertical;
        }

        .form-select {
            cursor: pointer;
        }

        .form-select option {
            background: var(--dark-bg);
            color: var(--white);
            padding: 10px;
        }

        /* صف الحقول المزدوجة */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
        }

        .form-half {
            margin-bottom: 25px;
        }

        /* نظام التقييم بالنجوم */
        .rating-container {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
        }

        .stars-input {
            display: flex;
            gap: 8px;
        }

        .star-input {
            font-size: 2rem;
            color: rgba(255, 215, 0, 0.3);
            cursor: pointer;
            transition: all 0.2s ease;
            transform-origin: center;
        }

        .star-input:hover,
        .star-input.active {
            color: var(--gold-primary);
            transform: scale(1.2);
            filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.5));
        }

        .rating-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--gold-primary);
        }

        /* أزرار النموذج */
        .form-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 35px;
        }

        .btn-submit,
        .btn-cancel {
            padding: 15px 35px;
            border: none;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 140px;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--longing-5) 0%, var(--longing-9) 100%);
            color: var(--white);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(34, 197, 94, 0.4);
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.1);
            color: var(--white);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* رسالة النجاح */
        .success-message {
            position: fixed;
            top: 30px;
            right: 30px;
            background: linear-gradient(135deg, var(--longing-5), var(--longing-9));
            color: var(--white);
            padding: 20px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(34, 197, 94, 0.3);
            z-index: 1100;
            transform: translateX(400px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 600;
            font-size: 1.1rem;
        }

        .success-message.show {
            transform: translateX(0);
        }

        /* التحميل Skeleton */
        .testimonial-skeleton {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.05);
            border-radius: 24px;
            padding: 40px 35px;
            animation: skeletonPulse 1.5s ease-in-out infinite;
            grid-column: span 4;
        }

        @keyframes skeletonPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        .skeleton-header,
        .skeleton-text,
        .skeleton-footer {
            background: linear-gradient(90deg, 
                rgba(255, 215, 0, 0.1) 25%, 
                rgba(255, 215, 0, 0.2) 50%, 
                rgba(255, 215, 0, 0.1) 75%);
            background-size: 200% 100%;
            animation: skeletonShimmer 1.5s linear infinite;
            border-radius: 8px;
        }

        @keyframes skeletonShimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .skeleton-header {
            height: 30px;
            width: 120px;
            margin-bottom: 20px;
        }

        .skeleton-text {
            height: 20px;
            margin-bottom: 15px;
        }

        .skeleton-text.short {
            width: 70%;
        }

        .skeleton-footer {
            height: 60px;
            margin-top: 20px;
        }

        /* حالة فارغة */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            opacity: 0.7;
        }

        .empty-icon {
            font-size: 4rem;
            color: var(--gold-primary);
            opacity: 0.5;
            margin-bottom: 20px;
        }

        .empty-text {
            font-size: 1.2rem;
            color: var(--gold-light);
        }

        /* تحسينات الـ placeholders */
        .form-input::placeholder,
        .form-textarea::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        /* مؤثرات التحويل للنموذج */
        .form-group:hover .form-label {
            color: var(--gold-primary);
            transition: color 0.3s ease;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .testimonial-card-wide {
                grid-column: span 12;
            }
            .testimonial-card-wide .testimonial-text.text-long {
                columns: 1;
            }
            .testimonial-card-medium {
                grid-column: span 6;
            }
            .testimonial-card-compact {
                grid-column: span 6;
            }
        }

        @media (max-width: 768px) {
            .testimonials-section {
                padding: 80px 15px;
            }
            
            .testimonials-title {
                font-size: 2rem;
                flex-direction: column;
                gap: 15px;
            }
            
            .testimonial-card-wide,
            .testimonial-card-medium,
            .testimonial-card-compact {
                grid-column: span 12;
            }
            
            .smart-testimonials-grid {
                grid-template-columns: 1fr;
            }
            
            .testimonial-card {
                padding: 30px 25px;
            }
            
            .testimonial-text {
                padding: 0 15px;
            }

            .modal-content {
                padding: 30px 25px;
                margin: 20px;
            }

            .modal-title {
                font-size: 1.8rem;
            }

            .form-buttons {
                flex-direction: column;
                align-items: center;
            }

            .btn-submit,
            .btn-cancel {
                width: 100%;
                max-width: 250px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, var(--gold-primary), var(--sun-orange));
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {

        // تحميل الدورات - آمن ولا يحاول إنشاء documents
        async function loadCourses() {
            try {
                console.log('بدء تحميل الدورات من Firebase...');
                
                allCourses = [];
                
                // جلب كورس hayat مباشرة - موجود دائماً
                const hayatDoc = await db.collection('courses').doc('hayat').get();
                
                if (hayatDoc.exists) {
                    allCourses.push({ id: 'hayat', ...hayatDoc.data() });
                    console.log('تم تحميل كورس hayat بنجاح');
                } else {
                    console.error('خطأ: كورس hayat غير موجود في قاعدة البيانات');
                }
                
                // جلب باقي الكورسات إذا احتجت لها
                try {
                    const publishedSnapshot = await db.collection('courses')
                        .where('status', '==', 'published')
                        .get();
                        
                    const privateSnapshot = await db.collection('courses')
                        .where('status', '==', 'private')
                        .get();
                    
                    // إضافة الكورسات الأخرى (غير hayat)
                    publishedSnapshot.docs.forEach(doc => {
                        if (doc.id !== 'hayat') {
                            allCourses.push({ id: doc.id, ...doc.data() });
                        }
                    });
                    
                    privateSnapshot.docs.forEach(doc => {
                        if (doc.id !== 'hayat') {
                            allCourses.push({ id: doc.id, ...doc.data() });
                        }
                    });
                    
                } catch (error) {
                    console.log('خطأ في جلب الكورسات الأخرى:', error);
                }
                
                console.log(`تم تحميل ${allCourses.length} دورة بنجاح`);
                return allCourses;
                
            } catch (error) {
                console.error('خطأ في تحميل الدورات:', error);
                return [];
            }
        }

        // نظام الأيقونات الذكي
        function getSmartUserIcon(gender, age, name) {
            const iconSets = {
                male: {
                    young: ['👨‍🎓', '🧑‍💻', '👨‍🔬', '🧑‍🎨', '👨‍💼'],
                    adult: ['👨‍💼', '👨‍⚕️', '👨‍🏫', '👨‍🔧', '👨‍💻'],
                    middle: ['👨‍💼', '👨‍⚕️', '👨‍🏫', '👨‍🌾', '👨‍🍳'],
                    mature: ['👨‍💼', '👨‍⚕️', '👨‍🏫', '👴', '🧔']
                },
                female: {
                    young: ['👩‍🎓', '👩‍💻', '👩‍🔬', '👩‍🎨', '👩‍💼'],
                    adult: ['👩‍💼', '👩‍⚕️', '👩‍🏫', '👩‍🔧', '👩‍💻'],
                    middle: ['👩‍💼', '👩‍⚕️', '👩‍🏫', '👩‍🌾', '👩‍🍳'],
                    mature: ['👩‍💼', '👩‍⚕️', '👩‍🏫', '👵', '🧔']
                }
            };
            
            if (!gender || !age || !iconSets[gender] || !iconSets[gender][age]) {
                const defaultIcons = ['👤', '👨', '👩', '🧑', '👱', '👨‍💼', '👩‍💼', '🧑‍💼'];
                return defaultIcons[name.length % defaultIcons.length];
            }
            
            const appropriateIcons = iconSets[gender][age];
            return appropriateIcons[name.length % appropriateIcons.length];
        }

        // نظام الشهادات الذكي
        const TestimonialsManager = {
            allTestimonials: [],
            verifiedTestimonials: [],
            highlightedTestimonials: [],
            container: null,
            
            init() {
                this.container = document.getElementById('testimonialsContainer');
                if (!this.container) return;
                this.extractTestimonials();
            },
            
            extractTestimonials() {
                console.log('استخراج الشهادات من الكورسات...');
                
                if (!allCourses || allCourses.length === 0) {
                    this.showDefault();
                    return;
                }
                
                this.allTestimonials = [];
                
                allCourses.forEach(course => {
                    if (course.testimonials && course.testimonials.testimonials) {
                        const testimonialsData = course.testimonials.testimonials;
                        
                        if (Array.isArray(testimonialsData)) {
                            testimonialsData.forEach((t, index) => {
                                if (t && t.text) {
                                    const testimonial = {
                                        name: t.name || 'متدرب من رحلة ' + (course.title || 'تحويلية'),
                                        text: t.text,
                                        rating: parseInt(t.rating) || 5,
                                        verified: t.verified === true || t.verified === 'true',
                                        highlight: t.highlight === true || t.highlight === 'true',
                                        course: t.course || course.title || 'رحلة تحويلية',
                                        date: t.date || '',
                                        gender: t.gender || '',
                                        age: t.age || '',
                                        type: t.type || 'sample',
                                        timestamp: t.timestamp || new Date().toISOString(),
                                        textLength: t.text.length,
                                        isLongText: t.text.length > 150,
                                        isMediumText: t.text.length > 80 && t.text.length <= 150,
                                        isShortText: t.text.length <= 80
                                    };
                                    
                                    this.allTestimonials.push(testimonial);
                                }
                            });
                        }
                    }
                });
                
                // فلترة الشهادات الموثقة فقط
                this.verifiedTestimonials = this.allTestimonials.filter(t => t.verified === true);
                this.highlightedTestimonials = this.verifiedTestimonials.filter(t => t.highlight === true);
                
                console.log(`إجمالي: ${this.allTestimonials.length}, موثقة: ${this.verifiedTestimonials.length}, مميزة: ${this.highlightedTestimonials.length}`);
                
                if (this.verifiedTestimonials.length === 0) {
                    this.showDefault();
                    return;
                }
                
                this.displaySmartLayout();
            },
            
            displaySmartLayout() {
                this.container.innerHTML = '';
                
                // ترتيب الشهادات
                const sortedTestimonials = [
                    ...this.highlightedTestimonials,
                    ...this.verifiedTestimonials.filter(t => !t.highlight)
                ].sort((a, b) => {
                    if (a.highlight && !b.highlight) return -1;
                    if (!a.highlight && b.highlight) return 1;
                    return new Date(b.timestamp) - new Date(a.timestamp);
                });
                
                // تجميع الشهادات حسب الطول
                const longTestimonials = sortedTestimonials.filter(t => t.isLongText);
                const mediumTestimonials = sortedTestimonials.filter(t => t.isMediumText);
                const shortTestimonials = sortedTestimonials.filter(t => t.isShortText);
                
                this.createSmartGrid(longTestimonials, mediumTestimonials, shortTestimonials);
            },
            
            async createSmartGrid(longTestimonials, mediumTestimonials, shortTestimonials) {
                const smartGrid = document.createElement('div');
                smartGrid.className = 'smart-testimonials-grid';
                this.container.appendChild(smartGrid);
                
                let displayIndex = 0;
                
                const testimonialGroups = [
                    ...longTestimonials.map(t => ({ ...t, layoutType: 'wide' })),
                    ...mediumTestimonials.map(t => ({ ...t, layoutType: 'medium' })),
                    ...shortTestimonials.map(t => ({ ...t, layoutType: 'compact' }))
                ];
                
                const balancedTestimonials = this.balanceTestimonials(testimonialGroups);
                
                for (const testimonial of balancedTestimonials) {
                    await this.addSmartCard(testimonial, smartGrid, displayIndex);
                    displayIndex++;
                    
                    if (displayIndex < 15) {
                        await this.delay(150);
                    }
                }
                
                console.log(`تم عرض ${displayIndex} شهادة بتخطيط ذكي`);
            },
            
            balanceTestimonials(testimonials) {
                const balanced = [];
                const long = testimonials.filter(t => t.layoutType === 'wide');
                const medium = testimonials.filter(t => t.layoutType === 'medium');
                const compact = testimonials.filter(t => t.layoutType === 'compact');
                
                let longIndex = 0, mediumIndex = 0, compactIndex = 0;
                
                while (longIndex < long.length || mediumIndex < medium.length || compactIndex < compact.length) {
                    if (longIndex < long.length) {
                        balanced.push(long[longIndex]);
                        longIndex++;
                    }
                    
                    for (let i = 0; i < 2 && mediumIndex < medium.length; i++) {
                        balanced.push(medium[mediumIndex]);
                        mediumIndex++;
                    }
                    
                    for (let i = 0; i < 2 && compactIndex < compact.length; i++) {
                        balanced.push(compact[compactIndex]);
                        compactIndex++;
                    }
                }
                
                return balanced;
            },
            
            async addSmartCard(testimonial, container, index) {
                const card = this.createSmartCard(testimonial);
                
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px) scale(0.98)';
                container.appendChild(card);
                
                await this.delay(50);
                card.style.transition = 'all 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
                card.style.opacity = '1';
                card.style.transform = 'translateY(0) scale(1)';
                
                setTimeout(() => {
                    card.style.transition = 'all 0.3s ease';
                }, 500);
            },
            
            createSmartCard(testimonial) {
                const div = document.createElement('div');
                const layoutClass = `testimonial-card-${testimonial.layoutType}`;
                div.className = `testimonial-card ${layoutClass} ${testimonial.highlight ? 'highlighted' : ''}`;
                
                // فصل الاسم والوظيفة
                let name = testimonial.name;
                let job = '';
                
                if (name && name.includes('$$')) {
                    const parts = name.split('$$');
                    name = parts[0].trim();
                    job = parts[1] ? parts[1].trim() : '';
                }
                
                // النجوم
                let stars = '';
                const rating = parseInt(testimonial.rating) || 5;
                for (let i = 1; i <= 5; i++) {
                    stars += i <= rating ? '<i class="fas fa-star"></i>' : '<i class="far fa-star" style="opacity: 0.3;"></i>';
                }
                
                // الأيقونة الذكية
                const userIcon = getSmartUserIcon(testimonial.gender, testimonial.age, name);
                
                // تحديد layout النص
                const textClass = testimonial.isLongText ? 'text-long' : 
                                 testimonial.isMediumText ? 'text-medium' : 'text-short';
                
                div.innerHTML = `
                    ${testimonial.highlight ? '<span class="highlight-badge"><i class="fas fa-crown"></i> مميز</span>' : ''}
                    <div class="testimonial-header">
                        <div class="stars">${stars}</div>
                        <span class="verified-badge"><i class="fas fa-check-circle"></i> موثق</span>
                    </div>
                    <div class="testimonial-text ${textClass}">"${testimonial.text}"</div>
                    <div class="testimonial-author">
                        <div class="author-avatar">${userIcon}</div>
                        <div class="author-info">
                            <h5 class="author-name">${name}</h5>
                            ${job ? `<small class="author-job">${job}</small>` : ''}
                            <small class="author-course">
                                <i class="fas fa-graduation-cap"></i>
                                ${testimonial.course}
                            </small>
                            ${testimonial.date ? `
                                <small class="author-date">
                                    <i class="far fa-calendar"></i>
                                    ${testimonial.date}
                                </small>
                            ` : ''}
                        </div>
                    </div>
                `;
                
                return div;
            },
            
            delay(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            },
            
            showDefault() {
                const defaults = [
                    {
                        name: 'أحمد محمد$$مهندس برمجيات',
                        text: 'رحلة تحويلية غيرت حياتي بالكامل وساعدتني على اكتشاف قدراتي الحقيقية والتطور المهني والشخصي بشكل لم أتخيله من قبل',
                        rating: 5, verified: true, highlight: true, course: 'رحلة الأشواق التسعة',
                        gender: 'male', age: 'adult',
                        isLongText: true, layoutType: 'wide'
                    },
                    {
                        name: 'سارة أحمد$$طبيبة',
                        text: 'محتوى عميق ومؤثر مع متابعة ممتازة',
                        rating: 5, verified: true, course: 'رحلة القلب السليم',
                        gender: 'female', age: 'adult',
                        isShortText: true, layoutType: 'compact'
                    },
                    {
                        name: 'محمد علي$$رائد أعمال',
                        text: 'أفضل استثمار في حياتي، فتحت لي آفاق جديدة ومنحتني رؤية واضحة للمستقبل',
                        rating: 5, verified: true, course: 'رحلة الانطلاق المبهج',
                        gender: 'male', age: 'middle',
                        isMediumText: true, layoutType: 'medium'
                    },
                    {
                        name: 'فاطمة حسن$$معلمة',
                        text: 'تجربة رائعة ساعدتني على فهم نفسي والتعامل مع تحديات الحياة بطريقة أفضل. الكوتش محمود لديه طريقة فريدة في التعامل وتوصيل المعلومة بشكل يجعلك تطبقها فوراً في حياتك اليومية. أنصح الجميع بهذه التجربة المميزة',
                        rating: 5, verified: true, highlight: true, course: 'رحلة السلام المتصالح',
                        gender: 'female', age: 'middle',
                        isLongText: true, layoutType: 'wide'
                    },
                    {
                        name: 'عمر خالد$$مدير تسويق',
                        text: 'منهجية علمية مدروسة مع تطبيق عملي يناسب الواقع العربي',
                        rating: 5, verified: true, course: 'رحلة الاقتدار الحازم',

                        isMediumText: true, layoutType: 'medium'

                    {
                        name: 'نور الدين$$استشاري إداري',

                    }
                ];
                
                this.verifiedTestimonials = defaults;
                this.highlightedTestimonials = defaults.filter(t => t.highlight);
                this.createSmartGrid(
                    defaults.filter(t => t.layoutType === 'wide'),
                    defaults.filter(t => t.layoutType === 'medium'),
                    defaults.filter(t => t.layoutType === 'compact')
                );
            }
        };

        // إرسال الشهادة - آمن ولا يغير أي بيانات أخرى
        async function submitTestimonial(formData) {
            try {
                console.log('بدء عملية حفظ الشهادة...');
                
                // جلب البيانات الحالية مباشرة من Firebase
                const docRef = db.collection('courses').doc('hayat');
                const docSnapshot = await docRef.get();
                
                if (!docSnapshot.exists) {
                    console.error('خطأ: document hayat غير موجود - لا يمكن حفظ الشهادة');
                    return false;
                }
                
                const data = docSnapshot.data();
                const currentTestimonials = data.testimonials?.testimonials || [];
                
                console.log(`عدد الشهادات الحالية: ${currentTestimonials.length}`);

                const newTestimonial = {
                    name: formData.name,
                    text: formData.testimonial,
                    rating: formData.rating,
                    verified: false,
                    highlight: false,
                    course: formData.course,
                    date: formData.date,
                    whatsapp: formData.whatsapp,
                    job: formData.job,
                    gender: formData.gender,
                    age: formData.age,
                    type: 'user_submitted',
                    timestamp: new Date().toISOString(),
                    submissionId: Date.now() + '_' + Math.random().toString(36).substr(2, 9)
                };

                // إضافة الشهادة الجديدة في المقدمة فقط
                const updatedTestimonials = [newTestimonial, ...currentTestimonials];
                
                console.log(`عدد الشهادات بعد الإضافة: ${updatedTestimonials.length}`);

                // استخدام update فقط - لا نغير أي شيء آخر
                await docRef.update({
                    'testimonials.testimonials': updatedTestimonials,
                    'testimonials.lastUpdated': new Date().toISOString()
                });

                console.log('تم حفظ الشهادة بنجاح');
                return true;

            } catch (error) {
                console.error('خطأ في حفظ الشهادة:', error);
                return false;
            }
        }

        // وظائف النموذج
        function openTestimonialModal() {
            const modal = document.getElementById('testimonialModal');
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeTestimonialModal() {
            const modal = document.getElementById('testimonialModal');
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
            
            document.getElementById('testimonialForm').reset();
            currentRating = 0;
            updateStarsDisplay();
            document.getElementById('ratingText').textContent = 'اختر تقييمك';
        }

        // نظام التقييم بالنجوم
        function initStarsSystem() {
            const stars = document.querySelectorAll('.star-input');
            const ratingText = document.getElementById('ratingText');
            
            stars.forEach((star, index) => {
                star.addEventListener('click', () => {
                    currentRating = index + 1;
                    updateStarsDisplay();
                    updateRatingText();
                });
                
                star.addEventListener('mouseenter', () => {
                    highlightStars(index + 1);
                    });
            });
            
           document.getElementById('starsInput').addEventListener('mouseleave', () => {
            updateStarsDisplay();
        });
    }

    function highlightStars(rating) {
        const stars = document.querySelectorAll('.star-input');
        stars.forEach((star, index) => {
            if (index < rating) {
                star.classList.add('active');
            } else {
                star.classList.remove('active');
            }
        });
    }

    function updateStarsDisplay() {
        highlightStars(currentRating);
    }

    function updateRatingText() {
        const ratingText = document.getElementById('ratingText');
        const ratings = [
            '',
            'ضعيف',
            'مقبول', 
            'جيد',
            'ممتاز',
            'استثنائي'
        ];
        
        ratingText.textContent = ratings[currentRating] || 'اختر تقييمك';
    }

    function showSuccessMessage() {
        const successMessage = document.getElementById('successMessage');
        successMessage.classList.add('show');
        
        setTimeout(() => {

    }

// تعديل مستمع أحداث حقل الواتساب لقبول الأرقام الدولية
function setupModalEventListeners() {
    // إغلاق النموذج عند الضغط خارج المحتوى
    document.getElementById('testimonialModal').addEventListener('click', function(e) {
        if (e.target === this) {
            closeTestimonialModal();
        }
    });
    
    // إغلاق النموذج بمفتاح Escape
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && document.getElementById('testimonialModal').classList.contains('active')) {
            closeTestimonialModal();
        }
    });
    
    // تنسيق رقم الواتساب الدولي
    const whatsappInput = document.getElementById('userWhatsapp');
    whatsappInput.addEventListener('input', function(e) {
        let value = e.target.value;
        
        // إزالة أي حروف غير مرغوبة (الاحتفاظ بالأرقام والعلامات المسموحة فقط)
        value = value.replace(/[^\d\+\-\s\(\)]/g, '');
        
        // تحديد الحد الأقصى للطول (15 رقم + رموز إضافية)
        if (value.replace(/[^\d]/g, '').length > 15) {
            // استخراج الأرقام فقط والحد من طولها
            const numbersOnly = value.replace(/[^\d]/g, '');
            const limitedNumbers = numbersOnly.substring(0, 15);
            
            // إعادة بناء الرقم مع الحفاظ على التنسيق
            if (value.startsWith('+')) {
                value = '+' + limitedNumbers;
            } else {
                value = limitedNumbers;
            }
        }
        
        e.target.value = value;
    });
    
    // تحسين placeholder لحقل الواتساب
    whatsappInput.placeholder = "+مثال: 201234567890+ أو 01234567890 أو 966501234567";
    
    // باقي المستمعات كما هي...
    const testimonialTextarea = document.getElementById('userTestimonial');
    testimonialTextarea.addEventListener('input', function(e) {
        e.target.style.height = 'auto';
        e.target.style.height = e.target.scrollHeight + 'px';
    });
    
    const inputs = document.querySelectorAll('.form-input, .form-textarea, .form-select');
    inputs.forEach(input => {
        input.addEventListener('focus', function() {
            this.parentElement.style.transform = 'scale(1.02)';
            this.parentElement.style.transition = 'transform 0.2s ease';
        });
        
        input.addEventListener('blur', function() {
            this.parentElement.style.transform = 'scale(1)';
        });
    });

    document.getElementById('userGender').addEventListener('change', function() {
        const genderIcon = this.previousElementSibling.querySelector('i');
        if (this.value === 'male') {
            genderIcon.className = 'fas fa-mars';
            genderIcon.style.color = '#3B82F6';
        } else if (this.value === 'female') {
            genderIcon.className = 'fas fa-venus';
            genderIcon.style.color = '#EC4899';
        }
    });

    document.getElementById('userAge').addEventListener('change', function() {
        const ageIcon = this.previousElementSibling.querySelector('i');
        ageIcon.style.color = '#FBBF24';
        
        ageIcon.style.transform = 'scale(1.2)';
        setTimeout(() => {
            ageIcon.style.transform = 'scale(1)';
        }, 200);
    });
}

    // معالج إرسال النموذج الرئيسي
    document.getElementById('testimonialForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        // التحقق من صحة البيانات
        if (!validateEnhancedForm()) {
            return;
        }
        
        const submitBtn = document.querySelector('.btn-submit');
        const originalText = submitBtn.innerHTML;
        
        // تأثير التحميل
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الإرسال...';
        submitBtn.classList.add('loading');
        submitBtn.disabled = true;
        
        // جمع البيانات مع الحقول الجديدة
        const name = document.getElementById('userName').value.trim();
        const job = document.getElementById('userJob').value.trim();
        const fullName = job ? `${name}$$${job}` : name;
        
        const formData = {
            name: fullName,
            whatsapp: document.getElementById('userWhatsapp').value.trim(),
            job: document.getElementById('userJob').value.trim(),
            course: document.getElementById('userCourse').value.trim(),
            date: document.getElementById('userDate').value.trim(),
            testimonial: document.getElementById('userTestimonial').value.trim(),
            rating: currentRating,
            gender: document.getElementById('userGender').value,
            age: document.getElementById('userAge').value
        };
        
        try {
            const success = await submitTestimonial(formData);
            
            if (success) {
                showSuccessMessage();
                closeTestimonialModal();
                
                // إعادة تحميل البيانات دون إعادة تحميل الصفحة
                setTimeout(async () => {
                    await loadCourses();
                    TestimonialsManager.extractTestimonials();
                }, 1500);
            } else {
                throw new Error('فشل في حفظ البيانات');
            }
            
        } catch (error) {
            console.error('خطأ في الإرسال:', error);
            
            // رسالة خطأ مفصلة
            let errorMessage = 'حدث خطأ أثناء إرسال شهادتك. ';
            
            if (error.code === 'permission-denied') {
                errorMessage += 'ليس لديك صلاحية للكتابة في قاعدة البيانات.';
            } else if (error.code === 'unavailable') {
                errorMessage += 'الخدمة غير متاحة حالياً. يرجى المحاولة لاحقاً.';
            } else {
                errorMessage += 'يرجى المحاولة مرة أخرى أو التواصل مع الدعم الفني.';
            }
            
            alert(errorMessage);
            
        } finally {
            // إعادة تعيين الزر
            submitBtn.innerHTML = originalText;
            submitBtn.classList.remove('loading');
            submitBtn.disabled = false;
        }
    });

    // تشغيل النظام عند تحميل الصفحة
    document.addEventListener('DOMContentLoaded', async function() {
        console.log('تم تحميل الصفحة - بدء التهيئة...');
        
        // تحميل البيانات من Firebase أولاً
        await loadCourses();
        
        // بدء نظام الشهادات بعد تحميل البيانات
        console.log('بدء تشغيل نظام الشهادات...');
        TestimonialsManager.init();
        
        // تهيئة نظام النجوم
        initStarsSystem();
        
        // إضافة مستمعات الأحداث للنموذج
        setupModalEventListeners();
    });

    console.log('✅ تم تحميل نظام الشهادات التفاعلي بنجاح');
