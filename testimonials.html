<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قسم الشهادات - منظور الفؤاد</title>
    
    <!-- Firebase SDKs - يجب أن تكون قبل أي JavaScript -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    
    <!-- External CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* ألوان الأشواق التسعة من الهوية */
            --longing-1: #E11D48; /* أحمر قرمزي/ياقوتي فاتح - الارتقاء المحكم */
            --longing-2: #EC4899; /* وردي - الانسجام المؤثر */
            --longing-3: #F97316; /* برتقالي - التميز الساطع */
            --longing-4: #9333EA; /* بنفسجي - الانتماء الأصيل */
            --longing-5: #22C55E; /* أخضر - الاكتفاء الواثق */
            --longing-6: #3B82F6; /* أزرق سماوي - الأمان المطمئن */
            --longing-7: #FBBF24; /* ذهبي - الانطلاق المبهج */
            --longing-8: #7F1D1D; /* أحمر غامق/نبيذي - الاقتدار الحازم */
            --longing-9: #14B8A6; /* فيروزي - السلام المتصالح */
            
            /* الألوان الأساسية من الهوية */
            --gold-primary: #FFD700;
            --gold-light: #FFF3CD;
            --gold-glow: rgba(255, 215, 0, 0.3);
            --sun-orange: #FFA500;
            --sun-red: #FF6347;
            
            --dark-bg: #0A1628;
            --dark-lighter: #1E3A5F;
            --dark-overlay: rgba(10, 22, 40, 0.95);
            
            --white: #FFFFFF;
            --gray-light: #F8F9FA;
            --gray-medium: #6C757D;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--dark-bg);
            color: var(--white);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* تصميم قسم الشهادات المبتكر */
        .testimonials-section {
            padding: 120px 20px;
            background: linear-gradient(135deg, rgba(20, 184, 166, 0.03) 0%, rgba(147, 51, 234, 0.03) 100%);
            position: relative;
            overflow: hidden;
        }

        .testimonials-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, 
                transparent, 
                var(--gold-primary), 
                transparent
            );
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .testimonials-container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
        }

        /* العنوان المبتكر */
        .testimonials-header {
            text-align: center;
            margin-bottom: 80px;
            position: relative;
        }

        .section-title-wrapper {
            display: inline-block;
            position: relative;
        }

        .testimonials-title {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            position: relative;
        }

        .title-text {
            background: linear-gradient(135deg, var(--gold-primary) 0%, var(--sun-orange) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: titleGlow 4s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.2); }
        }

        .title-icon {
            font-size: 1.5rem;
            color: var(--gold-primary);
            opacity: 0.5;
            animation: iconFloat 3s ease-in-out infinite;
        }

        .title-icon:first-child {
            animation-delay: 0s;
        }

        .title-icon:last-child {
            animation-delay: 1.5s;
        }

        @keyframes iconFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .testimonials-subtitle {
            font-size: 1.3rem;
            color: var(--gold-light);
            opacity: 0.8;
            margin-bottom: 30px;
        }

        /* زر إضافة شهادة جديدة - تصميم فاخر وملفت */
        .add-testimonial-btn {
            background: linear-gradient(135deg, var(--longing-3) 0%, var(--gold-primary) 100%);
            color: var(--dark-bg);
            border: none;
            padding: 18px 40px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(255, 165, 0, 0.3);
            animation: buttonPulse 3s ease-in-out infinite;
        }

        .add-testimonial-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.5s;
        }

        .add-testimonial-btn:hover::before {
            left: 100%;
        }

        .add-testimonial-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 45px rgba(255, 165, 0, 0.4);
        }

        @keyframes buttonPulse {
            0%, 100% { box-shadow: 0 8px 32px rgba(255, 165, 0, 0.3); }
            50% { box-shadow: 0 12px 40px rgba(255, 165, 0, 0.5); }
        }

        /* نموذج إضافة الشهادة - تصميم متطور */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 22, 40, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: linear-gradient(135deg, rgba(30, 58, 95, 0.95) 0%, rgba(10, 22, 40, 0.98) 100%);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 215, 0, 0.2);
            border-radius: 32px;
            padding: 40px;
            max-width: 650px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            transform: scale(0.7) rotateX(-15deg);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1) rotateX(0);
        }

        .modal-header {
            text-align: center;
            margin-bottom: 35px;
            position: relative;
        }

        .modal-title {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--gold-primary), var(--sun-orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .modal-subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.1rem;
        }

        .close-btn {
            position: absolute;
            top: -10px;
            left: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--white);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        /* تصميم النموذج المتطور */
        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-label {
            display: block;
            color: var(--gold-light);
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 1.05rem;
        }

        .form-input,
        .form-textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 215, 0, 0.2);
            border-radius: 16px;
            padding: 15px 20px;
            color: var(--white);
            font-size: 1rem;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.3s ease;
        }

        .form-input:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--gold-primary);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .form-textarea {
            min-height: 120px;
            resize: vertical;
        }

        /* نظام التقييم بالنجوم التفاعلي */
        .rating-container {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
        }

        .stars-input {
            display: flex;
            gap: 8px;
        }

        .star-input {
            font-size: 2rem;
            color: rgba(255, 215, 0, 0.3);
            cursor: pointer;
            transition: all 0.2s ease;
            transform-origin: center;
        }

        .star-input:hover,
        .star-input.active {
            color: var(--gold-primary);
            transform: scale(1.2);
            filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.5));
        }

        .rating-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--gold-primary);
        }

        /* أزرار النموذج */
        .form-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 35px;
        }

        .btn-submit,
        .btn-cancel {
            padding: 15px 35px;
            border: none;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 140px;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--longing-5) 0%, var(--longing-9) 100%);
            color: var(--white);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(34, 197, 94, 0.4);
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.1);
            color: var(--white);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* رسالة النجاح */
        .success-message {
            position: fixed;
            top: 30px;
            right: 30px;
            background: linear-gradient(135deg, var(--longing-5), var(--longing-9));
            color: var(--white);
            padding: 20px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(34, 197, 94, 0.3);
            z-index: 1100;
            transform: translateX(400px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 600;
            font-size: 1.1rem;
        }

        .success-message.show {
            transform: translateX(0);
        }

        /* حاوية الشهادات */
        .testimonials-carousel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
            position: relative;
            max-width: 1200px;
            margin: 0 auto 40px;
        }

        @media (min-width: 1200px) {
            .testimonials-carousel {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (min-width: 768px) and (max-width: 1199px) {
            .testimonials-carousel {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* بطاقة الشهادة */
        .testimonial-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.1);
            border-radius: 24px;
            padding: 40px 35px;
            position: relative;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            animation: cardEntry 0.8s ease-out;
        }

        @keyframes cardEntry {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.95) rotateX(-10deg);
                filter: blur(3px);
            }
            50% {
                opacity: 0.7;
                transform: translateY(10px) scale(0.98) rotateX(-5deg);
                filter: blur(1px);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1) rotateX(0);
                filter: blur(0);
            }
        }

        .testimonial-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, 
                var(--longing-1) 0%, 
                var(--longing-3) 25%, 
                var(--longing-5) 50%, 
                var(--longing-7) 75%, 
                var(--longing-9) 100%
            );
            transform: scaleX(0);
            transition: transform 0.5s ease;
        }

        .testimonial-card:hover::before {
            transform: scaleX(1);
        }

        .testimonial-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 
                0 20px 40px rgba(255, 215, 0, 0.15),
                0 0 60px rgba(255, 215, 0, 0.05);
            border-color: rgba(255, 215, 0, 0.3);
        }

        /* الشهادة الممیزة */
        .testimonial-card.highlighted {
            background: linear-gradient(135deg, 
                rgba(255, 215, 0, 0.08) 0%, 
                rgba(255, 165, 0, 0.05) 100%
            );
            border: 2px solid rgba(255, 215, 0, 0.3);
            transform: scale(1.05);
        }

        .testimonial-card.highlighted::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, 
                rgba(255, 215, 0, 0.1) 0%, 
                transparent 70%
            );
            animation: highlightRotate 20s linear infinite;
        }

        @keyframes highlightRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* رأس البطاقة */
        .testimonial-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            position: relative;
        }

        .stars {
            display: flex;
            gap: 5px;
        }

        .stars i {
            color: var(--gold-primary);
            font-size: 1.1rem;
            animation: starPulse 2s ease-in-out infinite;
        }

        .stars i:nth-child(1) { animation-delay: 0s; }
        .stars i:nth-child(2) { animation-delay: 0.2s; }
        .stars i:nth-child(3) { animation-delay: 0.4s; }
        .stars i:nth-child(4) { animation-delay: 0.6s; }
        .stars i:nth-child(5) { animation-delay: 0.8s; }

        @keyframes starPulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
        }

        /* الشارات */
        .highlight-badge {
            position: absolute;
            top: -15px;
            right: 20px;
            background: linear-gradient(135deg, var(--gold-primary), var(--sun-orange));
            color: var(--dark-bg);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
            animation: badgePulse 2s ease-in-out infinite;
            z-index: 2;
        }

        @keyframes badgePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .verified-badge {
            background: rgba(34, 197, 94, 0.1);
            color: var(--longing-5);
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 5px;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        /* نص الشهادة */
        .testimonial-text {
            font-size: 1.15rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 30px;
            font-style: italic;
            position: relative;
            padding: 0 25px;
        }

        .testimonial-text::before,
        .testimonial-text::after {
            position: absolute;
            font-family: 'Font Awesome 5 Free';
            font-weight: 900;
            color: var(--gold-primary);
            opacity: 0.2;
            font-size: 2rem;
        }

        .testimonial-text::before {
            content: '\f10d';
            top: -10px;
            right: 0;
        }

        .testimonial-text::after {
            content: '\f10e';
            bottom: -10px;
            left: 0;
        }

        /* معلومات المؤلف */
        .testimonial-author {
            display: flex;
            align-items: center;
            gap: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 215, 0, 0.1);
        }

        .author-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold-primary), var(--sun-orange));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: var(--dark-bg);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .author-avatar::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, 
                transparent 30%, 
                rgba(255, 255, 255, 0.2) 100%
            );
            transform: translate(-50%, -50%);
        }

        .author-info {
            flex: 1;
        }

        .author-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--gold-primary);
            margin-bottom: 5px;
        }

        .author-job {
            display: block;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.95rem;
            margin-bottom: 3px;
        }

        .author-course {
            display: block;
            color: var(--longing-6);
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* التحميل Skeleton */
        .testimonial-skeleton {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.05);
            border-radius: 24px;
            padding: 40px 35px;
            animation: skeletonPulse 1.5s ease-in-out infinite;
        }

        @keyframes skeletonPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        .skeleton-header,
        .skeleton-text,
        .skeleton-footer {
            background: linear-gradient(90deg, 
                rgba(255, 215, 0, 0.1) 25%, 
                rgba(255, 215, 0, 0.2) 50%, 
                rgba(255, 215, 0, 0.1) 75%
            );
            background-size: 200% 100%;
            animation: skeletonShimmer 1.5s linear infinite;
            border-radius: 8px;
        }

        @keyframes skeletonShimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .skeleton-header {
            height: 30px;
            width: 120px;
            margin-bottom: 20px;
        }

        .skeleton-text {
            height: 20px;
            margin-bottom: 15px;
        }

        .skeleton-text.short {
            width: 70%;
        }

        .skeleton-footer {
            height: 60px;
            margin-top: 20px;
        }

        /* مؤشرات التنقل */
        .testimonials-indicators {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 40px;
        }

        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 215, 0, 0.2);
            border: 1px solid rgba(255, 215, 0, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .indicator.active {
            width: 40px;
            border-radius: 20px;
            background: linear-gradient(90deg, var(--gold-primary), var(--sun-orange));
        }

        .indicator:hover {
            transform: scale(1.2);
            background: rgba(255, 215, 0, 0.4);
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .testimonials-carousel {
                grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
                gap: 30px;
            }
        }

        @media (max-width: 768px) {
            .testimonials-section {
                padding: 80px 15px;
            }
            
            .testimonials-title {
                font-size: 2rem;
                flex-direction: column;
                gap: 15px;
            }
            
            .testimonials-carousel {
                grid-template-columns: 1fr;
                gap: 25px;
            }
            
            .testimonial-card {
                padding: 30px 25px;
            }
            
            .testimonial-text {
                font-size: 1.05rem;
                padding: 0 15px;
            }

            .modal-content {
                padding: 30px 25px;
                margin: 20px;
            }

            .modal-title {
                font-size: 1.8rem;
            }

            .form-buttons {
                flex-direction: column;
                align-items: center;
            }

            .btn-submit,
            .btn-cancel {
                width: 100%;
                max-width: 250px;
            }
        }

        /* تأثيرات إضافية للتفاعل */
        .testimonial-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
            transition: width 0.5s ease;
        }

        .testimonial-card:hover::after {
            width: 80%;
        }

        /* أنيميشن الدخول المتتالي */
        .testimonial-card:nth-child(1) { animation-delay: 0.1s; }
        .testimonial-card:nth-child(2) { animation-delay: 0.3s; }
        .testimonial-card:nth-child(3) { animation-delay: 0.5s; }

// نظام الشهادات الاحترافي مع الظهور المتتابع - نسخة من الكود الأصلي
const TestimonialsManager = {
    allTestimonials: [],
    verifiedTestimonials: [], // الموثقة فقط
    highlightedTestimonials: [], // المميزة
    container: null,
    
    init() {
        this.container = document.getElementById('testimonialsContainer');
        if (!this.container) return;
        
        // بدء استخراج الشهادات مباشرة
        this.extractTestimonials();
    },
    
    extractTestimonials() {
        console.log('بدء استخراج الشهادات من جميع الكورسات...');
        console.log('عدد الكورسات المتاحة:', allCourses.length);
        
        // إذا لم توجد كورسات، عرض البيانات الافتراضية

        this.allTestimonials = [];
        
        // استخراج الشهادات من كل الكورسات
        allCourses.forEach(course => {
            console.log('فحص كورس:', course.title || course.id);
            
            if (course.testimonials && course.testimonials.testimonials) {
                const testimonialsData = course.testimonials.testimonials;
                console.log(`عدد الشهادات في ${course.title}:`, testimonialsData.length);
                
                if (Array.isArray(testimonialsData)) {
                    testimonialsData.forEach((t, index) => {
                        if (t && t.text) {

                                name: t.name || 'متدرب من رحلة ' + (course.title || 'تحويلية'),
                                text: t.text,

        console.log('🎯 إجمالي الشهادات:', this.allTestimonials.length);

        this.verifiedTestimonials = this.allTestimonials.filter(t => t.verified === true);

            this.showDefault();
            return;

        // عرض جميع الشهادات الموثقة
        this.displayAllVerifiedTestimonials();
    },
    
    async displayAllVerifiedTestimonials() {
        this.container.innerHTML = '';
        
        // ترتيب الشهادات: المميزة أولاً ثم الموثقة العادية
        const sortedTestimonials = [
            ...this.highlightedTestimonials,
            ...this.verifiedTestimonials.filter(t => !t.highlight)
        ];
        
        // ترتيب حسب التاريخ (الأحدث أولاً)
        sortedTestimonials.sort((a, b) => {
            // المميزة تظهر أولاً
            if (a.highlight && !b.highlight) return -1;
            if (!a.highlight && b.highlight) return 1;
            
            // ثم ترتيب حسب التاريخ
            return new Date(b.timestamp) - new Date(a.timestamp);
        });
        
        console.log('🎭 ترتيب العرض:', sortedTestimonials.length, 'شهادة');
        
        // عرض كل الشهادات مع تأخير بسيط للتأثير البصري
        for (let i = 0; i < sortedTestimonials.length; i++) {
            await this.addCardWithAnimation(sortedTestimonials[i], sortedTestimonials[i].highlight);
            
            // تأخير بسيط بين الشهادات للتأثير البصري
            if (i < 10) { // أول 10 شهادات فقط
                await this.delay(200);
            }
        }
        
        // إزالة مؤشرات التنقل لأننا نعرض كل شيء
        const indicators = document.getElementById('testimonialsIndicators');
        if (indicators) {
            indicators.style.display = 'none';
        }
        
        console.log('✨ تم عرض جميع الشهادات الموثقة');
    },
    
    async addCardWithAnimation(testimonial, isHighlighted) {
        const card = this.createCard(testimonial, isHighlighted);
        
        // إضافة البطاقة مخفية
        card.style.opacity = '0';
        card.style.transform = 'translateY(30px) scale(0.95)';
        this.container.appendChild(card);
        
        // تشغيل الأنيميشن
        await this.delay(50);
        card.style.transition = 'all 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
        card.style.opacity = '1';
        card.style.transform = 'translateY(0) scale(1)';
    },
    
    createCard(testimonial, isHighlighted) {
        const div = document.createElement('div');
        div.className = `testimonial-card ${isHighlighted ? 'highlighted' : ''}`;
        
        // فصل الاسم والوظيفة
        let name = testimonial.name;
        let job = '';
        
        if (name && name.includes('$$')) {
            const parts = name.split('$$');
            name = parts[0].trim();
            job = parts[1] ? parts[1].trim() : '';
        }
        
        // النجوم بناءً على التقييم
        let stars = '';
        const rating = parseInt(testimonial.rating) || 5;
        for (let i = 1; i <= 5; i++) {
            if (i <= rating) {
                stars += '<i class="fas fa-star"></i>';
            } else {
                stars += '<i class="far fa-star" style="opacity: 0.3;"></i>';
            }
        }
        
        // أيقونة الصورة الشخصية
        const icons = ['👤', '👨', '👩', '🧑', '👱', '👨‍💼', '👩‍💼', '🧑‍💼'];
        const iconIndex = name.length % icons.length;
        const userIcon = icons[iconIndex];
        
        div.innerHTML = `
            ${isHighlighted ? '<span class="highlight-badge"><i class="fas fa-crown"></i> مميز</span>' : ''}
            <div class="testimonial-header">
                <div class="stars">${stars}</div>
                <span class="verified-badge"><i class="fas fa-check-circle"></i> موثق</span>
            </div>
            <p class="testimonial-text">"${testimonial.text}"</p>
            <div class="testimonial-author">
                <div class="author-avatar" style="font-size: 1.8rem;">
                    ${userIcon}
                </div>
                <div class="author-info">
                    <h5 class="author-name">${name}</h5>
                    ${job ? `<small class="author-job">${job}</small>` : ''}
                    <small class="author-course">
                        <i class="fas fa-graduation-cap" style="font-size: 0.8rem; margin-left: 5px;"></i>
                        ${testimonial.course}
                    </small>
                    ${testimonial.date ? `
                        <small style="display: block; color: rgba(255,255,255,0.4); font-size: 0.8rem; margin-top: 2px;">
                            <i class="far fa-calendar" style="font-size: 0.7rem; margin-left: 3px;"></i>
                            ${testimonial.date}
                        </small>
                    ` : ''}
                </div>
            </div>
        `;
        
        return div;
    },
    
    delay(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    },
    
    showDefault() {
        // نفس البيانات الافتراضية ولكن كلها موثقة
        const defaults = [
            {
                name: 'أحمد محمد$$مهندس برمجيات',
                text: 'رحلة تحويلية غيرت حياتي بالكامل وساعدتني على اكتشاف قدراتي',
                rating: 5,
                verified: true,

                course: 'رحلة الأشواق التسعة'
            },
            {
                name: 'سارة أحمد$$طبيبة',
                text: 'محتوى عميق ومؤثر مع متابعة ممتازة من الكوتش محمود',
                rating: 5,

            },
            {
                name: 'محمد علي$$رائد أعمال',
                text: 'أفضل استثمار في حياتي، فتحت لي آفاق جديدة',

            },
            {
                name: 'فاطمة حسن$$معلمة',
                text: 'تجربة رائعة ساعدتني على فهم نفسي والتعامل مع تحديات الحياة بطريقة أفضل',
                rating: 5,
                verified: true,
                highlight: true,

            },
            {
                name: 'عمر خالد$$مدير تسويق',
                text: 'منهجية علمية مدروسة مع تطبيق عملي يناسب الواقع العربي',
                rating: 5,
                verified: true,
                course: 'رحلة الاقتدار الحازم'
            },
            {
                name: 'نور الدين$$استشاري إداري',
                text: 'رحلة حقيقية نحو النمو الشخصي والمهني. شكراً كوتش محمود على هذا العمل المتميز',
                rating: 5,
                verified: true,

        this.verifiedTestimonials = defaults;
        this.highlightedTestimonials = defaults.filter(t => t.highlight);
        this.displayAllVerifiedTestimonials();

// وظائف النموذج التفاعلي
function openTestimonialModal() {
    const modal = document.getElementById('testimonialModal');
    modal.classList.add('active');
    document.body.style.overflow = 'hidden';
}

function closeTestimonialModal() {
    const modal = document.getElementById('testimonialModal');
    modal.classList.remove('active');
    document.body.style.overflow = 'auto';
    
    // إعادة تعيين النموذج
    document.getElementById('testimonialForm').reset();
    currentRating = 0;
    updateStarsDisplay();
    document.getElementById('ratingText').textContent = 'اختر تقييمك';
}

// نظام التقييم بالنجوم
function initStarsSystem() {
    const stars = document.querySelectorAll('.star-input');
    const ratingText = document.getElementById('ratingText');
    
    stars.forEach((star, index) => {
        star.addEventListener('click', () => {
            currentRating = index + 1;
            updateStarsDisplay();
            updateRatingText();
        });
        
        star.addEventListener('mouseenter', () => {
            highlightStars(index + 1);
        });
    });
    
    document.getElementById('starsInput').addEventListener('mouseleave', () => {
        updateStarsDisplay();
    });
}

function highlightStars(rating) {
    const stars = document.querySelectorAll('.star-input');
    stars.forEach((star, index) => {
        if (index < rating) {
            star.classList.add('active');
        } else {
            star.classList.remove('active');
        }
    });
}

function updateStarsDisplay() {
    highlightStars(currentRating);
}

function updateRatingText() {
    const ratingText = document.getElementById('ratingText');
    const ratings = [
        '',
        'ضعيف',
        'مقبول', 
        'جيد',
        'ممتاز',
        'استثنائي'
    ];
    
    ratingText.textContent = ratings[currentRating] || 'اختر تقييمك';
}

// إرسال الشهادة
// دالة الحفظ المحدثة - تحفظ في hayat فقط
async function submitTestimonial(formData) {
    try {
        console.log('🔍 البحث عن كورس hayat للحفظ...');
        
        // البحث عن كورس hayat بالتحديد
        let hayatCourse = allCourses.find(course => 
            (course.title && course.title.toLowerCase().includes('hayat')) ||
            course.id === 'hayat'
        );
        
        // إذا لم نجده، ننشئه
        if (!hayatCourse) {
            console.log('⚠️ كورس hayat غير موجود، سيتم إنشاؤه...');
            
            const hayatCourseData = {
                title: 'hayat',
                status: 'published',
                testimonials: {
                    testimonials: []
                },
                createdAt: new Date().toISOString()
            };
            
            await db.collection('courses').doc('hayat').set(hayatCourseData);
            hayatCourse = { id: 'hayat', ...hayatCourseData };
            allCourses.push(hayatCourse);
            console.log('✅ تم إنشاء كورس hayat');
        }
        
        // إنشاء الشهادة الجديدة
        const newTestimonial = {
            name: formData.name,
            text: formData.testimonial,
            rating: formData.rating,
            verified: false, // دائماً false حتى الموافقة
            highlight: false, // دائماً false حتى الموافقة  
            course: formData.course,
            date: formData.date,
            whatsapp: formData.whatsapp,
            job: formData.job,
            type: 'user_submitted',
            timestamp: new Date().toISOString(),
            submissionId: Date.now() + '_' + Math.random().toString(36).substr(2, 9)
        };

        // الحصول على الشهادات الحالية
        const currentTestimonials = hayatCourse.testimonials?.testimonials || [];
        
        // إضافة الشهادة الجديدة في البداية
        const updatedTestimonials = [newTestimonial, ...currentTestimonials];

        // تحديث كورس hayat فقط
        await db.collection('courses').doc('hayat').update({
            'testimonials.testimonials': updatedTestimonials,
            'testimonials.lastUpdated': new Date().toISOString()
        });

        console.log('✅ تم حفظ الشهادة في كورس hayat بنجاح');
        console.log('📊 العدد الجديد في hayat:', updatedTestimonials.length);
        
        return true;

    } catch (error) {
        console.error('❌ خطأ في حفظ الشهادة:', error);
        return false;
    }
}

// تهيئة مستمعات أحداث النموذج
function setupModalEventListeners() {
    // إغلاق النموذج عند الضغط خارج المحتوى
    document.getElementById('testimonialModal').addEventListener('click', function(e) {
        if (e.target === this) {
            closeTestimonialModal();
        }
    });
    
    // إغلاق النموذج بمفتاح Escape
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && document.getElementById('testimonialModal').classList.contains('active')) {
            closeTestimonialModal();
        }
    });
    
    // تنسيق رقم الواتساب تلقائياً
    const whatsappInput = document.getElementById('userWhatsapp');
    whatsappInput.addEventListener('input', function(e) {
        let value = e.target.value.replace(/\D/g, ''); // إزالة كل ما ليس رقم
        
        // إضافة 01 إذا لم تكن موجودة وكان الرقم يبدأ بـ 1
        if (value.length > 0 && value[0] === '1' && !value.startsWith('01')) {
            value = '0' + value;
        }
        
        // تحديد الحد الأقصى للطول
        if (value.length > 11) {
            value = value.substring(0, 11);
        }
        
        e.target.value = value;
    });
    
    // تحسين تجربة الكتابة في حقل الشهادة
    const testimonialTextarea = document.getElementById('userTestimonial');
    testimonialTextarea.addEventListener('input', function(e) {
        // تغيير حجم النص تلقائياً
        e.target.style.height = 'auto';
        e.target.style.height = e.target.scrollHeight + 'px';
    });
    
    // إضافة تأثيرات بصرية للحقول
    const inputs = document.querySelectorAll('.form-input, .form-textarea');
    inputs.forEach(input => {
        input.addEventListener('focus', function() {
            this.parentElement.style.transform = 'scale(1.02)';
            this.parentElement.style.transition = 'transform 0.2s ease';
        });
        
        input.addEventListener('blur', function() {
            this.parentElement.style.transform = 'scale(1)';
        });
    });
}

// دالة مساعدة للتحقق من صحة البيانات
function validateForm() {
    const requiredFields = [
        { id: 'userName', name: 'الاسم' },
        { id: 'userWhatsapp', name: 'رقم الواتساب' },
        { id: 'userCourse', name: 'اسم الكورس' },
        { id: 'userTestimonial', name: 'الشهادة' }
    ];
    
    for (let field of requiredFields) {
        const element = document.getElementById(field.id);
        if (!element.value.trim()) {
            alert(`يرجى ملء حقل ${field.name}`);
            element.focus();
            return false;
        }
    }
    
    // التحقق من رقم الواتساب
    const whatsappValue = document.getElementById('userWhatsapp').value.trim();
    if (whatsappValue.length < 11 || !whatsappValue.startsWith('01')) {
        alert('يرجى إدخال رقم واتساب صحيح يبدأ بـ 01');
        document.getElementById('userWhatsapp').focus();
        return false;
    }
    
    // التحقق من التقييم
    if (currentRating === 0) {
        alert('يرجى اختيار تقييم للتجربة');
        return false;
    }
    
    return true;
}

// تحديث دالة إرسال النموذج لتشمل التحقق
document.getElementById('testimonialForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    // التحقق من صحة البيانات
    if (!validateForm()) {
        return;
    }
    
    const submitBtn = document.querySelector('.btn-submit');
    const originalText = submitBtn.innerHTML;
    
    // تأثير التحميل
    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الإرسال...';
    submitBtn.classList.add('loading');
    submitBtn.disabled = true;
    
    // جمع البيانات مع تنسيق الاسم والوظيفة
    const name = document.getElementById('userName').value.trim();
    const job = document.getElementById('userJob').value.trim();
    const fullName = job ? `${name}$$${job}` : name;
    
    const formData = {
        name: fullName,
        whatsapp: document.getElementById('userWhatsapp').value.trim(),
        job: document.getElementById('userJob').value.trim(),
        course: document.getElementById('userCourse').value.trim(),
        date: document.getElementById('userDate').value.trim(),
        testimonial: document.getElementById('userTestimonial').value.trim(),
        rating: currentRating
    };
    
    try {
        const success = await submitTestimonial(formData);
        
        if (success) {
            // إظهار رسالة النجاح
            showSuccessMessage();
            
            // إغلاق النموذج
            closeTestimonialModal();
            
            // إعادة تحميل البيانات دون إعادة تحميل الصفحة
            setTimeout(async () => {
                await loadCourses();
                TestimonialsManager.extractTestimonials();
            }, 1500);
        } else {
            throw new Error('فشل في حفظ البيانات');
        }
        
    } catch (error) {
        console.error('خطأ في الإرسال:', error);
        
        // رسالة خطأ مفصلة
        let errorMessage = 'حدث خطأ أثناء إرسال شهادتك. ';
        
        if (error.code === 'permission-denied') {
            errorMessage += 'ليس لديك صلاحية للكتابة في قاعدة البيانات.';
        } else if (error.code === 'unavailable') {
            errorMessage += 'الخدمة غير متاحة حالياً. يرجى المحاولة لاحقاً.';
        } else {
            errorMessage += 'يرجى المحاولة مرة أخرى أو التواصل مع الدعم الفني.';
        }
        
        alert(errorMessage);
        
    } finally {
        // إعادة تعيين الزر
        submitBtn.innerHTML = originalText;
        submitBtn.classList.remove('loading');
        submitBtn.disabled = false;
    }
});

// دالة للتصدير (للمطور)
function exportTestimonials() {
    const data = {
        testimonials: TestimonialsManager.allTestimonials,
        exportDate: new Date().toISOString(),
        version: '1.0'
    };
    
    const blob = new Blob([JSON.stringify(data, null, 2)], {
        type: 'application/json'
    });
    
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'testimonials_export.json';
    a.click();
    URL.revokeObjectURL(url);
}
