    <style>
        :root {
            --gold-primary: #FFD700;
            --gold-light: #FFF3CD;
            --dark-bg: #0A1628;
            --dark-lighter: #1E3A5F;
            --danger: #ef4444;
            --success: #22c55e;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, var(--dark-lighter) 0%, var(--dark-bg) 100%);
            color: white;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Header */
        .header {
            background: rgba(10, 22, 40, 0.95);
            backdrop-filter: blur(10px);
            padding: 1.5rem 0;
            margin-bottom: 2rem;
            border-bottom: 2px solid rgba(255, 215, 0, 0.2);
        }
        
        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        h1 {
            color: var(--gold-primary);
            font-size: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 2rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 15px;
        }
        
        .tab {
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
            font-weight: 500;
        }
        
        .tab.active {
            background: linear-gradient(135deg, var(--gold-primary), #FFA500);
            color: var(--dark-bg);
        }
        
        .tab:hover:not(.active) {
            background: rgba(255, 255, 255, 0.15);
        }
        
        /* Content Areas */
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        /* Admin Section */
        .admin-controls {
            background: rgba(255, 255, 255, 0.03);
            padding: 2rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            margin-bottom: 2rem;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .form-group label {
            color: var(--gold-light);
            font-weight: 500;
        }
        
        .form-group input,
        .form-group select {
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: black;
            font-size: 1rem;
        }
        
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 1rem;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--gold-primary), #FFA500);
            color: var(--dark-bg);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.4);
        }
        
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        
        .btn-success {
            background: var(--success);
            color: white;
        }
        
        /* Session Cards */
        .sessions-grid {
            display: grid;
            gap: 1.5rem;
        }
        
        .session-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 20px;
            padding: 1.5rem;
            transition: all 0.3s;
        }
        
        .session-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.2);
        }
        
        .session-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }
        
        .session-title {
            color: var(--gold-primary);
            font-size: 1.3rem;
            font-weight: 600;
        }
        
        .session-status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        
        .status-scheduled {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }
        
        .status-live {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            animation: pulse 2s infinite;
        }
        
        .status-completed {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .session-details {
            display: flex;
            gap: 2rem;
            margin: 1rem 0;
            color: rgba(255, 255, 255, 0.8);
        }
        
        .session-detail {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .session-detail i {
            color: var(--gold-light);
        }
        
        /* User Section */
        .active-session {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.1), rgba(16, 185, 129, 0.05));
            border: 2px solid var(--success);
            padding: 2rem;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .countdown {
            font-size: 3rem;
            color: var(--gold-primary);
            font-weight: bold;
            margin: 1rem 0;
            font-family: 'Courier New', monospace;
        }
        
        .interaction-buttons {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 2rem 0;
            flex-wrap: wrap;
        }
        
        .interaction-btn {
            padding: 15px 25px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.5rem;
        }
        
        .interaction-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }
        
        .interaction-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .points-earned {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.1), rgba(245, 158, 11, 0.05));
            padding: 1rem;
            border-radius: 15px;
            display: inline-block;
            margin: 1rem 0;
        }
        
        .points-earned span {
            color: var(--gold-primary);
            font-size: 2rem;
            font-weight: bold;
        }

    
    /* تأثير نبض للتحديثات */
@keyframes updatePulse {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.05); opacity: 0.8; }
    100% { transform: scale(1); opacity: 1; }
}

.updating {
    animation: updatePulse 0.5s ease-out;
}

/* تحسين مظهر البانر */
#liveSessionSection {
    transition: all 0.5s ease;
}
    
    </style>
</head>

async function checkLiveSessions() {
    try {
        const now = new Date();
        const sessionsSnapshot = await db.collection('liveSessions')
            .where('status', 'in', ['scheduled', 'active'])
            .get();
        
        if (!sessionsSnapshot.empty) {

        }

        // Switch tabs
        function switchTab(tab) {
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            // Update content
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            if (tab === 'admin') {
                if (!isAdmin) {
                    Swal.fire('غير مصرح', 'هذه الصفحة للإدارة فقط', 'warning');
                    return;
                }
                document.getElementById('adminContent').classList.add('active');
            } else {
                document.getElementById('userContent').classList.add('active');
            }
        }
        
        // Load courses for dropdown
        async function loadCourses() {
            try {
                const snapshot = await db.collection('courses').get();
                const select = document.getElementById('courseSelect');
                
                snapshot.forEach(doc => {
                    const course = doc.data();
                    const option = document.createElement('option');
                    option.value = doc.id;
                    option.textContent = course.title;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading courses:', error);
            }
        }
        
        // Create new session
        async function createSession() {
            const sessionData = {
                title: document.getElementById('sessionTitle').value,
                date: document.getElementById('sessionDate').value,
                time: document.getElementById('sessionTime').value,
                duration: parseInt(document.getElementById('sessionDuration').value),
                zoomLink: document.getElementById('zoomLink').value,
                courseId: document.getElementById('courseSelect').value,
                status: 'scheduled',
                points: {
                    attendance: parseInt(document.getElementById('attendancePoints').value),
                    earlyBird: parseInt(document.getElementById('earlyBirdPoints').value),
                    fullSession: parseInt(document.getElementById('fullSessionPoints').value),
                    interaction: parseInt(document.getElementById('interactionPoints').value)
                },
                createdAt: new Date().toISOString(),
                createdBy: userId
            };
            
            if (!sessionData.title || !sessionData.date || !sessionData.courseId) {
                Swal.fire('خطأ', 'يرجى ملء جميع الحقول المطلوبة', 'error');
                return;
            }
            
            try {
                await db.collection('liveSessions').add(sessionData);
                Swal.fire('تم!', 'تم إنشاء الجلسة بنجاح', 'success');
                
                // Clear form
                document.getElementById('sessionTitle').value = '';
                document.getElementById('sessionDate').value = '';
                document.getElementById('zoomLink').value = '';
                
                loadSessions();

// Send interaction
async function sendInteraction(emoji, points, sessionId) {
    if (!userId) return;
    
    try {
        // Disable button temporarily
        event.target.disabled = true;
        event.target.classList.add('clicked');
        
        // Record interaction
        await db.collection('liveSessions').doc(sessionId)
            .collection('interactions').add({
                userId: userId,
                emoji: emoji,
                points: points,
                timestamp: new Date().toISOString()
            });
        
        // Update user points
        await db.collection('users').doc(userId).update({
            'journeyPoints.balance': firebase.firestore.FieldValue.increment(points),
            'walletPoints.balance': firebase.firestore.FieldValue.increment(points)
        });
        
        // Update session points display
        const sessionPointsEl = document.getElementById('sessionPoints');
        const currentPoints = parseInt(sessionPointsEl.textContent) || 0;
        sessionPointsEl.textContent = currentPoints + points;
        
        // Show points animation
        showPointsAnimation(points);
        
        // Re-enable button after 5 seconds
        setTimeout(() => {
            event.target.disabled = false;
            event.target.classList.remove('clicked');
        }, 5000);
        
    } catch (error) {
        console.error('Error sending interaction:', error);
    }
}

    const el = document.createElement('div');
    el.style.cssText = `
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        font-size: 3rem;
        font-weight: bold;
        color: #fbbf24;
        z-index: 9999;
        pointer-events: none;
        animation: flyUp 2s ease-out forwards;
    `;
    el.textContent = `+${points}`;
    
    const style = document.createElement('style');
    style.textContent = `
        @keyframes flyUp {
            0% {

    document.body.appendChild(el);
    
    setTimeout(() => el.remove(), 2000);
}

// Start session timer
function startSessionTimer(startTime) {
    if (!startTime) return;
    
    const timerEl = document.getElementById('sessionTimer');
    
    setInterval(() => {
        const start = new Date(startTime);
        const now = new Date();
        const diff = now - start;
        
        const hours = Math.floor(diff / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);
        
        timerEl.textContent = 
            `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }, 1000);
}

async function recordAttendance(sessionId) {

        return;
    }
    
    try {
        // جلب بيانات الجلسة

            .collection('attendees').get();
        
        if (attendeesSnapshot.size < 10) {
            totalPoints += sessionData.points?.earlyBird || 20;
        }

            .collection('attendees').doc(userId).set({

            userName: currentUser?.personalInfo?.name || 'مستخدم',
            joinedAt: new Date().toISOString(),
            pointsEarned: totalPoints,
            sessionId: sessionId,
            courseId: sessionData.courseId
        });
        
        // تحديث نقاط المستخدم
        const userRef = db.collection('users').doc(userId);
        await userRef.update({
            'journeyPoints.balance': firebase.firestore.FieldValue.increment(totalPoints),

            'walletPoints.history': firebase.firestore.FieldValue.arrayUnion(pointsHistory)

        // فحص الشارات - هنا المشكلة كانت

                    '<p style="color: #a855f7;">🏃 مكافأة المبكرين!</p>' : ''}
        `;

        async function checkAndAwardAttendanceBadges(sessionId, sessionData) {
    if (!userId) return [];
    
    try {
        // جلب بيانات المستخدم
        const userDoc = await db.collection('users').doc(userId).get();
        const userData = userDoc.data();
        const currentBadges = userData.badges || [];
        
        // جلب سجل الحضور الكامل للمستخدم
        const attendanceHistory = [];
        const sessionsSnapshot = await db.collection('liveSessions')
            .where('courseId', '==', sessionData.courseId)
            .get();
        
        for (let doc of sessionsSnapshot.docs) {
            const attendeeDoc = await doc.ref.collection('attendees').doc(userId).get();
            if (attendeeDoc.exists) {
                attendanceHistory.push({
                    sessionId: doc.id,
                    data: attendeeDoc.data()
                });
            }
        }
        
        const attendanceCount = attendanceHistory.length;
        
        // جلب الشارات النشطة
        const badgesSnapshot = await db.collection('badges')
            .where('type', '==', 'live_attendance')
            .where('isActive', '==', true)
            .get();
        
        const newBadges = [];
        let totalBadgePoints = 0;
        
        for (let doc of badgesSnapshot.docs) {
            const badge = { id: doc.id, ...doc.data() };
            
            // تخطي إذا كان المستخدم يملك الشارة
            if (currentBadges.some(b => b.id === badge.id)) continue;
            
            let shouldAward = false;
            let reason = '';
            
            // فحص الشروط
            if (badge.subType === 'attendance_any' && attendanceCount >= 1) {
                shouldAward = true;
                reason = 'حضور جلسة مباشرة';
            } else if (badge.subType === 'attendance_first' && attendanceCount === 1) {
                shouldAward = true;
                reason = 'أول حضور في المنصة';
            } else if (badge.subType === 'attendance_count' && 
                      attendanceCount >= (badge.conditions?.sessionCount || 5)) {
                shouldAward = true;
                reason = `حضور ${badge.conditions.sessionCount} جلسات`;
            } else if (badge.subType === 'early_bird') {
                // فحص الترتيب
                const attendeesSnapshot = await db.collection('liveSessions').doc(sessionId)
                    .collection('attendees').orderBy('joinedAt').get();
                
                let userOrder = 0;
                let index = 1;
                attendeesSnapshot.forEach(doc => {
                    if (doc.id === userId) userOrder = index;
                    index++;
                });
                
                if (userOrder > 0 && userOrder <= (badge.conditions?.earlyBird || 10)) {
                    shouldAward = true;
                    reason = `من أوائل ${badge.conditions.earlyBird} حاضرين`;
                }
            }
            
            if (shouldAward) {
                const badgePoints = badge.points || 0;
                totalBadgePoints += badgePoints;
                
                newBadges.push({
                    id: badge.id,
                    name: badge.name,
                    icon: badge.icon,
                    awardedDate: new Date().toISOString(),
                    type: 'live_attendance',
                    reason: reason,
                    points: badgePoints
                });
                
                // تحديث عداد المنح
                await db.collection('badges').doc(doc.id).update({
                    timesAwarded: firebase.firestore.FieldValue.increment(1)
                });
            }
        }
        
        if (newBadges.length > 0) {
            // إضافة الشارات للمستخدم
            await db.collection('users').doc(userId).update({
                badges: firebase.firestore.FieldValue.arrayUnion(...newBadges)
            });
            
            // إضافة النقاط الإضافية من الشارات
            if (totalBadgePoints > 0) {
                await db.collection('users').doc(userId).update({
                    'journeyPoints.balance': firebase.firestore.FieldValue.increment(totalBadgePoints),
                    'walletPoints.balance': firebase.firestore.FieldValue.increment(totalBadgePoints)
                });
                
                // إضافة للسجل
                const badgePointsHistory = {
                    amount: totalBadgePoints,
                    timestamp: new Date().toISOString(),
                    type: 'badge_reward',
                    reason: `نقاط الشارات الجديدة`,
                    description: `حصلت على ${totalBadgePoints} نقطة من ${newBadges.length} شارة جديدة`
                };
                
                await db.collection('users').doc(userId).update({
                    'journeyPoints.history': firebase.firestore.FieldValue.arrayUnion(badgePointsHistory),
                    'walletPoints.history': firebase.firestore.FieldValue.arrayUnion(badgePointsHistory)

// Check attendance badges
async function checkAttendanceBadges(sessionData) {
    if (!userId) return;
    
    try {
        const userDoc = await db.collection('users').doc(userId).get();
        const userData = userDoc.data();
        
        // جلب سجل الحضور الكامل
        const attendanceHistory = await db.collection('liveSessions')
            .where('courseId', '==', sessionData.courseId)
            .get();
        
        let userAttendance = [];
        for (let doc of attendanceHistory.docs) {
            const attendeeDoc = await doc.ref.collection('attendees').doc(userId).get();
            if (attendeeDoc.exists) {
                userAttendance.push({
                    sessionId: doc.id,
                    ...attendeeDoc.data()
                });
            }
        }
        
        const attendanceCount = userAttendance.length;
        
        // جلب الشارات
        const badgesSnapshot = await db.collection('badges')
            .where('type', '==', 'live_attendance')
            .where('isActive', '==', true)
            .get();
        
        const newBadges = [];
        const currentBadges = userData.badges || [];
        let totalBadgePoints = 0;
        
        for (let doc of badgesSnapshot.docs) {
            const badge = { id: doc.id, ...doc.data() };
            
            // تخطي إذا كانت الشارة موجودة
            if (currentBadges.some(b => b.id === badge.id)) continue;
            
            let shouldAward = false;
            let reason = '';
            
            // فحص الشروط حسب النوع الفرعي
            switch(badge.subType) {
                case 'attendance_any':
                    if (attendanceCount >= 1) {
                        shouldAward = true;
                        reason = 'حضور جلسة مباشرة';
                    }
                    break;
                    
                case 'attendance_first':
                    if (attendanceCount === 1) {
                        shouldAward = true;
                        reason = 'أول حضور في المنصة';
                    }
                    break;
                    
                case 'attendance_count':
                    if (attendanceCount >= (badge.conditions.sessionCount || 5)) {
                        shouldAward = true;
                        reason = `حضور ${badge.conditions.sessionCount} جلسات`;
                    }
                    break;
                    
                case 'early_bird':
                    // فحص ترتيب الحضور في آخر جلسة
                    const currentSession = await db.collection('liveSessions').doc(sessionData.id)
                        .collection('attendees').orderBy('joinedAt').get();
                    
                    let userOrder = 0;
                    currentSession.forEach((doc, index) => {
                        if (doc.id === userId) userOrder = index + 1;
                    });
                    
                    if (userOrder > 0 && userOrder <= (badge.conditions.earlyBird || 10)) {
                        shouldAward = true;
                        reason = `من أوائل ${badge.conditions.earlyBird} حاضرين`;
                    }
                    break;
            }
            
            if (shouldAward) {
                const badgePoints = badge.points || 0;
                totalBadgePoints += badgePoints;
                
                newBadges.push({
                    id: badge.id,
                    name: badge.name,
                    icon: badge.icon,
                    awardedDate: new Date().toISOString(),
                    type: 'live_attendance',
                    reason: reason,
                    points: badgePoints
                });
                
                // تحديث عداد المنح
                await db.collection('badges').doc(doc.id).update({
                    timesAwarded: firebase.firestore.FieldValue.increment(1)
                });
            }
        }
        
        if (newBadges.length > 0) {
            // منح الشارات والنقاط
            await db.collection('users').doc(userId).update({
                badges: [...currentBadges, ...newBadges],
                'journeyPoints.balance': firebase.firestore.FieldValue.increment(totalBadgePoints),
                'walletPoints.balance': firebase.firestore.FieldValue.increment(totalBadgePoints)
            });
            
            showBadgeNotification(newBadges);
        }
        
    } catch (error) {
        console.error('خطأ في فحص الشارات:', error);
    }
}

async function createAttendanceBadge() {
    const type = document.getElementById('badgeType').value;
    const name = document.getElementById('badgeName').value;
    const icon = document.getElementById('badgeIcon').value;
    const points = parseInt(document.getElementById('badgePoints').value) || 0;
    const description = document.getElementById('badgeDescription').value;
    
    if (!type || !name) {
        Swal.fire('خطأ', 'يرجى اختيار النوع وإدخال اسم الشارة', 'error');
        return;
    }
    
    try {
        const badgeData = {
            name: name,
            icon: icon,
            type: 'live_attendance',
            subType: type,
            points: points,
            description: description,
            conditions: {},
            createdDate: new Date().toISOString(),
            isActive: true,
            timesAwarded: 0
        };
        
        // إضافة الشروط حسب النوع
        switch(type) {
            case 'attendance_any':
                badgeData.conditions.anyAttendance = true;
                break;
            case 'attendance_first':
                badgeData.conditions.firstAttendance = true;
                break;
            case 'attendance_count':
                badgeData.conditions.sessionCount = parseInt(document.getElementById('sessionCount')?.value) || 5;
                break;
            case 'attendance_consecutive':
                badgeData.conditions.consecutive = parseInt(document.getElementById('consecutiveCount')?.value) || 3;
                break;
            case 'attendance_perfect':
                badgeData.conditions.attendancePercentage = parseInt(document.getElementById('attendancePercentage')?.value) || 100;
                break;
            case 'early_bird':
                badgeData.conditions.earlyBird = parseInt(document.getElementById('earlyBirdCount')?.value) || 10;
                break;
            case 'full_duration':
                badgeData.conditions.durationPercentage = parseInt(document.getElementById('durationPercentage')?.value) || 90;
                break;
            case 'interaction_count':
                badgeData.conditions.interactionCount = parseInt(document.getElementById('interactionCount')?.value) || 10;
                break;
            case 'question_master':
                badgeData.conditions.questionCount = parseInt(document.getElementById('questionCount')?.value) || 5;
                break;
            case 'mission_complete':
                badgeData.conditions.missionName = document.getElementById('missionName')?.value || '';
                break;
            case 'custom':
                badgeData.conditions.customConditions = document.getElementById('customConditions')?.value || '';
                break;
        }
        
        await db.collection('badges').add(badgeData);
        
        Swal.fire({
            icon: 'success',
            title: 'تم إنشاء الشارة!',
            html: `
                <div style="text-align: center;">
                    <div style="font-size: 3rem; margin: 20px 0;">${icon}</div>
                    <h3>${name}</h3>
                    ${points > 0 ? `<p style="color: #fbbf24;">+${points} نقطة</p>` : ''}
                    ${description ? `<p style="color: #999; font-size: 0.9rem;">${description}</p>` : ''}
                </div>
            `,
            showConfirmButton: true
        });
        
        // مسح الحقول
        document.getElementById('badgeType').value = '';
        document.getElementById('badgeName').value = '';
        document.getElementById('badgeDescription').value = '';
        document.getElementById('badgePoints').value = '50';
        document.getElementById('dynamicFields').innerHTML = '';
        
        // تحديث القائمة
        loadBadgesList();
        
    } catch (error) {
        console.error('خطأ في إنشاء الشارة:', error);
        Swal.fire('خطأ', 'فشل إنشاء الشارة', 'error');
    }
}

function applyTemplate(type, name, icon, points, count) {
    document.getElementById('badgeType').value = type;
    document.getElementById('badgeName').value = name;
    document.getElementById('badgeIcon').value = icon;
    document.getElementById('badgePoints').value = points;
    updateBadgeFields();

            document.getElementById('sessionCount').value = count;

                    <option value="🥉">🥉 برونزية</option>
                    <option value="🔥">🔥 نار</option>
                    <option value="⚡">⚡ برق</option>
                    <option value="🎯">🎯 هدف</option>
                </select>
                <input id="edit-points" class="swal2-input" type="number" value="${badge.points || 0}" placeholder="النقاط">
            `,
            focusConfirm: false,
            preConfirm: () => {
                return {
                    name: document.getElementById('edit-name').value,
                    icon: document.getElementById('edit-icon').value,
                    points: parseInt(document.getElementById('edit-points').value) || 0
                }
            }
        });
        
        if (formValues) {
            await db.collection('badges').doc(badgeId).update({
                name: formValues.name,
                icon: formValues.icon,
                points: formValues.points,
                lastModified: new Date().toISOString()
            });
            
            Swal.fire('تم!', 'تم تحديث الشارة', 'success');
            viewAttendanceBadges();
        }
    } catch (error) {
        console.error('خطأ في التعديل:', error);
    }
}

// تحديث قائمة الشارات
async function loadAttendanceBadgesList() {
    viewAttendanceBadges();
}

        // جلب شارات الحضور
async function loadAttendanceBadges() {
    try {
        const snapshot = await db.collection('badges')
            .where('type', '==', 'live_attendance')
            .get();
        
        console.log(`تم العثور على ${snapshot.size} شارة حضور`);
        return snapshot.size;
    } catch (error) {
        console.error('خطأ في جلب الشارات:', error);
        return 0;
    }
}
