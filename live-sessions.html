<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الجلسات المباشرة - منظور الفؤاد</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    
    <!-- External CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root {
            --gold-primary: #FFD700;
            --gold-light: #FFF3CD;
            --dark-bg: #0A1628;
            --dark-lighter: #1E3A5F;
            --danger: #ef4444;
            --success: #22c55e;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, var(--dark-lighter) 0%, var(--dark-bg) 100%);
            color: white;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Header */
        .header {
            background: rgba(10, 22, 40, 0.95);
            backdrop-filter: blur(10px);
            padding: 1.5rem 0;
            margin-bottom: 2rem;
            border-bottom: 2px solid rgba(255, 215, 0, 0.2);
        }
        
        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        h1 {
            color: var(--gold-primary);
            font-size: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 2rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 15px;
        }
        
        .tab {
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
            font-weight: 500;
        }
        
        .tab.active {
            background: linear-gradient(135deg, var(--gold-primary), #FFA500);
            color: var(--dark-bg);
        }
        
        .tab:hover:not(.active) {
            background: rgba(255, 255, 255, 0.15);
        }
        
        /* Content Areas */
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        /* Admin Section */
        .admin-controls {
            background: rgba(255, 255, 255, 0.03);
            padding: 2rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            margin-bottom: 2rem;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .form-group label {
            color: var(--gold-light);
            font-weight: 500;
        }
        
        .form-group input,
        .form-group select {
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
        }
        
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 1rem;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--gold-primary), #FFA500);
            color: var(--dark-bg);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.4);
        }
        
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        
        .btn-success {
            background: var(--success);
            color: white;
        }
        
        /* Session Cards */
        .sessions-grid {
            display: grid;
            gap: 1.5rem;
        }
        
        .session-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 20px;
            padding: 1.5rem;
            transition: all 0.3s;
        }
        
        .session-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.2);
        }
        
        .session-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }
        
        .session-title {
            color: var(--gold-primary);
            font-size: 1.3rem;
            font-weight: 600;
        }
        
        .session-status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        
        .status-scheduled {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }
        
        .status-live {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            animation: pulse 2s infinite;
        }
        
        .status-completed {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .session-details {
            display: flex;
            gap: 2rem;
            margin: 1rem 0;
            color: rgba(255, 255, 255, 0.8);
        }
        
        .session-detail {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .session-detail i {
            color: var(--gold-light);
        }
        
        /* User Section */
        .active-session {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.1), rgba(16, 185, 129, 0.05));
            border: 2px solid var(--success);
            padding: 2rem;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .countdown {
            font-size: 3rem;
            color: var(--gold-primary);
            font-weight: bold;
            margin: 1rem 0;
            font-family: 'Courier New', monospace;
        }
        
        .interaction-buttons {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 2rem 0;
            flex-wrap: wrap;
        }
        
        .interaction-btn {
            padding: 15px 25px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.5rem;
        }
        
        .interaction-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }
        
        .interaction-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .points-earned {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.1), rgba(245, 158, 11, 0.05));
            padding: 1rem;
            border-radius: 15px;
            display: inline-block;
            margin: 1rem 0;
        }
        
        .points-earned span {
            color: var(--gold-primary);
            font-size: 2rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-content">
            <h1>
                <span>🔴</span>
                الجلسات المباشرة
            </h1>
            <a href="./course-view.html" class="btn" style="background: rgba(255, 255, 255, 0.1); color: var(--gold-light);">
                <i class="fas fa-arrow-right"></i>
                العودة للدورة
            </a>
        </div>
    </div>
    
    <div class="container">
        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab('user')">
                <i class="fas fa-user"></i> منطقة المستخدم
            </button>
            <button class="tab" onclick="switchTab('admin')">
                <i class="fas fa-cog"></i> إدارة الجلسات
            </button>
        </div>
        
        <!-- User Content -->
        <div id="userContent" class="tab-content active">
            <!-- Active Session (if any) -->
            <div id="activeSessionArea"></div>
            
            <!-- Upcoming Sessions -->
            <h2 style="color: var(--gold-light); margin-bottom: 1rem;">
                <i class="fas fa-calendar"></i> الجلسات القادمة
            </h2>
            <div id="upcomingSessions" class="sessions-grid">
                <!-- سيتم ملؤها بواسطة JavaScript -->
            </div>
            
            <!-- Past Sessions -->
            <h2 style="color: var(--gold-light); margin: 2rem 0 1rem;">
                <i class="fas fa-history"></i> الجلسات السابقة
            </h2>
            <div id="pastSessions" class="sessions-grid">
                <!-- سيتم ملؤها بواسطة JavaScript -->
            </div>
        </div>
        
        <!-- Admin Content -->
        <div id="adminContent" class="tab-content">
            <!-- Create Session Form -->
            <div class="admin-controls">
                <h2 style="color: var(--gold-primary); margin-bottom: 1.5rem;">
                    <i class="fas fa-plus-circle"></i> إنشاء جلسة جديدة
                </h2>
                
                <div class="form-grid">
                    <div class="form-group">
                        <label>عنوان الجلسة</label>
                        <input type="text" id="sessionTitle" placeholder="مثال: اللقاء الأسبوعي الأول">
                    </div>
                    
                    <div class="form-group">
                        <label>التاريخ</label>
                        <input type="date" id="sessionDate">
                    </div>
                    
                    <div class="form-group">
                        <label>الوقت</label>
                        <input type="time" id="sessionTime" value="20:00">
                    </div>
                    
                    <div class="form-group">
                        <label>المدة (بالدقائق)</label>
                        <input type="number" id="sessionDuration" value="90" min="30">
                    </div>
                    
                    <div class="form-group">
                        <label>رابط الزوم</label>
                        <input type="url" id="zoomLink" placeholder="https://zoom.us/...">
                    </div>
                    
                    <div class="form-group">
                        <label>اختر الدورة</label>
                        <select id="courseSelect">
                            <option value="">-- اختر الدورة --</option>
                        </select>
                    </div>
                </div>
                
                <h3 style="color: var(--gold-light); margin: 1.5rem 0 1rem;">
                    <i class="fas fa-trophy"></i> نظام النقاط
                </h3>
                
                <div class="form-grid">
                    <div class="form-group">
                        <label>نقاط الحضور</label>
                        <input type="number" id="attendancePoints" value="50" min="0">
                    </div>
                    
                    <div class="form-group">
                        <label>مكافأة المبكرين (أول 10)</label>
                        <input type="number" id="earlyBirdPoints" value="20" min="0">
                    </div>
                    
                    <div class="form-group">
                        <label>البقاء الكامل</label>
                        <input type="number" id="fullSessionPoints" value="30" min="0">
                    </div>
                    
                    <div class="form-group">
                        <label>نقاط التفاعل</label>
                        <input type="number" id="interactionPoints" value="10" min="0">
                    </div>
                </div>
                
                <button class="btn btn-primary" onclick="createSession()">
                    <i class="fas fa-plus"></i> إنشاء الجلسة
                </button>
            </div>
            
            <!-- Sessions List -->
            <h2 style="color: var(--gold-light); margin: 2rem 0 1rem;">
                <i class="fas fa-list"></i> جميع الجلسات
            </h2>
            <div id="allSessions" class="sessions-grid">
                <!-- سيتم ملؤها بواسطة JavaScript -->
            </div>
        </div>
    </div>
    
    <script>
        // Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyDj0bV5gsyRbqpxzW0Zd9wjYmq53-Xdj3w",
            authDomain: "fouad-perspective.firebaseapp.com",
            projectId: "fouad-perspective",
            storageBucket: "fouad-perspective.firebasestorage.app",
            messagingSenderId: "1068763865336",
            appId: "1:1068763865336:web:b791abcd22d536aedd5b0d"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        let currentUser = null;
        let userId = null;
        let isAdmin = false;
        
        // Initialize
        window.addEventListener('DOMContentLoaded', async function() {
            userId = localStorage.getItem('userId');
            
            // Check if admin (simple check - you can enhance this)
            if (userId) {
                const userDoc = await db.collection('users').doc(userId).get();
                if (userDoc.exists) {
                    currentUser = userDoc.data();
                    // Simple admin check - enhance as needed
                    isAdmin = currentUser.email?.includes('admin') || 
                             currentUser.role === 'admin' ||
                             userId === 'admin-id'; // Replace with actual admin ID
                }
            }
            
            loadCourses();
            loadSessions();
            
            // Check for active session every 30 seconds
            setInterval(checkActiveSession, 30000);
            checkActiveSession();
        });
        
        // Switch tabs
        function switchTab(tab) {
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            // Update content
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            if (tab === 'admin') {
                if (!isAdmin) {
                    Swal.fire('غير مصرح', 'هذه الصفحة للإدارة فقط', 'warning');
                    return;
                }
                document.getElementById('adminContent').classList.add('active');
            } else {
                document.getElementById('userContent').classList.add('active');
            }
        }
        
        // Load courses for dropdown
        async function loadCourses() {
            try {
                const snapshot = await db.collection('courses').get();
                const select = document.getElementById('courseSelect');
                
                snapshot.forEach(doc => {
                    const course = doc.data();
                    const option = document.createElement('option');
                    option.value = doc.id;
                    option.textContent = course.title;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading courses:', error);
            }
        }
        
        // Create new session
        async function createSession() {
            const sessionData = {
                title: document.getElementById('sessionTitle').value,
                date: document.getElementById('sessionDate').value,
                time: document.getElementById('sessionTime').value,
                duration: parseInt(document.getElementById('sessionDuration').value),
                zoomLink: document.getElementById('zoomLink').value,
                courseId: document.getElementById('courseSelect').value,
                status: 'scheduled',
                points: {
                    attendance: parseInt(document.getElementById('attendancePoints').value),
                    earlyBird: parseInt(document.getElementById('earlyBirdPoints').value),
                    fullSession: parseInt(document.getElementById('fullSessionPoints').value),
                    interaction: parseInt(document.getElementById('interactionPoints').value)
                },
                createdAt: new Date().toISOString(),
                createdBy: userId
            };
            
            if (!sessionData.title || !sessionData.date || !sessionData.courseId) {
                Swal.fire('خطأ', 'يرجى ملء جميع الحقول المطلوبة', 'error');
                return;
            }
            
            try {
                await db.collection('liveSessions').add(sessionData);
                Swal.fire('تم!', 'تم إنشاء الجلسة بنجاح', 'success');
                
                // Clear form
                document.getElementById('sessionTitle').value = '';
                document.getElementById('sessionDate').value = '';
                document.getElementById('zoomLink').value = '';
                
                loadSessions();
            } catch (error) {
                console.error('Error creating session:', error);
                Swal.fire('خطأ', 'فشل إنشاء الجلسة', 'error');
            }
        }
        
        // Load all sessions
        async function loadSessions() {
            try {
                const snapshot = await db.collection('liveSessions')
                    .orderBy('date', 'desc')
                    .get();
                
                const now = new Date();
                const upcomingSessions = [];
                const pastSessions = [];
                const allSessions = [];
                
                snapshot.forEach(doc => {
                    const session = { id: doc.id, ...doc.data() };
                    const sessionDate = new Date(`${session.date}T${session.time}`);
                    
                    allSessions.push(session);
                    
                    if (sessionDate > now) {
                        upcomingSessions.push(session);
                    } else {
                        pastSessions.push(session);
                    }
                });
                
                // Display upcoming sessions
                displaySessions('upcomingSessions', upcomingSessions, 'upcoming');
                
                // Display past sessions
                displaySessions('pastSessions', pastSessions, 'past');
                
                // Display all sessions for admin
                if (isAdmin) {
                    displaySessions('allSessions', allSessions, 'admin');
                }
                
            } catch (error) {
                console.error('Error loading sessions:', error);
            }
        }
        
        // Display sessions in container
        function displaySessions(containerId, sessions, type) {
            const container = document.getElementById(containerId);
            if (!container) return;
            
            if (sessions.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 2rem; color: rgba(255, 255, 255, 0.5);">
                        <i class="fas fa-calendar-times" style="font-size: 3rem; margin-bottom: 1rem;"></i>
                        <p>لا توجد جلسات</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = sessions.map(session => {
                const sessionDate = new Date(`${session.date}T${session.time}`);
                const statusClass = session.status === 'live' ? 'status-live' : 
                                   session.status === 'completed' ? 'status-completed' : 
                                   'status-scheduled';
                const statusText = session.status === 'live' ? 'مباشر الآن' : 
                                  session.status === 'completed' ? 'انتهت' : 
                                  'مجدولة';
                
                return `
                    <div class="session-card">
                        <div class="session-header">
                            <h3 class="session-title">${session.title}</h3>
                            <span class="session-status ${statusClass}">${statusText}</span>
                        </div>
                        
                        <div class="session-details">
                            <div class="session-detail">
                                <i class="fas fa-calendar"></i>
                                ${sessionDate.toLocaleDateString('ar-SA')}
                            </div>
                            <div class="session-detail">
                                <i class="fas fa-clock"></i>
                                ${session.time}
                            </div>
                            <div class="session-detail">
                                <i class="fas fa-hourglass-half"></i>
                                ${session.duration} دقيقة
                            </div>
                        </div>
                        
                        ${type === 'upcoming' ? `
                            <button class="btn btn-primary" style="margin-top: 1rem;" 
                                    onclick="joinSession('${session.id}')">
                                <i class="fas fa-video"></i> الانضمام
                            </button>
                        ` : ''}
                        
                        ${type === 'admin' ? `
                            <div style="margin-top: 1rem; display: flex; gap: 0.5rem;">
                                <button class="btn btn-success" onclick="startSession('${session.id}')">
                                    <i class="fas fa-play"></i> بدء
                                </button>
                                <button class="btn btn-danger" onclick="deleteSession('${session.id}')">
                                    <i class="fas fa-trash"></i> حذف
                                </button>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }
        
        // Check for active session
        async function checkActiveSession() {
            // Implementation for checking active sessions
            console.log('Checking for active sessions...');
        }
        
        // Join session
        async function joinSession(sessionId) {
            try {
                const sessionDoc = await db.collection('liveSessions').doc(sessionId).get();
                const session = sessionDoc.data();
                
                if (session.zoomLink) {
                    window.open(session.zoomLink, '_blank');
                    
                    // Record attendance
                    await recordAttendance(sessionId);
                } else {
                    Swal.fire('تنبيه', 'رابط الجلسة غير متوفر بعد', 'info');
                }
            } catch (error) {
                console.error('Error joining session:', error);
            }
        }
        
        // Record attendance
        async function recordAttendance(sessionId) {
            if (!userId) return;
            
            try {
                await db.collection('liveSessions').doc(sessionId)
                    .collection('attendees').doc(userId).set({
                        userId: userId,
                        joinedAt: new Date().toISOString(),
                        userName: currentUser?.personalInfo?.name || 'مستخدم'
                    });
                
                Swal.fire('تم!', 'تم تسجيل حضورك', 'success');
            } catch (error) {
                console.error('Error recording attendance:', error);
            }
        }
        
        // Admin functions
        async function startSession(sessionId) {
            try {
                await db.collection('liveSessions').doc(sessionId).update({
                    status: 'live',
                    startedAt: new Date().toISOString()
                });
                
                Swal.fire('تم!', 'تم بدء الجلسة', 'success');
                loadSessions();
            } catch (error) {
                console.error('Error starting session:', error);
            }
        }
        
        async function deleteSession(sessionId) {
            const result = await Swal.fire({
                title: 'تأكيد الحذف',
                text: 'هل أنت متأكد من حذف هذه الجلسة؟',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'نعم، احذف',
                cancelButtonText: 'إلغاء',
                confirmButtonColor: '#dc2626'
            });
            
            if (result.isConfirmed) {
                try {
                    await db.collection('liveSessions').doc(sessionId).delete();
                    Swal.fire('تم!', 'تم حذف الجلسة', 'success');
                    loadSessions();
                } catch (error) {
                    console.error('Error deleting session:', error);
                }
            }
        }
        
        console.log('Live Sessions page initialized');
    </script>
</body>
</html>
