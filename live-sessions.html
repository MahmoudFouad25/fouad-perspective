<head>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --gold-primary: #FFD700;
            --gold-light: #FFF3CD;
            --dark-bg: #0A1628;
            --dark-lighter: #1E3A5F;
            --danger: #ef4444;
            --success: #22c55e;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, var(--dark-lighter) 0%, var(--dark-bg) 100%);
            color: white;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Header */
        .header {
            background: rgba(10, 22, 40, 0.95);
            backdrop-filter: blur(10px);
            padding: 1.5rem 0;
            margin-bottom: 2rem;
            border-bottom: 2px solid rgba(255, 215, 0, 0.2);
        }
        
        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        h1 {
            color: var(--gold-primary);
            font-size: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 2rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 15px;
        }
        
        .tab {
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
            font-weight: 500;
        }
        
        .tab.active {
            background: linear-gradient(135deg, var(--gold-primary), #FFA500);
            color: var(--dark-bg);
        }
        
        .tab:hover:not(.active) {
            background: rgba(255, 255, 255, 0.15);
        }
        
        /* Content Areas */
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        /* Admin Section */
        .admin-controls {
            background: rgba(255, 255, 255, 0.03);
            padding: 2rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            margin-bottom: 2rem;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .form-group label {
            color: var(--gold-light);
            font-weight: 500;
        }
        
        .form-group input,
        .form-group select {
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
        }
        
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 1rem;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--gold-primary), #FFA500);
            color: var(--dark-bg);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.4);
        }
        
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        
        .btn-success {
            background: var(--success);
            color: white;
        }
        
        /* Session Cards */
        .sessions-grid {
            display: grid;
            gap: 1.5rem;
        }
        
        .session-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 20px;
            padding: 1.5rem;
            transition: all 0.3s;
        }
        
        .session-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.2);
        }
        
        .session-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }
        
        .session-title {
            color: var(--gold-primary);
            font-size: 1.3rem;
            font-weight: 600;
        }
        
        .session-status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        
        .status-scheduled {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }
        
        .status-live {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            animation: pulse 2s infinite;
        }
        
        .status-completed {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .session-details {
            display: flex;
            gap: 2rem;
            margin: 1rem 0;
            color: rgba(255, 255, 255, 0.8);
        }
        
        .session-detail {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .session-detail i {
            color: var(--gold-light);
        }
        
        /* User Section */
        .active-session {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.1), rgba(16, 185, 129, 0.05));
            border: 2px solid var(--success);
            padding: 2rem;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .countdown {
            font-size: 3rem;
            color: var(--gold-primary);
            font-weight: bold;
            margin: 1rem 0;
            font-family: 'Courier New', monospace;
        }
        
        .interaction-buttons {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 2rem 0;
            flex-wrap: wrap;
        }
        
        .interaction-btn {
            padding: 15px 25px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.5rem;
        }
        
        .interaction-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }
        
        .interaction-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .points-earned {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.1), rgba(245, 158, 11, 0.05));
            padding: 1rem;
            border-radius: 15px;
            display: inline-block;
            margin: 1rem 0;
        }
        
        .points-earned span {
            color: var(--gold-primary);
            font-size: 2rem;
            font-weight: bold;
        }
    </style>
</head>

    <script>
        // Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyDj0bV5gsyRbqpxzW0Zd9wjYmq53-Xdj3w",

        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        let currentUser = null;
        let userId = null;
        let isAdmin = false;
        
        // Initialize
        window.addEventListener('DOMContentLoaded', async function() {
            userId = localStorage.getItem('userId');
            
            // Check if admin (simple check - you can enhance this)
            if (userId) {

        console.log('✅ تم تفعيل وضع الإدارة مؤقتاً');

}

setInterval(checkLiveSessions, 30000);
// فحص أولي عند التحميل
checkLiveSessions();

        // Switch tabs
        function switchTab(tab) {
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            // Update content
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            if (tab === 'admin') {
                if (!isAdmin) {
                    Swal.fire('غير مصرح', 'هذه الصفحة للإدارة فقط', 'warning');
                    return;
                }
                document.getElementById('adminContent').classList.add('active');
            } else {
                document.getElementById('userContent').classList.add('active');
            }
        }
        
        // Load courses for dropdown
        async function loadCourses() {
            try {
                const snapshot = await db.collection('courses').get();
                const select = document.getElementById('courseSelect');
                
                snapshot.forEach(doc => {
                    const course = doc.data();
                    const option = document.createElement('option');
                    option.value = doc.id;
                    option.textContent = course.title;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading courses:', error);
            }
        }
        
        // Create new session
        async function createSession() {
            const sessionData = {
                title: document.getElementById('sessionTitle').value,
                date: document.getElementById('sessionDate').value,
                time: document.getElementById('sessionTime').value,
                duration: parseInt(document.getElementById('sessionDuration').value),
                zoomLink: document.getElementById('zoomLink').value,
                courseId: document.getElementById('courseSelect').value,
                status: 'scheduled',
                points: {
                    attendance: parseInt(document.getElementById('attendancePoints').value),
                    earlyBird: parseInt(document.getElementById('earlyBirdPoints').value),
                    fullSession: parseInt(document.getElementById('fullSessionPoints').value),
                    interaction: parseInt(document.getElementById('interactionPoints').value)
                },
                createdAt: new Date().toISOString(),
                createdBy: userId
            };
            
            if (!sessionData.title || !sessionData.date || !sessionData.courseId) {
                Swal.fire('خطأ', 'يرجى ملء جميع الحقول المطلوبة', 'error');
                return;
            }
            
            try {
                await db.collection('liveSessions').add(sessionData);
                Swal.fire('تم!', 'تم إنشاء الجلسة بنجاح', 'success');
                
                // Clear form
                document.getElementById('sessionTitle').value = '';
                document.getElementById('sessionDate').value = '';
                document.getElementById('zoomLink').value = '';
                
                loadSessions();
            } catch (error) {
                console.error('Error creating session:', error);
                Swal.fire('خطأ', 'فشل إنشاء الجلسة', 'error');
            }
        }
        
        // Load all sessions
        async function loadSessions() {
            try {
                const snapshot = await db.collection('liveSessions')
                    .orderBy('date', 'desc')
                    .get();
                
                const now = new Date();
                const upcomingSessions = [];
                const pastSessions = [];
                const allSessions = [];
                
                snapshot.forEach(doc => {
                    const session = { id: doc.id, ...doc.data() };
                    const sessionDate = new Date(`${session.date}T${session.time}`);
                    
                    allSessions.push(session);
                    
                    if (sessionDate > now) {
                        upcomingSessions.push(session);
                    } else {
                        pastSessions.push(session);
                    }
                });
                
                // Display upcoming sessions
                displaySessions('upcomingSessions', upcomingSessions, 'upcoming');
                
                // Display past sessions
                displaySessions('pastSessions', pastSessions, 'past');
                
                // Display all sessions for admin
                if (isAdmin) {
                    displaySessions('allSessions', allSessions, 'admin');
                }
                
            } catch (error) {
                console.error('Error loading sessions:', error);
            }
        }
        
        // Display sessions in container
        function displaySessions(containerId, sessions, type) {
            const container = document.getElementById(containerId);
            if (!container) return;
            
            if (sessions.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 2rem; color: rgba(255, 255, 255, 0.5);">
                        <i class="fas fa-calendar-times" style="font-size: 3rem; margin-bottom: 1rem;"></i>
                        <p>لا توجد جلسات</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = sessions.map(session => {
                const sessionDate = new Date(`${session.date}T${session.time}`);
                const statusClass = session.status === 'live' ? 'status-live' : 
                                   session.status === 'completed' ? 'status-completed' : 
                                   'status-scheduled';
                const statusText = session.status === 'live' ? 'مباشر الآن' : 
                                  session.status === 'completed' ? 'انتهت' : 
                                  'مجدولة';
                
                return `
                    <div class="session-card">
                        <div class="session-header">
                            <h3 class="session-title">${session.title}</h3>
                            <span class="session-status ${statusClass}">${statusText}</span>
                        </div>
                        
                        <div class="session-details">
                            <div class="session-detail">
                                <i class="fas fa-calendar"></i>
                                ${sessionDate.toLocaleDateString('ar-SA')}
                            </div>
                            <div class="session-detail">
                                <i class="fas fa-clock"></i>
                                ${session.time}
                            </div>
                            <div class="session-detail">
                                <i class="fas fa-hourglass-half"></i>
                                ${session.duration} دقيقة
                            </div>
                        </div>
                        
                        ${type === 'upcoming' ? `
                            <button class="btn btn-primary" style="margin-top: 1rem;" 
                                    onclick="joinSession('${session.id}')">
                                <i class="fas fa-video"></i> الانضمام
                            </button>
                        ` : ''}
                        
                        ${type === 'admin' ? `
                            <div style="margin-top: 1rem; display: flex; gap: 0.5rem;">
                                <button class="btn btn-success" onclick="startSession('${session.id}')">
                                    <i class="fas fa-play"></i> بدء
                                </button>
                                <button class="btn btn-danger" onclick="deleteSession('${session.id}')">
                                    <i class="fas fa-trash"></i> حذف
                                </button>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }
        
        // Check for active session
async function checkActiveSession() {
    try {
        const now = new Date();
        const snapshot = await db.collection('liveSessions')
            .where('status', '==', 'live')
            .get();
        
        const activeArea = document.getElementById('activeSessionArea');
        
        if (snapshot.empty) {
            activeArea.innerHTML = '';
            return;
        }
        
        // Display active session
        snapshot.forEach(doc => {
            const session = { id: doc.id, ...doc.data() };
            displayActiveSession(session);
        });
        
    } catch (error) {
        console.error('Error checking active session:', error);
    }
}

// Display active session with interaction

    const activeArea = document.getElementById('activeSessionArea');
    
    activeArea.innerHTML = `
        <div class="active-session">
            <h2 style="color: #22c55e; margin-bottom: 1rem;">
                🔴 جلسة مباشرة الآن!
            </h2>
            <h3 style="color: white; margin-bottom: 2rem;">${session.title}</h3>
            
            <div class="countdown" id="sessionTimer">00:00:00</div>
            
            <div class="interaction-buttons">
                <button class="interaction-btn" onclick="sendInteraction('👍', 5, '${session.id}')">
                    👍
                </button>
                <button class="interaction-btn" onclick="sendInteraction('❓', 10, '${session.id}')">
                    ❓
                </button>
                <button class="interaction-btn" onclick="sendInteraction('💡', 15, '${session.id}')">
                    💡
                </button>
                <button class="interaction-btn" onclick="sendInteraction('👏', 3, '${session.id}')">
                    👏
                </button>
            </div>
            
            <div class="points-earned">
                نقاطك في هذه الجلسة: <span id="sessionPoints">0</span>
            </div>
            
            <button class="btn btn-primary" onclick="joinSession('${session.id}')">
                <i class="fas fa-video"></i> فتح الزوم
            </button>
        </div>
    `;
    
    // Start session timer
    startSessionTimer(session.startedAt);
}

// Send interaction
async function sendInteraction(emoji, points, sessionId) {
    if (!userId) return;
    
    try {
        // Disable button temporarily
        event.target.disabled = true;
        event.target.classList.add('clicked');
        
        // Record interaction
        await db.collection('liveSessions').doc(sessionId)
            .collection('interactions').add({
                userId: userId,
                emoji: emoji,
                points: points,
                timestamp: new Date().toISOString()
            });
        
        // Update user points
        await db.collection('users').doc(userId).update({
            'journeyPoints.balance': firebase.firestore.FieldValue.increment(points),
            'walletPoints.balance': firebase.firestore.FieldValue.increment(points)
        });
        
        // Update session points display
        const sessionPointsEl = document.getElementById('sessionPoints');
        const currentPoints = parseInt(sessionPointsEl.textContent) || 0;
        sessionPointsEl.textContent = currentPoints + points;
        
        // Show points animation
        showPointsAnimation(points);
        
        // Re-enable button after 5 seconds
        setTimeout(() => {
            event.target.disabled = false;
            event.target.classList.remove('clicked');
        }, 5000);
        
    } catch (error) {
        console.error('Error sending interaction:', error);
    }
}

// Show points animation
function showPointsAnimation(points) {
    const el = document.createElement('div');
    el.style.cssText = `
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        font-size: 3rem;
        font-weight: bold;
        color: #fbbf24;
        z-index: 9999;
        pointer-events: none;
        animation: flyUp 2s ease-out forwards;
    `;
    el.textContent = `+${points}`;
    
    const style = document.createElement('style');
    style.textContent = `
        @keyframes flyUp {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -200px) scale(1.5);
                opacity: 0;
            }
        }
    `;
    document.head.appendChild(style);
    document.body.appendChild(el);
    
    setTimeout(() => el.remove(), 2000);
}

// Start session timer
function startSessionTimer(startTime) {
    if (!startTime) return;
    
    const timerEl = document.getElementById('sessionTimer');
    
    setInterval(() => {
        const start = new Date(startTime);
        const now = new Date();
        const diff = now - start;
        
        const hours = Math.floor(diff / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);
        
        timerEl.textContent = 
            `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }, 1000);
}

                }
            } catch (error) {

            }

async function recordAttendance(sessionId) {
    if (!userId) {
        Swal.fire('تنبيه', 'يجب تسجيل الدخول أولاً', 'warning');
        return;
    }
    
    try {
        // Get session data
        const sessionDoc = await db.collection('liveSessions').doc(sessionId).get();
        const sessionData = sessionDoc.data();
        
        // Check if already attended
        const attendeeDoc = await db.collection('liveSessions').doc(sessionId)
            .collection('attendees').doc(userId).get();
        
        if (attendeeDoc.exists) {
            Swal.fire('تنبيه', 'تم تسجيل حضورك مسبقاً', 'info');
            return;
        }
        
        // Calculate points
        let totalPoints = sessionData.points?.attendance || 50;
        
        // Check if early bird (first 10)
        const attendeesSnapshot = await db.collection('liveSessions').doc(sessionId)
            .collection('attendees').get();
        
        if (attendeesSnapshot.size < 10) {
            totalPoints += sessionData.points?.earlyBird || 20;
        }
        
        // Record attendance
        await db.collection('liveSessions').doc(sessionId)
            .collection('attendees').doc(userId).set({
                userId: userId,
                userName: currentUser?.personalInfo?.name || 'مستخدم',
                joinedAt: new Date().toISOString(),
                pointsEarned: totalPoints,
                sessionId: sessionId,
                courseId: sessionData.courseId
            });
        
        // Update user points
        const userRef = db.collection('users').doc(userId);
        await userRef.update({
            'journeyPoints.balance': firebase.firestore.FieldValue.increment(totalPoints),
            'walletPoints.balance': firebase.firestore.FieldValue.increment(totalPoints),
            [`attendance.${sessionData.courseId}.${sessionId}`]: {
                joinedAt: new Date().toISOString(),
                status: 'active',
                pointsEarned: totalPoints
            }
        });
        
        // Add to points history
        const pointsHistory = {
            amount: totalPoints,
            timestamp: new Date().toISOString(),
            type: 'attendance',
            reason: `حضور جلسة: ${sessionData.title}`,
            description: `حصلت على ${totalPoints} نقطة للحضور المباشر`
        };
        
        await userRef.update({
            'journeyPoints.history': firebase.firestore.FieldValue.arrayUnion(pointsHistory),
            'walletPoints.history': firebase.firestore.FieldValue.arrayUnion(pointsHistory)
        });
        
        // Show success with points
        Swal.fire({
            icon: 'success',
            title: 'تم تسجيل حضورك!',
            html: `
                <div style="text-align: center;">
                    <div style="font-size: 3rem; margin: 20px 0;">🎉</div>
                    <p style="font-size: 1.5rem; color: #fbbf24;">
                        حصلت على <strong>${totalPoints}</strong> نقطة!
                    </p>
                    ${attendeesSnapshot.size < 10 ? 
                        '<p style="color: #a855f7;">🏃 مكافأة المبكرين!</p>' : ''}
                </div>
            `,
            confirmButtonColor: '#22c55e'
        });
        
        // Check for attendance badges
        checkAttendanceBadges(sessionData.courseId);
        
    } catch (error) {
        console.error('Error recording attendance:', error);
        Swal.fire('خطأ', 'فشل تسجيل الحضور', 'error');
    }
}

// Check attendance badges
async function checkAttendanceBadges(courseId) {
    if (!userId) return;
    
    try {
        // Get user attendance count for this course
        const userDoc = await db.collection('users').doc(userId).get();
        const userData = userDoc.data();
        const courseAttendance = userData.attendance?.[courseId] || {};
        const attendanceCount = Object.keys(courseAttendance).length;
        
        // Get attendance badges
        const badgesSnapshot = await db.collection('badges')
            .where('type', '==', 'attendance')
            .get();
        
        const newBadges = [];
        const currentBadges = userData.badges || [];
        
        badgesSnapshot.forEach(doc => {
            const badge = { id: doc.id, ...doc.data() };
            
            // Skip if already has this badge
            if (currentBadges.some(b => b.id === badge.id)) return;
            
            // Check conditions
            if (badge.conditions?.firstAttendance && attendanceCount === 1) {
                newBadges.push({
                    id: badge.id,
                    name: badge.name,
                    icon: badge.icon,
                    awardedDate: new Date().toISOString(),
                    type: 'attendance',
                    reason: 'حضور أول جلسة مباشرة'
                });
            } else if (badge.conditions?.sessionCount && 
                      attendanceCount >= badge.conditions.sessionCount) {
                newBadges.push({
                    id: badge.id,
                    name: badge.name,
                    icon: badge.icon,
                    awardedDate: new Date().toISOString(),
                    type: 'attendance',
                    reason: `حضور ${badge.conditions.sessionCount} جلسات`
                });
            }
        });
        
        // Award new badges
        if (newBadges.length > 0) {
            await db.collection('users').doc(userId).update({
                badges: [...currentBadges, ...newBadges]
            });
            
            // Show badge notification
            showBadgeNotification(newBadges);
        }
        
    } catch (error) {
        console.error('Error checking attendance badges:', error);
    }
}

// تحديث حقول الشارة حسب النوع
function updateBadgeFields() {
    const type = document.getElementById('badgeType').value;
    const conditionField = document.getElementById('badgeConditionField');
    const label = conditionField.querySelector('label');
    
    switch(type) {
        case 'first':
            conditionField.style.display = 'none';
            break;
        case 'count':
            conditionField.style.display = 'block';
            label.textContent = 'عدد الجلسات المطلوبة';
            break;
        case 'consecutive':
            conditionField.style.display = 'block';
            label.textContent = 'عدد الجلسات المتتالية';
            break;
        case 'early':
            conditionField.style.display = 'block';
            label.textContent = 'أول كم شخص';
            break;
    }
}

// إنشاء شارة حضور جديدة
async function createAttendanceBadge() {
    const type = document.getElementById('badgeType').value;
    const name = document.getElementById('badgeName').value;
    const icon = document.getElementById('badgeIcon').value;
    const condition = parseInt(document.getElementById('badgeCondition').value);
    
    if (!name) {
        Swal.fire('خطأ', 'يرجى إدخال اسم الشارة', 'error');
        return;
    }
    
    try {
        const badgeData = {
            name: name,
            icon: icon,
            type: 'live_attendance',
            conditions: {},
            createdAt: new Date().toISOString(),
            isActive: true,
            timesAwarded: 0
        };
        
        // تحديد الشروط حسب النوع
        switch(type) {
            case 'first':
                badgeData.conditions.firstAttendance = true;
                break;
            case 'count':
                badgeData.conditions.sessionCount = condition;
                break;
            case 'consecutive':
                badgeData.conditions.consecutive = condition;
                break;
            case 'early':
                badgeData.conditions.earlyBird = condition;
                break;
        }
        
        await db.collection('badges').add(badgeData);
        
        Swal.fire({
            icon: 'success',
            title: 'تم إنشاء الشارة!',
            html: `
                <div style="text-align: center;">
                    <div style="font-size: 3rem; margin: 20px;">${icon}</div>
                    <h3>${name}</h3>
                </div>
            `,
            confirmButtonColor: '#22c55e'
        });
        
        // مسح الحقول
        document.getElementById('badgeName').value = '';
        document.getElementById('badgeCondition').value = '1';
        
    } catch (error) {
        console.error('خطأ في إنشاء الشارة:', error);
        Swal.fire('خطأ', 'فشل إنشاء الشارة', 'error');
    }
}

            .get();

        if (snapshot.empty) {
            html += '<p style="text-align: center;">لا توجد شارات حضور بعد</p>';

            snapshot.forEach(doc => {

                    condition = 'الحضور الأول';

                    condition = `${badge.conditions.sessionCount} جلسات`;
                } else if (badge.conditions.consecutive) {
