<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - منظور الفؤاد</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Chart.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    
    <style>
        /* ============================================
   متغيرات هوية منظور الفؤاد
   ============================================ */
:root {
    /* الألوان الأساسية من الهوية */
    --primary-blue: #3b82f6;
    --secondary-blue: #2563eb;
    --dark-bg: #0f172a;
    --dark-card: #1e293b;
    --border-color: #334155;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    
    /* ألوان الأشواق التسعة */
    --longing-1: #E11D48;
    --longing-2: #EC4899;
    --longing-3: #F97316;
    --longing-4: #9333EA;
    --longing-5: #22C55E;
    --longing-6: #3B82F6;
    --longing-7: #FBBF24;
    --longing-8: #7F1D1D;
    --longing-9: #14B8A6;
    
    /* الظلال والتوهجات */
    --glow-primary: rgba(59, 130, 246, 0.3);
    --glow-secondary: rgba(16, 185, 129, 0.3);
    --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.4);
}

/* ============================================
   إعدادات عامة
   ============================================ */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Tajawal', 'Noto Kufi Arabic', sans-serif;
    background: var(--dark-bg);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
}

/* ============================================
   الخلفية الكونية
   ============================================ */
.cosmic-background {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    background: radial-gradient(ellipse at center, 
        var(--dark-bg) 0%, 
        #0a0f1c 50%, 
        #030509 100%);
}

.stars-layer {
    position: absolute;
    width: 100%;
    height: 100%;
    background-image: 
        radial-gradient(2px 2px at 20% 30%, white, transparent),
        radial-gradient(2px 2px at 60% 70%, white, transparent),
        radial-gradient(1px 1px at 50% 50%, white, transparent),
        radial-gradient(1px 1px at 80% 10%, white, transparent);
    background-size: 300px 300px;
    animation: stars-move 200s linear infinite;
    opacity: 0.5;
}

@keyframes stars-move {
    from { transform: translateX(0); }
    to { transform: translateX(-300px); }
}

/* ============================================
   رأس الصفحة - سماء الارتواء
   ============================================ */
.sky-header {
    position: relative;
    background: linear-gradient(to bottom, 
        rgba(15, 23, 42, 0.95) 0%, 
        rgba(30, 41, 59, 0.8) 100%);
    backdrop-filter: blur(10px);
    padding: 1.5rem 2rem;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 100;
}

.greeting-section {
    display: flex;
    align-items: center;
    gap: 2rem;
}

.time-of-day {
    display: flex;
    align-items: center;
    gap: 0.75rem;
}

.time-icon {
    font-size: 2rem;
    animation: float 3s ease-in-out infinite;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
}

.greeting-text {
    font-size: 1.5rem;
    font-weight: 300;
    background: linear-gradient(135deg, var(--text-primary), var(--primary-blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.soul-status {
    background: rgba(30, 41, 59, 0.5);
    border: 1px solid var(--border-color);
    border-radius: 25px;
    padding: 0.5rem 1.5rem;
    backdrop-filter: blur(10px);
    position: relative;
}

.status-glow {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, var(--glow-primary), transparent);
    border-radius: 25px;
    opacity: 0.3;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 0.3; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 0.5; transform: translate(-50%, -50%) scale(1.05); }
}

.header-actions {
    display: flex;
    gap: 1rem;
}

.header-actions button {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--text-primary);
    padding: 0.75rem;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
}

.header-actions button:hover {
    background: rgba(255, 255, 255, 0.1);
    transform: translateY(-2px);
}

.notification-count {
    position: absolute;
    top: -5px;
    right: -5px;
    background: var(--longing-1);
    color: white;
    font-size: 0.75rem;
    padding: 2px 6px;
    border-radius: 10px;
}

.rotating {
    animation: rotate 4s linear infinite;
}

@keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* ============================================
   القلب المركزي - دوائر الارتواء
   ============================================ */
.main-content {
    padding: 3rem 2rem;
    max-width: 1400px;
    margin: 0 auto;
}

.center-soul-container {
    position: relative;
    width: 400px;
    height: 400px;
    margin: 3rem auto;
}

.soul-circles {
    position: relative;
    width: 100%;
    height: 100%;
}

/* دائرة النفس */
.circle-nafs {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.rotating-slow {
    animation: rotate 60s linear infinite;
}

.circle-label {
    position: absolute;
    color: var(--text-secondary);
    font-size: 0.875rem;
    background: var(--dark-bg);
    padding: 0.25rem 0.75rem;
    border-radius: 20px;
}

.circle-nafs .circle-label {
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
}

/* دائرة الصدر */
.circle-sadr {
    position: absolute;
    width: 70%;
    height: 70%;
    top: 15%;
    left: 15%;
    border: 2px solid rgba(59, 130, 246, 0.3);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.breathing {
    animation: breathe 4s ease-in-out infinite;
}

@keyframes breathe {
    0%, 100% { transform: scale(1); opacity: 0.7; }
    50% { transform: scale(1.05); opacity: 1; }
}

.circle-sadr .circle-label {
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
}

/* دائرة القلب */
.circle-qalb {
    position: absolute;
    width: 40%;
    height: 40%;
    top: 30%;
    left: 30%;
    background: radial-gradient(circle, 
        rgba(59, 130, 246, 0.1), 
        transparent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.pulsing {
    animation: pulse-heart 2s ease-in-out infinite;
}

@keyframes pulse-heart {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
}

.circle-qalb .circle-label {
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
}

/* نقطة الفؤاد */
.fouad-core {
    position: absolute;
    width: 100px;
    height: 100px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, 
        var(--primary-blue) 0%, 
        rgba(59, 130, 246, 0.5) 50%, 
        transparent 100%);
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    animation: glow-pulse 3s infinite;
}

@keyframes glow-pulse {
    0%, 100% { box-shadow: 0 0 30px var(--glow-primary); }
    50% { box-shadow: 0 0 50px var(--glow-primary), 0 0 80px var(--glow-primary); }
}

.core-light {
    position: absolute;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, 
        rgba(255, 255, 255, 0.2), 
        transparent);
    border-radius: 50%;
    animation: shimmer 2s infinite;
}

@keyframes shimmer {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.6; }
}

.irtiwaa-percentage {
    font-size: 1.75rem;
    font-weight: bold;
    color: var(--text-primary);
    text-shadow: 0 0 20px var(--glow-primary);
    z-index: 2;
}

.irtiwaa-label {
    font-size: 0.875rem;
    color: var(--text-secondary);
    z-index: 2;
}

/* خطوط الطاقة */
.energy-lines {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.energy-path {
    stroke: rgba(59, 130, 246, 0.2);
    stroke-width: 1;
    fill: none;
    stroke-dasharray: 5 10;
    animation: dash-flow 3s linear infinite;
}

@keyframes dash-flow {
    from { stroke-dashoffset: 0; }
    to { stroke-dashoffset: -15; }
}

        /* ============================================
   المحطات السبع - رحلة الارتواء
   ============================================ */
.journey-map {
    margin-top: 4rem;
    padding: 2rem;
    background: rgba(30, 41, 59, 0.3);
    border-radius: 20px;
    border: 1px solid var(--border-color);
    backdrop-filter: blur(10px);
}

.section-title {
    text-align: center;
    font-size: 1.5rem;
    margin-bottom: 2rem;
    background: linear-gradient(135deg, var(--primary-blue), var(--longing-5));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.stations {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 2rem 0;
    position: relative;
}

.stations::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, 
        var(--longing-1), var(--longing-2), var(--longing-3), 
        var(--longing-4), var(--longing-5), var(--longing-6), 
        var(--longing-7));
    opacity: 0.3;
    z-index: 0;
}

.station {
    position: relative;
    text-align: center;
    z-index: 1;
    cursor: pointer;
    transition: all 0.3s;
}

.station-icon {
    width: 80px;
    height: 80px;
    margin: 0 auto 0.5rem;
    background: var(--dark-card);
    border: 2px solid var(--border-color);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    transition: all 0.3s;
}

.station.active .station-icon {
    background: rgba(34, 197, 94, 0.1);
    border-color: var(--longing-5);
    animation: glow-pulse 2s infinite;
}

.station.current .station-icon {
    background: rgba(59, 130, 246, 0.2);
    border-color: var(--primary-blue);
    transform: scale(1.2);
}

.station.locked .station-icon {
    opacity: 0.3;
    filter: grayscale(100%);
}

.station-name {
    font-size: 0.875rem;
    color: var(--text-secondary);
    margin-top: 0.5rem;
}

.station.active .station-name {
    color: var(--longing-5);
}

.station.current .station-name {
    color: var(--primary-blue);
    font-weight: bold;
}

.current-indicator {
    position: absolute;
    bottom: -25px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--primary-blue);
    color: white;
    padding: 0.25rem 0.75rem;
    border-radius: 15px;
    font-size: 0.75rem;
    white-space: nowrap;
    animation: bounce 2s infinite;
}

@keyframes bounce {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-5px); }
}

/* ============================================
   اللوحات الجانبية
   ============================================ */
.side-panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2rem;
    margin-top: 3rem;
}

.left-panel, .right-panel {
    background: var(--dark-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 1.5rem;
    box-shadow: var(--shadow-lg);
}

.panel-title {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 1.25rem;
    margin-bottom: 1.5rem;
    color: var(--text-primary);
}

.panel-title i {
    color: var(--primary-blue);
}

/* بئر الارتواء */
.well-visual {
    width: 200px;
    height: 250px;
    margin: 1.5rem auto;
    position: relative;
    background: linear-gradient(to bottom, 
        var(--dark-bg) 0%, 
        #1a2332 100%);
    border-radius: 0 0 100px 100px;
    border: 3px solid var(--border-color);
    overflow: hidden;
}

.water-level {
    position: absolute;
    bottom: 0;
    width: 100%;
    background: linear-gradient(to bottom, 
        rgba(59, 130, 246, 0.6), 
        rgba(16, 185, 129, 0.4));
    transition: height 2s cubic-bezier(0.4, 0, 0.2, 1);
}

.water-surface {
    position: absolute;
    top: 0;
    width: 100%;
    height: 20px;
    background: linear-gradient(to right, 
        transparent, 
        rgba(255, 255, 255, 0.2), 
        transparent);
    animation: wave 3s ease-in-out infinite;
}

@keyframes wave {
    0%, 100% { transform: translateX(-50%); }
    50% { transform: translateX(50%); }
}

.water-sparkles {
    position: absolute;
    top: 10px;
    width: 100%;
    height: 30px;
}

.water-sparkles::before,
.water-sparkles::after {
    content: '✨';
    position: absolute;
    animation: sparkle 2s infinite;
}

.water-sparkles::before {
    left: 30%;
    animation-delay: 0s;
}

.water-sparkles::after {
    right: 30%;
    animation-delay: 1s;
}

@keyframes sparkle {
    0%, 100% { opacity: 0; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(-10px); }
}

.well-stones {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 30px;
    background: repeating-linear-gradient(
        90deg,
        var(--border-color) 0px,
        var(--border-color) 10px,
        transparent 10px,
        transparent 20px
    );
    opacity: 0.3;
}

.points-breakdown {
    margin-top: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

.point-type {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.75rem;
    background: rgba(255, 255, 255, 0.02);
    border-radius: 10px;
    transition: all 0.3s;
}

.point-type:hover {
    background: rgba(255, 255, 255, 0.05);
    transform: translateX(5px);
}

.point-icon {
    font-size: 1.5rem;
}

.point-name {
    flex: 1;
    margin-left: 1rem;
    color: var(--text-secondary);
}

.point-value {
    font-size: 1.25rem;
    font-weight: bold;
    color: var(--primary-blue);
}

/* عجلة اليوم */
.day-wheel {
    width: 200px;
    height: 200px;
    margin: 1.5rem auto;
    position: relative;
}

.wheel-svg {
    width: 100%;
    height: 100%;
}

.current-time-indicator {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 4px;
    height: 90px;
    background: var(--primary-blue);
    transform-origin: center bottom;
    transform: translate(-50%, -100%);
    border-radius: 2px;
    box-shadow: 0 0 10px var(--glow-primary);
}

.current-time-indicator::before {
    content: '';
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 10px;
    height: 10px;
    background: var(--primary-blue);
    border-radius: 50%;
    box-shadow: 0 0 20px var(--glow-primary);
}

.upcoming-activities {
    margin-top: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
}

.activity-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.75rem;
    background: rgba(255, 255, 255, 0.02);
    border-radius: 10px;
    border-left: 3px solid transparent;
    transition: all 0.3s;
}

.activity-item.current {
    border-left-color: var(--primary-blue);
    background: rgba(59, 130, 246, 0.05);
}

.activity-item.completed {
    opacity: 0.6;
}

.activity-item:hover {
    background: rgba(255, 255, 255, 0.05);
    transform: translateX(5px);
}

.activity-time {
    font-size: 0.875rem;
    color: var(--text-secondary);
}

.activity-name {
    flex: 1;
    margin: 0 1rem;
    color: var(--text-primary);
}

.activity-status {
    font-size: 0.875rem;
}

.activity-status.completed {
    color: var(--longing-5);
}

/* ============================================
   شريط الإنجازات
   ============================================ */
.achievements-bar {
    margin-top: 3rem;
    padding: 1.5rem;
    background: var(--dark-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    display: flex;
    gap: 1.5rem;
    overflow-x: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border-color) transparent;
}

.achievement-badge {
    min-width: 100px;
    text-align: center;
    padding: 1rem;
    background: rgba(255, 255, 255, 0.02);
    border-radius: 12px;
    transition: all 0.3s;
    cursor: pointer;
    position: relative;
}

.achievement-badge:hover {
    background: rgba(255, 255, 255, 0.05);
    transform: translateY(-5px);
}

.achievement-badge.new::before {
    content: 'جديد';
    position: absolute;
    top: -10px;
    right: -10px;
    background: var(--longing-1);
    color: white;
    font-size: 0.625rem;
    padding: 2px 8px;
    border-radius: 10px;
    animation: pulse 2s infinite;
}

.badge-icon {
    font-size: 2.5rem;
    margin-bottom: 0.5rem;
}

.badge-name {
    font-size: 0.875rem;
    color: var(--text-secondary);
}

/* ============================================
   منطقة الإشعارات الحية
   ============================================ */
.live-notifications {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    width: 350px;
    z-index: 1000;
}

.notification-item {
    background: rgba(30, 41, 59, 0.95);
    backdrop-filter: blur(10px);
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 0.75rem;
    border-left: 3px solid var(--longing-5);
    animation: slide-in 0.5s ease;
    display: flex;
    align-items: center;
    gap: 1rem;
}

@keyframes slide-in {
    from {
        transform: translateX(400px);
        opacity: 0;
    }
    to {
        transform: translateX(0);
        opacity: 1;
    }
}

.notif-icon {
    font-size: 1.5rem;
}

.notif-content {
    flex: 1;
}

.notif-text {
    color: var(--text-primary);
    font-size: 0.875rem;
    display: block;
    margin-bottom: 0.25rem;
}

.notif-time {
    color: var(--text-secondary);
    font-size: 0.75rem;
}

/* ============================================
   Responsive
   ============================================ */
@media (max-width: 768px) {
    .side-panels {
        grid-template-columns: 1fr;
    }
    
    .stations {
        flex-direction: column;
        gap: 2rem;
    }
    
    .stations::before {
        width: 2px;
        height: 100%;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
    }
    
    .center-soul-container {
        width: 300px;
        height: 300px;
    }
    
    .live-notifications {
        width: 90%;
        right: 5%;
        left: 5%;
    }
}
        
    </style>
</head>
<body>
   <!-- الخلفية الكونية المتحركة -->
<div class="cosmic-background">
    <div class="stars-layer"></div>
    <div class="nebula-layer"></div>
    <div class="energy-particles"></div>
</div>

<!-- الحاوية الرئيسية -->
<div class="irtiwaa-container">
    
    <!-- رأس الصفحة - سماء الارتواء -->
    <header class="sky-header">
        <div class="gradient-sky"></div>
        
        <!-- منطقة التحية والوقت -->
        <div class="greeting-section">
            <div class="time-of-day">
                <span class="time-icon" id="timeIcon">🌅</span>
                <span class="greeting-text" id="greetingText">جاري التحميل...</span>
            </div>
            <div class="soul-status">
                <span class="status-text" id="userStage">ملبي النداء</span>
                <div class="status-glow"></div>
            </div>
        </div>
        
        <!-- الإجراءات -->
        <div class="header-actions">
            <button class="notification-bell" id="notificationBell">
                <i class="fas fa-bell"></i>
                <span class="notification-count">0</span>
            </button>
            <button class="settings-gear" id="settingsBtn">
                <i class="fas fa-cog rotating"></i>
            </button>
            <button class="logout-btn" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i>
                <span>خروج</span>
            </button>
        </div>
    </header>
    
    <!-- المحتوى الرئيسي -->
    <main class="main-content">
        
        <!-- القلب المركزي - دائرة الارتواء -->
        <div class="center-soul-container">
            <div class="soul-circles">
                <!-- دائرة النفس -->
                <div class="circle-nafs">
                    <svg viewBox="0 0 400 400" class="rotating-slow">
                        <circle cx="200" cy="200" r="195" fill="none" stroke="rgba(148, 163, 184, 0.2)" stroke-width="2" stroke-dasharray="10 5"/>
                    </svg>
                    <span class="circle-label">النفس</span>
                </div>
                
                <!-- دائرة الصدر -->
                <div class="circle-sadr breathing">
                    <div class="circle-border"></div>
                    <span class="circle-label">الصدر</span>
                </div>
                
                <!-- دائرة القلب -->
                <div class="circle-qalb pulsing">
                    <div class="circle-glow"></div>
                    <span class="circle-label">القلب</span>
                </div>
                
                <!-- نقطة الفؤاد -->
                <div class="fouad-core">
                    <div class="core-light"></div>
                    <div class="irtiwaa-percentage" id="irtiwaaPercent">0%</div>
                    <div class="irtiwaa-label">ارتواء</div>
                </div>
            </div>
            
            <!-- خطوط الطاقة -->
            <svg class="energy-lines" viewBox="0 0 400 400">
                <path d="M200,50 Q100,200 200,350" class="energy-path"/>
                <path d="M50,200 Q200,100 350,200" class="energy-path"/>
            </svg>
        </div>
        
        <!-- المحطات السبع -->
        <div class="journey-map">
            <h2 class="section-title">رحلة الارتواء</h2>
            <div class="journey-path">
                <div class="stations" id="stationsContainer">
                    <!-- ستملأ بالجافاسكريبت -->
                </div>
            </div>
        </div>
        
        <!-- اللوحات الجانبية -->
        <div class="side-panels">
            <!-- بئر الارتواء -->
            <div class="left-panel">
                <div class="well-container">
                    <h3 class="panel-title">
                        <i class="fas fa-tint"></i>
                        بئر الارتواء
                    </h3>
                    <div class="well-visual">
                        <div class="water-level" id="waterLevel">
                            <div class="water-surface"></div>
                            <div class="water-sparkles"></div>
                        </div>
                        <div class="well-stones"></div>
                    </div>
                    <div class="points-breakdown">
                        <div class="point-type">
                            <span class="point-icon">💧</span>
                            <span class="point-name">نقاط الرحلة</span>
                            <span class="point-value" id="journeyPoints">0</span>
                        </div>
                        <div class="point-type">
                            <span class="point-icon">✨</span>
                            <span class="point-name">نقاط المحفظة</span>
                            <span class="point-value" id="walletPoints">0</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- طقوس اليوم -->
            <div class="right-panel">
                <div class="daily-activities">
                    <h3 class="panel-title">
                        <i class="fas fa-sun"></i>
                        طقوس اليوم
                    </h3>
                    <div class="day-wheel">
                        <svg viewBox="0 0 200 200" class="wheel-svg">
                            <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
                            <path d="M100,10 L100,190" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
                            <path d="M10,100 L190,100" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
                        </svg>
                        <div class="current-time-indicator" id="timeIndicator"></div>
                    </div>
                    <div class="upcoming-activities" id="activitiesContainer">
                        <!-- ستملأ بالجافاسكريبت -->
                    </div>
                </div>
            </div>
        </div>
        
        <!-- شريط الإنجازات -->
        <div class="achievements-bar" id="achievementsBar">
            <!-- ستملأ بالجافاسكريبت -->
        </div>
        
    </main>
</div>

<!-- منطقة الإشعارات الحية -->
<div class="live-notifications" id="liveNotifications"></div>

    <script>
// ============================================
// متغيرات عامة
// ============================================
let currentUser = null;
let userData = null;
let userId = localStorage.getItem('userId');

// ============================================
// تحميل بيانات المستخدم
// ============================================
async function loadUserData() {
    try {
        userId = userId || localStorage.getItem('userId');
        
        if (!userId) {
            console.log('لا يوجد معرف مستخدم');
            window.location.href = './login.html';
            return;
        }

        const userDoc = await db.collection('users').doc(userId).get();
        
        if (userDoc.exists) {
            userData = userDoc.data();
            console.log('تم تحميل بيانات المستخدم:', userData);
            
            // تحديث الواجهة
            updateGreeting();
            updateSoulCircles();
            updateJourneyStations();
            updateWellLevel();
            updateDailyActivities();
            updateAchievements();
            
            // بدء التحديثات الحية
            startLiveUpdates();
            
        } else {
            console.error('المستخدم غير موجود');
            showNotification('خطأ في تحميل البيانات', 'error');
        }
    } catch (error) {
        console.error('خطأ في تحميل البيانات:', error);
        showNotification('حدث خطأ في النظام', 'error');
    }
}

// ============================================
// تحديث التحية حسب الوقت
// ============================================
function updateGreeting() {
    const hour = new Date().getHours();
    const greetingElement = document.getElementById('greetingText');
    const iconElement = document.getElementById('timeIcon');
    const userName = userData?.personalInfo?.name || 'ضيف الارتواء';
    
    let greeting, icon;
    
    if (hour < 6) {
        greeting = `ليلة هادئة يا ${userName}`;
        icon = '🌙';
        document.body.className = 'night-theme';
    } else if (hour < 12) {
        greeting = `صباح النور يا ${userName}`;
        icon = '🌅';
        document.body.className = 'morning-theme';
    } else if (hour < 18) {
        greeting = `يوم مبارك يا ${userName}`;
        icon = '☀️';
        document.body.className = 'day-theme';
    } else {
        greeting = `مساء الخير يا ${userName}`;
        icon = '🌆';
        document.body.className = 'evening-theme';
    }
    
    greetingElement.textContent = greeting;
    iconElement.textContent = icon;
    
    // تحديث حالة المستخدم
    const stageElement = document.getElementById('userStage');
    const journeyTitle = userData?.journeyPoints?.stageTitle || userData?.accountStatus?.journeyTitle || 'ملبي النداء';
    stageElement.textContent = journeyTitle;
}

// ============================================
// تحديث دوائر الارتواء
// ============================================
function updateSoulCircles() {
    // حساب نسبة الارتواء
    let irtiwaaPercent = 0;
    
    if (userData?.progress) {
        const courses = Object.values(userData.progress);
        if (courses.length > 0) {
            const totalProgress = courses.reduce((sum, course) => sum + (course.percentage || 0), 0);
            irtiwaaPercent = Math.round(totalProgress / courses.length);
        }
    }
    
    // إذا لا توجد دورات، احسب من النقاط
    if (irtiwaaPercent === 0 && userData?.journeyPoints?.balance) {
        irtiwaaPercent = Math.min(100, Math.round(userData.journeyPoints.balance / 50));
    }
    
    const percentElement = document.getElementById('irtiwaaPercent');
    percentElement.textContent = irtiwaaPercent + '%';
    
    // تحديث لون القلب حسب النسبة
    const fouadCore = document.querySelector('.fouad-core');
    if (irtiwaaPercent > 70) {
        fouadCore.style.background = `radial-gradient(circle, var(--longing-5) 0%, rgba(34, 197, 94, 0.5) 50%, transparent 100%)`;
    } else if (irtiwaaPercent > 40) {
        fouadCore.style.background = `radial-gradient(circle, var(--primary-blue) 0%, rgba(59, 130, 246, 0.5) 50%, transparent 100%)`;
    }
}

// ============================================
// تحديث محطات الرحلة
// ============================================
function updateJourneyStations() {
    const stationsContainer = document.getElementById('stationsContainer');
    const currentStage = userData?.journeyPoints?.stage || userData?.accountStatus?.journeyStage || 1;
    
    const stations = [
        { id: 1, name: 'النداء', icon: '🌱' },
        { id: 2, name: 'اللقاء', icon: '🌿' },
        { id: 3, name: 'البناء', icon: '🌳' },
        { id: 4, name: 'الانتماء', icon: '🍃' },
        { id: 5, name: 'النماء', icon: '🌸' },
        { id: 6, name: 'النبلاء', icon: '✨' },
        { id: 7, name: 'الإحياء', icon: '🌟' }
    ];
    
    stationsContainer.innerHTML = stations.map(station => {
        let className = 'station';
        if (station.id < currentStage) className += ' active';
        if (station.id === currentStage) className += ' current';
        if (station.id > currentStage) className += ' locked';
        
        return `
            <div class="${className}" data-stage="${station.id}">
                <div class="station-icon">${station.icon}</div>
                <div class="station-name">${station.name}</div>
                ${station.id === currentStage ? '<div class="current-indicator">أنت هنا</div>' : ''}
            </div>
        `;
    }).join('');
}

// ============================================
// تحديث مستوى البئر
// ============================================
function updateWellLevel() {
    const journeyPoints = userData?.journeyPoints?.balance || 0;
    const walletPoints = userData?.walletPoints?.balance || 0;
    
    // تحديث النقاط
    document.getElementById('journeyPoints').textContent = journeyPoints;
    document.getElementById('walletPoints').textContent = walletPoints;
    
    // حساب مستوى الماء (من 0 إلى 100%)
    const maxPoints = 10000; // الحد الأقصى للعرض
    const totalPoints = journeyPoints + walletPoints;
    const waterPercent = Math.min(100, (totalPoints / maxPoints) * 100);
    
    // تحديث مستوى الماء مع أنيميشن
    const waterLevel = document.getElementById('waterLevel');
    waterLevel.style.height = waterPercent + '%';
    
    // إضافة فقاعات إذا كان المستوى عالي
    if (waterPercent > 50) {
        createBubbles();
    }
}

// ============================================
// إنشاء فقاعات الماء
// ============================================
function createBubbles() {
    const waterLevel = document.getElementById('waterLevel');
    const bubble = document.createElement('div');
    bubble.className = 'water-bubble';
    bubble.style.cssText = `
        position: absolute;
        bottom: 10px;
        left: ${Math.random() * 80 + 10}%;
        width: ${Math.random() * 10 + 5}px;
        height: ${Math.random() * 10 + 5}px;
        background: rgba(255, 255, 255, 0.4);
        border-radius: 50%;
        animation: bubble-rise 3s ease-out;
    `;
    
    waterLevel.appendChild(bubble);
    
    setTimeout(() => bubble.remove(), 3000);
}

// أنيميشن الفقاعات
const bubbleStyle = document.createElement('style');
bubbleStyle.textContent = `
    @keyframes bubble-rise {
        0% {
            transform: translateY(0) scale(0);
            opacity: 0;
        }
        10% {
            transform: translateY(-10px) scale(1);
            opacity: 1;
        }
        100% {
            transform: translateY(-100px) scale(0.5);
            opacity: 0;
        }
    }
`;
document.head.appendChild(bubbleStyle);

// ============================================
// تحديث الأنشطة اليومية
// ============================================
function updateDailyActivities() {
    const activitiesContainer = document.getElementById('activitiesContainer');
    const currentHour = new Date().getHours();
    
    const activities = [
        { time: '6:00 ص', name: 'تأمل الصباح', hour: 6 },
        { time: '9:00 ص', name: 'ممارسة القراءة', hour: 9 },
        { time: '12:00 م', name: 'لحظة امتنان', hour: 12 },
        { time: '3:00 م', name: 'تمرين التنفس', hour: 15 },
        { time: '6:00 م', name: 'مراجعة اليوم', hour: 18 },
        { time: '9:00 م', name: 'تأمل المساء', hour: 21 }
    ];
    
    activitiesContainer.innerHTML = activities.map(activity => {
        let className = 'activity-item';
        let status = '';
        
        if (activity.hour < currentHour) {
            className += ' completed';
            status = '<span class="activity-status completed">✓</span>';
        } else if (activity.hour === currentHour) {
            className += ' current';
            status = '<span class="activity-status" style="color: var(--primary-blue);">جاري</span>';
        } else {
            status = '<span class="activity-status" style="color: var(--text-secondary);">قادم</span>';
        }
        
        return `
            <div class="${className}">
                <span class="activity-time">${activity.time}</span>
                <span class="activity-name">${activity.name}</span>
                ${status}
            </div>
        `;
    }).join('');
    
    // تحديث مؤشر الوقت على العجلة
    updateTimeWheel();
}

// ============================================
// تحديث عجلة الوقت
// ============================================
function updateTimeWheel() {
    const now = new Date();
    const hours = now.getHours();
    const minutes = now.getMinutes();
    const angle = ((hours % 12) * 30) + (minutes * 0.5) - 90;
    
    const indicator = document.getElementById('timeIndicator');
    indicator.style.transform = `translate(-50%, -100%) rotate(${angle}deg)`;
}

// ============================================
// تحديث الإنجازات
// ============================================
function updateAchievements() {
    const achievementsBar = document.getElementById('achievementsBar');
    const badges = userData?.badges || [];
    
    if (badges.length === 0) {
        achievementsBar.innerHTML = '<p style="color: var(--text-secondary); text-align: center; width: 100%;">لا توجد إنجازات بعد</p>';
        return;
    }
    
    // عرض آخر 5 شارات
    const recentBadges = badges.slice(-5).reverse();
    
    achievementsBar.innerHTML = recentBadges.map((badge, index) => {
        const isNew = index === 0; // الشارة الأولى هي الأحدث
        
        return `
            <div class="achievement-badge ${isNew ? 'new' : ''}">
                <div class="badge-icon">${badge.icon || '🏆'}</div>
                <div class="badge-name">${badge.name}</div>
            </div>
        `;
    }).join('');
}

// ============================================
// إظهار الإشعارات
// ============================================
function showNotification(message, type = 'success') {
    const notificationsContainer = document.getElementById('liveNotifications');
    
    const icons = {
        success: '✨',
        error: '⚠️',
        info: 'ℹ️',
        achievement: '🏆'
    };
    
    const notification = document.createElement('div');
    notification.className = 'notification-item';
    notification.innerHTML = `
        <div class="notif-icon">${icons[type]}</div>
        <div class="notif-content">
            <span class="notif-text">${message}</span>
            <span class="notif-time">الآن</span>
        </div>
    `;
    
    notificationsContainer.appendChild(notification);
    
    // إزالة الإشعار بعد 5 ثواني
    setTimeout(() => {
        notification.style.animation = 'slide-out 0.5s ease';
        setTimeout(() => notification.remove(), 500);
    }, 5000);
}

// أنيميشن الخروج
const slideOutStyle = document.createElement('style');
slideOutStyle.textContent = `
    @keyframes slide-out {
        from {
            transform: translateX(0);
            opacity: 1;
        }
        to {
            transform: translateX(400px);
            opacity: 0;
        }
    }
`;
document.head.appendChild(slideOutStyle);

// ============================================
// التحديثات الحية
// ============================================
function startLiveUpdates() {
    // تحديث الوقت كل دقيقة
    setInterval(() => {
        updateGreeting();
        updateDailyActivities();
    }, 60000);
    
    // تحديث عجلة الوقت كل 30 ثانية
    setInterval(updateTimeWheel, 30000);
    
    // الاستماع للتحديثات من Firebase
    if (userId) {
        db.collection('users').doc(userId).onSnapshot((doc) => {
            if (doc.exists) {
                userData = doc.data();
                console.log('تحديث البيانات:', userData);
                
                // تحديث كل العناصر
                updateSoulCircles();
                updateWellLevel();
                updateAchievements();
                
                // إظهار إشعار إذا كان هناك إنجاز جديد
                checkForNewBadges();
            }
        });
    }
}

// ============================================
// فحص الشارات الجديدة
// ============================================
let lastBadgeCount = 0;

function checkForNewBadges() {
    const currentBadges = userData?.badges || [];
    
    if (lastBadgeCount === 0) {
        lastBadgeCount = currentBadges.length;
        return;
    }
    
    if (currentBadges.length > lastBadgeCount) {
        const newBadge = currentBadges[currentBadges.length - 1];
        showNotification(`مبروك! حصلت على شارة "${newBadge.name}"`, 'achievement');
        lastBadgeCount = currentBadges.length;
    }
}

// ============================================
// تسجيل الخروج
// ============================================
async function logout() {
    try {
        await auth.signOut();
        localStorage.clear();
        window.location.href = './login.html';
    } catch (error) {
        console.error('خطأ في تسجيل الخروج:', error);
        showNotification('حدث خطأ في تسجيل الخروج', 'error');
    }
}

// ============================================
// بدء التطبيق عند تحميل الصفحة
// ============================================
auth.onAuthStateChanged(async (user) => {
    if (user) {
        currentUser = user;
        await loadUserData();
    } else {
        window.location.href = './login.html';
    }
});
</script>
</body>
</html>
