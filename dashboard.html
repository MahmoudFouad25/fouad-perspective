<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - منظور الفؤاد</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Chart.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    
    <style>
        /* ============================================
   متغيرات هوية منظور الفؤاد
   ============================================ */
:root {
    /* الألوان الأساسية من الهوية */
    --primary-blue: #3b82f6;
    --secondary-blue: #2563eb;
    --dark-bg: #0f172a;
    --dark-card: #1e293b;
    --border-color: #334155;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    
    /* ألوان الأشواق التسعة */
    --longing-1: #E11D48;
    --longing-2: #EC4899;
    --longing-3: #F97316;
    --longing-4: #9333EA;
    --longing-5: #22C55E;
    --longing-6: #3B82F6;
    --longing-7: #FBBF24;
    --longing-8: #7F1D1D;
    --longing-9: #14B8A6;
    
    /* الظلال والتوهجات */
    --glow-primary: rgba(59, 130, 246, 0.3);
    --glow-secondary: rgba(16, 185, 129, 0.3);
    --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.4);
}

/* ============================================
   إعدادات عامة
   ============================================ */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Tajawal', 'Noto Kufi Arabic', sans-serif;
    background: var(--dark-bg);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
}

/* ============================================
   الخلفية الكونية
   ============================================ */
.cosmic-background {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    background: radial-gradient(ellipse at center, 
        var(--dark-bg) 0%, 
        #0a0f1c 50%, 
        #030509 100%);
}

.stars-layer {
    position: absolute;
    width: 100%;
    height: 100%;
    background-image: 
        radial-gradient(2px 2px at 20% 30%, white, transparent),
        radial-gradient(2px 2px at 60% 70%, white, transparent),
        radial-gradient(1px 1px at 50% 50%, white, transparent),
        radial-gradient(1px 1px at 80% 10%, white, transparent);
    background-size: 300px 300px;
    animation: stars-move 200s linear infinite;
    opacity: 0.5;
}

@keyframes stars-move {
    from { transform: translateX(0); }
    to { transform: translateX(-300px); }
}

/* ============================================
   رأس الصفحة - سماء الارتواء
   ============================================ */
.sky-header {
    position: relative;
    background: linear-gradient(to bottom, 
        rgba(15, 23, 42, 0.95) 0%, 
        rgba(30, 41, 59, 0.8) 100%);
    backdrop-filter: blur(10px);
    padding: 1.5rem 2rem;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 100;
}

.greeting-section {
    display: flex;
    align-items: center;
    gap: 2rem;
}

.time-of-day {
    display: flex;
    align-items: center;
    gap: 0.75rem;
}

.time-icon {
    font-size: 2rem;
    animation: float 3s ease-in-out infinite;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
}

.greeting-text {
    font-size: 1.5rem;
    font-weight: 300;
    background: linear-gradient(135deg, var(--text-primary), var(--primary-blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.soul-status {
    background: rgba(30, 41, 59, 0.5);
    border: 1px solid var(--border-color);
    border-radius: 25px;
    padding: 0.5rem 1.5rem;
    backdrop-filter: blur(10px);
    position: relative;
}

.status-glow {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, var(--glow-primary), transparent);
    border-radius: 25px;
    opacity: 0.3;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 0.3; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 0.5; transform: translate(-50%, -50%) scale(1.05); }
}

.header-actions {
    display: flex;
    gap: 1rem;
}

.header-actions button {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--text-primary);
    padding: 0.75rem;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
}

.header-actions button:hover {
    background: rgba(255, 255, 255, 0.1);
    transform: translateY(-2px);
}

.notification-count {
    position: absolute;
    top: -5px;
    right: -5px;
    background: var(--longing-1);
    color: white;
    font-size: 0.75rem;
    padding: 2px 6px;
    border-radius: 10px;
}

.rotating {
    animation: rotate 4s linear infinite;
}

@keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* ============================================
   القلب المركزي - دوائر الارتواء
   ============================================ */
.main-content {
    padding: 3rem 2rem;
    max-width: 1400px;
    margin: 0 auto;
}

.center-soul-container {
    position: relative;
    width: 400px;
    height: 400px;
    margin: 3rem auto;
}

.soul-circles {
    position: relative;
    width: 100%;
    height: 100%;
}

/* دائرة النفس */
.circle-nafs {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.rotating-slow {
    animation: rotate 60s linear infinite;
}

.circle-label {
    position: absolute;
    color: var(--text-secondary);
    font-size: 0.875rem;
    background: var(--dark-bg);
    padding: 0.25rem 0.75rem;
    border-radius: 20px;
}

.circle-nafs .circle-label {
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
}

/* دائرة الصدر */
.circle-sadr {
    position: absolute;
    width: 70%;
    height: 70%;
    top: 15%;
    left: 15%;
    border: 2px solid rgba(59, 130, 246, 0.3);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.breathing {
    animation: breathe 4s ease-in-out infinite;
}

@keyframes breathe {
    0%, 100% { transform: scale(1); opacity: 0.7; }
    50% { transform: scale(1.05); opacity: 1; }
}

.circle-sadr .circle-label {
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
}

/* دائرة القلب */
.circle-qalb {
    position: absolute;
    width: 40%;
    height: 40%;
    top: 30%;
    left: 30%;
    background: radial-gradient(circle, 
        rgba(59, 130, 246, 0.1), 
        transparent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.pulsing {
    animation: pulse-heart 2s ease-in-out infinite;
}

@keyframes pulse-heart {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
}

.circle-qalb .circle-label {
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
}

/* نقطة الفؤاد */
.fouad-core {
    position: absolute;
    width: 100px;
    height: 100px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, 
        var(--primary-blue) 0%, 
        rgba(59, 130, 246, 0.5) 50%, 
        transparent 100%);
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    animation: glow-pulse 3s infinite;
}

@keyframes glow-pulse {
    0%, 100% { box-shadow: 0 0 30px var(--glow-primary); }
    50% { box-shadow: 0 0 50px var(--glow-primary), 0 0 80px var(--glow-primary); }
}

.core-light {
    position: absolute;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, 
        rgba(255, 255, 255, 0.2), 
        transparent);
    border-radius: 50%;
    animation: shimmer 2s infinite;
}

@keyframes shimmer {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.6; }
}

.irtiwaa-percentage {
    font-size: 1.75rem;
    font-weight: bold;
    color: var(--text-primary);
    text-shadow: 0 0 20px var(--glow-primary);
    z-index: 2;
}

.irtiwaa-label {
    font-size: 0.875rem;
    color: var(--text-secondary);
    z-index: 2;
}

/* خطوط الطاقة */
.energy-lines {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.energy-path {
    stroke: rgba(59, 130, 246, 0.2);
    stroke-width: 1;
    fill: none;
    stroke-dasharray: 5 10;
    animation: dash-flow 3s linear infinite;
}

@keyframes dash-flow {
    from { stroke-dashoffset: 0; }
    to { stroke-dashoffset: -15; }
}
    </style>
</head>
<body>
   <!-- الخلفية الكونية المتحركة -->
<div class="cosmic-background">
    <div class="stars-layer"></div>
    <div class="nebula-layer"></div>
    <div class="energy-particles"></div>
</div>

<!-- الحاوية الرئيسية -->
<div class="irtiwaa-container">
    
    <!-- رأس الصفحة - سماء الارتواء -->
    <header class="sky-header">
        <div class="gradient-sky"></div>
        
        <!-- منطقة التحية والوقت -->
        <div class="greeting-section">
            <div class="time-of-day">
                <span class="time-icon" id="timeIcon">🌅</span>
                <span class="greeting-text" id="greetingText">جاري التحميل...</span>
            </div>
            <div class="soul-status">
                <span class="status-text" id="userStage">ملبي النداء</span>
                <div class="status-glow"></div>
            </div>
        </div>
        
        <!-- الإجراءات -->
        <div class="header-actions">
            <button class="notification-bell" id="notificationBell">
                <i class="fas fa-bell"></i>
                <span class="notification-count">0</span>
            </button>
            <button class="settings-gear" id="settingsBtn">
                <i class="fas fa-cog rotating"></i>
            </button>
            <button class="logout-btn" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i>
                <span>خروج</span>
            </button>
        </div>
    </header>
    
    <!-- المحتوى الرئيسي -->
    <main class="main-content">
        
        <!-- القلب المركزي - دائرة الارتواء -->
        <div class="center-soul-container">
            <div class="soul-circles">
                <!-- دائرة النفس -->
                <div class="circle-nafs">
                    <svg viewBox="0 0 400 400" class="rotating-slow">
                        <circle cx="200" cy="200" r="195" fill="none" stroke="rgba(148, 163, 184, 0.2)" stroke-width="2" stroke-dasharray="10 5"/>
                    </svg>
                    <span class="circle-label">النفس</span>
                </div>
                
                <!-- دائرة الصدر -->
                <div class="circle-sadr breathing">
                    <div class="circle-border"></div>
                    <span class="circle-label">الصدر</span>
                </div>
                
                <!-- دائرة القلب -->
                <div class="circle-qalb pulsing">
                    <div class="circle-glow"></div>
                    <span class="circle-label">القلب</span>
                </div>
                
                <!-- نقطة الفؤاد -->
                <div class="fouad-core">
                    <div class="core-light"></div>
                    <div class="irtiwaa-percentage" id="irtiwaaPercent">0%</div>
                    <div class="irtiwaa-label">ارتواء</div>
                </div>
            </div>
            
            <!-- خطوط الطاقة -->
            <svg class="energy-lines" viewBox="0 0 400 400">
                <path d="M200,50 Q100,200 200,350" class="energy-path"/>
                <path d="M50,200 Q200,100 350,200" class="energy-path"/>
            </svg>
        </div>
        
        <!-- المحطات السبع -->
        <div class="journey-map">
            <h2 class="section-title">رحلة الارتواء</h2>
            <div class="journey-path">
                <div class="stations" id="stationsContainer">
                    <!-- ستملأ بالجافاسكريبت -->
                </div>
            </div>
        </div>
        
        <!-- اللوحات الجانبية -->
        <div class="side-panels">
            <!-- بئر الارتواء -->
            <div class="left-panel">
                <div class="well-container">
                    <h3 class="panel-title">
                        <i class="fas fa-tint"></i>
                        بئر الارتواء
                    </h3>
                    <div class="well-visual">
                        <div class="water-level" id="waterLevel">
                            <div class="water-surface"></div>
                            <div class="water-sparkles"></div>
                        </div>
                        <div class="well-stones"></div>
                    </div>
                    <div class="points-breakdown">
                        <div class="point-type">
                            <span class="point-icon">💧</span>
                            <span class="point-name">نقاط الرحلة</span>
                            <span class="point-value" id="journeyPoints">0</span>
                        </div>
                        <div class="point-type">
                            <span class="point-icon">✨</span>
                            <span class="point-name">نقاط المحفظة</span>
                            <span class="point-value" id="walletPoints">0</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- طقوس اليوم -->
            <div class="right-panel">
                <div class="daily-activities">
                    <h3 class="panel-title">
                        <i class="fas fa-sun"></i>
                        طقوس اليوم
                    </h3>
                    <div class="day-wheel">
                        <svg viewBox="0 0 200 200" class="wheel-svg">
                            <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
                            <path d="M100,10 L100,190" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
                            <path d="M10,100 L190,100" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
                        </svg>
                        <div class="current-time-indicator" id="timeIndicator"></div>
                    </div>
                    <div class="upcoming-activities" id="activitiesContainer">
                        <!-- ستملأ بالجافاسكريبت -->
                    </div>
                </div>
            </div>
        </div>
        
        <!-- شريط الإنجازات -->
        <div class="achievements-bar" id="achievementsBar">
            <!-- ستملأ بالجافاسكريبت -->
        </div>
        
    </main>
</div>

<!-- منطقة الإشعارات الحية -->
<div class="live-notifications" id="liveNotifications"></div>
</body>
</html>
