<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - منظور الفؤاد</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Chart.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    
    <style>
        /* ============================================
   متغيرات هوية منظور الفؤاد
   ============================================ */
:root {
    /* الألوان الأساسية من الهوية */
    --primary-blue: #3b82f6;
    --secondary-blue: #2563eb;
    --dark-bg: #0f172a;
    --dark-card: #1e293b;
    --border-color: #334155;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    
    /* ألوان الأشواق التسعة */
    --longing-1: #E11D48;
    --longing-2: #EC4899;
    --longing-3: #F97316;
    --longing-4: #9333EA;
    --longing-5: #22C55E;
    --longing-6: #3B82F6;
    --longing-7: #FBBF24;
    --longing-8: #7F1D1D;
    --longing-9: #14B8A6;
    
    /* الظلال والتوهجات */
    --glow-primary: rgba(59, 130, 246, 0.3);
    --glow-secondary: rgba(16, 185, 129, 0.3);
    --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.4);
}

/* ============================================
   إعدادات عامة
   ============================================ */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Tajawal', 'Noto Kufi Arabic', sans-serif;
    background: var(--dark-bg);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
}

/* ============================================
   الخلفية الكونية
   ============================================ */
.cosmic-background {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    background: radial-gradient(ellipse at center, 
        var(--dark-bg) 0%, 
        #0a0f1c 50%, 
        #030509 100%);
}

.stars-layer {
    position: absolute;
    width: 100%;
    height: 100%;
    background-image: 
        radial-gradient(2px 2px at 20% 30%, white, transparent),
        radial-gradient(2px 2px at 60% 70%, white, transparent),
        radial-gradient(1px 1px at 50% 50%, white, transparent),
        radial-gradient(1px 1px at 80% 10%, white, transparent);
    background-size: 300px 300px;
    animation: stars-move 200s linear infinite;
    opacity: 0.5;
}

@keyframes stars-move {
    from { transform: translateX(0); }
    to { transform: translateX(-300px); }
}

/* ============================================
   رأس الصفحة - سماء الارتواء
   ============================================ */
.sky-header {
    position: relative;
    background: linear-gradient(to bottom, 
        rgba(15, 23, 42, 0.95) 0%, 
        rgba(30, 41, 59, 0.8) 100%);
    backdrop-filter: blur(10px);
    padding: 1.5rem 2rem;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 100;
}

.greeting-section {
    display: flex;
    align-items: center;
    gap: 2rem;
}

.time-of-day {
    display: flex;
    align-items: center;
    gap: 0.75rem;
}

.time-icon {
    font-size: 2rem;
    animation: float 3s ease-in-out infinite;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
}

.greeting-text {
    font-size: 1.5rem;
    font-weight: 300;
    background: linear-gradient(135deg, var(--text-primary), var(--primary-blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.soul-status {
    background: rgba(30, 41, 59, 0.5);
    border: 1px solid var(--border-color);
    border-radius: 25px;
    padding: 0.5rem 1.5rem;
    backdrop-filter: blur(10px);
    position: relative;
}

.status-glow {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, var(--glow-primary), transparent);
    border-radius: 25px;
    opacity: 0.3;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 0.3; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 0.5; transform: translate(-50%, -50%) scale(1.05); }
}

.header-actions {
    display: flex;
    gap: 1rem;
}

.header-actions button {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--text-primary);
    padding: 0.75rem;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
}

.header-actions button:hover {
    background: rgba(255, 255, 255, 0.1);
    transform: translateY(-2px);
}

.notification-count {
    position: absolute;
    top: -5px;
    right: -5px;
    background: var(--longing-1);
    color: white;
    font-size: 0.75rem;
    padding: 2px 6px;
    border-radius: 10px;
}

.rotating {
    animation: rotate 4s linear infinite;
}

@keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* ============================================
   القلب المركزي - دوائر الارتواء
   ============================================ */
.main-content {
    padding: 3rem 2rem;
    max-width: 1400px;
    margin: 0 auto;
}

.center-soul-container {
    position: relative;
    width: 400px;
    height: 400px;
    margin: 3rem auto;
}

.soul-circles {
    position: relative;
    width: 100%;
    height: 100%;
}

/* دائرة النفس */
.circle-nafs {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.rotating-slow {
    animation: rotate 60s linear infinite;
}

.circle-label {
    position: absolute;
    color: var(--text-secondary);
    font-size: 0.875rem;
    background: var(--dark-bg);
    padding: 0.25rem 0.75rem;
    border-radius: 20px;
}

.circle-nafs .circle-label {
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
}

/* دائرة الصدر */
.circle-sadr {
    position: absolute;
    width: 70%;
    height: 70%;
    top: 15%;
    left: 15%;
    border: 2px solid rgba(59, 130, 246, 0.3);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.breathing {
    animation: breathe 4s ease-in-out infinite;
}

@keyframes breathe {
    0%, 100% { transform: scale(1); opacity: 0.7; }
    50% { transform: scale(1.05); opacity: 1; }
}

.circle-sadr .circle-label {
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
}

/* دائرة القلب */
.circle-qalb {
    position: absolute;
    width: 40%;
    height: 40%;
    top: 30%;
    left: 30%;
    background: radial-gradient(circle, 
        rgba(59, 130, 246, 0.1), 
        transparent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.pulsing {
    animation: pulse-heart 2s ease-in-out infinite;
}

@keyframes pulse-heart {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
}

.circle-qalb .circle-label {
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
}

/* نقطة الفؤاد */
.fouad-core {
    position: absolute;
    width: 100px;
    height: 100px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, 
        var(--primary-blue) 0%, 
        rgba(59, 130, 246, 0.5) 50%, 
        transparent 100%);
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    animation: glow-pulse 3s infinite;
}

@keyframes glow-pulse {
    0%, 100% { box-shadow: 0 0 30px var(--glow-primary); }
    50% { box-shadow: 0 0 50px var(--glow-primary), 0 0 80px var(--glow-primary); }
}

.core-light {
    position: absolute;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, 
        rgba(255, 255, 255, 0.2), 
        transparent);
    border-radius: 50%;
    animation: shimmer 2s infinite;
}

@keyframes shimmer {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.6; }
}

.irtiwaa-percentage {
    font-size: 1.75rem;
    font-weight: bold;
    color: var(--text-primary);
    text-shadow: 0 0 20px var(--glow-primary);
    z-index: 2;
}

.irtiwaa-label {
    font-size: 0.875rem;
    color: var(--text-secondary);
    z-index: 2;
}

/* خطوط الطاقة */
.energy-lines {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.energy-path {
    stroke: rgba(59, 130, 246, 0.2);
    stroke-width: 1;
    fill: none;
    stroke-dasharray: 5 10;
    animation: dash-flow 3s linear infinite;
}

@keyframes dash-flow {
    from { stroke-dashoffset: 0; }
    to { stroke-dashoffset: -15; }
}

        /* ============================================
   المحطات السبع - رحلة الارتواء
   ============================================ */
.journey-map {
    margin-top: 4rem;
    padding: 2rem;
    background: rgba(30, 41, 59, 0.3);
    border-radius: 20px;
    border: 1px solid var(--border-color);
    backdrop-filter: blur(10px);
}

.section-title {
    text-align: center;
    font-size: 1.5rem;
    margin-bottom: 2rem;
    background: linear-gradient(135deg, var(--primary-blue), var(--longing-5));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.stations {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 2rem 0;
    position: relative;
}

.stations::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, 
        var(--longing-1), var(--longing-2), var(--longing-3), 
        var(--longing-4), var(--longing-5), var(--longing-6), 
        var(--longing-7));
    opacity: 0.3;
    z-index: 0;
}

.station {
    position: relative;
    text-align: center;
    z-index: 1;
    cursor: pointer;
    transition: all 0.3s;
}

.station-icon {
    width: 80px;
    height: 80px;
    margin: 0 auto 0.5rem;
    background: var(--dark-card);
    border: 2px solid var(--border-color);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    transition: all 0.3s;
}

.station.active .station-icon {
    background: rgba(34, 197, 94, 0.1);
    border-color: var(--longing-5);
    animation: glow-pulse 2s infinite;
}

.station.current .station-icon {
    background: rgba(59, 130, 246, 0.2);
    border-color: var(--primary-blue);
    transform: scale(1.2);
}

.station.locked .station-icon {
    opacity: 0.3;
    filter: grayscale(100%);
}

.station-name {
    font-size: 0.875rem;
    color: var(--text-secondary);
    margin-top: 0.5rem;
}

.station.active .station-name {
    color: var(--longing-5);
}

.station.current .station-name {
    color: var(--primary-blue);
    font-weight: bold;
}

.current-indicator {
    position: absolute;
    bottom: -25px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--primary-blue);
    color: white;
    padding: 0.25rem 0.75rem;
    border-radius: 15px;
    font-size: 0.75rem;
    white-space: nowrap;
    animation: bounce 2s infinite;
}

@keyframes bounce {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-5px); }
}

/* ============================================
   اللوحات الجانبية
   ============================================ */
.side-panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2rem;
    margin-top: 3rem;
}

.left-panel, .right-panel {
    background: var(--dark-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 1.5rem;
    box-shadow: var(--shadow-lg);
}

.panel-title {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 1.25rem;
    margin-bottom: 1.5rem;
    color: var(--text-primary);
}

.panel-title i {
    color: var(--primary-blue);
}

/* بئر الارتواء */
.well-visual {
    width: 200px;
    height: 250px;
    margin: 1.5rem auto;
    position: relative;
    background: linear-gradient(to bottom, 
        var(--dark-bg) 0%, 
        #1a2332 100%);
    border-radius: 0 0 100px 100px;
    border: 3px solid var(--border-color);
    overflow: hidden;
}

.water-level {
    position: absolute;
    bottom: 0;
    width: 100%;
    background: linear-gradient(to bottom, 
        rgba(59, 130, 246, 0.6), 
        rgba(16, 185, 129, 0.4));
    transition: height 2s cubic-bezier(0.4, 0, 0.2, 1);
}

.water-surface {
    position: absolute;
    top: 0;
    width: 100%;
    height: 20px;
    background: linear-gradient(to right, 
        transparent, 
        rgba(255, 255, 255, 0.2), 
        transparent);
    animation: wave 3s ease-in-out infinite;
}

@keyframes wave {
    0%, 100% { transform: translateX(-50%); }
    50% { transform: translateX(50%); }
}

.water-sparkles {
    position: absolute;
    top: 10px;
    width: 100%;
    height: 30px;
}

.water-sparkles::before,
.water-sparkles::after {
    content: '✨';
    position: absolute;
    animation: sparkle 2s infinite;
}

.water-sparkles::before {
    left: 30%;
    animation-delay: 0s;
}

.water-sparkles::after {
    right: 30%;
    animation-delay: 1s;
}

@keyframes sparkle {
    0%, 100% { opacity: 0; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(-10px); }
}

.well-stones {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 30px;
    background: repeating-linear-gradient(
        90deg,
        var(--border-color) 0px,
        var(--border-color) 10px,
        transparent 10px,
        transparent 20px
    );
    opacity: 0.3;
}

.points-breakdown {
    margin-top: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

.point-type {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.75rem;
    background: rgba(255, 255, 255, 0.02);
    border-radius: 10px;
    transition: all 0.3s;
}

.point-type:hover {
    background: rgba(255, 255, 255, 0.05);
    transform: translateX(5px);
}

.point-icon {
    font-size: 1.5rem;
}

.point-name {
    flex: 1;
    margin-left: 1rem;
    color: var(--text-secondary);
}

.point-value {
    font-size: 1.25rem;
    font-weight: bold;
    color: var(--primary-blue);
}

/* عجلة اليوم */
.day-wheel {
    width: 200px;
    height: 200px;
    margin: 1.5rem auto;
    position: relative;
}

.wheel-svg {
    width: 100%;
    height: 100%;
}

.current-time-indicator {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 4px;
    height: 90px;
    background: var(--primary-blue);
    transform-origin: center bottom;
    transform: translate(-50%, -100%);
    border-radius: 2px;
    box-shadow: 0 0 10px var(--glow-primary);
}

.current-time-indicator::before {
    content: '';
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 10px;
    height: 10px;
    background: var(--primary-blue);
    border-radius: 50%;
    box-shadow: 0 0 20px var(--glow-primary);
}

.upcoming-activities {
    margin-top: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
}

.activity-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.75rem;
    background: rgba(255, 255, 255, 0.02);
    border-radius: 10px;
    border-left: 3px solid transparent;
    transition: all 0.3s;
}

.activity-item.current {
    border-left-color: var(--primary-blue);
    background: rgba(59, 130, 246, 0.05);
}

.activity-item.completed {
    opacity: 0.6;
}

.activity-item:hover {
    background: rgba(255, 255, 255, 0.05);
    transform: translateX(5px);
}

.activity-time {
    font-size: 0.875rem;
    color: var(--text-secondary);
}

.activity-name {
    flex: 1;
    margin: 0 1rem;
    color: var(--text-primary);
}

.activity-status {
    font-size: 0.875rem;
}

.activity-status.completed {
    color: var(--longing-5);
}

/* ============================================
   شريط الإنجازات
   ============================================ */
.achievements-bar {
    margin-top: 3rem;
    padding: 1.5rem;
    background: var(--dark-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    display: flex;
    gap: 1.5rem;
    overflow-x: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border-color) transparent;
}

.achievement-badge {
    min-width: 100px;
    text-align: center;
    padding: 1rem;
    background: rgba(255, 255, 255, 0.02);
    border-radius: 12px;
    transition: all 0.3s;
    cursor: pointer;
    position: relative;
}

.achievement-badge:hover {
    background: rgba(255, 255, 255, 0.05);
    transform: translateY(-5px);
}

.achievement-badge.new::before {
    content: 'جديد';
    position: absolute;
    top: -10px;
    right: -10px;
    background: var(--longing-1);
    color: white;
    font-size: 0.625rem;
    padding: 2px 8px;
    border-radius: 10px;
    animation: pulse 2s infinite;
}

.badge-icon {
    font-size: 2.5rem;
    margin-bottom: 0.5rem;
}

.badge-name {
    font-size: 0.875rem;
    color: var(--text-secondary);
}

/* ============================================
   منطقة الإشعارات الحية
   ============================================ */
.live-notifications {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    width: 350px;
    z-index: 1000;
}

.notification-item {
    background: rgba(30, 41, 59, 0.95);
    backdrop-filter: blur(10px);
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 0.75rem;
    border-left: 3px solid var(--longing-5);
    animation: slide-in 0.5s ease;
    display: flex;
    align-items: center;
    gap: 1rem;
}

@keyframes slide-in {
    from {
        transform: translateX(400px);
        opacity: 0;
    }
    to {
        transform: translateX(0);
        opacity: 1;
    }
}

.notif-icon {
    font-size: 1.5rem;
}

.notif-content {
    flex: 1;
}

.notif-text {
    color: var(--text-primary);
    font-size: 0.875rem;
    display: block;
    margin-bottom: 0.25rem;
}

.notif-time {
    color: var(--text-secondary);
    font-size: 0.75rem;
}

/* ============================================
   Responsive
   ============================================ */
@media (max-width: 768px) {
    .side-panels {
        grid-template-columns: 1fr;
    }
    
    .stations {
        flex-direction: column;
        gap: 2rem;
    }
    
    .stations::before {
        width: 2px;
        height: 100%;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
    }
    
    .center-soul-container {
        width: 300px;
        height: 300px;
    }
    
    .live-notifications {
        width: 90%;
        right: 5%;
        left: 5%;
    }
}

        /* ============================================
   الجزيئات النورانية العائمة
   ============================================ */
.energy-particles {
    position: absolute;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

.particle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: radial-gradient(circle, rgba(59, 130, 246, 0.8), transparent);
    border-radius: 50%;
    pointer-events: none;
}

@keyframes float-up {
    0% {
        transform: translateY(100vh) scale(0);
        opacity: 0;
    }
    10% {
        opacity: 1;
    }
    90% {
        opacity: 1;
    }
    100% {
        transform: translateY(-100vh) scale(1);
        opacity: 0;
    }
}

/* إضافة توهج للعناصر عند التفاعل */
.interactive-glow {
    position: relative;
    overflow: hidden;
}

.interactive-glow::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, var(--glow-primary), transparent);
    transform: translate(-50%, -50%) scale(0);
    opacity: 0;
    transition: all 0.5s;
    pointer-events: none;
}

.interactive-glow:hover::before {
    transform: translate(-50%, -50%) scale(2);
    opacity: 0.3;
}

/* تأثير الموجات عند النقر */
.ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.5);
    transform: scale(0);
    animation: ripple-effect 0.6s ease-out;
    pointer-events: none;
}

@keyframes ripple-effect {
    to {
        transform: scale(4);
        opacity: 0;
    }
}

/* إضافة نبضات للإشعارات */

}

function updateGreeting() {
    const hour = new Date().getHours();
    const greetingElement = document.getElementById('greetingText');
    const iconElement = document.getElementById('timeIcon');
    const userName = userData?.personalInfo?.name || 'ضيف الارتواء';
    
    let greeting, icon;
    
    if (hour < 6) {
        greeting = `ليلة هادئة يا ${userName}`;
        icon = '🌙';
        document.body.className = 'night-theme';
    } else if (hour < 12) {
        greeting = `صباح النور يا ${userName}`;
        icon = '🌅';
        document.body.className = 'morning-theme';
    } else if (hour < 18) {
        greeting = `يوم مبارك يا ${userName}`;
        icon = '☀️';
        document.body.className = 'day-theme';
    } else {
        greeting = `مساء الخير يا ${userName}`;
        icon = '🌆';
        document.body.className = 'evening-theme';
    }
    
    greetingElement.textContent = greeting;
    iconElement.textContent = icon;
    
    // تحديث حالة المستخدم
    const stageElement = document.getElementById('userStage');
    const journeyTitle = userData?.journeyPoints?.stageTitle || userData?.accountStatus?.journeyTitle || 'ملبي النداء';
    stageElement.textContent = journeyTitle;
}

// ============================================
// تحديث دوائر الارتواء
// ============================================
function updateSoulCircles() {
    // حساب نسبة الارتواء
    let irtiwaaPercent = 0;
    
    if (userData?.progress) {
        const courses = Object.values(userData.progress);
        if (courses.length > 0) {
            const totalProgress = courses.reduce((sum, course) => sum + (course.percentage || 0), 0);
            irtiwaaPercent = Math.round(totalProgress / courses.length);
        }
    }
    
    // إذا لا توجد دورات، احسب من النقاط
    if (irtiwaaPercent === 0 && userData?.journeyPoints?.balance) {
        irtiwaaPercent = Math.min(100, Math.round(userData.journeyPoints.balance / 50));
    }
    
    const percentElement = document.getElementById('irtiwaaPercent');
    percentElement.textContent = irtiwaaPercent + '%';
    
    // تحديث لون القلب حسب النسبة
    const fouadCore = document.querySelector('.fouad-core');
    if (irtiwaaPercent > 70) {
        fouadCore.style.background = `radial-gradient(circle, var(--longing-5) 0%, rgba(34, 197, 94, 0.5) 50%, transparent 100%)`;
    } else if (irtiwaaPercent > 40) {
        fouadCore.style.background = `radial-gradient(circle, var(--primary-blue) 0%, rgba(59, 130, 246, 0.5) 50%, transparent 100%)`;
    }
}

// ============================================
// تحديث محطات الرحلة
// ============================================
function updateJourneyStations() {
    const stationsContainer = document.getElementById('stationsContainer');
    const currentStage = userData?.journeyPoints?.stage || userData?.accountStatus?.journeyStage || 1;
    
    const stations = [
        { id: 1, name: 'النداء', icon: '🌱' },
        { id: 2, name: 'اللقاء', icon: '🌿' },
        { id: 3, name: 'البناء', icon: '🌳' },
        { id: 4, name: 'الانتماء', icon: '🍃' },
        { id: 5, name: 'النماء', icon: '🌸' },
        { id: 6, name: 'النبلاء', icon: '✨' },
        { id: 7, name: 'الإحياء', icon: '🌟' }
    ];
    
    stationsContainer.innerHTML = stations.map(station => {
        let className = 'station';
        if (station.id < currentStage) className += ' active';
        if (station.id === currentStage) className += ' current';
        if (station.id > currentStage) className += ' locked';
        
        return `
            <div class="${className}" data-stage="${station.id}">
                <div class="station-icon">${station.icon}</div>
                <div class="station-name">${station.name}</div>
                ${station.id === currentStage ? '<div class="current-indicator">أنت هنا</div>' : ''}
            </div>
        `;
    }).join('');
}

function updateWellLevel() {
    const journeyPoints = userData?.journeyPoints?.balance || 0;
    const walletPoints = userData?.walletPoints?.balance || 0;
    
    // تحديث النقاط
    document.getElementById('journeyPoints').textContent = journeyPoints;
    document.getElementById('walletPoints').textContent = walletPoints;
    
    // حساب مستوى الماء (من 0 إلى 100%)
    const maxPoints = 10000; // الحد الأقصى للعرض
    const totalPoints = journeyPoints + walletPoints;
    const waterPercent = Math.min(100, (totalPoints / maxPoints) * 100);
    
    // تحديث مستوى الماء مع أنيميشن
    const waterLevel = document.getElementById('waterLevel');
    waterLevel.style.height = waterPercent + '%';
    
    // إضافة فقاعات إذا كان المستوى عالي
    if (waterPercent > 50) {
        createBubbles();
    }
}

    activitiesContainer.innerHTML = activities.map(activity => {
        let className = 'activity-item';
        let status = '';
        
        if (activity.hour < currentHour) {
            className += ' completed';
            status = '<span class="activity-status completed">✓</span>';
        } else if (activity.hour === currentHour) {
            className += ' current';
            status = '<span class="activity-status" style="color: var(--primary-blue);">جاري</span>';
        } else {
            status = '<span class="activity-status" style="color: var(--text-secondary);">قادم</span>';
        }
        
        return `
            <div class="${className}">
                <span class="activity-time">${activity.time}</span>
                <span class="activity-name">${activity.name}</span>
                ${status}
            </div>
        `;
    }).join('');
    
    // تحديث مؤشر الوقت على العجلة
    updateTimeWheel();
}

// ============================================
// تحديث عجلة الوقت
// ============================================
function updateTimeWheel() {
    const now = new Date();
    const hours = now.getHours();
    const minutes = now.getMinutes();
    const angle = ((hours % 12) * 30) + (minutes * 0.5) - 90;
    
    const indicator = document.getElementById('timeIndicator');
    indicator.style.transform = `translate(-50%, -100%) rotate(${angle}deg)`;
}

function updateAchievements() {
    const achievementsBar = document.getElementById('achievementsBar');

        achievementsBar.innerHTML = '<p style="color: var(--text-secondary); text-align: center; width: 100%;">لا توجد إنجازات بعد</p>';

                <div class="badge-name">${badge.name}</div>

// ============================================
// إضافة تأثير الموجات عند النقر
// ============================================
function addRippleEffect(element) {
    element.addEventListener('click', function(e) {
        const ripple = document.createElement('span');
        ripple.className = 'ripple';
        
        const rect = this.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        const x = e.clientX - rect.left - size / 2;
        const y = e.clientY - rect.top - size / 2;
        
        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.left = x + 'px';
        ripple.style.top = y + 'px';
        
        this.appendChild(ripple);
        
        setTimeout(() => ripple.remove(), 600);
    });
}

// تحديث الإحصائيات السريعة
// ============================================
function updateQuickStats() {
    // حساب الأيام المتتالية
    const lastLogin = userData?.timestamps?.updatedAt;
    let streakDays = 1;
    
    if (lastLogin) {
        const lastDate = new Date(lastLogin);
        const today = new Date();
        const diffDays = Math.floor((today - lastDate) / (1000 * 60 * 60 * 24));
        streakDays = diffDays <= 1 ? (userData.streakDays || 1) : 1;
    }
    
    // حساب ساعات التعلم
    const totalMinutes = userData?.engagement?.totalStudyHours || 0;
    const hours = Math.floor(totalMinutes / 60);
    
    // عدد الإنجازات
    const badges = userData?.badges?.length || 0;
    
    // الدورات المكتملة
    const completedCount = (userData?.enrollments || []).filter(e => 
        e.progress?.overallProgress === 100
    ).length;
    
    // تحديث العرض
    document.getElementById('streakDays').textContent = streakDays;
    document.getElementById('totalHours').textContent = hours;
    document.getElementById('totalBadges').textContent = badges;
    document.getElementById('completedCourses').textContent = completedCount;
}

        
// ============================================
// فحص الجلسات المباشرة
// ============================================
async function checkLiveSessions(courseId) {
    try {
        const sessionsSnapshot = await db.collection('liveSessions')
            .where('courseId', '==', courseId)
            .where('status', '==', 'active')
            .get();
        
        return {
            isLive: !sessionsSnapshot.empty,
            count: sessionsSnapshot.size
        };
    } catch (error) {
        console.log('خطأ في فحص الجلسات:', error);
        return { isLive: false, count: 0 };
    }
}

        
// ============================================
// فحص الشارات الجديدة
// ============================================
let lastBadgeCount = 0;

function checkForNewBadges() {
    const currentBadges = userData?.badges || [];
    
    if (lastBadgeCount === 0) {
        lastBadgeCount = currentBadges.length;
        return;
    }
    
    if (currentBadges.length > lastBadgeCount) {
        const newBadge = currentBadges[currentBadges.length - 1];
        showNotification(`مبروك! حصلت على شارة "${newBadge.name}"`, 'achievement');
        lastBadgeCount = currentBadges.length;
    }
}
