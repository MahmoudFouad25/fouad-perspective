<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>آراء القرّاء — المرايا السبع</title>
<link href="https://fonts.googleapis.com/css2?family=Zain:wght@400;700;800;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F0E6;--card:#FCF8F1;--bg2:#EFE6D8;--txt:#2A221C;--txt2:#5F5246;--muted:#9C8C7B;--ink:#163A2C;--ink2:#255C45;--gold:#A87A2E;--line:rgba(42,34,28,.10);--line2:rgba(168,122,46,.28)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:'Zain',serif;font-size:18px;line-height:1.8}
button,input,select{font-family:inherit;font-size:inherit}
.wrap{max-width:980px;margin:0 auto;padding:28px 18px 80px}
h1{font-weight:900;font-size:40px;color:var(--ink);line-height:1.2}
.sub{color:var(--muted);font-size:16px;margin-bottom:18px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 22px}
.bar select,.bar input{padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt)}
.btn{padding:8px 16px;border-radius:12px;border:0;background:var(--ink);color:#F6F0E6;font-weight:700;cursor:pointer}
.btn.sec{background:var(--bg2);color:var(--txt2)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}
.st{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.st b{display:block;font-size:30px;font-weight:900;color:var(--ink);line-height:1.2}.st span{font-size:14px;color:var(--muted)}
h2{font-weight:900;font-size:26px;color:var(--gold);margin:28px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
h3{font-weight:800;font-size:18px;color:var(--ink2);margin:16px 0 8px}
.it{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:10px}
.q{font-family:'Amiri',serif;font-size:17px;line-height:1.9;border-inline-start:4px solid var(--gold);padding-inline-start:12px;color:var(--txt2);margin-bottom:6px}
.t{white-space:pre-line}
.m{display:flex;flex-wrap:wrap;gap:10px;font-size:14px;color:var(--muted);margin-top:6px}
.m a{color:var(--ink2)}
.qa{margin:6px 0}.qa dt{font-size:14px;font-weight:800;color:var(--ink2)}.qa dd{white-space:pre-line;margin-bottom:6px}
.chip{display:inline-block;padding:0 10px;border-radius:999px;background:rgba(168,122,46,.1);color:var(--gold);font-weight:800;font-size:14px}
.empty{text-align:center;color:var(--muted);padding:60px 10px}
.note{font-size:14px;color:var(--muted);margin-top:30px;border-top:1px dashed var(--line2);padding-top:10px}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}h1{font-size:32px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>آراء القرّاء</h1>
  <p class="sub">المرايا السبع · ما أرسله القرّاء من رابط القراءة</p>
  <div class="bar">
    <select id="fCh"><option value="">كلّ المرايا</option></select>
    <select id="fKind"><option value="">كلّ الأنواع</option><option value="chapter">رأي في مرآة كاملة</option><option value="line">تعليق على موضع</option><option value="general">رأي عامّ</option></select>
    <input id="fQ" placeholder="بحث في الآراء أو الأسماء…">
    <button class="btn" id="reload">تحديث</button>
    <button class="btn sec" id="export">تنزيل كملفّ نصّي</button>
  </div>
  <div class="stats" id="stats"></div>
  <div id="out"><div class="empty">جارٍ التحميل…</div></div>
  <p class="note">يُفتح كلّ موضعٍ على الجملة نفسها في رابط القراءة. هذه الصفحة غير مفهرسة في محرّكات البحث، ولا يصل إليها إلا من يعرف رابطها.</p>
</div>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyDj0bV5gsyRbqpxzW0Zd9wjYmq53-Xdj3w",authDomain:"fouad-perspective.firebaseapp.com",projectId:"fouad-perspective",storageBucket:"fouad-perspective.firebasestorage.app",messagingSenderId:"1068763865336",appId:"1:1068763865336:web:b791abcd22d536aedd5b0d"});
var db=firebase.firestore(),ALL=[];
var AR='٠١٢٣٤٥٦٧٨٩';function ar(n){return String(n).replace(/[0-9]/g,function(d){return AR[d]})}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var Q={found:'هل وجدتَ نفسك فيما قرأت؟',heavy:'أين ثقل عليك الكلام أو غمض؟',touch:'أيّ موضعٍ لمسك أكثر؟',more:'كلمة أخيرة'};
function when(x){var d=x&&x.toDate?x.toDate():null;return d?d.toLocaleString('ar-EG',{day:'numeric',month:'long',hour:'numeric',minute:'2-digit'}):''}
function load(){
  document.getElementById('out').innerHTML='<div class="empty">جارٍ التحميل…</div>';
  db.collection('maraya_feedback').get().then(function(s){
    ALL=[];s.forEach(function(d){var x=d.data();x._id=d.id;ALL.push(x)});
    ALL.sort(function(a,b){return((b.at&&b.at.seconds)||0)-((a.at&&a.at.seconds)||0)});
    var chs={};ALL.forEach(function(x){if(x.chapter)chs[x.chapter]=x.chapterTitle||x.chapter});
    var sel=document.getElementById('fCh'),cur=sel.value;sel.innerHTML='<option value="">كلّ المرايا</option>'+Object.keys(chs).sort().map(function(k){return'<option value="'+k+'">'+esc(chs[k])+'</option>'}).join('');sel.value=cur;
    render();
  }).catch(function(e){document.getElementById('out').innerHTML='<div class="empty">تعذّر التحميل: '+esc(e.message||e)+'</div>'});
}
function filtered(){
  var c=document.getElementById('fCh').value,k=document.getElementById('fKind').value,q=document.getElementById('fQ').value.trim();
  return ALL.filter(function(x){if(c&&x.chapter!==c)return false;if(k&&x.kind!==k)return false;if(q&&JSON.stringify(x).indexOf(q)<0)return false;return true});
}
function render(){
  var L=filtered(),people={};ALL.forEach(function(x){people[x.rid]=1});
  document.getElementById('stats').innerHTML=
    '<div class="st"><b>'+ar(ALL.length)+'</b><span>كلّ الآراء</span></div>'+
    '<div class="st"><b>'+ar(Object.keys(people).length)+'</b><span>قارئ</span></div>'+
    '<div class="st"><b>'+ar(ALL.filter(function(x){return x.kind==='chapter'}).length)+'</b><span>رأي في مرآة كاملة</span></div>'+
    '<div class="st"><b>'+ar(ALL.filter(function(x){return x.kind==='line'}).length)+'</b><span>تعليق على موضع</span></div>';
  if(!L.length){document.getElementById('out').innerHTML='<div class="empty">لا آراء بعد.</div>';return}
  var groups={};L.forEach(function(x){var g=x.chapterTitle||'رأي عامّ';(groups[g]=groups[g]||[]).push(x)});
  var h='';
  Object.keys(groups).forEach(function(g){
    var arr=groups[g];h+='<h2>'+esc(g)+' <span class="chip">'+ar(arr.length)+'</span></h2>';
    var ch=arr.filter(function(x){return x.kind==='chapter'}),ln=arr.filter(function(x){return x.kind==='line'}).sort(function(a,b){return(a.block||0)-(b.block||0)}),gn=arr.filter(function(x){return x.kind==='general'});
    if(ch.length){h+='<h3>آراء في المرآة كاملة</h3>';ch.forEach(function(x){h+='<div class="it"><dl class="qa">';Object.keys(Q).forEach(function(k){if(x[k])h+='<dt>'+Q[k]+'</dt><dd>'+esc(x[k])+'</dd>'});h+='</dl>'+meta(x)+'</div>'})}
    if(ln.length){h+='<h3>تعليقات على مواضع بعينها</h3>';ln.forEach(function(x){h+='<div class="it">'+(x.quote?'<div class="q">«'+esc(x.quote)+'»</div>':'')+'<div class="t">'+esc(x.text)+'</div>'+meta(x)+'</div>'})}
    if(gn.length){h+='<h3>آراء عامّة</h3>';gn.forEach(function(x){h+='<div class="it"><div class="t">'+esc(x.text)+'</div>'+meta(x)+'</div>'})}
  });
  document.getElementById('out').innerHTML=h;
}
function meta(x){return'<div class="m"><span>'+esc(x.name||'بلا اسم')+'</span><span>'+when(x.at)+'</span>'+(x.chapter&&x.block!=null?'<a href="index.html?ch='+x.chapter+'#b'+x.block+'" target="_blank">افتح الموضع</a>':'')+'</div>'}
function exportTxt(){
  var out='آراء القرّاء — المرايا السبع\n\n';
  filtered().forEach(function(x){
    out+='━━ '+(x.chapterTitle||'رأي عامّ')+' · '+(x.name||'بلا اسم')+' · '+when(x.at)+'\n';
    if(x.kind==='chapter')Object.keys(Q).forEach(function(k){if(x[k])out+=Q[k]+'\n   '+x[k]+'\n'});
    else{if(x.quote)out+='«'+x.quote+'»\n';out+=x.text+'\n'}
    out+='\n';
  });
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'text/plain;charset=utf-8'}));a.download='آراء القرّاء — المرايا السبع.txt';a.click();
}
['fCh','fKind'].forEach(function(id){document.getElementById(id).addEventListener('change',render)});
document.getElementById('fQ').addEventListener('input',render);
document.getElementById('reload').addEventListener('click',load);
document.getElementById('export').addEventListener('click',exportTxt);
load();
</script>
</body>
</html>
