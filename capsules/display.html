<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reignite — شاشة العرض</title>
    <link rel="stylesheet" href="css/main.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        body.display-page { overflow: hidden; cursor: none; }

        .display-screen {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        .display-content-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4vh 4vw;
            overflow: hidden;
        }

        .display-content-wrap.has-narrow {
            max-width: 90vw;
            margin: 0 auto;
        }

        .display-h1 {
            font-size: clamp(2.5rem, 6vw, 5rem);
            font-weight: 800;
            line-height: 1.2;
            text-align: center;
            margin-bottom: 1rem;
        }

        .display-h2 {
            font-size: clamp(2rem, 4.5vw, 3.5rem);
            font-weight: 700;
            line-height: 1.3;
            text-align: center;
        }

        .display-subtitle {
            font-size: clamp(1.25rem, 2.5vw, 2rem);
            color: var(--text-secondary);
            text-align: center;
            margin-top: 1rem;
        }

        .display-massive {
            font-size: clamp(3rem, 10vw, 8rem);
            font-weight: 900;
            line-height: 1.1;
            text-align: center;
        }

        .display-very-massive {
            font-size: clamp(5rem, 16vw, 12rem);
            font-weight: 900;
            line-height: 1;
            text-align: center;
        }

        .display-question {
            font-size: clamp(1.75rem, 4vw, 3rem);
            font-weight: 600;
            line-height: 1.4;
            text-align: center;
            color: var(--text-primary);
            max-width: 1200px;
            margin: 0 auto;
        }

        .display-timer-bar {
            position: fixed;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }

        .display-charter {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            max-width: 1400px;
        }

        @media (max-width: 1024px) {
            .display-charter { grid-template-columns: 1fr; }
        }

        .display-charter-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-gold);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            text-align: center;
        }

        .display-charter-num {
            font-size: 4rem;
            color: var(--gold);
            font-weight: 900;
            line-height: 1;
            margin-bottom: 1rem;
        }

        .display-charter-title {
            font-size: 1.75rem;
            color: var(--gold-light);
            font-weight: 700;
            margin-bottom: 0.75rem;
        }

        .display-charter-body {
            color: var(--text-secondary);
            font-size: 1.15rem;
        }

        .display-compare {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            max-width: 1400px;
        }

        .display-compare-col {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            border: 1px solid var(--border-subtle);
        }

        .display-compare-col h3 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .display-compare-col li {
            font-size: 1.25rem;
            padding: 0.6rem 0;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-subtle);
            list-style: none;
        }

        .display-compare-col li:last-child { border-bottom: none; }
        .display-compare-col li::before { content: attr(data-icon) " "; }

        .display-three-circles {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .display-circle {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 3px solid;
            background: rgba(255, 255, 255, 0.02);
            padding: 1rem;
            text-align: center;
        }

        .display-circle h4 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .display-circle p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .display-profile {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 4rem;
            max-width: 1100px;
            align-items: center;
        }

        .display-profile-photo {
            width: 280px;
            height: 280px;
            border-radius: 24px;
            background: linear-gradient(135deg, var(--bg-cosmic-2), var(--bg-cosmic-3));
            border: 2px solid var(--border-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8rem;
            color: var(--gold);
        }

        .display-profile-bullets li {
            font-size: 1.5rem;
            padding: 0.5rem 0;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border-subtle);
            list-style: none;
        }

        .display-profile-bullets li::before {
            content: "▪ ";
            color: var(--gold);
            margin-left: 0.5rem;
        }

        .display-dark-narrative {
            background: #000;
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 5vh 5vw;
            text-align: center;
            z-index: 5;
        }

        .display-dark-narrative h2 {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 700;
            color: var(--gold-light);
            margin-bottom: 3rem;
        }

        .display-dark-narrative p {
            font-size: clamp(1.5rem, 2.5vw, 2rem);
            color: var(--text-secondary);
            line-height: 1.8;
            max-width: 1100px;
            margin: 0 auto 1rem;
        }

        .display-six-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            max-width: 1400px;
        }

        @media (max-width: 1024px) {
            .display-six-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .display-six-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
        }

        .display-six-card .num {
            font-size: 3rem;
            color: var(--gold);
            font-weight: 800;
        }

        .display-six-card .label {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0.5rem 0;
            min-height: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .display-six-card .tag {
            display: inline-block;
            padding: 0.3rem 0.75rem;
            background: rgba(251, 191, 36, 0.15);
            color: var(--gold-light);
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .display-chart-wrap {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            border-radius: 24px;
            padding: 2rem;
            max-width: 900px;
            width: 100%;
        }

        .display-pie-wrap {
            max-width: 700px;
        }

        .display-radar-wrap {
            max-width: 800px;
        }

        .display-axis-bars {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 2rem;
            max-width: 900px;
            margin: 2rem auto;
        }

        .display-axis-bar {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
        }

        .display-axis-bar .axis-name {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }

        .display-axis-bar .axis-count {
            font-size: 3rem;
            font-weight: 800;
            color: var(--gold);
        }

        .display-paths {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            max-width: 1300px;
        }

        .display-path-group {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 2rem;
            border-top: 5px solid;
            text-align: center;
        }

        .display-path-group h4 {
            font-size: 1.75rem;
            margin-bottom: 1rem;
        }

        .display-path-group li {
            font-size: 1.25rem;
            padding: 0.5rem 0;
            color: var(--text-secondary);
            list-style: none;
        }

        .display-verse {
            text-align: center;
            max-width: 1200px;
        }

        .display-verse .verse-text {
            font-family: 'Amiri', serif;
            font-size: clamp(2.5rem, 5vw, 4rem);
            line-height: 2;
            color: var(--gold-light);
        }

        .display-verse .verse-ref {
            color: var(--gold);
            font-size: 1.5rem;
            margin-top: 1rem;
        }

        .display-corner-info {
            position: fixed;
            bottom: 1rem;
            left: 1rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            z-index: 100;
        }

        .display-corner-info .live::before {
            content: '🔴 ';
        }
    </style>
</head>
<body class="display-page">
    <div class="stars-background" id="starsBackground"></div>

    <div id="timerBar" class="display-timer-bar hidden">
        <div class="timer timer-massive" id="timerDisplay">00:00</div>
    </div>

    <div class="display-screen" id="displayScreen">
        <div class="display-content-wrap" id="displayContentWrap">
            <div id="displayContent">
                <div class="text-center">
                    <div class="loading-spinner mx-auto"></div>
                    <p class="mt-3 subtitle">في انتظار المدرّب...</p>
                </div>
            </div>
        </div>
    </div>

    <div class="display-corner-info">
        <div class="live">Reignite</div>
        <div id="participantCountDisplay" style="margin-top: 0.25rem;">0 مشارك</div>
    </div>

    <script src="./js/firebase-config.js"></script>
    <script src="js/training-session.js"></script>
    <script src="js/session-data.js"></script>
    <script src="js/display.js"></script>
</body>
</html>
