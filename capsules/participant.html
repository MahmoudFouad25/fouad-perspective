<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Reignite — المشارك</title>
    <link rel="stylesheet" href="css/main.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body class="participant-page">
    <div class="stars-background" id="starsBackground"></div>

    <!-- Timer top bar -->
    <div id="timerBar" class="timer-top-bar hidden">
        <div class="timer" id="timerDisplay">00:00</div>
    </div>

    <!-- Registration Screen -->
    <div id="registrationScreen" class="fade-in">
        <div class="card card-glow">
            <div class="text-center mb-3">
                <h1 class="gold-text" style="font-size: 2.5rem; font-weight: 800;">Reignite</h1>
                <p class="subtitle">Burnout to Brilliance</p>
            </div>

            <!-- Loader visible while we attempt to resume from URL code -->
            <div id="resumeLoader" class="text-center hidden mt-3">
                <div class="loading-spinner" style="margin: 0 auto 1rem;"></div>
                <p class="subtitle">بنفتح رحلتك...</p>
            </div>

            <!-- Main registration form -->
            <div id="registrationForm">
                <h3 class="mt-3 mb-2 text-center">أهلاً بك في اللقاء</h3>
                <p class="subtitle text-center mb-3">اختار اسم وهمي يخصك إنت بس — حد غيرك مش هيعرفه</p>

                <label for="aliasInput">الاسم الوهمي</label>
                <input type="text" id="aliasInput" placeholder="مثلاً: نور، س، فجر، 7..." maxlength="20" autocomplete="off">

                <button class="btn btn-gold btn-large w-full mt-3" onclick="registerNow()">
                    ابدأ الرحلة
                </button>

                <div class="divider"></div>

                <!-- Returning user via code -->
                <details>
                    <summary style="cursor: pointer; color: var(--text-muted); text-align: center; font-size: 0.9rem;">
                        بدأت قبل كده على جهاز تاني؟ افتح رحلتك بالكود
                    </summary>
                    <div style="margin-top: 1rem;">
                        <label for="codeInput">كود الرحلة (XXXX-XXXX)</label>
                        <input type="text" id="codeInput" placeholder="ABCD-1234" maxlength="9" style="font-family: monospace; letter-spacing: 2px; text-align: center;">
                        <button class="btn btn-outline w-full mt-2" onclick="resumeWithCode()">
                            افتح رحلتي
                        </button>
                    </div>
                </details>
            </div>
        </div>
    </div>

    <!-- Dynamic content screen (after registration) -->
    <div id="dynamicScreen" class="hidden">
        <div class="welcome-banner">
            مرحباً <span id="welcomeName" class="alias">—</span>
        </div>

        <div id="resumeBar" class="resume-bar hidden">
            <div style="font-weight: 600; margin-bottom: 0.5rem;">
                🔐 رحلتك محفوظة
            </div>
            <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.5rem;">
                أي وقت تقدر ترجع من نفس الرابط أو من أي جهاز بالكود ده:
            </p>
            <div class="code-display" id="codeDisplay">----·----</div>
            <div class="flex gap-2" style="justify-content: center; flex-wrap: wrap;">
                <button class="btn btn-ghost btn-small" onclick="copyLink()">📋 انسخ الرابط</button>
                <button class="btn btn-ghost btn-small" onclick="copyCode()">🔑 انسخ الكود</button>
                <button class="btn btn-ghost btn-small" onclick="document.getElementById('resumeBar').classList.add('hidden')">✕</button>
            </div>
        </div>

        <div id="phaseContent">
            <!-- Phase content goes here -->
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <!-- Scripts -->
    <script src="../js/firebase-config.js"></script>
    <script src="js/training-session.js"></script>
    <script src="js/session-data.js"></script>
    <script src="js/result-codes.js"></script>
    <script src="js/participant.js"></script>
</body>
</html>
