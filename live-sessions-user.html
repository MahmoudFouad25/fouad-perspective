@keyframes pulse {

let activeSession = null;
let sessionInterval = null;
let userSessionPoints = 0;

// Initialize Page
window.addEventListener('DOMContentLoaded', async function() {
    await loadUserData();
    checkActiveSession();
    loadSessions();
    
    // Check for active session every 30 seconds
    setInterval(checkActiveSession, 30000);
});

// Load User Data
async function loadUserData() {
    if (!userId) {
        window.location.href = './login.html';
        return;
    }
    
    try {
        const userDoc = await db.collection('users').doc(userId).get();
        if (userDoc.exists) {
            currentUser = userDoc.data();
            console.log('User loaded:', currentUser.personalInfo?.name);
        }
    } catch (error) {
        console.error('Error loading user:', error);
    }
}

// Check for Active Session
async function checkActiveSession() {
    try {
        const snapshot = await db.collection('liveSessions')
            .where('status', '==', 'active')
            .limit(1)
            .get();
        
        if (!snapshot.empty) {
            activeSession = { id: snapshot.docs[0].id, ...snapshot.docs[0].data() };
            showLiveSession(activeSession);
        } else {
            hideLiveSession();
        }
    } catch (error) {
        console.error('Error checking session:', error);
    }
}

// Show Live Session
function showLiveSession(session) {
    const banner = document.getElementById('liveSessionBanner');
    document.getElementById('sessionTitle').textContent = session.title;
    banner.style.display = 'block';
    
    // Start Timer
    if (session.startedAt && !sessionInterval) {
        startTimer(session.startedAt);
    }
}

// Hide Live Session
function hideLiveSession() {
    document.getElementById('liveSessionBanner').style.display = 'none';
    if (sessionInterval) {
        clearInterval(sessionInterval);
        sessionInterval = null;
    }
}

// Start Session Timer
function startTimer(startTime) {
    sessionInterval = setInterval(() => {
        const start = new Date(startTime);
        const now = new Date();
        const diff = Math.floor((now - start) / 1000);
        
        const hours = Math.floor(diff / 3600);
        const minutes = Math.floor((diff % 3600) / 60);
        const seconds = diff % 60;
        
        document.getElementById('sessionTimer').textContent = 
            `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }, 1000);
}

// Send Reaction
async function sendReaction(emoji, points) {
    if (!activeSession) return;
    
    // Show points animation
    showPointsAnimation(points);
    
    // Update local points
    userSessionPoints += points;
    document.getElementById('sessionPoints').textContent = userSessionPoints;
    
    // Disable button for 5 seconds
    event.target.classList.add('reaction-btn-disabled');
    event.target.disabled = true;
    
    setTimeout(() => {
        event.target.classList.remove('reaction-btn-disabled');
        event.target.disabled = false;
    }, 5000);
}

// Show Points Animation
function showPointsAnimation(points) {
    const popup = document.createElement('div');
    popup.className = 'points-popup';
    popup.textContent = `+${points}`;
    document.body.appendChild(popup);
    
    setTimeout(() => popup.remove(), 2000);
}

// Join Zoom
function joinZoom() {
    if (activeSession && activeSession.zoomLink) {
        window.open(activeSession.zoomLink, '_blank');
    }
}

        // Load All Sessions
async function loadSessions() {
    try {
        const snapshot = await db.collection('liveSessions')
            .orderBy('date', 'desc')
            .get();
        
        const now = new Date();
        const upcomingSessions = [];
        const pastSessions = [];
        
        snapshot.forEach(doc => {
            const session = { id: doc.id, ...doc.data() };
            const sessionDateTime = new Date(`${session.date}T${session.time}`);
            
            if (session.status !== 'active') {
                if (sessionDateTime > now) {
                    upcomingSessions.push(session);
                } else if (session.status === 'completed') {
                    pastSessions.push(session);
                }
            }
        });
        
        displayUpcomingSessions(upcomingSessions);
        displayPastSessions(pastSessions);
        // Check attendance after displaying sessions
setTimeout(checkUserAttendance, 500);
        
    } catch (error) {
        console.error('Error loading sessions:', error);
    }
}

// Display Upcoming Sessions
function displayUpcomingSessions(sessions) {
    const grid = document.getElementById('upcomingSessionsGrid');
    const emptyState = document.getElementById('noUpcomingSessions');
    
    if (sessions.length === 0) {
        grid.style.display = 'none';
        emptyState.style.display = 'block';
        return;
    }
    
    grid.style.display = 'grid';
    emptyState.style.display = 'none';
    
    grid.innerHTML = sessions.map(session => createSessionCard(session, 'upcoming')).join('');
}

// Display Past Sessions
function displayPastSessions(sessions) {
    const grid = document.getElementById('pastSessionsGrid');
    const emptyState = document.getElementById('noPastSessions');
    
    if (sessions.length === 0) {
        grid.style.display = 'none';
        emptyState.style.display = 'block';
        return;
    }
    
    grid.style.display = 'grid';
    emptyState.style.display = 'none';
    
    grid.innerHTML = sessions.map(session => createSessionCard(session, 'past')).join('');
}

// Create Session Card
function createSessionCard(session, type) {
    const sessionDate = new Date(`${session.date}T${session.time}`);
    const dateStr = sessionDate.toLocaleDateString('ar-SA', { 
        weekday: 'long', 
        year: 'numeric', 
        month: 'long', 
        day: 'numeric' 
    });
    
    const timeStr = sessionDate.toLocaleTimeString('ar-SA', { 
        hour: '2-digit', 
        minute: '2-digit' 
    });
    
    const isUpcoming = type === 'upcoming';
    const borderColor = isUpcoming ? 'rgba(59, 130, 246, 0.3)' : 'rgba(168, 85, 247, 0.3)';
    const statusColor = isUpcoming ? '#3b82f6' : '#22c55e';
    const statusText = isUpcoming ? 'قادمة' : 'انتهت';
    
    return `
        <div class="glass-card" style="
            border-color: ${borderColor};
            position: relative;
            overflow: hidden;
        ">
            <!-- Status Badge -->
            <div style="
                position: absolute;
                top: 15px;
                left: 15px;
                background: ${statusColor};
                color: white;
                padding: 5px 15px;
                border-radius: 50px;
                font-size: 0.85rem;
                font-weight: bold;
            ">${statusText}</div>
            
            <!-- Content -->
            <div style="padding-top: 2rem;">
                <h3 style="
                    color: #FFD700;
                    font-size: 1.3rem;
                    margin-bottom: 1rem;
                ">${session.title}</h3>
                
                <!-- Date & Time -->
                <div style="
                    display: flex;
                    flex-direction: column;
                    gap: 0.5rem;
                    margin-bottom: 1.5rem;
                    color: rgba(255, 255, 255, 0.8);
                ">
                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                        <i class="fas fa-calendar" style="color: #FFD700; width: 20px;"></i>
                        <span>${dateStr}</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                        <i class="fas fa-clock" style="color: #FFD700; width: 20px;"></i>
                        <span>${timeStr}</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                        <i class="fas fa-hourglass-half" style="color: #FFD700; width: 20px;"></i>
                        <span>${session.duration || 90} دقيقة</span>
                    </div>
                </div>
                
                ${isUpcoming ? `
                    <!-- Points Preview -->
                    <div style="
                        background: rgba(34, 197, 94, 0.1);
                        border: 1px solid rgba(34, 197, 94, 0.3);
                        border-radius: 10px;
                        padding: 0.8rem;
                        margin-bottom: 1rem;
                    ">
                        <div style="
                            display: flex;
                            justify-content: space-between;
                            align-items: center;
                            color: #22c55e;
                        ">
                            <span>نقاط الحضور:</span>
                            <span style="font-weight: bold;">+${session.points?.attendance || 50}</span>
                        </div>
                    </div>
                    
                    <!-- Action Button -->
                    <button onclick="setReminder('${session.id}')" style="
                        width: 100%;
                        background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
                        color: white;
                        padding: 12px;
                        border: none;
                        border-radius: 50px;
                        font-weight: bold;
                        cursor: pointer;
                        transition: all 0.3s;
                    " onmouseover="this.style.transform='translateY(-2px)'"
                       onmouseout="this.style.transform='translateY(0)'">
                        <i class="fas fa-bell"></i> تذكير
                    </button>
                ` : `
                    <!-- Attendance Status -->
                    <div id="attendance-${session.id}" style="
                        background: rgba(168, 85, 247, 0.1);
                        border: 1px solid rgba(168, 85, 247, 0.3);
                        border-radius: 10px;
                        padding: 0.8rem;
                        text-align: center;
                        color: rgba(255, 255, 255, 0.6);
                    ">
                        <i class="fas fa-spinner fa-spin"></i> جاري التحقق...
                    </div>
                `}
            </div>
        </div>
    `;
}

// Set Reminder (placeholder)
function setReminder(sessionId) {
    Swal.fire({
        icon: 'success',
        title: 'تم تفعيل التذكير',
        text: 'سيتم تذكيرك قبل موعد الجلسة',
        confirmButtonColor: '#3b82f6'
    });
}
        // Check User Attendance for Past Sessions
async function checkUserAttendance() {
    if (!userId) return;
    
    const pastCards = document.querySelectorAll('[id^="attendance-"]');
    
    for (let card of pastCards) {
        const sessionId = card.id.replace('attendance-', '');
        
        try {
            const attendeeDoc = await db.collection('liveSessions')
                .doc(sessionId)
                .collection('attendees')
                .doc(userId)
                .get();
            
            if (attendeeDoc.exists) {
                const data = attendeeDoc.data();
                card.innerHTML = `
                    <div style="color: #22c55e;">
                        <i class="fas fa-check-circle"></i> حضرت
                        ${data.pointsEarned ? `<div style="margin-top: 0.5rem;">+${data.pointsEarned} نقطة</div>` : ''}
                    </div>
                `;
            } else {
                card.innerHTML = `
                    <div style="color: #ef4444;">
                        <i class="fas fa-times-circle"></i> لم تحضر
                    </div>
                `;
            }
        } catch (error) {
            console.error('Error checking attendance:', error);
            card.innerHTML = `
                <div style="color: rgba(255, 255, 255, 0.5);">
                    <i class="fas fa-question-circle"></i> غير محدد
                </div>
            `;
        }
    }
}
    </script>
