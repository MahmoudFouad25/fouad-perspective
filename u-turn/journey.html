<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المُنعطَف — شاشة العرض</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F2A2E; --ink-2:#143A40; --ink-3:#1C4A51;
    --line:rgba(243,239,228,.14);
    --gold:#EBB94A; --gold-soft:#F0CE7E; --gold-deep:#C9932B;
    --sage:#7DB89A; --clay:#D2724A; --clay-soft:#E0906B;
    --cream:#F3EFE4; --muted:#A6BAB8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{font-family:'IBM Plex Sans Arabic',sans-serif;background:var(--ink);color:var(--cream);
    -webkit-font-smoothing:antialiased}
  h1,h2,h3,.kufi{font-family:'Reem Kufi',sans-serif}

  .stage{position:fixed;inset:0}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;
    padding:6vh 8vw;opacity:0;transition:opacity .5s}
  .slide.on{display:flex;opacity:1}
  .slide::before{content:"";position:absolute;inset:0;z-index:-1;
    background:
      radial-gradient(1100px 650px at 82% -8%, rgba(235,185,74,.10), transparent 60%),
      radial-gradient(950px 560px at 4% 108%, rgba(125,184,154,.09), transparent 55%);}

  /* chrome */
  .eyebrow{font-family:'Reem Kufi';color:var(--gold);font-size:clamp(15px,1.7vw,22px);letter-spacing:1px;
    margin-bottom:18px;display:flex;align-items:center;gap:12px}
  .eyebrow .num{background:linear-gradient(145deg,var(--gold),var(--gold-deep));color:#3a2a05;
    width:1.9em;height:1.9em;border-radius:.5em;display:grid;place-items:center;font-weight:700}
  .disp{font-family:'Reem Kufi';font-weight:600;font-size:clamp(34px,6vw,86px);line-height:1.08;letter-spacing:-.5px}
  .lede{font-size:clamp(18px,2.4vw,32px);color:var(--muted);margin-top:22px;max-width:24ch;line-height:1.55}
  .lede.wide{max-width:40ch}
  .cream{color:var(--cream)}
  .g{color:var(--gold-soft)} .sg{color:var(--sage)} .cl{color:var(--clay-soft)}
  .muted{color:var(--muted)}

  /* footer chrome */
  .foot{position:fixed;bottom:22px;left:0;right:0;display:flex;align-items:center;justify-content:space-between;
    padding:0 8vw;font-size:13px;color:var(--muted);z-index:20}
  .foot .prog{flex:1;height:3px;background:var(--line);border-radius:3px;margin:0 20px;overflow:hidden}
  .foot .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-deep));transition:.4s}
  .stationtag{font-family:'Reem Kufi';color:var(--gold);white-space:nowrap}
  .nav{position:fixed;top:20px;left:8vw;display:flex;gap:8px;z-index:20}
  .nav button{background:var(--ink-2);border:1px solid var(--line);color:var(--cream);width:40px;height:40px;
    border-radius:11px;cursor:pointer;font-size:18px;transition:.15s}
  .nav button:hover{border-color:var(--gold);background:var(--ink-3)}

  /* title slide */
  .brandline{display:flex;align-items:center;gap:16px;margin-bottom:32px}
  .mark{width:64px;height:64px;border-radius:16px;background:linear-gradient(145deg,var(--gold),var(--gold-deep));
    display:grid;place-items:center;color:#3a2a05;font-family:'Reem Kufi';font-weight:700;font-size:30px}
  .brandline span{color:var(--muted);font-size:clamp(14px,1.6vw,20px)}
  .tsub{margin-top:26px;color:var(--muted);font-size:clamp(16px,1.9vw,24px);max-width:34ch;line-height:1.5}
  .tnote{margin-top:40px;font-size:15px;color:var(--muted);border-top:1px solid var(--line);padding-top:18px;max-width:52ch;line-height:1.6}

  /* journey map */
  .map{display:flex;align-items:stretch;gap:0;margin-top:44px;flex-wrap:wrap}
  .stop{flex:1;min-width:120px;position:relative;padding:20px 10px;text-align:center}
  .stop:not(:last-child)::after{content:"";position:absolute;top:34px;left:0;width:100%;height:2px;
    background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 16px)}
  .stop .dot{width:48px;height:48px;border-radius:13px;background:var(--ink-2);border:1px solid var(--line);
    display:grid;place-items:center;font-family:'Reem Kufi';font-size:20px;color:var(--gold);margin:0 auto 14px;position:relative;z-index:2}
  .stop h4{font-family:'Reem Kufi';font-size:clamp(14px,1.5vw,19px);font-weight:600;margin-bottom:6px}
  .stop p{color:var(--muted);font-size:clamp(11px,1.15vw,14px);line-height:1.4}
  .stop.mother .dot{background:linear-gradient(145deg,var(--gold),var(--gold-deep));color:#3a2a05;box-shadow:0 0 0 4px rgba(235,185,74,.14)}

  /* how it works */
  .steps{display:flex;gap:14px;margin-top:36px;flex-wrap:wrap}
  .stepbox{flex:1;min-width:180px;background:var(--ink-2);border:1px solid var(--line);border-radius:16px;padding:22px}
  .stepbox .k{font-family:'Reem Kufi';color:var(--gold);font-size:26px;margin-bottom:10px}
  .stepbox h4{font-size:clamp(16px,1.8vw,21px);font-weight:600;margin-bottom:6px}
  .stepbox p{color:var(--muted);font-size:clamp(13px,1.4vw,16px);line-height:1.5}

  /* decision card slide */
  .choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:14px}
  .choice{background:var(--ink-2);border:1px solid var(--line);border-radius:18px;padding:24px 22px;transition:.2s}
  .choice .opt{font-family:'Reem Kufi';font-size:clamp(22px,3vw,38px);color:var(--gold);font-weight:700;margin-bottom:10px}
  .choice p{font-size:clamp(15px,1.7vw,21px);line-height:1.45}
  .ask{margin-top:22px;background:rgba(235,185,74,.1);border:1px solid rgba(235,185,74,.3);border-radius:14px;
    padding:16px 20px;font-size:clamp(15px,1.7vw,21px);color:var(--gold-soft);line-height:1.5}
  .timer{position:absolute;top:6vh;left:8vw;background:var(--ink-2);border:1px solid var(--line);border-radius:14px;
    padding:12px 20px;font-family:'Reem Kufi';font-size:clamp(16px,2vw,24px);color:var(--gold);display:flex;align-items:center;gap:10px}

  /* reveal slide */
  .slide.reveal-slide{background:linear-gradient(160deg,#12191c,#0c1f22)}
  .stamp{display:inline-block;font-family:'Reem Kufi';font-weight:700;color:var(--clay);
    border:3px solid var(--clay);border-radius:14px;padding:8px 26px;font-size:clamp(20px,2.6vw,36px);
    transform:rotate(-4deg) scale(.6);opacity:0;letter-spacing:1px;margin-bottom:26px;align-self:flex-start}
  .slide.on .stamp{animation:stamp .5s .25s forwards cubic-bezier(.2,1.4,.4,1)}
  @keyframes stamp{to{transform:rotate(-4deg) scale(1);opacity:1}}
  .reveal-body{opacity:0;transform:translateY(20px)}
  .slide.on .reveal-body{animation:up .6s .5s forwards}
  @keyframes up{to{opacity:1;transform:none}}
  .truth{background:rgba(125,184,154,.1);border-inline-start:4px solid var(--sage);border-radius:0 14px 14px 0;
    padding:20px 24px;margin-top:24px;font-size:clamp(16px,2vw,26px);line-height:1.55;max-width:44ch}
  .truth b{color:var(--sage)}

  /* insight slide */
  .ins-grid{display:grid;grid-template-columns:1.25fr .85fr;gap:26px;margin-top:18px;align-items:start}
  @media(max-width:900px){.ins-grid{grid-template-columns:1fr}}
  .ins-main .idea{font-size:clamp(17px,2vw,27px);line-height:1.55;margin-bottom:18px}
  .ins-main .idea b{color:var(--gold-soft)}
  .real{background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:18px 20px;
    font-size:clamp(14px,1.55vw,19px);color:var(--muted);line-height:1.55}
  .real .t{font-family:'Reem Kufi';color:var(--gold);font-size:14px;margin-bottom:8px;letter-spacing:.5px}
  .side .enn{background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px}
  .side .enn .t{font-family:'Reem Kufi';color:var(--gold);font-size:14px;margin-bottom:8px}
  .side .enn p{font-size:clamp(14px,1.5vw,18px);line-height:1.5;color:var(--cream)}
  .power{background:linear-gradient(135deg,rgba(235,185,74,.14),rgba(235,185,74,.03));
    border:1px solid rgba(235,185,74,.35);border-radius:16px;padding:22px 24px;text-align:center}
  .power .t{font-size:13px;color:var(--gold);font-family:'Reem Kufi';margin-bottom:10px;letter-spacing:1px}
  .power .q{font-family:'Reem Kufi';font-size:clamp(18px,2.2vw,29px);font-weight:600;color:var(--gold-soft);line-height:1.45}

  /* ===== NEW COMPONENTS ===== */

  /* big stat (م٦) */
  .statwrap{display:flex;align-items:baseline;gap:22px;margin-top:14px;flex-wrap:wrap}
  .statwrap .big{font-family:'Reem Kufi';font-weight:700;font-size:clamp(80px,15vw,200px);line-height:.9;
    color:var(--clay-soft);letter-spacing:-3px}
  .statwrap .lbl{font-size:clamp(18px,2.3vw,30px);color:var(--muted);max-width:16ch;line-height:1.45}

  /* consultation 2x2 matrix (م٣) */
  .m2{display:grid;grid-template-columns:auto 1fr 1fr;grid-template-rows:auto 1fr 1fr;gap:12px;margin-top:22px;
    max-width:960px}
  .m2 .axis{display:grid;place-items:center;font-family:'Reem Kufi';color:var(--gold);font-size:clamp(13px,1.5vw,18px);text-align:center}
  .m2 .axis.top{grid-column:2/4;grid-row:1}
  .m2 .axis.side{grid-column:1;grid-row:2/4;writing-mode:vertical-rl}
  .m2 .colh{font-family:'Reem Kufi';color:var(--muted);font-size:clamp(12px,1.3vw,16px);text-align:center;padding:4px}
  .m2 .cell{background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:16px 16px;min-height:96px;
    display:flex;flex-direction:column;justify-content:center}
  .m2 .cell .who{font-family:'Reem Kufi';font-weight:600;font-size:clamp(15px,1.7vw,21px);color:var(--gold-soft);margin-bottom:5px}
  .m2 .cell .cond{font-size:clamp(12px,1.35vw,16px);color:var(--muted);line-height:1.4}
  .m2 .cell.both{border-color:rgba(125,184,154,.5);background:rgba(125,184,154,.08)}
  .m2 .cell.none{border-style:dashed;opacity:.72}
  .m2 .rowh{display:grid;place-items:center;font-family:'Reem Kufi';color:var(--muted);font-size:clamp(12px,1.3vw,16px);text-align:center;padding:4px}

  /* projects data table (م٥) */
  .dtable{width:100%;border-collapse:separate;border-spacing:0;margin-top:18px;font-size:clamp(12px,1.4vw,18px)}
  .dtable th,.dtable td{padding:11px 12px;text-align:center;border-bottom:1px solid var(--line)}
  .dtable thead th{font-family:'Reem Kufi';color:var(--gold);font-weight:600;font-size:clamp(12px,1.35vw,17px);
    border-bottom:2px solid rgba(235,185,74,.4)}
  .dtable tbody th{font-family:'Reem Kufi';color:var(--cream);text-align:start;font-weight:600;white-space:nowrap}
  .dtable td.bad{color:var(--clay-soft);font-weight:600}
  .dtable tr.out th,.dtable tr.out td{opacity:.45;text-decoration:line-through;text-decoration-color:var(--clay)}
  .dtable tr.win th,.dtable tr.win td{background:rgba(125,184,154,.12)}
  .dtable tr.win th{color:var(--sage)}
  .dtable .flagcol{color:var(--clay-soft)}

  /* route map (م٥) */
  .route{margin-top:20px;max-width:1000px}
  .rnode{background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:14px 20px;
    font-size:clamp(14px,1.6vw,20px);display:inline-flex;align-items:center;gap:10px}
  .rnode .q{font-family:'Reem Kufi';color:var(--gold-soft)}
  .rbranch{display:flex;gap:16px;margin-top:14px;flex-wrap:wrap}
  .rcol{flex:1;min-width:230px}
  .rlead{font-family:'Reem Kufi';color:var(--gold);font-size:clamp(13px,1.45vw,18px);margin-bottom:10px;
    padding-inline-start:14px;border-inline-start:3px solid var(--gold)}
  .rleaf{background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin-bottom:10px}
  .rleaf .n{font-family:'Reem Kufi';font-weight:600;color:var(--cream);font-size:clamp(14px,1.55vw,19px);margin-bottom:3px}
  .rleaf .d{color:var(--muted);font-size:clamp(12px,1.3vw,15px);line-height:1.4}
  .rleaf.mm{border-inline-start:3px solid var(--clay)}
  .rleaf.mx{border-inline-start:3px solid var(--sage)}
  .rleaf.by{border-inline-start:3px solid var(--gold)}

  /* tree (م٥) */
  .tree{display:flex;gap:16px;margin-top:20px;flex-wrap:wrap}
  .tbranch{flex:1;min-width:210px;background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:18px 20px;
    border-top:3px solid var(--sage)}
  .tbranch .cond{font-family:'Reem Kufi';color:var(--gold-soft);font-size:clamp(14px,1.6vw,20px);margin-bottom:6px}
  .tbranch .act{color:var(--muted);font-size:clamp(13px,1.45vw,17px);line-height:1.4}

  /* rule chips (م٤) */
  .chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:18px}
  .chip{background:var(--ink-2);border:1px solid var(--line);border-radius:13px;padding:14px 16px}
  .chip .h{font-family:'Reem Kufi';color:var(--gold-soft);font-size:clamp(14px,1.5vw,18px);margin-bottom:4px}
  .chip .b{color:var(--muted);font-size:clamp(12px,1.35vw,15px);line-height:1.45}

  /* vote regions (م٥ Minimax/Maximax) */
  .votehead{display:inline-flex;gap:10px;align-items:center;background:rgba(235,185,74,.1);border:1px solid rgba(235,185,74,.3);
    border-radius:30px;padding:8px 20px;font-family:'Reem Kufi';color:var(--gold-soft);font-size:clamp(14px,1.6vw,20px);margin-bottom:6px}

  /* bridge / continue slide */
  .contbox{display:flex;gap:16px;margin-top:32px;flex-wrap:wrap}
  .cnext{flex:1;min-width:240px;background:var(--ink-2);border:1px solid var(--line);border-radius:16px;padding:22px 24px}
  .cnext .t{font-family:'Reem Kufi';color:var(--gold);font-size:clamp(15px,1.6vw,20px);margin-bottom:8px;display:flex;gap:10px;align-items:center}
  .cnext p{color:var(--muted);font-size:clamp(13px,1.45vw,17px);line-height:1.5}

  .hintbar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--muted);
    background:rgba(20,58,64,.7);padding:6px 14px;border-radius:20px;z-index:19;opacity:.6}

  @media(max-width:640px){
    .slide{padding:8vh 6vw}
    .m2{grid-template-columns:1fr;grid-template-rows:none}
    .m2 .axis,.m2 .colh,.m2 .rowh{display:none}
    .dtable{font-size:11px} .dtable th,.dtable td{padding:7px 6px}
  }
</style>
</head>
<body>
<div class="stage" id="stage"></div>

<div class="nav">
  <button onclick="go(1)" title="التالي">‹</button>
  <button onclick="go(-1)" title="السابق">›</button>
</div>

<div class="foot">
  <span class="stationtag" id="stationtag"></span>
  <div class="prog"><i id="progbar"></i></div>
  <span id="counter"></span>
</div>
<div class="hintbar">Space أو السهم لليسار = التالي · السهم لليمين = رجوع · F = ملء الشاشة</div>

<script>
/* ========== SLIDE CONTENT ========== */
const S = [

/* ============ OPENING ============ */
/* 0 TITLE */
{station:'', html:`
  <div class="brandline"><div class="mark">مُ</div><span>مؤسسة غيث للتنمية المجتمعية · معسكر القادة</span></div>
  <div class="eyebrow">محاكاة قياديّة لبناء الفريق واتخاذ القرار</div>
  <h1 class="disp">المُنعطَف<br><span class="g" style="font-size:.52em">رحلة القرار في ستّ محطّات</span></h1>
  <p class="tsub">في كل محطّة فخٌّ مصمَّم بعناية… والفريق لا يراه إلا بعد أن يقع فيه.</p>
  <div class="tnote">خمس فرق · رصيد قدرة يبدأ من ٥٠ · كل محطّة: قرار جماعي ← درجات فورية ← كشف الفخّ ← استبصار — ثم مصيرٌ في النهاية.</div>`},

/* 1 STORY FRAME */
{station:'القصة', html:`
  <div class="eyebrow">القصة الإطارية</div>
  <h1 class="disp" style="font-size:clamp(28px,4.4vw,64px);max-width:20ch">إنتوا مش متدرّبين النهاردة…<br><span class="g">إنتوا فِرَق قيادة.</span></h1>
  <p class="lede wide">كل فريق مسؤول عن «موقع» حقيقي: قرية عايشة على المساعدات من سنين، ونفسها تقف على رجليها.
  مهمّتكم تنقلوها من <span class="cl">الاحتياج</span> إلى <span class="sg">القدرة</span> في <span class="g">ستّ قرارات مصيرية</span>.
  وفي الآخر — لما القرية تقف — تاخدوا أصعب قرار: مين هيقودها بعد ما تمشوا؟</p>`},

/* 2 HOW IT WORKS */
{station:'', html:`
  <div class="eyebrow">إزاي بتشتغل</div>
  <h2 class="disp" style="font-size:clamp(28px,4.5vw,58px)">أربع لحظات… في كل محطّة</h2>
  <div class="steps">
    <div class="stepbox"><div class="k">١</div><h4>قرار جماعي</h4><p>الفريق يقرأ الموقف ويقرّر مع بعضه تحت الوقت.</p></div>
    <div class="stepbox"><div class="k">٢</div><h4>درجات فورية</h4><p>القرار يرفع رصيد القدرة أو يهبطه على اللوحة الحيّة.</p></div>
    <div class="stepbox"><div class="k">٣</div><h4>كشف الفخّ</h4><p>نكشف الفخّ المصمَّم ونسمّيه بمثال من الواقع.</p></div>
    <div class="stepbox"><div class="k">٤</div><h4>استبصار</h4><p>«ده أنا بعمل كده فعلًا» — الدرس يتحوّل لمرآة.</p></div>
  </div>`},

/* 3 JOURNEY MAP (6) */
{station:'', html:`
  <div class="eyebrow">خريطة الرحلة</div>
  <h2 class="disp" style="font-size:clamp(26px,4vw,52px)">ستّ منعطفات</h2>
  <div class="map">
    <div class="stop"><div class="dot">١</div><h4>الهدف</h4><p>تختار المقياس الصح قبل ما تتحرّك</p></div>
    <div class="stop"><div class="dot">٢</div><h4>المعلومات</h4><p>الحقيقة موزّعة — تشارك وتزِن قبل ما تصدّق</p></div>
    <div class="stop"><div class="dot">٣</div><h4>المشورة</h4><p>مين تستشير، ومين رأيه يتحسب</p></div>
    <div class="stop"><div class="dot">٤</div><h4>البدائل</h4><p>توسّع خياراتك وتسيب الخاسر</p></div>
    <div class="stop mother"><div class="dot">٥</div><h4>الاختيار</h4><p>الطريقة الصح للموقف الصح</p></div>
    <div class="stop"><div class="dot">٦</div><h4>التنفيذ</h4><p>قرار بمالك وموعد ومتابعة</p></div>
  </div>`},

/* ============ STATION 1 — الهدف ============ */
{station:'م١ · الهدف', html:`
  <div class="eyebrow"><span class="num">١</span> المحطّة الأولى — تحديد الهدف</div>
  <h2 class="disp" style="font-size:clamp(28px,4.6vw,62px)">فين تحطّ جهد<br>الشهر الأول؟</h2>
  <p class="lede wide">المؤسسة الأم أعلنت: «هنكافئ المواقع اللي توصّل مساعدة <span class="g">لأكبر عدد من الناس</span> الشهر ده.»
  رقمٌ واضح… سهل تقيسه… والكل بيتكلّم عنه. حِلو أوي — على الورق.</p>`},

/* ========== ENGINE ========== */
const stage=document.getElementById('stage');
let i=0;
S.forEach((s,idx)=>{
  const d=document.createElement('div');
  d.className='slide'+(s.reveal?' reveal-slide':'');
  if(s.wide) d.style.padding='6vh 5vw';
  d.dataset.i=idx; d.innerHTML=s.html; stage.appendChild(d);
});
const slides=[...document.querySelectorAll('.slide')];
function show(n){
  i=Math.max(0,Math.min(S.length-1,n));
  slides.forEach((s,k)=>s.classList.toggle('on',k===i));
  document.getElementById('progbar').style.width=((i)/(S.length-1)*100)+'%';
  document.getElementById('counter').textContent=toAr(i+1)+' / '+toAr(S.length);
  document.getElementById('stationtag').textContent=S[i].station||'';
}
function go(dir){ show(i+dir); }
function toAr(n){ return n.toString().replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]); }
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key===' '||e.key==='PageDown'||e.key==='ArrowDown'){e.preventDefault();go(1);}
  else if(e.key==='ArrowRight'||e.key==='PageUp'||e.key==='ArrowUp'||e.key==='Backspace'){e.preventDefault();go(-1);}
  else if(e.key==='Home'){show(0);} else if(e.key==='End'){show(S.length-1);}
  else if(e.key==='f'||e.key==='F'){ if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();}
});
let sx=0;
document.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>50) go(dx<0?1:-1);});
show(0);
</script>
