<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>المُنعطَف — شاشة الفريق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F2A2E; --ink-2:#143A40; --ink-3:#1C4A51; --raise:#22565E;
    --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.16);
    --gold:#EBB94A; --gold-soft:#F0CE7E; --gold-deep:#C9932B;
    --green:#5BBF8A; --green-soft:#8FD9B4;
    --cream:#F4EEDF; --muted:#9FB3B4; --clay:#E08A6A; --sage:#7FC9A4;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:'IBM Plex Sans Arabic',sans-serif;
    background:
      radial-gradient(1200px 500px at 80% -10%, rgba(235,185,74,.10), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(91,191,138,.08), transparent 55%),
      var(--ink);
    color:var(--cream); min-height:100vh; line-height:1.6;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 14px 120px}

  /* ---------- SETUP / PICKER ---------- */
  .picker{max-width:560px;margin:8vh auto;padding:26px 22px;background:var(--ink-2);
    border:1px solid var(--line);border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
  .picker h1{font-family:'Reem Kufi';font-size:26px;margin:0 0 4px;color:var(--gold-soft)}
  .picker p{color:var(--muted);margin:0 0 20px;font-size:14.5px}
  .pk-grid{display:grid;gap:11px}
  .pk-btn{font-family:'Reem Kufi';font-size:18px;text-align:right;padding:16px 18px;border-radius:14px;
    border:1px solid var(--line-2);background:var(--ink);color:var(--cream);cursor:pointer;
    display:flex;align-items:center;gap:12px;transition:.15s}
  .pk-btn:hover{border-color:var(--gold);background:var(--ink-3);transform:translateY(-1px)}
  .pk-dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto}

  /* ---------- TOP BAR ---------- */
  .topbar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--ink) 70%,rgba(15,42,46,.86));
    backdrop-filter:blur(6px);padding:12px 14px 8px;border-bottom:1px solid var(--line)}
  .tb-row{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:11px}
  .badge{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:0 0 auto;
    font-family:'Reem Kufi';font-weight:700;font-size:20px;color:#20130a;
    background:linear-gradient(145deg,var(--gold),var(--gold-deep));box-shadow:0 6px 18px rgba(235,185,74,.25)}
  .tb-name{font-family:'Reem Kufi';font-size:19px;line-height:1.15;font-weight:700}
  .tb-sub{font-size:11.5px;color:var(--muted)}
  .cloud{margin-inline-start:auto;font-size:11px;padding:5px 9px;border-radius:8px;border:1px solid var(--line-2);
    background:rgba(91,191,138,.10);color:var(--green-soft);white-space:nowrap}
  .cloud.off{color:var(--gold-soft);background:rgba(235,185,74,.09);border-color:rgba(235,185,74,.35)}
  /* stage rail */
  .rail{max-width:760px;margin:9px auto 0;display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .rchip{font-family:'Reem Kufi';flex:0 0 auto;font-size:13px;padding:6px 12px;border-radius:10px;
    border:1px solid var(--line);background:var(--ink-2);color:var(--muted);cursor:pointer;white-space:nowrap;
    display:flex;align-items:center;gap:6px;transition:.14s}
  .rchip:hover{border-color:var(--gold-deep);color:var(--cream)}
  .rchip.on{background:var(--ink-3);color:var(--gold);border-color:var(--gold)}
  .rchip .tick{color:var(--green);font-size:12px}
  .rchip.crown.on{border-color:var(--gold);color:var(--gold)}
  .rchip.locked{opacity:.38;cursor:default}
  .rchip.locked:hover{border-color:var(--line);color:var(--muted)}
  .rchip .lk{font-size:11px}
  .gate-wait{margin-top:14px;text-align:center;font-size:13.5px;color:var(--gold-soft);
    background:rgba(235,185,74,.07);border:1px dashed rgba(235,185,74,.35);border-radius:14px;padding:14px}
  .gate-wait b{color:var(--cream)}

  /* ---------- STAGE CARD ---------- */
  .stage{margin-top:16px;animation:pop .22s ease}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .st-head{display:flex;align-items:baseline;gap:9px;margin-bottom:4px;flex-wrap:wrap}
  .st-num{font-family:'Reem Kufi';font-size:14px;color:var(--gold);background:rgba(235,185,74,.10);
    border:1px solid rgba(235,185,74,.3);padding:2px 10px;border-radius:9px}
  .st-title{font-family:'Reem Kufi';font-size:23px;font-weight:700;color:var(--cream)}
  .st-principle{color:var(--gold-soft);font-size:14px;margin:2px 0 14px}

  .block{background:var(--ink-2);border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:13px}
  .block.read{border-inline-start:3px solid var(--gold-deep);background:linear-gradient(180deg,rgba(235,185,74,.05),transparent 60%),var(--ink-2)}
  .block.secret{border-inline-start:3px solid var(--green);background:linear-gradient(180deg,rgba(91,191,138,.07),transparent 60%),var(--ink-2)}
  .b-label{font-family:'Reem Kufi';font-size:13.5px;color:var(--gold-soft);margin-bottom:8px;display:flex;align-items:center;gap:7px}
  .block.secret .b-label{color:var(--green-soft)}
  .b-text{font-size:14.5px;color:var(--cream)}
  .b-text.dim{color:#cdd8d6}
  .info-pair{margin-top:9px}
  .info-pair .n{font-size:12px;color:var(--muted);font-family:'Reem Kufi';margin-bottom:2px}
  .info-pair .v{font-size:14.5px}
  .info-pair+.info-pair{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
  .hint{font-size:12.5px;color:var(--muted);margin-top:10px;font-style:italic}

  /* choices */
  .choices{display:grid;gap:9px}
  .choice{display:flex;gap:10px;align-items:flex-start;text-align:right;font-family:'IBM Plex Sans Arabic';
    font-size:14.5px;line-height:1.45;padding:12px 13px;border-radius:12px;border:1px solid var(--line-2);
    background:var(--ink);color:var(--cream);cursor:pointer;transition:.14s;width:100%}
  .choice:hover{border-color:var(--gold-deep)}
  .choice .mk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);flex:0 0 auto;margin-top:1px;
    display:grid;place-items:center;font-size:12px;color:transparent;transition:.14s}
  .choice.sel{border-color:var(--gold);background:rgba(235,185,74,.10);box-shadow:0 0 0 1px rgba(235,185,74,.28) inset}
  .choice.sel .mk{border-color:var(--gold);background:var(--gold);color:#20130a}

  /* text / fields */
  textarea,input[type=text]{font-family:'IBM Plex Sans Arabic';width:100%;background:var(--ink);
    border:1px solid var(--line-2);border-radius:12px;color:var(--cream);font-size:14.5px;padding:11px 13px;resize:vertical}
  textarea{min-height:74px;line-height:1.5}
  textarea:focus,input:focus{outline:none;border-color:var(--gold)}
  textarea::placeholder,input::placeholder{color:#6f8385}
  .fld{margin-bottom:11px}
  .fld:last-child{margin-bottom:0}
  .fld label{display:block;font-family:'Reem Kufi';font-size:13px;color:var(--gold-soft);margin-bottom:5px}
  .fld.req label::after{content:' • إجباري';color:var(--clay);font-size:11px;font-family:'IBM Plex Sans Arabic'}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:520px){.grid2{grid-template-columns:1fr}}

  /* projects table */
  .tbl-scroll{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
  table{border-collapse:collapse;width:100%;min-width:560px;font-size:12.5px}
  th,td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
  th{background:var(--ink-3);color:var(--gold-soft);font-family:'Reem Kufi';font-weight:600;font-size:12px}
  td:first-child,th:first-child{text-align:right;font-weight:600;white-space:normal;min-width:120px}
  tr:last-child td{border-bottom:none}

  /* candidates */
  .cand{border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin-bottom:10px;background:var(--ink)}
  .cand h4{font-family:'Reem Kufi';margin:0 0 5px;color:var(--gold-soft);font-size:15px}
  .cand .pro{color:var(--sage);font-size:13.5px}
  .cand .con{color:var(--clay);font-size:13.5px;margin-top:3px}

  /* nav */
  .navbtns{position:fixed;bottom:0;left:0;right:0;z-index:15;background:linear-gradient(0deg,var(--ink) 62%,transparent);
    padding:12px 14px calc(env(safe-area-inset-bottom,0) + 12px)}
  .navbtns .in{max-width:760px;margin:0 auto;display:flex;gap:10px}
  .nb{flex:1;font-family:'Reem Kufi';font-size:15.5px;padding:14px;border-radius:14px;border:1px solid var(--line-2);
    background:var(--ink-2);color:var(--cream);cursor:pointer;transition:.14s}
  .nb:hover{border-color:var(--gold);background:var(--ink-3)}
  .nb:disabled{opacity:.35;cursor:default}
  .nb.gold{background:linear-gradient(145deg,var(--gold),var(--gold-deep));color:#20130a;border:none;font-weight:700}
  .saved{position:fixed;bottom:82px;right:50%;transform:translateX(50%);background:var(--green);color:#08301d;
    padding:7px 16px;border-radius:20px;font-size:12.5px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;z-index:30}
  .saved.show{opacity:1}
  .switch-note{text-align:center;color:var(--muted);font-size:11.5px;margin-top:18px}
  .switch-note a{color:var(--gold-soft)}
</style>
</head>
<body>

<!-- ================= PICKER ================= -->
<div id="picker" class="picker" style="display:none">
  <h1>المُنعطَف</h1>
  <p>اختر فريقك للبدء. (لو المدرّب باعتلك لينك مخصّص، هتدخل على طول من غير الخطوة دي.)</p>
  <div class="pk-grid" id="pkGrid"></div>
</div>

<!-- ================= APP ================= -->
<div id="app" style="display:none">
  <div class="topbar">
    <div class="tb-row">
      <div class="badge" id="tbBadge">★</div>
      <div>
        <div class="tb-name" id="tbName">—</div>
        <div class="tb-sub">شاشة الفريق · اكتبوا هنا وكل حاجة بتتحفظ لوحدها</div>
      </div>
      <div class="cloud off" id="cloud">⚠ محلي فقط</div>
    </div>
    <div class="rail" id="rail"></div>
  </div>

  <div class="wrap">
    <div id="stageHost"></div>
    <div class="switch-note" id="switchNote"></div>
  </div>

  <div class="saved" id="savedTag">✓ اتحفظ</div>
  <div class="navbtns"><div class="in">
    <button class="nb" id="prevBtn" onclick="go(-1)">◄ السابق</button>
    <button class="nb gold" id="nextBtn" onclick="go(1)">التالي ►</button>
  </div></div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
/* ============================================================
   المُنعطَف — تطبيق الفرق
   كود واحد · الفريق بيتحدّد من ?team=  · كل فريق بيكتب في مستنده الخاص
   ============================================================ */

/* ---------- الفرق ---------- */
const TEAMS = {
  stars:    {name:'النجوم',            badge:'ن',  color:'#EBB94A', dir:'rtl'},
  knights:  {name:'الفرسان',           badge:'ف',  color:'#5BBF8A', dir:'rtl'},
  reality:  {name:'Reality',           badge:'R',  color:'#7FB2E0', dir:'ltr'},
  changers: {name:'The Game Changers', badge:'G',  color:'#E08A6A', dir:'ltr'},
  legends:  {name:'Legends',           badge:'L',  color:'#C79BE0', dir:'ltr'},
};
const TEAM_ORDER = ['stars','knights','reality','changers','legends'];

/* ---------- شظايا محطّة ٢ (مختلفة لكل فريق) ---------- */
const FRAGMENTS = {
  stars:{
    a:'لاحظنا حاجة مهمة: كل بيوت القرية اللي فيها أطفال مرضى بتشرب من مصدر المياه الجديد (الترعة). أما البيوت اللي لسه بتستخدم البير القديم — مفيش فيها ولا حالة واحدة.',
    b:'أكتر بيت فيه حالات مرض هو بيت عائلة «أبو راضي»، والناس بدأت تلوم عليهم وتقول إنهم اللي جابوا المرض للقرية.'},
  knights:{
    a:'من حوالي أسبوعين، بعد المطر الكبير، مياه صرف ومخلفات حيوانات بدأت تتسرّب وتصبّ في الترعة اللي القرية بتشرب منها — في الجزء اللي فوق القرية.',
    b:'بيتقال في القرية إن المرض «معدي» وبينتقل بالسلام والقعدة مع بعض، فالناس بدأت تخاف وتعزل بعضها وتقفل على نفسها في البيوت.'},
  reality:{
    a:'البير القديم بتاع القرية لسه مياهه نظيفة، وممكن يترجع يشتغل خلال يومين. وكمان فيه أقراص كلور رخيصة جدًا موجودة — القرص بيعقّم المياه ويخلّيها آمنة فورًا.',
    b:'فيه شركة بتعرض تحفر بير جديد عميق للقرية — بس بفلوس كبيرة، والحفر هياخد حوالي شهر.'},
  changers:{
    a:'محلول معالجة الجفاف (ORS) والزنك موجودين في مخزن العيادة، ودول بيوقفوا وفيات الأطفال بسرعة. بس خدوا بالكوا: دول بيعالجوا العرض (الجفاف)، ومش بيمنعوا إن حالات جديدة تحصل.',
    b:'الأهالي غاضبين وبيطالبوا إننا نوزّع مضادات حيوية على كل أطفال القرية فورًا كوقاية.'},
  legends:{
    a:'الوحدة الصحية فحصت الحالات وأكّدت: الأعراض كلها إسهال وجفاف شديد — ده نمط تسمّم من مياه أو أكل ملوّث، مش عدوى بتنتقل بالهوا أو باللمس بين الناس.',
    b:'الأطفال هم أكتر فئة متأثرة، وأي تأخير بساعات ممكن يكلّف أرواح — الوضع مستعجل جدًا.'},
};

/* ---------- معلومة التتويج الموزّعة (مختلفة لكل فريق) ---------- */
const CROWN_INFO = {
  stars:'الموسم الصعب اللي جاي محتاج تخطيط أزمات وتعاون مع الجيران أكتر ما هو محتاج قوة وعضلات — القائد اللي بيرفض التعاون تمامًا هيعزل القرية وقت ما تحتاج غيرها.',
  knights:'المورد القيّم الصعب اللي عند القرية مستحيل يتستغل من غير تعاون مع الجهة المجاورة — فالانفتاح على التفاوض شرط لبقاء القرية، مش رفاهية.',
  reality:'النزيه الرمزي ضعيف في التنفيذ، بس ثقة الناس فيه بتخلّيهم يلتفّوا حواليه وينفّذوا بحماس — يعني ضعفه التنفيذي ممكن يتعوّض بذراع منفّذ، وقبول الناس نص المعركة.',
  changers:'العقل المبتكر لو اتحطّ جنبه منفّذ قوي بيبقى ثنائي كامل — عقل بيخطّط وذراع بينفّذ. الحل مش دايمًا فرد واحد؛ أحيانًا الاختيار الصح ثنائي.',
  legends:'صاحب الموارد شايل ضغينة شخصية قديمة ضد واحد من المرشحين — والضغينة دي لو حكمت قراره ممكن تفكّك القرية بدل ما تبنيها. اسألوا: هيقود بمصلحة القرية ولا بحساباته الشخصية؟',
};

/* ---------- بيانات مشاريع محطّة ٥ ---------- */
const PROJECTS = [
  ['١. دواجن منزلية','٦٠','٨','شهرين','منخفضة','عالية','لا'],
  ['٢. زراعة تعاقدية مع الجيران','٥٠','٢٠','٣ شهور','منخفضة','عالية','نعم (كليًا)'],
  ['٣. ورشة حِرَف للتصدير','١٢٠','١٢','٤ شهور','متوسطة','عالية','لا'],
  ['٤. مشتل شتلات','٤٥','٦','٥ شهور','منخفضة','متوسطة','لا'],
  ['٥. تربية نحل','٧٠','٥','٣ شهور','متوسطة','متوسطة','لا'],
];

/* ---------- مرشّحو التتويج ---------- */
const CANDIDATES = [
  ['الحاسم القوي','قوّة وحماية، الناس بتهابه، صلب في الأزمات.','عنيد، ورافض أي تعاون مع الجيران رفض قاطع.'],
  ['صاحب الموارد الحكيم','أكبرهم سنًّا وأغناهم، عنده حكمة وإمكانيات، منفتح على التفاوض.','شايل ضغينة شخصية قديمة لواحد من المرشحين.'],
  ['النزيه الرمزي','أكتر واحد محبوب وموثوق، قدوة في نزاهته، وهو اللي علّم صاحب الموارد ينفتح.','ضعيف جسديًا، وقدرته على التنفيذ محدودة.'],
  ['العقل المبتكر','أذكى واحد، بيحلّ أي مشكلة، وهو اللي علّم القرية أدوات أحسن.','ضعيف جسديًا مايقدرش ينفّذ لوحده، ورافض التعاون مع الجيران.'],
];

/* ============================================================
   بنية المحطّات — read=معلومة · choice=اختيار · text/fields=كتابة
   ============================================================ */
function STAGES(team){
  const F = FRAGMENTS[team], C = CROWN_INFO[team];
  return [
  { id:'s1', tab:'م١', title:'الهدف', principle:'اختاروا المقياس الصح قبل ما تتحرّكوا.', blocks:[
    {t:'read', label:'الموقف', html:'قرية عايشة على المساعدات من سنين، وجالكم الشهر ده ميزانية ومجهود محدودين. المؤسسة الأم أعلنت إنها هتكافئ المواقع اللي توصّل مساعدة لأكبر عدد من الناس — رقم واضح وسهل تقيسوه.'},
    {t:'choice', key:'s1_choice', label:'فين تحطّوا جهد الشهر الأول؟', opts:[
      {k:'a', t:'(أ) توزيع سريع لأكبر عدد ممكن — يرفع «عدد المستفيدين» فورًا.'},
      {k:'b', t:'(ب) تشغيل ٦ أسر في نشاط بيجيب دخل — رقم صغير، بس اكتفاء حقيقي.'},
      {k:'c', t:'(ج) الاتنين بنص الجهد — حل «متوازن».'}]},
    {t:'text', key:'s1_goal', label:'الهدف الحقيقي القابل للقياس اللي بنستهدفه', ph:'اكتبوا الهدف اللي فعلاً بيقيس المكسب الحقيقي من الشهر ده…'},
  ]},

  { id:'s2', tab:'م٢', title:'المعلومات', principle:'الحقيقة موزّعة — شاركوا، اسمعوا، وزِنوا قبل ما تصدّقوا.', blocks:[
    {t:'read', label:'الأزمة (تُقرأ على الجميع)', html:'انتشر مرض بين أطفال القرية بسرعة — إسهال وجفاف شديد. الناس خايفة والشغل وقف. محدش لوحده فاهم السبب الحقيقي ولا الحل الأمثل — كل فريق معاه جزء بس من الصورة.'},
    {t:'secret', label:'🔒 معلوماتكم السرّية (بتاعتكم إنتوا بس)', pairs:[
      {n:'المعلومة الأولى', v:F.a},
      {n:'المعلومة الثانية', v:F.b}],
      hint:'شارِكوا بحكمة في السوق. الحل الكامل محتاج معلومات من ٣ فرق على الأقل — ومش كل معلومة تتصدّق على وشها.'},

/* ============================================================
   الحالة + الفايربيز (مستند لكل فريق)
   ============================================================ */
const firebaseConfig = {
  apiKey:"AIzaSyDj0bV5gsyRbqpxzW0Zd9wjYmq53-Xdj3w",
  authDomain:"fouad-perspective.firebaseapp.com",
  projectId:"fouad-perspective",
  storageBucket:"fouad-perspective.firebasestorage.app",
  messagingSenderId:"1068763865336",
  appId:"1:1068763865336:web:b791abcd22d536aedd5b0d"
};
let TEAM=null, STAGE_LIST=[], answers={}, cur=0, docRef=null, cdb=null, saveTimer=null, localStamp=0;
let gateMax=99, ctrlRef=null, ctrlActive=false;   // بوّابة المراحل (99 = كله مفتوح لحد ما الأدمن يشتغل)
const LSKEY = t => 'munataf_input_'+t;

function initCloud(){
  try{
    if(typeof firebase==='undefined'){ setCloud(false); return; }
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    cdb=firebase.firestore();
    try{ cdb.enablePersistence({synchronizeTabs:true}); }catch(e){}
    docRef=cdb.collection('munataf_inputs').doc(TEAM);

    // بوّابة المراحل — مستند تحكّم واحد صغير جدًا.
    // onSnapshot بيدفع التغيير بس لما يحصل فعلاً؛ وهو ساكت = صفر قراءات.
    ctrlRef=cdb.collection('munataf_control').doc('state');
    ctrlRef.onSnapshot(s=>{
      const d=s.data();
      if(d && typeof d.openStage==='number'){ ctrlActive=true; gateMax=d.openStage; }
      else { ctrlActive=false; gateMax=STAGE_LIST.length-1; }   // مفيش أدمن → كله مفتوح
      if(cur>gateMax) cur=gateMax;
      renderStage(); renderRail();
    }, e=>{ ctrlActive=false; gateMax=STAGE_LIST.length-1; });

    // اقرأ مرّة عند البداية (وبعدها الفريق هو مصدر مستنده)
    docRef.get().then(snap=>{
      setCloud(true);
      const d=snap.data();
      if(d && d.answers){
        // ادمج السحابة لو أحدث من المحلي
        answers = Object.assign({}, answers, d.answers);
        saveLocal(); renderStage(); renderRail();
      } else { pushCloud(); }
    }).catch(err=>{ console.error('cloud get',err); setCloud(false); });
  }catch(e){ console.error(e); setCloud(false); }
}
function setCloud(ok){ const el=document.getElementById('cloud'); if(!el) return;
  el.className='cloud '+(ok?'':'off'); el.textContent = ok?'☁ متزامن':'⚠ محلي فقط'; }
function saveLocal(){ try{ localStorage.setItem(LSKEY(TEAM), JSON.stringify(answers)); }catch(e){} }
function loadLocal(){ try{ const r=localStorage.getItem(LSKEY(TEAM)); return r?JSON.parse(r):{}; }catch(e){ return {}; } }
function pushCloud(){
  if(!docRef) return;
  localStamp=Date.now();
  docRef.set({ team:TEAM, name:TEAMS[TEAM].name, answers, updatedAt:localStamp })
    .then(()=>setCloud(true)).catch(e=>{ console.error('cloud write',e); setCloud(false); });
}
function queueSave(){
  saveLocal(); flash();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(pushCloud, 1500);   // يكتب بعد ما يهدأ الكتابة (أخف على الفايرستور؛ المحلي فوري)
}
let flashTimer=null;
function flash(){ const t=document.getElementById('savedTag'); if(!t) return;
  t.classList.add('show'); clearTimeout(flashTimer); flashTimer=setTimeout(()=>t.classList.remove('show'),900); }

/* ============================================================
   الإقلاع: الفريق من الرابط أو الاختيار
   ============================================================ */
function boot(){
  const p=new URLSearchParams(location.search).get('team');
  if(p && TEAMS[p]){ startTeam(p); }
  else { showPicker(); }
}
function showPicker(){
  document.getElementById('picker').style.display='block';
  const g=document.getElementById('pkGrid'); g.innerHTML='';
  TEAM_ORDER.forEach(id=>{
    const b=document.createElement('button'); b.className='pk-btn';
    b.innerHTML=`<span class="pk-dot" style="background:${TEAMS[id].color}"></span>
      <span dir="${TEAMS[id].dir}">${TEAMS[id].name}</span>`;
    b.onclick=()=>{ history.replaceState(null,'',location.pathname+'?team='+id); startTeam(id); };
    g.appendChild(b);
  });
}
function startTeam(id){
  TEAM=id; STAGE_LIST=STAGES(id); answers=loadLocal();
  document.getElementById('picker').style.display='none';
  document.getElementById('app').style.display='block';
  const T=TEAMS[id];
  const badge=document.getElementById('tbBadge');
  badge.textContent=T.badge; badge.style.background=`linear-gradient(145deg,${T.color},${shade(T.color)})`;
  const nm=document.getElementById('tbName'); nm.textContent=T.name; nm.setAttribute('dir',T.dir);
  document.getElementById('switchNote').innerHTML=
    'مش فريقك؟ <a href="'+location.pathname+'">غيّر الفريق</a> · بياناتكم بتتحفظ تلقائيًا.';
  renderRail(); renderStage(); initCloud();
}
function shade(hex){ // اغمق شوية للـ badge
  try{ const n=parseInt(hex.slice(1),16); let r=(n>>16)-40,g=((n>>8)&255)-40,b=(n&255)-40;
    r=Math.max(0,r);g=Math.max(0,g);b=Math.max(0,b);
    return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1); }catch(e){ return hex; }
}

/* ============================================================
   الرسم
   ============================================================ */
function stageAnswered(st){
  return st.blocks.some(b=>{
    if(b.key) return !!answers[b.key];
    if(b.fields) return b.fields.some(f=>!!answers[f.key]);
    return false;
  });
}
function renderRail(){
  const rail=document.getElementById('rail'); rail.innerHTML='';
  STAGE_LIST.forEach((st,i)=>{
    const locked = i>gateMax;
    const c=document.createElement('button');
    c.className='rchip'+(i===cur?' on':'')+(st.crown?' crown':'')+(locked?' locked':'');
    c.innerHTML=`<span>${st.tab}</span>${locked?'<span class="lk">🔒</span>':(stageAnswered(st)?'<span class="tick">✓</span>':'')}`;
    c.onclick=()=>{ if(locked) return; cur=i; renderStage(); renderRail(); scrollTop(); };
    rail.appendChild(c);
  });
}
function renderStage(){
  if(cur>gateMax) cur=gateMax; if(cur<0) cur=0;
  const st=STAGE_LIST[cur];
  const host=document.getElementById('stageHost');
  const atGate = cur>=gateMax && cur<STAGE_LIST.length-1;
  let h=`<div class="stage"><div class="st-head">
      <span class="st-num">${st.tab}</span>
      <span class="st-title">${st.title}</span></div>
      ${st.principle?`<div class="st-principle">${st.principle}</div>`:''}`;
  st.blocks.forEach(b=> h+=renderBlock(b));
  if(atGate && ctrlActive)
    h+=`<div class="gate-wait">✍️ لسه ماتنقلش للمحطة الجاية.<br><b>مستنيين المدرّب يفتحها.</b></div>`;
  h+='</div>';
  host.innerHTML=h;
  bindInputs();
  // الأزرار
  document.getElementById('prevBtn').disabled = cur===0;
  const nb=document.getElementById('nextBtn');
  if(cur===STAGE_LIST.length-1){ nb.textContent='خلصنا ✓'; nb.disabled=false; }
  else if(atGate){ nb.textContent='🔒 مقفولة'; nb.disabled=true; }
  else { nb.textContent='التالي ►'; nb.disabled=false; }
}
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderBlock(b){
  if(b.t==='read')
    return `<div class="block read"><div class="b-label">◆ ${b.label}</div><div class="b-text dim">${b.html}</div></div>`;
  if(b.t==='secret'){
    let p=b.pairs.map(x=>`<div class="info-pair">${x.n?`<div class="n">${x.n}</div>`:''}<div class="v">${x.v}</div></div>`).join('');
    return `<div class="block secret"><div class="b-label">${b.label}</div>${p}${b.hint?`<div class="hint">${b.hint}</div>`:''}</div>`;
  }
  if(b.t==='choice'){
    const cur=answers[b.key];
    const opts=b.opts.map(o=>`<button class="choice${cur===o.k?' sel':''}" data-choice="${b.key}" data-k="${o.k}">
        <span class="mk">✓</span><span>${o.t}</span></button>`).join('');
    return `<div class="block"><div class="b-label">◆ ${b.label}</div><div class="choices">${opts}</div></div>`;
  }
  if(b.t==='text'){
    return `<div class="block"><div class="b-label">✎ ${b.label}</div>
      <textarea data-key="${b.key}" placeholder="${b.ph||''}">${esc(answers[b.key])}</textarea></div>`;
  }
  if(b.t==='fields'){
    const f=b.fields.map(x=>`<div class="fld${x.req?' req':''}"><label>${x.label}</label>
      <textarea data-key="${x.key}" placeholder="${x.ph||''}">${esc(answers[x.key])}</textarea></div>`).join('');
    return `<div class="block"><div class="b-label">✎ ${b.label}</div>${f}</div>`;
  }
  if(b.t==='projects'){
    const head=['المشروع','التكلفة','أسر','أول دخل','مخاطرة','تكرار','معتمد على الجيران'];
    const rows=PROJECTS.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('');
    return `<div class="block"><div class="b-label">◆ المشاريع الخمسة</div>
      <div class="tbl-scroll"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
      <tbody>${rows}</tbody></table></div></div>`;
  }
  if(b.t==='candidates'){
    const c=CANDIDATES.map(x=>`<div class="cand"><h4>${x[0]}</h4>
      <div class="pro">✓ ${x[1]}</div><div class="con">✗ ${x[2]}</div></div>`).join('');
    return `<div class="block"><div class="b-label">◆ المرشّحون الأربعة</div>${c}</div>`;
  }
  return '';
}

function bindInputs(){
  document.querySelectorAll('[data-choice]').forEach(el=>{
    el.onclick=()=>{
      const key=el.getAttribute('data-choice'), k=el.getAttribute('data-k');
      answers[key] = (answers[key]===k) ? '' : k;   // ضغطة تانية تلغي
      queueSave(); renderStage(); renderRail();
    };
  });
  document.querySelectorAll('textarea[data-key]').forEach(el=>{
    el.addEventListener('input', ()=>{ answers[el.getAttribute('data-key')]=el.value; queueSave(); });
    el.addEventListener('blur', ()=>{ renderRail(); pushCloud(); });
  });
}

function go(dir){
  if(cur===STAGE_LIST.length-1 && dir>0){ pushCloud(); flash(); return; }
  const max=Math.min(STAGE_LIST.length-1, gateMax);   // مايعديش البوّابة اللي فاتحها المدرّب
  cur=Math.max(0, Math.min(max, cur+dir));
  renderStage(); renderRail(); scrollTop();
}
function scrollTop(){ window.scrollTo({top:0,behavior:'smooth'}); }

boot();
</script>
