<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المُنعطَف — شاشة المدرّب (أدمن)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F2A2E; --ink-2:#143A40; --ink-3:#1C4A51; --raise:#22565E;
    --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.16);
    --gold:#EBB94A; --gold-soft:#F0CE7E; --gold-deep:#C9932B;
    --green:#5BBF8A; --green-soft:#8FD9B4;
    --cream:#F4EEDF; --muted:#9FB3B4; --clay:#E08A6A; --sage:#7FC9A4;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:'IBM Plex Sans Arabic',sans-serif;line-height:1.55;color:var(--cream);
    background:radial-gradient(1200px 500px at 80% -10%,rgba(235,185,74,.10),transparent 60%),var(--ink);min-height:100vh}
  .wrap{max-width:1100px;margin:0 auto;padding:14px 16px 60px}
  a{color:var(--gold-soft)}

  /* header */
  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line)}
  .top h1{font-family:'Reem Kufi';font-size:22px;margin:0;color:var(--gold-soft)}
  .top .sub{font-size:12px;color:var(--muted)}
  .cloud{margin-inline-start:auto;font-size:11.5px;padding:5px 10px;border-radius:8px;border:1px solid var(--line-2);
    background:rgba(91,191,138,.10);color:var(--green-soft);white-space:nowrap}
  .cloud.off{color:var(--gold-soft);background:rgba(235,185,74,.09);border-color:rgba(235,185,74,.35)}
  .links{display:flex;gap:8px;font-size:12.5px}
  .links a{padding:5px 11px;border:1px solid var(--line-2);border-radius:9px;text-decoration:none;background:var(--ink-2)}
  .links a:hover{border-color:var(--gold)}

  /* gate control */
  .gate{margin-top:14px;background:var(--ink-2);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
  .gate .g-lab{font-family:'Reem Kufi';font-size:13px;color:var(--gold-soft);margin-bottom:9px;display:flex;align-items:center;gap:8px}
  .g-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .g-chips{display:flex;gap:5px;flex-wrap:wrap;flex:1;min-width:220px}
  .gchip{font-family:'Reem Kufi';font-size:13px;padding:7px 11px;border-radius:9px;border:1px solid var(--line);
    background:var(--ink);color:var(--muted);white-space:nowrap;transition:.14s;cursor:default}
  .gchip.open{background:rgba(91,191,138,.12);color:var(--green-soft);border-color:rgba(91,191,138,.4)}
  .gchip.now{background:var(--gold);color:#20130a;border-color:var(--gold);font-weight:700;box-shadow:0 4px 14px rgba(235,185,74,.3)}
  .gbtn{font-family:'Reem Kufi';font-size:14px;padding:9px 14px;border-radius:11px;border:1px solid var(--line-2);
    background:var(--ink-3);color:var(--cream);cursor:pointer;transition:.14s;white-space:nowrap}
  .gbtn:hover{border-color:var(--gold);background:var(--raise)}
  .gbtn:disabled{opacity:.4;cursor:default}
  .gbtn.gold{background:linear-gradient(145deg,var(--gold),var(--gold-deep));color:#20130a;border:none;font-weight:700}
  .gbtn.ghost{background:transparent}
  .g-state{font-size:12.5px;color:var(--muted);margin-top:9px}
  .g-state b{color:var(--green-soft)}

  /* viewer */
  .vhead{margin-top:20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .vhead h2{font-family:'Reem Kufi';font-size:19px;margin:0}
  .tabs{display:flex;gap:6px;overflow-x:auto;margin-top:12px;padding-bottom:4px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{font-family:'Reem Kufi';flex:0 0 auto;font-size:13.5px;padding:7px 13px;border-radius:10px;border:1px solid var(--line);
    background:var(--ink-2);color:var(--muted);cursor:pointer;white-space:nowrap;transition:.14s}
  .tab:hover{border-color:var(--gold-deep);color:var(--cream)}
  .tab.on{background:var(--ink-3);color:var(--gold);border-color:var(--gold)}
  .tab .lk{opacity:.6;font-size:11px}

  .openbar{margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:rgba(235,185,74,.06);border:1px dashed rgba(235,185,74,.3);border-radius:12px;padding:10px 14px}
  .openbar .txt{font-size:13px;color:var(--gold-soft)}

  /* choice summary strip */
  .summary{margin-top:14px;display:grid;gap:9px}
  .srow{background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:10px 13px}
  .srow .sl{font-family:'Reem Kufi';font-size:12.5px;color:var(--gold-soft);margin-bottom:7px}
  .schips{display:flex;gap:7px;flex-wrap:wrap}
  .schip{font-size:12.5px;padding:5px 10px;border-radius:8px;border:1px solid var(--line-2);background:var(--ink);
    display:flex;align-items:center;gap:6px}
  .schip .tn{color:var(--muted);font-size:11px}
  .schip .tv{font-weight:600}
  .schip.good{border-color:rgba(91,191,138,.5);background:rgba(91,191,138,.10)} .schip.good .tv{color:var(--green-soft)}
  .schip.ok{border-color:rgba(235,185,74,.45);background:rgba(235,185,74,.08)} .schip.ok .tv{color:var(--gold-soft)}
  .schip.bad{border-color:rgba(224,138,106,.5);background:rgba(224,138,106,.10)} .schip.bad .tv{color:var(--clay)}
  .schip.none{opacity:.5} .schip.none .tv{color:var(--muted)}

  /* team cards grid */
  .grid{margin-top:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:13px}
  .tcard{background:var(--ink-2);border:1px solid var(--line);border-radius:16px;padding:14px 16px;position:relative}
  .tcard.off{opacity:.5}
  .tcard::before{content:'';position:absolute;inset-block:14px;inset-inline-start:0;width:3px;border-radius:3px;background:var(--dot,var(--muted))}
  .tc-head{display:flex;align-items:center;gap:9px;margin-bottom:11px}
  .tc-name{font-family:'Reem Kufi';font-size:17px;font-weight:700}
  .tc-time{margin-inline-start:auto;font-size:10.5px;color:var(--muted)}
  .tc-time.pulse{color:var(--green)}
  .fitem{margin-bottom:11px}
  .fitem:last-child{margin-bottom:0}
  .fl{font-size:11.5px;color:var(--muted);font-family:'Reem Kufi';margin-bottom:3px}
  .fv{font-size:14px;color:var(--cream);white-space:pre-wrap;word-break:break-word}
  .fv.empty{color:#5c7173;font-style:italic}
  .fv.pill{display:inline-block;padding:3px 10px;border-radius:8px;font-weight:600;font-size:13px}
  .fv.pill.good{background:rgba(91,191,138,.12);color:var(--green-soft)}
  .fv.pill.ok{background:rgba(235,185,74,.10);color:var(--gold-soft)}
  .fv.pill.bad{background:rgba(224,138,106,.12);color:var(--clay)}
  .fv.pill.neutral{background:var(--ink-3);color:var(--cream)}

  .setup{max-width:520px;margin:12vh auto;background:var(--ink-2);border:1px solid var(--line);border-radius:20px;padding:24px}
  .setup h1{font-family:'Reem Kufi';color:var(--gold-soft);margin:0 0 6px}
  .setup p{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="wrap" id="wrap">

  <div class="top">
    <div>
      <h1>المُنعطَف · شاشة المدرّب</h1>
      <div class="sub">افتح المراحل للفرق · واتفرّج على كتابتهم لايف</div>
    </div>
    <div class="cloud off" id="cloud">⚠ غير متصل</div>
  </div>
  <div class="links" style="margin-top:10px">
    <a href="teams.html" target="_blank">↗ لوحة الدرجات</a>
    <a href="journey.html" target="_blank">↗ شاشة العرض (البروجيكتور)</a>
    <a href="trainer.html" target="_blank">↗ اسكربت الميسّر</a>
  </div>

  <!-- GATE -->
  <div class="gate">
    <div class="g-lab">🚪 بوّابة الفرق — المرحلة اللي الفرق يقدروا يوصلوها</div>
    <div class="g-row">
      <button class="gbtn" id="prevGate" onclick="gatePrev()">◄ رجّع</button>
      <div class="g-chips" id="gateChips"></div>
      <button class="gbtn gold" id="nextGate" onclick="gateNext()">افتح الجاية ►</button>
    </div>
    <div class="g-state" id="gateState"></div>
    <div style="margin-top:9px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="gbtn ghost" id="startBtn" onclick="startSession()" style="display:none">▶ ابدأ الجلسة (اقفل عند م١)</button>
      <button class="gbtn ghost" onclick="openAll()">🔓 افتح كل المراحل</button>
      <button class="gbtn ghost" onclick="resetGate()">↺ اقفل من البداية</button>
    </div>
  </div>

  <!-- VIEWER -->
  <div class="vhead"><h2>👁 كتابة الفرق — لحظة بلحظة</h2></div>
  <div class="tabs" id="viewTabs"></div>
  <div class="openbar">
    <div class="txt" id="openTxt"></div>
    <button class="gbtn gold" id="openThis" onclick="openViewed()" style="font-size:13px;padding:7px 12px">🔓 افتح المرحلة دي للفرق</button>
  </div>
  <div class="summary" id="summary"></div>
  <div class="grid" id="grid"></div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey:"AIzaSyDj0bV5gsyRbqpxzW0Zd9wjYmq53-Xdj3w",
  authDomain:"fouad-perspective.firebaseapp.com",
  projectId:"fouad-perspective",
  storageBucket:"fouad-perspective.firebasestorage.app",
  messagingSenderId:"1068763865336",
  appId:"1:1068763865336:web:b791abcd22d536aedd5b0d"
};

const TEAMS = {
  stars:    {name:'النجوم',            color:'#EBB94A', dir:'rtl'},
  knights:  {name:'الفرسان',           color:'#5BBF8A', dir:'rtl'},
  reality:  {name:'Reality',           color:'#7FB2E0', dir:'ltr'},
  changers: {name:'The Game Changers', color:'#E08A6A', dir:'ltr'},
  legends:  {name:'Legends',           color:'#C79BE0', dir:'ltr'},
};
const TEAM_ORDER = ['stars','knights','reality','changers','legends'];

/* مخطّط العرض — نفس مفاتيح تطبيق الفرق + تلوين الصح/الفخّ */
const SV = [
  {id:'s1', tab:'م١ الهدف', fields:[
    {key:'s1_choice', label:'القرار', opts:{a:['(أ) المقياس المزيّف','bad'], b:['(ب) الاكتفاء','good'], c:['(ج) مزيج','ok']}},
    {key:'s1_goal', label:'الهدف القابل للقياس'},
  ]},
  {id:'s2', tab:'م٢ المعلومات', fields:[
    {key:'s2_resp', label:'استجابة الأزمة'},
  ]},
  {id:'s3', tab:'م٣ المشورة', fields:[
    {key:'s3_quad', label:'مين يستشيروا', opts:{both:['الخبير + المتأثرين','good'], people:['المتأثرين','ok'], expert:['الخبير فقط','bad'], none:['بلا مشورة','bad']}},
    {key:'s3_plan', label:'مين استشاروا + الخطة'},
  ]},
  {id:'s4', tab:'م٤ البدائل', fields:[
    {key:'s4_alt1', label:'بديل ١'},
    {key:'s4_alt2', label:'بديل ٢'},
    {key:'s4_alt3', label:'بديل ٣'},
    {key:'s4_stop', label:'بديل التوقّف (إجباري)'},
    {key:'s4_commit', label:'الالتزام', opts:{a:['(أ) ضخّ رصيد','bad'], b:['(ب) وقف وتحوّل','good'], c:['(ج) نص ونص','bad']}},
  ]},
  {id:'s5', tab:'م٥ الاختيار', fields:[
    {key:'s5_matrix', label:'المشروع', opts:{p1:['١ دواجن','good'], p2:['٢ زراعة (مشطوب)','bad'], p3:['٣ ورشة (مشطوب)','bad'], p4:['٤ مشتل (مشطوب)','bad'], p5:['٥ نحل','ok']}},
    {key:'s5_why', label:'ليه شطبنا + المعايير'},
    {key:'s5_mm', label:'Minimax (التخزين)', opts:{a:['(أ)','bad'], b:['(ب) حماية الأرضية','good'], c:['(ج)','bad']}},
    {key:'s5_mx', label:'Maximax (المعرض)', opts:{a:['(أ) للأقصى','good'], b:['(ب) محافظ','ok'], c:['(ج)','bad']}},
  ]},
  {id:'s6', tab:'م٦ التنفيذ', fields:[
    {key:'s6_who', label:'مين (اسم واحد)'},
    {key:'s6_when', label:'إمتى'},
    {key:'s6_much', label:'بكام'},
    {key:'s6_where', label:'فين'},
    {key:'s6_follow', label:'مين يتابع'},
    {key:'s6_48', label:'أول خطوة ٤٨ ساعة'},
  ]},
  {id:'s7', tab:'م٧ العوائق', fields:[
    {key:'s7_wide', label:'① البديل الثالث'},
    {key:'s7_friend', label:'② نصيحة الصاحب'},
    {key:'s7_distance', label:'③ بعد ٦ شهور'},
    {key:'s7_spark', label:'④ شرارة التحذير'},
  ]},
  {id:'crown', tab:'★ التتويج', fields:[
    {key:'cr_c1', label:'معيار ١'},
    {key:'cr_c2', label:'معيار ٢'},
    {key:'cr_c3', label:'معيار ٣'},
    {key:'cr_pick', label:'الترشيح', opts:{c1:['الحاسم القوي','neutral'], c2:['صاحب الموارد','neutral'], c3:['النزيه الرمزي','neutral'], c4:['العقل المبتكر','neutral'], pair:['ثنائي (وسّع)','good']}},
    {key:'cr_plea', label:'المرافعة'},
  ]},
];

/* ---------------- state + cloud ---------------- */
let gate=null;          // null = لسه ماتفعّلتش البوّابة (كله مفتوح)
let viewIdx=0;
let TD={};              // بيانات الفرق {teamId:{answers,updatedAt}}
let lastStamp={};       // لرصد التحديث الحيّ
let ctrlRef=null, inputsRef=null;

function setCloud(ok){ const el=document.getElementById('cloud');
  el.className='cloud '+(ok?'':'off'); el.textContent = ok?'☁ متصل ومتزامن':'⚠ غير متصل'; }

function initCloud(){
  try{
    if(typeof firebase==='undefined'){ setCloud(false); return; }
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db=firebase.firestore();
    try{ db.enablePersistence({synchronizeTabs:true}); }catch(e){}

    ctrlRef=db.collection('munataf_control').doc('state');
    ctrlRef.onSnapshot(s=>{
      setCloud(true);
      const d=s.data();
      gate = (d && typeof d.openStage==='number') ? d.openStage : null;
      if(gate!=null) viewIdx=Math.max(0,Math.min(SV.length-1,gate));
      renderGate(); renderTabs(); renderView();
    }, e=>{ console.error(e); setCloud(false); });

    inputsRef=db.collection('munataf_inputs');
    inputsRef.onSnapshot(qs=>{
      setCloud(true);
      qs.forEach(doc=>{ TD[doc.id]=doc.data(); });
      renderView();
    }, e=>{ console.error(e); setCloud(false); });
  }catch(e){ console.error(e); setCloud(false); }
}

/* ---------------- gate actions ---------------- */
function writeGate(n){ if(!ctrlRef) return; n=Math.max(0,Math.min(SV.length-1,n));
  ctrlRef.set({openStage:n, updatedAt:Date.now()}).catch(e=>console.error(e)); }
function startSession(){ writeGate(0); }
function gateNext(){ writeGate((gate==null? -1 : gate)+1); }
function gatePrev(){ if(gate!=null) writeGate(gate-1); }
function openAll(){ writeGate(SV.length-1); }
function resetGate(){ writeGate(0); }
function openViewed(){ writeGate(viewIdx); }

/* ---------------- render: gate ---------------- */
function renderGate(){
  const chips=document.getElementById('gateChips'); chips.innerHTML='';
  SV.forEach((st,i)=>{
    const open = gate!=null && i<=gate;
    const now  = gate!=null && i===gate;
    const c=document.createElement('div');
    c.className='gchip'+(open?' open':'')+(now?' now':'');
    c.textContent=st.tab.split(' ')[0];
    c.title=st.tab;
    chips.appendChild(c);
  });
  const st=document.getElementById('gateState');
  document.getElementById('startBtn').style.display = gate==null?'inline-block':'none';
  document.getElementById('prevGate').disabled = (gate==null||gate<=0);
  if(gate==null) st.innerHTML='الوضع: <b>كل المراحل مفتوحة</b> (البوّابة لسه ماتفعّلتش — الفرق تقدر تتنقّل حر). اضغط «ابدأ الجلسة» تقفل عند م١.';
  else st.innerHTML='الفرق دلوقتي عند: <b>'+SV[gate].tab+'</b> — مايقدروش يعدّوها لحد ما تفتح الجاية.';
}

/* ---------------- render: tabs + view ---------------- */
function renderTabs(){
  const t=document.getElementById('viewTabs'); t.innerHTML='';
  SV.forEach((st,i)=>{
    const locked = gate!=null && i>gate;
    const b=document.createElement('button');
    b.className='tab'+(i===viewIdx?' on':'');
    b.innerHTML=st.tab+(locked?' <span class="lk">🔒</span>':'');
    b.onclick=()=>{ viewIdx=i; renderTabs(); renderView(); };
    t.appendChild(b);
  });
}
function timeStr(ms){ if(!ms) return ''; const d=new Date(ms);
  return d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }

function renderView(){
  const st=SV[viewIdx];
  // openbar text
  const ot=document.getElementById('openTxt');
  const isOpen = gate!=null && viewIdx<=gate;
  ot.innerHTML = 'بتتفرّج على: <b style="color:var(--cream)">'+st.tab+'</b> — '+
    (gate==null?'(البوّابة متعطّلة)': isOpen?'✅ مفتوحة للفرق':'🔒 لسه مقفولة للفرق');
  document.getElementById('openThis').style.display = (gate!=null && viewIdx>gate)?'inline-block':'none';

  // choice summary strip
  const choiceFields = st.fields.filter(f=>f.opts);
  const sum=document.getElementById('summary'); sum.innerHTML='';
  choiceFields.forEach(f=>{
    let chips='';
    TEAM_ORDER.forEach(tid=>{
      const v = TD[tid] && TD[tid].answers ? TD[tid].answers[f.key] : '';
      let cls='none', txt='—';
      if(v && f.opts[v]){ cls=f.opts[v][1]; txt=f.opts[v][0]; }
      chips+=`<div class="schip ${cls}"><span class="tn">${shortName(tid)}</span><span class="tv">${txt}</span></div>`;
    });
    sum.innerHTML+=`<div class="srow"><div class="sl">◆ ${f.label} — مين اختار إيه؟</div><div class="schips">${chips}</div></div>`;
  });

  // team cards
  const grid=document.getElementById('grid'); grid.innerHTML='';
  TEAM_ORDER.forEach(tid=>{
    const T=TEAMS[tid], data=TD[tid], ans=(data&&data.answers)||{};
    const connected=!!data;
    const stamp=data&&data.updatedAt||0;
    const pulse = connected && lastStamp[tid] && stamp>lastStamp[tid];
    lastStamp[tid]=stamp;
    let body='';
    st.fields.forEach(f=>{
      const raw=ans[f.key];
      if(f.opts){
        if(raw && f.opts[raw]) body+=`<div class="fitem"><div class="fl">${f.label}</div><span class="fv pill ${f.opts[raw][1]}">${f.opts[raw][0]}</span></div>`;
        else body+=`<div class="fitem"><div class="fl">${f.label}</div><span class="fv empty">— لسه</span></div>`;
      } else {
        body+=`<div class="fitem"><div class="fl">${f.label}</div><div class="fv${raw?'':' empty'}">${raw?escapeHtml(raw):'— لسه'}</div></div>`;
      }
    });
    grid.innerHTML+=`<div class="tcard ${connected?'':'off'}" style="--dot:${T.color}">
      <div class="tc-head">
        <span class="tc-name" dir="${T.dir}">${T.name}</span>
        <span class="tc-time ${pulse?'pulse':''}">${connected?('آخر كتابة '+timeStr(stamp)):'مش متصل'}</span>
      </div>${body}</div>`;
  });
}
function shortName(tid){ const n=TEAMS[tid].name; return n.length>9?n.slice(0,9):n; }
function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

initCloud();
renderGate(); renderTabs(); renderView();
</script>
</body>
</html>
