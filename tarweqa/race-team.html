<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سباق الإجابات — شاشة الفريق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400..700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --chalk:#E9EBE4; --paper:#F7F8F4; --ink:#14181A; --soft:#5A625F;
  --red:#E23B2E; --teal:#14655C; --amber:#E4A11B; --rule:#C9CDC2;
  --shadow:0 1px 0 var(--rule), 0 12px 30px -18px rgba(20,24,26,.5);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--chalk); color:var(--ink);
  font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;
  min-height:100dvh; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 28px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.kufi{font-family:"Reem Kufi",serif}

/* ===== شريط الفريق ===== */
.bar{
  display:flex;align-items:center;gap:10px;background:var(--paper);
  border:1px solid var(--rule);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)
}
.bar .nm{font-family:"Reem Kufi";font-size:18px;line-height:1.2;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{border:1px solid var(--rule);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--soft);white-space:nowrap}
.chip b{color:var(--ink);font-size:15px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--rule);flex:none}
.dot.on{background:var(--teal);box-shadow:0 0 0 3px rgba(20,101,92,.15)}

/* ===== المسرح ===== */
.stage{
  margin-top:12px;background:var(--paper);border:1px solid var(--rule);
  border-radius:18px;padding:18px 16px 20px;box-shadow:var(--shadow);min-height:58dvh;
  display:flex;flex-direction:column
}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--soft);text-transform:uppercase}
.qnum{font-family:"IBM Plex Mono";font-size:12px;color:var(--soft)}
.qtext{font-family:"Reem Kufi";font-size:clamp(22px,6.2vw,30px);line-height:1.45;margin:10px 0 4px}

/* ===== الكرونوغراف: التوقيت + قيمة السؤال بتنزل قدام عينك ===== */
.chrono{margin:16px 0 6px}
.chrono .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
.clock{font-family:"IBM Plex Mono";font-weight:600;font-size:30px;letter-spacing:-.02em}
.worth{text-align:left}
.worth .lab{font-size:11px;color:var(--soft);display:block}
.worth .val{font-family:"IBM Plex Mono";font-weight:600;font-size:26px;color:var(--teal)}
.track{height:12px;background:var(--chalk);border:1px solid var(--rule);border-radius:999px;overflow:hidden}
.fill{height:100%;width:100%;background:var(--teal);border-radius:999px;transform-origin:right center}
.fill.warn{background:var(--amber)} .fill.hot{background:var(--red)}
.ticks{display:flex;justify-content:space-between;margin-top:4px;font-size:10px;color:var(--soft)}

/* ===== الإدخال ===== */
.answer{margin-top:auto;padding-top:16px}
textarea,input[type=text]{
  width:100%;font-family:inherit;font-size:17px;padding:13px 14px;border-radius:13px;
  border:1.5px solid var(--rule);background:#fff;color:var(--ink);resize:none
}
textarea:focus,input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(20,101,92,.13)}
.opts{display:grid;gap:8px}
.opt{
  text-align:right;font-family:inherit;font-size:16px;padding:13px 14px;border-radius:13px;
  border:1.5px solid var(--rule);background:#fff;color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:center
}
.opt .k{font-family:"IBM Plex Mono";font-size:12px;color:var(--soft);border:1px solid var(--rule);border-radius:6px;padding:1px 6px;flex:none}
.opt.sel{border-color:var(--teal);background:rgba(20,101,92,.07)}
.opt:active{transform:scale(.99)}
.send{
  margin-top:10px;width:100%;border:none;border-radius:14px;padding:16px;
  font-family:"Reem Kufi";font-size:20px;color:#fff;background:var(--ink);cursor:pointer
}
.send:disabled{opacity:.35;cursor:not-allowed}
.send.go{background:var(--red)}

/* ===== الختم بعد الإرسال ===== */
.stamp{border:2px dashed var(--teal);border-radius:16px;padding:16px;text-align:center;margin-top:14px}
.stamp .t{font-family:"IBM Plex Mono";font-size:40px;font-weight:600;color:var(--teal);line-height:1}
.stamp .s{font-size:13px;color:var(--soft);margin-top:6px}
.stamp.late{border-color:var(--rule)} .stamp.late .t{color:var(--soft)}

.verdict{margin-top:14px;border-radius:16px;padding:14px 16px;border:1px solid var(--rule);background:#fff}
.verdict.ok{border-color:var(--teal);background:rgba(20,101,92,.07)}
.verdict.no{border-color:var(--red);background:rgba(226,59,46,.06)}
.verdict h4{margin:0 0 6px;font-family:"Reem Kufi";font-size:17px}
.verdict p{margin:0;font-size:14px;color:var(--soft)}
.verdict .pts{font-family:"IBM Plex Mono";font-size:24px;font-weight:600}

/* ===== حالات الانتظار ===== */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:24px 0}
.center h2{font-family:"Reem Kufi";font-size:26px;margin:0}
.center p{margin:0;color:var(--soft);font-size:15px;max-width:34ch;line-height:1.7}
.pulse{width:54px;height:54px;border-radius:50%;border:2px solid var(--rule);position:relative}
.pulse::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--teal);animation:p 1.8s ease-out infinite}
@keyframes p{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.5);opacity:0}}

/* ===== الترتيب ===== */
.board{margin-top:12px;background:var(--paper);border:1px solid var(--rule);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.board h3{margin:0;padding:12px 14px;font-family:"Reem Kufi";font-size:15px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center}
.board h3 span{font-size:11px;color:var(--soft);font-family:"IBM Plex Sans Arabic"}
.lrow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--chalk);transition:background .3s}
.lrow:last-child{border-bottom:none}
.lrow.me{background:rgba(228,161,27,.12)}
.lrow .r{font-family:"IBM Plex Mono";font-size:13px;color:var(--soft);width:22px}
.lrow .n{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .p{font-family:"IBM Plex Mono";font-weight:600;font-size:17px}
.lrow.top .r{color:var(--amber);font-weight:600}

.toast{
  position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));right:50%;transform:translate(50%,20px);
  background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;
  opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:88vw;text-align:center
}
.toast.on{opacity:1;transform:translate(50%,0)}
.err{padding:30px 20px;text-align:center}
.err h1{font-family:"Reem Kufi";font-size:24px}
.err code{background:#fff;border:1px solid var(--rule);padding:2px 6px;border-radius:6px;font-size:12px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="err"><h1>بنحمّل…</h1></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ========= إعداد فايربيز (نفس مشروع منظور الفؤاد) ========= */
const firebaseConfig = {
  apiKey: "AIzaSyDj0bV5gsyRbqpxzW0Zd9wjYmq53-Xdj3w",
  authDomain: "fouad-perspective.firebaseapp.com",
  projectId: "fouad-perspective",
  storageBucket: "fouad-perspective.firebasestorage.app",
  messagingSenderId: "1068763865336",
  appId: "1:1068763865336:web:b791abcd22d536aedd5b0d"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const FV = firebase.firestore.FieldValue;

/* ========= الحالة ========= */
const P = new URLSearchParams(location.search);
const SID = P.get('s'), TID = P.get('t');
let SESSION=null, TEAM=null, TEAMS=[], QS=[], ANS=[], OFFSET=0, READY=false;
let sending=false, lastQid=null, selected=null, rafId=null;

const $=(s,r=document)=>r.querySelector(s);
const app=$('#app');
const serverNow=()=>Date.now()+OFFSET;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('on'),2400)}

/* ========= مزامنة الساعة مع سيرفر فايربيز (عشان التوقيت يبقى عادل بين كل الفرق) ========= */
async function syncClock(){
  const ref = db.collection('race_clock').doc('p_'+Math.random().toString(36).slice(2));
  let best=Infinity;
  for(let i=0;i<3;i++){
    try{
      const t0=Date.now();
      await ref.set({t:FV.serverTimestamp()});
      const t1=Date.now();
      const snap=await ref.get();
      const st=snap.data()?.t?.toMillis(); if(!st) continue;
      const rtt=t1-t0;
      if(rtt<best){best=rtt;OFFSET=st-(t0+rtt/2);}
    }catch(e){}
  }
  ref.delete().catch(()=>{});
}

/* ========= الصوت (بيتفك بعد أول لمسة من الفريق) ========= */
let AC=null;
function beep(freq=880,dur=.14,vol=.25){
  if(!AC) return;
  try{
    const o=AC.createOscillator(), g=AC.createGain();
    o.frequency.value=freq; o.type='triangle'; o.connect(g); g.connect(AC.destination);
    g.gain.setValueAtTime(vol,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);
    o.start(); o.stop(AC.currentTime+dur);
  }catch(e){}
}

/* ========= التشغيل ========= */
if(!SID||!TID){
  app.innerHTML=`<div class="err"><h1>الرابط ناقص</h1>
    <p>لازم الرابط يبقى فيه رقم الجلسة والفريق، كده:<br><code>?s=SESSION&t=TEAM</code></p>
    <p>كلّم المنتور يبعتلك رابط فريقك.</p></div>`;
}else{ start(); }

async function start(){
  syncClock();
  db.doc(`race_sessions/${SID}`).onSnapshot(d=>{
    if(!d.exists){app.innerHTML='<div class="err"><h1>الجلسة مش موجودة</h1><p>يمكن المنتور مسحها أو الرابط قديم.</p></div>';return}
    SESSION={id:d.id,...d.data()}; render();
  },e=>toast('انقطع الاتصال — بنحاول تاني'));

  db.doc(`race_sessions/${SID}/teams/${TID}`).onSnapshot(d=>{
    if(!d.exists){app.innerHTML='<div class="err"><h1>الفريق ده مش موجود</h1><p>اطلب من المنتور رابط جديد.</p></div>';return}
    TEAM={id:d.id,...d.data()}; render();
  });

  db.collection(`race_sessions/${SID}/teams`).onSnapshot(s=>{
    TEAMS=s.docs.map(d=>({id:d.id,...d.data()})); render();
  });
  db.collection(`race_sessions/${SID}/questions`).onSnapshot(s=>{
    QS=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0)); render();
  });
  db.collection(`race_sessions/${SID}/answers`).onSnapshot(s=>{
    ANS=s.docs.map(d=>({id:d.id,...d.data()})); render();
  });

  // نبضة حضور كل ٤٠ ثانية
  setInterval(()=>{ if(READY&&TEAM) db.doc(`race_sessions/${SID}/teams/${TID}`).update({lastSeen:FV.serverTimestamp()}).catch(()=>{}) },40000);
}

/* ========= حسابات ========= */
const scoreOf=tid=>{
  const t=TEAMS.find(x=>x.id===tid);
  return ANS.filter(a=>a.tid===tid).reduce((s,a)=>s+(+a.points||0),0)+(+(t?.adj)||0);
};
const ranked=()=>TEAMS.map(t=>({...t,score:scoreOf(t.id)}))
  .sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name,'ar'));
const curQ=()=>QS.find(q=>q.id===SESSION?.current?.qid)||null;
const myAnswer=()=>{const q=curQ();return q?ANS.find(a=>a.id===`${q.id}__${TID}`):null};

/* ========= الرسم ========= */
function render(){
  if(!SESSION||!TEAM) return;
  const r=ranked(), me=r.findIndex(x=>x.id===TID)+1;
  const cur=SESSION.current||{}, q=curQ(), mine=myAnswer();

  if(q&&q.id!==lastQid&&cur.status==='open'){ lastQid=q.id; selected=null; beep(1046,.16); setTimeout(()=>beep(1318,.18),140); }
  if(!q) lastQid=null;

  app.innerHTML=`
    <div class="bar">
      <span class="dot ${READY?'on':''}"></span>
      <span class="nm">${esc(TEAM.name)}</span>
      <span class="chip">الترتيب <b>${me||'—'}</b></span>
      <span class="chip">الرصيد <b class="mono">${scoreOf(TID)}</b></span>
    </div>
    <div class="stage" id="stage">${stageHTML(cur,q,mine)}</div>
    ${boardHTML(r)}`;

  wire(cur,q,mine);
  tick();
}

function stageHTML(cur,q,mine){
  if(!READY) return `<div class="center">
      <div class="pulse"></div>
      <h2>جاهز؟</h2>
      <p>اضغط الزرار عشان تتأكد إن شاشتكم متصلة، وتسمعوا صوت لما السؤال يفتح.</p>
      <button class="send" id="ready" style="max-width:280px">إحنا جاهزين</button>
    </div>`;

  if(!q||cur.status==='idle'||!cur.status) return `<div class="center">
      <div class="pulse"></div>
      <h2>استعدوا</h2>
      <p>المنتور لسه مفتحش السؤال. أول ما يفتح هيظهر هنا على طول — سيبوا الشاشة مفتوحة.</p>
    </div>`;

  const idx=QS.findIndex(x=>x.id===q.id)+1;
  const head=`<div style="display:flex;justify-content:space-between;align-items:center">
      <span class="eyebrow">سؤال ${idx} من ${QS.length}</span>
      <span class="qnum">${q.points}+${q.speedBonus} نقطة · ${q.duration}ث</span>
    </div>
    <div class="qtext">${esc(q.text)}</div>`;

  /* ------ السؤال مفتوح وإحنا لسه مبعتناش ------ */
  if(cur.status==='open'&&!mine){
    const inputHTML = q.type==='choice'
      ? `<div class="opts">${(q.options||[]).map((o,i)=>
          `<button class="opt" data-o="${esc(o)}"><span class="k">${'أبجد'[i]||i+1}</span><span>${esc(o)}</span></button>`).join('')}</div>`
      : `<textarea id="txt" rows="2" placeholder="اكتبوا الإجابة بسرعة…" autocomplete="off"></textarea>`;
    return head+chronoHTML(q)+`<div class="answer">${inputHTML}
      <button class="send go" id="send">أرسل الإجابة</button></div>`;
  }

  /* ------ بعتنا وبنستنى ------ */
  if(mine&&cur.status!=='revealed'){
    const order=ANS.filter(a=>a.qid===q.id).sort((a,b)=>a.elapsedMs-b.elapsedMs).findIndex(a=>a.tid===TID)+1;
    return head+chronoHTML(q)+`
      <div class="stamp">
        <div class="t">${(mine.elapsedMs/1000).toFixed(2)}<span style="font-size:16px">s</span></div>
        <div class="s">اتسجّلت إجابتكم · وصلتوا رقم ${order} من ${ANS.filter(a=>a.qid===q.id).length}</div>
      </div>
      <div class="center" style="padding:14px 0 0">
        <p style="font-size:13px">${esc(mine.text)}</p>
      </div>`;
  }

  /* ------ اتقفل من غير ما نبعت ------ */
  if(cur.status!=='revealed'&&!mine) return head+`
    <div class="stamp late"><div class="t">—</div><div class="s">الوقت خلص من غير إجابة</div></div>`;

  /* ------ الإعلان ------ */
  const ok=mine?.correct===true, pts=+mine?.points||0;
  return head+`
    <div class="verdict ${mine? (ok?'ok':'no') : ''}">
      <h4>${mine? (ok?'إجابة صح':'إجابة مش مظبوطة') : 'ملحقتوش تبعتوا'}</h4>
      ${mine?`<p>وقتكم <span class="mono">${(mine.elapsedMs/1000).toFixed(2)}s</span> · كسبتوا <span class="pts">${pts}</span> نقطة</p>`:''}
    </div>
    ${(q.accept&&q.accept.length)?`<div class="verdict" style="margin-top:8px"><h4>الإجابة الصحيحة</h4><p>${esc(q.accept.join(' — '))}</p></div>`:''}`;
}

function chronoHTML(q){
  return `<div class="chrono">
    <div class="row">
      <div class="clock" id="clk">--.--</div>
      <div class="worth"><span class="lab">قيمة السؤال دلوقتي</span><span class="val" id="worth">--</span></div>
    </div>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="ticks"><span>الوقت بينزّل النقط</span><span class="mono">${q.duration}s</span></div>
  </div>`;
}

function boardHTML(r){
  return `<div class="board">
    <h3>لوحة النتائج <span>لحظة بلحظة</span></h3>
    ${r.map((t,i)=>`<div class="lrow ${t.id===TID?'me':''} ${i<3?'top':''}">
      <span class="r">${i+1}</span><span class="n">${esc(t.name)}</span><span class="p">${t.score}</span>
    </div>`).join('')||'<div class="lrow"><span class="n">لسه مفيش فرق</span></div>'}
  </div>`;
}

/* ========= الربط ========= */
function wire(cur,q,mine){
  const rb=$('#ready');
  if(rb) rb.onclick=async()=>{
    try{AC=new (window.AudioContext||window.webkitAudioContext)();await AC.resume();beep(660,.1)}catch(e){}
    READY=true;
    db.doc(`race_sessions/${SID}/teams/${TID}`).update({ready:true,lastSeen:FV.serverTimestamp()}).catch(()=>{});
    render();
  };

  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel'); selected=b.dataset.o;
  });

  const s=$('#send');
  if(s) s.onclick=()=>{
    const q2=curQ(); if(!q2) return;
    const v = q2.type==='choice' ? selected : ($('#txt')?.value||'').trim();
    if(!v) return toast(q2.type==='choice'?'اختاروا إجابة الأول':'اكتبوا إجابة الأول');
    submit(v);
  };
  const t=$('#txt');
  if(t){ t.focus({preventScroll:true}); t.onkeydown=e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();s?.click()} }; }
}

async function submit(text){
  if(sending) return; const q=curQ(), cur=SESSION.current||{};
  if(!q||cur.status!=='open') return toast('السؤال اتقفل');
  const openedAt=cur.openedAt?.toMillis?.();
  if(!openedAt) return toast('استنوا ثانية…');
  const elapsed=Math.max(0,serverNow()-openedAt);
  if(elapsed>cur.duration*1000+500) return toast('للأسف الوقت خلص');
  sending=true; const btn=$('#send'); if(btn){btn.disabled=true;btn.textContent='بنسجّل…'}
  try{
    await db.doc(`race_sessions/${SID}/answers/${q.id}__${TID}`).set({
      qid:q.id,tid:TID,teamName:TEAM.name,text,elapsedMs:elapsed,
      at:FV.serverTimestamp(),graded:false,correct:null,points:0,override:null
    });
    beep(880,.12);
  }catch(e){ toast('مانفعش نبعت — جرّبوا تاني'); if(btn){btn.disabled=false;btn.textContent='أرسل الإجابة'} }
  sending=false;
}

/* ========= عدّاد الكرونوغراف ========= */
function tick(){
  cancelAnimationFrame(rafId);
  const loop=()=>{
    const cur=SESSION?.current||{}, q=curQ();
    const clk=$('#clk'), fill=$('#fill'), worth=$('#worth');
    if(!q||!clk||!fill){ rafId=requestAnimationFrame(loop); return }
    const openedAt=cur.openedAt?.toMillis?.()||serverNow();
    const total=(cur.duration||q.duration)*1000;
    const el=Math.min(total,Math.max(0,serverNow()-openedAt));
    const left=Math.max(0,total-el), f=left/total;
    clk.textContent=(left/1000).toFixed(2);
    fill.style.width=(f*100).toFixed(2)+'%';
    fill.className='fill '+(f<.2?'hot':f<.5?'warn':'');
    if(worth) worth.textContent=Math.round(q.points+q.speedBonus*f);
    if(cur.status==='open'&&left<=0){ const b=$('#send'); if(b&&!b.disabled){b.disabled=true;b.textContent='خلص الوقت'} }
    rafId=requestAnimationFrame(loop);
  };
  rafId=requestAnimationFrame(loop);
}
</script>
