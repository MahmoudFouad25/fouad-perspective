<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f2ea">
<title>الميزان · سكريبت الميسّر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/base.css?v=5">
<style>
  body{font-size:16px}
  .top{position:sticky;top:0;z-index:20;background:rgba(247,242,234,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 8px) 14px 8px}
  .row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ses{font-size:.8rem;color:var(--ink-3)}
  .lab{font-weight:700;font-size:1.08rem;flex:1;min-width:0}
  .pill{font-size:.75rem;border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 9px;color:var(--ink-2);white-space:nowrap}
  .pill.live{color:var(--ok);border-color:#b9dcc6} .pill.off{color:var(--danger);border-color:#f0c2b8} .pill.brw{color:#8a6420;border-color:#ecd5a6}
  .tabs{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
  .tabs button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:.82rem}
  .tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tabs .sz{margin-inline-start:auto;display:flex;gap:4px}
  .wrap{max-width:820px;margin:0 auto;padding:14px 16px 150px}
  .cue{background:#fdf6e6;border:1px solid #f0dfb8;border-radius:12px;padding:8px 12px;font-size:.88rem;color:#5d4416;margin-bottom:10px}
  .stepbar{display:flex;gap:6px;align-items:center;font-size:.8rem;color:var(--ink-3);margin-bottom:8px;flex-wrap:wrap}
  .stepbar i{display:inline-block;width:18px;height:6px;border-radius:9px;background:var(--line)}
  .stepbar i.on{background:var(--gold)}
  .next{margin-top:26px;border-top:1px dashed var(--line);padding-top:12px;color:var(--ink-3);font-size:.9rem}
  .next b{color:var(--ink-2)}
  .ctl{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(247,242,234,.97);border-top:1px solid var(--line);
    padding:10px 12px calc(env(safe-area-inset-bottom) + 10px)}
  .ctl .in{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:center}
  .ctl button{border:none;border-radius:14px;padding:14px 10px;font-size:1.02rem;font-weight:600}
  .ctl .nx{flex:2;background:var(--ink);color:#fff}
  .ctl .pv{flex:1;background:#e9e0d3;color:var(--ink)}
  .ctl .bk{flex:none;background:#fff;border:1px solid var(--line);color:var(--ink-2);font-size:.8rem;padding:14px 10px}
  .ctl .bk.on{background:#000;color:#fff}
  .ctl .ghost{flex:1;background:#fff;border:1px solid var(--line);color:var(--ink-2);font-weight:500;font-size:.9rem}
  .ctl .meta{font-size:.72rem;color:var(--ink-3);text-align:center;margin-top:4px}
  .browse{display:flex;gap:6px;align-items:center;justify-content:center;margin:8px 0 0}
  .browse button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px 12px;font-size:.8rem}
  .help{display:none;background:var(--danger);color:#fff;border-radius:12px;padding:8px 12px;margin-top:8px;font-size:.9rem}
  .help.on{display:block;animation:pulse 1.6s infinite}
  .help button{background:#fff;color:var(--danger);border:none;border-radius:8px;padding:3px 10px;margin-inline-start:6px;font-weight:600}
  .sheet{position:fixed;inset:0;z-index:50;background:rgba(30,22,15,.45);display:none;align-items:center;justify-content:center;padding:16px}
  .sheet.on{display:flex}
  .sheet .in{background:var(--paper);border-radius:18px;padding:20px;max-width:400px;width:100%}
  .sheet input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;margin:5px 0 10px}
  .sheet button{border:none;border-radius:12px;padding:11px;width:100%;margin-top:6px;background:var(--ink);color:#fff;font-weight:600}
  .sheet .g{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .err{color:var(--danger);font-size:.85rem;min-height:1.2em}
  .timer{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="top">
  <div class="row1"><span class="ses" id="ses">الميزان</span><span class="pill" id="no">–</span><span class="pill" id="conn">…</span><span class="pill timer" id="clk"></span></div>
  <div class="row1" style="margin-top:2px"><span class="lab" id="lab">سكريبت الميسّر</span></div>
  <div class="help" id="help"></div>
  <div class="tabs" id="tabs">
    <button data-t="now" class="on">دلوقتي</button><button data-t="ifs">لو حصل</button><button data-t="tot">ملاحظات المدرب</button><button data-t="head">قبل الجلسة</button><button data-t="extra" id="tExtra" hidden>ورا الكواليس</button>
    <span class="sz"><button data-sz="-1">ا−</button><button data-sz="1">ا+</button></span>
  </div>
</div>
<div class="wrap"><div class="sc" id="body"><p class="sc-empty">بنحمّل…</p></div></div>
<div class="ctl"><div class="in" id="ctl"></div><div class="browse" id="brw"></div><div class="meta" id="cmeta"></div></div>

<div class="sheet" id="sheet"><div class="in">
  <b>دخول للتحكم في الشرايح</b>
  <p class="sc-empty" style="font-size:.85rem">بنفس إيميل الأدمن. بعدها تقدر تقلّب الشرايح من هنا، من غير ما تقوم للابتوب.</p>
  <input id="em" type="email" autocomplete="username" placeholder="الإيميل"><input id="pw" type="password" autocomplete="current-password" placeholder="كلمة السر">
  <button id="go">دخول</button><button class="g" id="cx">رجوع</button><div class="err" id="er"></div>
</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../assets/config.js?v=5"></script>
<script src="../assets/core.js?v=5"></script>
<script src="../assets/content.js?v=5"></script>
<script src="../assets/mizani.js?v=5"></script>
<script src="../assets/script.js?v=5"></script>
<script src="../assets/script-marks.js?v=5"></script>
<script src="../assets/script-render.js?v=5"></script>
<script src="script.js?v=5"></script>
</body>
</html>
