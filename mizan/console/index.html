<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الميزان · لوحة التحكم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/base.css?v=2">
<style>
  body{font-size:15px;background:#efe8dd}
  .wrap{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
  aside{background:#fbf7f1;border-left:1px solid var(--line);height:100vh;overflow:auto;position:sticky;top:0}
  aside h4{margin:14px 14px 4px;font-size:.78rem;color:var(--ink-3);font-weight:500}
  .tl button{display:flex;gap:8px;width:100%;text-align:right;border:none;background:none;padding:6px 14px;font-size:.86rem;color:var(--ink-2);line-height:1.5}
  .tl button:hover{background:#f1e9dd}
  .tl button.cur{background:var(--ink);color:#fff}
  .tl button .n{flex:none;width:26px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .tl button.cur .n{color:#d9cdb9}
  .tl button.done{color:var(--ink-3)}
  main{padding:16px 20px 60px;min-width:0}
  .hdr{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .hdr .t{font-weight:600;font-size:1.05rem}
  .pill{border-radius:999px;padding:4px 11px;font-size:.8rem;background:#fff;border:1px solid var(--line)}
  .pill.ok{color:var(--ok);border-color:#b9dcc6} .pill.bad{color:var(--danger);border-color:#f0c2b8} .pill.warn{color:#8a6420;border-color:#ecd5a6}
  .grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}
  .cur-label{font-size:1.25rem;font-weight:600}
  .cue{background:#fdf6e6;border:1px solid #f0dfb8;border-radius:12px;padding:10px 12px;margin:10px 0;line-height:1.7;color:#5d4416}
  .nav{display:flex;gap:10px;margin:10px 0}
  .nav button{flex:1;border:none;border-radius:14px;padding:16px;font-size:1.1rem;font-weight:600}
  .nav .next{background:var(--ink);color:#fff;flex:2}
  .nav .prev{background:#ece4d8;color:var(--ink)}
  .tools{display:flex;gap:8px;flex-wrap:wrap}
  .tools button,.b{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-size:.84rem}
  .b.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
  .b.red{color:var(--danger);border-color:#f0c2b8}
  .tools button.on{background:#000;color:#fff}
  .pv{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#000}
  .pv iframe{position:absolute;top:0;right:0;width:1600px;height:900px;border:0;transform-origin:top right}
  .meta{font-size:.82rem;color:var(--ink-3);margin-top:6px}
  .next-peek{font-size:.85rem;color:var(--ink-2);margin-top:8px}
  .tabs{display:flex;gap:6px;margin:16px 0 10px;flex-wrap:wrap}
  .tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:.88rem}
  .tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tab{display:none} .tab.on{display:block}
  table{width:100%;border-collapse:collapse;font-size:.86rem}
  td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}
  th{color:var(--ink-3);font-weight:500}
  select,input.s{border:1px solid var(--line);border-radius:8px;padding:5px 7px;background:#fff}
  .help-alert{display:none;background:var(--danger);color:#fff;border-radius:14px;padding:12px 16px;margin-bottom:12px}
  .help-alert.on{display:block;animation:pulse 1.6s infinite}
  .help-alert .r{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0}
  .help-alert button{background:#fff;color:var(--danger);border:none;border-radius:8px;padding:5px 12px;font-weight:600}
  .login{max-width:420px;margin:10vh auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px}
  .login input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;margin:6px 0 12px}
  .err{color:var(--danger);font-size:.88rem;min-height:1.4em}
  .bars div{display:grid;grid-template-columns:150px 1fr 40px;gap:8px;align-items:center;margin:4px 0;font-size:.84rem}
  .bars i{display:block;height:10px;border-radius:9px;background:var(--gold)}
  .sec{margin:12px 0}
  .ctr{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .circ-card{display:inline-block;vertical-align:top;background:#fbf7f1;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:4px;min-width:150px;font-size:.84rem}
  .circ-card b{color:var(--gold);font-size:1.1rem}
  #scbody{max-height:62vh;overflow:auto;padding-inline-end:6px}
  @media (max-width:1000px){.wrap{grid-template-columns:1fr}aside{position:static;height:auto;max-height:40vh}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"><div class="login">لحظة…</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../assets/config.js?v=2"></script>
<script src="../assets/core.js?v=2"></script>
<script src="../assets/content.js?v=2"></script>
<script src="../assets/mizani.js?v=2"></script>
<script src="../assets/script.js?v=2"></script>
<script src="../assets/script-render.js?v=2"></script>
<script src="console.js?v=2"></script>
</body>
</html>
