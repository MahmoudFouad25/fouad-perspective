<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الميزان · جلساتي والفريق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/base.css?v=6">
<style>
  body{font-size:15.5px;background:#efe8dd}
  .w{max-width:980px;margin:0 auto;padding:18px 16px 80px}
  .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
  .top h1{font-size:1.35rem;margin:0;flex:1;min-width:200px}
  .pill{border-radius:999px;padding:4px 11px;font-size:.8rem;background:#fff;border:1px solid var(--line);white-space:nowrap}
  .pill.gold{background:#fbf2df;border-color:#ecd5a6;color:#7a5a1e}
  .pill.blue{background:#eef4fb;border-color:#c9dbef;color:#24476e}
  .pill.off{background:#f7e3df;border-color:#f0c2b8;color:var(--danger)}
  .b{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-size:.86rem;color:var(--ink);text-decoration:none;display:inline-block;line-height:1.5}
  .b:hover{background:#faf6ef}
  .b.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
  .b.red{color:var(--danger);border-color:#f0c2b8}
  .b.green{background:#25a366;color:#fff;border-color:#25a366}
  .b.sm{padding:4px 9px;font-size:.8rem}
  .panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
  h2{font-size:1.08rem;margin:0 0 4px}
  .meta{font-size:.84rem;color:var(--ink-3);line-height:1.7}
  .ctr{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .sp{flex:1}
  label{display:block;font-size:.86rem;color:var(--ink-2);margin:8px 0 2px}
  input,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}
  input[type=email],input[dir=ltr]{direction:ltr;text-align:right}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  .err{color:var(--danger);font-size:.88rem;min-height:1.3em;margin-top:6px}
  .okm{color:var(--ok);font-size:.88rem;margin-top:6px}
  .login{max-width:420px;margin:9vh auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 4px}
  .tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 15px;font-size:.9rem}
  .tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .card{border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;background:var(--card)}
  .card.arch{opacity:.6}
  .card h3{margin:0;font-size:1.05rem}
  .links{display:grid;grid-template-columns:1fr;gap:6px;margin:12px 0 8px}
  .lk{display:flex;gap:8px;align-items:center;background:#faf6ef;border:1px solid #efe5d5;border-radius:10px;padding:7px 10px}
  .lk .n{flex:none;width:150px;font-weight:600;font-size:.88rem}
  .lk .u{flex:1;min-width:0;direction:ltr;text-align:left;font-size:.76rem;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lk .h{display:block;font-size:.74rem;color:var(--ink-3);font-weight:400}
  .chip{display:inline-flex;gap:6px;align-items:center;background:#eef4fb;border:1px solid #c9dbef;border-radius:999px;padding:2px 4px 2px 10px;font-size:.82rem;margin:2px}
  .chip button{border:none;background:#fff;border-radius:50%;width:20px;height:20px;line-height:18px;padding:0;color:var(--danger)}
  .box{background:#fbf7f1;border:1px dashed var(--line);border-radius:12px;padding:12px;margin-top:10px}
  .msg{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:.86rem;line-height:1.8;margin:8px 0}
  table{width:100%;border-collapse:collapse;font-size:.86rem}
  td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
  th{color:var(--ink-3);font-weight:500}
  td .e{direction:ltr;display:inline-block;color:var(--ink-2);font-size:.8rem}
  .empty{color:var(--ink-3);text-align:center;padding:18px;font-size:.92rem}
  .hide{display:none!important}
  @media (max-width:640px){.grid2{grid-template-columns:1fr}.lk{flex-wrap:wrap}.lk .n{width:100%}.lk .u{display:none}
    table thead{display:none} table tr{display:block;border-bottom:1px solid var(--line);padding:6px 0} table td{display:block;border:none;padding:3px 0}}
</style>
</head>
<body>
<div class="w" id="root"><div class="login"><p>بنحمّل…</p></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../assets/config.js?v=6"></script>
<script src="../assets/core.js?v=6"></script>
<script src="../assets/content.js?v=6"></script>
<script src="team.js?v=6"></script>
</body>
</html>
