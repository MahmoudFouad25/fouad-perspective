<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>مقياس مسارات الطاقة</title>
<!--
  بوابة المقياس (three-axes/course-view.html)
  «كورساتي» وصفحة ريجنايت بيفتحوا الملف ده بالاسم، فبقى بوابة بتوزّع:
   • مشترك في three-axes أو insight-out، ومعاه نتيجة من المقياس القديم ← يختار: تقريره القديم (v1.html) أو المقياس الجديد.
   • مشترك ومن غير نتيجة قديمة ← المقياس الجديد على طول (v2/app/).
   • مش مشترك فيهم بس مشترك في reignite ← المقياس القديم زي ما هو النهارده (v1.html).
   • غير كده ← المقياس الجديد، وهو اللي بيقوله إنه مش مفتوح في حسابه.
  المقياس القديم كله فضل زي ما هو في v1.html، ونتايجه في maqyas_axes_results ما اتلمستش.
-->
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="v2/app/style.css?v=2026-10-12a">
</head>
<body>
<div class="top"><a class="brand" href="../my-courses.html">مقياس مسارات الطاقة</a><span class="sync"></span></div>
<main id="main" class="wrap"><p class="loading">لحظة…</p></main>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="../js/firebase-config.js"></script>
<script>
(function () {
  "use strict";
  var NEW = "v2/app/", OLD = "v1.html", LOGIN = "../login.html";
  var COURSES = ["three-axes", "insight-out"], LEGACY = ["reignite"];
  function uid() {
    try {
      var u = localStorage.getItem("userId");
      if (u) return u;
      var enc = localStorage.getItem("_enc_userId");
      return enc ? JSON.parse(decodeURIComponent(atob(enc.split("").reverse().join("")))) : null;
    } catch (e) { return null; }
  }
  function go(u) { location.replace(u); }
  var id = uid();
  if (!id) return go(LOGIN);
  var db;
  try { db = firebase.firestore(); } catch (e) { return go(NEW); }
  var timer = setTimeout(function () { go(NEW); }, 12000);   // لو فايربيز اتأخر، الجديد بيتعامل لوحده
  Promise.all([
    db.collection("users").doc(id).get(),
    db.collection("maqyas_axes_results").doc(id).get().catch(function () { return null; })
  ]).then(function (r) {
    clearTimeout(timer);
    var u = r[0].exists ? r[0].data() : {}, list = u.enrollments || u.courses || [];
    var ids = list.map(function (e) { return e && (e.courseId || (e.courseInfo && e.courseInfo.id) || e.id); });
    var enrolled = COURSES.some(function (c) { return ids.indexOf(c) !== -1; });
    var legacy = LEGACY.some(function (c) { return ids.indexOf(c) !== -1; });
    var hasOld = !!(r[1] && r[1].exists);
    if (!enrolled) return go(legacy ? OLD : NEW);
    if (!hasOld) return go(NEW);
    var startedNew = false;
    try { startedNew = !!localStorage.getItem("axv2:s:" + id); } catch (e) {}
    document.getElementById("main").innerHTML =
      '<section class="card rise"><h2>عندك نتيجة من النسخة القديمة</h2>' +
      '<p>إنت عملت المقياس ده قبل كده، وتقريرك القديم محفوظ زي ما هو. ودلوقتي فيه نسخة جديدة من المقياس، أعمق وبتطلّع خريطة أوضح.</p>' +
      '<p class="soft">تقدر ترجع لتقريرك القديم في أي وقت من هنا، ومش لازم تعمل الجديد.</p>' +
      '<div class="row"><a class="next" href="' + OLD + '">افتح تقريرك القديم</a>' +
      '<a class="next ghost" href="' + NEW + '">' + (startedNew ? "كمّل المقياس الجديد" : "اعمل المقياس الجديد") + "</a></div></section>";
  }).catch(function () { clearTimeout(timer); go(NEW); });
})();
</script>
</body>
</html>
