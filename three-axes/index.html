<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مقياس المحاور</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --ax-bg:#0f172a; --ax-bg2:#1a2332; --ax-blue:#3b82f6; --ax-green:#10b981;
      --ax-gold:#fbbf24; --ax-purple:#a78bfa; --ax-text:#e2e8f0; --ax-muted:#94a3b8;
      --ax-line:#2a3850; --ax-card:#16202e; --ax-serif:'Amiri',serif;
    }
    *{box-sizing:border-box} html,body{margin:0;padding:0}
    body{
      background:radial-gradient(1200px 620px at 50% -12%, #1a2332 0%, #0f172a 62%);
      color:var(--ax-text); font-family:'Tajawal',sans-serif; min-height:100vh;
      -webkit-font-smoothing:antialiased; line-height:1.9;
      display:flex; align-items:center; justify-content:center; padding:42px 18px;
    }
    .mq-shell{ width:100%; max-width:520px; }
    .mq-card{
      background:linear-gradient(180deg, rgba(22,32,46,.92), rgba(15,23,42,.72));
      border:1px solid var(--ax-line); border-radius:18px; padding:38px 30px;
      box-shadow:0 22px 54px rgba(0,0,0,.38); animation:mqFade .5s ease;
    }
    @keyframes mqFade{ from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }
    .mq-tag{ color:var(--ax-gold); font-size:14px; letter-spacing:.5px; margin-bottom:16px;
      font-family:var(--ax-serif); text-align:center; }
    .mq-title{ font-size:26px; font-weight:700; line-height:1.6; margin:0 0 14px;
      font-family:var(--ax-serif); text-align:center; }
    .mq-lead{ color:#cbd5e1; font-size:16px; line-height:1.95; margin:0 0 26px; text-align:center; }
    .mq-field{ margin-bottom:18px; }
    .mq-label{ display:block; color:var(--ax-gold); font-size:14px; margin-bottom:8px; }
    .mq-input{ width:100%; padding:14px 15px; border-radius:11px; border:1px solid var(--ax-line);
      background:#101a28; color:var(--ax-text); font-family:inherit; font-size:16px; }
    .mq-input:focus{ outline:none; border-color:var(--ax-blue); }
    .mq-hint{ color:var(--ax-muted); font-size:13px; margin-top:6px; }
    .mq-btn{ border:none; cursor:pointer; font-family:inherit; font-size:16px; font-weight:700;
      padding:14px 30px; border-radius:12px; width:100%; transition:transform .15s, box-shadow .15s; }
    .mq-btn.primary{ background:var(--ax-blue); color:#fff; box-shadow:0 8px 22px rgba(59,130,246,.30); }
    .mq-btn.primary:hover{ transform:translateY(-2px); }
    .mq-btn.ghost{ background:transparent; color:var(--ax-text); border:1px solid var(--ax-line); margin-top:12px; }
    .mq-btn.ghost:hover{ border-color:var(--ax-blue); }
    .mq-err{ color:#fca5a5; font-size:14px; margin:0 0 14px; min-height:18px; text-align:center; }
    .mq-resume{ background:rgba(16,185,129,.07); border:1px solid rgba(16,185,129,.26);
      border-radius:14px; padding:18px 20px; margin-bottom:22px; text-align:center; }
    .mq-resume-name{ font-family:var(--ax-serif); font-size:18px; color:var(--ax-green); margin-bottom:6px; }
    .mq-resume-note{ color:var(--ax-muted); font-size:14px; }
    @media(max-width:520px){ .mq-card{ padding:30px 20px; } .mq-title{ font-size:23px; } }
  </style>
</head>
<body>
  <div class="mq-shell">
    <div class="mq-card" id="mqRoot"></div>
  </div>

  <script>
  (function(){
    "use strict";
    var root = document.getElementById('mqRoot');

    function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function slug(s){
      s = String(s||'').trim().toLowerCase()
            .replace(/[^a-z0-9\u0600-\u06FF]+/g,'-')
            .replace(/^-+|-+$/g,'');
      return s.slice(0,24) || 'user';
    }
    function rand(){ return Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2,6); }

    // ── زائر عائد: عنده هويّة محفوظة ──
    function renderResume(uid, name){
      root.innerHTML =
          '<div class="mq-tag">مقياس المحاور</div>'
        + '<div class="mq-resume">'
        +   '<div class="mq-resume-name">أهلًا ' + esc(name || 'بك') + '</div>'
        +   '<div class="mq-resume-note">معك جلسة سابقة على هذا الجهاز.</div>'
        + '</div>'
        + '<button class="mq-btn primary" id="mqGo">تابِع مقياسك</button>'
        + '<button class="mq-btn ghost" id="mqFresh">ابدأ من جديد بهويّة أخرى</button>';

      document.getElementById('mqGo').addEventListener('click', function(){
        window.location.href = 'scale.html';
      });
      document.getElementById('mqFresh').addEventListener('click', function(){
        try{
          localStorage.removeItem('maqyas_userId');
          localStorage.removeItem('maqyas_userName');
          localStorage.removeItem('maqyas_userEmail');
        }catch(e){}
        renderForm();
      });
    }

    // ── زائر جديد: نموذج الدخول ──
    function renderForm(){
      root.innerHTML =
          '<div class="mq-tag">مقياس المحاور — اتجاه طاقتك</div>'
        + '<div class="mq-title">قبل أن نبدأ</div>'
        + '<div class="mq-lead">اكتب اسمك لنحفظ خريطتك ونكمل معك. لا توجد إجابة صحيحة — أصدق إجاباتك أنفعها لك.</div>'
        + '<div class="mq-err" id="mqErr"></div>'
        + '<div class="mq-field">'
        +   '<label class="mq-label" for="mqName">الاسم</label>'
        +   '<input class="mq-input" id="mqName" type="text" autocomplete="name" placeholder="اسمك كما تحبّ" />'
        + '</div>'
        + '<div class="mq-field">'
        +   '<label class="mq-label" for="mqEmail">البريد الإلكترونيّ (اختياريّ)</label>'
        +   '<input class="mq-input" id="mqEmail" type="email" autocomplete="email" placeholder="للتواصل لاحقًا — يمكن تركه فارغًا" />'
        +   '<div class="mq-hint">لن نرسل لك شيئًا الآن. هذا فقط ليعرفك مرشدك حين تحبّ المتابعة.</div>'
        + '</div>'
        + '<button class="mq-btn primary" id="mqStart">ابدأ المقياس</button>';

      var nameEl = document.getElementById('mqName');
      var emailEl = document.getElementById('mqEmail');
      var errEl = document.getElementById('mqErr');

      function start(){
        var name = (nameEl.value||'').trim();
        var email = (emailEl.value||'').trim();
        if(!name){ errEl.textContent = 'اكتب اسمك أولًا من فضلك.'; nameEl.focus(); return; }
        var uid = 'maqyas-' + slug(name) + '-' + rand();
        try{
          localStorage.setItem('maqyas_userId', uid);
          localStorage.setItem('maqyas_userName', name);
          if(email) localStorage.setItem('maqyas_userEmail', email);
        }catch(e){
          errEl.textContent = 'تعذّر الحفظ على هذا المتصفّح. جرّب متصفّحًا آخر أو أوقف وضع التصفّح الخفيّ.';
          return;
        }
        window.location.href = 'scale.html';
      }

      document.getElementById('mqStart').addEventListener('click', start);
      nameEl.addEventListener('keydown', function(e){ if(e.key === 'Enter') start(); });
      emailEl.addEventListener('keydown', function(e){ if(e.key === 'Enter') start(); });
      nameEl.focus();
    }

    var existing = null, existingName = null;
    try{
      existing = localStorage.getItem('maqyas_userId');
      existingName = localStorage.getItem('maqyas_userName');
    }catch(e){}

    if(existing) renderResume(existing, existingName);
    else renderForm();
  })();
  </script>
</body>
</html>
